<script>
  (() => {
    const library = document.querySelector('[data-podcast-library]');
    if (!library) return;

    const items = [...library.querySelectorAll('[data-podcast-item]')];
    const search = library.querySelector('[data-podcast-search]');
    const show = library.querySelector('[data-podcast-show-filter]');
    const topic = library.querySelector('[data-podcast-topic-filter]');
    const status = library.querySelector('[data-podcast-result-status]');
    const empty = library.querySelector('[data-podcast-empty]');

    const update = () => {
      const query = search.value.trim().toLowerCase();
      let visible = 0;

      items.forEach((item) => {
        const matches = (!query || item.dataset.title.includes(query))
          && (!show.value || item.dataset.show === show.value)
          && (!topic.value || item.dataset.topics.split(' ').includes(topic.value));
        item.hidden = !matches;
        if (matches) visible += 1;
      });

      status.textContent = `${visible} ${visible === 1 ? 'episode' : 'episodes'}`;
      empty.hidden = visible !== 0;
    };

    [search, show, topic].forEach((control) => control.addEventListener('input', update));
    library.querySelector('[data-podcast-clear]').addEventListener('click', () => {
      search.value = '';
      show.value = '';
      topic.value = '';
      update();
      search.focus();
    });
  })();
</script>
