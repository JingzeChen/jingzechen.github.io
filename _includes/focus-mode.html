<script>
  (() => {
    const button = document.getElementById('focus-mode-toggle');

    if (!button) {
      return;
    }

    const storageKey = 'focus-mode';
    const icon = button.querySelector('i');
    const label = button.querySelector('.focus-mode-label');

    const applyFocusMode = (enabled) => {
      document.body.classList.toggle('focus-mode', enabled);
      document.body.classList.toggle(
        'focus-mode-with-toc',
        enabled && document.getElementById('toc-wrapper') !== null
      );
      button.setAttribute('aria-pressed', enabled.toString());
      button.setAttribute('aria-label', enabled ? 'Exit focus mode' : 'Enter focus mode');
      icon.classList.toggle('fa-book-open', !enabled);
      icon.classList.toggle('fa-compress', enabled);
      label.textContent = enabled ? 'Exit focus' : 'Focus';

      try {
        localStorage.setItem(storageKey, enabled.toString());
      } catch {}
    };

    let focusModeEnabled = false;

    try {
      focusModeEnabled = localStorage.getItem(storageKey) === 'true';
    } catch {}

    applyFocusMode(focusModeEnabled);

    button.addEventListener('click', () => {
      applyFocusMode(!document.body.classList.contains('focus-mode'));
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.body.classList.contains('focus-mode')) {
        applyFocusMode(false);
        button.focus();
      }
    });
  })();
</script>
