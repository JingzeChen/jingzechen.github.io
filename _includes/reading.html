<script>
  (() => {
    const root = document.querySelector('[data-reading-library]');
    if (!root) return;

    const pageSize = 24;
    const topicLabels = {{ site.data.topics | jsonify }};
    const validViews = new Set(['series', 'topic', 'all']);
    const buttons = [...root.querySelectorAll('[data-reading-view]')];
    const panels = [...root.querySelectorAll('[data-reading-panel]')];
    const topicSelect = root.querySelector('[data-reading-filter="topic"]');
    const seriesSelect = root.querySelector('[data-reading-filter="series"]');
    const languageSelect = root.querySelector('[data-reading-filter="language"]');
    const statusSelect = root.querySelector('[data-reading-filter="status"]');
    const sortSelect = root.querySelector('[data-reading-filter="sort"]');
    const seriesSortSelect = root.querySelector('[data-reading-series-sort]');
    const seriesGrid = root.querySelector('.reading-series-grid');
    const filterPanel = root.querySelector('[data-reading-filter-panel]');
    const filterDesktop = root.querySelector('[data-reading-filter-desktop]');
    const filterDialog = root.querySelector('[data-reading-filter-dialog-body]')?.closest('dialog');
    const filterDialogBody = root.querySelector('[data-reading-filter-dialog-body]');
    const filterOpen = root.querySelector('[data-reading-filter-open]');
    const filterCountLabels = [...root.querySelectorAll('[data-reading-filter-count]')];
    const mobileFilters = window.matchMedia('(max-width: 767.98px)');
    const list = root.querySelector('[data-reading-notes]');
    const status = root.querySelector('[data-reading-status]');
    const empty = root.querySelector('[data-reading-empty]');
    const more = root.querySelector('[data-reading-more]');
    const clearButtons = [...root.querySelectorAll('[data-reading-clear]')];
    const params = new URLSearchParams(window.location.search);
    const state = {
      view: validViews.has(params.get('view')) ? params.get('view') : 'series',
      topic: params.get('topic') || '',
      series: params.get('series') || '',
      language: params.get('language') || '',
      status: statusSelect ? params.get('status') || '' : '',
      sort: ['updated', 'published', 'series'].includes(params.get('sort')) ? params.get('sort') : 'updated',
      seriesSort: ['recent', 'name'].includes(params.get('series_sort')) ? params.get('series_sort') : 'recent',
      visible: pageSize,
      notes: null
    };

    if (!statusSelect && params.has('status')) {
      const next = new URL(window.location.href);
      next.searchParams.delete('status');
      window.history.replaceState({}, '', next);
    }

    const setUrl = () => {
      const next = new URL(window.location.href);
      next.searchParams.set('view', state.view);
      state.topic ? next.searchParams.set('topic', state.topic) : next.searchParams.delete('topic');
      state.series ? next.searchParams.set('series', state.series) : next.searchParams.delete('series');
      state.language ? next.searchParams.set('language', state.language) : next.searchParams.delete('language');
      state.status ? next.searchParams.set('status', state.status) : next.searchParams.delete('status');
      state.sort !== 'updated' ? next.searchParams.set('sort', state.sort) : next.searchParams.delete('sort');
      state.seriesSort !== 'recent'
        ? next.searchParams.set('series_sort', state.seriesSort)
        : next.searchParams.delete('series_sort');
      window.history.replaceState({}, '', next);
    };

    const createText = (tag, className, value) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value;
      return element;
    };

    const createNote = (note, showStatus) => {
      const article = document.createElement('article');
      article.className = 'garden-entry reading-note-row';
      article.lang = note.contentLang;

      const meta = createText('div', 'garden-entry-meta', '');
      meta.append(createText('span', '', note.seriesTitle));
      if (showStatus) {
        meta.append(createText('span', `garden-status garden-status-${note.status}`, note.status));
      }
      const time = createText('time', '', note.updated);
      time.dateTime = note.updated;
      meta.append(time);

      const heading = document.createElement('h2');
      const link = createText('a', '', note.title);
      link.href = note.url;
      heading.append(link);

      article.append(meta, heading);
      if (note.description) article.append(createText('p', '', note.description));

      const visibleTopics = note.topics.filter((topic) => topic !== 'books');
      if (visibleTopics.length > 0) {
        const topics = createText('div', 'garden-topics', '');
        topics.setAttribute('aria-label', 'Topics');
        visibleTopics.forEach((topic) => {
          const topicLink = createText('a', '', topicLabels[topic]?.title || topic.replaceAll('-', ' '));
          topicLink.href = `/topics/${topic}/`;
          topics.append(topicLink);
        });
        article.append(topics);
      }

      return article;
    };

    const matchingNotes = () => (state.notes || []).filter((note) => {
      return (!state.topic || note.topics.includes(state.topic)) &&
        (!state.series || note.series === state.series) &&
        (!state.language || note.contentLang === state.language) &&
        (!state.status || note.status === state.status);
    }).sort((left, right) => {
      if (state.sort === 'published') return right.published.localeCompare(left.published);
      if (state.sort === 'series') {
        return left.seriesTitle.localeCompare(right.seriesTitle) || left.seriesOrder - right.seriesOrder;
      }
      return right.updated.localeCompare(left.updated) || right.published.localeCompare(left.published);
    });

    const updateFilterCount = () => {
      const count = [state.topic, state.series, state.language, state.status].filter(Boolean).length;
      filterCountLabels.forEach((label) => {
        label.hidden = count === 0;
        label.textContent = count.toString();
      });
      clearButtons.forEach((button) => {
        if (button.classList.contains('reading-clear')) button.hidden = count === 0;
      });
    };

    const renderNotes = () => {
      if (!state.notes) return;
      const matching = matchingNotes();
      const visible = matching.slice(0, state.visible);
      const showStatuses = new Set(matching.map((note) => note.status)).size > 1;
      list.replaceChildren(...visible.map((note) => createNote(note, showStatuses)));
      status.textContent = matching.length === 0
        ? 'No matching notes.'
        : `Showing ${visible.length} of ${matching.length} notes.`;
      empty.hidden = matching.length !== 0;
      more.hidden = visible.length >= matching.length;
      updateFilterCount();
    };

    const loadNotes = async () => {
      if (state.notes) return renderNotes();
      try {
        const response = await fetch(root.dataset.notesUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.notes = await response.json();
        renderNotes();
      } catch {
        status.textContent = 'Notes could not be loaded. Use Browse all for the complete archive.';
      }
    };

    const showView = (view, updateUrl = true) => {
      state.view = validViews.has(view) ? view : 'series';
      buttons.forEach((button) => {
        button.setAttribute('aria-pressed', (button.dataset.readingView === state.view).toString());
      });
      panels.forEach((panel) => {
        panel.hidden = panel.dataset.readingPanel !== state.view;
      });
      if (state.view === 'all') loadNotes();
      if (updateUrl) setUrl();
    };

    const sortSeries = () => {
      const cards = [...seriesGrid.children];
      cards.sort((left, right) => {
        if (state.seriesSort === 'name') {
          return left.dataset.seriesTitle.localeCompare(right.dataset.seriesTitle);
        }
        return right.dataset.seriesUpdated.localeCompare(left.dataset.seriesUpdated) ||
          left.dataset.seriesTitle.localeCompare(right.dataset.seriesTitle);
      });
      seriesGrid.append(...cards);
    };

    const finishFilterDialog = () => {
      document.documentElement.classList.remove('overflow-hidden');
      document.body.classList.remove('overflow-hidden');
      window.setTimeout(() => filterOpen.focus(), 0);
    };

    const closeFilters = () => {
      if (filterDialog.open) filterDialog.close();
      finishFilterDialog();
    };

    const placeFilterPanel = () => {
      if (mobileFilters.matches) {
        if (filterDialog.open) closeFilters();
        filterDialogBody.append(filterPanel);
      } else {
        if (filterDialog.open) closeFilters();
        filterDesktop.append(filterPanel);
      }
    };

    buttons.forEach((button) => button.addEventListener('click', () => showView(button.dataset.readingView)));
    root.querySelectorAll('[data-reading-topic]').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        state.topic = link.dataset.readingTopic;
        state.visible = pageSize;
        topicSelect.value = state.topic;
        showView('all');
        root.querySelector('[data-reading-panel="all"]')?.scrollIntoView({ block: 'start' });
      });
    });

    topicSelect.addEventListener('change', () => {
      state.topic = topicSelect.value;
      state.visible = pageSize;
      setUrl();
      renderNotes();
    });
    seriesSelect.addEventListener('change', () => {
      state.series = seriesSelect.value;
      state.visible = pageSize;
      setUrl();
      renderNotes();
    });
    languageSelect?.addEventListener('change', () => {
      state.language = languageSelect.value;
      state.visible = pageSize;
      setUrl();
      renderNotes();
    });
    statusSelect?.addEventListener('change', () => {
      state.status = statusSelect.value;
      state.visible = pageSize;
      setUrl();
      renderNotes();
    });
    sortSelect.addEventListener('change', () => {
      state.sort = sortSelect.value;
      state.visible = pageSize;
      setUrl();
      renderNotes();
    });
    seriesSortSelect.addEventListener('change', () => {
      state.seriesSort = seriesSortSelect.value;
      setUrl();
      sortSeries();
    });
    clearButtons.forEach((button) => button.addEventListener('click', () => {
      state.topic = '';
      state.series = '';
      state.language = '';
      state.status = '';
      state.visible = pageSize;
      topicSelect.value = '';
      seriesSelect.value = '';
      if (languageSelect) languageSelect.value = '';
      if (statusSelect) statusSelect.value = '';
      setUrl();
      renderNotes();
    }));
    more.addEventListener('click', () => {
      state.visible += pageSize;
      renderNotes();
    });

    topicSelect.value = state.topic;
    seriesSelect.value = state.series;
    if (languageSelect) languageSelect.value = state.language;
    if (statusSelect) statusSelect.value = state.status;
    sortSelect.value = state.sort;
    seriesSortSelect.value = state.seriesSort;
    filterOpen.addEventListener('click', () => {
      filterDialog.showModal();
      document.documentElement.classList.add('overflow-hidden');
      document.body.classList.add('overflow-hidden');
      filterPanel.querySelector('select')?.focus();
    });
    root.querySelectorAll('[data-reading-filter-close]').forEach((button) => {
      button.addEventListener('click', closeFilters);
    });
    filterDialog.addEventListener('click', (event) => {
      if (event.target === filterDialog) closeFilters();
    });
    filterDialog.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeFilters();
    });
    filterDialog.addEventListener('close', finishFilterDialog);
    mobileFilters.addEventListener('change', placeFilterPanel);
    placeFilterPanel();
    sortSeries();
    updateFilterCount();
    showView(state.view, false);
  })();
</script>
