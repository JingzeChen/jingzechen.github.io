<script>
  (() => {
    const library = document.querySelector('[data-course-library]');
    if (!library) return;

    const items = [...library.querySelectorAll('[data-course-item]')];
    const search = library.querySelector('[data-course-search]');
    const institution = library.querySelector('[data-course-institution-filter]');
    const status = library.querySelector('[data-course-result-status]');
    const empty = library.querySelector('[data-course-empty]');

    const update = () => {
      const query = search.value.trim().toLowerCase();
      let visible = 0;

      items.forEach((item) => {
        const matches = (!query || item.dataset.title.includes(query))
          && (!institution.value || item.dataset.institution === institution.value);
        item.hidden = !matches;
        if (matches) visible += 1;
      });

      status.textContent = `${visible} ${visible === 1 ? 'course' : 'courses'}`;
      empty.hidden = visible !== 0;
    };

    [search, institution].forEach((control) => control.addEventListener('input', update));
    library.querySelector('[data-course-clear]').addEventListener('click', () => {
      search.value = '';
      institution.value = '';
      update();
      search.focus();
    });
  })();
</script>
