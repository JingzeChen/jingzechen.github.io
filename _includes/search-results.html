<!-- The Search results -->

<div id="search-result-wrapper" class="d-flex justify-content-center d-none">
  <div class="col-11 content">
    <div id="search-hints">
      <section aria-labelledby="search-start-title">
        <p class="garden-kicker">Suggested paths</p>
        <h2 id="search-start-title">Start with a series</h2>
        <div class="search-hint-links">
          {% for series_entry in site.data.series limit: 5 %}
            <a href="{{ series_entry[1].url | relative_url }}">{{ series_entry[1].title }}</a>
          {% endfor %}
        </div>
      </section>
    </div>
    <div id="search-results" class="text-muted mt-3" role="listbox" aria-label="Search results"></div>
  </div>
</div>
