<script>
  (() => {
    const input = document.getElementById('search-input');
    const results = document.getElementById('search-results');
    const hints = document.getElementById('search-hints');
    const trigger = document.getElementById('search-trigger');
    const cancel = document.getElementById('search-cancel');

    if (!input || !results) return;

    let activeIndex = -1;
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-controls', 'search-results');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');

    const items = () => [...results.querySelectorAll('.search-result-item')];
    const setActive = (index) => {
      const options = items();
      if (options.length === 0) return;
      activeIndex = (index + options.length) % options.length;
      options.forEach((option, optionIndex) => {
        const selected = optionIndex === activeIndex;
        option.classList.toggle('is-selected', selected);
        option.setAttribute('aria-selected', selected.toString());
        option.id = `search-option-${optionIndex}`;
      });
      input.setAttribute('aria-activedescendant', options[activeIndex].id);
      options[activeIndex].scrollIntoView({ block: 'nearest' });
    };

    const resetResults = () => {
      activeIndex = -1;
      input.removeAttribute('aria-activedescendant');
      const options = items();
      options.forEach((option) => option.setAttribute('aria-selected', 'false'));
      input.setAttribute('aria-expanded', (options.length > 0).toString());
      if (hints) hints.classList.toggle('d-none', results.children.length > 0);
    };
    results.addEventListener('search:updated', resetResults);
    cancel?.addEventListener('click', () => {
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      window.queueMicrotask(resetResults);
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        setActive(activeIndex + 1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        setActive(activeIndex - 1);
      } else if (event.key === 'Enter' && activeIndex >= 0) {
        event.preventDefault();
        items()[activeIndex]?.querySelector('a')?.click();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        if (cancel?.offsetParent) {
          cancel.click();
        } else {
          input.value = '';
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.blur();
        }
      }
    });

    document.addEventListener('keydown', (event) => {
      const target = event.target;
      const isEditing = target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target instanceof HTMLSelectElement ||
        target?.isContentEditable;
      if (event.key !== '/' || isEditing || event.ctrlKey || event.metaKey || event.altKey) return;

      event.preventDefault();
      if (trigger?.offsetParent) trigger.click();
      input.focus();
    });
  })();
</script>
