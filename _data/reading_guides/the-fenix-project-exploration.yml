  sections:
  - title: 1. 本章要解决什么问题
    source_heading: 1. 本章要解决什么问题
    paragraphs:
    - 作者采用的办法很像一组控制变量实验：所有版本都实现 Fenix’s Bookstore，保持用户看到的业务功能基本一致，只改变后端架构和承载非功能能力的位置。这样，读者比较的就不是“哪个演示页面更丰富”，而是相同结果背后的结构差异。
    - Spring Cloud 把系统拆成服务，并通过应用内类库解决分布式问题，能力灵活，但每个应用都背负较深的技术栈。
    - Istio 再以边车代理承接流量治理、安全和可观测性，业务进程可以进一步回归普通 Spring Boot 风格。
    - AWS Lambda 把服务器与实例生命周期继续交给云平台，开发者按函数和事件组织计算，但会受到冷启动、平台约束和状态外置等影响。
  - title: 3. 技术演示工程：同一业务的多种架构实现
    source_heading: 3. 技术演示工程：同一业务的多种架构实现
    paragraphs:
    - Fenix’s Bookstore 是整组实验的共同业务载体。它包含用户、商品、交易等典型领域，并提供注册、登录、浏览、收藏、购物车和交易等操作。作者没有为每种架构设计不同业务，而是让前端界面和业务结果尽量保持一致。
    - 部署单位：JAR、容器、Pod、带边车的 Pod 或函数；
    - 运行入口：本地进程、Docker Compose、Kubernetes、Istio 或云平台；
    - 图中的最后一条关系尤其重要：Serverless 不是微服务之后必然出现的“下一代”，它与微服务不在同一分类层次。微服务讨论的是系统如何按服务边界组织，Serverless
      讨论的是计算资源如何交付和运行；一个微服务完全可以由一个或多个云函数实现。
  - title: 4. 前端工程：先固定可见的业务结果
    source_heading: 4. 前端工程：先固定可见的业务结果
    paragraphs:
    - 本书重点是后端架构，但前端能最快回答“我们到底要构建什么”。它把抽象的用户、商品、交易服务转换成可点击的页面，也为所有后端版本提供统一的观察面。
    - 更重要的是，前端可以依靠 Mock.js 独立运行。于是前端开发不必等待服务端、数据库和部署环境全部就绪。这体现了前后端分离的关键条件：双方先约定接口位置、传输方式、参数、数据模型以及必要的服务水平，再各自实现和测试。
    - 原章把这种独立性放在现代 MVVM（Model-View-ViewModel）前端结构下理解：View 负责界面呈现，ViewModel 保存页面状态并把用户动作转换为数据操作，Model
      则代表经本地或远程 API 获得的数据。页面主要依赖 ViewModel，而 ViewModel 通过统一 API 层连接 Mock 或真实服务端，因此替换数据来源时不必重写界面。MVVM
      解决的是前端展示与状态逻辑的耦合问题；前后端分离解决的是浏览器应用与服务端的进程、开发和发布边界，两者相互促进但不是同一个概念。
    - 原章指出，把一部分会话状态放在客户端、让后端服务尽量无状态，有利于伸缩和鲁棒性。原因是任意后端实例都能处理下一次请求，负载均衡器无需把用户固定到某台机器。
  - title: 6. Spring Cloud 微服务：先在应用层解决分布式问题
    source_heading: 6. Spring Cloud 微服务：先在应用层解决分布式问题
    paragraphs:
    - 因此，Fenix’s Bookstore 被拆成用户、商品、交易三个领域服务，并加入认证、配置、注册和网关等技术服务。它们通过统一 API 网关对外，保持与单体相同的业务功能。
    - 在一台机器上模拟四个支付实例时，需要让它们监听不同端口；在不同容器或主机中，各实例可使用相同容器端口，由网络命名空间隔离。这个区别说明“端口冲突”是部署拓扑问题，不是微服务定义的一部分。
    - 作者列替代品的原因是 Spring Cloud Netflix 当时已进入维护模式。更深层的结论是：选型时要抓住稳定抽象，而不是把某个产品名当作概念本身。Eureka
      是服务发现的一种实现，Hystrix 是容错的一种实现；产品会退出，问题不会消失。
    - 声明式组件减少了显式调用代码，也降低了替换成本，但“只换注解和配置即可”有前提：双方语义、故障模型、默认超时、重试策略和监控指标必须兼容。语法替换容易，行为等价仍需测试。
  - title: 8. Istio 服务网格：用代理补足精细治理
    source_heading: 8. Istio 服务网格：用代理补足精细治理
    paragraphs:
    - 因此，Kubernetes 版本虽然减少了部分应用组件，在灵活治理方面反而可能弱于 Spring Cloud 版本。作者没有把所有问题都硬塞给 Kubernetes，而是引入位于应用与基础设施之间的服务网格。
    - Istio 版移除了 Zuul、Hystrix、Spring Cloud Kubernetes 等应用内组件，单个业务服务更接近最初的 Spring Boot
      技术栈。安全过滤也主要移到网格；Spring Security OAuth 仍作为终端用户认证和 JWT/JWKS 提供者存在。
    - Skaffold 开发流程与 Kubernetes 版本相同；入口端口则取决于 Istio Ingress Gateway 的实际安装配置，不能机械假定所有环境都监听原书端口。
    - 服务网格的局限也必须看到：每个工作负载增加代理会消耗 CPU、内存和连接资源；流量经过额外一跳会带来延迟；控制面、证书、策略和遥测系统本身需要专业运维；代理与应用的故障定位边界也更复杂。它适合服务规模和治理需求足以抵偿平台成本的场景。
  - title: 9. AWS Lambda 无服务：把实例生命周期交给云平台
    source_heading: 9. AWS Lambda 无服务：把实例生命周期交给云平台
    paragraphs:
    - 这个公式不是用来精确预测云平台延迟，而是帮助定位优化对象。若主要时间消耗在数据库或外部 API，单纯缩短 JVM 启动并不能解决整体延迟；若函数被频繁复用，冷启动占比也会下降。
    - SAM Local 依赖 Docker，用本地容器模拟 API Gateway 和 Lambda 运行环境。它适合验证处理器、路由和打包结构，但不能完全复制云端冷启动、权限、网络、限额和托管服务行为。
    - CLI 输出的 endpoint 才是实际访问地址。与本地固定端口不同，云端入口由部署结果生成。
    - 函数实例短暂、可并发创建，也可能随时销毁，不能把本地内存或实例磁盘当作可靠业务存储。原章不建议继续使用每次冷启动都重置的 HSQLDB，而建议使用外部
      MySQL/MariaDB 等托管数据库。
  - title: 10.3 不存在无条件最优解
    source_heading: 10.3 不存在无条件最优解
    paragraphs:
    - 服务边界清晰、团队需要独立发布且愿意承担分布式成本时，微服务才有净收益。
    - 服务数量、治理和安全需求达到一定规模时，服务网格才可能抵偿代理与控制面的成本。
    - 事件驱动、流量波动大、执行短且状态可外置时，Serverless 更有吸引力。
    - "“技术先进”只描述时间或能力维度，不等于“适合当前组织”。架构必须同时匹配业务规模、团队结构、平台成熟度和故障承受能力。"
  - title: 13.1 最短学习路线
    source_heading: 13.1 最短学习路线
    paragraphs:
    - 运行 Spring Boot 单体，跟踪一次请求穿过四层结构。
    - 对比 Kubernetes 版，逐项记录被 ConfigMap、Service 和 DNS 替代的组件。
    - 对比 Istio 有边车与无边车模式，观察功能相同但质量属性不同。
    - 最后用 SAM Local 理解 Lambda 打包和触发模型，不必一开始就产生云资源费用。
  - title: 13.3 值得做的对照实验
    source_heading: 13.3 值得做的对照实验
    paragraphs:
    - 启动多个交易服务实例，观察负载由 Ribbon、Service 或 Envoy 中的谁分配。
    - 修改 ConfigMap，观察配置是否以及何时生效。
    - 在 Istio 中关闭边车，比较调用、授权和遥测的差异。
    - 测量 Lambda 冷、暖请求延迟，避免只凭一次请求下结论。
  - title: 15. 主动回忆题
    source_heading: 15. 主动回忆题
    paragraphs:
    - Kubernetes 已接管哪些能力，为什么仍保留 Zuul、Hystrix 和业务认证？
    - Kubernetes RBAC 为什么不能替代书店用户的业务授权？
    - 服务网格为何采用 Sidecar，而不是再次把治理代码写进应用？
    - Java/Spring 的哪些启动阶段会放大 Lambda 冷启动时间？
  takeaways:
  - 最有效的入门方式是先建立可运行的整体经验，再带着具体问题学习理论。
  - 微服务解决独立演进、隔离和异构等问题，同时把进程内问题升级为分布式问题。
  - 架构演进的主线是职责和复杂度迁移，不是复杂度凭空消失。
  - Serverless 与微服务并非代际关系；它减少服务器管理，却强化了对冷启动、外部状态和平台约束的关注。
  - 其中最关键的两个问题始终是：这项能力为什么必须存在？最适合由哪一层承担？ 只要能持续回答这两个问题，就不会把架构学习退化成产品名和命令的记忆。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.1 单体不等于没有模块化」？
  answer: 单体描述的是部署和进程边界，不代表内部必须混乱。DDD 分层和清晰模块仍可在单体中实现。反过来，把混乱代码分成多个进程也不会自动得到良好微服务，只会增加网络和运维成本。
  source_heading: 11.1 单体不等于没有模块化
- level: 概念辨析
  question: 原文如何解释「11.3 容器不等于微服务」？
  answer: 单体也可以放进容器，微服务也可以不用容器。容器解决环境封装和进程隔离，微服务解决服务边界和独立演进，两者经常组合但并非同义。
  source_heading: 11.3 容器不等于微服务
- level: 概念辨析
  question: 原文如何解释「11.6 无服务不等于没有服务器」？
  answer: 服务器仍然存在，只是由云厂商管理，用户按函数、事件和资源声明使用。团队少管操作系统，不代表不再管理成本、权限、并发、超时、状态与供应商依赖。
  source_heading: 11.6 无服务不等于没有服务器
- level: 概念辨析
  question: 原文如何解释「11.8 无状态不等于无数据」？
  answer: 无状态服务只是避免依赖某个实例的本地会话。数据库、缓存、令牌与客户端仍保存状态，且必须考虑一致性、安全和生命周期。
  source_heading: 11.8 无状态不等于无数据
- level: 概念辨析
  question: 原文如何解释「11.10 演示能运行不等于适合生产」？
  answer: 内存数据库、默认密码、单节点控制面、宽松权限和固定端口都只为降低学习门槛。生产系统还要处理高可用、备份恢复、密钥管理、容量规划、升级兼容、审计与灾难恢复。
  source_heading: 11.10 演示能运行不等于适合生产
