  minutes: 10
  question: 1. 本章要解决什么问题？
  question_source: 1. 本章要解决什么问题
  thesis: Spring Cloud、Kubernetes、Istio 分别代表应用类库、编排基础设施和代理层承接非功能能力的不同路线。
  thesis_source: 14. 本章知识结构总结
  concepts:
  - term: 1. 本章要解决什么问题
    meaning: 作者采用的办法很像一组控制变量实验：所有版本都实现 Fenix’s Bookstore，保持用户看到的业务功能基本一致，只改变后端架构和承载非功能能力的位置。这样，读者比较的就不是“哪个演示页面更丰富”，而是相同结果背后的结构差异。
    source_heading: 1. 本章要解决什么问题
  - term: 4. 前端工程：先固定可见的业务结果
    meaning: 原章把这种独立性放在现代 MVVM（Model-View-ViewModel）前端结构下理解：View 负责界面呈现，ViewModel
      保存页面状态并把用户动作转换为数据操作，Model 则代表经本地或远程 API 获得的数据。页面主要依赖 ViewModel，而 ViewModel 通过统一
      API 层连接 Mock 或真实服务端，因此替换数据来源时不必重写界面。MVVM 解决的是前端展示与状态逻辑的耦合问题；前后端分离解决的是浏览器应用与服务端的进程、开发和发布边界，两者相互促进但不是同一个概念。
    source_heading: 4. 前端工程：先固定可见的业务结果
  - term: 8. Istio 服务网格：用代理补足精细治理
    meaning: Istio 版移除了 Zuul、Hystrix、Spring Cloud Kubernetes 等应用内组件，单个业务服务更接近最初的 Spring
      Boot 技术栈。安全过滤也主要移到网格；Spring Security OAuth 仍作为终端用户认证和 JWT/JWKS 提供者存在。
    source_heading: 8. Istio 服务网格：用代理补足精细治理
  - term: 9. AWS Lambda 无服务：把实例生命周期交给云平台
    meaning: SAM Local 依赖 Docker，用本地容器模拟 API Gateway 和 Lambda 运行环境。它适合验证处理器、路由和打包结构，但不能完全复制云端冷启动、权限、网络、限额和托管服务行为。
    source_heading: 9. AWS Lambda 无服务：把实例生命周期交给云平台
  - term: 13.1 最短学习路线
    meaning: 对比 Kubernetes 版，逐项记录被 ConfigMap、Service 和 DNS 替代的组件。
    source_heading: 13.1 最短学习路线
  - term: 15. 主动回忆题
    meaning: Kubernetes 已接管哪些能力，为什么仍保留 Zuul、Hystrix 和业务认证？
    source_heading: 15. 主动回忆题
