overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章主线：直接对函数建立概率模型」建立了怎样的核心认识？
  question_source: 1. 本章主线：直接对函数建立概率模型
  thesis: 高斯观测模型使训练观测和测试潜函数联合高斯，因此回归后验闭式可得。
  thesis_source: 17. 核心结论
  concepts:
  - term: 1. 本章主线：直接对函数建立概率模型
    meaning: 不先问“参数应该是多少”，而先问“哪些函数在观测数据之前是合理的，看到数据之后又还剩下哪些可能的函数”。
    source_heading: 1. 本章主线：直接对函数建立概率模型
  - term: 2.4 GP 与深度学习不是对立关系
    meaning: GPyTorch 与 PyTorch 自动微分、GPU 和线性代数工具结合。
    source_heading: 2.4 GP 与深度学习不是对立关系
  - term: 5.8 可信区间的准确含义
    meaning: 原书用边际似然点估计超参数再条件化，属于经验贝叶斯（type-II maximum likelihood），通常会低估一部分超参数不确定性。
    source_heading: 5.8 可信区间的准确含义
  - term: 7. 稳定计算：不要显式求逆
    meaning: 不能把为了 Cholesky 成功而加入的大 jitter 当作学到的观测噪声。如果所需 jitter 很大，应检查重复输入、尺度、核参数和数据预处理。
    source_heading: 7. 稳定计算：不要显式求逆
  - term: 12. GP 与相关方法的关系
    meaning: 核岭回归也有同样的核展开形式。适当匹配正则化参数后，两者点预测相同；GP 额外给出由概率模型推导的后验协方差和边际似然。
    source_heading: 12. GP 与相关方法的关系
  - term: 18. 解决 GP 建模问题的一般思路
    meaning: 本章可压缩为一句话：高斯过程用均值函数和合法核直接规定函数先验；在有限输入上它就是一个多元高斯，加入高斯噪声后可通过条件高斯得到后验均值与协方差，并通过边际似然在拟合和复杂度之间学习超参数。真正可靠的应用不只依赖公式，还依赖正确的核归纳偏置、潜函数与观测不确定性的区分、Cholesky
      数值实现，以及对外推、校准和计算规模边界的诚实检查。
    source_heading: 18. 解决 GP 建模问题的一般思路
  logic:
  - 1. 本章主线：直接对函数建立概率模型
  - 2.4 GP 与深度学习不是对立关系
  - 4. 高斯过程先验
  - 7. 稳定计算：不要显式求逆
  - 9. 可运行的 NumPy 综合实验
  - 15. 原章练习详解
  - 18. 解决 GP 建模问题的一般思路
  sections:
  - title: 1. 本章主线：直接对函数建立概率模型
    source_heading: 1. 本章主线：直接对函数建立概率模型
    paragraphs:
    - 例如，仅观察神经网络数百万个权重，很难直接判断模型偏好平滑函数、周期函数还是快速振荡函数。
    - 不先问“参数应该是多少”，而先问“哪些函数在观测数据之前是合理的，看到数据之后又还剩下哪些可能的函数”。
    - 它直接定义函数上的概率分布。均值函数描述先验中心，协方差函数（核）描述任意两个输入处函数值如何共同变化。看到数据后，通过高斯条件分布把先验更新为后验。
    - 从 NumPy 实现过渡到 GPyTorch，以便更换核、扩展规模和处理近似推断。
  - title: 2.2 小数据下需要完整预测分布
    source_heading: 2.2 小数据下需要完整预测分布
    paragraphs:
    - 预测波动来自函数未知，还是观测本身有噪声？
    - GP 同时给出后验均值与协方差，因此适合主动学习、贝叶斯优化、时空回归、实验设计和不确定性敏感决策。
  - title: 2.4 GP 与深度学习不是对立关系
    source_heading: 2.4 GP 与深度学习不是对立关系
    paragraphs:
    - 神经切线核（NTK）用核方法研究宽网络训练；
    - Deep Kernel Learning 用神经网络学习表示，再在表示上使用 GP；
    - GPyTorch 与 PyTorch 自动微分、GPU 和线性代数工具结合。
    - 因此 GP 既是实用模型，也是理解核方法、贝叶斯学习和宽神经网络的重要桥梁。
  - title: 4. 高斯过程先验
    source_heading: 4. 高斯过程先验
    paragraphs:
    - 常把均值设为零，不表示函数真实均值必为零，而是常先对目标中心化，或把趋势放到均值函数。若存在明显线性、周期或物理趋势，显式均值函数可改善外推。
    - 任意有限组函数值都是同一个高斯权重向量的线性变换，所以联合高斯。这就是一个只包含直线的 GP。
    - 由同一个均值函数和对称 PSD 核生成的有限维高斯族自动满足这些条件。Kolmogorov 扩张定理保证它们对应一个随机过程。
    - 事实上，RBF GP 样本极其平滑；真实函数有突变、尖点、变化点或非平稳结构时会失配。GP 样本还几乎必然不属于其核对应的 RKHS，RKHS 更适合描述后验均值和正则化结构，而不是典型先验样本。
  - title: 5.8 可信区间的准确含义
    source_heading: 5.8 可信区间的准确含义
    paragraphs:
    - 整条函数同时落入带中的概率为 95% 的 simultaneous band；
    - 重复实验意义下必然 95% 覆盖的频率学置信区间；
    - 超参数不确定性已经完全积分后的全贝叶斯区间。
    - 原书用边际似然点估计超参数再条件化，属于经验贝叶斯（type-II maximum likelihood），通常会低估一部分超参数不确定性。
  - title: 7. 稳定计算：不要显式求逆
    source_heading: 7. 稳定计算：不要显式求逆
    paragraphs:
    - jitter j：为了浮点稳定加入的很小对角修正。
    - 不能把为了 Cholesky 成功而加入的大 jitter 当作学到的观测噪声。如果所需 jitter 很大，应检查重复输入、尺度、核参数和数据预处理。
    - 因此原书练习直接用朴素稠密实现测试 40,000 个训练点并不现实。大规模方法包括 inducing points、变分 GP、随机迹估计、共轭梯度、SKI/KISS-GP
      和结构化核插值。
  - title: 9. 可运行的 NumPy 综合实验
    source_heading: 9. 可运行的 NumPy 综合实验
    paragraphs:
    - RBF Gram 矩阵的 PSD 与输入置换一致性；
    - 重复输入使 Gram 矩阵可能奇异，但特征值仍不应显著为负；
    - 输入置换后，核矩阵只做相同行列置换，验证有限维一致性的一部分；
    - 网格搜索只是可复现的小型示范，实际应用应优化对数超参数并多起点；
  - title: 12. GP 与相关方法的关系
    source_heading: 12. GP 与相关方法的关系
    paragraphs:
    - 贝叶斯线性回归是有限特征 GP；GP 是将注意力从参数协方差 S 转到函数协方差 k。二者通过
    - 核岭回归也有同样的核展开形式。适当匹配正则化参数后，两者点预测相同；GP 额外给出由概率模型推导的后验协方差和边际似然。
    - 多元高斯是有限索引集合上的 GP；GP 是索引集合可无限时的扩展。每次实际计算都退回到多元高斯线性代数。
    - 有限网络训练后的函数分布通常不是精确 GP；
  - title: 15. 原章练习详解
    source_heading: 15. 原章练习详解
    paragraphs:
    - 合法联合协方差还要求整体 PSD。固定核时，增加观测不会增大条件方差，但均值与具体 r 有关。
    - 更大噪声允许把短程波动解释为噪声，常与更大长度尺度配对；更小噪声常迫使函数追随局部波动，倾向更小长度尺度。但关系不是严格单调，边际似然可存在多个局部最优。
    - 产生连续但几乎处处不可微的粗糙函数；RBF 样本无限可微。同样名义长度尺度不代表两种核具有完全相同相关衰减定义，应比较实际相关系数曲线。
    - 分别从两处初始化优化，可能收敛到不同模式。因此应多起点并检查预测，而不是只报告一个 loss。
  - title: 18. 解决 GP 建模问题的一般思路
    source_heading: 18. 解决 GP 建模问题的一般思路
    paragraphs:
    - 用稳定线性代数实现：Cholesky、三角求解、log diagonal，不显式求逆和 determinant。
    - 拆解边际似然：同时看 data fit、log determinant 和总目标，理解局部最优。
    - 检查超参数可辨识性：特别是 lengthscale、noise 与 amplitude 的耦合。
    - 本章可压缩为一句话：高斯过程用均值函数和合法核直接规定函数先验；在有限输入上它就是一个多元高斯，加入高斯噪声后可通过条件高斯得到后验均值与协方差，并通过边际似然在拟合和复杂度之间学习超参数。真正可靠的应用不只依赖公式，还依赖正确的核归纳偏置、潜函数与观测不确定性的区分、Cholesky
      数值实现，以及对外推、校准和计算规模边界的诚实检查。
  takeaways:
  - GP 是函数上的概率分布，而不是某一条高斯形状函数。
  - 函数空间视角允许用有限核矩阵隐式处理无限维特征。
  - 后验均值是训练残差的核加权组合；后验协方差是先验协方差减去数据解释掉的部分。
  - 边际似然通常非凸，长度尺度与噪声可形成不同解释，需多起点和模型诊断。
  - 平稳 RBF 远离数据时均值回到先验均值，方差回到有限先验方差，不会自动周期外推。
