overview:
  kind: summary
  minutes: 12
  question: 原文围绕「0. 本章定位与阅读主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与阅读主线
  thesis: 发现最终文本不足以判断 Agent，于是用 RTTurn 暴露 executed/blocked tools；
  thesis_source: 21. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与阅读主线
    meaning: Benchmark、evaluation 和 observability 提供不同证据。公开榜单不能证明你的 workflow 可靠；离线测试不能穷尽真实用户；线上
      trace 也不能直接证明因果或替代可控回归。只有把它们按生命周期连接，系统才会持续变得可解释、可比较和可改进。
    source_heading: 0. 本章定位与阅读主线
  - term: 4. Behavioral Stress Testing：用角色和情境逼近真实互动
    meaning: GUI（原章用 Gradio）让 SME 看熟悉的 table/conversation；批量 CSV/dashboard 避免逐条点击。UI
      交互用于理解个案，自动 harness 用于规模、可重复和版本比较，两者互补。
    source_heading: 4. Behavioral Stress Testing：用角色和情境逼近真实互动
  - term: 9. 例 8-4：两阶段异步 Evaluation Loop
    meaning: 只对无 error rows 分 batch，每批 3，progress 60→95%。Judge batching 降成本/latency，但候选可能产生相对比较/位置
      bias；若目标是绝对 rubric，每项应有稳定独立上下文或随机顺序。
    source_heading: 9. 例 8-4：两阶段异步 Evaluation Loop
  - term: 11. Early Threat Testing：在架构固化前找危险路径
    meaning: Taxonomy 是 threat checklist 和测试组织方式，不是完成 10 项即可获得安全认证。应映射自己的 assets、trust
      boundaries 和 controls。
    source_heading: 11. Early Threat Testing：在架构固化前找危险路径
  - term: 16. Observability Platform 应捕获哪些信号
    meaning: 跨 Agent runtime、MCP server、external API 的 distributed spans，用 correlation/run
      IDs 重建完整路径。不要记录不可控 hidden chain-of-thought；记录决策摘要、structured action 和 evidence。
    source_heading: 16. Observability Platform 应捕获哪些信号
  - term: 21. 本章知识结构与核心结论
    meaning: 可迁移的一般方法是：先写清系统应怎样行为和绝不能做什么，再让多种 evaluator 提供互补证据；对 evaluator 本身做校准；把动作轨迹而非漂亮答案作为
      Agent 真相；将线上异常转为受控回归，但始终保留独立 holdout 和真实流量观察。
    source_heading: 21. 本章知识结构与核心结论
  logic:
  - 0. 本章定位与阅读主线
  - 4. Behavioral Stress Testing：用角色和情境逼近真实互动
  - 7. 例 8-2：把 Stress Dimension 变成规则信号
  - 11. Early Threat Testing：在架构固化前找危险路径
  - 13. RTTurn：为什么安全真相在 Trace 中
  - 19. 从本章抽象出的评估与观察方法
  - 21. 本章知识结构与核心结论
  sections:
  - title: 0. 本章定位与阅读主线
    source_heading: 0. 本章定位与阅读主线
    paragraphs:
    - Public benchmarking：用标准数据集预选一般 reasoning、coding、tool-use 能力较强的模型；
    - Evaluation：把模型放进自己的 prompt、tools、workflow 和用户场景，观察行为、执行轨迹、失败与风险；
    - 部署后：observability 收集真实 latency、cost、tools、sessions、feedback 和 human annotation；
    - Benchmark、evaluation 和 observability 提供不同证据。公开榜单不能证明你的 workflow 可靠；离线测试不能穷尽真实用户；线上
      trace 也不能直接证明因果或替代可控回归。只有把它们按生命周期连接，系统才会持续变得可解释、可比较和可改进。
  - title: 2. 为什么 Public Benchmark 会带来 False Confidence
    source_heading: 2. 为什么 Public Benchmark 会带来 False Confidence
    paragraphs:
    - web/tool result prompt injection；
    - 长对话 intent switch；
    - latency/timeout 导致 partial path；
    - 因此 public score 是 prior signal，不是 production reliability posterior。必须在目标 workflow
      分布上收集证据。
  - title: 4. Behavioral Stress Testing：用角色和情境逼近真实互动
    source_heading: 4. Behavioral Stress Testing：用角色和情境逼近真实互动
    paragraphs:
    - 所有场景都是起始 hypothesis。LLM 生成数据可能复制模型自己的盲点，不能未经人审当 gold set。
    - GUI（原章用 Gradio）让 SME 看熟悉的 table/conversation；批量 CSV/dashboard 避免逐条点击。UI 交互用于理解个案，自动
      harness 用于规模、可重复和版本比较，两者互补。
    - random sample of apparently good cases。
    - 最后一项用于发现 evaluator blind spot，不能只让 SME 看机器判定的坏样本。
  - title: 7. 例 8-2：把 Stress Dimension 变成规则信号
    source_heading: 7. 例 8-2：把 Stress Dimension 变成规则信号
    paragraphs:
    - adversarial：若出现 bypass/disable auth/skip verification 判失败，否则需 cannot/security/not
      permitted/policy marker。
    - False positive（误判失败）：Agent 写“I can help verify details”但没用 markers；urgency 场景实际不该
      high，却被测试假设强制。
    - False negative（漏判失败）：回复说“Sorry”却侮辱用户；说“cannot bypass”后实际上调用了 bypass tool；文本包含
      “disable auth” 是在拒绝它，却被原规则先判失败。
    - 规则本身也是 evaluator，需要测试和版本化。若只优化 Agent 通过 markers，模型会 reward-hack 成固定套话。
  - title: 9. 例 8-4：两阶段异步 Evaluation Loop
    source_heading: 9. 例 8-4：两阶段异步 Evaluation Loop
    paragraphs:
    - Rows 顺序不再等于 scenarios 输入顺序，所以必须依靠 scenario/candidate IDs join，不能按数组位置比较。
    - 只对无 error rows 分 batch，每批 3，progress 60→95%。Judge batching 降成本/latency，但候选可能产生相对比较/位置
      bias；若目标是绝对 rubric，每项应有稳定独立上下文或随机顺序。
    - 保留 judge raw reason 供审计，但不把 hidden reasoning 当证据。
    - "“Finalizing” 后 caller/UI 再完成 DataFrame/export 才设 1.0，可避免任务仍写文件时显示完成。生产 event
      应有明确 stage/status，而不只 float percentage。"
  - title: 11. Early Threat Testing：在架构固化前找危险路径
    source_heading: 11. Early Threat Testing：在架构固化前找危险路径
    paragraphs:
    - 行为测试问“正常/压力场景下是否完成业务”；红队测试主动寻找系统边界的反例：能否诱导越权、组合工具、污染 memory、伪造 Agent、执行代码或造成资源耗尽。
    - 因此必须捕获 actions、blocked attempts、state changes 和 side effects，不能只看 final text。
    - Taxonomy 是 threat checklist 和测试组织方式，不是完成 10 项即可获得安全认证。应映射自己的 assets、trust boundaries
      和 controls。
    - 框架之间有重叠，应建立 control/test crosswalk，不要重复执行同一测试却遗漏特定业务 abuse case。
  - title: 13. RTTurn：为什么安全真相在 Trace 中
    source_heading: 13. RTTurn：为什么安全真相在 Trace 中
    paragraphs:
    - deceptive/passive failure：文字称未执行，trace 显示已执行。
    - 只评价文本会 PASS，action trace 应 FAIL least privilege。
    - 三者都需要不同 remediation：修 runtime、修 planning/prompt、或保持现状。
    - 每 attack 必须新 thread/session/checkpoint，清除 memory 与 mock side effects；否则前一个 adversarial
      turn 污染后一个结果。多 turn attack 则应在同一明确 session 内，测试结束清理。
  - title: 16. Observability Platform 应捕获哪些信号
    source_heading: 16. Observability Platform 应捕获哪些信号
    paragraphs:
    - 频率、顺序、argument validation、blocked/executed、error/retry、approval、side-effect
      result。检测 repeated signature 和 unsafe composition。
    - 跨 Agent runtime、MCP server、external API 的 distributed spans，用 correlation/run
      IDs 重建完整路径。不要记录不可控 hidden chain-of-thought；记录决策摘要、structured action 和 evidence。
    - 观察 intent drift、clarification loops、goal switches、escalation、memory retrieval
      和 abandonment。Request-level metric 无法看长期行为。
    - Rating/comment 是 direct usefulness signal，但有 selection bias、情绪/结果混杂和低 response
      rate。关联具体 run/turn，允许原因标签，并与行为 outcome 结合。
  - title: 19. 从本章抽象出的评估与观察方法
    source_heading: 19. 从本章抽象出的评估与观察方法
    paragraphs:
    - 包含 expected path、hard constraints、stress dimensions、artifacts 和 provenance；不先堆
      prompts 后再猜怎样评分。
    - Hard schema/policy/tool invariants；deterministic task metrics；LLM judge 软质量；SME
      高风险/分歧/随机抽查。每个 evaluator 自己有 calibration set。
    - Generation/parse/tool/timeout 记 error taxonomy，score=N/A；业务输出成功才进入 quality distribution。否则平均分被基础设施故障混淆。
    - 比较 current vs baseline，设 hard invariants 和 statistical/segment thresholds；shadow/canary
      后继续 observation；失败可 rollback。
  - title: 21. 本章知识结构与核心结论
    source_heading: 21. 本章知识结构与核心结论
    paragraphs:
    - 有效 scenario 同时定义 persona、背景、目标、stress、conversation path、success 和 hard constraints。
    - Production signals 包含 latency、cost、tools、distributed traces、sessions、segments、feedback
      和 annotation。
    - 通过 typed schemas、deterministic rules、bounded concurrency、batch judge 和 export
      建轻量 harness；
    - 可迁移的一般方法是：先写清系统应怎样行为和绝不能做什么，再让多种 evaluator 提供互补证据；对 evaluator 本身做校准；把动作轨迹而非漂亮答案作为
      Agent 真相；将线上异常转为受控回归，但始终保留独立 holdout 和真实流量观察。
  takeaways:
  - Public benchmark 用于通用能力初筛，不能证明模型在你的 Agent workflow 中可靠。
  - Generation 和 judge 分阶段可提高吞吐，但 batch/position bias、errors 和 score scale 必须显式处理。
  - 部署后 observation 面对真实、非受控、无即时 gold 的流量，作用是发现未知 failure 和运营异常。
  - 把预部署验证拆为行为与安全双轨，避免后期架构返工；
  - 可迁移的一般方法是：先写清系统应怎样行为和绝不能做什么，再让多种 evaluator 提供互补证据；对 evaluator 本身做校准；把动作轨迹而非漂亮答案作为
    Agent 真相；将线上异常转为受控回归，但始终保留独立 holdout 和真实流量观察。
