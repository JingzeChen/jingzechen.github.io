  question: 导读：最后一章解决的是“怎样真正做起来”？
  question_source: 导读：最后一章解决的是“怎样真正做起来”
  thesis: 对于学生，这意味着把课本变成问题，把复习分散到学期，把同类题打乱，并用细化、生成、反思和助记补足理解与检索。对于职场人士，这意味着用草稿、录音、走位、角色扮演和复盘，把随机工作经验改造成结构化练习。对于教师，这意味着公开解释学习科学，安排低权重累积测验、自由回忆、系统总结和分层反馈。对于培训者，这意味着从真实绩效倒推目标，用认证、模拟、岗位轮换、改善项目和业务指标建立组织学习循环。
  thesis_source: 十、全章总结
