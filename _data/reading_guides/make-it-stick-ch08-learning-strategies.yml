checks:
- level: 概念辨析
  question: 原文如何解释「1. 重读与定向复习」？
  answer: 重读是再次完整接触；定向复习是在自测暴露缺口后回原文纠错。后者由反馈驱动。
  source_heading: 1. 重读与定向复习
- level: 概念辨析
  question: 原文如何解释「2. 学习小组与测验小组」？
  answer: 学习小组可能由一人讲解；测验小组先撤掉材料，所有人生成并用问题互相检验。
  source_heading: 2. 学习小组与测验小组
- level: 概念辨析
  question: 原文如何解释「4. 模拟与表演」？
  answer: 模拟要保留目标决策和后果，结果用于反馈；表演只求看起来像，不一定测真实能力。
  source_heading: 4. 模拟与表演
- level: 概念辨析
  question: 原文如何解释「5. 标准化与僵化」？
  answer: 标准提供质量基线；持续改善允许经验证的新方案更新标准。没有标准无法判断改进。
  source_heading: 5. 标准化与僵化
