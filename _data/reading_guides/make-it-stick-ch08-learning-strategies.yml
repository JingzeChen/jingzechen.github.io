    source_heading: 二、给职场人士的学习策略
  - term: 七、作者分析问题的方法
    meaning: 本章大量职业与企业案例属于说明性材料，不是随机实验。因果信心主要来自前章实验，案例用于证明可实施性和展示组合方式。
    source_heading: 七、作者分析问题的方法
