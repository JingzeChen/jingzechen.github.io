  question: 原文围绕「1. 第 4 章留下的迁移难题」建立了怎样的核心认识？
  question_source: 1. 第 4 章留下的迁移难题
  thesis: 2005 年哈佛团队评审二十多项研究，原书概述多数研究发现医生绩效随时间下降或保持不变。更大范围的 62 项研究中，只有 2 项显示护理质量随经验提高；另有超过
    1 万名临床医生的研究中，经验带来的决策准确性收益很小。
  thesis_source: 6.2 传统医学教育的失败
  concepts:
  - term: 1. 第 4 章留下的迁移难题
    meaning: 真正任务优先要求产出，不能随意暂停、重复或降低速度；
    source_heading: 1. 第 4 章留下的迁移难题
  - term: 4.1 拒绝三种错误思想
    meaning: 组织若不给时间、反馈、案例、导师和心理安全，却要求员工“正确练习”，是在把系统责任推给个人。刻意练习心态必须配套训练基础设施。
    source_heading: 4.1 拒绝三种错误思想
  - term: 5.2 创建有反馈的训练工具
    meaning: 2003 年，他提出建立数字化乳房影像库，并连接长期病历、活检和后续结果。每个案例应包含已知答案：是否癌变、怎样发展、最初是否漏诊。
    source_heading: 5.2 创建有反馈的训练工具
  - term: 6.2 传统医学教育的失败
    meaning: 2005 年哈佛团队评审二十多项研究，原书概述多数研究发现医生绩效随时间下降或保持不变。更大范围的 62 项研究中，只有 2 项显示护理质量随经验提高；另有超过
      1 万名临床医生的研究中，经验带来的决策准确性收益很小。
    source_heading: 6.2 传统医学教育的失败
  - term: 5. 替代解释与校正
    meaning: 研究需要病例组合校正；真正证明训练方法还需对低技能者实施训练并观察患者结果。
    source_heading: 5. 替代解释与校正
  - term: 十二、复习问题
    meaning: 选择你熟悉的一项工作，设计一个保留关键约束、删除真实风险、包含决策点和即时反馈的最小训练场景。
    source_heading: 十二、复习问题
