overview:
  kind: summary
  minutes: 10
  question: 原文围绕「1. 本章要解决的问题」建立了怎样的核心认识？
  question_source: 1. 本章要解决的问题
  thesis: 本章第一次把深度学习的核心矛盾完整展开：非线性复合赋予 MLP 强大表示能力，计算图和反向传播使其可训练，但同一复合也造成梯度尺度与内存问题；过参数化让训练集易于插值，却使经典泛化直觉失效，因此初始化、优化轨迹、正则化和数据验证必须共同决定最终解。Kaggle
    房价案例进一步表明，真正完整的深度学习工作不是只搭网络，而是从数据生成机制、预处理和指标，到交叉验证、集成与部署格式的全流程推理。
  thesis_source: 14. 核心结论与一般解题方法
  concepts:
  - term: 1. 本章要解决的问题
    meaning: 自动微分让代码变短，却没有消除理解梯度、内存和初始化的必要性。模型一旦比线性回归更灵活，训练损失下降不再是最困难的部分；稳定优化和未见数据表现成为核心。
    source_heading: 1. 本章要解决的问题
  - term: 3. 激活函数
    meaning: 仿射函数连续且线性；ReLU 是两个线性分支的连续拼接。固定所有 ReLU 的开/关模式后，整个网络只是若干仿射变换的复合，因此在该输入区域内为仿射函数。输入跨过某个预激活为零的超平面时，激活模式改变，切换到另一个仿射片段。
    source_heading: 3. 激活函数
  - term: 6. 数值稳定与参数初始化
    meaning: 同一隐藏层神经元可任意置换，只要下一层对应权重也置换，网络函数不变。若所有隐藏单元权重初始化成同一常数，它们接收相同输入，产生相同激活，得到相同梯度，更新后仍完全相同。宽度为
      h 的层事实上退化成一个重复单元。
    source_heading: 6. 数值稳定与参数初始化
  - term: 7. 深度学习中的泛化
    meaning: 类似地，神经网络的架构、特征几何和训练动力学决定插值方式。无限宽 MLP 在某些极限下与神经切线核（NTK）方法等价，为分析提供工具；但该极限不能完全解释有限宽、特征会显著学习的现代网络。
    source_heading: 7. 深度学习中的泛化
  - term: 10. 可运行的综合实验
    meaning: 下面的 PyTorch 代码不下载外部数据，验证本章最关键的机制：线性网络无法解决 XOR，ReLU MLP 可以；手推反向传播与 autograd
      一致；Xavier 初始化控制信号尺度；倒置 dropout 保持期望并产生理论方差；训练/评估模式正确切换 dropout；对数误差对应相对比例。
    source_heading: 10. 可运行的综合实验
  - term: 14. 核心结论与一般解题方法
    meaning: 本章第一次把深度学习的核心矛盾完整展开：非线性复合赋予 MLP 强大表示能力，计算图和反向传播使其可训练，但同一复合也造成梯度尺度与内存问题；过参数化让训练集易于插值，却使经典泛化直觉失效，因此初始化、优化轨迹、正则化和数据验证必须共同决定最终解。Kaggle
      房价案例进一步表明，真正完整的深度学习工作不是只搭网络，而是从数据生成机制、预处理和指标，到交叉验证、集成与部署格式的全流程推理。
    source_heading: 14. 核心结论与一般解题方法
  logic:
  - 1. 本章要解决的问题
  - 3. 激活函数
  - 5. 前向传播、反向传播与计算图
  - 7. 深度学习中的泛化
  - 8. Dropout
  - 12. 原章重要练习的推导与延伸
