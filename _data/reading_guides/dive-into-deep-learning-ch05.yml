  sections:
  - title: 1. 本章要解决的问题
    source_heading: 1. 本章要解决的问题
    paragraphs:
    - 泛化：参数远多于样本、甚至能记住随机标签的网络为什么仍可能泛化？
    - 正则化：怎样通过 early stopping、权重衰减和 dropout 改变模型偏好？
    - 完整实践：面对混合类型、缺失值和隐藏测试标签的真实表格数据，怎样选择模型并提交预测？
    - 自动微分让代码变短，却没有消除理解梯度、内存和初始化的必要性。模型一旦比线性回归更灵活，训练损失下降不再是最困难的部分；稳定优化和未见数据表现成为核心。
  - title: 2. 多层感知机
    source_heading: 2. 多层感知机
    paragraphs:
    - 决策树、核方法和样条也能处理非线性。MLP 的独特路线是把许多简单可微变换组合起来，并用最终任务损失联合学习所有中间表示。
    - 隐藏层可看成学习表示，输出层在该表示上完成回归或分类。激活函数通常加在隐藏层；多类分类输出层返回 logits，再由融合交叉熵处理 softmax，不应在隐藏层随意使用
      softmax。
    - 一些通用逼近结果表明：在适当激活函数和条件下，单隐藏层网络只要足够宽，就能在紧致区域上以任意精度逼近广泛的连续函数。
    - "“C 语言能表达任何可计算程序”不代表任何程序都容易写。类似地，通用逼近是表达能力结论，不是训练算法或模型选择指南。很多函数可由深层网络比单层超宽网络更紧凑地表示；某些任务中核方法又可能更直接。"
  - title: 3. 激活函数
    source_heading: 3. 激活函数
    paragraphs:
    - 局限是死亡 ReLU：若某单元对所有样本的预激活长期为负，其输出和局部梯度均为零，可能无法恢复。过大学习率、偏置和不当初始化会加剧问题。
    - 这些函数允许部分负值平滑通过，在某些架构中精度优于 ReLU，但计算更贵，效果依赖模型和训练配方。激活选择不是脱离初始化、归一化和任务的独立竞赛。
    - 仿射函数连续且线性；ReLU 是两个线性分支的连续拼接。固定所有 ReLU 的开/关模式后，整个网络只是若干仿射变换的复合，因此在该输入区域内为仿射函数。输入跨过某个预激活为零的超平面时，激活模式改变，切换到另一个仿射片段。
    - 有限 ReLU MLP 因而表示连续分段线性函数。深度可以组合并复用折点，用较少单元形成大量线性区域，但“区域数多”仍不自动等于泛化好。
  - title: 5. 前向传播、反向传播与计算图
    source_heading: 5. 前向传播、反向传播与计算图
    paragraphs:
    - 反向传播是反向模式自动微分在神经网络计算图上的高效实现。它从标量目标 J 开始，按反拓扑顺序应用链式法则，把每条后继路径的梯度贡献累加到前驱。
    - 批量训练时，对样本外积求和或平均；偏置梯度沿批量轴归约。计算图中某变量被多条路径使用时，其梯度是各路径贡献之和，这就是自动微分需要梯度累加的原因。
    - 若分别对每个参数从头应用链式法则，会反复计算相同子表达式。反向传播保存每个节点的上游梯度并复用它，计算一次标量损失对全部参数的梯度，时间通常与若干次前向同一数量级。
    - 反向必须使用产生当前损失时的参数和中间量。若在反向前原地改参数或激活，梯度就不再对应原计算；框架通常通过版本计数报错。
  - title: 6. 数值稳定与参数初始化
    source_heading: 6. 数值稳定与参数初始化
    paragraphs:
    - 同一隐藏层神经元可任意置换，只要下一层对应权重也置换，网络函数不变。若所有隐藏单元权重初始化成同一常数，它们接收相同输入，产生相同激活，得到相同梯度，更新后仍完全相同。宽度为
      h 的层事实上退化成一个重复单元。
    - Xavier 的简单推导忽略非线性。ReLU 对近似对称输入会把约一半负值置零，使二阶矩下降；Kaiming/He 初始化常取
    - 以补偿 ReLU 门控。Tanh/sigmoid 更常配 Xavier。真实网络还受相关性、偏置、归一化、残差连接和有限宽度影响，因此初始化是有效启发式，不是严格保持每层分布的保证。
    - 框架默认初始化对中等规模网络通常可用；极深、共享参数、序列或生成模型可能需要专用方案。初始化与架构、激活和优化器必须整体考虑。
  - title: 7. 深度学习中的泛化
    source_heading: 7. 深度学习中的泛化
    paragraphs:
    - 机器学习用优化器降低训练损失，但目标是总体分布上的预测。深度网络在视觉、语言、推荐、医疗和博弈中表现出惊人泛化；然而为何易于优化、为何高度过参数化仍能泛化，目前没有统一完整理论。
    - 因此“参数越多越过拟合”“只要不能把训练集拟合完才会泛化”都不成立。VC 维和 Rademacher 复杂度等最坏情况界往往无法解释实际网络为何用远少于理论要求的数据泛化。
    - 深度网络有固定参数文件，形式上是参数模型；但其有效复杂度常随数据和模型规模增长，并在过参数化区域精确插值训练数据，这与非参数方法有相似之处。
    - 类似地，神经网络的架构、特征几何和训练动力学决定插值方式。无限宽 MLP 在某些极限下与神经切线核（NTK）方法等价，为分析提供工具；但该极限不能完全解释有限宽、特征会显著学习的现代网络。
  - title: 8. Dropout
    source_heading: 8. Dropout
    paragraphs:
    - 好模型应对无关小扰动保持稳定。例如图像像素加入少量噪声，不应改变类别。Bishop 证明，在某些线性模型设定中，训练时加入高斯输入噪声等价于 Tikhonov
      正则化，连接了抗扰动与函数平滑性。
    - Dropout 把噪声推进隐藏层：训练每次前向随机丢弃一部分激活，迫使后续层不能依赖某个固定激活组合。原论文称这种依赖为“共同适应（co-adaptation）”。该解释是直觉而非完整理论，方法本身却长期有效。
    - 这可视为共享参数的大量随机子网络训练，测试时用完整网络的尺度匹配近似集成。该“模型平均”解释是启发式，非线性网络的完整测试输出不严格等于所有子网络输出平均。
    - Dropout 通常放在隐藏激活后，而不放在最终 logits 后。靠近输入层常使用较低丢弃率，因为原始特征被破坏后的恢复空间较小；这只是经验规则，最佳概率依赖宽度、数据量和其他正则化。
  - title: 10. 可运行的综合实验
    source_heading: 10. 可运行的综合实验
    paragraphs:
    - 下面的 PyTorch 代码不下载外部数据，验证本章最关键的机制：线性网络无法解决 XOR，ReLU MLP 可以；手推反向传播与 autograd 一致；Xavier
      初始化控制信号尺度；倒置 dropout 保持期望并产生理论方差；训练/评估模式正确切换 dropout；对数误差对应相对比例。
    - XOR 的四个象限不能由一条直线分开，线性分类器接近随机，而 ReLU 隐藏层学到分段线性边界；
    - MLP 只改变模型，交叉熵和优化循环与线性分类完全相同；
  - title: 12. 原章重要练习的推导与延伸
    source_heading: 12. 原章重要练习的推导与延伸
    paragraphs:
    - 同一输入放入不同批次会得到不同预测；
    - Batch normalization 正是批量相关操作，但通过训练/评估模式、运行统计量和同步方案管理这些问题。
    - 训练还需梯度、优化器状态和反向中间量；Adam 常为每个参数再保存一阶、二阶矩。预测可逐层释放中间激活，因此峰值通常显著较低。
    - 称为 DropConnect 类方法。激活 dropout 对同一单元输出整体置零；权重 dropout 独立破坏连接，噪声粒度更细，矩阵实现和方差结构不同。
  - title: 14. 核心结论与一般解题方法
    source_heading: 14. 核心结论与一般解题方法
    paragraphs:
    - ReLU 简单且正半轴梯度稳定，是常见隐藏激活；sigmoid/tanh 会饱和，但在概率输出和门控中仍有明确用途。
    - 随机初始化打破隐藏单元对称，Xavier/He 等方法依据 fan-in、fan-out 和激活控制信号方差。
    - Early stopping、权重衰减和 dropout 既可能限制有效复杂度，也可能通过优化动力学选择更合适的插值解。
    - 本章第一次把深度学习的核心矛盾完整展开：非线性复合赋予 MLP 强大表示能力，计算图和反向传播使其可训练，但同一复合也造成梯度尺度与内存问题；过参数化让训练集易于插值，却使经典泛化直觉失效，因此初始化、优化轨迹、正则化和数据验证必须共同决定最终解。Kaggle
      房价案例进一步表明，真正完整的深度学习工作不是只搭网络，而是从数据生成机制、预处理和指标，到交叉验证、集成与部署格式的全流程推理。
  takeaways:
  - 线性模型无法自动表达非单调和上下文相关规律；隐藏层的职责是从数据学习表示。
  - 深层梯度包含 Jacobian 长乘积，局部尺度不当会造成梯度消失、爆炸和病态优化。
  - 写清每层形状：输入宽度、隐藏宽度、输出宽度和参数量是否符合任务？
  - 分离优化与泛化：训练损失降不下去先解决优化；训练好而验证差再处理过拟合。
  - 本章第一次把深度学习的核心矛盾完整展开：非线性复合赋予 MLP 强大表示能力，计算图和反向传播使其可训练，但同一复合也造成梯度尺度与内存问题；过参数化让训练集易于插值，却使经典泛化直觉失效，因此初始化、优化轨迹、正则化和数据验证必须共同决定最终解。Kaggle
    房价案例进一步表明，真正完整的深度学习工作不是只搭网络，而是从数据生成机制、预处理和指标，到交叉验证、集成与部署格式的全流程推理。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.1 隐藏层与非线性」？
  answer: 隐藏层只是中间计算层；若没有非线性，多层仿射变换仍等价于一层。表达力增长来自“层 + 非线性”的组合，不来自层数标签本身。
  source_heading: 11.1 隐藏层与非线性
- level: 概念辨析
  question: 原文如何解释「11.6 Sigmoid 隐藏层与 sigmoid 输出层」？
  answer: Sigmoid 在深层隐藏层易饱和，并不意味着它不能用于二元概率输出和门控。位置和语义不同。
  source_heading: 11.6 Sigmoid 隐藏层与 sigmoid 输出层
- level: 概念辨析
  question: 原文如何解释「11.12 随机初始化与随机模型」？
  answer: 随机初始化用于打破对称并控制尺度，训练后模型仍由数据和优化决定。固定随机种子帮助复现，却不证明结果对其他种子稳定。
  source_heading: 11.12 随机初始化与随机模型
- level: 概念辨析
  question: 原文如何解释「11.17 Early stopping 与训练失败」？
  answer: Early stopping 是根据验证表现选择训练轨迹上的参数，不是因为“优化器做不到继续下降”。应保存并恢复最佳检查点。
  source_heading: 11.17 Early stopping 与训练失败
- level: 概念辨析
  question: 原文如何解释「11.25 交叉验证与最终测试」？
  answer: 交叉验证用于模型选择和误差估计，官方隐藏测试用于最终外部评估。反复根据排行榜调参会把排行榜变成验证集。
  source_heading: 11.25 交叉验证与最终测试
