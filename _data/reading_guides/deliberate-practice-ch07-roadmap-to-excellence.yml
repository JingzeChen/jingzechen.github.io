  question: 一、本章要解决什么问题？
  question_source: 一、本章要解决什么问题
  thesis: 杰出表现通常不是突然显露的天赋，而是一个长期发展的结果：早期玩耍和关系支持产生兴趣；适龄导师把兴趣转成训练习惯；技能、身份和内部动机增强后，学习者承担更高强度的刻意练习；进入前沿后，再借助已形成的心理表征、实验能力和长期专注探索未知。
  thesis_source: 一、本章要解决什么问题
  concepts:
  - term: 一、本章要解决什么问题
    meaning: 杰出表现通常不是突然显露的天赋，而是一个长期发展的结果：早期玩耍和关系支持产生兴趣；适龄导师把兴趣转成训练习惯；技能、身份和内部动机增强后，学习者承担更高强度的刻意练习；进入前沿后，再借助已形成的心理表征、实验能力和长期专注探索未知。
    source_heading: 一、本章要解决什么问题
  - term: 4.1 杰出人物成长三阶段
    meaning: 并非所有孩子都应过早专门化。许多领域可先接触多种运动、乐器、书籍和制作活动，再根据持续兴趣和反应选择。广泛探索还可减少过用伤病和身份过早锁定。
    source_heading: 4.1 杰出人物成长三阶段
  - term: 七、年龄与适应能力的关系
    meaning: 不同能力依赖不同系统：骨骼、肌腱、速度、听觉、语言、知识和策略的敏感期不同。不能用一个“最佳学习年龄”概括所有技能。
    source_heading: 七、年龄与适应能力的关系
  - term: 八、成年人也可培养出完美音高
    meaning: 完美音高长期被视为必须在儿童早期获得的能力。如果成年人能显著培养，它会直接挑战“错过窗口便绝不可能”的二元观。
    source_heading: 八、成年人也可培养出完美音高
  - term: 1. “奈杰尔效应”是什么
    meaning: 心理学家用“奈杰尔效应”描述：一个人做出此前被视为不可能的表现后，其他从业者会更新对可达上限的判断并加快追赶。
    source_heading: 1. “奈杰尔效应”是什么
  - term: 十四、复习问题
    meaning: 选择一个你熟悉的领域，分别写出四个阶段的目标、导师、动机、资源、进入条件和退出风险。
    source_heading: 十四、复习问题
