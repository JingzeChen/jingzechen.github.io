overview:
  kind: summary
  minutes: 13
  question: 原文围绕「0. 本章定位与阅读主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与阅读主线
  thesis: MCP 提供工具能力，A2A 可承载治理 decision/artifact，LangGraph 管理状态/HITL；领域 executor 才执行最终权限和事务。
  thesis_source: 24. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与阅读主线
    meaning: 第 5 章用合同、重试、检查点和 MCP 解决“数据与工具接口怎样可靠”。第 6 章继续追问更危险的问题：即使一个调用格式完全合法，Agent
      是否应该被允许执行它？即使工具在 allowlist 中，连续组合这些工具会不会越过意图边界？即使调用经过审批，模型生成的代码又应在哪里运行？
    source_heading: 0. 本章定位与阅读主线
  - term: 4. 结构化 GovernancePolicy：从散落规则到机器可判定政策
    meaning: 后者不是说 discovery 永远危险，而是为 capability escalation 增加新的授权/run 边界。下一 run 可以基于已审计
      discovery artifact 使用预批准能力。
    source_heading: 4. 结构化 GovernancePolicy：从散落规则到机器可判定政策
  - term: 9. Sandboxing Agent Execution：三个互补维度
    meaning: 通过 container、syscall sandbox 或 VM/microVM 把进程、filesystem、network、kernel
      surface 与 host/其他 tenant 隔离，目标是 code 出错或被利用时限制 blast radius。
    source_heading: 9. Sandboxing Agent Execution：三个互补维度
  - term: 12. UI 与执行层分离
    meaning: Streamlit 等 UI 需要 session state、长进程、上传文件和用户交互；execution runtime 应尽可能
      read-only、短命、无直接 secret。把二者放在同一 process/filesystem，会让 UI 漏洞直接触达 Agent credentials
      与执行能力。
    source_heading: 12. UI 与执行层分离
  - term: 17. 生成 Monty Program 的合同
    meaning: Bare expression 让 interpreter 返回 value，避免 program 自行 print/写文件。但最终 value
      仍需 output schema、size/depth/type validation，防巨大 nested object 或敏感 tool result
      直接出站。
    source_heading: 17. 生成 Monty Program 的合同
  - term: 24. 本章知识结构与核心结论
    meaning: 可迁移的一般方法是：先区分模型提出行动与系统拥有能力；消除所有旁路，把权限集中到单一执行点；用状态化 policy 和原子预算约束组合行为；再按代码可信度分配隔离层；即使在最深
      sandbox 中，外部副作用仍回到宿主侧逐次治理。
    source_heading: 24. 本章知识结构与核心结论
  logic:
  - 0. 本章定位与阅读主线
  - 4. 结构化 GovernancePolicy：从散落规则到机器可判定政策
  - 7. Restricted Tools 的 HITL Gate
  - 12. UI 与执行层分离
  - 14. 云端 Ephemeral Coding Sandbox
  - 19. 逐个暂停外部函数：Interpreter 与 Governor 合并
  - 24. 本章知识结构与核心结论
  sections:
  - title: 0. 本章定位与阅读主线
    source_heading: 0. 本章定位与阅读主线
    paragraphs:
    - 第 5 章用合同、重试、检查点和 MCP 解决“数据与工具接口怎样可靠”。第 6 章继续追问更危险的问题：即使一个调用格式完全合法，Agent 是否应该被允许执行它？即使工具在
      allowlist 中，连续组合这些工具会不会越过意图边界？即使调用经过审批，模型生成的代码又应在哪里运行？
    - 协议与控制面：把 tool request 从模型 reasoning channel 中抽离，用 A2A artifacts/task states、policy、budget、argument
      gate 和 HITL 决定是否执行。
    - 程序化工具调用：让模型生成小型 orchestration program，以减少模型 round trips；代码在 deny-by-default
      interpreter 中执行，每个 host function call 仍暂停并经过 allowlist 和 budget。
    - 本章开头暂不展开恶意用户和 prompt injection 等外部攻击，而聚焦“Agent 因规划错误、过度帮助或能力组合而越界”。到了 programmatic
      tool calling，外部输入会被翻译成可执行代码，prompt injection 自然重新进入威胁范围。
  - title: 3.1 PRP 与 PRD 的关系
    source_heading: 3.1 PRP 与 PRD 的关系
    paragraphs:
    - library/runtime 版本；
    - 邻近代码和既有 pattern；
    - executable validation commands；
  - title: 4. 结构化 GovernancePolicy：从散落规则到机器可判定政策
    source_heading: 4. 结构化 GovernancePolicy：从散落规则到机器可判定政策
    paragraphs:
    - SEPARATION_POLICY 允许 discovery 和 execution 两种类别，但禁止在同一个 run 中先后完成二者，切断“发现新能力后立即
      pivot 执行”的路径。
    - 后者不是说 discovery 永远危险，而是为 capability escalation 增加新的授权/run 边界。下一 run 可以基于已审计
      discovery artifact 使用预批准能力。
    - Phase flag 必须存在于 durable task state，否则重启或多 worker 并发会丢失 separation 历史。
    - Allowlist 只控制 artifact 类型，还应验证每类 payload schema、大小、敏感字段和 audience。
  - title: 7. Restricted Tools 的 HITL Gate
    source_heading: 7. Restricted Tools 的 HITL Gate
    paragraphs:
    - 人不能覆盖 forbidden policy、无权限、参数非法或预算耗尽。这样避免把审批者当作万能 root override。
    - 构造含 tool、arguments、rationale、timestamp 的 approval payload；
    - 若人编辑 arguments，产生新 request hash 并按新参数重新验证；不能把对 A 的批准应用到 B。
    - 否则旧批准可在环境已经变化后继续执行。Approval event 和 resume event 应进入 A2A artifacts 与 immutable
      audit log。
  - title: 9. Sandboxing Agent Execution：三个互补维度
    source_heading: 9. Sandboxing Agent Execution：三个互补维度
    paragraphs:
    - 通过 container、syscall sandbox 或 VM/microVM 把进程、filesystem、network、kernel surface
      与 host/其他 tenant 隔离，目标是 code 出错或被利用时限制 blast radius。
    - Agent 不直接执行代码，只提交 typed execution request；服务在 Agent 进程外实施 policy、budget、timeout、approval
      和 audit，再返回 typed result。
    - 它们是累积防线而非三选一：高风险模型代码可以通过 Governor 进入一次性 microVM，并在 VM 内再用 capability-scoped
      interpreter。
    - 不能只按启动速度选择 sandbox；要考虑 host compromise、tenant escape、network egress、secret exposure
      和 artifact trust。
  - title: 12. UI 与执行层分离
    source_heading: 12. UI 与执行层分离
    paragraphs:
    - Streamlit 等 UI 需要 session state、长进程、上传文件和用户交互；execution runtime 应尽可能 read-only、短命、无直接
      secret。把二者放在同一 process/filesystem，会让 UI 漏洞直接触达 Agent credentials 与执行能力。
    - Browser 不持有 API keys，也不直接访问 executor；FastAPI 提供 start run、approve action、retrieve
      artifact 等最小 surface。
    - browser→UI 与 UI→API authentication；
    - 原图把 Streamlit 与 FastAPI 放在同一 Docker 中可改善进程 API 边界，但共享 kernel/filesystem/namespace
      时隔离强度有限。高风险 executor 应独立容器/VM/network identity。
  - title: 14. 云端 Ephemeral Coding Sandbox
    source_heading: 14. 云端 Ephemeral Coding Sandbox
    paragraphs:
    - 当 Agent 生成任意代码、安装依赖、使用多语言、处理不可信文件或并行执行时，本地 embedded runtime 可能不够。E2B、Runloop、Daytona
      等提供 per-run isolated environment，通过 SDK 提交代码并收结果。
    - 任务要求先用 Tavily 搜索 2025 美国 CPI inflation time series，再用 code interpreter 画有标题和坐标轴的图，最后一步必须是
      Python tool call。
    - 配套 notebook 中 Agent A 生成 200 行 synthetic data 并拟合 linear regression；Agent B
      获取 artifact，绘制前 20 points 和 fitted line。
    - 选 provider 应看 isolation architecture、egress、region、identity、logs、cleanup SLA
      和 incident response，不只看 SDK 简单。
  - title: 17. 生成 Monty Program 的合同
    source_heading: 17. 生成 Monty Program 的合同
    paragraphs:
    - 这里 prompt 帮助模型生成兼容程序，但真正 enforcement 来自 interpreter capability surface。
    - 给模型的 docs 应与 runtime 注入的 tools 由同一 registry 生成，避免文档/能力漂移。Doc 需写：参数 schema、单位、limits、side
      effects、error semantics；但 credentials 永不放 docs。
    - 即使 prompt 只列两个 functions，host runtime 仍要 allowlist；不能相信模型只使用所列名称。
    - Bare expression 让 interpreter 返回 value，避免 program 自行 print/写文件。但最终 value 仍需
      output schema、size/depth/type validation，防巨大 nested object 或敏感 tool result 直接出站。
  - title: 19. 逐个暂停外部函数：Interpreter 与 Governor 合并
    source_heading: 19. 逐个暂停外部函数：Interpreter 与 Governor 合并
    paragraphs:
    - Host loop 检查 function name 和 budget，再提供 return value 或 exception。
    - 这实现“local control flow 在 sandbox，privileged effect 在 host”。
    - 但要限制无限捕获重试：每次 denied attempt 也计入 attempt budget；重复同一 call signature 可提前终止。
    - 反序列化不可信 bytes 本身可能危险；使用 interpreter 官方安全格式、签名/encryption 和版本检查。Resume 前重验 request
      与当前 policy。
  - title: 24. 本章知识结构与核心结论
    source_heading: 24. 本章知识结构与核心结论
    paragraphs:
    - MCP 提供工具能力，A2A 可承载治理 decision/artifact，LangGraph 管理状态/HITL；领域 executor 才执行最终权限和事务。
    - Path canonicalization 阻止常见 traversal，但 production 还需 no-follow、原子文件操作和 OS sandbox
      防 race。
    - 每个 external function 仍在 host pause point 经过 allowlist、args、authz、budget、approval
      和 audit。
    - 可迁移的一般方法是：先区分模型提出行动与系统拥有能力；消除所有旁路，把权限集中到单一执行点；用状态化 policy 和原子预算约束组合行为；再按代码可信度分配隔离层；即使在最深
      sandbox 中，外部副作用仍回到宿主侧逐次治理。
  takeaways:
  - 可预测输出不等于安全执行；合法 tool call 仍可能超出角色、预算或组合意图。
  - 所有高权限调用经过唯一 bottleneck；Agent 进程不能持有旁路 credentials/session。
  - Programmatic tool calling 用一次程序生成代替多次模型 round trips，减少 context/latency，但提升为代码执行风险。
  - 把散落要求变成 versioned policy、phase 和 live budget；
  - 可迁移的一般方法是：先区分模型提出行动与系统拥有能力；消除所有旁路，把权限集中到单一执行点；用状态化 policy 和原子预算约束组合行为；再按代码可信度分配隔离层；即使在最深
    sandbox 中，外部副作用仍回到宿主侧逐次治理。
