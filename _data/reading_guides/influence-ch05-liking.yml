overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 导读：第五章要解决的核心问题」建立了怎样的核心认识？
  question_source: 0. 导读：第五章要解决的核心问题
  thesis: 成熟的做法是允许自己喜欢人，同时坚持对事另作判断。一个销售员可以很讨喜，一项交易仍可拒绝；一个朋友值得珍惜，其推荐仍应核实；一次愉快合作可以保留，但未来合同仍要按条款决定。这样，好感就不会成为偷走判断力的“友好窃贼”。
  thesis_source: 59. 本章总结：知识结构、核心结论与一般方法
  concepts:
  - term: 0. 导读：第五章要解决的核心问题
    meaning: "“我们更愿意答应认识和喜欢的人”并不令人意外。真正值得研究的是：陌生的顺从专家怎样快速制造、借用或转移好感，使一项原本需要按事实判断的请求，搭上人与人之间的温情？"
    source_heading: 0. 导读：第五章要解决的核心问题
  - term: 13. 司法判断中的外貌偏差
    meaning: 研究者在开庭前给 74 名男性被告的外表魅力评分，之后核对判决记录。原书报告：有魅力被告避免入狱的概率，是缺乏魅力被告的 2 倍。
    source_heading: 13. 司法判断中的外貌偏差
  - term: 27. 谢里夫夏令营：分组和竞争怎样迅速制造敌意
    meaning: 出生于土耳其的社会心理学家穆扎费尔·谢里夫（Muzafer Sherif）及同事在男生夏令营研究群体冲突。孩子不知道自己参与实验，研究者系统改变社会环境并观察关系。
    source_heading: 27. 谢里夫夏令营：分组和竞争怎样迅速制造敌意
  - term: 33. 顺从专家怎样制造“我们站在同一边”
    meaning: 作者在汽车经销店卧底时观察到，销售员通常早已知道最低报价。他进入经理办公室后，可能只是喝饮料或抽烟，经理照常工作；过一段时间，销售员松开领带、装出疲惫，带着原本就准备好的价格回来。
    source_heading: 33. 顺从专家怎样制造“我们站在同一边”
  - term: 47. 沾染荣耀：胜利后为什么更多学生穿校队服
    meaning: 作为补充术语，这种公开连接成功者、分享反射荣耀的行为常称 BIRG（basking in reflected glory，沾染反射的荣耀）。
    source_heading: 47. 沾染荣耀：胜利后为什么更多学生穿校队服
  - term: 60.3 三步防御
    meaning: 核查：匿名化条款，比较证据、价格、风险和替代方案。
    source_heading: 60.3 三步防御
