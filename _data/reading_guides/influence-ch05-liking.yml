- level: 概念辨析
  question: 原文如何解释「58.11 误区十一：合作就是让双方坐在一起」？
  answer: 在本章的群际冲突与课堂案例中，共同目标和相互依赖是改善关系的有效设计条件；单纯让双方同处一室而不改变竞争结构，可能继续加深敌意。这不是对一切合作的必要条件定义：销售员和好警察案例还表明，哪怕只是制造“站在同一边”的知觉，也可能提高好感。
  source_heading: 58.11 误区十一：合作就是让双方坐在一起
