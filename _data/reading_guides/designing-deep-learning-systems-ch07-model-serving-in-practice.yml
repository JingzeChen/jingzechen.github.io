  question: 原文围绕「本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 本章要回答的核心问题
  thesis: TensorFlow Serving 的核心是 Servable lifecycle 与 SavedModel；TorchServe 的核心是
    MAR、handler 和 management API；Triton 的核心是多 backend、scheduler/batching 和 ModelConfig；KServe
    的核心是 Kubernetes serving abstraction 与协议。
  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 本章原代码以教学片段为主，包含省略号、排印错误和成书时 API。本文会按原章意图解释代码，并在必要处给出语法完整的伪代码或现代工程边界；不会把整理后的代码冒充原书可直接运行版本。TorchServe、KServe、Triton
      等项目能力和维护状态具有时效性，实际选型必须以目标版本文档、许可证和支持策略为准。
    source_heading: 本章要回答的核心问题
  - term: 7.2 TorchServe Model Server 样例
    meaning: 原章说无需编写 predictor service code，强调不用重造 HTTP/gRPC server、worker 与 model
      lifecycle。但复杂模型仍需 handler，且 handler 本身包含 architecture、preprocess、inference、postprocess。工作从平台服务代码移到可部署模型包。
    source_heading: 7.2 TorchServe Model Server 样例
  - term: 7.4 开源 Model Serving 工具巡览
    meaning: NVIDIA Triton 是面向 CPU / GPU、cloud / data center / edge 的多 backend inference
      server。原章强调它比 TensorFlow Serving / TorchServe 覆盖更多 frameworks，例如 TensorFlow、TensorRT、PyTorch、ONNX、XGBoost。
    source_heading: 7.4 开源 Model Serving 工具巡览
  - term: 7.5 发布模型
    meaning: Rollback 也要 preload / readiness、原子 routing 和 cache invalidation。若 v2
      改变 input schema 或 application behavior，模型 pointer rollback 可能不够，需要兼容 API / feature
      rollout。
    source_heading: 7.5 发布模型
  - term: 核心结论
    meaning: TensorFlow Serving 的核心是 Servable lifecycle 与 SavedModel；TorchServe 的核心是
      MAR、handler 和 management API；Triton 的核心是多 backend、scheduler/batching 和 ModelConfig；KServe
      的核心是 Kubernetes serving abstraction 与协议。
    source_heading: 核心结论
