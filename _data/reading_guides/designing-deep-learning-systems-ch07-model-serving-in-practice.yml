checks:
- level: 概念辨析
  question: 原文如何解释「1. Frontend 与 Predictor API 字段相同，就应该共享同一个 Contract」？
  answer: 错误。Frontend 面向业务稳定性，predictor 面向执行协议；今天字段相同只是样例简化，未来 batch、tensor、认证和错误语义会独立演进。
  source_heading: 1. Frontend 与 Predictor API 字段相同，就应该共享同一个 Contract
- level: 概念辨析
  question: 原文如何解释「16. .mar 只是重命名后的 model.pth」？
  answer: 错误。MAR 还包含 TorchServe manifest、handler、extra files 和 runtime metadata，是完整
    model package。
  source_heading: 16. .mar 只是重命名后的 model.pth
- level: 概念辨析
  question: 原文如何解释「30. SavedModel 只有一个 saved_model.pb」？
  answer: 错误。还可能包含 variables、assets 和 signatures；完整 version directory 才是可加载 package。
  source_heading: 30. SavedModel 只有一个 saved_model.pb
- level: 概念辨析
  question: 原文如何解释「45. 更新 PROD Lookup Pointer 自动等于安全 Canary」？
  answer: 错误。单 pointer 通常是全量切换。Canary / A/B 还要 traffic policy、stable assignment 和
    metrics gate。
  source_heading: 45. 更新 PROD Lookup Pointer 自动等于安全 Canary
- level: 概念辨析
  question: 原文如何解释「58. Release 和 Monitoring 是系统建完后再补的 Operations 细节」？
  answer: 错误。没有 model version、request trace、alias、readiness 和 metrics hook，后续无法安全补齐生产闭环。
  source_heading: 58. Release 和 Monitoring 是系统建完后再补的 Operations 细节
