  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Interactor 通过 Output Boundary 调用 Presenter；
    - Presenter 把 Output Data 转换为 ViewModel；
    - 如果业务判断、格式化、状态决策都混在这些边界代码里，大量重要行为就只能依靠缓慢、脆弱的集成测试验证。
    - Use Case Interactor 与 Database Gateway；
  - title: 2.7 按钮名称与启用状态
    source_heading: 2.7 按钮名称与启用状态
    paragraphs:
    - Enabled Boolean；
    - Visible Boolean；
  - title: 3. Testing and Architecture
    source_heading: 3. Testing and Architecture
    paragraphs:
    - Use Case / Database Gateway；
    - Application / Service Listener；
    - Core / File System Adapter。
    - Humble Object Pattern 不消灭外层测试，而是改变测试数量分布。
  - title: 5.4 这个论断应怎样理解
    source_heading: 5.4 这个论断应怎样理解
    paragraphs:
    - Change Tracking；
    - Relation Mapping；
    - 因此，把 ORM 仅描述为“把表装入数据结构”是有意简化、带有作者立场的说法。
    - ORM 属于 Database Detail，不应进入 Entity 和 Use Case。
  - title: 5.8 独立 Persistence Model 的收益
    source_heading: 5.8 独立 Persistence Model 的收益
    paragraphs:
    - 让 Entity 保持业务语言；
    - 控制 Lazy Loading；
  - title: 7.4 本章完整论证链
    source_heading: 7.4 本章完整论证链
    paragraphs:
    - Presenter 准备只含 String、Boolean、Enum 的 ViewModel；
    - View 只把 ViewModel 搬到屏幕，因此保持 Humble；
    - Database Gateway 接口隔离 Use Case 与 SQL；
    - ORM / Data Mapper 留在 Database Layer；
  - title: 8. 作者分析问题的完整思路
    source_heading: 8. 作者分析问题的完整思路
    paragraphs:
    - 作者没有先从抽象分层出发，而是选择一个人人能感知的问题：GUI 难以单元测试。
    - ViewModel 只含展示所需的简单类型，使 View 无需知道业务对象。
    - Database Gateway；
    - 因此，Humble Object 不只是 GUI 技巧，而是架构边界模式。
  - title: 12.1 Presenter / View 检查
    source_heading: 12.1 Presenter / View 检查
    paragraphs:
    - View 是否格式化日期或金额？
    - ViewModel 是否已经包含最终字符串与 Flag？
    - Presenter 是否可以无 GUI 测试？
  - title: 12.5 测试架构检查
    source_heading: 12.5 测试架构检查
    paragraphs:
    - 哪些重要行为只能通过端到端测试覆盖？
    - Humble Object 是否只剩必要机制？
    - Fake 与真实 Adapter 是否共享契约测试？
    - 测试失败能否快速定位到政策或机制？
  - title: 13. 本章总结
    source_heading: 13. 本章总结
    paragraphs:
    - Humble Object Pattern 还出现在 Database Gateway、Data Mapper 和 Service Listener 附近。
    - Interactor 封装应用特定规则，因此不 Humble，但可通过 Stub 和 Fake Gateway 独立测试。
    - ORM / Data Mapper 应留在 Database Layer，而不是 Entity 或 Use Case。
    - ORM Model 与 Domain Entity 合并会带来注解、Lazy Loading、Session 与 Schema 耦合。
  takeaways:
  - 第 23 章解释 Presenter 背后的 Humble Object Pattern，并把它推广到多种架构边界。
  - 按钮名称、启用状态、菜单项、单选框、复选框和文本字段状态都应预先进入 ViewModel。
  - 契约测试可以减少 Fake 与真实 Adapter 语义不一致的风险。
  - 独立 Persistence Model 可保护领域，但也增加 Mapper 与双模型维护成本。
  - 本章最终结论是：把难测试行为缩到最小，把重要政策放进普通可测试模块，会显著提高整个系统的可测试性与边界清晰度。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.2 “Humble Object 必须完全没有逻辑”」？
  answer: 不必绝对化。必要的框架调用、错误转换和简单防御仍可存在，目标是保持最小行为复杂度。
  source_heading: 11.2 “Humble Object 必须完全没有逻辑”
- level: 概念辨析
  question: 原文如何解释「11.5 “Presenter 可以决定业务资格”」？
  answer: 错误。它只能把业务结果转换为展示状态。资格政策属于 Entity / Use Case。
  source_heading: 11.5 “Presenter 可以决定业务资格”
- level: 概念辨析
  question: 原文如何解释「11.9 “所有 CRUD 都应使用一个通用 Gateway”」？
  answer: 错误。Gateway 方法应表达应用需要，避免让 Use Case 拼接查询或取得无关数据。
  source_heading: 11.9 “所有 CRUD 都应使用一个通用 Gateway”
- level: 概念辨析
  question: 原文如何解释「11.12 “ORM 属于领域层，因为它映射对象”」？
  answer: 错误。ORM 与关系表、查询和持久化生命周期有关，应位于 Database Layer。
  source_heading: 11.12 “ORM 属于领域层，因为它映射对象”
- level: 概念辨析
  question: 原文如何解释「11.19 “映射代码都是浪费”」？
  answer: 错误。映射显式终止外层类型，并保护内层政策；只有无边界价值的转发才是浪费。
  source_heading: 11.19 “映射代码都是浪费”
