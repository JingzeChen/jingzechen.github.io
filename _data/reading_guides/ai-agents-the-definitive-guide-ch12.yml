  sections:
  - title: 0. 本章定位与方法主线
    source_heading: 0. 本章定位与方法主线
    paragraphs:
    - Agent 分层模型：organization→model→orchestration→tool→memory→infrastructure；
    - 风险分类/优先级：operational、adversarial、agent-specific、systemic，结合 likelihood/impact
      和业务资产；
    - 运行时防线：trust-aware lexical scanner、Unicode hidden-char detection、signal stacking、gated
      semantic judge、multi-role firewall 与 downstream leakage probe。
    - Agent 安全不是 prompt injection keyword checklist。应评估“谁控制什么输入、模型怎样解释、orchestrator
      怎样放大、工具能产生什么 effect、memory 会将什么长期化”，并确保每层即使上一层失效，仍能阻止或限制不可逆后果。
  - title: 3. Layered Agent Threat Model
    source_heading: 3. Layered Agent Threat Model
    paragraphs:
    - Tool output 回 model，memory 回 model，多 Agents 横向 communication；organization/infrastructure
      贯穿所有层。图是 reasoning scaffold，不是固定 pipeline。
    - 例如 Tool：prevent allowlist/least privilege/HITL；detect audit/DLP/anomaly；respond
      revoke token/idempotent rollback/incident. Threat model 不只列漏洞，要映射 control owner
      和 evidence。
  - title: 6. HITL 也会被 Social Engineering
    source_heading: 6. HITL 也会被 Social Engineering
    paragraphs:
    - Compromised Agent 可用看似专业 rationale 劝人审批“删除 400 条冗余记录”。Approval UI 若只展示模型解释，安全
      gate 会变成攻击界面。
    - exact tool/action/resource/tenant；
    - 模型 rationale 标为 untrusted，不让它隐藏字段。高风险 two-person rule、role separation。
    - 硬违规自动 block，低风险合规自动 allow，仅 restricted escalation。大量审批会让人机械点击。监控 approve/edit/reject
      和 reviewer time。
  - title: 11. Layered Defenses Across Lifecycle
    source_heading: 11. Layered Defenses Across Lifecycle
    paragraphs:
    - Threat model、least privilege、分离 model/executor、typed contracts、memory provenance、sandbox、network
      policy、HITL UX。
    - Unit/control tests、red team、fuzz、threat benchmark、dependency/image scan、attack-chain
      tests。
    - Prompt/tool scanners、authz/budget/DLP、allowlist、interrupt、code sandbox、memory
      write validation、telemetry。
    - Alerts、incident response、credential revoke、memory quarantine/delete、forensics、postmortem、model/policy
      rollback、threat model update。
  - title: 14. System-Level Defense：运行时 Guardrail 的位置
    source_heading: 14. System-Level Defense：运行时 Guardrail 的位置
    paragraphs:
    - tool argument/authorization；
    - memory write governance；
    - red team/monitoring/incident response。
    - Scanner 允许/阻断文本不能证明后续 action 安全；反之 scanner false positive 也会影响 availability/UX。必须以
      threat model 校准。
  - title: 17. Unicode Normalization 与 Hidden Character Detection（例 12-3）
    source_heading: 17. Unicode Normalization 与 Hidden Character Detection（例 12-3）
    paragraphs:
    - NFKC 可能改变合法文本语义/格式，保留 raw 供显示/audit，扫描 normalized；不要把 normalized 无条件写回用户内容。
    - Zero-width、bidi override 等可用于 obfuscation；合法语言/emoji joiner 也可能用 format chars，存在
      false positives。按字符类型/上下文权重，不应所有 hidden char 直接 block。
    - Homoglyph（不同 script）不一定被 NFKC 合并；base64/rot13/spacing/HTML entities/markdown
      comments/tool JSON 需更多 decoder/canonicalization。无限递归 decode 会被 zip bomb/DoS，限制层数/size。
  - title: 20. Main Scan Path（例 12-6）
    source_heading: 20. Main Scan Path（例 12-6）
    paragraphs:
    - 流程：resolve trust→normalize→lexical/structural/stacking/invisible score→uncertain时
      semantic→clamp→audit reason→audit-only或 final allow/HITL/block。
    - Audit mode 不应把 score 2.0 当正常范围；它只是使 base Scanner 不 block。
    - Multi-turn attack 检测需要 cumulative signals/rate/state；单消息 scanner 会漏分散攻击。
    - 记录 trust、top matched rule IDs、lexical/semantic/total、decision、policy/scanner
      version、message hash；不记录完整 secret/attack text到低权限日志。
  - title: 23. Downstream Leakage Probe（例 12-10）
    source_heading: 23. Downstream Leakage Probe（例 12-10）
    paragraphs:
    - 真实 secret 不应进入 test prompt/log；canary token可直接 exact detect。测试环境隔离、token不可用。
    - Allowed + no leak：scanner allow，downstream resisted；
    - 只有攻击被 allow 才 probe，节省成本且不让 blocked内容触达 Agent；但为测 scanner false negative需要明确标
      gold。
    - 真实 API keys 不应给 LLM context；tool executor在模型外持 credentials。Canary测试是故意脆弱 fixture，不应模仿生产。
  - title: 26. Runtime Scanner 的绕过与 DoS 风险
    source_heading: 26. Runtime Scanner 的绕过与 DoS 风险
    paragraphs:
    - Novel language、multilingual、split across turns/tools、images/audio、encrypted/encoded、benign-looking
      function args。Layer with DLP/authz/egress，不期待scanner全懂。
    - 超长 text/复杂 regex catastrophic backtracking、大量 unique uncertain prompts触发 semantic
      calls/cache thrash。限制 size、safe regex/timeouts、rate/budget、pre-filter、bulkhead。
    - 若 semantic cache key忽略 trust/scorer version，攻击者可让同文本低风险结果被高风险 channel复用。完整 key和tenant
      scope。
    - 定义 fail policy和health。高风险 execution/memory write scanner不可用→block/HITL；低风险 content可
      degraded。Observability/alert。
  - title: 30. 本章知识结构与核心结论
    source_heading: 30. 本章知识结构与核心结论
    paragraphs:
    - Trust-aware scanning合理区分developer/tool/untrusted，但trust只能由authenticated server
      context赋予。
    - Synthetic secret downstream probe区分scanner enforcement与model resistance；真实credentials不应进入model
      context。
    - Scanner PASS只支持当前cases/config；真正安全来自failures可观察、effects受限、persistent state可隔离/清理和持续验证。
    - 可迁移的一般方法是：先画资产和信任边界，再追踪不可信数据如何被解释为意图、如何获得能力、如何产生外部effect及长期state；在每一跳放置独立control；用完整系统攻击验证传播是否被切断；将guardrail本身也纳入threat
      model并持续以生产证据更新。
  takeaways:
  - Agent threat model仍以资产、组件、流程、trust boundary和CIA为基础，但必须加入动态intent传播。
  - COMPASS提供迭代scaffolding，但scope、analysis unit、propagation path和owner仍由团队定义。
  - Semantic judge只在lexical不确定区运行可控成本，但会漂移、被注入和故障；高风险fail policy不能统一返回0。
  - 加入model/orchestration/tool/memory层，解释intent如何跨界；
  - 可迁移的一般方法是：先画资产和信任边界，再追踪不可信数据如何被解释为意图、如何获得能力、如何产生外部effect及长期state；在每一跳放置独立control；用完整系统攻击验证传播是否被切断；将guardrail本身也纳入threat
    model并持续以生产证据更新。
