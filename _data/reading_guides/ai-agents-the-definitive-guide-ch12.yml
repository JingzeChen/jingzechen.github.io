  minutes: 13
  question: 原文围绕「0. 本章定位与方法主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与方法主线
  thesis: 可迁移的一般方法是：先画资产和信任边界，再追踪不可信数据如何被解释为意图、如何获得能力、如何产生外部effect及长期state；在每一跳放置独立control；用完整系统攻击验证传播是否被切断；将guardrail本身也纳入threat
    model并持续以生产证据更新。
  thesis_source: 30. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与方法主线
    meaning: 运行时防线：trust-aware lexical scanner、Unicode hidden-char detection、signal
      stacking、gated semantic judge、multi-role firewall 与 downstream leakage probe。
    source_heading: 0. 本章定位与方法主线
  - term: 6. HITL 也会被 Social Engineering
    meaning: 硬违规自动 block，低风险合规自动 allow，仅 restricted escalation。大量审批会让人机械点击。监控 approve/edit/reject
      和 reviewer time。
    source_heading: 6. HITL 也会被 Social Engineering
  - term: 14. System-Level Defense：运行时 Guardrail 的位置
    meaning: Scanner 允许/阻断文本不能证明后续 action 安全；反之 scanner false positive 也会影响 availability/UX。必须以
      threat model 校准。
    source_heading: 14. System-Level Defense：运行时 Guardrail 的位置
  - term: 17. Unicode Normalization 与 Hidden Character Detection（例 12-3）
    meaning: Homoglyph（不同 script）不一定被 NFKC 合并；base64/rot13/spacing/HTML entities/markdown
      comments/tool JSON 需更多 decoder/canonicalization。无限递归 decode 会被 zip bomb/DoS，限制层数/size。
    source_heading: 17. Unicode Normalization 与 Hidden Character Detection（例 12-3）
  - term: 23. Downstream Leakage Probe（例 12-10）
    meaning: 真实 API keys 不应给 LLM context；tool executor在模型外持 credentials。Canary测试是故意脆弱
      fixture，不应模仿生产。
    source_heading: 23. Downstream Leakage Probe（例 12-10）
  - term: 30. 本章知识结构与核心结论
    meaning: 可迁移的一般方法是：先画资产和信任边界，再追踪不可信数据如何被解释为意图、如何获得能力、如何产生外部effect及长期state；在每一跳放置独立control；用完整系统攻击验证传播是否被切断；将guardrail本身也纳入threat
      model并持续以生产证据更新。
    source_heading: 30. 本章知识结构与核心结论
