overview:
  kind: summary
  minutes: 8
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: LDA 用 Dirichlet 先验把文档话题比例和话题词比例变成可共享、可平滑的随机变量；共轭性让折叠 Gibbs 化为“计数加伪计数”的抽样，让变分
    EM 化为“期望计数加先验”的坐标更新，但两种推断仍分别受混合误差与平均场偏差限制。
  thesis_source: 第 20 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 不再把每篇文档的话题比例当成固定参数，而把它视为从 Dirichlet 先验随机生成的隐变量；话题的词分布也使用 Dirichlet 先验。
    source_heading: 0. 本章解决什么问题
  - term: 20.1 狄利克雷分布
    meaning: 若先验与后验属于同一分布族，更新只需修改有限个超参数，不必每次重新求复杂积分，这就是共轭。
    source_heading: 20.1 狄利克雷分布
  - term: 20.3 LDA 的吉布斯抽样算法
    meaning: Gibbs 的目标后验通常多峰且有标签置换对称：任意重排话题编号不改变模型。小语料尤其可能受初始化影响；应运行多条链，检查话题稳定性和后验预测，而不只看某一次最终计数。
    source_heading: 20.3 LDA 的吉布斯抽样算法
  - term: 20.4 LDA 的变分 EM 算法
    meaning: 适用边界：若真实后验强相关或多峰，乘积分布无法准确表达。反向 KL 常偏向覆盖一个高密度模式并低估方差；变分推理速度快，但不是渐近精确抽样。
    source_heading: 20.4 LDA 的变分 EM 算法
  - term: 必须掌握的主线
    meaning: LDA 平均场更新仍是“先验 + 期望计数”。
    source_heading: 必须掌握的主线
  - term: 必须记住的边界
    meaning: 变分 EM 严格保证 ELBO 单调，而非一般情况下的真实证据单调。
    source_heading: 必须记住的边界
