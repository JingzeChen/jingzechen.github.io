  - 必须掌握的主线
  - 必须记住的边界
  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 不再把每篇文档的话题比例当成固定参数，而把它视为从 Dirichlet 先验随机生成的隐变量；话题的词分布也使用 Dirichlet 先验。
    - 平滑：未观察到的词或话题仍有非零概率；
    - 正则化：伪计数抑制短文档过拟合；
  - title: 20.1 狄利克雷分布
    source_heading: 20.1 狄利克雷分布
    paragraphs:
    - 进行 n 次相互独立、类别概率不变的试验，每次结果属于 K 类之一，第 i 类概率为 p_i。令 X_i 为第 i 类出现次数，则
    - 假设边界：给定 p 后各次试验条件独立同分布。词袋 LDA 因而忽略词序。
    - 若先验与后验属于同一分布族，更新只需修改有限个超参数，不必每次重新求复杂积分，这就是共轭。
  - title: 20.2 潜在狄利克雷分配模型
    source_heading: 20.2 潜在狄利克雷分配模型
    paragraphs:
    - 原书说无先验知识可令所有分量为 1，这是合法默认值，但不一定适合稀疏文本。超参数影响很大，应通过经验贝叶斯、验证集或层次先验选择。
    - 无限序列若每个有限子序列都可交换，则称无限可交换。iid 必然无限可交换，反之边缘上不一定独立。
    - 适用边界：自然语言词序显然包含语义，LDA 的可交换性是有意简化，不是语言事实。短语、语法和上下文需 n-gram、HMM、神经主题模型或 Transformer
      等替代。
    - 求和规模指数增长，积分变量又高维，这就是必须使用 Gibbs 或变分推理的根本原因。
  - title: 20.3 LDA 的吉布斯抽样算法
    source_heading: 20.3 LDA 的吉布斯抽样算法
    paragraphs:
    - 这称为折叠 Gibbs 抽样。降低维数相当于 Rao-Blackwell 化，通常比显式抽取概率向量混合更好。
    - 为什么必须先减 1：当前词元的话题未知，计算其条件分布时必须从计数中移除旧指派。否则会让旧话题凭借当前词元给自己加分，破坏正确的 Gibbs 转移核。
    - "【辨析】 式 (20.31)、(20.33) 是后验均值，不是 MAP。若所有后验参数大于 1，Dirichlet MAP 为"
    - Gibbs 的目标后验通常多峰且有标签置换对称：任意重排话题编号不改变模型。小语料尤其可能受初始化影响；应运行多条链，检查话题稳定性和后验预测，而不只看某一次最终计数。
  - title: 20.4 LDA 的变分 EM 算法
    source_heading: 20.4 LDA 的变分 EM 算法
    paragraphs:
    - 适用边界：若真实后验强相关或多峰，乘积分布无法准确表达。反向 KL 常偏向覆盖一个高密度模式并低估方差；变分推理速度快，但不是渐近精确抽样。
    - 平均场通常无法表示精确后验，故变分 EM 一般保证 ELBO 单调不减，不能仅由这条链式不等式断言每轮真实证据都不减。
    - 若 ELBO 有上界，其数值收敛；参数通常只收敛到局部驻点，且还需每个坐标子问题被充分优化。
    - 这也可通过对原书式 (20.59)–(20.61) 求导得到。它仍是“先验伪计数 + 期望计数”。
  - title: 20.5 【补充】可运行代码：折叠 Gibbs 与变分 EM
    source_heading: 20.5 【补充】可运行代码：折叠 Gibbs 与变分 EM
    paragraphs:
    - 代码中的话题标签对齐仅用于演示小 K 时的标签交换问题，全排列法不适合大 K。
    - Gibbs 输出是一个燃烧期后的代表状态；若平均多个样本，必须先对齐可置换的话题标签。这个仅 30 个词元的数据集后验不确定性很大，不同种子、超参数和推断方法得到的细节可能不同。共同稳定结构比某一列具体数值更值得解释。
  - title: 必须掌握的主线
    source_heading: 必须掌握的主线
    paragraphs:
    - Dirichlet 是单纯形上的分布，均值由比例决定、总浓度控制离散程度；
    - Dirichlet 与多项/类别分布共轭，后验参数等于伪计数加计数；
    - LDA 在 PLSA 上增加文档话题比例和话题词比例的先验；
    - LDA 平均场更新仍是“先验 + 期望计数”。
  - title: 必须记住的边界
    source_heading: 必须记住的边界
    paragraphs:
    - Gibbs 渐近精确但可能混合慢，变分更快但有平均场偏差；
    - 标签交换使未经对齐的参数平均失去意义；
    - 变分 EM 严格保证 ELBO 单调，而非一般情况下的真实证据单调。
  takeaways:
  - LDA 用 Dirichlet 先验把文档话题比例和话题词比例变成可共享、可平滑的随机变量；共轭性让折叠 Gibbs 化为“计数加伪计数”的抽样，让变分 EM
    化为“期望计数加先验”的坐标更新，但两种推断仍分别受混合误差与平均场偏差限制。
  - 若先验与后验属于同一分布族，更新只需修改有限个超参数，不必每次重新求复杂积分，这就是共轭。
  - Gibbs 的目标后验通常多峰且有标签置换对称：任意重排话题编号不改变模型。小语料尤其可能受初始化影响；应运行多条链，检查话题稳定性和后验预测，而不只看某一次最终计数。
  - Gibbs 输出是一个燃烧期后的代表状态；若平均多个样本，必须先对齐可置换的话题标签。这个仅 30 个词元的数据集后验不确定性很大，不同种子、超参数和推断方法得到的细节可能不同。共同稳定结构比某一列具体数值更值得解释。
  - 变分 EM 严格保证 ELBO 单调，而非一般情况下的真实证据单调。
