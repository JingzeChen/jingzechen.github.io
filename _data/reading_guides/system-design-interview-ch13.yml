checks:
- level: 概念辨析
  question: 原文如何解释「26.1 Autocomplete 与 Search」？
  answer: Autocomplete 返回候选 query；Search 返回文档/商品。前者失败不应阻止后者。
  source_heading: 26.1 Autocomplete 与 Search
- level: 概念辨析
  question: 原文如何解释「26.6 高频等于相关」？
  answer: 频率是基线，可能被 spam、历史惯性和地域差异影响。生产排序还需质量和策略。
  source_heading: 26.6 高频等于相关
- level: 概念辨析
  question: 原文如何解释「26.10 整棵周替换必须停机」？
  answer: 通过版本化 snapshot、预热和原子 manifest 切换可零停机。
  source_heading: 26.10 整棵周替换必须停机
- level: 概念辨析
  question: 原文如何解释「26.17 Unicode 支持只需换成 UTF-8」？
  answer: 还需 normalization、locale、分词、大小写和 grapheme 处理。
  source_heading: 26.17 Unicode 支持只需换成 UTF-8
- level: 概念辨析
  question: 原文如何解释「26.20 Trending 只需缩短 rebuild 周期」？
  answer: 全量 Trie 即使每分钟触发也可能构建不完。需要流式增量 working set 和 query-time merge。
  source_heading: 26.20 Trending 只需缩短 rebuild 周期
