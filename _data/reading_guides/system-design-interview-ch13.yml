  sections:
  - title: 0. 学习目标、阅读边界与全章总览
    source_heading: 0. 学习目标、阅读边界与全章总览
    paragraphs:
    - 本章核心不是基础 Trie 定义，而是将其改造成高读低写、可离线构建、可缓存和可分片的生产查询索引。
    - 1000 万 DAU 为什么会产生约 24,000 平均 QPS和 48,000 峰值 QPS？
    - Analytics Log、Aggregator、Worker、Trie DB 和 Trie Cache 如何串成一条离线构建管道？
    - 本文严格沿原书顺序展开。补充的参数化复杂度、采样估计、指数衰减、snapshot 版本、cache stampede、防滥用与可运行 Trie 代码属于标准工程背景，不是作者逐式给出的原文。
  - title: 3. Step 2：高层设计——读写分离
    source_heading: 3. Step 2：高层设计——读写分离
    paragraphs:
    - 输入 prefix，返回 Top 5 高频完整 query。读路径必须极快且高可用。
    - 写侧可延迟聚合，读侧始终使用稳定快照。这是 CQRS 风格：更新模型与查询模型不同。
  - title: 10.1 读写耦合问题
    source_heading: 10.1 读写耦合问题
    paragraphs:
    - 同一热门 query 形成写热点；
    - 更新叶节点后所有 prefix ancestors 的 Top-k 可能变化；
    - 锁/复制/缓存失效进入读关键路径；
  - title: 12.2 Key-value Store
    source_heading: 12.2 Key-value Store
    paragraphs:
    - 按 prefix point lookup；
    - 一次查询可能多跳（可直接按完整 prefix 查节点）；
    - 原子版本切换仍需 manifest。
  - title: 17. Trie 操作：Create
    source_heading: 17. Trie 操作：Create
    paragraphs:
    - 原书：Worker 从 Analytics Log/DB 的聚合数据创建 Trie。
    - 插入 terminal frequency；
    - 自底向上计算每节点 Top-k；
    - 校验总 query、Top 示例、checksum；
  - title: 20.4 Query 路由
    source_heading: 20.4 Query 路由
    paragraphs:
    - 为高层 prefix 单独保存全局 Top-k；
    - fanout 到多个 shard 并 merge；
    - Shard Manager 路由到汇总 shard。
  - title: 22. Step 4：不同国家的热门结果
    source_heading: 22. Step 4：不同国家的热门结果
    paragraphs:
    - Trie 放 CDN 改善延迟。
    - immutable version；
    - 个性化结果不能公开共享缓存；CDN key 必须包含 country/language/version，发布时预热并保留旧 snapshot。
  - title: 25.2 质量
    source_heading: 25.2 质量
    paragraphs:
    - suggestion click-through；
    - zero-result prefix；
    - suggestions shown but ignored；
    - bad-content leakage；
  - title: 27.3 索引层
    source_heading: 27.3 索引层
    paragraphs:
    - Trie prefix path；
    - terminal frequency；
  - title: 28. 核心结论与一般设计方法
    source_heading: 28. 核心结论与一般设计方法
    paragraphs:
    - Query Service 需要多层缓存与客户端治理。 AJAX、debounce、取消旧请求、browser cache 和 singleflight
      共同降低延迟和负载。
    - 多语言和地域化改变索引维度。 Unicode 规范化、locale 和 country 必须进入 key/ranking。
    - 写侧不逐请求更新在线 Trie，而把最终 query 写 append-only log，按周聚合，Worker 离线构建版本化 Trie snapshot，校验和预热后原子切换，旧版本保留回滚。
    - 如果这些问题都能回答，就不只是会写一棵 Trie，而是理解了本章的核心方法：把“每次输入都扫描和排序历史查询”的在线计算，转换成由日志管道周期构建的版本化前缀物化视图；把昂贵排名预计算到每个
      prefix 节点，再用缓存、过滤、分片和小型实时增量层，在延迟、新鲜度、空间、治理与更新成本之间取得可控制的平衡。
  takeaways:
  - "<100 ms、相关、排序、可扩展、高可用。"
  - Monitoring and rollback。
  - 需求是英文小写前缀匹配，返回历史频率最高的 5 条，不做拼写纠正，10M DAU，目标 100 ms。
  - 能否设计 snapshot 原子发布与回滚？
  - 如果这些问题都能回答，就不只是会写一棵 Trie，而是理解了本章的核心方法：把“每次输入都扫描和排序历史查询”的在线计算，转换成由日志管道周期构建的版本化前缀物化视图；把昂贵排名预计算到每个
    prefix 节点，再用缓存、过滤、分片和小型实时增量层，在延迟、新鲜度、空间、治理与更新成本之间取得可控制的平衡。
