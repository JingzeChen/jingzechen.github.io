overview:
  kind: summary
  minutes: 8
  question: 原文围绕「6.1 二叉树概述」建立了怎样的核心认识？
  question_source: 6.1 二叉树概述
  thesis: 二叉树算法首先要选择信息流方向：自顶向下问题适合先序传状态，自底向上聚合适合后序返回子树摘要，需要有序划分时使用中序，需要按距离分层时使用队列。遍历不是背诵三个缩写，而是决定“根操作在两个递归调用之前、之间还是之后”。
  thesis_source: 本章总结
  concepts:
  - term: 6.1 二叉树概述
    meaning: 在结点值互异前提下：先序+中序、中序+后序、层序+中序均唯一确定二叉树。中序唯一定位根并划分左右集合，另一序列确定根及子树内部次序；对子树递归应用即可。只有先序+后序通常不唯一，因为无法判断单孩子在左还是右。
    source_heading: 6.1 二叉树概述
  - term: 6.2 先序、中序和后序遍历应用
    meaning: 每次准备弹栈时，栈顶是所有尚未访问结点中，中序次序最靠前者：其左子树已处理，而它的祖先及右子树都应排在它后面。因此访问栈顶不会越过任何更小的中序位置。访问后进入右子树，再次沿其左链寻找该子树最先结点。
    source_heading: 6.2 先序、中序和后序遍历应用
  - term: 6.3 二叉树层次遍历应用
    meaning: 此刻队列恰好包含当前层所有结点。接下来只出队 s 次；新加入的孩子位于队尾，留给下一轮。这种写法状态最少，也是前几章分层 BFS 的标准模板。
    source_heading: 6.3 二叉树层次遍历应用
  - term: 6.4 构造二叉树的算法设计
    meaning: 有效树中除根外每个结点恰有一个父亲，所以所有非根值都出现于 child 集合，根从不出现；差集必且仅有根。映射保证先作为 child、后作为
      parent 的值仍复用同一对象。
    source_heading: 6.4 构造二叉树的算法设计
  - term: 6.5 二叉树序列化的算法设计
    meaning: 反序列化先读根，再按队列中的父结点顺序每次读取至多两个 token 作为左右孩子。格式必须定义空树、分隔符、非法 token 与多余 token
      的处理。
    source_heading: 6.5 二叉树序列化的算法设计
  - term: 本章总结
    meaning: 二叉树算法首先要选择信息流方向：自顶向下问题适合先序传状态，自底向上聚合适合后序返回子树摘要，需要有序划分时使用中序，需要按距离分层时使用队列。遍历不是背诵三个缩写，而是决定“根操作在两个递归调用之前、之间还是之后”。
    source_heading: 本章总结
  logic:
  - 6.1 二叉树概述
  - 6.2 先序、中序和后序遍历应用
  - 6.3 二叉树层次遍历应用
  - 6.4 构造二叉树的算法设计
  - 6.5 二叉树序列化的算法设计
  - 本章总结
  sections:
  - title: 6.1 二叉树概述
    source_heading: 6.1 二叉树概述
    paragraphs:
    - 原书在布尔树题中所说“每个结点有 0 或 2 个孩子”是严格/真二叉树（full binary tree），不等同于完全二叉树（complete binary
      tree）。
    - 递归正确性来自结构归纳：空树返回；假设算法正确遍历左右子树，按 N/L/R 指定次序组合，就恰好访问整树每个结点一次。
    - 显式栈模拟递归。先序弹出结点后应先压右、再压左，利用 LIFO 让左先处理。中序不断压左链，弹出时访问，再转右。后序可产生 NRL 后整体逆置为 LRN。
    - 在结点值互异前提下：先序+中序、中序+后序、层序+中序均唯一确定二叉树。中序唯一定位根并划分左右集合，另一序列确定根及子树内部次序；对子树递归应用即可。只有先序+后序通常不唯一，因为无法判断单孩子在左还是右。
  - title: 6.2 先序、中序和后序遍历应用
    source_heading: 6.2 先序、中序和后序遍历应用
    paragraphs:
    - 每次准备弹栈时，栈顶是所有尚未访问结点中，中序次序最靠前者：其左子树已处理，而它的祖先及右子树都应排在它后面。因此访问栈顶不会越过任何更小的中序位置。访问后进入右子树，再次沿其左链寻找该子树最先结点。
    - 后序要求“左、右、根”。根必须等两个子树都完成后才能访问，所以单栈直接模拟时还要记住“右子树是否已访问”，状态比先序和中序复杂。原书选择更简单的等价变换：先生成
      NRL，再整体逆置。
    - 叶值 0/1 是操作数；内部值 2/3 分别是 OR/AND 运算符，且每个内部结点恰有两个孩子。树结构就是带括号的布尔表达式，父运算必须等待两个子表达式结果，因此使用后序。
    - 左先右后的先序在同一层按从左到右的相对次序访问，最后一次写入必是最右结点。更直接的补充方案按根—右—左遍历，每层第一次到达就记录，避免覆盖；BFS 则记录每层最后一个出队结点。
  - title: 6.3 二叉树层次遍历应用
    source_heading: 6.3 二叉树层次遍历应用
    paragraphs:
    - 此刻队列恰好包含当前层所有结点。接下来只出队 s 次；新加入的孩子位于队尾，留给下一轮。这种写法状态最少，也是前几章分层 BFS 的标准模板。
    - 孩子按左、右入队，因此同层最后出队的是最右实际结点；它与 6.2.10 的右先 DFS 是同一目标的两种遍历顺序。
    - 不同层之间不能交换，所以总最少次数等于各层最少交换次数之和。BFS 只负责提取当前层数组，核心转化成“用任意两位置交换把互异数组排成升序”。
    - 表述澄清： 原书说“将 curp 中结点逆置”，题目实际要求反转该层结点值；若重排结点指针，会改变树结构。
  - title: 6.4 构造二叉树的算法设计
    source_heading: 6.4 构造二叉树的算法设计
    paragraphs:
    - 先序能立即告诉当前子树的根，却不能单独判断哪些后续值属于左子树；中序能在根位置左右划分子树，却不能单独判断整树根。二者结合后，根与左右规模都确定。
    - 证明与先序方案对称：后序末值唯一确定根，中序唯一划分左右集合，后序按已知左右大小切片。
    - 有效树中除根外每个结点恰有一个父亲，所以所有非根值都出现于 child 集合，根从不出现；差集必且仅有根。映射保证先作为 child、后作为 parent
      的值仍复用同一对象。
    - 通用实现还需拒绝：同一孩子有两个父亲、同一父亲左/右槽冲突、多个根、环或不连通组件。
  - title: 6.5 二叉树序列化的算法设计
    source_heading: 6.5 二叉树序列化的算法设计
    paragraphs:
    - 序列化不只是“输出遍历值”，而是设计一个可逆协议。协议必须区分空树、负数、多位数、左右缺失和 token 边界，并约定是否允许省略末尾空标记。
    - 反序列化先读根，再按队列中的父结点顺序每次读取至多两个 token 作为左右孩子。格式必须定义空树、分隔符、非法 token 与多余 token 的处理。
    - 解析游标每次调用恰消费一棵子树的完整编码。若 token 为值，随后两次递归分别消费左、右子树，因此返回时游标正好位于下一棵子树开头。
    - 直接成对递归比较更省中间空间，并能在首个差异处提前终止；序列化方案的价值在于已有编码、跨进程传输或希望复用统一结构指纹时。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 二叉树算法首先要选择信息流方向：自顶向下问题适合先序传状态，自底向上聚合适合后序返回子树摘要，需要有序划分时使用中序，需要按距离分层时使用队列。遍历不是背诵三个缩写，而是决定“根操作在两个递归调用之前、之间还是之后”。
    - 构造与序列化都在解决结构信息是否充分。两种互补遍历在值互异时可由中序划分左右；单一遍历则必须显式记录空孩子。最大宽度、最少交换等题进一步说明，树题常把非线性结构按层或按遍历线性化，再应用数组、哈希和置换算法。
    - 实现中应优先检查空树、整数编号溢出、重复值前提和序列 token 边界。
  takeaways:
  - 二叉树算法首先要选择信息流方向：自顶向下问题适合先序传状态，自底向上聚合适合后序返回子树摘要，需要有序划分时使用中序，需要按距离分层时使用队列。遍历不是背诵三个缩写，而是决定“根操作在两个递归调用之前、之间还是之后”。
  - 构造与序列化都在解决结构信息是否充分。两种互补遍历在值互异时可由中序划分左右；单一遍历则必须显式记录空孩子。最大宽度、最少交换等题进一步说明，树题常把非线性结构按层或按遍历线性化，再应用数组、哈希和置换算法。
  - 实现中应优先检查空树、整数编号溢出、重复值前提和序列 token 边界。
