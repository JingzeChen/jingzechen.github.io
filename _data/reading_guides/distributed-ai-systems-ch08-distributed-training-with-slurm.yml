  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 证据线：job state → resource telemetry → rank progress → collective trace →
    resume test。
  thesis_source: 28. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: DDP rank-0 checkpoint与FSDP/ZeRO/Megatron sharded checkpoint有何不同？
    source_heading: 0. 本章要回答的核心问题
  - term: 5. Quick setup and verification
    meaning: 若改为one-agent-per-node，SLURM tasks只有2，PyTorch children/world仍是8，必须分别记账。
    source_heading: 5. Quick setup and verification
  - term: 13. FSDP with SLURM
    meaning: DDP：每rank完整weights/gradients/optimizer。FSDP：persistent state分片，forward/backward按unit
      AllGather/ReduceScatter。
    source_heading: 13. FSDP with SLURM
  - term: 16.1 Job arrays是什么
    meaning: 独立job state/exit/log/resource allocation。
    source_heading: 16.1 Job arrays是什么
  - term: 23. Troubleshooting common issues
    meaning: 不要优先SSH并猜。收集每ranklast log、step state、processes和timeout exception。找最早失败rank，不是最后报NCCL
      timeout的rank。
    source_heading: 23. Troubleshooting common issues
  - term: 31. 复习与自测
    meaning: 完成这些检查后，应能把“提交一个多节点训练作业”转化为可证伪的运行协议：SLURM分配了哪些资源、哪一层派生多少进程、每个rank为何选择这张GPU并连接同一rendezvous、framework
      state由谁持有和保存、信号到来时怎样原子提交并恢复，以及性能/故障结论由哪些跨层证据支持。
    source_heading: 31. 复习与自测
