overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章定位：复制数据容易，让副本表现成一份数据很难」建立了怎样的核心认识？
  question_source: 0. 本章定位：复制数据容易，让副本表现成一份数据很难
  thesis: PACELC 指出正常无分区时也有 latency 与 consistency 权衡。 本质是 coordination tax。
  thesis_source: 27. 核心结论
  concepts:
  - term: 0. 本章定位：复制数据容易，让副本表现成一份数据很难
    meaning: 复制后，客户端可切换到仍存活副本。冗余把单节点故障从“数据不可访问”变成“需要故障检测与切换”。
    source_heading: 0. 本章定位：复制数据容易，让副本表现成一份数据很难
  - term: 5. 新 leader 为什么必须日志足够新
    meaning: 注意：单靠“最后 entry 比较”这句话不足以独立证明全部性质，完整证明还依赖 election restriction 与 log matching；这里给出原章层级直觉。
    source_heading: 5. 新 leader 为什么必须日志足够新
  - term: 12. Strong consistency / Linearizability
    meaning: 原章把 strong consistency 等同 linearizability。行业中 strong 有时泛指多种较强模型；技术讨论最好直接说
      linearizable，并说明对象/事务范围。
    source_heading: 12. Strong consistency / Linearizability
  - term: 16. CAP theorem
    meaning: 网络分区不可由软件彻底禁止，所以发生 P 时实际是在 C 与 A 之间选择。无 partition 时，系统可以同时 consistent
      且 available，但仍有 latency 与故障概率。
    source_heading: 16. CAP theorem
  - term: 21. Chain 为什么容易推理
    meaning: write commit 必须到达 tail，因此必经全部 chain nodes。相比 quorum replication 中 committed
      write 只存在于某 subset，chain 对故障恢复的可能状态更少。
    source_heading: 21. Chain 为什么容易推理
  - term: 28. 从本章提炼出的通用解题方法
    meaning: 本章最重要的方法论是：复制协议决定状态怎样安全收敛，一致性模型决定客户端允许看到什么；只有把内部 commit 机制与外部观察语义同时说清，才能真正理解一个
      replicated system。
    source_heading: 28. 从本章提炼出的通用解题方法
