overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 协作层：静态/时间耦合和 Least Knowledge 决定知识与依赖应放在哪里。
  thesis_source: 10. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：Logical component 不是从数据实体直接生成的盒子，而是围绕业务动作和工作流提出、由用户故事填充、以职责内聚和架构特征校正、再通过耦合分析持续重构的代码责任边界。
    source_heading: 0. 本章要回答的核心问题
  - term: 3. Logical Versus Physical Architecture：逻辑架构与物理架构
    meaning: 后续 architecture characteristics、quantum scope、团队和运维成本会影响映射。
    source_heading: 3. Logical Versus Physical Architecture：逻辑架构与物理架构
  - term: 5. Component Coupling：组件耦合
    meaning: 本章在组件通信语境中，把同步、方向明确的组件依赖作为 static coupling 进行 CA/CE 分析。第 7 章采用更宽定义，把共享数据库和部署“布线”也算
      static coupling。二者并不冲突：本节度量的是可画成有向边的直接依赖子集。
    source_heading: 5. Component Coupling：组件耦合
  - term: '7. Case Study: Going, Going, Gone—Discovering Components：发现组件案例'
    meaning: Auctioneer 与 bidder 提交的都是 bid，捕获和基本处理在功能上相似，因此先合并合理。若只看 domain action，一个组件具有内聚性。
    source_heading: '7. Case Study: Going, Going, Gone—Discovering Components：发现组件案例'
  - term: 9. 从本章提炼的通用组件发现法
    meaning: 比较组件内部不同路径对 scalability、availability、security、agility 等要求是否显著不同。
    source_heading: 9. 从本章提炼的通用组件发现法
  - term: 12. 主动回忆与应用题
    meaning: 为 Auctioneer Capture 定义 reliability/availability 场景，为 Bid Capture 定义
      scalability/elasticity 场景。
    source_heading: 12. 主动回忆与应用题
  logic:
  - 0. 本章要回答的核心问题
