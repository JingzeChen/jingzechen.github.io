checks:
- level: 概念辨析
  question: 原文如何解释「8.5 “Logical architecture 应显示数据库和容器”」？
  answer: 错误之处：这些通常属于 physical architecture；逻辑 repository 也不是物理数据库。
  source_heading: 8.5 “Logical architecture 应显示数据库和容器”
- level: 概念辨析
  question: 原文如何解释「8.8 “必须收集全部需求才能开始”」？
  answer: 错误之处：major workflows 和 actors 已足以形成可讨论候选。
  source_heading: 8.8 “必须收集全部需求才能开始”
- level: 概念辨析
  question: 原文如何解释「8.14 “发现重复邮件代码就必须建独立微服务”」？
  answer: 正确理解：先建立 Notification 责任边界，再按特征决定物理映射。
  source_heading: 8.14 “发现重复邮件代码就必须建独立微服务”
- level: 概念辨析
  question: 原文如何解释「8.23 “增加中间转发层就能降低耦合”」？
  answer: 错误之处：Placement 仍知道库存必须扣减，C_E 不变，间接层反而增加。
  source_heading: 8.23 “增加中间转发层就能降低耦合”
- level: 概念辨析
  question: 原文如何解释「8.26 “一个问题只有唯一组件分解”」？
  answer: 正确理解：比较候选并选择 least worst，而非追求 one true design。
  source_heading: 8.26 “一个问题只有唯一组件分解”
