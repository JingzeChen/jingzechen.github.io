  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Logical architecture 与 physical architecture 分别表达什么，为什么不应跳过前者？
    - Order Placement 为什么需要拆出 Payment Processing、Inventory Management 和 Customer Notification？
    - 为什么在 Order Placement 与 Inventory Management 之间增加转发组件不能降低有效耦合？
    - 一句话概括：Logical component 不是从数据实体直接生成的盒子，而是围绕业务动作和工作流提出、由用户故事填充、以职责内聚和架构特征校正、再通过耦合分析持续重构的代码责任边界。
  - title: 1. 开篇：什么是 Component-Based Thinking
    source_heading: 1. 开篇：什么是 Component-Based Thinking
    paragraphs:
    - 第 3 章把 module 作为相关代码的一般分组。本章进一步关注模块化在架构层面的表现：logical components，即系统的主要构建块。
    - 哪些能力应保持同一边界，哪些应拆开；
    - 架构师首先需要看见“Payment Processing”这一业务责任，再由开发者在边界内设计类和函数。组件层连接业务语言与代码结构。
    - 三个轴必须一起迭代。仅追求低耦合可能把完整工作流拆得支离破碎；仅追求内聚可能形成过大组件；仅按业务名称分组又可能忽略性能和可用性范围。
  - title: 3. Logical Versus Physical Architecture：逻辑架构与物理架构
    source_heading: 3. Logical Versus Physical Architecture：逻辑架构与物理架构
    paragraphs:
    - 这里的 repository 是用于说明数据在哪里被使用或传递的逻辑数据存储抽象，不是表示流动的箭头，也不是具体 database 产品。
    - 业务功能不可见：Payment Processing 可能分散在多个服务中，图上难以看出完整责任；
    - 后续 architecture characteristics、quantum scope、团队和运维成本会影响映射。
    - 逻辑图保持业务可理解性，物理图验证运行可行性。两者应能互相追踪，但不要求一框一框对应。
  - title: 4. Creating a Logical Architecture：创建逻辑架构
    source_heading: 4. Creating a Logical Architecture：创建逻辑架构
    paragraphs:
    - 第 4 与第 7 步都由 Customer Notification 承担，因为它们共享“向客户发送订单状态通知”的责任。若每一步都建组件，会把统一能力拆成重复薄层。
    - Actor/Action 通常生成更多组件，具体取决于 Workflow 选择了多少主要旅程。两种方法可交叉使用：Workflow 验证端到端完整性，Actor/Action
      验证角色覆盖。
    - Placement 负责下单交互，可能收集或接收支付 token；Payment Processing 负责与支付系统交互并应用付款。边界应避免让 Placement
      掌握网关协议、重试和支付状态细节。
    - 原章明确指出，应先识别系统最重要的 architecture characteristics，再建立 logical architecture，使这些特征从一开始就参与组件粒度判断。组件模型建立后仍会随用户故事、实现反馈和特征变化持续迭代，但不能把关键特征留到初始逻辑架构完成之后才补做。
  - title: 5. Component Coupling：组件耦合
    source_heading: 5. Component Coupling：组件耦合
    paragraphs:
    - 本章在组件通信语境中，把同步、方向明确的组件依赖作为 static coupling 进行 CA/CE 分析。第 7 章采用更宽定义，把共享数据库和部署“布线”也算
      static coupling。二者并不冲突：本节度量的是可画成有向边的直接依赖子集。
    - 高 C_A 表示变化潜在影响面大，不自动表示设计坏。稳定公共能力本来可能被广泛使用，但其契约应谨慎演进。
    - 高 C_E 表示组件知道和协调的外部能力较多，修改和测试所需替身可能增加；仍需看依赖是否属于其合理职责。
    - 例：处理订单时必须先执行 Order Placement，之后才能执行 Order Shipment。二者即使没有直接代码 import，也依赖正确执行顺序。
  - title: '7. Case Study: Going, Going, Gone—Discovering Components：发现组件案例'
    source_heading: '7. Case Study: Going, Going, Gone—Discovering Components：发现组件案例'
    paragraphs:
    - 向用户实时展示报价。Video Streamer 与 Bid Streamer 都给 bidder 提供 read-only view。
    - Auctioneer 与 bidder 提交的都是 bid，捕获和基本处理在功能上相似，因此先合并合理。若只看 domain action，一个组件具有内聚性。
    - 对 bidder 掉线会损失一位参与者；auctioneer 掉线可能使所有参与者无法继续。这是 failure impact 的差异。
    - 软件系统通常有多个充分设计。架构师不应寻找 “one true design”，而要客观比较 trade-offs，选择 least worst 组合。
  - title: 8.17 “功能相似就一定属于同一组件”
    source_heading: 8.17 “功能相似就一定属于同一组件”
    paragraphs:
    - 错误之处：GGG 的两个 bid capture 在规模与失败影响上差异很大。
    - 正确理解：functional cohesion 之后还要分析 architecture characteristics。
  - title: 9. 从本章提炼的通用组件发现法
    source_heading: 9. 从本章提炼的通用组件发现法
    paragraphs:
    - 检查 Manager/Handler 等模糊组件是否只是按实体收纳所有功能；区分真正 CRUD 系统。
    - 比较组件内部不同路径对 scalability、availability、security、agility 等要求是否显著不同。
    - 将后续规则移到最接近事实的组件，避免 pass-through abstraction，并检查耦合只是减少还是重新分配。
    - 结合 quantum、数据、部署和团队约束，把 logical components 映射到单体模块或服务；新证据进入下一轮。
  - title: 11. 核心结论
    source_heading: 11. 核心结论
    paragraphs:
    - Logical architecture 展示组件、actors 和逻辑信息交互；physical architecture 展示 UI、services、databases
      等运行构件。
    - Customer Notification 集中状态邮件责任，避免 Placement、Fulfillment、Shipment 复制代码和知识。
    - GGG 的 Actor/Action 初始模型包含 Video/Bid Streamer、Bid Capture/Tracker、Auction Session
      和 Payment。
    - Bidder 与 auctioneer 的报价功能相似，但前者重 scalability/elasticity，后者重 reliability/availability。
  - title: 12. 主动回忆与应用题
    source_heading: 12. 主动回忆与应用题
    paragraphs:
    - 用自己的项目说明 module、logical component、service、bounded context 和 architecture quantum
      的区别。
    - 修改 Python 耦合示例，再把 Notification 知识移动到 Inventory；判断这是否符合内聚，还是制造新陷阱。
    - 从 GGG 三个 actors 和九个 actions 独立推导 starter components，再与图 8-16 比较。
    - 为 Auctioneer Capture 定义 reliability/availability 场景，为 Bid Capture 定义 scalability/elasticity
      场景。
  takeaways:
  - 表达层：Logical component 用业务责任组织代码，logical diagram 与 physical topology 分开；
  - 跳过逻辑架构会隐藏功能位置，并让开发团队缺少代码组织指导。
  - Customer Notification 集中状态邮件责任，避免 Placement、Fulfillment、Shipment 复制代码和知识。
  - Temporal coupling 描述顺序、时间和事务依赖，静态工具常无法发现。
  - 组件设计不存在 one true design，应比较多种候选并选择 least worst trade-offs。
