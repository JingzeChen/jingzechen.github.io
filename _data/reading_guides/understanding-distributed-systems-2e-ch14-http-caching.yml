overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章定位：最便宜的请求，是根本不用发到服务器的请求」建立了怎样的核心认识？
  question_source: 0. 本章定位：最便宜的请求，是根本不用发到服务器的请求
  thesis: Client-side HTTP cache 是 replication。 它把静态 resource 副本放到 browser，以 stale
    风险换取 latency 和 origin capacity。
  thesis_source: 15. 核心结论
  concepts:
  - term: 0. 本章定位：最便宜的请求，是根本不用发到服务器的请求
    meaning: "“static”不表示文件永不改变，而是同一资源表示在缓存有效期内通常稳定。Dynamic 也不是绝对不可缓存；只要能定义正确 cache
      key、freshness 和隐私边界，也可缓存。但原章先聚焦静态资源。"
    source_heading: 0. 本章定位：最便宜的请求，是根本不用发到服务器的请求
  - term: 5. Validators：ETag 与 Last-Modified
    meaning: Strong validator 必须在可观察 representation data 变化时变化。Weak validator 可以跨字节变化保持不变，只要旧
      representation 仍可作为语义等价替代；当不再可接受为等价表示时才必须变化。
    source_heading: 5. Validators：ETag 与 Last-Modified
  - term: 7. HTTP caching 与 CQRS
    meaning: 设置正确 HTTP headers 并不意味着必须引入 event sourcing、独立 read database 等复杂架构。这里强调的是
      read/write workload 和语义不同，应分别优化。
    source_heading: 7. HTTP caching 与 CQRS
  - term: 9. Reverse proxies
    meaning: Figure 14.3 原图只有一个 server；上图在其“client -> reverse proxy -> server”关系上加入第二个
      origin，用于同时展示原章随后提到的 load-balancing 扩展。
    source_heading: 9. Reverse proxies
  - term: 12.3 示例边界
    meaning: production 应使用成熟 HTTP cache/library。
    source_heading: 12.3 示例边界
  - term: 16. 从本章提炼出的通用解题方法
    meaning: 监控 hit/miss/revalidation ratio、Age、stale serve、eviction、origin latency、stampede、cache
      bytes 和 purge completion。
    source_heading: 16. 从本章提炼出的通用解题方法
  logic:
  - 0. 本章定位：最便宜的请求，是根本不用发到服务器的请求
  - 5. Validators：ETag 与 Last-Modified
  - 6.5 “原子”的边界
  - 9. Reverse proxies
  - 11. Reverse-proxy cache 的故障与运维
