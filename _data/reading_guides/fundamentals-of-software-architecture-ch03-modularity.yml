  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - 七类内聚从好到坏如何区分，为什么 Customer 与 Order 的边界没有脱离上下文的唯一答案？
    - afferent coupling 与 efferent coupling 分别表示什么，怎样避免记反？
    - strength、locality 和 degree 怎样共同决定某种 connascence 的危害？
    - 一句话概括：模块化不是把系统切成尽可能多的小块，而是让应该一起变化的代码靠近并封装，让跨边界的依赖尽量少、弱、近且可见，再用指标发现异常、用业务语义作最终判断。
  - title: 1. 开篇：为什么模块化既重要又难定义
    source_heading: 1. 开篇：为什么模块化既重要又难定义
    paragraphs:
    - 作者以 Glenford J. Myers 在 1978 年《Composite/Structured Design》中的观察开场：有关软件架构的文字大量赞美
      modularity，却很少说明怎样实现它。近半个世纪后，这个问题仍然存在。
    - 概念如此普遍，定义却很滑：网络上可以找到几十种相互不一致甚至矛盾的解释。为了让后续章节能够使用共同语言，作者必须给出本书自己的工作定义，而不是声称解决了所有语言中的术语争议。
    - 作者借用物理学类比：复杂系统倾向于 entropy（熵、无序）。物理系统需要持续输入能量来维持秩序，软件结构也一样。
    - 项目需求很少写“系统必须具有良好的模块区分与通信”，但可持续代码库离不开这种秩序与一致性。因此，作者把良好模块化视为 implicit architecture
      characteristic（隐含架构特征）。
  - title: 2. Modularity Versus Granularity：模块化与粒度
    source_heading: 2. Modularity Versus Granularity：模块化与粒度
    paragraphs:
    - 开发者和架构师经常混用 modularity 与 granularity，但原章明确区分二者。
    - 模块化是“要有结构化分解”，粒度是“每刀切在哪里”。前者不要求物理分布：模块化单体也可以有良好模块化；微服务只是高度物理分布的一种形式。
    - 所以“更多模块”不自动意味着“更模块化”。如果每个小服务都必须与其他服务同时修改和发布，只是把内部耦合转换成昂贵的分布式耦合。
    - 这已经引出后文两个核心概念：内部相关程度由 cohesion 帮助描述，跨边界依赖由 coupling 与 connascence 帮助描述。
  - title: 3. Defining Modularity：定义模块化
    source_heading: 3. Defining Modularity：定义模块化
    paragraphs:
    - 1968 年 3 月，Edsger Dijkstra 在 ACM 的《Communications》发表 “Go To Statement Considered
      Harmful”。
    - 这里的 namespace 是通用概念，不只指 .NET 的同名构造。软件资产需要精确、完全限定的名称，避免不同组件、类、函数或变量互相冲突。互联网域名就是日常使用的全局唯一标识体系，并最终关联到网络地址。
    - 原始 classpath 只包含目录。语言规则借用了操作系统文件系统的不变量来避免同一完全限定位置的二义性。这是一个典型设计思路：不重新实现冲突检测，而是让底层平台约束替自己维持唯一性。
    - 第二个主要版本 Java 1.2（品牌名 Java 2）加入 JAR，让一个归档文件在 classpath 上表现得像目录。分发复用资产变容易，但原始唯一性假设被打破：两个
      JAR 可以各自包含同一个完全限定类名。
  - title: 4. Measuring Modularity：度量模块化
    source_heading: 4. Measuring Modularity：度量模块化
    paragraphs:
    - 理想内聚模块包含完成其责任所需的全部部分；若继续拆小，原本内部协作会变成跨模块调用，反而提高耦合并降低可读性。Larry Constantine 的结论是：拆分一个本来内聚的模块，只会增加耦合并降低可读性。
    - Chidamber and Kemerer Object-Oriented Metrics Suite 包含循环复杂度、耦合指标，以及 Lack of
      Cohesion in Methods（LCOM）。LCOM 不是直接度量“内聚有多好”，而是寻找方法之间缺少共同字段联系的程度。
    - 原始 C_a 和 C_e 已经有价值，Robert C. Martin 又基于模块中的抽象/具体构件和依赖方向定义 Abstractness 与 Instability。这些指标广泛适用于面向对象语言。
    - 核心直觉是稳定抽象原则：越稳定、越难改变的模块，自身越应由抽象构件组成，以便在不修改稳定契约的情况下扩展实现；越具体的模块，越应位于容易替换的位置。这里仍须查看原始
      C_a、C_e 判断实际影响规模，I 本身只给出方向比例。
  - title: 6. From Modules to Components：从模块到组件
    source_heading: 6. From Modules to Components：从模块到组件
    paragraphs:
    - 本书使用 module 作为“相关代码包”的通用名称。多数架构师则把模块称为 component，组件是软件架构的关键构建块。
    - 一个 package 可以是模块，却未必达到架构组件所需的责任清晰度；一个组件也可能由多个包组成。名称不决定质量，真正重要的是内聚、依赖、共同变化和边界治理。
    - 但组件不能仅由指标自动聚类得到。业务领域、团队边界、数据所有权、架构特征和工作流同样会决定组件划分。
    - 组件边界既要让业务行为内聚，也要让性能、可用性、安全和可扩展性等架构特征作用在合适范围。只按代码依赖切分，会遗漏运行和业务约束。
  - title: 8. 从本章提炼的通用模块化分析法
    source_heading: 8. 从本章提炼的通用模块化分析法
    paragraphs:
    - 选择一致的粒度，例如 class、package 或 component，并记录语言、工具和统计规则。
    - 对关键边识别 Name、Type、Meaning、Position、Algorithm、Execution、Timing、Values 或 Identity
      connascence。
    - 运行行为测试，重新计算指标，比较依赖图和变更影响，并把关键边界写成自动规则。
    - 这十步不是“指标自动设计架构”的算法，而是从结构证据走向业务判断的循环。若重构降低 LCOM 却显著增加跨模块动态 connascence，应回退并重新划分粒度。
  - title: 9. 本章知识结构
    source_heading: 9. 本章知识结构
    paragraphs:
    - 边界语言：模块化决定是否分组，粒度决定分组大小；
    - 结构证据：内聚看内部，耦合看外部，主序列看抽象与稳定性平衡；
    - 变化语义：connascence 解释为什么两处必须一起改变；
    - 治理原则：强关系放在近处，跨边界关系保持少、弱、显式且可验证。
  - title: 10. 核心结论
    source_heading: 10. 核心结论
    paragraphs:
    - Instability 是依赖方向比例和变更阻力指标，不是运行稳定性，也不表示耦合总量。
    - 必须同时考虑 connascence 的 strength、locality 和 degree；强、远、广的组合最危险。
    - 好的模块化会最小化总体及跨边界 connascence，同时把必须共同变化的代码集中到同一边界。
    - 组件是架构构建块，模块指标能提供证据，但组件边界最终还要结合领域、数据、团队和架构特征。
  - title: 11. 自测问题
    source_heading: 11. 自测问题
    paragraphs:
    - 结构化语言改善了过程内部控制流，开发者随后需要把多个相关过程和数据组织为更大的可见性与复用单元，因此出现 Modula、Ada 等模块化语言。
    - package 名对应物理目录，而同一目录不能有两个同名文件；完全限定名因此映射到唯一目录路径。JAR 允许多个归档包含相同路径后，这个假设不再成立。
    - 检查订单行为是否会扩展、客户模块是否持续增长，以及拆分后 Order 是否需要大量 Customer 内部知识；比较内部内聚收益与新增跨边界耦合。
    - 先明确分析粒度和业务责任，再用内聚、依赖方向与主序列指标寻找异常；为关键耦合识别 connascence 类型，并按强度、距离和影响面排序；结合业务语义决定合并、拆分、移动或弱化约束，最后以测试、指标和自动规则持续验证。
  takeaways:
  - 边界语言：模块化决定是否分组，粒度决定分组大小；
  - 模块化关注是否分解，粒度关注每块多大；拆得过粗和过细都会增加变化成本。
  - Customer 与 Order 的划分取决于未来增长、责任完整性和拆分后的知识耦合。
  - 指标无法区分本质复杂度与偶然复杂度，应建立本地基线并结合业务语义解释。
  - 组件是架构构建块，模块指标能提供证据，但组件边界最终还要结合领域、数据、团队和架构特征。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.2 “微服务天然比单体更模块化”」？
  answer: 正确理解：模块化首先是逻辑责任和变化边界；模块化单体可能优于边界混乱的微服务。
  source_heading: 7.2 “微服务天然比单体更模块化”
- level: 概念辨析
  question: 原文如何解释「7.7 “LCOM 高就必须拆类”」？
  answer: 错误之处：LCOM 只观察字段访问结构，不理解业务协议、无状态服务或框架隐式关系。
  source_heading: 7.7 “LCOM 高就必须拆类”
- level: 概念辨析
  question: 原文如何解释「7.14 “痛苦区中的模块只要多加接口就能修好”」？
  answer: 正确理解：先找依赖者、变化原因和稳定契约，再决定收窄依赖、移动职责或提取抽象。
  source_heading: 7.14 “痛苦区中的模块只要多加接口就能修好”
- level: 概念辨析
  question: 原文如何解释「7.16 “所有动态 connascence 都必须消除”」？
  answer: 正确理解：优先封装在狭窄边界，减少跨边界传播，并在可行时转成较弱静态约束。
  source_heading: 7.16 “所有动态 connascence 都必须消除”
- level: 概念辨析
  question: 原文如何解释「7.18 “最大化边界内 connascence 与降低耦合矛盾”」？
  answer: 正确理解：让紧密关系局部化形成高内聚，同时最小化跨边界 connascence。
  source_heading: 7.18 “最大化边界内 connascence 与降低耦合矛盾”
