  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 指标无法区分本质复杂度与偶然复杂度，应建立本地基线并结合业务语义解释。
  thesis_source: 10. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：模块化不是把系统切成尽可能多的小块，而是让应该一起变化的代码靠近并封装，让跨边界的依赖尽量少、弱、近且可见，再用指标发现异常、用业务语义作最终判断。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Modularity Versus Granularity：模块化与粒度
    meaning: 模块化是“要有结构化分解”，粒度是“每刀切在哪里”。前者不要求物理分布：模块化单体也可以有良好模块化；微服务只是高度物理分布的一种形式。
    source_heading: 2. Modularity Versus Granularity：模块化与粒度
  - term: 4. Measuring Modularity：度量模块化
    meaning: Chidamber and Kemerer Object-Oriented Metrics Suite 包含循环复杂度、耦合指标，以及 Lack
      of Cohesion in Methods（LCOM）。LCOM 不是直接度量“内聚有多好”，而是寻找方法之间缺少共同字段联系的程度。
    source_heading: 4. Measuring Modularity：度量模块化
  - term: 6. From Modules to Components：从模块到组件
    meaning: 一个 package 可以是模块，却未必达到架构组件所需的责任清晰度；一个组件也可能由多个包组成。名称不决定质量，真正重要的是内聚、依赖、共同变化和边界治理。
    source_heading: 6. From Modules to Components：从模块到组件
  - term: 9. 本章知识结构
    meaning: 治理原则：强关系放在近处，跨边界关系保持少、弱、显式且可验证。
    source_heading: 9. 本章知识结构
  - term: 11. 自测问题
    meaning: 先明确分析粒度和业务责任，再用内聚、依赖方向与主序列指标寻找异常；为关键耦合识别 connascence 类型，并按强度、距离和影响面排序；结合业务语义决定合并、拆分、移动或弱化约束，最后以测试、指标和自动规则持续验证。
    source_heading: 11. 自测问题
