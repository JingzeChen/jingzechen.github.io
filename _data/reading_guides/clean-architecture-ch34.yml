  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 怎样把理想 Architecture 映射为真正能被语言、编译器、模块和构建系统约束的代码结构？
    - Runtime 与 Compile-Time 使用何种 Decoupling Mode。
    - 最后移除 Package 外观，比较真实 Type Dependency；
    - 本笔记会沿原书顺序完整解释九幅图、四种组织方式、Newcomer 绕过 Service 的案例、Compiler Enforcement、C4 Component、Java
      Module System、Périphérique Anti-Pattern，以及最终的 Missing Advice。
  - title: 2.9 这种比较为什么有效
    source_heading: 2.9 这种比较为什么有效
    paragraphs:
    - Organization 改变了什么；
    - Dependency 改变了什么；
    - Encapsulation 是否真的改变。
  - title: 5. Package by Feature
    source_heading: 5. Package by Feature
    paragraphs:
    - 按 Related Feature、Domain Concept 或 Aggregate Root 组织代码。
    - 他提到 Lightweight Text Editor 再度流行，并自嘲可能太老而无法理解原因。
    - 团队发现 Horizontal Layering 问题后，会切换到 Vertical Package by Feature。
    - Simon Brown 认为 Package by Layer 和常见 Package by Feature 都是 Suboptimal。
  - title: 9. Package by Component
    source_heading: 9. Package by Component
    paragraphs:
    - 他长期开发 Enterprise Software，主要使用 Java，跨多个 Business Domain。
    - 多数系统仍基于 Traditional Layered Architecture。
    - 每层只依赖相邻下一层，以形成 Clean、Acyclic Dependency Graph。
    - 开发者可以添加绕过 Business Layer 的依赖，箭头依然向下，图仍然 Acyclic。
  - title: 13. 两种 Component 定义
    source_heading: 13. 两种 Component 定义
    paragraphs:
    - 一组相关功能，位于清晰 Interface 后，并存在于 Application 等 Execution Environment 中。
    - Simon Brown：Logical Encapsulation / Static Structure。
    - Simon Brown 的定义来自 C4 Software Architecture Model。
    - Logical Component Boundary 与 Physical Packaging 可以独立决策。
  - title: 17. Figure 34.8：逐种收紧可见性
    source_heading: 17. Figure 34.8：逐种收紧可见性
    paragraphs:
    - OrdersServiceImpl 位于 Service Package，需要访问 Data Package 中的 Interface。
    - 其他 Delivery Mechanism 或 Internal Component 可能不应通过 Web Controller 使用 Orders。
    - Hidden Concrete Implementations 可由 Composition Root 通过适当 Factory / DI 组装。
    - Controller 对 Orders Package 的唯一 Inbound Dependency 指向 Component Facade。
  - title: 20.2 Ports and Adapters 的三树方案
    source_heading: 20.2 Ports and Adapters 的三树方案
    paragraphs:
    - Business / Domain；
    - Data Persistence。
  - title: 22.3 思考 Code Organization
    source_heading: 22.3 思考 Code Organization
    paragraphs:
    - Business Capability；
    - Policy Boundary；
    - Public Contract；
    - Internal Detail。
  - title: 25.10 Composition 问题
    source_heading: 25.10 Composition 问题
    paragraphs:
    - Framework Module；
    - Public Bootstrap Function。
  - title: 30. 知识结构与核心总结
    source_heading: 30. 知识结构与核心总结
    paragraphs:
    - Business Logic 与 Persistence 在同一 Encapsulation Boundary 内，但内部仍保持 Separation
      of Concerns。
    - Package by Layer 中 OrdersService 与 OrdersRepository 必须 Public，Concrete Implementations
      可隐藏。
    - 最终 Missing Advice 是把设计映射到代码结构，分别选择 Runtime 与 Compile-Time Decoupling，尽可能让 Compiler
      执行边界，同时依据 Team Size、Skill、Solution Complexity、Time、Budget 和 Data Coupling 保持务实。
    - Package by Layer、Package by Feature、Ports and Adapters 与 Package by Component
      都能表达不同设计意图。
  takeaways:
  - 为什么本章叫 The Missing Chapter？
  - Package by Layer 中哪些 Type 必须 Public？
  - 作者保持业务问题不变，比较多种 Code Organization。
  - 真实 Dependency 常在团队第一次 Visualize Code Base 时才暴露。
  - The devil is in the implementation details.
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「28.1 误区一：有 Package 就有 Encapsulation」？
  answer: 错误。若所有 Type Public，Package 可能只是 Folder。
  source_heading: 28.1 误区一：有 Package 就有 Encapsulation
- level: 概念辨析
  question: 原文如何解释「28.8 误区八：Repository 必须叫 Repository」？
  answer: 错误。Inside Port 应使用 Ubiquitous Domain Language；原书把它改名为 Orders。
  source_heading: 28.8 误区八：Repository 必须叫 Repository
- level: 概念辨析
  question: 原文如何解释「28.13 误区十三：Implementation Interface 都应 Public 以便测试」？
  answer: 错误。测试可以位于同 Package，或通过 Public Behavior 测试 Component。
  source_heading: 28.13 误区十三：Implementation Interface 都应 Public 以便测试
- level: 概念辨析
  question: 原文如何解释「28.21 误区二十一：Separate Source Trees 越多越好」？
  answer: 错误。Performance、Complexity、Maintenance 成本会快速增加。
  source_heading: 28.21 误区二十一：Separate Source Trees 越多越好
- level: 概念辨析
  question: 原文如何解释「28.28 误区二十八：保留选项意味着预先实现所有选项」？
  answer: 错误。保持可逆 Boundary，不等于提前构建所有 Deployment Mode。
  source_heading: 28.28 误区二十八：保留选项意味着预先实现所有选项
