overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 示例使用 Java，但原则适用于其他有 Module、Visibility 或 Build Boundary 的语言。
  thesis_source: 30. 知识结构与核心总结
  concepts:
  - term: 本章导读
    meaning: 本笔记会沿原书顺序完整解释九幅图、四种组织方式、Newcomer 绕过 Service 的案例、Compiler Enforcement、C4
      Component、Java Module System、Périphérique Anti-Pattern，以及最终的 Missing Advice。
    source_heading: 本章导读
  - term: 5. Package by Feature
    meaning: Simon Brown 认为 Package by Layer 和常见 Package by Feature 都是 Suboptimal。
    source_heading: 5. Package by Feature
  - term: 13. 两种 Component 定义
    meaning: 一组相关功能，位于清晰 Interface 后，并存在于 Application 等 Execution Environment 中。
    source_heading: 13. 两种 Component 定义
  - term: 17. Figure 34.8：逐种收紧可见性
    meaning: Hidden Concrete Implementations 可由 Composition Root 通过适当 Factory / DI
      组装。
    source_heading: 17. Figure 34.8：逐种收紧可见性
  - term: 22.3 思考 Code Organization
    meaning: Internal Detail。
    source_heading: 22.3 思考 Code Organization
  - term: 30. 知识结构与核心总结
    meaning: 最终 Missing Advice 是把设计映射到代码结构，分别选择 Runtime 与 Compile-Time Decoupling，尽可能让
      Compiler 执行边界，同时依据 Team Size、Skill、Solution Complexity、Time、Budget 和 Data Coupling
      保持务实。
    source_heading: 30. 知识结构与核心总结
