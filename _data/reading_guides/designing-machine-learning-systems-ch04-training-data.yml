overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 原章写作时观察到监督学习仍是生产主流，标签因而是核心资产。自然标签常见但通常延迟；预测到反馈可用之间是 feedback loop length。公司可能优先选择自然标签任务，因为更便宜、更容易形成闭环。
  thesis_source: 6. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：训练数据不是现实的被动副本，而是采样政策、标签政策、代价偏好和不变性假设共同构造出的学习接口。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Sampling：采样
    meaning: 先按关心的切片划分 strata，再分别抽样。例如 A、B 两类各抽 1%，并为每层显式设置至少一个或业务所需的最小样本数，才能保证稀有层被纳入，而不是让多数类随机淹没它。若某层只有几十条，机械计算
      1% 再向下取整仍可能得到 0；“分层”本身不自动提供最小配额。
    source_heading: 2. Sampling：采样
  - term: 4. Class Imbalance：类别不平衡
    meaning: 99.99% 正常时，永远预测正常已有 99.99% 评估准确率，因此用 accuracy 选模会偏爱无用的多数类捷径。训练时通常优化可微的交叉熵而不是准确率，少数类样本仍会产生梯度；真正问题是它们只占
      0.01%，未加权的平均梯度和损失容易被多数类贡献淹没。恒预测多数类不必然是交叉熵的局部最优，但有限数据、模型偏置与优化动态会使学习少数类边界很困难。
    source_heading: 4. Class Imbalance：类别不平衡
  - term: 5. Data Augmentation：数据增强
    meaning: DeepFool 近似寻找让预测越过决策边界的最小范数扰动，其目标不是把错误类别置信度推到很高。加入这些样本可暴露决策边界弱点，但增加训练成本，并只提升相应威胁模型下的鲁棒性。前面的
      min-max 公式描述一般对抗训练目标，不是 DeepFool 本身的优化式。
    source_heading: 5. Data Augmentation：数据增强
  - term: 8. 本章知识结构
    meaning: 数据增强把领域不变性写入训练过程，但错误不变性会制造错标签。
    source_heading: 8. 本章知识结构
  - term: 10. 从本章提炼出的通用训练数据设计方法
    meaning: 本章最值得迁移的原则是：不要只问“有多少数据”，而要问这些数据为什么会出现、为什么带这个标签、哪些错误被平均数隐藏，以及每个处理动作改变了哪一个目标分布。
    source_heading: 10. 从本章提炼出的通用训练数据设计方法
  logic:
  - 0. 本章要回答的核心问题
  - 2. Sampling：采样
  - 3. Labeling：标注
  - 5. Data Augmentation：数据增强
  - 6. 原章总结的完整还原
  - 9. 核心结论
  - 10. 从本章提炼出的通用训练数据设计方法
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - 为什么准确率会掩盖少数类失败，ROC 与 PR 曲线又该怎样选择？
    - 欠采样、过采样、Tomek links、SMOTE、两阶段和动态采样有什么适用边界？
    - 如何把采样、标注、评估与增强组织成一个可审计、可迭代的训练数据闭环？
    - 一句话概括：训练数据不是现实的被动副本，而是采样政策、标签政策、代价偏好和不变性假设共同构造出的学习接口。
  - title: 1. 开篇：为什么训练数据是持续演化的系统资产
    source_heading: 1. 开篇：为什么训练数据是持续演化的系统资产
    paragraphs:
    - 机器学习课程往往偏向模型，因为设计最新模型更有趣；现实工作却常是处理格式错误、规模超过单机内存、语义不一致的数据。数据具有混乱、复杂、不可预测甚至危险的性质，处理不当会让整个
      ML 项目失败。
    - 因此，本章不是教“清洗完再训练”的固定步骤，而是讨论怎样获得或构造能够让模型学到有意义规律的数据。
    - 验证集：用于选择模型、阈值与超参数；
    - 因此“使用数据，但不要过度相信数据”不是反数据立场，而是要求记录数据怎样产生、遗漏了谁、标签代表什么，以及结论在哪些分布上成立。
  - title: 2. Sampling：采样
    source_heading: 2. Sampling：采样
    paragraphs:
    - 原章脚注提醒，小子集试验不是所有模型的可靠淘汰门槛：某些大模型在数据很少时不能体现能力，数据规模增加后才开始有效。更稳妥的做法是使用多个递增数据规模绘制学习曲线，再判断方案是否值得继续，而不是用一个小样本结果永久否决模型。
    - 早期数据大量来自监管宽松的 Phoenix 和公司集中的旧金山湾区，两地通常晴朗。Waymo 在 2016 年扩展到 Kirkland，专门收集雨天数据，但晴天仍更常见。若训练分布缺少雨雪，整体里程再多也不能补足关键天气覆盖。
    - 先按关心的切片划分 strata，再分别抽样。例如 A、B 两类各抽 1%，并为每层显式设置至少一个或业务所需的最小样本数，才能保证稀有层被纳入，而不是让多数类随机淹没它。若某层只有几十条，机械计算
      1% 再向下取整仍可能得到 0；“分层”本身不自动提供最小配额。
    - 频率不可能恰好都等于 0.4，但实测围绕 0.4 波动；重要性样本被刻意配成两个 0、两个 1，因此本例精确得到目标期望 0.2。Monte Carlo
      频率只用于检查实现，并不代替前面的归纳证明。
  - title: 3. Labeling：标注
    source_heading: 3. Labeling：标注
    paragraphs:
    - 原章数字：音频的精确音素级转录可耗费音频时长的 400 倍。1 小时音频需要 400 人时；若一人每天有效标 8 小时，需要 50 个工作日，约 10
      周，而不是连续 24 小时计算下的 16.7 天。原章将其概括为“几乎三个月”。肺癌 X 光项目则等待近一年才取得足够标签。
    - 该近似要求曝光记录完整、每次曝光都有明确观察终点，并且在最终正例中，窗口截断之外不存在未建模的信息性删失；若不同用户或物品的反馈延迟与点击倾向共同变化，还应按切片或生存模型校正。Twitter
      Ads 的历史研究发现多数点击在前五分钟发生，但仍有点击延迟数小时，所以短窗口系统性低估最终 CTR。
    - 原章报告：一名放射科医生用 8 小时写 LF 得到的弱监督标签，训练模型后与近一年人工标注数据训练的模型表现相当。CXR 与 EXR 两个任务分别只使用
      18 和 20 个 LF，其中 6 个跨任务复用；增加未标注数据而不增加 LF，性能仍继续提升。脚注同时提醒，这只是该研究的规模；作者在实践中见过单个任务维护数百个
      LF 的团队。
    - 弱监督利用启发式；半监督从少量种子标签出发，利用未标注数据的结构假设。原章指出这类方法至少在 1990 年代已经使用，并以 1998 年 co-training
      工作为例；同时提供 2008 与 2018 年两份综述入口。
  - title: 4. Class Imbalance：类别不平衡
    source_heading: 4. Class Imbalance：类别不平衡
    paragraphs:
    - 99.99% 正常时，永远预测正常已有 99.99% 评估准确率，因此用 accuracy 选模会偏爱无用的多数类捷径。训练时通常优化可微的交叉熵而不是准确率，少数类样本仍会产生梯度；真正问题是它们只占
      0.01%，未加权的平均梯度和损失容易被多数类贡献淹没。恒预测多数类不必然是交叉熵的局部最优，但有限数据、模型偏置与优化动态会使学习少数类边界很困难。
    - Talos 2021 年页面称全球邮件近 85% 是垃圾邮件，但公司邮箱数据库中的垃圾比例可能很低，因为上游过滤器已拦截大部分垃圾。使用数据库样本训练会学到经过旧系统选择后的条件分布，不是原始邮件总体。
    - 原章引用的历史结论包括：问题越复杂，对不平衡越敏感；线性可分的简单问题可能不受影响；二分类通常比多分类容易；2017 年所谓“超过 10 层的很深网络”在不平衡数据上优于浅层网络。这些结论依赖任务和时代，不是现代架构的普遍阈值。
    - Precision、recall、F1 是非对称的。Model A 若把 NORMAL 当正类，F1 约 0.95；所以报告 F1 时必须写明 positive
      label。多分类还要说明 macro、micro 或 weighted averaging。
  - title: 5. Data Augmentation：数据增强
    source_heading: 5. Data Augmentation：数据增强
    paragraphs:
    - 裁剪、翻转、旋转、水平/垂直反转、随机擦除等操作后，狗通常仍是狗。AlexNet 论文指出，CPU 可在 GPU 训练上一 batch 时并行生成变换图像，使当时这些增强“实际上计算免费”。
    - Su 等人的实验报告：只改变一个像素，可使 Kaggle CIFAR-10 测试自然图像中的 67.97% 和 ImageNet 测试图像中的 16.04%
      被其所测 AllConv、NiN、VGG 模型误分类。
    - DeepFool 近似寻找让预测越过决策边界的最小范数扰动，其目标不是把错误类别置信度推到很高。加入这些样本可暴露决策边界弱点，但增加训练成本，并只提升相应威胁模型下的鲁棒性。前面的
      min-max 公式描述一般对抗训练目标，不是 DeepFool 本身的优化式。
    - CycleGAN 可做域间图像转换。原章引用 Sandfort 等人的 CT segmentation 研究：把 CycleGAN 生成图像加入原训练数据，显著改善泛化。
  - title: 6. 原章总结的完整还原
    source_heading: 6. 原章总结的完整还原
    paragraphs:
    - 训练数据仍是现代 ML 的基础。算法再聪明，坏数据也无法让它学到可靠规律，因此值得投入时间构造高质量训练数据。
    - 原章写作时观察到监督学习仍是生产主流，标签因而是核心资产。自然标签常见但通常延迟；预测到反馈可用之间是 feedback loop length。公司可能优先选择自然标签任务，因为更便宜、更容易形成闭环。
    - 没有自然标签时，人工标注昂贵、缓慢并涉及隐私。弱监督、半监督、迁移学习和主动学习分别利用启发式、数据结构、预训练知识和模型信息需求，减少人工标签负担。
    - 现实类别不平衡是常态。它带来少数类信号不足、多数类捷径和非对称错误成本。处理顺序包括选择正确指标、数据层重采样和算法层修改损失；这些方法可能必要但不充分。
  - title: 8. 本章知识结构
    source_heading: 8. 本章知识结构
    paragraphs:
    - 类别频率与错误成本决定平均损失是否代表业务重点。
    - 重采样和加权重新分配学习注意力，但评估必须回到目标分布。
    - 数据增强把领域不变性写入训练过程，但错误不变性会制造错标签。
    - 模型错误和生产反馈又反过来指导下一轮采样、标注和增强。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - Weighted sampling 与 sample weighting 作用层次不同。 一个改变出现频率，一个改变损失贡献。
    - 弱监督、半监督、迁移学习和主动学习分别利用规则、结构、预训练知识和模型不确定性。 它们可组合，但各有独立假设。
    - 准确率在重不平衡任务中可能毫无意义。 Precision、recall、F1、ROC、PR 和业务代价要联合分析。
    - 数据增强的本质是编码任务先验。 普通保标签变换要求标签值不变；Mixup 等方法允许标签按明确规则同步变化。共同要求是变换后的标签仍与新样本语义正确对应。
  - title: 10. 从本章提炼出的通用训练数据设计方法
    source_heading: 10. 从本章提炼出的通用训练数据设计方法
    paragraphs:
    - 优先识别自然反馈；高价值困难案例交给专家；重复领域知识编码为 LF；预训练与半监督扩大利用未标注数据；主动学习分配剩余预算。
    - 先问比例来自现实、采样、上游过滤还是标签错误；再确定需要改善的是概率校准、少数类召回、人工审核容量还是高额回归尾部。
    - 为每个变换写出不变性假设，抽查增强样本，并在真实未增强测试集评估。对抗增强要明确威胁模型，合成数据要检查伪影与记忆。
    - 本章最值得迁移的原则是：不要只问“有多少数据”，而要问这些数据为什么会出现、为什么带这个标签、哪些错误被平均数隐藏，以及每个处理动作改变了哪一个目标分布。
  takeaways:
  - 训练数据仍是现代 ML 的基础。算法再聪明，坏数据也无法让它学到可靠规律，因此值得投入时间构造高质量训练数据。
  - 标签决定这些模式被解释成什么监督目标。
  - 采样政策直接决定训练分布。 便利采样适合起步，却不能无条件代表目标总体。
  - 反馈窗口是在适应速度与标签成熟度之间取舍。 长反馈任务需要临时代理与成熟标签并存。
  - 合成数据能扩展覆盖，不能自动保证真实性、公平性或隐私。 真实分布上的独立评估不可替代。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 Training data 不只指用于梯度更新的 train split」？
  answer: 本章语境包含 train、validation 和 test。三者用途不同，处理政策必须防止泄漏。
  source_heading: 7.1 Training data 不只指用于梯度更新的 train split
- level: 概念辨析
  question: 原文如何解释「7.4 分层采样不等于训练和评估都改成均衡分布」？
  answer: 训练可为学习效率过采稀有层；评估仍应代表目标分布，或使用明确设计权重恢复总体。
  source_heading: 7.4 分层采样不等于训练和评估都改成均衡分布
- level: 概念辨析
  question: 原文如何解释「7.6 水库采样均匀的是事件，不一定是实体」？
  answer: 高频用户有更多事件，按事件均匀会让其更常入选。若目标是用户均匀，应先按用户聚合或采用分层 reservoir。
  source_heading: 7.6 水库采样均匀的是事件，不一定是实体
- level: 概念辨析
  question: 原文如何解释「7.21 原章的 per-class “accuracy” 实际更接近 recall」？
  answer: 标准术语应写 sensitivity / recall，避免与整体准确率混淆。
  source_heading: 7.21 原章的 per-class “accuracy” 实际更接近 recall
- level: 概念辨析
  question: 原文如何解释「7.31 BERT 不是把所有 token 的 15% 都随机替换」？
  answer: 先选 15%，其中 10% 随机替换，所以约 1.5% 的全部 token 被随机词替换。
  source_heading: 7.31 BERT 不是把所有 token 的 15% 都随机替换
