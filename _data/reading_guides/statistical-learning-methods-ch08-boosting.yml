  question_source: 0. 本章解决什么问题
  thesis: 为什么这个转化有价值？ 因为求粗糙的分类规则比求精确的分类规则容易得多。设计一个 51% 准确率的分类器很简单（比如单层决策树桩），设计一个 99%
    准确率的分类器却很难。提升方法让我们能用前者构造后者。
  thesis_source: 8.1 提升方法 AdaBoost 算法
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 串行 vs 并行是集成学习的两大流派。第 5 章提到”决策树方差大、不稳定，这正是集成方法的契机”——本章兑现了这个伏笔。Bagging
      通过平均降低方差，Boosting 通过串行纠错降低偏差。
    source_heading: 0. 本章解决什么问题
  - term: 8.1 提升方法 AdaBoost 算法
    meaning: 为什么这个转化有价值？ 因为求粗糙的分类规则比求精确的分类规则容易得多。设计一个 51% 准确率的分类器很简单（比如单层决策树桩），设计一个
      99% 准确率的分类器却很难。提升方法让我们能用前者构造后者。
    source_heading: 8.1 提升方法 AdaBoost 算法
  - term: 8.2 AdaBoost 的训练误差分析
    meaning: 推论：每一轮应选取使 Z_m 最小的 G_m，从而使训练误差界下降最快。这为算法设计提供了直接指导。
    source_heading: 8.2 AdaBoost 的训练误差分析
  - term: 8.4 提升树
    meaning: 分类问题的提升树：只需把 AdaBoost 中的基本分类器限制为二类分类树即可，是 AdaBoost 的特例。
    source_heading: 8.4 提升树
  - term: 8.6 深入理解
    meaning: 但这不是绝对的。在标签噪声较大时，AdaBoost 会严重过拟合——因为指数损失会给被错误标注的样本越来越大的权值（8.3.4 节）。实践中仍需通过验证集选择迭代轮数
      M。
    source_heading: 8.6 深入理解
