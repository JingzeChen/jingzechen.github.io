  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 如果只能得到一堆很平庸的模型（比随机猜测略好），能不能把它们组合成一个很强的模型？
    - 这就是提升（boosting）方法。它的哲学是”三个臭皮匠顶个诸葛亮”——但关键在于，怎样组合才能真正变强？
    - 理解第二条主线尤为重要——它把 AdaBoost 从”一个巧妙的启发式”变成了”一个有明确优化目标的算法”，并直接催生了后来的 GBDT、XGBoost、LightGBM。
    - 串行 vs 并行是集成学习的两大流派。第 5 章提到”决策树方差大、不稳定，这正是集成方法的契机”——本章兑现了这个伏笔。Bagging 通过平均降低方差，Boosting
      通过串行纠错降低偏差。
  - title: 8.1 提升方法 AdaBoost 算法
    source_heading: 8.1 提升方法 AdaBoost 算法
    paragraphs:
    - 为什么这个转化有价值？ 因为求粗糙的分类规则比求精确的分类规则容易得多。设计一个 51% 准确率的分类器很简单（比如单层决策树桩），设计一个 99% 准确率的分类器却很难。提升方法让我们能用前者构造后者。
    - AdaBoost 的巧妙之处，在于把这两个直觉自然而有效地实现在同一个算法里——而且后来发现，这两个看似独立的设计其实都源自同一个优化目标（8.3 节）。
    - 即：误差率就是被误分类样本的权值之和。这清楚地显示了权值分布 D_m 与误差率的关系——同一个分类器在不同权值分布下有不同的”误差率”。
    - 没有任何一个点被全部三个分类器同时分错，所以加权表决时总有多数正确。这正是权值更新机制的功劳：它强迫后续分类器去关注前面分错的样本。
  - title: 8.2 AdaBoost 的训练误差分析
    source_heading: 8.2 AdaBoost 的训练误差分析
    paragraphs:
    - 这就是指数损失是 0-1 损失的上界——与第 7 章合页损失的作用完全相同，都是”代理损失”。
    - 这个恒等式非常漂亮：规范化因子 Z_m 原本只是为了让权值和为 1 引入的”技术性”量，结果它们的连乘积恰好等于训练集上的平均指数损失。
    - 推论：每一轮应选取使 Z_m 最小的 G_m，从而使训练误差界下降最快。这为算法设计提供了直接指导。
    - 即使弱分类器只有 55% 的准确率（比抛硬币好一点点），也只需约 900 轮就能把训练误差压到 1% 以下。
  - title: 8.3 AdaBoost 的解释：前向分步算法
    source_heading: 8.3 AdaBoost 的解释：前向分步算法
    paragraphs:
    - AdaBoost 那些看似巧妙的设计（指数形式的权值更新、对数形式的系数），到底从哪里来？
    - 即”当前集成模型在样本 i 上的损失“。损失大（分得差）的样本权值大——所以下一个分类器会重点关注它们。这比”提高错分样本权值”的直觉描述更精确。
    - 正是第 4 章的后验最大化准则。所以指数损失是”分类校准”的（classification-calibrated）——最小化它能收敛到贝叶斯最优分类器。
    - 改进方向：LogitBoost 用对数损失、GentleBoost 用平方损失，都是为了降低对噪声的敏感度。
  - title: 8.4 提升树
    source_heading: 8.4 提升树
    paragraphs:
    - 分类问题的提升树：只需把 AdaBoost 中的基本分类器限制为二类分类树即可，是 AdaBoost 的特例。
    - 这个结论极其简洁优美。它把”最小化复杂的组合损失”变成了”用普通回归树拟合一列新的目标值”——而拟合回归树的方法第 5 章已经讲过了。
    - "(c) 用原始损失确定叶子的取值——负梯度只是一阶近似，直接用它做输出值不够准确，所以再做一次精确的一维优化。"
    - 这一系列方法至今仍是结构化/表格数据上最强的方法之一，在 Kaggle 等竞赛中长期占据主导地位。XGBoost 的主要改进是用二阶泰勒展开（同时用一阶和二阶导数）代替只用一阶梯度，并加入正则项。
  - title: 8.6 深入理解
    source_heading: 8.6 深入理解
    paragraphs:
    - 为什么 Boosting 降低偏差？ 因为每一步都在纠正当前模型的错误（拟合残差/负梯度），模型复杂度逐步提升，拟合能力越来越强。
    - 这也解释了基学习器的选择：Boosting 用弱学习器（避免一开始就过拟合），Bagging 用强学习器（本身偏差已小，只需降方差）。
    - 一个著名的实验现象：AdaBoost 在训练误差降为 0 之后，继续迭代反而能进一步降低测试误差。这与”训练误差为 0 就该停止”的直觉相悖。
    - 但这不是绝对的。在标签噪声较大时，AdaBoost 会严重过拟合——因为指数损失会给被错误标注的样本越来越大的权值（8.3.4 节）。实践中仍需通过验证集选择迭代轮数
      M。
  - title: 8.7 本章方法论总结
    source_heading: 8.7 本章方法论总结
    paragraphs:
    - 提升方法的两个核心问题：如何改权值、如何组合；AdaBoost 的答案是”提高错分样本权值”和”加权多数表决”。
    - 定理 8.3：AdaBoost = 加法模型 + 指数损失 + 前向分步算法。
    - Boosting 串行降偏差，Bagging 并行降方差；前者用弱学习器，后者用强学习器。
    - AdaBoost 训练误差为 0 后继续迭代仍能提升泛化，可用间隔理论解释。
  takeaways:
  - 串行 vs 并行是集成学习的两大流派。第 5 章提到”决策树方差大、不稳定，这正是集成方法的契机”——本章兑现了这个伏笔。Bagging 通过平均降低方差，Boosting
    通过串行纠错降低偏差。
  - 即使弱分类器只有 55% 的准确率（比抛硬币好一点点），也只需约 900 轮就能把训练误差压到 1% 以下。
  - 改进方向：LogitBoost 用对数损失、GentleBoost 用平方损失，都是为了降低对噪声的敏感度。
  - 但这不是绝对的。在标签噪声较大时，AdaBoost 会严重过拟合——因为指数损失会给被错误标注的样本越来越大的权值（8.3.4 节）。实践中仍需通过验证集选择迭代轮数
    M。
  - AdaBoost 训练误差为 0 后继续迭代仍能提升泛化，可用间隔理论解释。
