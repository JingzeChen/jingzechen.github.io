checks:
- level: 概念辨析
  question: 原文如何解释「19.1 Broadcast、multicast、replication」？
  answer: broadcast 是 group delivery abstraction；replication 用 broadcast/anti-entropy
    传播 state，但还需 merge、durability 和 read semantics。
  source_heading: 19.1 Broadcast、multicast、replication
- level: 概念辨析
  question: 原文如何解释「19.4 CRDT 与“无冲突”」？
  answer: conflict-free 指 merge 按定义 deterministic、无需 consensus；业务上仍可能出现多个 concurrent
    intentions，LWW 甚至会丢一个。
  source_heading: 19.4 CRDT 与“无冲突”
- level: 概念辨析
  question: 原文如何解释「19.6 W+R>N 与 linearizability」？
  answer: 交集只保证读集合碰到写集合，不保证 partial write 原子性、最新版本选择、并发顺序或 real-time history。
  source_heading: 19.6 W+R>N 与 linearizability
- level: 概念辨析
  question: 原文如何解释「19.9 Monotonic program 与 monotonic read」？
  answer: CALM monotonicity 指新 inputs 不撤回 outputs；monotonic reads 是 client session
    不读回更旧 version。名字相似，概念不同。
  source_heading: 19.9 Monotonic program 与 monotonic read
- level: 概念辨析
  question: 原文如何解释「19.11 Available 与 durable」？
  answer: COPS local write 可快速 ACK 并保持 availability，但 broadcast 前 crash 可能丢数据。响应成功、可继续服务和数据耐久是不同性质。
  source_heading: 19.11 Available 与 durable
