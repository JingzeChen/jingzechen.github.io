  question: 原文围绕「一、本章的问题与主张」建立了怎样的核心认识？
  question_source: 一、本章的问题与主张
  thesis: 第一个命题：领先的价值取决于创新类型。薄膜磁头的证据（图 6.1、6.2）表明，在延续性技术中先行者没有可持续优势——富士、日立把旧技术推到近
    10 倍性能后才转换，最终排名毫不逊色。唯一例外是竞争基础单一的“刀锋”行业。而表 6.1 的 83 家企业数据表明，在破坏性技术中，早期进入者的成功率是晚进入者的约
    6 倍（37% 对 6%），平均收入约 30 倍（19 亿对 6450 万美元）。左侧企业用市场风险换竞争风险，是一笔亏本买卖。
  thesis_source: 十三、本章总结
  concepts:
  - term: 一、本章的问题与主张
    meaning: 第五章解决了“把破坏性项目放在谁的客户面前”，第六章解决第二项原则：小市场不能满足大企业的增长需求，并回答一个更具体的战略问题：面对破坏性技术，企业究竟必须抢先，还是可以等待观望？
    source_heading: 一、本章的问题与主张
  - term: 三、引领延续性技术变革可能并不具有决定性的意义
    meaning: 原书明确设了一个防线：这并不意味着长期在性能或成本上落后的企业也能生存。作者的准确表述是——没有证据表明，在延续性创新中领先能带来相对于追随者的明显且长期的竞争优势。原因是复杂产品有多条改进路径，采用新组件只是其中之一；在等待新方法成熟的同时，仍可用无数其他途径扩展传统技术性能。
    source_heading: 三、引领延续性技术变革可能并不具有决定性的意义
  - term: 六、案例研究：推动新兴市场的增长率
    meaning: 原书还列出苹果更长的试错序列：Apple I 失败 → Apple II 平淡 → Apple II+ 成功 → Apple III 因质量问题被弃
      → Lisa 失败 → 前两代 Macintosh 举步维艰 → 第三代 Macintosh 才最终确立用户友好标准。市场是制造商与消费者共同发现的过程，需要时间。
    source_heading: 六、案例研究：推动新兴市场的增长率
  - term: 七、案例研究：等到市场发展到一定规模时再进入
    meaning: 关键洞察：能力不只是“能不能造出这个产品”，还包括“以什么节奏迭代”。Priam 造得出 5.25 英寸硬盘，却造不出台式机市场所需的开发节奏。它从未拿到台式机厂商的大订单，因为新产品始终赶不上对方的设计周期。
    source_heading: 七、案例研究：等到市场发展到一定规模时再进入
  - term: 十一、作者方法的有效性、局限与替代方案
    meaning: 成功的定义单一。以“至少一年收入 1 亿美元”为门槛，忽略利润率、投资回报和存活时长；表中明确包含“即使日后破产也计入成功”的企业。
    source_heading: 十一、作者方法的有效性、局限与替代方案
