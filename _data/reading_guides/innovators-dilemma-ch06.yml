- level: 概念辨析
  question: 原文如何解释「10.1 “先发优势总是存在”」？
  answer: 不对。表 6.1 与图 6.2 显示，在延续性技术中先发几乎没有可持续优势。先发优势的存在与否取决于创新类型和竞争基础的复杂度。
  source_heading: 10.1 “先发优势总是存在”
- level: 概念辨析
  question: 原文如何解释「10.4 “加大投入可以催熟新兴市场”」？
  answer: 不对。新市场的成形依赖消费者与制造商共同发现用途，需要时间。加大投入不一定按比例加速发现，却一定抬高盈亏平衡点，反而更快把项目推向“失败”标签。
  source_heading: 10.4 “加大投入可以催熟新兴市场”
- level: 概念辨析
  question: 原文如何解释「10.5 “等市场清晰后凭资源优势进入即可”」？
  answer: 不对。Priam 与希捷说明，等待期内先行者积累的是开发节奏、销售方式和客户定制流程等嵌入组织的能力，后来者难以复制。等待换来的信息，可能不如失去的能力值钱。
  source_heading: 10.5 “等市场清晰后凭资源优势进入即可”
- level: 概念辨析
  question: 原文如何解释「10.7 “小机构就是把人减少”」？
  answer: 不对。规模匹配的本质是让收入、利润和订单量级与市场相称，从而使该机构的成功标准与新业务的现实一致。若小团队仍按母公司的绝对收入目标考核，规模匹配就没有发生。
  source_heading: 10.7 “小机构就是把人减少”
- level: 概念辨析
  question: 原文如何解释「10.8 “必须自建小机构”」？
  answer: 不对。艾伦-布拉德利与强生说明，收购与市场规模匹配的小企业同样有效，有时更快。关键是收购后保持流程独立，而非并入主流部门（对比第五章伍尔科的反例）。
  source_heading: 10.8 “必须自建小机构”
