  - title: 35. 核心结论与解决新问题的一般方法
    source_heading: 35. 核心结论与解决新问题的一般方法
    paragraphs:
    - 全书结束不代表学习结束。 十五个案例提供词汇和框架，真实工程继续提供新约束和失败证据。
    - 这篇文章不是因为“公司用了某数据库”而重要。它面对的是读多写少、热点明显且跨地域的访问模式；原方案在数据库随机读和缓存冷启动时失效。新方案把权威数据和派生缓存分离，引入区域缓存、请求合并和失效协议，换取更低
      P99 和更小数据库压力，但增加了陈旧窗口、缓存元数据和故障恢复复杂度。若我的系统只有单地域、低 QPS，我会先使用托管缓存而不是复制整套架构；若数据要求强一致，我还需要重新设计读取和失效边界。文章中的技术版本可能已过时，但“先识别重复读取、再保护权威存储、最后验证故障时回源容量”的推理可以迁移。
    - 能否将 Facebook Feed、Dynamo、Dropbox 等资料映射到前十五章？
    - 如果这些问题都能回答，就掌握了本章真正要传达的能力：把系统设计从有限题库变成持续研究过程。每读一个真实系统，都先还原它所处的约束，再理解机制如何解决问题、如何失败和怎样演进，最终把公司特有的实现提炼为自己能够重新推导的工程判断。
  takeaways:
  - 覆盖 Feed、Chat、Cache、KV、Storage、Sync、Media、ID、Recommendation、Experiment 和迁移；
  - 事故、迁移和成本文章通常比发布公告提供更多权衡信号。
  - 能否列出原方案、瓶颈、新方案和新代价？
  - 能否为目标公司按岗位选择 4 篇高价值材料？
  - 如果这些问题都能回答，就掌握了本章真正要传达的能力：把系统设计从有限题库变成持续研究过程。每读一个真实系统，都先还原它所处的约束，再理解机制如何解决问题、如何失败和怎样演进，最终把公司特有的实现提炼为自己能够重新推导的工程判断。
