  question: 原文如何解释「33.2 公司技术栈与问题答案」？
  answer: 公司用 Cassandra，不意味着面试所有题都应使用 Cassandra。先分析访问模式和一致性。
  source_heading: 33.2 公司技术栈与问题答案
- level: 概念辨析
  question: 原文如何解释「33.7 大公司方案与大规模必需方案」？
  answer: 有些复杂度来自组织、遗留和多产品，不只来自 QPS。小团队应选择最小必要复杂度。
  source_heading: 33.7 大公司方案与大规模必需方案
- level: 概念辨析
  question: 原文如何解释「33.9 工程博客与论文」？
  answer: 演讲：直观，但细节/可检索性较少。
  source_heading: 33.9 工程博客与论文
- level: 概念辨析
  question: 原文如何解释「33.12 博客链接与知识资产」？
  answer: 链接会失效。保存标题、作者、日期、摘要、关键图和原始出处，而不是只收藏 URL。
  source_heading: 33.12 博客链接与知识资产
- level: 概念辨析
  question: 原文如何解释「33.14 模式复用与机械套用」？
  answer: "“缓存、队列、分片”不是默认三件套。每个组件必须由需求、瓶颈或故障触发。"
  source_heading: 33.14 模式复用与机械套用
