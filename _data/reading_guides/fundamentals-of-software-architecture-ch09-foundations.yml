  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - 一个 style 至少压缩了 component topology、physical architecture、deployment、communication
      和 data topology 中的哪些信息？
    - Desktop/database、browser/web server、single-page JavaScript 和 three-tier 分别把计算放在哪里？
    - Silicon Sandwiches 的 domain 与 technical partitioning 各自怎样组织 Common/Local customization？
    - 一句话概括：架构风格是对一组结构默认值的命名压缩；真正的选择必须同时看顶层分区、部署与数据边界、网络现实和团队沟通结构，尤其不能把远程调用误当作“较慢的方法调用”。
  - title: 2. Styles Versus Patterns：风格与模式
    source_heading: 2. Styles Versus Patterns：风格与模式
    paragraphs:
    - Architectural style 与 architecture pattern 容易混淆，因为二者都给反复出现的解决方案命名。但抽象范围不同。
    - Layered architecture 按 presentation、business、service、persistence 等 technical
      capabilities 分层；
    - 按本书 Part II 对 event-driven architecture style 的分类，它属于分布式架构并涉及分布式参与者和消息通信；更广义的
      event-driven programming 也可以完全位于单进程或单体内部。
    - 采用 Kafka 不自动等于 event-driven style；部署 Kubernetes 不自动等于 microservices。
  - title: 3. Fundamental Patterns：基础模式
    source_heading: 3. Fundamental Patterns：基础模式
    paragraphs:
    - Brian Foote 与 Joseph Yoder 在 1997 年 PLoP 论文中定义该 antipattern：结构随意、蔓延、草率，靠临时修补维持；信息在远距离元素间任意共享，最终几乎全局化或重复；整体结构可能从未清晰定义，也可能已侵蚀到无法辨认。
    - 软件通常随时间增加功能，需要分离关注以维持 performance 和 scale。Client/server 是基础 two-tier style：在
      frontend 与 backend 间分配 technical functionality。
    - 虽然物理上有 browser、web、database 三类构件，很多架构师仍称 two-tier，因为 web/database 同属 operations
      center 一侧，UI 在用户浏览器一侧。
    - CORBA 和 DCOM 更准确地说是 distributed-object middleware/technologies，而不是单一 network-level
      protocol：CORBA 通常通过 GIOP/IIOP，DCOM 则通过基于 RPC 的机制完成远程对象协作。
  - title: 5. Monolithic Versus Distributed Architectures：单体与分布式架构
    source_heading: 5. Monolithic Versus Distributed Architectures：单体与分布式架构
    paragraphs:
    - 该式计算的是应用 payload byte rate，不是完整链路带宽。实际 on-the-wire bandwidth 还会受到请求与响应 headers、TLS
      framing、编码、压缩和重传等因素影响。
    - 原章把 200 bytes × 2,000/s 写成 “400 Kbps”。按其给定数值，正确结果是 400,000 bytes/s，即十进制 400
      KB/s 或约 3.2 Mbps；除非原始 payload 或单位另有未说明假设。500 KB × 2,000/s 约 1 GB/s 的结论成立。
    - 架构师要知道谁拥有 latency、routing、firewall、DNS、certificate、capacity 等不同方面。分布式系统的 coordination
      cost 是架构成本，不只是项目管理细节。
    - 合理策略可能包括 additive change、tolerant reader、consumer-driven contract tests、deprecation
      telemetry 和明确 sunset policy，但各有 trade-offs。
  - title: 6. Team Topologies and Architecture：团队拓扑与架构
    source_heading: 6. Team Topologies and Architecture：团队拓扑与架构
    paragraphs:
    - 架构与团队拓扑的交叉远超分区方式。Matthew Skelton 与 Manuel Pais 2019 年《Team Topologies》定义四类与软件架构相关的团队。
    - Domain partitioning、modular monolith 和 microservices 常更容易与其对齐，但若团队仍依赖多个共享层审批，自主性不会自动出现。
    - Evan Bottcher 定义 platform 为：自助 APIs、tools、services、knowledge 与 support 组成的有吸引力
      internal product，使自主交付团队以更高速度、更低协调成本提供产品功能。
    - 其他团队的设计目标都是减少 stream-aligned team 的 friction 和 cognitive load，而不是制造更多跨团队同步。
  - title: 8.1 “Style 与 Pattern 完全同义”
    source_heading: 8.1 “Style 与 Pattern 完全同义”
    paragraphs:
    - 错误之处：pattern 是上下文化解法，style 描述整体拓扑与默认特征。
    - 正确理解：style 内可以组合多个 architecture/design patterns。
  - title: 8.16 “Monolithic 意味着没有模块或层”
    source_heading: 8.16 “Monolithic 意味着没有模块或层”
    paragraphs:
    - 错误之处：layered 和 modular monolith 都可高度结构化。
    - 正确理解：monolithic 主要描述单一 deployment unit。
  - title: 9. 从本章提炼的架构风格分析法
    source_heading: 9. 从本章提炼的架构风格分析法
    paragraphs:
    - 明确 component/physical topology、deployment、communication 和 data topology。
    - 用 Conway’s Law 检查当前团队是否会复制出目标结构，必要时设计 inverse maneuver。
    - 对每条远程边检查 reliability、latency、bandwidth、security、topology、administration、cost、heterogeneity。
    - 定义 contract versions、compensation failure 和 observability。
  - title: 10. 本章知识结构
    source_heading: 10. 本章知识结构
    paragraphs:
    - 命名层：Style 用名称压缩五类架构默认属性，pattern 表达上下文化解法；
    - 组织层：Technical/domain partitioning 与 Conway’s Law 决定代码和团队第一边界；
    - 物理层：Monolithic/distributed 决定是否承担网络、数据和远程协调成本；
    - 运营层：11 个 fallacies 与 Team Topologies 决定分布式系统能否长期运行和演进。
  - title: 12. 主动回忆与应用题
    source_heading: 12. 主动回忆与应用题
    paragraphs:
    - 完整复述 Silicon Sandwiches 两种 partition，并比较其 customization、global coupling 与 data
      migration。
    - 某流程共有 8 个平均 75 ms 的独立远程调用：前 4 个必须串行完成，随后 4 个可以同时并行；忽略本地处理、调度和汇合开销，计算网络延迟理论下界。
    - 为 stamp coupling 比较 private endpoint、field selector、GraphQL 和 consumer-driven
      contract 的权衡。
    - 对一个业务域设计 stream-aligned、enabling、complicated-subsystem 和 platform teams 的交互。
  takeaways:
  - 命名层：Style 用名称压缩五类架构默认属性，pattern 表达上下文化解法；
  - Microservices 是相对大型服务的标签，不是把服务切到最小的命令。
  - Silicon Sandwiches 的 domain design 降低 global coupling、利于分布式迁移；technical customization
    design 集中 Common/Local，却提高全局和数据耦合。
  - Topology 持续变化，且由许多 administrators 共同管理，基础设施协作是架构工作。
  - 每种 style 都有 sweet spot；架构师应掌握多个风格，选择当前上下文的 least-worst trade-offs。
