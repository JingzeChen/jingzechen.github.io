overview:
  kind: summary
  minutes: 13
  question: 原文围绕「一、本章的问题与定位」建立了怎样的核心认识？
  question_source: 一、本章的问题与定位
  thesis: 问题从来不是”人不行”，而是把对的人放进了为别的任务而生的机器里。管理者的责任因此是双重的：既要使能者胜任，更要使能者适得其所。
  thesis_source: 十七、本章总结
  concepts:
  - term: 一、本章的问题与定位
    meaning: 不幸的是，有些管理者并不会审慎地考量他们所在的机构是否具备成功完成任务的能力。他们通常认为，只要项目的每位参与者都具备足够的个人能力，那么他们所在的机构也具备同样的能力。但情况却往往正好相反。
    source_heading: 一、本章的问题与定位
  - term: 四、流程
    meaning: 作者在脚注中明确引用了这一渊源：多萝西·莱昂纳德-巴顿《核心能力与核心僵化：新产品研发管理中的矛盾》（《战略管理期刊》1992 年第 13
      期，111–125 页），并称”莱昂纳德教授在这方面的著作为后来的许多相关研究奠定了基础”。同时引用维克汉姆·斯金纳的《聚焦工厂》（HBR 1974）——聚焦带来效能，也带来局限。
    source_heading: 四、流程
  - term: 八、案例：数字设备公司是否有能力在个人电脑市场取得成功
    meaning: 由于个人电脑的利润率较低，”不符合”数字设备公司的价值观，因此在资源分配流程中，符合公司标准的高性能微型计算机业务便在个人电脑之前优先获得了资源。在数字设备公司内部，任何想要进入个人电脑业务领域的尝试都必须定位在个人电脑市场利润率最高的一级——因为只有在这些级别的市场上所获得的收益率才能为公司的价值观所接受。
    source_heading: 八、案例：数字设备公司是否有能力在个人电脑市场取得成功
  - term: 九、创造新能力应对变革
    meaning: 接下来三节分别评估这三条路径。作者的编排本身就是论证：先讲收购（可行但常被做错）、再讲内部改造（最难、成功率最低）、最后讲分支机构（针对破坏性变革的正解）。
    source_heading: 九、创造新能力应对变革
  - term: 十三、原书小结
    meaning: 如果对以上问题的答案都是否定的也没有关系。解决问题的关键步骤就是理解问题。在上述问题上抱有一厢情愿的想法将会使负责开发和实施创新项目的团队遭遇重重困难，陷入相互猜忌的泥沼，并最终以失败收场。
    source_heading: 十三、原书小结
  - term: 十七、本章总结
    meaning: 图 8.1 的实践价值在于把”要不要分拆”这个模糊问题拆成两个正交的具体问题：现有流程能否胜任（决定团队结构：职能/轻量级/重量级）、现有价值观会否给予优先级（决定机构定位：内部/独立）。四个象限对应四种安排，而”大多数企业统统用轻量级团队”或”全部改成重量级团队”都是错的。
    source_heading: 十七、本章总结
  logic:
  - 一、本章的问题与定位
  - 四、流程
  - 六、流程与价值观的关系，以及如何成功应对延续性技术与破坏性技术
  - 九、创造新能力应对变革
  - 十一、在内部创造新能力
  - 十五、方法的有效性、局限与替代方案
