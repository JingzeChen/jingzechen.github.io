  sections:
  - title: 一、本章的问题与定位
    source_heading: 一、本章的问题与定位
    paragraphs:
    - 第五、六、七章给出了三条经验性建议：把破坏性项目交给存在客户需求的机构（第五章）、让机构规模与市场规模匹配（第六章）、用学习计划代替实施计划（第七章）。
    - 作者从一个日常场景切入。管理者安排人员做创新项目时，会本能地把任务要求与候选人能力做匹配，考察其知识、判断力、技能、洞察力、精力，以及价值观（员工在行动中取舍所遵循的标准）。
    - 不幸的是，有些管理者并不会审慎地考量他们所在的机构是否具备成功完成任务的能力。他们通常认为，只要项目的每位参与者都具备足够的个人能力，那么他们所在的机构也具备同样的能力。但情况却往往正好相反。
    - 问题的实质：如果”能力”可以被任意指认，它就成了一个不可证伪的概念——任何项目都能声称自己符合某项核心能力，任何失败也都能归因于某项能力缺失。这样的概念无法指导决策。
  - title: 三、资源
    source_heading: 三、资源
    paragraphs:
    - 资源是影响机构能力的三类因素中最为直观的一个，这其中包括人员、设备、技术、产品设计、品牌、信息、现金以及与供应商、分销商和客户的关系等。
    - 资源通常都表现为事物或资产的形态——它们可以被使用或闲置、被购买或出售、可贬值也可升值。与”流程”与”价值观”相比，资源更易于在不同机构间实现转移。
    - 在评估机构是否有能力成功实施变革时，管理者要做的第一件事就是确认资源配备情况，但对资源配备的分析数据并不足以代表一个机构的真正实力。
    - 即：先由价值观 V 筛选出哪些项目可以进入，再由流程 P 决定资源 R 如何被转化。资源丰富但 V 排斥、或 P 不匹配，产出依然为零。
  - title: 四、流程
    source_heading: 四、流程
    paragraphs:
    - 在员工将资源投入（人员、设备、技术、产品设计、品牌、信息、能源以及现金）转化为产品或更大价值的服务的过程中，机构也随之创造了价值。在实现这些转化的过程中，人们所采取的互动、协调、沟通和决策的模式就是流程。
    - 流程的定义或演变实际上都是为了解决特定的任务。这就意味着，当管理者在执行任务时，如果使用了专为该任务设定的流程，那么他通常能有效地完成使命。但是，如果把看上去同等有效的相似流程应用于不同任务时，这个流程就可能显得缓慢、死板且效率低下。
    - 作者在脚注中明确引用了这一渊源：多萝西·莱昂纳德-巴顿《核心能力与核心僵化：新产品研发管理中的矛盾》（《战略管理期刊》1992 年第 13 期，111–125
      页），并称”莱昂纳德教授在这方面的著作为后来的许多相关研究奠定了基础”。同时引用维克汉姆·斯金纳的《聚焦工厂》（HBR 1974）——聚焦带来效能，也带来局限。
    - 从本质上看，管理面临的其中一个困境就是，流程的建立是为了让员工持续不断地重复完成任务。为了保持这种连续性，就意味着不要去改变流程——如果一定要改变，也必须在严格的程序控制下进行。这就意味着机构用以创造价值的机制从本质上说是排斥变化的。
  - title: 六、流程与价值观的关系，以及如何成功应对延续性技术与破坏性技术
    source_heading: 六、流程与价值观的关系，以及如何成功应对延续性技术与破坏性技术
    paragraphs:
    - 作者对 111 项延续性技术的性质作了说明：其中”有一部分属于渐进式改善，而其他的（例如磁阻磁头）技术则代表了产品性能的非连续性跳跃式提升“——即难度跨度极大，从最简单到最困难都包含在内。
    - 行业领先企业不断地开发和推出延续性创新技术。月复一月，年复一年……最后，这些领先企业的技术潜力评估和客户需求调查流程都越来越偏向于延续性技术。按照本章的说法，这些机构培养了企业开展此类活动的能力，而且这种能力已经根植于企业的流程中。
    - 为什么破坏性创新”无法形成流程”值得单独强调：流程的形成需要重复（4.5 节：流程存在的意义就是让员工重复完成任务）。而破坏性创新在硬盘行业 20 余年间只出现
      5 次，平均约 4 年一次。低频事件在结构上无法沉淀为流程——这不是管理者不努力，而是流程形成机制的前提（重复）不成立。
    - 对于面临变革或创新需求的管理者来说，他们所要做的不止是根据任务需求正确分配资源，还要确保获得这些资源的机构有能力获得成功——而在进行评估时，管理者必须仔细分析机构的流程和价值观是否和任务相匹配。
  - title: 八、案例：数字设备公司是否有能力在个人电脑市场取得成功
    source_heading: 八、案例：数字设备公司是否有能力在个人电脑市场取得成功
    paragraphs:
    - 数字设备公司（DEC）是 20 世纪 60~80 年代一家非常成功的微型计算机生产商。我们可能要忍不住断言：当个人电脑市场在 20 世纪 80 年代初逐渐形成时，数字设备公司的”核心能力”就是制造计算机。但如果情况真是这样，数字设备公司又是因何折戟沉沙的呢？
    - 虽然数字设备公司的员工完全具备设计、制造和销售个人电脑并实现赢利的能力，但是他们所在的机构却缺乏这种能力，因为机构的流程设计和演化是为了很好地完成其他任务。而使得数字设备公司在一项业务上大获成功的那个流程恰恰就是使它在其他业务领域无所作为的根本原因。
    - 由于个人电脑的利润率较低，”不符合”数字设备公司的价值观，因此在资源分配流程中，符合公司标准的高性能微型计算机业务便在个人电脑之前优先获得了资源。在数字设备公司内部，任何想要进入个人电脑业务领域的尝试都必须定位在个人电脑市场利润率最高的一级——因为只有在这些级别的市场上所获得的收益率才能为公司的价值观所接受。
    - 正如我们在第五章所看到的那样，数字设备公司可以通过”另建”一个机构，针对个人电脑市场的市场规则量身打造合适的流程和价值观。但是位于马萨诸塞州梅纳德的公司总部所具备的超凡能力使得公司在微型计算机业务上取得了巨大的成功，但同时也使得公司无法在个人电脑领域再立新功。
  - title: 九、创造新能力应对变革
    source_heading: 九、创造新能力应对变革
    paragraphs:
    - 如果认为某位员工无法完成指定的任务，那么管理者就会另觅人手，或者认真培训该员工。培训通常都是有效的，因为一个人有能力掌握多种技能。
    - 尽管时下流行的”变革管理”和”重建计划”产生了许多理念，流程并不像资源那样”灵活”或者是”可培训的”，价值观更是如此。
    - 这与”多元化摊薄能力”的直觉一致，但给出了更精确的机制：不是精力被分散，而是同一套 P 和 V 无法同时对两类任务最优。
    - 接下来三节分别评估这三条路径。作者的编排本身就是论证：先讲收购（可行但常被做错）、再讲内部改造（最难、成功率最低）、最后讲分支机构（针对破坏性变革的正解）。
  - title: 十一、在内部创造新能力
    source_heading: 十一、在内部创造新能力
    paragraphs:
    - 用加大资源投入力度的方法来改变现有机构的能力是一种非常直接的做法。企业可以雇用新型人才、购买新技术、募集资金，可以收购产品线、品牌和信息。但这些资源几乎总是被生搬硬套到基本上一成不变的流程中，因而，结果也不会发生什么改变。
    - 当新的挑战要求不同的人员或团队以不同于他们习惯的方式进行协作时……管理者就需要从现有机构中抽调出相关人员，并围绕新团队划定一个新的界限。新团队的界限有助于新合作模式的产生，并将最终形成新的流程——即能够将投入转化为产出的新能力。
    - 他们对重量级团队的定义是，为实现特定使命而共处一地的团队成员。每名团队成员的职责不是去代表他们所在的职能部门，而是要承担起总经理的角色——即他们要为整个项目的成功负责，要积极参与其他职能部门的团队成员的决策过程，并与他们通力合作。在合作开展项目的过程中，他们会找到新的互动、协作及决策方式，并最终形成新的流程或新的能力。
    - 当破坏性变化出现在人们的视野中时，管理者需要在主流机构受到影响之前，发展出相应的能力来应对变革。换句话说，他们需要在可能导致原有机构发生翻天覆地的变化的危机真正到来之前，成立一个新的机构来应对新挑战。
  - title: 十三、原书小结
    source_heading: 十三、原书小结
    paragraphs:
    - 当机构遭遇变革时，管理者首先必须要确定他们是否具备成功所需的资源。然后，他们需要再问一个不同的问题：机构是否具备能成功所需的流程和价值观？
    - 如果对以上问题的答案都是否定的也没有关系。解决问题的关键步骤就是理解问题。在上述问题上抱有一厢情愿的想法将会使负责开发和实施创新项目的团队遭遇重重困难，陷入相互猜忌的泥沼，并最终以失败收场。
    - 对于成熟企业来说，创新之所以总是看起来困难重重，其原因就在于它们聘用了能力很强的人，并将设计初衷与他们肩负的使命不相匹配的流程和价值观强加给他们。
    - "“能者适得其所”（enabling capable people to succeed）与开篇的”使能者胜任”形成呼应，完成了全章的结构闭环。"
  - title: 十五、方法的有效性、局限与替代方案
    source_heading: 十五、方法的有效性、局限与替代方案
    paragraphs:
    - RPV 有事后解释的风险。任何失败都可归因于”流程或价值观不匹配”，若无事前的独立测量，框架有滑向不可证伪的危险——这恰是作者批评”核心能力”的同一问题。
    - CEO 必要性的断言过强。”从来没有发现例外”是对已观察样本的陈述，样本本身可能有选择偏差（成功的无 CEO 案例可能因规模小而未被研究）。
    - 时代局限。成稿于 2000 年 2 月，案例集中于制造业与早期互联网。云计算、平台化、敏捷组织等大幅降低了流程重构成本，可能改变部分结论的强度。
    - 特别值得注意的是与 RBV 的张力：资源基础观认为可持续竞争优势来自难以模仿的资源，而 RPV 认为资源”更易于在不同机构间实现转移”，优势实际来自 P
      与 V。二者对”资源”的定义宽窄不同——RBV 的”资源”包含 RPV 的 P 和 V。理解这一点可避免概念混淆。
  - title: 十七、本章总结
    source_heading: 十七、本章总结
    paragraphs:
    - 最有力的对照：丰田靠改造 P 颠覆全球汽车业，通用汽车投入近 600 亿美元于 R 而”绩效并没有得到明显的改观”——在流程不变的前提下，资源投入的边际效果接近于零。
    - 图 8.1 的实践价值在于把”要不要分拆”这个模糊问题拆成两个正交的具体问题：现有流程能否胜任（决定团队结构：职能/轻量级/重量级）、现有价值观会否给予优先级（决定机构定位：内部/独立）。四个象限对应四种安排，而”大多数企业统统用轻量级团队”或”全部改成重量级团队”都是错的。
    - 破坏性是相对的。同一项互联网销售，对戴尔是延续性、对康柏是破坏性；同一项在线交易，对嘉信是延续性、对美林是破坏性。不存在通用的”破坏性技术清单”。
    - 对于成熟企业来说，创新之所以总是看起来困难重重，其原因就在于它们聘用了能力很强的人，并将设计初衷与他们肩负的使命不相匹配的流程和价值观强加给他们。
  takeaways:
  - 判决性证据：硬盘行业 116 项技术中，111 项延续性技术在位者成功率 100%，5 项破坏性技术成功率 0%。
  - 4 000 万与 400 亿美元的企业，同为 25% 增长，所需新增收入相差 1000 倍。
  - 图 8.1 的实践价值在于把”要不要分拆”这个模糊问题拆成两个正交的具体问题：现有流程能否胜任（决定团队结构：职能/轻量级/重量级）、现有价值观会否给予优先级（决定机构定位：内部/独立）。四个象限对应四种安排，而”大多数企业统统用轻量级团队”或”全部改成重量级团队”都是错的。
  - 破坏性是相对的。同一项互联网销售，对戴尔是延续性、对康柏是破坏性；同一项在线交易，对嘉信是延续性、对美林是破坏性。不存在通用的”破坏性技术清单”。
  - 问题从来不是”人不行”，而是把对的人放进了为别的任务而生的机器里。管理者的责任因此是双重的：既要使能者胜任，更要使能者适得其所。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「14.1 “核心能力”就是”我们擅长做的事”」？
  answer: 不对。这种表述不可证伪，因而无用。DEC 案例证明：”擅长制造计算机”无法解释为何造不了个人电脑。RPV 框架要求把”擅长”分解为具体的流程（设计周期、组件来源、渠道）和具体的价值观（毛利率门槛），才能得出可操作的判断。
  source_heading: 14.1 “核心能力”就是”我们擅长做的事”
- level: 概念辨析
  question: 原文如何解释「14.3 价值观 = 企业文化宣言」？
  answer: 不对。RPV 中的价值观是员工实际用来排序的决策标准，典型表现为毛利率门槛、最小订单规模、客户优先级。它写在提成方案和预算规则里，而不是写在墙上。
  source_heading: 14.3 价值观 = 企业文化宣言
- level: 概念辨析
  question: 原文如何解释「14.7 分拆是应对创新的通用做法」？
  answer: 不对。作者的限定是”也只能是此时“——仅当成本结构冲突或规模不匹配时。延续性创新应留在主流机构（微软浏览器位于 A 区）。滥用分拆会损失协同并重复建设。
  source_heading: 14.7 分拆是应对创新的通用做法
- level: 概念辨析
  question: 原文如何解释「14.9 危机能倒逼变革」？
  answer: 不对（至少不可依赖）。11.5 节指出，必须在危机到来之前孵化新能力。危机发生时主流机构自身动荡，反而最缺乏孵化新流程的余力。
  source_heading: 14.9 危机能倒逼变革
- level: 概念辨析
  question: 原文如何解释「14.11 能力可以像技能一样培训」？
  answer: 不对。作者明确对比：”一个人有能力掌握多种技能”，但”流程并不像资源那样灵活或可培训的，价值观更是如此”。人可塑，组织不可塑——这正是需要”另建机构”的根本原因。
  source_heading: 14.11 能力可以像技能一样培训
