  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 迷宫 II：最短物理距离。 滚动长度成为非负边权，必须用松弛；Dijkstra 给出稳定的标签确定顺序，A* 用曼哈顿距离引导搜索。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 最终目标是什么：存在任意路径、物理距离最短，还是距离最短后方向字符串字典序最小？
    source_heading: 本章要解决什么问题
  - term: 24.1 迷宫问题概述
    meaning: 单位权保证第一次赋值就是最短值，所以可在入队时标记访问，不需要后续松弛。
    source_heading: 24.1 迷宫问题概述
  - term: 1. 经过格、停点与洞是三种不同语义
    meaning: 错误地把经过格当成停点，会生成题目不允许的转向；错误地把洞当成普通目的地，会让球穿过洞。
    source_heading: 1. 经过格、停点与洞是三种不同语义
  - term: 2. 最少滚动次数不等于最短物理距离
    meaning: 设路径 A 有两次滚动，长度分别为 8 和 8，总距离 16；路径 B 有三次滚动，长度分别为 2、3、4，总距离 9。
    source_heading: 2. 最少滚动次数不等于最短物理距离
  - term: 6. A* 为什么可能比 Dijkstra 快
    meaning: 优先选择“已走距离短且看起来更靠近目标”的状态。可采纳且一致的 h 不改变最短距离答案，但可能减少与目标无关的扩展。
    source_heading: 6. A* 为什么可能比 Dijkstra 快
  - term: 本章总结
    meaning: 迷宫 II：最短物理距离。 滚动长度成为非负边权，必须用松弛；Dijkstra 给出稳定的标签确定顺序，A* 用曼哈顿距离引导搜索。
    source_heading: 本章总结
  logic:
