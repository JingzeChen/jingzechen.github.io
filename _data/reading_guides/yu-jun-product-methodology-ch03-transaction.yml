overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章要回答的问题」建立了怎样的核心认识？
  question_source: 1. 本章要回答的问题
  thesis: 第二章提出“产品即交易”，但如果只把它当成一句口号，仍然无法指导具体决策。第三章开始把价值交换拆成可分析的变量：用户获得哪些效用、付出哪些成本，新增一单位投入的收益如何变化，价格与供需怎样互相影响，以及产品怎样通过降低交易成本促成原本不会发生的交换。
  thesis_source: 1. 本章要回答的问题
  concepts:
  - term: 1. 本章要回答的问题
    meaning: 第二章提出“产品即交易”，但如果只把它当成一句口号，仍然无法指导具体决策。第三章开始把价值交换拆成可分析的变量：用户获得哪些效用、付出哪些成本，新增一单位投入的收益如何变化，价格与供需怎样互相影响，以及产品怎样通过降低交易成本促成原本不会发生的交换。
    source_heading: 1. 本章要回答的问题
  - term: 7.1 什么是效用
    meaning: 原书 OCR 在不同位置对该公式有识别差异，这里按常见的萨缪尔森幸福方程记录为比值。它表达的不是精确测量公式，而是：欲望不变时，提高效用会增加满足感；效用不变时，欲望越大，主观满足感越低。
    source_heading: 7.1 什么是效用
  - term: 10.1 机会成本
    meaning: 职业司机开网约车时，放弃的是其他职业可能获得的收入，因此对订单收入要求较高。顺风车司机本来就要从上海去杭州，只要接送绕路很少，新增订单的机会成本接近于零，可以接受更低价格。
    source_heading: 10.1 机会成本
  - term: 12.3 信任品
    meaning: 网约车极端安全风险属于信任品效用。即使企业把客观事故率降低很多，单个用户也无法靠有限乘车次数验证。若用户信任仍远低于客观安全水平，只改善后台技术而不改善可理解的安全信息、承诺和保障，行为可能不变。
    source_heading: 12.3 信任品
  - term: 15.1 公式
    meaning: 把用户支付的代价拆成直接成本和交易成本，而不只看货币标价。
    source_heading: 15.1 公式
  - term: 21. 复习卡片
    meaning: Q：为什么交换能创造价值？ A：不同参与者对同一资源的主观效用不同，自愿交换让资源流向估值更高或更能发挥作用的一方，使双方预期净效用增加。
    source_heading: 21. 复习卡片
  logic:
  - 1. 本章要回答的问题
  - 7.1 什么是效用
  - 8.2 够用就好：不必持续提高
  - 12.3 信任品
  - 13.6 智能手机降低排队机会成本
  - 17.3 寻找交易成本
  - 21. 复习卡片
  sections:
  - title: 1. 本章要回答的问题
    source_heading: 1. 本章要回答的问题
    paragraphs:
    - 第二章提出“产品即交易”，但如果只把它当成一句口号，仍然无法指导具体决策。第三章开始把价值交换拆成可分析的变量：用户获得哪些效用、付出哪些成本，新增一单位投入的收益如何变化，价格与供需怎样互相影响，以及产品怎样通过降低交易成本促成原本不会发生的交换。
    - 为什么自愿交换能够创造价值，而不是简单的等价互换？
    - 为什么标准化、线上化、评价系统和品牌能创造巨大价值？
    - 本章的分析框架可以概括为：以交易为基本单位，把产品拆成效用组合与完整成本，再用边际和供需分析变化，用交易模型保证多方可持续。
  - title: 5.2 损失厌恶：得到与失去并不对称
    source_heading: 5.2 损失厌恶：得到与失去并不对称
    paragraphs:
    - 书中引用马克杯实验：一组学生获得马克杯，另一组获得等值现金。拥有杯子后，卖方对杯子的估值普遍高于未拥有者愿意支付的价格。因为“一个杯子”和“我已经拥有的杯子”不是同一个心理产品，放弃所有物会被感知为损失。
    - 损失厌恶是指同等数量的损失带来的负效用，通常大于同等收益带来的正效用。原书引用“约为 2.5 倍”的经验性比例，并据此说明用户放弃已有状态时，新增价值需要明显大于表面替换成本。
    - 免费试用结束后的付费选择，与从未获得该功能时的付费选择不同。
    - 笔记辨析：损失厌恶的强度不是普遍固定常数，会随交易对象、情境、经验和实验方法变化。产品决策应把“损失比收益更敏感”作为待验证假设，而不是机械套用 2.5
      倍。
  - title: 7.1 什么是效用
    source_heading: 7.1 什么是效用
    paragraphs:
    - 效用是欲望被满足的程度，是特定个体在特定情境中的主观评价，不是产品客观属性的简单总和。
    - 边际效用递减：财富增加通常带来正效用，但每增加一单位财富带来的额外满足可能逐渐下降。
    - 原书 OCR 在不同位置对该公式有识别差异，这里按常见的萨缪尔森幸福方程记录为比值。它表达的不是精确测量公式，而是：欲望不变时，提高效用会增加满足感；效用不变时，欲望越大，主观满足感越低。
    - 欲望具有种类与程度上的无限性。生理、安全、社会、尊重和自我实现等需求不断出现，但资源永远有限，这构成了选择、成本和交易的基础。
  - title: 8.2 够用就好：不必持续提高
    source_heading: 8.2 够用就好：不必持续提高
    paragraphs:
    - 有些效用达到阈值后，继续提高的边际效用很低。技术指标提升五倍，不代表用户感知也提升五倍。
    - 管理方法：找到用户可感知阈值，在边际回报显著下降处停止，把资源转向更缺失的效用。
  - title: 10.1 机会成本
    source_heading: 10.1 机会成本
    paragraphs:
    - 职业司机开网约车时，放弃的是其他职业可能获得的收入，因此对订单收入要求较高。顺风车司机本来就要从上海去杭州，只要接送绕路很少，新增订单的机会成本接近于零，可以接受更低价格。
    - 相同订单、相同支付，对不同供给者的利润不同，原因不只在直接成本，还在机会成本。平台若忽略供给异质性，会设计出错误的统一激励。
  - title: 12.3 信任品
    source_heading: 12.3 信任品
    paragraphs:
    - 使用后仍难验证真实质量，例如部分保健品、美容项目、专业诊疗，以及极低概率安全事件的防护。用户只能依赖专家、认证、品牌、制度和心智认知。
    - 网约车极端安全风险属于信任品效用。即使企业把客观事故率降低很多，单个用户也无法靠有限乘车次数验证。若用户信任仍远低于客观安全水平，只改善后台技术而不改善可理解的安全信息、承诺和保障，行为可能不变。
    - 若能把体验品或信任品的一部分属性标准化、透明化，使其更接近搜寻品，用户的度量、决策和保障成本会显著下降。标准、认证、检测报告、可追溯数据和可信评价都承担这个作用。
  - title: 13.6 智能手机降低排队机会成本
    source_heading: 13.6 智能手机降低排队机会成本
    paragraphs:
    - 排队的主要代价是时间，但时间成本取决于本来可以做什么。智能手机让用户在排队时阅读、通信、娱乐甚至工作。如果不排队时也会做相同事情，等待的机会成本就显著降低。
    - 滴滴排队、海底捞和热门茶饮等模式因此获得新的可行空间。技术没有缩短物理等待，却改变了等待时间的效用组合和相对价格。
  - title: 15.1 公式
    source_heading: 15.1 公式
    paragraphs:
    - 把用户支付的代价拆成直接成本和交易成本，而不只看货币标价。
    - 把商品明确为用户感知的效用组合，而不假设产品内容永远不变。
  - title: 17.3 寻找交易成本
    source_heading: 17.3 寻找交易成本
    paragraphs:
    - 怎样学习、支付、迁移和完成使用？
    - 出现违约、事故或质量问题时怎样保障权利？
    - 每一步记录时间、金钱、体力、认知、风险和情绪成本，再按影响交易量与降低成本的投入做 ROI 排序。
  - title: 21. 复习卡片
    source_heading: 21. 复习卡片
    paragraphs:
    - Q：为什么交换能创造价值？ A：不同参与者对同一资源的主观效用不同，自愿交换让资源流向估值更高或更能发挥作用的一方，使双方预期净效用增加。
    - Q：交易和交易模型有什么区别？ A：交易描述单方的一次行为；交易模型设计多方利益创造、分配和可持续参与机制。
    - Q：降低交易成本为什么会扩大市场？ A：它既让旧交易转向更低成本方式，也让原本收益不足以覆盖成本的潜在交易开始成立。
    - Q：怎样降低产品相对价格？ A：增加用户感知的效用组合，降低直接成本，或降低搜寻、决策、履约和保障等交易成本。
