  sections:
  - title: 本章定位：为横向思想组选择正确的推理关系
    source_heading: 本章定位：为横向思想组选择正确的推理关系
    paragraphs:
    - 横向：同层思想以某种逻辑关系共同完成一次回答。
    - 前两种是同一纵向关系的两个方向。第5章集中处理第三种：同一组思想究竟是前后推导的演绎链，还是从共同点形成概括的归纳组？
    - 面向读者表达时，尤其在关键句层，归纳结构通常更直接、更容易理解。
    - 因此，本章不是要用归纳取代演绎，而是区分发现结论的推理方式与呈现结论的组织方式。
  - title: 二、图 5-1 的直观差异
    source_heading: 二、图 5-1 的直观差异
    paragraphs:
    - 第三项依赖前两项，不能随意交换。上层概括以最终结论为重点，并保留关键依据。
    - 三项不是互相推出，而是共同属于“针对波兰的军事行动”，从共同模式形成更高层判断。
  - title: 归纳推理
    source_heading: 归纳推理
    paragraphs:
    - 演绎沿已有规则前进，归纳则要从不同事物中创造性地发现正确共同点。同一组事实可能按不同方式定义，从而得到不同结论。
    - 但对人物整体人格下结论仍需谨慎：几项计划只能支持“这些计划不实用”，未必充分证明此人在所有方面都不是实用主义者。
    - 共同名词是“财产共有可能带来的不利影响”。各项并列，但适用性取决于司法辖区、财产类型和家庭状况。归纳结构清楚，不代表每项都适用于所有人。
    - 作者说，一旦得到支持某观点的论据，就要用演绎法处理。这可理解为：不能只因为事实相关就声称它支持结论，必须补出支持规则。
  - title: 二、难点在哪里
    source_heading: 二、难点在哪里
    paragraphs:
    - 演绎发现顺序容易被误当成最佳表达顺序；
    - 真实事实容易被当作必须写入的思想；
  - title: 十一、补充和替代工具
    source_heading: 十一、补充和替代工具
    paragraphs:
    - 真值表与形式逻辑：检查演绎有效性；
    - 论证图：显示前提、反例和中间结论；
    - 亲和图：从大量材料发现归纳分组；
    - 证据矩阵：追踪每个建议对应的问题和原因；
  - title: 四、面向决策者的归纳表达
    source_heading: 四、面向决策者的归纳表达
    paragraphs:
    - 将合规允许且弹性明显的通用负载迁云；
    - 将受监管或延迟敏感负载保留在合规私有环境；
    - 先建立云治理、成本监控与运维能力，再扩大迁移范围。
  - title: 判断组内关系
    source_heading: 判断组内关系
    paragraphs:
    - 第二项是否评述第一项的主语、谓语或条件？
    - 是否存在由“因此”引出的必然或条件性结论？
    - 若无承接，能否用单一名词表示全组？
    - 是否错误地把共享属性当成同一类别？
  - title: 检查归纳
    source_heading: 检查归纳
    paragraphs:
    - 上层概括是否加入未被支持的动机、因果或范围？
    - 若推广到未观察对象，样本是否有代表性？
  - title: 检查材料价值
    source_heading: 检查材料价值
    paragraphs:
    - 调研结果与结论是否只是不同抽象层级？
    - 因果判断是否有机制或反事实支持？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 改革案例说明，按“所有问题—所有原因—所有措施”写，会迫使读者跨组配对；按措施归纳后，每项依据可放回自己的分支。
    - 日本投资案例说明，保持谓语改变主语或保持主语改变对象都可形成归纳，但共同点必须事实准确且与问题相关。
    - 现实分析通常混合归纳、溯因和演绎；金字塔的任务是根据读者问题，把这些结果组织成可理解、可审查的表达。
    - 本章最核心的实践原则是：思考时用演绎追查问题、原因和方案，用归纳从事实中发现共同模式；表达时优先把读者关心的结论或行动放到高层，再在较低层保留必要的演绎证明，并确保任何归纳概括都不超过下层材料真正支持的范围。
  takeaways:
  - 因此，本章不是要用归纳取代演绎，而是区分发现结论的推理方式与呈现结论的组织方式。
  - 作者说，一旦得到支持某观点的论据，就要用演绎法处理。这可理解为：不能只因为事实相关就声称它支持结论，必须补出支持规则。
  - 先建立云治理、成本监控与运维能力，再扩大迁移范围。
  - 若推广到未观察对象，样本是否有代表性？
  - 本章最核心的实践原则是：思考时用演绎追查问题、原因和方案，用归纳从事实中发现共同模式；表达时优先把读者关心的结论或行动放到高层，再在较低层保留必要的演绎证明，并确保任何归纳概括都不超过下层材料真正支持的范围。
