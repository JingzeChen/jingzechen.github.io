checks:
- level: 概念辨析
  question: 原文如何解释「演绎严密与演绎易读」？
  answer: 推理形式严密不意味着长距离呈现易读。可以保留严密证明，同时把高层改成归纳行动结构。
  source_heading: 演绎严密与演绎易读
- level: 概念辨析
  question: 原文如何解释「归纳概括与因果结论」？
  answer: "“三项都发生”只支持共同模式；要说 A 导致 B，还需机制和反事实证据。"
  source_heading: 归纳概括与因果结论
- level: 概念辨析
  question: 原文如何解释「新闻与思想」？
  answer: 新闻强调事实发生，思想强调事实在当前论证中的意义。真实但无支持关系的新闻不应进入文章主干。
  source_heading: 新闻与思想
- level: 概念辨析
  question: 原文如何解释「省略步骤与逻辑跳跃」？
  answer: 读者能唯一补出且接受时可省略；若省略的是争议前提、因果机制或适用条件，就是逻辑跳跃。
  source_heading: 省略步骤与逻辑跳跃
- level: 概念辨析
  question: 原文如何解释「误解十二：归纳结论必须用确定语气」？
  answer: 应根据证据写“可能、支持、很可能”或明确条件，不能把概率推断包装成必然结论。
  source_heading: 误解十二：归纳结论必须用确定语气
