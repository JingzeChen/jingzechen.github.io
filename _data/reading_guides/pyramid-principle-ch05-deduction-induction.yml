overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章定位：为横向思想组选择正确的推理关系」建立了怎样的核心认识？
  question_source: 本章定位：为横向思想组选择正确的推理关系
  thesis: 本章最核心的实践原则是：思考时用演绎追查问题、原因和方案，用归纳从事实中发现共同模式；表达时优先把读者关心的结论或行动放到高层，再在较低层保留必要的演绎证明，并确保任何归纳概括都不超过下层材料真正支持的范围。
  thesis_source: 本章小结
  concepts:
  - term: 本章定位：为横向思想组选择正确的推理关系
    meaning: 前两种是同一纵向关系的两个方向。第5章集中处理第三种：同一组思想究竟是前后推导的演绎链，还是从共同点形成概括的归纳组？
    source_heading: 本章定位：为横向思想组选择正确的推理关系
  - term: 归纳推理
    meaning: 共同名词是“财产共有可能带来的不利影响”。各项并列，但适用性取决于司法辖区、财产类型和家庭状况。归纳结构清楚，不代表每项都适用于所有人。
    source_heading: 归纳推理
  - term: 十一、补充和替代工具
    meaning: 证据矩阵：追踪每个建议对应的问题和原因；
    source_heading: 十一、补充和替代工具
  - term: 四、面向决策者的归纳表达
    meaning: 先建立云治理、成本监控与运维能力，再扩大迁移范围。
    source_heading: 四、面向决策者的归纳表达
  - term: 检查归纳
    meaning: 上层概括是否加入未被支持的动机、因果或范围？
    source_heading: 检查归纳
  - term: 本章小结
    meaning: 本章最核心的实践原则是：思考时用演绎追查问题、原因和方案，用归纳从事实中发现共同模式；表达时优先把读者关心的结论或行动放到高层，再在较低层保留必要的演绎证明，并确保任何归纳概括都不超过下层材料真正支持的范围。
    source_heading: 本章小结
