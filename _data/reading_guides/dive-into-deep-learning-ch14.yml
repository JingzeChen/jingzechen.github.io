overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章主线：从整图标签到结构化视觉输出」建立了怎样的核心认识？
  question_source: 1. 本章主线：从整图标签到结构化视觉输出
  thesis: 最终提交以 ID 为主键 join：不要依赖独立目录排序恰好一致。
  thesis_source: 20. 核心结论与解决视觉问题的一般思路
  concepts:
  - term: 1. 本章主线：从整图标签到结构化视觉输出
    meaning: 本章贯穿一个核心思想：深层 CNN 在不同层形成分层表示。浅层保留边缘、颜色和纹理，深层拥有更大感受野和高级语义。不同任务并不是完全不同的网络，而是以不同方式读取、对齐和恢复这些分层特征。
    source_heading: 1. 本章主线：从整图标签到结构化视觉输出
  - term: 7.3 变长框如何组成 batch
    meaning: 若使用 class=-1 padding，所有标签分配、loss 和 metric 都必须过滤无效框。
    source_heading: 7.3 变长框如何组成 batch
  - term: 9.5 Mask R-CNN：加入实例 mask
    meaning: Mask R-CNN 输出每个物体实例的 mask，属于实例分割；语义分割只给每个像素类别，不区分同类个体。
    source_heading: 9.5 Mask R-CNN：加入实例 mask
  - term: 11.6 Checkerboard artifacts
    meaning: bilinear/nearest resize 后普通 conv；
    source_heading: 11.6 Checkerboard artifacts
  - term: 14.3 分层验证划分
    meaning: 防止同源/近重复图跨 split。
    source_heading: 14.3 分层验证划分
  - term: 20. 核心结论与解决视觉问题的一般思路
    meaning: 本章可以压缩为一条统一思路：先通过增强和预训练获得可泛化的分层图像表示，再根据输出粒度选择读取方式：分类读全局特征，检测在多尺度位置上预测类别与几何，分割将深层特征恢复到像素网格，风格迁移则把特征统计反向约束到图像。每个任务真正困难的地方不仅是
      CNN 本身，而是标签与特征的对齐：类别是否在增强后不变、锚框是否正确匹配、像素是否同步变换、上采样是否坐标一致、提交是否与样本 ID 对齐。
    source_heading: 20. 核心结论与解决视觉问题的一般思路
  logic:
