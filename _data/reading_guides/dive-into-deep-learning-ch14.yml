  sections:
  - title: 1. 本章主线：从整图标签到结构化视觉输出
    source_heading: 1. 本章主线：从整图标签到结构化视觉输出
    paragraphs:
    - 本章贯穿一个核心思想：深层 CNN 在不同层形成分层表示。浅层保留边缘、颜色和纹理，深层拥有更大感受野和高级语义。不同任务并不是完全不同的网络，而是以不同方式读取、对齐和恢复这些分层特征。
    - SSD 一次前向完成密集分类与回归，R-CNN 系列则逐步共享区域计算并学习 proposal；
    - 编码器降低了空间分辨率，于是用转置卷积和 FCN 恢复逐像素输出；
    - CNN 特征还可定义内容与风格距离，把“训练参数”改成“优化图像”；
  - title: 4. 目标检测与边界框
    source_heading: 4. 目标检测与边界框
    paragraphs:
    - 其中 c_i 是类别、s_i 是置信度、b_i 是位置。输出数量 N 也未知，因此不能直接使用固定长度普通分类头。
    - 轴对齐矩形由两条独立竖边和两条独立横边决定，等价于两个角点或中心加宽高，共四个标量。若允许旋转，还需角度或更多顶点；轴对齐框无法紧致描述倾斜细长物体。
  - title: 7.3 变长框如何组成 batch
    source_heading: 7.3 变长框如何组成 batch
    paragraphs:
    - padding 到 batch 内最大 M，用 class=-1 标记无效框；
    - 使用 packed/ragged representation。
    - 若使用 class=-1 padding，所有标签分配、loss 和 metric 都必须过滤无效框。
  - title: 8. Single Shot Multibox Detection
    source_heading: 8. Single Shot Multibox Detection
    paragraphs:
    - SSD 是单阶段检测器：一次 CNN 前向，在多个尺度特征图上同时生成 anchors、分类并回归偏移，不需要先运行独立 proposal 网络。
    - 分类也不能只看所有 anchors 的准确率，因为背景占绝大多数，即使全预测背景也可能很高。
    - SSD 原论文使用 hard-negative mining，按负 anchor 分类 loss 选最难者，控制负正比（常见约 3:1）。原书教学实现没有此步骤。
    - TinySSD 是教学简化版，不等同于 SSD300；现代检测还使用 FPN、anchor-free、Transformer detector 等。
  - title: 9.5 Mask R-CNN：加入实例 mask
    source_heading: 9.5 Mask R-CNN：加入实例 mask
    paragraphs:
    - RoI pooling 改为 RoIAlign；
    - 为每个 ROI 增加 FCN mask 分支。
    - Mask R-CNN 输出每个物体实例的 mask，属于实例分割；语义分割只给每个像素类别，不区分同类个体。
  - title: 11.6 Checkerboard artifacts
    source_heading: 11.6 Checkerboard artifacts
    paragraphs:
    - kernel size 可整除 stride；
    - bilinear/nearest resize 后普通 conv；
    - sub-pixel convolution；
  - title: 13.8 局限与现代扩展
    source_heading: 13.8 局限与现代扩展
    paragraphs:
    - arbitrary style transfer；
    - attention-based style transfer；
  - title: 14.3 分层验证划分
    source_heading: 14.3 分层验证划分
    paragraphs:
    - 保存 split manifest；
    - 防止同源/近重复图跨 split。
  - title: 15. Kaggle 犬种识别
    source_heading: 15. Kaggle 犬种识别
    paragraphs:
    - 测试：短边 Resize 256、CenterCrop 224、ImageNet Normalize。
    - 这更准确叫 feature extraction，不是全模型 fine-tuning。
    - 评估使用 multiclass log loss，过度自信的错误预测惩罚很大。可考虑 calibration、label smoothing、模型集成和
      TTA，但必须在独立验证集确认。
    - 应在相同数据 split、增强和训练预算下比较 validation log loss，而不是只看训练 accuracy。
  - title: 20. 核心结论与解决视觉问题的一般思路
    source_heading: 20. 核心结论与解决视觉问题的一般思路
    paragraphs:
    - 转置卷积是卷积线性矩阵的转置，不是逆；输出 shape 由 stride、padding、dilation 和 output padding 共同决定。
    - CIFAR 小图需保留早期分辨率；犬种细粒度任务适合 ImageNet 预训练，但原书 PyTorch 新头错误接在 1000 类 logits 后。
    - 逐尺度标注 shape：feature map、anchors、class channels、offset channels 和拼接顺序。
    - 本章可以压缩为一条统一思路：先通过增强和预训练获得可泛化的分层图像表示，再根据输出粒度选择读取方式：分类读全局特征，检测在多尺度位置上预测类别与几何，分割将深层特征恢复到像素网格，风格迁移则把特征统计反向约束到图像。每个任务真正困难的地方不仅是
      CNN 本身，而是标签与特征的对齐：类别是否在增强后不变、锚框是否正确匹配、像素是否同步变换、上采样是否坐标一致、提交是否与样本 ID 对齐。
  takeaways:
  - 图像增强通过标签保持变换显式编码不变性，通常降低过拟合，但错误变换会制造标签噪声。
  - R-CNN 到 Fast/Faster/Mask 的演进依次解决重复卷积、手工 proposals 和实例像素预测。
  - 先定义输出粒度：整图、框、像素类别、实例 mask，还是生成图像？
  - 融合多层特征时检查坐标对齐：shape 相同不保证采样中心相同。
  - 本章可以压缩为一条统一思路：先通过增强和预训练获得可泛化的分层图像表示，再根据输出粒度选择读取方式：分类读全局特征，检测在多尺度位置上预测类别与几何，分割将深层特征恢复到像素网格，风格迁移则把特征统计反向约束到图像。每个任务真正困难的地方不仅是
    CNN 本身，而是标签与特征的对齐：类别是否在增强后不变、锚框是否正确匹配、像素是否同步变换、上采样是否坐标一致、提交是否与样本 ID 对齐。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「17.3 验证阶段绝不能增强」？
  answer: 常规验证应确定；预先定义的 TTA 可以使用，但计算更贵且协议必须固定。
  source_heading: 17.3 验证阶段绝不能增强
- level: 概念辨析
  question: 原文如何解释「17.12 IoU 能衡量所有定位误差」？
  answer: 无重叠时 IoU 对距离缺少区分；GIoU/DIoU/CIoU 等补充几何信息。
  source_heading: 17.12 IoU 能衡量所有定位误差
- level: 概念辨析
  question: 原文如何解释「17.20 原书 TinySSD 就是完整 SSD300」？
  answer: 它是单类教学简化版，省略 hard-negative mining 等关键细节。
  source_heading: 17.20 原书 TinySSD 就是完整 SSD300
- level: 概念辨析
  question: 原文如何解释「17.37 最终使用 train+valid 重训是数据泄漏」？
  answer: 配置已锁定后使用全部标签重训是标准流程；若之后继续根据 valid/test 调参才泄漏。
  source_heading: 17.37 最终使用 train+valid 重训是数据泄漏
- level: 概念辨析
  question: 原文如何解释「17.40 提交列按字母排序一定正确」？
  answer: 必须与官方 sample submission schema 对齐，尤其概率列。
  source_heading: 17.40 提交列按字母排序一定正确
