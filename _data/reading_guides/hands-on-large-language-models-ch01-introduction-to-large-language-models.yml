  question: 原文围绕「0. 本章要回答的四个问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的四个问题
  thesis: 模型层：RNN、注意力和 Transformer 建模上下文；BERT 偏表示，GPT 偏生成。
  thesis_source: 11. 本章知识结构
  concepts:
  - term: 0. 本章要回答的四个问题
    meaning: 普通开发者怎样使用 LLM？ 如何在闭源 API 与开放模型之间选择，并用 Hugging Face 运行第一个生成模型？
    source_heading: 0. 本章要回答的四个问题
  - term: 4. 大语言模型的训练范式（The Training Paradigm of Large Language Models）
    meaning: Llama 2 的预训练语料达到约 2 万亿 token，说明从零训练基础模型通常超出个人与多数组织的资源范围。工程上的合理默认路径是：选择已有基础模型，再通过提示、RAG、参数高效微调或完整微调逐级增加适配强度。
    source_heading: 4. 大语言模型的训练范式（The Training Paradigm of Large Language Models）
  - term: 7. 有限资源也够用（Limited Resources Are All You Need）
    meaning: 本书面向资源有限的读者，示例尽量选择可在消费级 GPU 或 Google Colab 上运行的模型。原章建议以 16 GB VRAM 的
      T4 为参考起点，但这不是所有章节或所有模型的硬性保证。量化、缩短上下文、减小批量、CPU/GPU 卸载和选择小模型都是常用手段。
    source_heading: 7. 有限资源也够用（Limited Resources Are All You Need）
  - term: 9. 生成第一段文本（Generating Your First Text）
    meaning: 二者必须匹配。同样的字符串在不同 tokenizer 中可能切成不同 token ID；使用错误 tokenizer 相当于把模型词典打乱。
    source_heading: 9. 生成第一段文本（Generating Your First Text）
  - term: 10.5 基础模型、指令模型与聊天产品
    meaning: 聊天产品还包含系统提示、工具、检索、安全层、存储、UI 与运维服务。
    source_heading: 10.5 基础模型、指令模型与聊天产品
  - term: 12. 核心结论与一般解题思路
    meaning: 词袋解决了数值化，word2vec 引入语义几何，RNN 引入顺序，注意力缓解信息瓶颈，Transformer 又解决了训练并行和长距离交互。
    source_heading: 12. 核心结论与一般解题思路
