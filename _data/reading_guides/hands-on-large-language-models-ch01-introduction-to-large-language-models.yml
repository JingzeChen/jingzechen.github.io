  sections:
  - title: 0. 本章要回答的四个问题
    source_heading: 0. 本章要回答的四个问题
    paragraphs:
    - Language AI 是什么？ 它和 AI、NLP、LLM 分别是什么关系？
    - LLM 是怎样发展出来的？ 每一代方法具体解决了上一代的什么困难？
    - LLM 为什么有用？ 表示模型与生成模型分别适合哪些任务，又怎样组合成系统？
    - 普通开发者怎样使用 LLM？ 如何在闭源 API 与开放模型之间选择，并用 Hugging Face 运行第一个生成模型？
  - title: 2. 语言人工智能的近期历史（A Recent History of Language AI）
    source_heading: 2. 语言人工智能的近期历史（A Recent History of Language AI）
    paragraphs:
    - 这段历史围绕一个根本矛盾展开：计算机需要数字，语言的意义却不能由字符编码本身表达。 “猫”的二进制编码与“狗”的二进制编码并不会自然地比它与“银行”的编码更接近。于是首要问题不是生成文本，而是怎样把语言变成机器可计算、又尽量保存意义的表示。
    - word2vec 给每个词分配固定向量，所以 “bank” 在 “deposit money at the bank” 与 “sit on the river
      bank” 中完全一样。但自然语言的意义由上下文决定。模型必须表示此时此地的 bank，而不是词典中的抽象 bank。
    - 2018 年提出的 BERT（Bidirectional Encoder Representations from Transformers）堆叠 Transformer
      编码器，删除解码器。每个位置能同时结合左、右上下文，因此 “bank” 的表示会随所在句子改变。
    - GPT-1 约有 1.17 亿参数，GPT-2 增至 15 亿，GPT-3 达到 1750 亿。参数是训练中更新的数值权重，不应逐个理解成一条知识。参数更多通常提高模型容量，但“其余条件相同”这一前提很强：数据质量、训练
      token 数、架构、目标函数和推理方法同样决定表现。
  - title: 4. 大语言模型的训练范式（The Training Paradigm of Large Language Models）
    source_heading: 4. 大语言模型的训练范式（The Training Paradigm of Large Language Models）
    paragraphs:
    - 传统监督学习通常收集某个目标任务的标注数据，直接训练分类器或回归器。训练数据、目标函数和最终任务紧密绑定。
    - 预训练（pretraining）：在海量文本上做语言建模，学习通用语言规律，消耗绝大部分计算。
    - 微调/后训练（fine-tuning/post-training）：从已有参数出发，用较小、较专门的数据塑造任务能力或行为。
    - Llama 2 的预训练语料达到约 2 万亿 token，说明从零训练基础模型通常超出个人与多数组织的资源范围。工程上的合理默认路径是：选择已有基础模型，再通过提示、RAG、参数高效微调或完整微调逐级增加适配强度。
  - title: '5. LLM 应用：它们为什么有用（Large Language Model Applications: What Makes Them So
      Useful?）'
    source_heading: '5. LLM 应用：它们为什么有用（Large Language Model Applications: What Makes
      Them So Useful?）'
    paragraphs:
    - 问题：没有预先定义标签，希望自动发现工单群组。 性质：更准确地说是无监督聚类或主题建模，而不是普通监督分类。
    - RAG 解决的是模型参数知识难以及时更新、答案缺少来源的问题，但不能自动保证正确：检索可能漏召回，文档可能过时，生成模型也可能无视证据。
    - 完整助手通常包含提示工程、检索、工具调用、权限控制、结果验证和监控。真正的系统能力来自“模型 + 上下文 + 工具 + 流程”，而不是仅靠扩大参数量。
    - 这是多模态任务：视觉编码器或多模态模型识别图片中的食材，语言模型结合约束进行推理并生成菜谱。难点不只在文字生成，还包括视觉识别错误、数量估计、食品安全、过敏信息和用户偏好。
  - title: 7. 有限资源也够用（Limited Resources Are All You Need）
    source_heading: 7. 有限资源也够用（Limited Resources Are All You Need）
    paragraphs:
    - KV cache 会随层数、批大小和上下文长度增加，所以不能仅凭参数量精确推断显存需求。架构、量化方法、后端和是否把部分层卸载到 CPU 都会改变结果。
    - 从零预训练需要巨量数据、多 GPU 通信和长时间运行，远超普通开发环境。
    - 再考虑存储、网络、失败重跑和工程人员，总成本超过 500 万美元是合理量级。这说明普通学习者的目标不应是复刻基础模型预训练，而应学习如何高效地选择、压缩、适配和组合现有模型。
    - 本书面向资源有限的读者，示例尽量选择可在消费级 GPU 或 Google Colab 上运行的模型。原章建议以 16 GB VRAM 的 T4 为参考起点，但这不是所有章节或所有模型的硬性保证。量化、缩短上下文、减小批量、CPU/GPU
      卸载和选择小模型都是常用手段。
  - title: 9. 生成第一段文本（Generating Your First Text）
    source_heading: 9. 生成第一段文本（Generating Your First Text）
    paragraphs:
    - Tokenizer：在字符串与 token ID 之间转换，并应用聊天模板和特殊标记。
    - 二者必须匹配。同样的字符串在不同 tokenizer 中可能切成不同 token ID；使用错误 tokenizer 相当于把模型词典打乱。
    - 首次运行需要下载数 GB 权重。无足够内存、显存或网络时，这段代码不会轻量运行；应改用量化版本、较小模型或云端 GPU。
    - 这也把本章前半部分串了起来：tokenization 解决离散切分，embedding 解决数值表示，attention 解决上下文交互，causal
      mask 保证自回归训练，pipeline 则把这些底层步骤包装成应用接口。
  - title: 10.4 表示模型与生成模型
    source_heading: 10.4 表示模型与生成模型
    paragraphs:
    - 表示模型优化“怎样形成适合比较或预测的向量”。
    - 生成模型优化“给定前文，下一个 token 是什么”。
    - decoder-only 模型内部也有隐藏表示，encoder-only 模型也能接任务头输出类别；分类强调的是主要训练目标和使用方式，而不是绝对能力边界。
  - title: 10.5 基础模型、指令模型与聊天产品
    source_heading: 10.5 基础模型、指令模型与聊天产品
    paragraphs:
    - 指令模型在此基础上学会遵循指令。
    - 聊天产品还包含系统提示、工具、检索、安全层、存储、UI 与运维服务。
  - title: 10.10 RAG、提示与微调不是同一种“教模型”
    source_heading: 10.10 RAG、提示与微调不是同一种“教模型”
    paragraphs:
    - RAG：临时加入检索到的外部证据。
    - 需要新鲜事实时优先考虑 RAG；需要稳定行为或风格时考虑微调；需要快速试验时从提示开始。
  - title: 12. 核心结论与一般解题思路
    source_heading: 12. 核心结论与一般解题思路
    paragraphs:
    - Language AI 的核心困难是把依赖上下文的人类语言转换为机器可学习的表示与概率问题。
    - 词袋解决了数值化，word2vec 引入语义几何，RNN 引入顺序，注意力缓解信息瓶颈，Transformer 又解决了训练并行和长距离交互。
    - BERT 与 GPT 不是两条互不相关的路线，而是 Transformer 针对“表示”和“生成”两类目标的不同取舍。
    - 这套方法体现了本章最重要的思维方式：先找出当前表示或计算方式的瓶颈，再引入刚好解决该瓶颈的新机制；同时保留旧方法在低成本、可解释或组合场景中的价值。模型演进不是简单的“新模型淘汰旧模型”，而是在不同约束下重新分配能力、成本与控制权。
  takeaways:
  - 数据层：文本先被 tokenization 转成离散 token。
  - 词袋解决了数值化，word2vec 引入语义几何，RNN 引入顺序，注意力缓解信息瓶颈，Transformer 又解决了训练并行和长距离交互。
  - 流畅输出不是事实保证；公平、透明、安全、知识产权和监管必须进入系统生命周期。
  - 匹配模型目标：固定预测优先表示模型，开放生成优先生成模型，复杂任务考虑组合。
  - 这套方法体现了本章最重要的思维方式：先找出当前表示或计算方式的瓶颈，再引入刚好解决该瓶颈的新机制；同时保留旧方法在低成本、可解释或组合场景中的价值。模型演进不是简单的“新模型淘汰旧模型”，而是在不同约束下重新分配能力、成本与控制权。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「10.1 词袋向量、嵌入和隐藏状态」？
  answer: 隐藏状态是模型在某一层、某一上下文中计算出的中间表示。
  source_heading: 10.1 词袋向量、嵌入和隐藏状态
- level: 概念辨析
  question: 原文如何解释「10.3 编码器、解码器与“编码/解码字符串”」？
  answer: Transformer 编码器/解码器是神经网络架构；tokenizer 的 encode/decode 是字符串与 token ID 的转换。名称相似，层次完全不同。
  source_heading: 10.3 编码器、解码器与“编码/解码字符串”
- level: 概念辨析
  question: 原文如何解释「10.6 参数、token 与上下文窗口」？
  answer: 上下文窗口是单次推理能容纳的 token 预算。
  source_heading: 10.6 参数、token 与上下文窗口
- level: 概念辨析
  question: 原文如何解释「10.8 开放权重不等于免费、开源或无限制」？
  answer: 本地运行仍有硬件与运维成本；许可证可能限制用途；训练数据和代码也可能不公开。使用前必须阅读模型卡和许可证。
  source_heading: 10.8 开放权重不等于免费、开源或无限制
- level: 概念辨析
  question: 原文如何解释「10.10 RAG、提示与微调不是同一种“教模型”」？
  answer: 需要新鲜事实时优先考虑 RAG；需要稳定行为或风格时考虑微调；需要快速试验时从提示开始。
  source_heading: 10.10 RAG、提示与微调不是同一种“教模型”
