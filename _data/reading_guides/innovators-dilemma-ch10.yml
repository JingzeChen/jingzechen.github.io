  minutes: 15
  question: 原文围绕「一、本章的性质与读法」建立了怎样的核心认识？
  question_source: 一、本章的性质与读法
  thesis: 第十章把全书九章的原则压缩成一条可执行的提问链，并用电动汽车这一当时未决的问题做了完整演示。
  thesis_source: 十六、本章总结
  concepts:
  - term: 一、本章的性质与读法
    meaning: 我撰写本章的目的显然不是为了提供应对这一特定挑战的任何所谓的正确答案，也不是为了预测电动汽车是否可能，或者如何才能取得商业上的成功。相反，我的目标就是为了表明，在一个熟悉但充满挑战的环境下，管理者怎样才能通过提出一系列问题（一旦提出了这些问题，可能会引出一个合理且实用的答案）来发展他们看待类似问题的思维方式。
    source_heading: 一、本章的性质与读法
  - term: 四、潜在的市场：一些推测
    meaning: 考虑到孩子们的基本交通需求，这些父母可能会认为电动汽车简单的产品结构、较慢的加速时间和有限的行驶里程是这些青少年汽车的非常理想的属性——特别是如果汽车的外形符合青少年的审美习惯的话。
    source_heading: 四、潜在的市场：一些推测
  - term: 七、破坏性创新的产品开发
    meaning: 指导我们的工程师设计我们的第一款电动汽车将是一个不小的挑战，因为这里牵扯到一个经典的有关鸡生蛋还是蛋生鸡的问题：没有市场就无法获得足够的或者是可靠的消费者信息；没有能够满足消费者需求的产品就不会有市场。在这样一种真空状态下，我们怎样才能设计好产品呢？
    source_heading: 七、破坏性创新的产品开发
  - term: 九、破坏性创新的经销战略
    meaning: 注意”除非有确凿的证据证明我的想法是错误的”这一表述——这是把”需要新渠道”设为默认假设（null hypothesis），要求反方举证。这是第七章”发现驱动型规划”的正确用法：先明确写下假设，并规定推翻它需要什么证据。
    source_heading: 九、破坏性创新的经销战略
  - term: 十一、设立一个独立的分支机构
    meaning: 在未来很多年内，电动汽车市场的规模将会很小，因此不太可能为主要汽车生产商损益表上的收入或收益作出太大的贡献。由于预计这些企业的高层管理人员不会优先关注，或将资源优先提供给电动汽车项目，因此，公司内最优秀的管理人员和工程师也就不太可能会愿意加入我们的项目，因为他们会不可避免地将我们的项目视为一个对公司财务无足轻重的项目。为了确保他们在公司内的发展前途，他们会很自然地更倾向于参与主要项目，而不是边缘项目。
    source_heading: 十一、设立一个独立的分支机构
  - term: 十六、本章总结
    meaning: 第三环：三个失败模式的统一诊断。比塞洛斯-伊利的 Hydrohoe、哈雷的意大利小摩托、克莱斯勒的电动小货车、IBM 的 RISC——都是”把破坏性技术塞进现有客户基础“。IBM
      RISC 案例尤其有力：同一家公司，改造技术适配旧市场则失败，后来接受技术属性推出工程工作站则成功。变量只有定位，能力被控制为常量。
    source_heading: 十六、本章总结
