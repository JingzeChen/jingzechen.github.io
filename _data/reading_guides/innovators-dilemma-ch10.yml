  - 第十章把全书九章的原则压缩成一条可执行的提问链，并用电动汽车这一当时未决的问题做了完整演示。
  - 这在数学上解释了厂商为何索求电池突破——但也揭示这个需求是”必须满足主流里程”这一定位选择的推论，而非技术事实。
