  sections:
  - title: 一、本章的性质与读法
    source_heading: 一、本章的性质与读法
    paragraphs:
    - 我撰写本章的目的显然不是为了提供应对这一特定挑战的任何所谓的正确答案，也不是为了预测电动汽车是否可能，或者如何才能取得商业上的成功。相反，我的目标就是为了表明，在一个熟悉但充满挑战的环境下，管理者怎样才能通过提出一系列问题（一旦提出了这些问题，可能会引出一个合理且实用的答案）来发展他们看待类似问题的思维方式。
    - 能力不足、官僚作风、傲慢自大、管理队伍老化、规划不合理和投资短视显然是导致许多企业最终失败的主要原因。但我们已经知道，即使是最优秀的管理者也会受到某些法则的制约，而且这些法则会加大破坏性创新的难度。当优秀的管理者不能理解，或者试图抗拒这些法则的力量时，他们领导下的企业距离失败也就为期不远了。
    - 注意这里的措辞极为审慎：作者不否认传统解释的有效性（”显然是主要原因”），只是指出它们不足以解释本书关注的那一类失败。这与第一章的立场完全一致——全书从未主张”管理不善不重要”，而是主张”还存在另一类失败，其成因是良好管理本身”。
    - 这个序列的顺序不可交换：必须先判定性质（Q1），才能确定市场方向（Q2、Q3）；必须先有市场方向，才能定产品与技术（Q5、Q6）；渠道由市场决定（Q7）；组织形态由前面所有答案共同决定（Q8）。先做组织设计再找市场，是常见的错误顺序。
  - title: 二、我们怎样才能判断出某项技术是否具有破坏性
    source_heading: 二、我们怎样才能判断出某项技术是否具有破坏性
    paragraphs:
    - 注意市场需求斜率低的原因值得单独品味：它不是”客户不想要更好的车”，而是外部系统约束（法规限速、通勤距离受地理与经济结构限制）。这与第三章挖掘机市场”物流限制铲斗容量增长”、第九章”整机换代后体积需求饱和”是同一类机制——终端应用系统给需求增长设了天花板。
    - 行业专家在比较两种技术的性能轨线后可能会坚持认为，电动汽车的性能将永远无法达到汽油动力汽车达到的高度。他们的观点可能是正确的，但回想一下硬盘驱动器行业专家的经历，他们只是对错误的问题提出了正确的答案。
    - "“漫步者（Ranger）电动汽车的销量大概能达到 3 万辆，车中配备的铅酸电池能使汽车续驶 50 英里……1998 年版电动汽车的销售形式将会很严峻，即将推出的产品将无法达到消费者对续驶里程、成本或实用性的期望。”"
    - 这个类比是全章的锚点——它把一个陌生问题映射到一个已知结局的问题上。1980 年在大型机市场卖 5.25 英寸硬盘确实不可能；但这丝毫不意味着 5.25
      英寸硬盘没有前途，只意味着卖错了市场。
  - title: 四、潜在的市场：一些推测
    source_heading: 四、潜在的市场：一些推测
    paragraphs:
    - 考虑到孩子们的基本交通需求，这些父母可能会认为电动汽车简单的产品结构、较慢的加速时间和有限的行驶里程是这些青少年汽车的非常理想的属性——特别是如果汽车的外形符合青少年的审美习惯的话。
    - "“堵车时不耗电”这一点尤其精彩——它是内燃机的固有缺陷（怠速耗油）与电动机的固有优势（静止零消耗）的直接对比。在自由流动的公路上这个差异无关紧要，在极端拥堵的城市里它变成了核心价值。"
    - 可以粗略量化：若车辆有 50% 的时间处于怠速状态，内燃机在这段时间内的燃料消耗全部是浪费，而电动车消耗约为零。这意味着在此场景下，两种技术的有效能耗差距远大于标称工况下的差距。
    - 这句话界定了推测的价值：这些猜测的意义不在于猜对，而在于演示了合格猜测的形态——即”寻找一个把当前劣势视为优势的场景”。用第七章的语言说，它们是待验证的假设，而非结论。
  - title: 五、今天的汽车企业应如何销售电动汽车
    source_heading: 五、今天的汽车企业应如何销售电动汽车
    paragraphs:
    - 克莱斯勒公司计划在 1998 年及时推出一款全新的小型电动货车。在认真研究专门建设一个汽车平台和对现有平台进行修改两种方案后，现在看来对我们来说，选择利用电动平台生产小型货车显然是最佳的选择。我们的经验表明，车队可能将是销售电动汽车的最好机遇……我们面临的问题不在于创造具有吸引力的一揽子计划。新型小型货车就是一个有吸引力的计划。真正的问题是这种汽车并不具备足够的能量存储能力。
    - 为了在主流市场销售电动汽车，克莱斯勒公司必须为新型小型电动货车配备重达 1600 磅的电池，这当然会增加电动货车的加速时间，缩短行驶里程，并增加制动距离，而且这三项指标均低于任何一种汽油动力汽车。
    - 市场之所以能够获得发展就是因为消费者希望拥有优质的产品。没有哪位销售人员能在主流市场上推销边缘产品，并且抱有建立可持续的消费者基础的希望。销售人员不能强迫消费者购买他们不想要的产品，政府法令并不能作用于由消费者驱动的自由市场经济。要在市场上为电动汽车找到一个应用领域，电动汽车就必须发展成能与今天的汽油动力汽车相媲美的高品质产品。
    - 需要指出的重要一点就是，克莱斯勒公司公布的有关小型电动货车的这些统计数据是由该公司在市场上推广这种破坏性技术的方式决定的；这些数据并不是电动汽车本身具备的属性。电动汽车设计本来的用途是各种轻型应用领域。例如，通用汽车公司设计的一款电动汽车的续驶里程就达到了
      100 英里。
  - title: 七、破坏性创新的产品开发
    source_heading: 七、破坏性创新的产品开发
    paragraphs:
    - 指导我们的工程师设计我们的第一款电动汽车将是一个不小的挑战，因为这里牵扯到一个经典的有关鸡生蛋还是蛋生鸡的问题：没有市场就无法获得足够的或者是可靠的消费者信息；没有能够满足消费者需求的产品就不会有市场。在这样一种真空状态下，我们怎样才能设计好产品呢？
    - 汽车车身和发动机的尺寸、将时速从 0 提升至 60 英里所需的时间，以及消费者应对过多选择的能力都面临许多实际的限制。因此，我们几乎可以断定，产品竞争和消费者选择的基础将从这些功能性指标转向其他属性，例如可靠性和便捷性。
    - 尽管我们可能会首先以这个市场为目标（青少年市场），但事实很有可能证明我们最初的想法是错误的。因此，我们应该尽快推出第一款车型，并将这种车型小规模地投放市场——一旦得到市场的反馈，我们仍然拥有足够的预算来开发正确的车型。
    - 这一准则的深层逻辑：破坏性产品服务的是此前无法消费该产品的客户（非消费者）。对他们而言，约束是购买门槛（能不能买得起），而非使用效率。降低门槛才能打开市场；使用成本的劣势由新客户的价值排序所吸收。
  - title: 九、破坏性创新的经销战略
    source_heading: 九、破坏性创新的经销战略
    paragraphs:
    - 破坏性技术和新的经销渠道之所以经常步调一致，还是由于经济方面的原因。正如第四章提到的克雷斯吉公司和伍尔沃思公司的发展史所表明的那样，零售商和经销商的赢利模式通常非常明确。
    - 渠道冲突不是态度问题，是算术问题——一款低价、低毛利、无需现场服务的产品，放进按高毛利+服务收入设计的渠道里，经销商每卖一台都在损害自己的单位经济性。
    - 因此，我为我的电动汽车项目设置了一个基本的战略前提，即需要为电动汽车寻找或创造新的经销网络。除非有确凿的证据证明我的想法是错误的，否则我敢保证汽油动力汽车的主流经销商都不会像我们这样，将具有市场破坏性的电动汽车视为取得成功的关键要素。
    - 注意”除非有确凿的证据证明我的想法是错误的”这一表述——这是把”需要新渠道”设为默认假设（null hypothesis），要求反方举证。这是第七章”发现驱动型规划”的正确用法：先明确写下假设，并规定推翻它需要什么证据。
  - title: 十、什么样的机构最适合进行破坏性创新
    source_heading: 十、什么样的机构最适合进行破坏性创新
    paragraphs:
    - 在将电动汽车看做是一种潜在的破坏性技术，为寻找潜在的市场设定一个较为现实的方向，并为产品的设计、技术和经销网络确定战略参数之后，作为项目经理，我将把我下一步的工作重心转移到机构建设上来。
    - 创造一个有利于项目发展的机构环境至关重要，因为不管高级管理层是否公开表示支持这一项目，成熟企业内合理的资源分配流程总是会使破坏性技术无法得到赖以生存的资源。
    - "“不管高级管理层是否公开表示支持”——这直接呼应第七章 DEC 四进四退、第五章的资源分配机制：高层意志无法穿透资源分配流程。"
  - title: 十一、设立一个独立的分支机构
    source_heading: 十一、设立一个独立的分支机构
    paragraphs:
    - 在未来很多年内，电动汽车市场的规模将会很小，因此不太可能为主要汽车生产商损益表上的收入或收益作出太大的贡献。由于预计这些企业的高层管理人员不会优先关注，或将资源优先提供给电动汽车项目，因此，公司内最优秀的管理人员和工程师也就不太可能会愿意加入我们的项目，因为他们会不可避免地将我们的项目视为一个对公司财务无足轻重的项目。为了确保他们在公司内的发展前途，他们会很自然地更倾向于参与主要项目，而不是边缘项目。
    - 如果大家普遍认为我的项目就是在沿着这样一条道路发展，那么在发生不可避免的问题时，我确信机构将与我一道采取一切必要的举措来解决问题。另一方面，如果公司内的关键性人物认为我的项目对机构的增长和赢利无足轻重，或者（甚至更糟）认为会对公司的赢利产生不利的影响，那么，即使这项技术很简单，这个项目也不会取得成功。
    - 我可以采取两种方式来应对这一挑战：我可以努力说服主流机构的每一个人，使他们完全确信破坏性技术是可以实现赢利的；或者我可以创建一个规模足够小、成本结构较为合理的机构，而且机构内的每一个人都认为我的项目是通往成功的必经之路。两种方法都在管理上面临挑战，但后一种方法显然要容易处理得多。
    - 一般来说，要求主流机构更加容忍风险和失败所面临的问题是，我们在投资延续性创新时，我们通常无法面对市场营销上的失败（这种情况非常普遍）。主流机构通常会直接参与市场营销活动，以期在主要由已知的消费者（他们的需求是可以通过调研得出的）构成的现有市场中推广延续性技术创新。在首次尝试中遭遇失败并不是这些流程的一个内在属性，延续性创新的风险可以通过认真地规划和协同实施来加以避免。
  - title: 十五、面向实践的分析模板
    source_heading: 十五、面向实践的分析模板
    paragraphs:
    - 对每条劣势问：谁会把它当作优点？（慢 → 给孩子开；里程短 → 城市通勤；堵车不耗电 → 极端拥堵城市）
    - 预判竞争对手：按资源依赖与小市场原则，他们大概率都会挤向主流市场——避开那里。
    - 技术路线不得依赖任何未实现的突破。若你的方案”需要 X 突破才可行”，请重新检查是不是定位错了。
    - 检查现有渠道的盈利模式（高毛利低周转 / 低毛利高周转 / 服务型），判断新产品是否与之冲突。
  - title: 十六、本章总结
    source_heading: 十六、本章总结
    paragraphs:
    - 克莱斯勒 1600 磅电池、10 万美元（燃油版 4.55 倍）的方案，其不利数据”由推广方式决定，并不是电动汽车本身的属性”——同期通用设计的电动车续驶达
      100 英里。
    - 第三环：三个失败模式的统一诊断。比塞洛斯-伊利的 Hydrohoe、哈雷的意大利小摩托、克莱斯勒的电动小货车、IBM 的 RISC——都是”把破坏性技术塞进现有客户基础“。IBM
      RISC 案例尤其有力：同一家公司，改造技术适配旧市场则失败，后来接受技术属性推出工程工作站则成功。变量只有定位，能力被控制为常量。
    - 为什么主流机构不该学会容忍失败？——因为在延续性创新中”失败并不是这些流程的内在属性”，失败确实意味着执行不力。要求它容忍失败等于要求它降低主业标准。正确做法不是改变态度，而是建立适用不同标准的独立组织。
    - 这与开篇”不提供正确答案、只演示提问方式”首尾呼应。全书从未承诺方法论能带来成功——它承诺的是移除那些本可避免的失败原因。剩下的不确定性，属于市场本身，任何框架都无法代劳。
