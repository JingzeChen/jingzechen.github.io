  minutes: 8
  question: 原文围绕「8.1 平衡二叉树概述」建立了怎样的核心认识？
  question_source: 8.1 平衡二叉树概述
  thesis: 平衡树解决普通 BST 因输入顺序退化的问题。AVL 用高度差和旋转给出严格对数高度；有序集合/映射则把这一能力包装成按键查找、边界查询和有序遍历接口。选择它们的理由应是需要顺序、最值或范围，而不是单纯查键；后者通常由哈希表更快完成。
  thesis_source: 本章总结
  concepts:
  - term: 8.1 平衡二叉树概述
    meaning: 以下完整插入实现用于闭合前述“BST 插入、更新高度、按四型旋转”的推导，不是原书在此处给出的逐行程序。它只演示动态 AVL 边界；本节此前仍按原书顺序介绍平衡树与有序容器，8.2
      起继续原书的构造题顺序。
    source_heading: 8.1 平衡二叉树概述
  - term: 8.2 构造平衡二叉树的算法设计
    meaning: 输入已经严格递增，因此它天然就是目标 BST 的中序序列。若依次按原顺序插入，树会退化成全右链；要控制高度，根应把区间尽量均分，所以选择中点。
    source_heading: 8.2 构造平衡二叉树的算法设计
  - term: 8.3.1 LeetCode 506：相对名次（★）
    meaning: 本题数据完全静态，直接排序数组通常更简单、常数更小；平衡树的优势主要在成绩动态插删、随时查询排名时。
    source_heading: 8.3.1 LeetCode 506：相对名次（★）
  - term: 8.3.4 LeetCode 2353：食物评分系统（★★）
    meaning: 若只更新食物映射而忘记有序集合，两个索引会对当前评分产生不同答案。工程中应把“删旧项—改主记录—插新项”视为一次原子状态转换。
    source_heading: 8.3.4 LeetCode 2353：食物评分系统（★★）
  - term: 8.4 平衡树映射应用的算法设计
    meaning: 贪心正确性：最小牌 x 不可能放入起点小于 x 的组（那些牌已不存在），也不能放入起点大于 x 的组，因此它所属组只能从 x 开始。若任一后继缺失则无解；用掉后对剩余牌递归同理。
    source_heading: 8.4 平衡树映射应用的算法设计
