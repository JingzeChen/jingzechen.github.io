  - 8.4 平衡树映射应用的算法设计
  sections:
  - title: 8.1 平衡二叉树概述
    source_heading: 8.1 平衡二叉树概述
    paragraphs:
    - 右旋局部结构设为：y 的左孩子 x，x 的右子树为 T_2。旋转后 x 为根、y 为右孩子、T_2 成为 y 左子树。旋转前后中序均为
    - 迁移判断： 插入修复可用新键与孩子键的关系判断 LL/LR/RR/RL；删除后失衡却不能这样做，因为触发失衡的键可能已经消失，必须直接比较两个孩子的平衡因子。
    - 以下完整插入实现用于闭合前述“BST 插入、更新高度、按四型旋转”的推导，不是原书在此处给出的逐行程序。它只演示动态 AVL 边界；本节此前仍按原书顺序介绍平衡树与有序容器，8.2
      起继续原书的构造题顺序。
    - 插入时可用新键落在重孩子的哪一侧区分 LL/LR/RR/RL；删除时触发失衡的键已经离树，必须查看重孩子自身的平衡因子，不能照搬插入判型。
  - title: 8.2 构造平衡二叉树的算法设计
    source_heading: 8.2 构造平衡二叉树的算法设计
    paragraphs:
    - 输入已经严格递增，因此它天然就是目标 BST 的中序序列。若依次按原顺序插入，树会退化成全右链；要控制高度，根应把区间尽量均分，所以选择中点。
    - 左右元素数相差至多 1；递归得到的两棵树都是对各自规模尽量均分的平衡树，其高度最多相差 1，因此当前根也满足 AVL 条件。
    - 勘误说明： 原书 8.2.1 思路误粘了“给定先序、排序得到中序”的表述。本题只有有序数组，正确方法就是中点递归。
    - 正确性分两部分：中序数组含原树全部且仅有的键；中点重建的中序仍是该数组且满足高度平衡。因此新树与旧树键集合相同，并成为平衡 BST。
  - title: 8.3.1 LeetCode 506：相对名次（★）
    source_heading: 8.3.1 LeetCode 506：相对名次（★）
    paragraphs:
    - 成绩互异，因此只按成绩也能区分元素；加入下标可让比较器在一般输入中形成稳定的全序。
    - 本题数据完全静态，直接排序数组通常更简单、常数更小；平衡树的优势主要在成绩动态插删、随时查询排名时。
  - title: 8.3.4 LeetCode 2353：食物评分系统（★★）
    source_heading: 8.3.4 LeetCode 2353：食物评分系统（★★）
    paragraphs:
    - 修改评分必须从对应 cuisine 集合删除旧复合键，再插入新键，同时更新食物映射。
    - 若只更新食物映射而忘记有序集合，两个索引会对当前评分产生不同答案。工程中应把“删旧项—改主记录—插新项”视为一次原子状态转换。
    - 没有有序集合时可用每菜系堆并惰性删除：评分更新只压入新版本，查询时不断弹出与主映射不一致的旧堆项。
  - title: 8.4 平衡树映射应用的算法设计
    source_heading: 8.4 平衡树映射应用的算法设计
    paragraphs:
    - 贪心正确性：最小牌 x 不可能放入起点小于 x 的组（那些牌已不存在），也不能放入起点大于 x 的组，因此它所属组只能从 x 开始。若任一后继缺失则无解；用掉后对剩余牌递归同理。
    - 原书示例解释“时间戳 3 小于时间戳 1”应为“查询 3 时最近不超过它的是 1”。
    - 若允许乱序写入，需要按时间插入有序映射、排序数组中间插入，或采用 LSM/数据库索引等更复杂结构。
    - Python 若无有序集合，可用堆+惰性删除：available 与 rented 都只压新状态，查询时用状态集合过滤过期堆顶。实现更复杂，且过期项可能增长到操作数规模。
  takeaways:
  - 平衡树解决普通 BST 因输入顺序退化的问题。AVL 用高度差和旋转给出严格对数高度；有序集合/映射则把这一能力包装成按键查找、边界查询和有序遍历接口。选择它们的理由应是需要顺序、最值或范围，而不是单纯查键；后者通常由哈希表更快完成。
  - 插入时可用新键落在重孩子的哪一侧区分 LL/LR/RR/RL；删除时触发失衡的键已经离树，必须查看重孩子自身的平衡因子，不能照搬插入判型。
  - 本题数据完全静态，直接排序数组通常更简单、常数更小；平衡树的优势主要在成绩动态插删、随时查询排名时。
  - 没有有序集合时可用每菜系堆并惰性删除：评分更新只压入新版本，查询时不断弹出与主映射不一致的旧堆项。
  - Python 若无有序集合，可用堆+惰性删除：available 与 rented 都只压新状态，查询时用状态集合过滤过期堆顶。实现更复杂，且过期项可能增长到操作数规模。
