overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章关心的核心不是数学理论，而是不可变性和对赋值的纪律。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 回到三种范式共同的主题：它们通过拿走危险自由来提高可控性。
    source_heading: 本章导读
  - term: 3.4 作者关于并发的强论断
    meaning: 作者说，竞态条件、死锁和并发更新问题都源于可变变量；没有变量更新，就不会有这些问题，没有可变锁也不会有死锁。
    source_heading: 3.4 作者关于并发的强论断
  - term: 4.4 事务内存的直觉
    meaning: 作者把 Transactional Memory 类比为数据库事务：像数据库保护磁盘记录一样，事务内存保护内存变量的并发更新。
    source_heading: 4.4 事务内存的直觉
  - term: 5.1 从保存状态到保存事实
    meaning: 传统系统通常保存当前状态。例如银行账户表直接保存当前余额，每次存款或取款都覆盖余额。
    source_heading: 5.1 从保存状态到保存事实
  - term: 6.1 三种范式再次汇合
    meaning: Functional Programming 对变量赋值施加纪律。
    source_heading: 6.1 三种范式再次汇合
  - term: 本章总结
    meaning: Functional Core 负责验证、计算和决策，Imperative Shell 负责数据库、网络和其他副作用。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 3.4 作者关于并发的强论断
  - 3.7 持久化数据结构的折中
  - 5.1 从保存状态到保存事实
  - 5.6 原书所说的 CR 而非 CRUD
  - 作者的分析方法
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 用 Java 与 Clojure 打印平方数，观察可变循环变量是否存在；
    - 提出把系统分为可变与不可变组件，把修改限制在小区域；
    - 用 Event Sourcing 说明可以记录事件，而不是不断覆盖状态；
    - 回到三种范式共同的主题：它们通过拿走危险自由来提高可控性。
  - title: 2.5 惰性求值的现实边界
    source_heading: 2.5 惰性求值的现实边界
    paragraphs:
    - 计算错误可能推迟到消费数据时才出现；
    - 若无意中保留序列头部，可能占用大量内存；
    - 带副作用的惰性计算容易产生时序困惑；
  - title: 3.4 作者关于并发的强论断
    source_heading: 3.4 作者关于并发的强论断
    paragraphs:
    - 作者说，竞态条件、死锁和并发更新问题都源于可变变量；没有变量更新，就不会有这些问题，没有可变锁也不会有死锁。
    - 这句话应按本章语境理解：共享可变状态是并发程序中最主要、最危险的问题来源。
    - 所以，作者的论断提供重要方向，但不能被理解为「使用不可变数据后并发自动正确」。
  - title: 3.7 持久化数据结构的折中
    source_heading: 3.7 持久化数据结构的折中
    paragraphs:
    - 不可变集合不一定每次复制全部数据。持久化数据结构可以让新旧版本共享没有变化的部分，只复制受影响路径。
    - 这能降低存储与复制成本，但也增加实现复杂性。使用成熟语言库通常比自行发明更安全。
  - title: 4.4 事务内存的直觉
    source_heading: 4.4 事务内存的直觉
    paragraphs:
    - 作者把 Transactional Memory 类比为数据库事务：像数据库保护磁盘记录一样，事务内存保护内存变量的并发更新。
    - 不同语言和运行时提供的机制并不相同，不能把所有并发原语都笼统视为事务内存。
  - title: 5.1 从保存状态到保存事实
    source_heading: 5.1 从保存状态到保存事实
    paragraphs:
    - 传统系统通常保存当前状态。例如银行账户表直接保存当前余额，每次存款或取款都覆盖余额。
    - 当前状态是历史事件计算出的结果。
  - title: 5.6 原书所说的 CR 而非 CRUD
    source_heading: 5.6 原书所说的 CR 而非 CRUD
    paragraphs:
    - 传统数据库操作常概括为 Create、Read、Update、Delete。
    - 已有事件通常不 Update，也不 Delete，因此作者称其为 CR 而非 CRUD。
  - title: 6.1 三种范式再次汇合
    source_heading: 6.1 三种范式再次汇合
    paragraphs:
    - Structured Programming 对直接控制转移施加纪律；
    - Object-Oriented Programming 对间接控制转移施加纪律；
    - Functional Programming 对变量赋值施加纪律。
  - title: 作者的分析方法
    source_heading: 作者的分析方法
    paragraphs:
    - 平方数程序没有复杂业务干扰，读者能直接看到 Java 使用可变循环变量，Clojure 通过序列转换完成同一任务。
    - 作者没有停留在语法，而是把可变性连接到竞态、死锁和并发更新，说明变量赋值可以扩大为系统级风险。
    - 完全不可变需要存储和处理能力，因此作者转向折中：分隔可变与不可变组件，而不是要求绝对纯度。
    - Atom 并未消灭修改，而是把修改放入严格协议。这个例子说明函数式纪律不等于没有变化。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 函数式编程思想源于 Alonzo Church 在 20 世纪 30 年代提出的 Lambda Calculus。
    - 常见架构折中是分隔 Immutable Components 与 Mutable Components。
    - Functional Core 负责验证、计算和决策，Imperative Shell 负责数据库、网络和其他副作用。
    - Event Sourcing 适合强审计和历史重建场景，但事件演进、投影、隐私与运维成本很高。
  takeaways:
  - 函数式编程思想源于 Alonzo Church 在 20 世纪 30 年代提出的 Lambda Calculus。
  - 作者把并发问题强烈归因于可变状态；合理理解是它能消除主要一类问题，而非所有分布式和时序故障。
  - Compare-and-Swap 在提交前检查旧值是否仍然有效，冲突时重新计算。
  - 快照减少从头重放成本，但只是优化，事件仍是主要事实来源。
  - 本章最终要求架构师把可变性的范围、位置和所有权当作明确架构决策。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「3. 局部循环变量有害」？
  answer: 局部、封闭且不共享的循环变量通常很安全。作者关注的是可变性对推理和并发的影响，不是禁止所有循环。
  source_heading: 3. 局部循环变量有害
- level: 概念辨析
  question: 原文如何解释「4. 使用不可变对象后不会再有并发问题」？
  answer: 它消除大量共享写入问题，但消息顺序、网络、重复事件、资源竞争等仍需设计。
  source_heading: 4. 使用不可变对象后不会再有并发问题
- level: 概念辨析
  question: 原文如何解释「7. CAS 更新函数可以随意产生副作用」？
  answer: CAS 可能重试，函数中的邮件、扣款或消息可能重复执行。重试函数应尽量纯粹。
  source_heading: 7. CAS 更新函数可以随意产生副作用
- level: 概念辨析
  question: 原文如何解释「8. Event Sourcing 就是保存日志」？
  answer: 事件必须表达领域中已经发生的事实，并能可靠重建状态；普通技术日志通常不具备稳定业务语义和完整性保证。
  source_heading: 8. Event Sourcing 就是保存日志
- level: 概念辨析
  question: 原文如何解释「12. 函数式编程一定比命令式性能差」？
  answer: 不可变可能增加分配，也可能减少锁、改善并行和缓存。必须依据真实工作负载测量。
  source_heading: 12. 函数式编程一定比命令式性能差
