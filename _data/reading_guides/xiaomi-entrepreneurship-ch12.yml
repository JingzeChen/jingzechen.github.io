overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 生态链模式：少数股权投资独立创业团队，并提供产品、技术、设计、供应链和渠道支持。 +> 基本原则：投资不控股，帮忙不添乱；生态公司应形成独立品牌和能力。
    +> 三项目的：改变行业、提前布局 AIoT、为小米零售引流树品牌并贡献合理收入。 +> 业务分工：小米负责核心设备和平台，广泛品类由专注的伙伴完成。 +>
    移动电源：高标准、安全、设计与海量降本共同求解。 +> 小米手环：通过功能减法和低功耗，把小众产品做成大众产品。 +> 空气净化器：聚焦真正净化，重构结构，并用透明打破信息差。
    +> 小米插线板：在普通品类中同时做到美观、安全和大众价格。
  thesis_source: 二十六、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 生态链并不是小米建立大量子公司，也不是简单贴牌采购，而是希望在小米与独立创业公司之间形成一种“能力共享、各自成长”的长期关系。
    source_heading: 一、本章主线
  - term: 七、小米移动电源：奔向唯一最优解
    meaning: 紫米最初考虑：进口电芯版本卖 99 元，国产电芯版本卖 69 元。小米认为，创业团队不应把资源分散在两个各有妥协的方案上，而应集中做一个最优产品：使用更高标准电芯，同时努力把价格做到
      69 元。
    source_heading: 七、小米移动电源：奔向唯一最优解
  - term: 12.3 红线为什么有效
    meaning: 台灯的纤薄结构、转轴阻尼、照明体验和外观不是彼此独立。设计提出要求，工程和制造必须共同寻找实现方式。
    source_heading: 12.3 红线为什么有效
  - term: 十六、设计的四种价值
    meaning: 更广泛人群的可访问体验。 原书图示：小米率先支持系统级地震预警公共价值设计不能只做展示功能，需要稳定覆盖、长期维护、隐私保护和真实可用性。
    source_heading: 十六、设计的四种价值
  - term: 21.1 为什么早期爆品看起来更震撼
    meaning: 当一个大行业的产品普遍只有较低体验时，提高到明显优秀水平就能形成巨大反差。经过小米和行业共同升级后，从优秀再进一步，难度自然更高。
    source_heading: 21.1 为什么早期爆品看起来更震撼
  - term: 二十六、本章方法论总结
    meaning: 生态链模式：少数股权投资独立创业团队，并提供产品、技术、设计、供应链和渠道支持。 +> 基本原则：投资不控股，帮忙不添乱；生态公司应形成独立品牌和能力。
      +> 三项目的：改变行业、提前布局 AIoT、为小米零售引流树品牌并贡献合理收入。 +> 业务分工：小米负责核心设备和平台，广泛品类由专注的伙伴完成。
      +> 移动电源：高标准、安全、设计与海量降本共同求解。 +> 小米手环：通过功能减法和低功耗，把小众产品做成大众产品。 +> 空气净化器：聚焦真正净化，重构结构，并用透明打破信息差。
      +> 小米插线板：在普通品类中同时做到美观、安全和大众价格。
    source_heading: 二十六、本章方法论总结
  logic:
  - 一、本章主线
  - 七、小米移动电源：奔向唯一最优解
  - 9.6 899 元怎样击穿市场
  - 十六、设计的四种价值
  - 19.1 兄弟关系和独立发展不变
  - 22.3 矩阵不是 SKU 膨胀
  - 二十六、本章方法论总结
  sections:
  - title: 一、本章主线
    source_heading: 一、本章主线
    paragraphs:
    - 以少数股权投资建立长期关系，但不控股；
    - 在产品定义、设计、研发、供应链、品牌和销售等方面提供支持；
    - 鼓励生态链公司建立自己的品牌和长期能力。
    - 生态链并不是小米建立大量子公司，也不是简单贴牌采购，而是希望在小米与独立创业公司之间形成一种“能力共享、各自成长”的长期关系。
  - title: 三、小米为什么做生态链
    source_heading: 三、小米为什么做生态链
    paragraphs:
    - 把小米模式带到更多行业，推动中国制造升级；
    - 为 AIoT 提前布局足够丰富的智能设备；
    - 为小米电商和新零售引流、建立品牌，并贡献合理收入。
  - title: 七、小米移动电源：奔向唯一最优解
    source_heading: 七、小米移动电源：奔向唯一最优解
    paragraphs:
    - 紫米最初考虑：进口电芯版本卖 99 元，国产电芯版本卖 69 元。小米认为，创业团队不应把资源分散在两个各有妥协的方案上，而应集中做一个最优产品：使用更高标准电芯，同时努力把价格做到
      69 元。
    - 连续曲面、铝材挤出、阳极喷砂都会产生纹理和暗印。紫米团队走访多个城市、反复开模，最终解决量产问题。
    - 原书记载，首发前成本一度达到 77 元，定价却是 69 元。团队依赖海量销量、工艺成熟和采购规模降低后续成本。
    - 销量证明需求和产品定义成立，也反过来支持成本下降。但真正可迁移的不是“69 元”，而是高标准、安全、设计、工艺和规模成本被放在同一个产品目标中解决。
  - title: 9.6 899 元怎样击穿市场
    source_heading: 9.6 899 元怎样击穿市场
    paragraphs:
    - 产品同时提供明确净化效果、小体积、完整设计和显著低于既有品牌的价格，迅速形成预约、销量和口碑。
    - 价格只是最后一步。没有结构创新、制造能力和信息透明，单纯 899 元只会成为低价产品，而不是改变行业的爆品。
  - title: 12.3 红线为什么有效
    source_heading: 12.3 红线为什么有效
    paragraphs:
    - 大面积暖白传递安静、理性，一根红线提供视觉活力，同时诚实表达不可避免的电气连接。
    - 台灯的纤薄结构、转轴阻尼、照明体验和外观不是彼此独立。设计提出要求，工程和制造必须共同寻找实现方式。
    - 设计驱动不是设计师决定一切，而是用户体验目标在产品定义阶段就牵引技术、结构和供应链。
  - title: 十六、设计的四种价值
    source_heading: 十六、设计的四种价值
    paragraphs:
    - MIX 为提高屏占比和沉浸感，推动屏幕发声、摄像头小型化和陶瓷结构等技术。设计目标牵引了工程创新。
    - 98 英寸电视送装困难，小米研究住宅电梯尺寸后推出更适合进电梯的 86 英寸电视，并重新设计切角包装，减少拆箱和磕碰，缩短搬运时间。
    - 更广泛人群的可访问体验。 原书图示：小米率先支持系统级地震预警公共价值设计不能只做展示功能，需要稳定覆盖、长期维护、隐私保护和真实可用性。
    - 小米成立集团设计委员会，负责设计理念、资产、文化和人才培养。统一管理的价值在于一致性，风险是审批僵化，应让一线设计团队保留创造力。
  - title: 19.1 兄弟关系和独立发展不变
    source_heading: 19.1 兄弟关系和独立发展不变
    paragraphs:
    - 小米继续坚持少数股权、不控股和帮助创业者。生态链公司建立自有品牌，不是“去小米化”，而是生态链成功的必要结果。
    - 若公司只能依靠小米订单生存，没有独立产品、品牌和客户，反而说明孵化没有真正完成。
  - title: 21.1 为什么早期爆品看起来更震撼
    source_heading: 21.1 为什么早期爆品看起来更震撼
    paragraphs:
    - 当一个大行业的产品普遍只有较低体验时，提高到明显优秀水平就能形成巨大反差。经过小米和行业共同升级后，从优秀再进一步，难度自然更高。
    - 爆品减少不一定说明方法失效，也可能说明显而易见的改良空间已被填补，行业进入平台期。
  - title: 22.3 矩阵不是 SKU 膨胀
    source_heading: 22.3 矩阵不是 SKU 膨胀
    paragraphs:
    - 没有为了价格填空而制造重复产品；
    - 总体口碑和效率不因产品增多下降。
  - title: 二十六、本章方法论总结
    source_heading: 二十六、本章方法论总结
    paragraphs:
    - 生态链模式依赖小米已有用户、品牌、供应链和渠道，普通企业不能只复制投资形式。
    - 小米生态链把“产品、效率、零售、用户”连接起来：爆品丰富渠道，渠道帮助爆品触达用户，用户反馈改善产品，规模又支持技术与制造升级。
    - 生态链模式：少数股权投资独立创业团队，并提供产品、技术、设计、供应链和渠道支持。 +> 基本原则：投资不控股，帮忙不添乱；生态公司应形成独立品牌和能力。
      +> 三项目的：改变行业、提前布局 AIoT、为小米零售引流树品牌并贡献合理收入。 +> 业务分工：小米负责核心设备和平台，广泛品类由专注的伙伴完成。
      +> 移动电源：高标准、安全、设计与海量降本共同求解。 +> 小米手环：通过功能减法和低功耗，把小众产品做成大众产品。 +> 空气净化器：聚焦真正净化，重构结构，并用透明打破信息差。
      +> 小米插线板：在普通品类中同时做到美观、安全和大众价格。
    - "+> 扫地机器人：精准定义核心任务，跨行业重组传感器和算法。 +> 米家台灯：设计不是装饰，而是牵引功能和制造的产品力。 +> 新质量观：既要结实耐用，也要好看、好用。
      +> 生态链 2.0：收紧到手机与 AIoT、科技属性，建设通用技术平台。 +> 未来产品形态：从单品爆品，到简洁矩阵，再到互联互通的爆品体系。 +>
      核心启示：平台真正的成功不是控制更多公司，而是让专业创业团队、用户和行业都因共享能力而变得更强。"
  takeaways:
  - 生态链并不是小米建立大量子公司，也不是简单贴牌采购，而是希望在小米与独立创业公司之间形成一种“能力共享、各自成长”的长期关系。
  - 销量证明需求和产品定义成立，也反过来支持成本下降。但真正可迁移的不是“69 元”，而是高标准、安全、设计、工艺和规模成本被放在同一个产品目标中解决。
  - 小米成立集团设计委员会，负责设计理念、资产、文化和人才培养。统一管理的价值在于一致性，风险是审批僵化，应让一线设计团队保留创造力。
  - 爆品减少不一定说明方法失效，也可能说明显而易见的改良空间已被填补，行业进入平台期。
  - "+> 扫地机器人：精准定义核心任务，跨行业重组传感器和算法。 +> 米家台灯：设计不是装饰，而是牵引功能和制造的产品力。 +> 新质量观：既要结实耐用，也要好看、好用。
    +> 生态链 2.0：收紧到手机与 AIoT、科技属性，建设通用技术平台。 +> 未来产品形态：从单品爆品，到简洁矩阵，再到互联互通的爆品体系。 +> 核心启示：平台真正的成功不是控制更多公司，而是让专业创业团队、用户和行业都因共享能力而变得更强。"
