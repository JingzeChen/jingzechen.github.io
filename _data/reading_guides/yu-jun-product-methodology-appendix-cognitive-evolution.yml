  sections:
  - title: 1. 本章要回答的问题
    source_heading: 1. 本章要回答的问题
    paragraphs:
    - 正文五章呈现的是一套已经整理好的方法论。附录换了一个视角：它按时间顺序收录了 2000 年到 2019 年的求职信、早期文章、十二条、内部讲座、体验分析、演讲实录和对话记录，展示这套方法论是怎样一步步形成、被推翻和被重建的。
    - 早期的经验规则如何被后期的用户价值公式、交易模型和权衡框架取代或重新解释？
    - 从“一切为了用户”到“创造有利可图的用户价值”，中间发生了什么认知转折？
    - 本章最重要的读法是：不要把附录当作观点合集，而要当作一份可对照的迭代记录，观察每个结论提出时的约束条件，以及它后来为什么被修正。
  - title: 6.4 这一转折的方法论启示
    source_heading: 6.4 这一转折的方法论启示
    paragraphs:
    - 经验规则是特定约束下的压缩结论，不是普遍真理。
    - 规则越具体、越好执行，通常适用范围越窄。
    - 迁移规则前必须还原它成立的前提。
    - 方法论升级的标志，是从“该怎么做”变成“在什么条件下该怎么做”。
  - title: 7.4 感谢信中的价值判断
    source_heading: 7.4 感谢信中的价值判断
    paragraphs:
    - 离职感谢信把搜索引擎与造纸术、印刷术并列，理由是它们都大幅降低了人类获取知识的成本，并可能影响社会平等与进步。
    - 这一判断解释了作者早期的动机结构：产品价值被放在社会成本变化的尺度上衡量，而不只是公司收入。它也说明，个人长期目标会决定其愿意在什么问题上持续投入。
  - title: 8.3 体验因时而变
    source_heading: 8.3 体验因时而变
    paragraphs:
    - 用户与内容爆发后，主流需求变成网页搜索，仍以网站搜索为默认的产品体验在逐日下降。
    - 使用频率提高后，进入综合门户再搜索的成本被放大，独立搜索入口的相对体验持续上升。
    - 用户从单向获取转为参与创造，贴吧、知道等产品顺应了互联网定义本身的变化。
    - "“温水煮青蛙”是这一节最重要的警示：当外部条件渐变时，静止不动的产品体验其实每天都在下降。"
  - title: 10.1 真正的产品经理是三位一体的
    source_heading: 10.1 真正的产品经理是三位一体的
    paragraphs:
    - 主人翁意识：把产品当作自己的事业。
    - 决策权：没有决策权就不是真正的产品经理。
    - 三者缺一，加上合适的组织土壤，才可能形成实际意义上的产品负责人。这也解释了为什么许多公司里“产品经理”只是执行角色。
  - title: 11.2 逻辑的四个组成
    source_heading: 11.2 逻辑的四个组成
    paragraphs:
    - 理科逻辑：识别事实与基本因果链。
    - 深度思考：追问事物本质，对经历过和未经历过的事都能形成更透彻判断。
    - 视野：见多识广、思维开放、思维发散。
    - 批判精神：既能否定他人，也能否定自己。
  - title: 11.7 如何评价一家公司的产品能力
    source_heading: 11.7 如何评价一家公司的产品能力
    paragraphs:
    - 手握多个机会的优秀产品经理，有多少比例优先选择这家公司。
    - 从这个团队离开的人，是否是市场上最受欢迎的那一部分。
    - 这是一个巧妙的度量设计：产品能力本身难以直接测量，但可以用市场对其人才的持续定价来间接反映。
  - title: 14.1 检验一条产品原则是否适用
    source_heading: 14.1 检验一条产品原则是否适用
    paragraphs:
    - 它成立时的用户、技术、竞争和商业条件是什么？
    - 它是否只考虑了单边利益，忽略了供给者或第三方？
    - 若照此执行，最可能在什么情况下出错？
    - 我能否用低成本方式先验证它在本情境中的有效性？
  - title: 14.7 用事实校验道理
    source_heading: 14.7 用事实校验道理
    paragraphs:
    - 遇到一个新观点，先写下它的适用前提。
    - 从自己经历中找三个支持案例和三个反例。
    - 若无法找到反例，说明样本不足或思考不充分。
    - 记录为待验证假设，而不是直接采纳。
  - title: 18. 复习卡片
    source_heading: 18. 复习卡片
    paragraphs:
    - Q：附录的核心价值是什么？ A：以时间顺序展示方法论如何被提出、失效、修正和重建，说明产品认知是可迭代且有边界的。
    - Q：摩根士丹利评测案例说明了什么？ A：静态结果页对比忽略了加载、操作、浏览和二次查询等过程成本，会得出与真实行为相反的结论。
    - Q：为什么说“用户不是人，是需求的集合”？ A：这是缩小样本粒度的分析工具，用于按情境和需求分类积累样本，而不是否认用户是完整的人。
    - Q：开创型、增长型、协作型分别适合什么阶段？ A：产品形态未稳定时需要开创型，进入高速增长时依赖增长型，业务与团队复杂化后依赖协作型。
  takeaways:
  - 本章最重要的读法是：不要把附录当作观点合集，而要当作一份可对照的迭代记录，观察每个结论提出时的约束条件，以及它后来为什么被修正。
  - 这一判断解释了作者早期的动机结构：产品价值被放在社会成本变化的尺度上衡量，而不只是公司收入。它也说明，个人长期目标会决定其愿意在什么问题上持续投入。
  - 批判精神：既能否定他人，也能否定自己。
  - 我能否用低成本方式先验证它在本情境中的有效性？
  - Q：开创型、增长型、协作型分别适合什么阶段？ A：产品形态未稳定时需要开创型，进入高速增长时依赖增长型，业务与团队复杂化后依赖协作型。
