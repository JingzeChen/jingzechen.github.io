  question: 原文围绕「1. 本章要回答的问题」建立了怎样的核心认识？
  question_source: 1. 本章要回答的问题
  thesis: 正文五章呈现的是一套已经整理好的方法论。附录换了一个视角：它按时间顺序收录了 2000 年到 2019 年的求职信、早期文章、十二条、内部讲座、体验分析、演讲实录和对话记录，展示这套方法论是怎样一步步形成、被推翻和被重建的。
  thesis_source: 1. 本章要回答的问题
  concepts:
  - term: 1. 本章要回答的问题
    meaning: 正文五章呈现的是一套已经整理好的方法论。附录换了一个视角：它按时间顺序收录了 2000 年到 2019 年的求职信、早期文章、十二条、内部讲座、体验分析、演讲实录和对话记录，展示这套方法论是怎样一步步形成、被推翻和被重建的。
    source_heading: 1. 本章要回答的问题
  - term: 7.4 感谢信中的价值判断
    meaning: 离职感谢信把搜索引擎与造纸术、印刷术并列，理由是它们都大幅降低了人类获取知识的成本，并可能影响社会平等与进步。
    source_heading: 7.4 感谢信中的价值判断
