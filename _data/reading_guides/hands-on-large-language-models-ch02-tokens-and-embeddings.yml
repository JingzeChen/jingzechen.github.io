overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 阅读地图：从离散符号到可计算的语义空间」建立了怎样的核心认识？
  question_source: 0. 阅读地图：从离散符号到可计算的语义空间
  thesis: SentencePiece 可在未预先空格分词的原始文本上训练 BPE 或 Unigram，把空格当成普通符号处理，适合没有天然空格边界的语言。说“SentencePiece
    与 BPE 对比”时要先明确：比较的是工具实现，还是其中采用的实际算法。
  thesis_source: 1. LLM 的 tokenization（LLM Tokenization）
  concepts:
  - term: 0. 阅读地图：从离散符号到可计算的语义空间
    meaning: 语言模型不直接接收字符串。字符串必须先被切成有限词表中的 token，每个 token 再映射到整数 ID；模型用 ID 从嵌入矩阵中取出向量，经过
      Transformer 后形成依赖上下文的新向量，最后才用于预测、分类、检索或推荐。
    source_heading: 0. 阅读地图：从离散符号到可计算的语义空间
  - term: 1. LLM 的 tokenization（LLM Tokenization）
    meaning: SentencePiece 可在未预先空格分词的原始文本上训练 BPE 或 Unigram，把空格当成普通符号处理，适合没有天然空格边界的语言。说“SentencePiece
      与 BPE 对比”时要先明确：比较的是工具实现，还是其中采用的实际算法。
    source_heading: 1. LLM 的 tokenization（LLM Tokenization）
  - term: 2. Token 嵌入（Token Embeddings）
    meaning: 模型训练前，E 通常随机初始化；语言建模损失通过反向传播更新它。频繁出现在相似上下文中的 token 会受到相似梯度约束，从而形成有用几何关系。
    source_heading: 2. Token 嵌入（Token Embeddings）
  - term: 4. LLM 之外的词嵌入（Word Embeddings Beyond LLMs）
    meaning: word2vec 通常维护输入与输出两套向量，训练结束后常取输入矩阵或二者组合。所谓“每个维度代表一种可命名属性”只是便于想象；真正稳定的是向量间的相对几何结构。
    source_heading: 4. LLM 之外的词嵌入（Word Embeddings Beyond LLMs）
  - term: 5. 推荐系统中的嵌入（Embeddings for Recommendation Systems）
    meaning: 如果大量策展人把 Michael Jackson、Prince 和 Madonna 的歌曲放在相近位置，它们会形成正共现样本；word2vec
      由此把歌曲向量拉近。查询 “Billie Jean” 的近邻便能得到风格或受众相近的歌曲。
    source_heading: 5. 推荐系统中的嵌入（Embeddings for Recommendation Systems）
  - term: 7. 总结（Summary）
    meaning: 本章体现的一般方法是：先把不可计算的对象离散化并建立稳定索引，再通过可自监督构造的关系学习连续空间，最后用空间中的距离服务下游任务。每一步都在压缩信息，因此既要问“保留了什么”，也要问“丢掉了什么”。
    source_heading: 7. 总结（Summary）
  logic:
  - 0. 阅读地图：从离散符号到可计算的语义空间
  - 1. LLM 的 tokenization（LLM Tokenization）
  - 2. Token 嵌入（Token Embeddings）
  - 3. 文本嵌入：句子与完整文档（Text Embeddings (for Sentences and Whole Documents)）
  - 4. LLM 之外的词嵌入（Word Embeddings Beyond LLMs）
  - 5. 推荐系统中的嵌入（Embeddings for Recommendation Systems）
  - 7. 总结（Summary）
  sections:
  - title: 0. 阅读地图：从离散符号到可计算的语义空间
    source_heading: 0. 阅读地图：从离散符号到可计算的语义空间
    paragraphs:
    - 语言模型不直接接收字符串。字符串必须先被切成有限词表中的 token，每个 token 再映射到整数 ID；模型用 ID 从嵌入矩阵中取出向量，经过 Transformer
      后形成依赖上下文的新向量，最后才用于预测、分类、检索或推荐。
    - BPE、WordPiece、SentencePiece、字符和字节方案有何差别？
    - tokenizer 的词表、特殊 token 和训练语料怎样改变模型能力与成本？
    - 静态 token 嵌入、上下文化 token 嵌入和整段文本嵌入是什么关系？
  - title: 1. LLM 的 tokenization（LLM Tokenization）
    source_heading: 1. LLM 的 tokenization（LLM Tokenization）
    paragraphs:
    - 这不是所有算法共同采用的精确目标函数，而是有用的统一直觉：词表越大，常见文本可用更少 token 表示，但嵌入层和输出层更大，稀有 token 的训练次数也可能更少；词表越小，覆盖更容易，但序列更长、注意力计算和生成步数更多。
    - 字符级方案把文本拆成 Unicode 字符。它几乎不会因新词失败，但模型既要学习词义，也要从更长序列中学习拼写组合。若平均一个子词约含 3 个字符，那么相同
      1024-token 窗口下，子词方案可能容纳约三倍字符数。
    - 这些角色 token 适应了聊天模型的主流使用方式。系统提示、用户问题和助手回复都被串成一个 token 序列，角色 token 负责指出边界。它们不会建立真正独立的“记忆区”，只是在同一上下文中提供训练过的结构标记。
    - SentencePiece 可在未预先空格分词的原始文本上训练 BPE 或 Unigram，把空格当成普通符号处理，适合没有天然空格边界的语言。说“SentencePiece
      与 BPE 对比”时要先明确：比较的是工具实现，还是其中采用的实际算法。
  - title: 2. Token 嵌入（Token Embeddings）
    source_heading: 2. Token 嵌入（Token Embeddings）
    paragraphs:
    - 模型训练前，E 通常随机初始化；语言建模损失通过反向传播更新它。频繁出现在相似上下文中的 token 会受到相似梯度约束，从而形成有用几何关系。
    - 即使两个 tokenizer 词表大小相同，ID 对应关系也未必相同。正确做法是使用模型仓库配套 tokenizer；确需更换时，要对嵌入和模型进行充分再训练，而不是只替换配置文件。
    - 现代模型也可能使用旋转位置编码等方式在注意力中注入位置。无论具体形式如何，token 嵌入回答“这是什么符号”，位置机制回答“它出现在哪里”。
    - 这些表示可用于命名实体识别、词性标注、抽取式摘要和 token 分类。图像生成系统中的文本编码器也会产生上下文化表示，供图像生成网络作为条件。
  - title: 3. 文本嵌入：句子与完整文档（Text Embeddings (for Sentences and Whole Documents)）
    source_heading: 3. 文本嵌入：句子与完整文档（Text Embeddings (for Sentences and Whole Documents)）
    paragraphs:
    - 简单平均能把变长序列压成固定维度，却不保证语义空间适合相似度搜索。高质量文本嵌入模型通常以句对、查询—文档对或相似/不相似样本做对比训练，使相关文本靠近、无关文本远离。
    - 前两句语义接近，预期相似度高于它们与数据库故障句的相似度。实际数值依模型版本而定，不应硬编码为业务阈值。
    - 在检索时召回相关块，而非强行把整本书压成一个向量。
    - 文本嵌入适合“整体语义接近吗”，不适合精确还原数字、否定词或每个事实。向量检索常与关键词检索、重排序器和原文核验组合。
  - title: 4. LLM 之外的词嵌入（Word Embeddings Beyond LLMs）
    source_heading: 4. LLM 之外的词嵌入（Word Embeddings Beyond LLMs）
    paragraphs:
    - 嵌入是一种通用建模思想：只要对象之间存在可观察的关系，就能尝试学习向量，使几何位置反映关系。对象可以是词、图片、商品、歌曲、用户或机器人状态。
    - 静态词嵌入便宜、可缓存、在小数据任务中仍有价值；主要局限是一个词只有一个向量、一词多义难处理、未登录词受限，并会继承语料偏见。
    - 反向传播反复拉近正样本、推远负样本。若两个词出现在相似上下文中，它们收到相似更新，最终在向量空间靠近。
    - word2vec 通常维护输入与输出两套向量，训练结束后常取输入矩阵或二者组合。所谓“每个维度代表一种可命名属性”只是便于想象；真正稳定的是向量间的相对几何结构。
  - title: 5. 推荐系统中的嵌入（Embeddings for Recommendation Systems）
    source_heading: 5. 推荐系统中的嵌入（Embeddings for Recommendation Systems）
    paragraphs:
    - 如果大量策展人把 Michael Jackson、Prince 和 Madonna 的歌曲放在相近位置，它们会形成正共现样本；word2vec 由此把歌曲向量拉近。查询
      “Billie Jean” 的近邻便能得到风格或受众相近的歌曲。
    - 这种方法学到的是行为共现相似性，不一定是音频相似性：两首歌可能因时代、场景或听众群相同而靠近，即使节奏和乐器不同。这正是协同过滤的价值，也构成它的偏差来源。
    - 原章的示例结果中，Metallica 的 “Fade To Black” 附近出现 Van Halen、Dio、Guns N’ Roses 和 Judas
      Priest 等重金属/硬摇滚歌曲，说明播放列表共现确实捕捉到有用风格关系。
    - 跨越许多播放列表后，单次偶然共现被平均，稳定的受众、年代、流派和场景关系积累在向量中。近邻检索把这种隐式关系转成推荐。
  - title: 7. 总结（Summary）
    source_heading: 7. 总结（Summary）
    paragraphs:
    - LLM 处理的是 token ID，而不是原始字符串；tokenizer 同时承担输入编码和输出解码。
    - 模型为每个 token ID 保存一行静态输入嵌入，Transformer 再把它变成依赖上下文的隐藏状态。
    - word2vec 用滑动窗口构造正例、用负采样防止平凡解，通过“拉近相关、推远随机”从无标注序列学习表示。
    - 本章体现的一般方法是：先把不可计算的对象离散化并建立稳定索引，再通过可自监督构造的关系学习连续空间，最后用空间中的距离服务下游任务。每一步都在压缩信息，因此既要问“保留了什么”，也要问“丢掉了什么”。
  takeaways:
  - 静态 token 嵌入、上下文化 token 嵌入和整段文本嵌入是什么关系？
  - 这些表示可用于命名实体识别、词性标注、抽取式摘要和 token 分类。图像生成系统中的文本编码器也会产生上下文化表示，供图像生成网络作为条件。
  - 文本嵌入适合“整体语义接近吗”，不适合精确还原数字、否定词或每个事实。向量检索常与关键词检索、重排序器和原文核验组合。
  - 跨越许多播放列表后，单次偶然共现被平均，稳定的受众、年代、流派和场景关系积累在向量中。近邻检索把这种隐式关系转成推荐。
  - 本章体现的一般方法是：先把不可计算的对象离散化并建立稳定索引，再通过可自监督构造的关系学习连续空间，最后用空间中的距离服务下游任务。每一步都在压缩信息，因此既要问“保留了什么”，也要问“丢掉了什么”。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.1 Token 不等于词」？
  answer: Token 可以是完整词、子词、字符、字节、空白串、代码运算符或特殊控制标记。模型成本按 token 计算，因此“同样字数”在不同语言和 tokenizer
    下成本不同。
  source_heading: 6.1 Token 不等于词
- level: 概念辨析
  question: 原文如何解释「6.3 SentencePiece 不等于 Unigram」？
  answer: SentencePiece 是可训练 tokenizer 的实现框架，可使用 Unigram 或 BPE。BPE、WordPiece、Unigram
    才是词表构建/切分方法层面的比较对象。
  source_heading: 6.3 SentencePiece 不等于 Unigram
- level: 概念辨析
  question: 原文如何解释「6.6 Token ID 不是嵌入」？
  answer: ID 是离散索引；输入嵌入是从矩阵查出的连续向量；上下文化嵌入又是该向量经过多层模型后的结果。
  source_heading: 6.6 Token ID 不是嵌入
- level: 概念辨析
  question: 原文如何解释「6.9 相似不等于相同、正确或因果相关」？
  answer: 嵌入近邻反映训练目标和数据中的关联。两篇文本接近不代表事实完全一致；两首歌接近也不证明音频结构相似或用户一定喜欢。
  source_heading: 6.9 相似不等于相同、正确或因果相关
- level: 概念辨析
  question: 原文如何解释「6.12 负采样词不代表用户明确不喜欢」？
  answer: word2vec 的负例来自计算近似。推荐系统中“未共现”多是未知反馈，而非负偏好；将其当成事实标签会误读模型输出。
  source_heading: 6.12 负采样词不代表用户明确不喜欢
