  - 但它不是下游质量的充分条件。指令微调和 RLHF 优化的是完整回答是否有帮助，而不是是否像训练语料中的下一 token。后训练后，任务完成能力可能提高，PPL
    却上升；量化也可能以难以预测的方式改变 PPL。因此不能仅凭困惑度选择对话模型。
  - 裁判常把长度、细节数量和质量混淆。GPT-4 与 Claude-1 曾偏爱约 100 词但含事实错误的回答，而不是约 50 词的正确回答；长度差达到两倍时，创意任务中的裁判几乎总偏爱长回答。
