overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 学习目标与方法主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与方法主线
  thesis: 每个候选 token 寻找最相似参考 token，形成精确率方向；参考 token 反向寻找候选 token，形成召回率方向。基础形式允许多个
    token 匹配同一个 token，并不保证全局一一对齐；具体实现还可加入逆文档频率权重。MoverScore 则结合多种表示，估计把一个文本的语义质量“搬运”到另一个文本的代价。
  thesis_source: 3. Exact Evaluation（精确评估）
  concepts:
  - term: 0. 学习目标与方法主线
    meaning: 基础模型越强、使用范围越广，失败的影响就越大。聊天机器人可能诱导用户采取危险行为，模型生成的虚假案例可能进入法庭，客服机器人给出的错误承诺也可能让企业承担赔偿责任。没有可靠的质量控制，AI
      带来的风险可能超过收益。
    source_heading: 0. 学习目标与方法主线
  - term: 1. 为什么基础模型更难评估
    meaning: 传统分类任务的输出空间有限。若正确类别是 A、模型输出 B，就能无歧义地判错。开放式任务却可能有大量正确回答：同一个问题可以有不同措辞、结构、详略和论证路径。为每个输入穷举所有合法答案在组合意义上不可能。
    source_heading: 1. 为什么基础模型更难评估
  - term: 3. Exact Evaluation（精确评估）
    meaning: 每个候选 token 寻找最相似参考 token，形成精确率方向；参考 token 反向寻找候选 token，形成召回率方向。基础形式允许多个
      token 匹配同一个 token，并不保证全局一一对齐；具体实现还可加入逆文档频率权重。MoverScore 则结合多种表示，估计把一个文本的语义质量“搬运”到另一个文本的代价。
    source_heading: 3. Exact Evaluation（精确评估）
  - term: 4. AI as a Judge（用 AI 评估 AI）
    meaning: 开放式回答难以靠规则覆盖，人工评估又慢且昂贵，于是自然出现一个问题：既然 AI 能自动化生成、翻译和推理，能否也自动化评估？使用 AI 模型判断其他
      AI 输出的方法称为 AI as a judge 或 LLM as a judge，承担判断任务的模型称为 AI 裁判。
    source_heading: 4. AI as a Judge（用 AI 评估 AI）
  - term: 6. 如何组合本章的方法
    meaning: 层级不是说后者一定更差，而是前者通常提供更直接的证据。实际系统可并行组合：代码助手同时看测试通过率、AI 裁判的可读性分数、人工安全抽检和用户偏好。
    source_heading: 6. 如何组合本章的方法
  - term: 8. 一页速记
    meaning: 第三章解决“可用哪些方法产生评价信号”；下一章将继续解决“如何围绕具体应用定义标准、构建数据集、运行实验，并把这些信号组织成可靠的评估流水线”。
    source_heading: 8. 一页速记
  logic:
  - 0. 学习目标与方法主线
  - 1. 为什么基础模型更难评估
  - 2. 语言模型指标
  - 4. AI as a Judge（用 AI 评估 AI）
  - 5. Ranking Models with Comparative Evaluation（用比较评估给模型排名）
  - 6. 如何组合本章的方法
  - 8. 一页速记
  sections:
  - title: 0. 学习目标与方法主线
    source_heading: 0. 学习目标与方法主线
    paragraphs:
    - 基础模型越强、使用范围越广，失败的影响就越大。聊天机器人可能诱导用户采取危险行为，模型生成的虚假案例可能进入法庭，客服机器人给出的错误承诺也可能让企业承担赔偿责任。没有可靠的质量控制，AI
      带来的风险可能超过收益。
    - 如何从两两比较得到模型排名？ 区分点式评估、比较评估与 A/B 测试，理解 Elo、Bradley–Terry、可扩展性和传递性问题。
    - 从失败模式出发，而不是从现成指标出发。 如果不知道系统会在哪里失败，再多指标也无法使系统可靠；有时还要重新设计系统，让中间状态和失败原因可观察。
    - 自动化程度越高，越需要校准。 精确执行结果最可靠；词法和语义指标引入了代理假设；AI 裁判更灵活，却也把模型、提示和采样参数的偏差带进评估。
  - title: 1. 为什么基础模型更难评估
    source_heading: 1. 为什么基础模型更难评估
    paragraphs:
    - 一年级数学题的错误大多数人都能识别，博士级数学证明却需要领域专家。胡言乱语式摘要很容易判错；一篇语句连贯但暗含事实错误的摘要，则要求评估者先读完材料、核查事实并复现推理。
    - 传统分类任务的输出空间有限。若正确类别是 A、模型输出 B，就能无歧义地判错。开放式任务却可能有大量正确回答：同一个问题可以有不同措辞、结构、详略和论证路径。为每个输入穷举所有合法答案在组合意义上不可能。
    - 理想基准应覆盖模型的完整能力范围，并能区分强弱模型。模型进步后，一旦大量模型接近满分，基准就失去区分力，这叫基准饱和（benchmark saturation）。
    - 这些维度可以组合。余弦相似度在给定嵌入后是精确计算，但嵌入由哪个模型生成带有主观选择；AI 裁判既可以无参考地打分，也可以借助参考答案比较；人类也既能点式打分，也能做两两比较。
  - title: 2. 语言模型指标
    source_heading: 2. 语言模型指标
    paragraphs:
    - 许多基础模型仍以语言模型为核心。语言建模能力通常与下游能力相关，因此熵、交叉熵和困惑度能帮助理解模型训练、微调和数据处理；但这种相关不是等价关系，后训练可能改善任务完成能力，同时让下一
      token 预测指标变差。
    - 这表示模型平均用 3.43 bits 表示原始数据的一个 byte；相对于每 byte 8 bits，理论编码长度不到原始大小的一半。这里讨论的是概率模型诱导出的理想编码长度，实际压缩文件还包含模型、词表和编码协议的开销。
    - 实际计算需要拿到模型对每个真实下一 token 分配的概率或 logprob。部分商业 API 不暴露完整 logprobs，因此即使公式明确，也未必能计算闭源模型在任意文本上的
      PPL。上述定义同样适用于生成图像 token、音频 token 等其他离散序列的模型，不只适用于自然语言。
    - 但它不是下游质量的充分条件。指令微调和 RLHF 优化的是完整回答是否有帮助，而不是是否像训练语料中的下一 token。后训练后，任务完成能力可能提高，PPL
      却上升；量化也可能以难以预测的方式改变 PPL。因此不能仅凭困惑度选择对话模型。
  - title: 3. Exact Evaluation（精确评估）
    source_heading: 3. Exact Evaluation（精确评估）
    paragraphs:
    - "“包含参考答案就算正确”可以提高召回率，却容易误收错误回答。问题“Anne Frank 出生于哪一年？”的参考答案是 1929；回答“September
      12, 1929”包含 1929，却把日期写错了。子串匹配只能证明出现了目标片段，不能证明整句事实正确。"
    - 第三，词面相似不等于功能正确。 HumanEval 中，正确和错误代码的 BLEU 分数可能相近。代码只改一个运算符就会从正确变错误，但绝大多数 token
      不变；完全不同的算法则可能功能相同而词面重叠很低。因此能执行测试时，应优先使用功能正确性，而不是 BLEU。
    - 词法指标比较“长得像不像”，语义相似度比较“意思近不近”。“What’s up?” 与 “How are you?” 词面不同，语义接近；“Let’s
      eat, grandma” 与 “Let’s eat grandma” 只差一个逗号，含义却完全不同。
    - 每个候选 token 寻找最相似参考 token，形成精确率方向；参考 token 反向寻找候选 token，形成召回率方向。基础形式允许多个 token
      匹配同一个 token，并不保证全局一一对齐；具体实现还可加入逆文档频率权重。MoverScore 则结合多种表示，估计把一个文本的语义质量“搬运”到另一个文本的代价。
  - title: 4. AI as a Judge（用 AI 评估 AI）
    source_heading: 4. AI as a Judge（用 AI 评估 AI）
    paragraphs:
    - 开放式回答难以靠规则覆盖，人工评估又慢且昂贵，于是自然出现一个问题：既然 AI 能自动化生成、翻译和推理，能否也自动化评估？使用 AI 模型判断其他 AI
      输出的方法称为 AI as a judge 或 LLM as a judge，承担判断任务的模型称为 AI 裁判。
    - 这一方法在强大通用模型出现后才真正实用。到 2023 年，LangChain 平台约 58% 的评估已由 AI 裁判执行。它流行的原因不是绝对可靠，而是填补了“规则测不了、人工又太贵”的空白。
    - MT-Bench 的研究中，GPT-4 与人类判断的一致率约为 85%，高于该实验中人类之间约 81% 的一致率。AlpacaEval 的 AI 评价结果与由人类投票形成的
      Chatbot Arena 排名相关系数约为 0.98。
    - 裁判常把长度、细节数量和质量混淆。GPT-4 与 Claude-1 曾偏爱约 100 词但含事实错误的回答，而不是约 50 词的正确回答；长度差达到两倍时，创意任务中的裁判几乎总偏爱长回答。
  - title: 5. Ranking Models with Comparative Evaluation（用比较评估给模型排名）
    source_heading: 5. Ranking Models with Comparative Evaluation（用比较评估给模型排名）
    paragraphs:
    - 比较评估在 AI 中于 2021 年前后开始应用，后来成为 Chatbot Arena 一类排行榜的核心。ChatGPT 偶尔展示两个回答让用户选择，也是在收集比较信号。两个回答可以来自不同模型，也可以来自同一模型的不同提示、参数或采样结果。
    - 并非所有问题都应该由投票决定。问题“手机辐射是否导致脑瘤？”有事实答案，不能让用户在“是”和“否”中选择更喜欢的。数学问题的用户之所以求助，往往正是因为不知道正确答案；把两个答案交还给用户选择，会造成挫败并收集错误信号。
    - Elo 易于在线维护，但逐场更新会让结果依赖比赛顺序和初始设置。同一批比较按不同顺序处理，可能得到不同评分。Chatbot Arena 后来从 Elo
      转向 Bradley–Terry，原因之一就是 Elo 对评估者和提示顺序敏感。
    - 假设客服模型 A 能解决 70% 工单，B 对 A 的胜率为 51%。这个 1 个百分点的偏好优势无法直接换算为工单解决率：有些应用会获得巨大提升，有些几乎不变。若
      B 的成本是 A 的两倍，没有绝对业务指标就无法做成本收益分析。
  - title: 6. 如何组合本章的方法
    source_heading: 6. 如何组合本章的方法
    paragraphs:
    - 层级不是说后者一定更差，而是前者通常提供更直接的证据。实际系统可并行组合：代码助手同时看测试通过率、AI 裁判的可读性分数、人工安全抽检和用户偏好。
    - 写出失败清单。 错误事实、未执行任务、泄露隐私、格式失败分别需要不同信号。
    - 固定评估器版本。 数据、参考答案、代码、嵌入模型、裁判提示和排名算法全部版本化。
    - 切片而非只看平均。 语言、任务、长度、风险等级和用户群都可能掩盖局部失败。
  - title: 8. 一页速记
    source_heading: 8. 一页速记
    paragraphs:
    - 先定义失败，再选择指标。 不要从工具提供的默认分数反推产品目标。
    - 越接近真实功能，证据越直接。 相似度、裁判分数和偏好都是代理，需要写明假设并校准。
    - 评估器本身也要被评估和版本化。 数据集、参考答案、嵌入模型、裁判提示和排名算法都会改变结论。
    - 第三章解决“可用哪些方法产生评价信号”；下一章将继续解决“如何围绕具体应用定义标准、构建数据集、运行实验，并把这些信号组织成可靠的评估流水线”。
