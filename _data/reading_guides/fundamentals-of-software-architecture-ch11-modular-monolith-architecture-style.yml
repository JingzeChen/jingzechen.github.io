  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Domain-partitioned architecture 为什么更适合 cross-functional/domain-aligned teams？
    - 它为何比 layered architecture 的 maintainability/deployability/evolvability 略高，而两章评分图中的
      testability 同为 2 星？
    - 为什么 responsiveness 是 3 星，而 scalability、elasticity、fault tolerance 都是 1 星？
    - 一句话概括：Modular monolith 用领域模块约束单体内部的变化传播，以较低成本获得比技术分层更好的业务内聚；它的成败取决于边界治理，而不是“把代码放进不同文件夹”。
  - title: 2. Topology：拓扑
    source_heading: 2. Topology：拓扑
    paragraphs:
    - 路径顺序不是美学问题，它决定开发者首先看到“这是什么业务”，还是“这是什么技术”。
    - 只有 domain modules、却独立部署，可能更接近 services；
    - 只有 single deployment、没有受控 domain modules，只是普通或无结构单体。
    - 即使模块各有逻辑边界，它们仍共享一个 operational characteristic scope。若模块有独立数据库却仍随同一应用部署，数据边界改善，但
      deployment/failure quantum 仍通常是 1。
  - title: 4. Data Topologies：数据拓扑
    source_heading: 4. Data Topologies：数据拓扑
    paragraphs:
    - Modular monolith 通常单一部署，因此典型使用 monolithic database；但 modules 独立且功能明确时，也可拥有 contextual
      databases。
    - 能通过 shared data 减少显式 module calls。
    - "“减少通信”可能只是把显式 API coupling 变成更难观察的 database coupling。"
    - 这是共享基础设施与逻辑所有权的折中。数据库仍可能是一个 failure/scale quantum，不能把 schema 分离误认为物理独立。
  - title: 6. Common Risks：常见风险
    source_heading: 6. Common Risks：常见风险
    paragraphs:
    - Monolithic architecture 本身不是坏事；太大后才出现问题。“太大”没有统一 LOC 或 team count 阈值，应看结果。
    - Rule of Three 可作为启发式：先容忍少量重复，理解变化方向后再抽象；不是机械等待三次。
    - 此时不要只优化调用框架，应重新思考 domains 以容纳 workflow 和 interdependencies。
    - 数字用于发现异常，不能证明边界错误。支付流程可能合理跨多个 domain；一个错误共享数据库则可能没有任何代码依赖边。
  - title: 8. Team Topology Considerations：团队拓扑考虑
    source_heading: 8. Team Topology Considerations：团队拓扑考虑
    paragraphs:
    - Modular monolith 是 domain-partitioned architecture，因此最适合 teams 也按 domain area
      对齐，例如 specialized cross-functional teams。
    - 若组织分成 UI、backend、database teams，一个 domain requirement 仍要跨三组协调，与 domain module
      端到端 ownership 相冲突。
    - Domain-focused team 可以从 presentation 到 database 完成一个 feature，减少 handoff。
    - 平台应提供 self-service，不应强迫所有 modules 继承巨大共享 framework，否则 code reuse 会反向破坏边界。
  - title: 11.5 “Modular Structure 会独立部署每个 JAR”
    source_heading: 11.5 “Modular Structure 会独立部署每个 JAR”
    paragraphs:
    - 错误之处：JAR/DLL 最终组装成一个 deployment unit。
    - 正确理解：它加强 compile isolation，不改变 monolithic deployment。
  - title: 11.8 “Shared Interface 消除了 Coupling”
    source_heading: 11.8 “Shared Interface 消除了 Coupling”
    paragraphs:
    - 错误之处：只降低 implementation coupling，仍有 semantic/version coupling。
    - 正确理解：管理 interface 生命周期并避免 shared model 膨胀。
  - title: 11.12 “每模块独立数据库就变成 Microservices”
    source_heading: 11.12 “每模块独立数据库就变成 Microservices”
    paragraphs:
    - 错误之处：应用仍一次部署、同一 process/failure boundary。
    - 正确理解：数据边界只是 distributed style 的一个维度。
  - title: 13. 本章知识结构
    source_heading: 13. 本章知识结构
    paragraphs:
    - 逻辑层：Domain modules 让业务变化和代码位置对齐；
    - 物理层：Single deployment/process/database 保持简单，也限制独立运行能力；
    - 协作层：Peer-to-peer 与 mediator 分别分散或集中 workflow coupling；
    - 治理层：源码、API、依赖和数据必须自动受控，否则 modular 会退化成 unstructured monolith。
  - title: 15. 主动回忆与应用题
    source_heading: 15. 主动回忆与应用题
    paragraphs:
    - 用 deployment、partitioning、data 和 failure boundary 四个维度比较 modular monolith、layered
      monolith 与 microservices。
    - 为 shared database 定义 schema-per-module ownership、write restrictions 和 reporting
      policy。
    - 决定 AI forecasting 保留 module 还是拆 service 时，应检查哪些 architecture characteristics？
    - 不看正文，复述设计十步：上下文、domain、source structure、API、communication、data、governance、teams、signals、evolution。
  takeaways:
  - 逻辑层：Domain modules 让业务变化和代码位置对齐；
  - Modular structure 用 JAR/DLL 强化 compile boundary，适合独立模块和大团队，却增加制品版本与构建复杂度。
  - 模块可拥有 contextual databases，但应用仍是单体，会新增跨库事务和运营复杂度。
  - Domain-focused cross-functional teams 最匹配该风格，技术 silo 会让每项 domain change 跨团队。
  - 长期成功不取决于起初画得多漂亮，而取决于团队是否持续阻止边界侵蚀。
