overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 过度 code reuse 会模糊 domain ownership，最终形成无法解开的 unstructured monolith。
  thesis_source: 14. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：Modular monolith 用领域模块约束单体内部的变化传播，以较低成本获得比技术分层更好的业务内聚；它的成败取决于边界治理，而不是“把代码放进不同文件夹”。
    source_heading: 0. 本章要回答的核心问题
  - term: 4. Data Topologies：数据拓扑
    meaning: Modular monolith 通常单一部署，因此典型使用 monolithic database；但 modules 独立且功能明确时，也可拥有
      contextual databases。
    source_heading: 4. Data Topologies：数据拓扑
  - term: 8. Team Topology Considerations：团队拓扑考虑
    meaning: Modular monolith 是 domain-partitioned architecture，因此最适合 teams 也按 domain
      area 对齐，例如 specialized cross-functional teams。
    source_heading: 8. Team Topology Considerations：团队拓扑考虑
  - term: 11.5 “Modular Structure 会独立部署每个 JAR”
    meaning: 正确理解：它加强 compile isolation，不改变 monolithic deployment。
    source_heading: 11.5 “Modular Structure 会独立部署每个 JAR”
  - term: 11.12 “每模块独立数据库就变成 Microservices”
    meaning: 错误之处：应用仍一次部署、同一 process/failure boundary。
    source_heading: 11.12 “每模块独立数据库就变成 Microservices”
  - term: 15. 主动回忆与应用题
    meaning: 用 deployment、partitioning、data 和 failure boundary 四个维度比较 modular monolith、layered
      monolith 与 microservices。
    source_heading: 15. 主动回忆与应用题
  logic:
  - 0. 本章要回答的核心问题
  - 4. Data Topologies：数据拓扑
  - 6. Common Risks：常见风险
  - 11.5 “Modular Structure 会独立部署每个 JAR”
