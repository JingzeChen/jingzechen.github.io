- level: 概念辨析
  question: 原文如何解释「11.2 “有文件夹就是 Modular Monolith”」？
  answer: 正确理解：需要 API visibility、依赖、数据和 workflow 治理。
  source_heading: 11.2 “有文件夹就是 Modular Monolith”
- level: 概念辨析
  question: 原文如何解释「11.6 “独立 Repository 自动使 Module 独立”」？
  answer: 正确理解：独立性要检查代码、数据、workflow 和 deployment。
  source_heading: 11.6 “独立 Repository 自动使 Module 独立”
- level: 概念辨析
  question: 原文如何解释「11.11 “Shared Database 减少了所有 Coupling”」？
  answer: 错误之处：API 调用减少，但 schema/data coupling 可能更隐蔽。
  source_heading: 11.11 “Shared Database 减少了所有 Coupling”
- level: 概念辨析
  question: 原文如何解释「11.17 “Namespace allowlist 足以完成治理”」？
  answer: 正确理解：组合 membership、API、dependency、data 和 runtime checks。
  source_heading: 11.17 “Namespace allowlist 足以完成治理”
- level: 概念辨析
  question: 原文如何解释「11.23 “AI Forecasting 技术不同，应立即独立 Service”」？
  answer: 正确理解：独立 scale、team、lifecycle 和 failure scope 足够显著时再拆。
  source_heading: 11.23 “AI Forecasting 技术不同，应立即独立 Service”
