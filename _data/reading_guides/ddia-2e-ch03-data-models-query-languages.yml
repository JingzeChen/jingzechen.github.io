  - 12. 选择数据模型与查询语言的一般方法
  sections:
  - title: 0. 本章定位：数据模型决定我们怎样看待问题
    source_heading: 0. 本章定位：数据模型决定我们怎样看待问题
    paragraphs:
    - 数据模型（data model）常被误解为“表怎么建”或“JSON 长什么样”。作者把它放在更高的位置：数据模型不仅影响软件怎样写，也影响开发者怎样思考正在解决的问题。
    - 不过，隐藏不等于消失。查询变慢时，应用开发者仍可能需要理解索引和数据分布；磁盘故障时，数据库实现仍受硬件现实约束。好抽象应减少日常认知负担，同时让性能和故障边界可观察。
    - 表格不是硬规则。关系数据库可以存 JSON 和图，文档数据库可以连接，DataFrame 可以执行关系式操作。问题不是“能不能模拟”，而是表达、查询和维护是否自然。
    - 这不是原书公式，也无法精确算出一个通用分数。它提醒我们不能只比较单次读取速度：文档的读取局部性可能以大文档更新为代价，图查询的表达简洁可能以专用系统运维为代价。
  - title: 1. 术语：声明式查询语言
    source_heading: 1. 术语：声明式查询语言
    paragraphs:
    - SQL、Cypher、SPARQL 和 Datalog 等查询语言是声明式（declarative） 的：用户说明结果必须满足什么模式、如何过滤、排序、分组和聚合，但不逐步规定数据库如何得到结果。
    - 代码指定遍历、条件、字典更新和排序。若数据分布到多机，开发者还需设计分区、局部聚合、网络交换和合并。
    - 声明式与命令式不是“有代码”和“没代码”的区别，而是谁拥有执行策略：声明式把策略空间交给查询引擎，命令式由程序固定执行步骤。
    - 先过滤 A 可减少进入连接的数据量。声明式查询让优化器安全应用等价变换；命令式代码若混入副作用或依赖执行顺序，就难以重排。
  - title: 2. 关系模型与文档模型
    source_heading: 2. 关系模型与文档模型
    paragraphs:
    - NoSQL 运动最持久的影响之一是文档模型（document model）。它通常用 JSON 表示自包含记录，早期由 MongoDB、Couchbase
      等专用数据库推广，后来多数关系数据库也加入 JSON 类型。
    - ORM 只能减轻对象—关系翻译，不能取消关系模式、集合查询和网络成本。N+1 是最直观证据：看似自然的对象遍历会生成完全不同的数据库工作负载。选择抽象时必须观察其下层行为。
    - XML 生态有 XPath/XQuery；JSON 有 JSON Pointer、JSONPath；MongoDB 有聚合管道。选型必须检查真实查询语言，而非只看存储
      JSON。
    - 模型并不决定全部物理性能：关系系统能提供局部性，文档系统也能连接和索引。真正应比较的是关系基数、更新频率、访问范围、模式一致性、查询语言和运维能力。现代混合数据库往往让应用在同一系统内按数据片段选择模型。
  - title: 3. 类图数据模型
    source_heading: 3. 类图数据模型
    paragraphs:
    - Cypher 是属性图查询语言，最初由 Neo4j 创建，后来发展为 openCypher 标准，由 Neo4j、Memgraph、KùzuDB、Amazon
      Neptune、Apache AGE 等支持。
    - SPARQL Protocol and RDF Query Language（SPARQL）是 RDF 三元组查询语言，读作 “sparkle”。它早于
      Cypher，Cypher 的模式匹配受其影响。
    - 图模型适合关系密集、路径长度可变、实体类型异构的领域。属性图把顶点、边、标签和属性作为一级对象；三元组用 subject-predicate-object
      统一属性与关系。二者表达能力相近，生态和命名方式不同。
    - Cypher/SPARQL 用路径模式自然表达多跳查询；Datalog 用递归规则构建关系；SQL 能借递归 CTE 模拟，但语法和优化更笨重。GraphQL
      则解决客户端 JSON 形状，不是通用图查询。模型能彼此模拟不意味着同样自然，真正差异在表达、优化、约束和运维成本。
  - title: 4. 事件溯源与 CQRS
    source_heading: 4. 事件溯源与 CQRS
    paragraphs:
    - 试图用一张表或一个文档同时优化所有读写，会产生大量索引、复杂更新和耦合。作者因此把“写入表示”与“读取表示”明确分开。
    - 这些名称来自 DDD 社区，但相似思想早已存在，例如状态机复制（state machine replication）也让副本按同一有序命令/日志确定地演化。
    - 事件溯源选择“发生了什么”作为权威写模型，CQRS 则允许每种读需求拥有独立表示。事件必须是经过验证、过去时的事实；当前状态通过按序折叠事件获得，投影应确定、幂等、可重建。
    - 这种模型提高意图、审计、写吞吐与演化能力，却把复杂性放到顺序、事件兼容、最终一致、个人数据删除和外部副作用。它不是所有 CRUD 的升级版，而是复杂业务状态和多读模型场景下的有意识权衡。
  - title: 6. 原章总结：模型是问题与实现之间的语言
    source_heading: 6. 原章总结：模型是问题与实现之间的语言
    paragraphs:
    - Cypher、SPARQL 和 Datalog 能自然表达递归；SQL 可用递归 CTE 模拟，但语言长度与优化负担更高。
    - 研究者要用一条长 DNA 序列，在大型数据库中寻找相似但不完全相同的序列。普通关系、文档、图或数组模型都不直接提供高效生物序列比对，因此出现 GenBank
      等专用软件。
    - 金融系统常用双重记账（double-entry accounting）：每次价值转移产生平衡分录。关系数据库能表示，但 TigerBeetle 等系统专门优化账本语义。加密货币和区块链则使用分布式账本（distributed
      ledgers），并把价值转移内建到模型。
    - 全文搜索把词项、文档和相关性作为核心；向量检索把距离和近邻作为核心。它们常与数据库并用，第 4 章会接触搜索索引。
  - title: 9. 全章知识结构
    source_heading: 9. 全章知识结构
    paragraphs:
    - 规范化减少复制、读取时连接；反规范化预计算连接、写入时维护。物化时间线、GraphQL 响应、OBT 和 CQRS 投影都是这条主线的不同表现。
    - 声明式查询把执行策略隐去；schema-on-read 把结构约束移到读取；抽象选择始终在“谁负责哪项复杂性”之间转移，而非消除复杂性。
    - 现实系统往往不是“选择唯一模型”，而是在不同生命周期阶段建立受控转换。关键是权威源、转换语义、滞后和可重建性。
    - 我们最重要的关系、查询、更新和变化，在这个模型中是否直接、可约束、可优化、可演化？若需要模拟，模拟成本是否低于引入另一模型的运维成本？
  - title: 10. 综合案例：为会议与社群平台选择数据模型
    source_heading: 10. 综合案例：为会议与社群平台选择数据模型
    paragraphs:
    - 本节是教学性架构推演，用于把原章模型放在同一应用中比较。它不表示实际项目应从第一天部署所有数据库；最后会给出渐进实现。
    - resolver 从关系/文档读模型批量 hydration。客户端不能任意遍历社交图，只能访问 schema 授权字段。
    - 事实粒度定义为“一次票种数量变动/销售行”，包含金额、数量和维度键。取消和退款可以作为负数事实或独立事件类型，必须统一口径。
    - 类别 one-hot，高基数 ID 使用稀疏特征/嵌入。训练转换必须版本化并在在线推荐中保持语义一致。
  - title: 11. 核心结论
    source_heading: 11. 核心结论
    paragraphs:
    - schema-on-read 和 schema-on-write 都有迁移成本。 只是责任和时机不同。
    - 属性图和 RDF 表达相近但生态不同。 前者强调标签/属性边，后者强调三元组和全局 URI。
    - Cypher、SPARQL、Datalog 与递归 SQL 可表达相同可达性。 自然度和优化能力不同。
    - 不可变日志有删除与副作用边界。 crypto-shredding、外置 PII 和副作用隔离需提前设计。
  - title: 12. 选择数据模型与查询语言的一般方法
    source_heading: 12. 选择数据模型与查询语言的一般方法
    paragraphs:
    - 不是全库只能选择 schema-on-read 或 schema-on-write；不同区域可不同。
    - 不要因 API 返回 JSON 就必须使用文档库，也不要因 GraphQL 带 graph 就必须使用图数据库。
    - 专用模型的表达收益必须覆盖这份固定成本。中小规模优先使用已有数据库的多模型能力往往更稳妥。
    - 选择时始终追问：模型让什么变简单，又把什么复杂性转移到查询、更新、迁移或运维？只有把这条转移链说清，数据模型才是经过论证的架构决定，而不是技术偏好。
  takeaways:
  - 长期成功来自通用表达、成熟优化器、事务与生态，而不是它对每种数据都最自然。
  - 全文搜索把词项、文档和相关性作为核心；向量检索把距离和近邻作为核心。它们常与数据库并用，第 4 章会接触搜索索引。
  - NoSQL/NewSQL 是历史标签，不是具体语义。 应比较真实能力。
  - 局部性取决于访问边界。 整体读文档受益，局部读写大文档可能浪费。
  - 没有万能模型。 应让最重要关系、查询、更新和演化自然，同时控制多系统运维成本。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「8.1 数据模型不等于数据库产品」？
  answer: 关系、文档、属性图和 RDF 是逻辑模型；PostgreSQL、MongoDB、Neo4j、Neptune 是产品。一个产品可支持多个模型，同一模型也有多个实现。
  source_heading: 8.1 数据模型不等于数据库产品
- level: 概念辨析
  question: 原文如何解释「8.19 文档局部性不是总收益」？
  answer: 整文档读取才受益；只读一个字段会过量 I/O，改一个字段可能重写整文档。
  source_heading: 8.19 文档局部性不是总收益
- level: 概念辨析
  question: 原文如何解释「8.36 schema-on-read 与动态类型只是类比」？
  answer: 数据库模式还涉及持久历史、多消费者和迁移，不完全等同于编程语言类型检查。
  source_heading: 8.36 schema-on-read 与动态类型只是类比
- level: 概念辨析
  question: 原文如何解释「8.57 command 不等于 event」？
  answer: 命令可能被拒绝，事件是已成立事实。把请求直接写成事件会让无效事实进入权威日志。
  source_heading: 8.57 command 不等于 event
- level: 概念辨析
  question: 原文如何解释「8.78 存储模型不必等于 API 模型」？
  answer: GraphQL 可返回反规范化 JSON，底层仍规范化；事件写模型可派生关系读表。不同边界应按用途建模。
  source_heading: 8.78 存储模型不必等于 API 模型
