overview:
  kind: summary
  minutes: 11
  question: 0. 本章定位：数据模型决定我们怎样看待问题？
  question_source: 0. 本章定位：数据模型决定我们怎样看待问题
  thesis: 规范化减少复制、读取时连接；反规范化预计算连接、写入时维护。物化时间线、GraphQL 响应、OBT 和 CQRS 投影都是这条主线的不同表现。
  thesis_source: 9. 全章知识结构
  concepts:
  - term: 0. 本章定位：数据模型决定我们怎样看待问题
    meaning: 数据模型（data model）常被误解为“表怎么建”或“JSON 长什么样”。作者把它放在更高的位置：数据模型不仅影响软件怎样写，也影响开发者怎样思考正在解决的问题。
    source_heading: 0. 本章定位：数据模型决定我们怎样看待问题
  - term: 2. 关系模型与文档模型
    meaning: NoSQL 运动最持久的影响之一是文档模型（document model）。它通常用 JSON 表示自包含记录，早期由 MongoDB、Couchbase
      等专用数据库推广，后来多数关系数据库也加入 JSON 类型。
    source_heading: 2. 关系模型与文档模型
  - term: 4. 事件溯源与 CQRS
    meaning: 事件溯源选择“发生了什么”作为权威写模型，CQRS 则允许每种读需求拥有独立表示。事件必须是经过验证、过去时的事实；当前状态通过按序折叠事件获得，投影应确定、幂等、可重建。
    source_heading: 4. 事件溯源与 CQRS
  - term: 6. 原章总结：模型是问题与实现之间的语言
    meaning: 金融系统常用双重记账（double-entry accounting）：每次价值转移产生平衡分录。关系数据库能表示，但 TigerBeetle
      等系统专门优化账本语义。加密货币和区块链则使用分布式账本（distributed ledgers），并把价值转移内建到模型。
    source_heading: 6. 原章总结：模型是问题与实现之间的语言
  - term: 10. 综合案例：为会议与社群平台选择数据模型
    meaning: 事实粒度定义为“一次票种数量变动/销售行”，包含金额、数量和维度键。取消和退款可以作为负数事实或独立事件类型，必须统一口径。
    source_heading: 10. 综合案例：为会议与社群平台选择数据模型
  - term: 12. 选择数据模型与查询语言的一般方法
    meaning: 选择时始终追问：模型让什么变简单，又把什么复杂性转移到查询、更新、迁移或运维？只有把这条转移链说清，数据模型才是经过论证的架构决定，而不是技术偏好。
    source_heading: 12. 选择数据模型与查询语言的一般方法
  logic:
  - 0. 本章定位：数据模型决定我们怎样看待问题
  - 2. 关系模型与文档模型
  - 3. 类图数据模型
  - 6. 原章总结：模型是问题与实现之间的语言
  - 9. 全章知识结构
