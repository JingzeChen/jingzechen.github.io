  question: 导读：本章究竟在回答什么问题？
  question_source: 导读：本章究竟在回答什么问题
  thesis: 但“多考试”不是答案。真正有效的是一套有条件的设计：低权重、可预测、目标一致、需要主动生成、难度适中、跨时间重复、及时或适度延迟地提供纠正反馈，并把结果用于下一轮学习。检索之所以有效，不是因为它让学习更痛苦，而是因为它让学习者练习了未来真正需要的动作：在答案不在眼前时，把知识找回来。
  thesis_source: 十一、全章总结
  concepts:
  - term: 导读：本章究竟在回答什么问题
    meaning: 学习者根据线索努力提取知识，会重新激活并巩固该记忆，同时暴露未知；若检索成功或随后得到纠正反馈，并在时间上合理间隔、在情境上适当变化，知识会更持久、更容易迁移。低权重测验是组织这种检索的工具，而不是检索练习的唯一形式。
    source_heading: 导读：本章究竟在回答什么问题
  - term: 二、记忆结与检索：自我检测如何加固知识链
    meaning: 在这种语境中，测验意味着风险与惩罚，教师和学生很难把它理解成日常练习。2010 年《纽约时报》报道一项研究：读完课文后接受回忆测验的学生，一周后比未接受测验的学生多记住约
      50% 的信息。网络评论仍把学习与回忆对立，或因考试焦虑而拒绝测验。
    source_heading: 二、记忆结与检索：自我检测如何加固知识链
  - term: 五、合意困难与反馈：费力为何值得
    meaning: 可以把它理解成倒 U 形关系：太容易、几乎不需要检索时，长期收益偏低；难度适中、需要努力且最终能答出来时，收益最高；太难到持续失败又没有反馈时，收益会再次下降。这个关系会随人和任务变化，最重要的前提仍是原书强调的“真正发生了检索”。
    source_heading: 五、合意困难与反馈：费力为何值得
  - term: 六、总结实践
    meaning: 事实、复杂概念、问题解决程序和运动技能，只要将来需要从记忆中调用，都能使用检索练习。具体形式必须匹配目标：事实可用简答，技能需要模拟或实际执行。
    source_heading: 六、总结实践
  - term: A. 概念理解
    meaning: 测量反应性为什么在研究遗忘时是干扰，在教学中却是收益？
    source_heading: A. 概念理解
  - term: 十一、全章总结
    meaning: 但“多考试”不是答案。真正有效的是一套有条件的设计：低权重、可预测、目标一致、需要主动生成、难度适中、跨时间重复、及时或适度延迟地提供纠正反馈，并把结果用于下一轮学习。检索之所以有效，不是因为它让学习更痛苦，而是因为它让学习者练习了未来真正需要的动作：在答案不在眼前时，把知识找回来。
    source_heading: 十一、全章总结
