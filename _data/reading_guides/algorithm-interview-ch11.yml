overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 区间更新只标记开始和结束后一位，最终再以前缀和恢复。二维版本在两个坐标轴上分别应用同样思想，于是出现四项容斥与四角标记。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 每个基础单元和每道正文题后都给出对应的 C++17 实现；Python 与 Go 仅在章末附录提供整章接口，便于先沿着公式读懂主线，再做语言迁移。
    source_heading: 本章要解决什么问题
  - term: 11.1 前缀和与差分概述
    meaning: 补充：离散微积分视角。 差分可类比离散导数，前缀和可类比离散积分。区间内部加同一常数不会改变内部相邻元素之差，只会改变进入区间和离开区间的两个边界；二维情形则由四个角描述矩形指示函数的二阶离散变化。这个类比有助于理解公式，但本章算法只依赖上述代数推导，并不要求微积分知识。
    source_heading: 11.1 前缀和与差分概述
  - term: 11.3.2 LeetCode 1074：元素和为目标值的子矩阵数量（★★★）
    meaning: 任何包含中间行的行带各列均为正，不会再产生 0 和矩形，所以答案为 4。
    source_heading: 11.3.2 LeetCode 1074：元素和为目标值的子矩阵数量（★★★）
  - term: 11.3.3 面试题 17.24：最大子矩阵（★★★）
    meaning: 上一题的降维思想仍然适用：固定上下边界后，矩形最大和就是压缩列数组的最大子数组和，即 11.2.8 的问题；同时要记录最大子数组的左右下标。
    source_heading: 11.3.3 面试题 17.24：最大子矩阵（★★★）
  - term: 本章总结
    meaning: 本章最值得掌握的不是某一道题的模板，而是“改变表示后消除重复工作”：查询问题保存累计边界，批量更新保存变化边界，二维问题固定一对边界后降维。只要先写出严格的区间方程，再选择应保存的历史状态，许多看似不同的数组与矩阵题都会落到同一条推理链上。
    source_heading: 本章总结
  - term: 10. 差分不适合更新后立即查询
    meaning: 补充： 动态一维区间更新与查询可使用树状数组或带懒标记的线段树；二维动态问题也有更复杂的对应结构。
    source_heading: 10. 差分不适合更新后立即查询
  logic:
  - 本章要解决什么问题
  - 11.1 前缀和与差分概述
  - 11.2 一维前缀和应用的算法设计
  - 11.3.3 面试题 17.24：最大子矩阵（★★★）
  - 11.4 差分数组应用的算法设计
  - 本章总结
  - 10. 差分不适合更新后立即查询
  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 差分：先在边界记录变化，最后统一累计恢复所有区间更新。
    - 二者并非互不相关的技巧，而是一对离散逆运算。理解“哪些部分被相减抵消、哪些边界标记会在何处生效和失效”，比死记公式更重要。
    - 正文先建立 4 个基础算法单元，再按原书顺序展开 14 道正文题；章末 11 道推荐练习只列题，不计入正文题数。
    - 每个基础单元和每道正文题后都给出对应的 C++17 实现；Python 与 Go 仅在章末附录提供整章接口，便于先沿着公式读懂主线，再做语言迁移。
  - title: 11.1 前缀和与差分概述
    source_heading: 11.1 前缀和与差分概述
    paragraphs:
    - 这里的前提是数组在查询期间不修改。若原数组频繁单点修改，旧前缀和中从修改位置开始的所有值都会失效。
    - 补充： 若数组需要频繁修改，同时还要查询区间和，一维可使用树状数组或线段树；二维也有二维树状数组等结构。它们通常把更新和查询都控制在对数时间，但实现与常数开销更大。
    - 若题目只要求所有更新结束后的最终数组，没有必要每次立即修改区间内部；只需记录“从哪里开始增加 v，从哪里开始取消这次增加”。
    - 补充：离散微积分视角。 差分可类比离散导数，前缀和可类比离散积分。区间内部加同一常数不会改变内部相邻元素之差，只会改变进入区间和离开区间的两个边界；二维情形则由四个角描述矩形指示函数的二阶离散变化。这个类比有助于理解公式，但本章算法只依赖上述代数推导，并不要求微积分知识。
  - title: 11.2 一维前缀和应用的算法设计
    source_heading: 11.2 一维前缀和应用的算法设计
    paragraphs:
    - 补充：与两次 Kadane 的关系。 也可以分别求最大子数组和与最小子数组和，答案为两者绝对值的较大者。前缀极值写法更直接地利用了本章主题；两者时间和空间复杂度相同。
    - 必须先计入答案，再把当前前缀加入计数，才能保证左边界前缀严格不晚于当前区间终点；即使先加入，同奇偶配对也不会增加答案，但统一采用“先查询、后插入”更符合后续哈希题的时序。
    - 同余证明保证“余数相同”与“区间和可被 k 整除”等价；距离检查保证长度约束。算法检查每个右端点与最早同余前缀，若存在合法区间必会返回，否则所有同余前缀对都不满足长度要求。
    - 先计算答案，保证被减的前缀严格早于当前前缀，对应非空子数组。若先把当前前缀纳入最小值，全负数组可能错误地用同一前缀相减得到空区间和 0，而正确答案应是最大的单个负数。
  - title: 11.3.2 LeetCode 1074：元素和为目标值的子矩阵数量（★★★）
    source_heading: 11.3.2 LeetCode 1074：元素和为目标值的子矩阵数量（★★★）
    paragraphs:
    - 即可得到当前行带的列和，再运行一维哈希统计。这是原书给出的另一种合并处理方式。
    - 任何包含中间行的行带各列均为正，不会再产生 0 和矩形，所以答案为 4。
  - title: 11.3.3 面试题 17.24：最大子矩阵（★★★）
    source_heading: 11.3.3 面试题 17.24：最大子矩阵（★★★）
    paragraphs:
    - 上一题的降维思想仍然适用：固定上下边界后，矩形最大和就是压缩列数组的最大子数组和，即 11.2.8 的问题；同时要记录最大子数组的左右下标。
    - 这样即使所有元素都为负，也会返回数值最大的单个元素，而不会错误返回空矩形和 0。
  - title: 11.4 差分数组应用的算法设计
    source_heading: 11.4 差分数组应用的算法设计
    paragraphs:
    - 前缀求和是线性的，所以所有阶梯贡献可先叠加边界、再统一恢复，结果与逐次修改完全相同。
    - 每条预订在对应航班区间形成一个常量阶梯，差分的开始和取消标记精确覆盖它。
    - 实现时先完成从一基编号到零基下标的转换，是避免 off-by-one 错误的关键。
    - 所以贡献在目标矩形内恰为 1，外部为 0。不同查询的贡献可线性叠加，故最终矩阵正确。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 区间更新只标记开始和结束后一位，最终再以前缀和恢复。二维版本在两个坐标轴上分别应用同样思想，于是出现四项容斥与四角标记。
    - 决定历史信息：计数保存频次，最长距离保存最早下标，极值问题保存最小或最大前缀。
    - 这些结论都依赖具体操作模式：静态前缀和不支持廉价修改，离线差分不支持随时读取完整当前状态，哈希前缀适合等式、奇偶和同余约束，而非任意区间最值。
    - 本章最值得掌握的不是某一道题的模板，而是“改变表示后消除重复工作”：查询问题保存累计边界，批量更新保存变化边界，二维问题固定一对边界后降维。只要先写出严格的区间方程，再选择应保存的历史状态，许多看似不同的数组与矩阵题都会落到同一条推理链上。
  - title: 10. 差分不适合更新后立即查询
    source_heading: 10. 差分不适合更新后立即查询
    paragraphs:
    - 普通差分把传播推迟到最后一次前缀扫描。若每次更新后都要查询当前区间和，反复恢复会失去优势。
    - 补充： 动态一维区间更新与查询可使用树状数组或带懒标记的线段树；二维动态问题也有更复杂的对应结构。
  takeaways:
  - 区间更新只标记开始和结束后一位，最终再以前缀和恢复。二维版本在两个坐标轴上分别应用同样思想，于是出现四项容斥与四角标记。
  - 决定历史信息：计数保存频次，最长距离保存最早下标，极值问题保存最小或最大前缀。
  - 处理维度：二维矩形先固定一对边界压成一维，再复用已解决的一维算法。
  - 这些结论都依赖具体操作模式：静态前缀和不支持廉价修改，离线差分不支持随时读取完整当前状态，哈希前缀适合等式、奇偶和同余约束，而非任意区间最值。
  - 本章最值得掌握的不是某一道题的模板，而是“改变表示后消除重复工作”：查询问题保存累计边界，批量更新保存变化边界，二维问题固定一对边界后降维。只要先写出严格的区间方程，再选择应保存的历史状态，许多看似不同的数组与矩阵题都会落到同一条推理链上。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「2. 前缀和让“求一个区间”变快，不会自动减少区间数量」？
  answer: 1074 和最大子矩阵真正的优化来自固定一对边界后降维，而不只是“使用了前缀和”。
  source_heading: 2. 前缀和让“求一个区间”变快，不会自动减少区间数量
- level: 概念辨析
  question: 原文如何解释「5. “频次”和“最早下标”不能互换」？
  answer: 计数题中，相同前缀的每次出现都是不同左端点，必须保存次数；最长长度题只关心最远左端，必须永久保留最早下标。
  source_heading: 5. “频次”和“最早下标”不能互换
- level: 概念辨析
  question: 7. 二维容斥的最后一项为什么是加号？
  answer: 从大前缀中减去上方和左方时，左上重叠区被减了两次；目标只是去掉一次，所以必须加回一次。这与集合公式
  source_heading: 7. 二维容斥的最后一项为什么是加号
- level: 概念辨析
  question: 原文如何解释「9. 二维差分的四个符号与传播方向有关」？
  answer: 若交换坐标含义或采用其他差分定义，公式也会改变。不要脱离差分定义单独背四个符号。
  source_heading: 9. 二维差分的四个符号与传播方向有关
- level: 概念辨析
  question: 原文如何解释「11. 前缀“积”借用了分解思想，但不等同于可逆前缀和」？
  answer: 除自身乘积把答案拆成左积与右积，并没有使用除法逆运算。乘法遇到 0 时不可逆，这正是题目同时构造两侧积，而不使用“总积除以自身”的原因。
  source_heading: 11. 前缀“积”借用了分解思想，但不等同于可逆前缀和
