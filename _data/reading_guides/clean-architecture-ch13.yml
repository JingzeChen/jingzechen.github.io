overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: REP 和 CCP 是包含性原则，通常推动组件变大。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 早期项目通常更关心快速修改和减少发布范围，因此偏向 CCP。项目成熟、出现更多复用者后，REP 和 CRP 的重要性会上升，组件可能需要重新拆分。
    source_heading: 本章导读
  - term: 4.4 放弃 CRP：产生太多无谓发布
    meaning: 若只强调 REP 和 CCP，团队会把能够一起发布、一起变化的许多类聚在大组件中。
    source_heading: 4.4 放弃 CRP：产生太多无谓发布
  - term: 5.3 本章完整思路
    meaning: 项目早期通常偏向 CCP，成熟后提高 REP 和 CRP 权重；
    source_heading: 5.3 本章完整思路
  - term: 8.1 REP 检查清单
    meaning: 是否存在只能复制源码才能复用的代码？
    source_heading: 8.1 REP 检查清单
  - term: 8.8 场景判断四：容器与迭代器
    meaning: 判断： 它们共同构成可复用抽象，放在同一组件符合 CRP，也可能符合 CCP 与 REP。
    source_heading: 8.8 场景判断四：容器与迭代器
  - term: 本章总结
    meaning: 项目成熟、消费者增多后，应提高 REP 与 CRP 的权重并重新审视边界。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 4.4 放弃 CRP：产生太多无谓发布
  - 4.10 没有永久最优的划分
  - 8.1 REP 检查清单
  - 8.3 CRP 检查清单
  - 8.10 场景判断六：成熟 SDK 拆出集成包
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 13 章首页第 12 章回答了“组件是什么”：组件是部署单元，是系统中能够作为整体交付的最小实体。
    - REP 从发布者和复用者的关系观察；
    - REP、CCP 和 CRP 会把组件推向不同方向，合理边界是可开发性与可复用性之间的动态平衡。
    - 早期项目通常更关心快速修改和减少发布范围，因此偏向 CCP。项目成熟、出现更多复用者后，REP 和 CRP 的重要性会上升，组件可能需要重新拆分。
  - title: 3. CRP：共同复用原则
    source_heading: 3. CRP：共同复用原则
    paragraphs:
    - CRP 希望一个组件中的类对于其典型消费者来说是不可分割的：一旦依赖这个组件，消费者确实需要其中那组共同协作的类。
    - 如果消费者群体长期分成互不重叠的两组，一组只用前半部分，另一组只用后半部分，组件可能包含两个不同复用单元。
    - 将 SDK 拆成稳定核心与按产品划分的子组件，可以让消费者只选择真正需要的部分。这正是 CRP 的应用。
    - 包管理器常支持 optional dependency、feature flag 或按需加载。它们可以减少安装体积，却不一定改变发布边界。
  - title: 4.4 放弃 CRP：产生太多无谓发布
    source_heading: 4.4 放弃 CRP：产生太多无谓发布
    paragraphs:
    - 若只强调 REP 和 CCP，团队会把能够一起发布、一起变化的许多类聚在大组件中。
    - 自己不使用的功能变化也产生新版本；
  - title: 4.10 没有永久最优的划分
    source_heading: 4.10 没有永久最优的划分
    paragraphs:
    - 昨天总是一起变化的类，今天可能已经稳定；
    - 昨天共享发布最简单，今天无关升级已成为负担；
    - 昨天拆分成本太高，今天工具与团队已经成熟。
    - 明知变化和复用模式已经改变，仍把旧边界当成不可修改。
  - title: 5.3 本章完整思路
    source_heading: 5.3 本章完整思路
    paragraphs:
    - REP 的正面判据较弱，因此由 CCP 与 CRP 补强；
    - CCP 把因相同原因、在相同时间变化的类放在一起；
    - REP 和 CCP 倾向扩大组件，CRP 倾向缩小组件；
    - 项目早期通常偏向 CCP，成熟后提高 REP 和 CRP 权重；
  - title: 8.1 REP 检查清单
    source_heading: 8.1 REP 检查清单
    paragraphs:
    - 组件中的类是否共享一个可解释主题？
    - 它们出现在同一份发布说明中是否自然？
    - 是否存在只能复制源码才能复用的代码？
  - title: 8.3 CRP 检查清单
    source_heading: 8.3 CRP 检查清单
    paragraphs:
    - 每个消费者实际使用组件中的哪些能力？
    - 无关类变化是否迫使消费者考虑升级？
    - 组件中的类是否共同构成不可分割抽象？
    - 拆分会不会让共同变化横跨太多组件？
  - title: 8.8 场景判断四：容器与迭代器
    source_heading: 8.8 场景判断四：容器与迭代器
    paragraphs:
    - 一个容器类型与专用迭代器共享内部约定，消费者总是一起使用，变化也高度相关。
    - 判断： 它们共同构成可复用抽象，放在同一组件符合 CRP，也可能符合 CCP 与 REP。
  - title: 8.10 场景判断六：成熟 SDK 拆出集成包
    source_heading: 8.10 场景判断六：成熟 SDK 拆出集成包
    paragraphs:
    - 核心 SDK 已稳定，不同用户分别使用 AWS、Azure 或本地存储集成，但原来所有集成都在同一个组件。
    - 判断： 项目成熟和使用模式分化后，增强 REP 与 CRP、拆出独立集成发布是合理演化。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 仓库边界不等于组件边界，Monorepo 也可以发布多个组件。
    - REP 的正面判据较弱，但无主题发布和无关升级很容易暴露违规。
    - CCP 延续 OCP 的战略性封闭，优先保护最常见和最昂贵的变化。
    - 项目成熟、消费者增多后，应提高 REP 与 CRP 的权重并重新审视边界。
  takeaways:
  - 第 13 章回答哪些类和模块应该进入同一个组件。
  - 同一组件中的类应形成可解释主题，并适合共享版本与发布文档。
  - 技术相似不等于变化原因相同，应结合业务角色和版本历史判断。
  - REP 和 CCP 是包含性原则，通常推动组件变大。
  - 组件内聚没有永久最优答案，合理结构会随开发和使用方式持续演化。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 “内聚就是一个组件只做一件事”」？
  answer: 过于简单。本章中的组件内聚同时考虑发布、共同变化和共同复用，是多种力量的平衡。
  source_heading: 7.1 “内聚就是一个组件只做一件事”
- level: 概念辨析
  question: 原文如何解释「7.5 “CCP 就等于按业务目录分包”」？
  answer: 不完整。按业务能力常能匹配变化原因，但最终应由真实共同变化验证，而不是只看目录名称。
  source_heading: 7.5 “CCP 就等于按业务目录分包”
- level: 概念辨析
  question: 原文如何解释「7.9 “消费者只调用一个类，所以依赖很轻”」？
  answer: 错误。消费者仍依赖整个组件发布版本，并可能承担其全部传递依赖和升级影响。
  source_heading: 7.9 “消费者只调用一个类，所以依赖很轻”
- level: 概念辨析
  question: 原文如何解释「7.14 “组件划分一旦完成就应保持不变”」？
  answer: 错误。作者明确指出，今天合理的划分明年可能不再合理，组件会随项目成熟度演化。
  source_heading: 7.14 “组件划分一旦完成就应保持不变”
- level: 概念辨析
  question: 原文如何解释「7.18 “本章原则只适用于对外开源库”」？
  answer: 错误。内部组件同样需要控制共同变化和无关依赖。只是 REP 的发布纪律会根据复用范围采取不同强度。
  source_heading: 7.18 “本章原则只适用于对外开源库”
