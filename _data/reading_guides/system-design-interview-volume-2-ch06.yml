  minutes: 8
  question: 0. 为什么广告点击聚合比普通计数难？
  question_source: 0. 为什么广告点击聚合比普通计数难
  thesis: 广告聚合的核心不是 Count，而是窗口状态在乱序、重复和故障下的正确演进。
  thesis_source: 7. 核心结论
  concepts:
  - term: 0. 为什么广告点击聚合比普通计数难
    meaning: 原始数据是事实来源，聚合数据是查询优化后的派生视图。Kafka 不只是缓冲，还用于把“处理输入 Offset”和“提交输出结果”纳入流处理事务边界。
    source_heading: 0. 为什么广告点击聚合比普通计数难
  - term: Raw
    meaning: 或把 10 GB 左右滚动文件写入 S3，使用 ORC/Parquet/Avro。
    source_heading: Raw
  - term: 3.3 Data Recalculation
    meaning: 专用 Recalculation Cluster 必须限流。历史重放速度若远高于实时，会压垮输出 Kafka/DB。
    source_heading: 3.3 Data Recalculation
  - term: 3.7 Delivery Guarantees：为什么要 Exactly-once
    meaning: At-least-once 对一般分析常够用，但几个百分点误差在广告账单中可能是数百万美元，因此作者推荐 Exactly-once Processing。
    source_heading: 3.7 Delivery Guarantees：为什么要 Exactly-once
  - term: 3.15 Hotspot Issue
    meaning: 作者方案：检测某 Aggregate 超容量后向 Resource Manager 申请额外节点，将该广告事件拆成多个子组并行局部聚合，最后
      Reduce 回原节点。
    source_heading: 3.15 Hotspot Issue
  - term: 8. 解决流式事件聚合问题的一般思路
    meaning: 本章最值得迁移的方法是：不要把流计算正确性寄托在“事件只来一次且按时到达”；应把重放视为常态，用不可变 Raw、Event Time、Watermark、原子
      Checkpoint 和独立 Reconciliation 共同定义可解释、可恢复的最终结果。
    source_heading: 8. 解决流式事件聚合问题的一般思路
