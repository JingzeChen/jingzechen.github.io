checks:
- level: 概念辨析
  question: 原文如何解释「5.2 Raw Data 与 Aggregated Data 不是二选一」？
  answer: Raw 提供事实与重算，Aggregated 提供查询性能。只存后者无法修 Bug，只存前者 Dashboard 太慢。
  source_heading: 5.2 Raw Data 与 Aggregated Data 不是二选一
- level: 概念辨析
  question: 原文如何解释「5.10 Star Schema 预聚合不是任意过滤」？
  answer: 只支持预定义 Dimension；维度组合越多，Bucket/写放大越大。
  source_heading: 5.10 Star Schema 预聚合不是任意过滤
- level: 概念辨析
  question: 原文如何解释「5.16 Dedup State 不能无限增长」？
  answer: 应按最大重试/乱序窗口设置 TTL，并写入 Checkpoint；太短会接受旧重复，太长耗尽状态。
  source_heading: 5.16 Dedup State 不能无限增长
- level: 概念辨析
  question: 原文如何解释「5.20 Topic Physical Sharding 会影响 Global Top-N」？
  answer: 地域/业务 Topic 各自产生 Local Top-N 后仍需 Global Reduce。
  source_heading: 5.20 Topic Physical Sharding 会影响 Global Top-N
- level: 概念辨析
  question: 原文如何解释「5.27 Query 的“最近 M 分钟”要定义 Final/Provisional」？
  answer: 当前窗口尚未越过 Watermark，结果可能更新。账单与 Dashboard 对数据稳定性要求不同。
  source_heading: 5.27 Query 的“最近 M 分钟”要定义 Final/Provisional
