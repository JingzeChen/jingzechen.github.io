overview:
  kind: summary
  minutes: 9
  question: 一、本章要解决什么问题？
  question_source: 一、本章要解决什么问题
  thesis: 动物研究显示，依赖空间贮藏食物的鸟类往往拥有相对更发达的海马体，某些鸟类还会随季节和空间经验发生变化；原书援引的观察中，贮食经验可伴随海马体增大约
    30%。这为人类导航训练可能影响海马体提供了先验线索，但跨物种结果只能提供假说，不能直接代替人类纵向证据。
  thesis_source: 3.2 大脑就像肌肉，越练越大
  concepts:
  - term: 一、本章要解决什么问题
    meaning: 身体和大脑不是静态容器，而是会依据持续使用和任务要求改变的适应系统。当训练把某一系统推到原有稳定范围之外，同时又没有超过可恢复范围时，系统会通过生理、神经和认知重组建立新的稳定状态，从而使原本困难的任务变得可完成。
    source_heading: 一、本章要解决什么问题
  - term: 3.2 大脑就像肌肉，越练越大
    meaning: 动物研究显示，依赖空间贮藏食物的鸟类往往拥有相对更发达的海马体，某些鸟类还会随季节和空间经验发生变化；原书援引的观察中，贮食经验可伴随海马体增大约
      30%。这为人类导航训练可能影响海马体提供了先验线索，但跨物种结果只能提供假说，不能直接代替人类纵向证据。
    source_heading: 3.2 大脑就像肌肉，越练越大
  - term: 五、走出舒适区的重要性
    meaning: 前两节回答“改变是否发生”，本节要解释“什么条件触发改变”。如果身体和大脑时刻都能变化，为什么日常生活没有让每个人自动变强？
    source_heading: 五、走出舒适区的重要性
  - term: 5.2 被迫走出舒适区之后
    meaning: 原书以每周三次、每次半小时、心率约为最大心率 70% 的跑步作直觉例子。这个数值不是对所有人的处方；年龄、健康、药物和训练史不同，安全强度应个体化，必要时咨询专业人员。
    source_heading: 5.2 被迫走出舒适区之后
  - term: 七、潜能可以被构筑
    meaning: 身体能力可以用肌纤维、供氧和循环等变化解释。心理能力虽有脑结构变化证据，但还缺一个功能层答案：专家究竟形成了什么内部组织，使他们能看见、记住和处理更多信息？
    source_heading: 七、潜能可以被构筑
  - term: 十二、复习问题
    meaning: 选择一项正在学习的技能，写出它的当前边界、可恢复挑战、反馈方式、恢复安排和维持方案。
    source_heading: 十二、复习问题
  logic:
  - 一、本章要解决什么问题
  - 3.2 大脑就像肌肉，越练越大
