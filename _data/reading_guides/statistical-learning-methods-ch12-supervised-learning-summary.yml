overview:
  kind: summary
  minutes: 10
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 感知机、k 近邻法、朴素贝叶斯法、决策树、逻辑斯谛回归与最大熵模型、支持向量机、提升方法是分类方法。原始的感知机、支持向量机以及提升方法是针对二类分类的，可以将它们扩展到多类分类。隐马尔可夫模型、条件随机场是标注方法。
    EM 算法是含有隐变量的概率模型的一般学习算法，可以用于生成模型的无监督学习。
  thesis_source: 12.1 适用问题（原书第 1 节）
  concepts:
  - term: 0. 本章解决什么问题
    meaning: "【补充】这个框架的价值在于”可迁移”：以后遇到任何一个没学过的机器学习方法（比如随机森林、XGBoost、Transformer），都可以问自己这四个问题，很快就能定位它在整个知识版图中的位置。本章实际上是在示范怎么读一个方法。"
    source_heading: 0. 本章解决什么问题
  - term: 表 12.1 十种监督学习方法特点的概括总结
    meaning: 原书脚注说得很清楚：EM 算法是一般方法，不是一个具体模型。它可以套在朴素贝叶斯上（第 9 章）、套在 HMM 上（Baum-Welch，第
      10 章 10.3.2 节）、套在高斯混合模型上（第 9 章 9.3 节）。所以它跟其他 9 行不在同一层次上。
    source_heading: 表 12.1 十种监督学习方法特点的概括总结
  - term: 12.2 模型（原书第 2 节）
    meaning: 决策树是定义在一般的特征空间上的，可以含有连续变量或离散变量。感知机、支持向量机、k 近邻法的特征空间是欧氏空间（更一般地，是希尔伯特空间）。提升方法的模型是弱分类器的线性组合，弱分类器的特征空间就是提升方法模型的特征空间。
    source_heading: 12.2 模型（原书第 2 节）
  - term: 12.3 学习策略（原书第 3 节）
    meaning: 支持向量机用 L_2 范数表示模型的复杂度。 原始的逻辑斯谛回归与最大熵模型没有正则化项，可以给它们加上 L_2 范数正则化项。提升方法没有显式的正则化项，通常通过早停止（early
      stopping）的方法达到正则化的效果。
    source_heading: 12.3 学习策略（原书第 3 节）
  - term: 12.6 【补充】深入理解
    meaning: 错。原书表 12.1 的脚注①明确说明：EM 算法是一般方法，不具有具体模型。它是”含隐变量概率模型的通用学习算法”，可以套在朴素贝叶斯、HMM、高斯混合模型上。
    source_heading: 12.6 【补充】深入理解
  - term: 12.7 本章方法论总结
    meaning: 学习算法分三类：解析解（朴素贝叶斯、HMM 监督学习）、数值最优化（感知机、LR、CRF、SVM）、启发式（决策树、提升方法、EM）。
    source_heading: 12.7 本章方法论总结
