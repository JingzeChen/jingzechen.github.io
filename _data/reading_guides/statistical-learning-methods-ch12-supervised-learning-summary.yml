  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 这不是随意分的四块——它就是第 1 章 1.1.5 节提出的统计学习三要素（模型、策略、算法）再加上”适用问题”这个入口。
    - "【补充】这个框架的价值在于”可迁移”：以后遇到任何一个没学过的机器学习方法（比如随机森林、XGBoost、Transformer），都可以问自己这四个问题，很快就能定位它在整个知识版图中的位置。本章实际上是在示范怎么读一个方法。"
    - 式 (12.1)~(12.4) 给出完整推导，包括原书未展开的”为什么这三个损失是 0-1 损失的上界”“为什么它们能替代 0-1 损失”
    - 补充代理损失的理论保证（总体极小元、分类校准性），这是理解”为什么 SVM 不给概率、为什么 AdaBoost 怕噪声”的关键
  - title: 表 12.1 十种监督学习方法特点的概括总结
    source_heading: 表 12.1 十种监督学习方法特点的概括总结
    paragraphs:
    - 因为 k 近邻法没有显式的学习过程——它不训练模型，来了新样本才现场找 k 个最近邻投票。第 3 章 3.1 节说过：”k 近邻法不具有显式的学习过程。”所以”学习策略”“损失函数”“学习算法”都无从填写。
    - 原书脚注说得很清楚：EM 算法是一般方法，不是一个具体模型。它可以套在朴素贝叶斯上（第 9 章）、套在 HMM 上（Baum-Welch，第 10 章
      10.3.2 节）、套在高斯混合模型上（第 9 章 9.3 节）。所以它跟其他 9 行不在同一层次上。
    - 即”观测序列条件下状态序列的条件概率分布”，两者的主客关系相反。第 11 章 11.2.1 节明确写着”Y 是输出变量，表示标记序列，X 是输入变量，表示需要标注的观测序列”，而定义
      11.3 中 X 始终在条件竖线的右边。理解时应以第 11 章正文为准。
    - "（作为对照：同一张表中隐马尔可夫模型那一行写的是”观测序列与状态序列的联合概率分布模型”，方向没有问题，因为联合分布是对称的。）"
  - title: 12.1 适用问题（原书第 1 节）
    source_heading: 12.1 适用问题（原书第 1 节）
    paragraphs:
    - 本篇主要介绍监督学习方法。监督学习可以认为是学习一个模型，使它能对给定的输入预测相应的输出。监督学习包括分类、标注、回归。本篇主要考虑前两者的学习方法。
    - 分类问题是从实例的特征向量到类标记的预测问题，标注问题是从观测序列到标记序列（或状态序列）的预测问题。可以认为分类问题是标注问题的特殊情况。 分类问题中可能的预测结果是二类或多类。而标注问题中可能的预测结果是所有的标记序列，其数目是指数级的。
    - 感知机、k 近邻法、朴素贝叶斯法、决策树、逻辑斯谛回归与最大熵模型、支持向量机、提升方法是分类方法。原始的感知机、支持向量机以及提升方法是针对二类分类的，可以将它们扩展到多类分类。隐马尔可夫模型、条件随机场是标注方法。
      EM 算法是含有隐变量的概率模型的一般学习算法，可以用于生成模型的无监督学习。
    - 感知机、k 近邻法、朴素贝叶斯法、决策树是简单的分类方法，具有模型直观、方法简单、实现容易等特点。逻辑斯谛回归与最大熵模型、支持向量机、提升方法是更复杂但更有效的分类方法，往往分类准确率更高。隐马尔可夫模型、条件随机场是主要的标注方法。通常条件随机场的标注准确率更高。
  - title: 12.2 模型（原书第 2 节）
    source_heading: 12.2 模型（原书第 2 节）
    paragraphs:
    - 朴素贝叶斯法、隐马尔可夫模型是概率模型。感知机、k 近邻法、支持向量机、提升方法是非概率模型。而决策树、逻辑斯谛回归与最大熵模型、条件随机场可以看作是概率模型，又可以看作是非概率模型。
    - "【补充】图中缺了一条对角线：HMM 与逻辑斯谛回归之间没有直接箭头，因为要同时改两个维度。但可以沿任意一条路径走过去（先横后纵、或先纵后横），结果一致。"
    - 决策树是定义在一般的特征空间上的，可以含有连续变量或离散变量。感知机、支持向量机、k 近邻法的特征空间是欧氏空间（更一般地，是希尔伯特空间）。提升方法的模型是弱分类器的线性组合，弱分类器的特征空间就是提升方法模型的特征空间。
    - 感知机模型是线性模型，而逻辑斯谛回归与最大熵模型、条件随机场是对数线性模型。k 近邻法、决策树、支持向量机（包含核函数）、提升方法使用的是非线性模型。
  - title: 12.3 学习策略（原书第 3 节）
    source_heading: 12.3 学习策略（原书第 3 节）
    paragraphs:
    - 这 3 种损失函数都是 0-1 损失函数的上界，具有相似的形状，如图 12.2 所示。所以，可以认为支持向量机、逻辑斯谛回归与最大熵模型、提升方法使用不同的代理损失函数（surrogate
      loss function）表示分类的损失，定义经验风险或结构风险函数，实现二类分类学习任务。
    - 支持向量机用 L_2 范数表示模型的复杂度。 原始的逻辑斯谛回归与最大熵模型没有正则化项，可以给它们加上 L_2 范数正则化项。提升方法没有显式的正则化项，通常通过早停止（early
      stopping）的方法达到正则化的效果。
    - 这个恒等式是本章”学习策略”一节的枢纽：它把”概率视角（极大似然）”和”损失视角（代理损失）”焊在了一起，也解释了为什么表 12.1 中逻辑斯谛回归的”学习策略”栏写”极大似然估计”、而”损失函数”栏写”逻辑斯谛损失”——两者说的是同一件事。
    - 这个对应是理解正则化的最深刻视角：正则化不是”随便加个惩罚项”，而是把我们对参数的先验信念写进目标函数。L_2 说”参数应该接近 0 且分布平滑”，L_1
      说”大部分参数应该恰好是 0”。
  - title: 12.4 学习算法（原书第 4 节）
    source_heading: 12.4 学习算法（原书第 4 节）
    paragraphs:
    - 统计学习的问题有了具体的形式以后，就变成了最优化问题。有时，最优化问题比较简单，解析解存在，最优解可以由公式简单计算。但在多数情况下，最优化问题没有解析解，需要用数值计算的方法或启发式的方法求解。
    - 注意第 6 章与第 11 章的算法列表几乎一模一样——因为 CRF 就是序列上的最大熵模型（12.3.9 节），目标函数结构相同，所以能用同一批优化器。
    - "“启发式”体现在：逐步优化不保证得到整体最优解，只是”逼近优化目标函数”。但配合指数损失，每一步的子问题有解析解（第 8 章式 8.19、8.20），效率很高。"
    - 支持向量机学习、逻辑斯谛回归与最大熵模型学习、条件随机场学习是凸优化问题，全局最优解保证存在。 而其他学习问题则不是凸优化问题。
  - title: 12.6 【补充】深入理解
    source_heading: 12.6 【补充】深入理解
    paragraphs:
    - 实践中要给 SVM 配概率输出，只能事后再套一层（如 Platt scaling，即用逻辑斯谛回归拟合 SVM 的分数），本质上是补上丢失的信息。
    - 错。原书表 12.1 的脚注①明确说明：EM 算法是一般方法，不具有具体模型。它是”含隐变量概率模型的通用学习算法”，可以套在朴素贝叶斯、HMM、高斯混合模型上。
    - 不一定。小样本时生成模型的强假设起到正则化作用，常常更好；且只有生成模型能用无标注数据（EM）、能生成新样本、能自然处理缺失特征。
    - 表 12.1 该栏的表述方向与第 11 章正文相反，理解时应以第 11 章为准（详见本笔记”表 12.1”一节的辨析）。
  - title: 12.7 本章方法论总结
    source_heading: 12.7 本章方法论总结
    paragraphs:
    - 概率模型：朴素贝叶斯、HMM；非概率模型：感知机、k 近邻、SVM、提升方法；兼有两种解释：决策树、逻辑斯谛/最大熵、CRF。
    - 线性模型：感知机；对数线性模型：逻辑斯谛/最大熵、CRF；非线性模型：k 近邻、决策树、SVM（含核）、提升方法。
    - 三种代理损失都是 0-1 损失的上界（逻辑斯谛损失需取以 2 为底的对数），因而代理经验风险是训练错误率的上界。
    - 学习算法分三类：解析解（朴素贝叶斯、HMM 监督学习）、数值最优化（感知机、LR、CRF、SVM）、启发式（决策树、提升方法、EM）。
  takeaways:
  - 补充代理损失的理论保证（总体极小元、分类校准性），这是理解”为什么 SVM 不给概率、为什么 AdaBoost 怕噪声”的关键
  - 感知机、k 近邻法、朴素贝叶斯法、决策树是简单的分类方法，具有模型直观、方法简单、实现容易等特点。逻辑斯谛回归与最大熵模型、支持向量机、提升方法是更复杂但更有效的分类方法，往往分类准确率更高。隐马尔可夫模型、条件随机场是主要的标注方法。通常条件随机场的标注准确率更高。
  - 这个对应是理解正则化的最深刻视角：正则化不是”随便加个惩罚项”，而是把我们对参数的先验信念写进目标函数。L_2 说”参数应该接近 0 且分布平滑”，L_1
    说”大部分参数应该恰好是 0”。
  - 支持向量机学习、逻辑斯谛回归与最大熵模型学习、条件随机场学习是凸优化问题，全局最优解保证存在。 而其他学习问题则不是凸优化问题。
  - 学习算法分三类：解析解（朴素贝叶斯、HMM 监督学习）、数值最优化（感知机、LR、CRF、SVM）、启发式（决策树、提升方法、EM）。
