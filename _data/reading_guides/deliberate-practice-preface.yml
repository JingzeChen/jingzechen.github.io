  question: 一、推荐序要解决什么问题？
  question_source: 一、推荐序要解决什么问题
  thesis: 推荐序的另一个例子是讨价还价：只阅读谈判话术，很难学会判断客户的真实顾虑、让步时机与关系风险；在实际或高保真销售情境中练习，才能接触这些决定策略是否适用的线索。出于成本和伦理考虑，初学者不必直接承担高风险客户，可以先用角色扮演、录音复盘和导师旁听保留关键约束，再逐步进入真实场景。
  thesis_source: 四、隐性知识
  concepts:
  - term: 一、推荐序要解决什么问题
    meaning: 一项观察性研究即使发现高手练得更多，也只直接支持描述层的相关关系。要得出“多练导致高水平”的因果结论，还要排除起点能力、家庭资源、教练质量、选择退出、动机强弱等替代解释；要进一步承诺“人人练满固定时数都会成为专家”，证据要求则更高。
    source_heading: 一、推荐序要解决什么问题
  - term: 三、刻意练习的本质
    meaning: "“下棋次数毫无作用”是一种强调性的说法，不能按字面推广。实战能训练时间管理、情绪控制和综合决策；问题在于，只打完整比赛而不复盘，通常不是修补特定弱点的最高效方式。专项训练与真实表现任务应互相配合。"
    source_heading: 三、刻意练习的本质
  - term: 四、隐性知识
    meaning: 推荐序的另一个例子是讨价还价：只阅读谈判话术，很难学会判断客户的真实顾虑、让步时机与关系风险；在实际或高保真销售情境中练习，才能接触这些决定策略是否适用的线索。出于成本和伦理考虑，初学者不必直接承担高风险客户，可以先用角色扮演、录音复盘和导师旁听保留关键约束，再逐步进入真实场景。
    source_heading: 四、隐性知识
  - term: 六、把推荐序转化为可执行的学习方法
    meaning: 定期根据表现曲线判断：当前任务是否已过易、反馈是否失真、瓶颈是否转移、是否需要新的导师或情境。记录时数可用于管理精力，但不把它当成能力证明。
    source_heading: 六、把推荐序转化为可执行的学习方法
  - term: 八、如何评价推荐序的分析方法
    meaning: 象棋、钢琴和篮球都极其困难。这里真正的差异更接近：目标和评分是否稳定、反馈是否及时、训练传统是否成熟，而不是这些活动需要较少思考。用“结构较明确”和“结构不良、开放”来区分通常更准确。
    source_heading: 八、如何评价推荐序的分析方法
  - term: 十、复习问题
    meaning: 如果不再用累计小时证明进步，你会为当前正在学习的技能选择什么表现指标？
    source_heading: 十、复习问题
