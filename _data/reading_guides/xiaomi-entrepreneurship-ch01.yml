overview:
  kind: summary
  minutes: 10
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 使命：让更多人以合理价格获得高品质科技产品。 +> 机会：智能手机兴起，安卓开源降低进入门槛。 +> 团队：软件、硬件、互联网加设计的复合能力。
    +> 切入口：基于安卓，先做好电话、短信、通讯录和桌面。 +> 冷启动：找到 100 位愿意共创的发烧友，而非先追求大众流量。 +> 开发方式：社区反馈、每周更新、分层版本。
    +> 产品原则：旗舰目标不妥协，成本变化时诚实调整价格。 +> 渠道：官网直销，让产品和用户之间的链路更短。 +> 增长方式：少量机型形成爆品，以产品力和口碑获得规模。
    +> 生态方向：从个人移动计算中心扩展到智能生活、云和 IoT。
  thesis_source: 十、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 贯穿全章的是一个朴素思路：目标可以很大，但第一步必须足够具体；资源有限时，要集中力量在最关键的地方做到极致。
    source_heading: 一、本章主线
  - term: 三、从操作系统做起
    meaning: 选择它们的原因很直接：使用频率高、用户感受明显、当时安卓体验还有很大改善空间。小团队只要把这四项做得足够好，就能让用户感受到产品差异。
    source_heading: 三、从操作系统做起
  - term: 五、互联网开发模式
    meaning: 循环越短，错误越早暴露，正确方向越快被加强。快速迭代的基础是反馈质量、工程能力、测试体系和清楚的优先级，而不是单纯提高发布频率。
    source_heading: 五、互联网开发模式
  - term: 六、小米国际化的第一颗种子
    meaning: 四个原则必须组合使用。只有快而没有专注，会造成混乱；只有极致而远离用户，容易自我感动；只有口碑诉求而产品不够好，传播只会加速失败。
    source_heading: 六、小米国际化的第一颗种子
  - term: 八、赢得梦幻开局
    meaning: 行业观察者预计第一代手机全生命周期只能卖 5 万到 10 万台。这样的怀疑在当时并不荒唐，因为传统经验看不到小米已有的 30 万 MIUI
      种子用户和社区信任。
    source_heading: 八、赢得梦幻开局
  - term: 十、本章方法论总结
    meaning: 使命：让更多人以合理价格获得高品质科技产品。 +> 机会：智能手机兴起，安卓开源降低进入门槛。 +> 团队：软件、硬件、互联网加设计的复合能力。
      +> 切入口：基于安卓，先做好电话、短信、通讯录和桌面。 +> 冷启动：找到 100 位愿意共创的发烧友，而非先追求大众流量。 +> 开发方式：社区反馈、每周更新、分层版本。
      +> 产品原则：旗舰目标不妥协，成本变化时诚实调整价格。 +> 渠道：官网直销，让产品和用户之间的链路更短。 +> 增长方式：少量机型形成爆品，以产品力和口碑获得规模。
      +> 生态方向：从个人移动计算中心扩展到智能生活、云和 IoT。
    source_heading: 十、本章方法论总结
