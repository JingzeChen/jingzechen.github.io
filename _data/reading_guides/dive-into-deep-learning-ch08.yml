overview:
  kind: summary
  minutes: 8
  question: 1. 为什么要研究一代代 CNN 架构？
  question_source: 1. 为什么要研究一代代 CNN 架构
  thesis: AnyNet/RegNet 不只搜索一个冠军，而通过网络误差分布逐步收紧设计空间，获得可解释且可扩展的网络家族原则。
  thesis_source: 15. 核心结论与解决问题的一般思路
  concepts:
  - term: 1. 为什么要研究一代代 CNN 架构
    meaning: 本章架构大多曾赢得或推动 ImageNet 大规模视觉识别竞赛，并成为检测、分割、跟踪和风格迁移等任务的特征骨干。它们的价值不只在视觉：BatchNorm、残差连接和模块化设计也影响了序列模型、图网络与
      Transformer。
    source_heading: 1. 为什么要研究一代代 CNN 架构
  - term: 4.1 NiN 解决的两个瓶颈
    meaning: 在卷积骨干早期加入全连接层会展平并破坏空间结构。
    source_heading: 4.1 NiN 解决的两个瓶颈
  - term: 6. 批量规范化 Batch Normalization
    meaning: BN 原论文以减少 internal covariate shift 解释效果，但该术语与训练/部署分布的 covariate shift
      不同，定义也不充分。后续研究提出优化平滑、尺度重参数化和噪声正则等解释。
    source_heading: 6. 批量规范化 Batch Normalization
  - term: 8.4 DenseNet 的优点
    meaning: 拼接保留不同层信息而非立即相加。
    source_heading: 8.4 DenseNet 的优点
  - term: 10. 架构思想的横向比较
    meaning: 同时报告准确率、参数、FLOPs、内存和真实延迟。
    source_heading: 10. 架构思想的横向比较
  - term: 15. 核心结论与解决问题的一般思路
    meaning: 本章展示的不是一条简单的“网络越新越好”时间线，而是一套持续解决瓶颈的方法：AlexNet把表示交给数据和 GPU，VGG把层组织成块，NiN
      和 GoogLeNet用通道变换、多尺度分支和全局池化提高参数效率，BatchNorm与ResNet重塑深层优化，ResNeXt和DenseNet探索稀疏聚合与特征复用，RegNet则把架构发明提升为可统计比较的设计空间。理解这些控制变量，比背诵任何一张网络结构图更能指导下一次模型设计。
    source_heading: 15. 核心结论与解决问题的一般思路
  logic:
  - 1. 为什么要研究一代代 CNN 架构
  - 4.1 NiN 解决的两个瓶颈
  - 5. 多分支网络 GoogLeNet
  - 8.4 DenseNet 的优点
  - 8.5 DenseNet 的内存代价
  - 11. 可运行的综合实验
  - 15. 核心结论与解决问题的一般思路
  sections:
  - title: 1. 为什么要研究一代代 CNN 架构
    source_heading: 1. 为什么要研究一代代 CNN 架构
    paragraphs:
    - 本章架构大多曾赢得或推动 ImageNet 大规模视觉识别竞赛，并成为检测、分割、跟踪和风格迁移等任务的特征骨干。它们的价值不只在视觉：BatchNorm、残差连接和模块化设计也影响了序列模型、图网络与
      Transformer。
    - 这些网络并非单变量改进。AlexNet 的成功同时来自数据、GPU、ReLU、dropout 和增强；ResNet 的可训练性也依赖初始化、归一化与优化配方。架构名称不能脱离训练条件比较。
  - title: 3. 使用块的网络 VGG
    source_heading: 3. 使用块的网络 VGG
    paragraphs:
    - AlexNet 证明深 CNN 有效，却没有回答下一座网络该怎样系统设计。VGG 借鉴工程中的模块化：把一组重复模式封装成块，再用配置表组合网络家族。
    - 这个比较假设通道宽度相同且忽略边界。真实速度还取决于内核实现、内存访问和设备；参数更少不必然端到端更快。
    - 但更深不自动更好。无残差网络变得很深后优化困难，激活内存和计算也增长。VGG 的大全连接头仍占据巨量参数，因此它是现代模块化的重要一步，不是效率终点。
    - VGG 首次把网络更多地描述为“块的序列”而非孤立层清单。现代框架中循环即可生成家族；早期系统甚至需要繁琐配置文件。
  - title: 4.1 NiN 解决的两个瓶颈
    source_heading: 4.1 NiN 解决的两个瓶颈
    paragraphs:
    - 在卷积骨干早期加入全连接层会展平并破坏空间结构。
    - 用全局平均池化聚合空间，移除大规模全连接层。
  - title: 5. 多分支网络 GoogLeNet
    source_heading: 5. 多分支网络 GoogLeNet
    paragraphs:
    - 这一模式延续到 ResNet、RegNet 和许多 Transformer。更换分类头即可把同一 body 用于检测、分割或迁移学习。
    - 不同核捕获不同尺度，网络无需先决定“唯一最佳核”。代价是分支宽度、降维通道和块数量带来大量超参数。
    - 原始 GoogLeNet 还带中间辅助分类器，以缓解深层训练并提供正则化；原书简化版因现代训练技术更成熟而省略。
    - GoogLeNet 比 AlexNet 更准确且计算更便宜，说明网络设计开始显式权衡误差与成本。但每个 Inception 块的四分支通道数仍由大量试验手工设定。
  - title: 6. 批量规范化 Batch Normalization
    source_heading: 6. 批量规范化 Batch Normalization
    paragraphs:
    - 输入标准化让特征处于相近尺度，通常改善优化。深层网络训练中，中间激活尺度会随层、单元和参数更新变化。如果某层信号比另一层大百倍，一个统一学习率很难同时适合所有参数。
    - BatchNorm（BN）在训练时用当前小批量统计量标准化中间变量，再用可学习缩放和平移恢复表达自由度。实践中它常允许更大学习率、加速收敛，并通过批统计噪声产生一定正则化。
    - "（在同一批统计且忽略数值细节时）。这可减少冗余参数。若 BN 被移除、冻结方式特殊或顺序不同，结论需重新判断。"
    - BN 原论文以减少 internal covariate shift 解释效果，但该术语与训练/部署分布的 covariate shift 不同，定义也不充分。后续研究提出优化平滑、尺度重参数化和噪声正则等解释。
  - title: 8.4 DenseNet 的优点
    source_heading: 8.4 DenseNet 的优点
    paragraphs:
    - 特征复用：后层直接访问早期细粒度特征；
    - 短梯度路径：每层与损失有较直接连接；
    - 每层只需产生较少新通道，参数可能低于同精度 ResNet；
    - 拼接保留不同层信息而非立即相加。
  - title: 8.5 DenseNet 的内存代价
    source_heading: 8.5 DenseNet 的内存代价
    paragraphs:
    - 拼接表示随深度增长，训练必须保存许多中间激活。朴素实现还可能重复物化连接张量，导致高显存和内存带宽压力。DenseNet 参数少不等于训练内存少。
    - 梯度检查点，反向时重算 BN/ReLU；
    - 更强 transition 压缩；
  - title: 10. 架构思想的横向比较
    source_heading: 10. 架构思想的横向比较
    paragraphs:
    - 从逐层手工参数走向重复模块和网络家族；
    - 从搜索单点转向研究可解释设计空间；
    - 同时报告准确率、参数、FLOPs、内存和真实延迟。
  - title: 11. 可运行的综合实验
    source_heading: 11. 可运行的综合实验
    paragraphs:
    - 下面的 PyTorch 代码不下载数据，也不完整训练大网络，而是验证本章最核心、可迁移的架构机制：VGG 块形状、NiN 全局平均头、Inception
      通道拼接、BatchNorm 训练/预测差异、残差恒等梯度、ResNeXt 分组参数节省、DenseNet 通道增长，以及一个小型 stem-body-head
      网络的尺寸流。
    - 残差分支为零时模块精确传递输入和单位梯度，投影捷径完成通道与分辨率对齐；
    - 四组卷积的空间核参数恰为稠密卷积四分之一；
  - title: 15. 核心结论与解决问题的一般思路
    source_heading: 15. 核心结论与解决问题的一般思路
    paragraphs:
    - DenseNet 用通道拼接保留并复用所有早期特征，growth rate 控制新增宽度，transition layer 控制通道与分辨率。
    - 参数量、计算量和激活内存是不同资源；DenseNet 可省参数却耗激活内存，VGG/AlexNet 的全连接头则主要耗参数。
    - AnyNet/RegNet 不只搜索一个冠军，而通过网络误差分布逐步收紧设计空间，获得可解释且可扩展的网络家族原则。
    - 本章展示的不是一条简单的“网络越新越好”时间线，而是一套持续解决瓶颈的方法：AlexNet把表示交给数据和 GPU，VGG把层组织成块，NiN 和 GoogLeNet用通道变换、多尺度分支和全局池化提高参数效率，BatchNorm与ResNet重塑深层优化，ResNeXt和DenseNet探索稀疏聚合与特征复用，RegNet则把架构发明提升为可统计比较的设计空间。理解这些控制变量，比背诵任何一张网络结构图更能指导下一次模型设计。
  takeaways:
  - AlexNet 的突破来自端到端表示学习、大规模数据、GPU 和一整套训练技术的共同成熟，不只是增加层数。
  - 参数量、计算量和激活内存是不同资源；DenseNet 可省参数却耗激活内存，VGG/AlexNet 的全连接头则主要耗参数。
  - 逐 stage 写形状：空间何时减半，通道何时增加，分支拼接或相加是否兼容？
  - 分离架构与训练配方：增强、正则、优化器和学习率是否才是性能差异来源？
  - 本章展示的不是一条简单的“网络越新越好”时间线，而是一套持续解决瓶颈的方法：AlexNet把表示交给数据和 GPU，VGG把层组织成块，NiN 和 GoogLeNet用通道变换、多尺度分支和全局池化提高参数效率，BatchNorm与ResNet重塑深层优化，ResNeXt和DenseNet探索稀疏聚合与特征复用，RegNet则把架构发明提升为可统计比较的设计空间。理解这些控制变量，比背诵任何一张网络结构图更能指导下一次模型设计。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「12.1 AlexNet 成功只因为“更深”」？
  answer: 错误。数据规模、GPU 卷积、ReLU、dropout、增强和初始化共同作用；孤立复制八层结构不保证复现突破。
  source_heading: 12.1 AlexNet 成功只因为“更深”
- level: 概念辨析
  question: 原文如何解释「12.8 Inception 多分支等于模型集成」？
  answer: 分支在同一网络中联合训练并拼接中间特征，不是独立训练多个完整模型后平均预测。
  source_heading: 12.8 Inception 多分支等于模型集成
- level: 概念辨析
  question: 原文如何解释「12.14 残差连接保证梯度永不消失」？
  answer: 恒等路径改善梯度传播，但激活、投影、损失、数值和优化仍可造成问题。它是结构性缓解，不是数学上的无条件保证。
  source_heading: 12.14 残差连接保证梯度永不消失
- level: 概念辨析
  question: 原文如何解释「12.20 ResNet 相加与 DenseNet 拼接只是写法区别」？
  answer: 相加保持通道数并融合特征，拼接保留各层特征并增长通道；它们改变信息流、参数形状和内存复杂度。
  source_heading: 12.20 ResNet 相加与 DenseNet 拼接只是写法区别
- level: 概念辨析
  question: 原文如何解释「12.24 CNN 已被 Transformer 完全淘汰」？
  answer: Transformer 在大规模预训练上领先许多基准，但 CNN 在数据效率、延迟、边缘设备和特定任务中仍重要。选择取决于规模、硬件和部署约束。
  source_heading: 12.24 CNN 已被 Transformer 完全淘汰
