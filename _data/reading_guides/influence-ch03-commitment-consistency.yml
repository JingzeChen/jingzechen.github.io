overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 导读：第三章解决的核心问题」建立了怎样的核心认识？
  question_source: 0. 导读：第三章解决的核心问题
  thesis: 成熟的一致性不是永不改口，而是始终忠于更高层的原则：根据真实信息行动、兑现仍然合理的责任，并在关键条件变化时坦然重置决定。这样，承诺会成为执行正确选择的力量，而不是困住自己的脑中怪物。
  thesis_source: 45. 本章总结：知识结构、核心结论与一般方法
  concepts:
  - term: 0. 导读：第三章解决的核心问题
    meaning: 原书报告了多组实验比例和具体数值，但没有提供可计算的统一“承诺公式”或防御算法。下文出现的公式、模型和操作流程均是笔记的解释性整理；原书数据会明确标注，补充分析不会冒充原书实验结论。
    source_heading: 0. 导读：第三章解决的核心问题
  - term: 8. 自动一致性的第二项诱惑：逃避不愿面对的答案
    meaning: 提问时，这位教授用很短时间指出理论矛盾、逻辑缺陷和证据不足。讲师无法有效回应，最后承认问题值得研究。按常识，听众此时应更谨慎；结果却相反，一群人争相支付
      75 美元报名，连讲师自己都感到意外。
    source_heading: 8. 自动一致性的第二项诱惑：逃避不愿面对的答案
  - term: 19. “众目睽睽”：公开承诺为什么更顽固
    meaning: 圣迭戈一名女性多次戒烟失败后，列出自己特别希望得到尊重的人，为每个人写并签名一张“我保证不再抽烟”的卡片，寄给父亲、哥哥、老板、朋友、前夫和正在约会的人。
    source_heading: 19. “众目睽睽”：公开承诺为什么更顽固
  - term: 25. 阿伦森—米尔斯实验：费尽周折会让平庸团体显得更好
    meaning: 严苛入会可能让新成员更珍视团体，从而提高凝聚力和存续。原书还提到，对 54 种部落文化的研究发现，内部最团结的部落往往具有最严格、戏剧化的成年仪式。
    source_heading: 25. 阿伦森—米尔斯实验：费尽周折会让平庸团体显得更好
  - term: 36. 第一种信号：肠胃警报与娱乐套餐陷阱
    meaning: 身体紧张可能来自社交焦虑、陌生情境或其他原因，不能单独证明对方操纵。它应当是“暂停并检查”的信号，而不是有罪判决。
    source_heading: 36. 第一种信号：肠胃警报与娱乐套餐陷阱
  - term: 45. 本章总结：知识结构、核心结论与一般方法
    meaning: 成熟的一致性不是永不改口，而是始终忠于更高层的原则：根据真实信息行动、兑现仍然合理的责任，并在关键条件变化时坦然重置决定。这样，承诺会成为执行正确选择的力量，而不是困住自己的脑中怪物。
    source_heading: 45. 本章总结：知识结构、核心结论与一般方法
