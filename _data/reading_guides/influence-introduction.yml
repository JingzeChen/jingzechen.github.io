overview:
  kind: summary
  minutes: 11
  question: 0. 导读：这篇引言完成了什么？
  question_source: 0. 导读：这篇引言完成了什么
  thesis: 上千种表面策略可以按底层心理功能压缩为六类：互惠、承诺和一致、社会认同、喜好、权威、稀缺。 六类是本书选取的核心框架，不是人类影响因素的穷尽清单。
  thesis_source: 15. 实践方法、知识结构与核心结论
  concepts:
  - term: 0. 导读：这篇引言完成了什么
    meaning: 人并不是逐项比较所有信息后才答应请求；职业顺从者常把具有社会功能的心理原则嵌入请求情境，使人依据少量关键线索迅速说“是”。要理解这种力量，既要知道原则在受控条件下能否起作用，也要知道它在真实世界中怎样被反复使用。
    source_heading: 0. 导读：这篇引言完成了什么
  - term: 3. 为什么实验必要却不够：从内部效度走向外部效度
    meaning: 作者先指出，普通人在与邻居、朋友、爱人和家人的日常交往中，也会使用这些原则，或成为它们的作用对象；但普通人的认识往往模糊而零散，以促成顺从为业的专家则掌握得更多。这个对比直接解释了研究对象的选择：若要知道哪些原则最管用，职业顺从者是更丰富、密度更高的信息源。
    source_heading: 3. 为什么实验必要却不够：从内部效度走向外部效度
  - term: 6. 从上千种策略归纳出六类基本原则
    meaning: 原则之所以有力量，不只是因为人“容易犯错”，更因为这些规则在多数普通情境中有用。例如，参考群体行为能减少不确定性，听取可信专家能节省重复验证成本。职业顺从者借用的是人类社会协调所需要的规则。
    source_heading: 6. 从上千种策略归纳出六类基本原则
  - term: 8. 共同考察角度：自动、无意识的顺从
    meaning: 顺从专家通常不需要创造新的欲望，只需让请求与一条现成规则相连：先给予再请求，让行为看起来是回报；展示支持人数，让行为看起来是跟随可靠群体信息；强调即将售罄，让不行动看起来会造成损失。
    source_heading: 8. 共同考察角度：自动、无意识的顺从
  - term: 11. “读者报告”：从研究框架回到日常生活
    meaning: 个案通常没有对照条件，也容易受记忆、选择性报告和事后解释影响。读者学过六原则后，可能倾向于用框架重新解释任何一次购买。因此，一封来信不能单独证明某原则导致了行为，也不能说明该原则在人群中的平均效果。
    source_heading: 11. “读者报告”：从研究框架回到日常生活
  - term: 15. 实践方法、知识结构与核心结论
    meaning: 从具体反常现象提出可比较的问题；先用受控研究识别候选机制，再主动寻找外推边界；进入拥有密集实践知识的真实环境，从多种立场收集证据；穿透表面做法，按底层功能归纳；最后用新技术、新文化和新案例持续检验适用范围。
    source_heading: 15. 实践方法、知识结构与核心结论
  logic:
  - 0. 导读：这篇引言完成了什么
  - 3. 为什么实验必要却不够：从内部效度走向外部效度
