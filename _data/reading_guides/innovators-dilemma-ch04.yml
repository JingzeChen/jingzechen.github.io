overview:
  kind: summary
  minutes: 10
  question: 原文围绕「一、本章要解决的问题」建立了怎样的核心认识？
  question_source: 一、本章要解决的问题
  thesis: 本章最重要的结论不是“不要进入高端”，而是：不能期待服务高端价值网的同一套资源分配体系，自发培育一个会降低利润、市场很小且客户未知的低端业务。要同时保护当前业务和建立未来业务，必须给破坏性项目匹配不同的客户环境、规模、成本结构、流程和成功标准。后续章节将围绕五项原则展开这些管理方法。
  thesis_source: 十五、本章总结
  concepts:
  - term: 一、本章要解决的问题
    meaning: 作者把这种非对称性称为“左上牵引力”：在性能与市场层级的示意图上，企业不断提高性能、进入利润更高的市场，仿佛被左上角的磁石吸引。这里的“左上”是战略隐喻，不是严格坐标定理；关键含义是向更高性能、更大客户和更高毛利率移动。
    source_heading: 一、本章要解决的问题
  - term: 四、资源分配和向上迁移
    meaning: 高端项目：开发容量更大、速度更快的硬盘。工作站市场每年采购超过 6 亿美元，潜在客户急于拿样机，竞争对手遇到技术困难，预计使用现有工厂可实现约
      35% 毛利率。
    source_heading: 四、资源分配和向上迁移
  - term: 七、综合性钢铁企业的“左上角”移动
    meaning: 到 1980 年，小型厂占螺纹钢市场约 90%，占钢条、棒材和角钢约 30%。后者当时恰是综合厂产品线中利润最低的部分，综合厂再次退出。到
      80 年代中期，该市场几乎全归小型厂。
    source_heading: 七、综合性钢铁企业的“左上角”移动
  - term: 九、前三个行业的共同解释
    meaning: 证据不支持把失败一般性归因于技术范式僵化、“非我发明”综合征、能力不足或科技泥流。只要主流客户需要，成熟企业能够集中资本、供应商、人才和技术完成渐进或突破项目。
    source_heading: 九、前三个行业的共同解释
  - term: 13.1 有效之处
    meaning: 实时反例。1.8 英寸案例显示，即使企业知道理论并拥有样机，组织仍可能不行动。
    source_heading: 13.1 有效之处
  - term: 十五、本章总结
    meaning: 本章最重要的结论不是“不要进入高端”，而是：不能期待服务高端价值网的同一套资源分配体系，自发培育一个会降低利润、市场很小且客户未知的低端业务。要同时保护当前业务和建立未来业务，必须给破坏性项目匹配不同的客户环境、规模、成本结构、流程和成功标准。后续章节将围绕五项原则展开这些管理方法。
    source_heading: 十五、本章总结
