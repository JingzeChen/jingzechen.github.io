  minutes: 10
  question: 原文围绕「0. 学习目标与因果主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与因果主线
  thesis: 上下文窗口在 2019–2024 年间从约 1K 扩到公开可用的 2M token，增长约 2000 倍。100K token 可容纳中等书籍；本书约
    12 万词、16 万 token；2M token 约可容纳数千个普通 Wikipedia 页面或复杂代码库。
  thesis_source: 4. Context Length 与 Context Efficiency
  concepts:
  - term: 0. 学习目标与因果主线
    meaning: 提示工程（prompt engineering）是通过设计输入指令，让基础模型产生期望结果的过程。它不修改模型权重，是成本最低、上手最快的模型适配方式；许多应用仅靠提示就能达到可用水平，因此在微调前应先充分探索提示空间。
    source_heading: 0. 学习目标与因果主线
  - term: 4. Context Length 与 Context Efficiency
    meaning: 上下文窗口在 2019–2024 年间从约 1K 扩到公开可用的 2M token，增长约 2000 倍。100K token 可容纳中等书籍；本书约
      12 万词、16 万 token；2M token 约可容纳数千个普通 Wikipedia 页面或复杂代码库。
    source_heading: 4. Context Length 与 Context Efficiency
  - term: 9. Evaluate Prompt Engineering Tools（评价提示工程工具）
    meaning: 10 个提示、30 个样本、每样本只生成一次，已经是 300 次调用；若还要一次 JSON 验证和一次 AI 评分，就是 900 次。允许工具自由构造长链后，每个候选内部还包含多个调用。
    source_heading: 9. Evaluate Prompt Engineering Tools（评价提示工程工具）
  - term: 11. Defensive Prompt Engineering（防御性提示工程）
    meaning: 传统程序把代码和数据分开；语言模型通常把 system message、user message、历史、检索文档和工具输出序列化为一串 token。模型要从语义中推断哪些是指令、哪些只是被讨论的数据。
    source_heading: 11. Defensive Prompt Engineering（防御性提示工程）
  - term: 16. Model-Level Defense（模型层防御）
    meaning: 安全训练不能只教“识别恶意后拒绝”。请求“怎样进入锁住的房间”可能来自盗窃者，也可能来自被锁在自己家外的用户。过度谨慎系统会全部拒绝，更好的回答是建议合法、安全的解决方案，例如联系物业或专业锁匠，而不是提供可滥用步骤。
    source_heading: 16. Model-Level Defense（模型层防御）
  - term: 21. 一页速记
    meaning: 最终应记住：提示可以影响模型行为，但不能承担真正的权限边界；评价可以证明提示是否有效，系统设计才能限制失败的后果。
    source_heading: 21. 一页速记
