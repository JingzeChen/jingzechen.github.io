  sections:
  - title: 0. 学习目标、阅读边界与全章总览
    source_heading: 0. 学习目标、阅读边界与全章总览
    paragraphs:
    - Polling、long polling 和 WebSocket 分别如何工作，为什么最终选 WebSocket？
    - Chat Server 为什么是有状态服务，API Server 为什么可无状态扩展？
    - Presence fanout 为什么对好友列表可行，却不能直接扩展到 10 万人大群？
    - 本文严格沿原书顺序展开。补充的连接/存储估算、消息状态机、幂等、outbox、ack/read receipt、session cursor、租约/fencing、背压与可运行示例属于标准工程背景，不是作者逐式给出的原文。
  - title: 6. Long Polling
    source_heading: 6. Long Polling
    paragraphs:
    - Round-robin 无状态 HTTP 路由下，收到消息的服务器未必持有收件人的 long-poll connection，需要额外 connection
      registry/消息路由。
    - Long polling 可通过异步服务器和路由系统大规模部署，在单向低频通知中很合适（如第 15 章文件变化通知）。本题是持续双向聊天，WebSocket
      更自然。
  - title: 10.2 聊天历史的访问模式
    source_heading: 10.2 聊天历史的访问模式
    paragraphs:
    - 仍需随机访问：搜索、mentions、跳转特定消息；
    - 这是一条按会话分区、按消息顺序范围读取的 append-heavy 工作负载。
  - title: 14. Step 3：Service Discovery
    source_heading: 14. Step 3：Service Discovery
    paragraphs:
    - 原书以 ZooKeeper 举例：注册健康 Chat Servers 并按规则选最优节点。
    - 认证成功后 Service Discovery 返回最佳 Chat Server（例 server 2）；
    - User A 与 server 2 建立 WebSocket。
    - 返回短时签名 token，包含 user/device/session/expiry/audience，Chat Server 验证，避免攻击者绕过 API
      直接伪造身份。
  - title: 17.1 为什么适合小群
    source_heading: 17.1 为什么适合小群
    paragraphs:
    - 1 对 1 和群聊统一同步路径；
    - 100 人以内 fanout 成本可控。
  - title: 20. Online Presence：显式登出
    source_heading: 20. Online Presence：显式登出
    paragraphs:
    - 多设备下应只删除该 session/device；最后一个活跃 session 退出时用户级状态才 offline。
    - 显式登出比网络断开更确定，可立即发布状态变化并吊销 session token。
  - title: 26. Step 4：客户端缓存与地域加速
    source_heading: 26. Step 4：客户端缓存与地域加速
    paragraphs:
    - 本地全文搜索（E2EE 尤其重要）。
    - Service Discovery 按 RTT/地域；
    - 缓存用户和 channel metadata；
    - 消息 home region 持久化并跨地域复制；
  - title: 28.2 消息层
    source_heading: 28.2 消息层
    paragraphs:
    - accepted/persisted/delivered/read latency；
    - duplicate/idempotency hit；
    - offline Push rate；
    - KV read/write P99；
  - title: 30.3 服务层
    source_heading: 30.3 服务层
    paragraphs:
    - Service Discovery；
    - Connection Registry；
    - Message Queue/KV Store。
  - title: 31. 核心结论与一般设计方法
    source_heading: 31. 核心结论与一般设计方法
    paragraphs:
    - 发送侧 HTTP 可用，但接收需要服务器主动推送；Polling 空请求多、long polling 仍有重连和连接路由问题，因此实时消息统一用双向 WebSocket，登录/资料仍用
      HTTP。
    - Presence 用每设备 TTL/heartbeat，用户级 online 是任一 session 在线，断连 30 秒 grace 后才 offline；好友状态
      Pub/Sub，大群进入时批量查询。
    - 监控连接数、heartbeat、persist/deliver latency、queue lag、重复、sequence gap、cursor lag
      和 Presence 抖动。
    - 如果这些问题都能回答，就不只是知道“聊天要用 WebSocket”，而是理解了本章的核心方法：把易失的实时连接与持久的消息事实分开，把全局问题缩小为会话内顺序和设备内游标，再根据收件人规模选择写时
      inbox 或读时 channel log，并用服务发现、心跳、幂等和补拉把网络断连从数据丢失问题降级为可恢复的短暂实时性问题。
  takeaways:
  - 1 对 1 + 100 人小群；
  - 先确认聊天类型与规模。 1 对 1、小群和超大频道的 fanout、顺序和存储完全不同。
  - 本系统支持 Web/Mobile、50M DAU、低延迟 1 对 1、最多 100 人小群、多设备、Presence、Push 和永久文本历史。
  - 能否写出 1 对 1 和群聊的分区/排序键？
  - 如果这些问题都能回答，就不只是知道“聊天要用 WebSocket”，而是理解了本章的核心方法：把易失的实时连接与持久的消息事实分开，把全局问题缩小为会话内顺序和设备内游标，再根据收件人规模选择写时
    inbox 或读时 channel log，并用服务发现、心跳、幂等和补拉把网络断连从数据丢失问题降级为可恢复的短暂实时性问题。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「29.1 WebSocket 与 TCP」？
  answer: WebSocket 是构建在 TCP 上的应用层双向消息协议，提供 frame 和握手；不等于裸 TCP。
  source_heading: 29.1 WebSocket 与 TCP
- level: 概念辨析
  question: 原文如何解释「29.7 WebSocket 适合所有 API」？
  answer: 登录、资料等 request/response 用 HTTP 更简单、可缓存、易观测。实时双向部分才用 WebSocket。
  source_heading: 29.7 WebSocket 适合所有 API
- level: 概念辨析
  question: 原文如何解释「29.11 全局 Message ID 与会话顺序」？
  answer: 全局 ID 便于追踪，但业务只需会话内顺序。Snowflake 大致有序不一定替代严格 conversation sequence。
  source_heading: 29.11 全局 Message ID 与会话顺序
- level: 概念辨析
  question: 原文如何解释「29.17 断开一次就离线」？
  answer: 网络抖动会频繁闪烁。Heartbeat + grace period 降低误判。
  source_heading: 29.17 断开一次就离线
- level: 概念辨析
  question: 原文如何解释「29.22 E2EE 与 TLS」？
  answer: TLS 保护传输到服务器；E2EE 使服务器也不能解密内容。安全边界不同。
  source_heading: 29.22 E2EE 与 TLS
