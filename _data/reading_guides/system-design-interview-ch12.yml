  minutes: 8
  question: 原文围绕「0. 学习目标、阅读边界与全章总览」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与全章总览
  thesis: 如果这些问题都能回答，就不只是知道“聊天要用 WebSocket”，而是理解了本章的核心方法：把易失的实时连接与持久的消息事实分开，把全局问题缩小为会话内顺序和设备内游标，再根据收件人规模选择写时
    inbox 或读时 channel log，并用服务发现、心跳、幂等和补拉把网络断连从数据丢失问题降级为可恢复的短暂实时性问题。
  thesis_source: 31. 核心结论与一般设计方法
