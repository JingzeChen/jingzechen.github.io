  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - Microservices 是近年最流行的架构风格之一。多数架构风格先在实践中反复出现，后来才被命名；microservices 比较特殊，它在使用早期就获得了明确名称。Martin
      Fowler 和 James Lewis 在 2014 年的著名文章中归纳并普及了它的特征，也反过来塑造了架构定义。
    - 边界内部可以紧密协作；边界外部只能通过显式 contract 通信，不能直接共享类或数据结构。因为这种哲学，microservices 有时被称为 share
      nothing architecture。
    - Microservices 的“微”不是尺寸命令，而是把一个有内聚业务目的的 bounded context 做成独立部署、独立数据、独立演化的物理单元。
    - 原章没有提出统一数学公式或实现算法。本文中的边界评分、调用放大、Saga Python 状态机、依赖治理示例和迁移流程都是教学扩展，用于解释原章权衡，不是作者规定的行业标准。
  - title: 1. Topology：拓扑
    source_heading: 1. Topology：拓扑
    paragraphs:
    - 相较 orchestration-driven SOA、event-driven architecture 和 service-based architecture，microservices
      通常更细粒度，但“更细”必须来自自然业务边界，不是追求最小代码量。
    - 它之所以在现代可行，依赖免费 open source operating systems、automated machine provisioning、cloud
      resources 和 container technology。相同想法在昂贵按机器授权的时代会不切实际。
    - 因此 distributed nature 常使 performance 成为弱点。每个 endpoint 都要做 security checks，也增加
      processing time。
    - 重新绑定在一起，违背 decoupling 目标。服务 granularity 因而是 microservices 成败的关键：经常必须共同提交的行为，通常应该位于同一
      boundary。
  - title: 2. Style Specifics：风格细节
    source_heading: 2. Style Specifics：风格细节
    paragraphs:
    - 一个服务可用 relational DB，另一个用 document、key-value 或 time-series store。团队也可在不影响其他
      context 的前提下更换技术，因为其他服务不能耦合其 implementation details。
    - Microservices 偏好 duplication over domain coupling，但 monitoring、logging、circuit
      breakers 等 operational concerns 确实受益于一致复用。
    - Sidecar 可由 service team 或 shared infrastructure team 拥有。升级监控工具时，基础设施团队更新 sidecar，各
      microservices 获得一致能力，而不把业务代码合并进共享库。
    - 两个 services 可能需要截然不同的 architecture characteristics，必须保持独立边界，但少数业务操作仍需 transactional
      coordination。经过权衡后可采用 transactional patterns。
  - title: 4. Cloud Considerations：云环境考虑
    source_heading: 4. Cloud Considerations：云环境考虑
    paragraphs:
    - Microservices 可部署 on-prem，Kubernetes、Cloud Foundry 等 orchestration platforms
      也支持本地环境；但它非常适合 cloud，甚至常被称为 cloud-native architecture。
    - 原章认为 serverless 不是独立 architecture style，而是 microservices 的 deployment model。
    - 它与 microservice 定义高度相似，因此作者将其归入 microservices。这个分类是本书观点，不是行业唯一分类。
    - Cloud microservices 不必是 serverless functions，也可部署为 containerized services。云厂商普遍提供
      Kubernetes 或类似平台，两种部署模型可并存。
  - title: 5. Common Risks：常见风险
    source_heading: 5. Common Risks：常见风险
    paragraphs:
    - Mark Richards 在 2016 年把 services 过细称为 Grains of Sand：像沙滩上的细沙一样数量巨大、独立却无法完成有意义工作。
    - 风险在于过多 dynamic coupling：链路延迟、部分失败、重试风暴、量子纠缠和认知复杂度增加。它经常是服务太细的结果，解决方式是合并边界，而不是只换更快
      RPC。
    - Custom JAR/DLL 等共享库跨 contexts 传播代码，意味着功能不再完全包含在 bounded context 内。Shared code
      变化可能破坏其他 services。
    - Microservices 不是禁止所有 library reuse。标准语言库、稳定第三方库和 operational SDK 仍可用；风险在于共享易变
      domain behavior。
  - title: 6. Governance：治理
    source_heading: 6. Governance：治理
    paragraphs:
    - Asynchronous protocol 只能降低 dynamic coupling；若 producer/consumer 都依赖同一 brittle
      contract，仍然 statically coupled。
    - 原章指出可用 custom JAR/DLL 提供统一 logging API。这本身产生 static coupling，是有意用少量 operational
      coupling 换 observability consistency，正体现 trade-off。
    - 另一方法：某 service 第一个实例启动时，把 interservice calls 以 JSON 等 contract 注册到 configuration
      service/server，如 Apache ZooKeeper。
    - 该检查能暴露同步链深度，却不能判断调用是否必要，也不包含异步 event edges、频率、latency 和 failure rate。因此结果是评审信号，不是自动合并命令。
  - title: 7. Team Topology Considerations：团队拓扑考虑
    source_heading: 7. Team Topology Considerations：团队拓扑考虑
    paragraphs:
    - Microservices 是 domain-partitioned architecture，最适合按 domain area 对齐的 cross-functional
      teams。
    - Technically partitioned teams（UI、backend、database）会让一个 domain requirement 需要跨团队协作，抵消独立
      bounded context 的价值。
    - Microservices 高 modularity 允许 enabling teams 围绕 specialized/cross-cutting concerns
      提供 shared services，不妨碍 stream teams。
    - 可利用 service-level modularity 专注复杂 domain/subdomain processing，例如风险、医学信号分析或优化算法，并保持与其他
      services/team 独立。
  - title: 9. Examples and Use Cases：案例与适用场景
    source_heading: 9. Examples and Use Cases：案例与适用场景
    paragraphs:
    - 维护 Blood Pressure service 时，测试范围小，可较有把握证明没有影响其他 vital signs。
    - 新增一种 vital-sign monitor，不必修改现有 services，只需接入 shared display/alert contracts。
    - 此时 modular monolith 或 service-based architecture 往往更务实。先建立逻辑边界，再根据真实需求拆分，比从大量空
      repositories 开始更安全。
    - Mark Richards，Microservices vs. Service-Oriented Architecture；
  - title: 11. 一般化的问题解决方法
    source_heading: 11. 一般化的问题解决方法
    paragraphs:
    - 每个事实指定 authoritative owner；其他 contexts 通过 contract 或 event 获取，不直接读写内部 schema。
    - 列出 local steps、pending states、compensations、timeouts、idempotency 和人工修复。若数量过多，回到
      granularity。
    - Domain code 优先自治；monitoring/logging/security 等通过 sidecar、mesh、platform 一致提供。
    - Build/test/deploy、observability、discovery、security、SBOM、contract compatibility
      缺一不可。
  - title: 13. 核心结论
    source_heading: 13. 核心结论
    paragraphs:
    - Protocol-aware heterogeneous interoperability 支持 polyglot 自治。 Enforced heterogeneity
      是防耦合的极端案例，不是普遍要求。
    - Choreography 与 localized orchestration 各有权衡。 Complex workflow 需要显式 workflow
      owner，但不能回到全局 ESB。
    - 跨服务 transaction 首先是 granularity 警报。 Saga 只是 local transactions + compensation，不是分布式
      ACID。
    - 只有当业务边界、数据所有权、团队自治和独立演化的收益足以支付网络、Saga、平台与运维成本时，才应把逻辑 bounded contexts 物理拆成 microservices。
  takeaways:
  - Microservices 物理化 DDD bounded context。 服务、代码、数据、部署和团队边界应尽量对齐。
  - Data isolation 是定义性要求。 Database-per-Service 保护 change、scale、availability 和内部实现自由。
  - Protocol-aware heterogeneous interoperability 支持 polyglot 自治。 Enforced heterogeneity
    是防耦合的极端案例，不是普遍要求。
  - Domain-aligned cross-functional teams 最匹配。 技术层团队会重新制造跨团队协调。
  - 只有当业务边界、数据所有权、团队自治和独立演化的收益足以支付网络、Saga、平台与运维成本时，才应把逻辑 bounded contexts 物理拆成 microservices。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「10.1 micro 表示代码行数很少」？
  answer: 错误。它是 label，不是 description。边界由 domain purpose、transaction 和 communication
    决定。
  source_heading: 10.1 micro 表示代码行数很少
- level: 概念辨析
  question: 原文如何解释「10.6 Microservices 绝不允许共享数据库」？
  answer: 原章允许少数 services 共享，并形成 broader bounded context，建议不超过五六个。代价是变化、扩展和容错共同耦合。
  source_heading: 10.6 Microservices 绝不允许共享数据库
- level: 概念辨析
  question: 原文如何解释「10.10 Polyglot 表示每个团队必须选不同技术」？
  answer: 错误。Enforced heterogeneity 是极端案例。Polyglot 提供选择自由，不要求无意义多样化。
  source_heading: 10.10 Polyglot 表示每个团队必须选不同技术
- level: 概念辨析
  question: 原文如何解释「10.15 Transaction 跨服务越多越体现架构能力」？
  answer: 错误。若成为主流，说明 granularity 不对或 microservices 不适合。
  source_heading: 10.15 Transaction 跨服务越多越体现架构能力
- level: 概念辨析
  question: 原文如何解释「10.19 五星 Fault Tolerance 表示不会级联故障」？
  answer: 错误。长同步链、无 timeout、shared database 仍会级联。高分建立在正确隔离和 resilience patterns 上。
  source_heading: 10.19 五星 Fault Tolerance 表示不会级联故障
