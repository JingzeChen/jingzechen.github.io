  kind: summary
  minutes: 14
  question: 0. 本章要解决什么问题？
  question_source: 0. 本章要解决什么问题
  thesis: Protocol-aware heterogeneous interoperability 支持 polyglot 自治。 Enforced heterogeneity
    是防耦合的极端案例，不是普遍要求。
  thesis_source: 13. 核心结论
  concepts:
  - term: 0. 本章要解决什么问题
    meaning: Microservices 是近年最流行的架构风格之一。多数架构风格先在实践中反复出现，后来才被命名；microservices 比较特殊，它在使用早期就获得了明确名称。Martin
      Fowler 和 James Lewis 在 2014 年的著名文章中归纳并普及了它的特征，也反过来塑造了架构定义。
    source_heading: 0. 本章要解决什么问题
  - term: 2. Style Specifics：风格细节
    meaning: 两个 services 可能需要截然不同的 architecture characteristics，必须保持独立边界，但少数业务操作仍需
      transactional coordination。经过权衡后可采用 transactional patterns。
    source_heading: 2. Style Specifics：风格细节
  - term: 5. Common Risks：常见风险
    meaning: Custom JAR/DLL 等共享库跨 contexts 传播代码，意味着功能不再完全包含在 bounded context 内。Shared
      code 变化可能破坏其他 services。
    source_heading: 5. Common Risks：常见风险
  - term: 6. Governance：治理
    meaning: 原章指出可用 custom JAR/DLL 提供统一 logging API。这本身产生 static coupling，是有意用少量 operational
      coupling 换 observability consistency，正体现 trade-off。
    source_heading: 6. Governance：治理
  - term: 9. Examples and Use Cases：案例与适用场景
    meaning: 此时 modular monolith 或 service-based architecture 往往更务实。先建立逻辑边界，再根据真实需求拆分，比从大量空
      repositories 开始更安全。
    source_heading: 9. Examples and Use Cases：案例与适用场景
  - term: 13. 核心结论
    meaning: Protocol-aware heterogeneous interoperability 支持 polyglot 自治。 Enforced
      heterogeneity 是防耦合的极端案例，不是普遍要求。
    source_heading: 13. 核心结论
  logic:
  - 0. 本章要解决什么问题
  - 2. Style Specifics：风格细节
