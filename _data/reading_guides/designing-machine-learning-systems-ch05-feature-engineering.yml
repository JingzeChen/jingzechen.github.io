overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 特征工程经常需要领域专家，而领域专家未必是工程师。因此工作流应允许非工程人员表达、评审和验证领域规则，而不是要求所有贡献都先转化为工程代码才能进入系统。
  thesis_source: 6. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 特征重要性与因果作用有什么区别，XGBoost importance、permutation importance 和 SHAP 各有什么边界？
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Learned Features Versus Engineered Features：学习特征与工程特征
    meaning: 原章写作时还指出，多数生产 ML 应用并非深度学习。这是当时的行业观察，不应未经新调查当作 2026 年比例结论；“模型不能自动获得未提供上下文”这一系统结论仍然成立。
    source_heading: 2. Learned Features Versus Engineered Features：学习特征与工程特征
  - term: 4. Data Leakage：数据泄漏
    meaning: 应模拟部署：前 6 天训练，第 7 天评估。原章五周例用前四周训练，再把第 5 周分 valid/test。若第 5 周内部也强时间相关，更严格做法是按时间顺序把第
      5 周前段作为 validation、后段作为 test，或 rolling backtest；随机拆第 5 周并非所有场景都安全。
    source_heading: 4. Data Leakage：数据泄漏
  - term: 5. Engineering Good Features：工程化优质特征
    meaning: 已观察值与未来值完全不重叠时，模型在外推。Numeric 可比较 quantile、PSI、KS 等；categorical 可比较 unseen
      rate、频率和 Jensen-Shannon divergence。
    source_heading: 5. Engineering Good Features：工程化优质特征
  - term: 8. 本章知识结构
    meaning: 高重要性只描述当前模型依赖，泛化还取决于覆盖、支持集与稳定性。
    source_heading: 8. 本章知识结构
  - term: 10. 从本章提炼出的通用特征工程方法
    meaning: 离散有限位置可 learned embedding；长度外推可评估 sinusoidal / relative 方法；连续坐标可 Fourier
      features。选择要结合精度、分辨率和外推需求。
    source_heading: 10. 从本章提炼出的通用特征工程方法
  logic:
  - 0. 本章要回答的核心问题
  - 2. Learned Features Versus Engineered Features：学习特征与工程特征
  - 3. Common Feature Engineering Operations：常见特征工程操作
  - 5. Engineering Good Features：工程化优质特征
  - 6. 原章总结的完整还原
  - 9. 核心结论
  - 10. 从本章提炼出的通用特征工程方法
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - learned feature 与 engineered feature 的边界在哪里，它们怎样组合？
    - Transformer 为什么需要位置特征，learned、sinusoidal 与 Fourier features 有什么关系？
    - 特征重要性与因果作用有什么区别，XGBoost importance、permutation importance 和 SHAP 各有什么边界？
    - 一句话概括：好特征既要包含对目标有用的信息，也必须在决策时真实可得、定义一致、计算及时，并能迁移到未来与新环境。
  - title: 1. 开篇：正确特征为何常比聪明算法更重要
    source_heading: 1. 开篇：正确特征为何常比聪明算法更重要
    paragraphs:
    - 2014 年 Facebook 广告点击预测论文认为，正确特征是模型开发中最重要的因素。作者此后在多家公司反复观察到：有了可工作的模型后，增加有效特征带来的提升，常大于超参数调优等算法技巧。最先进架构若没有有用信号，也会表现很差。
    - 使用什么信息：文本、用户历史、线程热度、时间、设备等；
    - 怎样表示信息：填补、缩放、分桶、哈希、交叉、embedding 等。
    - 特征存储（feature store）是支持多应用复用、在线/离线一致性和治理的基础设施，原书把它放到第 10 章；本章关注特征本身的语义与构造。
  - title: 2. Learned Features Versus Engineered Features：学习特征与工程特征
    source_heading: 2. Learned Features Versus Engineered Features：学习特征与工程特征
    paragraphs:
    - 深度学习常被称为 feature learning：模型可以从原始文本、图像或音频中自动学习多层表示，减少人工设计边缘、纹理、词形和 n-gram 的工作。
    - 原章写作时还指出，多数生产 ML 应用并非深度学习。这是当时的行业观察，不应未经新调查当作 2026 年比例结论；“模型不能自动获得未提供上下文”这一系统结论仍然成立。
    - 这些不是模型从评论字符中必然推断出的事实，需要系统关联多个数据源。TikTok 等复杂推荐任务可使用数百万特征；欺诈检测还需要银行与攻击模式的领域知识。
    - 模型自动学习内容表示，人工工程则提供上下文、约束和高价值聚合。选择标准不是“现代还是传统”，而是增量价值、数据量、计算成本、维护性和未来可用性。
  - title: 3. Common Feature Engineering Operations：常见特征工程操作
    source_heading: 3. Common Feature Engineering Operations：常见特征工程操作
    paragraphs:
    - 原章把 gradient-boosted trees 也列为尤其受益的经典算法。需要补充：普通决策树和基于阈值切分的 boosted trees 对单调尺度变换通常近似不变，不像逻辑回归、SVM、kNN、PCA
      和神经网络那样要求缩放；具体实现的直方图、正则与数值精度仍可能产生差异。
    - 给类别分配 ID 便于查表，但若直接把 0、1、2 输入线性或距离模型，会暗示顺序与距离。无序低基数类别通常使用 one-hot；高基数类别常用 embedding、hashing
      或任务特定统计编码。
    - 碰撞给类别共享参数，既可能是噪声，也可能像随机正则。Booking.com 的特定 CTR 研究中，即使实验所定义的 collision rate 约为
      50%，log loss 增幅仍小于 0.5%。该 collision rate 不应未经其实验口径核对，就直接等同于上面的重复占桶比例、参与类别比例或碰撞对比例；结果也不是所有任务的保证。
    - 普通 feature hashing 追求近似均匀、随机碰撞；locality-sensitive hashing 刻意让相似对象更可能接近或碰撞，用于相似搜索。不能仅通过更换普通字符串哈希就获得语义局部性。
  - title: 4. Data Leakage：数据泄漏
    source_heading: 4. Data Leakage：数据泄漏
    paragraphs:
    - 2020 年 University of Liverpool Ion Switching 竞赛用训练数据合成测试数据，参赛者能逆向恢复测试标签。两支获胜团队利用了泄漏，尽管不利用也可能获胜。
    - 应模拟部署：前 6 天训练，第 7 天评估。原章五周例用前四周训练，再把第 5 周分 valid/test。若第 5 周内部也强时间相关，更严格做法是按时间顺序把第
      5 周前段作为 validation、后段作为 test，或 rolling backtest；随机拆第 5 周并非所有场景都安全。
    - 用全数据 mean / median 填补同样泄漏。Imputer、类别词表、target encoding、PCA、feature selection
      和 learned preprocessing 都应视为模型 pipeline 的一部分，只在训练折拟合。
    - 若一个本不应知道答案的特征与标签异常相关，应追查生成时间和因果路径。两个特征单独无泄漏，组合可能泄漏：employee start date 与 end
      date 一起直接给出 tenure。
  - title: 5. Engineering Good Features：工程化优质特征
    source_heading: 5. Engineering Good Features：工程化优质特征
    paragraphs:
    - 删除不等于销毁定义：可在 registry 中保留版本、所有者、血缘和历史实验，以便复用或恢复。Feature store 不一定管理 feature
      definition，能力边界要具体核查。
    - 原章引用 Facebook 广告模型：前 10 个特征约贡献总 importance 的一半，最后 300 个特征合计不足 1%。图 5-10 的单特征重要性使用对数轴，累计曲线迅速趋近
      1。
    - 已观察值与未来值完全不重叠时，模型在外推。Numeric 可比较 quantile、PSI、KS 等；categorical 可比较 unseen rate、频率和
      Jensen-Shannon divergence。
    - 用过去六天预测今天 ETA：训练值 Monday–Saturday，测试只有 Sunday。Coverage 都是 100%，但 Sunday 不在训练支持集；若编码不当会伤害模型。
  - title: 6. 原章总结的完整还原
    source_heading: 6. 原章总结的完整还原
    paragraphs:
    - Learned features 自动化了文本与图像的许多表示工作，但业务上下文、跨实体统计和领域信息仍需工程。常见操作包括处理缺失值、缩放、离散化、类别编码、特征交叉及离散/连续位置编码。
    - 数据泄漏是隐蔽而灾难性的风险。它可来自时间随机切分、全数据缩放或填补、重复样本、群组、采集流程和反复查看测试集。避免泄漏需要先切分、仅用 train 拟合转换、按独立实体与时间评估，并理解数据生成过程。
    - 作者强调，怎样构造好特征没有万无一失的配方，最重要的学习方式是持续实验并观察特征怎样改变模型表现。阅读 Kaggle 获胜团队的特征工程方案，也能学习其技术与取舍过程。
    - 特征工程经常需要领域专家，而领域专家未必是工程师。因此工作流应允许非工程人员表达、评审和验证领域规则，而不是要求所有贡献都先转化为工程代码才能进入系统。
  - title: 8. 本章知识结构
    source_heading: 8. 本章知识结构
    paragraphs:
    - 所有从数据学习的预处理参数都可能泄漏，必须只在训练折拟合。
    - 特征在决策时刻不可得，即使离线重要也没有生产价值。
    - 高重要性只描述当前模型依赖，泛化还取决于覆盖、支持集与稳定性。
    - 特征越多，泄漏、成本和维护面越大，因而需要持续退役。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - Learned 与 engineered features 是互补关系。 深度模型学习内容表示，工程特征提供上下文、聚合和领域知识。
    - 缺失本身可能有信息。 Sentinel 必须与合法值区分，missing indicator 也要监控漂移与公平风险。
    - 位置编码为缺少顺序结构的模型提供位置信号。 Learned、sinusoidal 与 Fourier features 适应不同离散/连续场景。
    - 先切分，再拟合任何有状态转换。 Scaling、imputation、词表、PCA、target encoding 和 resampling 都属于 pipeline。
  - title: 10. 从本章提炼出的通用特征工程方法
    source_heading: 10. 从本章提炼出的通用特征工程方法
    paragraphs:
    - 离散有限位置可 learned embedding；长度外推可评估 sinusoidal / relative 方法；连续坐标可 Fourier features。选择要结合精度、分辨率和外推需求。
    - 使用 built-in、permutation、ablation 和 SHAP 等多种口径；再检查覆盖、unseen rate、时间稳定、跨域表现、计算成本和公平切片。
    - Imputer、scaler、vocabulary、hash seed、cross 定义、窗口和模型权重必须原子化版本，避免 training-serving
      skew。
    - 监控 missing rate、coverage、分布、超界、unseen category、freshness、计算失败、延迟和消费方。重要性长期低、成本高或来源废弃时，先影子移除，再正式退役。
  takeaways:
  - 原章首先强调，生产 ML 的成功仍高度依赖特征。组织应投入时间和资源做特征工程，而不能期待模型架构自动补偿缺失信息。
  - 只用 train 统计缩放和填补；
  - 特征越多，泄漏、成本和维护面越大，因而需要持续退役。
  - Feature hashing 的碰撞影响取决于具体任务。 Booking.com 的小损失结果不是普遍保证。
  - 特征需要生命周期管理。 无用特征即使权重接近零，仍会产生基础设施和组织技术债。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 Learned features 不等于零特征工程」？
  answer: 模型能学习输入内表示，不能自动获得用户历史、业务上下文、正确时间窗口和在线数据。
  source_heading: 7.1 Learned features 不等于零特征工程
- level: 概念辨析
  question: 原文如何解释「7.7 树模型通常不依赖数值尺度」？
  answer: 阈值切分对单调变换近似不变。缩放对距离、线性、核方法和梯度优化通常更关键。
  source_heading: 7.7 树模型通常不依赖数值尺度
- level: 概念辨析
  question: 原文如何解释「7.14 50% collision 只损失 0.5% 不是普遍规律」？
  answer: 它来自特定 Booking.com 模型和数据。高价值稀有类别碰撞可能造成更大伤害。
  source_heading: 7.14 50% collision 只损失 0.5% 不是普遍规律
- level: 概念辨析
  question: 原文如何解释「7.26 Coverage 低不等于必然无用」？
  answer: MNAR 时，“是否存在”本身可能强预测；但要检查它是否稳定、公平且线上可用。
  source_heading: 7.26 Coverage 低不等于必然无用
- level: 概念辨析
  question: 原文如何解释「7.29 Feature store 不自动解决特征语义」？
  answer: 基础设施能复用与服务特征，但无法替团队定义正确窗口、可用时间与业务含义。
  source_heading: 7.29 Feature store 不自动解决特征语义
