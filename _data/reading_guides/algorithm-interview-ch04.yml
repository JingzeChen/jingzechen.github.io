  - 本章共有 12 道正文题：4.2 有 4 道，4.3 有 5 道，4.4 有 3 道。
  - 维护窗口最大值时，对应值从前到后非递增。若新值 x 大于队尾值，旧队尾既不比 x 大，又比 x 更早过期，因此在任何包含 x 的未来窗口中都不可能成为最大值，可永久删除。
