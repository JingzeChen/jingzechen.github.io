overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章主线」建立了怎样的核心认识？
  question_source: 0. 本章主线
  thesis: 队列的核心是时间顺序，循环数组解决有限容量下的槽位复用，双端队列把操作扩展到两端。前中后队列说明了如何用平衡不变量把“中间”也变成端点；双栈队列和队列实现栈则展示了接口之间可以相互模拟，但代价会移动到不同操作上。
  thesis_source: 本章总结
  concepts:
  - term: 0. 本章主线
    meaning: 队列让先到达的数据先处理；双端队列允许在两端更新；单调队列再增加“主动丢弃不可能成为未来最优值的元素”，从而在线维护窗口最值。
    source_heading: 0. 本章主线
  - term: 4.1 队列和双端队列概述
    meaning: 双端队列 deque（double-ended queue）允许在前端和后端各自插入、删除。限制“后端进、前端出”得到队列；限制在同一端进出得到栈。它不是“双向链表”的同义词：双端队列是接口，分块数组或链表都能实现。
    source_heading: 4.1 队列和双端队列概述
  - term: 4.2 扩展队列的设计
    meaning: 旋转后必须继续完成一整轮，使其他元素恢复原相对次序；只旋转到中点并停止会改变队列顺序。该方法状态少但每次中间操作扫描全队列。
    source_heading: 4.2 扩展队列的设计
  - term: 4.3 队列的应用
    meaning: 扫描字符，用双端队列后端作为“当前整理结果末尾”：若新字符等于队尾就删除队尾，否则加入队尾。它实际上把 deque 限制为栈使用，与第 3
      章整理字符串方法同构。
    source_heading: 4.3 队列的应用
  - term: 4.4 单调队列
    meaning: 队尾被删元素为何永远无用？新元素更大且更晚过期，所有未来同时包含二者的窗口都优先选择新元素。队头为何正确？所有更大且未过期的候选都应排在它前面，但不存在，所以它是最大值。
    source_heading: 4.4 单调队列
  - term: 本章总结
    meaning: 单调队列进一步区分两类删除：队头删除过期元素，队尾删除被新元素支配的候选。只要能证明被删元素永远不会成为未来答案，并且每个下标只进出常数次，就能得到线性总时间。窗口最大值、受限子数组和最大值队列都建立在这一证明上。
    source_heading: 本章总结
