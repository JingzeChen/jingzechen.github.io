overview:
  kind: summary
  minutes: 12
  question: 原文围绕「1. 从编写规则到用数据编程」建立了怎样的核心认识？
  question_source: 1. 从编写规则到用数据编程
  thesis: 本章最终建立的不是一份模型名录，而是一种问题求解观：把人难以明确表达的映射转化为可由数据评价的参数化程序，再用优化寻找参数，同时始终区分训练拟合、未知数据上的泛化和现实世界中的决策后果。
    后续章节的张量、微积分、概率、线性模型和神经网络，都会围绕这条主线逐步提供实现工具。
  thesis_source: 13. 核心结论与一般解题方法
  concepts:
  - term: 1. 从编写规则到用数据编程
    meaning: 传统程序的核心是人写出的明确规则。例如，电商系统可以把“用户点击加入购物车”写成确定的业务逻辑：验证用户和商品，随后在购物车表中建立关联。开发者虽然要处理空购物车、库存不足等边界情况，但原则上能够枚举条件并规定动作。
    source_heading: 1. 从编写规则到用数据编程
  - term: 3. 机器学习的四个关键组件
    meaning: 书中的两个例子尤其关键：只见过浅色皮肤的皮肤癌模型可能无法服务深色皮肤人群；用历史招聘决策训练的简历模型可能自动复制历史不公。这些问题不会因为开发者“没有恶意”而消失。模型擅长拟合数据中的统计规律，但不会自动判断规律是否公正、是否具有因果意义、是否适合继续沿用。
    source_heading: 3. 机器学习的四个关键组件
  - term: 6. 通往深度学习之路
    meaning: 从 Caffe、Torch、Theano，到 TensorFlow/Keras、MXNet，再到 PyTorch、Gluon 和 JAX，框架逐渐提供自动微分、GPU
      算子、模块组合和分布式能力。系统研究者构建工具，统计建模者设计模型，分工使过去需要大量代码的逻辑回归如今可用不到十行高级 API 实现。
    source_heading: 6. 通往深度学习之路
  - term: 7. 成功案例、能力边界与现实风险
    meaning: 原书认为，当前系统都围绕具体目标被设计、训练和部署，其看似通用的行为来自规则、启发式和统计模型的组合。现阶段没有成熟工具能让系统自主理解并持续重构自身架构，从而解决任意一般任务。因此，把主要注意力放在有意识机器蓄意毁灭人类上，会掩盖更迫切的问题。
    source_heading: 7. 成功案例、能力边界与现实风险
  - term: 10.1 参数、超参数与模型结构
    meaning: 层数虽影响模型函数族，但通常不通过普通梯度步骤自动改变，因此常被称为超参数。
    source_heading: 10.1 参数、超参数与模型结构
  - term: 13. 核心结论与一般解题方法
    meaning: 本章最终建立的不是一份模型名录，而是一种问题求解观：把人难以明确表达的映射转化为可由数据评价的参数化程序，再用优化寻找参数，同时始终区分训练拟合、未知数据上的泛化和现实世界中的决策后果。
      后续章节的张量、微积分、概率、线性模型和神经网络，都会围绕这条主线逐步提供实现工具。
    source_heading: 13. 核心结论与一般解题方法
  logic:
  - 1. 从编写规则到用数据编程
  - 3. 机器学习的四个关键组件
  - 5. 思想根源：深度学习不是凭空出现的
  - 7. 成功案例、能力边界与现实风险
