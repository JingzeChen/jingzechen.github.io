  - 13. 核心结论与一般解题方法
  sections:
  - title: 1. 从编写规则到用数据编程
    source_heading: 1. 从编写规则到用数据编程
    paragraphs:
    - 传统程序的核心是人写出的明确规则。例如，电商系统可以把“用户点击加入购物车”写成确定的业务逻辑：验证用户和商品，随后在购物车表中建立关联。开发者虽然要处理空购物车、库存不足等边界情况，但原则上能够枚举条件并规定动作。
    - 如果规则能够被完整描述、能够覆盖所有情形，而且需求不会随数据自动变化，那么直接编程通常更可靠、更便宜，也更容易测试。书中的判断很重要：当人工规则能够做到几乎始终正确时，通常不应为了使用机器学习而使用机器学习。
    - 机器学习由此改变了问题的解法：不要求程序员直接写出最终映射，而是给出一个能够从经验中改善的算法。这里的经验通常是观测数据，也可以是智能体与环境交互得到的轨迹。
    - 这张图表示常见的概念包含关系，而不是说所有人工智能都依赖机器学习，也不是说所有机器学习都属于深度学习。规则系统、搜索和规划同样可以是人工智能系统的一部分。
  - title: 2. 动机案例：唤醒词识别
    source_heading: 2. 动机案例：唤醒词识别
    paragraphs:
    - 用户只经历几秒钟的一次操作，后台却连续调用了多个输入、输出和目标各不相同的模型。这说明真实产品往往不是“一个万能模型”，而是由多个学习组件与确定性业务逻辑共同组成。
    - 不过，人能够听出唤醒词，因此能够收集音频并给出标签。这就把“不会描述识别规则”转化为“能够提供正确示例”。机器学习利用的正是这种不对称性。
    - "“旋钮”比喻的精确含义是：参数不是程序外部的规则，而是同一计算结构中的数值。改变参数，就改变输入到输出的映射。一个合适的模型族既要有能力表示“Alexa”，也应能通过另一组参数表示“Apricot”；若任务从音频分类变为图像描述，输入输出结构发生根本变化，模型族也可能需要改变。"
    - 训练结束得到的不是数据本身，而是一组从数据中提炼出的参数。部署时通常只需保留模型结构和已学习参数，便可对新输入进行推理。
  - title: 3. 机器学习的四个关键组件
    source_heading: 3. 机器学习的四个关键组件
    paragraphs:
    - 但互联网图像分辨率不同，评论长短悬殊，语音和视频持续时间也不同。粗暴裁剪或填充虽然能统一尺寸，却可能丢失内容或引入大量无效位置。深度学习的重要优势之一，是能够较自然地处理序列、集合、图和不同尺寸图像等可变结构数据。
    - 书中的两个例子尤其关键：只见过浅色皮肤的皮肤癌模型可能无法服务深色皮肤人群；用历史招聘决策训练的简历模型可能自动复制历史不公。这些问题不会因为开发者“没有恶意”而消失。模型擅长拟合数据中的统计规律，但不会自动判断规律是否公正、是否具有因果意义、是否适合继续沿用。
    - "“深”指多层变换，不只是代码执行了很多行。关键在于每层表示的参数都能根据最终任务联合学习。底层可能从像素中提取局部边缘，中层组合形状，高层形成与类别相关的表示；这些语义是便于理解的直觉，不保证每个神经元都能被如此清晰解释。"
    - 原书用模拟考试和期末考试类比：记住练习题会提高练习分数，却不等于掌握了可迁移的方法。测试集必须在模型选择和调参期间保持独立；若反复根据测试结果修改模型，测试集实际上也参与了训练，评估会过于乐观。实践中通常再划出验证集用于选择超参数，将测试集留到最后一次评估。
  - title: 5. 思想根源：深度学习不是凭空出现的
    source_heading: 5. 思想根源：深度学习不是凭空出现的
    paragraphs:
    - Ronald Fisher 推动了统计理论及其在遗传学中的应用，线性判别分析、Fisher 信息矩阵和 1936 年发布的 Iris 数据集仍有影响。原书同时指出
      Fisher 支持优生学，以提醒读者：数据科学有生产性历史，也有不道德应用的历史。
    - Claude Shannon 的信息论为不确定性、编码和交叉熵等概念奠定基础。Alan Turing 的计算理论界定“哪些过程可以计算”，并在 1950
      年提出以文本交互中的不可区分性讨论机器智能，即后来所谓图灵测试。
    - Donald Hebb 提出神经元连接可因共同活动而增强的学习思想，后来影响了感知机和参数更新方法。现代神经网络虽保留生物学名称，但已不应被视为对真实大脑的逐部件复制。
    - 在小数据和低算力条件下，核方法、决策树和概率图模型往往效果更好、训练更快，并有较强理论保证。这个历史说明算法优劣与资源条件有关：今天流行的模型不一定适合数据稀缺、要求可解释或设备受限的任务。
  - title: 6. 通往深度学习之路
    source_heading: 6. 通往深度学习之路
    paragraphs:
    - 表中的 K/M/G/T/P 是数量级标记，具体硬件和基准会影响实际值，不能把它当作严格性能测试。重要结论是趋势：数据增长快于内存，而计算增长快于数据。
      因而算法必须更节省存储、采用小批量和分布式读取，同时可以花更多计算反复优化大量参数。
    - Transformer 主要依靠注意力组织信息，在增加数据量、模型规模和训练计算时表现出良好的扩展趋势。原章列举了它在自然语言、视觉、语音、强化学习和图神经网络中的应用，并提到单一
      Transformer 可预训练于文本、图像、关节力矩和按键等多种模态。
    - GAN 让生成器 G 与判别器 D 对抗训练。判别器区分真实与生成样本，生成器学习让判别器无法区分。关键突破是生成过程不必局限于容易写出密度的传统概率族，只要生成器参数可通过梯度调整即可。训练不稳定、模式坍塌和评价困难则是其典型局限。
    - 从 Caffe、Torch、Theano，到 TensorFlow/Keras、MXNet，再到 PyTorch、Gluon 和 JAX，框架逐渐提供自动微分、GPU
      算子、模块组合和分布式能力。系统研究者构建工具，统计建模者设计模型，分工使过去需要大量代码的逻辑回归如今可用不到十行高级 API 实现。
  - title: 7. 成功案例、能力边界与现实风险
    source_heading: 7. 成功案例、能力边界与现实风险
    paragraphs:
    - 从 TD-Gammon、Deep Blue 到 AlphaGo 和 Libratus，系统依次处理更大的状态空间、搜索和部分可观测博弈；
    - 这些数字必须放回具体基准理解。“在某项基准达到人类水平”不等于所有场景、所有人群、所有噪声条件下都等同于人类，更不等于系统获得通用智能。
    - 自动驾驶的例子揭示工程现实：深度学习目前主要处理视觉感知，其他部分还依赖规则、地图、规划、控制和大量工程调试。类似地，智能助手也包含唤醒、识别、理解、检索、执行和权限控制等多个组件。
    - 原书认为，当前系统都围绕具体目标被设计、训练和部署，其看似通用的行为来自规则、启发式和统计模型的组合。现阶段没有成熟工具能让系统自主理解并持续重构自身架构，从而解决任意一般任务。因此，把主要注意力放在有意识机器蓄意毁灭人类上，会掩盖更迫切的问题。
  - title: 8. 深度学习的本质
    source_heading: 8. 深度学习的本质
    paragraphs:
    - 传统流水线通常分成两段：领域专家先设计特征，再训练浅层模型。计算机视觉中，Canny 边缘检测和 SIFT 特征曾长期用于把原始图像变成固定特征向量。
    - 端到端不是永远正确。数据不足、规则必须严格满足、错误代价极高、需要审计解释，或模块拥有可靠物理模型时，混合系统和模块化设计可能更适合。端到端还可能让局部故障难以定位，并需要更多数据覆盖完整流程。
    - 数据稀缺时，必须借助强简化假设限制可能函数；数据丰富后，可以使用更灵活、近似非参数化的模型拟合复杂规律。这里“非参数”不表示没有参数，现代深度网络显然含有大量参数；它强调模型有效容量可以随数据和资源扩展，而不是被少量固定参数的简单分布族严格限制。
    - 深度学习社区接受用不完美优化方法寻找足够好的解，也常先通过实验验证，再逐步建立理论解释。这种经验主义加速了实用进展，但也容易重复发明旧方法、过度依赖基准和忽视失败条件。
  - title: 10.1 参数、超参数与模型结构
    source_heading: 10.1 参数、超参数与模型结构
    paragraphs:
    - 参数由训练数据和优化算法更新，如权重 w、偏置 b。
    - 超参数由训练流程外部选择，如学习率、层数、批量大小。
    - 层数虽影响模型函数族，但通常不通过普通梯度步骤自动改变，因此常被称为超参数。
  - title: 11. 本章练习的思考方向
    source_heading: 11. 本章练习的思考方向
    paragraphs:
    - 寻找代码中长期靠人工阈值、排序权重、模式规则或启发式打分的部分。例如垃圾邮件关键词权重、搜索排序公式、告警阈值和容量预测。候选问题还必须满足：有可观察反馈，错误成本可接受，且数据能覆盖未来使用场景。
    - 图像缺陷检测、客服意图识别、日志异常归类和文档标签推荐都符合这一模式。先确认人类能相对一致地判断答案；若专家之间都无法定义目标，收集再多标签也可能只把分歧写进模型。
    - 数据少时，强先验和简单模型更稳健；数据大但内存有限时，需要小批量和流式训练；算力充裕时，可以用更多迭代优化大模型，但仍无法修复错误标签或分布不匹配。
    - 语音系统中的降噪—特征—识别、搜索中的召回—打分—排序、机器人中的感知—状态估计—控制，都可能通过联合目标减少组件间不匹配。但若中间环节有硬安全约束、可验证规则或缺乏全流程数据，保留模块边界更稳妥。
  - title: 13. 核心结论与一般解题方法
    source_heading: 13. 核心结论与一般解题方法
    paragraphs:
    - 机器学习适合规则难以显式写出、但能够获得经验和评价反馈的问题；能可靠手写的确定规则不必强行学习。
    - 学习系统的四个基本组件是数据、模型、目标函数和优化算法，任何一个选错都会使其余部分失去意义。
    - 深度学习的关键不是单纯“参数多”，而是多层表示能够围绕最终目标联合学习，并支持端到端优化。
    - 本章最终建立的不是一份模型名录，而是一种问题求解观：把人难以明确表达的映射转化为可由数据评价的参数化程序，再用优化寻找参数，同时始终区分训练拟合、未知数据上的泛化和现实世界中的决策后果。
      后续章节的张量、微积分、概率、线性模型和神经网络，都会围绕这条主线逐步提供实现工具。
  takeaways:
  - 机器学习适合规则难以显式写出、但能够获得经验和评价反馈的问题；能可靠手写的确定规则不必强行学习。
  - 概率预测只是决策的输入；现实行动必须再考虑错误成本、约束和长期影响。
  - 定义任务边界：输入是什么，输出是什么，预测供谁采取什么行动？
  - 把现实目标写成目标函数：训练损失是否真能代理最终效用，错误是否等价？
  - 本章最终建立的不是一份模型名录，而是一种问题求解观：把人难以明确表达的映射转化为可由数据评价的参数化程序，再用优化寻找参数，同时始终区分训练拟合、未知数据上的泛化和现实世界中的决策后果。
    后续章节的张量、微积分、概率、线性模型和神经网络，都会围绕这条主线逐步提供实现工具。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「10.1 参数、超参数与模型结构」？
  answer: 层数虽影响模型函数族，但通常不通过普通梯度步骤自动改变，因此常被称为超参数。
  source_heading: 10.1 参数、超参数与模型结构
- level: 概念辨析
  question: 原文如何解释「10.3 损失、指标和真实效用」？
  answer: 损失是便于训练的目标，指标是报告性能的量，真实效用是系统对现实造成的收益和成本。三者应相关，却不必相同。交叉熵下降不保证业务长期收益增加，准确率高也不保证高风险决策合理。
  source_heading: 10.3 损失、指标和真实效用
- level: 概念辨析
  question: 原文如何解释「10.6 相关、预测与因果」？
  answer: 模型能用 x 预测 y，不代表改变 x 会导致 y 改变。招聘、信贷和医疗决策尤其不能把历史相关性直接当作干预依据。
  source_heading: 10.6 相关、预测与因果
- level: 概念辨析
  question: 原文如何解释「10.8 无监督与自监督」？
  answer: 无监督学习没有外部标签，但仍有目标；自监督从数据内部自动生成训练信号。自监督不是“模型自己监督自己，也不需要人为设计任务”。
  source_heading: 10.8 无监督与自监督
- level: 概念辨析
  question: 原文如何解释「10.10 深度学习与万能方法」？
  answer: 深度学习擅长大规模、复杂、低层感知数据，但通常需要大量数据、计算和工程。小样本表格、强规则约束、严格可解释场景中，经典统计模型、树模型、物理模型或规则系统可能更好。
  source_heading: 10.10 深度学习与万能方法
