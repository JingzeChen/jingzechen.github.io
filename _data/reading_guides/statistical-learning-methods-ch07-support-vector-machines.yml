overview:
  kind: summary
  minutes: 8
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 本书至此出现的四种代理损失：感知机损失（第 2 章）、逻辑斯谛损失（第 6 章）、合页损失（本章）、指数损失（第 8 章 AdaBoost）。它们都是
    0-1 损失的凸上界，区别在于对错误的惩罚增长速度：合页损失线性增长，指数损失指数增长（对噪声最敏感），逻辑斯谛损失渐近线性。
  thesis_source: 7.3 线性支持向量机与软间隔最大化
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 核技巧是比 SVM 更普适的方法论，能把任何只依赖内积的线性算法非线性化；
    source_heading: 0. 本章解决什么问题
  - term: 7.2 学习的对偶算法
    meaning: 第一个式子极其重要：它说明最优的 w 一定是训练样本的线性组合（与第 2 章感知机对偶形式完全一致）。第二个式子是 b 带来的等式约束，后面
      SMO 中”必须同时更新两个变量”的原因就在这里。
    source_heading: 7.2 学习的对偶算法
  - term: 7.3 线性支持向量机与软间隔最大化
    meaning: 本书至此出现的四种代理损失：感知机损失（第 2 章）、逻辑斯谛损失（第 6 章）、合页损失（本章）、指数损失（第 8 章 AdaBoost）。它们都是
      0-1 损失的凸上界，区别在于对错误的惩罚增长速度：合页损失线性增长，指数损失指数增长（对噪声最敏感），逻辑斯谛损失渐近线性。
    source_heading: 7.3 线性支持向量机与软间隔最大化
  - term: 7.5 序列最小最优化算法（SMO）
    meaning: SMO 的收敛依据：若所有变量都满足 KKT 条件，则得到最优解（KKT 是该问题的充要条件，因为问题是凸的）。否则总能找到违反 KKT
      的变量，优化它必使目标函数下降。
    source_heading: 7.5 序列最小最优化算法（SMO）
  - term: 7.7 深入理解
    meaning: 历史地位：SVM 在 1995–2010 年间是最主流的分类方法。深度学习兴起后，在大规模感知任务上被取代，但在中小样本、高维结构化数据（如生物信息、文本分类）上仍有竞争力。更重要的是，它的核方法与间隔理论已成为机器学习的基础工具。
    source_heading: 7.7 深入理解
  - term: 7.8.2 必须掌握的结论
    meaning: SVM 等价于最小化合页损失 + L_2 正则；合页损失是 0-1 损失的凸上界（代理损失）。
    source_heading: 7.8.2 必须掌握的结论
  logic:
  - 0. 本章解决什么问题
  - 7.1 线性可分支持向量机与硬间隔最大化
  - 7.3 线性支持向量机与软间隔最大化
  - 7.4 非线性支持向量机与核函数
  - 7.5 序列最小最优化算法（SMO）
  - 7.8.1 用三要素分析 SVM
  - 7.8.2 必须掌握的结论
  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 它把拉格朗日对偶用到了极致（第 6 章最大熵是预演）；
    - 核技巧是比 SVM 更普适的方法论，能把任何只依赖内积的线性算法非线性化；
    - 它的目标函数是凸二次规划，有唯一全局最优解；
    - 它展示了如何为大规模问题设计专门的优化算法（SMO）；
  - title: 7.1 线性可分支持向量机与硬间隔最大化
    source_heading: 7.1 线性可分支持向量机与硬间隔最大化
    paragraphs:
    - 点离超平面越远，我们对分类结果越有信心。所以一个好的超平面，应该让最难分的点（离超平面最近的点）也尽可能远离超平面。这就是间隔最大化的思想。
    - 所以函数间隔可以被随意”放大”，不能作为优化目标——否则只要不断放大 w 就能让目标无穷大。
    - 正是点到超平面的欧氏距离。乘上 y_i 得到带符号的距离：分类正确时为正，错误时为负。
    - 对比第 2 章：感知机的解不唯一（依赖初始化和样本顺序），SVM 的解唯一。这正是”加了间隔最大化这个额外准则”带来的好处——它从无穷多可行超平面中挑出了唯一确定的那个。
  - title: 7.2 学习的对偶算法
    source_heading: 7.2 学习的对偶算法
    paragraphs:
    - 由于原问题是凸的且满足 Slater 条件，强对偶性成立，两者的解相同。
    - 第一个式子极其重要：它说明最优的 w 一定是训练样本的线性组合（与第 2 章感知机对偶形式完全一致）。第二个式子是 b 带来的等式约束，后面 SMO 中”必须同时更新两个变量”的原因就在这里。
    - 把内积换成核函数即可处理非线性问题。
  - title: 7.3 线性支持向量机与软间隔最大化
    source_heading: 7.3 线性支持向量机与软间隔最大化
    paragraphs:
    - 定义 7.5（线性支持向量机） 求解上述凸二次规划得到的分离超平面与决策函数称为线性支持向量机。
    - 这个结果非常优雅：引入了 N 个松弛变量，对偶问题却没有增加任何变量，只是给原有变量加了个上界。
    - 这个表格是理解软间隔 SVM 的核心，也是 SMO 算法中判断 KKT 条件的依据。
    - 本书至此出现的四种代理损失：感知机损失（第 2 章）、逻辑斯谛损失（第 6 章）、合页损失（本章）、指数损失（第 8 章 AdaBoost）。它们都是
      0-1 损失的凸上界，区别在于对错误的惩罚增长速度：合页损失线性增长，指数损失指数增长（对噪声最敏感），逻辑斯谛损失渐近线性。
  - title: 7.4 非线性支持向量机与核函数
    source_heading: 7.4 非线性支持向量机与核函数
    paragraphs:
    - 这就是”核技巧”三个字的全部含义：学习是隐式地在特征空间进行的。计算量只与样本数有关，与特征空间维数无关——哪怕是无穷维。
    - 这正是 Gram 矩阵半正定的直接结果——这就是为什么半正定是充分条件。
    - 直观上，两个字符串相同的子串越多，核函数值越大。字符串核可用动态规划快速计算，在文本分类、生物信息学中有重要应用。
    - 这个对比说明了核选择的本质：核函数编码了我们对数据结构的先验假设。选对了核，问题瞬间变简单；选错了核，再多的计算也无济于事。
  - title: 7.5 序列最小最优化算法（SMO）
    source_heading: 7.5 序列最小最优化算法（SMO）
    paragraphs:
    - 每次只选两个变量优化，固定其余变量。这个两变量子问题有解析解，不需要调用数值优化器。
    - SMO 的收敛依据：若所有变量都满足 KKT 条件，则得到最优解（KKT 是该问题的充要条件，因为问题是凸的）。否则总能找到违反 KKT 的变量，优化它必使目标函数下降。
    - 这个顺序有讲究：边界上的支持向量最”活跃”，最可能违反 KKT，优先检查它们能加快收敛。
    - 虽然子问题次数很多，但每次都是解析计算，没有数值迭代，所以总体上非常快。这是”用大量廉价步骤代替少量昂贵步骤”的典型设计。
  - title: 7.7 深入理解
    source_heading: 7.7 深入理解
    paragraphs:
    - "（1）几何直觉：间隔大意味着决策边界离两类都远，训练数据的小扰动不会改变分类结果，模型更稳健。"
    - 这解释了为什么核 SVM 能在无穷维特征空间中工作而不必然过拟合——真正控制复杂度的是间隔，不是维数。
    - 特征缩放是必需的。核函数依赖内积或距离，量纲不一致会让大尺度特征主导。这与第 3 章 k-NN 的情况相同。
    - 历史地位：SVM 在 1995–2010 年间是最主流的分类方法。深度学习兴起后，在大规模感知任务上被取代，但在中小样本、高维结构化数据（如生物信息、文本分类）上仍有竞争力。更重要的是，它的核方法与间隔理论已成为机器学习的基础工具。
  - title: 7.8.1 用三要素分析 SVM
    source_heading: 7.8.1 用三要素分析 SVM
    paragraphs:
    - 属于判别、非概率模型。线性核时是参数化模型，高斯核时是非参数化模型（复杂度随样本增长）。
    - 凸二次规划。小规模用通用 QP 求解器，大规模用 SMO（每次解析求解两变量子问题）。
  - title: 7.8.2 必须掌握的结论
    source_heading: 7.8.2 必须掌握的结论
    paragraphs:
    - 转对偶的两个理由：更易求解；自然引入核函数。第二点是决定性的。
    - SVM 等价于最小化合页损失 + L_2 正则；合页损失是 0-1 损失的凸上界（代理损失）。
    - 正定核充要条件：对称 + 任意 Gram 矩阵半正定。充分性通过构造 RKHS 证明。
    - SMO 每次优化两个变量（因等式约束，一个变量无法独立变动），子问题有解析解。
  takeaways:
  - 它展示了如何为大规模问题设计专门的优化算法（SMO）；
  - 把内积换成核函数即可处理非线性问题。
  - 这个对比说明了核选择的本质：核函数编码了我们对数据结构的先验假设。选对了核，问题瞬间变简单；选错了核，再多的计算也无济于事。
  - 历史地位：SVM 在 1995–2010 年间是最主流的分类方法。深度学习兴起后，在大规模感知任务上被取代，但在中小样本、高维结构化数据（如生物信息、文本分类）上仍有竞争力。更重要的是，它的核方法与间隔理论已成为机器学习的基础工具。
  - SMO 每次优化两个变量（因等式约束，一个变量无法独立变动），子问题有解析解。
