  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 7 章首页 Single Responsibility Principle（SRP，单一职责原则）可能是 SOLID 中最容易被误解的一条原则，主要原因就是它的名字。
    - "「一个函数只做一件事」确实是有价值的低层重构原则，但 SRP 讨论的是另一件事：一个模块应该只对一个 actor 负责。"
    - Accidental Duplication（意外重复或偶然共享）：看似相同的逻辑服务不同 actor，却被错误地合并；
    - 解决思路不是让每个类只剩一个方法，而是让同一 actor 所需的一组函数形成内聚作用域，并让不同 actor 的变化彼此隔离。
  - title: 1. Part III 背景：SOLID 要解决什么问题
    source_heading: 1. Part III 背景：SOLID 要解决什么问题
    paragraphs:
    - Be the basis of reusable components：成为可在多个系统使用的组件基础。
    - 即使中层结构设计良好，系统级依赖仍可能混乱。因此，作者讲完 SOLID 后还会继续讲组件原则和高层架构边界。
    - 作者从 20 世纪 80 年代后期开始，在 USENET 上与其他开发者讨论并整理设计原则。
    - 到 21 世纪初，五条原则逐渐稳定。大约在 2004 年，Michael Feathers 提醒作者：重新排列后，首字母正好组成 SOLID，于是这个名称诞生。
  - title: 3.3 事故如何发生
    source_heading: 3.3 事故如何发生
    paragraphs:
    - 会计部门决定调整普通工时的薪资计算方式，但 HR 仍希望报告沿用旧规则。
    - 按 CFO 团队要求修改共享函数；
    - HR 报告于是产生错误数据，最终给 COO 团队造成数百万美元预算损失。
  - title: 3.5 DRY 应该消除什么重复
    source_heading: 3.5 DRY 应该消除什么重复
    paragraphs:
    - 同一个业务不变量由多个模块各自判断。
    - 两个 actor 当前碰巧使用同一算法；
    - 两种业务政策当前碰巧有相同常量。
  - title: 4.2 为什么 Merge 有风险
    source_heading: 4.2 为什么 Merge 有风险
    paragraphs:
    - 测试覆盖了各自场景，却遗漏交互。
    - 在原书例子里，冲突直接让 CTO 与 COO 团队承担风险，甚至可能意外影响 CFO 的薪资逻辑。
  - title: 5. Solutions
    source_heading: 5. Solutions
    paragraphs:
    - 若客户端只想面对一个入口，这会增加使用复杂度。于是作者提出 Facade。
    - Facade 应尽量薄。若它开始包含薪资判断、报告格式和数据库逻辑，就会重新成为违反 SRP 的大类。
    - SRP 要求的是每个类中的方法家族共同服务一个 actor，而不是只允许一个函数。
    - 外部只看到该 actor 所需的稳定操作。这种作用域既提高内聚，也阻止不同 actor 依赖内部细节。
  - title: 作者的分析方法
    source_heading: 作者的分析方法
    paragraphs:
    - 作者没有直接给类图，而是先区分低层的「函数只做一件事」与 SRP 的「模块只对一个 actor 负责」。
    - 职责不是功能名称，而是对某个 actor 的责任。这个定义把代码结构与组织需求连接起来。
    - 作者展示数据分离、独立 Facade 和核心类 Facade 三种形式，说明原则决定边界，不决定唯一类图。
    - SRP、CCP 和 Axis of Change 是同一思想在类、组件和架构层面的表现，为后续章节建立连接。
  - title: 检查模块
    source_heading: 检查模块
    paragraphs:
    - 一个文件是否被不同团队频繁修改？
    - 方法是否分别服务不同 actor？
    - 一个 actor 的修改是否会影响另一个 actor 的测试？
    - 模块能否用一句「它对谁负责」解释？
  - title: 使用工程证据
    source_heading: 使用工程证据
    paragraphs:
    - 统计不同团队修改同一文件的频率；
    - 观察组件是否因不同原因一起发布。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - actor 是一个或一组以相同方式要求系统变化的人，不是单个用户、权限角色或并发 Actor。
    - SRP 与 Conway’s Law 相关，代码边界应尽量顺应组织中的真实变化边界。
    - 三个方法处理同一 Employee 数据，却因三个不同 actor 而变化，因此不应放在同一职责模块。
    - 不同 actor 同时修改 Employee 类会产生文本或语义 Merge 冲突。
  takeaways:
  - SRP 是 SOLID 中最容易因名称而被误解的原则之一。
  - Cohesion 是把对同一个 actor 负责的代码绑定在一起的力量。
  - 不同 actor 同时修改 Employee 类会产生文本或语义 Merge 冲突。
  - 若某项业务最核心，可以把主要方法留在原领域类，并让它代理较次要职责。
  - 本章最终要点不是「类有几项功能」，而是「多少独立 actor 能迫使这个模块改变」。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. SRP 就是一个类只做一件事」？
  answer: 错误。这是函数级重构原则。SRP 关注模块是否只对一个 actor 负责。
  source_heading: 1. SRP 就是一个类只做一件事
- level: 概念辨析
  question: 原文如何解释「5. Actor 就是系统角色或并发 Actor」？
  answer: 不是。它指引发某类变化的利益相关者群体，与权限角色和 Actor Model 是不同概念。
  source_heading: 5. Actor 就是系统角色或并发 Actor
- level: 概念辨析
  question: 原文如何解释「8. Facade 可以放一些业务逻辑」？
  answer: Facade 一旦混合不同 actor 的判断，就会重建原来的问题。它应主要负责委托和组合。
  source_heading: 8. Facade 可以放一些业务逻辑
- level: 概念辨析
  question: 原文如何解释「9. SRP 只适用于 OO 类」？
  answer: 任何由函数与数据形成的模块都能按 actor 检查，包括 C 模块、函数包和服务。
  source_heading: 9. SRP 只适用于 OO 类
- level: 概念辨析
  question: 原文如何解释「11. 技术团队天然就是 actor」？
  answer: DBA 在原书中是 actor，因为它代表独立存储变化。但不能只按组织图机械拆分；团队结构和业务变化模式都要考虑。
  source_heading: 11. 技术团队天然就是 actor
