overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 变化原因最终来自用户和利益相关者，因此作者把原则改写为只对一个 actor 负责。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 原书图示：Chapter 7 章首页 Single Responsibility Principle（SRP，单一职责原则）可能是 SOLID
      中最容易被误解的一条原则，主要原因就是它的名字。
    source_heading: 本章导读
  - term: 3.3 事故如何发生
    meaning: 会计部门决定调整普通工时的薪资计算方式，但 HR 仍希望报告沿用旧规则。
    source_heading: 3.3 事故如何发生
  - term: 4.2 为什么 Merge 有风险
    meaning: 在原书例子里，冲突直接让 CTO 与 COO 团队承担风险，甚至可能意外影响 CFO 的薪资逻辑。
    source_heading: 4.2 为什么 Merge 有风险
  - term: 5. Solutions
    meaning: Facade 应尽量薄。若它开始包含薪资判断、报告格式和数据库逻辑，就会重新成为违反 SRP 的大类。
    source_heading: 5. Solutions
  - term: 检查模块
    meaning: 一个 actor 的修改是否会影响另一个 actor 的测试？
    source_heading: 检查模块
  - term: 本章总结
    meaning: 三个方法处理同一 Employee 数据，却因三个不同 actor 而变化，因此不应放在同一职责模块。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 3.3 事故如何发生
  - 3.5 DRY 应该消除什么重复
