checks:
- level: 概念辨析
  question: 原文如何解释「7.1 分布式系统与微服务」？
  answer: 分布式系统是更宽的概念。任何通过消息协作的多节点系统都可以是分布式系统；微服务只是构造某类后端分布式应用的一种架构方式。单体应用配合远程数据库已经包含分布式交互，而把一个系统拆成微服务也不会自动获得可扩展性和韧性。
  source_heading: 7.1 分布式系统与微服务
- level: 概念辨析
  question: 原文如何解释「7.2 分区与复制」？
  answer: 分区会引入跨分区操作，复制会引入副本一致性。生产系统常同时使用二者，但二者的目的和代价不同。
  source_heading: 7.2 分区与复制
- level: 概念辨析
  question: 原文如何解释「7.3 性能与可扩展性」？
  answer: 一个高度优化的单线程程序可能当前性能很好，却无法横向扩展；一个可分片系统可能单请求开销较高，却能随节点数量增加处理更大总负载。
  source_heading: 7.3 性能与可扩展性
- level: 概念辨析
  question: 原文如何解释「7.4 韧性与维护性」？
  answer: 两者通过生产变更相连：许多故障来自变更，而良好的测试、渐进发布、观测和回退能力既提升维护性，也缩短故障影响。
  source_heading: 7.4 韧性与维护性
