overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 本章定位：分布式不是目的，而是约束下的选择」建立了怎样的核心认识？
  question_source: 0. 本章定位：分布式不是目的，而是约束下的选择
  thesis: 端口与适配器把业务规则和技术细节分开。 入站适配器把协议请求翻译成业务调用，出站适配器把业务需要翻译成基础设施操作，依赖方向指向业务定义的接口。
  thesis_source: 9. 核心结论
  concepts:
  - term: 0. 本章定位：分布式不是目的，而是约束下的选择
    meaning: 作者以 Leslie Lamport 的著名说法开篇，是为了强调分布式系统最反直觉的地方：本地程序的可用性可能依赖一个使用者甚至开发者都不知道的远端节点。
      单机程序里，失败通常就在本机；分布式系统里，依赖关系跨越进程、机器、网络和组织边界，故障来源和故障影响不再处于同一位置。
    source_heading: 0. 本章定位：分布式不是目的，而是约束下的选择
  - term: 2. Coordination：协调
    meaning: 任何有限轮消息都有“最后一条”。只要最后一条可能丢失，发送者就无法知道接收者是否收到，知识链便在最后一层断开。因此，在消息可能永久丢失、又要求双方百分之百确定同时行动的模型中，有限次确认不能解决问题。
    source_heading: 2. Coordination：协调
  - term: 5. Maintainability：可维护性
    meaning: DevOps 的核心也不是“让开发人员多做运维工作”，而是减少交接损失，通过自动化和共同责任让变更更快、更可靠。若只有责任转移而没有测试、部署、观测和自助平台支持，维护性并不会自然提高。
    source_heading: 5. Maintainability：可维护性
  - term: 6. Anatomy of a Distributed System：分布式系统的结构
    meaning: 现实中，一个进程可以有许多线程或异步任务，一个逻辑服务也可以由多个协作进程组成。此时要额外处理进程内并发和共享状态，但本书讨论的网络不确定性并不会消失。简化模型的价值在于分离两类复杂度：先研究分布式并发，再按需要叠加进程内并发。
    source_heading: 6. Anatomy of a Distributed System：分布式系统的结构
  - term: 7.4 韧性与维护性
    meaning: 两者通过生产变更相连：许多故障来自变更，而良好的测试、渐进发布、观测和回退能力既提升维护性，也缩短故障影响。
    source_heading: 7.4 韧性与维护性
  - term: 10. 从本章提炼出的通用解题方法
    meaning: 通过负载测试找出容量曲线，用故障演练验证隔离和自愈，用停机预算评估可用性，用发布指标验证变更风险。分布式系统设计不是只靠架构图推理，最终必须由运行证据检验。
    source_heading: 10. 从本章提炼出的通用解题方法
  logic:
  - 0. 本章定位：分布式不是目的，而是约束下的选择
  - 2. Coordination：协调
  - 4. Resiliency：韧性
  - 6. Anatomy of a Distributed System：分布式系统的结构
  - 7.2 分区与复制
  - 9. 核心结论
  - 10. 从本章提炼出的通用解题方法
  sections:
  - title: 0. 本章定位：分布式不是目的，而是约束下的选择
    source_heading: 0. 本章定位：分布式不是目的，而是约束下的选择
    paragraphs:
    - 作者以 Leslie Lamport 的著名说法开篇，是为了强调分布式系统最反直觉的地方：本地程序的可用性可能依赖一个使用者甚至开发者都不知道的远端节点。
      单机程序里，失败通常就在本机；分布式系统里，依赖关系跨越进程、机器、网络和组织边界，故障来源和故障影响不再处于同一位置。
    - 若全部数据和计算只存在于一个节点，该节点就是单点故障。Dropbox 一类存储服务会把数据复制到多个节点，使数据不随单个节点的丢失而丢失。故障期间能否立即从其他副本读取，还取决于副本协议、故障切换和系统的可用性设计。
    - 这类分布式解决的是总资源不足：一台机器只有有限的 CPU、内存、磁盘容量和网络带宽，而多台机器可以聚合资源。但资源数量相加不代表有效能力线性相加，因为系统还要支付通信、协调、数据移动和负载不均衡的成本。
    - 这四类理由可以同时存在。例如，全球网盘既天然分布，又要求数据不丢失，还要容纳海量数据并降低跨地域访问延迟。但设计时仍应分别识别它们，因为不同动机导向不同机制：为容量分片不等于为可用性复制，为低延迟建立边缘缓存也不等于获得强一致性。
  - title: 1. Communication：通信
    source_heading: 1. Communication：通信
    paragraphs:
    - 作者在引言中只提出问题，后续通信部分才逐层解决：可靠链路、安全链路、服务发现和 API。这样安排的关键在于，一次远程调用不是一次更慢的本地函数调用。远程调用多了编码、传输、超时、重试、身份和局部失败等语义。
    - 理想情况下，应用只调用网络库，不必关心底层细节。但作者提醒，抽象会泄漏：上层看似统一的接口无法隐藏所有底层故障。
    - 四种情况对业务补救方式完全不同。若直接重试，前两种情况可能恢复服务，第三种情况却可能重复扣款。这就是底层网络不确定性穿透上层“像函数一样调用”的抽象。
    - 可靠传输，不等于业务恰好执行一次。 TCP 等可靠传输协议可以处理字节丢失和乱序，但无法自动理解“创建订单”是否可重复。
  - title: 2. Coordination：协调
    source_heading: 2. Coordination：协调
    paragraphs:
    - 通信解决“节点能否交换信息”，协调解决“节点能否基于这些信息一致行动”。当多个节点共同维护状态、选择负责人或决定某操作是否提交时，它们必须形成某种共同认识。
    - 任何有限轮消息都有“最后一条”。只要最后一条可能丢失，发送者就无法知道接收者是否收到，知识链便在最后一层断开。因此，在消息可能永久丢失、又要求双方百分之百确定同时行动的模型中，有限次确认不能解决问题。
    - 这些做法都没有解决原始双将军模型，而是改变了信道或故障假设，或者降低了所要求的保证。本文据此提炼出后续阅读协调算法时应采用的思考方式：先问算法依赖什么系统模型、允许哪些故障、承诺什么结果。脱离前提讨论“保证一致”没有意义。
    - 误区三：双将军问题等同于拜占庭将军问题。 双将军问题聚焦不可靠信道和共同知识；拜占庭问题还考虑参与者可能任意或恶意地发送矛盾信息。两者都用“将军”叙事，但故障模型不同。
  - title: 4. Resiliency：韧性
    source_heading: 4. Resiliency：韧性
    paragraphs:
    - 现实往往更困难。机架断电、网络配置错误、软件缺陷和流量突增会同时影响许多组件，形成相关故障。一个组件失败还可能把流量转移到其他组件，增加它们的负载和故障概率，形成级联失败。
    - 每多一个 9，允许的不可用比例缩小 10 倍。三到四个 9 看似只差 0.09 个百分点，实际却把每日停机预算从 86.4 秒压缩到 8.64 秒，对检测、切换、发布和依赖服务提出显著更高要求。
    - 冗余只有在故障不同时击穿全部副本时才有效。把两个副本放在同一台机器、同一机架或同一故障域，能抵抗的故障范围有限。冗余也必须配合正确的切换和数据同步机制，否则可能得到两份同时不可用或彼此冲突的状态。
    - 一个服务可以“可访问”却返回错误结果，所以可用性不能代替正确性。一个系统也可以短暂不可用但数据从不损坏，因此可靠性和可用性需要分别定义。韧性则更强调系统面对扰动时的完整过程：承受、限制影响、恢复并学习。
  - title: 5. Maintainability：可维护性
    source_heading: 5. Maintainability：可维护性
    paragraphs:
    - 三类测试不是互相替代。单元测试提供快速、精确反馈；集成测试验证边界；端到端测试验证最重要的完整路径。分布式系统还需要关注超时、重试、部分故障、新旧版本共存等普通成功路径之外的情况。
    - 作者强调“安全发布到生产而不影响可用性”，是因为分布式系统通常无法像桌面程序那样统一停机后一次性替换。部署期间往往处于多版本共存状态，兼容性本身就是运行时要求。
    - DevOps 的核心也不是“让开发人员多做运维工作”，而是减少交接损失，通过自动化和共同责任让变更更快、更可靠。若只有责任转移而没有测试、部署、观测和自助平台支持，维护性并不会自然提高。
    - 作者把测试与运维放在同一章级挑战下，是因为“能修改”与“敢修改”不同。真正可维护的系统不仅代码结构清楚，还要让变更结果可验证、生产行为可观察、故障影响可控制。
  - title: 6. Anatomy of a Distributed System：分布式系统的结构
    source_heading: 6. Anatomy of a Distributed System：分布式系统的结构
    paragraphs:
    - 例如，“订单服务调用库存服务”在实现视角是 API 依赖；在运行时视角是两个进程交换 HTTP 消息；在物理视角可能是跨可用区的数据包传输。完整诊断往往需要切换视角，而不是寻找唯一“正确”的架构图。
    - 这种区分把“业务要做什么”与“技术上怎样传输和存储”分开。业务逻辑需要的是“保存订单”，并不必天然依赖 PostgreSQL 驱动；它需要的是一个仓储接口，由具体适配器实现。
    - 但接口不是越多越好。若只是给每个库函数机械套一层同形包装，并没有形成稳定的业务边界，只会增加跳转和维护成本。有效的端口应表达业务真正需要的能力，而不是泄漏具体驱动的
      API。
    - 现实中，一个进程可以有许多线程或异步任务，一个逻辑服务也可以由多个协作进程组成。此时要额外处理进程内并发和共享状态，但本书讨论的网络不确定性并不会消失。简化模型的价值在于分离两类复杂度：先研究分布式并发，再按需要叠加进程内并发。
  - title: 7.2 分区与复制
    source_heading: 7.2 分区与复制
    paragraphs:
    - 分区把不同数据或工作分给不同节点，主要解决容量和并行度；
    - 复制把相同数据或能力放到多个节点，主要服务于可用性、读取扩展和地域访问。
    - 分区会引入跨分区操作，复制会引入副本一致性。生产系统常同时使用二者，但二者的目的和代价不同。
  - title: 7.4 韧性与维护性
    source_heading: 7.4 韧性与维护性
    paragraphs:
    - 韧性关注故障发生后系统如何承受和恢复；
    - 维护性关注人如何持续修改、发布和操作系统。
    - 两者通过生产变更相连：许多故障来自变更，而良好的测试、渐进发布、观测和回退能力既提升维护性，也缩短故障影响。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - 分布式系统是一组靠消息协作的节点。 节点可以是机器，也可以是进程；选择哪种视角取决于要分析的问题。
    - 协调的难点来自局部知识。 双将军问题说明，在消息可能丢失的模型中，有限次确认无法创造绝对共同知识；算法保证必须连同故障模型一起理解。
    - 规模使小概率故障日常化。 系统应预期故障，通过冗余、隔离和自愈维持服务，而不是把“不出故障”当作设计前提。
    - 端口与适配器把业务规则和技术细节分开。 入站适配器把协议请求翻译成业务调用，出站适配器把业务需要翻译成基础设施操作，依赖方向指向业务定义的接口。
  - title: 10. 从本章提炼出的通用解题方法
    source_heading: 10. 从本章提炼出的通用解题方法
    paragraphs:
    - 用业务相关指标描述负载，再明确吞吐量、响应时间、错误率、可用性和数据正确性目标。没有目标，就无法定义容量，也无法判断设计是否有效。
    - 标出请求经过哪些服务、权威状态存在哪里、哪些调用跨进程、哪些接口由谁提供。端口与适配器能帮助把业务语义从传输和存储细节中分离出来。
    - 在设计阶段就考虑测试边界、版本兼容、渐进发布、观测、功能开关、扩缩容和恢复流程。一个只能在理想静态环境中工作的设计，不是完整的生产设计。
    - 通过负载测试找出容量曲线，用故障演练验证隔离和自愈，用停机预算评估可用性，用发布指标验证变更风险。分布式系统设计不是只靠架构图推理，最终必须由运行证据检验。
  takeaways:
  - 分布式系统是一组靠消息协作的节点。 节点可以是机器，也可以是进程；选择哪种视角取决于要分析的问题。
  - 网络调用具有不可消除的不确定性。 抽象可以简化接口，却不能替业务决定超时、重试、幂等和安全语义。
  - 容量是满足服务目标的边界。 越过容量后，排队、超时和重试可能让有效吞吐量不升反降。
  - 可用性必须转化为时间预算。 每增加一个 9，允许停机时间缩小十倍，架构和运维成本随之上升。
  - 端口与适配器把业务规则和技术细节分开。 入站适配器把协议请求翻译成业务调用，出站适配器把业务需要翻译成基础设施操作，依赖方向指向业务定义的接口。
