  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - 每个 domain service 独立部署，内部保留足够多的业务能力，使一次业务事务尽量在服务内部完成；
    - 因此，SBA 是 microservices 的一种混合变体，也是原书认为最务实、最灵活的架构风格之一。它仍是分布式架构，但通常比 microservices、event-driven
      architecture 等分布式风格简单、便宜。
    - 用“粗粒度领域服务 + 可选择的共享基础设施”获得单体所缺少的独立部署能力，同时避免细粒度微服务的大部分协调成本。
    - 原章没有给出数学公式或正式算法。本文中的变更半径、共同变更率、依赖密度、伪代码和 Python 示例都是帮助理解与落地的教学扩展，不是原书规定的行业标准。它们用于暴露权衡，不能替代业务语义和架构判断。
  - title: 2. Style Specifics：风格细节
    source_heading: 2. Style Specifics：风格细节
    paragraphs:
    - 在 API Facade 之下按子领域或业务能力组织组件，类似 modular monolith。这样可以在一个粗粒度服务内部继续保持模块边界，为以后拆分热点子域保留可能性。
    - 无论内部采用哪种设计，domain service 都需要一个供 UI 调用的 API access facade。它不仅做参数转换，还通常负责 orchestrating
      the business request。
    - 原章用 BASE transactions 描述细粒度分布式服务常采用的模式：basic availability、soft state、eventual
      consistency。其直觉是放弃跨服务的即时强一致，允许各服务在一段时间内处于不同状态，最终通过消息、重试或补偿收敛。
    - 适用前提是所有关键写入都能纳入同一数据库事务。若支付调用真实外部机构，数据库 rollback 无法“撤销已经发给外部系统的网络请求”，仍需要幂等键、对账或补偿机制。粗粒度服务降低分布式事务数量，但不会神奇地消除所有外部副作用。
  - title: 3.2 粗粒度带来的代价
    source_heading: 3.2 粗粒度带来的代价
    paragraphs:
    - 部署风险：一个发布包包含更多功能，出错可能影响整个订单领域；
    - 回归范围：即使只改一处，也要验证同一服务中的其他能力没有被破坏。
    - 微服务通过单一职责缩小单次发布范围，但换来了更多远程交互、部署单元和运维对象。粒度没有“越细越先进”的单调关系。
  - title: 3.4 如何形成合适的服务边界
    source_heading: 3.4 如何形成合适的服务边界
    paragraphs:
    - 作者的论证隐含了一个顺序：先识别领域内需要共同变化、共同提交的能力，再决定部署边界，而不是先追求服务数量。
    - 哪些团队能够独立拥有并发布这部分能力？
    - 拆开后是否会产生高频、同步、链式调用？
    - 若前两项很强而后三项不强，保留粗粒度 domain service 往往更合理。若某子域在变化率、扩展压力或安全边界上明显独立，再考虑拆分。
  - title: 5. API Gateway Options：API 网关变体
    source_heading: 5. API Gateway Options：API 网关变体
    paragraphs:
    - UI 可以直接访问 domain services，也可以在中间加入 reverse proxy 或 API Gateway。
    - 当某个 domain service 有多个实例时，网关可以把请求路由到健康实例。
    - 服务之间应尽量独立。跨领域流程若确实需要组合，原书倾向把 orchestration 放在 UI 或 API Gateway，而不是让 domain services
      形成相互调用网。
    - 判断原则是：身份认证、路由、限流、审计属于入口策略；订单能否接受、报价如何计算属于领域规则。
  - title: 7. Cloud Considerations：云环境考虑
    source_heading: 7. Cloud Considerations：云环境考虑
    paragraphs:
    - SBA 是分布式架构，因此适合云环境。domain services 虽然粗粒度，仍可分别部署、扩展和隔离。
    - 粗粒度服务包含较多组件、路由和长期运行逻辑，通常更适合作为 containerized service，而不是拆成许多短小 serverless functions。
    - 这不是说 serverless 被禁止，而是原章描述的典型实现偏向容器。若某个独立、事件触发、短时任务天然适合函数，仍可作为局部选择。
    - 云平台让增加实例容易，但复制粗粒度服务会复制其中所有功能，即使只有一个 API 是热点。这也是 SBA scalability 只有 3 星、elasticity
      只有 2 星的根本原因。
  - title: 9. Governance：治理
    source_heading: 9. Governance：治理
    paragraphs:
    - SBA 除了使用圈复杂度、scalability、responsiveness 等通用治理指标，还应针对“领域独立性”建立专门测试。
    - 为什么使用并集作分母：它把共同次数放到两者所有相关变化中归一化，避免“两个都很少改”或“一个改得特别多”造成仅看次数的误导。
    - 这不是说 UI 要包含领域规则，而是由组合层决定调用哪些独立业务能力，各 domain service 仍负责自己的业务不变量。
    - 如果把“跨服务调用数必须为 0”当硬 KPI，团队可能绕过 API 直接共享更多表；如果把“每次只改一个服务”当目标，团队可能隐瞒必要的契约变更。治理应优化系统整体协调成本，而不是优化某个容易计数的代理指标。
  - title: 11. Style Characteristics：架构特征
    source_heading: 11. Style Characteristics：架构特征
    paragraphs:
    - 本文评分表忠实采用图中的 3 星，同时保留正文的定性理由：服务故障通常不会直接拖垮其他领域服务，所以故障容错表现较好；但共享数据库、共享 UI 和粗粒度影响范围使它没有达到最高水平。阅读时不应把正文误写的“4
      星”静默当作图中事实。
    - SBA 是 domain-partitioned architecture。结构由订单、客户、评估等业务领域驱动，而不是由 presentation、business、persistence
      等技术职责驱动。
    - 微服务可能降低单次功能变更的开发范围，却提高协调与运维项；单体降低运维项，却可能提高大型变更和发布失败成本；SBA 在这些项之间寻找中间点。各项无法仅凭风格名称定量，必须结合组织成熟度和业务压力。
    - 这个优势的范围是特定 domain service 内部，不是整个分布式系统自动拥有全球 ACID。跨数据库、跨外部支付或跨 domain services
      时，仍需处理分布式一致性。
  - title: 13.3 误区：共享数据库一定是反模式
    source_heading: 13.3 误区：共享数据库一定是反模式
    paragraphs:
    - 在 microservices 中，跨服务共享数据库通常破坏自治；在 SBA 中，共享数据库是有意支持的拓扑，可以降低数据复制、远程调用和事务复杂度。
    - 真正的反模式是无边界地共享：所有服务任意读写所有表、所有实体放入一个库、schema change 没有影响分析。
  - title: 16. 核心结论
    source_heading: 16. 核心结论
    paragraphs:
    - 共享数据库在 SBA 中是合法拓扑。 它支持 join、强一致和低服务互调，但必须治理 schema change、表所有权与共同故障。
    - 一个全局 entity shared library 是反模式。 应按逻辑数据域拆分库，使依赖和变更影响可见。
    - UI、API Gateway 和数据库都可按需要拆分。 这些变体决定扩展性、安全区、故障隔离与 architecture quanta。
    - SBA 的优势是平衡而非极致。 它在可维护性、可测试性、可部署性和可演化性上表现强，同时接受一般的扩展性和较弱的弹性。
  takeaways:
  - SBA 是一种务实的分布式领域架构。 它用少量粗粒度服务获得独立部署，又避免全面微服务化的高协调成本。
  - 一个全局 entity shared library 是反模式。 应按逻辑数据域拆分库，使依赖和变更影响可见。
  - 约 12 个服务是经验警戒线，不是定律。 关注的是测试、部署、监控、连接和数据变更的综合协调成本。
  - 架构量子不等于服务数量。 共享 UI 或数据库可能让多个服务仍处在同一量子中。
  - 先用领域边界控制变化，再用运行证据决定哪里值得付出更细粒度分布式架构的成本。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「13.1 误区：Service-Based 就是“服务比较少的 Microservices”」？
  answer: 数量只是表象。真正差异是服务粒度、事务边界、数据拓扑和协调位置。SBA 主动把相关业务放在一个粗粒度领域服务内，微服务则倾向细分为单一能力。
  source_heading: 13.1 误区：Service-Based 就是“服务比较少的 Microservices”
- level: 概念辨析
  question: 原文如何解释「13.4 误区：一个共享 Entity Library 最省事」？
  answer: 它只在初始开发时看似省事，长期会把任意表变更传播给全部服务。应按逻辑数据域拆分库，并明确服务依赖。
  source_heading: 13.4 误区：一个共享 Entity Library 最省事
- level: 概念辨析
  question: 原文如何解释「13.8 误区：网关应包含所有业务编排」？
  answer: 网关可组合独立领域能力，但领域规则仍应属于 domain service。否则网关会成为新的集中式业务单体。
  source_heading: 13.8 误区：网关应包含所有业务编排
- level: 概念辨析
  question: 原文如何解释「13.11 误区：使用 SBA 就自动拥有全系统 ACID」？
  answer: ACID 优势主要位于单个 domain service 的事务范围内。跨服务、跨数据库或外部系统副作用仍需最终一致性、幂等或补偿。
  source_heading: 13.11 误区：使用 SBA 就自动拥有全系统 ACID
- level: 概念辨析
  question: 原文如何解释「13.14 误区：评分表说明 Fault Tolerance 是 4 星」？
  answer: 图 14-8 是 3 星，正文中的“four-star rating”是原文内部不一致。应区分精确图表事实与正文定性分析。
  source_heading: 13.14 误区：评分表说明 Fault Tolerance 是 4 星
