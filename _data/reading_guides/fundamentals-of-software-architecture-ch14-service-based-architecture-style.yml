  thesis: 共享数据库在 SBA 中是合法拓扑。 它支持 join、强一致和低服务互调，但必须治理 schema change、表所有权与共同故障。
  thesis_source: 16. 核心结论
  concepts:
  - term: 0. 本章要解决什么问题
    meaning: 原章没有给出数学公式或正式算法。本文中的变更半径、共同变更率、依赖密度、伪代码和 Python 示例都是帮助理解与落地的教学扩展，不是原书规定的行业标准。它们用于暴露权衡，不能替代业务语义和架构判断。
    source_heading: 0. 本章要解决什么问题
  - term: 3.2 粗粒度带来的代价
    meaning: 微服务通过单一职责缩小单次发布范围，但换来了更多远程交互、部署单元和运维对象。粒度没有“越细越先进”的单调关系。
    source_heading: 3.2 粗粒度带来的代价
  - term: 5. API Gateway Options：API 网关变体
    meaning: 服务之间应尽量独立。跨领域流程若确实需要组合，原书倾向把 orchestration 放在 UI 或 API Gateway，而不是让 domain
      services 形成相互调用网。
    source_heading: 5. API Gateway Options：API 网关变体
  - term: 7. Cloud Considerations：云环境考虑
    meaning: 云平台让增加实例容易，但复制粗粒度服务会复制其中所有功能，即使只有一个 API 是热点。这也是 SBA scalability 只有 3
      星、elasticity 只有 2 星的根本原因。
    source_heading: 7. Cloud Considerations：云环境考虑
  - term: 11. Style Characteristics：架构特征
    meaning: 本文评分表忠实采用图中的 3 星，同时保留正文的定性理由：服务故障通常不会直接拖垮其他领域服务，所以故障容错表现较好；但共享数据库、共享
      UI 和粗粒度影响范围使它没有达到最高水平。阅读时不应把正文误写的“4 星”静默当作图中事实。
    source_heading: 11. Style Characteristics：架构特征
  - term: 16. 核心结论
    meaning: 共享数据库在 SBA 中是合法拓扑。 它支持 join、强一致和低服务互调，但必须治理 schema change、表所有权与共同故障。
    source_heading: 16. 核心结论
