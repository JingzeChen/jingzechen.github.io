overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章主线」建立了怎样的核心认识？
  question_source: 0. 本章主线
  thesis: 应用题的关键是选择堆方向和堆中状态：动态第 k 大使用大小为 k 的小根堆；多路归并只存每路当前头；滑动窗口为元素附加下标并惰性删除；团队表现按效率排序后用小根堆最大化速度和；双端雇佣则让堆精确对应当前可选集合。
  thesis_source: 本章总结
  concepts:
  - term: 0. 本章主线
    meaning: 普通队列按到达时间决定顺序，优先队列按一个可比较的优先级决定谁先离开。二叉堆用完全二叉树维持“堆顶最优”，适合动态最值、Top-k、多路归并和贪心候选维护。
    source_heading: 0. 本章主线
  - term: 9.1 优先队列概述
    meaning: 大小为 k 的堆适合只关心 Top-k 或第 k 名、且被淘汰元素以后永远不可能重新入选的场景。动态第 k 大满足这一点；滑动窗口却不满足，因为当前较小的元素可能在旧最大值离窗后重新成为答案，不能只保留窗口中最大的固定若干项。
    source_heading: 9.1 优先队列概述
  - term: 9.2 优先队列的实现
    meaning: 扫描数据，堆中始终保留已扫描部分最大的 k 个元素：不足 k 直接压入；超过 k 时弹出最小值。最终堆顶是这 k 个最大值中最小者，也就是全局第
      k 大。
    source_heading: 9.2 优先队列的实现
  - term: 9.3 优先队列应用的算法设计
    meaning: "“速度和”希望越大越好，“最小效率”却由团队短板决定，二者不能分别贪心。把工程师按效率降序处理；遍历到效率 e 时，前缀中所有人效率都至少为
      e。若把当前阈值视为团队最低效率，只需在该前缀选择至多 k 个最大速度。"
    source_heading: 9.3 优先队列应用的算法设计
  - term: 三种语言中的实现差异
    meaning: Python 用负值模拟数值大根堆；负号技巧不适合所有自定义对象，复合键应显式设计。
    source_heading: 三种语言中的实现差异
  - term: 本章总结
    meaning: 应用题的关键是选择堆方向和堆中状态：动态第 k 大使用大小为 k 的小根堆；多路归并只存每路当前头；滑动窗口为元素附加下标并惰性删除；团队表现按效率排序后用小根堆最大化速度和；双端雇佣则让堆精确对应当前可选集合。
    source_heading: 本章总结
