  question: 原文围绕「Katib 的原章定位」建立了怎样的核心认识？
  question_source: Katib 的原章定位
  thesis: Experiment 管 optimization goal/budget，Suggestion 管 ask，Trial 管单次 evaluation，TrialJob
    管 actual execution definition。
  thesis_source: 核心结论
