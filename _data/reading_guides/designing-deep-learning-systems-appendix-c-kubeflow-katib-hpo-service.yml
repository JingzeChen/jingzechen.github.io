  sections:
  - title: Katib 的原章定位
    source_heading: Katib 的原章定位
    paragraphs:
    - Framework / programming-language agnostic；
    - Kubernetes-native，可 standalone 运行；
    - Neural architecture search（NAS）；
    - 这些是作者成书时的总体评价。当前采用仍需按目标版本、规模、算法、metrics path、Kubernetes distribution 和 operation
      team 做 POC。
  - title: C.2 Getting Started with Katib
    source_heading: C.2 Getting Started with Katib
    paragraphs:
    - 若 training 每 epoch 打印 accuracy，选择 max 可能偏向偶然峰值；latest 反映最终 epoch；best validation
      + early stopping 则是另一语义。Metric strategy 是 objective definition 的一部分，不能忽略。
    - Katib 需要知道哪个 container 是主要 training container，以便 metrics collector injection、command
      substitution 和 status association。多 container Pod 中不能模糊。
    - Katib 用 CRDs 表达 Experiment、Suggestion、Trial 及其 spec/status；controllers watch/reconcile；training
      workloads 是 Job / PyTorchJob 等 resources。
    - Controller names、sidecar names、paths 和 commands 可能随版本变化。Troubleshooting 的稳定方法是沿
      resource ownership：Experiment → Trial → TrialJob → Pod → container / collector
      → controllers，而不是死记某个 Pod name。
  - title: C.4 Katib System Design
    source_heading: C.4 Katib System Design
    paragraphs:
    - 作者认为 Katib 虽是 production HPO system，核心却相对容易读：Experiment、Suggestion、Trial 都遵循同一个
      Kubernetes controller/operator pattern。理解一个 controller 的 reconcile loop，就掌握了阅读其他组件的共同语法。
    - 训练启动后，metrics collector sidecar 从 StdOut/File/Event 等来源解析 metrics，报告到 Katib
      metric storage。原章架构快照明确为 MySQL；当前 deployment 的 storage/DB-manager 实现应查目标版本。
    - 更精确地说，CRDs 是 durable checkpoints / source of coordination state，不一定包含完整 raw
      metrics、logs、model artifacts。恢复能力取决于 child resources、metric storage 和 ownership
      metadata 是否仍在。
    - Experiment controller 管全局目标/预算，Suggestion controller 管 ask，Trial controller
      管 execution/tell，Training Operators 管 framework-specific Pods。CRDs 既是 API，也是组件之间的
      durable coordination protocol。
  - title: C.6 Further Reading
    source_heading: C.6 Further Reading
    paragraphs:
    - A Scalable and Cloud-Native Hyperparameter Tuning System：理解 Katib design thinking、requirements、architecture
      和 evaluation。
    - Official docs：feature updates、installation、tutorials、API/config；
    - SDK generated object 最终仍应可审计、versioned，并记录 Experiment spec。
    - 先建立可运行 mental model，再读 paper/source；否则容易只理解组件名字，无法把 API、controller 和 runtime
      对齐。
  - title: 五层 Mental Model
    source_heading: 五层 Mental Model
    paragraphs:
    - 关注 search efficiency、parallel suggestion、early stopping bias 和 convergence。
    - 关注 parameter substitution、framework resource、resources、distributed roles。
    - 关注 metric name/regex/step/timestamp/strategy/availability。
    - 关注 idempotency、retry、eventual consistency、recovery、versioning、operations。
  - title: Objective and Science
    source_heading: Objective and Science
    paragraphs:
    - Objective direction/name/strategy 正确；
    - Search space scale/bounds 合理；
    - Random seeds/repeats policy 明确；
    - Best Trial 有独立 test/retrain gate。
  - title: Experiment Spec
    source_heading: Experiment Spec
    paragraphs:
    - Objective/algorithm/parameters fields 通过目标 CRD schema；
    - Trial/failure/concurrency budgets 有依据；
    - Collector type/namespace label 正确；
    - Sidecar/service-mesh interactions 验证；
  - title: Reliability and Operations
    source_heading: Reliability and Operations
    paragraphs:
    - Controller/suggestion/operator restart tested；
    - Duplicate TrialJob prevention tested；
    - Experiment deletion/finalizer/TTL tested；
    - Upgrade/schema migration/rollback plan；
  - title: 核心结论
    source_heading: 核心结论
    paragraphs:
    - Experiment 管 optimization goal/budget，Suggestion 管 ask，Trial 管单次 evaluation，TrialJob
      管 actual execution definition。
    - Container 让 Katib framework/language agnostic，但 reproducibility 仍需 image/data/seed/artifact
      versioning。
    - Parallel Trials、distributed training、early stopping 分别优化 HPO 批次数、单 Trial latency
      和坏 Trial steps，不能混为一谈。
    - Katib 适合已有 Kubernetes training platform、multi-team、long-running remote Trials
      与 platform ownership 的组织。
  - title: 自测题参考答案
    source_heading: 自测题参考答案
    paragraphs:
    - Experiment 是完整 optimization run；Suggestion 是算法给出的 assignments；Trial 是一次 assignment
      evaluation；TrialJob 是 Job/PyTorchJob 等 actual workload resource。
    - Experiment controller 请求 Suggestion；Suggestion controller 调算法；Experiment 创建
      Trial；Trial controller 执行并回写 observation；Experiment 聚合后请求下一批。
    - Pod → metric collector → metric storage/DB manager → Trial controller/status
      → Experiment controller/status → current optimal Trial；exact version may vary。
    - Request 至少有 Experiment/search space、objective/settings、past Trials/metrics、requested
      count；response 是 typed in-space assignments。
  takeaways:
  - Katib 把 HPO 从 process-local algorithm 提升为 Kubernetes-native remote service。
  - Container 让 Katib framework/language agnostic，但 reproducibility 仍需 image/data/seed/artifact
    versioning。
  - Median stopping rule 节约成本，但依赖 comparable learning curves，并有错杀 slow starter 的风险。
  - Custom algorithm 的最小闭环是 Suggestion API → algorithm → gRPC/health → image → config
    → tests。
  - 是否采用 Katib 应比较 end-to-end time-to-quality 与 TCO，而非只比较算法列表。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「误区 1：Katib 就是一个 HPO Algorithm」？
  answer: Katib 是 HPO service/control plane；算法只是独立 Suggestion service。Trial scheduling、metrics、status、operators、recovery
    同样关键。
  source_heading: 误区 1：Katib 就是一个 HPO Algorithm
- level: 概念辨析
  question: 原文如何解释「误区 4：打印 Accuracy 就能收集」？
  answer: Metric name、format、timestamp/step、collector、namespace injection、strategy
    都必须匹配。
  source_heading: 误区 4：打印 Accuracy 就能收集
- level: 概念辨析
  question: 原文如何解释「误区 8：Distributed Training 等于 HPO Parallelism」？
  answer: 前者在一个 Trial 内扩 workers，后者并发多个 Trials；组合后资源乘法增长。
  source_heading: 误区 8：Distributed Training 等于 HPO Parallelism
- level: 概念辨析
  question: 原文如何解释「误区 11：Experiment Status 是强一致实时状态」？
  answer: 它是 controllers 聚合的 eventually consistent view；Pod、Trial、Experiment 短暂不同步是正常的。
  source_heading: 误区 11：Experiment Status 是强一致实时状态
- level: 概念辨析
  question: 原文如何解释「误区 15：Katib 永远优于 Library」？
  answer: Katib 的共享治理/恢复优势以 Kubernetes 和平台运维成本为代价；小团队/原型常更适合 library 或 managed service。
  source_heading: 误区 15：Katib 永远优于 Library
