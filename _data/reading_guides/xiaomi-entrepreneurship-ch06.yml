overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、七字诀是一套完整方法」建立了怎样的核心认识？
  question_source: 一、七字诀是一套完整方法
  thesis: 专注：使命定边界，洞察找机会，目标配能力，克制贪婪。 +> 最小切口：先完整解决一个迫切、普遍、可说明的问题。 +> 业务扩张：符合使命、强协同、体验一致、资源支持。
    +> 全局对表：局部收入增长不等于公司整体变强。 +> 极致：在正确方向做到能力极限，并寻找当下最优解。 +> 反对自嗨：投入必须形成用户价值、核心竞争力和长期能力。
    +> 口碑：真实体验超过预期，并覆盖产品、服务和沟通全部触点。 +> 口碑验证：多路交叉，核心用户看意见点，大众用户看印象面，直面负面反馈。 +> 品牌：把流动口碑沉淀为长期综合认知。
  thesis_source: 二十九、七字诀的整体应用
  concepts:
  - term: 一、七字诀是一套完整方法
    meaning: 快让团队及时修正方向，进入下一轮改善。
    source_heading: 一、七字诀是一套完整方法
  - term: 八、极致的准确含义
    meaning: 材料技术进步让氮化镓充电器在更小体积中提供高功率。小米与上游伙伴长期合作，最终推出 65W 充电器，可为手机、平板和笔记本充电，让用户出差只带一个充电器。
    source_heading: 八、极致的准确含义
  - term: 十五、极致是对未来能力的投资
    meaning: 苹果与供应商历时多年、多次濒临放弃，最终把多点触控电容屏变成可量产的自然交互方式。触摸屏早已存在，真正突破是重新定义手指操作体验并坚持工程实现。
    source_heading: 十五、极致是对未来能力的投资
  - term: 十八、“用户口碑永远是对的”怎样理解
    meaning: 问题在于：新品牌尚未证明自身价值，产品定价又超出用户对小米平台“厚道”的预期。团队讲的成本事实无法改变用户形成的整体印象。
    source_heading: 十八、“用户口碑永远是对的”怎样理解
  - term: 23.2 技术产品、用户经营与品牌必须统一
    meaning: 小米早期团队是发烧友，产品是发烧级旗舰，用户也是发烧友，三者高度一致。用户扩展到大众和高端人群后，原有体系需要重建。
    source_heading: 23.2 技术产品、用户经营与品牌必须统一
  - term: 二十九、七字诀的整体应用
    meaning: 专注：使命定边界，洞察找机会，目标配能力，克制贪婪。 +> 最小切口：先完整解决一个迫切、普遍、可说明的问题。 +> 业务扩张：符合使命、强协同、体验一致、资源支持。
      +> 全局对表：局部收入增长不等于公司整体变强。 +> 极致：在正确方向做到能力极限，并寻找当下最优解。 +> 反对自嗨：投入必须形成用户价值、核心竞争力和长期能力。
      +> 口碑：真实体验超过预期，并覆盖产品、服务和沟通全部触点。 +> 口碑验证：多路交叉，核心用户看意见点，大众用户看印象面，直面负面反馈。 +> 品牌：把流动口碑沉淀为长期综合认知。
    source_heading: 二十九、七字诀的整体应用
  logic:
  - 一、七字诀是一套完整方法
  - 八、极致的准确含义
  - 十二、无限追求当下的最优解
  - 十八、“用户口碑永远是对的”怎样理解
  - 二十、口碑标准会不断变化
  - 二十五、快的四种能力
  - 二十九、七字诀的整体应用
  sections:
  - title: 一、七字诀是一套完整方法
    source_heading: 一、七字诀是一套完整方法
    paragraphs:
    - 口碑检验用户是否真正感受到价值；
    - 快让团队及时修正方向，进入下一轮改善。
  - title: 五、决定不做什么同样重要
    source_heading: 五、决定不做什么同样重要
    paragraphs:
    - 专业级便携。 原书图示：乔布斯重返苹果后划定的产品规划四象限这个方法的价值是让团队、用户和渠道都能理解产品结构，并把研发集中到少数关键产品。
    - 苹果从亏损走向盈利不只由专注造成，还包括产品创新、成本调整和市场环境；但砍掉混乱项目为后续改变释放了资源。
    - 简化产品线不是追求形式上的少，而是让每款产品都有明确人群和不可替代的理由。
  - title: 八、极致的准确含义
    source_heading: 八、极致的准确含义
    paragraphs:
    - 极致不是所有指标都最高，也不是无限增加成本。它必须建立在专注的正确方向上。
    - 很多产品缺陷存在太久后，人们会习惯。极致首先要求对丑、难用和不合理保持敏感，并愿意追问能否改变。
    - 雷军长期不理解为什么笔记本充电器笨重难看。小米进入笔记本业务后，提出在性能、安全、可靠前提下，把充电器做小、做轻、做好看。
    - 材料技术进步让氮化镓充电器在更小体积中提供高功率。小米与上游伙伴长期合作，最终推出 65W 充电器，可为手机、平板和笔记本充电，让用户出差只带一个充电器。
  - title: 十二、无限追求当下的最优解
    source_heading: 十二、无限追求当下的最优解
    paragraphs:
    - 最优解不是某个参数最高，而是在当时技术、成本和用户需求下，用更简单或更集成的方式创造最大整体价值。
    - 小米团队研究过 652 种解锁方案，仍认为当时苹果滑动解锁更好；MIUI 把发送短信从通常的六步简化为三步。
    - 原书图示：MIUI 百变主题好的集成不是把所有功能塞在一起，而是先梳理需求结构，再提供清楚、可扩展的体系。
    - MIUI 计算器不只做加减乘除，还提供过程回看、数字复制修改、汇率和单位换算、个税房贷及亲戚称呼计算。团队把它从单一工具变成数字计算和换算服务入口。
  - title: 十五、极致是对未来能力的投资
    source_heading: 十五、极致是对未来能力的投资
    paragraphs:
    - 手机是每天长时间握持的设备，材质直接影响手感、耐磨和外观。陶瓷有独特价值，却存在硬度高、成型难、良率低和成本高等问题。
    - 小米在早期失败后继续投入试验，最终从小米 5 陶瓷背壳发展到 MIX 系列一体化和彩色、轻量化陶瓷，形成可持续工艺能力。
    - 区别在于：陶瓷不是遮盖普通产品的装饰，而是建立在旗舰性能基础上的真实体验创新，并通过多代产品不断进化。
    - 苹果与供应商历时多年、多次濒临放弃，最终把多点触控电容屏变成可量产的自然交互方式。触摸屏早已存在，真正突破是重新定义手指操作体验并坚持工程实现。
  - title: 十八、“用户口碑永远是对的”怎样理解
    source_heading: 十八、“用户口碑永远是对的”怎样理解
    paragraphs:
    - 用户对自己是否满意的感受一定真实，企业不能用投入很多、技术先进或同行也这样来反驳。
    - 一家生态链公司在小米平台销售约 4000 元的自有品牌高端空调。团队认为产品投入大、利润不高，却遭到用户批评。
    - 问题在于：新品牌尚未证明自身价值，产品定价又超出用户对小米平台“厚道”的预期。团队讲的成本事实无法改变用户形成的整体印象。
    - 品牌信任会在平台和产品之间外溢。一款产品突破既有价格认知，需要先用连续价值获得用户许可。
  - title: 二十、口碑标准会不断变化
    source_heading: 二十、口碑标准会不断变化
    paragraphs:
    - 一家企业产品进入高端后，原材料和生产标准没有下降，用户满意度却下滑。原因恰恰是标准“没有变化”：价格和定位提高后，用户开始关注过去可以接受的细节。
    - MIX Fold 面向高端商务用户。团队原计划在发布后通过更新交付 PC 模式，这种做法早期发烧友能够接受，商务用户却认为发布时承诺的功能应立即完整可用。
    - 同一种开发方式，在不同人群中可能得到相反评价。企业不能把核心用户习惯当作所有用户习惯。
    - 竞争者持续改善后，过去领先的体验会变成基本要求。保持原标准看似稳定，实际相对位置正在下降。
  - title: 23.2 技术产品、用户经营与品牌必须统一
    source_heading: 23.2 技术产品、用户经营与品牌必须统一
    paragraphs:
    - 小米早期团队是发烧友，产品是发烧级旗舰，用户也是发烧友，三者高度一致。用户扩展到大众和高端人群后，原有体系需要重建。
    - 如果品牌说高端，产品和服务仍停留在旧水平；或技术很强，沟通却只强调便宜，都会造成认知错位。
  - title: 二十五、快的四种能力
    source_heading: 二十五、快的四种能力
    paragraphs:
    - 某手机巨头的高管认真记录雷军提出的问题，两年后却几乎没有改善，说明个人诚意无法弥补系统失灵。组织快必须让四种能力连成闭环。
    - 微软高管曾不理解 MIUI 怎样每周更新。小米通过双系统分区，使更新失败时可以回退旧版本，并配合内测版、开发版、稳定版、社区反馈和高自驱团队。
  - title: 二十九、七字诀的整体应用
    source_heading: 二十九、七字诀的整体应用
    paragraphs:
    - 定期重新检查技术、用户和口碑标准是否变化；
    - 它们不是新增的独立理论，而是专注、极致、口碑、快在制造业和商业模式中的具体化。
    - 专注：使命定边界，洞察找机会，目标配能力，克制贪婪。 +> 最小切口：先完整解决一个迫切、普遍、可说明的问题。 +> 业务扩张：符合使命、强协同、体验一致、资源支持。
      +> 全局对表：局部收入增长不等于公司整体变强。 +> 极致：在正确方向做到能力极限，并寻找当下最优解。 +> 反对自嗨：投入必须形成用户价值、核心竞争力和长期能力。
      +> 口碑：真实体验超过预期，并覆盖产品、服务和沟通全部触点。 +> 口碑验证：多路交叉，核心用户看意见点，大众用户看印象面，直面负面反馈。 +> 品牌：把流动口碑沉淀为长期综合认知。
    - "+> 快：洞察快、响应快、决策快、改善快。 +> 局部慢：质量、战略和长期能力不能为表面速度让路。 +> 核心关系：专注产生资源密度，极致创造超预期，口碑带来信任，快推动持续进化。"
  takeaways:
  - 快让团队及时修正方向，进入下一轮改善。
  - 材料技术进步让氮化镓充电器在更小体积中提供高功率。小米与上游伙伴长期合作，最终推出 65W 充电器，可为手机、平板和笔记本充电，让用户出差只带一个充电器。
  - 品牌信任会在平台和产品之间外溢。一款产品突破既有价格认知，需要先用连续价值获得用户许可。
  - 如果品牌说高端，产品和服务仍停留在旧水平；或技术很强，沟通却只强调便宜，都会造成认知错位。
  - "+> 快：洞察快、响应快、决策快、改善快。 +> 局部慢：质量、战略和长期能力不能为表面速度让路。 +> 核心关系：专注产生资源密度，极致创造超预期，口碑带来信任，快推动持续进化。"
