overview:
  kind: summary
  minutes: 12
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 本章讨论怎样持续更新生产模型以适应变化。作者把基础设施现代化描述为四阶段：从手工、每次从头训练，演进到自动、无状态，再到自动、有状态，最终由环境信号触发候选更新。
  thesis_source: 7. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：持续学习不是让生产模型自行吸收一切新样本，而是让组织可以在需要时快速生成候选更新，并用可复现、可审计、可回滚的证据决定是否晋级。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Continual Learning：持续学习
    meaning: 经典 collaborative filtering 先构造大 user–item matrix，再做矩阵分解或降维。新增数据后若需重做全矩阵分解，频繁更新很贵。现代系统也有增量
      ALS、online matrix factorization 或 embedding 方法，因此这是对特定算法实现的比较，不是矩阵模型的绝对限制。
    source_heading: 2. Continual Learning：持续学习
  - term: 4. How Often to Update Your Models：模型应该多久更新一次
    meaning: 原章引用 Facebook 2014 ads CTR 实验：从每周改为每日重训，loss 约降低 1%，团队认为足以切换 pipeline。另引用
      Weibo 2019 分享，说明有公司更新到数分钟级。
    source_heading: 4. How Often to Update Your Models：模型应该多久更新一次
  - term: 6. 评估流程的 owner 与自动化
    meaning: "“谁来运行”不一定意味着独立团队手工审批每个版本，而是：标准由跨职能 owner 制定，自动化系统一致执行，风险例外由明确责任人审查。开发者不能单方面改掉失败门槛。"
    source_heading: 6. 评估流程的 owner 与自动化
  - term: 9. 本章知识结构
    meaning: Shadow、canary、A/B、interleaving、bandit 不是递进排名，而是分别优化安全、因果证据、排序效率和在线 regret。
    source_heading: 9. 本章知识结构
  - term: 11. 作者分析问题的方法与可迁移解题框架
    meaning: Pipeline 自动完成 data validation、label/feature build、training、artifact registration
      和 offline evaluation。输出是 candidate，不是 production deployment。
    source_heading: 11. 作者分析问题的方法与可迁移解题框架
  logic:
  - 0. 本章要回答的核心问题
  - 2. Continual Learning：持续学习
  - 3. Four Stages of Continual Learning：持续学习的四个阶段
  - 6. 评估流程的 owner 与自动化
  - 7. 原章总结的完整还原
  - 10. 核心结论
  - 11. 作者分析问题的方法与可迁移解题框架
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Continual、online、continuous learning 与 continuous delivery 有何区别？
    - Model-selection bandit 与 contextual bandit 的 arm、context、reward 各是什么？
    - Partial feedback、propensity logging 与 off-policy evaluation 有什么关系？
    - 一句话概括：持续学习不是让生产模型自行吸收一切新样本，而是让组织可以在需要时快速生成候选更新，并用可复现、可审计、可回滚的证据决定是否晋级。
  - title: 1. 从第 8 章到第 9 章：发现退化之后怎么办
    source_heading: 1. 从第 8 章到第 9 章：发现退化之后怎么办
    paragraphs:
    - 怎样确认更新后的模型在真实环境中更好且没有灾难性后果。
    - 静态离线测试集无法代表不断变化的未来分布；只看线上指标又可能先伤害用户。因此可靠系统必须把离线 sanity check、时间回测和受控线上验证串起来。
  - title: 2. Continual Learning：持续学习
    source_heading: 2. Continual Learning：持续学习
    paragraphs:
    - 增加 layer 会改变参数拓扑；增加 feature 会改变输入 schema，所以旧 checkpoint 不能无条件加载。Knowledge transfer、distillation、model
      surgery 可以把兼容权重迁移过去，但需要明确哪些参数复用、哪些重置，并重新验证。
    - 原章称 Alibaba 在 2019 年以 1.03 亿美元收购 Apache Flink 核心团队 Data Artisans，并将 Singles
      Day 推荐列为重要 ML 使用场景；脚注也提醒收购可能还包含扩大开源影响力的目标。该数字是历史案例，不证明“购买流处理框架就能获得持续学习”。
    - 原章提到 Snorkel 等 programmatic labeling 与 crowdsourcing 可加速标注。它们得到的是噪声或弱监督标签，应估计
      coverage、conflict、annotator agreement 和 slice bias；快标签不能无条件替代专家真值。
    - 经典 collaborative filtering 先构造大 user–item matrix，再做矩阵分解或降维。新增数据后若需重做全矩阵分解，频繁更新很贵。现代系统也有增量
      ALS、online matrix factorization 或 embedding 方法，因此这是对特定算法实现的比较，不是矩阵模型的绝对限制。
  - title: 3. Four Stages of Continual Learning：持续学习的四个阶段
    source_heading: 3. Four Stages of Continual Learning：持续学习的四个阶段
    paragraphs:
    - 团队早期优先覆盖新业务问题。原章以电商为例，依次开发 fraud detection、product recommendation、seller abuse
      和 shipping-time 模型；维护旧模型被排到后面。
    - 最简单 model store 可是按约定目录组织的 S3 blob；但 object storage 自身不自动提供语义版本、搜索、审批和 lineage。原章举
      SageMaker 与开源 MLflow 为更成熟选择；具体能力以当前版本为准。
    - 生产请求已在线提取过 features。把当时真正送入模型的 feature vector 连同 request/model/feature version
      记录下来，等待标签成熟后直接训练，称 log and wait。
    - 这样可以区分“新数据确有价值”与“版本链正在积累错误”。若 stateful 持续输给 stateless，应检查 replay、learning rate、optimizer
      reset、label noise 和 feature statistics。
  - title: 4. How Often to Update Your Models：模型应该多久更新一次
    source_heading: 4. How Often to Update Your Models：模型应该多久更新一次
    paragraphs:
    - a 是训练窗口与测试期之间的 age，w 是训练窗口长度，s 是 cutoff。只改变 a 才主要估 freshness；若同时改变样本量、季节覆盖、超参数或
      label maturity，就会混杂。
    - 原章引用 Facebook 2014 ads CTR 实验：从每周改为每日重训，loss 约降低 1%，团队认为足以切换 pipeline。另引用 Weibo
      2019 分享，说明有公司更新到数分钟级。
    - 二者争夺实验、算力和工程资源。作者给出判断例：新架构要 100 倍训练计算只带来 1% 改善，而最近三小时数据只需 1 倍计算也带来 1%，应优先 data
      iteration。
    - 短期选择效率更高者，但不能永远只迭代数据：架构上限、坏目标和缺失 feature 不会被更多新数据自动修复。反过来，环境变化快时反复搜架构也替代不了 data
      refresh。
  - title: 6. 评估流程的 owner 与自动化
    source_heading: 6. 评估流程的 owner 与自动化
    paragraphs:
    - 作者在 bandits 后强调：好评估不仅是“测什么”，也是“谁来测、怎样保证一致”。
    - 已知模型背景，使用方式不同于普通用户；
    - 容易选择有利 slice 或指标；
    - "“谁来运行”不一定意味着独立团队手工审批每个版本，而是：标准由跨职能 owner 制定，自动化系统一致执行，风险例外由明确责任人审查。开发者不能单方面改掉失败门槛。"
  - title: 7. 原章总结的完整还原
    source_heading: 7. 原章总结的完整还原
    paragraphs:
    - 本章讨论怎样持续更新生产模型以适应变化。作者把基础设施现代化描述为四阶段：从手工、每次从头训练，演进到自动、无状态，再到自动、有状态，最终由环境信号触发候选更新。
    - "“多久更新一次”没有行业统一答案。应通过历史时间窗口实验测量数据新鲜度的价值，并在 model iteration 与 data iteration
      之间分配资源。"
    - Continual learning 与第 7 章 online prediction 类似，都受益于成熟 streaming infrastructure。训练本身可以
      micro-batch；在线反馈、实时标签和 production evaluation 更需要 streaming。原章列 Spark Streaming、Snowflake
      Streaming、Materialize、Decodable、Vectorize 等当时方案，工具现状应按 2026 年重新核查。
    - 作者最后重申：持续学习是 ML 特有需求，却主要依赖基础设施解法，需要 data science/ML team 与 platform team 协作。第
      10 章继续讨论基础设施与工具。
  - title: 9. 本章知识结构
    source_heading: 9. 本章知识结构
    paragraphs:
    - Fresh data 只有经过 point-in-time feature 和成熟 label 才能训练。
    - Static test 守住已知能力，backtest 检查近期分布，production test 观察真实闭环。
    - Shadow、canary、A/B、interleaving、bandit 不是递进排名，而是分别优化安全、因果证据、排序效率和在线 regret。
    - Cadence 最终由 freshness value、标签速度、风险和成本共同决定。
  - title: 10. 核心结论
    source_heading: 10. 核心结论
    paragraphs:
    - Continual/online/continuous/incremental learning 术语不统一。 应检查真实更新和发布行为。
    - 新鲜事件不等于新鲜训练样本。 Label computation、maturity、归因和 point-in-time correctness 决定可用速度。
    - Stage 2 的关键是 scheduler、data access 和 model store；Stage 3 的关键是 lineage。
    - Contextual bandit 处理 action-conditioned partial feedback。 未曝光 action 没有 reward，而不是
      reward 为零。
  - title: 11. 作者分析问题的方法与可迁移解题框架
    source_heading: 11. 作者分析问题的方法与可迁移解题框架
    paragraphs:
    - 在自动化前，证明给定 data snapshot、code commit、environment、seed 和 config 能重建 artifact
      与评估报告。自动化不可复现过程只会更快制造不可解释版本。
    - Pipeline 自动完成 data validation、label/feature build、training、artifact registration
      和 offline evaluation。输出是 candidate，不是 production deployment。
    - 每次 action 保存 policy version、context、candidate set、chosen action、propensity 与成熟
      reward。没有 propensity，adaptive log 很难做可靠 off-policy evaluation。
    - 复盘：坏样本何时进入、哪个 gate 应发现、为何 detector/实验未发现、rollback 多久、哪些版本受污染。把结论写回 data contract、evaluation
      suite、trigger、runbook 和 lineage。
  takeaways:
  - 本章讨论怎样持续更新生产模型以适应变化。作者把基础设施现代化描述为四阶段：从手工、每次从头训练，演进到自动、无状态，再到自动、有状态，最终由环境信号触发候选更新。
  - 持续学习首先是一种系统能力。 它让团队能按需更新、验证和部署，不等于逐样本在线学习。
  - 算法和 feature pipeline 都要支持增量。
  - Shadow 是最低用户风险的 live test。 它验证真实输入和 serving，但看不到 challenger 行为效应。
  - 安全持续学习闭环的终点不是“自动重训”，而是可验证晋级与可恢复失败。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「8.1 Continual learning 就是每来一个样本更新一次」？
  answer: 不是。原章中的主流生产方式是 batch/micro-batch；核心是随需更新、验证和发布的能力。
  source_heading: 8.1 Continual learning 就是每来一个样本更新一次
- level: 概念辨析
  question: 原文如何解释「8.13 有实时事件流就有实时训练数据」？
  answer: 还要完成标签 join、maturity、去重、迟到处理、质量检查和 point-in-time features。
  source_heading: 8.13 有实时事件流就有实时训练数据
- level: 概念辨析
  question: 原文如何解释「8.25 Stage 4 对所有公司都是目标」？
  answer: 四阶段描述能力演进，不是强制排名。稳定、低流量或高风险任务可能长期停在自动 batch/stateful 阶段。
  source_heading: 8.25 Stage 4 对所有公司都是目标
- level: 概念辨析
  question: 原文如何解释「8.42 1% canary 没出问题就证明质量更好」？
  answer: 小流量擅长发现大故障，却通常没有 power 证明微小提升或稀有伤害不存在。
  source_heading: 8.42 1% canary 没出问题就证明质量更好
- level: 概念辨析
  question: 原文如何解释「8.55 模型作者最了解模型，所以应自行决定所有门禁」？
  answer: 领域知识重要，但自选测试易产生偏差和不一致。标准、执行和例外责任应制度化、自动化并可审计。
  source_heading: 8.55 模型作者最了解模型，所以应自行决定所有门禁
