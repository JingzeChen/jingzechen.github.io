  sections:
  - title: 全章主线
    source_heading: 全章主线
    paragraphs:
    - 应用必须直接使用处理器才能高效运行，但应用可能有 bug，甚至故意攻击系统。若内核解释并检查应用的每一条指令，保护容易实现，性能却很差；若应用不受限制地直接运行，性能高，却能改写内核、其他进程和设备。
    - 怎样让不可信应用的大多数指令直接在硬件上高速执行，同时保证所有危险操作都必须由可信内核检查？
    - 作者的答案是软硬件共同构造受保护执行（protected execution）：应用在用户态直接执行安全指令；硬件禁止危险指令和越界内存访问；中断、异常和系统调用通过受控入口把执行权交给内核；内核完成检查后再精确恢复用户状态。
    - x86 步骤、伪代码、形式化模型、现代硬件说明和 C 实验直接嵌入相应概念：先建立保护目标，再逐层解释硬件条件、模式转移与内核实现，并在出现公式时给出推导和适用边界。
  - title: 2.1 进程抽象（The Process Abstraction）
    source_heading: 2.1 进程抽象（The Process Abstraction）
    paragraphs:
    - 其中 I 是程序指令，R 是寄存器状态（含程序计数器和栈指针），M 是用户地址空间，K 是内核维护的权限与资源状态，C 是调度状态。仅有可执行文件 I
      不足以恢复正在运行的进程。
    - 简化模型为每个进程复制完整代码、数据、堆和栈。现代系统通常只保留一份只读代码物理页，让多个进程映射共享；但可变数据、堆和栈仍需逻辑独立。
    - "“process”最初更接近今天的“thread”，表示一条逻辑指令序列。早期内核用协作进程组织并发，但应用通常单线程，于是执行流和保护边界没有歧义。"
    - 并行程序出现后，同一保护域需要多个执行流，一度称“轻量级进程”，后来“线程”成为主流。阅读旧系统资料时，必须依据上下文判断 process 指执行流还是保护域。
  - title: 2.3 模式转移的类型（Types of Mode Transfer）
    source_heading: 2.3 模式转移的类型（Types of Mode Transfer）
    paragraphs:
    - 内核把进程放进受限沙箱后，必须允许合法请求进入内核，也必须处理外部设备和执行错误。高性能服务器每秒可能跨越边界数千次，所以切换若太慢会成为瓶颈；若入口和状态保存稍有漏洞，应用就可能控制内核。
    - 读图时沿两个方向看：横向看一次完整的权限边界往返；纵向看三种事件如何在入口后分流。系统安全依赖图中的“漏斗”结构——用户可以选择发起系统调用，却不能选择任意内核
      PC 或跳过参数检查。
    - 若设备一次只接收一个请求，完成后中断内核，内核再提交下一个请求，则内核处理中断期间设备空闲。更高效的方法是建立循环请求队列。每个缓冲区描述符说明操作类型、数据缓冲区地址/长度及完成状态。
    - 设备通过 DMA 读取描述符、传输数据并写回结果。只要环中持续有请求，设备可立即开始下一项，与内核并行。一个逻辑 I/O 可能包含多次 DMA：取描述符、搬数据、写回状态。网卡常分别维护收包和发包环。
  - title: 硬件进入内核的六步
    source_heading: 硬件进入内核的六步
    paragraphs:
    - 压入关键状态：把用户返回上下文写入内核栈。
    - 统一错误码槽：页错误等由硬件压错误码；其他事件由软件压占位值。
  - title: 返回路径与 PC 语义
    source_heading: 返回路径与 PC 语义
    paragraphs:
    - 模拟完成的缺失指令必须把保存 PC 改到下一条，否则会再次异常；
    - 书中 x86 系统调用 trap 保存 trap 后的 PC。
    - 返回位置由事件语义决定，不能一律“PC 加一”；变长指令也未必只占一字节。
  - title: 2.7 启动新进程
    source_heading: 2.7 启动新进程
    paragraphs:
    - 分配处理系统调用/中断/异常的内核栈。
    - 实际系统还会建立凭据、打开文件、页表和调度状态，但原书本节强调最小机制。
    - 用户点击文件图标时，窗口管理器请求内核启动关联程序并传文件名。内核不能让新进程直接引用窗口管理器私有指针，而要把参数复制到新进程用户内存，通常放在用户栈底部，再调整
      SP 避免覆盖。
    - 状态字 = 用户模式与合法初值；
  - title: 2.9 案例：启动操作系统内核
    source_heading: 2.9 案例：启动操作系统内核
    paragraphs:
    - 开机时 DRAM 和操作系统尚未初始化，处理器把 PC 设置到预定地址，从只读启动存储器（Boot ROM）取指。传统 x86 PC 的启动程序称 BIOS。
    - 若病毒替换 bootloader，之后一切检查都可被绕过。原书说明 BIOS 可用公钥验证 bootloader 的密码学签名，bootloader 再验证内核。
    - 签名验证的边界。 发布者用私钥对映像摘要签名，固件用内置公钥验证。安全依赖私钥保密、验证代码正确、公钥可信、算法安全以及防止回滚到有已知漏洞的旧版本。签名证明“由持钥者授权且内容未改”，不证明代码无
      bug。
    - 可信链逐级验证下一阶段：ROM/固件 → bootloader → kernel → 可选的驱动与用户组件。任何未验证可执行阶段都可能断开链。
  - title: 2.11 总结与未来方向
    source_heading: 2.11 总结与未来方向
    paragraphs:
    - 除只运行单一应用的某些嵌入式设备/游戏机外，成功通用操作系统普遍提供进程隔离。它让用户不必信任每个应用，也使应用复杂度增加的同时，单个 bug 不再轻易拖垮整机。
    - 按应用“需要知道”授予位置、联系人等权限，而不是让所有应用拥有用户全部能力。局限是权限提示可能让用户疲劳，粒度过粗或用途不透明仍会误授权。
    - 浏览器、数据库和桌面发布系统成为小型操作系统，安全执行第三方代码。原书举 Google Native Client 和 Microsoft Application
      Domains。语言/编译检查可降低每次操作陷入内核的成本，但运行时本身必须可信。
    - 处理器和设备逐步支持客户直接处理部分中断、异常、系统调用和 I/O，减少宿主介入。直接访问必须由嵌套页表/IOMMU 等硬件限制，不能牺牲隔离。
  - title: 章末练习详解
    source_heading: 章末练习详解
    paragraphs:
    - 应用不能越权读写，却可在无限循环中永久占据 CPU。只要它不主动系统调用，内核无法调度其他任务或响应终止请求。协作式系统可要求应用主动让出，但不能约束
      bug/恶意代码。
    - 运行时检查、进程沙箱、内核隔离、站点隔离和权限 UI 共同工作。仅靠脚本语言不够，因为 JIT、图形库、媒体解码器和浏览器内核都可能有本地漏洞。侧信道和社会工程也不能靠内存检查完全消除。
    - 客户内核真实运行时预期关闭中断，但在虚拟机真实用户态执行后，操作表面成功，系统标志却未改变，宿主也没有获得 trap 去更新“虚拟中断屏蔽状态”。客户观察到的行为与真机不同，可能在它认为中断关闭的临界区收到虚拟中断，导致错误。
    - 满意替代所需条件：异常精确、入口受控、用户可稳定触发、能区分普通非法指令、内核能安全推进 PC。异步硬件中断不适合直接代替，因为应用不能精确选择何时触发且参数与某条指令无同步关联；软件可触发中断若硬件支持，本质上就是
      trap。
  - title: 复习检查清单
    source_heading: 复习检查清单
    paragraphs:
    - 能推导书中 32 位 trapframe 为 56 字节的假设；
    - 能解释新进程如何伪造初始 trapframe 复用返回路径；
    - 能说明 upcall/signal 的投递和异步安全限制；
    - 能复述 BIOS、bootloader、kernel、首进程的启动链；
  takeaways:
  - x86 步骤、伪代码、形式化模型、现代硬件说明和 C 实验直接嵌入相应概念：先建立保护目标，再逐层解释硬件条件、模式转移与内核实现，并在出现公式时给出推导和适用边界。
  - 设备通过 DMA 读取描述符、传输数据并写回结果。只要环中持续有请求，设备可立即开始下一项，与内核并行。一个逻辑 I/O 可能包含多次 DMA：取描述符、搬数据、写回状态。网卡常分别维护收包和发包环。
  - 状态字 = 用户模式与合法初值；
  - 处理器和设备逐步支持客户直接处理部分中断、异常、系统调用和 I/O，减少宿主介入。直接访问必须由嵌套页表/IOMMU 等硬件限制，不能牺牲隔离。
  - 能复述 BIOS、bootloader、kernel、首进程的启动链；
