- level: 概念辨析
  question: 原文如何解释「易混淆概念与常见误解」？
  answer: 系统调用进入内核后通常仍代表同一进程，并可立即返回；进程切换需要保存一个进程并加载另一个。模式切换可能触发进程切换，但两者不是同一事件。
  source_heading: 易混淆概念与常见误解
