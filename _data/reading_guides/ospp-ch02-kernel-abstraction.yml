overview:
  kind: summary
  minutes: 9
  question: 原文围绕「全章主线」建立了怎样的核心认识？
  question_source: 全章主线
  thesis: 浏览器、数据库和桌面发布系统成为小型操作系统，安全执行第三方代码。原书举 Google Native Client 和 Microsoft Application
    Domains。语言/编译检查可降低每次操作陷入内核的成本，但运行时本身必须可信。
  thesis_source: 2.11 总结与未来方向
  concepts:
  - term: 全章主线
    meaning: 作者的答案是软硬件共同构造受保护执行（protected execution）：应用在用户态直接执行安全指令；硬件禁止危险指令和越界内存访问；中断、异常和系统调用通过受控入口把执行权交给内核；内核完成检查后再精确恢复用户状态。
    source_heading: 全章主线
  - term: 2.3 模式转移的类型（Types of Mode Transfer）
    meaning: 设备通过 DMA 读取描述符、传输数据并写回结果。只要环中持续有请求，设备可立即开始下一项，与内核并行。一个逻辑 I/O 可能包含多次 DMA：取描述符、搬数据、写回状态。网卡常分别维护收包和发包环。
    source_heading: 2.3 模式转移的类型（Types of Mode Transfer）
  - term: 返回路径与 PC 语义
    meaning: 返回位置由事件语义决定，不能一律“PC 加一”；变长指令也未必只占一字节。
    source_heading: 返回路径与 PC 语义
  - term: 2.7 启动新进程
    meaning: 用户点击文件图标时，窗口管理器请求内核启动关联程序并传文件名。内核不能让新进程直接引用窗口管理器私有指针，而要把参数复制到新进程用户内存，通常放在用户栈底部，再调整
      SP 避免覆盖。
    source_heading: 2.7 启动新进程
  - term: 2.11 总结与未来方向
    meaning: 浏览器、数据库和桌面发布系统成为小型操作系统，安全执行第三方代码。原书举 Google Native Client 和 Microsoft
      Application Domains。语言/编译检查可降低每次操作陷入内核的成本，但运行时本身必须可信。
    source_heading: 2.11 总结与未来方向
  - term: 复习检查清单
    meaning: 能复述 BIOS、bootloader、kernel、首进程的启动链；
    source_heading: 复习检查清单
