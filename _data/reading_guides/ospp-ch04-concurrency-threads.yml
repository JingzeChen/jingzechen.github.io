overview:
  kind: summary
  minutes: 10
  question: 原文围绕「全章主线」建立了怎样的核心认识？
  question_source: 全章主线
  thesis: 90 年代客户端—服务器推动 Windows NT、Solaris、Linux 等以线程为基础的新系统。到 90 年代末 OS X 出现后，主要商业
    OS 均基于线程。POSIX 线程从 1995 年开始标准化，Java 等语言也内建线程构造。
  thesis_source: 4.10 总结与未来方向
  concepts:
  - term: 全章主线
    meaning: 简化线程 API、形式化模型、性能推导、现代实现与 POSIX C 示例直接放在对应概念之后，依次回答“为什么需要、抽象是什么、怎样实现、成本和边界在哪里”。
    source_heading: 全章主线
  - term: 4.2 线程抽象（Thread Abstraction）
    meaning: 线程数可远多于物理 CPU。调度器维护 READY 线程集合：暂停 CPU 上的线程，保存状态并移入 READY；再选择另一 READY
      线程，把保存状态加载到 CPU，转为 RUNNING。
    source_heading: 4.2 线程抽象（Thread Abstraction）
  - term: 4.5 线程生命周期
    meaning: 具备运行条件但尚未占用 CPU。寄存器保存在 TCB/栈，TCB 位于 ready 数据结构。原书沿用“ready list”名称，实际常是优先队列或多级队列。
    source_heading: 4.5 线程生命周期
  - term: 4.7 结合内核线程与单线程用户进程
    meaning: 内核代码通常避免浮点运算，因此纯内核线程切换可不保存浮点寄存器。不同用户进程/线程可能使用浮点与 SIMD，切换用户执行流时必须保存/恢复其完整状态。
    source_heading: 4.7 结合内核线程与单线程用户进程
  - term: 4.10 总结与未来方向
    meaning: 90 年代客户端—服务器推动 Windows NT、Solaris、Linux 等以线程为基础的新系统。到 90 年代末 OS X 出现后，主要商业
      OS 均基于线程。POSIX 线程从 1995 年开始标准化，Java 等语言也内建线程构造。
    source_heading: 4.10 总结与未来方向
  - term: 复习检查清单
    meaning: 能画出 INIT、READY、RUNNING、WAITING、FINISHED 状态图；
    source_heading: 复习检查清单
  logic:
  - 全章主线
  - 4.2 线程抽象（Thread Abstraction）
  - 4.4 线程数据结构与生命周期
  - 4.7 结合内核线程与单线程用户进程
