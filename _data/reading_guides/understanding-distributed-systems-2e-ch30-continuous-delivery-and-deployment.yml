  - 35. 解决问题的一般思路
  sections:
  - title: 0. 本章定位：测试通过之后，变更如何安全抵达生产
    source_heading: 0. 本章定位：测试通过之后，变更如何安全抵达生产
    paragraphs:
    - Chapter 29 解决的是：如何通过 unit、integration、end-to-end tests 和 formal verification
      提高“变更符合预期”的信心。
    - 变更合并到 repository 后，怎样在不破坏 availability 的前提下，把它安全、高效地释放到 production？
    - 测试只能验证有限环境和场景，生产拥有真实数据、流量、拓扑、依赖和规模。因此“测试通过”不是发布过程的终点，而是 release pipeline 的起点。
    - 所以 release 不是“复制文件”，而是 distributed system 的状态转换。Pipeline 的职责是限制每一步影响、收集证据，并在证据不足或变坏时停止。
  - title: 4. 安全与速度的核心权衡
    source_heading: 4. 安全与速度的核心权衡
    paragraphs:
    - 全量发布能最快完成，但一个未发现 regression 会同时影响全部 users/regions。
    - 这不是可直接求解的原书公式，而是说明：最快与最安全都不是单一最优，pipeline 要按风险收集足够证据。
  - title: 8. 不只有 code 要进 pipeline
    source_heading: 8. 不只有 code 要进 pipeline
    paragraphs:
    - 它们都应 version-controlled、reviewed、tested、released。
    - 配置可瞬间改变所有 instances 的行为。Chapter 24 已指出，未经 review/test 的 global configuration
      change 是常见 production failure 来源。
    - 配置需要 schema validation、semantic validation、canary、version、audit 和 rollback。
    - 它们可并行运行，但 cross-repo compatibility 仍需 contract/version policy。
  - title: 11.3 它不能证明什么
    source_heading: 11.3 它不能证明什么
    paragraphs:
    - 全部 downstream limits；
    - Region-specific behavior；
    - Long-duration leak。
    - 因此 pre-production 是 gate，不是 production 的替代品。
  - title: 14. 30.3 Production：从小范围真实流量开始
    source_heading: 14. 30.3 Production：从小范围真实流量开始
    paragraphs:
    - Pre-production 成功后，先发布到少量 production instances，也叫 canary testing；健康后再 incrementally
      released（增量发布）到其余 fleet。
    - 目标：让未被发现的问题尽快在真实环境出现，但在造成 widespread damage 前停止。
    - requests 暴露于新版本。f 太小或 t 太短，样本不足；太大则 blast radius 增加。
    - 这说明固定“等 5 分钟”不一定有意义；还要看目标 endpoint 是否收到足够 requests。独立同分布是假设，真实 traffic 常有偏斜。
  - title: 18. 30.4 Rollbacks：每一步都必须可判定
    source_heading: 18. 30.4 Rollbacks：每一步都必须可判定
    paragraphs:
    - End-to-end test results；
    - Latencies and errors（延迟与错误）；
    - 可再补充：saturation、business KPI、data correctness、queue lag、resource leaks。
    - 但 automated canary analysis 仍需 minimum sample、confidence interval、multiple metrics
      和 false-positive policy。原章没有规定算法。
  - title: 21. Stop、retry、rollback 与人工介入
    source_heading: 21. Stop、retry、rollback 与人工介入
    paragraphs:
    - State/schema backward compatible；
    - Unrelated dependency incident；
    - 如果失败由同时发生的其他 deployment/incident 引起，输入恢复后可 retry 同一 stage。Retry 必须有上限、backoff
      和重新 assessment，不能盲目循环。
    - 原章脚注指出 pipeline 可只在 business hours 运行，减少对 on-call 的打扰。权衡是 urgent fixes 速度与有人值守的安全性；成熟
      hands-off pipeline 应逐步降低人工依赖。
  - title: 25. Activate change：producer 开始写新格式
    source_heading: 25. Activate change：producer 开始写新格式
    paragraphs:
    - 所有 active consumers 必须已完成 prepare，能读取 old/new。
    - Producer 从 old 切换到 new format。Rolling 期间 old/new producers 可并存，而 consumers 接受两者。
    - 若 rollback producer，它恢复写 old；prepared consumers 仍可读 old。已经存在的 new messages 仍由
      prepared consumers 处理。
    - Lagging/offline consumers 的 upgrade plan；
  - title: 28. 可运行 Python 示例：Progressive rollout 与 schema 演进
    source_heading: 28. 可运行 Python 示例：Progressive rollout 与 schema 演进
    paragraphs:
    - Canary health gate 同时检查 service、upstream、downstream、E2E 和 endpoint exposure；
    - 它是本文补充的 deterministic state-machine analogy，不是 production orchestrator，也不实现统计
      canary analysis。
    - Health booleans 已预先判定，不实现 metric query/statistical analysis；
    - Schema set 只表示 syntactic readability，不验证 semantic compatibility；
  - title: 35. 解决问题的一般思路
    source_heading: 35. 解决问题的一般思路
    paragraphs:
    - 每一步有 entry condition、action、evidence、promotion/stop/recovery transition，避免隐式人工流程。
    - 观察 current、upstream、downstream；结合 minimum time、request exposure 和 workload cycle。
    - Backward-compatible steps、immutable previous artifact、tested downgrade 让恢复不依赖临时
      hotfix。
    - 先让 readers 接受全集，再切 writers，最后清理旧支持；任一中间点都可暂停，但跨阶段回退必须先撤销 cleanup、恢复 dual-read，再撤销
      activation。
  takeaways:
  - 手工发布降低频率，造成大 batch、较高失败风险和更困难的根因定位。
  - Review 必须检查 tests、metrics/logs/traces、limits、compatibility 和 rollback safety。
  - Rollout 暂时减少 serving capacity，remaining instances 必须有足够 headroom。
  - Roll forward 通常比 rollback 风险高，因为 hotfix 是新的未充分验证 change。
  - Pipeline 自身是高权限 distributed system，也需要安全、可观测性和恢复设计。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「30.1 Continuous delivery 与 continuous deployment」？
  answer: 前者常保留 production 人工触发，后者自动生产发布；原章统一关注 CD automation 和 safe rollout。
  source_heading: 30.1 Continuous delivery 与 continuous deployment
- level: 概念辨析
  question: 原文如何解释「30.8 Stop 与 rollback」？
  answer: Stop 先冻结扩散；rollback 是之后的一种恢复决策。Signal 不足时可能 hold 而非立刻回退。
  source_heading: 30.8 Stop 与 rollback
- level: 概念辨析
  question: 原文如何解释「31.2 “测试通过即可直接 production”」？
  answer: Pre-production/production 才有真实 deployment、traffic、data 和 dependency behavior。
  source_heading: 31.2 “测试通过即可直接 production”
- level: 概念辨析
  question: 原文如何解释「31.10 “只监控当前 service”」？
  answer: 会漏掉 upstream/downstream indirect impact。
  source_heading: 31.10 “只监控当前 service”
- level: 概念辨析
  question: 原文如何解释「31.17 “Pipeline 不会失败”」？
  answer: CD 是高权限 distributed system；也需 observability、security、redundancy 和 runbook。
  source_heading: 31.17 “Pipeline 不会失败”
