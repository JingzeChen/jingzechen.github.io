overview:
  kind: summary
  minutes: 9
  question: 0. 本章定位：测试通过之后，变更如何安全抵达生产？
  question_source: 0. 本章定位：测试通过之后，变更如何安全抵达生产
  thesis: 服务数量增加后，自动 PR checks、build、rollout、health assessment 和 rollback machinery
    必须自动化；team member review/approval 仍是显式人工 gate。
  thesis_source: 34. 核心结论
  concepts:
  - term: 0. 本章定位：测试通过之后，变更如何安全抵达生产
    meaning: Chapter 29 解决的是：如何通过 unit、integration、end-to-end tests 和 formal verification
      提高“变更符合预期”的信心。
    source_heading: 0. 本章定位：测试通过之后，变更如何安全抵达生产
  - term: 8. 不只有 code 要进 pipeline
    meaning: 配置可瞬间改变所有 instances 的行为。Chapter 24 已指出，未经 review/test 的 global configuration
      change 是常见 production failure 来源。
    source_heading: 8. 不只有 code 要进 pipeline
  - term: 14. 30.3 Production：从小范围真实流量开始
    meaning: Pre-production 成功后，先发布到少量 production instances，也叫 canary testing；健康后再
      incrementally released（增量发布）到其余 fleet。
    source_heading: 14. 30.3 Production：从小范围真实流量开始
  - term: 18. 30.4 Rollbacks：每一步都必须可判定
    meaning: 但 automated canary analysis 仍需 minimum sample、confidence interval、multiple
      metrics 和 false-positive policy。原章没有规定算法。
    source_heading: 18. 30.4 Rollbacks：每一步都必须可判定
  - term: 25. Activate change：producer 开始写新格式
    meaning: 若 rollback producer，它恢复写 old；prepared consumers 仍可读 old。已经存在的 new messages
      仍由 prepared consumers 处理。
    source_heading: 25. Activate change：producer 开始写新格式
  - term: 35. 解决问题的一般思路
    meaning: 先让 readers 接受全集，再切 writers，最后清理旧支持；任一中间点都可暂停，但跨阶段回退必须先撤销 cleanup、恢复 dual-read，再撤销
      activation。
    source_heading: 35. 解决问题的一般思路
  logic:
  - 0. 本章定位：测试通过之后，变更如何安全抵达生产
  - 8. 不只有 code 要进 pipeline
  - 11.3 它不能证明什么
  - 18. 30.4 Rollbacks：每一步都必须可判定
