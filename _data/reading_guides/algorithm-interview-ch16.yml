  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 递归代码短，不代表计算过程少。每次调用都形成一个栈帧；若问题重复分叉，还可能形成指数级递归树。因此本章既要理解“如何写”，也要证明规模确实缩小、出口可达、返回值如何组合，以及时间和栈空间是否可接受。
    - 3 个基础算法单元：阶乘、例 16-1 反转链表、例 16-2 原地反转字符数组；
    - 9 道正文题：16.2 的 5 道递归数据结构题，以及 16.3 的 4 道归纳递归题；
    - 9 道推荐练习：原书仅列出题目，不在正文扩写解法，也不计入逐题 C++17 实现数。
  - title: 16.1 递归概述
    source_heading: 16.1 递归概述
    paragraphs:
    - 原书总结：递归结构清晰、代码简洁、易于按归纳法证明；缺点是每次调用占用栈空间，函数调用有额外开销，深度过大可能栈溢出，也不总是容易优化。
    - "“递归比迭代慢”不是无条件定理：复杂度主要由访问状态数决定，但递归通常有额外栈帧和调用常数。树遍历等问题即使用迭代，也要显式维护等价栈。"
    - 递归是调用自身的控制结构；回溯是在搜索树中做选择、递归探索、撤销选择的算法策略。递归可以不回溯（阶乘），回溯也可用显式栈迭代实现。
    - 补充： 尾递归指递归调用是函数最后一步，返回后无额外计算。有些语言/编译器可把它优化成循环，但 C++ 标准不保证，Python 不做尾调用消除，Go
      也不保证通用尾递归优化。工程代码不能依赖未保证的优化避免栈溢出。
  - title: 16.2 基于递归数据结构的递归算法设计
    source_heading: 16.2 基于递归数据结构的递归算法设计
    paragraphs:
    - 长度 0、1 时显然正确。假设后缀已正确过滤，其首值是后缀最大值。若当前值更小，右侧确有更大值，应删；否则当前值不小于后缀最大值，右侧不存在严格更大值，应保留。归纳成立。
    - 递归归来后，任何仍非空的孩子子树都保证含 1。若当前值为 0 且两个孩子都为空，则整棵当前子树不含 1；反之，当前值为 1 或至少一个孩子非空，子树必含
      1，不能删除。
    - 补充：题设依赖。 若不保证两个目标都存在，标准函数可能只返回存在的那个结点，并不能证明它是“两者”的 LCA。通用接口应同时返回找到目标的数量，只有计数为
      2 时答案有效。
    - 空树出口正确。假设左右子树已分别按先序展开。当前拼接顺序严格是根、左先序链、右先序链，且只改指针、不复制结点，所以得到整棵树的先序链。左指针在当前和子调用中都被清空。
  - title: 16.3 基于归纳的递归算法设计
    source_heading: 16.3 基于归纳的递归算法设计
    paragraphs:
    - 凡是完整答案能唯一拆成“当前位选择 + 同语义后缀答案”，都可迁移为笛卡尔积递归；若不同路径到达同一状态，则还要考虑记忆化。
    - 一个二进制数的 1 数量等于最低位是否为 1，加上其余高位的 1 数量。出口 0 没有任何 1，归纳成立。
    - 列表或字符串构建器避免了同一层反复拼接越来越长的不可变字符串所导致的平方复制，但不会消除上述跨递归层复制。
    - 只要输入语法包含同构嵌套单元，并能用分隔符确定当前层结束位置，就可迁移为递归下降解析；若语法存在优先级或歧义，还需为不同非终结符拆分函数。
  - title: 递归深度与运行时栈
    source_heading: 递归深度与运行时栈
    paragraphs:
    - C++ 递归深度受线程栈和栈帧大小影响，标准不承诺安全上限；
    - Go 的 goroutine 栈可动态增长，但仍不是无限的，极深递归也会耗尽资源。
  - title: 结点内存管理
    source_heading: 结点内存管理
    paragraphs:
    - Python 与 Go 由垃圾回收器管理被断开的结点；
    - C++ 正文使用裸指针以贴近在线评测结构，只重连指针，不假设输入结点所有权；
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 终止性要求规模严格下降，正确性通常按规模归纳证明，复杂度则由调用树结点数、每结点工作量和最大深度共同决定。
    - 第 1 项失败时递归不终止，第 2 项失败时应扩充返回值，第 3 项失败时改用循环或显式栈，第 4 项失败时考虑记忆化或动态规划。只有“自相似”而没有这四项保证，不足以判定递归实现可用。
    - 其中 h 为树高，K 为组合数，N 为编码输入长度，L 为解码输出长度，D 为最大嵌套深度，M_d 为深度 d 物化的片段总长度。
    - 递归最重要的能力不是“函数调用自己”，而是给子问题一个可信契约：先假设更小状态已经按契约正确求解，再用有限、清晰的局部操作完成当前层。出口、下降量、返回语义和归来合并一旦明确，代码、证明与复杂度分析就能沿同一结构自然展开。
  takeaways:
  - 状态定义：函数参数和返回值分别表示什么；
  - 是否有覆盖所有最小状态且必然可达的出口；
  - 其中 h 为树高，K 为组合数，N 为编码输入长度，L 为解码输出长度，D 为最大嵌套深度，M_d 为深度 d 物化的片段总长度。
  - 是否存在重复子问题，需要记忆化？
  - 递归最重要的能力不是“函数调用自己”，而是给子问题一个可信契约：先假设更小状态已经按契约正确求解，再用有限、清晰的局部操作完成当前层。出口、下降量、返回语义和归来合并一旦明确，代码、证明与复杂度分析就能沿同一结构自然展开。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「3. 递归调用前后的代码执行时机不同」？
  answer: 调用前的操作发生在“递去”阶段，调用后的操作发生在“归来”阶段。树的先序、后序差别和链表从左/从右处理都来自这个位置差异。
  source_heading: 3. 递归调用前后的代码执行时机不同
- level: 概念辨析
  question: 原文如何解释「6. 2487 的相等值不能删除」？
  answer: 条件是右侧存在严格更大值。后缀最大值与当前值相等时，当前结点没有因这个相等值而失效，应保留。
  source_heading: 6. 2487 的相等值不能删除
- level: 概念辨析
  question: 原文如何解释「9. LCA 标准写法依赖目标存在」？
  answer: 若只找到一个目标，函数也会把它向上传到根。题目保证两者存在时这没有问题；通用场景必须额外统计找到几个目标。
  source_heading: 9. LCA 标准写法依赖目标存在
- level: 概念辨析
  question: 原文如何解释「13. 汉明重量的负数右移有风险」？
  answer: 有符号负数算术右移通常补 1，可能永远不变成 0。题目是 32 位无符号整数，应使用无符号类型或掩码限制位宽。
  source_heading: 13. 汉明重量的负数右移有风险
- level: 概念辨析
  question: 原文如何解释「18. 递归与动态规划的分界在于重复状态」？
  answer: 若每个子问题只出现一次，普通递归足够；若相同参数状态被多条路径反复调用，应记忆化或改为动态规划，否则调用树可能指数膨胀。
  source_heading: 18. 递归与动态规划的分界在于重复状态
