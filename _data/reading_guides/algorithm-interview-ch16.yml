overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 递归最重要的能力不是“函数调用自己”，而是给子问题一个可信契约：先假设更小状态已经按契约正确求解，再用有限、清晰的局部操作完成当前层。出口、下降量、返回语义和归来合并一旦明确，代码、证明与复杂度分析就能沿同一结构自然展开。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 递归代码短，不代表计算过程少。每次调用都形成一个栈帧；若问题重复分叉，还可能形成指数级递归树。因此本章既要理解“如何写”，也要证明规模确实缩小、出口可达、返回值如何组合，以及时间和栈空间是否可接受。
    source_heading: 本章要解决什么问题
  - term: 16.1 递归概述
    meaning: 补充： 尾递归指递归调用是函数最后一步，返回后无额外计算。有些语言/编译器可把它优化成循环，但 C++ 标准不保证，Python 不做尾调用消除，Go
      也不保证通用尾递归优化。工程代码不能依赖未保证的优化避免栈溢出。
    source_heading: 16.1 递归概述
  - term: 16.2 基于递归数据结构的递归算法设计
    meaning: 补充：题设依赖。 若不保证两个目标都存在，标准函数可能只返回存在的那个结点，并不能证明它是“两者”的 LCA。通用接口应同时返回找到目标的数量，只有计数为
      2 时答案有效。
    source_heading: 16.2 基于递归数据结构的递归算法设计
  - term: 递归深度与运行时栈
    meaning: Go 的 goroutine 栈可动态增长，但仍不是无限的，极深递归也会耗尽资源。
    source_heading: 递归深度与运行时栈
  - term: 结点内存管理
    meaning: C++ 正文使用裸指针以贴近在线评测结构，只重连指针，不假设输入结点所有权；
    source_heading: 结点内存管理
  - term: 本章总结
    meaning: 递归最重要的能力不是“函数调用自己”，而是给子问题一个可信契约：先假设更小状态已经按契约正确求解，再用有限、清晰的局部操作完成当前层。出口、下降量、返回语义和归来合并一旦明确，代码、证明与复杂度分析就能沿同一结构自然展开。
    source_heading: 本章总结
