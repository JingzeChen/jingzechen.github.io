  sections:
  - title: 0. 本章定位与阅读主线
    source_heading: 0. 本章定位与阅读主线
    paragraphs:
    - 前四章已经说明怎样设计 Agent、组织推理、从轨迹学习并选择模型。到这一步，很容易做出令人印象深刻的演示，但演示与生产之间仍隔着一组看似普通、实际决定成败的机制：数据类型、接口契约、策略版本、重试语义、工具权限、持久状态和故障恢复。
    - deep agents 在长任务中先规划、再执行，并把工具密集工作委派给隔离的 subagents；
    - 生产可靠性主要不是让模型“更听话”，而是让不可信输出必须经过确定性合同，让策略在一次运行内不可漂移，让重试发生在正确层次，让副作用经过受控工具边界，并让每一步都可恢复、可审计。
    - 这也意味着 schema、protocol 和 planning harness 都不是安全魔法。它们只是建立可执行边界；真正的权限、事务、身份、审计和业务不变量仍需由系统代码落实。
  - title: 2. 合同为何比提示词更适合管理数据流
    source_heading: 2. 合同为何比提示词更适合管理数据流
    paragraphs:
    - 合同不只约束 Agent→Agent，也应约束 Agent→tool、tool→Agent、workflow→database 和 checkpoint→resume。
    - 这解释了为什么“每个 Agent 都有 98% 准确率”不等于十 Agent 系统接近 98%。链条越长，任意一个失败即可破坏整次任务。
    - 公式把“捕获”与“恢复成功”合并成 v。如果 gate 只阻止坏数据、不产生正确替代结果，那么它提高的是安全性和错误可见性，不一定提高任务完成率。
    - 实际系统还常违反独立性：同一错误 prompt、共享 provider、错误 schema 或上游脏数据会造成相关失败。乘法模型是理解风险放大的教学模型，不是
      SLA 预测器。应从生产 trace 估计条件失败概率。
  - title: 5. Policy pinning 与可审计 fingerprint
    source_heading: 5. Policy pinning 与可审计 fingerprint
    paragraphs:
    - 把 policy snapshot、hash、retry budget、run ID 和初始 flags 写入 GraphState。
    - 若 required keywords 的顺序不影响语义，应先排序；否则等价政策会产生不同 hash。
    - 需要真实性时应使用签名、不可变 artifact registry、发布审批和 append-only audit log。原章截取 hash 前 16
      hex 字符便于标识；高保证审计更适合保存完整 digest。
    - Secrets 不应进入可广泛查看的 hash input/log；配置 fingerprint 应只包含影响行为且可安全持久化的值，secret 使用独立版本
      ID。
  - title: 7. Checkpointing：恢复的是运行现场，不只是聊天记录
    source_heading: 7. Checkpointing：恢复的是运行现场，不只是聊天记录
    paragraphs:
    - 还需考虑 encryption、retention、tenant isolation、schema migration 和 checkpoint GC。
    - 解决方案包括 idempotency key、transactional outbox、deduplication table、查询外部操作状态和 compensation。checkpoint
      提供 at-least-once 恢复基础，不自动保证 exactly-once 副作用。
    - Auditability：DB record、checkpoint 与 policy/schema hash/run ID 关联，可回答“谁按什么规则生成”。
    - Scalability：外部 tool response contract 与内部 persistence contract 分离；adapter 吸收
      API 变化，数据库按自己的 schema 演进。
  - title: 10.2 例 5-12：FastMCP tools
    source_heading: 10.2 例 5-12：FastMCP tools
    paragraphs:
    - read：检查存在后以 UTF-8 读取；
    - write：创建父目录并写文本，返回 status/path/bytes_written；
  - title: 11. 把 MCP Server 接入 LangGraph
    source_heading: 11. 把 MCP Server 接入 LangGraph
    paragraphs:
    - client 启动本地 Python server，并通过 stdio 交换 MCP 消息。命令路径、Python interpreter、工作目录和
      environment 都应显式固定；不要从模型输入拼 shell command。
    - 若 server 依赖 session-local cursor、transaction 或认证流程，应显式使用 stateful session。
    - 这里的“stateless”指 MCP session 生命周期，不表示 filesystem 工具没有持久副作用。写入的文件在 session 结束后仍然存在。
    - Agent 不应通过通用数据库 MCP tool 绕过这些领域不变量。薄 adapter 是协议上薄，不表示授权逻辑可以省略。
  - title: 12.4 例 5-18：基于 intent 搜索工具
    source_heading: 12.4 例 5-18：基于 intent 搜索工具
    paragraphs:
    - 语义搜索返回相关 tools；notebook 还按 toolkit 或 exact slug fallback。Discovery 阶段没有执行工具，只把
      capability metadata 加入 Agent 的可见世界模型。
    - discover/list：通常是 read-only metadata；
    - select/plan：模型决定候选调用；
    - authorize：系统验证身份、scope、参数和审批；
  - title: 12.6 Discovery 的排序与学习
    source_heading: 12.6 Discovery 的排序与学习
    paragraphs:
    - 完整 notebook 可把发现的 tools 交给 OpenRouter tool loop，并通过 Composio 执行。它还复用第 3 章 ART/RULER，让
      Agent 学习选择最合适工具，而不是第一个关键词匹配。
    - 不能只奖励“调用成功”，否则模型可能偏爱宽权限、容易返回 200 的工具。
  - title: 15. 从本章抽象出的生产化方法
    source_heading: 15. 从本章抽象出的生产化方法
    paragraphs:
    - 列出 user→Agent、Agent→Agent、Agent→tool、tool→store、checkpoint→resume。每条边定义 owner、input/output
      schema、权限、错误和版本。
    - checkpoint 放在稳定且重算昂贵的边界；artifact 使用 content hash。副作用节点设计 idempotency，不在 interrupt
      前执行。
    - 主 Agent 保留 goal、plan、task statuses 和 compact handoffs；大网页、日志和文件存 backend，通过
      ID 引用。Subagent output 同样过 Pydantic gate。
    - 主动测试缺字段、错误类型、provider shape drift、timeout、进程在 tool success 后崩溃、DB contention、malicious
      path、symlink、tool schema 更新、错误 OAuth tenant 和 subagent summary 丢失。Happy-path
      demo 不能验证生产可靠性。
  - title: 17. 本章知识结构与核心结论
    source_heading: 17. 本章知识结构与核心结论
    paragraphs:
    - Policy/schema hashes 连接 config、checkpoint 和 DB audit，但 fingerprint 不等于签名或执行证明。
    - Instructor 处理 generation-level schema re-ask，LangGraph 处理 system-level retry；嵌套预算必须统一。
    - Deep agents 用 planning、middleware、artifact backend 和 subagent isolation 管理长任务，而不是靠一个无限
      prompt。
    - 可迁移的一般方法是：沿数据和副作用的真实路径寻找最早可阻断点；把软期望变成 typed/authorized contract；按 failure source
      放置最小恢复循环；固定一次运行的依赖；用持久状态和幂等性跨越故障；扩展能力时始终让 discovery、authorization 与 execution
      分层。
  takeaways:
  - 多 Agent 的首要生产风险常在接口与执行边界，而非单次模型智力。
  - Checkpoint 保存完整运行现场并减少昂贵重算；外部副作用仍需幂等、事务和补偿。
  - Deep agents 用 planning、middleware、artifact backend 和 subagent isolation 管理长任务，而不是靠一个无限
    prompt。
  - 发现运行中变化破坏复现，于是 pin policy 并 hash schema/semantics；
  - 可迁移的一般方法是：沿数据和副作用的真实路径寻找最早可阻断点；把软期望变成 typed/authorized contract；按 failure source
    放置最小恢复循环；固定一次运行的依赖；用持久状态和幂等性跨越故障；扩展能力时始终让 discovery、authorization 与 execution
    分层。
