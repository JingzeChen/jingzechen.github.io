overview:
  kind: summary
  minutes: 12
  question: 0. 本章要解决什么问题？
  question_source: 0. 本章要解决什么问题
  thesis: Risk assessment 应使用 critical architecture characteristics 和 domain/subdomain
    contexts。 Service-level 通常太细。
  thesis_source: 10. 核心结论
  concepts:
  - term: 0. 本章要解决什么问题
    meaning: 原章给出离散风险矩阵、表格总分和具体案例。本文会解释公式并用代码复算，但不会把 1–9 分误解为真实概率或财务期望损失。趋势公式、SLA
      换算代码、治理清单和案例局限属于教学扩展，不是原书规定的正式标准。
    source_heading: 0. 本章要解决什么问题
  - term: 2. Risk Assessments：风险评估报告
    meaning: 原章建议使用系统最 critical 的 architecture characteristics。若系统真正关键的是 scalability、elasticity、data
      integrity，就不应把大量时间花在不重要的 performance risk 上。
    source_heading: 2. Risk Assessments：风险评估报告
  - term: 3. Risk Storming：风险风暴
    meaning: Austen、Logan 评 3，Addison 评 6。Addison 认为 LB 宕机会让全系统 inaccessible，所以 impact
      high（3）；其他人指出 clustering 使 likelihood low（1）。最终 overall risk 为 medium 3。
    source_heading: 3. Risk Storming：风险风暴
  - term: 5. Risk-Storming Use Case：护理热线诊断系统案例
    meaning: 只有 Nurse Gateway 有到 Medical Records Management/Interface 的 network/application
      path，non-nurse calls 无法到达。安全从“每次请求正确判断 role”提升为 topology-level least privilege。
    source_heading: 5. Risk-Storming Use Case：护理热线诊断系统案例
  - term: 6. Summary：总结
    meaning: Risk storming 不是 one-time process，而应贯穿 system lifecycle，在风险进入 production
      前持续识别和缓解。
    source_heading: 6. Summary：总结
  - term: 10. 核心结论
    meaning: Risk assessment 应使用 critical architecture characteristics 和 domain/subdomain
      contexts。 Service-level 通常太细。
    source_heading: 10. 核心结论
  logic:
  - 0. 本章要解决什么问题
  - 1. Risk Matrix：风险矩阵
  - 3. Risk Storming：风险风暴
  - 4. User-Story Risk Analysis：用户故事风险分析
