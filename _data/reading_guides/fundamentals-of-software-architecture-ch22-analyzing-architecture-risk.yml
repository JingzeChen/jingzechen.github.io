  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - Operational risk：availability、scalability、elasticity、performance、security、data
      integrity 等不达标；
    - Structural risk：logical components 之间 static coupling、错误依赖方向、共享数据造成的变化扩散等；
    - 风险分析不是让一个架构师给系统贴红黄绿标签，而是用统一尺度保留个体观察，再通过团队讨论、持续证据和业务取舍，把不确定性转化为可行动的优先级。
    - 原章给出离散风险矩阵、表格总分和具体案例。本文会解释公式并用代码复算，但不会把 1–9 分误解为真实概率或财务期望损失。趋势公式、SLA 换算代码、治理清单和案例局限属于教学扩展，不是原书规定的正式标准。
  - title: 1. Risk Matrix：风险矩阵
    source_heading: 1. Risk Matrix：风险矩阵
    paragraphs:
    - 这样可减少一种常见偏差：因为“应该不太会发生”而过早淡化灾难性后果。先问系统损失，再用 clustering、SLA、历史 failure rate、load
      test 等 evidence 修正 likelihood。
    - High impact 不自动等于 high overall risk；强控制可以降低 likelihood。反过来，低 impact 高频发生也可能需要关注，但矩阵把它表示为最高
      3。
    - 矩阵示例建议 unknown likelihood 暂按 3。后文 risk storming 进一步规定：参与者若对某 technology 完全不了解，该区域自动标
      highest risk 9，因为当前无法可靠使用矩阵判断。
    - 这不表示该 technology 本身危险，而表示组织当前没有证据和能力安全承担它。后续可通过 spike、training、expert review、load/failure
      testing 降低 uncertainty。
  - title: 2. Risk Assessments：风险评估报告
    source_heading: 2. Risk Assessments：风险评估报告
    paragraphs:
    - 原章建议使用系统最 critical 的 architecture characteristics。若系统真正关键的是 scalability、elasticity、data
      integrity，就不应把大量时间花在不重要的 performance risk 上。
    - 这些总分只能在同一 assessment 内辅助比较。若另一个表有更多 criteria/contexts，原始总分不可直接横向排名；也不能把多个 ordinal
      score 的和当精确损失。
    - Contexts：Customer registration 15、Catalog checkout 12、Order fulfillment 0、Order
      shipment 6。
    - 静态 assessment 只是 snapshot，不显示改善还是恶化。Fitness functions 的 continuous measurements
      可增加第三维：direction。
  - title: 3. Risk Storming：风险风暴
    source_heading: 3. Risk Storming：风险风暴
    paragraphs:
    - Facilitator 发 invitation，包含 diagram/location、risk criterion/context、collaborative
      session 的日期、时间、物理/虚拟地点和 logistics；
    - Austen、Logan 评 3，Addison 评 6。Addison 认为 LB 宕机会让全系统 inaccessible，所以 impact high（3）；其他人指出
      clustering 使 likelihood low（1）。最终 overall risk 为 medium 3。
    - 原文一句称“把 likelihood risk level 降到 medium（3）”，从矩阵逻辑看更准确的解释是：likelihood 降为 low（1），因此
      overall score 降为 medium（3）。
    - 只有一人评 9，因为此人经历过相似 high load 下 servers 持续 crash。个人经验暴露了其他人不知道的 failure mode。没有该
      participant，风险可能直到 production 才出现。
  - title: 4. User-Story Risk Analysis：用户故事风险分析
    source_heading: 4. User-Story Risk Analysis：用户故事风险分析
    paragraphs:
    - Risk storming 不只用于 architecture。Story grooming 时可分析当前 iteration 的 user-story
      completion risk。
    - Impact：本 iteration 未完成的后果；
    - Likelihood：本 iteration 无法完成的可能性；
    - 不要把 high-risk story 简单推迟。它可能最值得优先消除 uncertainty；也可能因价值低而移出 iteration，取决于 impact
      与 business priority。
  - title: 5. Risk-Storming Use Case：护理热线诊断系统案例
    source_heading: 5. Risk-Storming Use Case：护理热线诊断系统案例
    paragraphs:
    - 必须 HIPAA（Health Insurance Portability and Accountability Act）compliant，只有 nurses
      可访问；self-service 无法保证 HIPAA compliance；
    - Ambulance pattern 像交通中优先让救护车通过，让 nurse requests 优先于 self-service。它改善 priority
      和 clinical urgency，但仍不降低总工作量，低优先请求还可能 starvation，需要 fair scheduling/age limits。
    - HIPAA 要求只有 nurses 可访问 medical records。Logan 原以为统一 API Gateway 的 authentication/authorization
      足以 neutralize risk。
    - 只有 Nurse Gateway 有到 Medical Records Management/Interface 的 network/application
      path，non-nurse calls 无法到达。安全从“每次请求正确判断 role”提升为 topology-level least privilege。
  - title: 6. Summary：总结
    source_heading: 6. Summary：总结
    paragraphs:
    - Risk storming 不是 one-time process，而应贯穿 system lifecycle，在风险进入 production 前持续识别和缓解。
    - Architecture refactoring；
    - 每个 iteration 结束时，对某些 dimensions 做 storming。
    - 目标是持续确认 architecture 仍正确并满足 business needs。
  - title: 8. 一般化的问题解决方法
    source_heading: 8. 一般化的问题解决方法
    paragraphs:
    - 从 business goals 提取真正重要的 availability、security、elasticity、integrity 等，作为 risk
      criteria。
    - Facilitator 提供同一 diagram、criterion/context 和 matrix；participants 独立标 sticky，保护认知多样性。
    - 提供 ideal、compromise、accept/defer 等 alternatives，说明 cost、risk reduction 和新 trade-offs。
    - 比较 snapshot 与 trend，在 major feature/iteration 后重复 storming，并让新 evidence 调整 likelihood。
  - title: 10. 核心结论
    source_heading: 10. 核心结论
    paragraphs:
    - 每个 architecture 都有 operational 与 structural risk。 风险分析用于发现 deficiency、decay
      并采取 corrective action。
    - Risk assessment 应使用 critical architecture characteristics 和 domain/subdomain
      contexts。 Service-level 通常太细。
    - Security 可通过 topology 缓解。 Separate gateways 让 non-nurse path 无法到达 medical records，而不只依赖共享
      gateway 的判断。
    - SLA 是 likelihood evidence，不是 availability 本身。 应理解 measurement、fallback 和 residual
      dependency risk。
  takeaways:
  - 本节是对原章论证的教学性归纳；其中带有实践推论的表述不代表原书新增了强制规范。
  - Risk assessment 应使用 critical architecture characteristics 和 domain/subdomain contexts。
    Service-level 通常太细。
  - Consensus 不是平均分。 Minority experience 和“我不懂这项技术”都可能揭示关键 risk。
  - Ambulance pattern 按业务紧急度分流。 Outbreak cache 进一步减少外部 engine 请求。
  - 让每个人先独立指出自己看到的风险，再用 impact、likelihood 和证据形成团队共识；随后把缓解成本与业务风险放在同一张桌上，并用持续指标验证架构是否真的变得更安全。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 Risk Score 是真实概率」？
  answer: 错误。1–9 是 ordinal prioritization score。它使讨论可比，不是 actuarial probability 或
    expected loss。
  source_heading: 7.1 Risk Score 是真实概率
- level: 概念辨析
  question: 原文如何解释「7.6 总分最高就必须先改」？
  answer: 不一定。还要看 direction、business criticality、mitigation cost、safety/regulation
    和 dependencies。
  source_heading: 7.6 总分最高就必须先改
- level: 概念辨析
  question: 原文如何解释「7.11 只有 Architects 应参加」？
  answer: 错误。Senior developers/tech leads 的 implementation experience 和知识缺口都是风险证据；mitigation
    还需 authorized business stakeholders。
  source_heading: 7.11 只有 Architects 应参加
- level: 概念辨析
  question: 原文如何解释「7.17 Priority Queue 解决所有 Wait Time」？
  answer: 错误。Ambulance pattern 优先 nurse，但总容量不变，self-service 还可能 starvation。
  source_heading: 7.17 Priority Queue 解决所有 Wait Time
- level: 概念辨析
  question: 原文如何解释「7.22 User-Story Risk 只看估时」？
  answer: 错误。使用“不完成的 impact × 不完成的 likelihood”，不是只按 story points 大小。
  source_heading: 7.22 User-Story Risk 只看估时
