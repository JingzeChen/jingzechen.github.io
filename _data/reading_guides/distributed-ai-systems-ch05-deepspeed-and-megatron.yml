overview:
  kind: summary
  minutes: 14
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: State line：replicated state → owner shards → temporary materialization →
    update/sync。
  thesis_source: 31. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: ZeRO++ 的 quantized weights、hierarchical partitioning 和 quantized gradients分别减少什么通信？
    source_heading: 0. 本章要回答的核心问题
  - term: 7. ZeRO-Infinity：将 NVMe 变为第三层容量
    meaning: 原章建议free space约model size的2～4倍，属于粗略经验。应逐项计算offloaded params、optimizer、buffers、checkpoint和临时files。70B
      FP16 weights 140 GB，optimizer-side 840 GB，单node全offload可接近TB级，不能只按weights估算。
    source_heading: 7. ZeRO-Infinity：将 NVMe 变为第三层容量
  - term: 14. Expert Parallelism：MoE 的稀疏计算轴
    meaning: 例如Mixtral 8×7B并非总参数简单56B且每token算14B的精确公式；shared attention、expert结构、active
      top-k和embedding均影响。报告：total params、active params/token、experts、top-k、capacity和actual
      FLOPs。
    source_heading: 14. Expert Parallelism：MoE 的稀疏计算轴
  - term: 18. Megatron-FSDP：理解周围计算布局的状态分片
    meaning: 已有Megatron TP/PP/CP/EP且追求NVIDIA栈极致性能：评估Megatron-FSDP。希望纯PyTorch/DTensor/compile和更通用integration：FSDP2。已有DeepSpeed
      offload/ZeRO++：可选DeepSpeed，但process groups与Megatron集成必须由成熟framework管理。
    source_heading: 18. Megatron-FSDP：理解周围计算布局的状态分片
  - term: 25. Choosing the right strategy
    meaning: TP每层通信且要求shape/topology；若layer fit且state sharding足够，TP可能只降低local GEMM
      efficiency。加入前测单层peak与latency。
    source_heading: 25. Choosing the right strategy
  - term: 34. 复习与自测
    meaning: 完成这些检查后，应能把“开启ZeRO/Megatron”改写为一个可证伪的系统设计：每份状态由谁持有、每个operator在哪里计算、每次沿哪组移动多少数据、峰值在何时出现、正确性如何与full
      reference对照，以及配置变化后怎样恢复训练。
    source_heading: 34. 复习与自测
