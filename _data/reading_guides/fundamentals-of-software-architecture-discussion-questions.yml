  sections:
  - title: 如何使用这份讨论题笔记
    source_heading: 如何使用这份讨论题笔记
    paragraphs:
    - 再说明“为什么”，尤其是机制如何导致 architecture characteristic；
    - 主动补充一个 trade-off，避免把答案背成绝对规则；
    - 对 named list、数字、公式和术语做精确记忆；
    - 最后尝试把题目换一个业务上下文，看结论是否仍成立。
  - title: 'Chapter 3: Modularity'
    source_heading: 'Chapter 3: Modularity'
    paragraphs:
    - 模块化通常值得追求，但粒度不存在普遍最优值。过粗会降低独立变化能力；过细会增加 communication、coordination、transaction
      和 operational complexity。
    - 通常追求 high cohesion、low coupling。高内聚让一个业务变化集中在一个边界内；低耦合减少该变化传播到其他边界的概率。但不能为了追求形式上的“低耦合”拆散天然高内聚的行为，否则跨模块通信反而更多。
    - 优先 static connascence，因为它能在编译或静态分析阶段发现，也更容易借助重构工具改善。Dynamic connascence 涉及时序、并发和
      runtime state，通常更难观察、测试与修复。
    - 这不是说 static coupling 越多越好。原则是：距离越远、degree 越大，越应降低 connascence strength；同一 module
      内可容忍的强关系，不应无条件跨越 service boundary。
  - title: 'Chapter 7: The Scope of Architectural Characteristics'
    source_heading: 'Chapter 7: The Scope of Architectural Characteristics'
    paragraphs:
    - Quantum 重要，因为 availability、scalability、security 等 operational characteristics
      必须有明确作用域。两个独立部署单元若共享 database/schema 或必须同步变化，仍可能属于同一 quantum。
    - Dynamic coupling：runtime communication 带来的等待、时序、吞吐和 failure propagation，例如 Auction
      service 同步调用 Payment service。
    - Static coupling 决定哪些部分必须共同变化；dynamic coupling 决定运行时 characteristics 如何互相传递。第
      8 章个别措辞把同步通信直接称为 static coupling，与本章口径不完全一致；分析 quantum 时应采用本章定义。
    - 若 Payment 每 500 ms 只能处理一笔，Auction 的并发能力会立即受限。Async queue 可吸收短时 burst、解耦处理速度和故障时间，但并不消除容量定律：若长期
      arrival rate 大于 consumption rate，backlog 仍会无限增长直至溢出。
  - title: 'Chapter 10: Layered Architecture Style'
    source_heading: 'Chapter 10: Layered Architecture Style'
    paragraphs:
    - 它描述的是 dependency/request path，不是 deployment 或语言访问修饰符。Closed layer 保护隔离，却可能产生无业务价值的
      forwarding；open layer 降低 sinkhole 开销，却增加跨层 coupling。全部 closed 或全部 open 都可能是有效选择，关键是结合
      isolation 与 sinkhole trade-off 决定。
    - 收益包括局部修改、独立替换、降低 change blast radius 与脆弱性。例如 persistence implementation 改变，只要
      business-facing contract 不变，presentation 不应受影响。主要路径若任意跳过 closed layers，这种隔离就会被破坏。
    - 作者给出 heuristic：约 20% sinkhole 可能可接受；若约 80% requests 都只是穿层，通常说明 layered style
      与 problem 不匹配，或 layers 划分过度。数字是诊断启发，不是硬阈值。
    - 技术分区让一个 domain change 横跨 Presentation、Business、Persistence 和 Database，往往还跨多个
      teams。结果是 coordinated change、whole-system test 与 monolithic deployment，降低 holistic
      agility。
  - title: 'Chapter 13: Microkernel Architecture Style'
    source_heading: 'Chapter 13: Microkernel Architecture Style'
    paragraphs:
    - 默认应保持 dependency-free。只有复杂 plugin ecosystem 确实需要组合能力，且 core/framework 能显式管理
      transitive dependencies、versions 和 conflicts 时才可允许，例如 Eclipse。
    - 其他例子包括 Chrome/Firefox extensions、Jira、Jenkins、PMD 和保险理赔系统。共同点是稳定 core 加可变化、可选或客户定制
      plugins。
    - Core functionality 的 volatility 也重要：稳定共性适合 core，频繁变化或客户差异适合 plugins。Microkern-ality
      是连续谱，不是二元标签。
    - 即使 plugins 远程部署，所有 requests 仍经过 monolithic core；core 是共同同步耦合与 characteristics
      作用点。因此系统通常只有一个 quantum。
  - title: 'Chapter 17: Orchestration-Driven Service-Oriented Architecture'
    source_heading: 'Chapter 17: Orchestration-Driven Service-Oriented Architecture'
    paragraphs:
    - Technically partitioned，而且是最极端的通用技术分区之一。Business、Enterprise、Application、Infrastructure
      services 按技术角色分层，同一 domain workflow 横跨多层。
    - Domain reuse：由 Enterprise services 提供，再由 orchestration engine 组合为 Business services；
    - Operational reuse：由 Infrastructure services 提供，如 logging、monitoring、authentication、authorization。
    - 作为 integration architecture：利用 ESB integration hub、protocol/contract transformation
      和 orchestration 连接 legacy、package、custom、cloud 与 on-prem systems。
  - title: 'Chapter 20: Architectural Patterns'
    source_heading: 'Chapter 20: Architectural Patterns'
    paragraphs:
    - Hexagonal 用 ports/adapters 把 domain logic 与 UI、database、external systems 分开；service
      mesh 把 traffic policy、security、telemetry 等从 service code 移到 sidecars/infrastructure。二者作用层级不同，但都减少
      cross-cutting concern 污染 domain implementation。
    - 多一个 orchestrator/coordinator。它保存 workflow state，决定下一步，并集中处理 error、retry、recovery
      和 boundary cases。
    - 收益是 flow 可见、复杂流程易控制；代价是 central coupling、bottleneck 与 common failure point。Choreography
      没有该中心，但全局 flow 与错误恢复更难理解。
    - 分离后两边可使用不同 models、stores、scaling 和 security policies。例如 write side 保证 domain
      invariants，read side 建 denormalized views。代价是 projection synchronization、eventual
      consistency 和 operational complexity；CRUD 简单系统通常不需要 CQRS。
  - title: 'Chapter 23: Diagramming Architecture'
    source_heading: 'Chapter 23: Diagramming Architecture'
    paragraphs:
    - 因此探索期应使用 whiteboard、sticky notes 等 low-fidelity、ephemeral artifacts；方向收敛后再正式绘制。目标是让思考可修改，而不是保护图的美观。
    - C4 官方通常把第四层称 Code，class diagram 是 Code level 的一种表达。本题应按书内口径回答 Class，同时理解层级从
      system environment 逐步 zoom 到 implementation detail。
    - 它表示 asynchronous communication，solid lines 表示 synchronous；原章认为这是 architecture
      diagrams 中少数较普遍的 conventions 之一。
    - Architecture diagram 没有完整统一的视觉语言，因此面向新读者或存在歧义时，title 与 key 能防止误解；它们应服务于清晰度，而不是不分场景的机械要求。
  - title: 'Chapter 27: The Laws of Software Architecture, Revisited'
    source_heading: 'Chapter 27: The Laws of Software Architecture, Revisited'
    paragraphs:
    - 不能永远选 library。Heterogeneous code 与 high code volatility 倾向 shared service，而且
      criteria 必须按当前 context 加权。未加权的加号数量不能替代 architecture decision。
    - 例如 code reuse 除了 good abstraction，还要求 low volatility；高易变 shared code 会扩大 coordination
      和 change risk。看似纯收益时，应继续问 complexity 被转移到哪里。
    - Complexity、team experience、budget、team topology、schedule pressure 等变量众多且持续变化；细微
      context 差异即可反转结论。
    - Architecture/design、orchestration/choreography、queue/topic 等都存在中间、混合和按 scope
      分段的选择；criteria 也常在多个独立维度变化。
  - title: 解决架构问题的一般方法
    source_heading: 解决架构问题的一般方法
    paragraphs:
    - Clarify：把 stakeholder jargon 还原成 business concern、scope 与 success criteria；
    - Model：识别 domain boundaries、data ownership、workflows 和 external dependencies；
    - Analyze：从 coupling、deployment、data、communication 和 failure modes 推导 trade-offs；
    - 从上下文识别 forces，从机制推导 consequences，在 trade-offs 中作出有证据的选择，并让这个选择能够被理解、验证和改变。
  takeaways:
  - 理解 domain、actors、workflows、data 与 business environment；
  - Network boundary 为何增加 latency 与 partial failure；
  - System structure、team topology、infrastructure、data、enterprise standards 与 business
    environment 互相约束。只优化 code topology 而忽略 team ownership、operations 或 organizational
    politics，architecture 不会按图落地。
  - Logical modularity 不等于 independent deployment，也不自动带来 operational isolation。
  - 大多数选择位于连续谱；“It depends”之后必须解释 depends on what。
