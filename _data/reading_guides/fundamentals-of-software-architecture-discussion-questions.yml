  question: 如何使用这份讨论题笔记？
  question_source: 如何使用这份讨论题笔记
  thesis: System structure、team topology、infrastructure、data、enterprise standards
    与 business environment 互相约束。只优化 code topology 而忽略 team ownership、operations 或
    organizational politics，architecture 不会按图落地。
  thesis_source: 全书讨论题的知识结构
  concepts:
  - term: 如何使用这份讨论题笔记
    meaning: 最后尝试把题目换一个业务上下文，看结论是否仍成立。
    source_heading: 如何使用这份讨论题笔记
  - term: 'Chapter 7: The Scope of Architectural Characteristics'
    meaning: 若 Payment 每 500 ms 只能处理一笔，Auction 的并发能力会立即受限。Async queue 可吸收短时 burst、解耦处理速度和故障时间，但并不消除容量定律：若长期
      arrival rate 大于 consumption rate，backlog 仍会无限增长直至溢出。
    source_heading: 'Chapter 7: The Scope of Architectural Characteristics'
  - term: 'Chapter 13: Microkernel Architecture Style'
    meaning: 默认应保持 dependency-free。只有复杂 plugin ecosystem 确实需要组合能力，且 core/framework
      能显式管理 transitive dependencies、versions 和 conflicts 时才可允许，例如 Eclipse。
    source_heading: 'Chapter 13: Microkernel Architecture Style'
  - term: 'Chapter 17: Orchestration-Driven Service-Oriented Architecture'
    meaning: 作为 integration architecture：利用 ESB integration hub、protocol/contract
      transformation 和 orchestration 连接 legacy、package、custom、cloud 与 on-prem systems。
    source_heading: 'Chapter 17: Orchestration-Driven Service-Oriented Architecture'
  - term: 'Chapter 23: Diagramming Architecture'
    meaning: C4 官方通常把第四层称 Code，class diagram 是 Code level 的一种表达。本题应按书内口径回答 Class，同时理解层级从
      system environment 逐步 zoom 到 implementation detail。
    source_heading: 'Chapter 23: Diagramming Architecture'
  - term: 解决架构问题的一般方法
    meaning: 从上下文识别 forces，从机制推导 consequences，在 trade-offs 中作出有证据的选择，并让这个选择能够被理解、验证和改变。
    source_heading: 解决架构问题的一般方法
