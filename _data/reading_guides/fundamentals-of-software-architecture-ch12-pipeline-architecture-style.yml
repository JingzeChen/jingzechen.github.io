- level: 概念辨析
  question: 原文如何解释「11.1 “任何函数调用链都是 Pipeline Architecture”」？
  answer: 正确理解：filters/pipes 必须是显式 architecture components 和主要 flow。
  source_heading: 11.1 “任何函数调用链都是 Pipeline Architecture”
- level: 概念辨析
  question: 原文如何解释「11.8 “Tester 严格等于 Reduce”」？
  answer: 错误之处：Tester 更常是 predicate/filter/router，reduce 通常聚合集合。
  source_heading: 11.8 “Tester 严格等于 Reduce”
- level: 概念辨析
  question: 原文如何解释「11.15 “Step Functions Standard 让副作用天然 Exactly-once”」？
  answer: 错误之处：retry/timeout/external service 仍可能重复或结果未知。
  source_heading: 11.15 “Step Functions Standard 让副作用天然 Exactly-once”
- level: 概念辨析
  question: 原文如何解释「11.20 “Annotation Role 越多越灵活”」？
  answer: 正确理解：默认 exactly one role，有理由的 composite 明确记录。
  source_heading: 11.20 “Annotation Role 越多越灵活”
- level: 概念辨析
  question: 原文如何解释「11.24 “大量 Tester 可优雅实现任何 Workflow”」？
  answer: 错误之处：nondeterministic 分支会使链难维护、测试和观测。
  source_heading: 11.24 “大量 Tester 可优雅实现任何 Workflow”
