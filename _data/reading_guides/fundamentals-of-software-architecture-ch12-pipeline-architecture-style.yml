  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Filter 过载、bidirectional communication、error handling 和 contract evolution 四类风险怎样产生？
    - Testability、evolvability、responsiveness 为什么是 3 星，deployability/maintainability
      为什么只有 2 星？
    - 何时 pipeline 适合 ordered deterministic workflow，何时 nondeterministic/back-and-forth
      workflow 应选择 event-driven？
    - 一句话概括：Pipeline architecture 用单向、可组合的小步骤把复杂处理变成可推理的数据流；一旦步骤需要频繁回话、共享大量状态或包含复杂非确定分支，这种简单性就开始失效。
  - title: 2. Topology：拓扑
    source_heading: 2. Topology：拓扑
    paragraphs:
    - Pipeline topology 只有两种主要构件：filters 和 pipes。
    - 一个部署单元，功能包含在由单向 pipes 连接的 filters 中。
    - F 是 filters，E 是单向 pipes。常见 flow 是有向无环图，但原章没有要求所有 pipeline 必须线性或严格 DAG；若存在回边，团队应警惕它是否已经变成
      feedback/event workflow。
    - 分支仍应保持单向和确定规则。分支数量爆炸、回话频繁时，event-driven/workflow engine 可能更合适。
  - title: 5. Cloud Considerations：云端考虑
    source_heading: 5. Cloud Considerations：云端考虑
    paragraphs:
    - Standard workflow execution 通常提供 exactly-once workflow semantics，但 Task retry、服务集成和超时后的副作用仍要求幂等；
    - Lambda 自身、网络 timeout 和 external side effect 可能制造重复或未知结果。
    - 因此任何有副作用 filter 都应使用 idempotency key、conditional write 或去重状态，而不是只信任 workflow
      标签。
    - 选择取决于 traffic、duration、state、cost、delivery semantics 和团队能力。
  - title: 6.3 Error conditions
    source_heading: 6.3 Error conditions
    paragraphs:
    - 从头重跑还是 checkpoint？
    - 重试会不会重复 consumer side effect？
    - 原章要求在定义 architecture 前识别 possible fatal errors。
  - title: 6.7 Backpressure 风险
    source_heading: 6.7 Backpressure 风险
    paragraphs:
    - 原章没有单列 backpressure，但异步 pipeline 不可忽略。
    - consumer scaling；
    - pause/resume producer；
    - 无限 queue 只会把故障推迟到 memory/storage 耗尽。
  - title: 9. Style Characteristics：风格特征
    source_heading: 9. Style Characteristics：风格特征
    paragraphs:
    - Filter separation 带来局部 modularity，任何 filter 在 contract 稳定时可修改/替换。例如 Duration
      Calculator 可改变计算而不改其他 filters。
    - 典型 monolith 仍整体发布，ceremony/risk/frequency 不佳。Filter modularity 使 change impact
      比 layered monolith 更清楚，因此比最弱略好。
    - Monolithic local calls/streams 较快，小 payload 有利。串行 latency 会累计，slowest stage
      限制 throughput；closed chain 与持久化 intermediate state 也增加响应时间。
    - 虽然大量 tester filters 可以模拟 nondeterminism，但会损害 maintainability、testability、deployability
      和 reliability。Event-driven architecture 更合适。
  - title: 11.1 “任何函数调用链都是 Pipeline Architecture”
    source_heading: 11.1 “任何函数调用链都是 Pipeline Architecture”
    paragraphs:
    - 错误之处：普通调用链未必是系统主要组织拓扑，也未必有单向 contract。
    - 正确理解：filters/pipes 必须是显式 architecture components 和主要 flow。
  - title: 11.17 “双向 Pipe 只是多一条 Arrow”
    source_heading: 11.17 “双向 Pipe 只是多一条 Arrow”
    paragraphs:
    - 错误之处：它引入会话、状态、cycle 和 time coupling。
    - 正确理解：重新划分 filters 或换适合协商式 workflow 的 style。
  - title: 13. 本章知识结构
    source_heading: 13. 本章知识结构
    paragraphs:
    - 结构层：Single-purpose filters 由 unidirectional pipes 连接；
    - 语义层：Producer/Transformer/Tester/Consumer 约束每步责任；
    - 运行层：Deployment 与 timing 决定 latency、throughput、backpressure 和 fault isolation；
    - 治理层：Tags、entrypoints、contracts 与 error design 防止简单 pipeline 退化为复杂耦合系统。
  - title: 15. 主动回忆与应用题
    source_heading: 15. 主动回忆与应用题
    paragraphs:
    - 比较 monolithic synchronous、monolithic asynchronous、distributed synchronous、distributed
      asynchronous 四种 pipe。
    - 比较 Standard、Asynchronous Express 和 Synchronous Express 的交付语义，不把 workflow 标签等同副作用
      exactly-once。
    - 为 invalid、transient、permanent、systemic、partial-side-effect 和 poison errors 分别设计策略。
    - 不看正文，复述设计十步：shape、filters、roles、contracts、deployment/timing、performance、recovery、governance、ownership、style
      fit。
  takeaways:
  - 结构层：Single-purpose filters 由 unidirectional pipes 连接；
  - Filter 是 architecture component，应 self-contained、通常 stateless、默认 single-purpose。
  - Data topology 可从 single database 到 database per filter，中间状态持久化需权衡恢复与 I/O。
  - Pipeline 可配合四种 Team Topologies，stream-aligned team 端到端拥有最自然。
  - Pipeline 的价值来自受约束的简单组合；当约束被持续打破时，应重划 filters 或选择 event-driven 等其他风格。
