overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: Distributed asynchronous filters 可提高 scale、elasticity 和 fault tolerance，却降低
    simplicity 并增加 cost。
  thesis_source: 14. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 何时 pipeline 适合 ordered deterministic workflow，何时 nondeterministic/back-and-forth
      workflow 应选择 event-driven？
    source_heading: 0. 本章要回答的核心问题
  - term: 5. Cloud Considerations：云端考虑
    meaning: 选择取决于 traffic、duration、state、cost、delivery semantics 和团队能力。
    source_heading: 5. Cloud Considerations：云端考虑
  - term: 6.7 Backpressure 风险
    meaning: 原章没有单列 backpressure，但异步 pipeline 不可忽略。
    source_heading: 6.7 Backpressure 风险
  - term: 9. Style Characteristics：风格特征
    meaning: Monolithic local calls/streams 较快，小 payload 有利。串行 latency 会累计，slowest
      stage 限制 throughput；closed chain 与持久化 intermediate state 也增加响应时间。
    source_heading: 9. Style Characteristics：风格特征
  - term: 11.17 “双向 Pipe 只是多一条 Arrow”
    meaning: 正确理解：重新划分 filters 或换适合协商式 workflow 的 style。
    source_heading: 11.17 “双向 Pipe 只是多一条 Arrow”
  - term: 15. 主动回忆与应用题
    meaning: 不看正文，复述设计十步：shape、filters、roles、contracts、deployment/timing、performance、recovery、governance、ownership、style
      fit。
    source_heading: 15. 主动回忆与应用题
