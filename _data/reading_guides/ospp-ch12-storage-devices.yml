overview:
  kind: summary
  minutes: 14
  question: 原文围绕「全章主线」建立了怎样的核心认识？
  question_source: 全章主线
  thesis: 总 FC 接口 4 GB/s 对应约 10.24 ms，不是瓶颈。若应用每发一个 4 KiB 请求都同步等待，而且设备无法预取，则会退化到练习
    12 的约 2 s；题目把页面特意设为 sequential，通常意图是假设控制器/OS 能流水并使用顺序带宽。故答案 20 ms 的成立条件是有足够 queue/readahead
    或合并，使工作负载真正成为顺序流。
  thesis_source: 章末练习详解
  concepts:
  - term: 全章主线
    meaning: 由约束反推系统策略。 磁盘需要布局、批量传输和请求调度；闪存需要 erase-before-write、wear leveling、garbage
      collection 和逻辑到物理映射。
    source_heading: 全章主线
  - term: 12.1.1 磁盘访问与性能（Disk Access and Performance）
    meaning: 原书特别警告不要滥用 average seek：它近似假设工作负载毫无 locality，接近常见负载的坏情况。文件系统会把同一文件连续布局、把同目录对象放在附近；此时观测值可能更接近
      minimum seek。评估具体工作负载应使用它的距离分布，而不是看到“average”就机械代入厂商指标。
    source_heading: 12.1.1 磁盘访问与性能（Disk Access and Performance）
  - term: 12.1.3 磁盘调度（Disk Scheduling）
    meaning: SCAN（elevator）。 磁头选定方向，例如从外向内，沿途按位置服务所有同方向 pending request；到边缘后反向，再服务另一方向。每个请求至多等待一次往返
      sweep，避免 SSTF 的无限 starvation，并保留大部分 seek locality。
    source_heading: 12.1.3 磁盘调度（Disk Scheduling）
  - term: 12.3 总结与未来方向
    meaning: 原书讨论 phase-change memory（PCM）和 memristor，设想接近 DRAM 延迟、可按字节寻址且非易失的介质。这些内容是当时的研究展望，不应把论文原型参数当成今天已普及产品；它提出的问题却很关键：若持久介质不再像磁盘/flash
      block device，文件与内存的边界应怎样变化？
    source_heading: 12.3 总结与未来方向
  - term: 章末练习详解
    meaning: 总 FC 接口 4 GB/s 对应约 10.24 ms，不是瓶颈。若应用每发一个 4 KiB 请求都同步等待，而且设备无法预取，则会退化到练习
      12 的约 2 s；题目把页面特意设为 sequential，通常意图是假设控制器/OS 能流水并使用顺序带宽。故答案 20 ms 的成立条件是有足够
      queue/readahead 或合并，使工作负载真正成为顺序流。
    source_heading: 章末练习详解
  - term: 复习检查清单
    meaning: 能解释 over-provisioning、wear leveling、ECC、bad-block management 和 read scrubbing。
    source_heading: 复习检查清单
