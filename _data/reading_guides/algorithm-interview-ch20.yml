  question_source: 本章要解决什么问题
  thesis: 最终检查顺序应固定为：状态是否完整，队列键代表什么，界是否朝正确方向，何时允许关闭状态，旧标签怎样淘汰，第一次遇到目标能否提前返回。 这六个问题比“该用队列还是堆”更能决定算法是否正确。
  thesis_source: 本章总结
