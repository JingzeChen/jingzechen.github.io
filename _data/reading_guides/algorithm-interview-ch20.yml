  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 第 19 章的回溯法以深度优先方式遍历解空间，并在递归返回时撤销选择。本章仍然搜索解空间，却把重点转向两个新问题。
    - 分支限界法适合最优化问题；A* 进一步利用“离目标还有多远”的启发信息，优先探索估计总成本最小的路径。
    - 真正决定正确性的不是“用了优先队列”，而是：队列键代表什么、边权满足什么条件、界是否安全、旧状态是否允许被更优路径更新。
    - 本章共有 3 个基础算法单元、14 道正文题。后文为每个基础单元或正文题各放置一个紧邻推导的 C++17 代码块，共 17 个；Python 与 Go
      只在章末附录 A、B 给出完整程序。例 20-3 是 A* 的 OPEN 表走查，不另计独立实现；743、787、1293、1102 在原书中分别以不同活结点表重复出现，按
      8 道不同正文题计数并保留各自实现。
  - title: 20.1 分支限界法和 A* 算法概述
    source_heading: 20.1 分支限界法和 A* 算法概述
    paragraphs:
    - 补充：术语对应。 在一般组合优化语境中，这是优先队列式分支限界；在非负边最短路语境中，同一代码结构就是 Dijkstra。当前累计代价 g 既是到当前顶点的精确已知代价，也是任何完整路径总代价的下界。
    - 对于一般图搜索，仅有可接纳性时，若后续发现更小 g，可能需要重新打开 CLOSED 中的状态；若 h 一致，则结点第一次以最小有效 f 弹出时其 g 已确定，不需要重新打开。
    - A* 的可靠终止条件因此是：边权非负；h 可接纳；发现更小 g 时允许更新并重新入堆；目标以当前有效标签从 OPEN 弹出。若还要求状态永不重新打开，则需把条件加强为
      h 一致。OPEN 为空表示无可达目标；有限状态图中这会正常终止，有可达负环或无限状态空间时还需额外条件，不能照搬结论。
    - 这个表也是后续各题选择算法的依据：如果状态图很小或没有有效启发式，BFS/Dijkstra 往往更简单；只有当 h 能显著接近真实剩余代价且计算便宜时，A*
      才能体现优势。
  - title: 20.2 队列式分支限界法应用的算法设计
    source_heading: 20.2 队列式分支限界法应用的算法设计
    paragraphs:
    - 原书将其放在队列式分支限界章节，因为组织形式是活结点队列，并在叶子比较最大时间。但这棵输入树没有重复状态，每个结点都必须访问才能确认最晚时间，也没有能够安全删除未知子树的有效上界。因此算法本质上就是树的
      BFS；DFS 计算根到叶最大和也完全等价。
    - 更稳妥且容易证明的方法是二维状态或下面的分层 Bellman-Ford；“价格更低”与“边数更少”应按 Pareto 支配处理，不能分别取两个一维最小值后任意组合。
    - 时才更新并入队。较低得分到达同一格子的路径被较高得分路径支配，因为后续继续取最小值，不可能反超。
    - 20.3.5 将改用大根堆，每次优先扩展当前得分最高状态，可在第一次弹出终点时返回。另一种补充方法是把格子按值从大到小激活并用并查集连接相邻激活格；起点与终点首次连通时的当前值就是答案。
  - title: 20.3 优先队列式分支限界法应用的算法设计
    source_heading: 20.3 优先队列式分支限界法应用的算法设计
    paragraphs:
    - 如果存在尚未发现的更短路径到 u，该路径上从已确定区域走向未确定区域的第一个前沿顶点，其前缀代价不会大于该更短路径总代价，也应先于 u 弹出，矛盾。
    - 这试图保存 Pareto 前沿，但两个独立最小值可能来自不同路径，不能完整代表所有“价格—边数”权衡。
    - 多个空工人完全对称，因此当前工作只需分给第一个空工人；更一般地，同一层具有相同负载的工人只试一个。
    - 若堆键确实是所有后继实际目标值的安全下界，并且每个未剪状态都在堆中，那么首次弹出的叶子代价不大于任何其他活状态的下界，可以直接判为最优。
  - title: 20.4 A* 算法的应用
    source_heading: 20.4 A* 算法的应用
    paragraphs:
    - 补充。 该状态空间非常小，普通 BFS 更简单，同样保证最短路；还可预先从目标 BFS，得到全部可达状态到目标的精确距离。若忽略 0 后的排列逆序奇偶性与目标不同，则状态不可达，可提前返回
      -1。
    - 忽略死亡状态只会让路径更自由，不可能比真实受限路径更长，所以 h 不高估。一次实际操作只改变一个拨轮一格，对应环形距离总和最多下降 1，因此
    - 因为每次对角移动可同时让行差和列差各减少 1，先消除较小差，再沿剩余方向移动，所需步数正好是两者最大值。
    - 障碍只会迫使绕路，不会让真实路径更短，所以 h 可接纳；相邻八方向移动使切比雪夫距离最多变化 1，所以它一致。
  - title: 代码与推导的对应关系
    source_heading: 代码与推导的对应关系
    paragraphs:
    - 图中的算法不是互斥标签。非负权最短路的 Dijkstra 可以看成优先队列式分支限界；A* 是在其下界中加入启发式剩余代价；单位权图上 Dijkstra
      又退化为 BFS。
    - 航班的资源是已用边数，消障碍网格的资源是已消除障碍数。只有在证明一个资源状态支配另一个后，才能压缩维度。
    - 20.4 的三个正文 A* 实现都在发现更小 g 时重新入堆，而不是在第一次生成状态时永久封闭。这正是 20.4.3 原书失败案例要求修正的控制路径。
  - title: 三种语言中的实现差异
    source_heading: 三种语言中的实现差异
    paragraphs:
    - 堆中允许存在同一状态的旧条目，三种语言都在出堆时检查当前代价是否仍等于最佳表。这避免了实现复杂的堆内减键操作。
    - Go 使用切片和只递增的队首下标；生产环境处理超长队列时可实现环形队列或定期压缩底层切片。
    - 三种语言都把滑块棋盘编码为短字符串。字符串状态比二维数组更易哈希、复制和放入堆。生成后继时复制字符序列并交换空格；锁状态则只改一个字符并按模 10 环绕。
    - 本地 Python 3.12.10 已实际执行 3 个基础单元和 14 个正文接口，共 17 行示例，实际输出与文档逐行一致。当前环境未安装 C++ 与
      Go 工具链；17 个就地 C++17 代码块和 Go 1.22 附录只做字符串/注释感知括号、接口、调用、头文件/导入及逐节覆盖的静态检查，未在本机编译运行。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 界乐观估计每个子集能达到的最好目标值，并与当前可行解比较。
    - 活结点表决定搜索顺序：FIFO 按层，优先队列按最有希望的界。
    - 资源约束必须进入状态，不能用位置的一维最短距离替代。
    - 最终检查顺序应固定为：状态是否完整，队列键代表什么，界是否朝正确方向，何时允许关闭状态，旧标签怎样淘汰，第一次遇到目标能否提前返回。 这六个问题比“该用队列还是堆”更能决定算法是否正确。
  takeaways:
  - 分支把完整解空间拆成由部分状态代表的子集。
  - 界乐观估计每个子集能达到的最好目标值，并与当前可行解比较。
  - 活结点表决定搜索顺序：FIFO 按层，优先队列按最有希望的界。
  - 资源约束必须进入状态，不能用位置的一维最短距离替代。
  - 最终检查顺序应固定为：状态是否完整，队列键代表什么，界是否朝正确方向，何时允许关闭状态，旧标签怎样淘汰，第一次遇到目标能否提前返回。 这六个问题比“该用队列还是堆”更能决定算法是否正确。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 使用队列或堆不自动等于分支限界」？
  answer: 分支限界还需要明确部分状态、目标函数、界和剪枝证明。通知员工题虽然用队列，却没有实质限界；它本质是树 BFS。Dijkstra 虽通常不叫“分支限界代码”，但其距离标签正提供状态支配和下界。
  source_heading: 1. 使用队列或堆不自动等于分支限界
- level: 概念辨析
  question: 原文如何解释「3. 第一次发现目标与第一次弹出目标不同」？
  answer: 在 BFS 单位权图中，第一次发现目标已最短；在 Dijkstra/A* 中，状态第一次生成时未必取得最小 g，通常要等它以有效最佳标签从堆中弹出。20.4.3
    的失败正来自混淆二者。
  source_heading: 3. 第一次发现目标与第一次弹出目标不同
- level: 概念辨析
  question: 原文如何解释「10. 可接纳与一致不是同义词」？
  answer: 可接纳只比较状态到目标的整体估计；一致要求每条边都满足局部三角不等式。一致更强，并保证 f 沿路径不下降。树搜索常以可接纳性保证最优，图搜索则偏好一致性以避免重新打开
    CLOSED 状态。
  source_heading: 10. 可接纳与一致不是同义词
- level: 概念辨析
  question: 原文如何解释「11. 启发距离必须匹配动作模型」？
  answer: 环形拨轮：模 10 的最短环距。
  source_heading: 11. 启发距离必须匹配动作模型
- level: 概念辨析
  question: 原文如何解释「12. 路径长度有“边数”和“结点数”两种定义」？
  answer: 消障碍网格返回移动步数，起点为 0；二进制矩阵题返回经过格子数，起点为 1。两题看似相同，初始化差一会让所有答案偏差 1。
  source_heading: 12. 路径长度有“边数”和“结点数”两种定义
