    meaning: 本章共有 3 个基础算法单元、14 道正文题。后文为每个基础单元或正文题各放置一个紧邻推导的 C++17 代码块，共 17 个；Python
      与 Go 只在章末附录 A、B 给出完整程序。例 20-3 是 A* 的 OPEN 表走查，不另计独立实现；743、787、1293、1102 在原书中分别以不同活结点表重复出现，按
      8 道不同正文题计数并保留各自实现。
    source_heading: 本章要解决什么问题
  - term: 20.1 分支限界法和 A* 算法概述
    meaning: A* 的可靠终止条件因此是：边权非负；h 可接纳；发现更小 g 时允许更新并重新入堆；目标以当前有效标签从 OPEN 弹出。若还要求状态永不重新打开，则需把条件加强为
      h 一致。OPEN 为空表示无可达目标；有限状态图中这会正常终止，有可达负环或无限状态空间时还需额外条件，不能照搬结论。
    source_heading: 20.1 分支限界法和 A* 算法概述
  - term: 20.3 优先队列式分支限界法应用的算法设计
    meaning: 如果存在尚未发现的更短路径到 u，该路径上从已确定区域走向未确定区域的第一个前沿顶点，其前缀代价不会大于该更短路径总代价，也应先于 u 弹出，矛盾。
    source_heading: 20.3 优先队列式分支限界法应用的算法设计
  - term: 20.4 A* 算法的应用
    meaning: 补充。 该状态空间非常小，普通 BFS 更简单，同样保证最短路；还可预先从目标 BFS，得到全部可达状态到目标的精确距离。若忽略 0 后的排列逆序奇偶性与目标不同，则状态不可达，可提前返回
      -1。
    source_heading: 20.4 A* 算法的应用
