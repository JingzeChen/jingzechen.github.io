  question: 一、引言试图回答什么问题？
  question_source: 一、引言试图回答什么问题
  thesis: 最值得保留的认识不是“巨头终将被颠覆”，而是：一个流程是否优秀，必须相对于它要解决的问题来判断。服务主流客户、追求可预测回报的系统能够造就卓越的成熟业务，却未必能孕育客户未知、市场很小、利润率较低的新业务。管理者真正要做的，不是放弃良好管理，而是识别创新所处的情境，并为不同任务配置不同的客户环境、成本结构、流程、价值标准和学习方法。
  thesis_source: 二十三、引言总结
  concepts:
  - term: 一、引言试图回答什么问题
    meaning: 作者刻意排除了几类常见但解释力不足的答案：官僚主义、傲慢、管理层老化、规划失误、投资短视、能力或资源匮乏以及单纯运气不好。它们当然可能导致企业失败，但不能解释本书最关心的那类失败，因为这些企业在作出关键决策时往往正处于管理声誉的顶峰，而且它们遵循的恰恰是公认的良好管理原则。
    source_heading: 一、引言试图回答什么问题
  - term: 五、构建一个失败理论框架
    meaning: 外部效度关心：这个机制能否推广到其他条件下？第三章用变化更慢的机械挖掘机行业，第四章用钢铁行业，后续章节再扩展到服务业和消费市场。如果框架只能解释硬盘行业，它就可能只是行业特例，而不是一般管理理论。
    source_heading: 五、构建一个失败理论框架
  - term: 十一、利用破坏性创新的原则
    meaning: 常规建议如更认真规划、更努力执行、更多听取客户意见、加快上市、全面质量管理和流程再造，在延续性创新中可能非常有效；如果原问题正是破坏性项目被现有客户与流程过滤，这些做法反而可能让过滤器运行得更有效。正确问题不是“怎样让原组织更用力”，而是“怎样让新业务在适合它的客户、成本和评价体系中成长”。
    source_heading: 十一、利用破坏性创新的原则
  - term: 十三、原则二：小市场并不能解决大企业的增长需求
    meaning: 等待看似降低不确定性，却放弃了最早的学习周期。新市场形成时，产品用途、客户群、渠道和盈利方式都不清楚；先进入者通过反复试错共同塑造市场。后来者等到规模明确才进入，面对的不只是一个更大的市场，还包括已经形成经验、品牌、渠道和成本优势的竞争者。
    source_heading: 十三、原则二：小市场并不能解决大企业的增长需求
  - term: 十七、发现破坏性威胁和机遇的思路
    meaning: 作者当时把电动汽车判断为潜在破坏性技术，建议寻找接受其新价值属性的新市场，并让规模、利益和成本结构与目标市场匹配的专门机构负责。案例的目的不是预测某一款车必然成功，而是训练一种分析方式：先判断创新轨道和初始市场，再设计组织，而不是直接把未成熟产品推给最苛刻的主流客户。
    source_heading: 十七、发现破坏性威胁和机遇的思路
  - term: 二十三、引言总结
    meaning: 最值得保留的认识不是“巨头终将被颠覆”，而是：一个流程是否优秀，必须相对于它要解决的问题来判断。服务主流客户、追求可预测回报的系统能够造就卓越的成熟业务，却未必能孕育客户未知、市场很小、利润率较低的新业务。管理者真正要做的，不是放弃良好管理，而是识别创新所处的情境，并为不同任务配置不同的客户环境、成本结构、流程、价值标准和学习方法。
    source_heading: 二十三、引言总结
