overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 软件架构由系统结构及四个架构维度共同定义，不是静态图或技术产品清单；架构工作则是一组上下文相关的持续决策活动。
  thesis_source: 9. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：软件架构不是一张静态结构图，而是系统结构与四个架构维度的组合；架构工作则是在特定上下文中，围绕系统能力与业务行为持续作出、解释、落实和复查权衡决策的过程。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Defining Software Architecture：定义软件架构
    meaning: 静态地描述架构时，风格提供最容易识别的结构骨架，所以作者称它为 starting point；动态地开展设计时，必须先理解架构特征和逻辑组件，才能合理选择这个起点。前者回答“成品从哪里看起”，后者回答“设计时先分析什么”。
    source_heading: 2. Defining Software Architecture：定义软件架构
  - term: 5. Roadmap：全书路线图
    meaning: 前两部分偏技术，第三部分转向架构师实际工作所需的方法和软技能。作者特别指出，soft skills 并不“软”在难度上；很多人成为架构师是因为技术表现突出，却会在上岗后发现，沟通、领导、谈判和组织协作更难补齐。
    source_heading: 5. Roadmap：全书路线图
  - term: 6.1 “架构就是高层设计图”
    meaning: 错误之处：图只能表达部分结构，无法自动表达架构特征、决策理由、组织约束和持续治理。
    source_heading: 6.1 “架构就是高层设计图”
  - term: 8. 本章知识结构
    meaning: 执行机制：由具备技术、业务和人际能力的架构师推动决定、治理实现并持续复查。
    source_heading: 8. 本章知识结构
  - term: 10. 自测问题
    meaning: 因为当时商业操作系统、应用服务器、数据库许可证和物理基础设施成本很高，自动化运维能力也不成熟。结构概念即使存在，也可能在经济和组织上不可行。这个案例说明架构必须放在时代上下文中评价。
    source_heading: 10. 自测问题
