overview:
  kind: summary
  minutes: 12
  question: 原文围绕「0. 本章定位、学习目标与设计主线」建立了怎样的核心认识？
  question_source: 0. 本章定位、学习目标与设计主线
  thesis: 多模型服务的本质是 metadata-driven routing + resource-aware residency。 model ID 决定
    worker/backend，cache policy 决定哪些模型留在有限资源中。
  thesis_source: 7. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位、学习目标与设计主线
    meaning: 代码边界说明：原章明确说明代码经过选取和简化，完整上下文在配套仓库。原文片段中还存在缩进、变量名不一致、缺失锁/超时/关闭流程等问题。本笔记保留其架构意图，并在关键处给出可解析的改写或伪代码；它们用于理解职责和数据流，不应直接作为生产实现。
    source_heading: 0. 本章定位、学习目标与设计主线
  - term: 1. Build an Online LLM Serving Service from Scratch
    meaning: 十余行代码能完成 batch，是因为复杂度没有消失，而是移到了 vLLM 内部。团队仍需理解并配置：最大并发序列、batch token
      budget、GPU memory utilization、模型长度、prefix caching、量化、parallel size 和调度策略。参数名随版本变化，应以所用版本文档为准。
    source_heading: 1. Build an Online LLM Serving Service from Scratch
  - term: 2. A General Design for Single-Model LLM Serving
    meaning: 平台能重启 Pod，却不知道模型何时真正 ready。LLM 启动可能包括下载几十 GB 权重、加载到 GPU、编译 kernel 和 warm-up，因此需要
      startup/readiness probe、graceful drain 和足够 termination grace period。
    source_heading: 2. A General Design for Single-Model LLM Serving
  - term: 4. Trade-offs in Multi-Model Serving Designs
    meaning: 多个 replica 权重相同，但 KV/prefix cache 内容不同。将共享 system prompt、文档或模板前缀的请求路由到已有
      cache 的 replica，可减少重复 prefill。此时 routing key 不只有 model ID，还包括可复用 prefix 的 hash/tenant/version。
    source_heading: 4. Trade-offs in Multi-Model Serving Designs
  - term: 6. 从本章抽象出的系统设计方法
    meaning: 分别测 queue、load/cold start、prefill、decode、stream、IPC 与网络，并注入 worker crash、backend
      timeout、client disconnect、cache stampede 和 load storm。平均 happy-path latency
      不足以证明生产可用。
    source_heading: 6. 从本章抽象出的系统设计方法
  - term: 7. 本章知识结构与核心结论
    meaning: 本章的总方法是：先将单次推理拆成 API、Sequence 调度、executor 和隔离 worker，用稳定 ID 把客户端请求与设备
      batch 解耦，再以事件队列把 token 从集中式执行流准确分发给各客户端；随后把同样的“元数据驱动 + 生命周期管理”扩展到多模型 residency，并依据工作集、cold-start
      代价和 SLO，在共享资源池、独占模型组及两者的混合方案之间选择。
    source_heading: 7. 本章知识结构与核心结论
  logic:
  - 0. 本章定位、学习目标与设计主线
  - 1. Build an Online LLM Serving Service from Scratch
  - 2. A General Design for Single-Model LLM Serving
  - 3. Build a Multi-Model Serving Service from Scratch
