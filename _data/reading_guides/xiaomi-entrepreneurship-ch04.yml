  sections:
  - title: 一、本章主线
    source_heading: 一、本章主线
    paragraphs:
    - 产品层：在成熟手机市场中，怎样建立高端技术和品牌能力；
    - 原则层：公司规模扩大后，哪些东西不能随环境改变；
    - 生态层：手机、智能设备、云和人工智能怎样形成统一体验；
    - 本章的核心不是“业务越做越多”，而是用稳定原则判断哪些新方向值得做，以及如何让它们围绕同一用户价值协同。
  - title: 三、明确“三大铁律”
    source_heading: 三、明确“三大铁律”
    paragraphs:
    - 2020 年，小米用半年多时间集中反思创业十年，并明确“三大铁律”和“三大策略”。
    - 公司经历过高速增长和低谷，已经知道哪些问题关系生死；
    - 全球化、高端化和 AIoT 带来更多机会，容易再次分散；
    - 如果把策略当成铁律，公司会僵化；如果把铁律当成可随时调整的策略，公司会失去长期一致性。
  - title: 4.2 研发投入与人才建设
    source_heading: 4.2 研发投入与人才建设
    paragraphs:
    - 2017 年后研发投入持续快速增长；
    - 计划从 2022 年起在未来五年投入超过 1000 亿元；
    - 2021 年工程师团队约 16000 人；
    - 2022 年计划再招聘约 5000 名青年工程师。
  - title: 4.3 产业基金的作用
    source_heading: 4.3 产业基金的作用
    paragraphs:
    - 小米产业基金投资芯片、自动驾驶、自动控制、装备制造、5G 和人工智能等公司，并与部分企业联合研发。
    - 投资不能替代核心自研。真正关系产品差异和用户数据的能力，仍需公司自己掌握；同时要避免利用投资关系不公平地控制供应商。
  - title: 5.3 性价比原则的边界
    source_heading: 5.3 性价比原则的边界
    paragraphs:
    - 不能依赖长期亏损和补贴制造虚假便宜；
    - 不能把成本转嫁给员工、供应商和环境；
    - 不能通过侵犯隐私或过度广告补回利润；
    - 必须给售后、风险和未来研发保留空间。
  - title: 6.3 三大铁律怎样形成闭环
    source_heading: 6.3 三大铁律怎样形成闭环
    paragraphs:
    - 只有技术，没有产品转化，研发容易脱离用户；
    - 只有酷，没有性价比，创新只能服务少数人；
    - 只有性价比，没有技术，最终会退化成低价竞争。
  - title: 7.2 为什么要同时引进外部高管和提拔年轻人
    source_heading: 7.2 为什么要同时引进外部高管和提拔年轻人
    paragraphs:
    - 外部高管带来成熟行业经验和新视角；
    - 内部年轻管理者理解小米文化和业务历史；
    - 两者结合，可以避免组织完全封闭或完全失去连续性。
  - title: 7.3 新合伙人团队和创业者计划
    source_heading: 7.3 新合伙人团队和创业者计划
    paragraphs:
    - 小米在十周年确立新十年合伙人团队，并通过创业者计划选拔核心年轻干部，给予接近创业者的长期回报。
    - 它要解决的是大公司常见问题：员工只对短期岗位和年度指标负责，缺少对长期公司价值的主人意识。
    - 用长期用户价值而非短期规模评价。
  - title: 九、智能汽车：生态边界再次扩大
    source_heading: 九、智能汽车：生态边界再次扩大
    paragraphs:
    - 2021 年 3 月，小米宣布进入智能电动汽车领域，成立全资子公司，计划十年投入 100 亿美元，首期投入 100 亿元人民币。
    - 全资意味着小米希望掌握产品定义、技术路线、用户体验和长期投入，而不是只做品牌授权或财务投资。
    - 这种选择也意味着承担完整风险：资金、研发、制造、安全、法规、售后和长周期经营都不能交给合作方。
    - 互联网、软件、用户和生态能力可以迁移，但必须重新建设汽车工程和制造能力。第二章“对硬件工业保持敬畏”的教训，在汽车领域更加重要。
  - title: 十一、本章方法论总结
    source_heading: 十一、本章方法论总结
    paragraphs:
    - 第一章：抓住时代机会，以专注、用户共创和高性价比完成从零验证；
    - 第四章：用三大铁律稳定长期方向，向高端和全场景智能生活扩展。
    - 这条路径说明，创业方法会随公司阶段不断升级：早期靠尖锐突破，中期靠系统补课，成熟期靠原则、组织和长期技术能力。
    - 高端化：提高技术、设计、质量和服务，不是依靠品牌加价。 +> 品牌分工：Redmi 坚持极致性价比，小米追求极致技术和体验。 +> 三大铁律：技术为本、性价比为纲、做最酷的产品。
      +> 三大策略：重新创业、互联网加制造、行稳致远。 +> 技术投入：长期研发、工程师人才和产业链联合创新。 +> 手机与 AIoT：手机是主要入口，智能设备通过共享能力形成协同。
      +> 汽车：把智能生活延伸到出行，同时必须重新建设汽车工业能力。 +> 判断标准：所有新业务都要回到使命、用户价值和共享能力。 +> 核心启示：公司进入新阶段后，既要通过技术和产品突破上限，也要用少数稳定原则防止规模和机会让方向再次失控。
