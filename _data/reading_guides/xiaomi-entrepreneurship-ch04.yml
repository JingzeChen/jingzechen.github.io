overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 高端化：提高技术、设计、质量和服务，不是依靠品牌加价。 +> 品牌分工：Redmi 坚持极致性价比，小米追求极致技术和体验。 +> 三大铁律：技术为本、性价比为纲、做最酷的产品。
    +> 三大策略：重新创业、互联网加制造、行稳致远。 +> 技术投入：长期研发、工程师人才和产业链联合创新。 +> 手机与 AIoT：手机是主要入口，智能设备通过共享能力形成协同。
    +> 汽车：把智能生活延伸到出行，同时必须重新建设汽车工业能力。 +> 判断标准：所有新业务都要回到使命、用户价值和共享能力。 +> 核心启示：公司进入新阶段后，既要通过技术和产品突破上限，也要用少数稳定原则防止规模和机会让方向再次失控。
  thesis_source: 十一、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 本章的核心不是“业务越做越多”，而是用稳定原则判断哪些新方向值得做，以及如何让它们围绕同一用户价值协同。
    source_heading: 一、本章主线
  - term: 4.2 研发投入与人才建设
    meaning: 2022 年计划再招聘约 5000 名青年工程师。
    source_heading: 4.2 研发投入与人才建设
  - term: 5.3 性价比原则的边界
    meaning: 必须给售后、风险和未来研发保留空间。
    source_heading: 5.3 性价比原则的边界
  - term: 6.3 三大铁律怎样形成闭环
    meaning: 只有性价比，没有技术，最终会退化成低价竞争。
    source_heading: 6.3 三大铁律怎样形成闭环
  - term: 7.3 新合伙人团队和创业者计划
    meaning: 小米在十周年确立新十年合伙人团队，并通过创业者计划选拔核心年轻干部，给予接近创业者的长期回报。
    source_heading: 7.3 新合伙人团队和创业者计划
  - term: 十一、本章方法论总结
    meaning: 高端化：提高技术、设计、质量和服务，不是依靠品牌加价。 +> 品牌分工：Redmi 坚持极致性价比，小米追求极致技术和体验。 +> 三大铁律：技术为本、性价比为纲、做最酷的产品。
      +> 三大策略：重新创业、互联网加制造、行稳致远。 +> 技术投入：长期研发、工程师人才和产业链联合创新。 +> 手机与 AIoT：手机是主要入口，智能设备通过共享能力形成协同。
      +> 汽车：把智能生活延伸到出行，同时必须重新建设汽车工业能力。 +> 判断标准：所有新业务都要回到使命、用户价值和共享能力。 +> 核心启示：公司进入新阶段后，既要通过技术和产品突破上限，也要用少数稳定原则防止规模和机会让方向再次失控。
    source_heading: 十一、本章方法论总结
