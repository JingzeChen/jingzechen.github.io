overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、阅读边界与全章总览」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与全章总览
  thesis: 多地域低延迟与全局严格配额存在协调代价。 应通过权威中心、子配额或最终一致明确权衡。
  thesis_source: 22. 核心结论与解决限流问题的一般方法
  concepts:
  - term: 0. 学习目标、阅读边界与全章总览
    meaning: 本文严格沿原书顺序讲解。为把算法和工程边界讲透，文中补充连续时间令牌桶公式、排队稳定条件、窗口误差、内存估算、Redis 原子脚本、客户端指数退避等标准内容。这些补充不是作者在本章逐式给出的原文。
    source_heading: 0. 学习目标、阅读边界与全章总览
  - term: 7.1 算法步骤
    meaning: 原书例子：每秒最多 3 次，每个 1 秒窗口中前 3 次通过，之后拒绝，下一秒重置。
    source_heading: 7.1 算法步骤
  - term: 12. Step 3：规则如何创建与存储
    meaning: 需要定义扣减顺序和原子性。若先扣用户桶，随后发现全局桶不足，是否退还用户令牌？可采用预检查后原子多桶扣减，或接受保守消耗。跨 Redis
      分片的多 key 原子事务会显著复杂。
    source_heading: 12. Step 3：规则如何创建与存储
  - term: 14.4 热点与分片
    meaning: 子配额提高吞吐，却可能在某节点空闲、另一节点耗尽时降低利用率；动态借用又增加协调。
    source_heading: 14.4 热点与分片
  - term: 18.4 监控的基数风险
    meaning: 避免把原始 IP/用户 ID 放入 Prometheus label。
    source_heading: 18.4 监控的基数风险
  - term: 22. 核心结论与解决限流问题的一般方法
    meaning: 我先确认限流对象和语义：按用户与接口组合限流，允许短时 burst，但长期平均不能超过配额；超限交互请求返回 429，不排队。基于这个语义选择令牌桶，桶容量控制
      burst，补充率控制持续速率。限流部署在 API Gateway 后、业务 API 前，认证前另有粗粒度 IP 限流。规则由配置服务版本化发布并缓存在节点本地，令牌状态放
      Redis。检查、惰性补充、扣减和 TTL 通过 Lua 原子完成，限流节点保持无状态。多地域为降低延迟按地域分配子配额并周期再平衡，接受利用率与小幅误差的权衡。
    source_heading: 22. 核心结论与解决限流问题的一般方法
  logic:
  - 0. 学习目标、阅读边界与全章总览
  - 7.1 算法步骤
  - 10. 五种算法如何选择
  - 14.4 热点与分片
