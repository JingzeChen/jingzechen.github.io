  sections:
  - title: 0. 学习目标、阅读边界与全章总览
    source_heading: 0. 学习目标、阅读边界与全章总览
    paragraphs:
    - 整个服务每秒最多向付费第三方 API 发起 10,000 次调用。
    - 限制谁：用户、IP、设备、租户、API key，还是全局流量？
    - 限流器自身故障时应 fail-open 还是 fail-closed？
    - 本文严格沿原书顺序讲解。为把算法和工程边界讲透，文中补充连续时间令牌桶公式、排队稳定条件、窗口误差、内存估算、Redis 原子脚本、客户端指数退避等标准内容。这些补充不是作者在本章逐式给出的原文。
  - title: 4. 五类算法的共同问题
    source_heading: 4. 五类算法的共同问题
    paragraphs:
    - Fixed window counter；
    - Sliding window log；
    - Sliding window counter。
    - 超限请求应立即拒绝还是排队平滑输出？
  - title: 7.1 算法步骤
    source_heading: 7.1 算法步骤
    paragraphs:
    - 若新计数不超过阈值 L，放行；否则拒绝；
    - 原书例子：每秒最多 3 次，每个 1 秒窗口中前 3 次通过，之后拒绝，下一秒重置。
  - title: 10. 五种算法如何选择
    source_heading: 10. 五种算法如何选择
    paragraphs:
    - 下面代码使用 Python 标准库实现四种“立即判定”算法，并实现漏桶队列。它用于验证状态转移，不模拟线程安全或分布式 Redis。
    - 注意：示例滑动日志沿用原书“拒绝时间戳仍保留”的语义，因此 1:01:40 时会把 1:00:50 的被拒记录计入窗口。若业务只统计已放行请求，应在拒绝时移除刚插入记录。
  - title: 12. Step 3：规则如何创建与存储
    source_heading: 12. Step 3：规则如何创建与存储
    paragraphs:
    - 原书借鉴 Lyft 开源限流组件，并说明规则通常写在配置文件、保存在磁盘。
    - 规则是策略，计数/令牌是运行时状态。二者应分离：修改规则不应要求部署业务代码，运行状态也不应写回配置系统。
    - 需要定义扣减顺序和原子性。若先扣用户桶，随后发现全局桶不足，是否退还用户令牌？可采用预检查后原子多桶扣减，或接受保守消耗。跨 Redis 分片的多 key
      原子事务会显著复杂。
    - 规则缓存不可用时使用最近版本还是拒绝？
  - title: 14.4 热点与分片
    source_heading: 14.4 热点与分片
    paragraphs:
    - 按地域或节点拆子配额，定期再平衡；
    - 子配额提高吞吐，却可能在某节点空闲、另一节点耗尽时降低利用率；动态借用又增加协调。
  - title: 17. 性能优化：就近处理与最终一致
    source_heading: 17. 性能优化：就近处理与最终一致
    paragraphs:
    - 限流器位于每个请求的前置路径。若亚洲用户每次都去美国 Redis 检查，跨洲 RTT 可能远高于业务服务本身。
    - 原书引用历史时点：截至 2020-05-20，Cloudflare 有 194 个地理分布的边缘位置。这个数字具有时间性，方法论不依赖具体数量。
    - 不同地域先在本地作决定，再异步同步计数。短时间内各地看不到对方最新请求，因此全局可能超发。
    - 这样即使分区也不超全局上限，但某区域用完、其他区域空闲时会拒绝合法流量。可以周期性再平衡，仍有传播延迟。
  - title: 18.4 监控的基数风险
    source_heading: 18.4 监控的基数风险
    paragraphs:
    - 对用户级问题采样日志或用专用分析存储；
    - 对 top offenders 单独追踪；
    - 避免把原始 IP/用户 ID 放入 Prometheus label。
  - title: 20.5 固定窗口与滑动窗口
    source_heading: 20.5 固定窗口与滑动窗口
    paragraphs:
    - 固定窗口按日历边界重置，边界附近可能接近两倍；
    - 滑动计数器是低内存近似，不等于日志。
  - title: 22. 核心结论与解决限流问题的一般方法
    source_heading: 22. 核心结论与解决限流问题的一般方法
    paragraphs:
    - 超限响应是 API 契约。 429、剩余量、Retry-After 和客户端退避共同决定系统是否真正稳定。
    - 我先确认限流对象和语义：按用户与接口组合限流，允许短时 burst，但长期平均不能超过配额；超限交互请求返回 429，不排队。基于这个语义选择令牌桶，桶容量控制
      burst，补充率控制持续速率。限流部署在 API Gateway 后、业务 API 前，认证前另有粗粒度 IP 限流。规则由配置服务版本化发布并缓存在节点本地，令牌状态放
      Redis。检查、惰性补充、扣减和 TTL 通过 Lua 原子完成，限流节点保持无状态。多地域为降低延迟按地域分配子配额并周期再平衡，接受利用率与小幅误差的权衡。
    - Redis 故障时，登录规则使用本地保守 fail-closed，普通读取短时 fail-open。响应带 429、Retry-After 和剩余配额，SDK
      使用带 jitter 的指数退避。最后监控每规则拒绝率、误杀、Redis P99、超发和下游健康，灰度调整阈值。
    - 如果这些问题都能回答，就不仅记住了五种算法，还理解了本章真正的难点：把一个简单的“请求次数不超过阈值”，实现为在高并发、多节点、多地域和故障条件下仍具有清晰语义、可控误差与可运维性的分布式系统。
  takeaways:
  - 低延迟、内存、分布式、异常响应、高容错；
  - 客户端 Retry-After、指数退避和 jitter；
  - 高容错必须定义失败策略。 fail-open、fail-closed 或本地保守降级取决于业务风险。
  - 能否推导滑动计数公式并解释均匀分布假设？
  - 如果这些问题都能回答，就不仅记住了五种算法，还理解了本章真正的难点：把一个简单的“请求次数不超过阈值”，实现为在高并发、多节点、多地域和故障条件下仍具有清晰语义、可控误差与可运维性的分布式系统。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「20.1 限流与身份认证」？
  answer: 认证回答“你是谁”，限流回答“你还能做多少次”。按用户限流依赖认证，但 IP 前置限流可在认证前保护认证服务。
  source_heading: 20.1 限流与身份认证
- level: 概念辨析
  question: 原文如何解释「20.5 固定窗口与滑动窗口」？
  answer: 滑动计数器是低内存近似，不等于日志。
  source_heading: 20.5 固定窗口与滑动窗口
- level: 概念辨析
  question: 原文如何解释「20.10 Sticky session 与状态同步」？
  answer: 粘滞把客户端固定到某节点，不能解决节点故障、多设备、再平衡和全局配额。共享状态更灵活。
  source_heading: 20.10 Sticky session 与状态同步
- level: 概念辨析
  question: 原文如何解释「20.14 全局严格限流与低延迟多地域」？
  answer: 全球严格共享配额需要协调；就近独立决策会有状态延迟。不能同时假设零协调成本和零超发。
  source_heading: 20.14 全局严格限流与低延迟多地域
- level: 概念辨析
  question: 原文如何解释「20.18 精确算法与正确业务」？
  answer: 滑动日志可以精确执行错误阈值；算法准确不等于规则有效。监控必须同时验证二者。
  source_heading: 20.18 精确算法与正确业务
