overview:
  kind: summary
  minutes: 9
  question: 0. 本章位置：三条定律为何要在结尾重访？
  question_source: 0. 本章位置：三条定律为何要在结尾重访
  thesis: 原章 Table 27-2 的 Markdown 转换结果把 “Less extensible” 放在 Advantage 列、把 “Good
    support for extensibility and evolvability” 放在 Disadvantage 列，与相邻正文及 Table 27-3
    逻辑冲突。这里按正文的明确论证解释：queue 的 extensibility 较弱，topic 的 extensibility/evolvability
    较强；不把转换后的错位列当作新结论。
  thesis_source: 'First Law: Everything in Software Architecture Is a Trade-Off'
  concepts:
  - term: 0. 本章位置：三条定律为何要在结尾重访
    meaning: 第一版写作时，作者原本希望总结许多普遍规律，最后只找到前两条；第二版写作过程中，又逐渐识别出第三条。这一点本身很重要：作者把“law”保留给跨场景仍然成立的高层规律，而没有把某个时代的
      technology、pattern 或 best practice 提升为永恒真理。
    source_heading: 0. 本章位置：三条定律为何要在结尾重访
  - term: 'First Law: Everything in Software Architecture Is a Trade-Off'
    meaning: 原章 Table 27-2 的 Markdown 转换结果把 “Less extensible” 放在 Advantage 列、把 “Good
      support for extensibility and evolvability” 放在 Disadvantage 列，与相邻正文及 Table 27-3
      逻辑冲突。这里按正文的明确论证解释：queue 的 extensibility 较弱，topic 的 extensibility/evolvability
      较强；不把转换后的错位列当作新结论。
    source_heading: 'First Law: Everything in Software Architecture Is a Trade-Off'
  - term: 'Second Law: Why Is More Important Than How'
    meaning: 而且 trade-off table 仍有价值：团队已经提前知道 service 的 versioning、runtime change
      risk、performance、fault tolerance 和 scalability 风险，可为它们设计 mitigation。
    source_heading: 'Second Law: Why Is More Important Than How'
  - term: The Spectrum Between Extremes
    meaning: 也就是说，一项决定越会显著影响 architectural characteristics、structure、coupling、deployment、team
      或长期 change cost，它越靠近 architecture 一端。若选项之间代价很小、影响局部且易逆转，则更靠近 design/implementation
      一端。
    source_heading: The Spectrum Between Extremes
  - term: Parting Words of Advice
    meaning: 先理解机制，再识别 forces；先绑定 context，再比较 options；先说明 compromise，再作决定；既记录 How，也记录
      Why；最后设置 review trigger，并准备在条件变化时重新分析。
    source_heading: Parting Words of Advice
  logic:
  - 0. 本章位置：三条定律为何要在结尾重访
  - 'First Law: Everything in Software Architecture Is a Trade-Off'
  - 'Second Law: Why Is More Important Than How'
  - The Spectrum Between Extremes
  - Parting Words of Advice
  sections:
  - title: 0. 本章位置：三条定律为何要在结尾重访
    source_heading: 0. 本章位置：三条定律为何要在结尾重访
    paragraphs:
    - Everything in software architecture is a trade-off：软件架构中的一切都是权衡；
    - Most architecture decisions aren’t binary but rather exist on a spectrum between
      extremes：大多数架构决策不是二元选择，而是位于两个极端之间的连续谱。
    - 第一版写作时，作者原本希望总结许多普遍规律，最后只找到前两条；第二版写作过程中，又逐渐识别出第三条。这一点本身很重要：作者把“law”保留给跨场景仍然成立的高层规律，而没有把某个时代的
      technology、pattern 或 best practice 提升为永恒真理。
    - 识别选项及代价 -> 用上下文确定优先级 -> 选择连续谱上的合适位置 -> 记录 Why -> 在条件变化时重新评估。
  - title: 'First Law: Everything in Software Architecture Is a Trade-Off'
    source_heading: 'First Law: Everything in Software Architecture Is a Trade-Off'
    paragraphs:
    - 不过 scalability 不只是单次调用成本。Shared service 可独立扩容，而 library 会随每个 caller 复制 resource
      usage。原章表格关注的是本案例中的调用效率；实际决策仍需结合 state、resource footprint、instance count 和 scaling
      unit 分析。
    - 原章 Table 27-2 的 Markdown 转换结果把 “Less extensible” 放在 Advantage 列、把 “Good support
      for extensibility and evolvability” 放在 Disadvantage 列，与相邻正文及 Table 27-3 逻辑冲突。这里按正文的明确论证解释：queue
      的 extensibility 较弱，topic 的 extensibility/evolvability 较强；不把转换后的错位列当作新结论。
    - 作者把它与 Domain-Driven Design 的 bounded context 联系起来：不同 bounded contexts 不应复用彼此的
      implementation details。即便同一个词出现在两个上下文中，它的 meaning、rules 与 lifecycle 也可能不同。强行共用一个
      domain model 会把本应独立演化的边界重新耦合起来。
    - 作者针对 institutional implementation reuse 的结论很强：组织不能同时拥有高度 decoupling 与高度 reuse，因为这种
      reuse 必须建立 shared dependency，而 shared dependency 就是 coupling；二者 fundamentally
      incompatible。
  - title: 'Second Law: Why Is More Important Than How'
    source_heading: 'Second Law: Why Is More Important Than How'
    paragraphs:
    - Architecture Decision Record, ADR 记录 context、decision、alternatives、trade-offs、consequences
      和理由，即 Why。
    - 只有 ADR 没有 diagram，也难以看清决定落到 system topology 后产生的实际关系。因此二者不是替代品，而是同一 architecture
      story 的两半。
    - Out of Context antipattern 指 architect 理解各方案的一般 trade-offs，却没有根据当前 context 为它们正确加权。
    - 而且 trade-off table 仍有价值：团队已经提前知道 service 的 versioning、runtime change risk、performance、fault
      tolerance 和 scalability 风险，可为它们设计 mitigation。
  - title: The Spectrum Between Extremes
    source_heading: The Spectrum Between Extremes
    paragraphs:
    - Most architecture decisions aren’t binary but rather exist on a spectrum between
      extremes.
    - 以下是教学性应用举例，原章未逐项展开：queue 与 topic 并非只能全系统二选一。Sensitive commands 可走 dedicated
      queues，公开 domain events 可走 topics；关键是说明每条 flow 的 forces，而不是追求技术标签纯度。
    - A software architecture decision is one where each of the options has significant
      trade-offs.
    - 也就是说，一项决定越会显著影响 architectural characteristics、structure、coupling、deployment、team
      或长期 change cost，它越靠近 architecture 一端。若选项之间代价很小、影响局部且易逆转，则更靠近 design/implementation
      一端。
  - title: Parting Words of Advice
    source_heading: Parting Words of Advice
    paragraphs:
    - 作者在 companion website 提供 architecture katas，让新老 architects 练习设计。使用者经常询问 answer
      guide，作者的回答是：没有。
    - There are not right or wrong answers in architecture—only trade-offs.
    - 它真正强调的是：不能只凭 topology 与参考答案是否一致来评分。一个决定是否合理，取决于它能否在给定 context 下解释并承担 trade-offs。
    - 先理解机制，再识别 forces；先绑定 context，再比较 options；先说明 compromise，再作决定；既记录 How，也记录 Why；最后设置
      review trigger，并准备在条件变化时重新分析。
  takeaways:
  - 识别选项及代价 -> 用上下文确定优先级 -> 选择连续谱上的合适位置 -> 记录 Why -> 在条件变化时重新评估。
  - 作者针对 institutional implementation reuse 的结论很强：组织不能同时拥有高度 decoupling 与高度 reuse，因为这种
    reuse 必须建立 shared dependency，而 shared dependency 就是 coupling；二者 fundamentally
    incompatible。
  - 而且 trade-off table 仍有价值：团队已经提前知道 service 的 versioning、runtime change risk、performance、fault
    tolerance 和 scalability 风险，可为它们设计 mitigation。
  - 也就是说，一项决定越会显著影响 architectural characteristics、structure、coupling、deployment、team
    或长期 change cost，它越靠近 architecture 一端。若选项之间代价很小、影响局部且易逆转，则更靠近 design/implementation
    一端。
  - 先理解机制，再识别 forces；先绑定 context，再比较 options；先说明 compromise，再作决定；既记录 How，也记录 Why；最后设置
    review trigger，并准备在条件变化时重新分析。
