overview:
  kind: summary
  minutes: 8
  question: 原文围绕「2. 几何与线性代数运算」建立了怎样的核心认识？
  question_source: 2. 几何与线性代数运算
  thesis: 矩阵微分的核心是保持形状并用微分/迹重组，不同资料的布局约定可能不同。
  thesis_source: 17. 核心结论
  concepts:
  - term: 2. 几何与线性代数运算
    meaning: 原书 Fashion-MNIST 例用两类均值差作为法向量。这只利用类质心，忽略类内协方差，属于直观基线，不等同于完整的 Fisher 判别或逻辑回归。
    source_heading: 2. 几何与线性代数运算
  - term: 6. 积分
    meaning: 仅假设映射单射不足以保证代换定理，还需可微、非退化等条件。极坐标在原点和角度边界并非严格一一对应，但异常集合测度为零。
    source_heading: 6. 积分
  - term: 11.3 标准差与标准误
    meaning: 标准误：估计量抽样分布的标准差。
    source_heading: 11.3 标准差与标准误
  - term: 12. 信息论
    meaning: 原文将排序后的高斯原始样本当概率向量、忽略 NaN 再取绝对值，完全不是合法 KL 计算。概率输入必须非负且归一化，连续分布应使用解析密度或一致的密度估计。
    source_heading: 12. 信息论
  - term: 14.4 概率与分布
    meaning: 经典 iid CLT 不需要四阶矩有限。
    source_heading: 14.4 概率与分布
  - term: 18. 解决数学问题的一般思路
    meaning: 本章可以压缩为一句话：线性代数描述数据和模型如何在空间中变换，特征分解揭示不变方向与长期尺度；微积分用局部线性化和链式法则产生优化与反向传播，积分把局部密度累积为全局量；概率给不确定性建立语言，最大似然把模型与数据连接，统计学约束我们如何从有限样本得出结论，信息论则把不确定性、依赖和损失统一为可计算的量。真正掌握这些工具，不是记住公式，而是清楚每个等式的对象、条件、方向、数值实现和失效边界。
    source_heading: 18. 解决数学问题的一般思路
  logic:
  - 2. 几何与线性代数运算
  - 6. 积分
  - 9. 常见概率分布
  - 12. 信息论
  - 14.1 线性代数
  - 14.6 统计与信息论
  - 18. 解决数学问题的一般思路
  sections:
  - title: 2. 几何与线性代数运算
    source_heading: 2. 几何与线性代数运算
    paragraphs:
    - 点视角适合描述样本、参数和 embedding；方向视角适合描述梯度、更新和两个样本之间的差异。
    - 它忽略正比例缩放，适合文本和 embedding 方向比较。但方向相似不等于原始数值相近，且零向量无定义。
    - 线性分类器的决策边界就是超平面；深层网络可理解为先学习非线性表示，再在表示空间中用超平面分隔。
    - 原书 Fashion-MNIST 例用两类均值差作为法向量。这只利用类质心，忽略类内协方差，属于直观基线，不等同于完整的 Fisher 判别或逻辑回归。
  - title: 4. 单变量微积分
    source_heading: 4. 单变量微积分
    paragraphs:
    - 导数存在表示函数在该点可被线性近似。导数不是“两个无穷小的比”，而是差商的极限。
    - Taylor 多项式唯一匹配给定阶导数，但“最佳”需指定误差标准；
    - 边界点和不可微点也可能是最优点。全局优化还需比较函数值和端点/无穷远行为。
    - h 不能无限小：过小时浮点消减误差上升。数值差分适合 gradient check，不适合大规模训练。
  - title: 6. 积分
    source_heading: 6. 积分
    paragraphs:
    - f 绝对可积时用 Fubini；
    - 仅假设映射单射不足以保证代换定理，还需可微、非退化等条件。极坐标在原点和角度边界并非严格一一对应，但异常集合测度为零。
  - title: 9. 常见概率分布
    source_heading: 9. 常见概率分布
    paragraphs:
    - 它可由大量独立稀有事件极限得到，用于单位时间计数。过度离散数据若方差显著大于均值，负二项分布可能更合适。
    - 所以 A 凸。Bernoulli、Gaussian、Poisson 等都属于指数族，它与广义线性模型、共轭先验和最大熵紧密相关。
  - title: 11.3 标准差与标准误
    source_heading: 11.3 标准差与标准误
    paragraphs:
    - 数据标准差：个体观测的离散程度；
    - 标准误：估计量抽样分布的标准差。
  - title: 12. 信息论
    source_heading: 12. 信息论
    paragraphs:
    - 原文将排序后的高斯原始样本当概率向量、忽略 NaN 再取绝对值，完全不是合法 KL 计算。概率输入必须非负且归一化，连续分布应使用解析密度或一致的密度估计。
    - 深度学习库的交叉熵通常使用自然对数，原文章节声明 bit 但代码使用自然对数，单位不一致。
    - 在表示学习中，它说明确定性层不能增加输入中关于标签的 Shannon 信息；网络的价值在于丢弃无关信息并形成可用表示，而非创造不存在的信息。
    - KL 非负可用 Jensen 或 log-sum inequality。
  - title: 14.1 线性代数
    source_heading: 14.1 线性代数
    paragraphs:
    - 一般方阵的秩不等于非零特征值数；
    - 行列式是有向体积，几何体积取绝对值；
    - 幂迭代需唯一主模、非零主投影等条件；
    - 原 TensorFlow Fashion-MNIST 超平面示例存在数据缩放、标签与预测轴错误。
  - title: 14.4 概率与分布
    source_heading: 14.4 概率与分布
    paragraphs:
    - Chebyshev 的取等讨论应使用包含边界的事件；
    - Bernoulli CDF、离散均匀采样和 Poisson CDF 代码存在边界/残留变量错误；
    - 经典 iid CLT 不需要四阶矩有限。
  - title: 14.6 统计与信息论
    source_heading: 14.6 统计与信息论
    paragraphs:
    - 正确 MSE 分解没有固定参数的方差项；
    - 小样本未知方差均值区间应使用 t 分位数；
    - 原 KL 示例输入不是概率分布，结果无意义；
    - 信息单位必须区分 bit 与 nat。
  - title: 18. 解决数学问题的一般思路
    source_heading: 18. 解决数学问题的一般思路
    paragraphs:
    - 使用稳定变换：solve、Cholesky、logsumexp、softplus 和 log-domain probability。
    - 测试边界和反例：零向量、奇异矩阵、Cauchy、XOR、零概率和非绝对可积函数最能暴露误解。
    - 把数学映射回模型：线代解释层，微积分解释训练，概率解释预测，统计解释评价，信息论解释损失。
    - 本章可以压缩为一句话：线性代数描述数据和模型如何在空间中变换，特征分解揭示不变方向与长期尺度；微积分用局部线性化和链式法则产生优化与反向传播，积分把局部密度累积为全局量；概率给不确定性建立语言，最大似然把模型与数据连接，统计学约束我们如何从有限样本得出结论，信息论则把不确定性、依赖和损失统一为可计算的量。真正掌握这些工具，不是记住公式，而是清楚每个等式的对象、条件、方向、数值实现和失效边界。
  takeaways:
  - 向量既表示点也表示方向，矩阵是由基向量的像完全决定的线性变换。
  - 实对称矩阵拥有正交特征基，特征值控制二次型和曲率。
  - 矩阵微分的核心是保持形状并用微分/迹重组，不同资料的布局约定可能不同。
  - 参数约束应通过 sigmoid、softplus 等重参数化，而非让优化器越界。
  - 数据处理不等式说明后处理不能凭空增加关于输入的信息。
