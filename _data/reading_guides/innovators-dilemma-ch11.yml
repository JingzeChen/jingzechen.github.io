- level: 概念辨析
  question: 原文如何解释「17.1 “本书证明良好管理是错的”」？
  answer: 不对。2.2 节明确：”企业并不应该……放弃这些曾使它们在主流市场大放异彩的能力、组织结构和决策流程”，因为”绝大多数创新挑战在本质上都属于延续性创新”（111/116
    ≈ 95.7%）。结论是”良好管理有适用条件”，不是”良好管理有害”。
  source_heading: 17.1 “本书证明良好管理是错的”
- level: 概念辨析
  question: 原文如何解释「17.3 “客户数据在破坏性情形下没用”」？
  answer: 不准确。作者的用词是”误导性“（misleading），比”无用”严重得多——它提供看似可靠的错误信息。第九章礼来案例中，内分泌学家的建议真诚且专业，正因如此才更危险。
  source_heading: 17.3 “客户数据在破坏性情形下没用”
- level: 概念辨析
  question: 原文如何解释「17.5 “破坏性技术碰巧在可靠性、便捷性上更好”」？
  answer: 不是碰巧。它们共享同一个根源——结构更简单同时导致更便宜、更可靠、更便捷。因此竞争基础的迁移方向（功能性 → 可靠性 → 便捷性 → 价格）与破坏者的优势方向天然一致，这是机制中最具决定性的一环。
  source_heading: 17.5 “破坏性技术碰巧在可靠性、便捷性上更好”
- level: 概念辨析
  question: 原文如何解释「17.8 “本书的四项原则是完整清单”」？
  answer: 不完整。第十一章的四项是 1997 年初版结构，修订版引言列出五项，新增”机构的能力决定了它的局限性”（对应第八章 RPV 框架）。
  source_heading: 17.8 “本书的四项原则是完整清单”
- level: 概念辨析
  question: 原文如何解释「17.9 “问题 12 的答案是客户导向已经过时”」？
  answer: 错。正确答案是”良好管理”的定义不变，改变的是必须附加情境判断。综合两者精华的体系不是一套两全的方法，而是能同时容纳两套方法的组织架构（图 8.1
    + 独立机构 + 规模匹配）。
  source_heading: 17.9 “问题 12 的答案是客户导向已经过时”
