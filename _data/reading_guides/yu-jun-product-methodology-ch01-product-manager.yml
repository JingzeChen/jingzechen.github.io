  minutes: 8
  question: 原文围绕「1. 本章要回答的问题」建立了怎样的核心认识？
  question_source: 1. 本章要回答的问题
  thesis: 对应工作可能包括市场宣传、运营活动、增长、渠道和售后。组织可以把这些工作交给专职岗位，也可以让增长产品经理承担。职能边界可以变化，但“产品只有被用户选择和使用，价值交换才真正发生”这一点不变。
  thesis_source: 7.3 销售：让用户真正使用产品
  concepts:
  - term: 1. 本章要回答的问题
    meaning: "“产品经理”在不同公司里可能指完全不同的工作。有人负责需求，有人负责项目，有人负责运营增长，还有人承担接近业务负责人的职责。如果只按日常任务定义产品经理，很容易得到互相矛盾的答案。"
    source_heading: 1. 本章要回答的问题
  - term: 体验不是产品的全部
    meaning: 体验提升的成本是否低于它创造的增量价值？
    source_heading: 体验不是产品的全部
  - term: 8.1 为什么不是可以套公式的自然科学
    meaning: 产品工作更接近社会科学，因为产品面对的是会学习、会博弈、会受环境影响的人。用户选择不仅受产品功能影响，还受偏好、认知、制度、资源、他人行为和具体情境影响。
    source_heading: 8.1 为什么不是可以套公式的自然科学
  - term: 9.4 两层情境：宏观背景与微观场景
    meaning: 书中的例子是巴西用户常在聚会后共同打车，并习惯 AA 制，因此打车产品可能更需要途经点和订单分摊功能。若只把其他国家的产品方案原样复制过去，就会遗漏当地高频需求。
    source_heading: 9.4 两层情境：宏观背景与微观场景
  - term: 12.1 判断岗位真实价值
    meaning: 组织希望他改善局部交付效率，还是承担整体业务取舍？
    source_heading: 12.1 判断岗位真实价值
  - term: 16. 复习卡片
    meaning: Q：为什么产品工作是强实践性的社会科学？ A：研究对象是具有异质性、情境性和博弈性的人，结论难以完全重复验证，只能在具体约束下通过实践持续校正。
    source_heading: 16. 复习卡片
