  minutes: 12
  question: 原文围绕「本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 本章要回答的核心问题
  thesis: 服务化的根因是共享稀缺资源治理。 远程启动只是起点，队列、公平、隔离、弹性和持久状态才是核心。
  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 本章以软件系统设计为主，只介绍理解训练服务所需的基本优化过程。本文会补充损失函数、梯度更新、资源利用率、排队和可复现性的形式化表达，用来解释作者的工程论证；这些补充并非原章另行提出的算法。原章中的云价格和
      Kubeflow 组件状态带有成书时点，阅读时应把它们视为决策方法的例证，而不是 2026 年的实时产品报价或版本说明。
    source_heading: 本章要回答的核心问题
  - term: 3.2 深度学习训练代码的通用模式
    meaning: 原章说训练在完成预期轮数或达到预期模型准确率时结束。实践中不应直接用训练集 accuracy 决定停止，因为继续拟合可能降低未见数据上的效果。更常见的是观察验证损失
      / 指标，使用 patience 早停，并在独立测试集上只做最终评价。
    source_heading: 3.2 深度学习训练代码的通用模式
  - term: 3.3 样例模型训练服务
    meaning: 如果容器启动成功、服务却在记录映射前崩溃，会产生仍在消耗 GPU 的孤儿容器；如果先标记 launching、Docker create
      失败，则作业会卡在错误状态。可靠实现应使用幂等标签、期望状态记录和周期性 reconciliation 来收敛，而不是依赖一次跨系统操作原子成功。
    source_heading: 3.3 样例模型训练服务
  - term: 3.5 何时使用公有云
    meaning: Amazon SageMaker、Google Vertex AI、Azure Machine Learning 等托管平台不仅提供训练，还覆盖数据处理、存储、版本、排障和部署。作者不比较哪家最好，而是从企业阶段与约束判断“买”还是“建”。
    source_heading: 3.5 何时使用公有云
  - term: 核心结论
    meaning: Kubernetes Operator 通过持续调和期望与实际状态，把训练框架运维知识编码成控制器。 CR spec 是请求，status
      是观察结果。
    source_heading: 核心结论
  - term: 复习与自测
    meaning: Kubernetes controller 的 desired state、observed state 和 reconcile 分别是什么？
    source_heading: 复习与自测
