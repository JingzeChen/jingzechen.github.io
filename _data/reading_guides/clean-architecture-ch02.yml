overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章最终要求团队建立双重责任：让软件现在正确工作，也让它以后仍然容易改变。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 作者认为，开发者对两种价值都负有责任。现实中，团队往往只关注当前功能和缺陷，因为它们可见、紧急、容易进入排期；结构价值不容易直接演示，也很少有明确截止日期，于是持续被挤压。
    source_heading: 本章导读
  - term: 2.1 什么是行为价值
    meaning: 行为价值是让机器按照利益相关者的要求行动，从而赚钱、省钱、提高效率或控制风险。
    source_heading: 2.1 什么是行为价值
  - term: 4.1 作者提出的问题
    meaning: 如果询问管理者，他们往往会回答：系统先要能工作。开发者也经常接受这个判断，因为功能是当前交付的直接目标。
    source_heading: 4.1 作者提出的问题
  - term: 4.4 这个思想实验不代表什么
    meaning: 只要代码容易改，功能和质量就不重要。
    source_heading: 4.4 这个思想实验不代表什么
  - term: 6. Fight for the Architecture
    meaning: 开发团队应说明：第二种方案增加多少当前工作，又会降低哪些已知后续成本。业务方则提供时机和收益信息。双方共同选择，而不是一方用口号压过另一方。
    source_heading: 6. Fight for the Architecture
  - term: 本章总结
    meaning: Fight for the Architecture 是平等协商，不是凭技术职位否决业务。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 2.1 什么是行为价值
  - 2.2 需求、规格、实现与缺陷
  - 4.4 这个思想实验不代表什么
  - 5. Eisenhower’s Matrix
  - 1. 需求分析阶段
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Behavior（行为价值）：机器现在是否按照要求工作；
    - Architecture（结构价值）：机器的行为以后是否容易改变。
    - 作者认为，开发者对两种价值都负有责任。现实中，团队往往只关注当前功能和缺陷，因为它们可见、紧急、容易进入排期；结构价值不容易直接演示，也很少有明确截止日期，于是持续被挤压。
    - 修改困难不一定来自需求范围，也可能来自需求与现有结构的形状不匹配；
  - title: 1.2 两种价值不是两个独立模块
    source_heading: 1.2 两种价值不是两个独立模块
    paragraphs:
    - 规则集中、可测试且不依赖页面，提供结构价值；
    - 金额算对了，但同一规则复制到五个渠道，行为暂时正确，结构却在恶化；
    - 接口设计很漂亮，但金额计算错误，结构再好也无法交付价值。
    - 所以，团队不能在二者之间永久二选一，而应在实现当前行为时保护未来修改能力。
  - title: 2.1 什么是行为价值
    source_heading: 2.1 什么是行为价值
    paragraphs:
    - 行为价值是让机器按照利益相关者的要求行动，从而赚钱、省钱、提高效率或控制风险。
    - 开发者帮助利益相关者形成需求或功能规格；
    - 当实际行为偏离要求时，定位并修复缺陷。
  - title: 2.2 需求、规格、实现与缺陷
    source_heading: 2.2 需求、规格、实现与缺陷
    paragraphs:
    - 规格把结果转成更明确的输入、输出和规则；
    - 缺陷是实际行为与所需行为之间的偏差。
    - 如果需求本身含糊，程序即使通过演示也不一定真的正确。边界输入、并发、失败、权限和异常路径都可能未被说明。
  - title: 4.1 作者提出的问题
    source_heading: 4.1 作者提出的问题
    paragraphs:
    - 如果询问管理者，他们往往会回答：系统先要能工作。开发者也经常接受这个判断，因为功能是当前交付的直接目标。
    - 作者认为，这个排序忽略了软件会持续变化，于是用两个极端情况进行思想实验。
  - title: 4.4 这个思想实验不代表什么
    source_heading: 4.4 这个思想实验不代表什么
    paragraphs:
    - 架构师可以用未来灵活性拒绝当前需求；
    - 只要代码容易改，功能和质量就不重要。
  - title: 5. Eisenhower’s Matrix
    source_heading: 5. Eisenhower’s Matrix
    paragraphs:
    - 原书图示：Figure 2.1：Eisenhower Matrix 作者引用美国总统 Dwight D. Eisenhower 在 1954 年演讲中表达的观点：问题可分为紧急和重要两类，紧急的往往不重要，重要的往往不紧急。
    - 但行为不总是特别重要。例如，一项临时展示调整可能必须明天完成，却不会影响核心业务。
    - 结构通常很重要，因为它影响未来所有修改。但结构很少在某个上午突然产生截止时间，所以不容易显得紧急。
    - 后期： 关键变化无法按期完成，或者一改就发生严重故障。
  - title: 6. Fight for the Architecture
    source_heading: 6. Fight for the Architecture
    paragraphs:
    - 因此作者使用 Fight，随后又说 Struggle 可能更合适：开发、管理、市场、销售和运营都要为自己认为对公司重要的事情争取。
    - 如果架构永远排在最后，系统开发成本会持续上升，部分功能或配置最终会变得实际上无法修改。
    - 开发团队应说明：第二种方案增加多少当前工作，又会降低哪些已知后续成本。业务方则提供时机和收益信息。双方共同选择，而不是一方用口号压过另一方。
    - 作者把这视为开发团队没有充分履行职责的结果。这个判断很严厉，但其目的不是责备某个人，而是强调：结构价值不会自动得到保护，必须有人持续维护。
  - title: 1. 需求分析阶段
    source_heading: 1. 需求分析阶段
    paragraphs:
    - 明确当前需要的行为及其边界条件；
    - 区分业务规则与 UI、数据库、协议细节；
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - Software 的 Soft 表示机器行为应当容易改变，这是软件区别于硬件的重要价值。
    - Scope 是需求固有范围，Shape 是需求必须穿过的模块、层、团队和技术边界。
    - Shape Agnostic 是尽量避免不必要的结构偏好，不是预先设计所有未来扩展点。
    - Fight for the Architecture 是平等协商，不是凭技术职位否决业务。
  takeaways:
  - 每个软件系统都提供行为与结构两种价值，开发者必须同时维护二者。
  - 同一满减需求在规则集中时很局部，在逻辑散落时可能横跨整个系统。
  - Eisenhower 矩阵区分重要与紧急，原书把重要性放在单纯紧急性之前。
  - 开发者和架构师都是利益相关者，有责任保护软件资产的持续可变更性。
  - 本章最终要求团队建立双重责任：让软件现在正确工作，也让它以后仍然容易改变。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 行为价值就是功能数量」？
  answer: 行为价值看的是机器是否正确满足真实要求，也包括安全、可靠性、数据正确性和失败处理，不只是功能清单长度。
  source_heading: 1. 行为价值就是功能数量
- level: 概念辨析
  question: 原文如何解释「2. 架构价值就是代码看起来漂亮」？
  answer: 架构价值体现在修改、测试、替换和协作成本上。美观命名有帮助，但不是最终目标。
  source_heading: 2. 架构价值就是代码看起来漂亮
- level: 概念辨析
  question: 原文如何解释「4. 软件应对任何未来变化都容易修改」？
  answer: 不现实。架构只能在实际可行范围内减少对特定形状的偏爱，并围绕已知变化建立边界。
  source_heading: 4. 软件应对任何未来变化都容易修改
- level: 概念辨析
  question: 原文如何解释「7. 所有架构工作天然重要」？
  answer: 架构工作也可能只是技术追新或个人偏好。必须说明它保护了什么业务能力或降低了什么风险。
  source_heading: 7. 所有架构工作天然重要
- level: 概念辨析
  question: 原文如何解释「9. 技术债可以以后集中偿还」？
  answer: 坏结构会从下一项需求开始持续增加成本。集中偿还还可能演变为高风险重写，因此更适合随日常修改增量治理。
  source_heading: 9. 技术债可以以后集中偿还
