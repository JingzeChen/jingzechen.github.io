    source_heading: 6.7 第二项分析：好感通常有效，但会被互惠压过
  - term: 14.1 两个研究问题
    meaning: 效果能否推广到足够多人，而不只是作者这个容易顺从的个体？
    source_heading: 14.1 两个研究问题
  - term: 16. 请求顺序怎样进入审查、推销与日常谈判
    meaning: 马歇尔在《拉芙妮与雪莉》中先准备更生猛的表达，待审查员删去后，再提出包含“性欲消退”的版本；在《快乐日子》中，他曾把“处女”一词连续使用
      7 次，预期审查者删掉 6 次、留下 1 次，结果果然如此。“怀孕”一词也采用了同样做法。
    source_heading: 16. 请求顺序怎样进入审查、推销与日常谈判
  - term: 24. 核心概念的关系与区别
    meaning: 广义社会交换中也可能有“以负面行为回应负面行为”，但本章主要研究善意、礼物和让步所引发的正向回报义务。不要把作者的互惠原理无限扩展成所有“你怎样对我、我就怎样对你”的反应。
    source_heading: 24. 核心概念的关系与区别
  - term: 29. 本章总结：知识结构、核心结论与一般方法
    meaning: 互惠不是需要被戒除的弱点，而是人类把“现在的给予”变成“未来可依赖合作”的基础设施。问题发生在请求者掌握了赠礼、接受和回报的定义权，或用虚假大要求把真正目标伪装成让步。
    source_heading: 29. 本章总结：知识结构、核心结论与一般方法
