  sections:
  - title: 0. 导读：本章究竟在解释什么
    source_heading: 0. 导读：本章究竟在解释什么
    paragraphs:
    - 互惠越能可靠地保护率先给予者，合作越容易启动；也正因为社会成员不愿违背它，掌握赠礼和退让顺序的人便可能把选择权从接受者手中夺走。
    - 原书报告了多组比例、价格和倍数，但没有提供一套可代入计算的“互惠公式”或“顺从算法”。下文的符号式、效应换算和流程图均是笔记的解释性整理；原书数据会明确标明，补充模型不会冒充原书实验结果。
    - 先索取，再以较小要求继续索取：先提出容易被拒绝的大要求，再“退让”到真正目标，使接受者觉得自己也该退一步。
    - 其中 D 表示主观债务压力。这是笔记的解释式：一方面，欠人情本身令人不舒服；另一方面，人也害怕被视为忘恩负义、只取不予。两种压力共同促使人尽快偿还。
  - title: 4. 埃塞俄比亚援助墨西哥：人情债怎样跨越五十年
    source_heading: 4. 埃塞俄比亚援助墨西哥：人情债怎样跨越五十年
    paragraphs:
    - 1985 年的埃塞俄比亚正遭受严重干旱、内战、饥荒和经济崩溃，本身急需国际援助。墨西哥城发生地震后，埃塞俄比亚红十字会却向墨西哥捐出 5 000 美元。
    - 记者追查后发现，1935 年意大利入侵埃塞俄比亚时，墨西哥曾向埃塞俄比亚提供援助。半个世纪后，埃塞俄比亚把此次捐款理解为偿还旧恩。
    - 案例因此生动展示互惠规范的持久力和集体记忆。但它仍是历史个案，不能单独证明所有国家都会在相同条件下回报，也不能排除外交、象征意义等共同动机。
    - 同一笔 5 000 美元，若只看 1985 年是资源外流；放入 1935 至 1985 年的交换链，它则是偿还信誉债务。问题的关键在于选择了多长的时间窗口。
  - title: 6.7 第二项分析：好感通常有效，但会被互惠压过
    source_heading: 6.7 第二项分析：好感通常有效，但会被互惠压过
    paragraphs:
    - 在没有可乐造成亏欠时，越喜欢乔的人通常买得越多；
    - 一旦接受了乔的可乐，好感与购票之间的关系退居次要；
    - 欠人情者不论是否喜欢乔，都会购买较多彩票。
  - title: 10. 第三种可利用特征：小恩惠可能换来不对等回报
    source_heading: 10. 第三种可利用特征：小恩惠可能换来不对等回报
    paragraphs:
    - 互惠要求“以善意回应善意”，但日常恩惠缺少统一价格：一次帮助、一个引荐、一顿饭和一项照料无法像商品一样准确结算。价值弹性让跨种类合作成为可能，也允许施予者把小礼与大请求连接起来。
    - 真正需要比较的不是“帮过我，所以该不该帮”，而是怎样回报才与风险相称。感谢、支付启动服务费用或提供其他低风险帮助，都可能比借出无保险车辆更合理。
    - 原书讨论一种严重风险：女性没有自行埋单、而由男性购买饮料后，不论男性还是女性评价者，都更可能判断她会与该男子发生性关系。该研究测量的是旁观者或评价者的社会判断，不是女方的实际意愿，也不是约会双方是否形成了同一推断。作者借学生经历说明，性别规范会把普通给予错误地转换成身体回报预期。
    - 互惠原理只能解释为什么有人会感到压力、为什么旁观者可能产生偏见；它不能为施压、胁迫或侵犯提供任何正当性。实用防御不应只要求潜在接受者拒绝一切给予，还包括施予者主动消除条件暗示、尊重拒绝，以及组织建立清晰的反骚扰和同意规范。
  - title: 14.1 两个研究问题
    source_heading: 14.1 两个研究问题
    paragraphs:
    - 效果能否推广到足够多人，而不只是作者这个容易顺从的个体？
    - 第二项要求能否本身也很有分量，只是相对第一项较小？
  - title: 16. 请求顺序怎样进入审查、推销与日常谈判
    source_heading: 16. 请求顺序怎样进入审查、推销与日常谈判
    paragraphs:
    - 电视制作人格兰特·廷克和加里·马歇尔承认，会故意在剧本中加入审查员必然删除的内容，随后退到真正想保留的台词。
    - 马歇尔在《拉芙妮与雪莉》中先准备更生猛的表达，待审查员删去后，再提出包含“性欲消退”的版本；在《快乐日子》中，他曾把“处女”一词连续使用 7 次，预期审查者删掉
      6 次、留下 1 次，结果果然如此。“怀孕”一词也采用了同样做法。
    - 上门推销员的第一目标是卖出商品，第二目标是取得潜在客户亲友或邻居的名单，因为“经熟人推荐”能提高后续销售机会。
    - 当客户拒绝购买后，销售员会后撤到：“既然产品不适合您，能否介绍几个可能感兴趣的人？”客户原本可能不愿让朋友遭遇高压推销，却因刚拒绝了大请求而在较小请求上退让。
  - title: 19. 零售“往最高了说”：顺序优势的销售数据
    source_heading: 19. 零售“往最高了说”：顺序优势的销售数据
    paragraphs:
    - 顾客若接受高价款，商家直接获得高销售额；
    - 顾客若拒绝，较低价款同时显得是销售员的让步和相对便宜的选择。
    - 所以第二周比第一周高出 450 美元以上，平均销售额超过原来的 1.82 倍。
    - 这是一家门店连续两周的现场比较，不是本章报告的随机实验。周间客群、库存、销售员和促销变化都可能影响平均额。它为策略的现实可行性提供部分证据，不能把至少约
      82% 的表面增幅全部归因于展示顺序。
  - title: 24. 核心概念的关系与区别
    source_heading: 24. 核心概念的关系与区别
    paragraphs:
    - 前者主要调用互惠与对比，后者通常调用承诺和一致。把两者混淆，会导致错误识别防御时点。
    - 一个物品的物理属性不能决定它是哪一类：同一灭火器既可能是公益服务中的无条件赠品，也可能是昂贵推销的获客成本。判断取决于条件、意图证据和后续行为。
    - 广义社会交换中也可能有“以负面行为回应负面行为”，但本章主要研究善意、礼物和让步所引发的正向回报义务。不要把作者的互惠原理无限扩展成所有“你怎样对我、我就怎样对你”的反应。
    - 拒绝—后撤产生的责任感，会让目标更愿履行自己参与达成的协议；这与下一章的承诺和一致存在联系。但本章的起点是对方让步造成的参与感，下一章则系统研究个人作出承诺后为何维持一致。
  - title: 27.5 第五步：检查比例与风险
    source_heading: 27.5 第五步：检查比例与风险
    paragraphs:
    - 自己承担的金钱、时间、隐私和安全风险；
    - 是否触及不可让渡的边界，如公共职责和身体同意。
  - title: 29. 本章总结：知识结构、核心结论与一般方法
    source_heading: 29. 本章总结：知识结构、核心结论与一般方法
    paragraphs:
    - 拒绝—后撤同时借助三股力量。 互惠增加回报义务，对比让第二项显得更小，顺序则让请求者在第一项被接受或拒绝时都占优势。
    - 最好的防御不是拒绝所有善意，而是重新定义策略性给予。 真诚恩惠应适当回报，营销工具和假让步则应按请求本身独立评价。
    - 互惠不是需要被戒除的弱点，而是人类把“现在的给予”变成“未来可依赖合作”的基础设施。问题发生在请求者掌握了赠礼、接受和回报的定义权，或用虚假大要求把真正目标伪装成让步。
    - 真正成熟的应对也不是变得冷漠，而是把两件事分开：珍惜并回报真实善意，同时拒绝让任何小礼、免费服务或表面退让替自己决定一项不合理的请求。
  takeaways:
  - 互惠是收到好处、邀请或让步后予以回报的社会规范。 它不只是一种情感，而是能推动行为的义务。
  - 让步也属于可互惠的行为。 对方退一步，会推动我们也从原立场后退。
  - 从自动、反常的日常行为发现候选规则；
  - 从新的个人反常行为把规则扩展到另一类交换；
  - 真正成熟的应对也不是变得冷漠，而是把两件事分开：珍惜并回报真实善意，同时拒绝让任何小礼、免费服务或表面退让替自己决定一项不合理的请求。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「28.1 误区一：互惠就是“我喜欢你，所以帮你”」？
  answer: 好感与互惠是不同路径。里根实验显示，欠下人情后，即使不喜欢乔，受试者也会买较多彩票。
  source_heading: 28.1 误区一：互惠就是“我喜欢你，所以帮你”
- level: 概念辨析
  question: 原文如何解释「28.6 误区六：一概拒绝所有帮助最安全」？
  answer: 这种做法会错伤真诚给予，失去合作收益。作者主张根据后续证据重新分类，而不是永久戒备。
  source_heading: 28.6 误区六：一概拒绝所有帮助最安全
- level: 概念辨析
  question: 原文如何解释「28.10 误区十：第二项要求必须很小」？
  answer: 动物园请求本身需要一整天且无报酬，仍从 17% 提升到 50%。关键是它相对第一项较小，不是绝对微不足道。
  source_heading: 28.10 误区十：第二项要求必须很小
- level: 概念辨析
  question: 原文如何解释「28.15 误区十五：研究证明技巧永远不会引起怨恨」？
  answer: 研究只表明在所测条件中，履约和再合作没有下降，甚至更高。若初始要求荒谬、操纵被看穿或关系中权力失衡，仍可能产生反感和不信任。
  source_heading: 28.15 误区十五：研究证明技巧永远不会引起怨恨
- level: 概念辨析
  question: 原文如何解释「28.19 误区十九：知道原理后就不会受影响」？
  answer: 互惠涉及内在不适、社会身份和自动反应。只有把知识转化为独立请求测试、比例检查、延迟决定和组织制度，才会真正降低影响。
  source_heading: 28.19 误区十九：知道原理后就不会受影响
