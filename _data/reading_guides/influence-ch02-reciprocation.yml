  thesis: 互惠不是需要被戒除的弱点，而是人类把“现在的给予”变成“未来可依赖合作”的基础设施。问题发生在请求者掌握了赠礼、接受和回报的定义权，或用虚假大要求把真正目标伪装成让步。
