  question: 0. 本章要解决什么问题？
  question_source: 0. 本章要解决什么问题
  thesis: 图中可能只有两个 boxes：Trading System 与 Trade Compliance Engine。它并非“错误”，只是 level
    太高，对任何实现者都没有实际帮助：没有 boundary、protocol、failure、data、responsibility 或 workflow guidance。
  thesis_source: 3. Architect Personalities：架构师人格类型
  concepts:
  - term: 0. 本章要解决什么问题
    meaning: 如果 architect 独自在 silo 中完成设计，再把结果“扔过墙”交给 developers，团队往往很难正确实现。架构成功不只取决于设计本身，也取决于
      architect 能否建立有效团队。
    source_heading: 0. 本章要解决什么问题
  - term: 2. Constraints and Boundaries：约束与边界
    meaning: Architect 创建并沟通 constraints，形成 developers 实现 architecture 的“房间”。
    source_heading: 2. Constraints and Boundaries：约束与边界
  - term: 3. Architect Personalities：架构师人格类型
    meaning: 图中可能只有两个 boxes：Trading System 与 Trade Compliance Engine。它并非“错误”，只是 level
      太高，对任何实现者都没有实际帮助：没有 boundary、protocol、failure、data、responsibility 或 workflow
      guidance。
    source_heading: 3. Architect Personalities：架构师人格类型
  - term: 5. Team Warning Signs：团队警讯
    meaning: Group potential 是所有成员独立贡献的理想总和；actual productivity 永远低于 potential，中间差额来自
      communication、coordination、onboarding、conflict 和 integration。
    source_heading: 5. Team Warning Signs：团队警讯
  - term: 6. Leveraging Checklists：利用清单
    meaning: 人知道自己被 observed/monitored 时，通常会改变 behavior、做正确事情。真正 monitoring 甚至不必频繁，perception
      就有影响；原章举 non-functioning cameras 和很少查看的 website monitoring reports。
    source_heading: 6. Leveraging Checklists：利用清单
  - term: 8. Summary：总结
    meaning: Library decision rights 应匹配影响范围。 Special purpose 由 developer，general
      purpose 需 architect approval，framework 由 architect 决定。
    source_heading: 8. Summary：总结
  logic:
  - 0. 本章要解决什么问题
  - 1. Collaboration：协作
  - 3. Architect Personalities：架构师人格类型
  - 4. How Much Involvement?：应该介入多少
