  - 8. Summary：总结
  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - 如果 architect 独自在 silo 中完成设计，再把结果“扔过墙”交给 developers，团队往往很难正确实现。架构成功不只取决于设计本身，也取决于
      architect 能否建立有效团队。
    - 哪些 constraints 必须由 architect 明确，才能保护 architecture characteristics？
    - 边界太紧，团队无法使用必要工具并失去创造力；边界太松，团队被迫承担架构职责，在过多选择和 proof of concepts 中迷失。
    - 高效架构师不是永远站得最近或最远，而是持续为当前团队画出大小合适的“房间”：关键墙体清楚，内部空间足够，遇到变化时还能调整。
  - title: 1. Collaboration：协作
    source_heading: 1. Collaboration：协作
    paragraphs:
    - 架构成功的关键是拆除 physical/virtual barriers，让 architect 和 developers 属于同一个 virtual
      team，建立强 bidirectional relationship。
    - Architect 同时提供 leadership、mentoring 和 coaching；developers 不是被动执行者，而是 architecture
      的共同实现与反馈来源。
    - Architect 定义 logical building blocks、关键 interactions、system-wide constraints；
    - 影响 architecture 的变化回到 ADR/diagram/fitness-function 流程。
  - title: 2. Constraints and Boundaries：约束与边界
    source_heading: 2. Constraints and Boundaries：约束与边界
    paragraphs:
    - Architect 创建并沟通 constraints，形成 developers 实现 architecture 的“房间”。
    - "“完全自治”如果没有 architecture direction，实际是把高影响决定下放给缺少全局 context 的个人。"
    - 需要 architect approval 的高影响选择：framework、general-purpose library、跨域 contract；
    - Team 自主区：局部 algorithm、class design、special-purpose library；
  - title: 3. Architect Personalities：架构师人格类型
    source_heading: 3. Architect Personalities：架构师人格类型
    paragraphs:
    - 但 architect 的新职责是创建 logical components 并决定它们如何 interaction；component 内部最佳实现属于
      developers。放下熟悉的细节控制很难。
    - Control-freak architect 还会指定 parallel loader pattern、internal cache 和 particular
      data structure。即使这个 design 有效，它也不是唯一方案，更不是 architect 通常应决定的内部实现。
    - 图中可能只有两个 boxes：Trading System 与 Trade Compliance Engine。它并非“错误”，只是 level 太高，对任何实现者都没有实际帮助：没有
      boundary、protocol、failure、data、responsibility 或 workflow guidance。
    - 这不仅是 architecture skill，也是 leadership art。Effective 不是永远处于量表正中，而是能按 context
      调整并解释调整原因。
  - title: 4. How Much Involvement?：应该介入多少
    source_heading: 4. How Much Involvement?：应该介入多少
    paragraphs:
    - 原章经验口径：5 人或更少为 small；正文称超过 12 developers 为 big，而 Scenario 2 又把 12 members 作为
      large。应把 12 理解为警戒附近而非精确边界。
    - 理由看似反直觉：短项目 urgency 已高，control-freak 会拖延；长项目节奏宽松，architect 需确保 schedule，并推动最复杂
      tasks 优先完成。
    - 解释：限制 daily involvement，提供 questions/on-track 支持，主要 facilitation，避免阻碍 experienced
      team 快速交付。
    - 项目开始时可估计 involvement，但随着 lifecycle 推进应持续分析。Factors 很难完全 objective，且某项可能更重要，因此可按
      situation weighting/modify metrics。
  - title: 5. Team Warning Signs：团队警讯
    source_heading: 5. Team Warning Signs：团队警讯
    paragraphs:
    - Fred Brooks 在 The Mythical Man-Month（1995）提出 process loss / Brooks’s Law。原章概括为：项目中增加的人越多，项目可能花越久。
    - Group potential 是所有成员独立贡献的理想总和；actual productivity 永远低于 potential，中间差额来自 communication、coordination、onboarding、conflict
      和 integration。
    - 大团队多数人同意两个 remote services 用 messaging。某成员认为 secure firewall 使该方案很荒谬，却怕自己漏掉显然事实而附和。若提出质疑，团队可能发现
      REST 更合适。
    - 缓解：明确 single accountable owner、on-call、component ownership、handoff 和 escalation。多人可参与，但责任不能只属于“大家”。
  - title: 6. Leveraging Checklists：利用清单
    source_heading: 6. Leveraging Checklists：利用清单
    paragraphs:
    - Dr. Atul Gawande 在 The Checklist Manifesto 中描述 surgical checklists：使用清单的医院 staph
      infection rates 降至接近零，control hospitals 继续上升。
    - 人知道自己被 observed/monitored 时，通常会改变 behavior、做正确事情。真正 monitoring 甚至不必频繁，perception
      就有影响；原章举 non-functioning cameras 和很少查看的 website monitoring reports。
    - Hawthorne effect 可以提高短期遵从，但长期质量更依赖 trust、ownership 和 automation。Architect 应透明说明
      spot-check 目的，避免监控羞辱个人或把 checklist completion 当唯一绩效指标。
    - Production release 是 SDLC 最 error-prone 的阶段之一，适合 checklist。目标是减少 failed builds/deployments
      和 release risk。
  - title: 7. Providing Guidance：提供指导
    source_heading: 7. Providing Guidance：提供指导
    paragraphs:
    - Architect 可用 design principles 提供指导，继续塑造 constraint room。Design principle 应说明
      decision logic，而不是只发布禁用/允许列表。
    - 大型复杂 Java project 中，一位 team member 痴迷 Scala，持续要求引入，已使环境 toxic，两名关键成员准备离开。
    - Lead architect 没有直接禁止，而是承诺：若能为 training 和 rewriting costs 提供 business justification，就支持
      Scala。
    - 如果收益成立，architect 也应愿意接受 proposal。Business justification 不是包装既定否决，而是公平 decision
      criterion。
  - title: 8. Summary：总结
    source_heading: 8. Summary：总结
    paragraphs:
    - 这不表示 architect 取代 people manager：绩效、薪酬、行政管理仍可能属于 manager；architect 负责 architecture
      implementation 所需的技术领导和协作环境。
    - 错误。Decision rights 应按 blast radius：special purpose 由 developer，general purpose
      需 approval，framework 由 architect。
    - Architect 定义 logical component 和 interaction，developer 设计内部 classes/patterns。
      Reference Manager 案例体现这一边界。
    - Library decision rights 应匹配影响范围。 Special purpose 由 developer，general purpose
      需 architect approval，framework 由 architect 决定。
  takeaways:
  - 高效架构师不是永远站得最近或最远，而是持续为当前团队画出大小合适的“房间”：关键墙体清楚，内部空间足够，遇到变化时还能调整。
  - Team 自主区：局部 algorithm、class design、special-purpose library；
  - 项目开始时可估计 involvement，但随着 lifecycle 推进应持续分析。Factors 很难完全 objective，且某项可能更重要，因此可按
    situation weighting/modify metrics。
  - Production release 是 SDLC 最 error-prone 的阶段之一，适合 checklist。目标是减少 failed builds/deployments
    和 release risk。
  - Library decision rights 应匹配影响范围。 Special purpose 由 developer，general purpose 需
    architect approval，framework 由 architect 决定。
