  - 24.2 Actor 检查
  - 25. 知识结构与核心总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 第 33 章用一个在线视频销售网站，把前面分散讲解的 Architecture 原则组合成一次简短案例分析。
    - 不同变化原因：对应不同 Actor，依据 Single Responsibility Principle；
    - 为什么 Runtime Control Flow 与 Source Code Dependency 可以方向相反？
    - 本章没有正式数学公式、数值计算或算法代码。作者展示的是一种 Architecture Analysis Process。因此，本笔记不会人为补造公式，而会完整解释每一步的依据、图中结构、决策权衡、现代落地方式、适用范围和局限。
  - title: 3.9 Purchaser 为什么会推动变化
    source_heading: 3.9 Purchaser 为什么会推动变化
    paragraphs:
    - 新 Purchase Flow；
    - 新 Pricing Presentation。
  - title: 4. Actor 与 Single Responsibility Principle
    source_heading: 4. Actor 与 Single Responsibility Principle
    paragraphs:
    - 一个 Module 应只对一个 Actor 或一类一致的 Change Source 负责。
    - 不同 Actor 可以读取同一业务数据，但不必共享同一 Use Case Implementation。
    - Catalog Data 可能被 Purchaser 和 Viewer 使用，但二者对它的政策和呈现需求可能不同。
    - Actor Partition 可以帮助团队围绕业务能力协作，但原书没有要求“一 Actor 一 Team”。
  - title: 7. 为什么省略 Log In 与 Log Out
    source_heading: 7. 为什么省略 Log In 与 Log Out
    paragraphs:
    - Figure 33.1 只是典型分析，不是完整 Product Backlog。
    - 是否只是 Delivery / Security Mechanism；
    - 是否对 Actor Goal 有独立意义。
    - 复制 Figure 33.1 不能替代真实 Requirement Discovery。
  - title: 8.19 真正重要的是沟通
    source_heading: 8.19 真正重要的是沟通
    paragraphs:
    - 哪个 Use Case 是 General Policy；
    - 哪些 Use Case 具体化它；
  - title: 11.12 现代命名可以不同
    source_heading: 11.12 现代命名可以不同
    paragraphs:
    - Application Service；
    - View Model Mapper。
  - title: 15. Dependency Management
    source_heading: 15. Dependency Management
    paragraphs:
    - Architecture 遵循 Dependency Rule，Source Code Dependency 指向 Higher-Level Policy。
    - View 依赖 Presenter 提供的 Presentation Model / Contract，而 Presenter 不需要依赖具体 Device
      View。
    - 具体 Revenue、Data 或 Database Adapter 依赖 Interactor 所需的 Gateway Boundary，而不是让 Interactor
      依赖具体 Detail。
    - 如果把 Runtime Call Direction 直接当作 Source Dependency Direction，Interactor 会 Import
      Presenter，Core 就依赖外层 UI。
  - title: 20. 现代项目中的落地方式
    source_heading: 20. 现代项目中的落地方式
    paragraphs:
    - 可使用 Workspace Package、Project Reference、Lint Boundary Rule。
    - Controller 把 HTTP、CLI 或 Message Input 转成 Plain Use Case Request。
    - Interactor 输出 Business Result，Presenter 转成 Web / Mobile / CLI Model。
    - Datomic、SQL 或其他 Database 只实现 Data Gateway，不进入 Use Case Signature。
  - title: 24.2 Actor 检查
    source_heading: 24.2 Actor 检查
    paragraphs:
    - Actor 是 Human、Role 还是 Change Source？
    - 同一个人是否扮演多个 Actor？
    - 一个 Module 对几个 Actor 负责？
    - Actor Boundary 是否仍符合真实业务？
  - title: 25. 知识结构与核心总结
    source_heading: 25. 知识结构与核心总结
    paragraphs:
    - Admin Use Cases 是 Add New Series、Publish Video in Series、Remove Video from Series、Set
      License Price。
    - 本章一般方法是从业务叙述识别 Actor 与 Goal，用 SRP 提取变化原因，用 Use Case 表达政策，再按 Actor × Policy Level
      划分组件，以 Dependency Rule 和 OCP 调整依赖，最后推迟实际部署粒度。
    - 先按 Actor 分开不同 Change Reasons，再按 Policy Level 分开不同 Change Rates；随后使用 Dependency
      Rule 和 OCP，让 Source Dependency 指向 Higher-Level Policy。只要这些逻辑和编译边界真实存在，系统就可以根据现实条件把
      Components 灵活组合成不同 Deployable Deliverables。
    - Actors explain why code changes. Policy levels explain how fast it changes.
      Boundaries keep those changes from spreading.
  takeaways:
  - 第 33 章为什么选择 Video Sales 案例？
  - Runtime Control Flow 的完整顺序是什么？
  - Business License 按 Batch 购买并允许 Quantity Discount。
  - Figure 33.2 的 Double Lines 表示 Architectural Boundaries。
  - Actors explain why code changes. Policy levels explain how fast it changes. Boundaries
    keep those changes from spreading.
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「23.2 误区二：Actor 就是权限角色」？
  answer: 错误。Actor 主要表达 Goal 和 Change Source，权限只是支持机制。
  source_heading: 23.2 误区二：Actor 就是权限角色
- level: 概念辨析
  question: 原文如何解释「23.10 误区十：两个 Use Case 相似就必须继承」？
  answer: 错误。相似必须来自稳定 Shared Policy，且实现可用 Composition。
  source_heading: 23.10 误区十：两个 Use Case 相似就必须继承
- level: 概念辨析
  question: 原文如何解释「23.17 误区十七：只按 Feature 分包已经足够」？
  answer: 错误。同一 Feature 内仍要控制高低层 Dependency Direction。
  source_heading: 23.17 误区十七：只按 Feature 分包已经足够
- level: 概念辨析
  question: 原文如何解释「23.21 误区二十一：OCP 表示 Interactor 永远不修改」？
  answer: 错误。Business Policy 变化时它应该修改；OCP 隔离的是低层 Detail 变化。
  source_heading: 23.21 误区二十一：OCP 表示 Interactor 永远不修改
- level: 概念辨析
  question: 原文如何解释「23.28 误区二十八：架构图一旦画出就不再变化」？
  answer: 错误。Figure 33.2 是 Preliminary，需根据真实演化调整。
  source_heading: 23.28 误区二十八：架构图一旦画出就不再变化
