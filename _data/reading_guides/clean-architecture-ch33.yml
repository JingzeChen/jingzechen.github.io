overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: Product 通过 Web 销售 Video，但 Web 不应决定核心 Architecture。
  thesis_source: 25. 知识结构与核心总结
  concepts:
  - term: 本章导读
    meaning: 本章没有正式数学公式、数值计算或算法代码。作者展示的是一种 Architecture Analysis Process。因此，本笔记不会人为补造公式，而会完整解释每一步的依据、图中结构、决策权衡、现代落地方式、适用范围和局限。
    source_heading: 本章导读
  - term: 4. Actor 与 Single Responsibility Principle
    meaning: Catalog Data 可能被 Purchaser 和 Viewer 使用，但二者对它的政策和呈现需求可能不同。
    source_heading: 4. Actor 与 Single Responsibility Principle
  - term: 8.19 真正重要的是沟通
    meaning: 哪个 Use Case 是 General Policy；
    source_heading: 8.19 真正重要的是沟通
  - term: 11.12 现代命名可以不同
    meaning: View Model Mapper。
    source_heading: 11.12 现代命名可以不同
  - term: 20. 现代项目中的落地方式
    meaning: Interactor 输出 Business Result，Presenter 转成 Web / Mobile / CLI Model。
    source_heading: 20. 现代项目中的落地方式
  - term: 25. 知识结构与核心总结
    meaning: 先按 Actor 分开不同 Change Reasons，再按 Policy Level 分开不同 Change Rates；随后使用 Dependency
      Rule 和 OCP，让 Source Dependency 指向 Higher-Level Policy。只要这些逻辑和编译边界真实存在，系统就可以根据现实条件把
      Components 灵活组合成不同 Deployable Deliverables。
    source_heading: 25. 知识结构与核心总结
  logic:
  - 本章导读
  - 4. Actor 与 Single Responsibility Principle
  - 7. 为什么省略 Log In 与 Log Out
  - 11.12 现代命名可以不同
