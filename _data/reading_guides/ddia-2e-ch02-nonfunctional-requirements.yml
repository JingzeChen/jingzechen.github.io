overview:
  kind: summary
  minutes: 12
  question: 原文围绕「0. 本章定位：把“好系统”翻译成可验证的要求」建立了怎样的核心认识？
  question_source: 0. 本章定位：把“好系统”翻译成可验证的要求
  thesis: 复杂容错和扩展机制若无法被团队理解、运行和改变，最终也会成为可靠性风险。可运维性、简单性和可演化性让系统在环境变化后仍能保持其他非功能目标。
  thesis_source: 6. 原章总结：四类非功能需求如何连接
  concepts:
  - term: 0. 本章定位：把“好系统”翻译成可验证的要求
    meaning: 例如，为提高可靠性增加副本，会消耗资源并引入协调；为提高性能增加缓存，会增加失效逻辑和维护成本；为扩展而拆分服务，会增加网络故障和可观测性需求。因此非功能设计本身就是权衡。
    source_heading: 0. 本章定位：把“好系统”翻译成可验证的要求
  - term: 2. 描述性能
    meaning: 响应时间必须从客户端边界测量，并区分服务时间、排队和网络延迟。均值有容量意义，却不能描述典型体验；p50 描述中间用户，高分位描述尾部。多后端调用会放大尾延迟。SLO
      把这些度量变成目标，SLA 再规定违约后果。分位数必须从合并分布或直方图计算，不能平均各节点分位数。
    source_heading: 2. 描述性能
  - term: 4. 可扩展性
    meaning: 线性扩展是负载与资源同比增长时性能不变，但现实常因协调、缓存边界、热点和共享资源而次线性。纵向扩展简单但有硬件与共享瓶颈；共享磁盘受争用限制；无共享有更大潜力，却引入分片和分布式复杂性。好的设计面向下一个可信数量级，把组件按稳定边界适度独立，同时始终保留简单单机或手动方案作为基线。
    source_heading: 4. 可扩展性
  - term: 5. 可维护性
    meaning: 可运维性让组织容易监控、理解、修复和升级系统；自动化必不可少，却需要高技能人员处理剩余复杂事件，并保留人工控制。简单性降低理解和变更风险，抽象是主要工具，但抽象必须说明成本、故障和逃生路径。可演化性让系统适应未知变化，依赖简单、松耦合、兼容接口和可逆迁移。三者共同决定系统能否长期创造价值，而不是只在上线当天工作。
    source_heading: 5. 可维护性
  - term: 10. 综合示例：为社交时间线写一份可验收的非功能需求
    meaning: 再考虑维护和负载波动，可取更高基线。峰值 30 million/s 不宜仅靠瞬时扩到 1,200 个节点，而可由队列和热点策略吸收；具体选择取决于允许积压年龄。
    source_heading: 10. 综合示例：为社交时间线写一份可验收的非功能需求
  - term: 12. 定义非功能需求的一般方法
    meaning: 在峰值 50,000 次有效读取/秒和任一应用实例失效时，滚动 28 天内，从 API 网关接收完整请求到最后一个响应字节发出，首页读取
      p99 小于 1 秒，且任一地区连续 15 分钟成功率不低于 99%。
    source_heading: 12. 定义非功能需求的一般方法
  logic:
  - 0. 本章定位：把“好系统”翻译成可验证的要求
  - 2. 描述性能
  - 3. 可靠性与容错
  - 5. 可维护性
  - 6. 原章总结：四类非功能需求如何连接
  - 11. 核心结论
  - 12. 定义非功能需求的一般方法
  sections:
  - title: 0. 本章定位：把“好系统”翻译成可验证的要求
    source_heading: 0. 本章定位：把“好系统”翻译成可验证的要求
    paragraphs:
    - 例如社交网络的功能需求可以是“用户能够发帖、关注他人，并查看所关注者的最新帖子”。这些要求定义了软件存在的目的，也是验收测试最容易直接覆盖的部分。
    - "“非功能”这个名字容易误导：它们并非可有可无。一个按钮功能正确，却要等待一分钟才响应；一个相册可以上传照片，却会随机永久丢失数据；这样的系统从用户角度几乎等于没有功能。"
    - 未量化的要求无法指导容量规划，也无法判断优化是否成功。不同团队会把自己的默认理解带入讨论，直到事故或增长暴露矛盾。
    - 例如，为提高可靠性增加副本，会消耗资源并引入协调；为提高性能增加缓存，会增加失效逻辑和维护成本；为扩展而拆分服务，会增加网络故障和可观测性需求。因此非功能设计本身就是权衡。
  - title: 1. 案例：社交网络首页时间线
    source_heading: 1. 案例：社交网络首页时间线
    paragraphs:
    - 设想实现一个类似 X（原 Twitter）的社交网络：用户可以发帖、关注他人，并查看首页时间线。真实服务还包含广告、推荐、排名、反滥用、隐私和大量其他机制，本章刻意简化，只保留能揭示负载结构的部分。
    - 降低轮询频率可以减少负载，却增加内容可见延迟。例如每 30 秒轮询，查询量降为约 333,333/s，但新帖平均要等待约 15 秒、最坏接近 30 秒才被看见。性能与及时性发生直接权衡。
    - 这个 345 倍只是基于简化单位操作的比较，不能当作真实硬件加速比：时间线写入与索引查找的成本不同，缓存命中和批处理也会改变结果。但它说明在“读非常多、写相对少”的场景中，以写放大换取快速读取可能很划算。
    - 阈值不能只凭产品标签。设某作者有 F 个关注者，每条帖子写时投递的单位成本为 c_w；该作者帖子在一个时间窗口内会触发 R 次关注者首页读取，每次读取时合并的单位成本为
      c_r。
  - title: 2. 描述性能
    source_heading: 2. 描述性能
    paragraphs:
    - 有些过载系统即使外部原始负载下降，也不会自行恢复，因为内部积压、重试、缓存失效或故障恢复流量仍维持高负载。这种现象称为亚稳态故障（metastable
      failure）。
    - 服务器只能并行处理有限请求。少数慢请求占住 CPU 核、线程、连接或队列前部，会拖住后续本可快速完成的请求，这称为队头阻塞（head-of-line blocking）。
    - 但全局共有 101 个请求，其中 100 个约 10 ms、1 个 1000 ms。全局 p99 取决于具体定义，接近 10 ms，而不是 505 ms。平均操作完全忽略两台机器的样本数和分布。
    - 响应时间必须从客户端边界测量，并区分服务时间、排队和网络延迟。均值有容量意义，却不能描述典型体验；p50 描述中间用户，高分位描述尾部。多后端调用会放大尾延迟。SLO
      把这些度量变成目标，SLA 再规定违约后果。分位数必须从合并分布或直方图计算，不能平均各节点分位数。
  - title: 3. 可靠性与容错
    source_heading: 3. 可靠性与容错
    paragraphs:
    - "“fail-slow” 比“fail-stop”更难检测，因为节点看似健康，却占用调用方线程并污染尾延迟。健康检查不能只问进程是否存活，还应验证关键操作、结果语义和延迟。"
    - 问题被法律假设放大：除非有相反证据，计算机被推定为正确运行，因此计算机生成的证据被视为可靠。软件工程师知道“无缺陷软件”几乎不存在，但受害者承受了监禁、破产乃至死亡等不可逆后果。
    - 可靠性是在事情出错时仍持续正确工作。fault 是局部异常，failure 是用户服务违反 SLO；容错机制试图阻止前者升级为后者，并必须声明能容忍的类型、数量、时长和故障域。
    - 硬件故障在大规模下成为日常，冗余在独立故障下有效，却会被共同原因削弱。软件缺陷和错误配置通常高度相关，同构副本无法解决，必须依赖测试、隔离、渐进发布、过载保护和生产观测。人不是系统外部的错误源，而是社会技术系统的一部分；无责复盘应寻找促成条件和可验证改进。可靠性投资最终由系统失败对人的真实后果决定。
  - title: 4. 可扩展性
    source_heading: 4. 可扩展性
    paragraphs:
    - 时间线案例平均每人 200 个关注者，却被少数超大账户支配。应记录分位数和最大值，例如关注者数 p50、p95、p99、p99.9 以及已知最大值。
    - 无共享架构（shared-nothing architecture）也叫横向扩展（horizontal scaling / scaling out）。每个节点拥有自己的
      CPU、RAM 和磁盘，节点通过普通网络由软件协调。
    - 可扩展性描述系统在特定负载维度增长时，如何通过增加资源继续满足性能和可靠性目标。它不是“某产品能扩展”的标签。讨论前要建立包含吞吐、数据量、对象大小、并发、热点和扇出的负载向量，再回答固定资源下性能怎样退化，以及保持性能需要增加多少资源。
    - 线性扩展是负载与资源同比增长时性能不变，但现实常因协调、缓存边界、热点和共享资源而次线性。纵向扩展简单但有硬件与共享瓶颈；共享磁盘受争用限制；无共享有更大潜力，却引入分片和分布式复杂性。好的设计面向下一个可信数量级，把组件按稳定边界适度独立，同时始终保留简单单机或手动方案作为基线。
  - title: 5. 可维护性
    source_heading: 5. 可维护性
    paragraphs:
    - 小项目可以简洁表达；项目增长后，模块、依赖、状态和历史决策不断积累，容易成为大泥球（big ball of mud）：边界模糊、任何修改都可能影响未知部分。
    - Agile 工作方式为组织适应变化提供框架；测试驱动开发（test-driven development，TDD）和重构（refactoring）帮助代码在频繁修改下保持质量。
    - 不可逆性（irreversibility）提高变更赌注。数据库迁移后若不能切回旧系统，任何隐藏缺陷都可能造成长时间中断或数据损坏；团队因此需要更长验证和审批。
    - 可运维性让组织容易监控、理解、修复和升级系统；自动化必不可少，却需要高技能人员处理剩余复杂事件，并保留人工控制。简单性降低理解和变更风险，抽象是主要工具，但抽象必须说明成本、故障和逃生路径。可演化性让系统适应未知变化，依赖简单、松耦合、兼容接口和可逆迁移。三者共同决定系统能否长期创造价值，而不是只在上线当天工作。
  - title: 6. 原章总结：四类非功能需求如何连接
    source_heading: 6. 原章总结：四类非功能需求如何连接
    paragraphs:
    - 作者先用首页时间线展示大规模系统的具体困难：读取时联结让大量轮询产生数亿次查找；写时物化把成本转成约百万级时间线写入；名人账户又让平均扇出假设失效。
    - 性能通过吞吐和响应时间分布描述。响应时间必须分解服务、排队和网络；高分位揭示尾部用户；组合调用会放大尾延迟。SLO/SLA 把指标变成契约。
    - 容错让磁盘、机器或依赖故障时服务继续。硬件故障相对随机，可用冗余吸收；软件故障往往高度相关，需要测试、隔离、观测和过载保护。人的操作不能只归因于粗心，应通过无责复盘改进整个社会技术系统。
    - 作者没有承诺实现这些目标的简单答案。其方向是使用经过实践验证、提供有用抽象的构件：事务、索引、日志、复制、分片、批处理和流处理等。全书后续章节将解释这些构件怎样工作、解决什么故障和负载，以及以什么为代价。
  - title: 10. 综合示例：为社交时间线写一份可验收的非功能需求
    source_heading: 10. 综合示例：为社交时间线写一份可验收的非功能需求
    paragraphs:
    - 本节是基于原章案例的教学性规格示例。数值用于展示表达方法，不代表 X/Twitter 的真实内部目标，也不构成通用推荐值。
    - 再考虑维护和负载波动，可取更高基线。峰值 30 million/s 不宜仅靠瞬时扩到 1,200 个节点，而可由队列和热点策略吸收；具体选择取决于允许积压年龄。
    - 在首页读取从 200,000/s 增至 400,000/s 时，通过不超过 2.3 倍应用资源维持 SLO；
    - 任何一项缺失都会造成盲区：只有 SLO 没有负载，目标无法容量规划；只有故障模型没有演练，机制未经证明；只有架构没有维护要求，系统会随时间失去能力。
  - title: 11. 核心结论
    source_heading: 11. 核心结论
    paragraphs:
    - 重试是反馈环的一部分。 退避、jitter、熔断、令牌桶、负载丢弃和背压共同防止重试风暴与亚稳态。
    - SLI 是测量，SLO 是目标，SLA 是合同。 所有目标都必须说明分母、边界、窗口和失败语义。
    - fault 是局部故障，failure 是用户服务失效。 容错设计的目的，是阻止前者升级为后者。
    - 人是社会技术系统中的适应者，不是外部噪声。 “人为错误”是分析起点，无责复盘用于寻找系统条件。
  - title: 12. 定义非功能需求的一般方法
    source_heading: 12. 定义非功能需求的一般方法
    paragraphs:
    - 列出关键用户旅程和系统承诺：谁做什么、成功结果是什么、哪些外部依赖在边界内。优先选择影响收入、安全、数据和信任的旅程。
    - 在峰值 50,000 次有效读取/秒和任一应用实例失效时，滚动 28 天内，从 API 网关接收完整请求到最后一个响应字节发出，首页读取 p99 小于
      1 秒，且任一地区连续 15 分钟成功率不低于 99%。
    - 触发器可以是负载达到容量 70%、p99 恶化、故障域变化、团队拆分、供应商涨价、法规变化或迁移时间超过预算。
    - 每一步都要问三个问题：假设是什么，证据是什么，假设失效后会发生什么。这样得到的非功能需求才不是发布前的一张勾选表，而是贯穿设计、运行、事故和演化的工程控制系统。
  takeaways:
  - 作者先用首页时间线展示大规模系统的具体困难：读取时联结让大量轮询产生数亿次查找；写时物化把成本转成约百万级时间线写入；名人账户又让平均扇出假设失效。
  - 非功能需求决定功能能否在现实中成立。 快、可靠、可扩展和可维护必须转化为明确条件和度量。
  - 组合调用放大尾延迟。 即使每个后端只有少量慢请求，大扇出终端请求也很可能遇到一个慢调用。
  - 可扩展性不是产品标签。 必须说明哪种负载增长、如何加资源、保持什么性能和成本。
  - 最佳方案来自上下文中的权衡。 不存在同时适合所有负载、故障、团队和未来变化的通用架构。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「8.1 “非功能”不等于“不影响功能”」？
  answer: 性能过慢、数据永久丢失或系统无法维护，都会让功能失去实际价值。非功能需求描述功能的质量和运行条件，不是功能之外的装饰。
  source_heading: 8.1 “非功能”不等于“不影响功能”
- level: 概念辨析
  question: 原文如何解释「8.15 扇出不只发生在消息队列」？
  answer: 一次请求触发多个数据库写、RPC、通知或缓存失效，都有扇出。关键是下游工作量如何随数据分布增长，而不是是否使用某个消息产品。
  source_heading: 8.15 扇出不只发生在消息队列
- level: 概念辨析
  question: 原文如何解释「8.30 可用性不等于持久性」？
  answer: 短时不可访问但数据完整，与服务在线却永久丢照片，是完全不同的失败。应分别定义 RTO、RPO、可用性和数据完整性。
  source_heading: 8.30 可用性不等于持久性
- level: 概念辨析
  question: 原文如何解释「8.43 可扩展性不等于高性能」？
  answer: 单机系统当前可能非常快却难以加资源；分布式系统当前较慢但负载增长时可加节点。两项要分别测量。
  source_heading: 8.43 可扩展性不等于高性能
- level: 概念辨析
  question: 原文如何解释「8.58 可逆不等于没有成本」？
  answer: 新旧并存会增加资源和过渡复杂性，但降低一次性切换风险。应将其视为购买学习与回退能力的成本。
  source_heading: 8.58 可逆不等于没有成本
