overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章问题主线与知识图谱」建立了怎样的核心认识？
  question_source: 0. 本章问题主线与知识图谱
  thesis: 本章正文共包含 16 道例题：1.2 有 5 道，1.3 有 11 道。核心方法不是 16 个互不相关的模板，而是“读指针扫描输入、写指针维护结果、利用有序性排除不可能候选”这组可迁移思想。
  thesis_source: 0. 本章问题主线与知识图谱
  concepts:
  - term: 0. 本章问题主线与知识图谱
    meaning: 本章正文共包含 16 道例题：1.2 有 5 道，1.3 有 11 道。核心方法不是 16 个互不相关的模板，而是“读指针扫描输入、写指针维护结果、利用有序性排除不可能候选”这组可迁移思想。
    source_heading: 0. 本章问题主线与知识图谱
  - term: 1.1 数组概述
    meaning: 程序经常需要保存一批同类且有顺序的数据，并高效地读取“第 i 个元素”。若每次访问都从头寻找，访问成本会随位置增长；数组给每个元素一个整数索引，使按位置读取和修改成为基本操作。
    source_heading: 1.1 数组概述
  - term: 1.2 数组的基本算法设计
    meaning: 区间划分一趟完成；计数法概念简单但要两趟。颜色本身没有需要保留的身份，所以稳定性不影响本题；若元素还携带附加信息并要求同色内保持原顺序，两种原地写法都要重新审视。
    source_heading: 1.2 数组的基本算法设计
  - term: 1.3 有序数组的算法设计
    meaning: 有序性提供了额外信息：相等元素连续出现；当前较小值若无法匹配另一数组当前值，也不可能匹配其更大后缀；某些全局最优候选只需在相邻元素或各路首元素中寻找。本节的关键是说明每次“跳过”为什么不会漏掉答案。
    source_heading: 1.3 有序数组的算法设计
  - term: 本章方法总结
    meaning: 二路归并每次只看两路首元素，是因为它们分别是各自剩余部分最小值；交集跳过较小值，是因为它不可能再匹配更大的后缀；最小绝对差只看相邻项，是因为非相邻差可分解为若干正的相邻差。
    source_heading: 本章方法总结
  logic:
  - 0. 本章问题主线与知识图谱
  - 1.1 数组概述
  - 1.2 数组的基本算法设计
  - 1.3 有序数组的算法设计
  - 本章方法总结
  sections:
  - title: 0. 本章问题主线与知识图谱
    source_heading: 0. 本章问题主线与知识图谱
    paragraphs:
    - 连续索引：可按下标直接访问和覆盖元素，适合原地写回、区间划分和双指针。
    - 有序性：较小元素只可能出现在指针当前或更靠前的位置，可据此排除大量候选，形成二路或多路归并。
    - 本章正文共包含 16 道例题：1.2 有 5 道，1.3 有 11 道。核心方法不是 16 个互不相关的模板，而是“读指针扫描输入、写指针维护结果、利用有序性排除不可能候选”这组可迁移思想。
  - title: 1.1 数组概述
    source_heading: 1.1 数组概述
    paragraphs:
    - 程序经常需要保存一批同类且有顺序的数据，并高效地读取“第 i 个元素”。若每次访问都从头寻找，访问成本会随位置增长；数组给每个元素一个整数索引，使按位置读取和修改成为基本操作。
    - 严格地说，线性表是元素之间具有线性次序的抽象数据类型；数组是常用的顺序存储实现。两者不宜完全等同：线性表还可以用链表实现，而多维数组也不仅是在讨论抽象线性表。
    - 为什么只比较两个当前元素就够？ 因为输入有序，a_i 是 a 未处理部分最小值，b_j 是 b 未处理部分最小值；两者较小者必是全部未处理元素的最小值。
    - 迁移判断：当候选来源有 k 路、每路内部单调，且取出一路当前值后只会暴露该路下一个值时，优先考虑“堆中每路一个结点”的多路归并模型。
  - title: 1.2 数组的基本算法设计
    source_heading: 1.2 数组的基本算法设计
    paragraphs:
    - 返回值 2 不是“删除次数”，而是调用者后续应读取的有效前缀长度。遇到“原地删除但后缀可忽略”的题目，应先确认接口是否也是这种逻辑删除语义。
    - 迁移判断：若题目说“按顺序执行操作”，先问本轮写入是否会影响下一轮读取。会影响时不能用旧数组并行计算，也不能随意调整循环顺序。
    - 区间划分一趟完成；计数法概念简单但要两趟。颜色本身没有需要保留的身份，所以稳定性不影响本题；若元素还携带附加信息并要求同色内保持原顺序，两种原地写法都要重新审视。
    - 荷兰国旗法可迁移到“按某个枢轴分成小于、等于、大于三段”的快速排序划分；迁移时关键不是值必须为 0、1、2，而是每个元素能被归入三个互斥类别。
  - title: 1.3 有序数组的算法设计
    source_heading: 1.3 有序数组的算法设计
    paragraphs:
    - 有序性提供了额外信息：相等元素连续出现；当前较小值若无法匹配另一数组当前值，也不可能匹配其更大后缀；某些全局最优候选只需在相邻元素或各路首元素中寻找。本节的关键是说明每次“跳过”为什么不会漏掉答案。
    - 迁移抓手：有序数组去重不需要集合，因为“是否见过”退化为“是否与结果末尾相同”。当输入不再有序时，这个条件失效，通常需要哈希集合或先排序。
    - 目标从“每值最多 1 次”改为“每值最多 2 次”。原书仍分别用整体建表、删除计数和区间划分解释，并强调判重必须看结果区末尾，而不是已被覆盖的原相邻位置。
    - 推广到 k 个严格递增数组时，朴素做法每轮寻找当前最小值并推进所有等于它的路；若 k 很大，可考虑计数、堆或分治交集，但要结合总数据量与值域。
  - title: 本章方法总结
    source_heading: 本章方法总结
    paragraphs:
    - 颜色分类不是凭经验移动指针，而是始终维护“0 区、1 区、未知区、2 区”。只要每个分支恢复不变量并缩小未知区，正确性和终止性就同时得到说明。
    - 二路归并每次只看两路首元素，是因为它们分别是各自剩余部分最小值；交集跳过较小值，是因为它不可能再匹配更大的后缀；最小绝对差只看相邻项，是因为非相邻差可分解为若干正的相邻差。
    - 丑数因路数固定为 3，可直接比较；最小和数对的路数可能很大，堆优化才决定能否通过。
    - 掌握这些论证后，本章 16 道题就不再是独立代码，而是少数不变量和有序性推理在不同约束下的组合。
  takeaways:
  - 连续索引：可按下标直接访问和覆盖元素，适合原地写回、区间划分和双指针。
  - 有序性：较小元素只可能出现在指针当前或更靠前的位置，可据此排除大量候选，形成二路或多路归并。
  - 本章正文共包含 16 道例题：1.2 有 5 道，1.3 有 11 道。核心方法不是 16 个互不相关的模板，而是“读指针扫描输入、写指针维护结果、利用有序性排除不可能候选”这组可迁移思想。
