  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 原章以概念、系统设计和工具比较为主，没有复杂数学推导。本文会补充 DAG、拓扑排序、关键路径、可靠性和容量等形式化表达，以解释设计为什么有效；这些属于工程推导，不是原章另行提出的算法。Airflow、Argo
