      Training、5 HPO、6 Model Release。
    source_heading: 9.1 Workflow Orchestration 简介
  - term: 9.3 开源 Workflow Orchestration Systems 导览
    meaning: 图中的统一是逻辑 API 与对象模型，不要求本地和生产共用同一个物理 store。统一 API 隐藏 infrastructure selection，但不会消除环境差异。Local
      machine 和 production cluster 的 data access、IAM、network、CPU architecture、GPU
      runtime 仍可能不同，必须做 staging / integration validation。
    source_heading: 9.3 开源 Workflow Orchestration Systems 导览
  - term: 原章 Summary 回顾
    meaning: Workflow 是更大任务中的一系列 operations，可建模为 steps 构成的 DAG；step 是最小 resumable
      computation unit，整体成功或失败；DAG 定义 dependencies 与 execution order。
    source_heading: 原章 Summary 回顾
  - term: 从本章提炼出的通用解题方法
    meaning: 让 Airflow、Argo、Metaflow或组合方案执行相同 data → train → evaluate → register 流程。测量
