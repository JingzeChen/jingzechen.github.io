overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章要回答的问题」建立了怎样的核心认识？
  question_source: 1. 本章要回答的问题
  thesis: 司机和乘客都到达复杂上车点，也都主动联系，却因交通与方言无法找到对方。司机取消后，双方都认为自己无责。若平台把“乘客无责”等同于“司机有责”，或反过来，就必须在证据不足时伤害一方。
  thesis_source: 11.6 司乘纠纷判责：从跷跷板到弹簧
  concepts:
  - term: 1. 本章要回答的问题
    meaning: 产品经理的日常工作由连续的选择组成：要不要做、先做什么、服务谁、牺牲谁、怎样分配资源，以及如何让决定真正落地。前三章提供了用户模型、交易模型、效用和成本等分析工具，本章则回答如何用这些工具形成决策。
    source_heading: 1. 本章要回答的问题
  - term: 6.2 对给定目标的批判性思考
    meaning: 例如“提升点击率”可能只是手段，真正目标可能是提高有效交易；如果点击增长来自误导，目标指标改善反而损害最终价值。
    source_heading: 6.2 对给定目标的批判性思考
  - term: 8.4 刻板印象与光环
    meaning: 外群体同质性偏见：认为其他群体成员都相似，而自己群体更多样。
    source_heading: 8.4 刻板印象与光环
  - term: 10.1 九种影响方法
    meaning: 影响力主要来自为他人创造价值或造成损失的能力。提高推动能力的根本，不是学习话术，而是理解各方诉求，找到共同利益，并让对方理解方案能创造什么价值、失败会造成什么损失。
    source_heading: 10.1 九种影响方法
  - term: 11.6 司乘纠纷判责：从跷跷板到弹簧
    meaning: 司机和乘客都到达复杂上车点，也都主动联系，却因交通与方言无法找到对方。司机取消后，双方都认为自己无责。若平台把“乘客无责”等同于“司机有责”，或反过来，就必须在证据不足时伤害一方。
    source_heading: 11.6 司乘纠纷判责：从跷跷板到弹簧
  - term: 18. 复习卡片
    meaning: Q：产品经理工作的核心为什么是权衡？ A：不同用户、企业、供给者和第三方的利益会冲突，同一人的短期与长期需求也会冲突，不存在单一口号自动给出答案。
    source_heading: 18. 复习卡片
