  sections:
  - title: 阅读导引
    source_heading: 阅读导引
    paragraphs:
    - 怎样把“张量计算 → 自动求导 → 参数更新 → 批量数据 → 评估 → 非顺序网络 → 调参 → 保存与部署”组成一条正确、可扩展的神经网络流水线？
    - shape、dtype 与损失函数契约一致；
    - 验证指标按样本而不是按 batch 错误聚合；
    - 核心示例已在 Windows、Python 3.12、PyTorch 2.11.0 CPU 环境验证。TorchVision、TorchMetrics
      和 Optuna 是可选依赖；对应示例会注明安装命令与联网要求。GPU 输出、训练轨迹和编译性能依赖硬件、版本及随机性。
  - title: 2. PyTorch Tensors
    source_heading: 2. PyTorch Tensors
    paragraphs:
    - 混合输入会提升到能容纳所有值的类型，通常遵循 complex > float > integer > bool。
    - Tensor 通常由底层 storage 加 shape、stride、offset 描述。
    - Broadcast 通常不真实复制数据，但错误 shape 也可能“合法广播”出错误结果。
    - 影响共享同一 storage 的 view/NumPy 数组；
  - title: 4. Autograd
    source_heading: 4. Autograd
    paragraphs:
    - 这支持梯度累积和多个 loss 共同反传，但普通训练若忘记清零，会把历史 batch 梯度混入当前更新。
    - 反向函数可能保存输入、输出、二者或都不保存。Tensor 每次原地修改都会增加 version counter；backward 发现保存值版本不匹配时，宁可报错也不返回静默错误梯度。
    - 保存规则是实现细节，不应靠记忆算子列表写危险代码。原则是：反传前不原地修改参与图的输入和中间结果。
    - 若需要用多个 micro-batch 模拟大 batch，则有意延后清零，并把每个 micro-loss 除以累积步数。
  - title: 7.3 shuffle=True 为什么只用于训练
    source_heading: 7.3 shuffle=True 为什么只用于训练
    paragraphs:
    - 顺序遍历的数据若按类别、时间或来源排序，连续 batch 的分布会偏离总体，使梯度相关且带来训练震荡。每 epoch shuffle 可改善 mini-batch
      的代表性。
    - 验证/测试不更新参数，无需 shuffle；保持顺序还便于把预测对应回原样本。时间序列若有因果约束，训练数据也不能无条件打乱。
  - title: 9. Building Nonsequential Models with Custom Modules
    source_heading: 9. Building Nonsequential Models with Custom Modules
    paragraphs:
    - deep path：学习高阶、组合模式；
    - wide/short path：保留原始或人工交叉特征；
    - concat 后输出：由最后一层联合选择两类信息。
    - train/eval 模式不递归传播。
  - title: 10. Models with Multiple Inputs and Outputs
    source_heading: 10. Models with Multiple Inputs and Outputs
    paragraphs:
    - 任务本身需要，如物体分类 + 边界框回归；
    - 辅助输出直接监督较低层，作为正则化和梯度捷径。
    - 该权重是超参数；任务尺度不同会使“0.8/0.2”并不等于梯度贡献比例，可能需要标准化 loss、动态加权或检查梯度冲突。
    - 评估时可忽略纯正则化辅助输出；若两个输出都是业务任务，则必须分别报告指标。
  - title: 12. Fine-Tuning Hyperparameters with Optuna
    source_heading: 12. Fine-Tuning Hyperparameters with Optuna
    paragraphs:
    - 学习率跨多个数量级，层数和宽度又形成组合空间。网格在不重要维度浪费大量试验，而且高维点数指数增长。随机搜索更容易覆盖每个超参数的不同值；Optuna 的
      TPE 进一步利用历史试验集中到有希望区域。
    - 这是序贯模型优化：后一个 trial 依赖前面结果，所以比纯随机更聚焦，但也可能过早聚焦；合理搜索空间和足够 startup trials 仍很重要。
    - 原书 5 次试验参考：学习率约 0.0853、每隐藏层 116 个神经元，验证准确率约 0.8868。5 次远不足以稳定搜索，仅用于演示 API。
    - 过早 pruning 可能淘汰慢启动但最终优秀的配置，因此需要 warmup。验证噪声大时也要更谨慎。
  - title: 13.4 安全与可移植性
    source_heading: 13.4 安全与可移植性
    paragraphs:
    - 保存代码/架构版本、依赖版本和预处理参数。
    - 不要把 scaler、类别映射等推理契约遗漏在模型之外。
  - title: 15. 章末练习与参考答案
    source_heading: 15. 章末练习与参考答案
    paragraphs:
    - 先创建 optimizer 后再把模型迁移设备，可能使 optimizer 引用/状态与实际训练参数不一致。
    - 具体最优值需在目标平台 benchmark，Windows 尤其可能因多进程开销变慢。
    - Dropout 在 train 模式随机屏蔽单元，在 eval 模式关闭；BatchNorm 在 train 模式使用当前 batch 并更新运行统计，在
      eval 模式使用已保存统计。
    - 单一学习率和不同划分未必复现该数值。严谨流程应保存最佳验证 checkpoint，再在测试集评估；若系统搜索深度、宽度、学习率和 batch size，可用
      Optuna pruning 降低成本。
  - title: 工程能力
    source_heading: 工程能力
    paragraphs:
    - 能用 Dataset/DataLoader 训练 mini-batch
    - 能调 pin_memory/workers/prefetch
    - 能正确选择分类 loss 与 target dtype
    - 能安全保存/加载 state_dict/checkpoint
  takeaways:
  - 核心示例已在 Windows、Python 3.12、PyTorch 2.11.0 CPU 环境验证。TorchVision、TorchMetrics 和
    Optuna 是可选依赖；对应示例会注明安装命令与联网要求。GPU 输出、训练轨迹和编译性能依赖硬件、版本及随机性。
  - 若需要用多个 micro-batch 模拟大 batch，则有意延后清零，并把每个 micro-loss 除以累积步数。
  - 评估时可忽略纯正则化辅助输出；若两个输出都是业务任务，则必须分别报告指标。
  - 不要把 scaler、类别映射等推理契约遗漏在模型之外。
  - 能安全保存/加载 state_dict/checkpoint
