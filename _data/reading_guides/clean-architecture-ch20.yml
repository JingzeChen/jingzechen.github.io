overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: "“Use Case 控制 Entity 的舞蹈”表示它负责应用流程编排，而 Entity 负责各自核心规则。"
  thesis_source: 16. 本章总结
  concepts:
  - term: 本章导读
    meaning: Request / Response Model 不应因为字段相似就直接复用 Entity、ORM Entity 或 HTTP 对象。
    source_heading: 本章导读
  - term: 5.3 Use Case 是应用特定规则
    meaning: 例如，业务人员人工计算贷款时，不需要“先完成联系人页面，再进入估算页面”的软件流程。
    source_heading: 5.3 Use Case 是应用特定规则
  - term: 8.5 为什么不能继承 HttpRequest
    meaning: 入口 Adapter 应先把 HttpRequest 转换成独立 Request Model。
    source_heading: 8.5 为什么不能继承 HttpRequest
  - term: 9.3 违反 SRP 与 CCP
    meaning: Common Closure Principle。
    source_heading: 9.3 违反 SRP 与 CCP
  - term: 15.3 Entity 检查
    meaning: Entity 是否同时封装关键数据与规则？
    source_heading: 15.3 Entity 检查
  - term: 16. 本章总结
    meaning: Request / Response Model 不应继承 HttpRequest、HttpResponse 或其他框架接口。
    source_heading: 16. 本章总结
  logic:
  - 本章导读
  - 5.3 Use Case 是应用特定规则
  - 7.1 Entity 不知道 Use Case
  - 9.3 违反 SRP 与 CCP
  - 11. 如何在项目中识别 Entity 与 Use Case
  - 15.12 场景判断七：应用规则放在 Entity
  - 16. 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 所谓 Business Rules，也就是业务规则，具体包括什么？核心中不同规则之间又怎样分层？
    - Request / Response Model 不依赖 Web、数据库或框架。
    - Request / Response Model 不应因为字段相似就直接复用 Entity、ORM Entity 或 HTTP 对象。
    - 这些分离会增加少量模型与转换代码，却换来不同层次按各自原因独立变化的能力。
  - title: 3. Critical Business Data：关键业务数据
    source_heading: 3. Critical Business Data：关键业务数据
    paragraphs:
    - 这些数据即使在人工业务中也会存在，因此称为 Critical Business Data。
    - 反过来，领域数据也可能以多张表、事件或文档存储，不能简单与一行记录对应。
  - title: 5.3 Use Case 是应用特定规则
    source_heading: 5.3 Use Case 是应用特定规则
    paragraphs:
    - 例如，业务人员人工计算贷款时，不需要“先完成联系人页面，再进入估算页面”的软件流程。
    - 因此，Use Case 比 Entity 更接近系统输入输出，层级也更低。
  - title: 7.1 Entity 不知道 Use Case
    source_heading: 7.1 Entity 不知道 Use Case
    paragraphs:
    - 决定 HTTP Response；
    - 读取 Controller 状态。
  - title: 8.5 为什么不能继承 HttpRequest
    source_heading: 8.5 为什么不能继承 HttpRequest
    paragraphs:
    - Use Case 间接依赖 Web 框架；
    - 入口 Adapter 应先把 HttpRequest 转换成独立 Request Model。
  - title: 9.3 违反 SRP 与 CCP
    source_heading: 9.3 违反 SRP 与 CCP
    paragraphs:
    - UI 需求推动 Entity 字段；
    - Entity 变化推动所有输出；
    - Single Responsibility Principle；
    - Common Closure Principle。
  - title: 11. 如何在项目中识别 Entity 与 Use Case
    source_heading: 11. 如何在项目中识别 Entity 与 Use Case
    paragraphs:
    - 它直接创造、节省或保护组织价值吗？
    - ORM / Row 到 Entity 转换；
    - 使用 Fake Gateway。
    - HTTP、SQL、序列化和框架集成。
  - title: 15.3 Entity 检查
    source_heading: 15.3 Entity 检查
    paragraphs:
    - Entity 是否同时封装关键数据与规则？
    - 是否导入 ORM、HTTP 或 UI？
    - 跨 Entity 规则是否更适合领域服务？
  - title: 15.12 场景判断七：应用规则放在 Entity
    source_heading: 15.12 场景判断七：应用规则放在 Entity
    paragraphs:
    - Loan Entity 判断“联系人页面是否完成”，再决定能否计算利息。
    - 判断： 自动化应用流程污染 Entity，应由 Use Case 管理顺序。
  - title: 16. 本章总结
    source_heading: 16. 本章总结
    paragraphs:
    - Clean Architecture Entity 不等于 ORM Entity，也不必与 DDD Entity 完全相同。
    - "“Use Case 控制 Entity 的舞蹈”表示它负责应用流程编排，而 Entity 负责各自核心规则。"
    - Use Case 应接受简单独立的 Request Model，并返回简单独立的 Response Model。
    - Request / Response Model 不应继承 HttpRequest、HttpResponse 或其他框架接口。
  takeaways:
  - 第 20 章区分不同层次的业务规则，并说明 Entity 与 Use Case 的职责。
  - Entity 封装一小组关键业务规则，并让这些规则操作关键业务数据。
  - Use Case 规定用户输入、系统输出以及产生输出的处理步骤。
  - Use Case 应接受简单独立的 Request Model，并返回简单独立的 Response Model。
  - 本章最终要求是：让业务规则保持纯净、独立和可复用，让 UI、数据库和框架作为外围插件依赖它们。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「14.1 “Entity 就是数据库表对应类”」？
  answer: 错误。Clean Architecture Entity 由关键规则和数据定义，与表结构不必一一对应。
  source_heading: 14.1 “Entity 就是数据库表对应类”
- level: 概念辨析
  question: 原文如何解释「14.4 “Use Case 就是用户故事文本”」？
  answer: 错误。Use Case 是实现应用规则的可执行模块，明确输入、输出和步骤。
  source_heading: 14.4 “Use Case 就是用户故事文本”
- level: 概念辨析
  question: 原文如何解释「14.7 “Entity 应调用 Repository 保存自己”」？
  answer: 通常会让核心依赖持久化。Use Case 应通过应用侧 Port 协调保存。
  source_heading: 14.7 “Entity 应调用 Repository 保存自己”
- level: 概念辨析
  question: 原文如何解释「14.13 “Use Case 协调更多对象，所以比 Entity 高层”」？
  answer: 错误。Use Case 更靠近具体应用输入输出，因此层级低于可跨应用复用的 Entity。
  source_heading: 14.13 “Use Case 协调更多对象，所以比 Entity 高层”
- level: 概念辨析
  question: 原文如何解释「14.15 “纯业务代码不能产生任何状态变化”」？
  answer: 错误。Entity 可以改变业务状态和保护不变量，只是不应执行无关技术 IO。
  source_heading: 14.15 “纯业务代码不能产生任何状态变化”
