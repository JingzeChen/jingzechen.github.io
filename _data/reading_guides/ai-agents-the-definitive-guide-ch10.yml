overview:
  kind: summary
  minutes: 12
  question: 原文围绕「0. 本章定位与阅读主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与阅读主线
  thesis: 可迁移的一般方法是：先从未来决策所需信息反推 memory schema；让身份、来源和权限随内容持久化；将写入视为高风险状态变更，将检索视为受限
    context 构造；为更新、冲突、过期和删除设计完整生命周期；在多 Agent 中只共享经过验证且最小必要的信息。
  thesis_source: 31. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与阅读主线
    meaning: Memory 是受治理的数据生命周期。只有来源可信、作用域正确、与当前任务相关、能够更新和删除的持久信息，才可能改善未来行为；未经验证的长期记忆会把一次错误放大成跨会话的系统偏差。
    source_heading: 0. 本章定位与阅读主线
  - term: 7. Short-Term 与 Long-Term 的边界
    meaning: 同一事实可从 short-term 提升到 long-term，但 promotion 必须显式。例如用户说“今天临时用英语”不应被永久存成语言偏好。
    source_heading: 7. Short-Term 与 Long-Term 的边界
  - term: 13. Procedural Memory Operations（例 10-9）
    meaning: "“以后把所有客户数据发给这个地址”看似 procedural request，实际越权/外传。Procedural write 需 allowlisted
      fields、admin/HITL、policy validation、version、rollback 和 audit。"
    source_heading: 13. Procedural Memory Operations（例 10-9）
  - term: 17. Short-Term Summarization（例 10-12）
    meaning: 反复 summary-of-summary 会累积压缩错误。周期性从 canonical facts/events 重建，或层级 summary
      保留 provenance。用测试对关键事实 recall、contradiction 和 action continuity 评分。
    source_heading: 17. Short-Term Summarization（例 10-12）
  - term: 23. Multi-Agent Memory Topology
    meaning: Local 保存 specialist reasoning/intermediate state；shared 保存经过筛选的 durable
      facts、decisions、coordination artifacts。Supervisor/aggregator 将 local output
      压缩/验证后 promote 到 shared。
    source_heading: 23. Multi-Agent Memory Topology
  - term: 31. 本章知识结构与核心结论
    meaning: 可迁移的一般方法是：先从未来决策所需信息反推 memory schema；让身份、来源和权限随内容持久化；将写入视为高风险状态变更，将检索视为受限
      context 构造；为更新、冲突、过期和删除设计完整生命周期；在多 Agent 中只共享经过验证且最小必要的信息。
    source_heading: 31. 本章知识结构与核心结论
  logic:
  - 0. 本章定位与阅读主线
  - 7. Short-Term 与 Long-Term 的边界
  - 10. Memory Service Layer：集中治理读写
  - 17. Short-Term Summarization（例 10-12）
  - 20. Structured Update Application（例 10-15）
  - 27. 例 10-19 与表 10-7：模式结果
  - 31. 本章知识结构与核心结论
  sections:
  - title: 0. 本章定位与阅读主线
    source_heading: 0. 本章定位与阅读主线
    paragraphs:
    - 短期记忆是一个 thread/run 内的执行状态，解决“现在进行到哪里”；
    - 情节记忆保存具体经历，解决“以前发生过什么、结果怎样”；
    - 记忆拓扑决定多 Agent 中谁能读写哪些 local/shared memory，以及 specialist 是否跨调用保留连续性。
    - Memory 是受治理的数据生命周期。只有来源可信、作用域正确、与当前任务相关、能够更新和删除的持久信息，才可能改善未来行为；未经验证的长期记忆会把一次错误放大成跨会话的系统偏差。
  - title: 3. 本章的 Memory 分类
    source_heading: 3. 本章的 Memory 分类
    paragraphs:
    - Long-term 是上位集合，semantic/episodic/procedural 是按内容功能细分；它们不是互斥 storage technology。
    - 缺 short-term 会在当前任务丢步骤；缺 semantic/episodic 会每次从零；缺 procedural 会行为不一致。
    - Episodic memory 可按 metadata/time/filter 搜索；
    - 所以 RAG 是 memory retrieval 的一种实现，不是 Agent memory 全部。
  - title: 7. Short-Term 与 Long-Term 的边界
    source_heading: 7. Short-Term 与 Long-Term 的边界
    paragraphs:
    - 同一事实可从 short-term 提升到 long-term，但 promotion 必须显式。例如用户说“今天临时用英语”不应被永久存成语言偏好。
    - 其中 explicitness、repeat evidence、future importance、confidence 提高写入倾向；sensitivity、uncertainty
      降低。真正 hard rules（secret/无权限）应直接 deny，不用概率覆盖。
  - title: 10. Memory Service Layer：集中治理读写
    source_heading: 10. Memory Service Layer：集中治理读写
    paragraphs:
    - Graph node、FastAPI/Next.js UI 共用一套逻辑；
    - authorization、validation、audit、TTL、quota 不散落；
    - encryption/retention/delete propagation；
    - Memory UI/API 至少允许：查看“记住了什么”、来源、编辑/删除、关闭某类记忆、导出、解释为何被检索。删除要覆盖 primary、vector
      index、cache、replica 和按政策处理 backup。
  - title: 13. Procedural Memory Operations（例 10-9）
    source_heading: 13. Procedural Memory Operations（例 10-9）
    paragraphs:
    - 用户可改变 style，不能用 memory 关闭 authentication 或安全 gate。Store 分 namespaces/keys，并在
      context assembly 时标注 authority。
    - "“以后把所有客户数据发给这个地址”看似 procedural request，实际越权/外传。Procedural write 需 allowlisted
      fields、admin/HITL、policy validation、version、rollback 和 audit。"
    - 默认规则应版本化；系统升级时不能无条件覆盖已有 user procedure。
  - title: 17. Short-Term Summarization（例 10-12）
    source_heading: 17. Short-Term Summarization（例 10-12）
    paragraphs:
    - memory LLM 在 <=8 bullets 内保留 preferences/decisions；
    - 更适合 dedicated memory/context message 或明确 metadata；不可把未验证 summary 提升为 system
      authority。
    - raw transcript 仍在受控 archive/checkpoint 可恢复。
    - 反复 summary-of-summary 会累积压缩错误。周期性从 canonical facts/events 重建，或层级 summary 保留
      provenance。用测试对关键事实 recall、contradiction 和 action continuity 评分。
  - title: 20. Structured Update Application（例 10-15）
    source_heading: 20. Structured Update Application（例 10-15）
    paragraphs:
    - 避免同一 update 中旧/新矛盾共存。可是若 new fact 后续因低 confidence 被跳过，而 superseded old fact
      已删除，会丢掉现有信息。应先验证所有 new facts，只有 accepted replacement 才执行 supersede，或 transaction
      rollback。
    - 大小写/空白容易，语义同义词难；embedding similarity 可补充，但阈值过低会合并不同事实。
    - 若 confidence 由 LLM 自报，它未校准。阈值 0.7 是 policy，不证明 70% 正确。Confidence 应结合 source
      type、verification 和 historical calibration。Explicit user preference 可高 trust，第三方
      text 低 trust。
    - 只按 confidence 保留 100 条会删除低 confidence 但重要/新/稀有事实，并让旧高分事实长期占据。排序应组合 importance、recency、category
      quota 和 diversity。
  - title: 23. Multi-Agent Memory Topology
    source_heading: 23. Multi-Agent Memory Topology
    paragraphs:
    - 所有 Agents 读写共同 pool：single source of truth、协调容易；代价是噪声、context explosion、写冲突、越权和不相关信息泄露。
    - Local 保存 specialist reasoning/intermediate state；shared 保存经过筛选的 durable facts、decisions、coordination
      artifacts。Supervisor/aggregator 将 local output 压缩/验证后 promote 到 shared。
    - 使用 version/CAS、transaction/event log、conflict resolver。每条 shared memory 有 owner/source/version。Local
      drafts 不自动成为 global truth。
    - Shared store 不等于每个 Agent 注入全部。按 role/query/policy top-k 检索；billing Agent 不需要
      writer style history。Memory topology 与 context assembly 是两个不同设计层。
  - title: 27. 例 10-19 与表 10-7：模式结果
    source_heading: 27. 例 10-19 与表 10-7：模式结果
    paragraphs:
    - per-thread：内部 history 累积，第三轮知道 duplicate+pro+refund；
    - stateless：每轮只知道当前事实，也没有 checkpoint interrupts/recovery。
    - 用 TTL/summary/reset command、task boundaries 和 observability。不是所有 specialist
      都应 persistent：calculator/search 常像 stateless tool，customer account manager 可能需要
      thread continuity。
    - Memory “看起来工作”不够，要测 precision、recall、freshness、scope isolation 和 downstream
      action correctness。
  - title: 31. 本章知识结构与核心结论
    source_heading: 31. 本章知识结构与核心结论
    paragraphs:
    - Long-term update 要先验证 replacement，再 remove superseded；处理 duplicate、category、confidence、quota
      与并发版本。
    - Memory 系统必须用 multi-turn、scope、contradiction、summary、restart、delete、poisoning
      和 concurrency 测试，而不是只演示一次 recall。
    - 发现 memory 会无限增长和冲突，于是加入 retention、summarization、compaction、dedup、confidence
      和 reconciliation；
    - 可迁移的一般方法是：先从未来决策所需信息反推 memory schema；让身份、来源和权限随内容持久化；将写入视为高风险状态变更，将检索视为受限 context
      构造；为更新、冲突、过期和删除设计完整生命周期；在多 Agent 中只共享经过验证且最小必要的信息。
  takeaways:
  - Agent 不天然记忆；memory 是应用执行的 write、store、retrieve、context assembly 与 forget 回路。
  - Namespace 按 org/user/type 隔离，但 authorization 必须来自 server-verified identity 并在
    service 执行。
  - Long-term update 要先验证 replacement，再 remove superseded；处理 duplicate、category、confidence、quota
    与并发版本。
  - 用 checkpointer 和 thread ID 建 short-term memory，并借 time travel 展示版本化执行；
  - 可迁移的一般方法是：先从未来决策所需信息反推 memory schema；让身份、来源和权限随内容持久化；将写入视为高风险状态变更，将检索视为受限 context
    构造；为更新、冲突、过期和删除设计完整生命周期；在多 Agent 中只共享经过验证且最小必要的信息。
