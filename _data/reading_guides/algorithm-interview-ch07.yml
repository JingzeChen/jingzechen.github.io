overview:
  kind: summary
  minutes: 8
  question: 原文围绕「7.1 二叉搜索树概述」建立了怎样的核心认识？
  question_source: 7.1 二叉搜索树概述
  thesis: BST 的力量来自“比较当前根即可排除半边候选”，但性能取决于高度。搜索、插入、删除、LCA、范围剪枝、修剪和拆分本质上都沿由键比较决定的少数路径工作；若树失衡，优势会退化。
  thesis_source: 本章总结
  concepts:
  - term: 7.1 二叉搜索树概述
    meaning: 前驱没有右孩子，后继没有左孩子，所以复杂情况被降为至多一个孩子。递归写法可统一为“目标值较小去左、较大去右；命中后返回替代子树根”。
    source_heading: 7.1 二叉搜索树概述
  - term: 7.2 二叉搜索树基本操作的算法设计
    meaning: 迁移判断： 只有在输入已保证是某棵严格 BST 的先序时，单个上界才足以负责“构造”。若题目还要求验证任意序列是否合法，就必须同时维护下界，或改用
      7.3.7 的单调栈检查；不能把“未消费完”默认为合法。
    source_heading: 7.2 二叉搜索树基本操作的算法设计
  - term: 7.3 二叉搜索树特性的算法设计
    meaning: 举一反三： “整棵子树的值域都在查询区间同一侧”时才能整段剪枝，因此同样思路可迁移到区间计数、区间最值收集；若条件依赖深度、路径和或子树形状，仅比较根值通常不能排除整棵子树。
    source_heading: 7.3 二叉搜索树特性的算法设计
  - term: 7.4 二叉搜索树基于中序遍历的算法设计
    meaning: 若先生成递增中序数组，新值就是从当前位置到末尾的后缀和。与其保存数组，不如按右—根—左的逆中序从大到小访问，把“已访问更大值之和”保存在累加器中。
    source_heading: 7.4 二叉搜索树基于中序遍历的算法设计
  - term: 本章总结
    meaning: 中序严格递增把树问题转成有序序列问题：相邻差、排名、合法性、后缀累加、逆序恢复和迭代器都由此导出。实现时最重要的边界是严格不等、重复键策略、递归返回的新子树根，以及整数上下界。需要稳定对数性能或频繁排名查询时，应进一步使用平衡
      BST 和子树大小增强。
    source_heading: 本章总结
  logic:
  - 7.1 二叉搜索树概述
  - 7.2 二叉搜索树基本操作的算法设计
  - 7.3 二叉搜索树特性的算法设计
  - 7.4 二叉搜索树基于中序遍历的算法设计
  - 本章总结
  sections:
  - title: 7.1 二叉搜索树概述
    source_heading: 7.1 二叉搜索树概述
    paragraphs:
    - 结构归纳证明：空树序列为空；假设左右子树中序各自严格递增。BST 性质保证左序列所有值小于根，根小于右序列所有值，因此
    - 严格递增。反过来，一棵二叉树的中序序列严格递增，则每个结点左侧中序片段都小于根、右侧都大于根，递归可知它是严格 BST。
    - 前驱没有右孩子，后继没有左孩子，所以复杂情况被降为至多一个孩子。递归写法可统一为“目标值较小去左、较大去右；命中后返回替代子树根”。
    - 勘误说明： 原书图 7.2、7.3 的图注“只有左/右子树”与相邻正文情形互换；应以实际非空孩子和代码链接方向为准。
  - title: 7.2 二叉搜索树基本操作的算法设计
    source_heading: 7.2 二叉搜索树基本操作的算法设计
    paragraphs:
    - 先序给出根访问次序；BST 的中序严格递增，所以把先序值排序即可得到同一棵树的中序序列，再使用第 6 章“先序 + 中序”构造。值互异保证排序后的根位置唯一。
    - 迁移判断： 只有在输入已保证是某棵严格 BST 的先序时，单个上界才足以负责“构造”。若题目还要求验证任意序列是否合法，就必须同时维护下界，或改用 7.3.7
      的单调栈检查；不能把“未消费完”默认为合法。
    - 新结点作为叶子，不改变路径外任何关系。对每个路径祖先，选择方向就是根据 x 与祖先值的严格比较，所以新叶位于合法侧；其他结点关系保持，整树仍为 BST。
    - 若允许重复，必须规定忽略、计数或固定放一侧；原书基础迭代写法把相等值放右侧，与严格 BST 定义冲突，不能在无约定时照搬。
  - title: 7.3 二叉搜索树特性的算法设计
    source_heading: 7.3 二叉搜索树特性的算法设计
    paragraphs:
    - 第一次不再同侧时，当前根要么等于其中一个结点，要么两结点分处左右子树，因此它是最近公共祖先。
    - 结构归纳可证：每个被剪掉子树的所有值都在区间同一侧，绝无合法结点；保留根时左右递归分别返回所有合法值之和。
    - 举一反三： “整棵子树的值域都在查询区间同一侧”时才能整段剪枝，因此同样思路可迁移到区间计数、区间最值收集；若条件依赖深度、路径和或子树形状，仅比较根值通常不能排除整棵子树。
    - 算法只删除非法结点并把合法后代提升到原路径位置，不交换两个保留结点的祖先次序，所以满足题目“保留相对结构”。每个被剪枝子树都由 BST 值域证明全部非法，结果唯一。
  - title: 7.4 二叉搜索树基于中序遍历的算法设计
    source_heading: 7.4 二叉搜索树基于中序遍历的算法设计
    paragraphs:
    - 若先生成递增中序数组，新值就是从当前位置到末尾的后缀和。与其保存数组，不如按右—根—左的逆中序从大到小访问，把“已访问更大值之和”保存在累加器中。
    - 修改值后中序变为递减而非递增，树通常不再满足原 BST 次序，不能继续用 BST 搜索。若还需要原键，应另存或创建新树。
    - 补充： Morris 中序把每个结点左子树最右结点临时连回当前结点，用线索替代栈；每条临时边建立后必须删除，否则会留下环。
    - 解法二中序维护大小 k 的队列；有序值与 target 的距离先减后增，一旦当前值不比队头近，后续更大值也不会更近，可停止。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - BST 的力量来自“比较当前根即可排除半边候选”，但性能取决于高度。搜索、插入、删除、LCA、范围剪枝、修剪和拆分本质上都沿由键比较决定的少数路径工作；若树失衡，优势会退化。
    - 中序严格递增把树问题转成有序序列问题：相邻差、排名、合法性、后缀累加、逆序恢复和迭代器都由此导出。实现时最重要的边界是严格不等、重复键策略、递归返回的新子树根，以及整数上下界。需要稳定对数性能或频繁排名查询时，应进一步使用平衡
      BST 和子树大小增强。
  takeaways:
  - BST 的力量来自“比较当前根即可排除半边候选”，但性能取决于高度。搜索、插入、删除、LCA、范围剪枝、修剪和拆分本质上都沿由键比较决定的少数路径工作；若树失衡，优势会退化。
  - 中序严格递增把树问题转成有序序列问题：相邻差、排名、合法性、后缀累加、逆序恢复和迭代器都由此导出。实现时最重要的边界是严格不等、重复键策略、递归返回的新子树根，以及整数上下界。需要稳定对数性能或频繁排名查询时，应进一步使用平衡
    BST 和子树大小增强。
  - 若允许重复，必须规定忽略、计数或固定放一侧；原书基础迭代写法把相等值放右侧，与严格 BST 定义冲突，不能在无约定时照搬。
  - 算法只删除非法结点并把合法后代提升到原路径位置，不交换两个保留结点的祖先次序，所以满足题目“保留相对结构”。每个被剪枝子树都由 BST 值域证明全部非法，结果唯一。
  - 解法二中序维护大小 k 的队列；有序值与 target 的距离先减后增，一旦当前值不比队头近，后续更大值也不会更近，可停止。
