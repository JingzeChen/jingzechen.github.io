  question_source: 0. 本章解决什么问题
  thesis: 主成分分析（principal component analysis，PCA）是一种常用的无监督学习方法。这一方法利用正交变换，把由线性相关变量表示的观测数据转换为少数几个由线性无关变量表示的数据，线性无关的变量称为主成分。主成分的个数通常小于原始变量的个数，所以主成分分析属于降维方法。
  thesis_source: 0. 本章解决什么问题
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 主成分分析（principal component analysis，PCA）是一种常用的无监督学习方法。这一方法利用正交变换，把由线性相关变量表示的观测数据转换为少数几个由线性无关变量表示的数据，线性无关的变量称为主成分。主成分的个数通常小于原始变量的个数，所以主成分分析属于降维方法。
    source_heading: 0. 本章解决什么问题
  - term: "【补充】前置知识与记号"
    meaning: 标准化并非总是必需：它取决于是否希望消除量纲与尺度。本章原书主要讨论标准化后基于相关矩阵的 PCA。
    source_heading: "【补充】前置知识与记号"
  - term: 16.1 总体主成分分析
    meaning: 若某特征值有重根，对应特征子空间内任意一组标准正交基都可作为主成分方向。此时主子空间唯一，但子空间内的具体坐标轴不唯一；这与第 15 章重复奇异值的奇异向量不唯一完全类似。
    source_heading: 16.1 总体主成分分析
  - term: 16.2 样本主成分分析
    meaning: "“S 的特征值和特征向量是总体协方差特征值/向量的极大似然估计”也需要分布假设与参数化讨论，不能仅凭 S 无偏直接推出。"
    source_heading: 16.2 样本主成分分析
  - term: 16.4 【补充】深入理解、局限与替代方法
    meaning: PCA 不是特征选择：主成分通常是所有原变量的线性组合，没有直接删除原变量。
    source_heading: 16.4 【补充】深入理解、局限与替代方法
  - term: 16.5 本章概要与必须掌握的结论
    meaning: 定理 16.1：主成分方向是协方差矩阵单位特征向量，主成分方差是对应特征值。
    source_heading: 16.5 本章概要与必须掌握的结论
