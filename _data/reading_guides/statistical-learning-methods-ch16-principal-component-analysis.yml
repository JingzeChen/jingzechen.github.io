  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 主成分分析（principal component analysis，PCA）是一种常用的无监督学习方法。这一方法利用正交变换，把由线性相关变量表示的观测数据转换为少数几个由线性无关变量表示的数据，线性无关的变量称为主成分。主成分的个数通常小于原始变量的个数，所以主成分分析属于降维方法。
    - PCA 要寻找一组新的正交坐标轴，使数据沿第 1 轴变化最大、沿第 2 轴次大，依次类推；然后只保留前几个方向。
    - PCA 主要用于发现数据的基本结构，即数据中变量之间的关系，是数据分析的有力工具，也用于其他机器学习方法的前处理。
    - PCA 属于多元统计分析的经典方法：Pearson 于 1901 年首先提出（针对非随机变量），Hotelling 于 1933 年推广到随机变量。
  - title: "【补充】前置知识与记号"
    source_heading: "【补充】前置知识与记号"
    paragraphs:
    - 标准化并非总是必需：它取决于是否希望消除量纲与尺度。本章原书主要讨论标准化后基于相关矩阵的 PCA。
    - 因此原书图 16.1 后“知道 y_1 后对 y_2 的预测完全随机”应理解为线性预测意义下没有帮助，不是对任意分布都严格独立。
  - title: 16.1 总体主成分分析
    source_heading: 16.1 总体主成分分析
    paragraphs:
    - 统计分析中，数据的变量之间可能存在相关性，以致增加分析难度。于是考虑由少数不相关变量代替相关变量，并要求保留数据中的大部分信息。
    - 原书先规范化数据，使每个变量均值为 0、方差为 1；再进行正交变换，把线性相关变量变成互不相关的新变量。新变量按方差从大到小排列，依次称为第一、第二……主成分。
    - 若某特征值有重根，对应特征子空间内任意一组标准正交基都可作为主成分方向。此时主子空间唯一，但子空间内的具体坐标轴不唯一；这与第 15 章重复奇异值的奇异向量不唯一完全类似。
    - 局限【补充】：方差大不一定对分类有用；一个低方差方向可能正好区分类别。PCA 是无监督方法，只保留总体变化，不知道标签目标。
  - title: 16.2 样本主成分分析
    source_heading: 16.2 样本主成分分析
    paragraphs:
    - "“S 的特征值和特征向量是总体协方差特征值/向量的极大似然估计”也需要分布假设与参数化讨论，不能仅凭 S 无偏直接推出。"
    - 求 R 的降序特征值与单位特征向量，按累计贡献率选 k；
    - 解释：y_1 系数全正且接近，表示整体成绩；y_2 文科为正、理科为负，表示文理差异。
    - V 的列就是协方差矩阵特征向量，即主成分方向；
  - title: 16.4 【补充】深入理解、局限与替代方法
    source_heading: 16.4 【补充】深入理解、局限与替代方法
    paragraphs:
    - 中心化与标准化不同：PCA 必须围绕均值分析；是否除标准差取决于尺度语义。
    - 重复特征值时轴不唯一：主子空间唯一，内部任意正交旋转都同样最优。
    - PCA 不是特征选择：主成分通常是所有原变量的线性组合，没有直接删除原变量。
    - 样本相关系数一般有偏：不能把协方差无偏性机械搬到相关系数。
  - title: 16.5 本章概要与必须掌握的结论
    source_heading: 16.5 本章概要与必须掌握的结论
    paragraphs:
    - PCA 用正交变换把相关变量变成按方差降序、两两不相关的主成分。
    - 定理 16.1：主成分方向是协方差矩阵单位特征向量，主成分方差是对应特征值。
    - 定理 16.2：任意 q 维正交投影中，前 q 主成分保留总方差最大。
    - 方差贡献率与累计贡献率用于选择 k，但不能保证下游任务最优。
  takeaways:
  - PCA 属于多元统计分析的经典方法：Pearson 于 1901 年首先提出（针对非随机变量），Hotelling 于 1933 年推广到随机变量。
  - 因此原书图 16.1 后“知道 y_1 后对 y_2 的预测完全随机”应理解为线性预测意义下没有帮助，不是对任意分布都严格独立。
  - V 的列就是协方差矩阵特征向量，即主成分方向；
  - 样本相关系数一般有偏：不能把协方差无偏性机械搬到相关系数。
  - 方差贡献率与累计贡献率用于选择 k，但不能保证下游任务最优。
