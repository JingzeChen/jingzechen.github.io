  sections:
  - title: 本章定位：在分析和写作之前，先确认究竟要解决什么
    source_heading: 本章定位：在分析和写作之前，先确认究竟要解决什么
    paragraphs:
    - 分析价值：限定原因搜索和解决方案设计的范围；
    - 表达价值：直接提供序言中的背景、冲突和疑问。
  - title: 界定问题的框架
    source_heading: 界定问题的框架
    paragraphs:
    - 同样的 R1 在不同背景中可能有不同意义。例如销量下降可能是市场衰退，也可能是主动退出低利润客户。
    - 按“从左到右、再往下”读图：先说明稳定背景，再说明读者最后知道的新事实，把它作为冲突，最后提出疑问。
    - 多年来，我们通过支付试销费，使新品能在超市货架试销。费用现已涨到每周 2 万美元，我们为阻止继续上涨而拒绝付款；超市也因此拒绝试销。我们应如何既恢复合理试销，又控制费用？
    - 前面状态和尝试已成为共同背景；最新事件打破当前稳定状态，直接触发读者疑问。若用更早冲突开场，文章会回答已经处理过的问题。
  - title: 十二、一个问题可能有多个 R1
    source_heading: 十二、一个问题可能有多个 R1
    paragraphs:
    - 次生结果：由主 R1 进一步造成；
    - 并列 R1：共享困扰但需分别衡量。
  - title: 九、为什么不能只否定其他方案
    source_heading: 九、为什么不能只否定其他方案
    paragraphs:
    - 错误结构：A 不好、B 不好，所以选 C。即使 A、B 不好，也不能证明 C 有效。
    - C 在主要标准上优于或综合优于其他方案；
  - title: 二、困扰事件
    source_heading: 二、困扰事件
    paragraphs:
    - 供货量预计每年增长 4% 至 5%；
    - 明年年底前计划新增 198 家门店。
  - title: 七、图 8-19 的建议金字塔
    source_heading: 七、图 8-19 的建议金字塔
    paragraphs:
    - 当年改造伍斯特和伊凡斯维尔仓库；
    - 五年后开始在佐治亚州或卡罗来纳州建设新中心。
  - title: 十、原书案例还需哪些分析
    source_heading: 十、原书案例还需哪些分析
    paragraphs:
    - 容量计算口径为何设计 490 却实际只能 438；
    - 各方案现金流、ROI 和敏感性；
  - title: 综合示例：移动应用留存率下降
    source_heading: 综合示例：移动应用留存率下降
    paragraphs:
    - R1：新用户 7 日留存率从 32% 降到 21%，主要流失发生在首次核心任务之前。
    - R2：在两个月内把 7 日留存恢复到至少 30%，且不降低合规授权率和付费转化。
    - 最近版本调整了注册和权限流程。上线后，新用户 7 日留存从 32% 降到 21%，且多数流失发生在首次核心任务前。团队建议增加推送通知，但尚不清楚该措施能否解决早期流失。我们是否应采用该方案？
    - 若数据发现下降只发生在某渠道，困扰可能是低质量获客而非注册流程。此时应更新序幕、R1 和诊断范围，而不是维护原假设。
  - title: 转换序言
    source_heading: 转换序言
    paragraphs:
    - 最后一个已知且未解决事实是什么？
    - 正文是否回答 Q，而非更早或更晚的问题？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 超市试销案例展示三层问题历史：支付费用解决最初拒绝，费用上涨引出拒付，拒付又造成试销被拒。
    - 读者有七种典型疑问，取决于方案未知、待评价、待实施、已失效、多方案、目标未知或现状未知。
    - 配送中心案例把容量不足、增长预测、候选方案与成本/速度/品种约束组织为“选择哪个方案”。
    - 本章最核心的实践原则是：先把问题写成“在什么系统中，什么变化导致了怎样的 R1，而我们希望达到怎样的 R2”，再确认读者已经走到解决流程的哪一步；只有这样，序言才能提出正确疑问，正文金字塔才能回答真正需要回答的问题。
  takeaways:
  - 表达价值：直接提供序言中的背景、冲突和疑问。
  - 并列 R1：共享困扰但需分别衡量。
  - 五年后开始在佐治亚州或卡罗来纳州建设新中心。
  - 若数据发现下降只发生在某渠道，困扰可能是低质量获客而非注册流程。此时应更新序幕、R1 和诊断范围，而不是维护原假设。
  - 本章最核心的实践原则是：先把问题写成“在什么系统中，什么变化导致了怎样的 R1，而我们希望达到怎样的 R2”，再确认读者已经走到解决流程的哪一步；只有这样，序言才能提出正确疑问，正文金字塔才能回答真正需要回答的问题。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「困扰事件与 R1」？
  answer: R1：变化导致或暴露了什么不满意结果。
  source_heading: 困扰事件与 R1
- level: 概念辨析
  question: 原文如何解释「问题与症状」？
  answer: 症状是可观察表现，问题是症状与目标的差距及其系统边界。多个症状可能属于同一问题。
  source_heading: 问题与症状
- level: 概念辨析
  question: 原文如何解释「方案不可行与执行不力」？
  answer: 执行不力：方案可能正确，但实施偏离。
  source_heading: 方案不可行与执行不力
- level: 概念辨析
  question: 原文如何解释「机会与问题」？
  answer: 机会是当前状态与可实现更优状态的差距。必须说明机会证据、价值和时间窗口。
  source_heading: 机会与问题
- level: 概念辨析
  question: 原文如何解释「标杆差距与目标差距」？
  answer: 标杆是外部比较，不自动等于合理 R2。竞争者做得更高不代表本组织应追求同一指标。
  source_heading: 标杆差距与目标差距
