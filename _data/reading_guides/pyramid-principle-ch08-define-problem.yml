  question: 本章定位：在分析和写作之前，先确认究竟要解决什么？
  question_source: 本章定位：在分析和写作之前，先确认究竟要解决什么
  thesis: 本章最核心的实践原则是：先把问题写成“在什么系统中，什么变化导致了怎样的 R1，而我们希望达到怎样的 R2”，再确认读者已经走到解决流程的哪一步；只有这样，序言才能提出正确疑问，正文金字塔才能回答真正需要回答的问题。
