overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 学习目标与因果主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与因果主线
  thesis: 内部知识、短期上下文和外部长期记忆承担不同角色。记忆管理决定 insert、merge、replace、压缩和删除，记忆检索本身又是 RAG。
  thesis_source: 23. 本章总结
  concepts:
  - term: 0. 学习目标与因果主线
    meaning: 检索器怎样工作和评价？ 掌握 TF-IDF、BM25、嵌入检索、ANN、Precision/Recall、MRR、MAP、NDCG 与 RRF。
    source_heading: 0. 学习目标与因果主线
  - term: 6. Comparing Retrieval Algorithms（比较检索算法）
    meaning: Recall 难计算，因为需要知道库中所有相关文档；Precision 只需判断已取回文档，因此更容易由人工或 AI 裁判计算。只报告 precision
      会掩盖“取回的都不错，但漏了关键证据”。
    source_heading: 6. Comparing Retrieval Algorithms（比较检索算法）
  - term: 10. Query Rewriting（查询改写）
    meaning: 查询改写也称 reformulation、normalization 或 expansion。传统搜索用拼写、同义词和规则；AI 应用可让模型基于对话改写。
    source_heading: 10. Query Rewriting（查询改写）
  - term: 13. RAG Beyond Texts（超越文本的 RAG）
    meaning: 多模态生成器可同时接收文本、图像、音频和视频。问“电影《飞屋环游记》中的房子是什么颜色”，检索器可返回房屋图片，而不只返回文字描述。
    source_heading: 13. RAG Beyond Texts（超越文本的 RAG）
  - term: 18. Reflection and Error Correction（反思与纠错）
    meaning: 反思通常比从头提升规划能力容易，能带来明显收益；代价是更多模型调用、输入示例、thought/observation token 和用户等待时间。必须限制反思次数，并检测相同计划循环。
    source_heading: 18. Reflection and Error Correction（反思与纠错）
  - term: 25. 一页速记
    meaning: 本章最值得保留的判断框架是：先确定任务缺少什么信息，再决定怎样检索；先确定目标和约束，再决定允许智能体做什么；最后用可回放证据评价每一步，而不是被流畅的最终文本迷惑。
    source_heading: 25. 一页速记
  logic:
  - 0. 学习目标与因果主线
  - 6. Comparing Retrieval Algorithms（比较检索算法）
  - 7.3 Reciprocal Rank Fusion（RRF）
  - 13. RAG Beyond Texts（超越文本的 RAG）
  - 16. Planning（规划）
  - 21. Memory（记忆）
  - 25. 一页速记
  sections:
  - title: 0. 学习目标与因果主线
    source_heading: 0. 学习目标与因果主线
    paragraphs:
    - 第五章关注指令，第六章关注怎样为每个查询动态构造上下文。缺少信息时，模型只能依赖参数中的内部知识，知识可能过时、不完整或错误，因而更容易幻觉。
    - RAG（retrieval-augmented generation）：从外部数据源检索相关信息，再交给模型生成；
    - Agent（智能体）：让模型规划并使用检索、搜索、数据库、代码执行等工具，不只读取信息，还能改变外部世界。
    - 检索器怎样工作和评价？ 掌握 TF-IDF、BM25、嵌入检索、ANN、Precision/Recall、MRR、MAP、NDCG 与 RRF。
  - title: 3. Retrieval Algorithms（检索算法）
    source_heading: 3. Retrieval Algorithms（检索算法）
    paragraphs:
    - 检索的核心是对文档按与查询的相关性排序。算法差异在于如何表示查询和文档、怎样计算相关分数，以及如何在质量与速度间取舍。
    - 词项 one-hot 向量通常稀疏，神经嵌入通常稠密。但 SPLADE 用 BERT 生成语义表示，再通过正则化压到大多数值为 0。它在机制上更接近嵌入检索，却会被“稀疏”分类放到词项方法旁边。
    - term-based（词项/词法检索）；
    - embedding-based（嵌入/语义检索）。
  - title: 6. Comparing Retrieval Algorithms（比较检索算法）
    source_heading: 6. Comparing Retrieval Algorithms（比较检索算法）
    paragraphs:
    - 向量数据库费用有时可达到模型 API 支出的五分之一甚至一半，尤其在数据每天变化、需重算上亿文档嵌入时。语义效果必须证明值得额外成本。
    - Recall 难计算，因为需要知道库中所有相关文档；Precision 只需判断已取回文档，因此更容易由人工或 AI 裁判计算。只报告 precision
      会掩盖“取回的都不错，但漏了关键证据”。
    - HNSW 索引重、内存大，但查询快且召回高；LSH 建得快、内存轻，却可能查询更慢或不够准。数据频繁更新时，构建时间与增量能力比静态最高 QPS 更重要。
    - 词法与语义排序都把神经网络文档放首位，但后续候选不同。指标示例中两个相关文档都在 top-3，因此 recall 为 1；一个低相关文档被放到第二位，使
      NDCG 低于 1。
  - title: 7.3 Reciprocal Rank Fusion（RRF）
    source_heading: 7.3 Reciprocal Rank Fusion（RRF）
    paragraphs:
    - 避免 rank 0 或极端头部支配；
    - k_0 越小，第一名与后续差距越大；
    - 文档未出现在某列表时，该列表贡献 0。
    - RRF 只依赖顺序，不依赖不可比的原始分数。它假设各列表具有价值；很差的检索器仍可能引入噪声，应通过消融评价。
  - title: 10. Query Rewriting（查询改写）
    source_heading: 10. Query Rewriting（查询改写）
    paragraphs:
    - 查询改写也称 reformulation、normalization 或 expansion。传统搜索用拼写、同义词和规则；AI 应用可让模型基于对话改写。
    - 适配检索器，例如保留错误码和实体名。
    - 可为一个问题生成多个查询：关键词形式、同义表达、子问题。并行检索后融合排名能提高召回，但成本更高，也可能引入偏离意图的文档。
    - 改写器本身需要评价：语义保持率、实体准确率、检索 recall 提升、额外延迟和幻觉率。
  - title: 13. RAG Beyond Texts（超越文本的 RAG）
    source_heading: 13. RAG Beyond Texts（超越文本的 RAG）
    paragraphs:
    - 多模态生成器可同时接收文本、图像、音频和视频。问“电影《飞屋环游记》中的房子是什么颜色”，检索器可返回房屋图片，而不只返回文字描述。
    - 表很多、schema 放不下时，先检索相关表，再做 text-to-SQL。SQL 可由同一生成器或专用模型完成。
    - 这一模式已经接近 agent：SQL 生成与执行是工具调用。最大的风险不是“回答措辞”，而是错误查询、越权读取和写操作。
    - 示例将参数与 SQL 模板分离，避免字符串拼接注入；真实系统还要限制表/列、查询成本、返回行数，并用数据库只读账号作为最终权限边界。
  - title: 16. Planning（规划）
    source_heading: 16. Planning（规划）
    paragraphs:
    - 搜索常需回溯：走到动作 A 后发现状态无望，返回旧状态尝试 B。自回归模型虽然逐 token 向前生成，却可以读取失败观察、修改后续计划或整体重启，形成系统层面的回溯。真正困难的是准确预测动作会把环境带到什么状态。因此，可靠规划通常还需要搜索算法、显式状态、模拟器或世界模型，而不应只让模型生成一段看起来合理的步骤。
    - 启发式规则之后，才考虑模型裁判评价计划合理性。模型裁判也会错，不能替代权限和 schema 检查。坏计划可要求重生成；也可并行生成多个计划，让评价器选择，代价是更多
      token 和延迟。
    - 人可以介入任何阶段：给高层计划、批准计划、执行敏感步骤或验证结果。每个动作都应明确自动化等级，例如“自动读取、批准后发送邮件、禁止转账”。笼统地说系统是“human
      in the loop”并不足够。
    - 意图分类器本身也可能成为独立组件甚至独立智能体。由计划生成、计划验证、工具执行和结果评价等组件组成的系统，可以视为多智能体系统；“多智能体”不一定意味着多个拟人角色，只表示多个拥有不同职责的决策组件。
  - title: 18. Reflection and Error Correction（反思与纠错）
    source_heading: 18. Reflection and Error Correction（反思与纠错）
    paragraphs:
    - 反思可由行动模型自我批评，也可由独立评价器给分。独立评价器减少“自己批准自己”的风险，但两个模型可能共享盲点。
    - 这里真正重要的是观察能够改变下一动作。如果系统无论工具返回什么都执行固定列表，只是普通工作流，不是闭环规划。
    - 生产系统没有必要暴露模型的完整私有思维链；可记录简短决策理由、状态、工具参数、观察摘要和终止原因，以便审计，同时避免把冗长自由文本当作可靠状态。
    - 反思通常比从头提升规划能力容易，能带来明显收益；代价是更多模型调用、输入示例、thought/observation token 和用户等待时间。必须限制反思次数，并检测相同计划循环。
  - title: 21. Memory（记忆）
    source_heading: 21. Memory（记忆）
    paragraphs:
    - 记忆是让模型保留并使用信息的机制。RAG 要记住可检索知识，多步智能体要保存指令、示例、工具清单、计划、工具输出、状态和反思；任何需要跨轮保持信息的应用都依赖记忆。
    - 模型权重保留训练知识，因此也是一种记忆；除非训练、微调或换模型，否则不会因一次对话而改变。上下文是短期记忆：立即可用但容量有限。RAG 数据源是长期记忆：可跨会话保存，也可独立更新和删除。
    - 最简单策略是 first in, first out：保留最近 N 条消息或 token，最早内容先移出。它假设越早越不相关，但对任务对话可能完全错误：第一条消息往往定义目标、硬约束和用户授权，丢掉后智能体会高效地做错事。
    - 遇到冲突时，“总保留最新”并不可靠，新信息可能来自低可信网页。也不能无条件让模型裁判二选一。更稳妥的是保留值、来源、时间、适用范围和置信度；在领域规则允许时确定当前有效值，并保留历史版本供审计。
  - title: 25. 一页速记
    source_heading: 25. 一页速记
    paragraphs:
    - 每个工具是否有清晰 schema、错误语义、超时和独立测试；
    - 读写权限是否分离，高风险动作是否展示具体参数并审批；
    - 是否设置最大步骤、token、费用、时间与重试；
    - 本章最值得保留的判断框架是：先确定任务缺少什么信息，再决定怎样检索；先确定目标和约束，再决定允许智能体做什么；最后用可回放证据评价每一步，而不是被流畅的最终文本迷惑。
  takeaways:
  - RAG 先检索再生成，让模型在不修改权重的前提下使用私有、最新且超出上下文窗口的信息。
  - 向量检索通常依靠 ANN 以少量准确率换吞吐和延迟；索引 recall 与语义 relevance 是两个不同层次。
  - 智能体由环境与动作集合定义；工具扩展感知和行动，规划器根据目标、约束和观察选择动作。
  - 规划应与执行解耦，支持验证、层级分解、并行/分支/循环和有限反思。
  - RAG 与智能体主要通过输入、上下文和工具改变模型行为，并不修改模型权重；下一章的微调才会更新模型参数。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「误解 1：上下文窗口足够长，就不需要 RAG」？
  answer: 长窗口仍有成本、延迟、权限、数据增长、信息新鲜度和 lost-in-the-middle 问题。小知识库可先测试全量上下文，但不是普遍结论。
  source_heading: 误解 1：上下文窗口足够长，就不需要 RAG
- level: 概念辨析
  question: 原文如何解释「误解 4：检索到相关文档就等于回答正确」？
  answer: 生成器可能忽略、曲解或受到恶意上下文影响。还要评价答案忠实度、引用支持和任务正确性。
  source_heading: 误解 4：检索到相关文档就等于回答正确
- level: 概念辨析
  question: 原文如何解释「误解 7：参数通过 schema 就一定正确」？
  answer: schema 检查结构和类型，不能知道 120 是否被错误写成 100，也不能判断收件人是否符合用户意图。
  source_heading: 误解 7：参数通过 schema 就一定正确
- level: 概念辨析
  question: 原文如何解释「误解 9：反思能保证模型纠正错误」？
  answer: 行动模型和评价器可能共享盲点，反思还可能循环或自信地批准错误。确定性约束、测试和人工审批仍不可缺。
  source_heading: 误解 9：反思能保证模型纠正错误
- level: 概念辨析
  question: 原文如何解释「误解 12：自主程度越高越先进」？
  answer: 自主性是风险与收益选择。对不可逆、高金额或受监管动作，明确审批通常比完全自动更成熟。
  source_heading: 误解 12：自主程度越高越先进
