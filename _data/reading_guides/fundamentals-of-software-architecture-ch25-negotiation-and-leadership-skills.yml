  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - Negotiation 和 leadership 不是天生的“软技能”，原章把它们称为需要多年学习、实践和犯错才能获得的 hard skills。本章无法让读者一夜成为专家，但提供了一组可练习的起点。
    - 'Tanya Reilly，The Staff Engineer’s Path: A Guide for Individual Contributors；'
    - 'Roger Fisher、William L. Ury、Bruce Patton，Getting to Yes: Negotiating Agreement
      Without Giving In。'
    - 原章没有给出正式谈判算法。本文增加的 availability 精确换算、谈判准备画布、会议成本模型、话术检查清单和伦理边界属于教学扩展，不是原书规定的万能流程。原章的可用性表存在两处近似/算术偏差，本文会保留原表并透明复算。
  - title: 1. Negotiation and Facilitation：谈判与促成
    source_heading: 1. Negotiation and Facilitation：谈判与促成
    paragraphs:
    - 收集信息也意味着准备被证明错。Architect 不应只搜集支持 three nines 的材料；若某个 global market、regulatory
      feed 或 settlement process 实际需要 24×7，就必须调整结论。
    - 本文保留原章表用于忠实阅读，同时用公式指出偏差。真实 SLA 还要定义 measurement window、planned maintenance、regional
      scope、partial degradation 等，不能只用一个百分比。
    - 有效 architect 通过共同工作赢得 respect。团队越感到被 architecture/architect 排除，越容易出现 Ivory Tower
      architecture antipattern：高处发命令，不理 developers 的意见与 concerns。
    - Developer 不再争论 layer rule，而是问如何改善 simple query performance。双方可以在保护 change control
      的前提下探索 caching、query optimization 或受控 exception。
  - title: 2. The Software Architect as a Leader：作为领导者的架构师
    source_heading: 2. The Software Architect as a Leader：作为领导者的架构师
    paragraphs:
    - 图 25-1 展示大型 global bank backend 的密集 information flows。没人知道它是否必须如此复杂，因为 architecture
      已把问题做复杂。这是 accidental complexity：“we have made a problem hard”。
    - 语法上后两项是形容词，表达 architect 应 communicate clearly and concisely，并与 developers、business
      stakeholders、other architects collaboration。
    - Military story：远离 troops 的 captain 下令攻 hill，soldiers 犹豫并看 lower-ranking sergeant；sergeant
      理解实际 situation，轻轻点头后，soldiers 才有信心前进。
    - Antonio 看起来 depressed/bothered 时，可邀请一起喝 coffee，温和问是否 okay；同时观察 verbal/nonverbal
      signals，知道何时 back off。Architect 不是 therapist，不应逼迫私人披露，但可提供人性化入口和转介支持。
  - title: 3. Integrating with the Development Team：融入开发团队
    source_heading: 3. Integrating with the Development Team：融入开发团队
    paragraphs:
    - 若 architect 和 tech lead 都被邀请，可考虑 architect 代替 tech lead，让 team 保持 focus。Architect
      自己 meeting time 增加，但整体 team productivity 和 respect 提升。
    - 公式不意味着人数多的会议都不值；architecture risk/decision alignment 可能远高于成本。它用于提醒 organizer
      评估 outcome。
    - Flow 是大脑 100% engaged 于问题、拥有 full attention 和 maximum creativity 的状态。处理困难 algorithm/code
      时，hours 像 minutes。
    - Remote environment 无法靠同坐或走动建立 presence，collaboration 更困难。原章推荐 Jacqui Read 的
      Communication Patterns，Part 4 专门讨论 remote teams。
  - title: 4. 三类谈判对象的统一框架
    source_heading: 4. 三类谈判对象的统一框架
    paragraphs:
    - 下面的教学示例不“自动谈判”，只把全局 five-nines position 分解为 subsystem SLO options，并算年度 downtime
      budget。
    - 代码对应 divide-and-conquer：真正 critical 的 trade execution 获得最严 SLO，reporting/admin
      不被迫购买同等 availability。具体数字必须由 stakeholders 与 risk analysis 决定，不能由程序生成。
  - title: 6. 一般化的问题解决方法
    source_heading: 6. 一般化的问题解决方法
    paragraphs:
    - 识别 ego、情绪、rank impulse 和预设答案。若 conversation 已 personal/heated，暂停并恢复冷静。
    - Nines -> downtime；fast -> latency SLO；scale -> throughput/concurrency；cheap
      -> lifecycle cost。
    - 问 entire system 是否都需要同样 characteristic，按 critical path/domain/quantum 分解。
    - 在 production-like context 中做公平 spike/benchmark/failure test，用 evidence 替代观点权威。
  - title: 8. Summary：总结
    source_heading: 8. Summary：总结
    paragraphs:
    - 本章技巧用于帮助 architect 与 development team 和其他 stakeholders 建立更好的 collaborative relationships。这些不是可有可无的礼仪，而是
      architecture 能否被正确选择、理解和实现的必要技能。
    - The most important single ingredient in the formula of success is knowing how
      to get along with people.
    - 业务方的 buzzword 是 concern signal。 把 “yesterday”“lightning fast”“five nines” 翻译成
      time-to-market、performance、availability 指标。
    - 与其他 architect 争议时，demonstration defeats discussion。 Context-specific evidence
      胜过 rank、搜索结果或 LLM 概率答案。
