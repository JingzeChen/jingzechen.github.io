    meaning: 原章没有给出正式谈判算法。本文增加的 availability 精确换算、谈判准备画布、会议成本模型、话术检查清单和伦理边界属于教学扩展，不是原书规定的万能流程。原章的可用性表存在两处近似/算术偏差，本文会保留原表并透明复算。
