check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5.1 Negotiation 是让对方接受我的方案」？
  answer: 错误。目标是理解 interests、验证 evidence 并形成可执行 agreement；自己的方案也可能被推翻。
  source_heading: 5.1 Negotiation 是让对方接受我的方案
- level: 概念辨析
  question: 原文如何解释「5.7 Divide and Conquer 是拆散对手」？
  answer: 在本章中是把全局 requirement 分解到真正需要它的 system areas，减少不必要范围，不是操纵人际关系。
  source_heading: 5.7 Divide and Conquer 是拆散对手
- level: 概念辨析
  question: 原文如何解释「5.13 People Skills 不属于技术架构师」？
  answer: 错误。Architecture 要靠人 funding、implement、operate；原章经验估计约 50% effectiveness
    来自 people skills。
  source_heading: 5.13 People Skills 不属于技术架构师
- level: 概念辨析
  question: 原文如何解释「5.19 Favor 是更高明的命令」？
  answer: 不应如此。必须允许真实拒绝、承认 planning failure，并调整 priority；否则是情感施压。
  source_heading: 5.19 Favor 是更高明的命令
- level: 概念辨析
  question: 原文如何解释「5.25 坐在 Team 旁边就自动有 Collaboration」？
  answer: Physical proximity 只增加机会；仍需 respect、availability、清晰沟通和心理安全。Remote team 也能有高质量协作。
  source_heading: 5.25 坐在 Team 旁边就自动有 Collaboration
