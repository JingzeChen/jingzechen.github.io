overview:
  kind: summary
  minutes: 12
  question: 原文围绕「0. 阅读目标与主线」建立了怎样的核心认识？
  question_source: 0. 阅读目标与主线
  thesis: 附录 E 从一个关键观察出发：大型 pretrained model 的下游 task adaptation 未必需要在整个 parameter
    space 中自由移动。通过把每个目标 weight 的 update 约束为低秩 product，LoRA 将 124,441,346 个可训练参数降到
    2,666,528，同时保持 dataset、model interface 和 classification loss 不变。
  thesis_source: 14. 最终总结
  concepts:
  - term: 0. 阅读目标与主线
    meaning: 最终打印 test accuracy 为 98.00%，紧接的 prose 写 97.33%；同一 artifact 内不一致。本文以可见打印输出
      98.00% 为主，并标记文字数字为编辑瑕疵。
    source_heading: 0. 阅读目标与主线
  - term: E.4 Parameter-Efficient Fine-Tuning with LoRA（使用 LoRA 微调）
    meaning: 本附录没有。LoRA dropout 是额外 regularization hyperparameter，只在 training mode
      生效；它会破坏 train mode 下“插入后输出完全相同”吗？因为 B=0，初始 branch仍为零，所以不会；训练后则会带来 stochastic
      output。
    source_heading: E.4 Parameter-Efficient Fine-Tuning with LoRA（使用 LoRA 微调）
  - term: 9. 作者分析与解决问题的一般思路
    meaning: LoRA wrapper 保持 Linear 的 input/output shape，所以上层 model、loss 和 trainer无需理解
      adapter。良好 abstraction 应让局部实现变化不扩散到整个系统。
    source_heading: 9. 作者分析与解决问题的一般思路
  - term: 10.2 Adapter config
    meaning: Orientation/implementation version。
    source_heading: 10.2 Adapter config
  - term: 10.5 保存与加载
    meaning: 不可信 checkpoint serialization 安全。
    source_heading: 10.5 保存与加载
  - term: 14. 最终总结
    meaning: 附录 E 从一个关键观察出发：大型 pretrained model 的下游 task adaptation 未必需要在整个 parameter
      space 中自由移动。通过把每个目标 weight 的 update 约束为低秩 product，LoRA 将 124,441,346 个可训练参数降到
      2,666,528，同时保持 dataset、model interface 和 classification loss 不变。
    source_heading: 14. 最终总结
  logic:
  - 0. 阅读目标与主线
