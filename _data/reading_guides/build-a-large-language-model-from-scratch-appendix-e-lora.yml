  sections:
  - title: 0. 阅读目标与主线
    source_heading: 0. 阅读目标与主线
    paragraphs:
    - Gradient/optimizer-state memory；
    - Forward 中是否多出 adapter branch。
    - Figure E.5 caption 写“six epochs”，训练配置与日志实际是 5 epochs。
    - 最终打印 test accuracy 为 98.00%，紧接的 prose 写 97.33%；同一 artifact 内不一致。本文以可见打印输出 98.00%
      为主，并标记文字数字为编辑瑕疵。
  - title: E.2 Preparing the Dataset（准备数据集）
    source_heading: E.2 Preparing the Dataset（准备数据集）
    paragraphs:
    - E.2 基本复用 Chapter 6。这样后面 LoRA 与原分类 fine-tuning 可在同一 data/task 上比较，减少“数据变化导致结果变化”的混杂。
    - 若直接用 accuracy，永远预测 ham 的 trivial classifier 已有约 86.59%。因此原书先构造 balanced dataset，使随机/多数类
      baseline 更接近 50%。
    - 替代方案包括 class-weighted loss、oversampling、focal loss、threshold tuning 和保留原 prior
      的评价集。
    - 分类使用最后 position logits，因此最后 EOT hidden state 读取真实文本和前面 padding。该 interface 能通过
      fine-tuning 工作，却不是“pads 无影响”。若改 dynamic padding、last-real-token pooling 或 attention
      mask，结果可能改变。
  - title: E.4 Parameter-Efficient Fine-Tuning with LoRA（使用 LoRA 微调）
    source_heading: E.4 Parameter-Efficient Fine-Tuning with LoRA（使用 LoRA 微调）
    paragraphs:
    - 它仍未处理 shared-module alias、quantized Linear subclasses 和 distributed wrapping；生产
      library 应使用经过测试的 PEFT implementation。
    - Full trainable state 同口径约 1,898.82 MiB。实际 memory 还包括 frozen base weights约 474.71
      MiB、activations、temporary buffers 和 allocator overhead。
    - Adapters 很快学会分类。Validation loss 在 step 150 较低，后期升到 0.252，提示过拟合或 confidence calibration
      变差；不能只说“曲线 level off，进一步训练不会改善”。
    - 本附录没有。LoRA dropout 是额外 regularization hyperparameter，只在 training mode 生效；它会破坏
      train mode 下“插入后输出完全相同”吗？因为 B=0，初始 branch仍为零，所以不会；训练后则会带来 stochastic output。
  - title: 5.2 四层 contract
    source_heading: 5.2 四层 contract
    paragraphs:
    - Exact architecture、weights、tokenizer 和 revision。Adapter 不是独立完整模型。
    - Target module names、input/output dimensions、rank、alpha、orientation。
    - Only intended A/B trainable；optimizer、dtype、device、loss 和 data 正确。
    - Dynamic/merged behavior 一致；adapter 与 base compatibility 可验证；artifact provenance
      完整。
  - title: 9. 作者分析与解决问题的一般思路
    source_heading: 9. 作者分析与解决问题的一般思路
    paragraphs:
    - 作者没有为 LoRA 换新 dataset/model，而是复用 Chapter 6 spam classifier。这样读者能把变化主要定位到 trainable
      parameterization，而不必同时学习新任务。
    - 插入前后 accuracy 相同说明大方向正确；更严格是 logits相同。该设计让复杂模型 replacement 有一个不依赖训练质量的 cheap
      test。
    - LoRA wrapper 保持 Linear 的 input/output shape，所以上层 model、loss 和 trainer无需理解 adapter。良好
      abstraction 应让局部实现变化不扩散到整个系统。
    - 本例 LoRA 更慢，作者仍保留结果并解释额外 branch；这提醒“减少 trainable parameters”不是“减少所有 FLOPs”。负面结果帮助建立正确工程预期。
  - title: 10.2 Adapter config
    source_heading: 10.2 Adapter config
    paragraphs:
    - Target module names/pattern；
    - Adapter dropout；
    - Bias/norm/head train policy；
    - Orientation/implementation version。
  - title: 10.4 训练中
    source_heading: 10.4 训练中
    paragraphs:
    - Gradient norms for A/B；
    - A 在首步 zero gradient是否符合预期；
    - Peak memory、throughput、wall-clock；
    - Best validation checkpoint，不只 final epoch。
  - title: 10.5 保存与加载
    source_heading: 10.5 保存与加载
    paragraphs:
    - Target names/rank/alpha；
    - Head architecture/label mapping；
    - Load 后 reference logits；
    - 不可信 checkpoint serialization 安全。
  - title: 12. 自测题与参考答案
    source_heading: 12. 自测题与参考答案
    paragraphs:
    - 训练早层 adapters 时，gradient 要通过后续 frozen transformations 传播到其 inputs。无需 base weight
      gradient，不表示无需 backward-through-input。
    - 新 A/B 默认在 CPU/default dtype，可能与已在 GPU 的 base 不一致。移动最终 module tree 或在 constructor继承
      device/dtype。
    - 它增加低秩 branch matmuls，且仍需 base forward/input-gradient backward。速度收益取决于省下的 weight-gradient/optimizer工作是否大于额外
      branch成本。
    - 50/50训练评价改变了真实13.4% spam base rate；deployment precision、false-positive rate和
      probability calibration会随 prior变化。
  - title: 14. 最终总结
    source_heading: 14. 最终总结
    paragraphs:
    - 附录 E 从一个关键观察出发：大型 pretrained model 的下游 task adaptation 未必需要在整个 parameter space
      中自由移动。通过把每个目标 weight 的 update 约束为低秩 product，LoRA 将 124,441,346 个可训练参数降到 2,666,528，同时保持
      dataset、model interface 和 classification loss 不变。
    - 它最有价值的不只是“参数少”，而是建立了可分离的 task delta：base 可以保持 immutable，一个模型可挂载多个小 adapters；需要低延迟时又可把
      delta merge 回 weight。但这些收益有明确边界：base computation和activations仍存在，额外 branches可能让小模型更慢，small
      layers未必省参数，adapter必须绑定精确base，target/rank/alpha仍需实验。
    - 本附录体现的通用解决问题方法是：先把 dense update 写成 base + delta，再提出低秩假设；用 shape/rank/parameter公式证明资源收益，用zero
      initialization建立插入前后等价的反证检查，再逐层扩展到完整模型，最后把参数效率、速度和泛化分别测量。 只有同时满足数学、实现、状态和评价四层不变量，LoRA
      才不只是“代码里多了两个矩阵”，而是一套可审计、可复用的模型适配机制。
  takeaways:
  - Exact architecture、weights、tokenizer 和 revision。Adapter 不是独立完整模型。
  - LoRA 是 parameter-efficient fine-tuning：冻结 base，学习低秩 task updates。
  - Replacement必须在freeze之后、optimizer之前，并在插入后对齐device/dtype。
  - Final可见metrics为100.00%*/96.64%/98.00%，原prose的97.33%与输出冲突。
  - 本附录体现的通用解决问题方法是：先把 dense update 写成 base + delta，再提出低秩假设；用 shape/rank/parameter公式证明资源收益，用zero
    initialization建立插入前后等价的反证检查，再逐层扩展到完整模型，最后把参数效率、速度和泛化分别测量。 只有同时满足数学、实现、状态和评价四层不变量，LoRA
    才不只是“代码里多了两个矩阵”，而是一套可审计、可复用的模型适配机制。
