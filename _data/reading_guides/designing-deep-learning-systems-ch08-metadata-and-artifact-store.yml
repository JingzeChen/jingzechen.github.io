  minutes: 14
  question: 原文围绕「本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 本章要回答的核心问题
  thesis: Training tracking / comparison 是 metadata system 的核心用户场景。 它要求 parameters、metrics、artifacts
    和 runs 有统一组织。
  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 原章以概念、数据模型和工具用法为主，没有复杂数学算法。本文会补充图关系、复现函数、基数、时间序列和一致性等形式化表达，用来解释设计依据与局限；这些是工程推导，不是原章另行提出的算法。MLMD
      与 MLflow 的 API、组件和产品状态具有成书时点，实际采用时应按目标版本重新验证。
    source_heading: 本章要回答的核心问题
  - term: 8.1 Artifact：深度学习活动的输入与输出
    meaning: Artifact 可以是目录、对象存储 key、数据库 snapshot、容器镜像、Git commit 所指代码，甚至逻辑 dataset
      version。关键不是物理形态，而是它是否作为某项 ML 活动的可识别输入或输出。
    source_heading: 8.1 Artifact：深度学习活动的输入与输出
  - term: 8.3 设计 Metadata 与 Artifact Store
    meaning: 数据库以 unique constraint 防重复。Terminal execution status 和 output artifact
      registration 应尽可能在同一 metadata transaction 提交；artifact bytes 则用 staging + publication
      协调。
    source_heading: 8.3 设计 Metadata 与 Artifact Store
  - term: 8.4 开源方案
    meaning: MLflow Model Registry 可把 registered model version 关联到 run artifact。Serving
      system 可程序化解析 URI / flavor，再部署。Model Registry stages 自 MLflow 2.9.0 起已弃用，较新工作流优先使用
      model aliases / tags；approval 和 registry semantics 仍须按目标版本确认，不能把原章 UI 状态机当作永久
      API。
    source_heading: 8.4 开源方案
  - term: 从本章提炼出的通用解题方法
    meaning: 定义 RBAC / tenant isolation、PII / secret filtering、audit、encryption、legal
      hold、backup / restore、schema evolution、retention、tombstone 和 artifact garbage
      collection。为 metadata freshness / completeness 建 SLO。
    source_heading: 从本章提炼出的通用解题方法
  - term: 复习与自测
    meaning: Client SDK、REST / Web Interface、Data Aggregator、Metadata Store、Artifact
      Repository 和 UI 各负责什么？
    source_heading: 复习与自测
