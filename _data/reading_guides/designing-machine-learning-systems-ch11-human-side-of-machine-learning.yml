  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - 为什么要求 data scientist 同时精通建模、Kubernetes、Airflow 和 on-call 会形成不合理 cognitive load？
    - Disparate impact、demographic parity、equal opportunity、equalized odds 和 calibration
      有何区别？
    - Privacy、accuracy、compactness、fairness、latency 和 transparency 为什么不是可独立优化的单目标？
    - 一句话概括：人本 ML 不是在模型完成后补一个伦理清单，而是从“是否应自动化”开始，把用户可理解性、团队 ownership、公平、隐私、透明和申诉嵌入目标、数据、评估、界面与运行治理。
  - title: 1. 开篇：ML 系统从来不只是技术系统
    source_heading: 1. 开篇：ML 系统从来不只是技术系统
    paragraphs:
    - 被决策影响但未必主动使用产品的人；
    - 第 1–2 章已讨论 stakeholder 与目标；本章进一步问：概率模型怎样改变交互、组织怎样协作、系统怎样在社会中产生公平或伤害。
  - title: 2. User Experience：用户体验
    source_heading: 2. User Experience：用户体验
    paragraphs:
    - 需要精确区分：训练好的 deterministic model 在固定 weights、preprocess、hardware、seed 和 deterministic
      kernels 下可重复；相同输入不同输出也可能来自 context、retrieval index、model version、sampling、feature
      freshness 或并发数值非确定性。不能把所有变化都归因于“ML 天生随机”。
    - 原章以 GPT/GPT-2/GPT-3 生成 React code 为例。模型可用很少 task-specific data 处理多任务，但输出并非总正确，task-specific
      fine-tuning 当时也昂贵。
    - 若客服 operator 能快速编辑草稿，mostly-correct response 可减少从零写作时间。若用户不会 React，生成 code 即使
      90% 正确也可能完全不可用，因为最后 10% 的识别和修复成本超过任务本身。
    - Language/time-series 等 sequential model 的计算常随长度增长；retrieval、beam search、tool
      call、queue 也会让特定 query 超时。UX 由 tail latency 和 failure behavior 决定，不只是平均 latency。
  - title: 3. Team Structure：团队结构
    source_heading: 3. Team Structure：团队结构
    paragraphs:
    - 解决方案不是取消 specialization，而是减少队列式 ticket handoff：跨职能 product squad、共同 design review、embedded
      platform partner、shared on-call/incident review 和 self-service contracts。
    - 作者后来修正自己“必须懂 K8s”的看法，并引用类比：要求 DS 了解底层 infrastructure，像要求 app developer 了解 Linux
      kernel。类比不意味着完全不懂运行约束，而是不应把平台内部实现设为日常门槛。
    - 原章设想工具接受 data location、steps、execution backend、dependencies，自动管理 infrastructure。Stitch
      Fix/Netflix 经验强调 full-stack DS 依赖工具抽象 containerization、distributed processing、automatic
      failover 等复杂度。
    - 这里体现 “you build it, you run it” 的受控版本：业务团队拥有服务结果，平台/SRE/security 提供标准能力和 guardrails。高风险或底层故障仍需
      specialists，不应把责任孤立给单个 DS。
  - title: 4. Responsible AI：负责任的人工智能
    source_heading: 4. Responsible AI：负责任的人工智能
    paragraphs:
    - 原章明确免责声明：Responsible AI 文献庞大，本节不穷尽，只帮助 practitioner 导航。作者推荐 NIST SP 1270、ACM
      FAccT、Trustworthy ML 资料、Sara Hooker 2022 slides、Timnit Gebru/Emily Denton 2020
      tutorials。
    - Strava 于 2017 年 11 月发布新版全球运动路径 heatmap，聚合 2015 至 2017 年 9 月约 10 亿活动、270 亿公里，并称数据匿名、排除
      private activities 和 user privacy zones。2018 年 1 月，分析与媒体报道使海外军事地点和活动 pattern
      的暴露问题受到广泛关注。
    - 原章引用 Hooker 等 2019/2020：在其研究的 models/datasets/compression settings 中，不同参数量模型总体表现相近，却在窄子集显著分化；protected
      feature 位于 long tail 时 algorithmic harm 被放大。他们观察到 pruning disparate impact 高于所测
      quantization methods。
    - 原章引用 NASA technical report，称 software error cost 在 lifecycle 每阶段上升一个数量级。它适合作为“越晚发现通常越贵”的历史风险直觉，不应当作所有项目每跨阶段固定乘
      10 的普适定律；修复成本取决于 architecture、automation、regulation 和 harm 已否发生。
  - title: 5. 原章总结的完整还原
    source_heading: 5. 原章总结的完整还原
    paragraphs:
    - 本章偏离前八章的技术主题，强调 ML systems 由人开发、被人使用，并在社会留下影响。
    - User Experience 部分说明：概率性会造成体验不一致；mostly-correct prediction 在用户不能修复时可能无用；可以展示多个“最正确”候选，让人选择；高/长尾
      latency 则可由快速 backup system smooth fail。
    - Team Structure 部分讨论 ML 需要多种技能。按职能分团队会产生 communication overhead、debug 困难、finger-pointing
      和 narrow context；要求同一 data scientist 掌握全部技能又难招聘、令人不满。作者的折中是以第 10 章 infrastructure
      抽象复杂性，让 data scientist 在不实现全部底层能力的前提下 end-to-end own 项目。
    - Responsible AI 是作者认为全书最重要的主题。它不是抽象哲学，而是需要紧急行动的实践。把 ethics 纳入 modeling 和 organization
      能建立信任，也可能形成竞争优势；但不能把它做成 compliance checkbox，更不能替代“产品是否应该被构建”的批判性思考。
  - title: 7. 本章知识结构
    source_heading: 7. 本章知识结构
    paragraphs:
    - End-to-end ownership 缩短反馈，但需要 platform/specialists 降低认知负担。
    - Objective、data、model、fallback 和 UI 都可能产生 bias，因此 Responsible AI 横跨 lifecycle。
    - Average metric 无法表示 group/individual harm，必须结合 slices、严重度和程序权利。
    - Transparency、model card 和 audit 提供证据，appeal/remedy 才让 accountability 有结果。
  - title: 8. 核心结论
    source_heading: 8. 核心结论
    paragraphs:
    - Responsible AI 包含 fairness、privacy、transparency、accountability、safety 与 inclusivity。
    - Ofqual 事故不是单纯 accuracy 事故。 Objective、slice evaluation、transparency 和 legitimacy
      同时失守。
    - Compression 可保持 top-line performance 却损害 long-tail slices。 每个 candidate 都要复评。
    - Model card 应记录 model details、use、factors、metrics、data、quantitative analysis、ethics
      和 caveats。
  - title: 9. 作者如何分析问题，以及可迁移的一般方法
    source_heading: 9. 作者如何分析问题，以及可迁移的一般方法
    paragraphs:
    - 记录 collection purpose、lawful basis/consent、retention、access、sharing、event lineage。模拟：re-identification、membership、attribute
      inference、group disclosure、breach 和 malicious insider。
    - 对 accuracy、latency、privacy、fairness、compactness、cost 生成 candidate frontier。先淘汰违反
      hard constraints 的方案，再由有权 stakeholder 选择 trade-off，并记录 dissent。
    - Model/system/data card 绑定 immutable version，自动拉取 registry facts、metrics、slices
      和 deployment history；人审 intended use、harm、trade-off 和 caveat。
    - 定义 review cadence 和 triggers：新法律、用途扩张、population shift、新攻击、重大模型更新、incident、owner
      消失。系统不再有正当目的、证据不足或 control 失效时，必须能退役并处理 retained data。
  takeaways:
  - 本章偏离前八章的技术主题，强调 ML systems 由人开发、被人使用，并在社会留下影响。
  - Booking.com 案例说明稳定/刷新条件应由显式状态规则定义。
  - 第一道责任 gate 是“是否应该构建/自动化”。 有些应用优化后仍不正当。
  - Overall metric 必须配合 group/intersection、support、uncertainty 和 severity。
  - 合规不是终点，checkbox 不能替代 critical thinking。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.1 ML 是概率模型，所以相同输入必然返回不同输出」？
  answer: 不必然。变化可能来自 sampling、context、data/model version 或非确定硬件；固定完整状态可以重复。
  source_heading: 6.1 ML 是概率模型，所以相同输入必然返回不同输出
- level: 概念辨析
  question: 原文如何解释「6.17 Learned router 没有成本」？
  answer: 它增加 latency、维护和 shift 风险；还需实时 load features。
  source_heading: 6.17 Learned router 没有成本
- level: 概念辨析
  question: 原文如何解释「6.35 Fallback policy 不是模型，所以无需公平审计」？
  answer: Small-school branch 改变哪些人接受算法，可能与 class/resource 相关，同样产生 disparate impact。
  source_heading: 6.35 Fallback policy 不是模型，所以无需公平审计
- level: 概念辨析
  question: 原文如何解释「6.52 删除 PII 列就完成匿名化」？
  answer: Quasi-identifiers 和 pattern 可重新连接；应基于 threat model 和攻击测试。
  source_heading: 6.52 删除 PII 列就完成匿名化
- level: 概念辨析
  question: 原文如何解释「6.75 Stay up-to-date 就是订阅新闻」？
  answer: 要把新法律、研究和事故映射成 risk register、tests、controls 和 owner actions。
  source_heading: 6.75 Stay up-to-date 就是订阅新闻
