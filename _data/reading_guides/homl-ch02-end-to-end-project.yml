overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章目标」建立了怎样的核心认识？
  question_source: 本章目标
  thesis: 分层抽样（stratified sampling）是先按照某个重要特征把总体划分为若干互不重叠的群体（层），再按各层在总体中的比例分别抽样。它不只是随机决定“抽到哪些实例”，还会控制“每一类实例抽到多少”，使训练集和测试集在关键特征上的分布尽量接近完整数据集。
  thesis_source: 3. 获取数据
  concepts:
  - term: 本章目标
    meaning: 用 Scikit-Learn Pipeline 构建可复现的数据预处理流程；
    source_heading: 本章目标
  - term: 4.3 尝试特征组合
    meaning: EDA 是迭代过程。先获得初步洞察，建立模型并分析错误后，再返回探索和特征工程。
    source_heading: 4.3 尝试特征组合
  - term: 6. 选择并训练模型
    meaning: 随机森林组合许多决策树的结果，通常能显著降低单棵树的方差。其训练误差仍可能明显低于验证误差，因此也要检查过拟合。
    source_heading: 6. 选择并训练模型
  - term: 8. 在测试集上最终评估
    meaning: 测试分数通常可能略差于交叉验证结果，因为开发过程已经对验证数据做了一定程度的适配。本章恰好相反，测试 RMSE 低于验证 RMSE，但无论方向如何，都不能继续使用测试集调参。如果测试结果满足上线要求，应接受这个最终估计。
    source_heading: 8. 在测试集上最终评估
  - term: 10.2 监控
    meaning: 模型性能可能缓慢下降，也可能因上游数据格式变化突然失效。需要告警阈值、人工抽检和可快速启用的回退模型。
    source_heading: 10.2 监控
  - term: 14. 学习检查清单
    meaning: 能选择 Grid Search 或 Randomized Search
    source_heading: 14. 学习检查清单
  logic:
  - 本章目标
  - 4.3 尝试特征组合
  - 5.1 为什么要自动化预处理
  - 8. 在测试集上最终评估
  - 10.1 保存和加载完整 Pipeline
  - 练习 4：创建 KNN 地理收入特征
  - 14. 学习检查清单
  sections:
  - title: 本章目标
    source_heading: 本章目标
    paragraphs:
    - 把业务目标转化为机器学习任务和评价指标；
    - 用 Scikit-Learn Pipeline 构建可复现的数据预处理流程；
    - 使用交叉验证比较模型并识别欠拟合、过拟合；
    - 在测试集上做一次最终评估并给出置信区间；
  - title: 3. 获取数据
    source_heading: 3. 获取数据
    paragraphs:
    - 目标值被截断尤其重要。如果模型必须准确预测高于该上限的价格，可以收集这些地区的真实标签，或从训练集和测试集中剔除这些地区；具体选择必须由业务需求决定。
    - 测试集必须在深入探索数据前创建。否则观察完整数据得到的规律会影响模型和特征设计，使测试结果过于乐观，这叫数据窥探偏差。
    - 如果数据集会不断更新，还可根据每条实例的稳定唯一标识计算哈希值，确保同一个实例始终落在同一侧。
    - 分层抽样（stratified sampling）是先按照某个重要特征把总体划分为若干互不重叠的群体（层），再按各层在总体中的比例分别抽样。它不只是随机决定“抽到哪些实例”，还会控制“每一类实例抽到多少”，使训练集和测试集在关键特征上的分布尽量接近完整数据集。
  - title: 4.3 尝试特征组合
    source_heading: 4.3 尝试特征组合
    paragraphs:
    - 每户房间数比地区总房间数更能描述居住空间；
    - 卧室占比低可能意味着住宅拥有更多其他功能房间；
    - EDA 是迭代过程。先获得初步洞察，建立模型并分析错误后，再返回探索和特征工程。
  - title: 5.1 为什么要自动化预处理
    source_heading: 5.1 为什么要自动化预处理
    paragraphs:
    - 保证训练与生产推理使用完全相同的步骤；
    - 与交叉验证结合，防止验证折信息泄漏到训练折。
  - title: 6. 选择并训练模型
    source_heading: 6. 选择并训练模型
    paragraphs:
    - 随机森林组合许多决策树的结果，通常能显著降低单棵树的方差。其训练误差仍可能明显低于验证误差，因此也要检查过拟合。
    - Scikit-Learn 的评分约定是“越大越好”，所以损失类指标以负数返回，需要取负号还原 RMSE。
    - 比较训练误差和验证误差能诊断拟合状态；比较不同验证折的分数分布，还能了解评估的不确定性。
  - title: 8. 在测试集上最终评估
    source_heading: 8. 在测试集上最终评估
    paragraphs:
    - 测试分数通常可能略差于交叉验证结果，因为开发过程已经对验证数据做了一定程度的适配。本章恰好相反，测试 RMSE 低于验证 RMSE，但无论方向如何，都不能继续使用测试集调参。如果测试结果满足上线要求，应接受这个最终估计。
    - 不要根据测试误差继续选择特征或超参数；
    - 最终 Pipeline 应直接接受原始格式测试数据；
  - title: 10.1 保存和加载完整 Pipeline
    source_heading: 10.1 保存和加载完整 Pipeline
    paragraphs:
    - 应保存完整 Pipeline，而不只是预测器，否则生产环境容易遗漏或错误复现预处理。
    - 封装为 REST/gRPC 推理服务；
    - 根据吞吐和延迟要求配置扩缩容与负载均衡。
  - title: 10.2 监控
    source_heading: 10.2 监控
    paragraphs:
    - 服务可用性、延迟、吞吐量和错误率；
    - 输入缺失值、取值范围和类别变化；
    - 获得真实标签后的业务指标和 RMSE；
    - 模型性能可能缓慢下降，也可能因上游数据格式变化突然失效。需要告警阈值、人工抽检和可快速启用的回退模型。
  - title: 练习 4：创建 KNN 地理收入特征
    source_heading: 练习 4：创建 KNN 地理收入特征
    paragraphs:
    - 将输出作为“附近地区平滑收入”新特征加入预处理 Pipeline；
    - 这道题把“附近地区通常相似”的领域知识编码为特征，也是在练习监督式 Transformer。
  - title: 14. 学习检查清单
    source_heading: 14. 学习检查清单
    paragraphs:
    - 能构造每户房间数、卧室占比等比例特征
    - 能用 Pipeline 防止交叉验证中的数据泄漏
    - 能从训练误差与验证误差诊断拟合状态
    - 能选择 Grid Search 或 Randomized Search
  takeaways:
  - 在测试集上做一次最终评估并给出置信区间；
  - EDA 是迭代过程。先获得初步洞察，建立模型并分析错误后，再返回探索和特征工程。
  - 最终 Pipeline 应直接接受原始格式测试数据；
  - 模型性能可能缓慢下降，也可能因上游数据格式变化突然失效。需要告警阈值、人工抽检和可快速启用的回退模型。
  - 能选择 Grid Search 或 Randomized Search
