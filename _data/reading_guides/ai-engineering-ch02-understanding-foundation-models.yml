  sections:
  - title: 0. 学习目标与因果主线
    source_heading: 0. 学习目标与因果主线
    paragraphs:
    - Transformer 为什么取代基于 RNN 的 seq2seq，它又为什么带来上下文计算与内存压力？
    - 参数量、训练 token 数与 FLOPs 分别衡量什么，为什么模型质量与部署成本不能只看一个数字？
    - SFT、RLHF 与 DPO 如何把“会续写”的模型变成“可交互”的模型，又会把谁的偏好压进模型？
    - 这条链的起点是“模型见过什么”，终点是“产品如何可靠地使用它”。中间任何一环都不能孤立判断：更长的上下文可能提高能力，却增加 KV cache；更大的模型可能更强，却让长期推理成本失控；更强的偏好对齐可能更讨人喜欢，却未必更真实；更保守的采样更稳定，却可能损失创造性。因此，本章不是训练配方，而是一套选模型、调模型和解释模型行为的因果框架。
  - title: 1. Training Data（训练数据）
    source_heading: 1. Training Data（训练数据）
    paragraphs:
    - Common Crawl 是非营利组织持续抓取互联网形成的网页语料。2022 至 2023 年间，它每月抓取约 20 亿到 30 亿个网页；C4（Colossal
      Clean Crawled Corpus）是经过清洗的一个子集。它规模大、容易取得，因此被许多披露数据来源的基础模型采用。
    - 在包含 14,000 道、覆盖 57 个学科的 MMLU 多选题基准上，GPT-4 的英语表现明显好于泰卢固语等欠代表语言。另一个只有六道 Project
      Euler 数学题的小型实验中，英语解题成功次数超过亚美尼亚语或波斯语的三倍，在缅甸语和阿姆哈拉语上六题全部失败。小样本实验不能给出精确总体结论，但与大规模语料欠代表方向一致。
    - 安全行为也未必跨语言迁移。2023 年的一项测试要求 ChatGPT-3.5 针对中国主题生成错误信息：七个英语提示中模型拒绝了六个，简体中文和繁体中文则七次全部生成。造成差异的具体原因并不确定，可能涉及预训练与对齐数据分布。工程结论很明确：英语安全评测不能代表其他语言，关键语言必须分别测试。
    - 这里的延迟推算假设每 token 耗时相同，真实系统还受批处理、缓存和硬件影响，但相对 token 数仍会进入成本账单。于是同一数据分布造成三重后果：低资源语言质量更差、单位语义
      token 更多、服务更慢更贵。这又可能形成反馈回路：产品体验差、成本高，导致数字内容与产品使用更少，下一轮高质量语料继续不足。
  - title: 2. Model Architecture（模型架构）
    source_heading: 2. Model Architecture（模型架构）
    paragraphs:
    - 2014 年兴起的 seq2seq（sequence-to-sequence）由编码器和解码器组成，曾显著改善机器翻译与摘要；2016 年 Google
      将其用于翻译系统。经典实现以 RNN 为编码器和解码器：编码器顺序读入 token，把最终隐状态交给解码器；解码器再根据这个状态和已生成 token 顺序输出。
    - Transformer 自 2017 年起持续占主导，比曾流行约四年的 seq2seq 和约五年的 GAN 更“耐用”。替代它困难，不只因为表达能力，还因为生态：Transformer
      已针对主流 GPU/TPU、并行训练、内核和服务框架优化多年。新架构必须在有意义的规模、数据和硬件上胜出，而不是只在小实验上显示更低的理论复杂度。
    - 一种理解是把神经网络架构视为可表示的程序空间，把梯度下降视为在其中搜索程序。新架构若能做的事都可被现有架构模拟，它仍可能因更容易训练、更省内存或更适合硬件而胜出；若想在能力上形成严格优势，则需要表达现有架构难以表达或难以搜索到的计算。工程上，相同能力下更高效往往比抽象的表达上限更重要。
    - 状态空间模型（SSM）：用状态递推建模长序列。S4 改善效率，H3 加入跨序列回忆与比较机制，Mamba 用选择性状态空间把推理复杂度降为随序列长度线性增长，并扩展到
      3B 规模；当时的结果中，Mamba-3B 超过同尺寸 Transformer、接近两倍规模 Transformer，并报告了百万长度序列上的持续改善。Jamba
      再把 Transformer 与 Mamba 层交错，采用总参数 52B、激活参数 12B 的 MoE，目标是装入单张 80 GB GPU，并评估到 256K
      上下文。
  - title: 3. Model Size（模型规模）
    source_heading: 3. Model Size（模型规模）
    paragraphs:
    - 代表性数据规模为：Llama 1 约 1.4T token，Llama 2 约 2T，Llama 3 约 15T，RedPajama-v2 约 30T。按每本书约
      6.7 万 token 粗略换算，30T 相当于约 4.5 亿本书或 5,400 个 Wikipedia，但网页堆积不能等同于高质量知识。
    - 这里必须保留 236/256 天的数值歧义：给出的 $4,142,811.43 对应 236 天；若公式真的代入 256 天，会得到 $4,493,897.14。因此成本结论“超过
      400 万美元”成立，但精确复算时应使用前一步得到的约 236 天，256 days 很可能是把 256 张 GPU 误写进天数位置。
    - 直觉上，每个参数、每个训练 token 的前向乘加约计 2 FLOPs，反向计算输入梯度和权重梯度约计 4 FLOPs，合计约 6。这个估算假设稠密模型、D
      表示实际处理的全部训练 token，并忽略注意力平方项、嵌入、优化器和通信等次要或实现相关开销；长上下文、MoE、重计算和不同 FLOPs 计数约定都会让系数变化。因此它适合量级估算，不是账单级精确值。
    - 达到同一性能的成本会随硬件和算法进步下降，例如 ImageNet 达到 93% 准确率的成本在 2019 至 2021 年间约减半。但继续提高性能仍越来越贵：从
      90% 提升到 95% 往往比从 85% 提升到 90% 困难；错误率从 3% 压到 2%，可能需要数量级更多的数据、计算或能源。
  - title: 4. Post-Training（后训练）
    source_heading: 4. Post-Training（后训练）
    paragraphs:
    - 预训练优化 token 级预测，用户评价的却是整段回答。后训练把优化目标从局部预测转向整体可用性。InstructGPT 的资源构成约为预训练 98%、后训练
      2%，说明少量行为数据就能显著改变能力的可访问方式；这更像重新组织与释放已有能力，而不是凭 2% 算力重学全部世界知识。
    - 传统图片框选可能几秒完成，复杂回答却需要检索、批判思考、专业知识与安全判断。InstructGPT 的演示标注者约 90% 至少有大学学历，超过三分之一有硕士学历；一对
      prompt-response 最长可花 30 分钟。按每对 $10 计算，13,000 对仅写作成本就是 $130,000，还不含任务设计、招募和质检。
    - RLHF 的基本流程是先训练奖励模型给回答打分，再用 PPO 等强化学习方法让 SFT 模型提高奖励。DPO 则利用获胜/落败回答及参考策略，直接增大获胜回答相对概率，省去显式奖励模型和
      PPO，工程上更简单；RLHF 保留独立奖励函数，调节空间更大。两者都依赖偏好数据，并不消除“偏好来自谁”的问题。
    - RLHF 把用户提示送给策略模型，奖励模型给回答打分，再用 PPO 等方法提高期望奖励，同时通常约束新策略不要偏离参考模型太远。DPO 将相同偏好对直接转成策略相对参考模型的分类式目标，减少训练组件和不稳定性。经验上二者都可优于只做
      SFT，但为何改善、在哪些维度退化仍与数据和评测相关。
  - title: 5. Sampling（采样）
    source_heading: 5. Sampling（采样）
    paragraphs:
    - 采样数量也不能无限增加。OpenAI 的一项实验中，效果提高到约 400 个输出后反而下降，解释是更大候选集更容易出现能欺骗验证器的对抗性答案；Stanford
      的“Monkey Business”实验却发现，从 1 增加到 10,000 个样本时，解决问题数常呈对数线性增长。二者并不必然矛盾：任务、生成器、验证器和成本约束不同。生产环境通常不会为每个请求生成数百到上万份回答。
    - 后处理便宜且常有高收益，因为同一模型会重复少数格式错误。LinkedIn 的防御式 YAML 解析器曾把正确 YAML 比例从 90% 提高到 99.99%，错误率从
      10% 降到 0.01%，即约降低 1000 倍。选择 YAML 还因为它通常比 JSON 简短，输出 token 更少。边界也很清楚：缺一个可确定的括号可以修，字段含义错误或内容凭空缺失则不能安全猜测。
    - 条件序列中，用户提供的 token 与模型刚生成的 token 都成为后续上下文。若第一句误写“Chip Huyen 是一名建筑师”，后续 token
      会把这句话作为既有上下文继续展开。错误初始假设于是滚雪球，甚至会让模型答错原本会做的问题。相关实验显示，一个错误前提可诱使模型声称 9677 能被 13
      整除。
    - 关于 RLHF 是否减少幻觉，必须保留相反证据：John Schulman 的演讲提到 OpenAI 观察到 RLHF 有助于减少幻觉；InstructGPT
      论文的结果却显示 RLHF 让幻觉更严重。即使后者幻觉更差，人类总体仍更偏好 RLHF 模型，说明“受偏好”与“事实正确”是不同目标，当前没有可无条件外推的结论。
  - title: 6. Summary（本章小结）
    source_heading: 6. Summary（本章小结）
    paragraphs:
    - 模型规模必须同时用参数量 N、训练 token 数 D 与 FLOPs C 描述。Chinchilla 给出固定训练算力下的经验配比，产品还要优化持续推理成本。
    - 后训练用 SFT 建立任务接口，再用 RLHF、DPO 等压缩偏好。它显著提高可用性，也把标注群体、奖励目标和偏好噪声编码进模型。
    - 采样把概率分布变成具体回答。温度与截断控制创意和稳定性，测试时计算用更多推理换质量，结构化输出需要区分软请求与硬保证，概率性则带来不一致并参与幻觉形成。
    - 整条因果链最后指向评估：模型、提示、采样参数、硬件和数据都会变化；没有评估流水线，就无法知道质量提升发生在哪、回归又从哪一环进入。AI 工程很难做到完全确定，但可以通过可重复测试、分层指标和失败分析变得系统化。
