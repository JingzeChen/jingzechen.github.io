overview:
  kind: summary
  minutes: 13
  question: 原文围绕「0. 学习目标与因果主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与因果主线
  thesis: 状态空间模型（SSM）：用状态递推建模长序列。S4 改善效率，H3 加入跨序列回忆与比较机制，Mamba 用选择性状态空间把推理复杂度降为随序列长度线性增长，并扩展到
    3B 规模；当时的结果中，Mamba-3B 超过同尺寸 Transformer、接近两倍规模 Transformer，并报告了百万长度序列上的持续改善。Jamba
    再把 Transformer 与 Mamba 层交错，采用总参数 52B、激活参数 12B 的 MoE，目标是装入单张 80 GB GPU，并评估到 256K
    上下文。
  thesis_source: 2. Model Architecture（模型架构）
  concepts:
  - term: 0. 学习目标与因果主线
    meaning: Transformer 为什么取代基于 RNN 的 seq2seq，它又为什么带来上下文计算与内存压力？
    source_heading: 0. 学习目标与因果主线
  - term: 1. Training Data（训练数据）
    meaning: 在包含 14,000 道、覆盖 57 个学科的 MMLU 多选题基准上，GPT-4 的英语表现明显好于泰卢固语等欠代表语言。另一个只有六道
      Project Euler 数学题的小型实验中，英语解题成功次数超过亚美尼亚语或波斯语的三倍，在缅甸语和阿姆哈拉语上六题全部失败。小样本实验不能给出精确总体结论，但与大规模语料欠代表方向一致。
    source_heading: 1. Training Data（训练数据）
  - term: 2. Model Architecture（模型架构）
    meaning: 状态空间模型（SSM）：用状态递推建模长序列。S4 改善效率，H3 加入跨序列回忆与比较机制，Mamba 用选择性状态空间把推理复杂度降为随序列长度线性增长，并扩展到
      3B 规模；当时的结果中，Mamba-3B 超过同尺寸 Transformer、接近两倍规模 Transformer，并报告了百万长度序列上的持续改善。Jamba
      再把 Transformer 与 Mamba 层交错，采用总参数 52B、激活参数 12B 的 MoE，目标是装入单张 80 GB GPU，并评估到 256K
      上下文。
    source_heading: 2. Model Architecture（模型架构）
  - term: 4. Post-Training（后训练）
    meaning: 传统图片框选可能几秒完成，复杂回答却需要检索、批判思考、专业知识与安全判断。InstructGPT 的演示标注者约 90% 至少有大学学历，超过三分之一有硕士学历；一对
      prompt-response 最长可花 30 分钟。按每对 $10 计算，13,000 对仅写作成本就是 $130,000，还不含任务设计、招募和质检。
    source_heading: 4. Post-Training（后训练）
  - term: 5. Sampling（采样）
    meaning: 采样数量也不能无限增加。OpenAI 的一项实验中，效果提高到约 400 个输出后反而下降，解释是更大候选集更容易出现能欺骗验证器的对抗性答案；Stanford
      的“Monkey Business”实验却发现，从 1 增加到 10,000 个样本时，解决问题数常呈对数线性增长。二者并不必然矛盾：任务、生成器、验证器和成本约束不同。生产环境通常不会为每个请求生成数百到上万份回答。
    source_heading: 5. Sampling（采样）
  - term: 6. Summary（本章小结）
    meaning: 整条因果链最后指向评估：模型、提示、采样参数、硬件和数据都会变化；没有评估流水线，就无法知道质量提升发生在哪、回归又从哪一环进入。AI 工程很难做到完全确定，但可以通过可重复测试、分层指标和失败分析变得系统化。
    source_heading: 6. Summary（本章小结）
