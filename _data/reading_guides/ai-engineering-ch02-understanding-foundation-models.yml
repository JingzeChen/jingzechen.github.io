  question: 原文如何解释「3. Model Size（模型规模）」？
  answer: 直觉上，每个参数、每个训练 token 的前向乘加约计 2 FLOPs，反向计算输入梯度和权重梯度约计 4 FLOPs，合计约 6。这个估算假设稠密模型、D
    表示实际处理的全部训练 token，并忽略注意力平方项、嵌入、优化器和通信等次要或实现相关开销；长上下文、MoE、重计算和不同 FLOPs 计数约定都会让系数变化。因此它适合量级估算，不是账单级精确值。
  source_heading: 3. Model Size（模型规模）
- level: 边界判断
  question: 原文如何解释「5. Sampling（采样）」？
  answer: 采样数量也不能无限增加。OpenAI 的一项实验中，效果提高到约 400 个输出后反而下降，解释是更大候选集更容易出现能欺骗验证器的对抗性答案；Stanford
    的“Monkey Business”实验却发现，从 1 增加到 10,000 个样本时，解决问题数常呈对数线性增长。二者并不必然矛盾：任务、生成器、验证器和成本约束不同。生产环境通常不会为每个请求生成数百到上万份回答。
  source_heading: 5. Sampling（采样）
- level: 概念复述
  question: 原文如何解释「6. Summary（本章小结）」？
  answer: 整条因果链最后指向评估：模型、提示、采样参数、硬件和数据都会变化；没有评估流水线，就无法知道质量提升发生在哪、回归又从哪一环进入。AI 工程很难做到完全确定，但可以通过可重复测试、分层指标和失败分析变得系统化。
  source_heading: 6. Summary（本章小结）
