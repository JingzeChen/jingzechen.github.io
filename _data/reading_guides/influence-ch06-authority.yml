overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 导读：第六章要解决的核心问题」建立了怎样的核心认识？
  question_source: 0. 导读：第六章要解决的核心问题
  thesis: 高风险场景的防御不应只靠个人临场勇气。 结合本章实验作制度迁移，可用暂停权、独立复核、技术拦截和反报复机制把判断嵌入流程；这是笔记扩展，不是原书直接列出的第三项防御原则。
  thesis_source: 51. 核心结论
  concepts:
  - term: 0. 导读：第六章要解决的核心问题
    meaning: "“教化下的敬重”指出，服从权威并非临时形成的偏好。家庭、学校、宗教、法律、军队和组织从小训练人们尊重规则与等级。这样的训练使复杂社会成为可能，也让人容易在权威出现时停止独立判断。"
    source_heading: 0. 导读：第六章要解决的核心问题
  - term: 11.4 当前不能下的结论
    meaning: 下一部分进入原书“盲目服从的诱惑和危险”：权威为什么通常值得听从，以及一条有用捷径怎样蜕变成机械反应。
    source_heading: 11.4 当前不能下的结论
  - term: 22. 电话“医生”实验：只剩一个头衔时，护士还会服从吗
    meaning: 实验把真正权威的证据降到很低，只留下电话中的自称头衔；同时把内容错误做得很明显。如果护士仍服从，就很难说她们只是经过专业权衡后赞同治疗方案。
    source_heading: 22. 电话“医生”实验：只剩一个头衔时，护士还会服从吗
  - term: 28. 身份标志：豪华汽车为何能换来额外耐心
    meaning: 现场反应还会受距离、车辆可见性、交通密度等影响。本章材料支持地位标志改变群体平均行为，不足以诊断某个未按喇叭者“崇拜财富”。
    source_heading: 28. 身份标志：豪华汽车为何能换来额外耐心
  - term: 40. 权威原理与其他影响力武器的关系
    meaning: 演员与医生角色的长期关联，让医生权威迁移到演员；豪车与成功地位的关联，让车主获得额外尊重。关联解释符号如何获得情感和意义，权威解释符号为何提高服从。
    source_heading: 40. 权威原理与其他影响力武器的关系
  - term: 53. 快速复习清单
    meaning: 先验身份，再看相关；再查利益，最后核证；高风险命令必须能暂停、能复核、能追责。
    source_heading: 53. 快速复习清单
