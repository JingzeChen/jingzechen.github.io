checks:
- level: 概念辨析
  question: 原文如何解释「17.1 Notebook 能运行一次就可复现」？
  answer: 可能依赖隐藏内核状态；必须 restart and run all，并固定外部环境。
  source_heading: 17.1 Notebook 能运行一次就可复现
- level: 概念辨析
  question: 原文如何解释「17.3 .ipynb 最适合代码审阅」？
  answer: 它含大量输出和 metadata；稳定逻辑应进入模块，教材按当前工具维护源格式。
  source_heading: 17.3 .ipynb 最适合代码审阅
- level: 概念辨析
  question: 原文如何解释「17.12 CUDA 版本越新越能支持旧 GPU」？
  answer: 新 toolkit 可能移除旧架构支持，必须查 compute capability 矩阵。
  source_heading: 17.12 CUDA 版本越新越能支持旧 GPU
- level: 概念辨析
  question: 原文如何解释「17.13 Terminate 一定删除所有数据」？
  answer: 数据卷、snapshot、AMI 和 object storage 生命周期独立。
  source_heading: 17.13 Terminate 一定删除所有数据
- level: 概念辨析
  question: 原文如何解释「17.26 评价模型不需要 eval() 和 no_grad()」？
  answer: Dropout、BatchNorm 和 autograd 会产生错误语义或额外开销。
  source_heading: 17.26 评价模型不需要 eval() 和 no_grad()
