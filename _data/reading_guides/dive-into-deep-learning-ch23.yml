  sections:
  - title: 1. 本章主线：让模型从“能写”走向“能运行、能复现、能协作”
    source_heading: 1. 本章主线：让模型从“能写”走向“能运行、能复现、能协作”
    paragraphs:
    - 用 Notebook 把解释、公式、代码和输出放在同一份可执行文档中；
    - 选择硬件时，不只看峰值算力，还要考虑显存、带宽、互联、供电、散热和总成本；
    - 修改教材时，用 Git 和 pull request 让变更可审阅、可测试、可追踪；
    - 本章内容具有很强的版本时效性。长期有效的是方法：资源生命周期、安全边界、可复现流程和抽象职责。控制台截图、实例型号、CUDA 下载地址、菜单名称和具体
      API 只能视为原书生成时的快照，执行前必须以当前环境和官方文档核验。
  - title: 4.2 账户与安全准备
    source_heading: 4.2 账户与安全准备
    paragraphs:
    - 日常操作使用最小权限 IAM 身份；
    - 选择满足合规要求的 region；
    - 不把长期访问密钥写进 Notebook。
  - title: 5. 使用 AWS EC2
    source_heading: 5. 使用 AWS EC2
    paragraphs:
    - 它更灵活，但运维和安全责任更大。价格是否更低取决于闲置率、存储、网络、人工维护和所需服务，不是普遍结论。
    - 云平台常将 GPU 按实例族或购买模式设置 vCPU/实例配额。配额为 0 时，即使控制台列出型号也无法启动。应提前申请，并为实验准备无 GPU 或小实例的调试路径。
    - 许多 PyTorch wheel/conda 包自带所需 CUDA runtime，只有编译自定义 CUDA 扩展时才一定需要完整 toolkit。
    - "“Terminate 删除所有数据”不总成立。终止前应列出 volumes、snapshots、object storage 和日志。"
  - title: 8. 选择服务器
    source_heading: 8. 选择服务器
    paragraphs:
    - 最大 activation memory？
    - 解压、增强和数据预处理可能 CPU-bound。
    - 多进程 DataLoader 可能复制 Python 对象，不能只按单份数据集估算。
    - 消费卡开放式散热器在密集多卡机箱中可能互相加热；服务器通常需要高静压风道或液冷设计。
  - title: 9.2 显存容量是硬约束
    source_heading: 9.2 显存容量是硬约束
    paragraphs:
    - 混合精度若保留 master weights 还会增加。Activation 往往随 batch、序列长度、分辨率和层数增长，可能主导显存。
    - activation checkpointing；
    - optimizer state sharding；
    - tensor/pipeline parallelism；
  - title: 9.5 多 GPU 互联
    source_heading: 9.5 多 GPU 互联
    paragraphs:
    - NVLink/NVSwitch；
    - InfiniBand/RDMA；
  - title: 11. Utility Functions and Classes
    source_heading: 11. Utility Functions and Classes
    paragraphs:
    - 工具节包含 FrozenLake 环境包装、状态描述、转移模型和 value/Q function 可视化，供第 17 章使用。
    - 生产训练更适合将结构化指标写入 JSON/CSV、TensorBoard、W&B 或监控系统，再独立绘图。
    - 二分类单 logit 需要阈值处理，不能把浮点输出与标签直接精确比较。前章 FM/DeepFM 复用了不合适的 accuracy，这说明通用 helper
      必须明确输入契约。
    - 保存 attention weights 还要避免持有整个 autograd graph。
  - title: 15. d2l 函数 API 分类
    source_heading: 15. d2l 函数 API 分类
    paragraphs:
    - 检查函数应在错误时提供 expected/actual 和上下文，而不是只抛无信息断言。
    - 初始化函数通常按 module 类型分派。它们会原地改变参数，且必须在 lazy layer 已 materialize 后调用。
    - 这些函数依赖 Matplotlib/IPython/Jupyter。服务端和 CI 应选择 non-interactive backend，业务逻辑不能依赖图是否成功显示。
  - title: 18.4 工具函数缺陷
    source_heading: 18.4 工具函数缺陷
    paragraphs:
    - 下载器缺 timeout、状态检查和完成后 hash；
    - 某些绘图 helper 固定 4×4 或在小迭代数下步长为 0；
    - gradient clipping 未过滤空梯度；
    - seq2seq tokenization 有 off-by-one；
  - title: 21. 解决深度学习工具问题的一般思路
    source_heading: 21. 解决深度学习工具问题的一般思路
    paragraphs:
    - 选择环境类型：短实验用临时 runtime，定制长任务用 VM，团队托管流程用 managed service。
    - 让 Notebook 从头可执行：restart/run-all，移除隐藏状态和手工中间步骤。
    - 保存完整 checkpoint：模型、优化器、调度器、scaler、epoch 和 RNG 状态。
    - 具体命令和 API 会过时，长期可靠的方法是明确版本与契约、从干净状态验证、测量真实行为，并为权限、费用、数据和故障设置边界。
  takeaways:
  - Notebook 是共享内核的可执行文档，显示顺序不等于执行顺序。
  - EC2 提供更高控制权，也将驱动、安全、补丁、存储和服务生命周期交给用户。
  - 服务器选择必须综合 CPU、RAM、PCIe、存储、供电、散热和拓扑。
  - 开源贡献应使用功能分支、清晰 commit、局部 diff、自动测试和可审阅 PR。
  - 可复现性需要源码、数据、软件、硬件和执行状态共同记录，不能靠 Notebook 或超参数字典单独保证。
