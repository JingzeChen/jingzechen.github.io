  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 9 章首页 Liskov Substitution Principle（LSP，里氏替换原则）源自 Barbara Liskov
      在 1988 年对 subtype 的定义。
    - 如果某段程序只依赖类型 T 的公开约定，那么把 T 的对象换成它的子类型 S 后，程序原有的正确行为不应被破坏。
    - 客户端如果必须识别具体实现并写特殊分支，就说明替换性已经失败。
    - 本章先用 License 展示正确继承，再用 Square/Rectangle 展示经典反例，最后把原则提升到架构层，用出租车派遣 REST 接口说明：一个小小的协议不一致，可能迫使整个系统增加复杂适配机制。
  - title: 1. Liskov 1988 年的替换定义
    source_heading: 1. Liskov 1988 年的替换定义
    paragraphs:
    - Barbara Liskov 在 1988 年的论文 Data Abstraction and Hierarchy 中，以 substitution property（替换性质）定义
      subtype。
    - 不同许可证可以计算出不同费用，只要 Billing 程序仍能按 License 契约使用它们。
    - LSP 关注语义。编译器通常只能检查一部分语法，无法自动保证全部业务契约。
    - 状态约束是否被破坏？ 基类允许的操作序列，在子类型上不应产生违背客户端预期的状态。
  - title: 2. Guiding the Use of Inheritance
    source_heading: 2. Guiding the Use of Inheritance
    paragraphs:
    - 新子类加入后，客户端是否需要新增分支？
    - Java/C# Interface；
    - Ruby 的 Duck Typing；
  - title: 4. LSP and Architecture
    source_heading: 4. LSP and Architecture
    paragraphs:
    - Java 风格 Interface，由多个类实现；
    - 多个服务响应相同 REST Interface。
    - DIP 提供依赖方向，LSP 保证实现真的遵守端口行为。缺少 LSP，接口虽然存在，高层仍会被各种实现特例污染。
    - Consumer-Driven Contract；
  - title: 5. Example LSP Violation
    source_heading: 5. Example LSP Violation
    paragraphs:
    - 司机记录中保存各公司的 Dispatch URI。系统选择司机后，取出 URI 并按统一协议发送 PUT 请求。
    - 它看起来只是一个字段名差异，却破坏了替换性：统一请求对其他公司有效，对 Acme 无效。
    - 原书假设 Acme 收购 Purple Taxi，却保留两个品牌和网站，同时统一后台系统。此时 Purple URI 也可能需要 Acme 格式，代码还要增加另一条特殊判断。
    - 高层系统应看到统一的内部 Dispatch Contract，外部差异止步 Adapter。
  - title: 6.3 LSP 与其他原则的关系
    source_heading: 6.3 LSP 与其他原则的关系
    paragraphs:
    - OCP 依赖 LSP：新实现必须可替换，扩展才能不修改客户端；
    - DIP 依赖 LSP：低层实现必须遵守高层端口；
    - ISP 帮助建立较小契约，减少实现无法完整遵守的风险；
    - 契约测试帮助在实现和服务层持续验证替换性。
  - title: 6.5 修复 LSP 违规的顺序
    source_heading: 6.5 修复 LSP 违规的顺序
    paragraphs:
    - 某实现是否只是 Bug，应直接修复？
    - 外部差异是否应由 Adapter 归一化？
  - title: 检查代码症状
    source_heading: 检查代码症状
    paragraphs:
    - 是否按 URI、域名或类名选择特殊逻辑？
    - 是否每新增实现都修改核心客户端？
    - 是否有某实现无法通过共享测试套件？
  - title: 检查架构边界
    source_heading: 检查架构边界
    paragraphs:
    - REST 服务是否共享同一字段语义和错误模型？
    - 外部不一致是否止步 Adapter？
    - 接口是否过大，迫使实现假装支持能力？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - LSP 不局限于类继承，也适用于 Interface、Duck Typing、回调和服务协议。
    - Square/Rectangle 问题源于 Rectangle 允许宽高独立修改，而 Square 必须保持宽高相等。
    - Java Interface、Ruby 方法约定和 REST Service 都可能形成需要 LSP 的替换边界。
    - 配置和 Adapter 能隔离第三方差异，却是 LSP 违规带来的额外成本，不是原则本身的胜利。
  takeaways:
  - LSP 源自 Barbara Liskov 1988 年对 subtype 的替换性质定义。
  - 使用继承前，应从客户端契约判断替换性，而不是只看代码复用。
  - LSP 后来从继承指导原则扩展为适用于接口与实现的架构原则。
  - 配置和 Adapter 能隔离第三方差异，却是 LSP 违规带来的额外成本，不是原则本身的胜利。
  - 本章最终判断很简单：若客户端必须知道它正在使用哪个实现，这些实现就可能没有真正满足 LSP。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「3. 数学上是子集，程序中就一定是子类型」？
  answer: Square/Rectangle 说明，程序类型还包含可变操作和行为历史，数学分类不能直接决定继承。
  source_heading: 3. 数学上是子集，程序中就一定是子类型
- level: 概念辨析
  question: 原文如何解释「6. 所有实现必须返回相同结果」？
  answer: 不同许可证可计算不同费用。LSP 要求遵守共同承诺，不要求内部和结果完全一致。
  source_heading: 6. 所有实现必须返回相同结果
- level: 概念辨析
  question: 原文如何解释「9. 配置驱动方案代表良好 LSP」？
  answer: 配置只是隔离第三方差异的现实手段。若所有实现遵守统一契约，就不需要这些补偿机制。
  source_heading: 9. 配置驱动方案代表良好 LSP
- level: 概念辨析
  question: 原文如何解释「10. Adapter 隐藏差异后，外部服务就符合 LSP」？
  answer: 内部端口的 Adapter 可以彼此符合 LSP；外部服务本身仍然不一致。需要清楚边界在哪一层成立。
  source_heading: 10. Adapter 隐藏差异后，外部服务就符合 LSP
- level: 概念辨析
  question: 原文如何解释「12. 遵守 LSP 可以自动消除所有特殊业务」？
  answer: 真正不同的业务规则不应被伪装成同一抽象。LSP 鼓励诚实建模，而不是抹平合法差异。
  source_heading: 12. 遵守 LSP 可以自动消除所有特殊业务
