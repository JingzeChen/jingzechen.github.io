overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章定位：从静态外形进入内部运行机制」建立了怎样的核心认识？
  question_source: 本章定位：从静态外形进入内部运行机制
  thesis: 例如，一份给财务负责人的报告从“我们重构了缓存模块”开始，即使后续技术论证严谨，对方仍可能不知道这与预算或业务风险有什么关系。若改为“当前缓存故障可能造成月底结算中断，需要批准紧急扩容预算”，相关性就建立起来了。
  thesis_source: 序言的结构
  concepts:
  - term: 本章定位：从静态外形进入内部运行机制
    meaning: 序言找到初始疑问，顶层思想回答它；顶层回答又引发新疑问，纵向关系决定下一层要回答什么；横向关系则检查同层的多个回答是否构成一个完整、合逻辑的论述。
    source_heading: 本章定位：从静态外形进入内部运行机制
  - term: 横向关系
    meaning: 现实推理还包括溯因推理、类比、统计推断和因果推断等。金字塔原理在写作层面通常把它们整理为演绎链或归纳组。因此，“只有两种”适合作为同层表达的实用分类，不宜当作对所有逻辑学方法的穷尽性定义。
    source_heading: 横向关系
  - term: 三种子结构如何共同工作
    meaning: 相关性：这一层最终是否服务于序言引出的初始疑问？
    source_heading: 三种子结构如何共同工作
  - term: 本章方法的适用边界与补充工具
    meaning: 复杂系统中，A 影响 B，B 又反过来影响 A。单纯上下树形结构可能隐藏循环。可先用因果回路图分析，再把面向决策的主要结论组织成金字塔。
    source_heading: 本章方法的适用边界与补充工具
  - term: 检查纵向关系
    meaning: 顶层思想会让读者问“为什么”“如何”还是“是什么”？
    source_heading: 检查纵向关系
  - term: 本章小结
    meaning: 本章最核心的方法可以压缩成一句话：先用序言确认读者真正的问题，再让每个上层思想引发一个明确疑问，用下一层的演绎或归纳思想组回答，直至达到受众作出判断所需的具体程度。
    source_heading: 本章小结
  logic:
  - 本章定位：从静态外形进入内部运行机制
  - 横向关系
