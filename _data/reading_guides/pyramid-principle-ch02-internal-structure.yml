check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「纵向关系与因果关系」？
  answer: 纵向关系是上层疑问与下层回答之间的解释/支持关系，不一定都是因果。上层问“系统由什么构成”，下层列组成部分，也构成纵向关系，却不是因果链。
  source_heading: 纵向关系与因果关系
- level: 概念辨析
  question: 原文如何解释「归纳概括与演绎结论」？
  answer: 归纳概括超出单个观察，通常具有不确定性；演绎结论已包含在前提逻辑中。二者不能用相同确定程度表述。
  source_heading: 归纳概括与演绎结论
- level: 概念辨析
  question: 原文如何解释「清晰与说服」？
  answer: 清晰意味着受众看得懂推理；说服还要求可靠证据、有效推理、价值契合和可接受风险。清晰是说服的重要条件，不是充分条件。
  source_heading: 清晰与说服
- level: 概念辨析
  question: 原文如何解释「误解五：演绎比归纳更高级」？
  answer: 二者解决不同任务。一般规则应用适合演绎；从事实发现模式适合归纳。错误选择才是问题。
  source_heading: 误解五：演绎比归纳更高级
- level: 概念辨析
  question: 原文如何解释「误解九：冲突必须是危机」？
  answer: 冲突也可以是机会、选择、意外结果或新目标。它只需打破原有稳定状态并引出疑问。
  source_heading: 误解九：冲突必须是危机
