  - 坦克案例严格说还带有溯因推理色彩：从观察到的结果寻找最佳解释。很多商务判断也是如此，例如“销量下降、投诉增加、复购降低，最可能的共同原因是产品质量恶化”。
  - 作者不能只凭想象判断读者疑问。重要沟通可通过访谈、会议记录、决策职责和既往反馈验证受众真正关心什么。
  - 是否在读者需要之前过早给出孤立答案？
