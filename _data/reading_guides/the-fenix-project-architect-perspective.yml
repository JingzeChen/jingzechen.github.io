  minutes: 12
  question: 1. 本章总览：架构师究竟在权衡什么？
  question_source: 1. 本章总览：架构师究竟在权衡什么
  thesis: 架构师的核心能力不是记住产品，而是识别状态、边界、失败模型和保证强度，并作可验证权衡。
  thesis_source: 9. 本章知识结构总结
  concepts:
  - term: 1. 本章总览：架构师究竟在权衡什么
    meaning: 约束条件是方案 x 必须满足业务所需的正确性、性能、可用性和安全底线。架构师不是追求某一维度的绝对最大值，而是在约束下最小化建设、运行和失败的总成本。
    source_heading: 1. 本章总览：架构师究竟在权衡什么
  - term: 3. 事务处理
    meaning: 消费者必须幂等，可用唯一事务 ID、去重表或条件更新。原书把这种持续重试称为 Best-Effort Delivery；按现代消息投递语义，Transactional
      Outbox 加消息中继通常提供的是 At-Least-Once Delivery：发布成功后、记录完成前发生崩溃会造成重复投递，而不是“至多一次”或“恰好一次”。因此还要定义单键顺序边界、退避、死信、告警和人工恢复，不能无限静默重试。
    source_heading: 3. 事务处理
  - term: 5. 架构安全性
    meaning: OAuth 2 解决第三方应用在不获得用户密码的情况下访问有限资源的问题。Token 可以限制 Scope、受众和有效期。授权服务器可以撤销
      Grant 或 Refresh Token；已经签发且由资源服务器离线验证的自包含 Access JWT，通常仍会有效到过期，除非额外使用撤销表、在线
      Introspection、短寿命或密钥轮换机制。这与后文“JWT 难以主动失效”并不矛盾。
    source_heading: 5. 架构安全性
  - term: 6. 四条主线之间的关系
    meaning: REST 的无状态、可缓存和分层约束，在透明多级分流中得到具体实现：浏览器缓存、CDN、反向代理都可以理解 HTTP 元数据并复用表征。RPC
      若使用专有二进制协议，也能缓存，但通常需要自己定义缓存键、失效和中间节点语义。
    source_heading: 6. 四条主线之间的关系
  - term: 8.4 优先缩小问题边界
    meaning: 把热点查询模型预先构建，减少跨服务联查；
    source_heading: 8.4 优先缩小问题边界
  - term: 10. 主动回忆题
    meaning: Transactional Outbox 怎样消除数据库与消息的双写裂缝？
    source_heading: 10. 主动回忆题
