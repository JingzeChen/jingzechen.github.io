overview:
  kind: summary
  minutes: 9
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 表 12-3 的关键趋势：MobileNet v3 small 约 2.5M 参数/0.1 GFLOPs，适合边缘端；EfficientNet
    v2 small 约 21.5M 参数但 ImageNet top-1 84.2%；ConvNeXt Large 约 197.8M 参数、34.4 GFLOPs。应在目标设备
    benchmark，不只按排行榜。
  thesis_source: 6. Choosing the Right CNN Architecture
  concepts:
  - term: 本章要解决什么问题
    meaning: 层次组合：边缘组成部件，部件组成物体。
    source_heading: 本章要解决什么问题
  - term: 2. Convolutional Layers
    meaning: Filter/kernel 是局部权重模板。固定竖线 filter 会在与竖直结构对齐的位置产生大响应，形成 feature map。深度学习不手工指定
      filter，而由反向传播学习对任务最有用的边缘、纹理、部件或更抽象模式。
    source_heading: 2. Convolutional Layers
  - term: 6. Choosing the Right CNN Architecture
    meaning: 表 12-3 的关键趋势：MobileNet v3 small 约 2.5M 参数/0.1 GFLOPs，适合边缘端；EfficientNet
      v2 small 约 21.5M 参数但 ImageNet top-1 84.2%；ConvNeXt Large 约 197.8M 参数、34.4 GFLOPs。应在目标设备
      benchmark，不只按排行榜。
    source_heading: 6. Choosing the Right CNN Architecture
  - term: 9. Pretrained Models for Transfer Learning
    meaning: 验证/测试使用 weights 的确定性 transforms。还可逐层解冻、换相似领域预训练模型、分析失败样本、模型集成。卫星/医学/农业图像应优先找
      TorchGeo/MONAI/AgML 等领域预训练模型，避免负迁移。
    source_heading: 9. Pretrained Models for Transfer Learning
  - term: 12. Object Tracking
    meaning: 只用位置会在碰撞/交叉后交换 ID；appearance 提供身份线索。BoT-SORT 进一步做 camera-motion compensation
      和状态估计改进。
    source_heading: 12. Object Tracking
  - term: 工程能力
    meaning: 能使用 weights.transforms 和 metadata
    source_heading: 工程能力
  logic:
  - 本章要解决什么问题
  - 2. Convolutional Layers
  - 3. Pooling Layers
  - 9. Pretrained Models for Transfer Learning
  - 11. Object Detection
  - 15. 章末练习与参考答案
  - 工程能力
  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 局部性：相邻像素更可能共同形成局部模式；
    - 平移共享：同一种边缘或纹理可能出现在任意位置；
    - 层次组合：边缘组成部件，部件组成物体。
  - title: 0. 必要数学与图像基础
    source_heading: 0. 必要数学与图像基础
    paragraphs:
    - C：通道数，灰度通常 1，RGB 为 3；
    - 令第 l 层相邻输出在原图上的间隔 jump 为 j_l，感受野大小为 r_l。
  - title: 2. Convolutional Layers
    source_heading: 2. Convolutional Layers
    paragraphs:
    - Padding 的边界是假设。零 padding 等价于图像外全黑，可能制造边缘伪影；替代有 reflection/replication/circular
      padding，取决于领域。
    - Filter/kernel 是局部权重模板。固定竖线 filter 会在与竖直结构对齐的位置产生大响应，形成 feature map。深度学习不手工指定
      filter，而由反向传播学习对任务最有用的边缘、纹理、部件或更抽象模式。
    - 每个输出 channel 对应一个三维 filter，深度覆盖全部输入 channels。一个 filter 在所有空间位置共享同一组权重和一个 bias；不同输出
      channels 使用不同 filters。
    - 输入平移，feature map 相应平移，这是等变性，不是输出不变。Padding、stride、pooling 和离散采样会破坏精确等变性。
  - title: 3. Pooling Layers
    source_heading: 3. Pooling Layers
    paragraphs:
    - 若对象轻微平移但仍落在同一 pooling window，max 可能不变，形成局部不变性。但跨越窗口边界时输出会跳变，因此不是完全平移不变。
    - 分类希望“猫移一像素仍是猫”，不变性有益；分割希望输入右移一像素，mask 也右移一像素，即等变性。过强 pooling 会损害精确定位。
    - 现代网络也常用 stride convolution 替代 pooling，让下采样可学习。
  - title: 6. Choosing the Right CNN Architecture
    source_heading: 6. Choosing the Right CNN Architecture
    paragraphs:
    - 模型选择是多目标优化：accuracy、参数量、FLOPs、实际延迟、吞吐、内存、能耗、输入分辨率和目标硬件。FLOPs 不等于延迟，memory access、kernel
      支持和 batch size 都会改变真实速度。
    - 表 12-3 的关键趋势：MobileNet v3 small 约 2.5M 参数/0.1 GFLOPs，适合边缘端；EfficientNet v2 small
      约 21.5M 参数但 ImageNet top-1 84.2%；ConvNeXt Large 约 197.8M 参数、34.4 GFLOPs。应在目标设备
      benchmark，不只按排行榜。
    - FP32 每元素 4 bytes。推理可在下一层完成后释放前层激活，峰值约由相邻大层、参数和算子 workspace 决定；训练需保存反向所需激活，另有参数梯度和
      optimizer states。Adam 常为每参数保存一阶、二阶矩，参数相关内存远大于只存权重。
    - OOM 处理：减 batch、gradient accumulation、降分辨率/stride、删层/减 channels、FP16/BF16、模型/数据并行、CPU
      offload、activation checkpointing。
  - title: 9. Pretrained Models for Transfer Learning
    source_heading: 9. Pretrained Models for Transfer Learning
    paragraphs:
    - Flowers102 有 102 类，训练和验证各仅每类 10 张，直接训练大型 CNN 容易过拟合。ImageNet 预训练 backbone 已学到边缘、纹理和物体部件，只需适配分类头并小幅微调。
    - 只训练 head 官方参考已约 90% accuracy；进一步增强和微调可超过 90%。必须在 source preprocessing 下输入，否则预训练特征分布错位。
    - 验证/测试使用 weights 的确定性 transforms。还可逐层解冻、换相似领域预训练模型、分析失败样本、模型集成。卫星/医学/农业图像应优先找
      TorchGeo/MONAI/AgML 等领域预训练模型，避免负迁移。
  - title: 11. Object Detection
    source_heading: 11. Object Detection
    paragraphs:
    - 传统方法在多个位置和尺度重复运行定位 CNN，计算高度重复，而且同一对象产生多个相似 boxes。现代 detector 共享整图 backbone features，一次或两阶段产生候选。
    - NMS 是贪心后处理，不可导；相邻真实对象高度重叠时可能误删。替代有 Soft-NMS（衰减 score）、class-aware NMS 和端到端集合预测
      detector。
    - YOLO 是 single-stage detector：整图一次前向，网格单元负责中心落入该 cell 的对象。每 cell 预测多个 boxes、objectness
      与类别信息，后处理 NMS。
    - 现代 YOLO 引入 anchor priors 或 anchor-free 设计、多尺度 feature pyramids、skip connections
      和更强 losses/backbones。Tiny 版本牺牲精度换低延迟。
  - title: 12. Object Tracking
    source_heading: 12. Object Tracking
    paragraphs:
    - Tracking 要在视频帧间维持 identity。困难包括运动、尺度/光照变化、遮挡、相似对象交叉和摄像机运动。
    - Hungarian algorithm 求检测与轨迹的最小总代价一对一匹配。
    - 只用位置会在碰撞/交叉后交换 ID；appearance 提供身份线索。BoT-SORT 进一步做 camera-motion compensation
      和状态估计改进。
    - Tracking 指标还应评价 ID switches、轨迹完整性和定位，不只是逐帧 detection mAP。
  - title: 15. 章末练习与参考答案
    source_heading: 15. 章末练习与参考答案
    paragraphs:
    - 官方答案将 Conv3 四舍五入为 1.5 MB，得 564.6 MB。实际还要梯度、optimizer states、临时 workspace 和 allocator
      开销，显著更高。
    - MaxPool 无参数、计算少、直接保留局部最强响应，并引入有限位移鲁棒性。Stride Conv 可学习，通常表达更强但增加参数/计算和过拟合风险。现代架构常选择
      stride Conv；没有绝对优劣。
    - 分类 backbone 下采样丢失精确空间位置，而分割需逐像素输出。解决需可学习上采样、dilated convolution 与低层 skip features，在语义和边界细节之间平衡。
    - 官方使用 AdamW 训练 10 epochs，测试 accuracy 为 0.9901。进一步到 99.5%～99.7% 可加入适当增强、BN、1cycle
      和 ensemble；测试集不能用于反复选配置。
  - title: 工程能力
    source_heading: 工程能力
    paragraphs:
    - 能实现 ResidualUnit/ResNet-34
    - 能实现 SeparableConv 与 SEBlock
    - 能使用 weights.transforms 和 metadata
    - 能用 skip + upsampling 构建分割 decoder
  takeaways:
  - 层次组合：边缘组成部件，部件组成物体。
  - 输入平移，feature map 相应平移，这是等变性，不是输出不变。Padding、stride、pooling 和离散采样会破坏精确等变性。
  - 验证/测试使用 weights 的确定性 transforms。还可逐层解冻、换相似领域预训练模型、分析失败样本、模型集成。卫星/医学/农业图像应优先找 TorchGeo/MONAI/AgML
    等领域预训练模型，避免负迁移。
  - Tracking 指标还应评价 ID switches、轨迹完整性和定位，不只是逐帧 detection mAP。
  - 能用 skip + upsampling 构建分割 decoder
