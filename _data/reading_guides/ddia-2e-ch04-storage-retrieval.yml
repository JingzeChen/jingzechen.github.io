  question: 0. 本章定位：数据库如何把“存进去”变成“找得回来”？
  question_source: 0. 本章定位：数据库如何把“存进去”变成“找得回来”
  thesis: compaction、vacuum、materialized view maintenance、index merge、embedding rebuild
    都让前台快，但后台必须有资源并被监控。
  thesis_source: 7. 全章知识结构
  concepts:
  - term: 0. 本章定位：数据库如何把“存进去”变成“找得回来”
    meaning: 如果用同一物理布局强行同时优化两者，会遇到冲突：OLTP 希望一行相关字段邻近、点查快速；OLAP 希望同一列连续、压缩和批量扫描高效。
    source_heading: 0. 本章定位：数据库如何把“存进去”变成“找得回来”
  - term: 2. 分析场景的数据存储
    meaning: 现代 CPU 从连续内存预取高效；random pointer chasing 易 cache miss。列式 batch 连续，能充分利用
      cache line 和 memory bandwidth。
    source_heading: 2. 分析场景的数据存储
  - term: 3. 多维、全文与向量索引
    meaning: 单维有序索引无法自然解决所有检索。低维空间需要同时剪枝多个坐标；全文把 term 映射到 postings；语义检索把内容映射到高维 embedding，再进行
      exact 或 approximate nearest neighbor。
    source_heading: 3. 多维、全文与向量索引
  - term: 7. 全章知识结构
    meaning: compaction、vacuum、materialized view maintenance、index merge、embedding
      rebuild 都让前台快，但后台必须有资源并被监控。
    source_heading: 7. 全章知识结构
  - term: 8. 综合案例：电商商品、订单、搜索与分析的存储设计
    meaning: 再加 replication 和 SSD device WA。设备标称 100 MB/s 并不一定有足够余量承受 compaction/checkpoint
      和故障恢复。
    source_heading: 8. 综合案例：电商商品、订单、搜索与分析的存储设计
  - term: 10. 选择与调优存储引擎的一般方法
    meaning: 每种结构都应回答四个问题：它如何缩小查询候选？写入为此额外维护什么？旧数据何时回收？崩溃后怎样恢复？能够把这四问讲清，才真正理解了存储引擎，而不只是记住
      B-tree、LSM、columnar 或 HNSW 的名称。
    source_heading: 10. 选择与调优存储引擎的一般方法
