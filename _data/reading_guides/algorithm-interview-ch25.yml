overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 随机集合让每个实例恰占一个数组槽位，所以均匀下标自然产生正确概率；MedianFinder 让中间元素永远位于两个堆顶，所以查询无需重新排序。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 普通算法题往往给定一次输入并返回一次输出；设计题要求实现一个长期存在的对象，在多次操作之间保存状态，同时满足每个操作的语义和复杂度契约。
    source_heading: 本章要解决什么问题
  - term: 25.2 常见设计问题的求解
    meaning: 补充：可测试随机性。 单元测试不应要求一次随机调用返回某个固定值。应注入固定种子的随机数生成器验证确定性边界，或大量采样后用统计容差检查频率；统计测试只能发现明显偏差，不能替代均匀性证明。
    source_heading: 25.2 常见设计问题的求解
  - term: 1. 组合两份数据不是无意义冗余
    meaning: 数组和哈希表保存了部分重复信息，但分别把不同操作降到 O(1)。这种冗余是一种索引：主数据提供随机访问，辅助映射提供反向定位。
    source_heading: 1. 组合两份数据不是无意义冗余
  - term: 6. LRU 与 LFU 的区别
    meaning: LFU 需要“频次桶 + 桶内 LRU 顺序”，比单链表 LRU 多一层分组，这也是推荐练习 LeetCode 460 的核心。
    source_heading: 6. LRU 与 LFU 的区别
  - term: 8. 迁移判断
    meaning: 迁移判断的核心不是“数据量大就换”，而是操作集合、复杂度保证或一致性模型发生了变化。
    source_heading: 8. 迁移判断
  - term: 3. 让数据布局直接表达概率或答案
    meaning: 随机集合让每个实例恰占一个数组槽位，所以均匀下标自然产生正确概率；MedianFinder 让中间元素永远位于两个堆顶，所以查询无需重新排序。
    source_heading: 3. 让数据布局直接表达概率或答案
