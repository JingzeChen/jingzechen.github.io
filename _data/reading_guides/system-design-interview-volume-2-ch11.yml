checks:
- level: 概念辨析
  question: 原文如何解释「14.1 Pay-in 不等于 Seller 已收到钱」？
  answer: 资金先到平台/托管账户；Pay-out 条件满足后才到 Seller Bank。
  source_heading: 14.1 Pay-in 不等于 Seller 已收到钱
- level: 概念辨析
  question: 原文如何解释「14.6 Hosted Page 不等于无需 PCI/Security」？
  answer: 它缩小 Scope，不消除 Redirect、Webhook、Token 和配置风险。
  source_heading: 14.6 Hosted Page 不等于无需 PCI/Security
- level: 概念辨析
  question: 原文如何解释「14.14 HTTP 429 不是唯一正确的重复进行中响应」？
  answer: 可用 202/409；重点是 API Contract 与 Retry Guidance 清楚。
  source_heading: 14.14 HTTP 429 不是唯一正确的重复进行中响应
- level: 概念辨析
  question: 原文如何解释「14.20 Reconciliation 不是只比较总金额」？
  answer: 总数相同仍可能一笔重复、一笔遗漏；应逐 Order/Provider Transaction 匹配。
  source_heading: 14.20 Reconciliation 不是只比较总金额
- level: 概念辨析
  question: 原文如何解释「14.26 Payment SUCCESS 不等于订单 Fulfillment 一定成功」？
  answer: 库存/发货是另一 Saga；失败可能 Refund，而不是修改支付历史为不存在。
  source_heading: 14.26 Payment SUCCESS 不等于订单 Fulfillment 一定成功
