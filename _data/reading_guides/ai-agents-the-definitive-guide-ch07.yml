  question: 原文围绕「0. 本章定位与阅读主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与阅读主线
  thesis: 可迁移的一般方法是：把每个“应该能工作”的假设变成可观测指标和故障实验；先限制无界状态、循环和成本，再为外部依赖设计显式降级；把结构正确和业务正确分开评价；最后用真实
    workload 将软件架构映射到硬件容量与用户体验。
  thesis_source: 27. 本章知识结构与核心结论
