  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 分治法的价值不只在于把规模减半，而在于找到一种分解，使子问题答案可以廉价、无遗漏地合并。二分查找则是分治中最精炼的形式：只要能把候选空间组织成单调的假/真边界，就能用对数次判定定位答案。真正可靠的实现来自明确的区间不变量、严格的边界条件和对合并成本的完整核算。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 本章共有 2 个基础算法单元、22 道正文题。后文为每个单元或题目各放置一个紧邻推导的 C++17 代码块，共 24 个；共享的二分边界、归并缓冲和分区辅助在首次出现的相应单元中定义，Python
      与 Go 只保留在章末附录。
    source_heading: 本章要解决什么问题
  - term: 17.2 基本分治算法设计
    meaning: 每种括号化表达式都有唯一最外层运算符，算法枚举到它；归纳假设左右所有括号化结果都已生成，笛卡尔积因此生成该表达式。反过来，每次组合都对应合法地把左右子表达式加括号，所以不会产生非法计算。
    source_heading: 17.2 基本分治算法设计
  - term: 17.4 二分查找应用的算法设计
    meaning: 可迁移到支持“严格小于某值的元素个数”和插入的有序多重集；若容器没有对数级秩查询，二分到迭代器仍不能保证整体高效，优先迁移到 17.3.4
      的归并计数或离散化 BIT。
    source_heading: 17.4 二分查找应用的算法设计
  - term: 代码与推导的对应关系
    meaning: 补充： 本节把正文方法映射到三语言程序接口，便于从分治不变量和二分谓词反查实现，不属于原书新增题解。
    source_heading: 代码与推导的对应关系
  - term: 分治算法的四个问题
    meaning: 递推式能否用主定理，平均与最坏情况是否不同？
    source_heading: 分治算法的四个问题
  - term: 本章三条主线
    meaning: 分治法的价值不只在于把规模减半，而在于找到一种分解，使子问题答案可以廉价、无遗漏地合并。二分查找则是分治中最精炼的形式：只要能把候选空间组织成单调的假/真边界，就能用对数次判定定位答案。真正可靠的实现来自明确的区间不变量、严格的边界条件和对合并成本的完整核算。
    source_heading: 本章三条主线
