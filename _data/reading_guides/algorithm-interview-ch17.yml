  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 分解：把规模为 n 的问题拆成更小的同类子问题；
    - 值域二分：不直接搜索元素，而搜索满足单调判定的最小/最大答案。
    - 分治与递归不是同义词。分治是一种问题拆解策略；递归是一种实现技术。二分查找、归并排序都可写成迭代形式。
    - 本章共有 2 个基础算法单元、22 道正文题。后文为每个单元或题目各放置一个紧邻推导的 C++17 代码块，共 24 个；共享的二分边界、归并缓冲和分区辅助在首次出现的相应单元中定义，Python
      与 Go 只保留在章末附录。
  - title: 17.1 分治法概述
    source_heading: 17.1 分治法概述
    paragraphs:
    - 原书把第 2 点称为“最优子结构”。更严格地说，最优子结构常用于优化问题；一般分治只要求原问题答案可由子问题答案正确合成。
    - 共享子结点的图：若输入并非树，同一结点可能从两条路径到达，子问题不再独立；需要访问标记，否则会重复处理，遇到环还可能无限递归。
    - 迁移判断：当对象能拆成不重叠的树形部分，且答案只需对子答案做常数或线性合并时，优先考虑分治；若多个分支反复请求同一状态，应转向记忆化/动态规划；若分解高度失衡，还要单独核算栈深与最坏时间。
    - 迁移判断：只有当候选位置可按谓词排成连续的假段与真段，且一次判定能安全排除一侧时，才能迁移边界二分；若谓词会来回翻转，应先重建单调性或改用扫描、哈希等方法。
  - title: 17.2 基本分治算法设计
    source_heading: 17.2 基本分治算法设计
    paragraphs:
    - 当答案能按“完全在左、完全在右、跨分割线”形成互斥且完备的分类，并且跨界最优可低成本求出时，可迁移这一模式；若跨界状态需要保留指数多信息，合并就不再廉价。
    - 每种括号化表达式都有唯一最外层运算符，算法枚举到它；归纳假设左右所有括号化结果都已生成，笛卡尔积因此生成该表达式。反过来，每次组合都对应合法地把左右子表达式加括号，所以不会产生非法计算。
    - 任意 BST 有唯一根值 i；BST 性质唯一决定左右键区间。算法枚举该根，并由归纳假设生成所有合法左右子树，所以每棵合法 BST 都生成。不同根或不同左右结构会产生不同树，因此不重。
    - 递归缓存区间结果能减少重复结构计算，但把同一子树对象挂到多个结果会产生引用共享；若调用者会修改返回树，应深拷贝子树。在线评测通常只读取结果，常见实现允许共享不可变子结构。
  - title: 17.3 快速排序和二路归并排序应用的算法设计
    source_heading: 17.3 快速排序和二路归并排序应用的算法设计
    paragraphs:
    - 分区保证目标秩只可能位于一个分区。丢弃的另一侧全部元素在值序关系上不可能占目标位置；等值区内所有值相同，目标落入即可返回。每轮保留目标所在子问题，最终缩到单点。
    - 当要统计的二元关系按原下标可唯一归属某个分割层，且排序后跨区关系能单调累计时，可迁移“归并排序 + 计数”；否则应寻找别的有序状态或数据结构。
    - 任意合法对在递归树中有唯一最低公共分割层：左下标在左段、右下标在右段。该层的双指针计数会包含它一次；左右递归处理其他两类对，所以不重不漏。
    - 迁移此模式要求：左右段排序后，跨区判定对扫描指针具有单调性。若关系随左值增大仍会真假反复，单指针不能复用，线性合并成本也就不成立。
  - title: 17.4 二分查找应用的算法设计
    source_heading: 17.4 二分查找应用的算法设计
    paragraphs:
    - 在已识别的有序半区内，端点比较能准确判断目标是否落入其值域；若落入，另一半可排除，否则该有序半区可排除。每轮保留目标可能存在的唯一一侧并严格缩小区间。
    - 可迁移到支持“严格小于某值的元素个数”和插入的有序多重集；若容器没有对数级秩查询，二分到迭代器仍不能保证整体高效，优先迁移到 17.3.4 的归并计数或离散化
      BIT。
    - 这个贪心产生上限 C 下的最少段数。证明：第一段尽可能延伸到最右；任何合法划分的第一段都不可能越过它，否则和超过 C。删去第一段后对子数组重复同一论证，贪心使用段数不多于任何其他划分。
    - 给定容量时，尽量装满当天可使第一天结束位置最靠后；任何其他合法计划不会在更少天内处理更多前缀，逐天归纳可知贪心天数最少。可行谓词随容量单调，第一真二分得到最低容量。
  - title: 代码与推导的对应关系
    source_heading: 代码与推导的对应关系
    paragraphs:
    - 补充： 本节把正文方法映射到三语言程序接口，便于从分治不变量和二分谓词反查实现，不属于原书新增题解。
    - 写代码前先明确搜索的究竟是“位置”还是“答案数值”，能避免把数组长度边界与值域边界混在一起。
  - title: 三种语言中的实现差异
    source_heading: 三种语言中的实现差异
    paragraphs:
    - 补充： 三种程序保持同一分治与二分不变量，差异主要来自整数除法、容器插入、对象所有权和标准库接口。
    - 正文 C++17 实现与附录 A/B 故意保留该方法以对应 17.4.9/10，同时明确它会超时；高效版本应改用归并、BIT 或平衡秩树。
    - Python 的默认递归深度较低，超大数组的递归归并可能需改成迭代自底向上版本；
    - Python、C++、Go 示例都克隆左右子树后再挂到新根，保证返回树彼此独立。
  - title: 分治算法的四个问题
    source_heading: 分治算法的四个问题
    paragraphs:
    - 子问题如何划分，规模是否严格缩小？
    - 子问题是否相互独立，还是需要记忆化？
    - 合并阶段需要哪些边界信息，成本是多少？
    - 递推式能否用主定理，平均与最坏情况是否不同？
  - title: 二分算法的四个问题
    source_heading: 二分算法的四个问题
    paragraphs:
    - 搜索空间是下标、虚拟序列还是答案值域？
    - 谓词是否单调，假/真边界方向是什么？
    - 要找任意命中、第一个真、最后一个假，还是循环回绕？
    - 区间约定、更新公式和返回值是否一致？
  - title: 本章三条主线
    source_heading: 本章三条主线
    paragraphs:
    - 按结构分解：二叉树、表达式、BST 生成；
    - 按位置分解并在线性合并中统计：归并排序、右侧较小数、翻转对；
    - 按单调边界排除候选：普通二分、旋转数组、排名值域、容量可行性。
    - 分治法的价值不只在于把规模减半，而在于找到一种分解，使子问题答案可以廉价、无遗漏地合并。二分查找则是分治中最精炼的形式：只要能把候选空间组织成单调的假/真边界，就能用对数次判定定位答案。真正可靠的实现来自明确的区间不变量、严格的边界条件和对合并成本的完整核算。
  takeaways:
  - 子问题如何划分，规模是否严格缩小？
  - 递推式能否用主定理，平均与最坏情况是否不同？
  - 要找任意命中、第一个真、最后一个假，还是循环回绕？
  - 按结构分解：二叉树、表达式、BST 生成；
  - 分治法的价值不只在于把规模减半，而在于找到一种分解，使子问题答案可以廉价、无遗漏地合并。二分查找则是分治中最精炼的形式：只要能把候选空间组织成单调的假/真边界，就能用对数次判定定位答案。真正可靠的实现来自明确的区间不变量、严格的边界条件和对合并成本的完整核算。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 分治与递归不是同义词」？
  answer: 分治描述如何拆问题；递归只是实现调用关系。二分、归并都能迭代实现；一个递归函数也可能完全没有分治，例如单链线性递归。
  source_heading: 1. 分治与递归不是同义词
- level: 概念辨析
  question: 原文如何解释「4. lower_bound 返回 n 是合法结果」？
  answer: 它表示所有元素都小于目标，插入点在末尾。读取数组前必须检查下标，否则越界。
  source_heading: 4. lower_bound 返回 $n$ 是合法结果
- level: 概念辨析
  question: 原文如何解释「8. 表达式相同数值结果不能去重」？
  answer: 不同括号化方式可能都得到 -10，题目要求返回所有计算结果，对应两个条目都要保留。
  source_heading: 8. 表达式相同数值结果不能去重
- level: 概念辨析
  question: 原文如何解释「10. 快速排序枢轴不一定“归位”」？
  answer: Lomuto 单枢轴分区通常返回枢轴最终位置；Hoare 双向分区只保证两侧关系，枢轴值可能出现在一段区域。递归边界必须匹配具体分区契约。
  source_heading: 10. 快速排序枢轴不一定“归位”
- level: 概念辨析
  question: 原文如何解释「21. 答案二分必须先证明谓词单调」？
  answer: 容量增大时最少组数/天数不增，才可二分。若数组允许负数，贪心分段和单调证明可能失效。
  source_heading: 21. 答案二分必须先证明谓词单调
