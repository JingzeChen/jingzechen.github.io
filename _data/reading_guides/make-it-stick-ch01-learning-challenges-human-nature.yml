  question: 导读：第一章在证明什么？
  question_source: 导读：第一章在证明什么
  thesis: 真正的学习是获得知识或技能，并能在时间过去、提示减少、情境变化之后把它们检索出来解决问题。重复接触和集中练习常能改善眼前表现，却容易制造掌握错觉；检索、间隔、穿插、变化、生成、细化和反馈虽然更费力，却更有可能形成持久且灵活的能力。
  thesis_source: 导读：第一章在证明什么
  concepts:
  - term: 导读：第一章在证明什么
    meaning: 真正的学习是获得知识或技能，并能在时间过去、提示减少、情境变化之后把它们检索出来解决问题。重复接触和集中练习常能改善眼前表现，却容易制造掌握错觉；检索、间隔、穿插、变化、生成、细化和反馈虽然更费力，却更有可能形成持久且灵活的能力。
    source_heading: 导读：第一章在证明什么
  - term: 二、科学“照妖镜”下的学习方法
    meaning: 但结论必须加限定：作者批评的是把连续、被动重读作为主要学习方法，不是说任何第二次阅读都无价值。初次没有理解、需要查证细节、隔一段时间重新组织材料时，重读可以服务于学习；关键是不能只重读而不检索、解释和应用。
    source_heading: 二、科学“照妖镜”下的学习方法
  - term: 1. 作者对旧学习模式的最终诊断
    meaning: 学习者不再自测，也看不到未知的未知；
    source_heading: 1. 作者对旧学习模式的最终诊断
  - term: 5. 第一章结论的适用边界
    meaning: 不是所有重复都无效。 重复是必要条件之一，但连续被动暴露通常不够；间隔、检索与变化决定重复质量。
    source_heading: 5. 第一章结论的适用边界
  - term: A. 基础概念
    meaning: 为什么马特·布朗案例能说明“记忆是应用的前提”，却不能单独证明检索练习优于重读？
    source_heading: A. 基础概念
  - term: 十、全章总结
    meaning: 马特·布朗在夜空中的选择给本章提供了最终标准：真正学会，不是看到讲义时觉得每一步都合理，而是在讲义不在眼前、局面与练习不完全相同、时间又不允许从头查找时，仍能识别关键线索，调出正确知识，并作出可靠行动。
    source_heading: 十、全章总结
