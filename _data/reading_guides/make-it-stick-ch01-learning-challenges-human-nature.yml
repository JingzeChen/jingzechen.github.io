  sections:
  - title: 导读：第一章在证明什么
    source_heading: 导读：第一章在证明什么
    paragraphs:
    - 真正的学习是获得知识或技能，并能在时间过去、提示减少、情境变化之后把它们检索出来解决问题。重复接触和集中练习常能改善眼前表现，却容易制造掌握错觉；检索、间隔、穿插、变化、生成、细化和反馈虽然更费力，却更有可能形成持久且灵活的能力。
    - 学习（learning）是由经验引起、能够相对持久地支持未来表现的知识或能力变化。学习本身是潜在状态，不能直接看见，只能通过延迟测试、无提示检索和迁移任务推断。
    - 练习结束时的好成绩，既可能来自已经形成的持久能力，也可能来自材料仍在眼前、答案刚刚看过、题型连续不变等临时支持。后者能让人当场答得很顺，却未必能在几天后独立完成同样的任务。
    - 因此，练习时成绩提高不足以单独证明真正学会。判断一种方法是否有效，要等一段时间后撤掉提示再次测试，还要适当改变题目或情境，看看学习者能否把知识用于新的问题。延迟后仍记得、没有答案也能想起、换了情境仍会用，才是更可靠的学习证据。
  - title: 一、天性懒惰孕育了认知规律和心智模型
    source_heading: 一、天性懒惰孕育了认知规律和心智模型
    paragraphs:
    - 这种倾向有合理一面。人的注意力和工作记忆有限，自动化熟悉操作可以节约资源。但在学习中，它会造成评价错位：真正能促进长期保持的活动，往往在眼前更慢、更难、错误更多；只改善短期表现的活动，反而更舒服。
    - 很多任务都同时包含“关键特征”和“表面特征”。如果练习材料的外观几乎完全一样，学习者很容易把表面线索误当成解题规则。多样化练习的价值在于：让表面线索不断变化，同时保留真正决定类别与原理的关键特征，逼着学习者抓住本质。
    - 成立条件是问题至少部分可理解，并且随后有可靠反馈。完全无基础地猜测、长期保留错误答案，或让错误带来严重现实后果，都不适合无保护的生成。飞行员应在模拟器中安全犯错，而不是在真实危机中第一次探索关键程序。
    - 要证明“按风格匹配就更有效”，必须看到清晰的交叉结果：视觉偏好者在视觉教学下更好，听觉偏好者在听觉教学下更好。仅仅出现“视觉材料总体更好”或“某类学生总体更高分”，都不能证明匹配假说成立。
  - title: 二、科学“照妖镜”下的学习方法
    source_heading: 二、科学“照妖镜”下的学习方法
    paragraphs:
    - 但结论必须加限定：作者批评的是把连续、被动重读作为主要学习方法，不是说任何第二次阅读都无价值。初次没有理解、需要查证细节、隔一段时间重新组织材料时，重读可以服务于学习；关键是不能只重读而不检索、解释和应用。
    - 马特为获得喷气式商用飞机驾驶资格，参加 18 天、每天约 10 小时的培训。前 7 天主要在教室听讲，学习电路、燃料、气动系统及安全参数，并面对约 80
      项需要在紧急情况下迅速执行的记忆任务。
    - 这里的关键机制不是“记忆容量太小”，而是注意与任务目标决定编码。日常开门的目标是操作门把手，灭火器位置没有被当成需要记住的信息。长期暴露若缺少注意、提取和用途，仍可能不形成可用记忆。
    - 实验针对的是特定材料、无意学习条件和后续自由回忆。它不能证明重复在所有任务中都没有任何作用，也不能证明参与者对旧词完全没有熟悉感。它证明的是：熟悉或发音接触不能自动转化成实验所测的有意回忆收益。
  - title: 四、考试是最有效的学习策略之一
    source_heading: 四、考试是最有效的学习策略之一
    paragraphs:
    - 人们通常把考试理解为评估工具：在学习结束后测量成绩、排名或认证。作者要求增加第二种理解：学习工具，即通过主动检索来强化记忆并指导后续学习。
    - 测验效应（testing effect）或检索练习效应是指：与仅再次学习材料相比，主动从记忆中检索先前学过的内容，通常能提高后续测试中的长期保持；如果配合反馈，还能纠正错误。
    - 字母等级直观展示了差距，但严格理解仍应查看原研究的数值、变异和统计分析。章节在这里用它说明方向和教育意义，而非给出全部方法细节。
    - 即使马特驾驶同型商用飞机已有 10 年，仍每半年参加考试和模拟训练。原因是紧急情况少见，相关程序若不主动检索，可能因长期不用而生疏。
  - title: 1. 作者对旧学习模式的最终诊断
    source_heading: 1. 作者对旧学习模式的最终诊断
    paragraphs:
    - 人依据直觉选择反复阅读和集中练习；
    - 学习者不再自测，也看不到未知的未知；
    - 时间过去或情境变化后，知识无法提取；
  - title: 5. 第一章结论的适用边界
    source_heading: 5. 第一章结论的适用边界
    paragraphs:
    - 不是所有轻松学习都无效。 清晰讲解和合适支架能减少无关负担，给核心加工留出资源。
    - 不是所有困难都有效。 困难必须与目标相关、难度适中、允许成功并有反馈。
    - 不是所有重复都无效。 重复是必要条件之一，但连续被动暴露通常不够；间隔、检索与变化决定重复质量。
    - 方法不能消除所有差异。 健康、资源、动机、先备知识和机会仍会影响结果。
  - title: 七、作者分析问题的方法论
    source_heading: 七、作者分析问题的方法论
    paragraphs:
    - 为什么看了无数次硬币仍记不清？为什么连续读两遍感觉更熟，延迟成绩却没有提高？这些现象迫使作者怀疑“接触次数决定学习”的直觉。
    - 托尔文实验隔离“额外接触”，重读实验操纵阅读次数和时间，哥伦比亚中学研究再把检索带入真实课程。不同证据共同缩小替代解释。
    - 替代方案不是购买复杂工具，而是把阅读改成问题、合书作答、低权重测验、间隔复习和反馈纠错。模拟器虽昂贵，其核心结构也能用案例推演实现。
    - 作者承认个体天资不同、神经科学尚不能直接提供完整教学处方、标准化考试存在陷阱，也说明故事只用于阐释。这让结论保持在证据能够支持的范围内。
  - title: A. 基础概念
    source_heading: A. 基础概念
    paragraphs:
    - 为什么马特·布朗案例能说明“记忆是应用的前提”，却不能单独证明检索练习优于重读？
    - 即时表现与学习有什么区别？为什么集中练习容易混淆二者？
    - 间隔练习与穿插练习分别操纵哪个维度？
    - 学习风格偏好为什么不能证明匹配教学有效？
  - title: B. 实验论证
    source_heading: B. 实验论证
    paragraphs:
    - 连续重读为何可能提高即时测试，却不能提高延迟测试？
    - 148 名学生研究增加了哪些现实性，又保留哪些推广限制？
    - 哥伦比亚中学实验为什么不能简单解释成“测验内容只是多接触了几次”？
    - 小测验中的反馈为何是解释结果时不能忽略的组成部分？
  - title: 十、全章总结
    source_heading: 十、全章总结
    paragraphs:
    - 重复只有与注意、检索、间隔、变化和反馈结合，才更可能形成持久学习。
    - 困难不是目的。 真正有益的是与目标相关、难度适中、能够纠错的认知努力。
    - 故事负责让原则可理解，实验负责让结论可检验，课堂研究负责让方法可应用。
    - 马特·布朗在夜空中的选择给本章提供了最终标准：真正学会，不是看到讲义时觉得每一步都合理，而是在讲义不在眼前、局面与练习不完全相同、时间又不允许从头查找时，仍能识别关键线索，调出正确知识，并作出可靠行动。
  takeaways:
  - 因此，练习时成绩提高不足以单独证明真正学会。判断一种方法是否有效，要等一段时间后撤掉提示再次测试，还要适当改变题目或情境，看看学习者能否把知识用于新的问题。延迟后仍记得、没有答案也能想起、换了情境仍会用，才是更可靠的学习证据。
  - 实验针对的是特定材料、无意学习条件和后续自由回忆。它不能证明重复在所有任务中都没有任何作用，也不能证明参与者对旧词完全没有熟悉感。它证明的是：熟悉或发音接触不能自动转化成实验所测的有意回忆收益。
  - 方法不能消除所有差异。 健康、资源、动机、先备知识和机会仍会影响结果。
  - 学习风格偏好为什么不能证明匹配教学有效？
  - 马特·布朗在夜空中的选择给本章提供了最终标准：真正学会，不是看到讲义时觉得每一步都合理，而是在讲义不在眼前、局面与练习不完全相同、时间又不允许从头查找时，仍能识别关键线索，调出正确知识，并作出可靠行动。
