checks:
- level: 概念辨析
  question: 原文如何解释「5.1 SOTA 不等于生产最优」？
  answer: 它只在特定 benchmark 与预算上领先，不保证延迟、成本、数据和业务匹配。
  source_heading: 5.1 SOTA 不等于生产最优
- level: 概念辨析
  question: 原文如何解释「5.9 Bagging、boosting、stacking 不可互换」？
  answer: 它们分别以并行重采样、串行纠错和 meta-learning 组合模型。
  source_heading: 5.9 Bagging、boosting、stacking 不可互换
- level: 概念辨析
  question: 原文如何解释「5.17 增加 GPU 不会线性减少训练时间」？
  answer: 通信、straggler、global batch 与统计效率造成递减收益。
  source_heading: 5.17 增加 GPU 不会线性减少训练时间
- level: 概念辨析
  question: 原文如何解释「5.21 Baseline 不是“随便一个弱模型”」？
  answer: Random、zero-rule、human 与现有系统分别回答学习、复杂度和有用性问题。
  source_heading: 5.21 Baseline 不是“随便一个弱模型”
- level: 概念辨析
  question: 原文如何解释「5.28 Confidence score 不一定可信」？
  answer: Softmax 可在域外高置信。阈值应通过 risk-coverage 与生产代价选择。
  source_heading: 5.28 Confidence score 不一定可信
