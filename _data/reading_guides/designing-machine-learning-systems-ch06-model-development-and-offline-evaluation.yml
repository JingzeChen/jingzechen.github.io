overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 本章进入许多从业者最感兴趣的算法环节。模型选择不能靠静态架构排行榜，而要结合目标、数据、预算、延迟、解释和未来改善路径。六条原则帮助团队远离 SOTA
    陷阱，从简单 baseline 出发，在公平预算下理解模型假设与 trade-off。
  thesis_source: 4. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：模型开发不是在排行榜中寻找最高分，而是在公平、可复现的实验下，选择满足业务约束、能被调试和扩展，并通过多维行为检查的最简单可用系统。
    source_heading: 0. 本章要回答的核心问题
  - term: 1. 开篇：从数据和特征进入模型循环
    meaning: 本章假定读者已理解线性模型、树、kNN 与神经网络等基础算法；重点是围绕算法的工程与判断框架，而不是重新推导每种模型。
    source_heading: 1. 开篇：从数据和特征进入模型循环
  - term: 3. Model Offline Evaluation：模型离线评估
    meaning: 用户看 romance 80%、comedy 20%，只推荐最可能类别会全是 romance；原章称 80/20 组合更 calibrated。这里更准确的术语是
      calibrated recommendation / distributional calibration：推荐目录类别分布匹配用户偏好分布，与“预测概率等于经验频率”的
      probability calibration 有关联但不是同一对象。
    source_heading: 3. Model Offline Evaluation：模型离线评估
  - term: 4. 原章总结的完整还原
    meaning: 离线评估必须先有 baseline。Random、heuristic、zero-rule、human 和 existing solution
      分别回答不同参照问题。随后用 perturbation、invariance、directional expectation、calibration、confidence
      和 slice-based evaluation 检查平均指标未覆盖的行为。
    source_heading: 4. 原章总结的完整还原
  - term: 7. 核心结论
    meaning: 离线评估不能只看总体 accuracy/F1。 Robustness、invariance、directionality、calibration、confidence
      和 slices 都可能决定可用性。
    source_heading: 7. 核心结论
  - term: 8. 从本章提炼出的通用模型开发与离线评估方法
    meaning: 本章最值得迁移的原则是：离线开发的目标不是制造一个最高分 checkpoint，而是形成一条可复现的证据链，说明该模型为什么比基线更有用、在哪些条件下可靠、哪些条件下应拒绝预测，以及为什么值得承担它的生产成本。
    source_heading: 8. 从本章提炼出的通用模型开发与离线评估方法
  logic:
  - 0. 本章要回答的核心问题
  - 1. 开篇：从数据和特征进入模型循环
  - 2. Model Development and Training：模型开发与训练
  - 4. 原章总结的完整还原
  - 6. 本章知识结构
  - 7. 核心结论
  - 8. 从本章提炼出的通用模型开发与离线评估方法
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - AutoML 的 HPO、NAS 与 learned optimizer 自动化到什么程度，为什么仍不能替代问题定义？
    - 离线指标为什么必须与 random、heuristic、zero-rule、human 和现有系统 baseline 比较？
    - Slice-based evaluation 怎样发现群体伤害、关键业务失败与 Simpson’s paradox？
    - 一句话概括：模型开发不是在排行榜中寻找最高分，而是在公平、可复现的实验下，选择满足业务约束、能被调试和扩展，并通过多维行为检查的最简单可用系统。
  - title: 1. 开篇：从数据和特征进入模型循环
    source_heading: 1. 开篇：从数据和特征进入模型循环
    paragraphs:
    - 怎样开发和训练？ 追踪、版本、调试、分布式训练和 AutoML。
    - 上线前怎样判断？ baseline 与一组超越总体指标的离线评估方法。
    - 模型开发是迭代循环。每次变更都要与先前版本比较，并检查生产适用性，而不只是验证集分数。
    - 本章假定读者已理解线性模型、树、kNN 与神经网络等基础算法；重点是围绕算法的工程与判断框架，而不是重新推导每种模型。
  - title: 2. Model Development and Training：模型开发与训练
    source_heading: 2. Model Development and Training：模型开发与训练
    paragraphs:
    - 原章历史数字：截至 2021 年 8 月，20 out of 22（22 个中有 20 个）Kaggle 获胜方案使用 ensemble；截至 2022
      年 1 月，SQuAD 2.0 前 20 个方案都是 ensemble。它说明 leaderboard 中集成常见，不代表今天排行或生产比例。
    - 固定平均或多数投票只是 voting / averaging ensemble：组合规则不从数据训练，因此通常不称为严格的 stacking，也不需要为组合器生成
      OOF 特征。Stacking 则训练一个 meta-learner（例如 logistic / linear regression）来组合 base
      learner 输出。
    - 固定初始化、dropout、shuffle 等随机源，减少比较噪声并复现错误。还需设置 Python、NumPy、framework、worker 与
      distributed sampler 的 seed，并启用确定性算法（若可接受性能代价）。Seed 不能消除全部硬件非确定性。
    - 原章例：每 worker batch 1000、1000 workers，按样本计 global batch 为 1M；GPT-3 175B 在 2020
      年使用的 3.2M batch 指约 320 万 tokens，而不是 320 万 sequences / examples。
  - title: 3. Model Offline Evaluation：模型离线评估
    source_heading: 3. Model Offline Evaluation：模型离线评估
    paragraphs:
    - FID（Fréchet Inception Distance）常用于生成图像评估，通常越低越好；但 FID=10.3 若不知道数据集、特征提取器、预处理、样本量和已有系统，仍无法判断是否有用。只有计算口径与数据一致时，FID
      才适合直接比较。
    - 原章引用一项 2019 年报道的历史研究陈述：研究者估计，2008–2015 年间共有 130 万名信用合格的 Black 和 Latino 申请者被线下与线上贷款机构拒绝；在其分析中，保留收入与信用分数、删除种族识别信息后，申请得到接受。该陈述应按报道与研究设计的证据边界理解，不应从这一段单独外推出所有贷款系统的因果机制。
    - 用户看 romance 80%、comedy 20%，只推荐最可能类别会全是 romance；原章称 80/20 组合更 calibrated。这里更准确的术语是
      calibrated recommendation / distributional calibration：推荐目录类别分布匹配用户偏好分布，与“预测概率等于经验频率”的
      probability calibration 有关联但不是同一对象。
    - Softmax 最大值不是天然可信 confidence，尤其域外、分布变化和过拟合时会高置信错误。Calibration、ensemble disagreement、conformal
      prediction 或专门 uncertainty 方法可辅助。
  - title: 4. 原章总结的完整还原
    source_heading: 4. 原章总结的完整还原
    paragraphs:
    - 本章进入许多从业者最感兴趣的算法环节。模型选择不能靠静态架构排行榜，而要结合目标、数据、预算、延迟、解释和未来改善路径。六条原则帮助团队远离 SOTA
      陷阱，从简单 baseline 出发，在公平预算下理解模型假设与 trade-off。
    - 大量实验要求自动追踪和版本化。代码、数据、配置、环境与 artifact 共同决定 run；版本记录提高可复现性，但不能消除硬件和并行非确定性。调试则应从简单模型、小
      batch 过拟合和固定随机性开始，沿数据、特征、代码、算法与基础设施定位。
    - AutoML 从 HPO 延伸到 NAS 和 learned optimizer，可以减少搜索人工，但不替代业务目标、数据、约束和生产验证。模型开发应沿
      non-ML、简单 ML、优化简单模型、复杂模型四阶段逐步推进，并测量生产衰减。
    - 离线评估必须先有 baseline。Random、heuristic、zero-rule、human 和 existing solution 分别回答不同参照问题。随后用
      perturbation、invariance、directional expectation、calibration、confidence 和 slice-based
      evaluation 检查平均指标未覆盖的行为。
  - title: 6. 本章知识结构
    source_heading: 6. 本章知识结构
    paragraphs:
    - 简单 baseline 与公平实验预算让架构比较具有意义。
    - Tracking、versioning 和 debugging 让迭代可观察、可追溯。
    - 分布式训练扩大容量和吞吐，同时引入通信、staleness 与调度问题。
    - Baseline 解释指标价值，多维行为测试检查总体分数之外的风险。
  - title: 7. 核心结论
    source_heading: 7. 核心结论
    paragraphs:
    - 数据并行、模型并行和 pipeline 并行解决不同瓶颈。 同步受 straggler 限制，异步受 stale gradient 限制。
    - AutoML 自动搜索，不自动定义正确问题。 HPO、NAS 和 learned optimizer 都受搜索空间、代理指标和预算约束。
    - 指标必须与 baseline 比较。 Random、heuristic、zero-rule、human 和 existing solution 分别提供不同参照。
    - 离线评估不能只看总体 accuracy/F1。 Robustness、invariance、directionality、calibration、confidence
      和 slices 都可能决定可用性。
  - title: 8. 从本章提炼出的通用模型开发与离线评估方法
    source_heading: 8. 从本章提炼出的通用模型开发与离线评估方法
    paragraphs:
    - 至少计算 random、zero-rule、simple heuristic，并记录 human 与 existing solution。模型只有在净价值上超过相关
      baseline 才值得复杂化。
    - HPO 只用 validation，记录总试验次数和 winner’s curse；NAS/learned optimizer 要核算搜索成本、迁移和稳定性。
    - Calibrator、slice finder 和阈值都只在 validation 开发；test 保持最终独立。自动发现的 slice 在独立数据复验并检查多重检验。
    - 本章最值得迁移的原则是：离线开发的目标不是制造一个最高分 checkpoint，而是形成一条可复现的证据链，说明该模型为什么比基线更有用、在哪些条件下可靠、哪些条件下应拒绝预测，以及为什么值得承担它的生产成本。
  takeaways:
  - 本章进入许多从业者最感兴趣的算法环节。模型选择不能靠静态架构排行榜，而要结合目标、数据、预算、延迟、解释和未来改善路径。六条原则帮助团队远离 SOTA 陷阱，从简单
    baseline 出发，在公平预算下理解模型假设与 trade-off。
  - Ensemble 用错误多样性换性能，但增加服务复杂度。
  - 从简单 baseline 开始能更早验证 pipeline、更容易调试，也为复杂方案提供增量参照。
  - Global batch 和设备数存在临界收益。 更多 GPU 不保证线性加速或相同步数收敛。
  - 再好的离线评估也无法保证生产表现。 上线必须受控、可回滚并持续监控。
