overview:
  kind: summary
  minutes: 8
  question: 原文围绕「3.1 栈概述」建立了怎样的核心认识？
  question_source: 3.1 栈概述
  thesis: 大小写消除、路径回退、括号匹配和序列验证看似不同，栈顶含义却一致：它是当前输入最先可能完成或撤销的临时状态。只要能说明为何只能与最近对象交互，LIFO
    就不是模板，而是由问题结构推出的选择。
  thesis_source: 本章总结
  concepts:
  - term: 3.1 栈概述
    meaning: 最后进入的元素最先离开，称为 LIFO（Last In, First Out，后进先出）。若任务满足“后产生/后遇到的对象必须先处理”，栈就能把待处理顺序直接编码在数据结构中。
    source_heading: 3.1 栈概述
  - term: 3.2 扩展栈的算法设计
    meaning: 迁移抓手：若操作要统一更新栈底前缀，而查询只从栈顶逐层移除，可把前缀标记放在其最高受影响层，出栈时向下传播。
    source_heading: 3.2 扩展栈的算法设计
  - term: 3.3 栈应用的算法设计
    meaning: 循环不变量：处理完输入前缀后，栈中字符串是该前缀完全整理后的结果，且栈内没有坏相邻对。新字符只可能与当前结果的最后字符形成新坏对；删除后更早位置已经整理好，无需回头扫描。
    source_heading: 3.3 栈应用的算法设计
  - term: 3.4 单调栈应用的算法设计
    meaning: 本节栈中通常保存下标而不是值，因为答案常需要写回原位置、计算距离或宽度。栈中下标代表“答案尚未确定的对象”；当前元素一旦提供边界，就连续弹出并结算。
    source_heading: 3.4 单调栈应用的算法设计
  - term: 代码与推导的对应关系
    meaning: 原书满足进阶要求的 C++ 方案依赖稳定链表迭代器和有序映射。
    source_heading: 代码与推导的对应关系
  - term: 本章总结
    meaning: 大小写消除、路径回退、括号匹配和序列验证看似不同，栈顶含义却一致：它是当前输入最先可能完成或撤销的临时状态。只要能说明为何只能与最近对象交互，LIFO
      就不是模板，而是由问题结构推出的选择。
    source_heading: 本章总结
