overview:
  kind: summary
  minutes: 19
  question: 原文围绕「原章调查的四套方案」建立了怎样的核心认识？
  question_source: 原章调查的四套方案
  thesis: Vertex Dataset API 为 image/text/video 提供相似体验，object bytes 与 metadata/annotations
    分开导入。 原章指出 version/lineage gap。
  thesis_source: 核心结论
  concepts:
  - term: 原章调查的四套方案
    meaning: 前三者是云厂商产品集合，Kubeflow 是 Kubernetes 上的开源 ML 工具套件。它们的 ownership、operation
      model 和锁定面并不相同，不能只按 feature checkbox 横向比较。
    source_heading: 原章调查的四套方案
  - term: B.1 Amazon SageMaker
    meaning: 适合希望避免维护 training cluster control plane，同时保留 custom container 的团队。若有特殊
      accelerator topology、内部 scheduler、极端 queue policy 或已有 identity platform，则 integration
      / custom training service 成本上升。
    source_heading: B.1 Amazon SageMaker
  - term: B.3 Microsoft Azure Machine Learning
    meaning: Azure ML 的优势是 workspace / asset / job / endpoint 与 Microsoft identity/network/monitoring
      生态结合。原章中的 Python-only、registry preview、single-endpoint limitation 都必须按 current
      v2 重验；真正决策仍取决于 data immutability、multi-model semantics、cross-workspace lifecycle、cost
      和 portability。
    source_heading: B.3 Microsoft Azure Machine Learning
  - term: B.4 Kubeflow
    meaning: 原章还声称可由这些 constructs 推导 input datasets、trained models、experiment results
      与 served inferences 的 lineage。前三者可直接来自 pipeline executions；served-inference
      lineage 只有在 serving/deployment/prediction facts 被显式采集并关联到 model artifact 时才成立，KFP
      不会仅凭训练 DAG 自动知道线上每次 inference。
    source_heading: B.4 Kubeflow
  - term: 核心结论
    meaning: Vertex Dataset API 为 image/text/video 提供相似体验，object bytes 与 metadata/annotations
      分开导入。 原章指出 version/lineage gap。
    source_heading: 核心结论
  - term: 复习与自测
    meaning: 请用本附录十步方法，为一个有敏感数据、多节点 GPU 训练、P99 在线推理和跨环境发布要求的团队比较 SageMaker、Vertex
      AI、Azure ML、Kubeflow 或混合方案。
    source_heading: 复习与自测
  logic:
  - 原章调查的四套方案
  - B.1 Amazon SageMaker
  - B.2 Google Vertex AI
  - B.4 Kubeflow
  - B.5 Side-by-Side Comparison
  - 第十步：渐进采用并保留 Architecture Ownership
  - 复习与自测
  sections:
  - title: 原章调查的四套方案
    source_heading: 原章调查的四套方案
    paragraphs:
    - Amazon SageMaker；
    - Google Vertex AI；
    - Microsoft Azure Machine Learning；
    - 前三者是云厂商产品集合，Kubeflow 是 Kubernetes 上的开源 ML 工具套件。它们的 ownership、operation model
      和锁定面并不相同，不能只按 feature checkbox 横向比较。
  - title: 参考架构：所有方案的共同坐标系
    source_heading: 参考架构：所有方案的共同坐标系
    paragraphs:
    - 原章重新展示第 1.2.1 节的 reference architecture（图 B.1），把它作为比较起点，而不是假设任何厂商的产品分类就是问题本身的正确分类。
    - 外部输入来自 data collectors 与 other data warehouses。用户通过 Web UI 或 public APIs 与系统交互；AI
      applications 请求 prediction 并回传 user feedback data。
    - 图中还包含 interactive data-science environment 与公共访问层，但原章没有把 Notebook 作为表 B.1 的独立比较行；它通常由各平台的
      workbench / studio 类产品承载。
    - 原章主要做功能层映射；生产选型还要增加 security、reliability、operations、cost 和 portability。
  - title: B.1 Amazon SageMaker
    source_heading: B.1 Amazon SageMaker
    paragraphs:
    - 因此，团队通常还要在 AWS components 之上建立自己的 dataset API / SDK / portal，把 bucket、catalog
      table、ETL job 和 training snapshot 组合成领域 contract。
    - 适合希望避免维护 training cluster control plane，同时保留 custom container 的团队。若有特殊 accelerator
      topology、内部 scheduler、极端 queue policy 或已有 identity platform，则 integration /
      custom training service 成本上升。
    - 它与第 6、7 章的 serving pipeline / DAG 有相似处，但原章强调的是 serial pipeline。任意 branching、conditional
      graph、parallel ensemble 和复杂 state 不能从“pipeline”一词自动推断。
    - SageMaker 的优势是托管 control plane 与 AWS 生态集成；主要设计工作是把分散 products 统一成组织自己的 dataset、identity、lineage、security
      和 developer experience，并验证锁定、成本与 region-specific capability。
  - title: B.2 Google Vertex AI
    source_heading: B.2 Google Vertex AI
    paragraphs:
    - 原章把 Google Vertex AI 描述为 Google AI Platform 与 AutoML 产品的组合，提供可共同构成 deep learning
      system 的工具和服务。对读者真正有用的不是品牌演进史，而是它怎样将 data、training、model deployment、metadata、pipeline
      和 experiments 放进统一 control plane。
    - 版本边界：本节六个小节忠实保留原章成书时的能力和限制。Vertex AI 的 Dataset、Model Registry、Endpoint、Pipelines、Experiments
      与 Metadata APIs 后续持续演进；涉及“不能 version”“video model 不能 online serving”等结论时，必须以目标
      region、model type 和当前官方文档重新验证。
    - Vertex Dataset API 比 AWS 的“自行组合 S3 + Glue”更接近 ready-to-use dataset-management
      interface，但原章认为 version / lineage 层仍需扩展。今天采用时要重新核对 current data resource / version
      semantics，而不能把原章缺口当永久事实。
    - Vertex AI 在原章中提供较统一的 ML control plane，尤其是 Dataset API、container training、graph
      metadata 与 pipelines 的衔接。主要验证点是资源/version semantics、特定 model type serving support、managed
      abstraction 限制、GCP identity/network 与 portability。
  - title: B.3 Microsoft Azure Machine Learning
    source_heading: B.3 Microsoft Azure Machine Learning
    paragraphs:
    - 原章先区分 classic ML Studio 与 Azure Machine Learning：前者偏 GUI，后者是一套也支持 code 与成熟 open-source
      frameworks 的工具和服务。这个区别体现平台演进方向：visual designer 可以降低门槛，但 production ML 还需要 code
      versioning、custom runtime、CI/CD 和 programmable infrastructure。
    - 版本边界：原章写于 Azure ML v2 早期，包含“registry preview”“single endpoint 不支持 multiple models”等当时判断。当前官方
      v2 文档已明确支持 endpoint 下多个 deployments、traffic split/mirroring、MLflow tracking/model
      management，以及跨 workspace Registries。下面先解释原章，再单列当前变化，避免历史限制污染今天的架构决策。
    - 不能把原章一句话当作今天永久限制。Current Azure ML v2 以 Jobs、command、components 和 environments
      组织训练，具体 language/runtime 能力取决于 job type、container 和 SDK/CLI contract。非 Python
      workload 仍应 POC 验证 logging、distributed launch、inputs/outputs 和 debug，而不是只验证
      container 能启动。
    - Azure ML 的优势是 workspace / asset / job / endpoint 与 Microsoft identity/network/monitoring
      生态结合。原章中的 Python-only、registry preview、single-endpoint limitation 都必须按 current
      v2 重验；真正决策仍取决于 data immutability、multi-model semantics、cross-workspace lifecycle、cost
      和 portability。
  - title: B.4 Kubeflow
    source_heading: B.4 Kubeflow
    paragraphs:
    - 当前 Kubeflow architecture 把 Spark Operator 等用于 data preparation / feature engineering，但它仍不是全书定义的统一
      Dataset Manager。团队通常组合 object storage、table format、catalog、feature store、lineage
      和 data processing operator。
    - 原章还声称可由这些 constructs 推导 input datasets、trained models、experiment results 与 served
      inferences 的 lineage。前三者可直接来自 pipeline executions；served-inference lineage 只有在
      serving/deployment/prediction facts 被显式采集并关联到 model artifact 时才成立，KFP 不会仅凭训练
      DAG 自动知道线上每次 inference。
    - 当前官方文档说明 KFP backend 把 runtime information 存入 metadata store，包括 task status、artifact
      availability、Execution / Artifact custom properties；KFP 使用 Google ML Metadata（MLMD）作为
      metadata dependency，并能可视化跨 pipeline runs 的 Artifact–Execution lineage graph。
    - Kubeflow 的优势是 open-source、Kubernetes-native、component choice 与可扩展性；代价是组装、升级、兼容、security、storage、observability
      与 SRE 责任。它减少 vendor control-plane lock-in，但不会消除 Kubernetes 和所选 ecosystem 的 operational
      lock-in。
  - title: B.5 Side-by-Side Comparison
    source_heading: B.5 Side-by-Side Comparison
    paragraphs:
    - 原始表 B.1 的 workflow orchestration 行只有 SageMaker column 是 workflow 内容；Vertex、Azure、Kubeflow
      三列分别重复了 metadata/artifacts 行文本。这与原章 B.2.5、B.3.5、B.4.5 明确介绍的 Vertex Pipelines、Azure
      ML pipelines、Kubeflow Pipelines 相矛盾，属于明显的编辑 / 复制错误。
    - Data gravity 往往比 ML feature list 更重要。PB 级数据已在某 cloud / warehouse 时，跨云训练的 egress、copy
      time、compliance 和 duplicate governance 可能主导决策。
    - SageMaker MME、Vertex traffic split、Azure multiple deployments、KServe / ModelMesh
      可能分别覆盖不同语义。看到“multi-model”必须追问是哪一种。
    - 如果照抄原表错误行，会得出 Vertex/Azure/Kubeflow 没有 workflow 产品的荒谬结论。Cross-check summary
      table 与各正文小节，是阅读技术书籍和 vendor comparison 的必要方法。
  - title: 核心结论
    source_heading: 核心结论
    paragraphs:
    - Reference architecture 是统一比较坐标。 四套方案都按 dataset、training、serving、metadata/artifacts、workflow、experimentation
      分析。
    - Vertex Dataset API 为 image/text/video 提供相似体验，object bytes 与 metadata/annotations
      分开导入。 原章指出 version/lineage gap。
    - Vertex model、inference container 与 compute 组合为 endpoint。 原章中的 multi-model endpoint
      主要指 version traffic split。
    - Managed platform 购买的是 control-plane operations 和 native ecosystem integration。
      用户仍负责 domain contracts 与治理。
  - title: 第十步：渐进采用并保留 Architecture Ownership
    source_heading: 第十步：渐进采用并保留 Architecture Ownership
    paragraphs:
    - 从高价值低风险能力开始，例如 managed training 或 KServe；建立 adapters、canonical IDs、observability
      和 support runbooks。定期复核，但只有收益超过迁移成本时才更换平台。
    - 这套方法的核心是：以自身 workload 和责任边界为起点，把产品功能视为可验证假设，用 hard constraints、POC、TCO 和 exit
      test 取代品牌偏好。
  - title: 复习与自测
    source_heading: 复习与自测
    paragraphs:
    - Vertex Dataset 的 object bytes 与 metadata/annotations 怎样进入系统？
    - MLflow Projects retirement 与 MLflow tracking support 为什么不是同一件事？
    - Managed cloud 与 self-managed Kubeflow 的 responsibility matrix 有何差异？
    - 请用本附录十步方法，为一个有敏感数据、多节点 GPU 训练、P99 在线推理和跨环境发布要求的团队比较 SageMaker、Vertex AI、Azure
      ML、Kubeflow 或混合方案。
  takeaways:
  - 从零实现深度学习系统成本巨大，有限资源下应优先评估现有 components / systems。
  - Vertex model、inference container 与 compute 组合为 endpoint。 原章中的 multi-model endpoint
    主要指 version traffic split。
  - KServe 在多个 serving runtimes 上提供 autoscaling、health checks 和 recovery abstraction。
  - Multi-model 必须按 multiple deployments、dynamic cache、ensemble 三种语义拆分。
  - Reference architecture 是可裁剪能力模型，不是要求部署六个独立服务。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 采用现有平台就不再需要系统设计」？
  answer: 平台替你实现部分组件，但仍要定义数据身份、用户流程、权限、lineage、SLO、成本和发布策略。Buy 只是改变实现责任，不取消架构责任。
  source_heading: 1. 采用现有平台就不再需要系统设计
- level: 概念辨析
  question: 原文如何解释「16. 支持 Multi-node 就保证 Distributed Training 高效」？
  answer: 还取决于 framework launcher、collective network、data pipeline、topology、checkpoint
    与 scaling efficiency。
  source_heading: 16. 支持 Multi-node 就保证 Distributed Training 高效
- level: 概念辨析
  question: 原文如何解释「31. Experiment Tracking 就是 Online Experimentation」？
  answer: 记录 params/metrics 不等于生产流量随机化、delayed outcome join 和因果分析。
  source_heading: 31. Experiment Tracking 就是 Online Experimentation
- level: 概念辨析
  question: 原文如何解释「45. 原章说 Kubeflow 无 Central Registry，所以今天仍然没有」？
  answer: 当前已有 Kubeflow Hub/Model Registry；但 maturity、scope、artifact bytes 和 KFP integration
    仍需核对。
  source_heading: 45. 原章说 Kubeflow 无 Central Registry，所以今天仍然没有
- level: 概念辨析
  question: 原文如何解释「60. 一次选型可以永久不变」？
  answer: Workload、产品能力、价格、团队技能与法规会变化。应定期复核，但避免无收益的平台迁移。
  source_heading: 60. 一次选型可以永久不变
