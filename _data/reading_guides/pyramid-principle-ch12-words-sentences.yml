  question: 原文围绕「本章定位：把正确结构转换成读者能“看见”的句子」建立了怎样的核心认识？
  question_source: 本章定位：把正确结构转换成读者能“看见”的句子
  thesis: 本章最核心的实践原则是：遇到晦涩句子时，先不要继续润色抽象词，而要问“这里有哪些对象、谁在做什么、什么导致什么”；把答案画成场景或骨架，再用最简单而准确的主语、动词和宾语写出来，使读者能够从文字重建同一关系。
  thesis_source: 本章小结
  concepts:
  - term: 本章定位：把正确结构转换成读者能“看见”的句子
    meaning: 前十一章主要解决思想选择、分组、概括、问题分析及页面呈现。第12章处理最后一公里：已经知道要说什么、按什么顺序说，怎样写成清楚、生动、容易记忆的文字？
    source_heading: 本章定位：把正确结构转换成读者能“看见”的句子
