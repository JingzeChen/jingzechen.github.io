  sections:
  - title: 本章定位：把正确结构转换成读者能“看见”的句子
    source_heading: 本章定位：把正确结构转换成读者能“看见”的句子
    paragraphs:
    - 前十一章主要解决思想选择、分组、概括、问题分析及页面呈现。第12章处理最后一公里：已经知道要说什么、按什么顺序说，怎样写成清楚、生动、容易记忆的文字？
    - 核心不是追求文学修辞，而是让句子中的对象、动作、方向和因果关系可被重建。若作者自己无法想象句子在说什么，读者通常也无法理解。
  - title: 第12章在字里行间呈现金字塔
    source_heading: 第12章在字里行间呈现金字塔
    paragraphs:
    - 金字塔解决第一阶段，视觉化方法帮助第二阶段。二者不可替代：漂亮句子不能修复错误结构，正确结构也不会自动产生清楚句子。
    - 口头解释时，人可以借助手势、停顿、追问和即时改写；书面文字失去这些纠错渠道，所以模糊关系更容易暴露。
    - 原书称人通过图像而非文字进行理性思维，这是一种强调视觉表征价值的强表述，不应理解为所有人、所有任务都只靠视觉图像。
    - 作者沿用早期工作记忆容量观点，说明图像能把大量细节压缩为少数抽象概念。现代研究对具体容量有不同估计，因此不应机械要求“一次七八个概念”。应保留的原则是：减少同时处理的孤立元素，建立有意义组块。
  - title: 十、固定与浮动贷款利率案例
    source_heading: 十、固定与浮动贷款利率案例
    paragraphs:
    - 若风险被高估，银行获得超额收入；
    - 银行可在以后降低贷款利率，把收入回流给借款人；
    - 只有银行近乎永久、系统性高估风险并保留超额收入，固定利率才整体增加借款人成本；
  - title: 三、为什么先找名词
    source_heading: 三、为什么先找名词
    paragraphs:
    - 名词通常代表图中的节点：销售人员、商店、环境、计划、系统、信息、分析。关系则藏在动词、介词和名词化表达中。
    - 但并非所有名词都应保留。“改进、配置、调整、需要”等抽象名词常应还原为动词。
  - title: 十八、名词化为什么使句子晦涩
    source_heading: 十八、名词化为什么使句子晦涩
    paragraphs:
    - "“人员配置的改进”代替“重新部署人员”；"
    - "“准确性的改善”代替“系统生成更准确分析”。"
  - title: 九、方法的局限
    source_heading: 九、方法的局限
    paragraphs:
    - 复杂系统可能需要多图或数学模型；
    - 记忆图像可能添加原文没有的细节；
  - title: 十、补充工具
    source_heading: 十、补充工具
    paragraphs:
    - 主语—动词—宾语检查：恢复行动骨架；
    - 流程图/状态机：表达步骤和状态；
    - 读者复述测试：验证是否能重建关系；
    - 可读性编辑：缩短句子并减少名词化。
  - title: 检查段落
    source_heading: 检查段落
    paragraphs:
    - 段落是否围绕同一稳定图像或骨架？
    - 细节是否按空间、时间或因果顺序加入？
  - title: 适用边界
    source_heading: 适用边界
    paragraphs:
    - 是否涉及法律或科学精度，不能过度简化？
    - 对视觉意象较弱的读者是否仍可理解？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 本章“画脑图”是广义心理意象和关系简图，不等于固定中心辐射式思维导图。
    - 写作像让大军逐个通过狭窄关口，作者有责任提前安排顺序，让读者能在另一端重建结构。
    - 对视觉想象较弱的人，可以使用纸面草图、表格、流程和对象关系清单，方法目标是显式化关系。
    - 本章最核心的实践原则是：遇到晦涩句子时，先不要继续润色抽象词，而要问“这里有哪些对象、谁在做什么、什么导致什么”；把答案画成场景或骨架，再用最简单而准确的主语、动词和宾语写出来，使读者能够从文字重建同一关系。
  takeaways:
  - 核心不是追求文学修辞，而是让句子中的对象、动作、方向和因果关系可被重建。若作者自己无法想象句子在说什么，读者通常也无法理解。
  - 只有银行近乎永久、系统性高估风险并保留超额收入，固定利率才整体增加借款人成本；
  - 记忆图像可能添加原文没有的细节；
  - 细节是否按空间、时间或因果顺序加入？
  - 本章最核心的实践原则是：遇到晦涩句子时，先不要继续润色抽象词，而要问“这里有哪些对象、谁在做什么、什么导致什么”；把答案画成场景或骨架，再用最简单而准确的主语、动词和宾语写出来，使读者能够从文字重建同一关系。
