    source_heading: 十、固定与浮动贷款利率案例
  - term: 十八、名词化为什么使句子晦涩
    meaning: "“准确性的改善”代替“系统生成更准确分析”。"
    source_heading: 十八、名词化为什么使句子晦涩
  - term: 九、方法的局限
    meaning: 复杂系统可能需要多图或数学模型；
    source_heading: 九、方法的局限
  - term: 检查段落
    meaning: 细节是否按空间、时间或因果顺序加入？
    source_heading: 检查段落
  - term: 本章小结
    meaning: 本章最核心的实践原则是：遇到晦涩句子时，先不要继续润色抽象词，而要问“这里有哪些对象、谁在做什么、什么导致什么”；把答案画成场景或骨架，再用最简单而准确的主语、动词和宾语写出来，使读者能够从文字重建同一关系。
    source_heading: 本章小结
