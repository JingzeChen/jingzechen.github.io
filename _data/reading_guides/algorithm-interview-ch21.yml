overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 动态规划的本质是把指数搜索树中表示相同未来问题的结点合并成有限状态，并按依赖拓扑序各求一次。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 本章的分类本质上是在回答“状态下标是什么”：坐标、序列前缀、切分位置、匹配前缀、物品与容量、树结点与父子关系、区间端点，或 Floyd 算法中的中间点集合。
    source_heading: 本章要解决什么问题
  - term: 21.4.1 什么是划分型动态规划
    meaning: 划分型 DP 的关键是“枚举最后一段”，它可能跨越多个位置，所以转移通常不只依赖相邻状态。
    source_heading: 21.4.1 什么是划分型动态规划
  - term: 21.5.2 LeetCode 140：单词拆分 II（★★★）
    meaning: 结果数本身可能指数级，因此总时间至少与输出总字符数成正比。若只判断可行，例 21-4 的布尔 DP 更便宜。
    source_heading: 21.5.2 LeetCode 140：单词拆分 II（★★★）
  - term: 21.7 树型动态规划
    meaning: 树没有天然的线性下标顺序，但选定根后，每条边形成父子关系，子树天然是规模更小且互不重叠的子问题。树型 DP 通常通过 DFS 后序遍历实现：先求所有孩子状态，再合并到父结点。
    source_heading: 21.7 树型动态规划
  - term: 21.8.4 LeetCode 375：猜数字大小 II（★★）
    meaning: 转移：枚举首次猜测值，支付该值后取左右回答分支的较坏成本，再在猜测中取最小。
    source_heading: 21.8.4 LeetCode 375：猜数字大小 II（★★）
  - term: 本章总结
    meaning: 最终检查顺序应固定为：状态句子是否完整，最后一步是否穷尽且互斥，初值是否符合单位元，非法状态是否会误参与，计算顺序是否先求依赖，压缩后循环方向是否保持原阶段。
      这六项能同时回答，动态规划代码才不仅“像是正确”，而是有完整的可证明依据。
    source_heading: 本章总结
