  - 本章要解决什么问题
  - 21.4.1 什么是划分型动态规划
  - 21.4.3 LeetCode 279：完全平方数（★★）
  - 21.7 树型动态规划
  - 21.8.2 LeetCode 516：最长回文子序列（★★）
  - 21.9 Floyd 算法及其应用
  - 本章总结
  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 如何把“相同子问题只求一次”的思想，组织成一组有明确含义、依赖方向和计算顺序的状态。
    - 答案位置：最终答案是某个状态、某行/某区间的极值，还是若干状态之和。
    - 本章的分类本质上是在回答“状态下标是什么”：坐标、序列前缀、切分位置、匹配前缀、物品与容量、树结点与父子关系、区间端点，或 Floyd 算法中的中间点集合。
    - 每个基础单元和正文题都在下一同级标题前给出一个就地 C++17 代码块。
  - title: 21.2 坐标型动态规划
    source_heading: 21.2 坐标型动态规划
    paragraphs:
    - 沿路径数值严格递增，不可能回到旧格，因此把每格视为结点、从小值指向大值后得到 DAG。这一严格单调性就是无后效与可计算顺序的来源。
    - 骑士生命值在任何时刻都必须至少为 1。两条路径即使最终总和相同，中间最低前缀和也可能不同，因此“最大路径总和”不是充分状态。
    - 对距终点的反向拓扑顺序归纳。到终点外需要生命 1；对任一格，最优路径必选择需求较小的合法后继，当前房间值只会统一加到进入后的生命上，公式给出恰好满足该后继且不低于
      1 的最小值。
    - 不能按正向路径和做普通最小/最大 DP，因为状态还必须包含历史最低生命，逆向需求定义正是消除该历史的关键。
  - title: 21.4.1 什么是划分型动态规划
    source_heading: 21.4.1 什么是划分型动态规划
    paragraphs:
    - 划分型 DP 的关键是“枚举最后一段”，它可能跨越多个位置，所以转移通常不只依赖相邻状态。
    - 计算顺序：前缀长度从 2 递增，每次只读取更短前缀。
  - title: 21.4.3 LeetCode 279：完全平方数（★★）
    source_heading: 21.4.3 LeetCode 279：完全平方数（★★）
    paragraphs:
    - 这也可视为“硬币为所有平方数、求最少硬币数”的完全背包；平方数可重复使用。
    - 计算顺序：目标值递增，当前状态只读取更小的非负目标。
  - title: 21.5.2 LeetCode 140：单词拆分 II（★★★）
    source_heading: 21.5.2 LeetCode 140：单词拆分 II（★★★）
    paragraphs:
    - 回溯只枚举这张 DAG 中到 0 的路径，负责输出全部答案。
    - 结果数本身可能指数级，因此总时间至少与输出总字符数成正比。若只判断可行，例 21-4 的布尔 DP 更便宜。
    - 它把 DP 与答案构造结合，通常代码更短；前驱表则更清晰地展示原书的“状态覆盖后回溯”。
    - 计算顺序：先按终点递增建完整前驱表，再从字符串末尾反向枚举路径。
  - title: 21.7 树型动态规划
    source_heading: 21.7 树型动态规划
    paragraphs:
    - 树没有天然的线性下标顺序，但选定根后，每条边形成父子关系，子树天然是规模更小且互不重叠的子问题。树型 DP 通常通过 DFS 后序遍历实现：先求所有孩子状态，再合并到父结点。
    - 向父亲返回的单支状态：必须能通过父子边继续连接，例如二叉树最大路径中的“从当前结点向下的一条链”。
    - 返回值和全局答案常常不是同一个量：一条简单路径向父亲最多延伸到一个孩子，但在当前结点计算完整路径时可以同时连接两个孩子。
    - 正确性：任意简单路径要么完全位于某个孩子子树内，已由递归全局答案覆盖；要么其最高公共祖先为 u，此时路径由 u 的两个最长不同孩子分支组成。
  - title: 21.8.2 LeetCode 516：最长回文子序列（★★）
    source_heading: 21.8.2 LeetCode 516：最长回文子序列（★★）
    paragraphs:
    - 存在一个最长回文子序列可同时使用相等两端；若内部选择不是最长，可替换改善。
    - 转移：端点相等时包住内部状态并加 2；不等时舍弃一个端点取较大值。
    - 初始化：单字符区间长度为 1；空内部区间在相邻端点分支中按 0 处理。
  - title: 21.8.4 LeetCode 375：猜数字大小 II（★★）
    source_heading: 21.8.4 LeetCode 375：猜数字大小 II（★★）
    paragraphs:
    - 转移：枚举首次猜测值，支付该值后取左右回答分支的较坏成本，再在猜测中取最小。
    - 计算顺序：区间长度从 2 递增，左右回答区间都更短。
  - title: 21.9 Floyd 算法及其应用
    source_heading: 21.9 Floyd 算法及其应用
    paragraphs:
    - Floyd-Warshall 算法求所有点对最短路径。它的 DP 阶段不是路径长度或边数，而是“允许哪些顶点作为中间点”。
    - 原文文字边界：OCR 末句出现“求最大路径长度”，上下文和公式均在求最短路径，应理解为最短。
    - DP 没有立即把它们置位，只是低估了已经访问集合的记录，并没有构造非法路线；实际行走已经访问更多顶点。
    - 反过来，任意最优遍历路线按顶点首次出现顺序分段，每段长度至少是端点间 Floyd 最短距离，所以度量闭包上的最优访问顺序不会比真实最优更差；两边结合得到等价性。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 动态规划的本质是把指数搜索树中表示相同未来问题的结点合并成有限状态，并按依赖拓扑序各求一次。
    - 初值是递推的单位元。 空方案常为 1，不可达状态按目标使用无穷、负无穷或假。
    - 顺序必须服从依赖。 网格正/逆序、背包容量方向、区间长度、树后序和 Floyd 中间点都是拓扑序。
    - 最终检查顺序应固定为：状态句子是否完整，最后一步是否穷尽且互斥，初值是否符合单位元，非法状态是否会误参与，计算顺序是否先求依赖，压缩后循环方向是否保持原阶段。
      这六项能同时回答，动态规划代码才不仅“像是正确”，而是有完整的可证明依据。
  takeaways:
  - 动态规划的本质是把指数搜索树中表示相同未来问题的结点合并成有限状态，并按依赖拓扑序各求一次。
  - 初值是递推的单位元。 空方案常为 1，不可达状态按目标使用无穷、负无穷或假。
  - 顺序必须服从依赖。 网格正/逆序、背包容量方向、区间长度、树后序和 Floyd 中间点都是拓扑序。
  - 复杂度等于状态数乘转移成本。 容量型 DP 还需辨别伪多项式复杂度。
  - 最终检查顺序应固定为：状态句子是否完整，最后一步是否穷尽且互斥，初值是否符合单位元，非法状态是否会误参与，计算顺序是否先求依赖，压缩后循环方向是否保持原阶段。
    这六项能同时回答，动态规划代码才不仅“像是正确”，而是有完整的可证明依据。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 状态定义不能只写“dp 表示答案”」？
  answer: 必须说明范围和约束：前 i 个还是以 i 结尾，容量是至多还是恰好，区间端点是否包含，路径长度按边还是结点。状态句子少一个词，初值、转移和答案位置都可能改变。
  source_heading: 1. 状态定义不能只写“dp 表示答案”
- level: 概念辨析
  question: 原文如何解释「4. 计数相加前必须证明来源互斥」？
  answer: 不同路径按最后一步来自上或左分类，不同子序列按是否使用源串最后字符分类。若两类重叠，直接相加会重复计数；若遗漏某类，则会漏解。
  source_heading: 4. 计数相加前必须证明来源互斥
- level: 概念辨析
  question: 原文如何解释「9. 子数组、子串要求连续，子序列不要求」？
  answer: 字符/元素不等时，公共子串状态必须归零；LCS 可以舍弃一侧末字符继承左/上状态。LIS 枚举任意前驱，连续 LIS 只能看前一位置。
  source_heading: 9. 子数组、子串要求连续，子序列不要求
- level: 概念辨析
  question: 原文如何解释「12. 树型 DP 返回值与全局答案可能不同」？
  answer: 二叉树最大路径向父结点只能返回一条分支，但全局候选可连接左右两支；树直径同理。把双支完整路径作为返回值，会在父层形成分叉而不再是简单路径。
  source_heading: 12. 树型 DP 返回值与全局答案可能不同
- level: 概念辨析
  question: 原文如何解释「18. 题目分类不是互斥标签」？
  answer: 完全平方数既可视为划分型，也可视为完全背包；访问所有结点同时使用 Floyd、状态压缩和子集 DP；单词拆分兼有划分与匹配。分类的作用是提供建模入口，不是限制唯一解法。
  source_heading: 18. 题目分类不是互斥标签
