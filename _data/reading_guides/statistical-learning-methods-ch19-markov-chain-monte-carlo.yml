  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: MCMC 用一个以目标分布为平稳分布且满足遍历条件的马尔可夫链，把难以直接抽样和积分的问题转化为相关样本的时间平均；MH 通过接受率建立细致平衡，Gibbs
    则以满条件分布使接受率恒为 1，但正确性之外仍必须认真处理混合、诊断和有效样本量。
  thesis_source: 第 19 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 链走得足够久后，X_t 的边缘分布接近目标分布；遍历定理又保证相关样本的时间平均收敛到目标期望。
    source_heading: 0. 本章解决什么问题
  - term: 19.2 马尔可夫链
    meaning: 定理 19.2 的准确边界【辨析】：原书说“不可约且非周期的有限状态链有唯一平稳分布”，该命题正确，但条件强于唯一性所需。有限不可约已足以保证唯一平稳分布；非周期额外保证从任意初始分布收敛到它。
    source_heading: 19.2 马尔可夫链
  - term: 19.3 马尔可夫链蒙特卡罗法
    meaning: "【辨析】抽稀不等于独立：每隔若干步取一个样本只能降低相关性，通常不能使样本严格独立，而且会丢掉信息。若存储不是瓶颈，保留全部样本并报告
      ESS 通常更好。"
    source_heading: 19.3 马尔可夫链蒙特卡罗法
  - term: 19.5 吉布斯抽样
    meaning: 凡与 x_j 无关的因子都可作为常数丢掉。图模型中只需查看该节点的 Markov blanket（父节点、子节点及子节点的其他父节点），因此
      Gibbs 更新常能局部计算，而不必每次重算完整联合密度。
    source_heading: 19.5 吉布斯抽样
  - term: 19.8 【补充】方法选择与实践边界
    meaning: 变分推断牺牲渐近精确性换取更快的确定性近似。
    source_heading: 19.8 【补充】方法选择与实践边界
  - term: 必须记住的边界
    meaning: 多模式、高相关和受限几何是随机游走 MH/Gibbs 的主要难点。
    source_heading: 必须记住的边界
  logic:
  - 0. 本章解决什么问题
  - 19.1 蒙特卡罗法
  - 19.3 马尔可夫链蒙特卡罗法
  - 19.4 Metropolis-Hastings 算法
