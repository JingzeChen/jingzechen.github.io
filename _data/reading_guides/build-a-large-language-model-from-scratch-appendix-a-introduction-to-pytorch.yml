overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 阅读目标与主线」建立了怎样的核心认识？
  question_source: 0. 阅读目标与主线
  thesis: 每个操作要求 shape、dtype、device 相容。例如 matrix multiplication 要求 inner dimensions
    相同，cross-entropy 要求 class-index labels 在合法范围。
  thesis_source: B. 全附录知识结构
  concepts:
  - term: 0. 阅读目标与主线
    meaning: forward 建立从参数到 loss 的依赖；backward 沿依赖反向应用链式法则。
    source_heading: 0. 阅读目标与主线
  - term: A.4 Automatic Differentiation Made Easy（自动微分）
    meaning: 之所以从 loss 向输入反向算，是因为神经网络通常有一个标量 loss、很多参数。Reverse-mode AD 可以复用中间结果，一次反向遍历得到所有参数对同一标量输出的梯度。
    source_heading: A.4 Automatic Differentiation Made Easy（自动微分）
  - term: A.7 A Typical Training Loop（典型训练循环）
    meaning: Minibatch gradient 是全数据 gradient 的 noisy estimate；较小 batch 更新更频繁、噪声更大，较大
      batch 吞吐通常更好但耗内存，并可能需要调整 learning rate。
    source_heading: A.7 A Typical Training Loop（典型训练循环）
  - term: A.8.3 保存权重不等于恢复训练
    meaning: Checkpoint 是多个状态机的快照，不只是一个 weight file。
    source_heading: A.8.3 保存权重不等于恢复训练
  - term: Summary（原书小结）
    meaning: PyTorch 是开源库，核心由 tensor library、automatic differentiation 和 deep-learning
      utilities 组成。
    source_heading: Summary（原书小结）
  - term: I. 核心结论
    meaning: PyTorch 把 tensor computation、automatic differentiation 和 neural-network
      utilities 统一在一个动态、Python-friendly 系统中。
    source_heading: I. 核心结论
  logic:
  - 0. 阅读目标与主线
  - A.4 Automatic Differentiation Made Easy（自动微分）
  - A.5 Implementing Multilayer Neural Networks（实现多层神经网络）
  - A.8.3 保存权重不等于恢复训练
  - A.9 Optimizing Training Performance with GPUs（用 GPU 优化训练性能）
  - E. 作者分析与解决问题的一般思路
  - I. 核心结论
  sections:
  - title: 0. 阅读目标与主线
    source_heading: 0. 阅读目标与主线
    paragraphs:
    - 参数对 loss 的影响怎样得到？——autograd 与反向传播。
    - 计算怎样迁移到 GPU 并扩展到多卡？——device 与 DDP。
    - forward 建立从参数到 loss 的依赖；backward 沿依赖反向应用链式法则。
    - 多 GPU 数据并行复制模型、切分数据并同步梯度，并不会自动切分模型本身。
  - title: A.2 Understanding Tensors（理解张量）
    source_heading: A.2 Understanding Tensors（理解张量）
    paragraphs:
    - 从数学上，tensor 泛化了 scalar、vector 和 matrix；从 PyTorch 工程视角，它是同质多维数组，附带自动微分和 device
      信息。
    - 其中 b 是每元素 bit 数。相同 shape 下 float32 占 float64 一半内存。现代 GPU 还对 float16/bfloat16
      等低精度有专门吞吐优化，但低精度训练需要关注 underflow、overflow 和算子支持。
    - 当 shape 可从末尾对齐，且每一维相等或其中之一为 1，PyTorch 可虚拟扩展较小 tensor。
    - Broadcast 通常不实际复制数据，但不当 shape 也可能“合法运行却语义错误”，因此仍应检查 shape。
  - title: A.4 Automatic Differentiation Made Easy（自动微分）
    source_heading: A.4 Automatic Differentiation Made Easy（自动微分）
    paragraphs:
    - 偏导固定其他变量，只考察一个变量的微小变化；梯度把所有偏导组成向量。反向传播不是一种不同于链式法则的数学规律，而是将链式法则高效应用于图的算法。
    - 之所以从 loss 向输入反向算，是因为神经网络通常有一个标量 loss、很多参数。Reverse-mode AD 可以复用中间结果，一次反向遍历得到所有参数对同一标量输出的梯度。
    - "“累积”是重要语义：连续调用 backward，PyTorch 默认做加法而不是覆盖。"
    - 它消除了手工链式求导的机械负担，却不替代对模型、loss 和训练过程的判断。
  - title: A.5 Implementing Multilayer Neural Networks（实现多层神经网络）
    source_heading: A.5 Implementing Multilayer Neural Networks（实现多层神经网络）
    paragraphs:
    - 多层 affine transformations 仍可合并成一层 affine transformation，深度没有增加可表达函数类别。ReLU 让不同输入区域采用不同线性映射，使网络能够表示非线性决策边界。
    - ReLU 计算简单、正区梯度为 1，但也有局限：长期处于负区的 unit 梯度为 0，可能成为 dead ReLU。GELU 等平滑激活会在 Transformer
      中更常见。
    - 若同一层所有 neuron 从完全相同的 weight 开始，它们接收相同输入、产生相同输出并得到相同梯度，训练后仍保持相同，等价于只学一个 feature
      detector。随机初始化打破这种 permutation symmetry。
    - 但 dropout 在训练模式随机置零，batch normalization 在训练时更新/使用 batch statistics，在评估时使用 running
      statistics。
  - title: A.7 A Typical Training Loop（典型训练循环）
    source_heading: A.7 A Typical Training Loop（典型训练循环）
    paragraphs:
    - Minibatch gradient 是全数据 gradient 的 noisy estimate；较小 batch 更新更频繁、噪声更大，较大 batch
      吞吐通常更好但耗内存，并可能需要调整 learning rate。
    - Learning rate 太小，loss 降得慢；太大，局部更新可能越过低 loss 区域并振荡或发散。Epoch 太少会 underfit，太多则可能继续记忆训练集并
      overfit。
    - 按 batch 累计使函数不必把整个 dataset 同时放进设备内存。这里将 count 转为 Python integer，避免无意义地保留 device
      tensor；最后对真实样本数求比率。
    - 它适用于每个样本同等重要、类别较平衡、错误成本近似相同的分类。类别极不平衡时，一个永远预测多数类的模型也可能有很高 accuracy；此时还应看 precision、recall、F1、confusion
      matrix、PR-AUC 等。
  - title: A.8.3 保存权重不等于恢复训练
    source_heading: A.8.3 保存权重不等于恢复训练
    paragraphs:
    - Python、NumPy、PyTorch CPU/CUDA RNG states；
    - tokenizer、vocabulary 与模型 config；
    - best validation metric 与训练进度。
    - Checkpoint 是多个状态机的快照，不只是一个 weight file。
  - title: A.9 Optimizing Training Performance with GPUs（用 GPU 优化训练性能）
    source_heading: A.9 Optimizing Training Performance with GPUs（用 GPU 优化训练性能）
    paragraphs:
    - GPU 的优势来自大量并行 arithmetic units 与高内存带宽，特别适合大矩阵乘法。它不是“任何 PyTorch 代码自动更快”：kernel
      launch、CPU-GPU transfer、同步和小 tensor 调度都有固定成本。
    - 正式 benchmark 还应 warm up、重复多次、报告分布，并说明是否包含 host-to-device transfer。若比较纯 matmul，应先将数据放在目标
      device；若评估端到端应用，则必须计入传输和数据加载。
    - 扩大 world size 会改变 effective batch size；若想公平比较收敛，应同时考虑 local batch、learning rate
      和 update count，而不是只比较 epochs。
    - DDP 还会在每张 GPU 放完整模型、optimizer state 和本地 activations。若单个模型本身放不进一张卡，DDP 不能解决显存容量问题；需要
      FSDP/ZeRO、tensor parallelism、pipeline parallelism、offload 或更小模型。
  - title: Summary（原书小结）
    source_heading: Summary（原书小结）
    paragraphs:
    - PyTorch 是开源库，核心由 tensor library、automatic differentiation 和 deep-learning utilities
      组成。
    - PyTorch tensor API 与 NumPy 等 array library 相近。
    - Autograd 让神经网络通过 backpropagation 训练，而不必手工推导每个梯度。
    - Deep-learning utilities 为自定义深度网络提供模块化 building blocks。
  - title: E. 作者分析与解决问题的一般思路
    source_heading: E. 作者分析与解决问题的一般思路
    paragraphs:
    - 作者没有一开始展示 GPT，而是用 1 个 logistic unit 解释 graph/gradient，再用 752 参数 MLP 解释完整训练。最小问题的中间值可以打印、手算和肉眼验证，错误空间远小于大型模型。
    - A.5–A.9 一直使用相同两类数据与相同 MLP，使 CPU、GPU、DDP 的输出可作为 sanity check。扩展硬件路径时保持 model/data/objective
      不变，行为差异更容易归因于并行实现。
    - 先验证这些，再研究 loss，能快速排除 architecture wiring 错误。
    - "“GPU 更快”“4 workers 更快”“8 GPUs 快 8 倍”都只是待验证 hypothesis。可靠优化需要明确 workload、warm-up、同步、传输边界、metric
      和重复次数。"
  - title: I. 核心结论
    source_heading: I. 核心结论
    paragraphs:
    - PyTorch 把 tensor computation、automatic differentiation 和 neural-network utilities
      统一在一个动态、Python-friendly 系统中。
    - Reshape、transpose、matrix multiplication 和 elementwise multiplication 操作不同，不能凭输出
      shape 猜语义。
    - Classification model 通常返回 logits；cross-entropy 内部完成稳定归一化，argmax 也不需要显式 softmax。
    - DDP 改变 effective batch 和执行拓扑，需正确处理 sampler、global metrics、rank-0 I/O 与 scaling
      measurement。
  takeaways:
  - 每个操作要求 shape、dtype、device 相容。例如 matrix multiplication 要求 inner dimensions 相同，cross-entropy
    要求 class-index labels 在合法范围。
  - Reshape、transpose、matrix multiplication 和 elementwise multiplication 操作不同，不能凭输出
    shape 猜语义。
  - Dataset 定义 sample，DataLoader/sampler/collate 定义读取顺序和 batch；职责分离让数据管线可扩展。
  - GPU 加速取决于 workload 与数据移动，不能只凭设备名称推断性能。
  - 本附录的通用方法是从可手算的最小闭环开始，每次只增加一个复杂维度，并用 shape、数值和行为不变量持续验收。
