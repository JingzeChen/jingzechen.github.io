overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 监控系统解决的不是“存几个数字”」建立了怎样的核心认识？
  question_source: 0. 监控系统解决的不是“存几个数字”
  thesis: Alert Manager 的核心是降低噪声并保证送达。 合并、去重、抑制、访问控制、Retry 和渠道路由缺一不可。
  thesis_source: 7. 核心结论
  concepts:
  - term: 0. 监控系统解决的不是“存几个数字”
    meaning: 每条时序持续产生 Sample。即使一个 Sample 很小，千万级时序、高频采样和一年保留也会形成巨量写入与存储。与此同时，故障期间大量工程师打开相同
      Dashboard，告警规则同时查询，读取呈突发性。
    source_heading: 0. 监控系统解决的不是“存几个数字”
  - term: 2.1 五个基本组成
    meaning: Data Collection：从服务器、数据库、队列、缓存等来源采样；
    source_heading: 2.1 五个基本组成
  - term: 3.3 Scale the Metrics Transmission Pipeline
    meaning: 代价：Kafka 运维、额外延迟、重复事件和积压容量。Facebook Gorilla 表明也可让 TSDB 自身在部分网络故障下保持高可用写入，不一定必须有中间队列。
    source_heading: 3.3 Scale the Metrics Transmission Pipeline
  - term: 3.6 TSDB Query Language
    meaning: Group By Labels。
    source_heading: 3.6 TSDB Query Language
  - term: 3.11.5 “至少一次通知”的真实含义
    meaning: Kafka 与 Retry 可让通知尝试至少一次，但第三方收到后 ACK 丢失会导致重复。渠道调用应携带 Idempotency Key；值班系统不能假设绝不重复。
    source_heading: 3.11.5 “至少一次通知”的真实含义
  - term: 8. 解决指标监控与告警问题的一般思路
    meaning: 本章最值得迁移的方法是：从 Time Series Cardinality 和 Sampling Rate 而非“机器数”估算规模；让成熟
      TSDB 处理时间索引与压缩，再围绕采集故障、查询突发和告警状态建立可靠管道。
    source_heading: 8. 解决指标监控与告警问题的一般思路
