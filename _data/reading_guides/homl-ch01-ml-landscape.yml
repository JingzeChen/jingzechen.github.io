overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章目标」建立了怎样的核心认识？
  question_source: 本章目标
  thesis: 预训练模型通常不是最终目标。模型先通过自监督任务学习通用表示，再在少量有标签数据上为实际任务进行微调（fine-tuning）。把一个任务学到的知识应用到另一个任务称为迁移学习（transfer
    learning）。
  thesis_source: 4. 机器学习系统的三套分类维度
  concepts:
  - term: 本章目标
    meaning: 正确说明训练集、验证集、测试集和 train-dev 集的作用。
    source_heading: 本章目标
  - term: 2. 为什么使用机器学习
    meaning: 以垃圾邮件过滤为例，传统方法需要人工维护“free”“credit card”等规则。如果垃圾邮件发送者改变写法，规则也必须持续修改。机器学习模型能够从用户最新标注的数据中发现新模式，并通过重新训练适应变化。
    source_heading: 2. 为什么使用机器学习
  - term: 5.2 训练
    meaning: 代价函数/损失函数衡量模型有多差，目标是最小化。
    source_heading: 5.2 训练
  - term: 6. 一个典型的机器学习工作流
    meaning: 用模型对新实例做预测，即推理（inference）；
    source_heading: 6. 一个典型的机器学习工作流
  - term: 8. 测试、验证与模型选择
    meaning: "“没有免费的午餐”定理指出：如果对数据完全不做假设，就没有理由事先认为某种模型一定优于其他模型。实践中无法评估所有模型，因此应根据问题做合理假设，再比较少数合适的候选模型。"
    source_heading: 8. 测试、验证与模型选择
  - term: 12. 建议实践
    meaning: 为“使用网络图片训练手机花卉识别应用”的场景，画出 Train、Train-dev、Dev、Test 四个集合的数据来源和用途。
    source_heading: 12. 建议实践
  logic:
  - 本章目标
  - 2. 为什么使用机器学习
  - 4. 机器学习系统的三套分类维度
  - 6. 一个典型的机器学习工作流
  - 7. 机器学习的主要挑战
  - 11. 学习检查清单
  - 12. 建议实践
  sections:
  - title: 本章目标
    source_heading: 本章目标
    paragraphs:
    - 从监督方式、训练方式和泛化方式三个维度描述一个机器学习系统；
    - 区分分类、回归、聚类、降维和异常检测等任务；
    - 识别数据不足、采样偏差、过拟合和欠拟合等常见问题；
    - 正确说明训练集、验证集、测试集和 train-dev 集的作用。
  - title: 1.1 三种互补的定义
    source_heading: 1.1 三种互补的定义
    paragraphs:
    - Arthur Samuel 的定义：机器学习使计算机无须被显式编程，也能获得学习能力。
    - Tom Mitchell 的工程定义：如果一个程序在任务 T 上的表现（由指标 P 衡量）随着经验 E 增加而改善，就称该程序从经验中学习。
  - title: 2. 为什么使用机器学习
    source_heading: 2. 为什么使用机器学习
    paragraphs:
    - 以垃圾邮件过滤为例，传统方法需要人工维护“free”“credit card”等规则。如果垃圾邮件发送者改变写法，规则也必须持续修改。机器学习模型能够从用户最新标注的数据中发现新模式，并通过重新训练适应变化。
    - 规则繁多且维护成本高：模型可能用更少的代码获得更好效果；
    - 需要从海量数据中发现规律：通过数据挖掘获得新的洞察。
    - 如果问题能用少量稳定、透明的规则可靠解决，传统程序通常更简单。使用机器学习还会引入数据获取、训练、评估、部署、监控和再训练等成本。
  - title: 4. 机器学习系统的三套分类维度
    source_heading: 4. 机器学习系统的三套分类维度
    paragraphs:
    - 降维中的特征提取会组合多个相关特征，得到更有意义的新特征。例如汽车年龄与里程可能被合并为“磨损程度”。降维可以降低内存和计算开销，有时还能改善模型效果，但不应默认它一定提升精度。
    - 预训练模型通常不是最终目标。模型先通过自监督任务学习通用表示，再在少量有标签数据上为实际任务进行微调（fine-tuning）。把一个任务学到的知识应用到另一个任务称为迁移学习（transfer
      learning）。
    - 现实世界持续变化，而模型保持不变，性能会逐渐下降。这叫数据漂移（data drift）或模型老化（model rot）。即使猫狗本身没变，摄像设备、图片格式和用户偏好也可能变化，因此仍需监控并定期再训练。
    - 最后一种情况称为核外学习（out-of-core learning）：每次加载一部分数据并执行训练，直到遍历全部数据。核外学习经常在离线环境运行，因此“在线”不等于“必须连接互联网”或“必须在生产环境实时训练”。
  - title: 5.2 训练
    source_heading: 5.2 训练
    paragraphs:
    - 效用函数/适应度函数衡量模型有多好，目标是最大化；
    - 代价函数/损失函数衡量模型有多差，目标是最小化。
  - title: 6. 一个典型的机器学习工作流
    source_heading: 6. 一个典型的机器学习工作流
    paragraphs:
    - 训练模型，让算法搜索能最小化损失的参数；
    - 用模型对新实例做预测，即推理（inference）；
  - title: 7. 机器学习的主要挑战
    source_heading: 7. 机器学习的主要挑战
    paragraphs:
    - 大多数算法需要大量数据。简单问题可能需要数千个样本，图像和语音等复杂问题可能需要数百万个样本，除非可以使用迁移学习。
    - 研究表明，当数据足够多时，不同算法在一些复杂任务上的表现可能趋于接近。这说明投入资源建设高质量数据集，有时比持续改进算法更有效。但现实中获得额外数据往往昂贵，因此算法选择仍然重要。
    - 书中的 GDP 示例只使用中间收入范围的国家，遗漏很穷和很富的国家，导致线性趋势看起来比实际更强。这说明更多数据不仅会改变参数，也可能推翻原先的模型假设。
    - 正则化（regularization）通过限制模型自由度降低过拟合风险。限制过弱可能继续过拟合，限制过强则可能欠拟合。正则化强度通常是超参数。
  - title: 8. 测试、验证与模型选择
    source_heading: 8. 测试、验证与模型选择
    paragraphs:
    - 常见做法是 80% 用于训练，20% 用于测试，但比例应根据数据量决定。如果有一千万条数据，保留 1% 就有十万条测试样本，通常已经足够。
    - 如果反复使用测试集选择模型和调节超参数，模型和开发决策会逐渐适应该测试集，测试集便不再代表真正未知的数据。这相当于对测试集过拟合。
    - 训练数据与真实生产数据可能来自不同分布。例如，训练花卉识别模型时可以下载大量网络图片，但应用上线后收到的是手机现场拍摄的图片。
    - "“没有免费的午餐”定理指出：如果对数据完全不做假设，就没有理由事先认为某种模型一定优于其他模型。实践中无法评估所有模型，因此应根据问题做合理假设，再比较少数合适的候选模型。"
  - title: 11. 学习检查清单
    source_heading: 11. 学习检查清单
    paragraphs:
    - 能用 E、T、P 描述一个实际机器学习系统
    - 能判断一个任务是分类、回归、聚类还是异常检测
    - 能解释监督、无监督、半监督、自监督和强化学习
    - 能使用 train-dev 集区分过拟合与数据不匹配
  - title: 12. 建议实践
    source_heading: 12. 建议实践
    paragraphs:
    - 用少量带噪声数据分别拟合线性模型和高阶多项式模型，比较训练误差与验证误差。
    - 为“使用网络图片训练手机花卉识别应用”的场景，画出 Train、Train-dev、Dev、Test 四个集合的数据来源和用途。
  takeaways:
  - 正确说明训练集、验证集、测试集和 train-dev 集的作用。
  - 如果问题能用少量稳定、透明的规则可靠解决，传统程序通常更简单。使用机器学习还会引入数据获取、训练、评估、部署、监控和再训练等成本。
  - 用模型对新实例做预测，即推理（inference）；
  - "“没有免费的午餐”定理指出：如果对数据完全不做假设，就没有理由事先认为某种模型一定优于其他模型。实践中无法评估所有模型，因此应根据问题做合理假设，再比较少数合适的候选模型。"
  - 为“使用网络图片训练手机花卉识别应用”的场景，画出 Train、Train-dev、Dev、Test 四个集合的数据来源和用途。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「9.1 分类维度不是互斥选项」？
  answer: "“监督/无监督”“批量/在线”“实例/模型”属于不同维度。不要问“这个系统到底是监督学习还是在线学习”，因为它可以两者都是。"
  source_heading: 9.1 分类维度不是互斥选项
- level: 概念辨析
  question: 原文如何解释「9.2 在线学习不等于联网学习」？
  answer: 在线学习的核心是增量更新。核外学习也使用在线算法，但训练过程完全可以离线进行。
  source_heading: 9.2 在线学习不等于联网学习
- level: 概念辨析
  question: 原文如何解释「9.4 模型参数与超参数不同」？
  answer: 模型参数由训练算法从数据中学得；超参数控制学习过程或模型结构，需要在训练前设定，并通过验证过程选择。
  source_heading: 9.4 模型参数与超参数不同
- level: 概念辨析
  question: 原文如何解释「9.5 验证集与测试集不同」？
  answer: 验证集服务于开发决策，可以重复使用；测试集服务于最终无偏评估，不应参与模型选择。
  source_heading: 9.5 验证集与测试集不同
- level: 概念辨析
  question: 原文如何解释「9.6 训练表现好不等于模型好」？
  answer: 机器学习的目标是泛化。训练误差很低但测试误差很高，恰恰可能说明模型过拟合。
  source_heading: 9.6 训练表现好不等于模型好
