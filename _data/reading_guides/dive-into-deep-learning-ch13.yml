overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章要解决的核心问题」建立了怎样的核心认识？
  question_source: 1. 本章要解决的核心问题
  thesis: 连续访问、batching、tiling、融合和 cache 复用是跨 RAM、SSD、GPU 与网络的共同原则。
  thesis_source: 14. 核心结论与解决性能问题的一般思路
  concepts:
  - term: 1. 本章要解决的核心问题
    meaning: 优化性能不是只让某一项变小，而是缩短整个关键路径。若通信已被计算完全隐藏，继续优化通信未必降低墙钟时间；若 GPU 在等数据，提高峰值 FLOPS
      也无济于事。
    source_heading: 1. 本章要解决的核心问题
  - term: 2.4 script、trace、运行时编译与导出
    meaning: shape 相关 Python 分支。
    source_heading: 2.4 script、trace、运行时编译与导出
  - term: 4.3 单设备并行的限制
    meaning: 并发还可能因 cache、内存带宽和 SM 竞争变慢，所以必须 profiler 验证。
    source_heading: 4.3 单设备并行的限制
  - term: 4.6 如何验证并行真的发生
    meaning: CPU profiler 和 I/O trace。
    source_heading: 4.6 如何验证并行真的发生
  - term: 8. 参数服务器与分布式同步
    meaning: 原书以 8 张 V100、160 MB 和多个 NVLink 通道估算约 6 ms。其单 link、单向/双向和聚合带宽口径存在混用，应用公式时必须用实际拓扑和
      NCCL 报告的有效带宽。
    source_heading: 8. 参数服务器与分布式同步
  - term: 14. 核心结论与解决性能问题的一般思路
    meaning: 本章的主线可以概括为：性能来自缩短关键路径，而不是盲目增加设备。编译减少前端开销，异步队列隐藏调用延迟，依赖图暴露并行，硬件层级决定数据应如何分块与复用，数据并行把样本分给多
      GPU，集合通信按拓扑高效聚合梯度，参数服务器再将同步扩展到多机。每一次加速都必须回答三个问题：工作是否真的完成、数学语义是否仍相同、优化的是否位于关键路径。
    source_heading: 14. 核心结论与解决性能问题的一般思路
  logic:
  - 1. 本章要解决的核心问题
  - 2.4 script、trace、运行时编译与导出
  - 2.6 正确比较编译前后性能
  - 4.6 如何验证并行真的发生
  - 6. 从零实现多 GPU 训练
  - 10. 可运行的综合 PyTorch 实验
