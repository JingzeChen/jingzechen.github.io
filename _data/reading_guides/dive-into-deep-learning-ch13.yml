  sections:
  - title: 1. 本章要解决的核心问题
    source_heading: 1. 本章要解决的核心问题
    paragraphs:
    - 优化性能不是只让某一项变小，而是缩短整个关键路径。若通信已被计算完全隐藏，继续优化通信未必降低墙钟时间；若 GPU 在等数据，提高峰值 FLOPS 也无济于事。
    - 再认识设备计算是异步的，避免错误计时和过度阻塞；
    - 将一个 batch 拆到多 GPU，明确参数复制、梯度聚合和更新语义；
    - 扩展到跨机器通信，按拓扑选择 ring、层次归约或参数服务器。
  - title: 2.2 符号式程序怎样执行
    source_heading: 2.2 符号式程序怎样执行
    paragraphs:
    - dead code elimination；
    - 内存生命周期分析与 buffer 复用；
    - 动态 shape 可能触发重编译或保守代码；
    - Python 副作用和数据相关分支可能改变语义。
  - title: 2.4 script、trace、运行时编译与导出
    source_heading: 2.4 script、trace、运行时编译与导出
    paragraphs:
    - Tensor 转 Python 标量；
    - Python list/dict 副作用；
    - shape 相关 Python 分支。
  - title: 2.6 正确比较编译前后性能
    source_heading: 2.6 正确比较编译前后性能
    paragraphs:
    - 固定设备、dtype、shape 和线程数；
    - 分别预热 eager 与 compiled 路径；
    - GPU 计时前后同步或用 CUDA Event；
    - 测动态 shape 与真实 batch；
  - title: 4.3 单设备并行的限制
    source_heading: 4.3 单设备并行的限制
    paragraphs:
    - kernel 较小，单个任务无法占满设备；
    - 一个任务 compute-bound，另一个使用 copy engine；
    - 并发还可能因 cache、内存带宽和 SM 竞争变慢，所以必须 profiler 验证。
  - title: 4.6 如何验证并行真的发生
    source_heading: 4.6 如何验证并行真的发生
    paragraphs:
    - CPU profiler 和 I/O trace。
    - kernel 是否在不同 streams 重叠；
    - H2D/D2H 是否与 compute 重叠；
    - allreduce 是否在 backward 完成前启动；
  - title: 6. 从零实现多 GPU 训练
    source_heading: 6. 从零实现多 GPU 训练
    paragraphs:
    - 不同层放在不同 GPU。优点是单卡无需容纳完整模型；缺点是层间 activation 和反向梯度频繁传输，若不做 microbatch pipeline
      会有大量 bubble。
    - 等大小 shard 时是全局 mean 的 k 倍；应再除 world size，或 collective 直接 average。Shard 大小不等时还需按样本数加权，不能简单平均每卡
      mean。
    - 原书从零实验固定全局 batch 256、学习率 0.2，从 1 卡变 2 卡，所以数学优化近似相同，但每卡工作减半；模型太小导致没有有意义加速。
    - 原书“每卡保留一个 BatchNorm coefficient”过于简化；running mean/variance 和训练统计都要明确。
  - title: 8. 参数服务器与分布式同步
    source_heading: 8. 参数服务器与分布式同步
    paragraphs:
    - 该分析忽略 latency、拓扑争用、协议和不能完全并行的链路，但准确揭示：分片能消除中心热点并利用聚合带宽。
    - 原书以 8 张 V100、160 MB 和多个 NVLink 通道估算约 6 ms。其单 link、单向/双向和聚合带宽口径存在混用，应用公式时必须用实际拓扑和
      NCCL 报告的有效带宽。
    - 密集同步深度学习如今通常使用 DDP collective 而非中心化参数服务器；参数服务器仍常见于稀疏 embedding、异步在线学习和弹性场景。
    - 它们可能改变数学语义、数值误差或收敛，应与单纯系统优化区分。梯度累积减少 collective 频率，但不能提高单 step 的数据并行计算能力；BatchNorm
      和随机层语义也可能不同。
  - title: 10. 可运行的综合 PyTorch 实验
    source_heading: 10. 可运行的综合 PyTorch 实验
    paragraphs:
    - 将 batch 切成 shards 后聚合 loss-sum 梯度，与完整 batch mean 梯度严格一致；
    - 若本机有 CUDA，脚本还会用正确同步方式做一个小型 GPU 计时示范；没有 CUDA 时自动跳过。
    - LeNet shape 与原书一致，参数数为 129068、float32 约 516272 bytes；
    - 11 个样本不均匀分成 3 shards，局部 loss-sum 梯度归约后除总样本数，仍与全 batch mean 严格一致；
  - title: 14. 核心结论与解决性能问题的一般思路
    source_heading: 14. 核心结论与解决性能问题的一般思路
    paragraphs:
    - 参数服务器用 key-wise push/pull 隐藏分片与同步复杂度，适合稀疏和异步场景；密集同步训练多用 collective。
    - 核对梯度缩放：local reduction、allreduce sum/average、global batch 和累积步数。
    - 按拓扑选 collective：ring、tree、hierarchical 或 reduce-scatter/all-gather。
    - 本章的主线可以概括为：性能来自缩短关键路径，而不是盲目增加设备。编译减少前端开销，异步队列隐藏调用延迟，依赖图暴露并行，硬件层级决定数据应如何分块与复用，数据并行把样本分给多
      GPU，集合通信按拓扑高效聚合梯度，参数服务器再将同步扩展到多机。每一次加速都必须回答三个问题：工作是否真的完成、数学语义是否仍相同、优化的是否位于关键路径。
  takeaways:
  - 模型数学计算相同，不代表实现成本相同；调度、内存和通信常比算术本身更关键。
  - Loss 的 sum/mean、world size 和不等 shard 权重决定梯度是否与单卡全 batch 等价。
  - 先做数量级估算：FLOPs、bytes、算术强度、消息大小和理论下界。
  - 单机多卡先选数据并行：确认每卡模型可容纳，再考虑 DDP。
  - 本章的主线可以概括为：性能来自缩短关键路径，而不是盲目增加设备。编译减少前端开销，异步队列隐藏调用延迟，依赖图暴露并行，硬件层级决定数据应如何分块与复用，数据并行把样本分给多
    GPU，集合通信按拓扑高效聚合梯度，参数服务器再将同步扩展到多机。每一次加速都必须回答三个问题：工作是否真的完成、数学语义是否仍相同、优化的是否位于关键路径。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.1 编译就是把 Python 变成更快的 Python」？
  answer: 编译通常捕获 tensor 程序并生成/选择后端执行图，Python 副作用和任意动态行为未必进入图。
  source_heading: 11.1 编译就是把 Python 变成更快的 Python
- level: 概念辨析
  question: 原文如何解释「11.10 non_blocking=True 保证拷贝与计算重叠」？
  answer: 还需 pinned memory、copy engine、合适 stream 和依赖；必须用时间线验证。
  source_heading: 11.10 non_blocking=True 保证拷贝与计算重叠
- level: 概念辨析
  question: 原文如何解释「11.22 多 GPU 会自动线性加速」？
  answer: 通信、串行部分、数据加载和 straggler 使 scaling efficiency 下降。
  source_heading: 11.22 多 GPU 会自动线性加速
- level: 概念辨析
  question: 原文如何解释「11.28 增加 GPU 后 batch 和学习率都应固定」？
  answer: 取决于 strong/weak scaling 目标。保持全局 batch 与保持每卡 batch 是不同实验。
  source_heading: 11.28 增加 GPU 后 batch 和学习率都应固定
- level: 概念辨析
  question: 原文如何解释「11.40 保存模型权重就能无缝恢复分布式训练」？
  answer: 还需 optimizer、scheduler、AMP、step、RNG、sampler 和分片元数据。
  source_heading: 11.40 保存模型权重就能无缝恢复分布式训练
