  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 纵向箭头：每个状态”发射”一个观测（由矩阵 B 描述）；
    - 横向箭头：状态之间按马尔可夫链转移（由矩阵 A 描述）。
  - title: "【补充】前置知识"
    source_heading: "【补充】前置知识"
    paragraphs:
    - 阅读本章前，需要先理解马尔可夫链。这部分原书未展开，但不搞清楚会影响对”齐次马尔可夫性假设”的理解。
    - 形象比喻：下棋时，只要看到当前棋盘局面就能决定下一步怎么走，不需要知道这个局面是怎么一步步走到的。
    - 直觉：状态 i_t 是信息传递的”咽喉要道”。所有从过去流向未来的信息都必须经过它，一旦 i_t 已知，这条通路就被”堵住”了。
  - title: 10.1 隐马尔可夫模型的基本概念
    source_heading: 10.1 隐马尔可夫模型的基本概念
    paragraphs:
    - 定义 10.1（隐马尔可夫模型） 隐马尔可夫模型是关于时序的概率模型，描述由一个隐藏的马尔可夫链随机生成不可观测的状态序列，再由各个状态生成一个观测从而产生观测序列的过程。
    - 这个假设意味着什么？ 状态的演化是”无记忆”的。例如词性标注中，它假设当前词性只取决于前一个词性，与更早的词性无关——这显然是近似（真实语言中有长距离依赖），但换来了巨大的计算便利。
    - 这个假设意味着什么？ 观测之间没有直接联系，它们的相关性完全通过隐状态传递。词性标注中，它假设”给定词性后，这个位置出现哪个词与上下文的词无关”——这也是近似（真实语言中词与词有搭配关系）。
    - 按如下规则转移到下一个盒子： 当前是盒子 1 → 下一个一定是盒子 2； 当前是盒子 2 或 3 → 分别以概率 0.4 和 0.6 转移到左边或右边的盒子；
      当前是盒子 4 → 各以 0.5 的概率停留在盒子 4 或转移到盒子 3；
  - title: 10.2 概率计算算法
    source_heading: 10.2 概率计算算法
    paragraphs:
    - 这与第 5 章决策树剪枝、第 7 章 SMO 的设计哲学一致：发现结构中的重复，用记忆化消除它。
    - 为什么可以压缩？ 因为由马尔可夫性，未来只依赖当前状态，不依赖”怎么走到当前状态的”。所以到达 q_i 的所有路径，对未来而言是等价的，可以合并成一个数。
    - 这些量是 10.3 节 Baum-Welch 算法的直接输入，所以本节是承上启下的关键。
    - 注意这是条件概率（给定了整个观测序列 O），也称为平滑概率（smoothed probability）。
  - title: 10.3 学习算法
    source_heading: 10.3 学习算法
    paragraphs:
    - 例如词性标注需要语言学专家逐词标注，语音识别需要标注每一帧对应的音素。因此实践中常常只有观测序列，必须用无监督方法。
    - "【补充】历史顺序：Baum 和 Welch 在 1970 年提出该算法，比 Dempster 等人 1977 年总结出 EM 框架更早。也就是说，Baum-Welch
      是 EM 的一个先驱特例，后来才被纳入统一框架。这也解释了为什么它有自己的名字。"
    - 直观解释：新的初始概率 = “第 1 时刻处于状态 q_i 的后验概率”。
    - 若 B 初始化为完全均匀，所有状态在数学上等价，EM 无法区分它们（对称性无法打破）——这与第 9 章混合朴素贝叶斯初始化的注意事项完全一致。
  - title: 10.4 预测算法
    source_heading: 10.4 预测算法
    paragraphs:
    - 不能保证预测的状态序列整体是最有可能的状态序列，因为预测的状态序列可能有实际不发生的部分。事实上，上述方法得到的状态序列中有可能存在转移概率为 0 的相邻状态。
    - 在时刻 1 选状态 1 是因为”很多路径在时刻 1 经过状态 1”，在时刻 2 选状态 3 是因为”很多路径在时刻 2 经过状态 3”，但这两批路径可能完全没有交集。
    - 在自然语言处理中这两种解码分别叫 posterior decoding（后验解码）和 Viterbi decoding（维特比解码）。原书说”尽管如此，近似算法仍然是有用的”，指的就是前一类场景。
    - 因为马尔可夫性：给定 i_t，路径的”未来部分”的概率与”过去部分怎么走的”无关。所以可以把”从起点到 i_t 的最优走法”和”从 i_t 到终点的最优走法”独立地优化。
  - title: 10.6 【补充】深入理解
    source_heading: 10.6 【补充】深入理解
    paragraphs:
    - 所以两者的观测独立性假设是完全同源的——都是为了让联合概率能分解成连乘。
    - 前一个词是什么（”the” 后面多半是名词）
    - 错。这正是 10.4.1 节反例说明的：维特比给出的是整条路径最优，单看某个位置未必是该位置最可能的状态。
    - 但 HMM 至今仍有价值：参数少、可解释、小数据下稳健、有精确推断算法。在数据稀缺或需要可解释性的场景（如生物序列分析）仍在使用。
  - title: 10.7 本章方法论总结
    source_heading: 10.7 本章方法论总结
    paragraphs:
    - HMM 用隐藏的马尔可夫链生成不可观测的状态序列，再由状态生成观测序列。
    - 两个基本假设：齐次马尔可夫性、观测独立性。它们是 HMM 的全部代价，也是可计算性的全部来源。
    - Baum-Welch 就是 EM 在 HMM 上的具体化，历史上比 EM 框架更早提出。
    - 近似算法逐点最优，可能给出转移概率为 0 的非法路径；维特比保证整体最优。
  takeaways:
  - 横向箭头：状态之间按马尔可夫链转移（由矩阵 A 描述）。
  - 按如下规则转移到下一个盒子： 当前是盒子 1 → 下一个一定是盒子 2； 当前是盒子 2 或 3 → 分别以概率 0.4 和 0.6 转移到左边或右边的盒子；
    当前是盒子 4 → 各以 0.5 的概率停留在盒子 4 或转移到盒子 3；
  - 若 B 初始化为完全均匀，所有状态在数学上等价，EM 无法区分它们（对称性无法打破）——这与第 9 章混合朴素贝叶斯初始化的注意事项完全一致。
  - 因为马尔可夫性：给定 i_t，路径的”未来部分”的概率与”过去部分怎么走的”无关。所以可以把”从起点到 i_t 的最优走法”和”从 i_t 到终点的最优走法”独立地优化。
  - 近似算法逐点最优，可能给出转移概率为 0 的非法路径；维特比保证整体最优。
