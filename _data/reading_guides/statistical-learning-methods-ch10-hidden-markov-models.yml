    meaning: 直觉：状态 i_t 是信息传递的”咽喉要道”。所有从过去流向未来的信息都必须经过它，一旦 i_t 已知，这条通路就被”堵住”了。
    source_heading: "【补充】前置知识"
  - term: 10.2 概率计算算法
    meaning: 为什么可以压缩？ 因为由马尔可夫性，未来只依赖当前状态，不依赖”怎么走到当前状态的”。所以到达 q_i 的所有路径，对未来而言是等价的，可以合并成一个数。
    source_heading: 10.2 概率计算算法
  - term: 10.3 学习算法
