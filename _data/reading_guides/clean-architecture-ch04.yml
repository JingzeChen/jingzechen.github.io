overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 纯功能分解无法独自解决共享数据、组件依赖和并发问题，需要其他范式与架构原则补充。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 本章的重点不是要求开发者为每个函数写数学证明，而是理解：限制控制流，使程序能够被分解、理解和测试。
    source_heading: 本章导读
  - term: 2.6 三种结构为什么适合逐层分析
    meaning: 原书用枚举和归纳描述这些证明方法。日常开发不一定写出形式证明，但这些问题仍然是设计循环与测试边界时的重要思路。
    source_heading: 2.6 三种结构为什么适合逐层分析
  - term: 5.2 形式证明没有普及，不等于没有价值
    meaning: 原书说「证明没有到来」，主要指它们没有成为普通应用开发中验证每个函数的主流方式，而不是形式方法已经死亡。
    source_heading: 5.2 形式证明没有普及，不等于没有价值
  - term: 6.1 作者为何转向科学方法
    meaning: 既然完整数学证明没有成为日常实践，作者转向另一种可靠知识获取方式：科学方法。
    source_heading: 6.1 作者为何转向科学方法
  - term: 8. Conclusion
    meaning: 结构化编程最持久的价值，不是让代码看起来整齐，而是让程序能够被分解成容易提出明确主张、容易尝试证伪的单元。
    source_heading: 8. Conclusion
  - term: 本章总结
    meaning: Yourdon、Constantine、DeMarco 和 Page-Jones 等人在 70 至 80 年代推广结构化分析与设计。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 2.6 三种结构为什么适合逐层分析
  - 3. A Harmful Proclamation
  - 6.1 作者为何转向科学方法
  - 6.4 作者对科学的描述需要怎样理解
  - 检查可测试性
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Dijkstra 希望把编程发展成能够证明正确性的学科；
    - 顺序、选择和迭代既足以表达所有程序，又适合逐层分析；
    - 可测试、可证伪的单元也成为架构划分模块和组件的重要标准。
    - 本章的重点不是要求开发者为每个函数写数学证明，而是理解：限制控制流，使程序能够被分解、理解和测试。
  - title: 2.2 为什么程序证明很困难
    source_heading: 2.2 为什么程序证明很困难
    paragraphs:
    - 程序越复杂，可能路径越多。若控制流可以任意跳转，证明者甚至难以确定一个代码片段从哪里进入、到哪里离开。
    - Dijkstra 因此先研究：什么样的控制结构允许程序被反复拆成较小、可分析的单元？
  - title: 2.6 三种结构为什么适合逐层分析
    source_heading: 2.6 三种结构为什么适合逐层分析
    paragraphs:
    - 可以依次检查每个步骤：前一步是否产生下一步所需条件，最后是否得到期望结果。
    - 可以分别检查每个分支：条件成立时是否正确，条件不成立时是否也正确，所有可能路径是否覆盖。
    - 原书用枚举和归纳描述这些证明方法。日常开发不一定写出形式证明，但这些问题仍然是设计循环与测试边界时的重要思路。
  - title: 3. A Harmful Proclamation
    source_heading: 3. A Harmful Proclamation
    paragraphs:
    - 1968 年 3 月，Dijkstra 在 CACM 发表一封致编辑的信，标题是 Go To Statement Considered Harmful。
    - 当时没有互联网，人们通过学术期刊和编辑来信争辩，有些支持，有些非常负面。
    - 它们不像早期 Fortran 或 COBOL 中的任意跳转，可以无视代码块边界跳往远处。
    - 当然，受控结构也能被滥用。一个函数有大量早返回、异常被当成普通分支、循环嵌套过深，仍会难以理解。关键是控制转移是否保持清楚边界。
  - title: 5.2 形式证明没有普及，不等于没有价值
    source_heading: 5.2 形式证明没有普及，不等于没有价值
    paragraphs:
    - 现代类型系统、静态分析、模型检查和证明助手，也在不同程度上继承了 Dijkstra 的目标。
    - 原书说「证明没有到来」，主要指它们没有成为普通应用开发中验证每个函数的主流方式，而不是形式方法已经死亡。
  - title: 6.1 作者为何转向科学方法
    source_heading: 6.1 作者为何转向科学方法
    paragraphs:
    - 既然完整数学证明没有成为日常实践，作者转向另一种可靠知识获取方式：科学方法。
    - 经验科学不断设计实验，尝试推翻理论；
    - 一个理论经受大量反驳尝试后，被认为在当前范围内足够可靠。
  - title: 6.4 作者对科学的描述需要怎样理解
    source_heading: 6.4 作者对科学的描述需要怎样理解
    paragraphs:
    - 科学还涉及模型、测量、预测和证据累积；
    - 软件既有可形式化部分，也有经验运行部分；
    - 测试、类型、静态分析、代码评审和形式方法可以互补。
    - 因此，不必把本章理解为「软件不是数学，所以证明无用」。重点是：日常软件可靠性主要通过不断尝试暴露错误来建立。
  - title: 8. Conclusion
    source_heading: 8. Conclusion
    paragraphs:
    - 结构化编程最持久的价值，不是让代码看起来整齐，而是让程序能够被分解成容易提出明确主张、容易尝试证伪的单元。
    - 作者最后指出，架构师为了建立可测试的组件，会在更高层使用类似结构化编程的限制纪律。
    - 用 SOLID 限制类与模块职责；
    - 用架构边界限制高层政策对细节的认知。
  - title: 检查可测试性
    source_heading: 检查可测试性
    paragraphs:
    - 单元是否有明确输入和可观察输出？
    - 测试是否覆盖边界、失败和历史缺陷？
    - 测试是否主动寻找反例，而非只走成功路径？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 顺序可逐步检查，选择可分别检查各分支，迭代需检查初始、保持、进展与退出条件。
    - 1968 年 Dijkstra 发表 Go To Statement Considered Harmful，引发持续约十年的争论。
    - Yourdon、Constantine、DeMarco 和 Page-Jones 等人在 70 至 80 年代推广结构化分析与设计。
    - 纯功能分解无法独自解决共享数据、组件依赖和并发问题，需要其他范式与架构原则补充。
  takeaways:
  - Dijkstra 在编程尚未成为公认职业的年代，试图为它建立科学纪律。
  - 三种结构既足够表达程序又便于分析，这一结合催生了结构化编程。
  - Dijkstra 设想的欧几里得式程序证明体系没有成为普通软件开发的主流。
  - 清晰输入输出、有限路径、可替换依赖和较少隐藏状态，使程序单元更容易证伪。
  - 后续架构原则延续同一方法：主动限制自由，以获得更容易验证和演进的软件结构。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 结构化编程就是完全禁止 goto」？
  answer: 核心是限制不受约束的控制转移。局部、受限跳转可能有合理用途，但必须保持可理解边界。
  source_heading: 1. 结构化编程就是完全禁止 goto
- level: 概念辨析
  question: 原文如何解释「5. 形式证明没有普及，所以毫无价值」？
  answer: 形式方法在高风险领域仍很重要，类型系统和静态分析也继承了部分思想。它只是没有成为所有普通函数的默认开发方式。
  source_heading: 5. 形式证明没有普及，所以毫无价值
- level: 概念辨析
  question: 原文如何解释「7. 覆盖率百分之百等于没有 Bug」？
  answer: 覆盖率说明代码被执行，不说明结果被正确断言，更不说明所有有意义组合都被测试。
  source_heading: 7. 覆盖率百分之百等于没有 Bug
- level: 概念辨析
  question: 原文如何解释「9. 异常与早返回和任意 goto 完全相同」？
  answer: 它们改变控制流，但目标和传播范围通常受语言结构约束。滥用仍有问题，却不等同于任意跳转。
  source_heading: 9. 异常与早返回和任意 goto 完全相同
- level: 概念辨析
  question: 原文如何解释「10. 结构化编程已经过时」？
  answer: 现代开发者很少谈这个标签，是因为它已经成为语言与编码习惯的默认基础，而不是因为它失去价值。
  source_heading: 10. 结构化编程已经过时
