overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章主线」建立了怎样的核心认识？
  question_source: 0. 本章主线
  thesis: 并查集维护的是一个不断合并的集合划分。它不保存完整图，而只保存回答连通性所需的森林，因此能以接近常数的均摊代价处理大量关系。
  thesis_source: 本章总结
  concepts:
  - term: 0. 本章主线
    meaning: 并查集（Disjoint Set Union，DSU）维护一组会不断合并的互不相交集合。它不存储两点之间的具体路径，而把每个集合压缩成一个代表元，因此特别适合回答“是否已经连通”“当前有多少连通块”“新关系是否制造矛盾”。
    source_heading: 0. 本章主线
  - term: 10.1 并查集概述
    meaning: 带权关系必须可沿路径组合并可求逆，常见模型是群或模群上的差值。浮点比例存在舍入误差，比较时应使用容差。若输入可能矛盾，合并同根结点时必须验证已有关系；原书
      LeetCode 399 保证输入无矛盾，所以可省略冲突检测。
    source_heading: 10.1 并查集概述
  - term: 10.2 一维并查集应用的算法设计
    meaning: 反过来，并查集把由长度为 2 的路径连接的顶点归入同色类。在一个连通分量中，从任意起点出发，偶数长度路径端点被归为一类，奇数长度路径端点归为另一类。若存在奇环，某条边最终会连接同一类的两个端点，算法检测失败；若没有失败，就可按路径奇偶给各类着色。因此图是二分图。
    source_heading: 10.2 一维并查集应用的算法设计
  - term: 10.4.3 LeetCode 1254：封闭岛屿数量（★★）
    meaning: 逻辑或是可结合、可交换、幂等的聚合操作，合并顺序不影响最终标记。一个分量标记为真，当且仅当其中至少有一格位于边界，恰好对应非封闭岛定义。
    source_heading: 10.4.3 LeetCode 1254：封闭岛屿数量（★★）
  - term: 10.4.4 LeetCode 399：除法求值（★★）
    meaning: 已知变量查询自身时结果为 1；未知变量即使查询自身也返回 -1，因为它未出现在知识图中。
    source_heading: 10.4.4 LeetCode 399：除法求值（★★）
  - term: 本章总结
    meaning: 本章题目的共同主线可以概括为：先把业务对象翻译成结点，把约束翻译成合并，再明确根或父边上应维护的额外信息。普通、二维和带权并查集并不是三套孤立技巧，而是同一个集合划分模型的三种表达。
    source_heading: 本章总结
