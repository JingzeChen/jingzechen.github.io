  - 本章总结
  sections:
  - title: 0. 本章主线
    source_heading: 0. 本章主线
    paragraphs:
    - 并查集（Disjoint Set Union，DSU）维护一组会不断合并的互不相交集合。它不存储两点之间的具体路径，而把每个集合压缩成一个代表元，因此特别适合回答“是否已经连通”“当前有多少连通块”“新关系是否制造矛盾”。
    - 本章正文共 13 道题：10.2 一维并查集 7 题，10.3 二维并查集 2 题，10.4 带权并查集 4 题。
    - 按可独立复用的实现盘点，本章共 15 个算法单元：普通 DSU、加法势能 DSU 两个基础单元，加上 13 道正文题。正文相应放置 15 个 C++17
      代码块；Python、Go 的完整版本只保留在章末附录 A、B。
  - title: 10.1 并查集概述
    source_heading: 10.1 并查集概述
    paragraphs:
    - "“代表元相同”是连通的判据，不要求代表元是最小值、最大值或最早出现值。只有像 10.2.6 那样题目需要最小代表时，才专门改变合并策略。"
    - 因此，“并查集适合离线连通”不是说它只能离线，而是说含删除的动态连通通常要先离线改写为只合并问题；无法这样改写且要求在线回答时，应换动态连通数据结构。
    - 这个技巧只编码等价/连通条件。若问题问“到边界的最短距离”，把边界全接到虚拟根会丢失路径长度，应该改用多源 BFS；若要区分顶部和底部是否连通，则应使用两个不同虚拟结点，不能把两类边界提前合并。
    - 带权关系必须可沿路径组合并可求逆，常见模型是群或模群上的差值。浮点比例存在舍入误差，比较时应使用容差。若输入可能矛盾，合并同根结点时必须验证已有关系；原书
      LeetCode 399 保证输入无矛盾，所以可省略冲突检测。
  - title: 10.2 一维并查集应用的算法设计
    source_heading: 10.2 一维并查集应用的算法设计
    paragraphs:
    - 反过来，并查集把由长度为 2 的路径连接的顶点归入同色类。在一个连通分量中，从任意起点出发，偶数长度路径端点被归为一类，奇数长度路径端点归为另一类。若存在奇环，某条边最终会连接同一类的两个端点，算法检测失败；若没有失败，就可按路径奇偶给各类着色。因此图是二分图。
    - 等式的自反、对称、传递闭包正是并查集集合。若不等式两端同根，等式已推出二者相等，与不等式冲突；若所有不等式都跨不同集合，可以给每个集合分配一个不同整数，所有等式和不等式同时成立。
    - 初始每个单点根就是自身最小值。归纳假设两集合根分别是各自最小元素；合并后两根较小者就是并集最小值，把它设为新根，不变量保持。处理完所有等价对后，每个字符的根就是全类最小字符。
    - 为什么能移除到只剩一块？取该连通分量的一棵生成树，反复移除生成树叶子对应石头；叶子仍与父结点同行或同列，满足移除条件。移除后继续处理新叶，最终留根。
  - title: 10.3 二维并查集
    source_heading: 10.3 二维并查集
    paragraphs:
    - 初始有 7 个陆地单点。左上四格经三次成功合并成为一个分量，中间单点独立，右下两格合并，最终有 3 个根，即 3 座岛。
    - 初始化时 DSU 分量与没有边的陆地图分量一致。每处理一条陆地邻接边，若连接两个分量，图和 DSU 都把它们合并；若在同一分量，两者划分都不变。所有边处理完后，DSU
      划分与网格连通分量完全相同。
    - 无向边若处理两次，第二次必发现端点已同根，却只是在重复同一条边。算法只检查右、下，使每条物理边恰好处理一次，因此同根一定来自其他边组成的既有路径。
    - 若算法检测同根，新边与既有路径组成同值环；若图中存在环，按边处理顺序，环上最后被处理的边两端已由其余环边连通，必被检测。因此条件充要。
  - title: 10.4.3 LeetCode 1254：封闭岛屿数量（★★）
    source_heading: 10.4.3 LeetCode 1254：封闭岛屿数量（★★）
    paragraphs:
    - 原书把所有边界土地接到编号 0 的特殊根，等价于引入“外部水域”虚拟结点。
    - 逻辑或是可结合、可交换、幂等的聚合操作，合并顺序不影响最终标记。一个分量标记为真，当且仅当其中至少有一格位于边界，恰好对应非封闭岛定义。
    - DFS 可从边界先淹没所有非封闭土地，再统计剩余岛屿，通常更直观；并查集适合需要保留全部分量信息的场景。
  - title: 10.4.4 LeetCode 399：除法求值（★★）
    source_heading: 10.4.4 LeetCode 399：除法求值（★★）
    paragraphs:
    - 已知变量查询自身时结果为 1；未知变量即使查询自身也返回 -1，因为它未出现在知识图中。
    - 路径压缩按乘法传递性组合边，合并公式由输入方程精确推导，因此同根查询比值正确。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 并查集维护的是一个不断合并的集合划分。它不保存完整图，而只保存回答连通性所需的森林，因此能以接近常数的均摊代价处理大量关系。
    - 定不变量：只需同根判断，还是还要维护大小、边界标记、加法势能、乘法势能？
    - 定替代算法：需要遍历路径、在线删除关系或边权最短路时，及时改用图搜索或其他数据结构；删除若可逆序变成添加，再考虑离线 DSU。
    - 本章题目的共同主线可以概括为：先把业务对象翻译成结点，把约束翻译成合并，再明确根或父边上应维护的额外信息。普通、二维和带权并查集并不是三套孤立技巧，而是同一个集合划分模型的三种表达。
  takeaways:
  - 并查集维护的是一个不断合并的集合划分。它不保存完整图，而只保存回答连通性所需的森林，因此能以接近常数的均摊代价处理大量关系。
  - 扩展属性必须与存放位置匹配：集合属性放根，关系势能放父边。
  - 找关系：每条输入是否表示无向连通、相等、差值或比例？
  - 定合并时机：每条无向边只处理一次；计数只在成功合并后改变。
  - 本章题目的共同主线可以概括为：先把业务对象翻译成结点，把约束翻译成合并，再明确根或父边上应维护的额外信息。普通、二维和带权并查集并不是三套孤立技巧，而是同一个集合划分模型的三种表达。
