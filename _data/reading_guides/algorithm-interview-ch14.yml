  - 本章要解决什么问题
  - 14.1 字典树和后缀数组概述
  - 14.2 字典树应用的算法设计
  - 14.3 后缀数组应用的算法设计
  - 本章总结
  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 字典树（Trie）把多个字符串的公共前缀合并到同一条路径，以空间换取按字符长度查询；后缀数组（Suffix Array）把一个字符串的全部后缀按字典序排列，让任意子串问题转化为后缀之间的公共前缀问题。
    - 两种结构都在避免重复比较字符，但组织方式相反：Trie 从左到右共享多串路径；后缀数组把同一字符串的所有起点排序，使相似后缀相邻。
    - C++17 是正文主实现：共享类型只在对应基础单元定义一次，题目代码紧跟题解并直接复用它。
    - Python 3 与 Go 1.22 的完整实现只放在章末附录 A、B。除非代码块明确写出完整程序，正文 C++ 块都按“已包含所用标准库头文件、且位于同一翻译单元”阅读。
  - title: 14.1 字典树和后缀数组概述
    source_heading: 14.1 字典树和后缀数组概述
    paragraphs:
    - 路径压缩 Trie（radix/Patricia trie）把没有分叉的一整段字符合并到一条边，结点更少，但查找要比较边标签，插入还可能在标签中部拆边。
    - 补充：哨兵注意。 若有效排名从 0 开始，越界第二关键字不能也用 0，否则空后半段会与排名 0 的真实后半段混淆。可以使用 -1，或把所有有效排名整体加
      1、保留 0 给空串。
    - 若排名区间内所有相邻后缀至少共享长度 h 的前缀，则沿相邻链传递，区间两端也共享这 h 个字符；一旦某对相邻后缀只共享更短前缀，两个端点不可能跨过该分界仍共享更长前缀。
    - 补充：结构对比。 后缀树可提供更直接的路径结构但内存和实现复杂；后缀自动机适合不同子串及在线追加；滚动哈希配合二分可判断固定长度重复子串，但有哈希碰撞风险。原书本章采用后缀数组与
      LCP，结果确定且空间线性。
  - title: 14.2 字典树应用的算法设计
    source_heading: 14.2 字典树应用的算法设计
    paragraphs:
    - 插入不变量保证每个已插入单词都存在唯一根路径，且仅其完整末尾带终止标记。路径查找成功当且仅当输入是某个已插入单词的前缀；再检查终止标记，就把“前缀存在”收紧为“完整单词存在”。
    - 只要出现两个分支，说明至少两个字符串在下一字符不同；只要当前结点已经结束一个字符串，公共前缀不能再长，因为该短字符串没有后续字符。
    - 循环追加的每个字符位于所有单词共享的唯一分支上，且没有任何单词提前结束，所以所得串是公共前缀；停止时要么分叉，要么某串结束，任何更长前缀都不可能被所有字符串共享，因此它最长。
    - 初始所有前缀聚合为 0。一次插入只改变该键经过的前缀集合；每个相关结点增加新旧值差后，其聚合恰好替换该键贡献，其他键贡献不变。因此不变量始终成立，前缀末结点值就是题目所求。
  - title: 14.3 后缀数组应用的算法设计
    source_heading: 14.3 后缀数组应用的算法设计
    paragraphs:
    - 每个非空子串唯一作为“第一次出现它的最小排名后缀”的新前缀被计入。对每个后缀减去已出现前缀长度后，不重不漏地覆盖所有不同子串。
    - 反过来，两个不同后缀的长度为 L 的公共前缀，就是一个在两个起点出现的长度 L 重复子串；起点区间允许重叠，符合题意。
    - 假设两个后缀共享长度 L 的前缀 t。所有以 t 开头的后缀在字典序中形成一个连续区间；该区间至少含两个后缀，所以其中必有一对相邻后缀也共享 t，其 LCP
      至少为 L。
    - 多个最长答案时，题目允许返回任意一个。若最大值为 0，截取长度 0 得空串。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 紧凑结点池只改变地址表示，不改变这些语义。路径压缩 Trie 会把单链合并为带字符串标签的边，只有在长单链造成明显内存压力时才值得承担拆边和标签比较复杂度。MapSum、公共前缀和子序列计数则是在相同路径骨架上更换结点聚合状态。
    - 前两式完成后缀排序，后两式把公共前缀问题转成相邻 LCP 与区间最小值。
    - 其中 W 是全部单词字符总数，T 是不同 Trie 前缀结点数，n 是主字符串长度。
  takeaways:
  - 紧凑结点池只改变地址表示，不改变这些语义。路径压缩 Trie 会把单链合并为带字符串标签的边，只有在长单链造成明显内存压力时才值得承担拆边和标签比较复杂度。MapSum、公共前缀和子序列计数则是在相同路径骨架上更换结点聚合状态。
  - 前两式完成后缀排序，后两式把公共前缀问题转成相邻 LCP 与区间最小值。
  - 其中 W 是全部单词字符总数，T 是不同 Trie 前缀结点数，n 是主字符串长度。
