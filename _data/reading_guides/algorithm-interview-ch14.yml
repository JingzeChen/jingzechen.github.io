overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 紧凑结点池只改变地址表示，不改变这些语义。路径压缩 Trie 会把单链合并为带字符串标签的边，只有在长单链造成明显内存压力时才值得承担拆边和标签比较复杂度。MapSum、公共前缀和子序列计数则是在相同路径骨架上更换结点聚合状态。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 字典树（Trie）把多个字符串的公共前缀合并到同一条路径，以空间换取按字符长度查询；后缀数组（Suffix Array）把一个字符串的全部后缀按字典序排列，让任意子串问题转化为后缀之间的公共前缀问题。
    source_heading: 本章要解决什么问题
  - term: 14.1 字典树和后缀数组概述
    meaning: 补充：结构对比。 后缀树可提供更直接的路径结构但内存和实现复杂；后缀自动机适合不同子串及在线追加；滚动哈希配合二分可判断固定长度重复子串，但有哈希碰撞风险。原书本章采用后缀数组与
      LCP，结果确定且空间线性。
    source_heading: 14.1 字典树和后缀数组概述
  - term: 14.2 字典树应用的算法设计
    meaning: 插入不变量保证每个已插入单词都存在唯一根路径，且仅其完整末尾带终止标记。路径查找成功当且仅当输入是某个已插入单词的前缀；再检查终止标记，就把“前缀存在”收紧为“完整单词存在”。
    source_heading: 14.2 字典树应用的算法设计
  - term: 14.3 后缀数组应用的算法设计
    meaning: 假设两个后缀共享长度 L 的前缀 t。所有以 t 开头的后缀在字典序中形成一个连续区间；该区间至少含两个后缀，所以其中必有一对相邻后缀也共享
      t，其 LCP 至少为 L。
    source_heading: 14.3 后缀数组应用的算法设计
  - term: 本章总结
    meaning: 紧凑结点池只改变地址表示，不改变这些语义。路径压缩 Trie 会把单链合并为带字符串标签的边，只有在长单链造成明显内存压力时才值得承担拆边和标签比较复杂度。MapSum、公共前缀和子序列计数则是在相同路径骨架上更换结点聚合状态。
    source_heading: 本章总结
