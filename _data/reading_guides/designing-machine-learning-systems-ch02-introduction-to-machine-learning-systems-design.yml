overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 最后，本章讨论智能设计与数据。作者在写作时回望约 2010–2020 年间，认为 AlexNet、BERT、GPT 等系统的成功显示，这一时期的进展很大程度依赖大规模数据和计算。无论数据能否最终压过智能设计，作者当时的结论是数据的重要性不可否认，因此后续章节会投入大量篇幅讨论数据问题。
  thesis_source: 8. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：系统设计不是先选算法，而是把业务价值、系统约束、可学习任务、数据证据和持续反馈连接成一条可验证的因果链。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Business and ML Objectives：业务目标与 ML 目标
    meaning: 需要保留论证边界：这是原章采用的一种商业目标框架，不是所有组织都接受的唯一规范。公共机构、非营利组织和利益相关者治理公司还会重视公共价值、员工、环境和法定义务。即使在营利企业中，安全、公平和合规也不能总被短期利润抵消。
    source_heading: 2. Business and ML Objectives：业务目标与 ML 目标
  - term: 5. Framing ML Problems：表述机器学习问题
    meaning: 原章把这种形式称为将分类表述为回归。技术上，它通常仍是概率式二分类或评分任务，尤其使用 logistic loss 时并不是普通连续目标回归。关键思想是：先预测连续分数，再把产品阈值与模型训练分开。
    source_heading: 5. Framing ML Problems：表述机器学习问题
  - term: 6. Objective Functions：目标函数
    meaning: 严格地说，在误差独立、零均值、同方差高斯分布且方差固定时，最大似然直接对应最小化 SSE / MSE；RMSE 只是对 MSE 取严格单调的平方根，所以在固定样本数下具有相同最优解。在误差独立、以零为中心的
      Laplace 分布且尺度固定时，最大似然对应最小化 MAE。若噪声异方差、相关或尺度也要学习，这些对应关系需要调整。损失选择本质上是在表达错误成本和噪声模型。
    source_heading: 6. Objective Functions：目标函数
  - term: 10. 本章知识结构
    meaning: 目标函数把表述变成优化信号，多目标设计决定价值冲突如何处理。
    source_heading: 10. 本章知识结构
  - term: 12. 从本章提炼出的通用问题解决方法
    meaning: 本章给出的最高层原则是：不要把“训练出一个模型”当成设计完成；要让每个数学优化动作都能沿证据链回到业务价值，并让整套系统在变化中持续成立。
    source_heading: 12. 从本章提炼出的通用问题解决方法
  logic:
  - 0. 本章要回答的核心问题
  - 2. Business and ML Objectives：业务目标与 ML 目标
  - 4. Iterative Process：机器学习系统的迭代过程
  - 6. Objective Functions：目标函数
  - 7. Mind Versus Data：智能设计与数据之争
  - 11. 核心结论
  - 12. 从本章提炼出的通用问题解决方法
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - 广告展示案例的 13 个步骤怎样暴露标签错误、类别不平衡、模型陈旧和目标错位？
    - 如何把“加快客服响应”这种业务诉求表述成具有输入、输出和目标函数的 ML 问题？
    - RMSE、MAE、log loss 和交叉熵从哪里来，各自优化什么、有什么局限？
    - 一句话概括：系统设计不是先选算法，而是把业务价值、系统约束、可学习任务、数据证据和持续反馈连接成一条可验证的因果链。
  - title: 1. 开篇：ML 系统设计从目标开始
    source_heading: 1. 开篇：ML 系统设计从目标开始
    paragraphs:
    - 第 1 章已经说明，ML 系统设计是对 MLOps 的系统化视角：业务要求、数据栈、基础设施、部署、监控及其利益相关者必须共同满足明确目标。
    - 模型到底要学什么？ 把业务问题表述成输入、输出和目标函数明确的 ML 任务。
    - 最后一节讨论“智能设计与数据谁更重要”，因为所有问题表述和模型优化最终都受数据质量、数量和覆盖范围约束。
    - 这套顺序很重要。如果先训练模型、后补业务目标，团队很可能精确优化一个无价值的代理；若先规定目标、约束和证据，算法选择才有判断标准。
  - title: 2. Business and ML Objectives：业务目标与 ML 目标
    source_heading: 2. Business and ML Objectives：业务目标与 ML 目标
    paragraphs:
    - 需要保留论证边界：这是原章采用的一种商业目标框架，不是所有组织都接受的唯一规范。公共机构、非营利组织和利益相关者治理公司还会重视公共价值、员工、环境和法定义务。即使在营利企业中，安全、公平和合规也不能总被短期利润抵消。
    - 端到端 A/B 测试能判断整套方案是否改善结果，却未必告诉团队哪一环造成失败。解决组件归因需要阶段性指标、统一事件 ID、数据血缘、人工决定记录和反事实测试。
    - 图 2-1 还按 0–7 天、8–30 天、31–90 天、91–365 天和 1 年以上分段，对比起步、1–2 年、2–4 年和 5 年以上四个成熟阶段。
    - 初期通常是数据、人员和基础设施投入，收益滞后出现；成熟后公共平台与经验会降低边际成本。因此只看上线后第一个月，容易低估长期能力建设；只讲遥远收益，又会掩盖没有验证的项目。
  - title: 4. Iterative Process：机器学习系统的迭代过程
    source_heading: 4. Iterative Process：机器学习系统的迭代过程
    paragraphs:
    - 现实则是长期循环。数据、标签、特征、模型、系统和业务目标会互相暴露问题；上线后仍要监控和更新。传统软件也具有迭代性，ML 的额外困难是数据和统计目标也进入循环。
    - 这是数据科学家或 ML 工程师视角的简化图。平台或 DevOps 工程师可能把更多时间放在资源、权限、编排和服务基础设施上。
    - 模型需要以用户或其他服务可访问的形式发布。作者把系统开发比作写作：永远不会达到绝对完成，但会到必须发布并接受现实反馈的时刻。
    - 持续学习不必等同于每条样本实时更新。它可以是每天、每周或事件触发的批量重训；关键是更新闭环持续存在。第 8、9 章分别讨论分布变化、监控和持续更新。
  - title: 5. Framing ML Problems：表述机器学习问题
    source_heading: 5. Framing ML Problems：表述机器学习问题
    paragraphs:
    - 收益：输出更容易解释，对离群值可能更稳健。代价：丢失区间内顺序和距离。例如 200,001 与 499,999 美元被视为同类，199,999 与 200,001
      却被视为不同类。
    - 原章把这种形式称为将分类表述为回归。技术上，它通常仍是概率式二分类或评分任务，尤其使用 logistic loss 时并不是普通连续目标回归。关键思想是：先预测连续分数，再把产品阈值与模型训练分开。
    - 缺点是错误传播。以下乘积是笔记补充：若父分类准确率为 a_p，并把 a_c 明确定义为“父类预测正确条件下，子类也预测正确”的条件准确率，则端到端叶子准确率为
    - 新应用只需提供特征，不必扩展固定输出层。这更接近 pointwise ranking 或二元概率评分；原章称之为回归，是为了强调输出从 N 维类别向量变为一个连续数。
  - title: 6. Objective Functions：目标函数
    source_heading: 6. Objective Functions：目标函数
    paragraphs:
    - 原章指出 objective function 也常称 loss function，因为训练通常最小化错误损失。脚注特别强调：数学 objective
      function 不同于本章前面讨论的业务目标和 ML 目标。
    - 严格地说，在误差独立、零均值、同方差高斯分布且方差固定时，最大似然直接对应最小化 SSE / MSE；RMSE 只是对 MSE 取严格单调的平方根，所以在固定样本数下具有相同最优解。在误差独立、以零为中心的
      Laplace 分布且尺度固定时，最大似然对应最小化 MAE。若噪声异方差、相关或尺度也要学习，这些对应关系需要调整。损失选择本质上是在表达错误成本和噪声模型。
    - 解耦还有维护优势：垃圾攻击变化快，需要频繁更新；质量判断可能变化较慢。不同目标可以由不同团队、数据和周期维护。
    - 更重要的是，某些目标不应只作为可被补偿的软分数。违法内容、安全风险和明确 NSFW 禁止项通常应作为硬约束或过滤门：再高互动也不能抵消违反约束。
  - title: 7. Mind Versus Data：智能设计与数据之争
    source_heading: 7. Mind Versus Data：智能设计与数据之争
    paragraphs:
    - Judea Pearl 以因果推断和贝叶斯网络闻名。他在 The Book of Why 的“Mind over Data”导言中强调“Data is
      profoundly dumb”，并在 2020 年以强烈措辞警告，仅追随数据中心范式的从业者可能在三到五年内落伍。
    - Richard Sutton 在 “The Bitter Lesson” 中总结 70 年 AI 研究：能利用不断增长计算的一般方法，长期往往大幅超过依赖人类领域知识的精巧设计。短期手工知识可能有效，但难随算力持续扩展。
    - 按原章正文的三个标题数字，从 0.8B 到 10B 是 12.5 倍，从 10B 到 500B 是 50 倍，总计约 625 倍。图 2-8 使用对数纵轴，才能在同一图中显示跨多个数量级的增长。
    - 更精确的背景补充是：GPT-3 各来源过滤后的候选语料合计约 499B token，而训练过程按混合权重采样约 300B token。因此原章的“GPT-3
      使用 500B token 数据集”适合表达可用语料池规模，不应与优化器实际消费的训练 token 数混为一谈。
  - title: 10. 本章知识结构
    source_heading: 10. 本章知识结构
    paragraphs:
    - ML 目标和指标只是业务目标的代理，需要实验验证。
    - 问题表述决定输出空间、数据需求和模型复杂度。
    - 目标函数把表述变成优化信号，多目标设计决定价值冲突如何处理。
    - 数据、计算和归纳偏置共同决定模型能否泛化。
  - title: 11. 核心结论
    source_heading: 11. 核心结论
    paragraphs:
    - 错误分析应定位控制根因的层次。 标签错误、类别不平衡、陈旧数据和目标错位不能靠调参统一修复。
    - 问题表述决定问题难度。 同一业务需求可以变成固定类别分类、逐候选评分或层次任务，扩展代价完全不同。
    - 目标函数是数学优化信号，不是业务目标。 交叉熵来自最大似然，但标签和代理是否正确仍需系统判断。
    - Mind 与 Data 不是简单二选一。 归纳偏置决定样本效率，数据提供证据，计算使方法可扩展。
  - title: 12. 从本章提炼出的通用问题解决方法
    source_heading: 12. 从本章提炼出的通用问题解决方法
    paragraphs:
    - 先执行不可补偿的硬门禁，再将质量、互动、成本等软目标分别建模并校准组合。用 Pareto 前沿展示权衡，不假装存在天然唯一权重。
    - 离线评估适合快速筛选，影子流量检查系统行为，灰度与 A/B 测试验证真实增量。统计显著、业务显著和伦理可接受必须分别判断。
    - 监控服务、数据、模型和业务结果；记录版本和血缘；当环境或目标变化时，安全更新、回滚、重新表述问题或退役系统。
    - 本章给出的最高层原则是：不要把“训练出一个模型”当成设计完成；要让每个数学优化动作都能沿证据链回到业务价值，并让整套系统在变化中持续成立。
  takeaways:
  - 本章首先强调，每个项目都必须从“为什么”开始。企业通常不会因为 ML 指标漂亮而持续投资，除非它能推动业务指标。因此业务目标必须先翻译成 ML 目标，指导模型开发与实验。
  - 最后，本章讨论智能设计与数据。作者在写作时回望约 2010–2020 年间，认为 AlexNet、BERT、GPT 等系统的成功显示，这一时期的进展很大程度依赖大规模数据和计算。无论数据能否最终压过智能设计，作者当时的结论是数据的重要性不可否认，因此后续章节会投入大量篇幅讨论数据问题。
  - 业务目标、ML 指标与数学损失之间是代理关系。 每一层映射都要用历史分析或实验验证。
  - 系统开发是永不停止的反馈闭环。 标签、分布和业务目标都可能迫使团队回到起点。
  - Mind 与 Data 不是简单二选一。 归纳偏置决定样本效率，数据提供证据，计算使方法可扩展。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「9.1 业务目标、业务指标、ML 指标和损失不是同一个东西」？
  answer: 它们位于因果链不同位置。交叉熵下降不能自动证明利润提高，必须逐层验证代理关系。
  source_heading: 9.1 业务目标、业务指标、ML 指标和损失不是同一个东西
- level: 概念辨析
  question: 原文如何解释「9.6 可扩展性不只是增加服务器」？
  answer: 模型体积、流量、模型数量、监控和产物管理都可能成为瓶颈。能运行 1 个模型不代表能管理 8000 个模型。
  source_heading: 9.6 可扩展性不只是增加服务器
- level: 概念辨析
  question: 原文如何解释「9.12 业务问题不天然是 ML 问题」？
  answer: "“客服太慢”没有输入、输出和目标函数。先找瓶颈，才能判断路由分类是否值得做。"
  source_heading: 9.12 业务问题不天然是 ML 问题
- level: 概念辨析
  question: 原文如何解释「9.18 多标签不能总用 top-k 解码」？
  answer: 每个样本标签数变化。固定 top-k 会强迫无关标签或漏掉合理标签，需要阈值、cardinality 或结构约束。
  source_heading: 9.18 多标签不能总用 top-k 解码
- level: 概念辨析
  question: 原文如何解释「9.24 “数据胜过算法”不等于算法和归纳偏置无关」？
  answer: 一般方法能利用计算是长期优势，结构则决定有限数据下怎样归纳。工程上应定位当前瓶颈，而不是加入阵营。
  source_heading: 9.24 “数据胜过算法”不等于算法和归纳偏置无关
