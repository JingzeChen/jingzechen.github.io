- level: 概念辨析
  question: 原文如何解释「关键公式的成立条件」？
  answer: 公式不是事实本身，而是“假设 → 数量级”的工具。可靠性报告若只给巨大 MTTDL、不列 correlation、URE、MTTR 与 repair
    protocol，应视为不完整。
