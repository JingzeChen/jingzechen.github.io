  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 反向模式自动微分是在一般计算图上高效计算标量输出对大量输入的梯度。反向传播把它用于神经网络损失，并结合重复 mini-batch 训练和优化器更新参数。完整过程和矩阵推导见第
    7 节。
  thesis_source: 12. 章末练习与参考答案
  concepts:
  - term: 本章要解决什么问题
    meaning: 回归、二分类、多标签和多分类应怎样设计输出层与损失？
    source_heading: 本章要解决什么问题
  - term: 2.2 为什么人工网络采用分层结构
    meaning: 每层都能用规则化的矩阵运算并行计算。
    source_heading: 2.2 为什么人工网络采用分层结构
  - term: 6.1 为什么阶跃函数不适合梯度训练
    meaning: 早期 MLP 能被反向传播训练的关键改动，就是用连续、几乎处处可导的激活替换阶跃函数。
    source_heading: 6.1 为什么阶跃函数不适合梯度训练
  - term: 7.8 为什么必须随机打破对称性
    meaning: 偏置通常可以初始化为 0，只要连接权重随机即可；“所有参数都不能为 0”是不精确的说法。
    source_heading: 7.8 为什么必须随机打破对称性
  - term: 10. Classification MLPs：分类 MLP
    meaning: 很小的 s_j 会放大这些低方差像素的微小噪声，使其方差也变成 1。MinMax 缩放通常更符合原始像素语义，但不是绝对规则；现代视觉网络还常按数据集通道均值和方差标准化。
    source_heading: 10. Classification MLPs：分类 MLP
  - term: 工程能力
    meaning: 能做 learning rate range test
    source_heading: 工程能力
