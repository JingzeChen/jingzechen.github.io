  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 一句话概括结构：11.1 是地基（为什么能因子分解），11.2 是模型（长什么样），11.3/11.4/11.5 分别是”三个基本问题”的解法，和第 10
      章一一对应。
    - 横着读：同一种结构下，生成 → 判别的转换。朴素贝叶斯 → 逻辑斯谛回归，HMM → CRF。
    - 竖着读：同一种建模哲学下，单点 → 序列的推广。朴素贝叶斯 → HMM，最大熵 → CRF。
    - 原书”继续阅读”还提到：条件随机场可以看作是最大熵马尔可夫模型（MEMM）在标注问题上的推广。
  - title: "【补充】前置知识"
    source_heading: "【补充】前置知识"
    paragraphs:
    - 为什么 CRF 要用无向图？ 因为标注问题里，相邻标记之间的关系是互相制约的，不存在”y_2 生成 y_3”这样的因果方向。用无向图表达更自然。
    - 理解了这一点，本章 11.4 节的学习算法（IIS、梯度下降、拟牛顿）就几乎是第 6 章的照搬——原书也确实说”推导可参考本书 6.3.1 节”。
  - title: 11.1 概率无向图模型
    source_heading: 11.1 概率无向图模型
    paragraphs:
    - v 的邻居集合 W 有个专门名字：马尔可夫毯（Markov blanket）【补充】。原书图 11.1 画的就是这个情形：v 被一圈 W 包围，O 在圈外。
    - 以上是概率无向图模型的定义。实际上，我们更关心的是如何求其联合概率分布的形式，也就是将联合概率进行因子分解，这样便于模型的学习与计算。事实上，概率无向图模型的最大特点就是易于因子分解。
    - 定义 11.2 无向图 G 中任何两个结点均有边连接的结点子集称为团（clique）。若 C 是无向图 G 的一个团，并且不能再加进任何一个 G 的结点使其成为一个更大的团，则称此
      C 为最大团（maximal clique）。
    - 这个证明告诉我们什么：因子分解之所以蕴含条件独立，唯一的理由是”没有一个团能横跨分隔集”。这个观察在 11.2 节会被直接复用——线性链上把 y_i 拿掉就断成两截，所以最大团只能是相邻两结点。
  - title: 11.2 条件随机场的定义与形式
    source_heading: 11.2 条件随机场的定义与形式
    paragraphs:
    - 原书接着说明：本章主要介绍定义在线性链上的特殊条件随机场，称为线性链条件随机场（linear chain conditional random field），可用于标注等问题。
    - 式 (11.8) 就是式 (11.3) 的”带 X 版本”：给定 v 的邻居（以及整个 X），再知道其他任何结点都没用。左边条件里是”v 以外的全部结点”，右边只保留”v
      的邻居”，两者相等 —— 即局部马尔可夫性。
    - 条件随机场还可以由简化形式表示。注意到条件随机场式 (11.10) 中同一特征在各个位置都有定义，可以对同一个特征在各个位置求和，将局部特征函数转化为一个全局特征函数，这样就可以将条件随机场写成权值向量和特征向量的内积形式，即条件随机场的简化形式。
    - 简化形式 (11.19) 便于讲优化，但它把整条序列压成一个内积，看不见链式结构。矩阵形式把链式结构重新显式化，从而让”用递推代替枚举”变得显然——正是
      11.3 节和 11.5 节的基础。
  - title: 11.3 条件随机场的概率计算问题
    source_heading: 11.3 条件随机场的概率计算问题
    paragraphs:
    - 为了方便起见，像隐马尔可夫模型那样，引进前向-后向向量，递归地计算以上概率及期望值。
    - 所以 11.3 节是 11.4 节的前置工序——学不动模型，是因为算不出期望。
    - 这正是 11.1.2 节证明里”没有团能横跨分隔集”的同一件事——y_i 把链分成了两截。
    - 注意：维特比算法（11.5 节）天然免疫这个问题——它全程在对数空间做加法和取最大，见 11.5 节。
  - title: 11.4 条件随机场的学习算法
    source_heading: 11.4 条件随机场的学习算法
    paragraphs:
    - 本节讨论给定训练数据集估计条件随机场模型参数的问题，即条件随机场的学习问题。条件随机场模型实际上是定义在时序数据上的对数线性模型，其学习方法包括极大似然估计和正则化的极大似然估计。具体的优化实现算法有改进的迭代尺度法
      IIS、梯度下降法以及拟牛顿法。
    - 式 (11.42)(11.45) 正是 11.3.3 节的成果——期望计算在这里派上用场。注意：转移特征用式 (11.33) 的两点边缘，状态特征用式
      (11.32) 的单点边缘。
    - "【补充】IIS 在今天的地位：IIS 是历史上（Lafferty 等 2001 年原始论文时期）的主流方法，但现代 CRF 工具包基本都用 L-BFGS
      或随机梯度。原因：IIS 的下界放缩过于保守，实际收敛速度明显慢于拟牛顿法。原书 11.4.2 节接着介绍拟牛顿法，正是这个原因。理解 IIS 的价值在于看清”如何构造可分离的下界”这一通用技巧（与第
      6 章、第 8 章的思路一脉相承）。"
    - 梯度为零 ⟺ 模型期望 = 经验期望，这正是第 6 章最大熵模型的约束条件！所以”极大似然估计对数线性模型”与”在矩约束下求最大熵”是同一件事的两面（第
      6 章定理 6.3 已证）。
  - title: 11.5 条件随机场的预测算法
    source_heading: 11.5 条件随机场的预测算法
    paragraphs:
    - 式 (11.52) → (11.53) 做了什么：把”整条路径的一个内积”拆成”沿位置逐项相加”。
    - 一个实践优点：CRF 的维特比永远不会数值下溢，因为全程只做浮点加法与比较。
  - title: 11.7 【补充】深入理解
    source_heading: 11.7 【补充】深入理解
    paragraphs:
    - 在条件随机场提出之前已有最大熵马尔可夫模型（MEMM）等模型被提出。条件随机场可以看作是最大熵马尔可夫模型在标注问题上的推广。
    - 错。是整条观测序列。这是 CRF 的核心优势——特征可以看句子里的任何位置。若误以为只能看 x_i，就等于把 CRF 退化成了 HMM。
    - 不一定。CRF 参数无约束、表达力强，但也更容易过拟合，且训练慢得多。数据少时 HMM 的概率约束是有效的正则化。另外无标注数据只能用 HMM + Baum-Welch。
    - 原因是神经网络给出的是逐位置的独立打分，无法表达”B 之后不能接 O 类型的 I”这样的结构约束；接一层 CRF 做全局解码，能显著提升整句正确率。
  - title: 11.8 本章方法论总结
    source_heading: 11.8 本章方法论总结
    paragraphs:
    - 属于概率、判别、参数化、对数线性模型。原书表 12.1 的归类是：”标注问题；状态序列条件下观测序列的条件概率分布，对数线性模型；判别模型”。
    - 概率无向图模型 = 马尔可夫随机场：由无向图表示的联合概率分布，满足（等价的）成对/局部/全局马尔可夫性。
    - CRF 对 X 不作任何条件独立假设，整条 x 都可以被特征函数使用——这是相对 HMM 的核心优势。
    - 梯度 = 模型期望 − 经验期望（式 11.51）；梯度为零 ⟺ 两者相等，这正是第 6 章最大熵的矩约束。
  takeaways:
  - 原书”继续阅读”还提到：条件随机场可以看作是最大熵马尔可夫模型（MEMM）在标注问题上的推广。
  - 这个证明告诉我们什么：因子分解之所以蕴含条件独立，唯一的理由是”没有一个团能横跨分隔集”。这个观察在 11.2 节会被直接复用——线性链上把 y_i 拿掉就断成两截，所以最大团只能是相邻两结点。
  - 注意：维特比算法（11.5 节）天然免疫这个问题——它全程在对数空间做加法和取最大，见 11.5 节。
  - 一个实践优点：CRF 的维特比永远不会数值下溢，因为全程只做浮点加法与比较。
  - 梯度 = 模型期望 − 经验期望（式 11.51）；梯度为零 ⟺ 两者相等，这正是第 6 章最大熵的矩约束。
