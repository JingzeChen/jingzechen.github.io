  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: "【补充】IIS 在今天的地位：IIS 是历史上（Lafferty 等 2001 年原始论文时期）的主流方法，但现代 CRF 工具包基本都用 L-BFGS
    或随机梯度。原因：IIS 的下界放缩过于保守，实际收敛速度明显慢于拟牛顿法。原书 11.4.2 节接着介绍拟牛顿法，正是这个原因。理解 IIS 的价值在于看清”如何构造可分离的下界”这一通用技巧（与第
    6 章、第 8 章的思路一脉相承）。"
  thesis_source: 11.4 条件随机场的学习算法
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 一句话概括结构：11.1 是地基（为什么能因子分解），11.2 是模型（长什么样），11.3/11.4/11.5 分别是”三个基本问题”的解法，和第
      10 章一一对应。
    source_heading: 0. 本章解决什么问题
  - term: 11.1 概率无向图模型
    meaning: 定义 11.2 无向图 G 中任何两个结点均有边连接的结点子集称为团（clique）。若 C 是无向图 G 的一个团，并且不能再加进任何一个
      G 的结点使其成为一个更大的团，则称此 C 为最大团（maximal clique）。
    source_heading: 11.1 概率无向图模型
  - term: 11.2 条件随机场的定义与形式
    meaning: 条件随机场还可以由简化形式表示。注意到条件随机场式 (11.10) 中同一特征在各个位置都有定义，可以对同一个特征在各个位置求和，将局部特征函数转化为一个全局特征函数，这样就可以将条件随机场写成权值向量和特征向量的内积形式，即条件随机场的简化形式。
    source_heading: 11.2 条件随机场的定义与形式
  - term: 11.4 条件随机场的学习算法
    meaning: "【补充】IIS 在今天的地位：IIS 是历史上（Lafferty 等 2001 年原始论文时期）的主流方法，但现代 CRF 工具包基本都用
      L-BFGS 或随机梯度。原因：IIS 的下界放缩过于保守，实际收敛速度明显慢于拟牛顿法。原书 11.4.2 节接着介绍拟牛顿法，正是这个原因。理解 IIS
      的价值在于看清”如何构造可分离的下界”这一通用技巧（与第 6 章、第 8 章的思路一脉相承）。"
    source_heading: 11.4 条件随机场的学习算法
  - term: 11.5 条件随机场的预测算法
    meaning: 式 (11.52) → (11.53) 做了什么：把”整条路径的一个内积”拆成”沿位置逐项相加”。
    source_heading: 11.5 条件随机场的预测算法
  - term: 11.8 本章方法论总结
    meaning: 属于概率、判别、参数化、对数线性模型。原书表 12.1 的归类是：”标注问题；状态序列条件下观测序列的条件概率分布，对数线性模型；判别模型”。
    source_heading: 11.8 本章方法论总结
