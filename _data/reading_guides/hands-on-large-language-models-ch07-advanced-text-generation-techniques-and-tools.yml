overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章路线：模型之外的能力来自系统」建立了怎样的核心认识？
  question_source: 0. 本章路线：模型之外的能力来自系统
  thesis: 本章使用 LangChain 展示抽象。框架 API 更新很快，类名和导入路径可能变化；稳定知识是组件边界、数据流和安全约束，不是某一版 import。现代
    LangChain 常用 LCEL/Runnable，复杂有状态 agent 也常由 LangGraph 等显式状态图承载。
  thesis_source: 0. 本章路线：模型之外的能力来自系统
  concepts:
  - term: 0. 本章路线：模型之外的能力来自系统
    meaning: 本章使用 LangChain 展示抽象。框架 API 更新很快，类名和导入路径可能变化；稳定知识是组件边界、数据流和安全约束，不是某一版
      import。现代 LangChain 常用 LCEL/Runnable，复杂有状态 agent 也常由 LangGraph 等显式状态图承载。
    source_heading: 0. 本章路线：模型之外的能力来自系统
  - term: '1. Model I/O：用 LangChain 加载量化模型（Model I/O: Loading Quantized Models with
      LangChain）'
    meaning: 实际还包含量化元数据、KV cache、运行时 buffer、上下文和 GPU/CPU offload。低 bit 不保证更快：速度取决于硬件是否有高效
      kernel、内存带宽和后端实现。
    source_heading: '1. Model I/O：用 LangChain 加载量化模型（Model I/O: Loading Quantized
      Models with LangChain）'
  - term: '2. Chains：扩展 LLM 能力（Chains: Extending the Capabilities of LLMs）'
    meaning: 每步 95% 并不意味着五步仍有 95%。生产 chain 需要中间 schema、retry policy、timeout、trace、幂等性和失败补偿。自然语言字符串是脆弱接口，能用
      typed object 就不要靠下游再猜字段。
    source_heading: '2. Chains：扩展 LLM 能力（Chains: Extending the Capabilities of LLMs）'
  - term: '3. Memory：帮助 LLM “记住”对话（Memory: Helping LLMs to Remember Conversations）'
    meaning: 模型 API 通常是 stateless：每次调用只看到本次提供的 token。所谓 memory 是应用保存历史，并在后续调用重新放入上下文。
    source_heading: '3. Memory：帮助 LLM “记住”对话（Memory: Helping LLMs to Remember Conversations）'
  - term: '4. Agents：创建 LLM 系统（Agents: Creating a System of LLMs）'
    meaning: 但模型生成的可见 Thought 不是可靠内部解释。生产系统更应记录结构化 action/observation 与简短 decision
      rationale，不必暴露冗长 chain-of-thought。
    source_heading: '4. Agents：创建 LLM 系统（Agents: Creating a System of LLMs）'
  - term: 6. 总结（Summary）
    meaning: 本章最重要的方法论是逐步增加自治：先让单次调用正确，再让固定 chain 可验证，再加入有界 memory，最后才把必要的决策交给 agent。每增加一层能力，都必须同步增加状态管理、观测、权限和失败控制。
    source_heading: 6. 总结（Summary）
  logic:
  - 0. 本章路线：模型之外的能力来自系统
  - '1. Model I/O：用 LangChain 加载量化模型（Model I/O: Loading Quantized Models with LangChain）'
  - '2. Chains：扩展 LLM 能力（Chains: Extending the Capabilities of LLMs）'
  - '3. Memory：帮助 LLM “记住”对话（Memory: Helping LLMs to Remember Conversations）'
  - '4. Agents：创建 LLM 系统（Agents: Creating a System of LLMs）'
  - 6. 总结（Summary）
  sections:
  - title: 0. 本章路线：模型之外的能力来自系统
    source_heading: 0. 本章路线：模型之外的能力来自系统
    paragraphs:
    - Prompt engineering 只改变一次调用的输入。真实应用还需要加载模型、组织多步流程、保存状态、访问外部世界并处理失败。
    - 本章使用 LangChain 展示抽象。框架 API 更新很快，类名和导入路径可能变化；稳定知识是组件边界、数据流和安全约束，不是某一版 import。现代
      LangChain 常用 LCEL/Runnable，复杂有状态 agent 也常由 LangGraph 等显式状态图承载。
  - title: '1. Model I/O：用 LangChain 加载量化模型（Model I/O: Loading Quantized Models with
      LangChain）'
    source_heading: '1. Model I/O：用 LangChain 加载量化模型（Model I/O: Loading Quantized
      Models with LangChain）'
    paragraphs:
    - 真实 LLM 量化会按 tensor、channel 或 block 使用不同 scale，可能带 zero-point，并采用专门格式；上例只解释基本机制。
    - 实际还包含量化元数据、KV cache、运行时 buffer、上下文和 GPU/CPU offload。低 bit 不保证更快：速度取决于硬件是否有高效
      kernel、内存带宽和后端实现。
    - "“至少 4-bit”只能作为经验起点。3-bit 大模型与 4/8-bit 小模型谁更好，要在目标任务测试；量化对困惑度、代码、数学和罕见语言的影响可能不同。"
    - 版本边界：模型仓库、LangChain 和 llama.cpp 接口会变化。实际运行前核对当前模型卡、chat template、EOS token、许可证与导入路径。
  - title: '2. Chains：扩展 LLM 能力（Chains: Extending the Capabilities of LLMs）'
    source_heading: '2. Chains：扩展 LLM 能力（Chains: Extending the Capabilities of LLMs）'
    paragraphs:
    - Chain 是应用规定的数据流：一个组件输出成为下一个组件输入。组件可以是 prompt、LLM、parser、retriever、函数或 validator。
    - API chat model 往往由服务端/SDK处理模板，但 role/content 仍是协议的一部分。
    - 复杂故事生成可拆成 title → character → story。固定顺序由应用决定，不由模型临时规划。
    - 每步 95% 并不意味着五步仍有 95%。生产 chain 需要中间 schema、retry policy、timeout、trace、幂等性和失败补偿。自然语言字符串是脆弱接口，能用
      typed object 就不要靠下游再猜字段。
  - title: '3. Memory：帮助 LLM “记住”对话（Memory: Helping LLMs to Remember Conversations）'
    source_heading: '3. Memory：帮助 LLM “记住”对话（Memory: Helping LLMs to Remember Conversations）'
    paragraphs:
    - 模型 API 通常是 stateless：每次调用只看到本次提供的 token。所谓 memory 是应用保存历史，并在后续调用重新放入上下文。
    - 单轮上下文线性增长，整场会话累计处理量近似二次增长。长历史还会增加 lost-in-the-middle 和注入污染风险。
    - 适用：短期客服上下文、最近状态比早期细节重要。关键用户属性、同意状态和业务事实不应只依赖滑动窗口，应放入经过验证的结构化 state。
    - PII 还需 consent、访问控制、加密、保留期限和删除能力。把聊天历史塞进 prompt 不等于合规 memory。
  - title: '4. Agents：创建 LLM 系统（Agents: Creating a System of LLMs）'
    source_heading: '4. Agents：创建 LLM 系统（Agents: Creating a System of LLMs）'
    paragraphs:
    - Agent 的能力来自模型、tools、orchestrator、state 和 guardrails 的组合。LLM 只生成 action request；真正执行网络、数据库或计算的是宿主程序。
    - 但模型生成的可见 Thought 不是可靠内部解释。生产系统更应记录结构化 action/observation 与简短 decision rationale，不必暴露冗长
      chain-of-thought。
    - Search tool 输出属于不可信外部输入。网页可能包含 prompt injection；不能让 observation 覆盖 system policy，也不能因为网页文字要求而调用高权限工具。
    - "“自主”不是目标本身。固定 workflow 能解决的任务，优先使用可预测 chain；只有路径确实依赖动态 observation 时才引入 agent。"
  - title: 6. 总结（Summary）
    source_heading: 6. 总结（Summary）
    paragraphs:
    - Full buffer 保真但 token 持续增长，window 有界但遗忘，summary 节省上下文但有损且更慢。
    - Agent 与 chain 的分界在控制流：agent 由模型动态选择 action，chain 由程序预先规定。
    - 限制自主循环：max steps、deadline、budget、stop condition 和 human approval。
    - 本章最重要的方法论是逐步增加自治：先让单次调用正确，再让固定 chain 可验证，再加入有界 memory，最后才把必要的决策交给 agent。每增加一层能力，都必须同步增加状态管理、观测、权限和失败控制。
  takeaways:
  - 本章使用 LangChain 展示抽象。框架 API 更新很快，类名和导入路径可能变化；稳定知识是组件边界、数据流和安全约束，不是某一版 import。现代
    LangChain 常用 LCEL/Runnable，复杂有状态 agent 也常由 LangGraph 等显式状态图承载。
  - 版本边界：模型仓库、LangChain 和 llama.cpp 接口会变化。实际运行前核对当前模型卡、chat template、EOS token、许可证与导入路径。
  - PII 还需 consent、访问控制、加密、保留期限和删除能力。把聊天历史塞进 prompt 不等于合规 memory。
  - "“自主”不是目标本身。固定 workflow 能解决的任务，优先使用可预测 chain；只有路径确实依赖动态 observation 时才引入 agent。"
  - 本章最重要的方法论是逐步增加自治：先让单次调用正确，再让固定 chain 可验证，再加入有界 memory，最后才把必要的决策交给 agent。每增加一层能力，都必须同步增加状态管理、观测、权限和失败控制。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5.1 GGUF 不等于量化」？
  answer: GGUF 是容器；FP16 GGUF 仍是 16-bit。文件名 Q4/Q8 才通常表示对应量化家族。
  source_heading: 5.1 GGUF 不等于量化
- level: 概念辨析
  question: 原文如何解释「5.5 Chain 不等于 agent」？
  answer: Chain 路径由开发者定义；agent 的 action 由模型在运行时选择。前者通常更确定、更易测试。
  source_heading: 5.5 Chain 不等于 agent
- level: 概念辨析
  question: 原文如何解释「5.9 长 context 不等于免费 memory」？
  answer: 历史越长，prefill、费用和注意力利用难度越高。窗口扩大不能消除 lost-in-the-middle。
  source_heading: 5.9 长 context 不等于免费 memory
- level: 概念辨析
  question: 原文如何解释「5.12 ReAct 的 Thought 不是真实内部解释」？
  answer: 可见文字有助调试协议，却不证明因果推理。应验证 action 与 observation，而非相信叙述。
  source_heading: 5.12 ReAct 的 Thought 不是真实内部解释
- level: 概念辨析
  question: 原文如何解释「5.16 框架抽象不等于免于理解底层」？
  answer: LangChain 简化连接，但 prompt、token、模型限制、状态、权限和错误传播仍由开发者负责。
  source_heading: 5.16 框架抽象不等于免于理解底层
