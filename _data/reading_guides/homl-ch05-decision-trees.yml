overview:
  kind: summary
  minutes: 8
  question: 原文围绕「阅读导引」建立了怎样的核心认识？
  question_source: 阅读导引
  thesis: 本章从一棵只有两层的 Iris 树出发：先人工走一遍预测路径，再解释节点统计量；随后反向追问这些切分是怎样学出来的，由此引出 CART 目标函数。接着观察无限制树的过拟合，介绍结构正则化；最后把同一算法换成回归损失，并分析轴向敏感和高方差。
  thesis_source: 阅读导引
  concepts:
  - term: 阅读导引
    meaning: 本章从一棵只有两层的 Iris 树出发：先人工走一遍预测路径，再解释节点统计量；随后反向追问这些切分是怎样学出来的，由此引出 CART 目标函数。接着观察无限制树的过拟合，介绍结构正则化；最后把同一算法换成回归损失，并分析轴向敏感和高方差。
    source_heading: 阅读导引
  - term: 3. Gini 不纯度
    meaning: 虽然叶 4 不是完全纯净，但 45/46 都是 virginica，所以不纯度很低。
    source_heading: 3. Gini 不纯度
  - term: 9.3 参数如何改变边界
    meaning: 太小：无法表达复杂边界，欠拟合。
    source_heading: 9.3 参数如何改变边界
  - term: 10.10 多输出树
    meaning: 多输出仍共享同一棵树结构，因此切分必须同时兼顾所有目标；若不同目标需要完全不同的分区，共享结构可能限制性能。
    source_heading: 10.10 多输出树
  - term: 11.6 替代方案
    meaning: 使用集成模型降低单树对某次轴向切分的依赖。
    source_heading: 11.6 替代方案
  - term: 19. 学习检查清单
    meaning: 能解释分类 CART 加权目标为什么不能简单平均
    source_heading: 19. 学习检查清单
  logic:
  - 阅读导引
  - 3. Gini 不纯度
  - 8. Gini 还是 Entropy
  - 10.10 多输出树
  - 11.3 为什么缩放不解决旋转问题
  - 13.1 现象
  - 19. 学习检查清单
  sections:
  - title: 阅读导引
    source_heading: 阅读导引
    paragraphs:
    - 决策树如何把一组 if/else 规则组织成预测模型？
    - 为什么随机森林能够修复单棵树的主要弱点？
    - 决策树把特征空间递归切成若干矩形区域；分类时，每个区域输出训练样本中最多的类别及其比例；回归时，每个区域输出训练目标的平均值。
    - 本章从一棵只有两层的 Iris 树出发：先人工走一遍预测路径，再解释节点统计量；随后反向追问这些切分是怎样学出来的，由此引出 CART 目标函数。接着观察无限制树的过拟合，介绍结构正则化；最后把同一算法换成回归损失，并分析轴向敏感和高方差。
  - title: 2.3 为什么树不需要特征缩放
    source_heading: 2.3 为什么树不需要特征缩放
    paragraphs:
    - 米换成厘米不会改变树的分区结构；
    - 但 PCA 这种混合多个特征的旋转变换会改变树。
  - title: 3. Gini 不纯度
    source_heading: 3. Gini 不纯度
    paragraphs:
    - 如果一个节点全部属于同一类别，它是纯节点；如果多个类别比例接近，它很不纯。
    - G_i：节点 i 的 Gini 不纯度；
    - 虽然叶 4 不是完全纯净，但 45/46 都是 virginica，所以不纯度很低。
  - title: 8. Gini 还是 Entropy
    source_heading: 8. Gini 还是 Entropy
    paragraphs:
    - 都可放入 CART 加权目标函数。
    - 大多数时候二者产生相似的树，没有普遍的准确率赢家。Gini 计算略快，是很好的默认选择。
  - title: 9.3 参数如何改变边界
    source_heading: 9.3 参数如何改变边界
    paragraphs:
    - 太小：无法表达复杂边界，欠拟合。
    - 降低树之间相关性，为随机森林打基础；
  - title: 10.10 多输出树
    source_heading: 10.10 多输出树
    paragraphs:
    - 节点误差可对所有输出平方误差求平均或求和。分类多输出任务则为每个输出保存各类别分布。
    - 多输出仍共享同一棵树结构，因此切分必须同时兼顾所有目标；若不同目标需要完全不同的分区，共享结构可能限制性能。
  - title: 11.3 为什么缩放不解决旋转问题
    source_heading: 11.3 为什么缩放不解决旋转问题
    paragraphs:
    - 单独缩放每个特征只改变坐标轴单位，不改变轴的方向。样本在每个特征上的顺序不变，树仍使用同类轴对齐切分。
    - 旋转敏感需要改变特征方向，而不是只改变尺度。
  - title: 11.6 替代方案
    source_heading: 11.6 替代方案
    paragraphs:
    - 使用可学习斜切分的 oblique tree；
    - 使用集成模型降低单树对某次轴向切分的依赖。
  - title: 13.1 现象
    source_heading: 13.1 现象
    paragraphs:
    - 训练数据、超参数甚至随机种子发生很小变化，树结构和决策边界都可能明显变化。
    - Scikit-Learn 在每次切分前会随机排列特征；当多个切分收益相同或接近时，随机顺序会影响最终选择。
  - title: 19. 学习检查清单
    source_heading: 19. 学习检查清单
    paragraphs:
    - 能推导 Gini 的概率含义和最大值
    - 能解释分类 CART 加权目标为什么不能简单平均
    - 能说明 CART 的候选阈值为何只需取相邻值中点
    - 能比较 Gini 和 Entropy
  takeaways:
  - 本章从一棵只有两层的 Iris 树出发：先人工走一遍预测路径，再解释节点统计量；随后反向追问这些切分是怎样学出来的，由此引出 CART 目标函数。接着观察无限制树的过拟合，介绍结构正则化；最后把同一算法换成回归损失，并分析轴向敏感和高方差。
  - 虽然叶 4 不是完全纯净，但 45/46 都是 virginica，所以不纯度很低。
  - 多输出仍共享同一棵树结构，因此切分必须同时兼顾所有目标；若不同目标需要完全不同的分区，共享结构可能限制性能。
  - 使用集成模型降低单树对某次轴向切分的依赖。
  - 能比较 Gini 和 Entropy
