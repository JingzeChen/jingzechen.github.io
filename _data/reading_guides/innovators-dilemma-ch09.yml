  minutes: 13
  question: 原文围绕「一、本章的问题与核心命题」建立了怎样的核心认识？
  question_source: 一、本章的问题与核心命题
  thesis: 核心命题：技术供给轨线与市场需求轨线的交汇，是产品生命周期阶段转换的根本原因。这把描述性的生命周期理论转化为可测量、可预测、可干预的战略工具。
  thesis_source: 十六、本章总结
  concepts:
  - term: 一、本章的问题与核心命题
    meaning: 在性能过度供给给破坏性技术带来威胁或机遇时，还会导致产品市场的竞争基础发生根本性变化。消费者选择产品或服务时所遵循的各种标准的排序将发生变化，从而标志着产品生命周期从一个阶段过渡到另一个阶段。
    source_heading: 一、本章的问题与核心命题
  - term: 四、性能过度供给和产品竞争的演变
    meaning: 两个理论的关系：购买等级从产品属性侧描述，摩尔从用户构成侧描述，但驱动力相同——都是某一属性被满足后，需求向下一属性转移。作者用它们互相印证，说明性能过度供给是一个跨理论、跨行业的普遍机制。
    source_heading: 四、性能过度供给和产品竞争的演变
  - term: 七、规律二：破坏性技术通常更简单、更便宜、更可靠、更便捷
    meaning: 由于无法设计一种真正简单、价廉的产品，Kittyhawk 项目的参与者将这种硬盘驱动器的容量发展到了这项技术的极限，并在产品中加入了一定的抗震和低能耗功能，使其具备了作为一种延续性产品的竞争力。当市场真正的大规模应用领域，即价格低廉、结构简单、功能单一的
      10MB 硬盘开始出现时，惠普公司的产品并不具备足够的破坏性来抓住这一轮变革所带来的机遇。
    source_heading: 七、规律二：破坏性技术通常更简单、更便宜、更可靠、更便捷
  - term: 八、发生在会计软件市场的性能过度供给
    meaning: Quicken 软件的开发者通过观察用户如何使用产品，而不是询问用户或”专家”需要什么来提高软件使用的便捷性……通过观察用户在使用产品的过程中可能会在哪些地方碰到困难或感到迷惑，开发者把精力主要放在了如何不断地使产品变得更简单、更方便上，以期为消费者提供包含足够的功能，而不是超强功能的产品。
    source_heading: 八、发生在会计软件市场的性能过度供给
  - term: 十一、正确的战略和错误的战略
    meaning: 惠普案例的注解极为关键：战略 1（向上逃逸）之所以”安全”，是因为惠普同时用喷墨部门占据了自己撤出的低端（第五章的”自杀以求生存”）。孤立地执行战略
      1 是危险的；配合自我破坏则是安全的。
    source_heading: 十一、正确的战略和错误的战略
  - term: 十六、本章总结
    meaning: 四个跨行业案例结构同构：硬盘的容量、会计软件的功能、胰岛素的纯度、挖掘机的铲斗容量——在位者都在已饱和的属性上继续巨额投入，破坏者都在未饱和的属性上以更低成本取胜。礼来与诺和的对照最为锐利：技术难度与商业回报呈负相关，投入更少、技术更简单的诺和笔获得了更稳固的
      30% 溢价。
    source_heading: 十六、本章总结
