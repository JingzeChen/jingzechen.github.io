  sections:
  - title: 一、本章的问题与核心命题
    source_heading: 一、本章的问题与核心命题
    paragraphs:
    - 前八章反复出现一张图：技术供给轨线与市场需求轨线相交。前面的章节用它解释领先企业为何陨落——交点之后，破坏性技术从价值网下方切入。
    - 在性能过度供给给破坏性技术带来威胁或机遇时，还会导致产品市场的竞争基础发生根本性变化。消费者选择产品或服务时所遵循的各种标准的排序将发生变化，从而标志着产品生命周期从一个阶段过渡到另一个阶段。
    - 市场营销文献长期描述”产品生命周期”（导入期、成长期、成熟期、衰退期）以及竞争基础的迁移，但通常把它当作时间的函数——好像产品自然会”变老”。
    - 关键澄清：过度供给是逐属性判定的，不是整体判定。一个产品可能在容量上过度供给、同时在体积上供给不足。正是这种不同属性的饱和时点不同，造就了竞争基础的依次迁移。
  - title: 二、性能过度供给和竞争基础的变化
    source_heading: 二、性能过度供给和竞争基础的变化
    paragraphs:
    - 但这显然不是当前的情况。的确，计算机生产商如果要使用 3.5 英寸硬盘的话，平均需要为每兆字节容量支付 20% 的溢价，但它们仍然对这种产品趋之若鹜。而且，计算机生产商在自身的产品市场面临激烈的价格竞争时，仍然倾向于使用更为昂贵的硬盘驱动器。
    - 在 1986 至 1988 年的台式个人电脑市场，相对于其他特征，硬盘驱动器的体积成为一项越来越重要的属性。体积更小的 3.5 英寸硬盘使得计算机生产商能够减小计算机的尺寸或者计算机在桌面所占的空间。例如，在
      IBM 公司，较大的 XT/AT 电脑让位于体积要小得多的新一代 PS1/PS2 计算机。
    - 一旦某项特定属性达到了所要求的性能水平，消费者便不会再像以前那样愿意为该项属性的持续改善支付溢价，这表明消费者对这项属性的需求已经得到满足。因此，性能过度供给导致竞争基础发生转变，而消费者用来选择产品的标准也转移到市场需求尚未得到满足的属性上。
    - 容量属性方面发生的性能过度供给引发了纵轴的第一次重新定义，即从容量过渡到体积。当这一项新属性的性能足以满足市场需求时，纵轴对性能定义再次发生了改变，以反映市场对可靠性的需求。因此，相比其他竞争产品，能够提供超强抗震性和有竞争力的平均故障间隔时间（MTBF）的产品一度享有很高的溢价。但当平均故障间隔时间的值接近
      100 万小时的时候，市场给予平均故障间隔时间每变动 100 小时的影子价格接近为零……之后……是激烈的价格竞争，在某些情况下，毛利率会降至 12% 以下。
  - title: 四、性能过度供给和产品竞争的演变
    source_heading: 四、性能过度供给和产品竞争的演变
    paragraphs:
    - 即”功能性”本身可能是多维的（容量、速度、体积……），需要在其内部再做一次排序。硬盘市场的容量→体积→可靠性迁移，正是”功能性内部细分”与”购买等级”叠加的结果。
    - 杰弗里·摩尔在他所著的《跨越鸿沟》（Crossing the Chasm）一书中介绍了另外一种有关行业演变的实用概念。这一概念有着类似的基本逻辑，但是从用户而不是产品的角度来阐述。
    - 两个理论的关系：购买等级从产品属性侧描述，摩尔从用户构成侧描述，但驱动力相同——都是某一属性被满足后，需求向下一属性转移。作者用它们互相印证，说明性能过度供给是一个跨理论、跨行业的普遍机制。
    - 竞争基础的这一演变模式——从功能性到可靠性和便捷性，最后到价格——曾经发生在目前已讨论过的许多市场中。实际上，破坏性技术的一个基本特征就是它预示了竞争基础即将发生改变。
  - title: 五、破坏性技术的其他普遍特征
    source_heading: 五、破坏性技术的其他普遍特征
    paragraphs:
    - 首先，破坏性产品在主流市场几乎没有价值的属性通常成为它们在新兴市场最大的卖点；其次，相比成熟产品，破坏性产品一般更简单、更便宜，也更可靠、更便捷。
    - 即便破坏性技术特定的市场应用领域是无法预知的，管理者仍然可以利用以下两条规律。
  - title: 七、规律二：破坏性技术通常更简单、更便宜、更可靠、更便捷
    source_heading: 七、规律二：破坏性技术通常更简单、更便宜、更可靠、更便捷
    paragraphs:
    - 一旦液压挖掘机的铲斗具备了处理 2~4 立方码土方的能力（超过了主流市场对性能的要求），承建商便很快地开始采用这些产品，即使缆索挖掘机每铲能够推动更多的土方。由于两种技术所提供的铲斗容量均超出了他们的要求，承建商将更倾向于选择更加可靠的技术——液压技术。
    - 由于无法设计一种真正简单、价廉的产品，Kittyhawk 项目的参与者将这种硬盘驱动器的容量发展到了这项技术的极限，并在产品中加入了一定的抗震和低能耗功能，使其具备了作为一种延续性产品的竞争力。当市场真正的大规模应用领域，即价格低廉、结构简单、功能单一的
      10MB 硬盘开始出现时，惠普公司的产品并不具备足够的破坏性来抓住这一轮变革所带来的机遇。
    - "“并不具备足够的破坏性”（not disruptive enough）是一个极富启发的表述——它把”破坏性”当作一种需要刻意保持的产品特质，而不是自然状态。在位企业的重力会不断把产品往上拉，必须主动对抗。"
    - 这条规律给产品设计的直接启示：破坏性产品的设计目标是“足够好”（good enough）而非”最好”。用第八章的语言说，这与成熟组织的价值观直接冲突——这正是需要独立机构的又一理由。
  - title: 八、发生在会计软件市场的性能过度供给
    source_heading: 八、发生在会计软件市场的性能过度供给
    paragraphs:
    - Quicken 软件的开发者通过观察用户如何使用产品，而不是询问用户或”专家”需要什么来提高软件使用的便捷性……通过观察用户在使用产品的过程中可能会在哪些地方碰到困难或感到迷惑，开发者把精力主要放在了如何不断地使产品变得更简单、更方便上，以期为消费者提供包含足够的功能，而不是超强功能的产品。
    - Intuit 公司具有市场破坏性的 QuickBooks 软件将产品竞争的基础从功能性转变为便捷性，并在产品推出两年后占据了 70% 的市场份额。实际上，到
      1995 年，QuickBooks 在 Intuit 公司的收入中所占的比重已经超过了 Quicken。
    - 即便是计算机通常不会在加减运算中犯错，市场上的每一种会计软件包仍然继续使用复式簿记会计系统——最早由威尼斯商人发明，目的是为了查找记账过程中发生的运算错误。Intuit
      公司可以通过去掉不需要的产品功能来极大地简化它的产品。
    - 可以预见的是，在面对 Intuit 公司的冲击时，成熟小型企业会计软件生产商的反应就是继续推出功能更强大的软件包，以进一步向高端市场转移。这些软件主要针对特定的市场部门，目标消费者是更高端市场上对信息系统的要求更高的高端用户。
  - title: 十、控制产品竞争的演变
    source_heading: 十、控制产品竞争的演变
    paragraphs:
    - 在个人电脑行业，随着台式计算机的功能性足以满足较低级别市场的需求，诸如戴尔公司和捷威 2000 公司等新进新兴企业开始进入这一市场，并提出了以购买和使用的便捷性为中心内容的价值主张。面对新兴企业的冲击，康柏公司的应对之举是积极实施第二种方法，即根据更低级别市场的需求生产出功能适度的低价计算机系列产品，以竭力抑制企业进入高端市场的趋势。
    - 一些计算机行业的分析人士认为，微软公司、英特尔公司和硬盘驱动器企业非常有效地执行了最后一种战略。微软公司利用其行业主导地位成功地研制并营销了需要占用巨大硬盘驱动器内存，且需要速度更快的微处理器来运行的软件包。微软公司最终提高了消费者要求的功能改善轨线的坡度，并使之与微软公司技术人员提供的功能改善坡度平行。
    - 原书图示：更新至1996年的硬盘驱动器轨线图图 9.5 描绘了这一战略的影响……需要注意的是，中等价位的台式和笔记本电脑部门所要求的容量轨线在 20 世纪
      90 年代出现上扬，并最终与 3.5 英寸和 2.5 英寸硬盘生产商开辟的容量改善轨线平行。
    - 为什么战略 3 终究脆弱：它要求需求端能持续吸收供给端的改善。而”注意观察一般用户如何使用”（第七章的方法）会发现，真实使用早已落后于名义需求——厂商推动的需求增长与用户的真实需求之间会累积出缺口，而这个缺口就是破坏者的入口。
  - title: 十一、正确的战略和错误的战略
    source_heading: 十一、正确的战略和错误的战略
    paragraphs:
    - 惠普案例的注解极为关键：战略 1（向上逃逸）之所以”安全”，是因为惠普同时用喷墨部门占据了自己撤出的低端（第五章的”自杀以求生存”）。孤立地执行战略 1
      是危险的；配合自我破坏则是安全的。
    - 这些成功的战略实施者都有一个共同的特点，那就是不管是有意识的还是出于本能，他们都深刻理解了消费者的需求曲线和技术人员的供给曲线。到目前为止，理解这些曲线是他们获得成功的关键。
    - 但能够长期做到这一点的企业屈指可数。大多数运行良好的企业都会不自觉地向坐标图的左上角方向移动，从而导致自己身陷竞争基础发生改变的漩涡，并招致破坏性技术从价值网下方发起的攻击。
    - "“不自觉地”（unwittingly）是关键词——这与第四、五、八章完全一致：向上移动不是一个被决策的战略，而是资源分配流程、毛利率门槛与客户压力共同作用下的默认漂移。"
  - title: 十五、面向实践的分析模板
    source_heading: 十五、面向实践的分析模板
    paragraphs:
    - 若无法回归，用替代信号：客户是否还会为该属性的提升更换供应商？销售是否还用它作卖点？
    - 检查：我们的研发投入是否集中在第 k 个属性上？若集中在已饱和属性，即为优泌林式错误。
    - 问：”我们的核心功能当初是为了解决什么问题？那个问题今天还存在吗？“（复式记账）
    - 把挑战定义为市场营销挑战（找到看重当前属性的客户），而非技术挑战（改造到达标）。
  - title: 十六、本章总结
    source_heading: 十六、本章总结
    paragraphs:
    - 核心命题：技术供给轨线与市场需求轨线的交汇，是产品生命周期阶段转换的根本原因。这把描述性的生命周期理论转化为可测量、可预测、可干预的战略工具。
    - 三个读数（0.007/0.20/1.5）换算份额为 0.695%/16.67%/60%，与原书完全吻合；替代半程点约 1988 年年中，恰与容量达标时点重合。
    - 四个跨行业案例结构同构：硬盘的容量、会计软件的功能、胰岛素的纯度、挖掘机的铲斗容量——在位者都在已饱和的属性上继续巨额投入，破坏者都在未饱和的属性上以更低成本取胜。礼来与诺和的对照最为锐利：技术难度与商业回报呈负相关，投入更少、技术更简单的诺和笔获得了更稳固的
      30% 溢价。
    - 最深刻的一层在课堂讨论中：礼来的错误无法通过更好的调研纠正，因为障碍有三层——受访者是最专业的内分泌学家、其患者是最极端的病例、而”纯度 = 更好”经
      50 多年验证已沉淀为文化假设，问题本身不会被提出。这与第八章的”文化 = 根据假设而非判断行事”精确衔接。
  takeaways:
  - 核心命题：技术供给轨线与市场需求轨线的交汇，是产品生命周期阶段转换的根本原因。这把描述性的生命周期理论转化为可测量、可预测、可干预的战略工具。
  - Excel 需求增速 50.75%/年与硬盘容量供给增速约 50%/年几乎完全相等，为战略 3 提供了精确的量化验证。
  - 最深刻的一层在课堂讨论中：礼来的错误无法通过更好的调研纠正，因为障碍有三层——受访者是最专业的内分泌学家、其患者是最极端的病例、而”纯度 = 更好”经 50
    多年验证已沉淀为文化假设，问题本身不会被提出。这与第八章的”文化 = 根据假设而非判断行事”精确衔接。
  - 三种应对战略无优劣之分（向上逃逸、紧跟需求、拉高需求斜率），成功者的共同点只有一个：深刻理解需求曲线与供给曲线。而全章的收尾警告是——
  - 十亿美元买来的教训是：在客户已经满意的地方继续努力，努力本身不产生价值。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「13.1 “性能过度供给 = 产品做得太好，是浪费”」？
  answer: 不完全对。过度供给是相对于特定市场部门而言的。5.25 英寸硬盘对台式机市场过度供给，对高端市场仍有溢价。优泌林对普通患者过度供给，对免疫患者仍有价值。判断必须绑定市场部门。
  source_heading: 13.1 “性能过度供给 = 产品做得太好，是浪费”
- level: 概念辨析
  question: 原文如何解释「13.4 “商品化意味着产品之间没有差异了”」？
  answer: 不对。作者明确指出差异仍然存在，只是”当产品特色和功能已经超出市场需求时，差异化也就失去了意义“。有差异 ≠ 差异值钱。
  source_heading: 13.4 “商品化意味着产品之间没有差异了”
- level: 概念辨析
  question: 原文如何解释「13.6 “礼来应该做几个焦点小组就能避免错误”」？
  answer: 这正是作者课堂上被推翻的第一轮判断。三层障碍：受访医生是最专业的内分泌学家、其患者是最极端的病例、最根本的是”纯度=更好”已成文化假设，问题本身不会被提出。调研只能回答被提出的问题。
  source_heading: 13.6 “礼来应该做几个焦点小组就能避免错误”
- level: 概念辨析
  question: 原文如何解释「13.8 “战略 3（拉高需求）是最优解”」？
  answer: 不对。作者明确说”没有所谓的最佳战略“。战略 3 需要产业主导地位，且作者当场指出其脆弱性（Excel 功能已超需求）。它推迟破坏，不能消除破坏。
  source_heading: 13.8 “战略 3（拉高需求）是最优解”
- level: 概念辨析
  question: 原文如何解释「13.10 “复式记账被简化说明传统方法是错的”」？
  answer: 不对。复式记账在人工计算时代正确地解决了查错问题。它变成冗余不是因为它错了，而是因为它要解决的问题消失了（计算机不会算错）。这提示一类特殊的过度供给：需求消失而功能留存。
  source_heading: 13.10 “复式记账被简化说明传统方法是错的”
