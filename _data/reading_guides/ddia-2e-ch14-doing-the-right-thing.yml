overview:
  kind: summary
  minutes: 21
  question: 原文围绕「0. 本章定位：系统指标之外，还有人的尊严、权利与处境」建立了怎样的核心认识？
  question_source: 0. 本章定位：系统指标之外，还有人的尊严、权利与处境
  thesis: affected person应获得：notice、decision/result、relevant data、understandable reason、correction
    path、human reconsideration、deadline与remedy。系统记录appeal ID与original/model/data versions。
  thesis_source: 5. 知识结构与证据地图
  concepts:
  - term: 0. 本章定位：系统指标之外，还有人的尊严、权利与处境
    meaning: 训练数据包含世界的beauty、ugliness与cruelty，却期待model只反映beauty，是不现实的。model不会自动滤掉社会中的discrimination、stereotypes与harm；这些问题会经data
      collection、labels、objectives和deployment进入output。
    source_heading: 0. 本章定位：系统指标之外，还有人的尊严、权利与处境
  - term: 2. Privacy and Tracking
    meaning: 原章引用：consent应 freely given, specific, informed, and unambiguous，且可 refuse
      or withdraw without detriment；request需clear/plain/accesssible，silence、pre-ticked
      boxes、inactivity不构成consent。
    source_heading: 2. Privacy and Tracking
  - term: 4.45 误区的统一根源
    meaning: 正确做法是追踪 purpose、stakeholders、power、data lifecycle、decision/error distribution、feedback、agency、accountability与real-world
      outcomes。
    source_heading: 4.45 误区的统一根源
  - term: 5. 知识结构与证据地图
    meaning: affected person应获得：notice、decision/result、relevant data、understandable
      reason、correction path、human reconsideration、deadline与remedy。系统记录appeal ID与original/model/data
      versions。
    source_heading: 5. 知识结构与证据地图
  - term: 7. 核心结论
    meaning: responsible innovation不要求zero risk，而要求necessity、proportionality、rights、reversibility、recourse与residual-risk
      honesty。
    source_heading: 7. 核心结论
  - term: 9. References
    meaning: 'Stephanie Assad, Robert Clark, Daniel Ershov, and Lei Xu. “Algorithmic
      Pricing and Competition: Empirical Evidence from the German Retail Gasoline
      Market.” Journal of Political Economy, March 2024. doi:10.1086/726906'
    source_heading: 9. References
  logic:
  - 0. 本章定位：系统指标之外，还有人的尊严、权利与处境
  - 2. Privacy and Tracking
  - 3. Summary：data-intensive能力越强，对人的责任越大
  - 5. 知识结构与证据地图
