  sections:
  - title: 0. 本章定位：系统指标之外，还有人的尊严、权利与处境
    source_heading: 0. 本章定位：系统指标之外，还有人的尊严、权利与处境
    paragraphs:
    - 训练数据包含世界的beauty、ugliness与cruelty，却期待model只反映beauty，是不现实的。model不会自动滤掉社会中的discrimination、stereotypes与harm；这些问题会经data
      collection、labels、objectives和deployment进入output。
    - "“data”不是抽象bytes：可能描述behavior、interest、identity、relationships、location、health与economic
      distress。处理personal data时，human dignity不是secondary nonfunctional requirement。"
    - architecture、retention、feature、threshold与metric都是value choices。不能说“我只实现技术，business/legal决定后果”；engineer掌握mechanism与failure
      modes，因而负有提出风险、拒绝明显harm和建立safeguards的责任。
    - ACM Code等professional guidelines要求avoid harm、fairness、privacy、honesty和public
      good。问题不在缺少口号，而在它们很少进入requirements、design review、launch gate和incident accountability。
  - title: 1. Predictive Analytics
    source_heading: 1. Predictive Analytics
    paragraphs:
    - weather/disease spread预测主要作用于collective planning；预测某convict recidivism、loan
      default、insurance claim或job performance，会直接改变individual access torights/opportunities。
    - self-driving accident、racial/religious credit discrimination、criminal risk score都要求调查：谁selected
      objective/data，谁validated，谁ignored warning，affected person如何remedy。
    - financial shock → missed payment → lower credit score → fewer job opportunities
      → lower income → further missed payments。把credit用于hiring让temporary misfortune自我强化为poverty
      trap。
    - 预测模型把statistical uncertainty转成real opportunities/denials。历史bias、proxy、opaque
      grouping与asymmetric error cost会放大harm；feedback loop还会让prediction制造它声称只是观察的reality。
  - title: 2. Privacy and Tracking
    source_heading: 2. Privacy and Tracking
    paragraphs:
    - 原章引用：consent应 freely given, specific, informed, and unambiguous，且可 refuse or
      withdraw without detriment；request需clear/plain/accesssible，silence、pre-ticked
      boxes、inactivity不构成consent。
    - collector能observe millions individuals，individual无法observe collector decisions；terms
      nonnegotiable、appeal weak。privacy engineering必须加入transparency/oversight来counterbalance。
    - low-risk aggregate telemetry可lighter review；high-impact health/biometric/location/prediction需stricter
      access、independent review、security、appeal与sunset。不能one-size-fits-all。
    - organization应在law之外设red lines、data review board、ethics escalation、whistleblower
      protection、launch authority与public transparency。self-regulation不能替代external
      accountability。
  - title: 3. Summary：data-intensive能力越强，对人的责任越大
    source_heading: 3. Summary：data-intensive能力越强，对人的责任越大
    paragraphs:
    - durability/isolation/atomicity保护data integrity，却不阻止buggy/harmful business rule。legal/ethical
      correctness仍需application-level invariant与recourse。
    - unbundled dataflow、request IDs、selective coordination与audit提高evolvability/correctness。本章把audit继续扩展到社会outcomes与people’s
      ability to contest/use control。
    - data可用于weather、medicine、accessibility、fraud prevention与public good；也可discriminate、exploit、surveil、manipulate、concentrate
      power并在breach中暴露intimate life。
    - engineers理解what is technically possible、what can fail与what data reveals，不能把ethics完全交给legal/product。responsibility包括speak
      up、document risks、build safeguards和stop unsafe launch。
  - title: 4.45 误区的统一根源
    source_heading: 4.45 误区的统一根源
    paragraphs:
    - 这些误区把形式动作当实质保障：accuracy当fairness、checkbox当consent、encryption当privacy、legality当ethics、collection当asset而忽略power/harm。
    - 正确做法是追踪 purpose、stakeholders、power、data lifecycle、decision/error distribution、feedback、agency、accountability与real-world
      outcomes。
  - title: 5. 知识结构与证据地图
    source_heading: 5. 知识结构与证据地图
    paragraphs:
    - affected person应获得：notice、decision/result、relevant data、understandable reason、correction
      path、human reconsideration、deadline与remedy。系统记录appeal ID与original/model/data
      versions。
    - 考虑authorized collector、partner、insider、criminal、acquirer/bankruptcy、government、future
      regime与model inference。分别评估access、motive、scale、detectability与remedy。
    - "| Item | Benefit evidence | Harm | Likelihood/uncertainty | Mitigation | Residual
      risk | Owner | |—|—|—|—|—|—|—|"
    - rights/red lines不能仅靠numeric score抵消；register用于reasoned comparison和accountability。
  - title: 6. 综合案例：AI辅助贷款申请与可申诉decision system
    source_heading: 6. 综合案例：AI辅助贷款申请与可申诉decision system
    paragraphs:
    - 发布system purpose、automated role、data categories、aggregate approval/error/appeal
      outcomes、major changes/incidents与governance，不泄露individual data或enable gaming
      beyondreasonable risk。
    - no secret final denials、no irrelevant intimate/social data、no unappealable decision、no
      deployment without subgroup evidence、no coercive optional-data consent、no indefinite
      retention、no reuse asgeneral reputation score。
    - fairness definitions conflict；labels/counterfactuals imperfect；human reviewers
      biased；appeal不能消除initial harm；privacy/security不perfect；economic outcomes受many
      factors。transparency about limits是responsibility的一部分。
    - responsible lending不是给model加fairness metric，而是重新设计whole decision institution：minimal
      relevant data、uncertainty-aware policy、real human judgment、specific reasons、accessible
      appeal、continuous group/outcome monitoring、purpose limits与accountable power。
  - title: 7. 核心结论
    source_heading: 7. 核心结论
    paragraphs:
    - many automated denials可组合为algorithmic prison，严重限制jobs、housing、finance、insurance与social
      participation。
    - high-impact decisions需要specific reasons、data correction、human reconsideration、accessible
      appeal与timely remedy。
    - Industrial Revolution说明innovation不会自动internalize pollution、worker与safety harms；data
      economy也需social safeguards。
    - responsible innovation不要求zero risk，而要求necessity、proportionality、rights、reversibility、recourse与residual-risk
      honesty。
  - title: 8. 负责任数据系统的一般方法
    source_heading: 8. 负责任数据系统的一般方法
    paragraphs:
    - 区分consent、contract、legal/legitimate basis；consent按free/specific/informed/unambiguous/withdrawable验证。提供plain
      notice、purpose choices与usable controls。
    - least privilege、purpose-scoped access、separation、encryption、on-device/aggregate
      alternatives、TTL、deletion propagation、breach response与backup expiry。
    - monitor subgroup errors、selection、appeals/overturns、human overrides、complaints、wellbeing/economic
      outcomes、drift、purpose use与security incidents。发现harm有pause/repair protocol。
    - 方法的核心顺序是：先证明purpose值得且必要，再最小化data与power；把statistical model放进可解释、可申诉、可停止的human
      institution中，持续观察feedback与真实outcomes，并让retention、deletion和sunset结束风险。
  - title: 9. References
    source_heading: 9. References
    paragraphs:
    - 'United States Senate Committee on Commerce, Science, and Transportation. “A
      Review of the Data Broker Industry: Collection, Use, and Sale of Consumer Data
      for Marketing Purposes.” December 2013.'
    - 'Stephanie Assad, Robert Clark, Daniel Ershov, and Lei Xu. “Algorithmic Pricing
      and Competition: Empirical Evidence from the German Retail Gasoline Market.”
      Journal of Political Economy, March 2024. doi:10.1086/726906'
    - Imanol Arrieta Ibarra, Leonard Goff, Diego Jiménez Hernández, Jaron Lanier,
      and E. Glen Weyl. “Should We Treat Data as Labor? Moving Beyond ‘Free.’” AEA
      Papers and Proceedings, May 2018.
    - 'Pengyuan Wang, Li Jiang, and Jian Yang. “The Early Impact of GDPR Compliance
      on Display Advertising: The Case of an Ad Publisher.” Journal of Marketing Research,
      April 2023. doi:10.1177/00222437231171848'
  takeaways:
  - 伦理不是model-only property；任何stage都可产生harm或纠正它。
  - 考虑authorized collector、partner、insider、criminal、acquirer/bankruptcy、government、future
    regime与model inference。分别评估access、motive、scale、detectability与remedy。
  - govern future reuse/owners；
  - systems thinking必须同时分析software、people、institutions、incentives、delays与unintended
    consequences。
  - 做正确的事，就是让technology增强people的agency与wellbeing，而非把people变成无权质疑的scores、segments和surveillance
    inputs。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「4.1 “ethics 是launch前勾一次checklist”」？
  answer: 错误。context、population、model与use会变化；伦理是participatory、iterative、accountable
    lifecycle。checklist只防遗漏。
  source_heading: 4.1 “ethics 是launch前勾一次checklist”
- level: 概念辨析
  question: 原文如何解释「4.12 “probability score是真实individual property”」？
  answer: 错误。score是population/model conditional estimate，有uncertainty与distribution
    assumptions；不能把person本质化为“风险者”。
  source_heading: 4.12 “probability score是真实individual property”
- level: 概念辨析
  question: 原文如何解释「4.23 “privacy policy越长越充分告知”」？
  answer: 错误。不可理解/不可访问文本破坏informed choice。layered plain notice和just-in-time context更有意义。
  source_heading: 4.23 “privacy policy越长越充分告知”
- level: 概念辨析
  question: 原文如何解释「4.34 “storage便宜，所以retain forever”」？
  answer: 错误。retention增加breach/purpose-creep/deletion cost与future actor exposure；storage
    price只是很小一部分social cost。
  source_heading: 4.34 “storage便宜，所以retain forever”
- level: 概念辨析
  question: 原文如何解释「4.45 误区的统一根源」？
  answer: 正确做法是追踪 purpose、stakeholders、power、data lifecycle、decision/error distribution、feedback、agency、accountability与real-world
    outcomes。
  source_heading: 4.45 误区的统一根源
