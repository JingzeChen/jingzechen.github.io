  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 带障碍的区间转移。 Jump Game VII 的合法前驱是滑动区间，但落点零是离散的，因此用前缀和或窗口计数判断“区间内是否存在可达状态”。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 所有题目都叫“跳跃游戏”，不代表它们能套同一个贪心模板。只要允许后退、同值跳转、跳跃距离范围受限或存在连续字符约束，状态图的结构就会改变。
    source_heading: 本章要解决什么问题
  - term: 23.1 跳跃问题概述
    meaning: 某些向右跳问题具有一个特殊性质：从已经可达的一段前缀出发，下一跳可达位置的并集仍是连续前缀。此时不必保存层内每个位置，只需保存最远右边界。
    source_heading: 23.1 跳跃问题概述
  - term: 23.2 跳跃问题的求解
    meaning: 普通相邻边始终被完整检查。同值边在其值第一次被弹出时被完整检查；由上面的距离论证，后续同值展开无法产生更短距离，所以清空桶不会漏掉最短路径。
    source_heading: 23.2 跳跃问题的求解
  - term: 2. DFS、BFS 与 DP 都是在处理同一个状态图
    meaning: 方法名不同，并不意味着问题模型不同。先写出状态与边，通常比先猜算法更可靠。
    source_heading: 2. DFS、BFS 与 DP 都是在处理同一个状态图
  - term: 6. 可达性与最短路所需信息不同
    meaning: Jump Game I 只问是否可达，一个最远边界足够；Jump Game II 还要知道跨了多少层，因此必须区分当前层和下一层。
    source_heading: 6. 可达性与最短路所需信息不同
  - term: 本章总结
    meaning: 带障碍的区间转移。 Jump Game VII 的合法前驱是滑动区间，但落点零是离散的，因此用前缀和或窗口计数判断“区间内是否存在可达状态”。
    source_heading: 本章总结
