  - 本章总结
  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 何时能用贪心维护一个最远边界，何时必须用 BFS/DFS 逐状态访问。
    - "“每次跳到当前最远位置”不一定最优；真正重要的是该位置下一步能把边界推进多远。"
    - 所有题目都叫“跳跃游戏”，不代表它们能套同一个贪心模板。只要允许后退、同值跳转、跳跃距离范围受限或存在连续字符约束，状态图的结构就会改变。
    - 本章的主线是：先把题目翻译成状态与边，再根据图的特殊结构选择 DP、贪心、DFS 或 BFS。
  - title: 23.1 跳跃问题概述
    source_heading: 23.1 跳跃问题概述
    paragraphs:
    - 若很多位置都能跳到大量后继，搜索树分支数会迅速增长。粗略地说，若每层平均有 b 个选择、路径深度为 h，时间可能达到
    - 普通 BFS 至多访问 n 个位置，但若对位置 i 显式枚举 a_i 条边，最坏边数可能为
    - 因此“BFS 是否超时”不能只看搜索树直觉，还取决于是否会重复生成稠密的区间边。本章后面的题会用区间扫描、删除已访问位置或同值分组来减少边生成成本。
    - 某些向右跳问题具有一个特殊性质：从已经可达的一段前缀出发，下一跳可达位置的并集仍是连续前缀。此时不必保存层内每个位置，只需保存最远右边界。
  - title: 23.2 跳跃问题的求解
    source_heading: 23.2 跳跃问题的求解
    paragraphs:
    - 在 LeetCode 55 中，从可达位置出发，可以落到一个没有障碍的连续区间；因此“所有可达位置的并集”是连续前缀。
    - 原文勘误说明：原文写“若区间和等于 1，则存在可达位置”。区间内可能有多个可达位置，正确判断是区间和大于 0。
    - 普通相邻边始终被完整检查。同值边在其值第一次被弹出时被完整检查；由上面的距离论证，后续同值展开无法产生更短距离，所以清空桶不会漏掉最短路径。
    - 到达同一位置 p 时，若上一跳是向左，则下一步不能再向左；若上一跳不是向左，则左右都可能合法。两种到达方式的未来选择集合不同。
  - title: 2. DFS、BFS 与 DP 都是在处理同一个状态图
    source_heading: 2. DFS、BFS 与 DP 都是在处理同一个状态图
    paragraphs:
    - BFS 按单位边数分层，适合最少跳数；
    - DP 要求存在可用的无环顺序或可压缩递推关系；
    - 贪心进一步证明整组状态可以由边界代表。
    - 方法名不同，并不意味着问题模型不同。先写出状态与边，通常比先猜算法更可靠。
  - title: 6. 可达性与最短路所需信息不同
    source_heading: 6. 可达性与最短路所需信息不同
    paragraphs:
    - Jump Game I 只问是否可达，一个最远边界足够；Jump Game II 还要知道跨了多少层，因此必须区分当前层和下一层。
    - 这说明状态压缩应由输出目标决定：仅保留“能回答最终问题”的信息，不能丢掉目标仍然需要的层次或资源维度。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 连续可达前缀。 Jump Game I 只维护最远边界；Jump Game II 再维护 BFS 层边界以计算最少跳数。
    - 带障碍的区间转移。 Jump Game VII 的合法前驱是滑动区间，但落点零是离散的，因此用前缀和或窗口计数判断“区间内是否存在可达状态”。
    - 历史相关状态。 到家问题中，位置不能决定下一步能否后跳，必须把上一跳方向纳入状态，并为无限数轴证明有限安全边界。
    - 跳跃问题真正训练的不是某一个模板，而是从动作规则中识别图结构，再证明哪些状态必须保留、哪些状态可以安全合并。
  takeaways:
  - 连续可达前缀。 Jump Game I 只维护最远边界；Jump Game II 再维护 BFS 层边界以计算最少跳数。
  - 历史相关状态。 到家问题中，位置不能决定下一步能否后跳，必须把上一跳方向纳入状态，并为无限数轴证明有限安全边界。
  - 一步能生成哪些边，边权是否都为 1？
  - 是否存在会被反复扫描的批量边，可否按组只处理一次？
  - 跳跃问题真正训练的不是某一个模板，而是从动作规则中识别图结构，再证明哪些状态必须保留、哪些状态可以安全合并。
