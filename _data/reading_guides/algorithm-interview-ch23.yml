checks:
- level: 概念辨析
  question: 原文如何解释「1. “跳到最远”有三种不同含义」？
  answer: 因此“贪心选择最远”必须说明最远的是当前落点、下一步覆盖端点，还是整层可达边界。
  source_heading: 1. “跳到最远”有三种不同含义
- level: 概念辨析
  question: 原文如何解释「2. DFS、BFS 与 DP 都是在处理同一个状态图」？
  answer: 方法名不同，并不意味着问题模型不同。先写出状态与边，通常比先猜算法更可靠。
  source_heading: 2. DFS、BFS 与 DP 都是在处理同一个状态图
- level: 概念辨析
  question: 4. 为什么在入队时标记访问？
  answer: 若等到出队才标记，两个已出队前驱可能同时发现同一后继，使它重复入队。单位权 BFS 中，第一次发现状态时已经得到最短距离，因此应立即标记，不需要等待出队确认。
  source_heading: 4. 为什么在入队时标记访问
- level: 概念辨析
  question: 5. 清空邻接信息为什么有时安全、有时危险？
  answer: Jump Game IV 可以清空同值桶，是因为第一次展开已经以最小 BFS 距离松弛了桶内全部位置；后续展开不可能改善。
  source_heading: 5. 清空邻接信息为什么有时安全、有时危险
- level: 概念辨析
  question: 原文如何解释「6. 可达性与最短路所需信息不同」？
  answer: Jump Game I 只问是否可达，一个最远边界足够；Jump Game II 还要知道跨了多少层，因此必须区分当前层和下一层。
  source_heading: 6. 可达性与最短路所需信息不同
