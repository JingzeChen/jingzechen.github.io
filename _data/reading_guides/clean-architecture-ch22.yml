  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: Database 应可从 Oracle、SQL Server 换成 Mongo、BigTable、CouchDB 或其他存储，而不重写核心业务。
  thesis_source: 17. 本章总结
  concepts:
