  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Controller 在运行时调用 Use Case，源码依赖向内；
    - Use Case 在运行时调用 Presenter，但通过内层 Output Port，使源码依赖仍然向内；
    - 数据从 Web 进入核心，再从核心流回 View；
    - 数据格式每过一个边界都转换成更适合内层的简单结构。
  - title: 2.7 如何快速证伪这些特征
    source_heading: 2.7 如何快速证伪这些特征
    paragraphs:
    - 删除 Web Adapter 后构建核心；
    - 不启动数据库测试 Use Case；
    - 用 Console 驱动同一用例；
    - 用内存 Gateway 替代真实存储；
  - title: 6. Use Cases
    source_heading: 6. Use Cases
    paragraphs:
    - Use Cases 层包含 Application-Specific Business Rules，也就是应用特定业务规则。
    - Use Case 变化不影响 Entity；
    - UI、Database、Framework 变化不影响 Use Case；
    - Use Case 依赖内层拥有的 Data Access Port，外层实现该 Port。
  - title: 7.7 SQL 放在哪里
    source_heading: 7.7 SQL 放在哪里
    paragraphs:
    - 原书允许 SQL 位于 Interface Adapters 中与数据库相关的部分。
    - SQL 不进入 Use Cases；
    - 数据库 Row 不跨越边界进入核心。
    - 团队也可以把 SQL 与驱动 Glue Code 再细分到最外层，四个圆不是硬模板。
  - title: 9.3 也可能只需要更少层
    source_heading: 9.3 也可能只需要更少层
    paragraphs:
    - Use Case 与部分领域政策放在同一组件；
    - Controller 与 Presenter 放在同一 Adapter 模块；
  - title: 10.6 Input Port 怎样工作
    source_heading: 10.6 Input Port 怎样工作
    paragraphs:
    - Controller 依赖 Use Case 层定义的 Input Boundary。
    - Controller 可以调用 Use Case；
    - 外层 Controller 依赖内层端口；
    - Use Case 不知道具体 Controller。
  - title: 12.1 完整角色
    source_heading: 12.1 完整角色
    paragraphs:
    - Use Case Interactor；
    - Data Access Interface；
    - Output Boundary；
  - title: 12.13 变化怎样被局部化
    source_heading: 12.13 变化怎样被局部化
    paragraphs:
    - 修改 Web Glue / Controller；
    - 修改 Data Access 与 Migration；
    - Use Case 接口若语义未变，则核心不变。
    - 外层测试和 Adapter 可能需要适配结果。
  - title: 14.3 检查内层出现的外层名称
    source_heading: 14.3 检查内层出现的外层名称
    paragraphs:
    - Web Framework 类型；
    - HttpRequest / HttpResponse；
    - Concrete Adapter；
  - title: 17. 本章总结
    source_heading: 17. 本章总结
    paragraphs:
    - DCI 代表 Data、Context、Interaction，由 James Coplien 与 Trygve Reenskaug 提出。
    - Database 应可从 Oracle、SQL Server 换成 Mongo、BigTable、CouchDB 或其他存储，而不重写核心业务。
    - Figure 22.2 的输入路径是 Web Server、Controller、InputData、InputBoundary、UseCaseInteractor。
    - 页面格式变化停在 Presenter / View，Web Framework 变化停在 Web Adapter，Schema 变化停在 Data Access。
  takeaways:
  - 第 22 章把边界、政策层级、业务规则和尖叫架构整合为 The Clean Architecture。
  - 内层不能提及外层声明的函数、类、变量、异常、注解或其他名称。
  - Data Access Adapter 实现内层接口，并在 Database Row 与内部模型之间转换。
  - 不应把 Entity 直接交给 Presenter，以免外层绕过 Use Case、泄漏行为和敏感数据。
  - 本章最终方法是：以政策层级划分软件，让所有源码依赖向内，并在每个边界显式转换控制与数据。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.2 “依赖向内意味着运行时调用只能向内”」？
  answer: 错误。Use Case 可以运行时调用 Presenter，通过 Output Port 保持源码依赖向内。
  source_heading: 15.2 “依赖向内意味着运行时调用只能向内”
- level: 概念辨析
  question: 原文如何解释「15.6 “Presenter 属于 Use Case 层”」？
  answer: 错误。Presenter 知道展示格式和 ViewModel，属于 Interface Adapters。
  source_heading: 15.6 “Presenter 属于 Use Case 层”
- level: 概念辨析
  question: 原文如何解释「15.8 “跨边界只能传 DTO Class”」？
  answer: 错误。Struct、参数、Hash Map 或简单对象都可以，关键是隔离且无外层依赖。
  source_heading: 15.8 “跨边界只能传 DTO Class”
- level: 概念辨析
  question: 原文如何解释「15.12 “每层只能依赖相邻层”」？
  answer: 原书没有强制。外层可直接依赖更内层，只要方向向内。相邻层限制是额外团队策略。
  source_heading: 15.12 “每层只能依赖相邻层”
- level: 概念辨析
  question: 原文如何解释「15.18 “外层框架完全不能影响任何设计”」？
  answer: 错误。真实性能、安全和平台约束必须考虑；只是具体框架名称与类型不应污染内层。
  source_heading: 15.18 “外层框架完全不能影响任何设计”
