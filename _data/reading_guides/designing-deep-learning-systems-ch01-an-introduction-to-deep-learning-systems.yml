  sections:
  - title: 本章要回答的核心问题
    source_heading: 本章要回答的核心问题
    paragraphs:
    - 一个基础系统由什么组成？ 数据集管理、训练、服务、元数据、工作流和交互环境如何协作？
    - 怎样从参考架构推导自己的设计？ 如何把业务目标、资源限制、安全要求和性能指标转化为组件取舍？
    - "“开发模型”与“建设系统”有什么本质区别？ 两者的交付物、优化目标和复杂度分别是什么？"
    - 本章以概念、流程和架构为主，没有神经网络算法的公式推导。为使作者提出的工程权衡可以计算和检查，本文在对应知识点中加入时延、容量、血缘和可复现性的形式化表达；这些表达用于解释原章思想，不应误认为是原章另行提出的算法。
  - title: 0. 阅读全章前先统一术语
    source_heading: 0. 阅读全章前先统一术语
    paragraphs:
    - 系统设计最容易出现的第一类错误，不是技术选型错误，而是不同角色使用同一个词却指向不同对象。作者因此先规定全书语境中的术语。
    - 机器学习（machine learning）：算法从数据中归纳规律，再利用规律对新输入做判断。
    - 深度学习（deep learning）：机器学习的一类方法，以可编程神经网络作为学习算法。
    - 本书示例使用神经网络，但数据管理、训练任务调度、模型部署、元数据追踪等设计原则也适用于一般机器学习。因此作者会在不影响含义时交替使用“机器学习”和“深度学习”。
  - title: 1.1 深度学习开发周期
    source_heading: 1.1 深度学习开发周期
    paragraphs:
    - 一个好的系统不是要求数据科学家掌握所有底层细节，而是把复杂基础设施封装成稳定、易用的能力，让他们能完成整个周期。系统是否成功，也不能只看服务是否上线，而应看跨角色协作是否更顺畅、模型生产化是否更快、更可靠。
    - 这一阶段通常比较非结构化：可以是 Notebook、Python 或 Shell 脚本，甚至手工复制。此时问题和方案仍不确定，过早建设正式流水线可能固化错误假设并浪费成本。探索阶段追求的是快速学习，不是立即达到生产标准。
    - "“数据越多越好”需要一个隐含前提：新增数据与目标相关且质量可控。大量重复、偏置或错误样本可能使模型更差，因此更准确的表达是：在质量与覆盖度可接受时，更多相关数据通常提高得到有效模型的机会。"
    - 它们有助于理解模型错误，却不能直接代表“用户更快找到答案”。应用集成后还应观察点击率、退出率、留存率、转人工率、找到答案的平均时间等产品指标，并通过受控实验和用户访谈判断因果。产品指标受到
      UI、业务规则、流量构成等多因素影响，不能把一次同步变化轻率归因于模型。
  - title: 1.2 深度学习系统设计概览
    source_heading: 1.2 深度学习系统设计概览
    paragraphs:
    - 为什么需要： 系统消费者既有人类使用的 Web UI、CLI 和 Notebook，也有应用、脚本及合作方数据仓库。API 把底层能力变成可编程契约，使不同客户端不必直接操作内部数据库或集群。
    - 程序化消费者不只有数据采集器和深度学习应用，也可以是自动化脚本或完整的管理服务。人类用户通常通过 Web UI 或 CLI 使用系统，但熟悉接口的高级用户也可以在认证、授权和审计约束下直接调用
      API；UI 是 API 之上的交互层，不是访问系统能力的唯一通道。
    - 研究人员通过 UI 进入数据探索与可视化功能，后端从数据管理服务读取授权数据。研究中可能有大量手工转换；技术成熟后，应把方法打包成库，让其他开发者复用，而不是把一个特定
      Notebook 当作平台接口。
    - 若粗略假设 200 个 Pod 的开销线性且环境相同，则约为 2 个 CPU 核的平均占用。但这只是理解数量级的外推，不是普遍基准；真实开销取决于版本、网络、遥测、工作负载和集群配置，应在自己的环境中测量。
  - title: 1.3 建设深度学习系统与开发模型的区别
    source_heading: 1.3 建设深度学习系统与开发模型的区别
    paragraphs:
    - 没有模型开发，平台不会自动产生有业务价值的模型；
    - 没有系统支持，优秀模型也可能停在原型阶段，或以不可重复、不可维护的方式上线；
    - 平台的合理抽象来自真实模型开发需求，模型开发的规模化则依赖平台。
    - 本书聚焦第二条路径，是因为讲模型的材料很多，而系统设计与建设的系统性资料相对少。
  - title: 核心结论
    source_heading: 核心结论
    paragraphs:
    - 开发周期必须有反馈回路。 循环 A 在生产化前验证方向，循环 B 在应用集成前验证生产模型和规模能力，上线反馈驱动下一轮。
    - 数据集管理、训练和服务构成主要执行链，工作流提供控制，元数据提供记忆，交互环境提供受控探索，API 提供统一契约。
    - Kubernetes 是通用资源与容器底座，不是完整 MLOps 平台。 其收益要与资源开销和运维复杂度一起评估。
    - 优秀平台应隐藏非必要复杂度而不是隐藏事实。 用户无需理解节点调度，但仍应看得到数据版本、模型来源、运行状态和失败原因。
  - title: 从本章提炼出的通用解题方法
    source_heading: 从本章提炼出的通用解题方法
    paragraphs:
    - 验证数据与技术可行性：用低成本探索和 POC 排除错误方向，不急于建设完整流水线。
    - 把模糊要求量化：定义数据量、并发、吞吐、P95/P99 时延、成本、可用性、合规和审计条件。
    - 画出控制流、数据流和元数据流：三者缺一，架构图就无法解释系统如何执行、如何追踪。
    - 这套方法的本质是：先理解价值链，再定位约束；先用反馈降低不确定性，再用系统化工程扩大已验证方案。
  - title: 复习与自测
    source_heading: 复习与自测
    paragraphs:
    - 工作流编排器为什么使用 DAG？持续训练又如何在 DAG 无环的前提下实现？
    - 一个模型服务的端到端时延由哪些部分构成？为什么平均时延不足以验证 SLO？
    - 为什么交互式 Notebook 应位于受控环境中？为何又不应直接充当生产流水线？
    - 如果要为端侧离线推理裁剪参考架构，你会删除、修改或增加哪些组件？
  takeaways:
  - 深度学习系统的价值不在于拥有多少组件，而在于能否让开发周期更快、更可靠。
  - 开发周期必须有反馈回路。 循环 A 在生产化前验证方向，循环 B 在应用集成前验证生产模型和规模能力，上线反馈驱动下一轮。
  - 参考架构提供共同语言，而不是标准答案。 A 到 G 的组件应按用例、规模、预算、安全和团队能力裁剪。
  - Kubernetes 是通用资源与容器底座，不是完整 MLOps 平台。 其收益要与资源开销和运维复杂度一起评估。
  - 优秀平台应隐藏非必要复杂度而不是隐藏事实。 用户无需理解节点调度，但仍应看得到数据版本、模型来源、运行状态和失败原因。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. “模型”就是“AI 产品”」？
  answer: 错误。模型只完成输入到预测的映射；应用还要负责交互、业务规则、上下文、权限、回退和结果呈现，系统则负责模型全生命周期。
  source_heading: 1. “模型”就是“AI 产品”
- level: 概念辨析
  question: 原文如何解释「4. MLOps 是某个工具或某个职位的别名」？
  answer: 不准确。MLOps 是跨机器学习、数据工程、软件工程和运维的实践集合；职位边界因组织而异，工具只是实现手段。
  source_heading: 4. MLOps 是某个工具或某个职位的别名
- level: 概念辨析
  question: 原文如何解释「6. 元数据与制品是同一种东西」？
  answer: 错误。模型文件是制品；“该模型由数据集 v12 和代码 c21 训练”是元数据关系。只有两者稳定关联，才能复现和追踪。
  source_heading: 6. 元数据与制品是同一种东西
- level: 概念辨析
  question: 原文如何解释「9. 上了 Kubernetes 就有了深度学习平台」？
  answer: 错误。Kubernetes 提供通用容器与资源编排，不自动提供数据集语义、模型血缘、实验比较、模型注册和业务质量门禁。
  source_heading: 9. 上了 Kubernetes 就有了深度学习平台
- level: 概念辨析
  question: 原文如何解释「11. 平台的目标是彻底消灭专业角色」？
  answer: 错误。平台首先消除重复操作、隐式协议和等待时间。角色可能合并，但安全审查、数据治理和专业判断仍可能需要独立责任。
  source_heading: 11. 平台的目标是彻底消灭专业角色
