overview:
  kind: summary
  minutes: 9
  question: 1. 本章主线：如何把预训练表示变成下游系统？
  question_source: 1. 本章主线：如何把预训练表示变成下游系统
  thesis: BERT 微调需要与 checkpoint 配套 tokenizer/vocab，且应使用 dev 选模、最终只评一次 test。
  thesis_source: 14. 核心结论与解决 NLP 应用问题的一般思路
  concepts:
  - term: 1. 本章主线：如何把预训练表示变成下游系统
    meaning: 最后把句对分类模板具体应用到 SNLI，完成预训练—微调闭环。
    source_heading: 1. 本章主线：如何把预训练表示变成下游系统
  - term: 3. 使用双向 RNN 做情感分析
    meaning: 不能把示例输出当作测试性能。增加 epoch 可能改善训练准确率，也可能过拟合，应按 validation early stopping。
    source_heading: 3. 使用双向 RNN 做情感分析
  - term: 5. 自然语言推断与 SNLI 数据集
    meaning: SNLI 来源是图像描述，语言较短、领域受限。标注者写 hypothesis 时产生 artifact，例如某些否定词、量词或泛化表达与类别高度相关，模型甚至只看
      hypothesis 也能获得不合理表现。
    source_heading: 5. 自然语言推断与 SNLI 数据集
  - term: 7. BERT 的序列级与词元级微调
    meaning: 任务 head 从随机初始化训练，预训练 BERT 参数通常一起微调。原始 BERT_BASE/ LARGE 约 110M/340M 参数，因此“head
      很小”不等于微调成本小。
    source_heading: 7. BERT 的序列级与词元级微调
  - term: 9. 全章模型的统一视角
    meaning: 交互发生在局部、递归、一次对齐还是每层 attention；
    source_heading: 9. 全章模型的统一视角
  - term: 14. 核心结论与解决 NLP 应用问题的一般思路
    meaning: 本章的主线可以压缩为一句话：下游 NLP 系统的设计，就是选择如何把 token 表示变成任务所需的固定结构。BiLSTM 沿时间汇总，TextCNN
      搜索局部 n-gram，可分解注意力在句对间对齐并比较，BERT 则在多层双向 self-attention 中统一完成上下文化与交互，再由小型任务头读出类别、词元标签或答案
      span。真正可靠的应用不仅取决于模型，还取决于 PAD/UNK、长度、mask、数据划分、tokenizer 和 train/eval 语义是否一致。
    source_heading: 14. 核心结论与解决 NLP 应用问题的一般思路
