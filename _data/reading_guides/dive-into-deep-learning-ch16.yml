  sections:
  - title: 1. 本章主线：如何把预训练表示变成下游系统
    source_heading: 1. 本章主线：如何把预训练表示变成下游系统
    paragraphs:
    - 任务定制架构：静态 GloVe + BiLSTM、TextCNN 或可分解注意力；
    - 再把文本看作一维图像，用不同宽度卷积提取局部 n-gram；
    - 最后把句对分类模板具体应用到 SNLI，完成预训练—微调闭环。
    - 这条路线也揭示一个工程事实：任务定制模型更轻、更容易部署；BERT 通常更强、更通用，但训练和推理成本更高。
  - title: 2.3 原书读取与清洗
    source_heading: 2.3 原书读取与清洗
    paragraphs:
    - 直接删除换行可能把跨行单词拼接，较稳健是替换为空格；
    - 真实系统应保存 tokenizer 版本和规则，训练、验证、推理必须完全复用。
  - title: 3. 使用双向 RNN 做情感分析
    source_heading: 3. 使用双向 RNN 做情感分析
    paragraphs:
    - 预训练 GloVe 提供 token 级静态表示，BiLSTM 再把它上下文化并聚合成句子表示。
    - 即使 pad embedding 为零，LSTM bias 和 recurrent dynamics 仍会更新状态。
    - 不能把示例输出当作测试性能。增加 epoch 可能改善训练准确率，也可能过拟合，应按 validation early stopping。
    - 可替代聚合：masked mean/max pooling、attention pooling、层次模型或 Transformer。
  - title: 4. 使用 TextCNN 做情感分析
    source_heading: 4. 使用 TextCNN 做情感分析
    paragraphs:
    - 直觉：只要某个关键 n-gram 在任意位置强烈激活，该 feature 就被保留。它带来近似位置不变性，并允许不同 kernel width 的输出长度不同，最后都变成一个
      scalar/channel。
    - 这不是图像意义上的两个 channels，而是在 embedding 特征维拼成 200 个 Conv1d input channels。
    - 原书未保留准确率。TextCNN 通常比 BiLSTM 并行度高、延迟低，但感受野由 kernel widths 决定，长距离组合需要堆叠卷积或其他机制。
    - 增加位置编码并不一定有用：TextCNN 卷积本身保留局部相对顺序，但 global max 丢弃绝对位置；位置特征只有在任务确实依赖位置且模型能利用时才可能改善。
  - title: 5. 自然语言推断与 SNLI 数据集
    source_heading: 5. 自然语言推断与 SNLI 数据集
    paragraphs:
    - 注意 neutral 不是“两个句子都为假”，也不是“主题不同”。NLI 判断的是在 premise 为真的假设下，hypothesis 的可推导关系。
    - 应显式指定 UTF-8。训练、dev、test 都必须复用相同文本清洗与 tokenizer。
    - SNLI 官方提供 train/dev/test，但原书后续训练每轮直接评 test。若据此调整 epoch、学习率或模型，就会造成测试反馈泄漏。
    - SNLI 来源是图像描述，语言较短、领域受限。标注者写 hypothesis 时产生 artifact，例如某些否定词、量词或泛化表达与类别高度相关，模型甚至只看
      hypothesis 也能获得不合理表现。
  - title: 7. BERT 的序列级与词元级微调
    source_heading: 7. BERT 的序列级与词元级微调
    paragraphs:
    - 任务 head 从随机初始化训练，预训练 BERT 参数通常一起微调。原始 BERT_BASE/ LARGE 约 110M/340M 参数，因此“head
      很小”不等于微调成本小。
    - Cross-encoder 让两句 token 在所有层直接互相 attention，精度通常高，但每个句对都要共同编码，不适合对百万文档逐一比较。
    - 使用 encoder-decoder 预训练模型（T5/BART）；
    - 机器翻译需要变长输出和 causal decoder，仅有 BERT encoder 不够，还需 decoder/cross-attention 或其他生成架构。
  - title: 8. 在 SNLI 上微调 BERT
    source_heading: 8. 在 SNLI 上微调 BERT
    paragraphs:
    - 这套词表和参数格式是 d2l 自定义，不等同于 Hugging Face 原始 WordPiece BERT checkpoint，不能随意混用 tokenizer。
    - 教学复现可先单进程；生产可离线 tokenize/cache，或使用可控 multiprocessing pipeline。
    - 原文未保留准确率；Exercise 提到 BERT_BASE 目标 test accuracy >0.86，这不是本节实际已验证结果。
    - 原书把 SNLI test 传入每 epoch 训练 helper。若据此选择 epoch 或超参数，就泄漏。必须使用 SNLI dev 作为 validation，训练完成后只评一次
      test。
  - title: 9. 全章模型的统一视角
    source_heading: 9. 全章模型的统一视角
    paragraphs:
    - 输入 token 表示是否上下文化；
    - 交互发生在局部、递归、一次对齐还是每层 attention；
    - padding/特殊 token 如何屏蔽；
  - title: 12. 原章练习与关键推导
    source_heading: 12. 原章练习与关键推导
    paragraphs:
    - 前者把梯度均匀分给所有位置，后者只强化最强 n-gram；这解释了模型行为差异。
    - 使用 MSE、Huber 或 ordinal loss。对称特征保证交换两句结果相同；标准 NLI premise/hypothesis 是有方向的，不应强制对称。
    - 加入 BM25/ANN 检出的 hard negatives 可提升判别，但错误负例（实际相关）会伤害训练。
    - 并做 layer-wise decay：越靠近输入的层学习率越小，减少 catastrophic forgetting。
  - title: 14. 核心结论与解决 NLP 应用问题的一般思路
    source_heading: 14. 核心结论与解决 NLP 应用问题的一般思路
    paragraphs:
    - 情感分析把变长文本映射到固定类别；IMDb train/test 各 25000 且正负平衡，但仍需从 train 划 validation。
    - 原书 PyTorch BERT loader 忽略 heads/blocks/dropout 参数并硬编码，必须修复后才能切换 checkpoint 规模。
    - 逐轴标注 shape：batch、time、direction、channel、pair axes，避免误读 final state。
    - 本章的主线可以压缩为一句话：下游 NLP 系统的设计，就是选择如何把 token 表示变成任务所需的固定结构。BiLSTM 沿时间汇总，TextCNN
      搜索局部 n-gram，可分解注意力在句对间对齐并比较，BERT 则在多层双向 self-attention 中统一完成上下文化与交互，再由小型任务头读出类别、词元标签或答案
      span。真正可靠的应用不仅取决于模型，还取决于 PAD/UNK、长度、mask、数据划分、tokenizer 和 train/eval 语义是否一致。
  takeaways:
  - 情感分析把变长文本映射到固定类别；IMDb train/test 各 25000 且正负平衡，但仍需从 train 划 validation。
  - 无位置特征的可分解注意力对每句 token 置换不变，词序建模很弱。
  - 固定文本接口：Unicode、HTML、大小写、tokenizer、词表和 special IDs。
  - 使用任务正确 metric：accuracy 外还看 F1、per-class recall、calibration 和错误类型。
  - 本章的主线可以压缩为一句话：下游 NLP 系统的设计，就是选择如何把 token 表示变成任务所需的固定结构。BiLSTM 沿时间汇总，TextCNN 搜索局部
    n-gram，可分解注意力在句对间对齐并比较，BERT 则在多层双向 self-attention 中统一完成上下文化与交互，再由小型任务头读出类别、词元标签或答案
    span。真正可靠的应用不仅取决于模型，还取决于 PAD/UNK、长度、mask、数据划分、tokenizer 和 train/eval 语义是否一致。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.1 情感分析只是关键词计数」？
  answer: 否定、反讽、上下文和长距离组合使简单词频不足；深度模型学习组合表示，但仍可能依赖伪相关词。
  source_heading: 11.1 情感分析只是关键词计数
- level: 概念辨析
  question: 原文如何解释「11.10 Average-over-time 等于 max-over-time」？
  answer: 平均描述整体激活，最大值描述最强局部证据；原书 PyTorch 实现与正文不一致。
  source_heading: 11.10 Average-over-time 等于 max-over-time
- level: 概念辨析
  question: 原文如何解释「11.20 Aggregate 求和后 padding 会自然抵消」？
  answer: MLP bias 和可训练 pad embedding 会贡献非零值；必须 masked sum。
  source_heading: 11.20 Aggregate 求和后 padding 会自然抵消
- level: 概念辨析
  question: 原文如何解释「11.30 d2l BERT checkpoint 可以搭配任意 Hugging Face tokenizer」？
  answer: 词表、special IDs 和参数必须严格匹配，否则 embedding 行语义错位。
  source_heading: 11.30 d2l BERT checkpoint 可以搭配任意 Hugging Face tokenizer
- level: 概念辨析
  question: 原文如何解释「11.35 Bigger BERT 必然在任何预算下更好」？
  answer: 更大模型需要匹配数据、显存、batch、优化和足够训练；也可能过拟合或无法部署。
  source_heading: 11.35 Bigger BERT 必然在任何预算下更好
