  - 1. 本章主线：如何把预训练表示变成下游系统
  - 3. 使用双向 RNN 做情感分析
  - 4. 使用 TextCNN 做情感分析
  - 7. BERT 的序列级与词元级微调
  - 8. 在 SNLI 上微调 BERT
  - 12. 原章练习与关键推导
