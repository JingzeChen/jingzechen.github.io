overview:
  kind: summary
  minutes: 10
  question: 原文围绕「阅读导引」建立了怎样的核心认识？
  question_source: 阅读导引
  thesis: 逐步删除对 corpus likelihood 影响最小的 tokens，直到目标大小。一个字符串可有多个 segmentation，适合 subword
    regularization：训练模型时随机采样 segmentation，提高鲁棒性。SentencePiece 支持该方法和无空格语言。
  thesis_source: 7. Tokenization Using Hugging Face Tokenizers
  concepts:
  - term: 阅读导引
    meaning: 本文纯 PyTorch 示例已在 Python 3.12、PyTorch 2.11.0 CPU 环境验证。Hugging Face Datasets/Tokenizers/Transformers
      当前未安装；相应代码注明安装与联网条件，数值引用官方 Notebook。
    source_heading: 阅读导引
  - term: 5. Generating Fake Shakespearean Text
    meaning: 训练用真实 prefix，推理用自身生成 prefix，错误会改变后续输入分布，这叫 exposure bias。Scheduled sampling
      可逐渐混入模型输出，但也有优化偏差；现代生成仍广泛采用 teacher-forced LM training 配合更强模型/解码。
    source_heading: 5. Generating Fake Shakespearean Text
  - term: 8. Reusing Pretrained Tokenizers
    meaning: GPT-2 原始 tokenizer 无 pad token，因为 causal LM 常不需 batch padding；直接要求 padding
      会报错，需显式指定 pad policy，不能随意假设 ID 0 是 pad。
    source_heading: 8. Reusing Pretrained Tokenizers
  - term: 10. Reusing Pretrained Embeddings and Language Models
    meaning: Word2Vec/GloVe/FastText 每 token 一个静态向量，“right”在不同句义仍相同。ELMo/BERT 根据上下文产生每次出现不同的
      contextual embedding。
    source_heading: 10. Reusing Pretrained Embeddings and Language Models
  - term: 13. Model Optimizations
    meaning: Vocabulary 极大时，训练可只计算正确 class 和采样 negative classes，并修正 sampling distribution，近似
      NLL。
    source_heading: 13. Model Optimizations
  - term: 20. 学习检查清单
    meaning: 能解释 sampled/adaptive softmax 与 weight tying
    source_heading: 20. 学习检查清单
  logic:
  - 阅读导引
  - 5. Generating Fake Shakespearean Text
  - 7. Tokenization Using Hugging Face Tokenizers
  - 10. Reusing Pretrained Embeddings and Language Models
