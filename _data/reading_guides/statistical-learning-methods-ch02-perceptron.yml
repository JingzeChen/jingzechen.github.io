  - term: 0. 本章解决什么问题
    meaning: 感知机（perceptron）解决的是一个最基本的监督学习问题：给定线性可分的二分类训练数据，如何找到一个超平面，将正类样本和负类样本完全分开。
    source_heading: 0. 本章解决什么问题
  - term: 2.2 感知机学习策略
    meaning: 几何间隔不随参数同比例缩放而改变。感知机只要求训练样本函数间隔为正，并不主动最大化几何间隔。这正是它与支持向量机的重要区别：感知机寻找任意一个可行分离面，支持向量机寻找几何间隔最大的分离面。
    source_heading: 2.2 感知机学习策略
