    source_heading: 2.3 感知机学习算法的原始形式
  - term: 2.4 感知机收敛定理
    meaning: 训练集可分也不等于泛化一定良好。高维空间中的复杂特征可能让训练数据偶然可分，但所得边界仍可能过拟合。
    source_heading: 2.4 感知机收敛定理
