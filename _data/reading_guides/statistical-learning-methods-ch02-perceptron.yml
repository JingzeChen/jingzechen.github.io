  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 感知机（perceptron）解决的是一个最基本的监督学习问题：给定线性可分的二分类训练数据，如何找到一个超平面，将正类样本和负类样本完全分开。
    - 它用超平面完成分类，与支持向量机共享“间隔”这一几何语言；
    - 为什么一个只在犯错时进行的局部更新，最终一定能找到全局上正确的分离超平面？
    - 答案是：在线性可分时，每次更新都使当前权重在某个正确方向上的投影至少增加一个固定量，而权重本身的长度增长较慢，因此算法不可能无限犯错。
  - title: 2.2 感知机学习策略
    source_heading: 2.2 感知机学习策略
    paragraphs:
    - 则称训练集线性可分。这个统一不等式等价于：正样本位于超平面正侧，负样本位于超平面负侧。
    - 几何间隔不随参数同比例缩放而改变。感知机只要求训练样本函数间隔为正，并不主动最大化几何间隔。这正是它与支持向量机的重要区别：感知机寻找任意一个可行分离面，支持向量机寻找几何间隔最大的分离面。
    - 它准确计算误分类点数，但关于参数几乎处处为常数，并在分类状态改变时跳跃，无法提供有用梯度。直接寻找使误分类点最少的超平面也是困难的离散优化问题。
    - 这一形式说明：正确分类时样本损失为 0；误分类越深，损失越大；对线性可分数据，存在参数使总损失为 0。
  - title: 2.3 感知机学习算法的原始形式
    source_heading: 2.3 感知机学习算法的原始形式
    paragraphs:
    - 但这只保证当前样本的间隔提高，不保证其他样本不受影响。因此算法可能修正一个样本后又错分另一个样本。收敛定理要证明的是：在线性可分时，这种来回修正不会无限持续。
    - 每次更新只使用一个误分类样本的梯度，而不是计算所有误分类点的总梯度，因此属于随机梯度或在线更新。它又不是无条件执行的 SGD：正确分类样本的感知机损失为
      0，次梯度也为 0，所以只有犯错或位于边界时才更新。这种机制称为误分类驱动。
    - 若数据线性可分，通常有许多超平面都能将它分开。感知机只要求找到任意一个零训练误差解，没有规定在这些解中继续优化什么。因此最终解依赖初始化、样本访问顺序、误分类点选择、学习率及边界点处理约定。
    - 即使几何超平面相同，参数的正比例缩放也会产生无穷多组等价表示。若希望通过额外准则选择稳定的超平面，可以最大化几何间隔，这将导向支持向量机。
  - title: 2.4 感知机收敛定理
    source_heading: 2.4 感知机收敛定理
    paragraphs:
    - 由于右侧有限，算法不可能无限更新，故经过有限次误分类后必然找到一个能正确分类全部训练样本的超平面。
    - 若样本无限或者只要求非严格可分，最小值未必严格为正；有限训练集和严格分离在这里不可缺少。
    - 这一定理给出的是最坏情况误分类次数上界，不是每轮扫描次数，也不保证实际一定接近上界。一次扫描中可能发生多次更新，也可能一次都不发生。
    - 训练集可分也不等于泛化一定良好。高维空间中的复杂特征可能让训练数据偶然可分，但所得边界仍可能过拟合。
  - title: 2.6 线性不可分时会发生什么
    source_heading: 2.6 线性不可分时会发生什么
    paragraphs:
    - 的参数。标准感知机以“整轮无误分类”为停止条件，因此会持续更新，甚至在若干状态之间震荡。
    - 口袋算法：始终保存迄今训练误差最小的参数，而不是只返回最后参数；
    - 平均感知机：对迭代过程中的参数求平均，通常提高稳定性与泛化；
    - 引入松弛或替代损失：进一步发展为软间隔支持向量机、逻辑斯谛回归等方法。
  - title: 2.8 本章方法论总结
    source_heading: 2.8 本章方法论总结
    paragraphs:
    - 感知机损失是误分类点负函数间隔之和，是连续凸的分段线性函数，但在间隔为零处不可导。
    - 感知机只在误分类或边界样本上更新，是误分类驱动的在线算法。
    - 每次更新都会严格提高当前误分类样本的函数间隔，但可能影响其他样本。
    - 线性不可分时，标准感知机不会收敛，需要口袋、平均、软间隔等改进。
  takeaways:
  - 答案是：在线性可分时，每次更新都使当前权重在某个正确方向上的投影至少增加一个固定量，而权重本身的长度增长较慢，因此算法不可能无限犯错。
  - 这一形式说明：正确分类时样本损失为 0；误分类越深，损失越大；对线性可分数据，存在参数使总损失为 0。
  - 训练集可分也不等于泛化一定良好。高维空间中的复杂特征可能让训练数据偶然可分，但所得边界仍可能过拟合。
  - 引入松弛或替代损失：进一步发展为软间隔支持向量机、逻辑斯谛回归等方法。
  - 线性不可分时，标准感知机不会收敛，需要口袋、平均、软间隔等改进。
