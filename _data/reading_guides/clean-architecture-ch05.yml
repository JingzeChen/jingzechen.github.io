overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 对架构师而言，OO 的核心是通过多态获得对源码依赖方向的控制能力。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 安全的多态 → 可反转源码依赖 → 低层细节成为高层政策的插件 → 组件可独立部署与开发。
    source_heading: 本章导读
  - term: 2. Encapsulation?
    meaning: Smalltalk、Python、JavaScript、Lua、Ruby 等语言对访问控制的强制程度也不相同，有些更多依赖命名约定和开发者纪律。
    source_heading: 2. Encapsulation?
  - term: 5. The Power of Polymorphism
    meaning: 原书图示：Figure 5.1：控制流与源码依赖 20 世纪 50 至 70 年代，穿孔卡曾是常见输入输出介质，后来磁带等设备逐渐取代它。设备变化迫使大量设备相关程序重写，代价非常高。
    source_heading: 5. The Power of Polymorphism
  - term: 6.3 接口为什么应由高层拥有
    meaning: 如果接口位于低层模块中，高层虽然依赖「抽象」，却仍然依赖低层模块。低层包名、类型和发布单元一变，高层仍会受影响。
    source_heading: 6.3 接口为什么应由高层拥有
  - term: 8.2 「绝对控制」应如何理解
    meaning: OO 能解决数据一致性和业务复杂度。
    source_heading: 8.2 「绝对控制」应如何理解
  - term: 本章总结
    meaning: Dependency Inversion 与 Dependency Injection 不同，DI 容器不是实现正确架构的必要条件。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 2. Encapsulation?
  - 3.6 什么时候继承比较合适
  - 6.3 接口为什么应由高层拥有
  - 7. Independent Deployability and Developability
  - 检查多态边界
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 封装并非 OO 首创，某些 OO 语言的信息隐藏甚至弱于传统 C 模块；
    - 多态同样早已能用函数指针实现，但 OO 让它安全、便利到足以广泛使用；
    - 对架构师而言，OO 最重要的价值是：通过多态控制源码依赖的方向。
    - 安全的多态 → 可反转源码依赖 → 低层细节成为高层政策的插件 → 组件可独立部署与开发。
  - title: 1.2 「数据与函数的组合」为什么不充分
    source_heading: 1.2 「数据与函数的组合」为什么不充分
    paragraphs:
    - 作者用一个简单对比反驳：调用对象方法与把对象传给普通函数，在基本计算意义上没有本质区别。
    - 程序员在 OO 出现前很久，就已经把数据结构传给函数处理。因此，这个定义只能描述一种语法形式，不能说明 OO 独特的架构价值。
  - title: 2. Encapsulation?
    source_heading: 2. Encapsulation?
    paragraphs:
    - Information Hiding（信息隐藏）回答：外部代码是否需要知道内部表示存在，内部变化是否会影响外部？
    - Java 和 C# 不使用 C/C++ 那种头文件与实现文件分离方式。类声明和实现通常位于同一语言单元中。
    - Smalltalk、Python、JavaScript、Lua、Ruby 等语言对访问控制的强制程度也不相同，有些更多依赖命名约定和开发者纪律。
    - C++ 可以使用 PImpl 等方式，把私有实现放到单独类型中，头文件只保留不透明指针。这样能够减少客户端对对象布局的了解，并降低重编译影响。
  - title: 3.6 什么时候继承比较合适
    source_heading: 3.6 什么时候继承比较合适
    paragraphs:
    - 子类是否真的是基类约定的一种实现？
    - 调用者能否在不知道具体子类时正确使用它？
    - 是否主要为了多态边界，而不是省几行代码？
    - Chapter 9 的 Liskov Substitution Principle 会进一步讨论可替换性。
  - title: 5. The Power of Polymorphism
    source_heading: 5. The Power of Polymorphism
    paragraphs:
    - 假设复制程序原先从穿孔卡（punched cards）读取、向穿孔卡输出。后来客户改用磁带（magnetic tape）。
    - 如果程序直接依赖穿孔卡驱动，就必须修改大量业务代码。若程序只依赖统一 I/O 接口，新驱动只需实现接口，复制程序不必改变。
    - 原书图示：Figure 5.1：控制流与源码依赖 20 世纪 50 至 70 年代，穿孔卡曾是常见输入输出介质，后来磁带等设备逐渐取代它。设备变化迫使大量设备相关程序重写，代价非常高。
    - 操作系统很早就使用插件，因为设备独立性价值巨大。但普通应用很少普遍使用同样方式，原因之一是手工函数指针危险且麻烦。
  - title: 6.3 接口为什么应由高层拥有
    source_heading: 6.3 接口为什么应由高层拥有
    paragraphs:
    - 如果接口位于低层模块中，高层虽然依赖「抽象」，却仍然依赖低层模块。低层包名、类型和发布单元一变，高层仍会受影响。
    - 接口表达高层需要，而不是低层技术 API；
    - 低层 Adapter 实现这个接口；
  - title: 7. Independent Deployability and Developability
    source_heading: 7. Independent Deployability and Developability
    paragraphs:
    - Business Rules 组件；
    - 作者推导：如果一个组件源码变化，只需重新部署该组件，就获得独立部署能力。
    - 调整数据库 Adapter 不重新发布核心政策；
    - 同样，源码解耦也不自动保证团队独立。共享发布计划、模糊所有权和频繁变化接口仍会造成协作瓶颈。
  - title: 8.2 「绝对控制」应如何理解
    source_heading: 8.2 「绝对控制」应如何理解
    paragraphs:
    - OO 能解决数据一致性和业务复杂度。
    - 它意味着：架构师不再被调用方向强迫，可以在需要的位置通过多态安排源码依赖方向。
  - title: 检查多态边界
    source_heading: 检查多态边界
    paragraphs:
    - 高层是否直接提及数据库、UI、SDK 或设备类？
    - 低层 Adapter 是否实现高层端口？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - Access Control 阻止直接访问，Information Hiding 还要避免外部依赖内部表示。
    - 设备驱动实现统一的 open、close、read、write、seek 操作，程序无需知道具体设备。
    - Dependency Inversion 与 Dependency Injection 不同，DI 容器不是实现正确架构的必要条件。
    - 这种能力让高层政策保持独立，让低层细节退居可替换插件，从而支撑 Clean Architecture。
  takeaways:
  - "「数据与函数的组合」和「模拟现实世界」都不足以定义 OO 的独特架构价值。"
  - 手工继承依赖布局约定，类型不安全，多重继承尤其困难。
  - 作者因此定义 OO 为对间接控制转移施加纪律。
  - 安全多态让架构师不再被调用方向强迫，可以控制任意源码依赖的方向。
  - 这种能力让高层政策保持独立，让低层细节退居可替换插件，从而支撑 Clean Architecture。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「2. OO 的目标是精确模拟现实世界」？
  answer: 领域概念有助于建模，但机械模拟现实可能产生脆弱继承树。作者关注的是依赖控制。
  source_heading: 2. OO 的目标是精确模拟现实世界
- level: 概念辨析
  question: 原文如何解释「4. 封装由 OO 发明」？
  answer: C 的不透明类型早已能实现很强封装。OO 让类封装方便，却并非唯一方式。
  source_heading: 4. 封装由 OO 发明
- level: 概念辨析
  question: 原文如何解释「7. 多态只能用类继承实现」？
  answer: 函数指针、接口表、协议和其他动态分派机制都可实现多态。OO 语言主要提高安全性与便利性。
  source_heading: 7. 多态只能用类继承实现
- level: 概念辨析
  question: 原文如何解释「9. Dependency Inversion 等于 Dependency Injection」？
  answer: 依赖反转是源码方向原则；依赖注入是传入协作者的组装技术；DI 容器只是可选工具。
  source_heading: 9. Dependency Inversion 等于 Dependency Injection
