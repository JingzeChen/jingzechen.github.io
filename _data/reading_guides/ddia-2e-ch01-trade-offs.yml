overview:
  kind: summary
  minutes: 12
  question: "复杂数据系统为什么会出现，我们应该怎样比较不同架构？"
  question_source: "0. 本章定位：架构不是寻找唯一解，而是在约束下选择权衡"
  thesis: "架构设计不是寻找唯一正确的技术，而是先明确数据用途、责任边界和失败成本，再选择与约束相匹配的构件。新增组件只有在它带来的收益大于协调与运维成本时才值得。"
  thesis_source: "0.4 为什么单个工具不能解决所有问题"
  concepts:
    - term: "数据密集型应用"
      meaning: "主要难点在数据的保存、变化、查询、复制和集成，而不只是计算量大。"
      source_heading: "0.2 什么是数据密集型应用"
    - term: "数据系统构件"
      meaning: "数据库、缓存、搜索索引、流处理和批处理各自优化不同任务，也各自引入新的状态与故障语义。"
      source_heading: "0.3 数据系统的基本构件"
    - term: "运营系统与分析系统"
      meaning: "运营系统负责低延迟地创建和更新业务事实；分析系统使用其副本做聚合、探索和决策支持。"
      source_heading: "2.1 为什么组织会自然分出两类系统"
    - term: "权威数据源"
      meaning: "每类状态都应有唯一清晰的最终责任方，其他副本可以延迟或重建。"
      source_heading: "2.17 权威记录系统与派生数据系统"
    - term: "架构权衡"
      meaning: "云与自托管、分布式与单机、性能与成本等选择，只能结合具体负载、组织能力和风险判断。"
      source_heading: "0.7 本章的四组对照"
  logic:
    - "应用不断产生并消费数据，单一工具逐渐无法同时满足所有访问模式。"
    - "团队组合多个专用构件，并为每个构件划定责任和权威边界。"
    - "组件之间的数据传播带来延迟、重复、顺序、恢复和一致性问题。"
    - "因此比较架构时，应从需求和不可接受的失败出发，而不是从产品清单出发。"
    - "最终选择是在性能、可靠性、成本、控制力、复杂度和个人权利之间做可解释的取舍。"
  sections:
    - title: "复杂架构源于目标分化，而不是技术越多越先进"
      source_heading: "0. 本章定位：架构不是寻找唯一解，而是在约束下选择权衡"
      paragraphs:
        - >-
          数据密集型应用的主要困难，不只是数据量大，而是要持续保存、更新、查询、复制和集成数据，并在并发与故障下维持业务所需的正确性。随着用户、设备和外部服务不断产生数据，一台机器和一个通用数据库可能先后遇到容量、吞吐、延迟、可用性、查询类型或地域合规的限制。复杂架构通常正是在这些具体限制出现后，才逐步组合数据库、缓存、搜索索引、流处理和批处理等专用构件。
        - >-
          每个新构件解决一种访问需求，也同时创造一份新状态和一组新故障语义。缓存要说明何时失效，索引要说明更新能落后多久，事件流要处理重复与乱序，批处理要能够重跑和恢复。因此架构设计的重点不是罗列产品，而是先写清谁使用数据、要完成什么任务、不能接受什么失败，再决定各构件的责任边界。只有新增能力的收益高于同步、运维和认知成本时，复杂化才有理由。
    - title: "运营与分析的分离，揭示了工作负载如何塑造系统"
      source_heading: "2.22 本节小结：从访问模式到数据生命周期"
      paragraphs:
        - >-
          运营系统面向用户动作，执行大量低延迟的点查询和小范围更新，关注当前状态、并发正确性与稳定响应；分析系统则扫描大量历史记录，支持分析师临时组合数据、聚合指标和训练模型。两者都能使用 SQL，却对存储布局、资源隔离、查询自由度和数据新鲜度提出不同要求。数据仓库把多个运营来源的副本集中起来，让跨业务分析不会拖慢在线交易；数据湖进一步用文件和多种格式容纳关系表之外的文本、图像与训练材料。
        - >-
          ETL、ELT、事件流和反向 ETL 连接了运营与分析两侧，但它们不是单纯的数据搬运。管道必须解释增量从哪里恢复、重复输入是否会重复计数、模式变化怎样传播，以及报表数字能否追溯到源记录。实时分析和 HTAP 可以缩短部分场景的延迟，却不会消除点查询与大范围扫描的根本差异。系统是否需要仓库、湖或流，最终仍由访问范围、响应时效和隔离目标决定。
        - >-
          另一条更基础的分类轴是权威记录与派生数据。订单主记录等权威源负责最终裁决；缓存、索引、仓库、特征和模型则从源数据派生，以冗余换取新的读取或分析能力。明确这张来源图之后，冲突时信任谁、丢失后从哪里重建、更新允许滞后多久、删除应传播到哪些副本，才有可回答的依据。派生并不等于不重要，昂贵索引和模型仍可能需要备份、检查点与降级方案。
    - title: "云服务改变责任和经济模型，但没有消除运维"
      source_heading: "3.23 本节小结：云选择的真正变量"
      paragraphs:
        - >-
          比较云与自托管时，应先分开“谁开发软件”和“谁运行软件”。托管服务把硬件、升级、备份或部分故障处理交给专业供应商，适合缺少相关经验、需要快速上线或负载波动明显的团队；自托管则保留底层指标、定制调优、版本选择和故障修复的控制。云是否更便宜取决于真实利用率、人员成本、网络费用和折扣，按量计费只会让成本更贴近使用量，不保证总拥有成本更低。
        - >-
          云原生也不只是把旧软件搬进虚拟机。服务分层、对象存储、临时计算、存储与计算分离以及多租户，会改变数据所在位置和访问路径。弹性让短时分析负载能够按需扩缩，却也带来配额、出口费用、隔离和供应商锁定。供应商接管单个服务内部的运行后，客户仍要负责业务语义、权限、跨服务重试、性能诊断、成本上限和退出方案；组件越多，边界上的集成反而越可能成为主要复杂性。
    - title: "分布式系统是解决明确约束的手段，不是规模感的象征"
      source_heading: "4.31 本节小结：分布式是有成本的手段"
      paragraphs:
        - >-
          系统可能因为设备天然分散、跨服务调用、高可用、单机容量、全球延迟、弹性、专用硬件、数据驻留或可持续性而需要多个节点。不同动机对应不同设计，不能用“为了扩展”一笔带过。采用分布式方案前，应指出单机基线究竟无法满足哪项可量化目标，并比较复制、分区、异步处理或垂直扩容等较小改动是否已经足够。
        - >-
          网络边界最根本的代价是不确定性：请求超时只说明没有及时收到结果，不能证明远端没有执行。安全重试需要幂等语义和对账机制，远程调用还会增加序列化、排队与尾延迟。节点越多并不自动越快，协调、数据搬运和串行部分会限制并行收益；故障也可能跨服务表现为局部成功，使一致性与诊断责任落到应用层。
        - >-
          微服务用远程边界换取团队独立、技术隔离和独立发布，因此首先解决的是组织协调问题；小团队没有这些瓶颈时，模块化单体通常更简单。Serverless 进一步把实例分配交给供应商，以自动扩缩换取运行限制和更强依赖。无论选择哪种形态，都应把部署、追踪、API 演化、值班和跨数据库一致性的基础设施成本算进去，保留单机作为真实而非敷衍的比较基线。
    - title: "个人权利会进入存储、复制和数据生命周期的底层设计"
      source_heading: "5.13 本节小结：人的权利是架构的一等约束"
      paragraphs:
        - >-
          当数据对应真实的人，架构约束就不只来自性能和商业目标。隐私法规、数据地域、访问与更正权、自动化决策的影响，以及系统可能造成的不公平伤害，都要求工程团队在设计早期说明收集目的、授权范围、保留期限和审计证据。法律通常不会指定某种数据库，而是给出必须满足的原则；团队需要把这些原则转化为可以验证的技术控制，并在需要时与法律和合规人员共同判断。
        - >-
          删除权最能说明问题。把主表记录标记为删除，并不会自动清除事务日志、缓存、搜索索引、仓库快照、训练集、模型和备份。可靠的删除是一项沿数据血缘传播的跨系统工作流：先阻止不允许的新处理，再清理权威与派生副本，验证完成，并防止备份恢复让数据重新出现。没有平时维护的目录、来源关系和保留策略，收到删除请求后便很难临时找全所有副本。
        - >-
          数据最小化提供了更根本的风险控制：只收集完成明确目的所必需的数据，并在目的完成后及时删除。长期保存会增加泄露、内部滥用、强制披露和未来用途漂移的可能，存储单价只是成本的一小部分。减少无目的字段往往也会缩小攻击面、简化模式和迁移，并提高质量责任的清晰度。好架构不只服务部署系统的组织，也要尊重数据所对应的人。
    - title: "一套可复用的判断方法：从约束和证据出发"
      source_heading: "12. 解决数据架构问题的一般方法"
      paragraphs:
        - >-
          面对数据架构问题，第一步是列出参与者、目的、权利和硬约束，然后刻画真实工作负载，包括数据增长、读写比例、查询范围、延迟分位数、新鲜度、地域与恢复目标。接着画出权威与派生关系，标明每份数据由谁首次写入、从何处重建、允许多大滞后以及如何删除。这样，产品名称背后的责任和数据流才会显现出来。
        - >-
          方案比较应从最简单可行的单机、单数据库或模块化基线开始，只在证据表明某项约束无法满足时引入专用或分布式组件。对每条网络边界枚举超时、重复、乱序、部分成功和下游不可用；对云、自托管与服务化逐项确认部署、升级、诊断、成本和退出由谁承担；把人员、迁移、故障、隐私和社会风险纳入完整成本，而不是只比较硬件或云账单。
        - >-
          架构决策还需要运行闭环：定义监控、服务目标、费用上限、备份恢复、全量重建、模式演化、数据质量和删除演练，并记录当哪些指标变化时重新评估。基准测试、故障演练和账单数据应验证关键假设。贯穿全章的判断标准是：技术选择必须能解释它解决了什么具体问题、转移了哪些责任，又新增了哪些长期成本。
  takeaways:
    - "先写清用户任务、访问模式和不可接受的失败，再讨论技术。"
    - "缓存、索引和分析副本都不是天然的权威状态；必须定义它们如何更新和恢复。"
    - "分布式不是规模增长后的自动答案，只有单机确实无法满足目标时才值得承担额外复杂度。"
    - "技术收益不能脱离组织能力、长期运维成本以及数据权利单独评估。"

check_intro: "这些题依次检查概念辨析、因果解释和新情境中的应用。尽量不用回看正文，先用自己的话作答。"
checks:
  - level: "概念辨析"
    question: "数据量很大，是否就一定属于数据密集型应用？为什么？"
    hint: "比较系统的主要瓶颈，而不是只看输入规模。"
    answer: "不一定。分类取决于主要困难：若瓶颈是大规模数值计算，它更偏计算密集；若难点是数据变化、并发正确性、查询、复制或恢复，即使数据量不大，也可能高度数据密集。"
    source_heading: "0.2 什么是数据密集型应用"
  - level: "关系解释"
    question: "为什么加入缓存或搜索索引，不只是多连接一个 API？"
    hint: "想一想同一份状态出现多个副本以后必须回答哪些问题。"
    answer: "新增构件会产生派生状态，系统必须定义谁是权威、更新何时传播、失败后如何重试、重复与乱序怎样处理，以及陈旧多久可以接受。这些状态和故障语义共同决定系统是否正确。"
    source_heading: "2.21 为什么明确数据来源能澄清复杂架构"
  - level: "架构判断"
    question: "一个订单系统既要毫秒级更新订单，又要分析多年销售趋势。为什么通常要分开运营与分析路径？"
    hint: "比较两类负载访问的数据范围、更新方式和延迟目标。"
    answer: "订单更新围绕少量记录，需要低延迟和明确的并发语义；趋势分析扫描大量历史数据并做聚合。把两者分开优化可避免分析查询干扰在线交易，同时让分析侧采用更适合扫描的数据组织。"
    source_heading: "2.6 OLTP 与 OLAP 的系统比较"
  - level: "迁移应用"
    question: "团队提出把单机数据库立即改成分布式数据库。你会先要求哪些证据？"
    hint: "从需求、现状瓶颈、失败成本和团队能力四个方向回答。"
    answer: "先确认容量、吞吐、延迟、可用性或地域目标中哪一项已无法由单机满足；测量当前瓶颈；说明不可接受的故障及恢复目标；比较扩容、读副本或分区等较小方案；最后评估团队是否能承担一致性、网络故障、观测和运维成本。"
    source_heading: "4.11 采用分布式系统前先确认是哪种动机"
  - level: "边界反思"
    question: "为什么个人数据权利也属于数据架构，而不只是法务问题？"
    hint: "考虑副本、派生数据、地域和删除。"
    answer: "数据所在地域、访问控制、保留期限、删除传播和派生数据追踪都由架构实现。若系统无法定位副本或重建数据流，法律与伦理承诺就无法真正执行，因此这些约束必须进入设计阶段。"
    source_heading: "5.1 架构不仅由技术和商业目标决定"