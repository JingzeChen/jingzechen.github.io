overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章主线」建立了怎样的核心认识？
  question_source: 0. 本章主线
  thesis: 哈希表的正确使用包含两层推理。底层要说明键如何映射、冲突如何处理、删除是否保持查找路径、负载过高如何终止或扩容；应用层要选择正确的键和值语义，例如“是否见过”“剩余次数”“最近下标”“双向字符关系”或“规范化分组键”。
  thesis_source: 本章总结
  concepts:
  - term: 0. 本章主线
    meaning: 哈希表把“按键搜索”从顺序扫描转化为“计算桶位置，再处理少量冲突”。集合只关心键是否存在；映射还保存键对应的值，因此自然支持计数、索引、映射和分组。
    source_heading: 0. 本章主线
  - term: 5.1 哈希表概述
    meaning: 具体平方探测是否覆盖足够槽位依赖 M 和探测定义，不能假定任意表长都遍历全表。线性探测一定按循环覆盖所有槽，却容易形成“主聚集”。
    source_heading: 5.1 哈希表概述
  - term: 5.3 哈希集合应用的算法设计
    meaning: 交集只关心“值是否同时存在”，不关心各自出现多少次，因此集合正好把数组压缩成存在性信息。输出每个公共值一次。把两数组转成集合，再遍历较小集合并查询另一集合。集合消除了输入重数，因此结果天然唯一。
    source_heading: 5.3 哈希集合应用的算法设计
  - term: 5.4 哈希映射应用的算法设计
    meaning: 充分性：允许翻转任意非空子数组，特别允许翻转长度 2 的子数组，这等价于交换一对相邻元素。任意排列都能通过有限次相邻交换变成另一排列，因此只要两个数组的多重集合相同，就一定可达。
    source_heading: 5.4 哈希映射应用的算法设计
  - term: 本章总结
    meaning: 哈希表的正确使用包含两层推理。底层要说明键如何映射、冲突如何处理、删除是否保持查找路径、负载过高如何终止或扩容；应用层要选择正确的键和值语义，例如“是否见过”“剩余次数”“最近下标”“双向字符关系”或“规范化分组键”。
    source_heading: 本章总结
