  question: 原文围绕「0. 本章定位与三种评估视角」建立了怎样的核心认识？
  question_source: 0. 本章定位与三种评估视角
  thesis: 最终把三种证据统一到真实系统行为与发布决策，而非孤立模型回答。
  thesis_source: 28. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与三种评估视角
    meaning: Trajectory-based multimodal evaluation：用 AgentVista 观察模型在图片/GUI/网页等长程任务中看到了什么、调用什么工具、在哪一步失败。
    source_heading: 0. 本章定位与三种评估视角
  - term: 6. 例 9-2 至 9-5：规范化 Trace Payload 与 Metadata
    meaning: 不支持则抛 TypeError。此函数是 adapter，不是 schema validation；解析后仍应 Pydantic validate
      versioned payload。任意 JSON string 可能巨大/恶意，设 size/depth limit。
    source_heading: 6. 例 9-2 至 9-5：规范化 Trace Payload 与 Metadata
  - term: 11. 例 9-10：写 JSONL Regression Set
    meaning: Prior model score/reason 可做 baseline/debug，但 judge 可能错。Reference 与 expected
      mechanics 必须经 SME/hard verifier 确认。Critical-failure-only set 不报告成总体 accuracy。
    source_heading: 11. 例 9-10：写 JSONL Regression Set
  - term: 15. Turn Your Repo Into a Benchmarkable Environment
    meaning: 才是有效 bug instance。Coding Agent 得到 R_i 与 task description，生成 fix patch
      f_i；若 verifier 恢复目标 tests 且不破坏其他 tests，算 resolved。
    source_heading: 15. Turn Your Repo Into a Benchmarkable Environment
  - term: 20. 从 Outcome 到 Trajectory：为什么多模态长程任务更难
    meaning: GUI/visual software Agent 不是“看图回答”而是多步闭环：读取 screenshot/dialog、选择 UI element、打开
      log、比较视觉 output、调用 code/browser、更新 state、恢复错误。
    source_heading: 20. 从 Outcome 到 Trajectory：为什么多模态长程任务更难
  - term: 28. 本章知识结构与核心结论
    meaning: 可迁移的一般方法是：先精确定义被测能力，隔离候选可见输入与 evaluator hidden gold；尽可能运行真实系统并使用可执行 hard
      verifier；开放式部分用校准 judge；按 case 成对、按风险切片报告；将 benchmark 自身也视为需版本、测试、防泄漏和维护的软件产品。
    source_heading: 28. 本章知识结构与核心结论
