  sections:
  - title: 0. 本章定位与三种评估视角
    source_heading: 0. 本章定位与三种评估视角
    paragraphs:
    - System-level trace evaluation：从 LangSmith/Langfuse production traces 选择代表性业务
      case，用 deterministic checks 与 LLM judge 评分，再回放候选模型；
    - Verifier-based coding evaluation：用 SWE-smith 修改自己的 repo、确认 tests 由 pass 变 fail，再评价
      coding Agent 的 patch 是否恢复测试；
    - Trajectory-based multimodal evaluation：用 AgentVista 观察模型在图片/GUI/网页等长程任务中看到了什么、调用什么工具、在哪一步失败。
    - Benchmark 不是一堆 prompts，也不是一个平均分；它是版本化的任务分布、运行环境、执行协议、评分器、基线和局限说明。最终答案、系统行为和轨迹证据要与任务性质匹配。
  - title: 3. 从系统信号定义 Trace-level Rubric
    source_heading: 3. 从系统信号定义 Trace-level Rubric
    paragraphs:
    - 观察只是 diagnosis hypothesis。例如 high latency 也可能来自 provider queue，不一定是 prompt。Trace
      score 要尽量接近机制，并保留根因不确定性。
    - DeepEval 提供 tool correctness、multi-turn tool use、goal accuracy、role adherence
      等，但 metric 名不保证适合你的 policy，仍需 calibration。
    - Open-ended text 单独打 0.73 难校准。可对同 case 的候选做 pair/group ranking（RULER 思路），但发布仍需
      absolute minimum gate，否则“最好的坏答案”会胜出。
  - title: 6. 例 9-2 至 9-5：规范化 Trace Payload 与 Metadata
    source_heading: 6. 例 9-2 至 9-5：规范化 Trace Payload 与 Metadata
    paragraphs:
    - 不支持则抛 TypeError。此函数是 adapter，不是 schema validation；解析后仍应 Pydantic validate versioned
      payload。任意 JSON string 可能巨大/恶意，设 size/depth limit。
    - 严格匹配 workflow 与 agent type allowsets。先 normalization case/alias；unknown 记录 excluded
      reason，而不直接消失，否则不知道 coverage gap。
    - 把 naive 直接标 UTC 不是转换，前提是平台保证 naive 值语义为 UTC；否则应拒绝/按已知 source timezone localize。
    - 若 start time 缺失，原函数返回 True，会把不可证实时间的 run 纳入窗口。Benchmark 选择应更保守：缺 timestamp 隔离到
      review，不默认纳入。
  - title: 8. Trace Scoring：Hard Checks 与 LLM Checks
    source_heading: 8. Trace Scoring：Hard Checks 与 LLM Checks
    paragraphs:
    - Hard deterministic：retry budget、correct handoff、required step；实际 scoring code
      还加 required tool succeeded。
    - 完全可复现，但前提是 expected handoff gold 正确，且 string aliases normalized。复杂 workflow
      可能允许多个合法 targets 或“不 handoff”；应表示 allowed set/transition predicate，而非唯一 string。
    - 它评价语义，不等于事实 verifier。Reference answer 可能不唯一/过期；criteria 需明确证据和允许变化。Judge model/version、temperature、prompt
      和 framework version纳入 benchmark spec。
    - 原表将它放 LLM-based，但很多参数可用 schema/domain rule 验证：URL allowlist、currency、quantity、ID、date
      range。只有开放式 query formulation 才需 judge。Hard checks 应做尽可能多工作。
  - title: 11. 例 9-10：写 JSONL Regression Set
    source_heading: 11. 例 9-10：写 JSONL Regression Set
    paragraphs:
    - case source/provenance/redaction status；
    - expected policy/tool versions；
    - Prior model score/reason 可做 baseline/debug，但 judge 可能错。Reference 与 expected
      mechanics 必须经 SME/hard verifier 确认。Critical-failure-only set 不报告成总体 accuracy。
    - 使用原子 temp+replace、UTF-8、stable canonical hash；敏感 benchmark 不放公开 Git。写入前 validation，读取时限制
      size/schema。
  - title: 15. Turn Your Repo Into a Benchmarkable Environment
    source_heading: 15. Turn Your Repo Into a Benchmarkable Environment
    paragraphs:
    - language/framework 与你的 repo 不同；
    - 把自己的 repo 变成 benchmark，使 task、environment、verifier 与真实维护工作接近，也降低公开题 memorization
      的影响。
    - 才是有效 bug instance。Coding Agent 得到 R_i 与 task description，生成 fix patch f_i；若
      verifier 恢复目标 tests 且不破坏其他 tests，算 resolved。
    - 可执行、确定性较强、与行为绑定，不需要 judge 猜 patch 是否正确。它仍不完美：test coverage 有空洞，flaky tests、环境依赖和
      overly-specific patch 都会误判。
  - title: 18. 例 9-17/9-18：评价 Fix 与构建 Curated Subset
    source_heading: 18. 例 9-17/9-18：评价 Fix 与构建 Curated Subset
    paragraphs:
    - 先用 gold patch 检查 benchmark harness：若 gold 都无法恢复，task/environment 有问题，不能拿来评 Agent。之后
      predictions path 换候选 patches。
    - 分类：build error、patch apply fail、test timeout、target still fail、regression、resolved、harness
      error。把 infra error 当 Agent fail 会污染能力估计。
    - 一个 test 可能过窄/偶然；太多 tests 可能是广泛破坏、运行成本高。2–5 是可管理 heuristic，不是 bug 难度的普适尺度。Difficulty
      还取决于 files、localization、dependencies、test runtime、required reasoning。
    - 按 repo/language/bug type/files changed/test count/real vs synthetic/difficulty
      分层；去 near-duplicates；防同一 PR train/test 泄漏；保留 hidden holdout。
  - title: 20. 从 Outcome 到 Trajectory：为什么多模态长程任务更难
    source_heading: 20. 从 Outcome 到 Trajectory：为什么多模态长程任务更难
    paragraphs:
    - GUI/visual software Agent 不是“看图回答”而是多步闭环：读取 screenshot/dialog、选择 UI element、打开
      log、比较视觉 output、调用 code/browser、更新 state、恢复错误。
    - 最终成功可能掩盖低效/危险路径；最终失败也需知道 perception、planning、tool、state 还是 recovery 出错。
    - element grounding/IoU/click accuracy；
    - normalized path length/excess steps；
  - title: 23. 例 9-19/9-20：多模型 AgentVista Run
    source_heading: 23. 例 9-19/9-20：多模型 AgentVista Run
    paragraphs:
    - 这意味着 candidate 和 verifier 一起变化，不再是固定 judge 的公平模型比较；self-evaluation bias 也变化。若目标比较
      reasoning model，应固定 independent verifier，或使用 hard/多 judge/human；若目标比较 end-to-end
      self-verifying systems，则要明确该 capability。
    - 预算用于公平和防失控，但不同模型 tokenization/hidden reasoning/vision token accounting 可能不同。报告实际
      tokens、images、turns、latency/cost；只给同一个 24000 不保证同等 compute。
    - 支持 resume，避免重跑；但 completion 判定必须绑定 model/config/code/dataset hash。否则修改 prompt
      后仍跳过旧结果，混合不同实验版本。
    - 作者在所选 subset 上 GPT-5.4 最好。没有给样本量、metrics/CI 和详细结果，不能推广到 AgentVista 全集或所有 visual
      Agent。它是一次 subset observation。
  - title: 28. 本章知识结构与核心结论
    source_heading: 28. 本章知识结构与核心结论
    paragraphs:
    - 平均分会隐藏 workflow/risk slice 和 hard failure；使用 paired comparison、counts、CI、latency/cost。
    - Visual/GUI long-horizon Agent 必须评价 observation、grounding、action、state、recovery
      和 termination trajectory。
    - AgentVista 示例展示多模型 trajectory harness，但缺完整 interactive GUI environment/metrics，且候选与
      verifier 同变会混淆比较。
    - 可迁移的一般方法是：先精确定义被测能力，隔离候选可见输入与 evaluator hidden gold；尽可能运行真实系统并使用可执行 hard verifier；开放式部分用校准
      judge；按 case 成对、按风险切片报告；将 benchmark 自身也视为需版本、测试、防泄漏和维护的软件产品。
  takeaways:
  - Tracing 记录发生了什么；evaluation 还需 capability、gold/rubric、evaluator 与比较协议。
  - Judge score/reason 需保留 evaluator version，并与 hard gate、errors、SME calibration 分开。
  - FAIL_TO_PASS 验目标修复，PASS_TO_PASS/hidden tests 防回归和 benchmark gaming。
  - 先写 benchmark capability/task/score/maintenance 问题，建立设计框架；
  - 可迁移的一般方法是：先精确定义被测能力，隔离候选可见输入与 evaluator hidden gold；尽可能运行真实系统并使用可执行 hard verifier；开放式部分用校准
    judge；按 case 成对、按风险切片报告；将 benchmark 自身也视为需版本、测试、防泄漏和维护的软件产品。
