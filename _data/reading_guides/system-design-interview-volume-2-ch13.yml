overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 交易所设计的第一原则：先区分三条路径」建立了怎样的核心认识？
  question_source: 0. 交易所设计的第一原则：先区分三条路径
  thesis: 整数 Tick 保证价格比较与重放确定。 Float 不适合交易核心。
  thesis_source: 20. 核心结论
  concepts:
  - term: 0. 交易所设计的第一原则：先区分三条路径
    meaning: Sequencer 给输入建立唯一顺序，Matching Engine 单线程按规则推进 Order Book；Event Store 让
      Warm Replica 和故障恢复重放同一顺序。
    source_heading: 0. 交易所设计的第一原则：先区分三条路径
  - term: 4.1 Matching Engine
    meaning: 可用性基础是 Functional Determinism：同样有序输入必须产生同样 Fill Sequence。
    source_heading: 4.1 Matching Engine
  - term: 10.1 降低 Critical Path Latency 的两种方法
    meaning: 一条 Network Round Trip 约数百微秒，多个 Microservice Hop 累积到毫秒；同步 Disk Persist
      进一步到十毫秒。现代 Exchange 追求几十微秒，于是把 Critical Components 放一台大 Server/单 Process Boundary
      内。
    source_heading: 10.1 降低 Critical Path Latency 的两种方法
  - term: 11.1 Domain Encoding
    meaning: Gateway 做 FIX -> SBE，只把 Matching 必需字段带入 Critical Path，降低 Byte/Parse Cost。
    source_heading: 11.1 Domain Encoding
  - term: 13.2 New Order
    meaning: BUY 匹配 Sell Book，SELL 匹配 Buy Book；
    source_heading: 13.2 New Order
  - term: 21. 解决低延迟撮合系统的一般思路
    meaning: 本章最值得迁移的方法是：低延迟交易系统不靠把数据库和线程堆得更多，而靠缩短并固定 Critical Path：用单写者 Sequencer
      建立公平顺序，用确定性内存状态机撮合，用不可变事件复制和重放保证恢复，再把市场数据与报告作为异步投影从核心路径剥离。
    source_heading: 21. 解决低延迟撮合系统的一般思路
  logic:
  - 0. 交易所设计的第一原则：先区分三条路径
  - 4.1 Matching Engine
  - 4.7 Reporter
  - 11.1 Domain Encoding
  - 12.3 Cross-machine Replication
  - 15.3 Market Data Fairness
  - 21. 解决低延迟撮合系统的一般思路
  sections:
  - title: 0. 交易所设计的第一原则：先区分三条路径
    source_heading: 0. 交易所设计的第一原则：先区分三条路径
    paragraphs:
    - Trading/Critical Path：订单进入、风控、资金检查、排序、撮合、成交回报；必须极低且稳定延迟。
    - Market Data Flow：由订单/成交事件重建 Order Book、L1/L2/L3 与 Candlestick，再公平分发。
    - 只有必须决定成交结果的工作进入 Critical Path；市场数据、报告和持久分析都从确定的事件流异步派生。
    - Sequencer 给输入建立唯一顺序，Matching Engine 单线程按规则推进 Order Book；Event Store 让 Warm Replica
      和故障恢复重放同一顺序。
  - title: 2.1 Broker 与 Institutional Client
    source_heading: 2.1 Broker 与 Institutional Client
    paragraphs:
    - Retail Client 通常通过 Charles Schwab、Robinhood、E*Trade、Fidelity 等 Broker 访问 Exchange。Broker
      提供 UI、Account、Suitability 和 Order Routing。
    - Pension Fund：低频大单，需要拆单降低 Market Impact；
    - Hedge Fund/Market Maker：需要低延迟、Market Data Depth、Colocation；
    - 不适合普通 Web/Mobile REST Path。
  - title: 4.1 Matching Engine
    source_heading: 4.1 Matching Engine
    paragraphs:
    - 每 Symbol 维护 Order Book；
    - 每次 Match 生成 Buy/Sell 两条 Execution；
    - 发布 Execution Stream。
    - 可用性基础是 Functional Determinism：同样有序输入必须产生同样 Fill Sequence。
  - title: 4.7 Reporter
    source_heading: 4.7 Reporter
    paragraphs:
    - Correction/Cancel；
    - Trading Day Boundary。
  - title: 10.1 降低 Critical Path Latency 的两种方法
    source_heading: 10.1 降低 Critical Path Latency 的两种方法
    paragraphs:
    - 减少 Critical Path Task 数量；
    - 缩短每个 Task：减少 Network/Disk、优化 Execution。
    - 一条 Network Round Trip 约数百微秒，多个 Microservice Hop 累积到毫秒；同步 Disk Persist 进一步到十毫秒。现代
      Exchange 追求几十微秒，于是把 Critical Components 放一台大 Server/单 Process Boundary 内。
    - 这与通用“所有系统都拆微服务”相反：物理共置减少 Tail Latency，逻辑 Component 仍可保持边界。
  - title: 11.1 Domain Encoding
    source_heading: 11.1 Domain Encoding
    paragraphs:
    - External Domain：FIX；
    - Trading Domain：SBE 紧凑 Binary；
    - Reporting Domain：可选更丰富 Schema。
    - Gateway 做 FIX -> SBE，只把 Matching 必需字段带入 Critical Path，降低 Byte/Parse Cost。
  - title: 12.3 Cross-machine Replication
    source_heading: 12.3 Cross-machine Replication
    paragraphs:
    - 同机 Hot-Warm 不能防 Server/AZ 故障。把 Event Store 从 Hot Server 广播到 Warm Servers，可用
      Reliable UDP/Aeron 风格协议提高吞吐和低延迟。
    - Reliable UDP 需要 Sequence、NACK/Retransmit、Gap Recovery 和 Slow Consumer 策略。普通
      UDP 本身不可靠。
  - title: 13.2 New Order
    source_heading: 13.2 New Order
    paragraphs:
    - Validate Symbol/Price/Quantity；
    - BUY 匹配 Sell Book，SELL 匹配 Buy Book；
    - 按 Best Price、同价 FIFO；
    - 每 Match 生成两侧 Fill；
  - title: 15.3 Market Data Fairness
    source_heading: 15.3 Market Data Fairness
    paragraphs:
    - 若 MDP 按 Subscriber Connection List 顺序单播，第一个总先收到，Client 会争连接位置。
    - Reliable Multicast：同组近同时接收；
    - 标准化 Feed Handler/Network Distance；
    - Sequence + Recovery Channel，让丢包可补。
  - title: 21. 解决低延迟撮合系统的一般思路
    source_heading: 21. 解决低延迟撮合系统的一般思路
    paragraphs:
    - 明确产品、Order Type、Tick/Lot、Price-Time、Cancel/Replace、Trading Hours 和 Tie/Execution
      Price。
    - Ordered Price Levels、FIFO Doubly Linked Orders、Order ID Direct Map；逐项证明 Complexity
      与边界。
    - 同机 Component、CPU Pinning、Busy Loop、mmap Ring、Preallocation、Cache-line Padding；任何慢任务移出
      Loop。
    - 本章最值得迁移的方法是：低延迟交易系统不靠把数据库和线程堆得更多，而靠缩短并固定 Critical Path：用单写者 Sequencer 建立公平顺序，用确定性内存状态机撮合，用不可变事件复制和重放保证恢复，再把市场数据与报告作为异步投影从核心路径剥离。
  takeaways:
  - 先分 Critical Trading、Market Data 和 Reporting。 三条路径不能共享同一 Latency Budget。
  - 整数 Tick 保证价格比较与重放确定。 Float 不适合交易核心。
  - Tail Latency 比平均值更重要。 CPU Pinning、Preallocation、No Lock/No IO Critical Loop 都为
    P99/P99.99。
  - Hot-Warm + Fencing 实现快速 Failover。 两副本不能同时输出 Execution。
  - Reporting 可慢但必须完整准确。 它支撑 Clearing、Settlement、Tax、Compliance 和 Reconciliation。
