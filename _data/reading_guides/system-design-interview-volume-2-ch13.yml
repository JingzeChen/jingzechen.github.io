checks:
- level: 概念辨析
  question: 原文如何解释「18.1 Broker 不是 Exchange」？
  answer: Broker 面向客户并路由订单；Exchange 集中维护 Book 和撮合。
  source_heading: 18.1 Broker 不是 Exchange
- level: 概念辨析
  question: 原文如何解释「18.10 Sequencer 不只是自增 ID」？
  answer: 它还提供 Gap Detection、Fairness、Replay 和 Dedup Boundary；高层版本兼 Message Store。
  source_heading: 18.10 Sequencer 不只是自增 ID
- level: 概念辨析
  question: 原文如何解释「18.18 Order Manager 与 Order Book 不同」？
  answer: 前者管理风控、资产与 Lifecycle；后者是 Matching Core 的挂单结构。
  source_heading: 18.18 Order Manager 与 Order Book 不同
- level: 概念辨析
  question: 原文如何解释「18.23 Hot-Warm 不能让两者同时发布 Fill」？
  answer: 需要 Leader Epoch/Fencing，防 Split Brain/Duplicate Execution。
  source_heading: 18.23 Hot-Warm 不能让两者同时发布 Fill
- level: 概念辨析
  question: 原文如何解释「18.30 Colocation 不等于无条件不公平」？
  answer: 若规则、价格和接入对同类参与者公开一致，它是合法低延迟服务；监管仍需审查。
  source_heading: 18.30 Colocation 不等于无条件不公平
