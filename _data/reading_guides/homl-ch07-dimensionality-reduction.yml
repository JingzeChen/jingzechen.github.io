  sections:
  - title: 本章要回答什么问题
    source_heading: 本章要回答什么问题
    paragraphs:
    - MNIST 每张图有 784 个像素；
    - 模型更容易从偶然噪声中发现“规律”；
  - title: 0. 必要基础
    source_heading: 0. 必要基础
    paragraphs:
    - 内在维数 d：描述数据真实自由度所需的维数；
    - 例子：一张纸是二维表面，即使卷成圆筒放在三维空间中，它的内在维数仍是 2。
    - 中心化使每个特征均值为 0。PCA 必须围绕数据均值寻找方向，否则主方向可能只描述“均值离原点多远”。
    - 接近 0：线性相关弱，不代表独立。
  - title: 3.2 为什么保留方差
    source_heading: 3.2 为什么保留方差
    paragraphs:
    - 若投影后样本挤成一点，原数据差异全部丢失；投影后越分散，通常保留的信息越多。
    - 影子类比：观察一个立体物体时，面积最大的投影通常比细线状投影更能反映形状。
  - title: 4.5 Eckart–Young 结论
    source_heading: 4.5 Eckart–Young 结论
    paragraphs:
    - 损失是平方/Frobenius 重建误差；
    - 对其他损失或非线性表示，PCA 不一定最优。
  - title: 10. Random Projection
    source_heading: 10. Random Projection
    paragraphs:
    - 看似粗暴，但高维随机向量彼此近似正交。适当目标维数下，随机投影能以高概率近似保持有限样本之间的距离。
    - 公式实数值约 7300.45；数学上向上取整为 7301，但当前函数返回整数 7300，属于实现的整数处理差异。
    - 文本、基因组等超高维数据尤其适用。
    - 无法恢复投影零空间中的分量。伪逆本身在超高维上也可能非常昂贵，因此随机投影通常用于下游任务，而不是压缩后高质量重建。
  - title: 12.2 Isomap
    source_heading: 12.2 Isomap
    paragraphs:
    - 计算图上最短路径，近似流形测地距离；
    - 用 MDS 在低维中保留这些测地距离。
    - 邻居图连通且能反映真实局部结构。
    - Swiss Roll 上，Isomap 通常能去掉全局弯曲、展开成更规则平面。
  - title: 练习 3：降维能否逆转
    source_heading: 练习 3：降维能否逆转
    paragraphs:
    - 随机投影：可用伪逆近似，成本高且误差大；
    - t-SNE/LLE：通常没有简单可靠的逆变换。
    - 只有数据本来完全位于保留子空间、未删除任何非零分量时，PCA 才能精确恢复。
  - title: 练习 5：1000 维保留 95% 后有多少维
    source_heading: 练习 5：1000 维保留 95% 后有多少维
    paragraphs:
    - 若几乎全部方差集中在一个方向，可能只需 1 维；
    - 若 1000 个方向方差相近，可能需约 950 维；
    - 实际 d 要拟合 PCA 后看累计解释方差。
  - title: 练习 10：MNIST 可视化
    source_heading: 练习 10：MNIST 可视化
    paragraphs:
    - 3/5、4/9 等形状相似数字存在重叠；
    - 速度极快，但类别重叠明显，因为 PCA 只保留全局最大方差，不以类别分离为目标。
    - LLE：局部关系，但 MNIST 5000 样本效果和速度未必理想；
    - LDA：监督式，但最多 9 维，2D 投影未必分开所有数字；
  - title: 工程能力
    source_heading: 工程能力
    paragraphs:
    - 能选择 full/randomized/incremental PCA
    - 能调节 LLE 邻居数并识别局部/全局失真
    - 能在 MNIST 上比较降维前后模型性能和耗时
    - 能用 t-SNE 绘制二维类别图并谨慎解释
  takeaways:
  - 模型更容易从偶然噪声中发现“规律”；
  - 影子类比：观察一个立体物体时，面积最大的投影通常比细线状投影更能反映形状。
  - Swiss Roll 上，Isomap 通常能去掉全局弯曲、展开成更规则平面。
  - 实际 d 要拟合 PCA 后看累计解释方差。
  - 能用 t-SNE 绘制二维类别图并谨慎解释
