overview:
  kind: summary
  minutes: 11
  question: 原文围绕「全章主线」建立了怎样的核心认识？
  question_source: 全章主线
  thesis: 早期手机只运行少量固定应用，系统较简单；智能手机允许第三方应用，立刻需要更复杂的资源管理、多任务、安全与故障隔离。汽车也从机械设备变成由多个计算机控制的系统，软件错误或入侵可能直接影响人身安全。原书提到研究人员曾经通过被攻击的车载收音机进入汽车计算系统并远程关闭制动功能，用来说明保护问题并非抽象担忧。
  thesis_source: 1.1 什么是操作系统（What Is an Operating System）
  concepts:
  - term: 全章主线
    meaning: 操作系统是答案中的关键部分，因为它位于应用与硬件之间，既管理资源，也规定应用能看到什么、能做什么。困难在于，一个现代通用操作系统可能超过五千万行代码，无法靠逐行阅读建立整体认识。作者因此不从某个具体内核的源码或
      API 清单开始，而是抽取所有计算机专业学生都需要掌握的基本问题。
    source_heading: 全章主线
  - term: 1.1 什么是操作系统（What Is an Operating System）
    meaning: 早期手机只运行少量固定应用，系统较简单；智能手机允许第三方应用，立刻需要更复杂的资源管理、多任务、安全与故障隔离。汽车也从机械设备变成由多个计算机控制的系统，软件错误或入侵可能直接影响人身安全。原书提到研究人员曾经通过被攻击的车载收音机进入汽车计算系统并远程关闭制动功能，用来说明保护问题并非抽象担忧。
    source_heading: 1.1 什么是操作系统（What Is an Operating System）
  - term: 1.2 操作系统评价（Operating System Evaluation）
    meaning: 20 世纪 80 年代末的一个研究操作系统使用类型安全语言减少编程错误，但为提高速度，把最频繁的核心例程改用汇编。团队又省去高频路径中的一条指令，代价是：当操作系统大小超过某个上限时，这段代码偶尔会失效。当时系统远未达到上限，于是优化被接受。
    source_heading: 1.2 操作系统评价（Operating System Evaluation）
  - term: 用 C 语言验证关键概念
    meaning: 实验设三个 CPU 任务同时到达，所需处理时间分别为 8、1、1 个时间单位。先来先服务（FCFS）让第一个任务一直运行到完成；时间片轮转（round-robin）每次最多运行一个时间单位，再把未完成任务放回队尾。
    source_heading: 用 C 语言验证关键概念
  - term: 章末练习详解
    meaning: 成立条件：作业长度已知、目标是平均完成时间、没有优先级和到达时间差。若长度未知或要保证交互公平，时间片轮转更稳妥；若有截止时间，还需实时调度策略。最长作业优先通常增大平均等待，但可能在特定优先级或资源管线中合理。
    source_heading: 章末练习详解
  - term: 复习检查清单
    meaning: 未来数据中心、多核、便携、异构和存储带来的挑战。
    source_heading: 复习检查清单
