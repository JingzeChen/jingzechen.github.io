overview:
  kind: summary
  minutes: 12
  question: 原文围绕「全章主线」建立了怎样的核心认识？
  question_source: 全章主线
  thesis: 可监控 page-fault frequency、paging disk 利用率、CPU idle-while-I/O、每进程驻留集和 refault
    distance。若 page fault 持续高、paging device 接近饱和、CPU 利用低，继续增加进程不会帮助；应降低 multiprogramming、扩容
    DRAM或调整工作集。
  thesis_source: 9.7 案例：虚拟内存（Virtual Memory）
  concepts:
  - term: 全章主线
    meaning: 缓存性能不是缓存自身的固有属性，而是缓存设计与工作负载的交互结果。同一个哈希表，能放进 L1 时每次纳秒级，超出 DRAM 后每次可能触发毫秒级磁盘访问；同一条替换规则，在有时间局部性的负载上很好，在循环扫描上可能每次都错。
    source_heading: 全章主线
  - term: 9.3 缓存何时有效、何时失效
    meaning: 纯 LFU 会让历史热门对象永久占据缓存，即使流行趋势已变。实践中需计数衰减、滑动窗口、TinyLFU/ARC 等近期性与频率混合机制。Web
      副本还会过期，命中不等于有效：必须用 TTL、版本号或条件请求验证 freshness。
    source_heading: 9.3 缓存何时有效、何时失效
  - term: 9.5 替换策略（Replacement Policies）
    meaning: cache miss 且候选位置已满时，要选一个 victim。理想目标是最小化未来 miss 成本，而不是机械最小化 miss 数：脏页写回比干净页贵，远端对象比本地对象贵，大对象占更多空间，关键路径上的
      miss 比非关键路径重要。
    source_heading: 9.5 替换策略（Replacement Policies）
  - term: 9.7 案例：虚拟内存（Virtual Memory）
    meaning: 可监控 page-fault frequency、paging disk 利用率、CPU idle-while-I/O、每进程驻留集和 refault
      distance。若 page fault 持续高、paging device 接近饱和、CPU 利用低，继续增加进程不会帮助；应降低 multiprogramming、扩容
      DRAM或调整工作集。
    source_heading: 9.7 案例：虚拟内存（Virtual Memory）
  - term: 用 C++ 验证关键机制
    meaning: 程序对应练习 12，明确把 TLB/cache 的必付成本、cache miss、两级 page walk 和条件 page fault
      分开。
    source_heading: 用 C++ 验证关键机制
  - term: 复习检查清单
    meaning: 能比较 write-through、write-back、write-allocate 与 write-around。
    source_heading: 复习检查清单
