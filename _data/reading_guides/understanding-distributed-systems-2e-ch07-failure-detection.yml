checks:
- level: 概念辨析
  question: 原文如何解释「12.1 Crash、unreachable、unavailable、unhealthy」？
  answer: unhealthy：健康策略认为目标不满足条件。
  source_heading: 12.1 Crash、unreachable、unavailable、unhealthy
- level: 概念辨析
  question: 原文如何解释「12.3 Ping 与 heartbeat」？
  answer: ping 是观察者拉取并等待 response；
  source_heading: 12.3 Ping 与 heartbeat
- level: 概念辨析
  question: 原文如何解释「12.5 Failure 与 suspicion」？
  answer: 检测器输出 suspicion。只有协调协议、quorum、lease 和 fencing 等机制才能把怀疑安全地转化为接管动作。
  source_heading: 12.5 Failure 与 suspicion
- level: 概念辨析
  question: 原文如何解释「12.6 Liveness 与 readiness」？
  answer: 把 readiness 失败当 liveness 失败反复重启，可能阻止系统恢复。
  source_heading: 12.6 Liveness 与 readiness
- level: 概念辨析
  question: 原文如何解释「12.8 一次成功不代表持续健康」？
  answer: 健康证据会随时间老化，每个真实请求仍要设置 timeout 并处理失败。
  source_heading: 12.8 一次成功不代表持续健康
