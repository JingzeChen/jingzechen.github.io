  - 15. 从本章提炼出的通用解题方法
  sections:
  - title: 0.1 从系统模型到故障检测
    source_heading: 0.1 从系统模型到故障检测
    paragraphs:
    - fair-loss links：消息可能丢失或重复；
    - crash-recovery processes：进程可能崩溃并重启；
    - partial synchrony：延迟可能暂时任意大，但最终进入可用的同步时期。
    - 这些假设立即导出一个难题：当客户端没有及时收到服务器响应时，它无法直接观察“故障发生在哪里”。Failure detector（故障检测器）只能根据消息和时间线索，推测远端当前是否可用。
  - title: 1. 请求无响应：图 7.1 的三个不可区分场景
    source_heading: 1. 请求无响应：图 7.1 的三个不可区分场景
    paragraphs:
    - 客户端观察到响应，可以确认这次交互完成。但若响应没有按时返回，至少有以下三类解释。
    - 第二种情况尤其重要：timeout 后重试可能重复业务副作用，因此需要 Chapter 5 的幂等方法或 idempotency key。
    - garbage collection pause；
    - page fault 或 swap；
  - title: 4. Ping：拉取式主动探测
    source_heading: 4. Ping：拉取式主动探测
    paragraphs:
    - 若 ACK 未在 timeout 内到达，monitor 怀疑 target unavailable。
    - 原章特别强调：判 unavailable 后仍继续发送 ping，以发现目标何时回来。若停止探测，就只能发现“曾经失败”，无法自动发现 crash-recovery
      后恢复。
    - Chapter 7 没有展开大规模成员协议，但这个估算说明全互联 ping 无法无限扩展。大集群会采用分层监控、随机探测、间接探测或 gossip 类协议。
    - 专用 ping endpoint 便宜、频繁，但可能与真实业务路径不同。另一种方式是把正常请求成功当作健康证据，只在一段时间无业务流量时发 ping。
  - title: 6.2 恢复判定也可能抖动
    source_heading: 6.2 恢复判定也可能抖动
    paragraphs:
    - 连续 k_f 次失败才标 unavailable；
    - 连续 k_s 次成功才恢复 available；
    - 将 SUSPECTED 与 CONFIRMED_UNAVAILABLE 分开。
  - title: 8.3 冷启动与异常样本
    source_heading: 8.3 冷启动与异常样本
    paragraphs:
    - timeout 样本是否参与统计；
    - 故障期长延迟是否把阈值永久拉大；
  - title: 9.2 Quorum
    source_heading: 9.2 Quorum
    paragraphs:
    - 多个观察者可以共同形成决策，降低单条路径异常的影响。例如多数派能互通的一侧继续工作，少数派停止高风险操作。
    - quorum 仍不是“证明某节点死亡”，而是让有重叠的决策集合保持安全。它依赖成员配置和具体共识协议。
  - title: 11.1 基础指标
    source_heading: 11.1 基础指标
    paragraphs:
    - suspect transitions；
    - recovery transitions；
    - heartbeat inter-arrival 分布；
    - detector 自身 CPU、队列和 event-loop lag。
  - title: 11.4 故障注入
    source_heading: 11.4 故障注入
    paragraphs:
    - event loop / GC pause；
    - detector 与被监控者同时过载；
    - 旧 heartbeat 乱序到达；
    - 测试目标不是让 detector 每次猜对，而是验证误判时系统仍保持安全、恢复时不会抖动、重试不会造成级联故障。
  - title: 12.4 Timeout 与 deadline
    source_heading: 12.4 Timeout 与 deadline
    paragraphs:
    - timeout 常表示某一步最多等待多久；
    - deadline 表示整个操作的绝对截止时刻或剩余总预算；
    - 多层调用应传播 deadline，局部 timeout 必须小于剩余预算。
  - title: 15. 从本章提炼出的通用解题方法
    source_heading: 15. 从本章提炼出的通用解题方法
    paragraphs:
    - elapsed time 用 monotonic clock；动态路径可根据均值、波动或 suspicion score 调整阈值，并设置合理上下限。
    - 不要让一个 detector 的 timeout 直接创造新 leader。用 quorum 确认、lease 管理所有权、fencing token
      阻止旧 owner。
    - 分别注入丢请求、丢响应、慢节点、崩溃恢复、单向分区和 event-loop pause。验证系统在 detector 猜错时仍安全，在恢复时能稳定收敛。
    - 本章最重要的方法论是：故障检测不是发现一个客观的“死亡事实”，而是根据不完整、会迟到的证据做风险决策；设计重点应从追求零误判转向约束误判后果、保证安全接管并支持恢复。
  takeaways:
  - 无响应有多种不可区分原因。 请求/响应可能延迟或丢失，服务器可能崩溃，也可能只是很慢。
  - timeout 太短会误判健康长尾，太长会延迟真实故障处理。 阈值在 accuracy 与 detection latency 之间权衡。
  - heartbeat 是目标周期推送存活消息。 monitor 根据 last_seen 判断，恢复发送后重新可用。
  - 健康证据会过期。 刚刚成功的探测不能保证下一次业务请求成功。
  - 健康有多个层次。 alive、ready、依赖健康和业务正确性不应压成一个未经定义的布尔值。
