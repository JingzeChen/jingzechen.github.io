overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0.1 从系统模型到故障检测」建立了怎样的核心认识？
  question_source: 0.1 从系统模型到故障检测
  thesis: 完备性要求最终怀疑真实故障，准确性要求少怀疑正确进程。 部分同步常支持 eventual accuracy，而非从启动起零误判。
  thesis_source: 14. 核心结论
  concepts:
  - term: 0.1 从系统模型到故障检测
    meaning: partial synchrony：延迟可能暂时任意大，但最终进入可用的同步时期。
    source_heading: 0.1 从系统模型到故障检测
  - term: 4. Ping：拉取式主动探测
    meaning: 原章特别强调：判 unavailable 后仍继续发送 ping，以发现目标何时回来。若停止探测，就只能发现“曾经失败”，无法自动发现 crash-recovery
      后恢复。
    source_heading: 4. Ping：拉取式主动探测
  - term: 8.3 冷启动与异常样本
    meaning: timeout 样本是否参与统计；
    source_heading: 8.3 冷启动与异常样本
  - term: 9.2 Quorum
    meaning: 多个观察者可以共同形成决策，降低单条路径异常的影响。例如多数派能互通的一侧继续工作，少数派停止高风险操作。
    source_heading: 9.2 Quorum
  - term: 11.4 故障注入
    meaning: 测试目标不是让 detector 每次猜对，而是验证误判时系统仍保持安全、恢复时不会抖动、重试不会造成级联故障。
    source_heading: 11.4 故障注入
  - term: 15. 从本章提炼出的通用解题方法
    meaning: 不要让一个 detector 的 timeout 直接创造新 leader。用 quorum 确认、lease 管理所有权、fencing
      token 阻止旧 owner。
    source_heading: 15. 从本章提炼出的通用解题方法
  logic:
  - 0.1 从系统模型到故障检测
  - 4. Ping：拉取式主动探测
  - 6.2 恢复判定也可能抖动
