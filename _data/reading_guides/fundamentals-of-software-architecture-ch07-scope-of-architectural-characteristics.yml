checks:
- level: 概念辨析
  question: 原文如何解释「6.1 “全系统必须共享同一组架构特征”」？
  answer: 正确理解：在 quantum level 定义特征，系统级只保留真正横切的最低要求。
  source_heading: 6.1 “全系统必须共享同一组架构特征”
- level: 概念辨析
  question: 原文如何解释「6.4 “一个 microservice 必然是一个 quantum”」？
  answer: 错误之处：共享数据库或必须一起部署的服务仍可能组成同一 quantum。
  source_heading: 6.4 “一个 microservice 必然是一个 quantum”
- level: 概念辨析
  question: 原文如何解释「6.10 “Static coupling 只指代码 import”」？
  answer: 错误之处：共享数据库、schema、库和不可独立演进资源也属于静态布线。
  source_heading: 6.10 “Static coupling 只指代码 import”
- level: 概念辨析
  question: 原文如何解释「6.14 “同步调用只增加一点网络延迟”」？
  answer: 错误之处：它还传播可用性、吞吐、超时和故障，较慢 Payment 会限制高扩展 Auction。
  source_heading: 6.14 “同步调用只增加一点网络延迟”
- level: 概念辨析
  question: 原文如何解释「6.24 “托管云服务意味着架构师不再负责运行特征”」？
  answer: 错误之处：责任转移不等于风险消失，应用还要面对 SLA、配额、区域和失败语义。
  source_heading: 6.24 “托管云服务意味着架构师不再负责运行特征”
