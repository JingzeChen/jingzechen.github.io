  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Semantic、implementation、static、dynamic coupling 分别描述什么？
    - 架构特征范围怎样帮助选择 monolithic 或 distributed architecture？
    - 为什么 persistence 和 synchronous/asynchronous communication 会反过来改变量子边界？
    - 一句话概括：架构特征必须有作用范围；把应以不同方式扩展、保护和演进的能力放进同一边界，会迫使全系统承担最严格要求，而共享数据和同步调用又可能把看似独立的服务重新绑成一个运行整体。
  - title: 1. 开篇：为什么“范围”成为独立问题
    source_heading: 1. 开篇：为什么“范围”成为独立问题
    paragraphs:
    - 传统架构方法常假设整个系统只有一套架构特征：同一可用性目标、同一性能等级、同一安全与演进节奏。在单体和共享数据库占主导的时代，这个假设经常接近现实。
    - 若把这些要求都提升为全系统统一目标，所有部分都要支付所有能力的成本；若忽略范围，又会让关键局部能力达不到业务要求。
    - 假设服务代码经过精心优化，能够水平扩展；数据库却只有单实例、存在热点锁或无法分区。最终 scalability 和 elasticity 的上限仍由数据库决定。
    - 作者在编写《Building Evolutionary Architectures》时，需要衡量不同架构风格的 structural evolvability（结构可演进性）。现有指标粒度太低，无法表达代码、数据库和运行依赖共同形成的作用范围，于是提出
      architecture quantum。
  - title: 3. Synchronous Communication：同步通信
    source_heading: 3. Synchronous Communication：同步通信
    paragraphs:
    - Communication 属于 dynamic coupling：不同 architecture quanta 在运行时互相调用。它尤其影响 operational
      characteristics，因为分布式调用包含等待、阻塞、容量和故障传播。
    - 若许多拍卖同时结束，Auction 的发送能力可能远高于 Payment。第一笔调用成功，随后请求开始超时、排队或失败。两者虽然是不同服务，却没有兼容的
      scalability。
    - 因此，不同 quanta 的架构特征会在请求路径上相互制约。高扩展 Auction 同步依赖低扩展 Payment 时，Auction 无法为该工作流兑现自己的扩展承诺。
    - 此时应重新检查：它们仍是两个独立量子，还是同步 connascence 已让有效特征范围扩大。不是每个同步调用都自动合并量子，关键在于调用是否位于关键路径、能否降级、契约是否独立，以及失败是否传播。
  - title: 4. The Impact of Scoping：作用范围的影响
    source_heading: 4. The Impact of Scoping：作用范围的影响
    paragraphs:
    - 共享数据库会产生静态耦合，可能让多个服务落入同一 quantum；数据库按边界分离则提高自主性，但引入分布式一致性、复制、查询和运维成本。
    - 流程有效的原因是按依赖顺序决策：先知道需要保护什么，再决定边界；先看静态独立性，再看运行时通信。它仍需迭代，因为 persistence 和 communication
      可能推翻早期边界。
    - 因此，maintainability、deployability 和 testability 不是一般代码偏好，而是直接支持商业优势的架构特征。
    - 关键观察：图中有 7 个服务，却只有 3 个 quanta。共享数据库和统一特征范围让 Quote/Item Status 属于同一 quantum，四个后台服务也属于同一
      quantum。
  - title: 5.1 Using the cloud to host containers：云托管容器
    source_heading: 5.1 Using the cloud to host containers：云托管容器
    paragraphs:
    - 许多团队把云当成替代 operations center，在云中运行并编排服务器容器。
    - 每个 container 的 CPU、内存、启动和状态约束；
    - Kubernetes 等 orchestrator 的调度、滚动升级和健康检查语义；
    - Kubernetes 能编排副本，不会自动修复共享数据库、错误服务边界或同步瓶颈。
  - title: 5.3 托管资源怎样影响 quantum
    source_heading: 5.3 托管资源怎样影响 quantum
    paragraphs:
    - 多个服务依赖同一 region，拥有共同故障域；
    - 所有工作流同步依赖单一厂商 API，动态可用性被绑定；
    - 共享 IAM、密钥或事件总线可能形成治理和安全范围。
    - "“Serverless” 或 “managed” 不等于没有 quantum，只是部分实现和运维责任转移给供应商。"
  - title: 5.4 过去的难题变成今天的配置
    source_heading: 5.4 过去的难题变成今天的配置
    paragraphs:
    - Elasticity 等能力，是上一代架构师在物理系统上艰难实现的成果；今天常表现为云配置项。
    - provider availability；
    - heightened security concerns；
  - title: 7. 从本章提炼的通用范围分析法
    source_heading: 7. 从本章提炼的通用范围分析法
    paragraphs:
    - 找出差异足以影响结构、成本和运行方式的 cluster，而不是为细小阈值差异任意拆分。
    - 寻找共享数据库、共享组件和必须同步升级的依赖；必要时合并 quantum 或拆除耦合点。
    - 测试突发、依赖故障、数据库迁移、独立扩缩和频繁规则发布，观察范围是否真实独立。
    - 记录边界依据、共享依赖、通信假设和触发拆分/合并的条件；云配置与业务变化后重新分析。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - Semantic coupling 来自业务问题，无法消除；implementation coupling 来自技术选择，可以主动重构。
    - Static coupling 描述代码、数据和共享依赖的布线，dynamic coupling 描述运行时通信与故障传播。
    - 共享数据库可让多个服务属于同一 quantum；database per boundary 提高自主性但增加分布式数据成本。
    - Assessment 的 maintainability、deployability 和 testability 直接支持快速收购新型号的商业优势。
  - title: 10. 主动回忆与应用题
    source_heading: 10. 主动回忆与应用题
    paragraphs:
    - 对订单系统分别列出 semantic、implementation、static 和 dynamic coupling。
    - Payment 并发为 4、单笔仍需 500 ms 时，计算理论容量；若 Auction 以 30/s 突发 20 秒，估算积压与清空时间。
    - 为什么 architecture style、quantum、service 和 bounded context 不能混为同义词？
    - 不看正文，复述范围分析十步：工作流、特征簇、差异、内聚、部署、静态闭包、动态耦合、风格/数据、验证、复查。
  takeaways:
  - 范围层：一组架构特征属于哪个最小独立运行整体；
  - Quantum 的复数是 quanta；术语借用“最小独立整体”直觉，不是物理定律。
  - 范围越窄可容忍越强耦合；范围越广，契约越应松散、显式和可独立演进。
  - 共享数据库可让多个服务属于同一 quantum；database per boundary 提高自主性但增加分布式数据成本。
  - 架构技术不断变化，识别范围、耦合与 trade-offs 的核心工作保持不变。
