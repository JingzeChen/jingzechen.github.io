overview:
  kind: summary
  minutes: 9
  question: 原文围绕「本章在全书中的位置」建立了怎样的核心认识？
  question_source: 本章在全书中的位置
  thesis: MNIST 被广泛研究，常被称为机器学习的“Hello World”。本章的重点是评估方法，而不是处理脏数据，因此 MNIST 很合适：图像干净、居中、旋转不大，数字尺寸也大致一致，几乎不需要复杂预处理。
  thesis_source: 1. MNIST 数据集
  concepts:
  - term: 本章在全书中的位置
    meaning: 第 1 章告诉我们监督学习最常见的两类任务是回归（预测数值）和分类（预测类别）。第 2 章用加州房价完整走了一遍回归项目。本章把注意力转向分类系统。
    source_heading: 本章在全书中的位置
  - term: 1. MNIST 数据集
    meaning: MNIST 被广泛研究，常被称为机器学习的“Hello World”。本章的重点是评估方法，而不是处理脏数据，因此 MNIST 很合适：图像干净、居中、旋转不大，数字尺寸也大致一致，几乎不需要复杂预处理。
    source_heading: 1. MNIST 数据集
  - term: 4. 多类分类
    meaning: 为什么缩放有用：像素强度虽然都在 0～255，但不同像素的分布差异很大；图像边缘像素几乎恒为 0，中心像素变化更剧烈。SGD 用统一学习率更新权重，尺度和方差差异会造成不同方向的有效步长失衡。标准化使特征接近零均值、单位方差，改善收敛。
    source_heading: 4. 多类分类
  - term: 5. 误差分析
    meaning: "“数闭环”这个例子非常精彩：这是一个人类一眼就能看出、但线性模型永远学不会的特征。因为闭环是拓扑性质，无法由 784 个像素的加权和表达。把它显式算出来当作特征，等于把模型能力之外的信息直接喂给它。"
    source_heading: 5. 误差分析
  - term: 8. 章末练习
    meaning: 数据增强后模型表现通常会进一步提高。这道题正是 5.7 节方案 B 的实操，直接验证误差分析得出的改进思路。注意训练集会变成原来的 5 倍（60,000
      → 300,000），KNN 的预测会显著变慢。
    source_heading: 8. 章末练习
  - term: 判断力
    meaning: 听到”我们要 99% 精确率”，能反问”在多少召回率下”
    source_heading: 判断力
  logic:
  - 本章在全书中的位置
  - 1. MNIST 数据集
  - 2. 训练一个二元分类器
  - 5. 误差分析
  - 7. 多输出分类
  - 动手能力
  - 判断力
  sections:
  - title: 本章在全书中的位置
    source_heading: 本章在全书中的位置
    paragraphs:
    - 第 1 章告诉我们监督学习最常见的两类任务是回归（预测数值）和分类（预测类别）。第 2 章用加州房价完整走了一遍回归项目。本章把注意力转向分类系统。
    - 第 2 章解决的是”项目怎么走完整个流程”，第 3 章解决的是”分类任务该怎么正确地评估”。
    - 分类任务的评估指标体系（准确率、混淆矩阵、精确率、召回率、F₁、ROC、AUC）；
    - 如何把二元分类器扩展到多类、多标签、多输出场景；
  - title: 本章主线
    source_heading: 本章主线
    paragraphs:
    - 这条主线采用一种很有效的问题推进方式：先得到一个看起来很棒的结果，再揭示它的缺陷，由此引出下一个概念。
    - 准确率 95% → 但傻瓜分类器有 90% → 所以需要混淆矩阵
    - 混淆矩阵信息全 → 但四个数字不便比较 → 所以需要精确率/召回率
    - F₁ 假设两者同等重要 → 但现实往往不是 → 所以需要理解权衡
  - title: 1. MNIST 数据集
    source_heading: 1. MNIST 数据集
    paragraphs:
    - MNIST 被广泛研究，常被称为机器学习的“Hello World”。本章的重点是评估方法，而不是处理脏数据，因此 MNIST 很合适：图像干净、居中、旋转不大，数字尺寸也大致一致，几乎不需要复杂预处理。
    - 这里隐含一个重要观念：模型看到的不是”图片”，而是一个 784 维的数值向量。像素之间的空间关系（哪个像素挨着哪个）在摊平之后完全丢失了。线性模型只是给
      784 个位置各分配一个权重然后加权求和。这解释了本章误差分析里的核心结论——模型对平移和旋转极其敏感。真正利用空间结构的模型（卷积网络）要到第 12
      章。
    - 保证交叉验证各折相似。如果数据按标签排序（前 7000 张全是 0，接着全是 1……），那么 3 折交叉验证的第一折可能只包含数字 0～2，模型根本没见过其他数字，评估结果毫无意义。
    - 如果连续喂进 100 个 5，参数会被强行拉向”什么都是 5”的方向；接着连续喂 100 个 0，又被拉回去。
  - title: 2. 训练一个二元分类器
    source_heading: 2. 训练一个二元分类器
    paragraphs:
    - 绝大多数经典指标（精确率、召回率、ROC）都是从二分类定义开始的。先把 10 类问题简化为“是 5 / 不是 5”，可以在最清晰的场景下理解整套指标体系，再推广到多类。
    - 这个”5-detector”是一个二元分类器（binary classifier），只区分两个类别。
    - 哪一类当正类是人为规定的，但一旦定下来，精确率、召回率的含义就完全确定了。换一个正类，所有指标的数值都会变。这是初学者常见的困惑来源。
    - 但单个样本预测正确并不能说明模型整体有效，一个样本预测对了什么都说明不了。下一步必须进行系统评估。
  - title: 4. 多类分类
    source_heading: 4. 多类分类
    paragraphs:
    - 多类分类器（multiclass / multinomial classifier）：区分两个以上的类别。MNIST 的完整任务就是 10 类（数字 0～9）。
    - 选择原则：对训练成本随样本数快速增长的算法（如 SVM），OvO 往往更合适；大多数其他二元算法通常优先 OvR。下面用复杂度解释这一选择。
    - 这里 Scikit-Learn 使用 OvR，训练 10 个二元分类器。这 10 个值是各分类器的决策分数，不是概率，也不会归一化，因此可以全为负。
    - 为什么缩放有用：像素强度虽然都在 0～255，但不同像素的分布差异很大；图像边缘像素几乎恒为 0，中心像素变化更剧烈。SGD 用统一学习率更新权重，尺度和方差差异会造成不同方向的有效步长失衡。标准化使特征接近零均值、单位方差，改善收敛。
  - title: 5. 误差分析
    source_heading: 5. 误差分析
    paragraphs:
    - "“混淆矩阵通常不对称” 是一个重要观念。”5 容易被看成 8” 和 “8 容易被看成 5” 是两件不同的事。直觉上：5 少一笔就像 8 的一部分，而
      8 的闭合环结构比较独特，不容易被误认为 5。"
    - "“数闭环”这个例子非常精彩：这是一个人类一眼就能看出、但线性模型永远学不会的特征。因为闭环是拓扑性质，无法由 784 个像素的加权和表达。把它显式算出来当作特征，等于把模型能力之外的信息直接喂给它。"
    - 第三步，得出根本原因： 模型对平移和旋转极其敏感。因为像素被摊平成 784 维向量后，”第 100 个像素”和”第 101 个像素”在模型看来毫无关系。整张图右移一个像素，输入向量就面目全非。
    - 第四步，两个解决方案： | 方案 | 做法 | 特点 | | — | — | — | | 方案 A：图像配准 | 预处理让所有图片居中、摆正 | 需要先估计每张图的正确旋转角度，本身并不容易
      | | 方案 B：数据增强 | 把训练图片做轻微平移、旋转后加入训练集 | 实现更简单，可迫使模型容忍这些变化 |
  - title: 7. 多输出分类
    source_heading: 7. 多输出分类
    paragraphs:
    - 多输出分类是多标签分类的推广：每个输出不再只有 True/False 两种取值，而是可以取多个类别值。
    - 关键设计：输入是加噪图，目标是原图。模型要学的映射是”含噪图 → 干净图”。
    - KNN 为什么能做这件事（解释）：KNN 预测时找出输入的 k 个最近邻，然后综合这些邻居的目标值。这里每个邻居的目标值是一整张 784 维的干净图像，所以输出自然也是一张
      784 维的图像。KNN 不需要为 784 个输出分别建模，它天然支持任意结构的输出。
    - 别把这些术语当作严格的分类学。它们是描述问题结构的词汇，边界本来就模糊。重要的是理解输出的结构（几个输出？每个输出取什么值？有序还是无序？），而不是纠结叫什么名字。
  - title: 8. 章末练习
    source_heading: 8. 章末练习
    paragraphs:
    - 题目：写一个函数把 MNIST 图像向任意方向（左、右、上、下）平移 1 个像素。然后对训练集中每张图生成 4 个平移副本加入训练集，用扩充后的训练集训练练习
      1 的最佳模型，测量测试准确率。
    - 数据增强后模型表现通常会进一步提高。这道题正是 5.7 节方案 B 的实操，直接验证误差分析得出的改进思路。注意训练集会变成原来的 5 倍（60,000
      → 300,000），KNN 的预测会显著变慢。
    - 为什么把这些做成超参数：因为哪种预处理更好无法先验判断，应该交给交叉验证决定。这是第 2 章”把预处理放进 Pipeline 一起调参”思想的延续。
    - 最终要求：精确率和召回率都要高。这正是 3.4.6 节的应用——垃圾邮件场景中，假正例（把重要邮件判为垃圾）代价很高，假负例（漏掉垃圾邮件）代价相对低，所以精确率尤其重要，但也不能让召回率太低。
  - title: 动手能力
    source_heading: 动手能力
    paragraphs:
    - 能根据”精确率 ≥ 90%”这类需求反解出阈值
    - 能画出三种归一化的混淆矩阵并正确解读
    - 能正确处理 MNIST 标签是字符串这一点
  - title: 判断力
    source_heading: 判断力
    paragraphs:
    - 能根据”哪类错误代价更高”选择优先指标
    - 听到”我们要 99% 精确率”，能反问”在多少召回率下”
    - 能判断该用 PR 曲线还是 ROC 曲线
    - 能从混淆矩阵读出改进方向，而不是盲目调参
  takeaways:
  - 如何把二元分类器扩展到多类、多标签、多输出场景；
  - 如果连续喂进 100 个 5，参数会被强行拉向”什么都是 5”的方向；接着连续喂 100 个 0，又被拉回去。
  - 第四步，两个解决方案： | 方案 | 做法 | 特点 | | — | — | — | | 方案 A：图像配准 | 预处理让所有图片居中、摆正 | 需要先估计每张图的正确旋转角度，本身并不容易
    | | 方案 B：数据增强 | 把训练图片做轻微平移、旋转后加入训练集 | 实现更简单，可迫使模型容忍这些变化 |
  - 最终要求：精确率和召回率都要高。这正是 3.4.6 节的应用——垃圾邮件场景中，假正例（把重要邮件判为垃圾）代价很高，假负例（漏掉垃圾邮件）代价相对低，所以精确率尤其重要，但也不能让召回率太低。
  - 能从混淆矩阵读出改进方向，而不是盲目调参
