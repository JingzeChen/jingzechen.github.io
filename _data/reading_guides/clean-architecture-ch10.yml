overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 动态语言仍有行为契约、软件包、部署和故障依赖，因此并不免疫 ISP 问题。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 当某个依赖发生变化或故障时，当前客户端是否会因为自己根本不用的部分而受到影响？
    source_heading: 本章导读
  - term: 2. 用角色接口隔离操作
    meaning: 在 Clean Architecture 的语境中，接口通常应靠近需要它的一方，尤其当它承担依赖反转边界时。
    source_heading: 2. 用角色接口隔离操作
  - term: 4.7 选型时就检查依赖行李
    meaning: 许多架构负担不是编码时产生的，而是在选择框架、SDK 或平台时被带入系统。
    source_heading: 4.7 选型时就检查依赖行李
  - term: 5.3 与其他 SOLID 原则的关系
    meaning: 一个接口也可能符合 DIP，却违反 ISP：客户端依赖的是抽象，但这个抽象包含大量无关方法。
    source_heading: 5.3 与其他 SOLID 原则的关系
  - term: 6. 把 ISP 用到实际设计中
    meaning: 若所有客户端都依赖同一个“全能仓储接口”，详情页测试可能被迫处理删除、导出和运维操作。更合理的做法是围绕读取、下单、合规和运维角色建立接口。
    source_heading: 6. 把 ISP 用到实际设计中
  - term: 本章总结
    meaning: Adapter 能隔离第三方 API，但未必移除安装、版本、许可证和运行时风险。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 2. 用角色接口隔离操作
  - 3. ISP and Language：语言如何改变问题的表现
  - 5.3 与其他 SOLID 原则的关系
  - 5.4 本章的完整思路
  - 8. 实践检查与掌握练习
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 这句话容易让人把 ISP 理解成一条接口书写技巧，例如“每个接口只能放一个方法”或“接口越小越好”。但本章真正关心的不是方法数量，而是依赖是否与使用者的真实需要相匹配。
    - 无关功能的故障也可能沿依赖链传播到它。
    - 比较静态类型语言和动态类型语言中的表现差异；
    - 当某个依赖发生变化或故障时，当前客户端是否会因为自己根本不用的部分而受到影响？
  - title: 1. 从 OPS 案例理解 ISP
    source_heading: 1. 从 OPS 案例理解 ISP
    paragraphs:
    - 依赖某个声明或模块，指客户端需要知道、引用、编译、链接、加载或部署它，才能完成自己的工作。
    - 可以把这种情况想成一张门禁卡：一个员工只需要进入一间办公室，公司却只能给他一张打开整栋楼所有房间的卡。即使他从不进入其他房间，权限变更、审计和安全风险仍然会把那些房间与他联系起来。
    - 具体影响取决于语言、编译器、构建工具和部署方式。某些实现细节变化未必真的让所有客户端重新编译。但这不改变本章的判断标准：当多个不相关能力被绑在同一依赖边界中时，它们更容易共享变化影响面。
    - 这些只是线索，不是自动定罪。还要继续检查客户端是否真的具有不同的使用模式和变化节奏。
  - title: 2. 用角色接口隔离操作
    source_heading: 2. 用角色接口隔离操作
    paragraphs:
    - 这种接口常被称为 Role Interface（角色接口）：它描述“某个协作者为了完成这个角色需要什么”，而不是罗列“实现对象一共会什么”。
    - 在 Clean Architecture 的语境中，接口通常应靠近需要它的一方，尤其当它承担依赖反转边界时。
    - 不过，接口的物理位置仍要服从项目的模块规则。关键不是某个固定目录，而是谁拥有契约、谁因谁而变化。
    - 因此，不要在没有真实客户端差异时预先制造大量接口。更稳妥的做法是：先观察使用者，再在依赖边界明显过宽时拆分。
  - title: 3. ISP and Language：语言如何改变问题的表现
    source_heading: 3. ISP and Language：语言如何改变问题的表现
    paragraphs:
    - 如果不讨论这一点，读者很容易把 ISP 当成 Java 编译机制的局部补丁。作者因此先比较静态类型语言和动态类型语言，再把问题提升到架构层。
    - C++ 的头文件包含、Java 的类和接口引用、C# 的程序集引用，具体机制并不完全相同，但都能看到同一个现象：类型边界越宽，潜在编译影响面通常越大。
    - 作者据此认为，动态类型语言能够建立更灵活、耦合更松的系统。这句话应结合本节上下文理解：它重点讨论的是由静态声明引起的源码耦合。
    - 动态语言也可能引入大型软件包、绑定特定数据库、共享故障进程。这些架构依赖不会因为缺少静态接口声明而消失。
  - title: 4.7 选型时就检查依赖行李
    source_heading: 4.7 选型时就检查依赖行李
    paragraphs:
    - 许多架构负担不是编码时产生的，而是在选择框架、SDK 或平台时被带入系统。
    - 它是否绑定某个数据库、消息队列或云厂商？
    - 能否替换底层实现，还是只有名义上的抽象？
    - 一个功能强大的框架未必是坏选择。关键在于系统是否愿意承担它携带的全部约束。
  - title: 5.3 与其他 SOLID 原则的关系
    source_heading: 5.3 与其他 SOLID 原则的关系
    paragraphs:
    - 一个接口可能符合 ISP，却违反 LSP：接口很窄，但某个实现不遵守行为契约。
    - 一个接口也可能符合 DIP，却违反 ISP：客户端依赖的是抽象，但这个抽象包含大量无关方法。
  - title: 5.4 本章的完整思路
    source_heading: 5.4 本章的完整思路
    paragraphs:
    - 无关操作的变化因此可能引发不必要的重编译和重部署；
    - 动态类型语言没有同样的显式声明依赖，问题表现不同；
    - 但“依赖超出所需内容的模块有害”并不受语言限制；
    - 所以 ISP 最终是在控制依赖边界，而不只是控制接口方法数量。
  - title: 6. 把 ISP 用到实际设计中
    source_heading: 6. 把 ISP 用到实际设计中
    paragraphs:
    - 若所有客户端都依赖同一个“全能仓储接口”，详情页测试可能被迫处理删除、导出和运维操作。更合理的做法是围绕读取、下单、合规和运维角色建立接口。
    - 但也不要只按方法名称机械分组。下单用例需要查询和保存共同完成业务，应给它一个完整、内聚的角色契约。
    - 一个服务只需要对象存储上传功能，却直接依赖某云厂商的全量 SDK。该 SDK 还带来数据库、消息、监控和管理模块。
    - 某个内部批处理程序只有一个客户端，该客户端确实依次使用接口中的全部五个操作。程序与实现始终一起构建和发布，接口也很稳定。
  - title: 8. 实践检查与掌握练习
    source_heading: 8. 实践检查与掌握练习
    paragraphs:
    - Python 服务只调用某 SDK 的一个上传函数，但部署时必须安装整套 SDK，并加载大量插件。
    - 判断： 它可能没有原书所说的静态声明问题，却仍背负架构级行李。应检查是否有轻量子包，并用端口隔离业务代码与厂商 API。
    - 系统通过一个很窄的存储接口使用框架，框架内部仍与数据库运行在同一进程。数据库扩展故障后，系统整体退出。
    - 判断： 这是强烈信号。共同接口很可能描述了多个角色，应拆出实现真正支持且客户端真正需要的契约，同时再用 LSP 检查替换性。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 在静态类型语言中，客户端为了使用一个方法，可能仍需依赖包含全部方法的类型声明。
    - 动态语言仍有行为契约、软件包、部署和故障依赖，因此并不免疫 ISP 问题。
    - Adapter 能隔离第三方 API，但未必移除安装、版本、许可证和运行时风险。
    - 与 DIP 相比，ISP 关注客户端依赖多少；DIP 关注源码依赖指向哪里。
  takeaways:
  - ISP 的常见表述是：不应强迫客户端依赖它不使用的方法。
  - 接口应围绕客户端角色和稳定使用模式形成。
  - 动态语言仍有行为契约、软件包、部署和故障依赖，因此并不免疫 ISP 问题。
  - ISP 不反对复用和传递依赖，而是要求理解并控制附带成本。
  - 本章最终的记忆点是：只依赖完成工作真正需要的内容，不要背负无关行李。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 “ISP 就是接口要小”」？
  answer: 不准确。接口可以有很多方法，只要目标客户端确实需要它们。ISP 关注需要与依赖是否匹配，而不是规定方法上限。
  source_heading: 7.1 “ISP 就是接口要小”
- level: 概念辨析
  question: 原文如何解释「7.5 “动态类型语言不需要 ISP”」？
  answer: 错误。它们减少了某类显式源码声明依赖，但仍有运行时契约、软件包依赖、部署依赖和故障传播。
  source_heading: 7.5 “动态类型语言不需要 ISP”
- level: 概念辨析
  question: 原文如何解释「7.8 “客户端不同，就必须各建一个接口”」？
  answer: 错误。多个客户端使用同一组能力时，可以共享同一个角色接口。划分依据是使用模式，不是对象数量。
  source_heading: 7.8 “客户端不同，就必须各建一个接口”
- level: 概念辨析
  question: 原文如何解释「7.10 “任何传递依赖都违反 ISP”」？
  answer: 错误。复用必然带来依赖。应评估附带内容是否可接受、变化和故障是否被控制，而不是追求零依赖。
  source_heading: 7.10 “任何传递依赖都违反 ISP”
- level: 概念辨析
  question: 原文如何解释「7.13 “ISP 与 SRP 是同一原则”」？
  answer: 二者相关但不同。SRP 从变化来源判断模块对谁负责；ISP 从消费方判断客户端被迫依赖什么。一个模块可以只有一个变化来源，却仍向不同客户端暴露过多方法。
  source_heading: 7.13 “ISP 与 SRP 是同一原则”
