  sections:
  - title: 全章主线
    source_heading: 全章主线
    paragraphs:
    - 程序员写下一个指针时，通常把它当成“内存中的真实位置”。这是一种极其有用的幻象。真实机器上，程序产生的是虚拟地址，内存芯片只接受物理地址；处理器和操作系统在两者之间插入一个受控的转换层。
    - 堆、栈和映射文件可拥有宽松的虚拟增长空间，却只在实际使用时分配物理内存；
    - 这些目标彼此冲突：页越小，保护和共享越精细，但页表和 TLB 压力越大；层级越深，稀疏空间越省页表，却让一次未缓存转换需要更多访存；缓存转换越快，修改映射时的一致性协议越昂贵。
    - 乘法形式强调“物理页框起点 + 页内偏移”，位拼接形式强调页对齐使低 p 位必为 0。后文所有分页公式都建立在页大小为 2 的幂、页框按页大小对齐这一假设上。
  - title: 8.1 地址转换概念（Address Translation Concept）
    source_heading: 8.1 地址转换概念（Address Translation Concept）
    paragraphs:
    - "“异常”不一定表示程序有 bug。同一硬件结果可被内核解释为：真正非法访问、页面尚未装入、写时复制的首次写、栈需要增长，或调试器设置的数据断点。硬件只报告事实，软件决定语义。"
    - 同一 VA 可因进程不同映射到不同 PA；不同 VA 也可映射到同一 PA，形成别名或共享。地址转换因此不是一一对应函数，而是带执行上下文和权限的受控关系。
    - 受控介入。 把映射暂设为 invalid 或只读，内核就能在特定首次访问上获得控制权，而不影响其他地址。这是按需分配、写时复制和断点的共同模式。
    - 现代链接仍使用符号与重定位。动态链接库还通过入口表、GOT/PLT 等间接结构在运行时解析地址。区别在于：链接/装载重定位主要解决代码组织，硬件地址转换则持续参与每一次取指和数据访问。
  - title: 8.2 走向灵活的地址转换（Towards Flexible Address Translation）
    source_heading: 8.2 走向灵活的地址转换（Towards Flexible Address Translation）
    paragraphs:
    - 版本边界。 x86 历史上支持丰富分段；现代主流 x86-64 用户空间通常采用近似“平坦地址空间”，主要依靠分页保护，分段功能大幅弱化。这里学习分段，是为了理解抽象和组合设计，不应据此推断现代系统仍按每个逻辑对象大量使用硬件段。
    - 两者都形成树。分页分段的顶层条目带有明确逻辑对象语义和可变界限；纯多级分页的顶层通常只按地址位均匀划分。前者便于按代码/堆/栈管理，后者结构规则、硬件遍历简单。内核即使运行在纯分页硬件上，也常在软件中保留“内存对象/区域”这一逻辑分段视图。
    - 术语边界。 x86 有 GDT 和 LDT；GDT 通常是系统范围的描述符表，LDT 可提供进程特有描述符。不同操作系统的使用方式不同。理解重点是“段选择子
      → 描述符 → 线性地址 → 多级页表 → 物理地址”，不应把某个历史实现的 GDT/LDT 组织当作永恒规定。
    - 两套结构会增加内存、更新同步和调试复杂度。每次映射变化要维护软件对象、硬件表、core map 和 TLB 一致性。软件加载 TLB 的架构可只维护一套便携结构，却把
      TLB miss 变成内核 trap；硬件 page walk 更快，却要求内核生成处理器规定的表。没有零代价方案，选择取决于 miss 频率、硬件复杂度和可移植目标。
  - title: 8.3 走向高效的地址转换（Towards Efficient Address Translation）
    source_heading: 8.3 走向高效的地址转换（Towards Efficient Address Translation）
    paragraphs:
    - 一条 4 KiB 页内可容纳上千条短指令或许多数据元素。顺序执行、循环和连续数组访问会对同一 VPN 连续产生大量引用。TLB 缓存的是整页转换，不是单字节地址；一次
      miss 的 page walk 成本可由后续数百次 hit 摊销。
    - 增加权限，如 invalid→read 或 read→read/write：旧 TLB 只会更严格。访问新权限时可能多触发一次异常/miss，内核重新填充即可；不会让不允许的操作成功。因此可延迟失效（具体架构和并发协议仍可能要求同步）。
    - 现代常见折中是 VIPT（virtually indexed, physically tagged）：页内低位在 VA 与 PA 中相同，可立即索引 cache
      set；TLB 同时产生物理 tag，返回时比较物理 tag 并检查权限。这兼得低延迟与物理一致性。
    - 物理 cache 有双重收益：普通数据访问比 DRAM 快；TLB miss 时，页表本身也在物理内存中，page walker 读取的各级 PTE 很可能命中
      cache，因此“四级页表”不等于每次 miss 都真的访问 DRAM 四次。
  - title: 8.4 软件保护（Software Protection）
    source_heading: 8.4 软件保护（Software Protection）
    paragraphs:
    - 硬件地址转换几乎无处不在，但它通常只在进程/虚拟机等较粗边界上工作。浏览器进程内部要运行网页脚本，内核内部可能运行包过滤器或可扩展模块，数据库和编辑器要加载插件；若每个小扩展都新建进程，IPC、状态共享和切换成本可能太高。
    - 如果系统只执行一种经过精心设计的安全语言，语言本身可禁止表达危险行为：没有任意整数转指针、数组访问检查边界、控制流只能到合法函数/基本块、对象引用不能伪造。若编译器、解释器和运行时正确，不可信程序就无法产生越界地址。
    - 直接重写每种 ISA 的机器码困难：x86、ARM 的指令编码、寄存器和异常语义都不同。另一条路线是让各语言编译器输出统一中间表示（IR/bytecode），运行时验证
      IR，再为当前机器 JIT/AOT 生成受保护代码。
    - Java bytecode/JVM 是典型思路：加载时验证栈类型、分支目标和对象访问，再解释或 JIT。多个源语言可编译到同一 bytecode，因此它可成为语言无关沙箱；但
      IR 的语义若为 Java 对象模型设计，表达 C/Fortran 的裸内存布局和指针算术会不自然或低效。
  - title: 8.5 总结与未来方向
    source_heading: 8.5 总结与未来方向
    paragraphs:
    - 地址转换把程序的地址世界与物理内存解耦。最初目的是隔离内核和进程，后来同一机制支撑共享库、IPC、按需装入、COW、映射文件、虚拟内存、零拷贝、检查点和虚拟机。
    - 没有一项机制单独满足全部目标。现代系统通常是两层结构：灵活但较慢的多级转换作为真相/后备，快速 TLB 处理常见路径；软件语义结构再位于硬件页表之上，解释每个异常为何发生。
    - 更多处理器使 TLB shootdown 成本上升，批处理、硬件一致性或软件边界更有吸引力；
    - 最重要的方法论是：先定义允许的访问关系，再选表示；先建立正确的慢路径，再用缓存/证明创造快路径；每引入一个缓存或提示，都必须回答它何时失效、失效前谁还能看到旧权限。
  - title: 用 C++ 验证关键机制
    source_heading: 用 C++ 验证关键机制
    paragraphs:
    - 下面程序使用 C++17。当前环境没有 C/C++ 编译器，因此未做本地编译；公式和输出已用独立计算复核。示例只模拟地址元数据，不读取真实物理内存。
    - 采用练习 12 的格式：32 位 VA = 4 位段号 + 12 位页号 + 16 位偏移。
  - title: 章末练习详解
    source_heading: 章末练习详解
    paragraphs:
    - 逻辑上要切的是“地址空间身份 + 根指针”，而不是把物理页框内容换掉。实际 x86 上段表、CR3 页表根和 PCID 的组织比书中抽象更具体，答案应以目标架构为准。
    - 架构精确性说明。 真实 IA-32 中段描述符产生线性地址，CR3 是独立页目录根；描述符本身通常不直接“指向该段专属页表”。上图将本书“多级分页分段”的逻辑与真实寄存器关系结合表达。现代
      OS 常采用平坦段，让主要隔离由分页完成。
    - 每张表 512 项、PTE 8 bytes，仍恰好 4 KiB。段机制在 64 位长模式下大幅弱化，常用近似平坦段；FS/GS base 等仍有用途。处理器代际可支持五级分页和更多
      VA 位，四级图是本书所讨论配置。
    - 这个答案只优化题目给出的“尾页浪费 + PTE 空间”。真实页大小还受 TLB reach、page fault I/O、COW 放大、缓存、页表层级和物理连续性影响，所以现代普通页并不因此都应设为
      128 KiB。
  - title: 全章方法论总结
    source_heading: 全章方法论总结
    paragraphs:
    - 六、将硬件视图与软件语义解耦。 PTE 的 invalid/read-only 不足以说明意图，内存对象和软件映射才知道它是非法、未装入、COW 还是断点。可移植层让硬件表成为可重建提示。
    - 七、用同一思想比较硬件和软件保护。 页表在每次访存前检查；SFI 把检查插入机器码；安全语言/IR 则限制可表达程序并在加载时验证。它们都在维护“数据地址和控制流只能落在授权集合”的不变量。
    - 八、始终明确优化的交换条件。 大页以粒度换 reach，软件 TLB 以 miss trap 换页表自由，虚拟 cache 以别名复杂度换低延迟，SFI
      以代码膨胀/验证换进程内隔离。
    - 阅读后续内存章节时，可以继续追问：谁拥有真相？谁只是缓存？怎样制造异常获得控制？旧映射何时才真正无人使用？这四个问题会反复出现在 demand paging、映射文件、零拷贝、虚拟机和检查点中。
  - title: 复习检查清单
    source_heading: 复习检查清单
    paragraphs:
    - 能区分虚拟地址、物理地址、VPN、PFN 和 offset。
    - 能解释段共享、段级 COW、zero-on-reference 和外部碎片。
    - 能画出多核 TLB shootdown 的更新、IPI、ACK 顺序。
    - 能解释 homonym、synonym/alias 和 VIPT 容量约束。
