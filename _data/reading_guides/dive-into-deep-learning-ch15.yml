overview:
  kind: summary
  minutes: 8
  question: 1. 本章主线：文本表示为什么需要预训练？
  question_source: 1. 本章主线：文本表示为什么需要预训练
  thesis: 本章的主线可以压缩为一句话：文本预训练通过“预测被上下文约束的缺失信息”把海量无标签语料变成监督。word2vec 用局部窗口学习静态词向量，负采样和层次
    softmax解决大词表成本，GloVe 把目标改写为全局共现回归，fastText/BPE 将词拆成可共享子词；BERT 再把表示从词表中的固定一行升级为双向
    Transformer 对整段语境的动态计算。真正可靠的实现必须同时保证采样目标、tokenizer、mask、loss 归一化和张量 shape 的语义一致。
  thesis_source: 17. 核心结论与解决 NLP 预训练问题的一般思路
  concepts:
  - term: 1. 本章主线：文本表示为什么需要预训练
    meaning: 双向 encoder 不能直接使用左到右语言模型目标，于是 BERT 使用 MLM，并以 NSP 补充句间关系。
    source_heading: 1. 本章主线：文本表示为什么需要预训练
  - term: 4. 词嵌入预训练数据集
    meaning: 原实现只在 Dataset 构造时采样一次，后续 epoch 重复同一窗口。更丰富的训练可在每 epoch 或每 batch 动态重采样。
    source_heading: 4. 词嵌入预训练数据集
  - term: 7.1 为什么词内部结构重要
    meaning: 形态丰富语言中，同一词根可有大量屈折形式，词级参数数据效率低，稀有词和 OOV 尤其困难。
    source_heading: 7.1 为什么词内部结构重要
  - term: 7.6 原书 BPE 实现的边界
    meaning: 虽然名称是 Byte Pair Encoding，示例实际对 Python 字符串字符操作，不是 UTF-8 bytes。
    source_heading: 7.6 原书 BPE 实现的边界
  - term: 10. BERT 预训练数据集
    meaning: 原始 BERT 使用 BookCorpus（约 8 亿词）和 English Wikipedia（约 25 亿词），普通教学环境难以复现。原书使用较小
      WikiText-2 演示完整管线，也说明领域模型可在医学等自定义语料预训练。
    source_heading: 10. BERT 预训练数据集
  - term: 17. 核心结论与解决 NLP 预训练问题的一般思路
    meaning: 本章的主线可以压缩为一句话：文本预训练通过“预测被上下文约束的缺失信息”把海量无标签语料变成监督。word2vec 用局部窗口学习静态词向量，负采样和层次
      softmax解决大词表成本，GloVe 把目标改写为全局共现回归，fastText/BPE 将词拆成可共享子词；BERT 再把表示从词表中的固定一行升级为双向
      Transformer 对整段语境的动态计算。真正可靠的实现必须同时保证采样目标、tokenizer、mask、loss 归一化和张量 shape 的语义一致。
    source_heading: 17. 核心结论与解决 NLP 预训练问题的一般思路
  logic:
  - 1. 本章主线：文本表示为什么需要预训练
  - 4. 词嵌入预训练数据集
