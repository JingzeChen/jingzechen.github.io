  sections:
  - title: 1. 本章主线：文本表示为什么需要预训练
    source_heading: 1. 本章主线：文本表示为什么需要预训练
    paragraphs:
    - 从离散符号到静态分布式表示：word2vec、GloVe 和 fastText 为每个词或子词学习一个稠密向量；
    - 原始语料中高频功能词过多、窗口变长且负例不均匀，于是设计二次采样、动态窗口和自定义 batch；
    - 静态词向量无法处理一词多义，于是用 Transformer encoder 让表示依赖双向上下文；
    - 双向 encoder 不能直接使用左到右语言模型目标，于是 BERT 使用 MLM，并以 NSP 补充句间关系。
  - title: 3.1 完整 softmax 的瓶颈
    source_heading: 3.1 完整 softmax 的瓶颈
    paragraphs:
    - Negative sampling：把多分类改成若干二分类；
    - Hierarchical softmax：把词概率分解成树路径决策。
  - title: 4. 词嵌入预训练数据集
    source_heading: 4. 词嵌入预训练数据集
    paragraphs:
    - 原书使用 Penn Treebank 的 Wall Street Journal 文本，训练文件每行按空格分词。
    - 二次采样还改变训练目标，而不只是加速：它重新加权中心和上下文共现，使罕见、信息量更高的关系占比上升。
    - 原书参考运行得到约 1,503,420 个正中心—上下文对，具体数量受二次采样和随机窗口影响。
    - 原实现只在 Dataset 构造时采样一次，后续 epoch 重复同一窗口。更丰富的训练可在每 epoch 或每 batch 动态重采样。
  - title: 5.5 余弦最近邻
    source_heading: 5.5 余弦最近邻
    paragraphs:
    - 对全部 embedding rows 归一化；
    - 排除 query 自身及特殊 token。
  - title: 7.1 为什么词内部结构重要
    source_heading: 7.1 为什么词内部结构重要
    paragraphs:
    - 形态丰富语言中，同一词根可有大量屈折形式，词级参数数据效率低，稀有词和 OOV 尤其困难。
    - fastText：以字符 n-gram 组合词向量；
    - BPE：从语料学习可变长度子词词表。
  - title: 7.6 原书 BPE 实现的边界
    source_heading: 7.6 原书 BPE 实现的边界
    paragraphs:
    - 虽然名称是 Byte Pair Encoding，示例实际对 Python 字符串字符操作，不是 UTF-8 bytes。
    - SentencePiece BPE；
    - SentencePiece Unigram。
    - 还需明确 Unicode normalization、大小写、空格表示和特殊 token。
  - title: 8. 词相似度与类比
    source_heading: 8. 词相似度与类比
    paragraphs:
    - GloVe 6B：50d、100d；
    - fastText English wiki：300d。
    - 所以 distributional similarity 不等同于同义关系。
    - product quantization；
  - title: 10. BERT 预训练数据集
    source_heading: 10. BERT 预训练数据集
    paragraphs:
    - 原始 BERT 使用 BookCorpus（约 8 亿词）和 English Wikipedia（约 25 亿词），普通教学环境难以复现。原书使用较小
      WikiText-2 演示完整管线，也说明领域模型可在医学等自定义语料预训练。
    - 真实管线可用 spaCy、Stanza 或 NLTK sentence tokenizer。不同 tokenizer 会改变 NSP 样本和词表。
    - MLM loss weights：防 padding prediction slots 计 loss。
    - 原始 BERT 使用约 30000 WordPiece。词级教学版 OOV 更多、序列较短，不能视为原始 BERT tokenizer 复现。
  - title: 13. 可运行的综合 PyTorch 实验
    source_heading: 13. 可运行的综合 PyTorch 实验
    paragraphs:
    - Skip-gram 完整 softmax 的 autograd 梯度等于“模型期望 context − 真实 context”；
    - Negative sampling 中正例拉近、负例推远的手工梯度与 autograd 一致；
    - Batch 中正例、负例和 padding 由 label/mask 联合区分；
    - 改变 mask=0 的 padding label 不改变正确 MLM loss；
  - title: 17. 核心结论与解决 NLP 预训练问题的一般思路
    source_heading: 17. 核心结论与解决 NLP 预训练问题的一般思路
    paragraphs:
    - 原书 PyTorch BERT loss 先标量 CE 后乘 mask，实际没有屏蔽 padding；正确实现必须使用逐位置 CE 与一维 weights。
    - 逐轴写 batch shape：center、context/negative、mask、label；BERT 的 token、segment、valid
      length、MLM positions/weights。
    - 保存完整文本接口：tokenizer、词表、special IDs、max length、normalization 和 checkpoint 必须一致。
    - 本章的主线可以压缩为一句话：文本预训练通过“预测被上下文约束的缺失信息”把海量无标签语料变成监督。word2vec 用局部窗口学习静态词向量，负采样和层次
      softmax解决大词表成本，GloVe 把目标改写为全局共现回归，fastText/BPE 将词拆成可共享子词；BERT 再把表示从词表中的固定一行升级为双向
      Transformer 对整段语境的动态计算。真正可靠的实现必须同时保证采样目标、tokenizer、mask、loss 归一化和张量 shape 的语义一致。
  takeaways:
  - One-hot 只表达 token 身份，无法编码相似性；embedding 是可学习查表，语义来自预测目标。
  - BERT 以 token、segment、learned position 之和输入双向 Transformer encoder，输出随整段语境变化。
  - 先定义表示粒度：word、character n-gram、subword 还是 contextual token？
  - 正确归一化：按有效 pair/token 数，不按 padded 矩形大小；分布式还需统一全局计数。
  - 本章的主线可以压缩为一句话：文本预训练通过“预测被上下文约束的缺失信息”把海量无标签语料变成监督。word2vec 用局部窗口学习静态词向量，负采样和层次
    softmax解决大词表成本，GloVe 把目标改写为全局共现回归，fastText/BPE 将词拆成可共享子词；BERT 再把表示从词表中的固定一行升级为双向
    Transformer 对整段语境的动态计算。真正可靠的实现必须同时保证采样目标、tokenizer、mask、loss 归一化和张量 shape 的语义一致。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「14.1 One-hot 没有参数，所以比 embedding 更“真实”」？
  answer: One-hot 只编码身份；embedding 是从训练目标学习的统计表示，没有谁天然更真实。
  source_heading: 14.1 One-hot 没有参数，所以比 embedding 更“真实”
- level: 概念辨析
  question: 原文如何解释「14.17 word2vec 吞吐打印就是准确 tokens/sec」？
  answer: 原代码数的是样本且 timer/metric 跨 epoch 口径不一致。
  source_heading: 14.17 word2vec 吞吐打印就是准确 tokens/sec
- level: 概念辨析
  question: 原文如何解释「14.28 BERT 为每个词学习一个上下文化词表向量」？
  answer: 词表 embedding 是静态输入参数；上下文化向量是整段经过 encoder 后的动态输出。
  source_heading: 14.28 BERT 为每个词学习一个上下文化词表向量
- level: 概念辨析
  question: 原文如何解释「14.31 BERT 的所有 Transformer blocks 共享参数」？
  answer: 标准 BERT 各 block 独立；ALBERT 等变体才显式跨层共享。
  source_heading: 14.31 BERT 的所有 Transformer blocks 共享参数
- level: 概念辨析
  question: 原文如何解释「14.39 CrossEntropyLoss 默认 scalar 后再乘 mask 可以屏蔽 padding」？
  answer: Mask 已经太晚；必须先取得逐位置 loss，再乘一维 weights。
  source_heading: 14.39 CrossEntropyLoss 默认 scalar 后再乘 mask 可以屏蔽 padding
