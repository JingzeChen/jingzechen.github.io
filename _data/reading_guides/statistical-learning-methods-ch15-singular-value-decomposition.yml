  - 0. 本章解决什么问题
  - 15.1 奇异值分解的定义与性质
  - 15.3 奇异值分解与矩阵近似
  - 15.5 【补充】深入理解
  - 15.6 本章概要与必须掌握的结论
  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 奇异值分解（singular value decomposition，SVD）是一种矩阵因子分解方法，是线性代数的概念，但在统计学习中被广泛使用，成为其重要工具。本书介绍的主成分分析、潜在语义分析都用到奇异值分解。
    - 本章是纯粹的数学工具章——它本身不是一个学习算法，而是为第 16 章（主成分分析）、第 17 章（潜在语义分析）打地基。
    - 第 13 章说过，”要求 A 列正交、最小化重构误差”就得到 PCA/SVD。本章要做的，就是把这句话完全说清楚：这样的分解存在吗？怎么算？为什么它是最优的？
    - 奇异值分解可以看作是矩阵数据压缩的一种方法，即用因子分解的方式近似地表示原始矩阵，这种近似是在平方损失意义下的最优近似。
  - title: 15.1 奇异值分解的定义与性质
    source_heading: 15.1 奇异值分解的定义与性质
    paragraphs:
    - 若不要求降序，分解就更不唯一（可以任意置换）。降序保证了”前 k 个奇异值最大”，这是 15.3 节截断 SVD 最优性的前提。
    - 在实际应用中，常常需要对矩阵的数据进行压缩，将其近似表示，奇异值分解提供了一种方法。后面将要叙述，奇异值分解是在平方损失（弗罗贝尼乌斯范数）意义下对矩阵的最优近似。紧奇异值分解对应着无损压缩，截断奇异值分解对应着有损压缩。
    - 综上，矩阵的奇异值分解也可以看作是将其对应的线性变换分解为旋转变换、缩放变换及旋转变换的组合。根据定理 15.1，这个变换的组合一定存在。
    - 这是 SVD 一个极其实用的性质：判断秩最可靠的方法就是数正奇异值。（用高斯消元判断秩在浮点运算下很不稳定，而奇异值给出了”离奇异有多远”的定量刻画。）
  - title: 15.3 奇异值分解与矩阵近似
    source_heading: 15.3 奇异值分解与矩阵近似
    paragraphs:
    - 答案是：保留最大的 k 个奇异值，丢掉其余的。 更令人惊讶的是，这不是一个经验规则，而是一个严格的全局最优定理。
    - 奇异值分解也是一种矩阵近似的方法，这个近似是在弗罗贝尼乌斯范数（Frobenius norm）意义下的近似。矩阵的弗罗贝尼乌斯范数是向量的 L_2 范数的直接推广，对应着机器学习中的平方损失函数。
    - 正是对每个矩阵元素的平方误差求和。所以定理 15.3 说的“弗罗贝尼乌斯范数下最优”，翻译成机器学习语言就是“均方误差最小”。
    - 它解决什么问题：保证“最好的秩 k 近似”不是一个只有下确界、但没有任何矩阵真正达到的空目标——最优解确实存在。
  - title: 15.5 【补充】深入理解
    source_heading: 15.5 【补充】深入理解
    paragraphs:
    - "“紧 SVD 是近似。” 错。紧 SVD 与 A 等秩，关系是精确等号；截断 SVD 才是有损近似。"
    - "“奇异向量唯一。” 错。可同时变号；重复奇异值子空间内可旋转；零奇异值对应的零空间基可任选。奇异值本身唯一。"
    - "“截断 SVD 对任何损失都最优。” 错。定理 15.3 针对弗罗贝尼乌斯范数；它也对谱范数最优，但对 L_1、缺失值加权误差等一般不成立。"
    - "“保留 99% 能量就一定保留 99% 任务信息。” 错。能量是无监督的平方误差指标，低能量方向仍可能含有对分类极重要的信号。"
  - title: 15.6 本章概要与必须掌握的结论
    source_heading: 15.6 本章概要与必须掌握的结论
    paragraphs:
    - SVD 一定存在但不唯一；奇异值唯一，奇异向量有符号、重复子空间与零空间基的自由度。
    - 正交变换不改变弗罗贝尼乌斯范数。
    - SVD 是第 16 章 PCA 与第 17 章 LSA 的核心计算工具。
  takeaways:
  - 奇异值分解可以看作是矩阵数据压缩的一种方法，即用因子分解的方式近似地表示原始矩阵，这种近似是在平方损失意义下的最优近似。
  - 这是 SVD 一个极其实用的性质：判断秩最可靠的方法就是数正奇异值。（用高斯消元判断秩在浮点运算下很不稳定，而奇异值给出了”离奇异有多远”的定量刻画。）
  - 它解决什么问题：保证“最好的秩 k 近似”不是一个只有下确界、但没有任何矩阵真正达到的空目标——最优解确实存在。
  - "“保留 99% 能量就一定保留 99% 任务信息。” 错。能量是无监督的平方误差指标，低能量方向仍可能含有对分类极重要的信号。"
  - SVD 是第 16 章 PCA 与第 17 章 LSA 的核心计算工具。
