  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 在实际应用中，常常需要对矩阵的数据进行压缩，将其近似表示，奇异值分解提供了一种方法。后面将要叙述，奇异值分解是在平方损失（弗罗贝尼乌斯范数）意义下对矩阵的最优近似。紧奇异值分解对应着无损压缩，截断奇异值分解对应着有损压缩。
  thesis_source: 15.1 奇异值分解的定义与性质
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 奇异值分解（singular value decomposition，SVD）是一种矩阵因子分解方法，是线性代数的概念，但在统计学习中被广泛使用，成为其重要工具。本书介绍的主成分分析、潜在语义分析都用到奇异值分解。
    source_heading: 0. 本章解决什么问题
  - term: 15.1 奇异值分解的定义与性质
    meaning: 在实际应用中，常常需要对矩阵的数据进行压缩，将其近似表示，奇异值分解提供了一种方法。后面将要叙述，奇异值分解是在平方损失（弗罗贝尼乌斯范数）意义下对矩阵的最优近似。紧奇异值分解对应着无损压缩，截断奇异值分解对应着有损压缩。
    source_heading: 15.1 奇异值分解的定义与性质
  - term: 15.3 奇异值分解与矩阵近似
    meaning: 奇异值分解也是一种矩阵近似的方法，这个近似是在弗罗贝尼乌斯范数（Frobenius norm）意义下的近似。矩阵的弗罗贝尼乌斯范数是向量的
      L_2 范数的直接推广，对应着机器学习中的平方损失函数。
    source_heading: 15.3 奇异值分解与矩阵近似
  - term: 15.5 【补充】深入理解
    meaning: "“截断 SVD 对任何损失都最优。” 错。定理 15.3 针对弗罗贝尼乌斯范数；它也对谱范数最优，但对 L_1、缺失值加权误差等一般不成立。"
    source_heading: 15.5 【补充】深入理解
  - term: 15.6 本章概要与必须掌握的结论
    meaning: SVD 一定存在但不唯一；奇异值唯一，奇异向量有符号、重复子空间与零空间基的自由度。
    source_heading: 15.6 本章概要与必须掌握的结论
