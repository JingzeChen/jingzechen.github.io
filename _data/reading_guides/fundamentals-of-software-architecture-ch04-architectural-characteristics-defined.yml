overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: "“非功能需求”容易降低注意力，“质量属性”容易暗示事后检查，作者因此偏好“架构特征”。"
  thesis_source: 9. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：架构特征不是所有“好品质”的愿望清单，而是那些不直接描述领域行为、会改变系统结构、并且对当前系统成功至关重要的少数能力；架构师必须让它们含义明确、可以验证，并在相互冲突时作出可迭代的最不坏选择。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. The Longevity of the Term “Non-Functional Requirements”：为何“非功能需求”长期存在
    meaning: 在作者另一本《Head First Software Architecture》中，architecture characteristics
      被称为 system capabilities；相对地，domain 表示 system behavior。
    source_heading: 2. The Longevity of the Term “Non-Functional Requirements”：为何“非功能需求”长期存在
  - term: 5. Trade-Offs and Least Worst Architecture：权衡与最不坏架构
    meaning: 作者最后把 Agile 的重要经验应用到架构：尽可能设计可迭代的架构。架构越容易改变，团队越不必为第一次发现“精确正确答案”承受过大压力。
    source_heading: 5. Trade-Offs and Least Worst Architecture：权衡与最不坏架构
  - term: 6.4 “所有项目都需要安全，所以 security 总是首要架构特征”
    meaning: 错误之处：所有项目需要安全基线，但只有特殊安全目标显著影响结构时，才成为该项目的架构驱动因素。
    source_heading: 6.4 “所有项目都需要安全，所以 security 总是首要架构特征”
  - term: 8. 本章知识结构
    meaning: 决策层：选择最少关键特征，分析相互作用，形成可迭代的最不坏架构。
    source_heading: 8. 本章知识结构
  - term: 10. 主动回忆与应用题
    meaning: 从 ISO Security 子特征中选择 confidentiality、integrity、accountability，分别说明为什么“已加密”不能证明另外两项成立。
    source_heading: 10. 主动回忆与应用题
  logic:
  - 0. 本章要回答的核心问题
  - 2. The Longevity of the Term “Non-Functional Requirements”：为何“非功能需求”长期存在
  - 4. Architectural Characteristics (Partially) Listed：架构特征的不完整清单
  - 6.4 “所有项目都需要安全，所以 security 总是首要架构特征”
  - 6.9 “Availability 高就表示 Reliability 高”
  - 9. 核心结论
  - 10. 主动回忆与应用题
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - problem domain、domain requirement 与 architectural characteristic 分别描述什么？
    - explicit 与 implicit architectural characteristics 有什么区别？
    - availability、reliability、continuity、recoverability 和 robustness 怎样区分？
    - 一句话概括：架构特征不是所有“好品质”的愿望清单，而是那些不直接描述领域行为、会改变系统结构、并且对当前系统成功至关重要的少数能力；架构师必须让它们含义明确、可以验证，并在相互冲突时作出可迭代的最不坏选择。
  - title: 1. 开篇：架构特征在结构设计中的位置
    source_heading: 1. 开篇：架构特征在结构设计中的位置
    paragraphs:
    - architectural characteristics analysis：分析系统为了成功必须具备哪些跨功能能力，本章及第 5 至第 7 章继续展开；
    - 只做组件设计，会知道系统“由谁做什么”，却不知道这些组件需要怎样部署、隔离、通信和恢复；只做特征分析，会知道系统要“多快、多稳、多安全”，却没有承载业务行为的责任边界。
    - 第 1 章已经把架构特征概括为系统成功所需的能力。本章进一步强调：它们不直接属于问题域行为，却会决定系统能否以业务需要的方式提供这些行为。
    - 例如，“提交订单”是领域行为；“促销高峰仍能在目标延迟内提交”“一个节点故障时核心下单仍可用”“订单数据只对授权方可见”则分别涉及性能、可扩展性、可用性和安全性。
  - title: 2. The Longevity of the Term “Non-Functional Requirements”：为何“非功能需求”长期存在
    source_heading: 2. The Longevity of the Term “Non-Functional Requirements”：为何“非功能需求”长期存在
    paragraphs:
    - 组织使用过多种名称描述架构特征，其中最常见的是 non-functional requirements（非功能需求）和 quality attributes（质量属性）。作者都不满意。
    - 在作者另一本《Head First Software Architecture》中，architecture characteristics 被称为 system
      capabilities；相对地，domain 表示 system behavior。
    - "“非功能需求”在 20 世纪 70 年代末开始进入软件工程文献，与 function point analysis（功能点分析）大致同期。"
    - 但这一时期留下了一个重要洞见：构建系统的大量工作并不直接来自功能列表，而来自系统能力。人们把相关工作称为 non-function points，进一步促成
      non-functional requirements 的流行。
  - title: 4. Architectural Characteristics (Partially) Listed：架构特征的不完整清单
    source_heading: 4. Architectural Characteristics (Partially) Listed：架构特征的不完整清单
    paragraphs:
    - 运行型特征描述系统在生产运行时必须表现出的能力，常与 operations 和 DevOps 高度重叠。原书列出 availability、continuity、performance、recoverability、reliability/safety、robustness
      和 scalability。
    - 架构师对代码结构负有全部或共享责任，包括模块化、可读性、组件耦合控制和其他内部质量。原书列出 configurability、extensibility、installability、leverageability/reuse、localization、maintainability、portability
      和 upgradeability。
    - 第一版出版时云计算已存在，但没有如今普遍。现在多数系统至少部分与云交互，架构词汇随生态变化而扩展。原书列出 on-demand scalability、on-demand
      elasticity、zone-based availability 和 region-based privacy and security。
    - 一些特征无法自然归入单一类别，却形成重要设计约束。原书列出 accessibility、archivability、authentication、authorization、legal、privacy、security、supportability、usability/achievability。
  - title: 5. Trade-Offs and Least Worst Architecture：权衡与最不坏架构
    source_heading: 5. Trade-Offs and Least Worst Architecture：权衡与最不坏架构
    paragraphs:
    - 例如高可用需要冗余和故障切换，可审计需要记录与保护事件，可移植需要抽象平台差异。这些能力还会持续产生运行成本。
    - 这些操作可能提高 CPU、I/O 和请求路径长度，降低性能。但不能由此得出“安全和性能只能二选一”：硬件加速、会话复用、缓存验证结果、合理边界都能缓解代价。真正结论是收益不免费，必须测量。
    - 这种架构看似未来证明，实际因体量和复杂度难以工作。架构应为已知关键变化留空间，而不是预先实现所有想象中的未来。
    - 作者最后把 Agile 的重要经验应用到架构：尽可能设计可迭代的架构。架构越容易改变，团队越不必为第一次发现“精确正确答案”承受过大压力。
  - title: 6.4 “所有项目都需要安全，所以 security 总是首要架构特征”
    source_heading: 6.4 “所有项目都需要安全，所以 security 总是首要架构特征”
    paragraphs:
    - 错误之处：所有项目需要安全基线，但只有特殊安全目标显著影响结构时，才成为该项目的架构驱动因素。
    - 正确理解：同时检查结构影响和成功关键性，并把“安全”拆为具体威胁与控制。
  - title: 6.9 “Availability 高就表示 Reliability 高”
    source_heading: 6.9 “Availability 高就表示 Reliability 高”
    paragraphs:
    - 错误之处：系统可以始终响应，却返回错误或丢失数据；IP 能传包但不保证可靠交付。
    - 正确理解：availability 关注可访问，reliability 关注规定条件下持续正确工作。
  - title: 8. 本章知识结构
    source_heading: 8. 本章知识结构
    paragraphs:
    - 定义层：架构特征必须同时非领域、影响结构、决定成功；
    - 词汇层：运行、结构、云、横切及 ISO 分类帮助发现候选；
    - 语义层：任何术语都必须在组织内用场景和度量消除歧义；
    - 决策层：选择最少关键特征，分析相互作用，形成可迭代的最不坏架构。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - Availability 关注能否访问，reliability 关注是否持续正确工作；IP 提供了可用但不可靠的经典例子。
    - Scalability 关注负载增长，elasticity 关注资源动态匹配，extensibility 关注功能演化。
    - Interoperability、compatibility、learnability 等词没有脱离上下文的唯一含义。
    - 作者排除 functional suitability，是因为它描述问题域功能动机，而不是因为功能正确性不重要。
  - title: 10. 主动回忆与应用题
    source_heading: 10. 主动回忆与应用题
    paragraphs:
    - 用一个具体系统说明 explicit characteristic 与 implicit characteristic，并解释怎样把隐含期待转成可验证场景。
    - 为 availability、reliability、continuity、recoverability 和 robustness 各写一句不互相循环引用的本地定义。
    - 从 ISO Security 子特征中选择 confidentiality、integrity、accountability，分别说明为什么“已加密”不能证明另外两项成立。
    - 用“在条件 X 下选择 A、接受代价 Y、由措施 Z 缓解、条件 R 触发复查”的格式写一条 least-worst architecture 建议。
  takeaways:
  - 定义层：架构特征必须同时非领域、影响结构、决定成功；
  - "“非功能需求”容易降低注意力，“质量属性”容易暗示事后检查，作者因此偏好“架构特征”。"
  - 分类不是互斥标准；privacy、security、accessibility 等可以同时位于多个观察类别。
  - ISO 模型提供了有价值的能力与子特征分类，但仍不完整，也不是每个项目的必选清单。
  - 架构越易于度量和迭代，第一次选择就必须完全正确的压力越小，但可变性本身也不能无限抽象。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.4 “所有项目都需要安全，所以 security 总是首要架构特征”」？
  answer: 错误之处：所有项目需要安全基线，但只有特殊安全目标显著影响结构时，才成为该项目的架构驱动因素。
  source_heading: 6.4 “所有项目都需要安全，所以 security 总是首要架构特征”
- level: 概念辨析
  question: 原文如何解释「6.8 “四类架构特征互相排斥”」？
  answer: 错误之处：地域隐私同时属于云、法律、安全和数据；accessibility 也可归入 usability。
  source_heading: 6.8 “四类架构特征互相排斥”
- level: 概念辨析
  question: 原文如何解释「6.10 “Continuity 与 Recoverability 完全相同”」？
  answer: 错误之处：两者重叠，但 continuity 更宽地关注灾难下业务持续，recoverability 更聚焦恢复时间、数据和状态。
  source_heading: 6.10 “Continuity 与 Recoverability 完全相同”
- level: 概念辨析
  question: 原文如何解释「6.11 “Scalability、Elasticity、Extensibility 都是可扩展性”」？
  answer: 正确理解：scalability 处理负载增长，elasticity 处理资源动态匹配，extensibility 处理功能演化。
  source_heading: 6.11 “Scalability、Elasticity、Extensibility 都是可扩展性”
- level: 概念辨析
  question: 原文如何解释「6.18 “Functional suitability 不重要，所以被排除”」？
  answer: 错误之处：作者排除它是因为它属于构建软件的功能动机和问题域，而不是因为功能正确性不重要。
  source_heading: 6.18 “Functional suitability 不重要，所以被排除”
