  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 如果把 Browser 换成 Desktop、CLI、Mobile 或 Test Harness，这条业务规则是否仍成立？
  thesis_source: 7. The Upshot：核心结论
