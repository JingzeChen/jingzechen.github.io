  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Company Q 与 Company A 的案例说明，市场可以突然要求全面改变 Look and Feel；
    - Web 可被视为 IO Device，应延续 1960 年代以来的 Device Independence；
    - 不能也不必抽象 Browser 与 Application 之间所有细碎、Chatty 的交互；
    - 因此，本笔记不会人为补造公式。重点放在论证过程、边界方法、现代 Web 场景中的具体落地，以及这种方法的适用范围与局限。
  - title: 2.9 技术名词变化，问题没有消失
    source_heading: 2.9 技术名词变化，问题没有消失
    paragraphs:
    - Server-Side Rendering 与 Client-Side Rendering；
    - Single-Page Application 与 Multi-Page Application；
    - Edge Computing 与 Central Cloud；
    - Server Components 与 Client Components；
  - title: 4. Company Q：个人财务软件案例
    source_heading: 4. Company Q：个人财务软件案例
    paragraphs:
    - 产品仍运行在 Desktop 上，却强行模拟 Web Browser 的 Look and Feel。
    - 经过几个版本，Company Q 逐步移除 Browser-Like Feel，重新变回普通 Desktop GUI。
    - 假设你是 Company Q 的 Software Architect，Management 被说服要全面 Web 化 UI，你该怎么办？
    - 答案不是临时增加 Wrapper，而是从一开始隔离 Business Rules 与 UI。
  - title: 5.10 “Marketing Genius”怎样理解
    source_heading: 5.10 “Marketing Genius”怎样理解
    paragraphs:
    - Competitive Pressure；
    - Platform Consistency；
    - New Device Form Factor。
  - title: 7.7 Dependency Direction
    source_heading: 7.7 Dependency Direction
    paragraphs:
    - Web Adapter 依赖 Use Case Port；
    - Use Case 不依赖 Web Adapter；
    - Core 不 Import Web Framework；
    - Composition Root 在外层连接二者。
  - title: 10.3 Input Data 是什么
    source_heading: 10.3 Input Data 是什么
    paragraphs:
    - Source Account ID；
    - Destination Account ID；
    - Request Time 或 Idempotency Key，若业务需要。
  - title: 11.11 Use Case 以 Device-Independent 方式操作 UI
    source_heading: 11.11 Use Case 以 Device-Independent 方式操作 UI
    paragraphs:
    - UI 用输入数据“告诉”Use Case 用户要做什么；
    - Use Case 用输出数据“告诉”UI发生了什么；
  - title: 14. 在现代 Web 应用中落地
    source_heading: 14. 在现代 Web 应用中落地
    paragraphs:
    - 例如 Router、Component、Server Action、Middleware 不应成为 Domain Model 的基础类型。
    - Adapter 从 Authentication Mechanism 取得 Principal，再映射成 Use Case 需要的 Actor Identity
      或 Permission Context。
    - Server / Client Component 边界是 Rendering Architecture 的选择，不等同于 Domain / Use Case
      Boundary。
    - UI 可以提前显示结果以改善体验，但最终 Business Outcome 来自可信 Use Case。
  - title: 17. 方法为什么有效
    source_heading: 17. 方法为什么有效
    paragraphs:
    - UI 因 Device / Experience 变化，Use Case 因 Business Policy 变化。
    - Browser API 变化只影响 Adapter，不直接传播到 Entity 与 Use Case。
    - Use Case 接收 Plain Data，可以不启动 Browser、Server 或 Framework 直接测试。
    - UI Team 与 Domain Team 可以围绕 Input / Output Contract 协作。
  - title: 19. 实践检查、知识结构与核心总结
    source_heading: 19. 实践检查、知识结构与核心总结
    paragraphs:
    - 判断： 不能简单把全部 Interaction 当低价值细节；应保留高层 Interaction Policy，同时隔离 DOM 与 Browser API。
    - JavaScript Validation、Drag-and-Drop AJAX 与复杂 Widget 形成平台特有的 Chatty Dance。
    - 完整 Input Data 应放进 Plain Data Structure，而不是传入 DOM Event 或 HTTP Request。
    - 本章解决问题的一般方法是拉长历史尺度、识别高频变化机制、保护稳定政策、承认无法统一的差异，再寻找更窄的 Input–Use Case–Output Boundary。
  takeaways:
  - The GUI is a detail.
  - 判断： Web Type 穿透 Boundary，应先映射为 Plain Input Data。
  - 历史： Computing Power 长期在 Central Server 与 Terminal 之间摆动。
  - Q 与 A 共同说明 UI 通常具有较高变化率。
  - The GUI is a detail. The web is a GUI. So the web is a detail.
