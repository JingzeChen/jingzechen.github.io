checks:
- level: 概念辨析
  question: 原文如何解释「18.2 简单短命页面可能不需要完整分层」？
  answer: 一次性 Campaign Page 或极简单 Form 可以选择更轻量结构。
  source_heading: 18.2 简单短命页面可能不需要完整分层
- level: 概念辨析
  question: 原文如何解释「18.7 边界可能过于 Chatty」？
  answer: 如果每个 Keystroke 都成为远程 Use Case，说明抽象粒度可能错误。
  source_heading: 18.7 边界可能过于 Chatty
- level: 概念辨析
  question: 原文如何解释「18.14 常见误区四：Server Code 天然是业务核心」？
  answer: 错误。Server 上的 Route、Controller、ORM 与 Framework 仍可能是外层 Detail。
  source_heading: 18.14 常见误区四：Server Code 天然是业务核心
- level: 概念辨析
  question: 原文如何解释「18.19 常见误区九：Client Validation 足以保护规则」？
  answer: 错误。Client 可被绕过，关键 Business Rule 必须由可信边界执行。
  source_heading: 18.19 常见误区九：Client Validation 足以保护规则
- level: 概念辨析
  question: 原文如何解释「18.26 常见误区十六：Web 变化不会影响任何内层设计」？
  answer: 过于绝对。新的产品能力可能引入新 Use Case；边界保护的是无关变化，不是否认真正业务变化。
  source_heading: 18.26 常见误区十六：Web 变化不会影响任何内层设计
