  question: 1. 为什么先学习浅层线性网络？
  question_source: 1. 为什么先学习浅层线性网络
  thesis: 模型选择使用验证集，测试集应保留作最终评估；数据稀缺时可使用符合数据结构的交叉验证。
  thesis_source: 13. 核心结论与一般解题方法
  concepts:
  - term: 1. 为什么先学习浅层线性网络
    meaning: "“线性神经网络”不是与“线性回归”不同的新算法。它是从神经网络的组件和连接方式重新观察线性模型，为后续增加隐藏层、非线性和复杂输出结构做准备。"
    source_heading: 1. 为什么先学习浅层线性网络
  - term: 3. 面向对象的实现设计
    meaning: 好的抽象应让常见路径简洁，同时保留覆盖点。过度封装会隐藏梯度何时清零、模型处于训练还是验证模式、张量在哪个设备等关键事实。因此本章先展示接口，再从零实现循环，是为了既获得复用，又不失去对底层行为的理解。
    source_heading: 3. 面向对象的实现设计
  - term: 5. 从零实现线性回归
    meaning: 对单输出线性回归，全部权重初始化为零仍可训练，因为不同特征的梯度通常不同；深层网络中同层神经元全零初始化会造成对称性，多个单元接收完全相同梯度而无法分化。
    source_heading: 5. 从零实现线性回归
  - term: 7. 泛化
    meaning: 训练和验证都高且接近，并不总是模型容量不足，也可能是数据噪声、错误目标或优化失败。过拟合也不是单看“差距大”决定的：最终目标是降低验证/总体误差。一个模型即使训练—验证差距较大，只要验证误差最低，仍可能是最佳预测模型。
    source_heading: 7. 泛化
  - term: 9. 可运行的完整实验
    meaning: 断言检查正则化后权重范数和验证损失都下降，而不是只比较训练损失。
    source_heading: 9. 可运行的完整实验
  - term: 13. 核心结论与一般解题方法
    meaning: 本章完成了从“一个预测公式”到“完整机器学习方法”的第一次闭环：线性模型把输入映射为数值预测，平方损失把误差变成标量，小批量 SGD 借助自动微分更新参数，统一对象接口组织训练；但只有独立数据上的低误差才说明模型可能学到了可泛化规律，而权重衰减通过偏好较小参数，为有限样本下的模型选择加入第一种明确约束。
    source_heading: 13. 核心结论与一般解题方法
