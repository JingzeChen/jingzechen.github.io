  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - A software artifact should be open for extension but closed for modification.
      软件实体应当对扩展开放，对修改关闭。
    - 系统增加某类新行为时，应尽量通过增加代码完成，而不是反复改动已经稳定、重要的核心代码。
    - 本章把 OCP 从类设计提升到组件和架构层面。作者用财务摘要系统说明：同一份业务数据原本显示在 Web 页面上，现在需要增加黑白打印报告。好的架构应该让团队增加打印相关代码，而不必修改财务计算核心。
    - 本章最重要的不是记住「扩展」和「修改」两个词，而是理解：依赖箭头指向谁，谁就更能免受另一侧变化影响。
  - title: 1. OCP 的定义与来源
    source_heading: 1. OCP 的定义与来源
    paragraphs:
    - Bertrand Meyer 在 1988 年出版的 Object-Oriented Software Construction 中提出 OCP。
    - 它意味着：当某个变化轴已经明确时，系统允许通过新增实现、组件或 Adapter 支持变化。
    - 财务 Interactor 可以对「新增输出格式」关闭，但对「财务计算规则变化」仍然开放修改。不存在对所有未来变化同时关闭的模块。
    - 软件架构的目标之一，是让系统容易改变。如果一个小扩展迫使团队大规模改动系统，架构就没有发挥作用。
  - title: 3.3 Presenter 接口的作用
    source_heading: 3.3 Presenter 接口的作用
    paragraphs:
    - Interactor 调用高层一侧的 Presenter 接口；
    - Web Presenter 与 Print Presenter 分别实现接口；
    - 新增输出格式不会修改 Interactor。
    - View 接口则把 Presenter 与具体 View 分开，使 Web 或 Print 的绘制细节不影响格式化政策。
  - title: 3.4 接口所有权决定方向
    source_heading: 3.4 接口所有权决定方向
    paragraphs:
    - 如果 Gateway 接口定义在 Database 组件里，Interactor 仍然需要依赖 Database 组件。
    - 需要保护的一侧定义自己所需的能力；
    - 所以，不是「使用接口」自动带来 OCP，而是接口位置和依赖方向共同产生保护。
  - title: 5.4 保护不是平均分配
    source_heading: 5.4 保护不是平均分配
    paragraphs:
    - 变化频率较低但业务影响重大的规则。
    - View 和具体 Framework 通常更容易替换，因此可以处于保护层次外围。
  - title: 5.5 一个实用判断
    source_heading: 5.5 一个实用判断
    paragraphs:
    - 这是新行为，还是原有核心政策本身改变？
    - 哪些旧组件理论上不应知道这项扩展？
    - 是否因为接口泄漏了太多内部信息？
    - 建立边界的收益是否超过复杂度成本？
  - title: 检查职责分离
    source_heading: 检查职责分离
    paragraphs:
    - 业务计算是否混入 Web、Print 或 Database 格式？
    - 同一 Presenter 是否承担多种媒介？
    - 数据分析与展示是否可以独立测试？
    - 不同团队是否因不同原因修改同一模块？
  - title: 检查依赖方向
    source_heading: 检查依赖方向
    paragraphs:
    - Database Mapper 是否反向实现 Gateway？
    - Presenter 是否实现 Interactor 定义的输出端口？
  - title: 评估抽象成本
    source_heading: 评估抽象成本
    paragraphs:
    - 是否已有多个实现或真实变化证据？
    - 接口、Adapter、数据转换和测试成本如何？
    - 直接实现是否在当前寿命和风险下更合适？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - Figure 8.2 将系统分成 Controller、Interactor、Database、Presenters 和 Views 等组件。
    - 保护层次是相对的：Controller 对 Interactor 是外围，对 Presenter 和 View 又更高层。
    - 窄请求接口避免 Controller 传递依赖 Financial Entities 和 Interactor 内部结构。
    - 信息隐藏可以在保护 Interactor 的同时，减少 Controller 对 Interactor 内部变化的敏感度。
  takeaways:
  - OCP 由 Bertrand Meyer 于 1988 年提出，要求软件实体对扩展开放、对修改关闭。
  - 新呈现需要新代码，但理想上不应修改财务计算核心。
  - Controller 应免受 Presenter 变化影响，Presenter 应免受 View 变化影响。
  - Directional Control 会增加接口、Adapter、转换和理解成本，应由真实保护需求驱动。
  - 本章最终目标是让系统易于扩展，同时把变化影响限制在真正需要改变的组件中。
