checks:
- level: 概念辨析
  question: 原文如何解释「6. 所有组件应同等保护」？
  answer: 保护优先级取决于政策层级和业务重要性。高层 Interactor 比具体 View 更值得保护。
  source_heading: 6. 所有组件应同等保护
- level: 概念辨析
  question: 原文如何解释「7. 数据流方向就是源码依赖方向」？
  answer: 数据库数据可以流入 Interactor，Interactor 的源码却只依赖自己定义的 Gateway，具体 Mapper 反向依赖 Gateway。
  source_heading: 7. 数据流方向就是源码依赖方向
- level: 概念辨析
  question: 原文如何解释「9. Controller 依赖 Interactor 就应该看到其所有 Entity」？
  answer: 错误。Controller 只需要请求契约，窄接口应隐藏 Interactor 内部协作和 Entity。
  source_heading: 9. Controller 依赖 Interactor 就应该看到其所有 Entity
- level: 概念辨析
  question: 原文如何解释「10. 类图复杂说明架构过度设计」？
  answer: 复杂度可能是必要保护成本，也可能确实过度。需要依据变化频率、核心价值和团队边界判断。
  source_heading: 10. 类图复杂说明架构过度设计
- level: 概念辨析
  question: 原文如何解释「11. Composition Root 发生修改就违反 OCP」？
  answer: 新增插件通常需要在系统组装处注册。组装点本来就负责具体选择，不属于被保护的业务核心。
  source_heading: 11. Composition Root 发生修改就违反 OCP
