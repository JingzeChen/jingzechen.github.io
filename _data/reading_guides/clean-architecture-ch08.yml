overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: Open 表示可以增加新行为，Closed 表示增加这类行为时尽量不改稳定核心。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 本章把 OCP 从类设计提升到组件和架构层面。作者用财务摘要系统说明：同一份业务数据原本显示在 Web 页面上，现在需要增加黑白打印报告。好的架构应该让团队增加打印相关代码，而不必修改财务计算核心。
    source_heading: 本章导读
  - term: 3.3 Presenter 接口的作用
    meaning: View 接口则把 Presenter 与具体 View 分开，使 Web 或 Print 的绘制细节不影响格式化政策。
    source_heading: 3.3 Presenter 接口的作用
  - term: 5.4 保护不是平均分配
    meaning: View 和具体 Framework 通常更容易替换，因此可以处于保护层次外围。
    source_heading: 5.4 保护不是平均分配
  - term: 5.5 一个实用判断
    meaning: 哪些旧组件理论上不应知道这项扩展？
    source_heading: 5.5 一个实用判断
  - term: 检查依赖方向
    meaning: Presenter 是否实现 Interactor 定义的输出端口？
    source_heading: 检查依赖方向
  - term: 本章总结
    meaning: Figure 8.2 将系统分成 Controller、Interactor、Database、Presenters 和 Views 等组件。
    source_heading: 本章总结
