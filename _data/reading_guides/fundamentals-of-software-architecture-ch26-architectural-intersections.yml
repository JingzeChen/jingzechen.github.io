checks:
- level: 概念辨析
  question: 原文如何解释「11.1 “Implementation Detail” 不属于 Architecture」？
  answer: 错误。若 code choice 影响 scalability、structure 或 constraint，它就是 architecture
    intersection 的一部分。
  source_heading: 11.1 “Implementation Detail” 不属于 Architecture
- level: 概念辨析
  question: 原文如何解释「11.6 Cloud 会自动修复 Infrastructure Misalignment」？
  answer: 错误。Region/AZ placement、quota、co-location 和 storage 仍会抵消 architecture assumptions。
  source_heading: 11.6 Cloud 会自动修复 Infrastructure Misalignment
- level: 概念辨析
  question: 原文如何解释「11.11 Process 与 Engineering Practice 完全相同」？
  answer: 错误。Process 组织 people/workflow；practice 是 process-agnostic develop/release
    technique。
  source_heading: 11.11 Process 与 Engineering Practice 完全相同
- level: 概念辨析
  question: 原文如何解释「11.16 Enterprise Alignment 表示禁止 Exception」？
  answer: 错误。有证据的例外应正式审批并建立 support/exit plan；偷偷绕过才危险。
  source_heading: 11.16 Enterprise Alignment 表示禁止 Exception
- level: 概念辨析
  question: 原文如何解释「11.22 本章九个 Intersection 可以各自独立优化」？
  answer: 错误。它们互相作用；每个局部优化都必须回到共同 business/characteristic goals。
  source_heading: 11.22 本章九个 Intersection 可以各自独立优化
