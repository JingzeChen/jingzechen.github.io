    并进入 implementation；还要确保 architecture 与 technical/business environment 其他 facets
    对齐，并依靠 Part III 的 communication/collaboration 让 alignment 持续发生。
  thesis_source: 14. Summary：总结
  concepts:
  - term: 0. 本章要解决什么问题
    meaning: 例如 architecture 需要 elastic scale，infrastructure 必须提供快速 provisioning 和
      load balancing；若 cloud region placement 让 cache replication latency 失控，architecture
      也必须调整 data placement 或 cache model。
    source_heading: 0. 本章要解决什么问题
  - term: 3. Architecture and Data Topologies：架构与数据拓扑
    meaning: Service-based architecture 对 physical database topology 更灵活，可按 business/operation
      pressure 选择 monolithic、partial split 或 domain databases。
    source_heading: 3. Architecture and Data Topologies：架构与数据拓扑
  - term: 5. Architecture and Team Topologies：架构与团队拓扑
    meaning: Architecture migration 若不同时考虑 team ownership，代码边界会逐渐回到组织沟通边界。Alignment
      不一定要求重组人员，也可通过 platform/team APIs 和明确 ownership 降低跨边界成本。
    source_heading: 5. Architecture and Team Topologies：架构与团队拓扑
  - term: 7. Architecture and the Enterprise：架构与企业
