  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - 选择 microservices，却用 manual provisioning、manual testing 和 quarterly release；
    - 例如 architecture 需要 elastic scale，infrastructure 必须提供快速 provisioning 和 load balancing；若
      cloud region placement 让 cache replication latency 失控，architecture 也必须调整 data
      placement 或 cache model。
    - 若这些 goals 没有共同排序，局部优化会互相抵消。本章的核心方法不是寻找“谁做错了”，而是把每个决定映射到同一组 business priorities
      和 architecture characteristics。
    - 原章没有统一的交叉点评分算法。本文加入的缓存内存公式、系统依赖可用性直觉、alignment checker、检查清单和总结流程属于教学扩展，不是原书规定的标准。Generative
      AI 部分反映作者在 2025 年初的观察，工具能力会快速变化，但 replaceability、evaluation、context 和 accountability
      等结构性原则仍值得保留。
  - title: 1. Architecture and Implementation：架构与实现
    source_heading: 1. Architecture and Implementation：架构与实现
    paragraphs:
    - Operational concerns 是 Part I 的 architecture characteristics，例如 fault tolerance、responsiveness、scalability、elasticity、availability。它们支撑
      business problem，也驱动 architecture decisions。
    - Production 中 concurrent users 增长，系统增加 service instances。约到 80,000 concurrent
      customers 时，internal cache memory requirements 太高，所有 VMs 出现 out-of-memory，系统
      crash。
    - 含义：shared/distributed cache 降低重复 memory，却重新引入 remote access、shared bottleneck
      和 availability dependency。没有免费修复；应根据 data size、update rate、latency、consistency
      和 instance count 权衡。
    - 工具必须与 architect/development team 的 communication/collaboration 结合。若团队不理解 Why，规则只会被绕过；若只有沟通没有自动检查，structure
      会在压力下 decay。
  - title: 3. Architecture and Data Topologies：架构与数据拓扑
    source_heading: 3. Architecture and Data Topologies：架构与数据拓扑
    paragraphs:
    - Service-based architecture 对 physical database topology 更灵活，可按 business/operation
      pressure 选择 monolithic、partial split 或 domain databases。
    - Architecture styles 和 database types 都有 superpowers（4–5 stars）与 weaknesses（1–2
      stars）。应让两者优势互相放大，而非抵消。
    - Microservices、event-driven、space-based 的 superpowers 包括 scalability/elasticity；key-value
      和 columnar database 在这些方面也强，因此可能形成良好 alignment。
    - 把 key-value pairs 强塞进 relational schema 可能引入无谓 joins/mapping/overhead。反过来，把强关系、复杂
      transaction 数据放入不合适的 store 也会把复杂性转移到 application。
  - title: 4. Architecture and Engineering Practices：架构与工程实践
    source_heading: 4. Architecture and Engineering Practices：架构与工程实践
    paragraphs:
    - 如果 operations antiquated、process manual、testing 很少，大量 deployable units 会导致 failure。
    - Engineering practices 的进步让新 architecture capabilities 成为可能，从 XP 到 continuous
      delivery，再到 evolutionary architecture。
    - Neal Ford 等人的 Building Evolutionary Architectures 提出 architectural fitness functions：随着
      change 持续保护/govern architecture characteristics。
    - Microservices/service-based topology 支持 high agility；若 build/test/deploy practices
      不对齐，系统仍达不到 goal。Fitness functions 暴露 misalignment，促使调整 practices 或 architecture。
  - title: 5. Architecture and Team Topologies：架构与团队拓扑
    source_heading: 5. Architecture and Team Topologies：架构与团队拓扑
    paragraphs:
    - 适合 domain-partitioned architectures：modular monolith、service-based、microservices
      等。
    - Space-based 也可按 business-function teams 与 data-synchronization teams 技术分工。
    - 若 layered monolith 却强行让每个 domain team 重复维护 UI/backend/data expertise，也可能增加 duplication
      和 shared-layer coordination。
    - Architecture migration 若不同时考虑 team ownership，代码边界会逐渐回到组织沟通边界。Alignment 不一定要求重组人员，也可通过
      platform/team APIs 和明确 ownership 降低跨边界成本。
  - title: 7. Architecture and the Enterprise：架构与企业
    source_heading: 7. Architecture and the Enterprise：架构与企业
    paragraphs:
    - Enterprise 指公司、department 或 division 内所有 systems/products 的集合。
    - Security standards/practices/procedures；
    - 原章多次见到：architect 忽略 enterprise practices，solution 即使 technically effective，也被判为
      failed one-off 并 scrapped。
    - 分析 standard 与 exception trade-offs；
  - title: 8. Architecture and the Business Environment：架构与业务环境
    source_heading: 8. Architecture and the Business Environment：架构与业务环境
    paragraphs:
    - There are known knowns… known unknowns… unknown unknowns—the ones we don’t know
      we don’t know.
    - Unknown unknowns 是 software systems 的 nemesis，也是所有 Big Design Up Front efforts
      都会受挫的原因：无法为完全未知的变化预先设计完美结构。
    - All architectures become iterative because of unknown unknowns. Agile just recognizes
      this and does it sooner.
    - 'Barry O’Reilly（complexity theory/software design architect）提出 residuality theory，著作：Residues:
      Time, Change, and Uncertainty in Software Architecture（Leanpub, 2024）。'
  - title: 9. Architecture and Generative AI：架构与生成式 AI
    source_heading: 9. Architecture and Generative AI：架构与生成式 AI
    paragraphs:
    - Job-search company 用 LLM anonymize résumés，以减少 bias，让招聘关注 skills 而非 demographics。
    - 因此必须收集 samples、metrics，并比较 LLM engines。Langfuse 等工具可提供 architecture observability。
    - 作者当时没有获得 tremendous success：询问 microservices 还是 space-based，LLM 很少给出正确答案。
    - 这是一项 time-bound observation。未来模型会变化，但任何工具仍需 verified context、evidence 和 accountable
      human decision owner。
  - title: 12. 一般化的问题解决方法
    source_heading: 12. 一般化的问题解决方法
    paragraphs:
    - 记录 business goals、critical characteristics、style decisions、constraints 和 priorities。
    - 不要只审 code diagram；检查 platform、data、practices、teams、external systems、enterprise、business、AI。
    - 使用 source dependency、load/chaos test、placement、DB metrics、pipeline data、team
      map、contract/SLA、enterprise standards、business roadmap、AI evals。
    - 将关键 alignment 转为 dependency tests、resource budgets、SLOs、pipeline metrics、team
      ownership checks 和 evals。
  - title: 14. Summary：总结
    source_heading: 14. Summary：总结
    paragraphs:
    - Software architecture 是 holistic activity。创建/维护 architecture 远不只是选 style 并进入
      implementation；还要确保 architecture 与 technical/business environment 其他 facets
      对齐，并依靠 Part III 的 communication/collaboration 让 alignment 持续发生。
    - Architecture 有九个关键 intersections。 Implementation、infrastructure、data、practices、teams、integration、enterprise、business、Gen
      AI 都能决定成败。
    - Implementation detail 可能摧毁 architecture characteristic。 Order replicated cache
      优化 responsiveness，却在 scale-out 时因 memory 导致 OOM。
    - Engineering practices 是 architecture 的成立条件。 Microservices 假设 automated provision/test/deploy；Waterfall/manual
      process 会制造 friction。
