  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 话题分析是文本分析的一种技术。给定一个文本集合，话题分析旨在发现文本集合中每个文本的话题，而话题由单词的集合表示。注意，这里假设有足够数量的文本，如果只有一个文本或几个文本，是不能做话题分析的。话题分析可以形式化为概率模型估计问题，或降维问题。第
    17、18、20 章分别介绍话题分析方法的潜在语义分析、概率潜在语义分析、潜在狄利克雷分配。第 19 章介绍基础的马尔可夫链蒙特卡罗法。
  thesis_source: 13.4 无监督学习方法
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 注意第 9 章的位置【补充】：EM 算法虽然写在第 1 篇，但它其实是无监督学习最核心的工具——高斯混合模型的软聚类、pLSA、LDA 全都靠它。原书
      13.3 节也明确把”高斯混合模型 EM 算法”列为软聚类方法。所以第 9 章是连接两篇的桥梁。
    source_heading: 0. 本章解决什么问题
  - term: 13.1 无监督学习基本原理
    meaning: 无监督学习的基本想法是对给定数据（矩阵数据）进行某种”压缩”，从而找到数据的潜在结构。假定损失最小的压缩得到的结果就是最本质的结构。图 13.1
      是这种想法的一个示意图。
    source_heading: 13.1 无监督学习基本原理
  - term: 13.2 基本问题
    meaning: 降维（dimensionality reduction）是将训练数据中的样本（实例）从高维空间转换到低维空间。假设样本原本存在于低维空间，或者近似地存在于低维空间，通过降维则可以更好地表示样本数据的结构，即更好地表示样本之间的关系。高维空间通常是高维的欧氏空间，而低维空间是低维的欧氏空间或者流形（manifold）。低维空间不是事先给定，而是从数据中自动发现，其维数通常是事先给定的。
      从高维到低维的降维中，要保证样本中的信息损失最小。降维有线性的降维和非线性的降维。
    source_heading: 13.2 基本问题
  - term: 13.4 无监督学习方法
    meaning: 话题分析是文本分析的一种技术。给定一个文本集合，话题分析旨在发现文本集合中每个文本的话题，而话题由单词的集合表示。注意，这里假设有足够数量的文本，如果只有一个文本或几个文本，是不能做话题分析的。话题分析可以形式化为概率模型估计问题，或降维问题。第
      17、18、20 章分别介绍话题分析方法的潜在语义分析、概率潜在语义分析、潜在狄利克雷分配。第 19 章介绍基础的马尔可夫链蒙特卡罗法。
    source_heading: 13.4 无监督学习方法
  - term: 13.6 【补充】深入理解
    meaning: 不是。原书 13.2 节第 3 小节明确说”随机变量 z 表示隐式结构……模型是混合模型时，z 表示成分的个数；模型是概率图模型时，z 表示图的结构”；而在式
      (13.1) 之后又说”这里 z 表示类别”。同一个字母在不同语境下含义不同，读时要看上下文。
    source_heading: 13.6 【补充】深入理解
  - term: 13.7 本章概要与方法论总结
    meaning: 无监督学习的基本想法是对给定数据（矩阵数据）进行某种“压缩”，从而找到数据的潜在结构，假定损失最小的压缩得到的结果就是最本质的结构。可以考虑发掘数据的纵向结构，对应聚类。也可以考虑发掘数据的横向结构，对应降维。还可以同时考虑发掘数据的纵向与横向结构，对应概率模型估计。
    source_heading: 13.7 本章概要与方法论总结
