  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 无监督学习是一个困难的任务，因为数据没有标注，也就是没有人的指导，机器需要自己从数据中找出规律。模型的输入 x 在数据中可以观测，而输出 z 隐藏在数据中。无监督学习通常需要大量的数据，因为对数据隐藏的规律的发现需要足够的观测。
    - 无监督学习的基本想法是对给定数据（矩阵数据）进行某种“压缩”，从而找到数据的潜在结构。假定损失最小的压缩得到的结果就是最本质的结构。
    - 原书用词是”假定损失最小的压缩得到的结果就是最本质的结构”。这是无监督学习的归纳偏置（inductive bias）——因为没有标签，就必须人为规定一个判据来定义”好”。
    - 注意第 9 章的位置【补充】：EM 算法虽然写在第 1 篇，但它其实是无监督学习最核心的工具——高斯混合模型的软聚类、pLSA、LDA 全都靠它。原书
      13.3 节也明确把”高斯混合模型 EM 算法”列为软聚类方法。所以第 9 章是连接两篇的桥梁。
  - title: 13.1 无监督学习基本原理
    source_heading: 13.1 无监督学习基本原理
    paragraphs:
    - 无监督学习是从无标注的数据中学习数据的统计规律或者说内在结构的机器学习，主要包括聚类、降维、概率估计。无监督学习可以用于数据分析或者监督学习的前处理。
    - 为什么要改约定【补充】：因为第 15~18、20 章要做矩阵分解（SVD、PCA、LSA），而线性代数里习惯把”数据向量”写成列向量。
    - 从右往左，模型给出的信息越来越多：硬聚类只给类别；软聚类还给出”有多确定”；生成模型连”这类数据长什么样”都建好了，还能采样生成新数据。
    - 无监督学习的基本想法是对给定数据（矩阵数据）进行某种”压缩”，从而找到数据的潜在结构。假定损失最小的压缩得到的结果就是最本质的结构。图 13.1 是这种想法的一个示意图。
  - title: 13.2 基本问题
    source_heading: 13.2 基本问题
    paragraphs:
    - 聚类（clustering）是将样本集合中相似的样本（实例）分配到相同的类，不相似的样本分配到不同的类。聚类时，样本通常是欧氏空间中的向量，类别不是事先给定，而是从数据中自动发现，但类别的个数通常是事先给定的。样本之间的相似度或距离由应用决定。
    - 如果一个样本只能属于一个类，则称为硬聚类（hard clustering）；如果一个样本可以属于多个类，则称为软聚类（soft clustering）。图
      13.2 给出聚类（硬聚类）的例子。二维空间的样本被分到三个不同的类中。
    - 降维（dimensionality reduction）是将训练数据中的样本（实例）从高维空间转换到低维空间。假设样本原本存在于低维空间，或者近似地存在于低维空间，通过降维则可以更好地表示样本数据的结构，即更好地表示样本之间的关系。高维空间通常是高维的欧氏空间，而低维空间是低维的欧氏空间或者流形（manifold）。低维空间不是事先给定，而是从数据中自动发现，其维数通常是事先给定的。
      从高维到低维的降维中，要保证样本中的信息损失最小。降维有线性的降维和非线性的降维。
    - 概率模型估计（probability model estimation），简称概率估计，假设训练数据由一个概率模型生成，由训练数据学习概率模型的结构和参数。概率模型的结构类型（或者说概率模型的集合）事先给定，而模型的具体结构与参数从数据中自动学习，学习的目标是找到最有可能生成数据的结构和参数。概率模型包括混合模型、概率图模型等。概率图模型又包括有向图模型和无向图模型。
  - title: 13.3 机器学习三要素
    source_heading: 13.3 机器学习三要素
    paragraphs:
    - 策略在不同的问题中有不同的形式，但都可以表示为目标函数的优化。比如，聚类中样本距离的最小化，降维中样本信息损失的最小化，概率模型估计中模型生成数据概率的最大化。
    - 唯一的例外是 PCA/SVD【补充】——它有闭式解（协方差矩阵的特征值分解，第 16 章定理），不需要迭代。这也是原书说”通常是迭代算法”而不是”总是”的原因。
    - 层次聚类法、k 均值聚类是硬聚类方法，高斯混合模型 EM 算法是软聚类方法。主成分分析、潜在语义分析是降维方法。概率潜在语义分析、潜在狄利克雷分配是概率模型估计方法。
    - 注意”高斯混合模型 EM 算法”被列为软聚类方法——它在第 1 篇（第 9 章）就讲过了，但归属上属于无监督学习。这再次印证 13.0.4 节说的：第
      9 章是连接两篇的桥梁。
  - title: 13.4 无监督学习方法
    source_heading: 13.4 无监督学习方法
    paragraphs:
    - 话题分析是文本分析的一种技术。给定一个文本集合，话题分析旨在发现文本集合中每个文本的话题，而话题由单词的集合表示。注意，这里假设有足够数量的文本，如果只有一个文本或几个文本，是不能做话题分析的。话题分析可以形式化为概率模型估计问题，或降维问题。第
      17、18、20 章分别介绍话题分析方法的潜在语义分析、概率潜在语义分析、潜在狄利克雷分配。第 19 章介绍基础的马尔可夫链蒙特卡罗法。
    - 很多应用中的数据是以图的形式存在，图数据表示实体之间的关系，包括有向图、无向图、超图。图分析（graph analytics）的目的是发掘隐藏在图中的统计规律或潜在结构。链接分析（link
      analysis）是图分析的一种，包括 PageRank 算法，主要是发现有向图中的重要结点。第 21 章介绍 PageRank 算法。
    - PageRank 算法是无监督学习方法。给定一个有向图，定义在图上的随机游走即马尔可夫链。随机游走者在有向图上随机跳转，到达一个结点后以等概率跳转到链接出去的结点，并不断持续这个过程。PageRank
      算法就是求解该马尔可夫链的平稳分布的算法。 一个结点上的平稳概率表示该结点的重要性，称为该结点的 PageRank 值。
    - 这里简单介绍 PageRank 的原理。图 13.7 是一个简单的有向图，有 4 个结点 A，B，C，D。给定这个图，PageRank 算法通过迭代求出结点的
      PageRank 值。首先，对每个结点的概率值初始化，表示各个结点的到达概率，假设是等概率的。下一步，各个结点的概率是上一步各个结点可能跳转到该结点的概率之和，不断迭代，各个结点的到达概率分布趋于平稳分布，也就是
      PageRank 值的分布。迭代过程如表 13.5 所示。可以看出结点 C，D 的 PageRank 值更大。
  - title: 13.6 【补充】深入理解
    source_heading: 13.6 【补充】深入理解
    paragraphs:
    - 不完全对。原书说的是两条：”被指向的结点越多，该结点的 PageRank 值就越大；被指向的结点的 PageRank 值越大，该结点的 PageRank
      值就越大“。第二条才是关键——重要性是递归定义的。
    - 不是。原书 13.2 节第 3 小节明确说”随机变量 z 表示隐式结构……模型是混合模型时，z 表示成分的个数；模型是概率图模型时，z 表示图的结构”；而在式
      (13.1) 之后又说”这里 z 表示类别”。同一个字母在不同语境下含义不同，读时要看上下文。
    - 相反，它更难。原书原话：”无监督学习是一个困难的任务，因为数据没有标注，也就是没有人的指导。”没有标签意味着：目标函数无法唯一确定、优化几乎必然非凸、结果无法客观评价、需要更多数据。
    - 不是。EM 是含隐变量概率模型的通用学习算法，是无监督学习最核心的工具。原书 13.3 节明确把”高斯混合模型 EM 算法”列为软聚类方法。第 9 章放在第
      1 篇只是编排上的考虑（它需要用到第 1 篇的极大似然估计基础）。
  - title: 13.7 本章概要与方法论总结
    source_heading: 13.7 本章概要与方法论总结
    paragraphs:
    - 无监督学习是指从无标注数据中学习模型的机器学习问题。无标注数据是自然得到的数据，模型表示数据的类别、转换或概率。无监督学习的本质是学习数据中的统计规律或潜在结构，主要包括聚类、降维、概率估计。
    - 无监督学习的基本想法是对给定数据（矩阵数据）进行某种“压缩”，从而找到数据的潜在结构，假定损失最小的压缩得到的结果就是最本质的结构。可以考虑发掘数据的纵向结构，对应聚类。也可以考虑发掘数据的横向结构，对应降维。还可以同时考虑发掘数据的纵向与横向结构，对应概率模型估计。
    - 4. 降维是将样本集合中的样本（实例）从高维空间转换到低维空间。假设样本原本存在于低维空间，或近似地存在于低维空间，通过降维则可以更好地表示样本数据的结构，即更好地表示样本之间的关系。降维有线性降维和非线性降维，降维方法有主成分分析。
    - 6. 话题分析是文本分析的一种技术。给定一个文本集合，话题分析旨在发现文本集合中每个文本的话题，而话题由单词的集合表示。话题分析方法有潜在语义分析、概率潜在语义分析和潜在狄利克雷分配。
