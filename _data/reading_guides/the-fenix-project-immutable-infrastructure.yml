overview:
  kind: summary
  minutes: 14
  question: 1. 本章要解决什么问题？
  question_source: 1. 本章要解决什么问题
  thesis: 资源模型和控制器构成 Kubernetes 核心：用户描述期望，控制器持续协调。
  thesis_source: 13. 本章知识结构总结
  concepts:
  - term: 1. 本章要解决什么问题
    meaning: 不可变基础设施并不是说磁盘、配置和业务数据永远不能变化，而是说：已经进入运行环境的计算实例不再被原地修补；要变更程序、依赖或基础配置，就由新制品创建新实例，再替换旧实例。
    source_heading: 1. 本章要解决什么问题
  - term: 4. 以容器构建系统
    meaning: Pause / Infra Container 先创建并持有 Pod 的 Namespace，其他容器加入这些 Namespace。即使业务容器重启，Pod
      网络身份仍可由 Sandbox 维持。现代 CRI 实现把它称为 Pod Sandbox，具体 Pause 镜像和实现属于运行时细节。
    source_heading: 4. 以容器构建系统
  - term: 6. 容器间网络
    meaning: 当前 Linux 还广泛使用 nftables。截至 Kubernetes 1.36，原生 kube-proxy 模式包括 iptables、已稳定的
      nftables，以及已被标记为 Deprecated 的 IPVS；nftables 是原生数据面替代 IPVS 的推荐方向。eBPF 通常由 Cilium
      等产品实现并取代 kube-proxy，不是 kube-proxy 自带的一种模式。理解 Netfilter 的价值在于掌握包经过何处，而不是记住某个版本生成的全部规则。
    source_heading: 6. 容器间网络
  - term: 8. 资源与调度
    meaning: 驱逐排序不是简单“BestEffort -> Burstable -> Guaranteed”：kubelet 还考虑 Pod 是否超过
      Request、Priority 以及超出程度。超过 Memory Limit 的容器可能由内核 OOM Kill，这与 kubelet Node Pressure
      Eviction 也不同。
    source_heading: 8. 资源与调度
  - term: 10. 本章各部分如何连接
    meaning: 任何一步失败都应通过 Event、Condition、日志和指标显式呈现。自动化不意味着故障消失，而是故障处理路径被标准化。
    source_heading: 10. 本章各部分如何连接
  - term: 14. 主动回忆题
    meaning: Priority、Preemption 与 Node Pressure Eviction 有何区别？
    source_heading: 14. 主动回忆题
