overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0.1 时间在前文已经出现在哪里」建立了怎样的核心认识？
  question_source: 0.1 时间在前文已经出现在哪里
  thesis: Lamport clock 在本地/send 前加 1，receive 时取 max 再加 1。 这保证因果事件 timestamp 递增。
  thesis_source: 16. 核心结论
  concepts:
  - term: 0.1 时间在前文已经出现在哪里
    meaning: API deadline 限制调用链等待。
    source_heading: 0.1 时间在前文已经出现在哪里
  - term: 2. NTP：通过不确定网络估计时钟偏移
    meaning: Network Time Protocol（NTP）让客户端通过网络向时间服务器获取时间，并估计自身时钟偏移。难点是：收到的服务器 timestamp
      已经在网络中传播了一段未知时间。
    source_heading: 2. NTP：通过不确定网络估计时钟偏移
  - term: 7. Lamport clock
    meaning: 持久化 counter、epoch 或预留区间必须发生在相应消息或副作用对外可见之前；否则进程可能先暴露高 timestamp 事件、再在持久化前崩溃，恢复后仍会回退。
    source_heading: 7. Lamport clock
  - term: 8. Vector clocks：向量时钟
    meaning: Lamport clock 只保留一个标量，满足因果的必要方向，却不能从数值顺序反推因果。vector clock 为每个参与进程保存一个因果知识分量，使时间戳可以按偏序比较。
    source_heading: 8. Vector clocks：向量时钟
  - term: 10. Vector clock 的成本与局限
    meaning: 原章提到 dotted version vectors 可缓解大量客户端下的向量增长问题。其核心思路是把“一个新事件的 dot”与“此前因果上下文”分开表示，适合版本跟踪和副本协调。在稳定副本身份等特定架构下，它可以避免元数据按每个客户端扩张；这不表示任意
      N 进程事件系统都能无条件降为常数空间。
    source_heading: 10. Vector clock 的成本与局限
  - term: 17. 从本章提炼出的通用解题方法
    meaning: 业务日期和审计需要 wall clock；timeout 需要 monotonic；因果顺序需要 logical clock。不要用一个时钟解决所有问题。
    source_heading: 17. 从本章提炼出的通用解题方法
  logic:
  - 0.1 时间在前文已经出现在哪里
  - 2. NTP：通过不确定网络估计时钟偏移
  - 3. Monotonic clock：测量本节点经过时间
  - 8. Vector clocks：向量时钟
  - 9.4 示例局限
  - 16. 核心结论
  - 17. 从本章提炼出的通用解题方法
  sections:
  - title: 0.1 时间在前文已经出现在哪里
    source_heading: 0.1 时间在前文已经出现在哪里
    paragraphs:
    - DNS 用 TTL 决定缓存新鲜期；
    - TCP 用 timer 与 RTT 估计触发重传；
    - failure detector 用 timeout、ping 和 heartbeat 怀疑故障；
    - API deadline 限制调用链等待。
  - title: 0.3 分布式顺序为何困难
    source_heading: 0.3 分布式顺序为何困难
    paragraphs:
    - 没有所有进程完美共享的全局时钟；
    - wall clock 可能向前或向后跳；
    - 并发事件本来就可能不存在因果顺序。
  - title: 2. NTP：通过不确定网络估计时钟偏移
    source_heading: 2. NTP：通过不确定网络估计时钟偏移
    paragraphs:
    - Network Time Protocol（NTP）让客户端通过网络向时间服务器获取时间，并估计自身时钟偏移。难点是：收到的服务器 timestamp
      已经在网络中传播了一段未知时间。
    - NTP 会结合多次样本、多个服务器、层级和过滤算法改善估计，但无法把不确定网络变成绝对同时的全局时钟。
    - 暂时让时钟略快或略慢，逐步消化偏差。它避免突然大跳，但校准需要时间，期间 wall clock 仍带误差。
    - 原章用“调整造成时钟前后跳”说明危险。实际操作系统/时间服务可能根据偏差大小和策略选择 step 或 slew；不能假设 wall clock 永远单调。
  - title: 3. Monotonic clock：测量本节点经过时间
    source_heading: 3. Monotonic clock：测量本节点经过时间
    paragraphs:
    - lease duration 的本地部分；
    - 不受 suspend/平台语义影响；
  - title: 7. Lamport clock
    source_heading: 7. Lamport clock
    paragraphs:
    - 原章按进程 ID 1、2、3 打破平局，所以 E 的 total-order timestamp 大于 A。
    - 这里要求 process ID 唯一且在参与期间稳定。crash-recovery 后若 ID 可能复用，应把持久 incarnation/epoch
      纳入身份，避免不同进程世代使用同一个 tie-break 值。
    - 原章指出 Lamport clock 默认可按 crash-stop 理解；支持 crash-recovery 可把 counter 持久化。
    - 持久化 counter、epoch 或预留区间必须发生在相应消息或副作用对外可见之前；否则进程可能先暴露高 timestamp 事件、再在持久化前崩溃，恢复后仍会回退。
  - title: 8. Vector clocks：向量时钟
    source_heading: 8. Vector clocks：向量时钟
    paragraphs:
    - Lamport clock 只保留一个标量，满足因果的必要方向，却不能从数值顺序反推因果。vector clock 为每个参与进程保存一个因果知识分量，使时间戳可以按偏序比较。
    - 逐分量 max 计算两份知识的并集前沿；再递增自己的分量，记录新的 receive 事件。
    - Lamport 只有单向蕴含，vector clock 可以由偏序反推 happened-before。
    - 这不是信息不足导致的“暂时不知道”，而是 timestamp 明确表示两者没有 happened-before 关系。
  - title: 9.4 示例局限
    source_heading: 9.4 示例局限
    paragraphs:
    - counter 不处理整数溢出；
    - 没有 crash-recovery 持久化；
    - 没有动态成员、进程删除和向量压缩；
    - 逻辑 timestamp 不等于 wall time。
  - title: 10. Vector clock 的成本与局限
    source_heading: 10. Vector clock 的成本与局限
    paragraphs:
    - 每条消息携带约 78 KiB timestamp 通常不可接受，还没计算进程 ID、编码和协议首部。
    - 原章提到 dotted version vectors 可缓解大量客户端下的向量增长问题。其核心思路是把“一个新事件的 dot”与“此前因果上下文”分开表示，适合版本跟踪和副本协调。在稳定副本身份等特定架构下，它可以避免元数据按每个客户端扩张；这不表示任意
      N 进程事件系统都能无条件降为常数空间。
    - 本章不展开其算法；重要结论是：vector clock 不是逻辑时钟的终点。不同场景会在精确因果信息、元数据大小和成员动态之间取舍。
    - 不能处理遗漏 timestamp 的外部通信；
  - title: 16. 核心结论
    source_heading: 16. 核心结论
    paragraphs:
    - Monotonic clock 适合本节点 timeout 和 latency。 它没有共享 epoch，不能比较不同节点事件。
    - happened-before 从程序顺序、消息发送/接收和传递性定义因果。 无双向因果关系的事件称为 concurrent。
    - Lamport clock 在本地/send 前加 1，receive 时取 max 再加 1。 这保证因果事件 timestamp 递增。
    - Process ID 可以把 Lamport timestamp 扩展为 total order。 该顺序是确定性裁决，不是因果事实。
  - title: 17. 从本章提炼出的通用解题方法
    source_heading: 17. 从本章提炼出的通用解题方法
    paragraphs:
    - 业务日期和审计需要 wall clock；timeout 需要 monotonic；因果顺序需要 logical clock。不要用一个时钟解决所有问题。
    - 只需确定性排序或保证因果不逆序，可用 Lamport；必须判断并发冲突，使用 vector clock 或等价因果元数据。
    - 至少验证：同进程递增、send-before-receive、传递性、Lamport 反向不成立、vector 并发不可比、重启不回退。
    - 本章最重要的方法论是：不要试图从不完美物理钟中强行恢复精确全局顺序；先识别真正需要的因果关系，再用最小充分的逻辑时钟表示它。
  takeaways:
  - 分布式系统没有所有进程完美共享的全局时钟。 并发、drift 和网络不确定性使跨节点排序困难。
  - Monotonic clock 适合本节点 timeout 和 latency。 它没有共享 epoch，不能比较不同节点事件。
  - Process ID 可以把 Lamport timestamp 扩展为 total order。 该顺序是确定性裁决，不是因果事实。
  - Vector timestamp 采用逐分量偏序。 每分量不大于且至少一项更小，才是 before。
  - 物理时钟有其适用范围。 调试日志可接受粗略 wall time，但不能把其排序当作因果证明。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「14.1 Drift 与 skew」？
  answer: drift 是速率偏差，skew/offset 是某时刻读数差。修正 offset 后，drift 仍会让它重新增长。
  source_heading: 14.1 Drift 与 skew
- level: 概念辨析
  question: 原文如何解释「14.3 Physical time 与 logical time」？
  answer: 物理时钟近似“几点”，逻辑时钟表达事件顺序。Lamport timestamp 100 不表示 100 秒，也不表示比 timestamp 90
    晚 10 个真实时间单位。
  source_heading: 14.3 Physical time 与 logical time
- level: 概念辨析
  question: 原文如何解释「14.5 Lamport 小于与因果先于」？
  answer: 没有反向。用 process ID 打破平局得到 total order，也不会创造因果。
  source_heading: 14.5 Lamport 小于与因果先于
- level: 概念辨析
  question: 原文如何解释「14.7 Concurrent 与 simultaneous」？
  answer: concurrent 表示 happened-before 不可比较，不要求物理同时发生。
  source_heading: 14.7 Concurrent 与 simultaneous
- level: 概念辨析
  question: 原文如何解释「14.9 Timestamp 与版本值」？
  answer: 时钟描述元数据，不自动决定业务值。检测到并发后仍需合并、保留 siblings、CRDT 或人工冲突处理。
  source_heading: 14.9 Timestamp 与版本值
