overview:
  kind: summary
  minutes: 15
  question: 原文围绕「阅读导引」建立了怎样的核心认识？
  question_source: 阅读导引
  thesis: VAE 从 marginal likelihood 推出 ELBO，以 reparameterization 训练 stochastic encoder；Gaussian
    KL 让 prior sampling 可行。
  thesis_source: 15. 本章总结
  concepts:
  - term: 阅读导引
    meaning: Diffusion：定义可控的加噪过程，再学习逐步逆转，换取更稳定、更多样的生成。
    source_heading: 阅读导引
  - term: 3. Stacked Autoencoders
    meaning: 先用 AE 将 784 降到 32，再以 t-SNE/UMAP 降到 2：AE 负责 scalable nonlinear feature
      extraction，t-SNE 负责 local-neighborhood visualization。t-SNE axes/global distances
      没有直接语义，结果依 seed/perplexity，不能把 cluster separation 当作 classifier accuracy。
    source_heading: 3. Stacked Autoencoders
  - term: 6. Sparse Autoencoders
    meaning: L1 在 0 附近有固定 shrink pressure，倾向将不重要 activations 压到零；L2 更倾向均匀缩小所有 activations。若
      activation 是 ReLU，实际零值可直接衡量；Sigmoid 永不严格为零，常以平均 activation 表示 firing probability。
    source_heading: 6. Sparse Autoencoders
  - term: 7. Variational Autoencoders
    meaning: Encoder 输出 distribution parameters，而非单一点；decoder 输入 sample z。训练同时要求重构好、posterior
      不偏离 prior 太远，因此 prior samples 落入 decoder 熟悉区域。
    source_heading: 7. Variational Autoencoders
  - term: 10. Diffusion Models
    meaning: 优势：训练 objective 稳定、mode coverage 好、quality 高、conditioning 灵活、editing/inpainting/outpainting
      强。局限：多次 model evaluations 导致慢/耗能；guidance 和 sampler 调参；训练 data/licensing 风险；likelihood/quality
      指标与人类偏好不完全一致。
    source_heading: 10. Diffusion Models
  - term: 15. 本章总结
    meaning: VAE 从 marginal likelihood 推出 ELBO，以 reparameterization 训练 stochastic
      encoder；Gaussian KL 让 prior sampling 可行。
    source_heading: 15. 本章总结
  logic:
  - 阅读导引
  - 3. Stacked Autoencoders
  - 4. Convolutional Autoencoders
  - 7. Variational Autoencoders
  - 9. Generative Adversarial Networks
  - 14. 工程检查清单
  - 15. 本章总结
  sections:
  - title: 阅读导引
    source_heading: 阅读导引
    paragraphs:
    - Autoencoder：在复制输入的任务上施加 bottleneck/noise/sparsity，迫使网络学习有用 latent representation；
    - VAE：把 deterministic coding 变成受 prior 约束的随机变量，使 latent space 可采样、可生成；
    - GAN：不显式写 likelihood，由 discriminator 提供学习信号，generator 一步生成高质量样本；
    - Diffusion：定义可控的加噪过程，再学习逐步逆转，换取更稳定、更多样的生成。
  - title: 1. Efficient Data Representations
    source_heading: 1. Efficient Data Representations
    paragraphs:
    - "“50、48、46、…、14”虽比随机 10 个数长，却能用“从 50 开始递减偶数到 14”压缩。若记忆无限，直接背诵即可，不需要发现规律。"
    - Autoencoder 同理：若 network capacity 过强且没有约束，可记住训练样本或学 identity。Bottleneck/noise/sparsity
      相当于限制 communication channel，只有复用数据中的规律才能低 reconstruction error。
    - R 可以约束 weights、activations、Jacobian、latent distribution 或 corrupted-input invariance。
    - 维度本身不是 information capacity 的完整度量：高精度 real number 理论上可编码大量信息，network continuity、noise、regularization
      和 finite data 才决定实际能力。
  - title: 3. Stacked Autoencoders
    source_heading: 3. Stacked Autoencoders
    paragraphs:
    - 重要边界：强 AE 也可能很好地重构异常；某些 OOD 样本比 in-distribution 更容易重构。Threshold 还受 input scale/domain
      drift 影响。需要与 one-class SVM、isolation forest、density/feature-distance 方法比较。
    - 先用 AE 将 784 降到 32，再以 t-SNE/UMAP 降到 2：AE 负责 scalable nonlinear feature extraction，t-SNE
      负责 local-neighborhood visualization。t-SNE axes/global distances 没有直接语义，结果依 seed/perplexity，不能把
      cluster separation 当作 classifier accuracy。
    - 若 pretraining data 与 target domain 不同，或 reconstruction 学到背景/低层纹理而非 class features，negative
      transfer 可能发生。现代图像任务常用 contrastive learning、MAE/DINO 等更强 self-supervised objectives。
    - 它缓解早期深网 optimization，历史上很重要。现代 initialization、normalization、residual、optimizers
      已让 end-to-end training 更可行；逐层贪心也可能使局部 reconstruction objective 与最终任务不一致。
  - title: 4. Convolutional Autoencoders
    source_heading: 4. Convolutional Autoencoders
    paragraphs:
    - s stride、p padding、d dilation、k kernel、o_p output padding。
    - Transpose convolution 可能产生 checkerboard artifacts；nearest/bilinear upsampling
      + regular convolution 是替代。RNN/Transformer AE 可用于 sequences。
  - title: 6. Sparse Autoencoders
    source_heading: 6. Sparse Autoencoders
    paragraphs:
    - Overcomplete coding 通过每样本只激活少量 units 学 dictionary-like features。
    - L1 在 0 附近有固定 shrink pressure，倾向将不重要 activations 压到零；L2 更倾向均匀缩小所有 activations。若
      activation 是 ReLU，实际零值可直接衡量；Sigmoid 永不严格为零，常以平均 activation 表示 firing probability。
    - Batch 太小使 q estimate noisy；distributed training 若只用 local batch，global sparsity
      不一定正确。
    - Sparse codings 可能更 interpretable，但 unit 对人类概念的一一对应不是保证。
  - title: 7. Variational Autoencoders
    source_heading: 7. Variational Autoencoders
    paragraphs:
    - Encoder 输出 distribution parameters，而非单一点；decoder 输入 sample z。训练同时要求重构好、posterior
      不偏离 prior 太远，因此 prior samples 落入 decoder 熟悉区域。
    - 这就是式 18-3。它只在 q diagonal Gaussian、prior standard Gaussian 时有该 closed form。
    - 书中用 pixel-mean MSE，所以把 KL mean 再除 784 以匹配 scale；这里 BCE 对 pixels 求和再 batch mean，因此不除
      input dimension。
    - KL warmup/cyclical annealing、free bits、减弱 decoder 可缓解。
  - title: 9. Generative Adversarial Networks
    source_heading: 9. Generative Adversarial Networks
    paragraphs:
    - Game gradients 可围绕 equilibrium 旋转；D/G learning rates、update ratio、normalization、optimizer
      和 architecture 都影响 dynamics。D 太强或太弱都可能使 G 学不到。
    - Mini-batch discrimination 给 D batch 内相似度，使其识别缺乏 diversity 的 fake batch。其他手段：spectral
      normalization、label smoothing/noise、DiffAugment/ADA、feature matching、unrolled
      GAN、two-time-scale updates。
    - 应用：super-resolution、colorization、image editing、sketch-to-image、video prediction、data
      augmentation、audio/time-series generation、adversarial hard-example generation。DCGAN
      → Progressive GAN → StyleGAN 提升 resolution/control。
    - 评估：FID、KID、precision/recall、class coverage、memorization/privacy、human study。FID
      将 feature distributions 近似 Gaussian，依 extractor/sample count/preprocessing，不能跨不一致设置比较。
  - title: 10. Diffusion Models
    source_heading: 10. Diffusion Models
    paragraphs:
    - 直接把 simple noise 映射到复杂 image distribution 很难。Diffusion 构造一个已知 Markov forward
      process q，逐步将 data 变成近似 standard Gaussian；每一步变化很小，其 reverse conditional 也近似
      Gaussian，神经网络只需学习局部 denoising。
    - 经 MLP 后注入 U-Net 每个 resolution block。U-Net downsample 获取 global context，upsample
      恢复 spatial detail，skip connections 保留 high-resolution features；attention blocks
      建模 long-range relations。
    - 实际 model noise prediction 有误差，steps 太少会放大 discretization/model error。DDIM、DPM-Solver、Euler/Heun、consistency/distillation
      等 sampler 在 speed/quality 上各有取舍。
    - 优势：训练 objective 稳定、mode coverage 好、quality 高、conditioning 灵活、editing/inpainting/outpainting
      强。局限：多次 model evaluations 导致慢/耗能；guidance 和 sampler 调参；训练 data/licensing 风险；likelihood/quality
      指标与人类偏好不完全一致。
  - title: 14. 工程检查清单
    source_heading: 14. 工程检查清单
    paragraphs:
    - AE 同时报 train/validation、worst reconstructions 和 downstream probe；
    - Anomaly threshold 用独立 calibration set，报告 ROC/PR；
    - VAE 分别记录 reconstruction/KL，检测 posterior collapse；
    - GAN 固定 sample grid，同时评 quality、coverage、memorization；
  - title: 15. 本章总结
    source_heading: 15. 本章总结
    paragraphs:
    - Linear undercomplete AE + MSE 找 PCA principal subspace；nonlinear stacked/conv
      AE 学 manifold。
    - VAE 从 marginal likelihood 推出 ELBO，以 reparameterization 训练 stochastic encoder；Gaussian
      KL 让 prior sampling 可行。
    - GAN 的 optimal D 给出 JS objective，但 adversarial dynamics 会 mode collapse、振荡和超参敏感。
    - Latent diffusion 在 compressed spatial space 运行，显著降低高分辨率成本；Flow Matching 是更直接的
      velocity-field alternative。
  takeaways:
  - AE 通过 bottleneck/noise/sparsity 限制 identity，学习 reusable representation。
  - Denoising 学条件期望，sparse AE 用 L1/KL 控制少量 feature activation。
  - dVAE/Gumbel 与 VQ-VAE 将连续数据变 discrete tokens，Transformer 再学习 global grammar。
  - GAN 的 optimal D 给出 JS objective，但 adversarial dynamics 会 mode collapse、振荡和超参敏感。
  - Latent diffusion 在 compressed spatial space 运行，显著降低高分辨率成本；Flow Matching 是更直接的
    velocity-field alternative。
