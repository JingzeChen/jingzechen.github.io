overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章最终原则是：把所有不可避免的启动、配置和具体组装细节集中到可替换的 Main Plugin，再把控制权交给不依赖它的高层 Application。
  thesis_source: 19. 本章总结
  concepts:
  - term: 本章导读
    meaning: 本章没有数学公式，也没有需要推导的算法。重要的是理解对象图、依赖方向、生命周期与配置责任怎样集中到最外层。
    source_heading: 本章导读
  - term: 2.10 Main 应创建 Global Facilities
    meaning: Configuration Provider。
    source_heading: 2.10 Main 应创建 Global Facilities
  - term: 8.12 哪些内容可能应移出 Main
    meaning: 必须保证所有 Cavern 连通；
    source_heading: 8.12 哪些内容可能应移出 Main
  - term: 11.2 Test Main
    meaning: Test Message Bus。
    source_heading: 11.2 Test Main
  - term: 12.5 Graceful Shutdown
    meaning: 但业务补偿应委托给高层 Use Case，而不是写在 Signal Handler 中。
    source_heading: 12.5 Graceful Shutdown
  - term: 19. 本章总结
    meaning: Main 本身需要 Composition Test、Startup Smoke Test、Configuration Matrix Test
      与 Shutdown Test。
    source_heading: 19. 本章总结
  logic:
  - 本章导读
  - 2.10 Main 应创建 Global Facilities
  - 5. Hunt the Wumpus Main：配置数据
  - 11.2 Test Main
  - 11.10 Migration Main
  - 14.3 Composition Test
  - 19. 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - The Dirtiest of All the Dirty Components。
    - 初始化随机地图、玩家、Wumpus、蝙蝠、深坑与箭袋；
    - 把 Main 当作插件后，Configuration 不再需要侵入核心业务，而成为最外层组装选择。
    - 本章没有数学公式，也没有需要推导的算法。重要的是理解对象图、依赖方向、生命周期与配置责任怎样集中到最外层。
  - title: 1.8 Main 不是 Service Locator
    source_heading: 1.8 Main 不是 Service Locator
    paragraphs:
    - Main 可以创建并分发依赖，但业务对象不应随时回头向 Main 查询依赖。
    - Entity 访问全局 Container；
    - 任意模块调用 Service Locator。
  - title: 2.10 Main 应创建 Global Facilities
    source_heading: 2.10 Main 应创建 Global Facilities
    paragraphs:
    - Metrics Registry；
    - Configuration Provider。
  - title: 5. Hunt the Wumpus Main：配置数据
    source_heading: 5. Hunt the Wumpus Main：配置数据
    paragraphs:
    - 作者展示近期版本 Hunt the Wumpus 的 Main Component。
    - 这让 Main 的后续命令循环面向高层游戏接口，而不是直接操作具体 Facade。
    - 若生命规则本身变复杂，应由 PlayerManagement 管理；Main 只提供初始条件。
    - 这些影响规则应进入更高层 Game Policy，而不是藏在 Main 的 String 中。
  - title: 8.12 哪些内容可能应移出 Main
    source_heading: 8.12 哪些内容可能应移出 Main
    paragraphs:
    - 必须保证所有 Cavern 连通；
    - 这些规则应进入可测试的 Map Generation Strategy，而不是留在 Main。
  - title: 11.2 Test Main
    source_heading: 11.2 Test Main
    paragraphs:
    - Deterministic Clock；
    - In-Memory Gateway；
    - Capturing Presenter；
    - Test Message Bus。
  - title: 11.10 Migration Main
    source_heading: 11.10 Migration Main
    paragraphs:
    - Migration Runner；
    - Source / Target Data Adapter；
  - title: 12.5 Graceful Shutdown
    source_heading: 12.5 Graceful Shutdown
    paragraphs:
    - Framework Shutdown Event；
    - Process Cancellation；
    - 但业务补偿应委托给高层 Use Case，而不是写在 Signal Handler 中。
  - title: 14.3 Composition Test
    source_heading: 14.3 Composition Test
    paragraphs:
    - Production 绑定正确；
    - Application 可启动。
  - title: 19. 本章总结
    source_heading: 19. 本章总结
    paragraphs:
    - Logger、Metrics、Clock、Scheduler 等 Global Facilities 应由 Main 创建并显式注入，不必做成全局单例。
    - Main Plugin 设置 Initial Conditions、选择 Configuration、收集 Outside Resources 并交出控制权。
    - Main 本身需要 Composition Test、Startup Smoke Test、Configuration Matrix Test 与 Shutdown
      Test。
    - 本章最终原则是：把所有不可避免的启动、配置和具体组装细节集中到可替换的 Main Plugin，再把控制权交给不依赖它的高层 Application。
  takeaways:
  - 第 26 章解释每个系统中负责创建、协调和监督其他组件的 Main Component。
  - Framework 可以帮助注册、解析和管理对象图，但 Entity / Use Case 不应依赖容器 API。
  - 现代系统也可以使用显式 Factory Binding、DI Registration 或 Service Provider Interface。
  - 不同 Main 可以避免一个巨型环境条件入口，但共享 Builder 也不应隐藏真实差异。
  - 本章最终原则是：把所有不可避免的启动、配置和具体组装细节集中到可替换的 Main Plugin，再把控制权交给不依赖它的高层 Application。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「17.1 “Main 只是三行启动代码”」？
  answer: 不一定。它是整个组装组件，可能包含配置、Factory、生命周期与多个模块。
  source_heading: 17.1 “Main 只是三行启动代码”
- level: 概念辨析
  question: 原文如何解释「17.6 “核心可以调用 Main 获取依赖”」？
  answer: 错误。这会使核心反向依赖最外层，并形成 Service Locator。
  source_heading: 17.6 “核心可以调用 Main 获取依赖”
- level: 概念辨析
  question: 原文如何解释「17.13 “Map Creation 在原书 Main，所以地图规则都应放 Main”」？
  answer: 错误。示例简单；复杂合法性与难度规则应进入可测试 Map Generator。
  source_heading: 17.13 “Map Creation 在原书 Main，所以地图规则都应放 Main”
- level: 概念辨析
  question: 原文如何解释「17.17 “不同国家规则都属于 Main”」？
  answer: 错误。Main 选择 Jurisdiction Strategy；规则本身若是关键业务政策，应位于高层实现。
  source_heading: 17.17 “不同国家规则都属于 Main”
- level: 概念辨析
  question: 原文如何解释「17.19 “Main 不需要测试，因为核心不依赖它”」？
  answer: 错误。组装错误会让系统无法运行，需要 Composition、Startup 与 Configuration Test。
  source_heading: 17.19 “Main 不需要测试，因为核心不依赖它”
