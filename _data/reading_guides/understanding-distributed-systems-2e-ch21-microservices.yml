overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0.1 从技术扩展转向开发扩展」建立了怎样的核心认识？
  question_source: 0.1 从技术扩展转向开发扩展
  thesis: Chapter 21 指出 gateway 会成为 development bottleneck、aggregate traffic point
    和新运维服务，因此必须 scalable；其 highly available 要求是原书 Chapter 22 开头的前瞻结论。
  thesis_source: 33. 核心结论
  concepts:
  - term: 0.1 从技术扩展转向开发扩展
    meaning: 当业务组件和开发团队持续增加时，如何让多个团队独立理解、修改、部署和运营系统？
    source_heading: 0.1 从技术扩展转向开发扩展
  - term: 8.1 Loose coupling 的判据
    meaning: Independent release/test。
    source_heading: 8.1 Loose coupling 的判据
  - term: 13.3 何时 peel off
    meaning: 不好的理由：trend、简历技术、每个 module 都“应该 micro”。
    source_heading: 13.3 何时 peel off
  - term: 16. Core responsibility 2：Composition
    meaning: 并行需 bounded concurrency，避免一个 request fan-out 数十 calls，造成 gateway memory/connection
      和 downstream load amplification。
    source_heading: 16. Core responsibility 2：Composition
  - term: 23. Security token propagation
    meaning: Gateway authentication 成功后创建/取得 security token，随 request 传给 internal
      service，service 再按需传 downstream。
    source_heading: 23. Security token propagation
  - term: 34. 一般化的解决问题方法
    meaning: Gateway/platform/auth/control plane 都会成为共享 dependency。多实例、容量、last-known-good
      config、rate limit、degradation 和 drills 必不可少。
    source_heading: 34. 一般化的解决问题方法
  logic:
  - 0.1 从技术扩展转向开发扩展
  - 8.1 Loose coupling 的判据
  - 10. Caveat 5：Testing
  - 16. Core responsibility 2：Composition
  - 19.3 Gateway caching
  - 28.2 Modular monolith 与 distributed monolith
  - 34. 一般化的解决问题方法
  sections:
  - title: 0.1 从技术扩展转向开发扩展
    source_heading: 0.1 从技术扩展转向开发扩展
    paragraphs:
    - CDN/file store 减少 application 工作；
    - Load balancer 复制 stateless compute；
    - Database replication/partitioning 扩展 data layer；
    - 当业务组件和开发团队持续增加时，如何让多个团队独立理解、修改、部署和运营系统？
  - title: 4. 技术和数据自治
    source_heading: 4. 技术和数据自治
    paragraphs:
    - 例如 image processing 可用 GPU/C++，billing 可用 relational transaction，search 可用 inverted
      index。
    - 作者明确说 service 不需要很小。Service 若 functionality 太少，只增加 operational overhead。
    - 这接近“deep module”原则：简单 contract 背后隐藏足够复杂和 cohesive 的实现。
    - 一个代码量大的 cohesive service 可能比十个互相锁步的小服务更“microservice-like”。
  - title: 8.1 Loose coupling 的判据
    source_heading: 8.1 Loose coupling 的判据
    paragraphs:
    - Consumer compatibility；
    - No shared mutable database；
    - No lockstep library update；
    - Independent release/test。
  - title: 10. Caveat 5：Testing
    source_heading: 10. Caveat 5：Testing
    paragraphs:
    - Component tests with local dependencies；
    - 全系统 end-to-end environment 昂贵、慢且 flaky，也难覆盖所有组合。
    - Contract tests 证明接口兼容，不证明生产规模下所有 emergent behavior；两者需结合。
    - 不可能穷举。必须依赖 backward compatibility、contract、incremental rollout 和 telemetry，而不是测试所有全局版本组合。
  - title: 13.3 何时 peel off
    source_heading: 13.3 何时 peel off
    paragraphs:
    - 一个 domain/team 需要独立 release cadence；
    - Different scale/resource profile；
    - Monolith build/deploy contention 已可测；
    - 不好的理由：trend、简历技术、每个 module 都“应该 micro”。
  - title: 16. Core responsibility 2：Composition
    source_heading: 16. Core responsibility 2：Composition
    paragraphs:
    - 这样整体 semantic availability 高于所有调用都 required，但 client contract 必须允许 degraded
      response。
    - 并行需 bounded concurrency，避免一个 request fan-out 数十 calls，造成 gateway memory/connection
      和 downstream load amplification。
    - Avoid composition requiring impossible snapshot consistency。
    - Gateway 不应成为所有 domain inconsistency 的中央修复器；规则属于 owning domain。
  - title: 19.3 Gateway caching
    source_heading: 19.3 Gateway caching
    paragraphs:
    - Principal/tenant；
    - Authorization visibility；
    - Freshness/invalidation。
    - 尤其 GraphQL response cache key 复杂，不能把不同字段集或权限的响应混用。
  - title: 23. Security token propagation
    source_heading: 23. Security token propagation
    paragraphs:
    - Gateway authentication 成功后创建/取得 security token，随 request 传给 internal service，service
      再按需传 downstream。
    - Token 内嵌 claims，service 本地验证 signature 和 claims，无 introspection call。
    - Longer-lived refresh credential 仅给 client/auth service；
    - Service checks current domain state for critical authorization。
  - title: 28.2 Modular monolith 与 distributed monolith
    source_heading: 28.2 Modular monolith 与 distributed monolith
    paragraphs:
    - Modular monolith：一个 deployable，内部边界清楚；
    - Distributed monolith：多个 deployables，但 API/data/release 锁步。
  - title: 34. 一般化的解决问题方法
    source_heading: 34. 一般化的解决问题方法
    paragraphs:
    - 区分 runtime QPS、data capacity、team throughput、release isolation、security boundary。不同问题需要不同
      decomposition。
    - 为每条 edge 定义 schema、compatibility、deadline、retry、idempotency、auth、consistency
      和 observability。
    - 对 composed call graph 计算 required dependency availability 和 max/sum latency，主动将非关键
      dependency 设计为 optional/degraded。
    - Gateway/platform/auth/control plane 都会成为共享 dependency。多实例、容量、last-known-good
      config、rate limit、degradation 和 drills 必不可少。
  takeaways:
  - Microservices 首要扩展团队独立交付能力，不自动提高运行时吞吐。
  - Microservice complexity 只有能在许多 teams 间摊销时才值得。
  - 数据分散使跨服务强 transaction 昂贵；eventual consistency 仍需 outbox、idempotency、ordering 和
    reconciliation。
  - Generic edge concerns 如 cache、rate limit、AuthN 可集中；rich domain logic/AuthZ 应留在
    owning service。
  - 服务/API 足够多时 gateway 往往值得；自建 NGINX 或 managed gateway 都不消除 contract/policy ownership。
