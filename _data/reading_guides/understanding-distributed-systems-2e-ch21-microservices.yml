checks:
- level: 概念辨析
  question: 原文如何解释「28.1 Microservices 与 horizontal scaling」？
  answer: Monolith 可多实例 scale；microservices 首要解决 independent ownership/deployment，不自动提高
    runtime throughput。
  source_heading: 28.1 Microservices 与 horizontal scaling
- level: 概念辨析
  question: 原文如何解释「28.9 Translation 与 tunneling」？
  answer: Translation 理解并映射两种 protocol semantics；简单转发 bytes 不等于 REST/gRPC 正确转换。
  source_heading: 28.9 Translation 与 tunneling
- level: 概念辨析
  question: 原文如何解释「29.3 “每个团队自由选技术就是自治”」？
  answer: 没有 paved road 会产生 unsupported stacks、security lag 和 duplicated libraries。
  source_heading: 29.3 “每个团队自由选技术就是自治”
- level: 概念辨析
  question: 原文如何解释「29.10 “一开始就拆 microservices 为未来做准备”」？
  answer: 未知边界会高成本固化；先 modular monolith，等真实 team/scale pain 再拆。
  source_heading: 29.10 “一开始就拆 microservices 为未来做准备”
- level: 概念辨析
  question: 原文如何解释「29.18 “Gateway 应实现所有 cross-cutting 和业务逻辑”」？
  answer: 会形成新的 edge monolith/development bottleneck。只集中 truly generic edge policy。
  source_heading: 29.18 “Gateway 应实现所有 cross-cutting 和业务逻辑”
