checks:
- level: 概念辨析
  question: 原文如何解释「10.1 酒店预订的是 Room Type，不是具体 Room」？
  answer: 房号在 Check-in 分配；Airbnb Listing 才更接近具体资源预订。
  source_heading: 10.1 酒店预订的是 Room Type，不是具体 Room
- level: 概念辨析
  question: 原文如何解释「10.12 Pessimistic Lock 不是永远最慢」？
  answer: 高争用下等待一次可能比大量乐观 Retry 更稳定；低争用时锁开销才显得不划算。
  source_heading: 10.12 Pessimistic Lock 不是永远最慢
- level: 概念辨析
  question: 原文如何解释「10.18 hash(hotel_id) % N 不利于在线扩容」？
  answer: N 变化会大量重映射。可用 Virtual Shard/Directory 保持稳定路由。
  source_heading: 10.18 hash(hotel_id) % N 不利于在线扩容
- level: 概念辨析
  question: 原文如何解释「10.22 CDC 通常是 At-least-once」？
  answer: Cache Consumer 要按 Version 幂等，处理重复与乱序。
  source_heading: 10.22 CDC 通常是 At-least-once
- level: 概念辨析
  question: 原文如何解释「10.27 Saga Compensation 不是真正回滚时间」？
  answer: 支付退款、释放库存可能有费用、延迟和外部可见副作用，不能假设世界回到从未发生。
  source_heading: 10.27 Saga Compensation 不是真正回滚时间
