overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章定位：可维护性从“敢于改变”开始」建立了怎样的核心认识？
  question_source: 0. 本章定位：可维护性从“敢于改变”开始
  thesis: Safety 要求坏事永不发生；liveness 要求好事最终发生，后者依赖 fairness assumptions。
  thesis_source: 31. 核心结论
  concepts:
  - term: 0. 本章定位：可维护性从“敢于改变”开始
    meaning: 系统若每次改动都可能悄悄破坏旧行为，团队最终会害怕修改它。测试的核心价值不是证明今天写的代码“看起来正确”，而是给未来的改变建立快速反馈。
    source_heading: 0. 本章定位：可维护性从“敢于改变”开始
  - term: 6. 29.2 Size：测试消耗多少计算资源
    meaning: Test size 反映运行测试所需的 computing resources，例如 node 数与 I/O。Scope 和 size 往往相关，但不是同一概念。
    source_heading: 6. 29.2 Size：测试消耗多少计算资源
  - term: 14.1 为什么传统测试不够
    meaning: Network partition 遇上 membership change。
    source_heading: 14.1 为什么传统测试不够
  - term: 17. Safety 与 liveness
    meaning: 反之，只追求 eventually complete 可能破坏 safety，例如两个 leader 同时提交冲突值。
    source_heading: 17. Safety 与 liveness
  - term: 23. 可运行 Python 示例：测试替身与 dual-write 状态搜索
    meaning: 小型 BFS 搜索两个 writers 的 reachable state graph，输出 Figure 29.3 型 counterexample。
    source_heading: 23. 可运行 Python 示例：测试替身与 dual-write 状态搜索
  - term: 32. 解决问题的一般思路
    meaning: Model trace -> regression/fault-injection test -> release gate -> runtime
      invariant/alert，形成持续证据链。
    source_heading: 32. 解决问题的一般思路
