checks:
- level: 概念辨析
  question: 原文如何解释「25.1 Scope 与 size」？
  answer: Scope 是 SUT 覆盖范围；size 是 process/node/I/O 资源。相关但不同。
  source_heading: 25.1 Scope 与 size
- level: 概念辨析
  question: 原文如何解释「25.8 E2E 与 user journey」？
  answer: User journey 是减少 E2E setup 重复的一种组织方式，不代表所有 E2E 都应合为一条。
  source_heading: 25.8 E2E 与 user journey
- level: 概念辨析
  question: 原文如何解释「26.1 “测试通过说明没有 bug”」？
  answer: 只说明已表达场景未发现违反；unimagined/emergent behavior 仍存在。
  source_heading: 26.1 “测试通过说明没有 bug”
- level: 概念辨析
  question: 原文如何解释「26.8 “Flaky test 重跑通过就没事”」？
  answer: 重跑掩盖 nondeterminism 并腐蚀信任。隔离、修复或删除无价值测试。
  source_heading: 26.8 “Flaky test 重跑通过就没事”
- level: 概念辨析
  question: 原文如何解释「26.15 “消息队列天然 exactly-once 且全局有序”」？
  answer: 需要明确 partition/order、delivery、dedup、idempotency 和 durable publication。
  source_heading: 26.15 “消息队列天然 exactly-once 且全局有序”
