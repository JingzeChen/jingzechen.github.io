  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 做完当前选择后，剩余问题是否仍是同类问题？
    - 若条件不成立，反例是什么，应改用 DP、搜索还是图算法？
    - 本章中的常见正确性工具包括交换论证、领先法、归纳法、反证法、割性质与最短路标签确定性。
    - 例 22-1 和例 22-2 分别承载“贪心法概述”和“区间问题”的基础实现，因此例题数与基础单元数不再重复累加。每个基础单元和正文题都在下一个同级题目标题前给出一个就地
      C++17 代码块；Python 与 Go 只保留在章末附录。
  - title: 22.1 贪心法概述
    source_heading: 22.1 贪心法概述
    paragraphs:
    - 贪心并不等于“没有状态”。双指针位置、当前资本、堆中可选项目、已连接顶点集合和最短距离标签都是状态；区别在于算法能证明某些候选已永久失去竞争资格。
    - 给定正整数 x，寻找十进制正整数 y，使 y 的各位数字乘积为 x，并让 y 最小。若不存在或超过 32 位有符号整数，返回 0。
    - 为什么优先取大因子？把多个较小数字合并为不超过 9 的乘积，通常可减少位数；正整数的位数越少，数值一定越小。得到因子后必须按升序排列为十进制位，才能让高位尽可能小。
    - 代码中的两段循环分别对应证明中的两步：先从 9 到 2 合并出尽量少的数字，再逆序写入，使十进制高位尽量小。构造前检查上界，避免依赖有符号溢出。
  - title: 22.2 常见的贪心法求解问题
    source_heading: 22.2 常见的贪心法求解问题
    paragraphs:
    - 因为每组只由最大任务决定完成时间，把大任务集中在同一组可让后面 3 个大任务“藏”在组最大值下，而不是成为其他组的最大值。
    - 为什么同宽高度要降序？若同宽按高度升序，它们会被高度 LIS 同时选择，错误地把宽度相等的信封套在一起。降序后，同宽组的高度不可能形成严格递增子序列，最多选择一个。
    - 每个苹果价值相同：都让计数增加 1；唯一成本是重量，篮子容量固定为 5000。为了让所选数量最大，应优先选择最轻苹果。
    - 题设的非负利润保证选中项目后资本不会下降，可行项目集合只扩不缩。若接口允许负利润且仍是“至多选择”，弹出前还必须在堆顶不为正时停止。
  - title: 22.3 区间问题
    source_heading: 22.3 区间问题
    paragraphs:
    - LeetCode 各题定义不同：无重叠区间和会议通常允许前一个结束时后一个立刻开始；气球端点相等时同一支箭能同时击破；合并区间的闭端点相等时应合并。
    - 更标准的刺点论证是：最早结束区间必须被某箭击中，把该箭移到其右端点不会失去任何同时包含原箭且右端点不早于该点的相关区间，由此可固定一次贪心选择。
    - 按开始时间升序处理会议，用小根堆为每个已经分配的房间保存一个下一空闲时间，即该房间最后安排会议的结束时间。某些堆项可能已经不晚于当前开始时刻，表示对应房间空闲，并不表示它仍被实时占用。
    - 每处理一个会议只需要一个房间：若堆顶已空闲，弹出这一项并把当前结束时间写回，相当于复用一间房；否则所有已分配房间都忙，新增一个堆项。因而循环前后每个已分配房间始终恰有一个下一空闲时间，堆大小就是已分配房间数，最终值即答案，而不是每一步的实时占用数。
  - title: 22.4 Prim 和 Kruskal 算法及其应用
    source_heading: 22.4 Prim 和 Kruskal 算法及其应用
    paragraphs:
    - 若当前已选边集 A 是某棵 MST 的子集，且割尊重 A（A 中没有边跨越该割），那么该割上权值最小的横切边是安全边：存在一棵包含 A 和该边的 MST。
    - 当前森林每个连通分量内部已有选边。对连接两个不同分量的当前最轻边，取其中一个分量作为割的一侧；已选边不会跨该割，而当前边是所有尚未处理横切边中的最轻者。由割性质可安全加入。
    - 每栋房子可以自己建井，也可通过管道连接到有井的房子。关键难点是井的数量未知，不能简单选择一口最便宜井再给房屋图做 MST；最优方案可能建多口井以避免昂贵管道。
    - 样例中可选择房子 1 和 4 建井，再用管道连接相关房屋，总成本 15；“最便宜井 1 + 原房屋图 MST 16”得到 17，并非最优。
  - title: 22.5 Dijkstra 算法及其应用
    source_heading: 22.5 Dijkstra 算法及其应用
    paragraphs:
    - 负边让路径前缀在扩展后反而变得更优，标签确定性的关键不等式失效；应改用 Bellman-Ford 等允许反复修正的算法。
    - 路径继续延长时体力不会下降。因此当前最小标签弹出后，任何经过更大未确定标签的绕路都不可能把瓶颈降到更小，标签确定性证明仍成立。
    - 补充：二分与 MST。 可二分体力阈值，用 BFS 判断只走差值不超过阈值的边是否连通；也可按边权做 Kruskal，起点终点首次连通时的边权就是最小瓶颈。三种方法都利用瓶颈单调性。
    - 所有扩展费用非负，可在扩展状态图上运行 Dijkstra。第一次弹出任意折扣层的目标城市时，即为“至多 D 次”的全局最小费用。
  - title: 1. 使用堆不等于使用贪心
    source_heading: 1. 使用堆不等于使用贪心
    paragraphs:
    - 没被选中的候选是否仍被正确保留；
    - 状态是否包含决定未来的全部信息。
    - IPO 的利润堆有交换论证；Dijkstra 的距离堆有非负边权下的标签确定性；若缺少这些性质，换成堆不会自动得到正确算法。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 本章的核心不是记住“排序后取最大/最小”，而是识别一个局部选择能否被固定到某个全局最优解中。
    - 用交换、领先、归纳或割性质证明。 若找得到反例，就回到 DP、搜索或更完整状态，而不是补特殊判断。
    - 选择服务于不变量的数据结构。 排序固定全局顺序，双指针维护边界，单调栈处理高位优先，堆维护动态候选，并查集判断跨分量安全边。
    - 从普通排序贪心，到区间交换论证，再到 MST 割性质与 Dijkstra 标签确定性，本章展示了同一个思想的不同层次：每一步都只做当前选择，但必须证明该选择不会封死通往全局最优解的道路。
  takeaways:
  - 本章的核心不是记住“排序后取最大/最小”，而是识别一个局部选择能否被固定到某个全局最优解中。
  - 提出可证伪的贪心选择。 例如最早结束、最远延伸、当前最大利润、割上最轻边或当前最优路径标签。
  - 用交换、领先、归纳或割性质证明。 若找得到反例，就回到 DP、搜索或更完整状态，而不是补特殊判断。
  - 尊重题目边界。 区间开闭、负边权、相等元素、溢出和资源维度都可能决定证明是否成立。
  - 从普通排序贪心，到区间交换论证，再到 MST 割性质与 Dijkstra 标签确定性，本章展示了同一个思想的不同层次：每一步都只做当前选择，但必须证明该选择不会封死通往全局最优解的道路。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 使用堆不等于使用贪心」？
  answer: IPO 的利润堆有交换论证；Dijkstra 的距离堆有非负边权下的标签确定性；若缺少这些性质，换成堆不会自动得到正确算法。
  source_heading: 1. 使用堆不等于使用贪心
- level: 概念辨析
  question: 原文如何解释「2. 最小生成树不等于最短路径树」？
  answer: 最短路径树要求源点到每个顶点的树上距离分别最短。前者依靠割性质选边，后者依靠路径松弛确定距离，两种目标不能互换。
  source_heading: 2. 最小生成树不等于最短路径树
- level: 概念辨析
  question: 原文如何解释「3. “到同一位置”未必是同一状态」？
  answer: 只保留每个位置的单一最优数值，会错误剪掉“当前稍贵但资源剩余更多”的路径。
  source_heading: 3. “到同一位置”未必是同一状态
- level: 概念辨析
  question: 原文如何解释「4. 广义 Dijkstra 需要路径扩展单调」？
  answer: 可否提前确定标签，关键不是公式必须相加，而是优先级沿路径扩展不会向更优方向反转。
  source_heading: 4. 广义 Dijkstra 需要路径扩展单调
- level: 概念辨析
  question: 原文如何解释「5. 排序会修改输入」？
  answer: 三种语言的示例为了简洁，多数排序函数直接修改传入数组/切片（C++ 按值传入的函数除外）。若调用者还要使用原顺序，应先复制；工程接口需明确这一副作用。
  source_heading: 5. 排序会修改输入
