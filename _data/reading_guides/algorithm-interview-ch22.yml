  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 本章的核心不是记住“排序后取最大/最小”，而是识别一个局部选择能否被固定到某个全局最优解中。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 例 22-1 和例 22-2 分别承载“贪心法概述”和“区间问题”的基础实现，因此例题数与基础单元数不再重复累加。每个基础单元和正文题都在下一个同级题目标题前给出一个就地
      C++17 代码块；Python 与 Go 只保留在章末附录。
    source_heading: 本章要解决什么问题
  - term: 22.1 贪心法概述
    meaning: 为什么优先取大因子？把多个较小数字合并为不超过 9 的乘积，通常可减少位数；正整数的位数越少，数值一定越小。得到因子后必须按升序排列为十进制位，才能让高位尽可能小。
    source_heading: 22.1 贪心法概述
  - term: 22.3 区间问题
    meaning: 每处理一个会议只需要一个房间：若堆顶已空闲，弹出这一项并把当前结束时间写回，相当于复用一间房；否则所有已分配房间都忙，新增一个堆项。因而循环前后每个已分配房间始终恰有一个下一空闲时间，堆大小就是已分配房间数，最终值即答案，而不是每一步的实时占用数。
    source_heading: 22.3 区间问题
  - term: 22.4 Prim 和 Kruskal 算法及其应用
    meaning: 当前森林每个连通分量内部已有选边。对连接两个不同分量的当前最轻边，取其中一个分量作为割的一侧；已选边不会跨该割，而当前边是所有尚未处理横切边中的最轻者。由割性质可安全加入。
    source_heading: 22.4 Prim 和 Kruskal 算法及其应用
  - term: 1. 使用堆不等于使用贪心
    meaning: IPO 的利润堆有交换论证；Dijkstra 的距离堆有非负边权下的标签确定性；若缺少这些性质，换成堆不会自动得到正确算法。
    source_heading: 1. 使用堆不等于使用贪心
  - term: 本章总结
    meaning: 从普通排序贪心，到区间交换论证，再到 MST 割性质与 Dijkstra 标签确定性，本章展示了同一个思想的不同层次：每一步都只做当前选择，但必须证明该选择不会封死通往全局最优解的道路。
    source_heading: 本章总结
