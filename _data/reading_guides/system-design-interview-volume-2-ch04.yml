overview:
  kind: summary
  minutes: 8
  question: 0. 为什么需要消息队列？
  question_source: 0. 为什么需要消息队列
  thesis: Batching 是贯穿端到端的性能核心。 Producer、复制和 Consumer 都用批次摊销网络、系统调用和磁盘开销。
  thesis_source: 7. 核心结论
  concepts:
  - term: 0. 为什么需要消息队列
    meaning: 提高可用性：某个消费者暂时离线时，生产者仍能写入队列；消费者恢复后追赶积压。
    source_heading: 0. 为什么需要消息队列
  - term: 核心服务与存储
    meaning: Coordination Service：Broker 存活发现、Leader 选举、Consumer 协调与分区分配。
    source_heading: 核心服务与存储
  - term: Push Model
    meaning: 每个 Consumer 要维护发送缓冲和背压状态。
    source_heading: Push Model
  - term: 3.10.5 Rebalance 的代价
    meaning: 生产系统可采用 Sticky/Cooperative Rebalance 减少不必要迁移，但本章使用全组重新加入的概念模型。
    source_heading: 3.10.5 Rebalance 的代价
  - term: 3.20 如何估算 Partition 数
    meaning: Partition 太少限制并行，太多会增加元数据、文件、选主和 Rebalance 成本。
    source_heading: 3.20 如何估算 Partition 数
  - term: 8. 解决分布式消息系统问题的一般思路
    meaning: 本章最值得迁移的方法是：把消息系统看成“分区、复制、可定位的追加日志”，再分别用 Offset、Consumer Group 和提交顺序解决重放、并行与交付语义；每一项更强保证都会在吞吐、延迟、容量或协调复杂度上付费。
    source_heading: 8. 解决分布式消息系统问题的一般思路
  logic:
  - 0. 为什么需要消息队列
  - 核心服务与存储
  - 3.4 为什么磁盘也能高吞吐
  - 3.10.5 Rebalance 的代价
  - 3.16 ACK=all、ACK=1、ACK=0
  - 两种 Timing 实现
  - 8. 解决分布式消息系统问题的一般思路
  sections:
  - title: 0. 为什么需要消息队列
    source_heading: 0. 为什么需要消息队列
    paragraphs:
    - 解耦：生产者只遵守消息契约，不必知道每个消费者的地址、部署和处理细节。
    - 独立扩展：生产端与消费端可按各自负载扩缩容。
    - 提高可用性：某个消费者暂时离线时，生产者仍能写入队列；消费者恢复后追赶积压。
    - 提高性能：生产者不必等待下游业务完成，消费者按自身节奏异步处理。
  - title: 2.1 基本角色
    source_heading: 2.1 基本角色
    paragraphs:
    - Producer：向特定 Topic 发布消息；
    - Consumer：订阅并拉取消息；
    - Message Queue Service：在中间持久化、路由和复制，解耦两端。
    - Producer 和 Consumer 是客户端，Broker 是服务端；双方通过网络协议交换批次、ACK、Offset 和心跳。
  - title: 核心服务与存储
    source_heading: 核心服务与存储
    paragraphs:
    - Broker：承载多个 Partition 副本；
    - State Storage：保存 Group 分区分配和消费 Offset；
    - Metadata Storage：保存 Topic 配置、分区数、保留期、Replica Distribution Plan；
    - Coordination Service：Broker 存活发现、Leader 选举、Consumer 协调与分区分配。
  - title: 3.4 为什么磁盘也能高吞吐
    source_heading: 3.4 为什么磁盘也能高吞吐
    paragraphs:
    - 现代操作系统积极用空闲内存缓存文件页。
    - "“数据在磁盘”不等于每次读都访问物理盘；反过来，也不能把 OS Cache 当耐久副本。ACK 是否表示真正落盘，要由刷盘与复制策略定义。"
  - title: Push Model
    source_heading: Push Model
    paragraphs:
    - Broker 决定速度，慢 Consumer 容易被压垮；
    - 不同 Consumer 能力不同，流控复杂；
    - 批处理困难，Broker 不知道 Consumer 何时准备好；
    - 每个 Consumer 要维护发送缓冲和背压状态。
  - title: 3.10.5 Rebalance 的代价
    source_heading: 3.10.5 Rebalance 的代价
    paragraphs:
    - Partition Ownership 转移；
    - 大 Group 会形成协调尖峰。
    - 生产系统可采用 Sticky/Cooperative Rebalance 减少不必要迁移，但本章使用全组重新加入的概念模型。
  - title: 3.16 ACK=all、ACK=1、ACK=0
    source_heading: 3.16 ACK=all、ACK=1、ACK=0
    paragraphs:
    - Leader ACK 后、复制前故障可能丢消息。
    - Producer 不知道 Broker 是否收到；
    - 网络、Leader 变化或 Broker 故障均可能静默丢失；
    - 这三个值调节的是 Producer 到 Broker 的确认耐久性，不直接等同于端到端 Exactly-once。
  - title: 3.20 如何估算 Partition 数
    source_heading: 3.20 如何估算 Partition 数
    paragraphs:
    - 每 Broker 文件句柄和内存；
    - Partition 太少限制并行，太多会增加元数据、文件、选主和 Rebalance 成本。
  - title: 两种 Timing 实现
    source_heading: 两种 Timing 实现
    paragraphs:
    - 预定义 Delay Level Topic：1s、5s、10s、30s、1m 等固定档位；简单高效，但不能任意精度。
    - Hierarchical Timing Wheel：多个不同刻度的环形槽管理大量计时器，插入/推进成本低，适合海量延时任务。
    - Broker 重启后计时状态恢复；
  - title: 8. 解决分布式消息系统问题的一般思路
    source_heading: 8. 解决分布式消息系统问题的一般思路
    paragraphs:
    - 选择 Replica Factor、故障域、ISR、Minimum ISR、ACK 和刷盘策略。逐个演练 Leader、Follower、Broker、Coordinator
      和 Consumer 故障。
    - 确定丢失与重复哪个更危险，再决定 Producer 重试、Offset 提交和下游幂等/事务。默认优先 At-least-once + 幂等。
    - 新增 Broker 后先建副本、追平、切 Leader，再删旧副本；Partition 数变化前评估 Key 顺序和 Consumer Rebalance。
    - 本章最值得迁移的方法是：把消息系统看成“分区、复制、可定位的追加日志”，再分别用 Offset、Consumer Group 和提交顺序解决重放、并行与交付语义；每一项更强保证都会在吞吐、延迟、容量或协调复杂度上付费。
  takeaways:
  - 需求决定它是 Queue 还是 Log。 长保留、重放和分区顺序使本章更接近事件流平台。
  - Batching 是贯穿端到端的性能核心。 Producer、复制和 Consumer 都用批次摊销网络、系统调用和磁盘开销。
  - Offset 把消费进度从消息生命周期中分离。 消息按 Retention 保存，各 Group 自己决定读到哪里。
  - 增加 Partition 容易，减少 Partition 延迟很长。 旧数据不迁移，退役分区要等 Retention 后释放。
  - 高级功能不应破坏主日志路径。 Tag 用元数据过滤，Delay 用独立计时存储，Retry 用专用 Topic/DLQ，历史用冷归档。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5.1 队列与事件流平台不是完全相同」？
  answer: 传统 Queue 常在 ACK 后删除；本章日志按 Retention 保留，由 Group Offset 决定读取位置。
  source_heading: 5.1 队列与事件流平台不是完全相同
- level: 概念辨析
  question: 原文如何解释「5.10 Rebalance 不只是重新平均一下」？
  answer: 它会暂停、迁移 Ownership、使缓存变冷并制造重复消费窗口，应监控频率与时长。
  source_heading: 5.10 Rebalance 不只是重新平均一下
- level: 概念辨析
  question: 原文如何解释「5.18 Committed Offset 有两种常见语境」？
  answer: Consumer Group Committed Offset：该组已处理到哪里。
  source_heading: 5.18 Committed Offset 有两种常见语境
- level: 概念辨析
  question: 原文如何解释「5.24 复制与分区解决不同问题」？
  answer: Replica 会放大存储/网络，不增加同分区写并行。
  source_heading: 5.24 复制与分区解决不同问题
- level: 概念辨析
  question: 原文如何解释「5.30 Retention 与 Consumer ACK 解耦」？
  answer: 事件流中所有 Group 都读完也不一定删除；到期时某 Group 没读完也可能被截断。
  source_heading: 5.30 Retention 与 Consumer ACK 解耦
