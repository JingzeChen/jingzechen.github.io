overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章最终结论是：架构师需要一双警觉的眼睛，持续识别变化轴与摩擦，并在恰当时机以恰当强度建立边界。
  thesis_source: 17. 本章总结
  concepts:
  - term: 本章导读
    meaning: 原书明确说明：这个游戏可能只需约 200 行 Kornshell 代码，现实中不应套用完整 Clean Architecture。作者故意把简单问题放大，是为了用它代替一个真正庞大的系统，让潜在变化轴和边界决策更容易观察。
    source_heading: 本章导读
  - term: 3.6 为什么 API 不能由 English UI 定义
    meaning: Spanish 只能翻译 English String；
    source_heading: 3.6 为什么 API 不能由 English UI 定义
  - term: 7. Figure 25.4：简化后的依赖图
    meaning: 为了看清高层结构，Figure 25.4 暂时删除这些变化，只保留 API Component。
    source_heading: 7. Figure 25.4：简化后的依赖图
  - term: 9. Crossing the Streams：加入 Network
    meaning: Network 成为新的低层组件，通过高层定义的 API 与 GameRules 通信。
    source_heading: 9. Crossing the Streams：加入 Network
  - term: 14.3 发现语言与渠道变化
    meaning: 自然语言与传递渠道应独立变化，类似 Wumpus 的 Language / TextDelivery。
    source_heading: 14.3 发现语言与渠道变化
  - term: 17. 本章总结
    meaning: 原书进一步假设 Massive Multiplayer 版本，让 MoveManagement 在客户端运行、PlayerManagement
      在服务器运行。
    source_heading: 17. 本章总结
  logic:
  - 本章导读
  - 3.6 为什么 API 不能由 English UI 定义
  - 5.5 把两者混合的后果
  - 9. Crossing the Streams：加入 Network
  - 11. 原书的分析方法
  - 16.3 Stream 检查
  - 17. 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 大多数真实系统的变化轴远不止“界面、业务、数据库”三个，因此架构边界通常也不止三条。
    - 作者选择 1972 年的文字冒险游戏 Hunt the Wumpus 作为分析对象。
    - 随着问题展开，三层图逐步演化为多个独立 Stream 和多级 Policy。
    - 原书明确说明：这个游戏可能只需约 200 行 Kornshell 代码，现实中不应套用完整 Clean Architecture。作者故意把简单问题放大，是为了用它代替一个真正庞大的系统，让潜在变化轴和边界决策更容易观察。
  - title: 2.6 为什么作者又说不应真的这样做
    source_heading: 2.6 为什么作者又说不应真的这样做
    paragraphs:
    - 多个 API Component；
    - 完整 Reciprocal Interface；
  - title: 3.6 为什么 API 不能由 English UI 定义
    source_heading: 3.6 为什么 API 不能由 English UI 定义
    paragraphs:
    - Game Rules 会间接依赖英语；
    - Spanish 只能翻译 English String；
  - title: 5.5 把两者混合的后果
    source_heading: 5.5 把两者混合的后果
    paragraphs:
    - 修改 SMS 需要修改每种语言实现；
    - 修改 Spanish 需要触碰每种传递实现；
  - title: 7. Figure 25.4：简化后的依赖图
    source_heading: 7. Figure 25.4：简化后的依赖图
    paragraphs:
    - 为了看清高层结构，Figure 25.4 暂时删除这些变化，只保留 API Component。
    - 箭头表示 Source Code Dependency，而不是 Data Flow。
  - title: 9. Crossing the Streams：加入 Network
    source_heading: 9. Crossing the Streams：加入 Network
    paragraphs:
    - Network 成为新的低层组件，通过高层定义的 API 与 GameRules 通信。
    - Persistence Stream；
    - Notification Stream；
    - Analytics Stream；
  - title: 11. 原书的分析方法
    source_heading: 11. 原书的分析方法
    paragraphs:
    - 不同自然语言不应改变 Game Rules，因此建立 Language Boundary。
    - 语言与通信机制正交，因此 UI 继续拆成 Language 与 TextDelivery。
    - GameRules 内部的 Map Mechanics 与 Player Health / Win-Lose Policy 层级不同，因此进一步分为 MoveManagement
      与 PlayerManagement。
    - 一个小程序被推演成多 Stream、多 API、Microservice，不是推荐方案。
  - title: 14.3 发现语言与渠道变化
    source_heading: 14.3 发现语言与渠道变化
    paragraphs:
    - English / Chinese；
    - Email / SMS / Push。
    - 自然语言与传递渠道应独立变化，类似 Wumpus 的 Language / TextDelivery。
  - title: 16.3 Stream 检查
    source_heading: 16.3 Stream 检查
    paragraphs:
    - 系统有多少主要输入输出 Stream？
    - 每条 Stream 的职责是什么？
  - title: 17. 本章总结
    source_heading: 17. 本章总结
    paragraphs:
    - English 与 Spanish 实现 Language API，Shell 与 SMS 等实现 TextDelivery API。
    - Figure 25.4 删除 English、SMS、CloudData 等具体 Variations，只保留稳定 API Components。
    - 两条 Stream 在 GameRules 相遇，它是系统的 Ultimate Processor 或 Central Transform。
    - 原书进一步假设 Massive Multiplayer 版本，让 MoveManagement 在客户端运行、PlayerManagement 在服务器运行。
  takeaways:
  - 第 25 章说明，大多数系统不能只用 UI、Business Rules、Database 三层完全描述。
  - UI 内部至少还有自然语言与 Text Delivery 两个正交变化轴。
  - 输出沿同一 Stream 反向返回：GameRules 产生事件，Language 翻译，TextDelivery 交付。
  - 服务边界必须额外处理协议版本、延迟、超时、重试、幂等、认证和一致性。
  - 本章最终结论是：架构师需要一双警觉的眼睛，持续识别变化轴与摩擦，并在恰当时机以恰当强度建立边界。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.4 “Hunt the Wumpus 应按书中图真正实现”」？
  answer: 错误。原书明确说小游戏可能只需约 200 行代码，案例只是大型系统代理。
  source_heading: 15.4 “Hunt the Wumpus 应按书中图真正实现”
- level: 概念辨析
  question: 原文如何解释「15.8 “控制流双向，所以源码依赖也应双向”」？
  answer: 错误。Reciprocal Interface 和 DIP 可让双向控制流保持单向源码依赖。
  source_heading: 15.8 “控制流双向，所以源码依赖也应双向”
- level: 概念辨析
  question: 原文如何解释「15.12 “所有 Stream 最终必须汇聚到一个类”」？
  answer: 错误。核心内部还可能存在多个政策层级，如 MoveManagement 与 PlayerManagement。
  source_heading: 15.12 “所有 Stream 最终必须汇聚到一个类”
- level: 概念辨析
  question: 原文如何解释「15.14 “多人游戏天然需要微服务”」？
  answer: 不一定。原书特意假设本地客户端与权威服务器分离，才让完整服务边界有依据。
  source_heading: 15.14 “多人游戏天然需要微服务”
- level: 概念辨析
  question: 原文如何解释「15.22 “低层 Component 应拥有自己的 API”」？
  answer: 若 API 服务高层调用者，应由高层 User 拥有；实现者可以有内部 API，但不能控制上游契约。
  source_heading: 15.22 “低层 Component 应拥有自己的 API”
