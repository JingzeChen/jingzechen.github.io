  question: 原文如何解释「10.1 “用了多张 GPU”不等于“系统有效扩展”」？
  answer: 若 8 张卡只达到 2 倍加速，程序虽然是分布式的，系统却可能被通信、输入或负载不均主导。
  source_heading: 10.1 “用了多张 GPU”不等于“系统有效扩展”
- level: 概念辨析
  question: 原文如何解释「10.6 权重、训练状态、激活和 KV cache 不能混算」？
  answer: "“7B 模型约 14 GB”只描述 2 字节权重，不代表训练只用 14 GB，也不代表推理峰值一定是 14 GB。"
  source_heading: 10.6 权重、训练状态、激活和 KV cache 不能混算
- level: 概念辨析
  question: 原文如何解释「10.11 静态 batching 与 continuous batching 不同」？
  answer: 静态批处理让一组请求一起开始，通常也在固定边界结束；长请求可能拖住短请求。连续批处理允许调度器在解码迭代之间加入新请求、移除已完成请求，从而适应不规则到达与长度。
  source_heading: 10.11 静态 batching 与 continuous batching 不同
- level: 概念辨析
  question: 原文如何解释「10.16 torchrun、SLURM 与 Kubernetes 不做同一件事」？
  answer: Kubernetes 主要维持容器化服务的期望状态并提供部署编排。
  source_heading: 10.16 torchrun、SLURM 与 Kubernetes 不做同一件事
- level: 概念辨析
  question: 原文如何解释「10.21 最新框架不一定是当前场景的最佳选择」？
  answer: 序言强调持久模式，是为了避免把学习变成版本追逐。成熟度、调试工具、团队经验、硬件支持和负载匹配往往比“发布日期更新”更重要。先进机制只有在解决真实瓶颈且收益经测量成立时才有价值。
  source_heading: 10.21 最新框架不一定是当前场景的最佳选择
