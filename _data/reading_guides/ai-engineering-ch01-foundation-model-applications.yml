  question: 原文如何解释「2. The Rise of AI Engineering（AI 工程的兴起）」？
  answer: 因素二：资金与组织投入增加。 ChatGPT 的成功让风险投资和企业预算快速流入。作者访谈中，Scribd 的应用研究负责人估计某用例的 AI
    成本在 2022 年 4 月到 2023 年 4 月下降了约两个数量级。2023 年第二季度，约三分之一标普 500 公司在财报电话会提到 AI，是前一年的三倍；提及
    AI 的公司同期平均涨幅 4.6%，未提及者为 2.4%。后一个数据只是相关性，不能证明 AI 导致股价上涨，可能还包含公司选择效应和市场叙事效应。
  source_heading: 2. The Rise of AI Engineering（AI 工程的兴起）
- level: 关系解释
  question: 原文如何解释「4. Planning AI Applications（规划 AI 应用）」？
  answer: 基础模型的初始能力容易制造错觉：周末 demo 能达到看似不错的 60% 或 80%，剩余部分却包含长尾输入、幻觉、集成、权限、监控和用户体验。UltraChat
    团队把它概括为“从 0 到 60 容易，从 60 到 100 极难”。LinkedIn 的项目约一个月达到目标体验的 80%，又花四个月才超过 95%。
  source_heading: 4. Planning AI Applications（规划 AI 应用）
- level: 边界判断
  question: 原文如何解释「5. The AI Engineering Stack（AI 工程技术栈）」？
  answer: 应用与界面的重要性让 AI 工程更接近全栈开发，可以把它理解为“技术栈中加入了 AI 模型的软件工程”。传统 ML 工具以 Python 为中心，现在
    LangChain.js、Transformers.js、OpenAI Node 库和 Vercel AI SDK 等 JavaScript 工具也在增长。全栈工程师的优势是能快速把想法变成产品、取得反馈并迭代；ML
    工程师的优势是能更深入理解数据、模型和评估。成熟团队需要两者结合。
  source_heading: 5. The AI Engineering Stack（AI 工程技术栈）
- level: 关系解释
  question: 原文如何解释「8. 一页速记」？
  answer: AI 工程相对传统 ML 工程更重适配与评估，相对全栈工程多了概率模型、数据与实验约束。新的产品顺序是：先产品与反馈，后数据与模型重投入。
  source_heading: 8. 一页速记
