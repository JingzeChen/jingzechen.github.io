  sections:
  - title: 0. 学习目标与主线
    source_heading: 0. 学习目标与主线
    paragraphs:
    - 基础模型为何能通用，又怎样适配？ 掌握 token、掩码与自回归、自监督、多模态，以及提示工程、RAG、微调三种常见适配方式。
    - 什么应用值得做，怎样逐步上线？ 能用八类用例识别机会，并从价值、人与 AI 的角色、护城河、期望、里程碑和维护成本判断一个产品是否成立。
    - 团队真正要建设什么？ 看清应用开发、模型开发、基础设施三层技术栈，以及 AI 工程与传统 ML 工程、全栈工程的分工差异。
    - 本章的因果主线如下。代码示例使用 Python 3.11 标准库，不需要联网或 API key；展示的输出均为实际运行结果。
  - title: 1. 开篇：为什么一个词是「规模（scale）」
    source_heading: 1. 开篇：为什么一个词是「规模（scale）」
    paragraphs:
    - 2020 年后的 AI 可以用一个词概括：规模。这里不宜只盯着参数量，因为今天的“大”很快会变成明天的“小”。更稳定的判断方法是看外部资源：训练和运行
      ChatGPT、Gemini、Midjourney 一类模型已经消耗不可忽视的电力，公开互联网数据也逐渐接近可用上限。当一种技术开始碰到全球电力和数据存量的物理边界时，规模就不再只是相对称呼。
    - 第二条链从成本出发：训练前沿模型需要海量数据、算力和专门人才，只有少数大型企业、政府和资金充足的创业公司负担得起。应用团队若都从零训练，绝大多数想法会在开始前就被固定成本挡住，于是市场形成了模型即服务（model
      as a service）：少数组织负责造模型，通过 API 把能力提供给大量开发者。
    - 在模型上构建应用并不是新事。推荐系统、欺诈检测和流失预测早已进入生产环境，业务指标映射、实验、监控、反馈循环等经验仍然有效。本章把基础模型之前的机器学习统称为传统
      ML（traditional ML），只是为了区分工程范式，不代表旧方法失效。
    - 模型能力变化很快，直接预测几年后的边界并不可靠。更可迁移的方法是先理解基础模型为何出现，再观察已经成功的用例，归纳模型擅长和不擅长的任务，最后把这些判断落实到产品规划与技术栈。这样关注的是较稳定的需求模式与工程约束，而不是某个短期工具的热度。
  - title: 2. The Rise of AI Engineering（AI 工程的兴起）
    source_heading: 2. The Rise of AI Engineering（AI 工程的兴起）
    paragraphs:
    - 监督学习需要人工标签。欺诈检测要先标出“欺诈/非欺诈”，AlexNet 要依赖 ImageNet 中 100 多万张图片和 1,000 个类别。若每张图片标注费为
      5 美分，100 万张就是 5 万美元；双人复核翻倍为 10 万美元。若保持每类样本数不变，把 1,000 类扩到 100 万类，图片数和成本都乘 1,000，单是标注就达到
      5,000 万美元。日常物体尚可由普通人标注，拉丁语翻译或 CT 癌症判断还需要昂贵专家。
    - 因素二：资金与组织投入增加。 ChatGPT 的成功让风险投资和企业预算快速流入。作者访谈中，Scribd 的应用研究负责人估计某用例的 AI 成本在
      2022 年 4 月到 2023 年 4 月下降了约两个数量级。2023 年第二季度，约三分之一标普 500 公司在财报电话会提到 AI，是前一年的三倍；提及
      AI 的公司同期平均涨幅 4.6%，未提及者为 2.4%。后一个数据只是相关性，不能证明 AI 导致股价上涨，可能还包含公司选择效应和市场叙事效应。
    - 两类数据说明当时处于快速扩张期：AutoGPT、Stable Diffusion Web UI、LangChain、Ollama 等工具在很短时间获得大量
      GitHub stars；LinkedIn 在 2023 年 8 月观察到，个人资料新增 “Generative AI”“ChatGPT”“Prompt
      Engineering”等词的专业人士数量平均每月增长 75%。
    - "“ML engineering”可以覆盖更广的模型工程，却不突出基础模型带来的适配与开放式评估问题；“MLOps、LLMOps”等名称强调运维，而本章关注的是让模型按产品需求工作的工程过程。作者最终访谈了
      20 名正在基础模型之上开发应用的人，多数人偏好 “AI engineering”，于是采用了这个名称。命名的意义在于沟通共同工作边界，不在于创造互斥学科。"
  - title: 3. Foundation Model Use Cases（基础模型用例）
    source_heading: 3. Foundation Model Use Cases（基础模型用例）
    paragraphs:
    - 企业可让专家从初稿继续迭代，也可为 A/B 测试、季节和地域生成多个广告版本。公司预算平均约 11% 用于营销，使这类提效有较大价值空间。但输出仍受版权、品牌一致性、人物真实性和训练数据许可约束；模型越容易生成内容，审核与来源记录越重要。随着能力进入默认工具，“AI”最终可能不再需要出现在产品名称里。
    - 应用包括润色邮件、把要点扩成段落、生成营销文案和绩效报告，也能做可互动、随读者偏好变化的故事。边界同样明显：亚马逊曾出现大量粗制滥造的 AI 旅游指南，内容农场能每天批量生产文章，广告还会为其提供收入。低成本生成会降低人们对公开内容的信任，可信作者、品牌、来源和校验反而更重要。
    - AI 既可能替代现有教育服务，也能成为学习任何技能的低成本导师。Chegg 股价从 2022 年 11 月约 28 美元跌到 2024 年 9 月约 2
      美元，是商业冲击的代表，但不能仅凭单一公司股价把全部变化归因于 AI。教育产品仍需处理事实错误、学生依赖、隐私和教师责任。
    - 企业中的价值不应停在“生成一段摘要”。Instacart 内部提示市场的热门模板 “Fast Breakdown” 把会议记录、邮件和 Slack 内容分成事实、开放问题、行动项，行动项还能进入项目管理工具并分派负责人。输出结构应按下游处理路径设计：事实用于同步，问题用于决策，行动项用于执行。这样信息聚合才真正减轻协调和中层管理负担。
  - title: 4. Planning AI Applications（规划 AI 应用）
    source_heading: 4. Planning AI Applications（规划 AI 应用）
    paragraphs:
    - 若没有 AI 产品就无法工作，AI 是关键的（critical），如依赖人脸识别的 Face ID；若去掉 AI 主流程仍在，AI 是辅助的（complementary），如
      Gmail Smart Compose。越关键，准确性、可用性和降级方案要求越高；辅助功能出错时，用户通常更容易忽略建议。
    - 低门槛既是机会也是威胁。你的产品容易构建，竞争者也容易复制；底层模型增强后，还可能直接吞掉上层功能。例如产品只解决“通用模型不会解析 PDF”，一旦模型原生支持长文档，差异化就会消失。若产品提供本地部署、合规、流程集成和审计，模型能力增强反而可能扩大其价值。
    - 基础模型的初始能力容易制造错觉：周末 demo 能达到看似不错的 60% 或 80%，剩余部分却包含长尾输入、幻觉、集成、权限、监控和用户体验。UltraChat
      团队把它概括为“从 0 到 60 容易，从 60 到 100 极难”。LinkedIn 的项目约一个月达到目标体验的 80%，又花四个月才超过 95%。
    - 变化还包括更难控制的外部风险。GPU 和数据跨境可能因国家安全政策受限；GDPR 等规则曾带来巨额合规投入；AI 训练数据和生成内容的知识产权规则仍在演进，游戏工作室等
      IP 密集企业会因此谨慎采用。法务、供应链和部署地区不是上线前最后签字，而应在立项与架构阶段进入决策。
  - title: 5. The AI Engineering Stack（AI 工程技术栈）
    source_heading: 5. The AI Engineering Stack（AI 工程技术栈）
    paragraphs:
    - 作者在 2024 年 3 月统计 GitHub 上至少 500 stars 的 AI 相关仓库，共 920 个。2023 年在 Stable Diffusion
      和 ChatGPT 之后，增长最明显的是应用与应用开发工具；基础设施层增长较少。原因不是基础设施不重要，而是资源管理、服务和监控的核心需求相对稳定。实践上，上层应学习权衡和方法，下层的服务治理、GPU
      调度与可观测性具有更长知识半衰期。
    - Gemini Ultra 与 GPT-4 的 MMLU 案例说明比较条件为何必须一致。Google 发布 Gemini 时使用 CoT@32，即给 Gemini
      32 个示例；GPT-4 的另一列只给 5 个示例。跨设置看似 Gemini 领先，但同为 5-shot 时 GPT-4 反而领先。
    - 过去的 ML 功能多嵌在既有产品里，如支付产品的欺诈检测、流媒体的推荐。基础模型降低门槛后，AI 可以成为独立产品，也可以作为插件、扩展或机器人进入现有工作流：ChatGPT、Perplexity
      是独立产品，GitHub Copilot 常作为编辑器插件，Grammarly 常作为浏览器扩展，Midjourney 可独立使用或集成 Discord。
    - 应用与界面的重要性让 AI 工程更接近全栈开发，可以把它理解为“技术栈中加入了 AI 模型的软件工程”。传统 ML 工具以 Python 为中心，现在
      LangChain.js、Transformers.js、OpenAI Node 库和 Vercel AI SDK 等 JavaScript 工具也在增长。全栈工程师的优势是能快速把想法变成产品、取得反馈并迭代；ML
      工程师的优势是能更深入理解数据、模型和评估。成熟团队需要两者结合。
  - title: 6. Summary（本章小结）
    source_heading: 6. Summary（本章小结）
    paragraphs:
    - 规模化一方面扩大模型能力和应用需求，另一方面把训练集中到少数组织，推动模型即服务、降低应用门槛。语言模型依靠 token 表示和自监督从文本中自动获得训练信号，扩大为
      LLM；模型跨越文本进入图像等模态后，基础模型成为更合适的上位概念。团队通常通过提示工程、RAG 和微调适配这些底座。
    - 应用机会横跨编程、图像视频、写作、教育、对话机器人、信息聚合、数据组织和工作流自动化，但能做出 demo 不代表值得做产品。用例要经过业务价值、人与 AI
      的角色、护城河、可用门槛、最后一公里和长期维护检验。
    - AI 工程从 ML 工程演化而来。业务指标、系统实验、效率优化和反馈循环仍然适用；变化在于团队更多利用现成模型、面对更大的推理压力和更难评估的开放式输出。三层栈中，变化最快的是应用开发层，模型层和基础设施层则在需要时支撑严格性能与规模。
    - 领域更新速度会超过任何静态材料。工具可以帮助聚合新信息，却不能替代判断框架；越是信息过载，越需要用稳定的概念、可比的评估和清晰的决策闸门导航。
  - title: 8. 一页速记
    source_heading: 8. 一页速记
    paragraphs:
    - 三种适配依次问：任务是否没说清，用提示工程；事实是否不在上下文，用 RAG；行为是否需要持久改变，用微调。
    - 自动化：Crawl 先建议，Walk 做内部与简单任务，Run 才直接面对外部用户。
    - AI 工程相对传统 ML 工程更重适配与评估，相对全栈工程多了概率模型、数据与实验约束。新的产品顺序是：先产品与反馈，后数据与模型重投入。
    - 最后记住一条评估纪律：比较模型时固定除模型外的变量，规划产品时不要用 demo 的早期速度外推最后一公里。
