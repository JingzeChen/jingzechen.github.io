    IP 密集企业会因此谨慎采用。法务、供应链和部署地区不是上线前最后签字，而应在立项与架构阶段进入决策。
  - 应用与界面的重要性让 AI 工程更接近全栈开发，可以把它理解为“技术栈中加入了 AI 模型的软件工程”。传统 ML 工具以 Python 为中心，现在 LangChain.js、Transformers.js、OpenAI
