  question: 原文围绕「0. 学习目标与主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与主线
  thesis: 因素二：资金与组织投入增加。 ChatGPT 的成功让风险投资和企业预算快速流入。作者访谈中，Scribd 的应用研究负责人估计某用例的 AI
    成本在 2022 年 4 月到 2023 年 4 月下降了约两个数量级。2023 年第二季度，约三分之一标普 500 公司在财报电话会提到 AI，是前一年的三倍；提及
    AI 的公司同期平均涨幅 4.6%，未提及者为 2.4%。后一个数据只是相关性，不能证明 AI 导致股价上涨，可能还包含公司选择效应和市场叙事效应。
  thesis_source: 2. The Rise of AI Engineering（AI 工程的兴起）
  concepts:
  - term: 0. 学习目标与主线
    meaning: 什么应用值得做，怎样逐步上线？ 能用八类用例识别机会，并从价值、人与 AI 的角色、护城河、期望、里程碑和维护成本判断一个产品是否成立。
    source_heading: 0. 学习目标与主线
  - term: 1. 开篇：为什么一个词是「规模（scale）」
    meaning: 2020 年后的 AI 可以用一个词概括：规模。这里不宜只盯着参数量，因为今天的“大”很快会变成明天的“小”。更稳定的判断方法是看外部资源：训练和运行
      ChatGPT、Gemini、Midjourney 一类模型已经消耗不可忽视的电力，公开互联网数据也逐渐接近可用上限。当一种技术开始碰到全球电力和数据存量的物理边界时，规模就不再只是相对称呼。
    source_heading: 1. 开篇：为什么一个词是「规模（scale）」
  - term: 3. Foundation Model Use Cases（基础模型用例）
    meaning: 企业中的价值不应停在“生成一段摘要”。Instacart 内部提示市场的热门模板 “Fast Breakdown” 把会议记录、邮件和 Slack
      内容分成事实、开放问题、行动项，行动项还能进入项目管理工具并分派负责人。输出结构应按下游处理路径设计：事实用于同步，问题用于决策，行动项用于执行。这样信息聚合才真正减轻协调和中层管理负担。
    source_heading: 3. Foundation Model Use Cases（基础模型用例）
  - term: 4. Planning AI Applications（规划 AI 应用）
    meaning: 基础模型的初始能力容易制造错觉：周末 demo 能达到看似不错的 60% 或 80%，剩余部分却包含长尾输入、幻觉、集成、权限、监控和用户体验。UltraChat
      团队把它概括为“从 0 到 60 容易，从 60 到 100 极难”。LinkedIn 的项目约一个月达到目标体验的 80%，又花四个月才超过 95%。
    source_heading: 4. Planning AI Applications（规划 AI 应用）
  - term: 6. Summary（本章小结）
    meaning: 规模化一方面扩大模型能力和应用需求，另一方面把训练集中到少数组织，推动模型即服务、降低应用门槛。语言模型依靠 token 表示和自监督从文本中自动获得训练信号，扩大为
      LLM；模型跨越文本进入图像等模态后，基础模型成为更合适的上位概念。团队通常通过提示工程、RAG 和微调适配这些底座。
    source_heading: 6. Summary（本章小结）
  - term: 8. 一页速记
    meaning: AI 工程相对传统 ML 工程更重适配与评估，相对全栈工程多了概率模型、数据与实验约束。新的产品顺序是：先产品与反馈，后数据与模型重投入。
    source_heading: 8. 一页速记
