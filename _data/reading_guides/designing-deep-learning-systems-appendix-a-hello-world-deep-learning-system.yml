overview:
  kind: summary
  minutes: 9
  question: 原文围绕「A.1 “Hello World” 深度学习系统导览」建立了怎样的核心认识？
  question_source: A.1 “Hello World” 深度学习系统导览
  thesis: 新增 label 的核心是 dataset version evolution 与 retraining，不应覆盖 old data / model
    lineage。 当前 dataset commits 能累积保留，但同名 model artifact path 会覆盖 old bytes，必须修复。
  thesis_source: 核心结论
  concepts:
  - term: A.1 “Hello World” 深度学习系统导览
    meaning: Data engineer 负责收集、处理和保存用于 deep learning training 的 raw data。Mini system
      提供 DM（dataset management）service，data engineer 通过它上传 raw training data。
    source_heading: A.1 “Hello World” 深度学习系统导览
  - term: A.2 Lab Demo
    meaning: 当前 demo 的 training service 通过 mounted Docker socket 启动 child training
      container，并根据 child-container exit status 维护 execution status。这是一种简便 local executor，不是安全多租户设计。Run
      start、epoch metrics、artifact creation 和 run end 则由 training code/container 直接调用
      metadata-store APIs；不是 training service 代写最终 metadata。
    source_heading: A.2 Lab Demo
  - term: 核心结论
    meaning: 原章高层视图把 model files 与 metadata / metrics 的产出责任归于 training service。 当前代码由其启动的
      training container 直接上传 model staging files，并调用 metadata APIs 创建 artifact、记录
      epoch 和结束 run；training service 自身维护 queue / container status。
    source_heading: 核心结论
  - term: 第十步：逐层替换 Demo Shortcuts
    meaning: 按风险补充 immutable images、secret manager、TLS/auth、orchestrator、sandbox、typed
      schema、HA、SLO、monitoring、promotion 和 rollback，而不是把 demo 一次性扩成巨型平台。
    source_heading: 第十步：逐层替换 Demo Shortcuts
  - term: 复习与自测
    meaning: Listing A.4 的 final test accuracy 与示例 epoch accuracy 分别是多少？它们对应 test
      还是 validation split，当前切分比例和随机性是什么？
    source_heading: 复习与自测
  logic:
  - A.1 “Hello World” 深度学习系统导览
  - A.2 Lab Demo
  - 核心结论
  - 第十步：逐层替换 Demo Shortcuts
  - 复习与自测
  sections:
  - title: A.1 “Hello World” 深度学习系统导览
    source_heading: A.1 “Hello World” 深度学习系统导览
    paragraphs:
    - Data engineer 负责收集、处理和保存用于 deep learning training 的 raw data。Mini system 提供
      DM（dataset management）service，data engineer 通过它上传 raw training data。
    - System developer 构建整套 deep learning system，并持续维护，确保 dataset uploading、model
      training 与 model serving 等 ML activities 正常运行。实验中 Tang 扮演该角色。
    - Application developer 使用模型构建商业产品，例如 chatbot、self-driving software、facial-recognition
      mobile app。他们是系统最重要的客户，因为只有产品使用模型，才会创造业务影响和收入。
    - 它接收 gRPC training request，解析 algorithm、dataset 和 parameters，启动 training container，监控
      job，保存 model files，并把 run metadata / metrics 写入 metadata store。
  - title: A.2 Lab Demo
    source_heading: A.2 Lab Demo
    paragraphs:
    - 这把 logical name 与 prepared-snapshot selection key 组合起来，使 training service 能查询同一个
      materialized result。它比只传 dataset ID 更稳定，但不能替代内容 digest。
    - 当前 demo 的 training service 通过 mounted Docker socket 启动 child training container，并根据
      child-container exit status 维护 execution status。这是一种简便 local executor，不是安全多租户设计。Run
      start、epoch metrics、artifact creation 和 run end 则由 training code/container 直接调用
      metadata-store APIs；不是 training service 代写最终 metadata。
    - 所以当前 lab 不是持久化系统，IDs、commits、metrics、artifact lookup 和 MinIO objects 都不能依赖 container
      recreation 后继续存在。生产必须为 object storage 与 metadata databases 配置独立持久卷 / durable
      services、backup 和恢复验证。
    - 旧 commit 不会被 dataset update 覆盖，因此 run 1 的 metadata 仍能指明它使用 3-label commit set，run
      2 指向含 optimism 的 commit set。但当前 model artifact bytes 还有下文所述的同名覆盖缺陷，dataset lineage
      可追溯不等于旧 model files 仍可冷加载。
  - title: 核心结论
    source_heading: 核心结论
    paragraphs:
    - 原章高层视图把 model files 与 metadata / metrics 的产出责任归于 training service。 当前代码由其启动的
      training container 直接上传 model staging files，并调用 metadata APIs 创建 artifact、记录
      epoch 和结束 run；training service 自身维护 queue / container status。
    - Dataset ID 是 logical identity，commit 是追加更新，当前 version hash 是 selected-commit-set
      key。 它帮助定位 materialized snapshot，但不是 content digest；生产还需 manifest / checksum。
    - 新增 label 的核心是 dataset version evolution 与 retraining，不应覆盖 old data / model lineage。
      当前 dataset commits 能累积保留，但同名 model artifact path 会覆盖 old bytes，必须修复。
    - 当前 metrics 来自未固定 seed 的约 85.5% / 4.5% / 10% random split。 Per-epoch 是 validation
      accuracy，final message 是 test accuracy，跨 run 比较前要固定 split。
  - title: 第十步：逐层替换 Demo Shortcuts
    source_heading: 第十步：逐层替换 Demo Shortcuts
    paragraphs:
    - 按风险补充 immutable images、secret manager、TLS/auth、orchestrator、sandbox、typed schema、HA、SLO、monitoring、promotion
      和 rollback，而不是把 demo 一次性扩成巨型平台。
    - 这套方法的核心是：用最少组件跑通真实身份和 artifact 流，再通过一个可控需求变化验证系统能演进，最后按风险逐步替换教学捷径。
  - title: 复习与自测
    source_heading: 复习与自测
    paragraphs:
    - Listing A.4 的 final test accuracy 与示例 epoch accuracy 分别是多少？它们对应 test 还是 validation
      split，当前切分比例和随机性是什么？
    - Prediction service 自动加载模型包含哪些 lookup / download / runtime steps？
    - 当前 teardown 后 DM、metadata、MinIO 和 host model cache 分别怎样丢失或被清理？生产持久化应怎样不同？
    - 请使用十步方法，把 MiniAutoML 从本地 demo 演进成支持多用户、安全训练、版本化模型发布和可靠 serving 的最小生产系统。
  takeaways:
  - 理解深度学习系统最快的方法之一，是从用户职责与实际工作流出发。
  - Lab 用 Tang、Feng、Ivan、Johanna 分别模拟四类 persona。
  - Object upload 与 dataset registration 是两步。 只有 DM commit 才形成可治理 dataset。
  - 新增 label 的核心是 dataset version evolution 与 retraining，不应覆盖 old data / model lineage。
    当前 dataset commits 能累积保留，但同名 model artifact path 会覆盖 old bytes，必须修复。
  - 当前 metrics 来自未固定 seed 的约 85.5% / 4.5% / 10% random split。 Per-epoch 是 validation
    accuracy，final message 是 test accuracy，跨 run 比较前要固定 split。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. “Hello World” System 就是 Production Reference Architecture」？
  answer: 它是教学最小系统，刻意省略 auth、HA、tenant、workflow、SLO、governance 等能力。数据流原理可复用，具体部署不能原样上线。
  source_heading: 1. “Hello World” System 就是 Production Reference Architecture
- level: 概念辨析
  question: 原文如何解释「14. 多个 Services 共用一个 Image 是微服务最佳实践」？
  answer: 原章明确说这只是省 disk、简化 demo。生产通常需要独立 version / dependency / security boundary。
  source_heading: 14. 多个 Services 共用一个 Image 是微服务最佳实践
- level: 概念辨析
  question: 原文如何解释「32. Final Message test accuracy 0.520 就是完整评价」？
  answer: 单个 overall metric 缺少 test-set contract、class slices、confusion matrix、uncertainty
    和 baseline。当前 epoch metric 是 validation accuracy，final message 才是 test accuracy；两者来自该
    run 未固定 seed 的随机 split。
  source_heading: 32. Final Message test accuracy 0.520 就是完整评价
- level: 概念辨析
  question: 原文如何解释「46. 新 Dataset Commit 可以继续使用旧 Version Hash」？
  answer: 当前 key 应随 selected commit bitset 变化，所以选择 commits 1+2 与只选 commit 1 不同；但它不会随同一
    commit path 下的 bytes 变化，不能替代 content digest。
  source_heading: 46. 新 Dataset Commit 可以继续使用旧 Version Hash
- level: 概念辨析
  question: 原文如何解释「60. “Hello World” 越复杂越能代表真实系统」？
  answer: 教学系统应保留关键因果链并删除次要复杂度。生产能力应分层演进，不应把全部特性塞进第一次实验。
  source_heading: 60. “Hello World” 越复杂越能代表真实系统
