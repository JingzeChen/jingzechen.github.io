overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件」建立了怎样的核心认识？
  question_source: 0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件
  thesis: Slow network calls 是 silent killers/gray failures，会按 Little’s Law 大幅增加 in-flight
    resources。
  thesis_source: 18. 核心结论
  concepts:
  - term: 0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件
    meaning: 共同副作用是 moving parts 增加。若每个部件在某时间窗内有非零 fault probability，部件越多，至少一个出问题的概率通常越高。
    source_heading: 0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件
  - term: 4.2 Configuration 与 code 同等有能力破坏系统
    meaning: Authentication/authorization；
    source_heading: 4.2 Configuration 与 code 同等有能力破坏系统
  - term: 5. 24.4 Single points of failure
    meaning: 需要 domain renewal automation、multi-provider/zone strategy（按风险）、monitoring、TTL
      planning 和 ownership。
    source_heading: 5. 24.4 Single points of failure
  - term: 8. 24.7 Load pressure
    meaning: 100 个昂贵 report queries 可能比 10,000 个 cached reads 更重。Load shedding/rate
      limit 应按 cost/priority，不只 request count。
    source_heading: 8. 24.7 Load pressure
  - term: 12. 九类原因之间的关系
    meaning: 一个 postmortem 若只写“network fault”，会漏掉为什么 network fault 能导致全站失败：没有 timeout、资源池太小、retry
      无界、无 N-1 capacity、健康检查抖动等才是放大条件。
    source_heading: 12. 九类原因之间的关系
  - term: 19. 一般化的解决问题方法
    meaning: Fault 本身常不可避免；重点找 traffic shift、retry、resource retention、shared config
      和 health flapping 如何放大。
    source_heading: 19. 一般化的解决问题方法
  logic:
  - 0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件
  - 4.2 Configuration 与 code 同等有能力破坏系统
  - 4.5 Config-as-code release
  - 8. 24.7 Load pressure
  - 10. 可运行 C11 模拟：副本故障、重试级联与 load shedding
  - 16. 作者如何形成解决思路
  - 19. 一般化的解决问题方法
  sections:
  - title: 0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件
    source_heading: 0. Part IV 导读：扩展性增加了能力，也增加了会失败的部件
    paragraphs:
    - 共同副作用是 moving parts 增加。若每个部件在某时间窗内有非零 fault probability，部件越多，至少一个出问题的概率通常越高。
    - 这不是系统 failure probability，因为 redundancy 可能容忍 fault；现实 faults 也常相关。它只说明：大规模系统必须把
      fault 当日常事件，而不是异常巧合。
    - 人工发现、叫醒 on-call、登录、诊断通常已经耗尽预算。因此越多“9”，系统越需自动检测、隔离和恢复。
    - Chapter 28：upstream load shedding/load leveling/rate limiting。
  - title: 2. 24.1 Hardware faults
    source_heading: 2. 24.1 Hardware faults
    paragraphs:
    - 保护手段包括 checksum、ECC、scrubbing、end-to-end validation、versioned backup 和 repair。Replication
      若没有 integrity verification，会复制 corruption，而非修复它。
    - 不只是 machine：power cut 或 natural disaster 可让整个 data center/region unavailable。
    - 三个 replicas 若都在同 rack，不提供 rack fault tolerance；若都依赖同一 control plane/config，也可能
      common-mode fail。
    - 硬件 fault 易想到，也易通过成熟云/存储冗余处理。作者转折指出，distributed application 的灾难性 failures 往往来自更普通的软件和操作问题。
  - title: 4.2 Configuration 与 code 同等有能力破坏系统
    source_heading: 4.2 Configuration 与 code 同等有能力破坏系统
    paragraphs:
    - Authentication/authorization；
    - Quota/rate limit；
    - Replica/partition placement；
    - 因此 config 本质上是输入系统的 program/data，应有 schema、review、test、version 和 rollout。
  - title: 4.5 Config-as-code release
    source_heading: 4.5 Config-as-code release
    paragraphs:
    - Version-controlled；
    - Released like code；
    - Preventively validated。
    - Chapter 30 会展开 continuous deployment。
  - title: 5. 24.4 Single points of failure
    source_heading: 5. 24.4 Single points of failure
    paragraphs:
    - Single point of failure（SPOF）是其 failure 会带下整个 system 的 component。
    - 需要 domain renewal automation、multi-provider/zone strategy（按风险）、monitoring、TTL
      planning 和 ownership。
    - 自动 issuance/renewal 不够，还要从 external client path 验证 deployed cert expiry 和 chain。
    - 可画 dependency graph/fault tree，从 user journey 反向追 required components。
  - title: 8. 24.7 Load pressure
    source_heading: 8. 24.7 Load pressure
    paragraphs:
    - Capacity 不是固定常数，会受 request mix、dependency latency、cache hit、GC、failure 和 deploy
      影响。
    - 100 个昂贵 report queries 可能比 10,000 个 cached reads 更重。Load shedding/rate limit
      应按 cost/priority，不只 request count。
    - 100% utilization 不是高效率，而是没有吸收 variance/failure 的余量。
    - 正确目标不是“接受所有请求”，而是 maximal useful work under bounded resources。
  - title: 10. 可运行 C11 模拟：副本故障、重试级联与 load shedding
    source_heading: 10. 可运行 C11 模拟：副本故障、重试级联与 load shedding
    paragraphs:
    - Corrective action 暂停 retry、恢复两 replicas，并 load-shed 到 100，系统重回 50/50；
    - 这是离散教学模型，不是 queueing simulator 或真实 LB health algorithm。
    - Replica 超 capacity 时只完成 60，并被视为因 timeout/health degradation 被摘除。
    - 它对应原章“temporarily blocking traffic”来打断 feedback loop。
  - title: 12. 九类原因之间的关系
    source_heading: 12. 九类原因之间的关系
    paragraphs:
    - 一个 postmortem 若只写“network fault”，会漏掉为什么 network fault 能导致全站失败：没有 timeout、资源池太小、retry
      无界、无 N-1 capacity、健康检查抖动等才是放大条件。
    - 无法消除所有 trigger，但可消除 amplification pathway。
  - title: 16. 作者如何形成解决思路
    source_heading: 16. 作者如何形成解决思路
    paragraphs:
    - 不是所有内部异常都影响用户；fault tolerance 的目标是阻止 fault 穿过 specification boundary。
    - 作者先承认任何 hardware/data center 都会 fail，再用研究说明 catastrophic failure 多由 non-fatal
      error handler 放大。
    - Human runbook、DNS、TLS cert 都可使全系统不可达；寻找 SPOF 要遍历 dependency，而非数 replicas。
    - B fault -> A double load -> timeout/retry -> A eject -> B recovery flood。Trigger
      消失仍 failure，揭示 metastability。
  - title: 19. 一般化的解决问题方法
    source_heading: 19. 一般化的解决问题方法
    paragraphs:
    - Fault 本身常不可避免；重点找 traffic shift、retry、resource retention、shared config 和 health
      flapping 如何放大。
    - 分类 error、定义 policy、注入 fault、验证 cleanup/response/blast radius。禁止生产 TODO handler。
    - 记录 trigger、vulnerable state、sustaining feedback；corrective action 必须打断 feedback，而非只修
      trigger。
    - Probability、impact、detectability、recoverability共同排序；对 catastrophic tails 设置不可越过的
      policy。
  takeaways:
  - Failure 是系统不再满足 user-visible specification；fault 是可能导致 failure 的内部或依赖异常。
  - 忽略 error、过宽 catch、无故 abort 和未完成 handler 都应通过 error-path tests 提前发现。
  - 无 prompt response 无法区分 slow/crash/network loss；timeout 是不完美 failure detector。
  - Organic growth 可给 autoscaling 时间，sudden flood、scraper 和 DDoS 常需 reject/shed。
  - 决定处理 risk 后，可降低发生 probability、降低 impact，或两者同时进行。
