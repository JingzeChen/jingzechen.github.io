checks:
- level: 概念辨析
  question: 原文如何解释「13.1 Fault 与 failure」？
  answer: Fault 是内部/依赖异常；failure 是 user-visible specification violation。Redundancy
    可让 fault 不成为 failure。
  source_heading: 13.1 Fault 与 failure
- level: 概念辨析
  question: 原文如何解释「13.7 Slow 与 unavailable」？
  answer: 对 deadline-bound client，过慢就是 unavailable；slow 还更容易占用资源并传播。
  source_heading: 13.7 Slow 与 unavailable
- level: 概念辨析
  question: 原文如何解释「14.1 “硬件是生产事故主要原因”」？
  answer: 硬件醒目，但 error handling、config 和操作错误常更主要。两类都要防。
  source_heading: 14.1 “硬件是生产事故主要原因”
- level: 概念辨析
  question: 原文如何解释「14.7 “Health endpoint 200 就不是 gray failure”」？
  answer: Real request path、部分 peer、p99 可能已失败。Health 要覆盖 useful work并多视角观察。
  source_heading: 14.7 “Health endpoint 200 就不是 gray failure”
- level: 概念辨析
  question: 原文如何解释「14.14 “所有可能 fault 都要最高优先级处理”」？
  answer: 按 probability/impact/detectability 排序，同时对 catastrophic/safety tail 设置底线。
  source_heading: 14.14 “所有可能 fault 都要最高优先级处理”
