  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 11 章首页依赖倒置原则（Dependency Inversion Principle，DIP）是 SOLID 的最后一条原则，也是后续架构章节最重要的基础之一。
    - 这句话首先要解决一个常见误会：DIP 讨论的不是“程序运行时谁调用谁”，而是“源代码中谁知道谁”。
    - 例如，订单用例在运行时必然要调用数据库代码，但订单用例的源代码不一定要导入某个具体数据库驱动。它可以只依赖自己需要的存储接口，由外层代码把数据库实现接进来。
    - 这时，高层业务仍然控制低层细节完成工作，但低层细节的源代码反过来依赖高层定义的抽象。被倒置的是源码依赖相对于控制流的方向。
  - title: 2. Stable Abstractions：为什么依赖稳定抽象
    source_heading: 2. Stable Abstractions：为什么依赖稳定抽象
    paragraphs:
    - 一个常见错误是先看具体实现，再为它的每个方法补一个接口。这样得到的往往只是“带接口的具体实现”，依赖方向在图上改变了，设计思想却没有改变。
    - 例如，业务用例需要的是“发布订单已创建事件”，而不是“调用 Kafka Producer 的某个发送重载”。前者是应用端口，后者是实现机制。
    - 设想一个具体基类的导出方法内部直接依赖 PDF 库。某个子类虽然重写该方法改为导出 CSV，但它仍继承这个具体基类及其设计假设。
    - 如果接口过宽，DIP 会把高层代码依赖到一个不稳定抽象；如果实现违反 LSP，倒置后的结构仍然无法正确工作。SOLID 五条原则需要共同成立。
  - title: 4.3 为什么把依赖集中在 main 有价值
    source_heading: 4.3 为什么把依赖集中在 main 有价值
    paragraphs:
    - 核心业务不需要知道对象如何创建；
    - 测试可以绕过生产装配，直接注入替身；
    - 具体依赖容易被搜索、审查和替换。
  - title: 5. Conclusion：从 DIP 走向依赖规则
    source_heading: 5. Conclusion：从 DIP 走向依赖规则
    paragraphs:
    - 原书在结尾预告，DIP 会在后续高层架构原则中一次又一次出现，并成为架构图中最明显的组织原则。
    - Clean Architecture 同心圆之间的边界。
    - 所有源码依赖跨越边界时，都应指向更抽象、更高层的实体。后文会把它正式称为 Dependency Rule（依赖规则）。
    - 当数据库、框架、UI、供应商和通信方式变化时，核心业务不应被迫理解这些变化。它只应依赖自己定义的能力契约。
  - title: 6.4 第四步：在外层实现 Adapter
    source_heading: 6.4 第四步：在外层实现 Adapter
    paragraphs:
    - 应用请求与供应商 SDK 对象之间转换；
    - Adapter 依赖高层 Port，也依赖低层技术。它正是容纳具体细节的位置。
  - title: 6.6 第六步：用变化场景验证
    source_heading: 6.6 第六步：用变化场景验证
    paragraphs:
    - 从 PostgreSQL 换成其他存储时，哪些文件必须修改？
    - 支付 SDK 升级时，核心结算用例是否需要重新理解供应商类型？
    - 增加第二种通知渠道时，旧用例是否保持不变？
    - Web 框架升级时，业务规则是否受到牵连？
  - title: 8.1 检查高层源码
    source_heading: 8.1 检查高层源码
    paragraphs:
    - 是否直接导入正在变化的具体实现？
    - 是否在用例内部创建数据库、SDK 或网络客户端？
    - 参数和返回值是否泄露低层框架类型？
    - 是否通过重写具体函数继承了无关依赖？
  - title: 8.4 检查架构边界
    source_heading: 8.4 检查架构边界
    paragraphs:
    - 边界哪一侧是高层策略，哪一侧是实现细节？
    - 跨边界源码依赖是否指向高层抽象？
    - 运行时控制流是否可通过多态跨越边界？
    - 外层技术能否在不修改核心规则的情况下替换？
  - title: 8.11 快速复述练习
    source_heading: 8.11 快速复述练习
    paragraphs:
    - DIP 讨论的依赖是哪一种依赖？
    - 为什么不能把“只依赖抽象”当成绝对规则？
    - Figure 11.1 中五个角色如何协作？
    - 为什么控制流与源码依赖方向相反？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 在动态类型语言中，抽象也可以由鸭子类型、Protocol、回调和注入表达。
    - DIP 是原则，依赖注入是技术，DI 容器是组装工具，三者不能混为一谈。
    - 应用 DIP 后，要用实现替换、框架升级和测试场景验证影响是否真正被限制。
    - Figure 11.1 的曲线会在后续章节成为架构边界，跨边界依赖方向会发展为依赖规则。
  takeaways:
  - DIP 的基本表述是：最灵活的系统，其源码依赖指向抽象而非具体实现。
  - 在动态类型语言中，抽象也可以由鸭子类型、Protocol、回调和注入表达。
  - 好的抽象表达高层意图，并由客户端需要塑造。
  - 图中的曲线把高层抽象组件与低层具体组件分开。
  - Figure 11.1 的曲线会在后续章节成为架构边界，跨边界依赖方向会发展为依赖规则。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.3 “只要有接口，就满足 DIP”」？
  answer: 错误。接口可能由低层实现反推而来，也可能泄露数据库、框架和 SDK 类型。真正的抽象应由高层需要塑造。
  source_heading: 7.3 “只要有接口，就满足 DIP”
- level: 概念辨析
  question: 原文如何解释「7.6 “‘倒置’的是运行时调用方向”」？
  answer: 错误。高层业务在运行时仍会调用低层实现。倒置的是跨边界源码依赖，让具体实现依赖高层抽象。
  source_heading: 7.6 “‘倒置’的是运行时调用方向”
- level: 概念辨析
  question: 原文如何解释「7.9 “DIP 违规必须完全清零”」？
  answer: 错误。创建具体对象必然需要知道具体类型。原书要求把这些依赖集中在少数具体组件，而不是假装它们不存在。
  source_heading: 7.9 “DIP 违规必须完全清零”
- level: 概念辨析
  question: 原文如何解释「7.13 “DIP 只是为了方便单元测试”」？
  answer: 错误。测试便利只是结果之一。DIP 的核心目标是保护高层策略，控制变化跨越架构边界的方向。
  source_heading: 7.13 “DIP 只是为了方便单元测试”
- level: 概念辨析
  question: 原文如何解释「7.16 “DIP 会让系统完全不耦合”」？
  answer: 错误。客户端仍依赖抽象契约，实现也依赖该契约。DIP让耦合指向更稳定、更重要的策略。
  source_heading: 7.16 “DIP 会让系统完全不耦合”
