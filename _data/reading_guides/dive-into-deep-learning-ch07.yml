overview:
  kind: summary
  minutes: 10
  question: 1. 为什么图像需要专门的网络结构？
  question_source: 1. 为什么图像需要专门的网络结构
  thesis: 本章从合理的图像先验推导出 CNN，而不是把卷积当作神秘技巧：位置共享把“同一模式在哪里出现”从独立参数问题变成同一检测器的滑动应用，局部性把不可计算的全连接图像映射压缩为小核，多通道恢复丰富表示，填充、步幅和池化控制空间尺度，深度则把局部感受野组合成全局语义。LeNet
    最终证明，这些简单组件只需按清楚的形状和数据流组合，就能构成可端到端训练、参数高效且具有明确归纳偏置的视觉模型。
  thesis_source: 12. 核心结论与一般解题方法
  concepts:
  - term: 1. 为什么图像需要专门的网络结构
    meaning: 全连接层对任意固定的特征排列都拥有相同的函数容量：如果把所有图像像素以同一种置换重排，模型仍可重新学习一套参数。这里不是说一个训练完成的
      MLP 对像素置换不变，而是说全连接架构本身没有偏好真实二维邻接关系。
    source_heading: 1. 为什么图像需要专门的网络结构
  - term: 3. 图像卷积的实际计算
    meaning: 需要注意，有限训练样本可能无法唯一识别核。若输入没有足够变化，多组核可能产生相同目标；学到接近真值依赖数据对参数方向提供充分约束。
    source_heading: 3. 图像卷积的实际计算
  - term: 5. 多输入与多输出通道
    meaning: "“一个通道检测边缘、一个通道检测纹理”是有用直觉，但训练目标只要求通道联合有用。任意可逆通道基变换若由下一层抵消，整体函数可能不变。因此语义可能对应通道空间的某个方向，而不是某个固定索引。"
    source_heading: 5. 多输入与多输出通道
  - term: 6. 池化
    meaning: 最大池化保留窗口内最强响应，对“模式是否存在”有效；平均池化汇总所有值，平滑噪声并更像低通下采样。哪一种更好取决于特征语义，原书指出传统视觉
      CNN 中 max pooling 往往优于 average pooling，但现代网络也广泛使用全局平均池化。
    source_heading: 6. 池化
  - term: 8. 可运行的综合实验
    meaning: 圆周填充避免边界信息丢失，在该边界约定下验证平移等变；
    source_heading: 8. 可运行的综合实验
  - term: 12. 核心结论与一般解题方法
    meaning: 本章从合理的图像先验推导出 CNN，而不是把卷积当作神秘技巧：位置共享把“同一模式在哪里出现”从独立参数问题变成同一检测器的滑动应用，局部性把不可计算的全连接图像映射压缩为小核，多通道恢复丰富表示，填充、步幅和池化控制空间尺度，深度则把局部感受野组合成全局语义。LeNet
      最终证明，这些简单组件只需按清楚的形状和数据流组合，就能构成可端到端训练、参数高效且具有明确归纳偏置的视觉模型。
    source_heading: 12. 核心结论与一般解题方法
