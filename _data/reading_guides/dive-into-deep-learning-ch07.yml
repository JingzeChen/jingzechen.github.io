  sections:
  - title: 1. 为什么图像需要专门的网络结构
    source_heading: 1. 为什么图像需要专门的网络结构
    paragraphs:
    - 灰度图中每个位置对应一个数值，彩色图中每个位置对应 RGB 等多个通道。
    - 全连接层对任意固定的特征排列都拥有相同的函数容量：如果把所有图像像素以同一种置换重排，模型仍可重新学习一套参数。这里不是说一个训练完成的 MLP 对像素置换不变，而是说全连接架构本身没有偏好真实二维邻接关系。
    - 模型必须从数据重新发现“同一种局部模式可出现在不同位置”。
    - CNN 的优势来自归纳偏置。若任务确实具有局部性和模式复用，约束会减少无谓自由度；若绝对位置或远距离关系决定标签，纯卷积偏置也可能不合适。
  - title: 2. 从全连接层到卷积
    source_heading: 2. 从全连接层到卷积
    paragraphs:
    - 卷积层主要提供等变性：Waldo 从左上移到右下，检测响应峰也随之移动。分类器在汇聚空间信息后才希望“图中是否有 Waldo”基本不受位置影响。
    - 这些约束与自然图像匹配时，模型更容易泛化；若任务标签依赖精确绝对位置，或数据没有规则网格结构，普通卷积可能欠拟合。所有学习都依赖归纳偏置，关键是偏置是否与问题机制相符。
    - 两者只差核在水平和垂直方向的翻转。因为核由数据学习，使用哪一种不会改变可表达函数族：严格卷积会学习到互相关核的翻转版本。可是对手工边缘核或预训练权重，方向有实际意义，不能忽略翻转。
    - 其中 c 枚举输入通道，d 枚举输出通道。每个输出通道从所有输入通道提取一种联合特征。低层通道可能与边缘、颜色或纹理方向相关，但特征通常分布在通道空间的组合方向，不能总把单个通道解释成一个人类概念。
  - title: 3. 图像卷积的实际计算
    source_heading: 3. 图像卷积的实际计算
    paragraphs:
    - 核和偏置是可学习参数。单输入、单输出通道时偏置是一个标量；标准多输出卷积为每个输出通道配一个偏置，并广播到所有空间位置。
    - 需要注意，有限训练样本可能无法唯一识别核。若输入没有足够变化，多组核可能产生相同目标；学到接近真值依赖数据对参数方向提供充分约束。
    - 卷积输出称为特征图：每个空间位置保存相应局部模式的响应。某层一个元素的感受野，是所有可能影响它的前层或原输入元素集合。
    - 填充通常改变感受野在边界处对应真实像素还是填充值，但不改变理论尺寸。深度、较大核和下采样都会扩大深层单元看到的原图范围。
  - title: 4. 填充与步幅
    source_heading: 4. 填充与步幅
    paragraphs:
    - 若输入含高频模式，直接每隔 s 个位置采样会把高频伪装成低频。平均池化、模糊滤波或学习到的低通结构可在下采样前减轻混叠，但标准步幅卷积不自动保证抗混叠。
    - 零填充计算便宜，框架甚至无需真正分配完整填充张量；但它在边界引入与图像内部不同的常量，使网络可推断距离边界的位置。因此零填充既缓解尺寸缩小，又破坏严格平移等变并隐式编码位置。
    - 选择取决于数据的边界机制。纹理处理常用反射填充减少黑边，周期信号可能适合 circular；不存在普遍最佳方式。
    - 它常用于分割、生成模型和解码器，不是让普通卷积窗口真的移动半个离散像素。
  - title: 5. 多输入与多输出通道
    source_heading: 5. 多输入与多输出通道
    paragraphs:
    - 输入通道数必须与核的输入通道数一致。输出单通道不是分别保留每个颜色结果，而是通过核学习跨 RGB 等通道的联合模式。
    - 输出通道是模型设计者选择的表示宽度，不由 RGB 三通道限制。深层网络常在降低空间分辨率的同时增加通道数，以更低分辨率保存更多类型的特征。
    - "“一个通道检测边缘、一个通道检测纹理”是有用直觉，但训练目标只要求通道联合有用。任意可逆通道基变换若由下一层抵消，整体函数可能不变。因此语义可能对应通道空间的某个方向，而不是某个固定索引。"
    - 但反向分解不总可行：两个小核的卷积对大核施加代数秩约束，多通道中间宽度不足时尤其如此。非线性、步幅或复杂填充也阻止简单合并。
  - title: 6. 池化
    source_heading: 6. 池化
    paragraphs:
    - 最大池化保留窗口内最强响应，对“模式是否存在”有效；平均池化汇总所有值，平滑噪声并更像低通下采样。哪一种更好取决于特征语义，原书指出传统视觉 CNN 中
      max pooling 往往优于 average pooling，但现代网络也广泛使用全局平均池化。
    - 池化没有可学习参数，但仍参与计算图。最大池化反向把上游梯度传给窗口中的最大位置；若并列最大，具体分配由实现约定。平均池化把梯度平均分给窗口所有位置。
    - 的固定卷积，并采用相同步幅/填充。多通道时使用 depthwise/grouped 卷积，避免跨通道求和。
    - 现代 CNN 常用步幅卷积替代部分池化，但要注意混叠和计算成本。选择不是“新方法必然更好”，应由架构目标和验证结果决定。
  - title: 7. LeNet：第一套完整 CNN
    source_heading: 7. LeNet：第一套完整 CNN
    paragraphs:
    - Sigmoid 和平均池化反映历史时期选择；现代化实验通常换成 ReLU 和最大池化，但那已经改变了模型，应通过对照实验评估。
    - 逐层打印 shape 是构建 CNN 最廉价的检查之一，可在训练前发现 padding、stride 和展平维数错误。
    - CNN 参数少，但每个核参数跨许多空间位置复用，参与大量乘加，因此可能比参数量相近的 MLP 计算更重。GPU 很适合并行卷积，但真实速度还受批量、内存布局和数据加载影响。
    - 给猫、汽车或随机噪声等分布外输入时，网络仍会产生 logits，甚至可能高置信预测某类服饰。激活“有响应”不等于输入属于训练分布；CNN 本身不会自动可靠拒识
      OOD 样本。
  - title: 8. 可运行的综合实验
    source_heading: 8. 可运行的综合实验
    paragraphs:
    - 手写最大/平均池化与框架实现一致；
    - 圆周填充避免边界信息丢失，在该边界约定下验证平移等变；
  - title: 10. 原章重要练习的推导与延伸
    source_heading: 10. 原章重要练习的推导与延伸
    paragraphs:
    - 局部性表示短时间内采样相关，平移等变表示模式在不同时间出现应得到同类响应。语音转频谱后，还可把时间—频率图作为二维输入；但频率平移的物理含义与空间平移不同，不能机械套用图像假设。
    - 这称为 im2col 思路，复用高效 GEMM，但显式展开会重复存储重叠像素，增加内存。高性能库可选择隐式展开、Winograd 或其他算法。
    - 它比 max/avg 计算昂贵，指数存在数值稳定问题，且输出对所有窗口值都敏感；除非软选择带来明确收益，简单池化更高效。
    - 原章练习中的“把 softmax 层换成 ReLU”应结合当前实现理解：教材网络末层实际输出 logits，并没有显式 softmax 模块；通常应替换的是隐藏
      sigmoid，而不是在最终 logits 后加 ReLU，否则会限制类别分数为非负并与融合交叉熵的常规设定不符。
  - title: 12. 核心结论与一般解题方法
    source_heading: 12. 核心结论与一般解题方法
    paragraphs:
    - 填充控制边界与输出尺寸，步幅控制采样密度；输出形状必须统一“总填充”与“每侧填充”的约定后计算。
    - LeNet 用卷积、sigmoid、平均池化和全连接层完成端到端分类，展示从局部特征到全局类别的完整 CNN。
    - CNN 参数少不代表计算少；核参数在大量空间位置复用，必须分别分析参数、FLOPs、激活内存和真实吞吐。
    - 本章从合理的图像先验推导出 CNN，而不是把卷积当作神秘技巧：位置共享把“同一模式在哪里出现”从独立参数问题变成同一检测器的滑动应用，局部性把不可计算的全连接图像映射压缩为小核，多通道恢复丰富表示，填充、步幅和池化控制空间尺度，深度则把局部感受野组合成全局语义。LeNet
      最终证明，这些简单组件只需按清楚的形状和数据流组合，就能构成可端到端训练、参数高效且具有明确归纳偏置的视觉模型。
  takeaways:
  - 展平图像保留像素值，却丢掉架构对二维邻域的偏好；高分辨率全连接层还会造成参数爆炸。
  - 池化没有学习参数，逐通道聚合窗口；最大池化保留强响应，平均池化平滑信息，二者均可下采样。
  - 明确任务先验：模式是否局部复用，是否需要绝对位置、旋转或尺度信息？
  - 训练前跑 shape trace：随机批量逐层输出形状、参数量和有限性。
  - 本章从合理的图像先验推导出 CNN，而不是把卷积当作神秘技巧：位置共享把“同一模式在哪里出现”从独立参数问题变成同一检测器的滑动应用，局部性把不可计算的全连接图像映射压缩为小核，多通道恢复丰富表示，填充、步幅和池化控制空间尺度，深度则把局部感受野组合成全局语义。LeNet
    最终证明，这些简单组件只需按清楚的形状和数据流组合，就能构成可端到端训练、参数高效且具有明确归纳偏置的视觉模型。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「9.2 平移等变与平移不变」？
  answer: 卷积特征图随输入一起移动，是等变；分类输出不随位置改变才是不变。池化只带来有限局部鲁棒性，不自动获得任意平移不变。
  source_heading: 9.2 平移等变与平移不变
- level: 概念辨析
  question: 原文如何解释「9.6 核大小与感受野」？
  answer: 核大小是当前层一次操作的窗口；感受野是某深层元素在原输入上所有可能影响位置。堆叠后感受野通常远大于单层核。
  source_heading: 9.6 核大小与感受野
- level: 概念辨析
  question: 原文如何解释「9.11 通道求和与池化逐通道」？
  answer: 标准卷积为每个输出通道对所有输入通道求和；普通空间池化逐通道独立执行并保持通道数。
  source_heading: 9.11 通道求和与池化逐通道
- level: 概念辨析
  question: 原文如何解释「9.16 输出层的 softmax」？
  answer: LeNet 代码最后输出 logits，交叉熵内部处理 softmax。
  source_heading: 9.16 输出层的 softmax
- level: 概念辨析
  question: 原文如何解释「9.20 CNN 自动理解旋转和缩放」？
  answer: 普通卷积主要编码平移模式复用，不自动具备旋转、缩放或视角不变性。需要数据增强、专门群等变网络或其他结构。
  source_heading: 9.20 CNN 自动理解旋转和缩放
