overview:
  kind: summary
  minutes: 22
  question: 原文围绕「0. 本章定位：从 bounded batch 转向 unbounded events」建立了怎样的核心认识？
  question_source: 0. 本章定位：从 bounded batch 转向 unbounded events
  thesis: 恢复时restore state、rewind到paired offsets，并隐藏/abort c之后uncommitted outputs。external
    effect若不能加入commit，就必须idempotent/compensatable。
  thesis_source: 6. 知识结构与证据地图
  concepts:
  - term: 0. 本章定位：从 bounded batch 转向 unbounded events
    meaning: batch擅长full recomputation、backfill、audit与bootstrap；stream擅长low-latency
      incremental update。production常以batch snapshot初始化，再从某offset继续stream changes。
    source_heading: 0. 本章定位：从 bounded batch 转向 unbounded events
  - term: 2. Databases and Streams
    meaning: dual writes因independent order/partial failure失效；CDC让one database决定order并把others变followers；snapshot+offset或compacted
      log支持bootstrap；event sourcing进一步把domain history作为authority。
    source_heading: 2. Databases and Streams
  - term: 4. Summary：用可重放日志持续维护derived state
    meaning: stream永不complete，不能等task结束才publish。microbatch/checkpoint建立fine-grained
      recovery boundary；offset、state、outputs与effects需atomic commit，或借stable IDs/offsets实现idempotence并用fencing阻止old
      owner。
    source_heading: 4. Summary：用可重放日志持续维护derived state
  - term: 6. 知识结构与证据地图
    meaning: 恢复时restore state、rewind到paired offsets，并隐藏/abort c之后uncommitted outputs。external
      effect若不能加入commit，就必须idempotent/compensatable。
    source_heading: 6. 知识结构与证据地图
  - term: 8. 核心结论
    meaning: robust architecture组合batch snapshot/backfill与stream delta：batch保证full
      correction，stream保证incremental freshness。
    source_heading: 8. 核心结论
  - term: 10. References
    meaning: 'Tyler Akidau et al. “The Dataflow Model: A Practical Approach to Balancing
      Correctness, Latency, and Cost in Massive-Scale, Unbounded, Out-of-Order Data
      Processing.” PVLDB, August 2015. doi:10.14778/2824032.2824076'
    source_heading: 10. References
  logic:
  - 0. 本章定位：从 bounded batch 转向 unbounded events
  - 2. Databases and Streams
  - 3. Processing Streams
  - 6. 知识结构与证据地图
