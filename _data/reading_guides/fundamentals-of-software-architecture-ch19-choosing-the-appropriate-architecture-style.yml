overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0.1 “通用风格”不等于“任意使用”」建立了怎样的核心认识？
  question_source: 0.1 “通用风格”不等于“任意使用”
  thesis: 选型输出不只是 style 名称。 还包括 topology、ADRs 和持续保护原则的 fitness functions。
  thesis_source: 9. 核心结论
  concepts:
  - term: 0.1 “通用风格”不等于“任意使用”
    meaning: 真正区分风格的往往不是 domain 名称，而是它对关键 architecture characteristics 的支持程度。
    source_heading: 0.1 “通用风格”不等于“任意使用”
  - term: 0.4 本章不提供万能打分公式
    meaning: 本文会增加决策表、约束过滤和可运行示例，均属于教学扩展，不是原书规定的自动选型方法。
    source_heading: 0.4 本章不提供万能打分公式
  - term: 2. Decision Criteria：决策标准
    meaning: 保险应用由多页 forms 组成，每页依赖前页 context，问题本身高度 coupled。强拆 microservices 会产生大量跨服务状态与协调。Intentionally
      coupled 的 service-based architecture 可能更合适。
    source_heading: 2. Decision Criteria：决策标准
  - term: '3. Monolith Case Study: Silicon Sandwiches：单体案例'
    meaning: Core 包含 domain components 和 single relational database。与 modular monolith
      一样，应让 domain/data design 同步分区，为未来 distributed migration 保留路径。
    source_heading: '3. Monolith Case Study: Silicon Sandwiches：单体案例'
  - term: 7. 一般化的问题解决方法
    meaning: 画 domain 依赖图，比较 technical layering、domain modules、plug-ins、events、processors
      或 services 哪种 topology 最自然。
    source_heading: 7. 一般化的问题解决方法
  - term: 9. 核心结论
    meaning: 没有脱离上下文的最佳架构风格。 Style selection 是 domain、characteristics、data、cloud、organization
      和 team/process 分析的结果。
    source_heading: 9. 核心结论
  logic:
  - 0.1 “通用风格”不等于“任意使用”
  - 0.4 本章不提供万能打分公式
  - 1. Shifting “Fashion” in Architecture：架构“时尚”的迁移
  - '3. Monolith Case Study: Silicon Sandwiches：单体案例'
  - '4. Distributed Case Study: Going, Going, Gone：分布式案例'
  - 7. 一般化的问题解决方法
  - 9. 核心结论
  sections:
  - title: 0.1 “通用风格”不等于“任意使用”
    source_heading: 0.1 “通用风格”不等于“任意使用”
    paragraphs:
    - 用 monolith 可以实现拍卖系统，但极端 scalability 会很痛苦；
    - 用 microservices 可以实现强耦合多页保险表单，但会制造大量协调；
    - 用 space-based 可以实现普通后台管理，却为不需要的弹性支付巨额成本。
    - 真正区分风格的往往不是 domain 名称，而是它对关键 architecture characteristics 的支持程度。
  - title: 0.4 本章不提供万能打分公式
    source_heading: 0.4 本章不提供万能打分公式
    paragraphs:
    - 某个 hard constraint 不能被其他高分抵消；
    - Architecture characteristics 会相互作用；
    - 风格经常需要 hybridization；
    - 本文会增加决策表、约束过滤和可运行示例，均属于教学扩展，不是原书规定的自动选型方法。
  - title: 1. Shifting “Fashion” in Architecture：架构“时尚”的迁移
    source_heading: 1. Shifting “Fashion” in Architecture：架构“时尚”的迁移
    paragraphs:
    - 软件行业对 architecture styles 的偏好不断变化。这里的 fashion 不是贬义：偏好变化通常来自真实痛点、新能力和外部环境，只是任何趋势都可能被过度套用。
    - 例如，曾经的架构以 code reuse 为中心；实践发现 reuse 会引入 coupling、协调发布和巨大变化半径，于是后来的风格重新思考 shared
      code，DDD 和 microservices 更强调 bounded context 与自治。
    - 原章以 generative AI 的兴起为突出例子。架构师无法等生态“稳定后再决定”，必须建立可逆决策、fitness functions 和演化路径。
    - Business domain 会随市场、法规、组织合并和产品演化而变化。昨天合理的 bounded context，明天可能需要拆分或合并；一次 M&A
      可能带来两套客户、订单和财务系统。
  - title: 2. Decision Criteria：决策标准
    source_heading: 2. Decision Criteria：决策标准
    paragraphs:
    - 大部分 generic styles 都能实现一般 domain。例外是有特殊 operational requirements 的系统，如 highly
      scalable auction site。这类 hard requirement 会强烈缩小候选范围。
    - Microservices 在 deployability/testability 上理论很强，但没有 automated pipelines、contract
      tests 和 platform support 时，服务数量只会增加人工发布和测试负担。
    - 保险应用由多页 forms 组成，每页依赖前页 context，问题本身高度 coupled。强拆 microservices 会产生大量跨服务状态与协调。Intentionally
      coupled 的 service-based architecture 可能更合适。
    - Architecture quantum 是重要分析工具。若系统只有一个功能内聚且同步耦合的 quantum，分布式拆分可能没有收益；若多个部分在 scale、availability、security、deployability
      上显著不同，应考虑多个 quanta。
  - title: '3. Monolith Case Study: Silicon Sandwiches：单体案例'
    source_heading: '3. Monolith Case Study: Silicon Sandwiches：单体案例'
    paragraphs:
    - Silicon Sandwiches kata 在第 5 章完成 architecture characteristics analysis 后，确定
      single quantum 足够。系统简单、预算不大，monolith 的 simplicity 很有吸引力。
    - 若时间和资源允许，database tables/assets 也应按 domain components 分区。物理上仍是一库，但逻辑边界清晰，未来
      distributed migration 更容易。
    - Customizability 是 Silicon Sandwiches 已识别的 architecture characteristic。Microkernel
      的 core + plug-ins shape 与该需求天然同构。
    - Core 包含 domain components 和 single relational database。与 modular monolith 一样，应让
      domain/data design 同步分区，为未来 distributed migration 保留路径。
  - title: '4. Distributed Case Study: Going, Going, Gone：分布式案例'
    source_heading: '4. Distributed Case Study: Going, Going, Gone：分布式案例'
    paragraphs:
    - 系统还明确要求 ambitious scale、elasticity、performance，以及 fine-grained customization。单一
      quantum/characteristic set 无法自然表达。
    - 在 distributed candidates 中，low-level event-driven architecture 和 microservices
      最匹配大多数 requirements。
    - Microservices 更适合的关键原因：支持各部分拥有不同 operational architecture characteristics。Pure
      event-driven 通常按 orchestrated/choreographed communication 分离，而不是按不同 characteristic
      sets 划分服务边界。
    - 选择 microservices，再智能使用 events/messages，使 generic pattern 获得所需运行能力，同时给未来 development/expansion
      留出基础。
  - title: 7. 一般化的问题解决方法
    source_heading: 7. 一般化的问题解决方法
    paragraphs:
    - 从具体场景推导必须改变 topology 的 characteristics，区分 hard constraints、重要 drivers 和普通 desiderata。
    - 画 domain 依赖图，比较 technical layering、domain modules、plug-ins、events、processors
      或 services 哪种 topology 最自然。
    - 明确 owner、transaction、replication、reporting 和 legacy constraints，不画无数据的空服务盒子。
    - 为每条 async edge 写清理由：burst buffer、fault isolation、different rates、latency 或 event
      semantics。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - 没有脱离上下文的最佳架构风格。 Style selection 是 domain、characteristics、data、cloud、organization
      和 team/process 分析的结果。
    - Domain/architecture isomorphism 比较问题与 topology 的形状。 Microkernel 匹配 customization；高语义耦合领域不一定适合极端解耦。
    - Silicon Sandwiches 只需一个 quantum。 Modular monolith 更简单，microkernel 与 customizability
      更同构，并可用 BFF 扩展设备。
    - GGG 需要不同 operational characteristics 与五个 quanta。 Microservices 主体加选择性 events/messages
      更适合。
  takeaways:
  - 没有脱离上下文的最佳架构风格。 Style selection 是 domain、characteristics、data、cloud、organization
    和 team/process 分析的结果。
  - Data architecture 必须早期参与。 Data ownership、transaction 和 flow 会直接塑造服务与通信边界。
  - Monolith/distributed 的关键是 characteristic sets 与 quanta，不是系统大小。 一套特征倾向单体，多套特征倾向分布式。
  - GGG 需要不同 operational characteristics 与五个 quanta。 Microservices 主体加选择性 events/messages
    更适合。
  - 不要问哪种风格最先进；要问业务是什么形状、哪些特征不能妥协、组织能支付什么复杂度，以及哪种拓扑留下的残余风险最可接受。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.1 “It depends” 表示没有方法」？
  answer: 错误。它表示必须显式分析 context、characteristics、data、organization、teams 和 shape，而不是套模板。
  source_heading: 6.1 “It depends” 表示没有方法
- level: 概念辨析
  question: 原文如何解释「6.6 Distributed 一定比 Monolith 更能扩展」？
  answer: 取决于瓶颈和数据。共享数据库、长同步链和错误粒度会让 distributed system 更慢、更脆。
  source_heading: 6.6 Distributed 一定比 Monolith 更能扩展
- level: 概念辨析
  question: 原文如何解释「6.11 组织成熟度与 Architecture 无关」？
  answer: 错误。缺乏 Agile/DevOps automation 的组织无法实现 microservices 的理论高 deployability，实际只会增加人工工作。
  source_heading: 6.11 组织成熟度与 Architecture 无关
- level: 概念辨析
  question: 原文如何解释「6.16 BFF 应包含所有业务逻辑」？
  answer: 错误。案例 BFF 是 thin adapter，转换 device-specific format、pagination、latency 等；核心业务仍在
    backend/core。
  source_heading: 6.16 BFF 应包含所有业务逻辑
- level: 概念辨析
  question: 原文如何解释「6.21 Fitness Function 是一次验收测试」？
  answer: 错误。它应持续保护 architecture principles/characteristics，例如 Override 引用、通信方向、latency
    或 coupling。
  source_heading: 6.21 Fitness Function 是一次验收测试
