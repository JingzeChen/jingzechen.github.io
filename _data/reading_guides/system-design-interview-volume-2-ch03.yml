overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章要解决的三个不同问题」建立了怎样的核心认识？
  question_source: 0. 本章要解决的三个不同问题
  thesis: Ranker 把算法最优转成用户可接受。 收费、模式和偏好可能让“最快”不是最终首选。
  thesis_source: 9. 核心结论
  concepts:
  - term: 0. 本章要解决的三个不同问题
    meaning: 导航路径：把道路建模为图，按地理区域和道路层级切成路由瓦片；A* 找候选路线，ETA 服务结合实时与历史交通预测耗时，Ranker 再按用户约束排序。
    source_heading: 0. 本章要解决的三个不同问题
  - term: 2.6 道路如何变成图
    meaning: 边/转向属性表达限行、收费和模式权限。
    source_heading: 2.6 道路如何变成图
  - term: 4.3 Map Rendering
    meaning: 离线为每个缩放层生成固定网格瓦片，每张由唯一空间标识定位。客户端根据位置和 zoom 计算 URL，直接从 CDN 获取。
    source_heading: 4.3 Map Rendering
  - term: 5.4 Geocoding Database
    meaning: 原书用 Redis/KV 表示读多写少的快速读取。现实地理编码通常还需要全文检索、前缀、模糊匹配和排序，仅用精确 KV 可能不够；但本章把它简化为已规范化地点到坐标的读取。
    source_heading: 5.4 Geocoding Database
  - term: 5.9.5 A* 的适用边界
    meaning: 转弯限制有时需要把“到达节点的入边状态”纳入图状态，而不是只把路口视为节点。
    source_heading: 5.9.5 A* 的适用边界
  - term: 第九步：端到端验证
    meaning: 本章最值得迁移的方法是：先按数据变化速度和消费方式分离系统，再用空间切片、层级图、边缘缓存与事件流分别控制规模，最后把稳定的可行路线和动态的时间预测组合起来。
    source_heading: 第九步：端到端验证
  logic:
  - 0. 本章要解决的三个不同问题
  - 2.6 道路如何变成图
  - 3.4 所有缩放层级总存储
  - 5.4 Geocoding Database
  - 5.7.3 矢量瓦片
  - 7.17 客户端缓存与 CDN 缓存解决不同问题
  - 第九步：端到端验证
  sections:
  - title: 0. 本章要解决的三个不同问题
    source_heading: 0. 本章要解决的三个不同问题
    paragraphs:
    - 位置数据路径：移动端持续采样位置，批量上传，保存后通过 Kafka 供交通、道路更新、个性化和分析使用。
    - 地图渲染路径：把世界地图离线切成多缩放级别的静态瓦片，通过 CDN 就近下发，由客户端拼接显示。
    - 导航路径：把道路建模为图，按地理区域和道路层级切成路由瓦片；A* 找候选路线，ETA 服务结合实时与历史交通预测耗时，Ranker 再按用户约束排序。
    - 作者的整体方法是先建立地理与地图基础，再做数量级估算，随后提出三个核心服务的高层设计，最后分别深入数据、渲染、导航和动态重规划。
  - title: 2.2 从 3D 地球到 2D 地图：地图投影
    source_heading: 2.2 从 3D 地球到 2D 地图：地图投影
    paragraphs:
    - 由于球面不能无失真展开到平面，投影通常会在面积、角度、距离或方向中牺牲一部分。原书列举 Mercator、Peirce quincuncial、Gall-Peters
      和 Winkel tripel 等投影。
    - 因此屏幕上的平面距离不能在所有尺度和纬度直接当真实地表距离。地图渲染选择投影是视觉与切片问题，路线算法则应使用适合道路图的距离/时间权重。
  - title: 2.6 道路如何变成图
    source_heading: 2.6 道路如何变成图
    paragraphs:
    - 边/转向属性表达限行、收费和模式权限。
    - 每块包含区域内节点与边的邻接表；
  - title: 3.4 所有缩放层级总存储
    source_heading: 3.4 所有缩放层级总存储
    paragraphs:
    - 67 PB 是基于“最高层 50 PB、每层四分之一”的数学和；
    - 100 PB 是容量规划数量级，不是同一公式的精确结果。
  - title: 4.3 Map Rendering
    source_heading: 4.3 Map Rendering
    paragraphs:
    - 输出不稳定或键空间过细时难以高效缓存；
    - 离线为每个缩放层生成固定网格瓦片，每张由唯一空间标识定位。客户端根据位置和 zoom 计算 URL，直接从 CDN 获取。
    - Origin 只承受 miss；
  - title: 5.4 Geocoding Database
    source_heading: 5.4 Geocoding Database
    paragraphs:
    - Geocoding DB 保存地点/地址及其坐标。导航先把 origin 和 destination 转为经纬度，再交给 Route Planner。
    - 原书用 Redis/KV 表示读多写少的快速读取。现实地理编码通常还需要全文检索、前缀、模糊匹配和排序，仅用精确 KV 可能不够；但本章把它简化为已规范化地点到坐标的读取。
  - title: 5.7.3 矢量瓦片
    source_heading: 5.7.3 矢量瓦片
    paragraphs:
    - 几何数据通常比图片更易压缩，节省带宽；
    - 连续缩放更平滑，不会出现栅格像素放大；
    - 可在客户端动态换颜色、语言、图层和样式；
    - 客户端需要更多 CPU/GPU、内存和复杂渲染代码；
  - title: 5.9.5 A* 的适用边界
    source_heading: 5.9.5 A* 的适用边界
    paragraphs:
    - 不可采纳启发式可能失去最优保证；
    - 静态最短距离不等于最快 ETA；
    - top-k 不只是重复跑一次 A*，需使用 k-shortest paths 等变体并控制路线多样性；
    - 转弯限制有时需要把“到达节点的入边状态”纳入图状态，而不是只把路口视为节点。
  - title: 7.17 客户端缓存与 CDN 缓存解决不同问题
    source_heading: 7.17 客户端缓存与 CDN 缓存解决不同问题
    paragraphs:
    - 客户端缓存减少用户重复下载与离线失败；
    - CDN 缓存让同一区域大量用户共享边缘副本并保护 Origin。
  - title: 第九步：端到端验证
    source_heading: 第九步：端到端验证
    paragraphs:
    - 道路规则错误时是否会给出不可执行路线；
    - CDN miss 或 Origin 故障怎样降级；
    - Traffic DB 陈旧时是否退化到历史 ETA；
    - 本章最值得迁移的方法是：先按数据变化速度和消费方式分离系统，再用空间切片、层级图、边缘缓存与事件流分别控制规模，最后把稳定的可行路线和动态的时间预测组合起来。
  takeaways:
  - 全球地图问题首先要分解数据路径。 位置事件、视觉瓦片、道路图和交通状态的生命周期与访问模式不同。
  - 批量上传降低请求与无线开销。 每秒采样、15 秒一批把请求 QPS 降低 15 倍，但不丢失轨迹粒度。
  - 可采纳启发式在保留最优保证的同时减少无关图扩展。
  - 位置流反哺地图形成数据闭环。 用户轨迹帮助推断交通、新路和封路，持续改善路线与 ETA。
  - 工程估算关注数量级而非伪精确。 67 PB 的数学和可上调到约 100 PB 作为真实容量规划起点。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 地图瓦片不等于路由瓦片」？
  answer: 前者供视觉渲染，后者是图算法二进制数据。空间范围可以一致，内容和消费者完全不同。
  source_heading: 7.1 地图瓦片不等于路由瓦片
- level: 概念辨析
  question: 原文如何解释「7.6 ETA 不是当前速度的简单除法」？
  answer: 用户到达后续路段时交通已经变化，必须预测未来 10～20 分钟的边耗时。
  source_heading: 7.6 ETA 不是当前速度的简单除法
- level: 概念辨析
  question: 原文如何解释「7.12 CDN 不是永久权威存储」？
  answer: Origin/对象存储是权威瓦片来源，CDN 是边缘副本。缓存 miss、失效和版本切换仍要回源。
  source_heading: 7.12 CDN 不是永久权威存储
- level: 概念辨析
  question: 原文如何解释「7.18 客户端直接算 URL 不是零成本架构」？
  answer: 它省掉服务请求，却把编码协议变成移动客户端长期契约，迁移速度受应用发布周期限制。
  source_heading: 7.18 客户端直接算 URL 不是零成本架构
- level: 概念辨析
  question: 原文如何解释「7.24 准确路线不等于永远不变路线」？
  answer: 道路结构正确与实时最优是两层目标。交通变化后改道不是前一次路线“错误”，而是动态边权变化。
  source_heading: 7.24 准确路线不等于永远不变路线
