  sections:
  - title: 0. 本章定位与阅读主线
    source_heading: 0. 本章定位与阅读主线
    paragraphs:
    - 训练时改进（training-time learning）：采集同一任务的多条轨迹，评价结果，通过 GRPO 或 GSPO 更新模型参数，让未来一次调用本身更可能产生好轨迹。
    - 测试时改进（test-time compute）：模型参数保持不变，在当前请求上投入更多采样、评价和树搜索，探索多个未来再选择答案。
    - 作者最终用 rLLM 把两者连接起来：搜索和多 Agent 工作流产生轨迹，轨迹经过奖励与相对比较成为训练数据，更新后的策略又能在下一轮搜索中作出更好的选择。
    - Agent 看似“自我改进”，实际依赖一套明确的工程闭环：谁生成经验、怎样定义好坏、如何限制策略漂移、预算怎样分配、哪些参数真的被更新。
  - title: 2. Better in Groups：为什么相对排名有用
    source_heading: 2. Better in Groups：为什么相对排名有用
    paragraphs:
    - 对数学题，可以直接判定答案等于目标；对诗歌、解释、研究报告或客户对话，“0.73 分”缺少天然单位。不同 judge、提示和时间给同一个答案的绝对分也可能漂移。
    - 相对评价不要求跨任务的 0.8 都代表完全相同的质量，只要求同一组内排序大体一致。它把困难从“建立全球统一标尺”降低为“识别局部差异”。
    - 优势之和约为 0。第一首诗得到明显正信号，第二首略高于平均，跑题回答得到强负信号。
    - 因此，能程序验证的维度应优先使用硬验证器，开放式维度再交给相对 judge。
  - title: 4. GRPO：组相对策略优化
    source_heading: 4. GRPO：组相对策略优化
    paragraphs:
    - PPO 常训练一个 critic 估计状态价值。对长文本和复杂 Agent 轨迹，critic 会增加参数、显存、训练难度与估计误差。Group Relative
      Policy Optimization（GRPO）对同一 query 采样多个候选，用组内平均表现作为基线，从而无需单独学习 critic。
    - 该比率让旧策略采集的数据可以估计当前策略目标，但两者差得越远，估计方差越大，所以需要 clipping 和频繁刷新 rollout。
    - 只有 clipping 时，许多小步仍可能逐渐远离最初能力；只有 KL 时，单个 minibatch 的高方差更新仍可能不稳。它们是不同时间尺度的稳定器。
    - "“无需手工 reward scaling”指组归一化减少尺度调参，不代表完全不需要设计 reward、rubric、group 和安全约束。"
  - title: 6. Taking Off the Training Wheels：RULER 与 ART 的分工
    source_heading: 6. Taking Off the Training Wheels：RULER 与 ART 的分工
    paragraphs:
    - 谁负责运行工具 Agent、采集 trajectory group 并执行训练？
    - RULER（Relative Universal LLM-Elicited Rewards）：用 LLM-as-judge 依据任务与 rubric 相对评价多条轨迹，属于奖励/判断层。
    - ART（Agent Reinforcement Trainer/Training）：采集工具使用轨迹并基于 GRPO 更新可训练 Agent，属于 rollout
      与行为优化层。
    - RULER 不负责更新模型；ART 也不会自动知道“什么是好”。二者通过 trajectory reward 接口连接。
  - title: 8. Hybrid Reward：把硬正确性与软质量结合
    source_heading: 8. Hybrid Reward：把硬正确性与软质量结合
    paragraphs:
    - 这体现“correctness first, quality second”。
    - 若一组没有正确解，所有 reward 都为 0，无法从“接近正确”中学习；
    - RULER 只在正确答案间有意义，但原实现先对所有 trajectory 打分再 gate；
    - 可逐步加入部分奖励、错误类型课程或先过滤正确候选再做质量排序，但每一种 shaping 都可能产生新的投机路径。
  - title: 10. Test-Time Compute：用更多“思考”代替更多参数
    source_heading: 10. Test-Time Compute：用更多“思考”代替更多参数
    paragraphs:
    - 扩大模型参数量需要昂贵的预训练与部署资源，而且每个请求都承担更大的基础成本。Test-time compute（测试时计算、推理时计算）采用另一条轴：模型权重固定，对困难请求增加采样、反思、验证和搜索步骤。
    - 它把一次性的训练规模换成按请求支付的计算量。优势是可以按任务难度自适应；代价是延迟、费用和 judge 误差也随步骤增长。
    - "“小模型加更多思考可匹配大模型”是某些任务和预算下的经验性结果，不是普遍定理。若小模型不能生成任何有效候选，搜索只是在坏空间中反复选择；若 judge
      不可靠，更多搜索甚至会强化错误。"
    - 同一评价器可以跨训练与推理复用，但有过拟合风险：若策略在训练时已经学会迎合 judge，测试搜索再按同一 judge 最大化，reward hacking
      会被放大。最终高风险答案应有独立 verifier 或人工评价。
  - title: 12. AB-MCTS：自适应决定“开新路”还是“继续改”
    source_heading: 12. AB-MCTS：自适应决定“开新路”还是“继续改”
    paragraphs:
    - Adaptive Branching MCTS（AB-MCTS）的核心不是简单“分支更多”，而是把是否产生一个新分支本身变成搜索决策。
    - 均值高的分支常抽到高值，因此被利用；不确定性大的分支偶尔抽到很高值，因此获得探索机会。随着观测增加，后验变窄，选择逐渐集中。
    - 二者都按 posterior uncertainty 分配计算：不确定时探索，已有高质量证据时 refinement。
    - "“Bayesian”不表示评价就客观；posterior 只是基于 judge 分数与建模假设更新。judge 有系统偏差时，算法会更有把握地优化错误目标。"
  - title: 14. rLLM：让整个 Agent 工作流参与 RL
    source_heading: 14. rLLM：让整个 Agent 工作流参与 RL
    paragraphs:
    - 真实 Agent 程序可能包含 planner、executor、solver、judge、条件分支、并行任务和搜索树。只训练一个 worker，其他组件的决策仍是固定或互不适配的。
    - RULER 可以为 ART 或 rLLM 提供 reward；ART 适合聚焦一个工具 Agent；rLLM 处理更大的程序结构。选择应看训练对象，而不是按框架名称判断谁“更高级”。
    - 但“同一个 production workflow 用于训练”不意味着可以直接拿真实生产副作用做在线探索。涉及付款、邮件、删改数据时应使用模拟环境、沙箱或离线
      replay，并对策略版本做审批和渐进发布。
    - 这把手写 UCT、prompt 或固定 branching heuristic 逐步变成可优化策略。但搜索策略必须在不同任务上泛化，否则只是记住训练分布中的
      evaluator 偏好。
  - title: 17. 从本章抽象出的设计与实验方法
    source_heading: 17. 从本章抽象出的设计与实验方法
    paragraphs:
    - 至少记录：task ID、policy/reference/judge 版本、prompt、消息、工具调用与观察、终止原因、token/延迟/成本、hard
      metrics、raw/normalized reward 和随机 seed。否则失败无法归因，旧数据也无法可靠重放。
    - 同一 group 使用相同任务与约束，保证候选有足够多样性。检查 reward variance；全相同时跳过或重新采样。group size 增大可改善比较，但
      rollout 成本线性上升。
    - 监控：KL、clip fraction、reward mean/std、entropy、输出长度、工具使用、拒答/安全指标和 held-out accuracy。训练
      reward 上升但独立评估下降，是 reward hacking 或过拟合信号。
    - 比较 one-shot、best-of-K、sequential refinement、MCTS/AB-MCTS 时，应对齐总调用、token 或美元预算，并使用同一独立
      evaluator。报告质量—成本—延迟曲线，而非只展示最好一次。
  - title: 19. 本章知识结构与核心结论
    source_heading: 19. 本章知识结构与核心结论
    paragraphs:
    - GRPO 用同题 group baseline 产生 advantage，省去 learned critic；token-level ratio 仍可能在长序列中积累方差。
    - MCTS 通过 selection、expansion、simulation 和 backpropagation 在宽度与深度间分配预算；UCT 分数是决策上界，不是答案质量本身。
    - rLLM 让 planner、solver、judge 和搜索节点共同产生 Episode 并参与 RL，但系统级 credit assignment
      与非平稳性更难。
    - 可迁移的一般方法是：先定义可观察经验和真实验收，再选择评价尺度；用保守约束把反馈变成更新；对单次难题按不确定性分配搜索预算；扩展到系统前，始终保留独立
      verifier、版本和成本基线。
  takeaways:
  - 奖励把行动和后果连接起来，trajectory 保存过程，rollout group 提供同题替代路径。
  - Hybrid reward 应让 hard correctness/safety 先 gate，再用 LLM judge 塑造软质量。
  - rLLM 让 planner、solver、judge 和搜索节点共同产生 Episode 并参与 RL，但系统级 credit assignment 与非平稳性更难。
  - 单一 judge 不适合所有维度，于是用程序 verifier 与 RULER 构造 hybrid reward；
  - 可迁移的一般方法是：先定义可观察经验和真实验收，再选择评价尺度；用保守约束把反馈变成更新；对单次难题按不确定性分配搜索预算；扩展到系统前，始终保留独立 verifier、版本和成本基线。
