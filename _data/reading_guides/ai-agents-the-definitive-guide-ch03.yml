overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 本章定位与阅读主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与阅读主线
  thesis: 可迁移的一般方法是：先定义可观察经验和真实验收，再选择评价尺度；用保守约束把反馈变成更新；对单次难题按不确定性分配搜索预算；扩展到系统前，始终保留独立
    verifier、版本和成本基线。
  thesis_source: 19. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与阅读主线
    meaning: 训练时改进（training-time learning）：采集同一任务的多条轨迹，评价结果，通过 GRPO 或 GSPO 更新模型参数，让未来一次调用本身更可能产生好轨迹。
    source_heading: 0. 本章定位与阅读主线
  - term: 4. GRPO：组相对策略优化
    meaning: PPO 常训练一个 critic 估计状态价值。对长文本和复杂 Agent 轨迹，critic 会增加参数、显存、训练难度与估计误差。Group
      Relative Policy Optimization（GRPO）对同一 query 采样多个候选，用组内平均表现作为基线，从而无需单独学习 critic。
    source_heading: 4. GRPO：组相对策略优化
  - term: 8. Hybrid Reward：把硬正确性与软质量结合
    meaning: 可逐步加入部分奖励、错误类型课程或先过滤正确候选再做质量排序，但每一种 shaping 都可能产生新的投机路径。
    source_heading: 8. Hybrid Reward：把硬正确性与软质量结合
  - term: 10. Test-Time Compute：用更多“思考”代替更多参数
    meaning: 同一评价器可以跨训练与推理复用，但有过拟合风险：若策略在训练时已经学会迎合 judge，测试搜索再按同一 judge 最大化，reward
      hacking 会被放大。最终高风险答案应有独立 verifier 或人工评价。
    source_heading: 10. Test-Time Compute：用更多“思考”代替更多参数
  - term: 14. rLLM：让整个 Agent 工作流参与 RL
    meaning: 但“同一个 production workflow 用于训练”不意味着可以直接拿真实生产副作用做在线探索。涉及付款、邮件、删改数据时应使用模拟环境、沙箱或离线
      replay，并对策略版本做审批和渐进发布。
    source_heading: 14. rLLM：让整个 Agent 工作流参与 RL
  - term: 19. 本章知识结构与核心结论
    meaning: 可迁移的一般方法是：先定义可观察经验和真实验收，再选择评价尺度；用保守约束把反馈变成更新；对单次难题按不确定性分配搜索预算；扩展到系统前，始终保留独立
      verifier、版本和成本基线。
    source_heading: 19. 本章知识结构与核心结论
