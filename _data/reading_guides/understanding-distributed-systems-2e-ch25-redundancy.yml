overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 本章定位：冗余是第一道防线，但不是副本计数游戏」建立了怎样的核心认识？
  question_source: 0. 本章定位：冗余是第一道防线，但不是副本计数游戏
  thesis: Stateful redundancy 还要 state synchronization、leader/fencing、quorum 和 catch-up，远比
    stateless 难。
  thesis_source: 20. 核心结论
  concepts:
  - term: 0. 本章定位：冗余是第一道防线，但不是副本计数游戏
    meaning: 对 stateless service，复制 binary/instances 即可；对 stateful service，还需 state
      synchronization、leader/ownership、consistency、fencing 与 repair。
    source_heading: 0. 本章定位：冗余是第一道防线，但不是副本计数游戏
  - term: 4.4 Stateful service 更难
    meaning: Preserve acknowledged writes；
    source_heading: 4.4 Stateful service 更难
  - term: 8. 25.1 Correlation：副本为什么会一起失败
    meaning: 所有 servers 在同一 data center：fiber cut、electrical storm/power event 让整
      DC down。无论内部有多少副本，application unavailable。
    source_heading: 8. 25.1 Correlation：副本为什么会一起失败
  - term: 10. Availability Zones
    meaning: AWS/Azure 等 cloud provider 将 region 建成多个 data centers，称 Availability
      Zones（AZs），通过高速网络互联。
    source_heading: 10. Availability Zones
  - term: 14. 可运行 C11 示例：四前提与 correlated failure ceiling
    meaning: Node 1 独立 hardware fault；health detection 前 30 requests 仍发给坏 node；
    source_heading: 14. 可运行 C11 示例：四前提与 correlated failure ceiling
  - term: 21. 一般化的解决问题方法
    meaning: 追踪 rack/AZ/region、network/power、software/config、DNS/cert、operator/control
      plane 的 common fate。
    source_heading: 21. 一般化的解决问题方法
  logic:
  - 0. 本章定位：冗余是第一道防线，但不是副本计数游戏
  - 4.4 Stateful service 更难
  - 6. 四个前提如何组成闭环
  - 10. Availability Zones
  - 12. Multi-region 是否值得
  - 18. 作者如何形成解决思路
  - 21. 一般化的解决问题方法
  sections:
  - title: 0. 本章定位：冗余是第一道防线，但不是副本计数游戏
    source_heading: 0. 本章定位：冗余是第一道防线，但不是副本计数游戏
    paragraphs:
    - 二者不等价。增加 read replicas 可能提升吞吐，却因错误 failover、共同配置或容量不足而不提升可用性。
    - Redundancy 是通过多份功能/state 获得替代路径的 resilience property；
    - 每份 redundancy 是否 current、reachable、independent，决定它能否 takeover。
    - 对 stateless service，复制 binary/instances 即可；对 stateful service，还需 state synchronization、leader/ownership、consistency、fencing
      与 repair。
  - title: 2. 前提一：冗余复杂度不能反噬可用性
    source_heading: 2. 前提一：冗余复杂度不能反噬可用性
    paragraphs:
    - 因此 logical LB 也必须由冗余 fleet、VIP/Anycast/managed service 实现，不能只加一个单机代理。
    - Stateless pool 前的 load balancer 确实增加复杂度和 failure modes，但 scalability/availability
      收益几乎总能超过风险，前提是 LB 本身被正确设计和运营。
    - 单 region 需求不必立刻 active-active multi-region；
    - Managed LB/DB 可减少自建 control-plane 风险；
  - title: 4.4 Stateful service 更难
    source_heading: 4.4 Stateful service 更难
    paragraphs:
    - Replica state up-to-date；
    - Promote/elect owner；
    - Preserve acknowledged writes；
    - Reconfigure other replicas；
  - title: 6. 四个前提如何组成闭环
    source_heading: 6. 四个前提如何组成闭环
    paragraphs:
    - Detect 缺失：bad node 持续失败；
    - Degraded capacity 缺失：摘除导致 overload；
    - Validation 缺失：坏 replacement 被引流；
    - Complexity 太高：failover 本身失败。
  - title: 8. 25.1 Correlation：副本为什么会一起失败
    source_heading: 8. 25.1 Correlation：副本为什么会一起失败
    paragraphs:
    - 若多个 redundant nodes 因相同原因在相近时间失效，failures correlated。
    - 一台 server 的 faulty memory module 导致 crash，另一台不同机器同一时刻因同原因 crash 的概率通常较低。因此 machine-level
      distribution 有价值。
    - "“独立”仍是近似：同批 hardware/firmware、同 software workload 可相关。"
    - 所有 servers 在同一 data center：fiber cut、electrical storm/power event 让整 DC down。无论内部有多少副本，application
      unavailable。
  - title: 10. Availability Zones
    source_heading: 10. Availability Zones
    paragraphs:
    - AWS/Azure 等 cloud provider 将 region 建成多个 data centers，称 Availability Zones（AZs），通过高速网络互联。
    - Protocol label 不能替代产品 durability contract：ack 到 memory、WAL、fsync、quorum apply
      含义不同。
    - 失去一个 AZ 仍有 2。但若两个 replicas 同 AZ，失去该 AZ 就失去 quorum。Replica count 和 placement
      同等重要。
    - Multi-AZ 主要降低特定 infrastructure correlation，不消除所有 common cause。
  - title: 12. Multi-region 是否值得
    source_heading: 12. Multi-region 是否值得
    paragraphs:
    - Entire region destroyed 的概率极低。在投入 region-failure resilience 前，应有 very good reasons。
    - 并比较 mitigation cost。即使 probability 低，impact 极大或业务不可接受，也可能值得；反之不能只为架构“高级”而做。
    - 原章指出更常见原因可能是法律合规（legal compliance）：European customer data 必须在 Europe 处理和存储等
      data residency 要求。
    - 这不等于所有欧洲法律都简单要求“绝不离开 Europe”；具体法规、合同和跨境机制需法律解释。架构应将 residency policy 编码为 placement/routing/audit
      constraint。
  - title: 14. 可运行 C11 示例：四前提与 correlated failure ceiling
    source_heading: 14. 可运行 C11 示例：四前提与 correlated failure ceiling
    paragraphs:
    - Node 1 独立 hardware fault；health detection 前 30 requests 仍发给坏 node；
    - Replacement 先 warm/readiness，再恢复 3-node full redundancy；
    - 跨 failure-domain standby 接管 90，展示降低 correlation；
    - Remote 只有一台且 capacity 50，故意展示 placement 不等于足够 capacity；
  - title: 18. 作者如何形成解决思路
    source_heading: 18. 作者如何形成解决思路
    paragraphs:
    - LB complexity 是成本；health check 是检测；剩余 capacity 是 degraded；replacement 是恢复 full
      redundancy。
    - State replication/consistency/failover 使四项更难，提醒“复制实例”与“复制正确 state”不同。
    - 不同机器降低 memory-module fault correlation，却不能抵御 fiber/power/DC fault。由此引出 failure
      domain。
    - Global DNS + async cross-region state 可容忍 region catastrophe，但增加 RPO、成本和复杂度。
  - title: 21. 一般化的解决问题方法
    source_heading: 21. 一般化的解决问题方法
    paragraphs:
    - 追踪 rack/AZ/region、network/power、software/config、DNS/cert、operator/control plane
      的 common fate。
    - 优化 detection、provision、copy、catch-up、validation，但对 repair 限速，避免损害 foreground。
    - Ready 只是最低门槛，逐步加 traffic并观察 cache、latency 和 error，防 recovery cascade。
    - AZ 内低 RTT 可同步；region 间通常异步。明确 ack、RPO、conflict 和 failover，不追求抽象上的“最强”。
  takeaways:
  - Redundancy 复制 functionality 或 state，是 failure defense 和 horizontal scale 的共同模式。
  - 10 台中一台坏而未摘除，等权下约 10% requests 失败；检测时间决定暴露窗口。
  - 不同机器可降低单 memory-module fault correlation，同一 DC 的 fiber/power fault 会同时打掉所有副本。
  - Multi-region 用 global DNS 分流，并因高 RTT 通常异步复制 state，接受 replication lag/RPO。
  - Replication 不是 backup；坏写、删除和 corruption 仍需独立恢复点。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.1 Redundancy 与 capacity」？
  answer: 副本可同时提供 spare capacity 和替代路径；若平时已满载，就没有 failover capacity。
  source_heading: 15.1 Redundancy 与 capacity
- level: 概念辨析
  question: 原文如何解释「15.7 Correlated 与 cascading」？
  answer: Cascading：一个 fault 经 load/retry逐步传播。
  source_heading: 15.7 Correlated 与 cascading
- level: 概念辨析
  question: 原文如何解释「16.2 “有 load balancer 就没有 SPOF”」？
  answer: LB 自身、DNS、certificate、control plane 仍可能是 shared dependency。
  source_heading: 16.2 “有 load balancer 就没有 SPOF”
- level: 概念辨析
  question: 原文如何解释「16.7 “跨机器就不相关”」？
  answer: 同 rack/DC/region、软件、配置、DNS、cert 和 operator 都造成 correlation。
  source_heading: 16.7 “跨机器就不相关”
- level: 概念辨析
  question: 原文如何解释「16.13 “Managed multi-AZ 无需理解语义”」？
  answer: 仍需知道 failover、ack durability、RPO/RTO、endpoint、capacity 和 test 方法。
  source_heading: 16.13 “Managed multi-AZ 无需理解语义”
