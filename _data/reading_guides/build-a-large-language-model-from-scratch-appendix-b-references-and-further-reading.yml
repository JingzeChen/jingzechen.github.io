  sections:
  - title: 0.2 阅读一项引用时要问的六个问题
    source_heading: 0.2 阅读一项引用时要问的六个问题
    paragraphs:
    - 干预变量：数据、参数量、算力、训练 token、评价是否同时变化？
    - 证据范围：结论来自理论、受控实验、benchmark，还是单个案例？
    - 可复现性：数据、代码、weights、日志和超参数开放到什么程度？
    - 外推边界：在另一语言、领域、模型规模、硬件或时间点上是否仍成立？
  - title: Chapter 2
    source_heading: Chapter 2
    paragraphs:
    - 编码新文本时，不是重新统计新文本 pair frequency，而是按训练得到的 merge ranks 应用规则。Vocabulary、merge table、normalization、special
      tokens 中任何一项不同，token IDs 都可能不同。模型 weights 与 tokenizer revision 必须绑定。
    - GPT-2 先把 bytes 映射到可处理的 Unicode symbols，再执行 BPE。Byte-level base alphabet 提供任意
      byte sequence 的覆盖，避免传统 unknown word；最终 token 又可以是多个 byte symbols 的合并。
    - Fast WordPiece 关注 inference tokenization algorithm：通过 trie、failure links 等结构减少重复扫描，提高到接近线性时间。它说明
      tokenizer 不只是训练 vocabulary，encoding runtime 也会影响大规模 serving。
    - 大 vocabulary 通常缩短 sequence，却增加 embedding/head 参数和 rare-token sparsity；小 vocabulary
      相反。没有脱离语言分布、context limit 和模型规模的 universally best tokenizer。
  - title: Chapter 4
    source_heading: Chapter 4
    paragraphs:
    - 但不能简单断言 Pre-LN 在所有质量指标都优于 Post-LN。Topology 会影响 representation scale、effective
      depth、最终 normalization 和 training recipe；ResiDual 等方法正尝试组合不同 residual/normalization
      优势。
    - 论文可把它解释为 stochastic regularization 的期望，但实际 deterministic GELU 并没有每次显式采样 mask。其优势依
      architecture 和 training recipe，计算成本也高于简单 ReLU，不过现代 kernels 常做高效融合。
    - Lambda Labs 估算单 RTX 8000 训练 GPT-3 需约 665 年，目的在展示 commodity single-GPU 与 frontier
      training 的数量级差距。它不是实际训练方案，也不应忽略 parallel efficiency、精度、hardware utilization
      和工程优化。
    - 规模化常伴随 batch、optimizer、data mixture、context、parallelism、numerical precision
      和某些 sparse/dense attention pattern 调整。因此应理解为核心 causal Transformer family 相同，而不是每个实现细节逐项相同。
  - title: Chapter 6
    source_heading: Chapter 6
    paragraphs:
    - 实验比较必须控制：padding side、真正 sequence end index、truncation、special tokens 和 pooling。直接取
      tensor 最后一列若那里是 padding，得到的是 padding state，不一定是文本最后 token。
    - 只训练 classification head 假设 pretrained representations 已线性可分。若任务需要重新组合 features，仅更新
      head 不够。解冻最后 block 可让 high-level contextual representations 向任务靠拢，同时冻结前层保留通用低层特征并降低成本。
    - BERT/RoBERTa 使用 bidirectional encoder，所有位置可读取完整输入，天然适合 sequence understanding。RoBERTa
      主要重新评估和优化 BERT pretraining recipe，例如更多数据、更长训练、dynamic masking，并移除 next sentence
      prediction objective。
    - 模型在 causal pretraining 中从未见过 future-visible attention distribution。突然改 mask
      会造成 architecture/training mismatch。后续方法通常加入适配训练，让 weights 学会利用双向信息。
  - title: Appendix A
    source_heading: Appendix A
    paragraphs:
    - 原书引用：Raschka, Model Evaluation, Model Selection, and Algorithm Selection in
      Machine Learning (2018)，https://arxiv.org/abs/1811.12808。
    - 若用同一 validation set 反复尝试大量方案，最终也会对 validation overfit。Test set 应在选择完成后用于一次近似无偏估计；更严谨的小数据场景可用
      nested cross-validation。
    - 它依 iid Bernoulli 近似；文本数据有 clusters、duplicates 和 distribution shift 时可失效。Bootstrap
      也必须按独立 unit（如 user/document）重采样，而非把相关 chunks 当独立样本。
    - FSDP 仍是 data-parallel family，但通过 sharding 也解决部分单卡容量问题。使用时要配置 auto-wrap policy、mixed
      precision、CPU offload、activation checkpointing 和 sharded/full state dict；不能只把
      DDP class 名替换后假设 checkpoint 语义不变。
  - title: 9.1 想理解 Transformer/GPT 的起源
    source_heading: 9.1 想理解 Transformer/GPT 的起源
    paragraphs:
    - Attention Is All You Need；
    - 本书 Chapters 3–5 对应实现。
  - title: 9.3 想训练领域模型
    source_heading: 9.3 想训练领域模型
    paragraphs:
    - Continual pretraining；
    - Domain/general mixture 与 retention evaluation；
    - RAG、SFT 与 from-scratch 的成本对照；
    - License、privacy、time-split 和 factuality audit。
  - title: 9.5 算力或显存有限
    source_heading: 9.5 算力或显存有限
    paragraphs:
    - 先缩小 model/context/batch 建立正确 baseline；
    - GaLore（full-parameter optimizer-state reduction）；
    - Activation checkpointing；
    - FSDP/ZeRO 或 model parallelism（容量）。
  - title: 13. 核心结论
    source_heading: 13. 核心结论
    paragraphs:
    - Bahdanau attention、self-attention 和 cross-attention 共享加权读取思想，但 query/source
      和 score function 不同。
    - Normalization formula 与 placement 是两个独立 architecture choices；Pre-LN 和 RMSNorm
      不应混淆。
    - 单 logit BCE 和双 logits CE 都能做二分类，但 shape、dtype 和 probability parameterization
      不同。
    - Gradient accumulation 解决 microbatch 显存问题；DDP 解决 data throughput；FSDP/parallelism
      解决 model-state capacity，三者职责不同。
  - title: 16. 最终总结
    source_heading: 16. 最终总结
    paragraphs:
    - 附录 B 真正提供的不是“更多要记住的模型名”，而是一种扩展知识的方法：从本书的最小可执行实现出发，定位其历史来源、替代方案、系统优化、数据条件和评价边界；再把论文主张转成控制变量明确的复现实验。
    - 沿这条路径，LLM 不再是单一 architecture，而是一个共同演化的系统：tokenizer 规定基本单位，数据塑造分布，objective 决定梯度，architecture
      规定信息流，kernel 与 distributed strategy 决定可训练规模，decoding 决定如何取样，post-training 塑造交互行为，evaluation
      决定哪些能力被看见。任何局部改进都必须放回这条完整链路中判断。
  takeaways:
  - 若多个变量同时变化，不能把提升全部归因于论文标题中的新方法。高质量阅读应寻找 ablation、matched-compute baseline 和多 seed
    uncertainty。
  - 附录 B 是从本书最小实现通往原始论文、真实数据和规模化系统的索引。
  - GPT-2 到 GPT-3 展示规模效应，但能力同时受 data、tokens、recipe 和 evaluation 影响。
  - Instruction tuning 效果由 base capability、数据质量/覆盖、loss mask 和训练规模共同决定。
  - 沿这条路径，LLM 不再是单一 architecture，而是一个共同演化的系统：tokenizer 规定基本单位，数据塑造分布，objective 决定梯度，architecture
    规定信息流，kernel 与 distributed strategy 决定可训练规模，decoding 决定如何取样，post-training 塑造交互行为，evaluation
    决定哪些能力被看见。任何局部改进都必须放回这条完整链路中判断。
