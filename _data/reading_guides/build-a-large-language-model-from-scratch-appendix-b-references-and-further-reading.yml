    meaning: 证据范围：结论来自理论、受控实验、benchmark，还是单个案例？
    source_heading: 0.2 阅读一项引用时要问的六个问题
  - term: Chapter 4
    meaning: 规模化常伴随 batch、optimizer、data mixture、context、parallelism、numerical precision
      和某些 sparse/dense attention pattern 调整。因此应理解为核心 causal Transformer family 相同，而不是每个实现细节逐项相同。
    source_heading: Chapter 4
  - term: Appendix A
    meaning: FSDP 仍是 data-parallel family，但通过 sharding 也解决部分单卡容量问题。使用时要配置 auto-wrap
      policy、mixed precision、CPU offload、activation checkpointing 和 sharded/full state
      dict；不能只把 DDP class 名替换后假设 checkpoint 语义不变。
    source_heading: Appendix A
  - term: 9.1 想理解 Transformer/GPT 的起源
    meaning: 本书 Chapters 3–5 对应实现。
    source_heading: 9.1 想理解 Transformer/GPT 的起源
  - term: 9.5 算力或显存有限
    meaning: FSDP/ZeRO 或 model parallelism（容量）。
    source_heading: 9.5 算力或显存有限
