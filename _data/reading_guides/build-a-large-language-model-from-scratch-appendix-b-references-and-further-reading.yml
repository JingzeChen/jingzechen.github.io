  minutes: 13
  question: 原文围绕「0.2 阅读一项引用时要问的六个问题」建立了怎样的核心认识？
  question_source: 0.2 阅读一项引用时要问的六个问题
  thesis: 沿这条路径，LLM 不再是单一 architecture，而是一个共同演化的系统：tokenizer 规定基本单位，数据塑造分布，objective
    决定梯度，architecture 规定信息流，kernel 与 distributed strategy 决定可训练规模，decoding 决定如何取样，post-training
    塑造交互行为，evaluation 决定哪些能力被看见。任何局部改进都必须放回这条完整链路中判断。
  thesis_source: 16. 最终总结
