  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 统计学习就是在未知数据分布、只有有限样本的条件下，通过限定模型空间、定义风险准则并设计求解算法，在拟合训练数据与控制模型复杂度之间取得平衡，从而获得能泛化到未知数据的模型。
  thesis_source: 第 1 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 算法是什么：怎样在有限时间内找到该标准下的最优模型？
    source_heading: 0. 本章解决什么问题
  - term: 1.2 统计学习的分类
    meaning: 监督学习与无监督学习的差别不在于是否存在“输出”，而在于训练数据是否提供了目标输出。无监督学习的输出是算法根据评价标准发现的结构，并非人工标注答案。
    source_heading: 1.2 统计学习的分类
  - term: 1.5 正则化与交叉验证
    meaning: 二者都限制参数规模，但几何性质不同：L_2 通常平滑地缩小所有参数；L_1 的不可微尖点更容易让部分参数精确变为零，因此具有稀疏化和特征选择效果。
    source_heading: 1.5 正则化与交叉验证
  - term: 1.6 泛化能力
    meaning: 测试误差依赖某一次有限测试集，而泛化误差相对于真实分布定义。统计学习理论希望回答：仅根据训练误差、样本量和假设空间复杂度，能在多大概率下保证真实泛化误差不会太大？
    source_heading: 1.6 泛化能力
  - term: 1.8 监督学习的三类应用
    meaning: 类别极不平衡时，准确率可能误导。例如正类只占 1%，全部预测为负也有 99% 准确率，但召回率为 0。指标必须根据错误代价选择：垃圾邮件过滤可能更在意误杀，疾病筛查可能更在意漏诊。
    source_heading: 1.8 监督学习的三类应用
  - term: 1.9.2 必须掌握的结论
    meaning: 正则化通过显式复杂度惩罚控制过拟合；交叉验证通过未参与当前拟合的数据选择复杂度。
    source_heading: 1.9.2 必须掌握的结论
