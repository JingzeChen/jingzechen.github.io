  minutes: 8
  question: 原文围绕「本章定位：把思想金字塔转化为现场体验」建立了怎样的核心认识？
  question_source: 本章定位：把思想金字塔转化为现场体验
  thesis: 本章最核心的实践原则是：先用金字塔确定要表达的思想，再用故事板安排观众按什么顺序理解；屏幕只显示当下最重要的主张和视觉关系，解释与过渡交给演讲者，精确证据交给图表、附录或报告，并通过反复排练验证整套体验。
  thesis_source: 本章小结
  concepts:
  - term: 本章定位：把思想金字塔转化为现场体验
    meaning: 书面报告允许读者停顿、回看和跳读；现场演示按演讲者控制的时间单向推进。观众还会受到会场、情绪、屏幕和演讲者表现的影响。因此，演示不能只是把报告段落复制到幻灯片。
    source_heading: 本章定位：把思想金字塔转化为现场体验
  - term: 设计图表 PPT 幻灯片
    meaning: 若标题说“费用持续下降”，图中有明显上涨年份，应在标题中写“除某年外持续下降”或解释异常。不能用标题强迫数据配合故事。
    source_heading: 设计图表 PPT 幻灯片
  - term: 十三、故事板页面 6 至 18 的展开
    meaning: 页面 18 回到“稳定可靠客户服务”的行动总结。
    source_heading: 十三、故事板页面 6 至 18 的展开
  - term: 十一、现代补充方法
    meaning: 双版本交付：现场简洁页 + 会后详细报告；
    source_heading: 十一、现代补充方法
  - term: 四、消息标题与图表问题
    meaning: 页面 6 回答“问题类别如何分布”。
    source_heading: 四、消息标题与图表问题
  - term: 本章小结
    meaning: 本章最核心的实践原则是：先用金字塔确定要表达的思想，再用故事板安排观众按什么顺序理解；屏幕只显示当下最重要的主张和视觉关系，解释与过渡交给演讲者，精确证据交给图表、附录或报告，并通过反复排练验证整套体验。
    source_heading: 本章小结
