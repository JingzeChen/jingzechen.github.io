  sections:
  - title: 本章定位：把思想金字塔转化为现场体验
    source_heading: 本章定位：把思想金字塔转化为现场体验
    paragraphs:
    - 书面报告允许读者停顿、回看和跳读；现场演示按演讲者控制的时间单向推进。观众还会受到会场、情绪、屏幕和演讲者表现的影响。因此，演示不能只是把报告段落复制到幻灯片。
    - 演讲者承担叙事、解释和现场互动；
    - 图表页呈现文字难以传达的数据与关系；
    - 故事板确保所有页面按一个连贯故事推进。
  - title: 设计文字 PPT 幻灯片
    source_heading: 设计文字 PPT 幻灯片
    paragraphs:
    - 讲稿说明：未交订单很高，PMG 业务若不能履约会丢失市场份额；生产问题、供应链不连贯、管理不善以及生产与供应链缺乏配合共同造成现状。
    - 图 11-3 展示由背景、冲突、中心思想、关键句和支持论点组成的演示序列。不是金字塔每个方框都必须单独成页，而是主要层级应有清楚落点。
    - 原书引用泽拉兹尼的反对意见：有必要展示的内容，就应让观众看清。把密集不可辨认当作复杂性证据，是逃避设计。
    - 图 11-4 把“提高设备效率”分成改进设备、员工和监督，再展开具体措施。视觉位置直接表达结构，比长清单更易理解。
  - title: 设计图表 PPT 幻灯片
    source_heading: 设计图表 PPT 幻灯片
    paragraphs:
    - 图表利用位置、长度、面积、方向和连接来表示大量数据与关系，使观众无需逐字处理。
    - 饼图只适合少量类别、总和明确的占比。类别多或差异小，应改用条形图。流程不能用饼图。
    - 平均数会隐藏偏态、双峰、长尾和异常值。分布图回答“数据集中在哪里、范围如何、形状怎样”。
    - 若标题说“费用持续下降”，图中有明显上涨年份，应在标题中写“除某年外持续下降”或解释异常。不能用标题强迫数据配合故事。
  - title: 十二、故事板页面 1 至 5
    source_heading: 十二、故事板页面 1 至 5
    paragraphs:
    - 现状：成本高、服务低，生产、供应链流程和配合存在问题；
    - 过去改进不奏效：订单、小额订单、分销网络和预测问题；
    - 首先保持稳定供应链：服务、成本、技能；
    - 再建立持续改进计划：最快供应、创新和员工吸引力。
  - title: 十三、故事板页面 6 至 18 的展开
    source_heading: 十三、故事板页面 6 至 18 的展开
    paragraphs:
    - 页面 6：重点关注 A 类客户并修改订单管理，保持服务；
    - 页面 7：50% 客户占 95% 订货金额，用图表支持聚焦；
    - 页面 9：10% 产品占 60% 订货金额；
    - 页面 18 回到“稳定可靠客户服务”的行动总结。
  - title: 十一、现代补充方法
    source_heading: 十一、现代补充方法
    paragraphs:
    - 双版本交付：现场简洁页 + 会后详细报告；
    - 数据故事：上下文、变化、影响、行动；
    - 无障碍检查：对比度、替代文本、口头描述；
    - 远程预演：小窗口、延迟、屏幕共享测试；
  - title: 一、思想金字塔
    source_heading: 一、思想金字塔
    paragraphs:
    - 应通过分流、知识库和排班调整，把首次响应时间从 12 小时降至 4 小时。
    - 低复杂度请求应自动分流和自助解决；
    - 重复问题应由统一知识库加速处理；
  - title: 四、消息标题与图表问题
    source_heading: 四、消息标题与图表问题
    paragraphs:
    - 页面 2 回答“有哪些组成部分”；
    - 页面 3 回答“两个变量怎样比较”；
    - 页面 6 回答“问题类别如何分布”。
  - title: 演示定位
    source_heading: 演示定位
    paragraphs:
    - 演讲者、屏幕和会后材料分别承担什么？
    - 是否需要现场版和讲义版两套材料？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 供应链案例从现状和失败改进出发，提出保持服务、节约成本、培养能力和建立竞争优势的主线。
    - 一项复杂思想可用多页，多个简单事实可合页，低层证据可进附录；页面不是金字塔方框的机械复制。
    - 演示的最终责任是尊重观众付出的时间和注意力，让他们既容易理解，又能对关键事实和推理进行审查。
    - 本章最核心的实践原则是：先用金字塔确定要表达的思想，再用故事板安排观众按什么顺序理解；屏幕只显示当下最重要的主张和视觉关系，解释与过渡交给演讲者，精确证据交给图表、附录或报告，并通过反复排练验证整套体验。
  takeaways:
  - 故事板确保所有页面按一个连贯故事推进。
  - 若标题说“费用持续下降”，图中有明显上涨年份，应在标题中写“除某年外持续下降”或解释异常。不能用标题强迫数据配合故事。
  - 远程预演：小窗口、延迟、屏幕共享测试；
  - 页面 6 回答“问题类别如何分布”。
  - 本章最核心的实践原则是：先用金字塔确定要表达的思想，再用故事板安排观众按什么顺序理解；屏幕只显示当下最重要的主张和视觉关系，解释与过渡交给演讲者，精确证据交给图表、附录或报告，并通过反复排练验证整套体验。
