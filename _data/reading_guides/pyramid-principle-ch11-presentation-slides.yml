checks:
- level: 概念辨析
  question: 原文如何解释「演示文稿与报告」？
  answer: 演示文稿依赖现场讲解，按时间推进；
  source_heading: 演示文稿与报告
- level: 概念辨析
  question: 原文如何解释「简洁与信息缺失」？
  answer: 简洁保留主张和必要支持；信息缺失则让主张无法理解或验证。证据可在后续页、备注、附录或报告中提供。
  source_heading: 简洁与信息缺失
- level: 概念辨析
  question: 原文如何解释「图表与数据表」？
  answer: 图表突出关系，数据表支持精确查值。现场主页面通常优先关系，附录可保留明细。
  source_heading: 图表与数据表
