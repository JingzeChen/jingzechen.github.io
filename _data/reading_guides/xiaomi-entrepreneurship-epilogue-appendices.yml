overview:
  kind: summary
  minutes: 8
  question: 3.1 作者怎样区分两种模式？
  question_source: 3.1 作者怎样区分两种模式
  thesis: 后记结论：小米模式是创新与效率共同驱动的性价比模型。反对对象：不是所有高价格，而是依赖信息差、锁定和低效率的不合理溢价。用户关系：通过透明、克制利润和长期兑现，从非合作走向信任与合作。幸福观：用更少无效成本获得更多真实价值，并倡导质朴、适用的消费。
    IPO 公开信：向投资者说明铁人三项，并用 5% 红线制度化价格厚道。十周年演讲：梦想与团队启动小米，风险选择和低谷补课让方法成熟。国际化教训：十亿元库存源于对品牌、渠道和需求过度乐观，救火又意外形成全球渠道。
    2021 年演讲：破发、高端、诉讼和用户回馈体现压力中的长期选择。
  thesis_source: 六十一、一页速记
  concepts:
  - term: 3.1 作者怎样区分两种模式
    meaning: 依靠性价比和效率获得规模、信任与合理利润。
    source_heading: 3.1 作者怎样区分两种模式
  - term: 十、小米的公司身份
    meaning: 公开信把小米定义为创新驱动的互联网公司，手机和智能硬件是产品与用户入口，软件、互联网服务、新零售和生态链共同组成商业系统。
    source_heading: 十、小米的公司身份
  - term: 二十一、膨胀、“十亿赌局”与低谷
    meaning: 原书图示：小米手机业务陷入低谷高速成长掩盖的研发、交付、质量和管理问题在 2015 年集中爆发。雷军亲自接管手机部，进入长期补课。
    source_heading: 二十一、膨胀、“十亿赌局”与低谷
  - term: 二十九、上市破发与股票回购
    meaning: 资本市场价格受到行业、宏观环境、公司预期和市场情绪影响，不能用产品定价逻辑简单类比股票。
    source_heading: 二十九、上市破发与股票回购
  - term: 三十九、造车初心与长期承诺
    meaning: 原书图示：雷军宣布亲自带队投入小米汽车 “押上声誉”和“最后一次重大创业”表达个人决心，也会形成强烈组织动员。企业项目最终仍应靠团队、制度、质量和治理，不应依赖创始人个人承诺。
    source_heading: 三十九、造车初心与长期承诺
  - term: 六十一、一页速记
    meaning: 后记结论：小米模式是创新与效率共同驱动的性价比模型。反对对象：不是所有高价格，而是依赖信息差、锁定和低效率的不合理溢价。用户关系：通过透明、克制利润和长期兑现，从非合作走向信任与合作。幸福观：用更少无效成本获得更多真实价值，并倡导质朴、适用的消费。
      IPO 公开信：向投资者说明铁人三项，并用 5% 红线制度化价格厚道。十周年演讲：梦想与团队启动小米，风险选择和低谷补课让方法成熟。国际化教训：十亿元库存源于对品牌、渠道和需求过度乐观，救火又意外形成全球渠道。
      2021 年演讲：破发、高端、诉讼和用户回馈体现压力中的长期选择。
    source_heading: 六十一、一页速记
  logic:
  - 3.1 作者怎样区分两种模式
  - 十、小米的公司身份
  - 十五、《小米从哪里来，又将往哪里去》的结构
  - 二十九、上市破发与股票回购
  - 三十三、情义无价：重返金山
  - 四十五、共同主题二：信任来自公开承诺与兑现
  - 六十一、一页速记
  sections:
  - title: 3.1 作者怎样区分两种模式
    source_heading: 3.1 作者怎样区分两种模式
    paragraphs:
    - 依靠性价比和效率获得规模、信任与合理利润。
    - 企业把注意力放在维持价格而非提高效率；
  - title: 5.2 “祛魅”是什么意思
    source_heading: 5.2 “祛魅”是什么意思
    paragraphs:
    - 在充满复杂术语、功能噱头和高价的品类中，重新解释核心原理，并以更简单产品证明实际成本和价值。
    - 空气净化器公开风机、滤网和拆机结构，就是典型做法。祛魅不是贬低专业技术，而是让用户知道真正决定体验的是什么。
  - title: 十、小米的公司身份
    source_heading: 十、小米的公司身份
    paragraphs:
    - 公开信把小米定义为创新驱动的互联网公司，手机和智能硬件是产品与用户入口，软件、互联网服务、新零售和生态链共同组成商业系统。
    - 渠道效率是产品价值实现的一部分。
    - "“互联网公司”不应被理解为小米只重流量和变现。公开信同时强调工程师、创新、设计和产品。"
    - 公开信使用 2018 年前后的全球排名、用户和 IoT 连接数。这些数据只反映上市时状态，不代表今天的市场位置。
  - title: 十五、《小米从哪里来，又将往哪里去》的结构
    source_heading: 十五、《小米从哪里来，又将往哪里去》的结构
    paragraphs:
    - 膨胀、低谷、MIX 和质量补课；
    - 上市、科技园和世界 500 强；
  - title: 二十一、膨胀、“十亿赌局”与低谷
    source_heading: 二十一、膨胀、“十亿赌局”与低谷
    paragraphs:
    - 小米与格力的营收赌局最初用于活跃节目，后来成为长期社会话题。雷军将其归因于成功后的信心膨胀，并承认制造业积累值得学习。
    - 原书图示：小米手机业务陷入低谷高速成长掩盖的研发、交付、质量和管理问题在 2015 年集中爆发。雷军亲自接管手机部，进入长期补课。
    - MIX 从工程师对未来手机形态的讨论出发，穿越低谷并成为全面屏代表产品。
    - 原书图示：MIX 代表小米低谷中的技术探索它说明危机中不能把所有长期创新砍掉；探索项目也需要与核心技术方向相关，并留下可复用能力。
  - title: 二十九、上市破发与股票回购
    source_heading: 二十九、上市破发与股票回购
    paragraphs:
    - 资本市场价格受到行业、宏观环境、公司预期和市场情绪影响，不能用产品定价逻辑简单类比股票。
    - 是否优于研发、并购和债务等用途；
  - title: 三十三、情义无价：重返金山
    source_heading: 三十三、情义无价：重返金山
    paragraphs:
    - 原书图示：金山与小米两段创业关系理性上，这会分散创始人时间；情感上，它关系老伙伴和员工前途。最终结果较好，不表示兼任永远正确。
    - 选择是否来自长期承诺而非短期情绪；
  - title: 三十九、造车初心与长期承诺
    source_heading: 三十九、造车初心与长期承诺
    paragraphs:
    - 演讲把汽车放入个人设备、智能家庭、办公和出行组成的全场景生活，目标是提供高品质智能电动汽车。
    - 原书图示：雷军宣布亲自带队投入小米汽车 “押上声誉”和“最后一次重大创业”表达个人决心，也会形成强烈组织动员。企业项目最终仍应靠团队、制度、质量和治理，不应依赖创始人个人承诺。
  - title: 四十五、共同主题二：信任来自公开承诺与兑现
    source_heading: 四十五、共同主题二：信任来自公开承诺与兑现
    paragraphs:
    - IPO 公开信承诺硬件利润红线；
    - 上市破发后以经营和回购表达信心；
    - 信任不能靠一次大动作建立。它来自长期重复兑现，也可能因一次严重欺骗快速失去。
  - title: 六十一、一页速记
    source_heading: 六十一、一页速记
    paragraphs:
    - 后记结论：小米模式是创新与效率共同驱动的性价比模型。反对对象：不是所有高价格，而是依赖信息差、锁定和低效率的不合理溢价。用户关系：通过透明、克制利润和长期兑现，从非合作走向信任与合作。幸福观：用更少无效成本获得更多真实价值，并倡导质朴、适用的消费。
      IPO 公开信：向投资者说明铁人三项，并用 5% 红线制度化价格厚道。十周年演讲：梦想与团队启动小米，风险选择和低谷补课让方法成熟。国际化教训：十亿元库存源于对品牌、渠道和需求过度乐观，救火又意外形成全球渠道。
      2021 年演讲：破发、高端、诉讼和用户回馈体现压力中的长期选择。
    - 造车演讲：用户信任提供起点，行业能力、安全和长期投入决定能否兑现。金山三十年：尊重技术、坚持梦想、持续转型和伙伴关系构成长寿组织。阅读边界：演讲有动员与叙事属性，数据有时点，目标和预测不等于结果。最终启示：一家公司的方法不是口号，而是它在顺境、低谷和重大选择中反复使用，并愿意公开接受检验的原则。
  takeaways:
  - 企业把注意力放在维持价格而非提高效率；
  - 公开信使用 2018 年前后的全球排名、用户和 IoT 连接数。这些数据只反映上市时状态，不代表今天的市场位置。
  - 是否优于研发、并购和债务等用途；
  - 原书图示：雷军宣布亲自带队投入小米汽车 “押上声誉”和“最后一次重大创业”表达个人决心，也会形成强烈组织动员。企业项目最终仍应靠团队、制度、质量和治理，不应依赖创始人个人承诺。
  - 造车演讲：用户信任提供起点，行业能力、安全和长期投入决定能否兑现。金山三十年：尊重技术、坚持梦想、持续转型和伙伴关系构成长寿组织。阅读边界：演讲有动员与叙事属性，数据有时点，目标和预测不等于结果。最终启示：一家公司的方法不是口号，而是它在顺境、低谷和重大选择中反复使用，并愿意公开接受检验的原则。
