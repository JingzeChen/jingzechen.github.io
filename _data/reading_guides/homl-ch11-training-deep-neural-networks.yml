  sections:
  - title: 本章要解决的四类困难
    source_heading: 本章要解决的四类困难
    paragraphs:
    - 优化不稳定：反向传播的梯度逐层缩小或放大，底层几乎不学或直接发散；
    - 数据不足：参数量巨大，而高质量标签昂贵；
    - 训练缓慢：普通 SGD 在病态损失曲面上推进很慢；
    - 严重过拟合：高容量网络可能记住训练数据和噪声。
  - title: 0. 必要数学基础
    source_heading: 0. 必要数学基础
    paragraphs:
    - 输入 x_i 独立同分布、均值 0；
    - 权重 w_i 独立、均值 0，并与输入独立；
    - 层宽足够大，分布可用二阶矩描述。
  - title: 2. Glorot Initialization and He Initialization
    source_heading: 2. Glorot Initialization and He Initialization
    paragraphs:
    - 分类输出层可把初始权重再缩小，如除以 10，使初始 logits 接近、概率更均匀，避免一开始极端自信和大梯度。
    - 所以线性变换不改变向量范数，初始化时有助于稳定信号。矩形矩阵可让行或列正交；常用于 RNN/GAN，但不能抵消激活函数和训练更新的全部影响。
  - title: 3. Better Activation Functions
    source_heading: 3. Better Activation Functions
    paragraphs:
    - 纯 Dense MLP，层宽足够；
    - 不使用普通 Dropout、BN、LN、skip connection、max-norm 和常规 L1/L2；
    - 违反条件后不再保证自归一化。现代复杂架构通常更常用显式 normalization。
    - 选择建议：ReLU 是高效默认；复杂深网可试 Swish/GELU；门控 Transformer 常用 SwiGLU；低延迟可试 ReLU/Leaky
      ReLU/HardSwish；SELU 仅在满足自归一化条件时考虑。
  - title: 7. Reusing Pretrained Layers
    source_heading: 7. Reusing Pretrained Layers
    paragraphs:
    - 冻结 Parameter 只阻止梯度，不自动冻结 BN running statistics 或 Dropout 随机性。若冻结的 backbone 含
      BN，常需让该部分保持 eval 模式，或有意识地更新其统计。
    - 原书示例把 8 类 Fashion-MNIST 模型迁移到只有 20 张标注图的 T-shirt/Pullover 二分类，特定配置从 71.6% 提升到
      92.5%。但作者明确说明，这是尝试许多配置后挑出的强结果；更换类别或随机种子，收益可能减小、消失或反转。
    - 辅助任务提供易获得的监督信号。例如先训练“两个人脸是否属于同一人”，再复用人脸特征做少样本身份分类；文本中随机 mask token，并用原文本自动生成答案。
    - Self-supervised learning 的标签由数据自身自动生成，训练算法形式仍是监督学习。成功条件是辅助任务迫使模型学习目标任务所需信息；如果捷径特征即可解决辅助任务，迁移表示可能无用。
  - title: 9.1 为什么常数学习率两难
    source_heading: 9.1 为什么常数学习率两难
    paragraphs:
    - 太大：更新跨过低谷，震荡或发散；
    - 太小：早期推进慢，可能困在平台；
    - 适中但恒定：前期尚可，末期仍围绕最优点跳动。
    - 理想策略通常是前期较大以快速探索，末期较小以精细收敛；敏感模型还需从小学习率 warmup。
  - title: 10. Avoiding Overfitting Through Regularization
    source_heading: 10. Avoiding Overfitting Through Regularization
    paragraphs:
    - 深网的参数量远大于许多数据集样本量，能拟合噪声。早停、BN/LN 已有正则效果，本节讨论显式参数惩罚、随机子网络和参数约束。
    - 这与 weight decay 等价。Adam 中 L2 项也被逐坐标自适应缩放，不再等价；应使用 AdamW 解耦 decay。
    - 一般不 dropout 输出层。高层组合特征更易过拟合，可优先在顶部若干隐藏层使用。p 常在 0.1～0.5 间：过拟合增大 p，欠拟合减小。
    - 均值常改善集成预测，标准差提供 epistemic uncertainty 的近似线索；它不是完整、不偏的贝叶斯后验，也不保证分布外检测可靠。
  - title: 11.2 特殊目标的调整
    source_heading: 11.2 特殊目标的调整
    paragraphs:
    - 稀疏模型：L1 + 剪枝，确认后端真正支持稀疏；
    - 低延迟：减少层数，ReLU/LeakyReLU/HardSwish，融合 BN，量化到 FP16/INT8；
    - 风险敏感：校准、MC dropout/ensemble、不确定性阈值和拒绝预测；
    - 训练发散：检查数据尺度、初始化、学习率、混合精度，再考虑 gradient clipping。
  - title: 12. 章末练习与参考答案
    source_heading: 12. 章末练习与参考答案
    paragraphs:
    - 通常可以。随机权重已经打破神经元对称性，bias 全零不会令神经元完全相同。例外取决于特定架构：某些门控单元会给 forget gate 正 bias，类别先验明显时可初始化输出
      bias；但普通 Dense/Conv 的 bias 置零是标准做法。
    - 官方 Notebook 特定环境保存的基础最佳验证准确率约 0.3802。它说明 20 层纯 Dense 网络即便使用 He+Swish+NAdam，也很难学习
      CIFAR-10。
    - 官方参考最佳验证准确率约 0.4008。BN 前几轮训练 accuracy 提升更快，但每 epoch 较慢，验证收益有限并更早过拟合。应同时比较 wall
      time、达到某准确率所需时间和最佳验证性能，而不只比较 epoch 数。
    - 官方参考最佳验证准确率约 0.4564，优于该实验的 Swish/BN 版本，但仍远低于合理 CNN。该结果不能证明 SELU 普遍优于 Swish。
  - title: 工程能力
    source_heading: 工程能力
    paragraphs:
    - 能排除 bias/normalization 的 weight decay
    - 能按 epoch/metric/batch 正确调用 scheduler
    - 能保存 optimizer 和 scheduler 以恢复训练
    - 能完成 CIFAR-10 20 层 MLP 对照实验
  takeaways:
  - 严重过拟合：高容量网络可能记住训练数据和噪声。
  - 所以线性变换不改变向量范数，初始化时有助于稳定信号。矩形矩阵可让行或列正交；常用于 RNN/GAN，但不能抵消激活函数和训练更新的全部影响。
  - 理想策略通常是前期较大以快速探索，末期较小以精细收敛；敏感模型还需从小学习率 warmup。
  - 训练发散：检查数据尺度、初始化、学习率、混合精度，再考虑 gradient clipping。
  - 能完成 CIFAR-10 20 层 MLP 对照实验
