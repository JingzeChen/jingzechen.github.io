  question: 原文围绕「本章要解决的四类困难」建立了怎样的核心认识？
  question_source: 本章要解决的四类困难
  thesis: 原书示例把 8 类 Fashion-MNIST 模型迁移到只有 20 张标注图的 T-shirt/Pullover 二分类，特定配置从 71.6%
