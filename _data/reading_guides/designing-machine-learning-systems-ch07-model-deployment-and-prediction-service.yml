checks:
- level: 概念辨析
  question: 原文如何解释「8.1 Deploy 不等于暴露一个 endpoint」？
  answer: Endpoint 只解决可访问，生产还需容量、SLO、监控、回滚、安全和更新。
  source_heading: 8.1 Deploy 不等于暴露一个 endpoint
- level: 概念辨析
  question: 原文如何解释「8.13 统一 batch/stream 不等于只使用一个存储产品」？
  answer: 核心是 transformation、event-time 和 point-in-time 语义一致。
  source_heading: 8.13 统一 batch/stream 不等于只使用一个存储产品
- level: 概念辨析
  question: 原文如何解释「8.17 Pruning 设为 0 不等于删除参数」？
  answer: Unstructured sparse tensor 若仍跑 dense kernel，不会自然加速。
  source_heading: 8.17 Pruning 设为 0 不等于删除参数
- level: 概念辨析
  question: 原文如何解释「8.22 Cloud 不等于一定更贵」？
  answer: 低流量和 managed operation 下 cloud 可比自建/edge 开发更经济。
  source_heading: 8.22 Cloud 不等于一定更贵
- level: 概念辨析
  question: 原文如何解释「8.30 Browser 跨硬件不等于 native 同速」？
  answer: WASM/runtime 提供 portability，仍有 sandbox、下载和执行开销。
  source_heading: 8.30 Browser 跨硬件不等于 native 同速
