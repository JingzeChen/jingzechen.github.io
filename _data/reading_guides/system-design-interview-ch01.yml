overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、阅读边界与总览」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与总览
  thesis: 从客户端到计算、缓存、数据库或对象存储，确认读写路径闭合。不要先画与核心请求无关的基础设施。
  thesis_source: 17. 核心结论与解决扩展问题的一般方法
  concepts:
  - term: 0. 学习目标、阅读边界与总览
    meaning: 本章不是某个真实产品的完整架构，也不是一份照抄即可支撑百万用户的固定模板。作者采用的是一种渐进式架构演进方法：先建立最简单的可运行系统，再观察它在用户增长时最先出现的问题，然后针对该问题做局部改造。
    source_heading: 0. 学习目标、阅读边界与总览
  - term: 4.3 两者不是非此即彼
    meaning: 作者强调大型应用更偏向水平扩展，因为它能突破单机上限并提供冗余。下一节先对最容易横向扩展的 Web 层动手。
    source_heading: 4.3 两者不是非此即彼
  - term: 9. 无状态 Web 层：解除用户与服务器的绑定
    meaning: 原书示例中，用户 A 的会话在 Server 1，用户 B 的会话在 Server 2。A 的后续请求若到 Server 2，认证就会失败。因此负载均衡器必须使用
      sticky session（会话粘滞）把同一用户持续路由到同一节点。
    source_heading: 9. 无状态 Web 层：解除用户与服务器的绑定
  - term: 12. 日志、指标与自动化：让大系统可观察、可操作
    meaning: 作者指出，小网站只有几台服务器时，这些能力只是良好实践；业务和系统规模扩大后，它们会变成必需品。原因不是工具更时髦，而是人工观察和操作无法随节点数线性扩展。
    source_heading: 12. 日志、指标与自动化：让大系统可观察、可操作
  - term: 15.3 复制与分片
    meaning: 复制不会自动扩展单主写入，分片也不会自动提供冗余。
    source_heading: 15.3 复制与分片
  - term: 17. 核心结论与解决扩展问题的一般方法
    meaning: 若这些问题都能独立回答，就不只是记住了本章列出的扩展技术，而是掌握了作者真正要训练的能力：让架构复杂度随着已知问题逐步增长，并始终能解释每一步为什么发生。
    source_heading: 17. 核心结论与解决扩展问题的一般方法
