  sections:
  - title: 0. 学习目标、阅读边界与总览
    source_heading: 0. 学习目标、阅读边界与总览
    paragraphs:
    - 本章不是某个真实产品的完整架构，也不是一份照抄即可支撑百万用户的固定模板。作者采用的是一种渐进式架构演进方法：先建立最简单的可运行系统，再观察它在用户增长时最先出现的问题，然后针对该问题做局部改造。
    - 为什么小规模系统应当从单机开始，而不是一开始就上复杂的分布式架构？
    - 缓存为什么能降低延迟与数据库压力，又为何引入一致性、过期和淘汰问题？
    - 本文加入的容量、可用性、缓存和队列公式用于解释作者的直觉，均属于教学化补充，不应误认为原书逐式提出的模型。
  - title: 3. 分离数据库：让 Web 层与数据层独立扩展
    source_heading: 3. 分离数据库：让 Web 层与数据层独立扩展
    paragraphs:
    - 拆分后，Web 流量增长可以单独增加计算资源，数据量增长可以单独升级数据库。拆分并未自动带来高可用，因为每层仍只有一台服务器，但它建立了后续水平扩展所需的层次边界。
    - 典型产品包括 MySQL、PostgreSQL 和 Oracle Database。
    - 更准确地说，许多 NoSQL 系统不把跨实体、任意关联查询作为核心能力，应用往往要按访问模式预先组织或冗余数据；不同产品能力仍有差异。
    - 误区：SQL 与 NoSQL 不是互斥阵营。 同一系统可以让交易数据进入关系库，让会话进入键值存储，让搜索索引进入搜索引擎。后文把部分非关系型功能迁入
      NoSQL，正是在使用“按访问模式选择专用存储”的思想。
  - title: 4.3 两者不是非此即彼
    source_heading: 4.3 两者不是非此即彼
    paragraphs:
    - 先选择合理规格的单机，避免过早分布式化；
    - 水平集群中的单个节点仍可能按工作负载升级；
    - 数据库在分片前往往也会先做硬件升级和查询优化。
    - 作者强调大型应用更偏向水平扩展，因为它能突破单机上限并提供冗余。下一节先对最容易横向扩展的 Web 层动手。
  - title: 7. 缓存层：用空间换时间，减少重复工作
    source_heading: 7. 缓存层：用空间换时间，减少重复工作
    paragraphs:
    - 原图描述的控制权在 Web 应用，因此更接近 cache-aside。两者都表现为“命中直接返回，未命中访问后端”，但负责回源的组件不同。阅读原章时应理解其核心意图，不必把术语差异误认为不同的性能原理。
    - 缓存通常不是持久化真相来源。内存缓存重启后可能丢失数据，因此关键数据仍应存入持久数据库。把缓存当数据库使用，除非产品明确提供持久化、复制和恢复保证，否则会把性能优化变成数据丢失风险。
    - TTL 应根据数据更新频率、陈旧容忍度和回源成本选择，而不是全局使用一个数字。用户权限、价格和普通内容列表的陈旧风险显然不同。
    - 删除通常比直接更新缓存更稳妥，因为并发写入时，旧请求可能最后完成缓存写入。但这仍有竞态：数据库更新后、缓存删除前可能有请求读到旧值；删除失败时旧值会保留到
      TTL。
  - title: 9. 无状态 Web 层：解除用户与服务器的绑定
    source_heading: 9. 无状态 Web 层：解除用户与服务器的绑定
    paragraphs:
    - "“无状态 Web 服务器”不是系统完全没有状态，而是Web 计算节点不在本地保存下一次请求必须依赖的会话状态。状态仍然存在，只是被移到所有节点都可访问的外部存储，或被编码在经过签名的客户端令牌中。"
    - 原书示例中，用户 A 的会话在 Server 1，用户 B 的会话在 Server 2。A 的后续请求若到 Server 2，认证就会失败。因此负载均衡器必须使用
      sticky session（会话粘滞）把同一用户持续路由到同一节点。
    - 原书提出关系库、NoSQL 或 Memcached/Redis 都可承载共享状态，并在示例中选择易水平扩展的 NoSQL。实际选择要看持久性、TTL、一致性、延迟和容量；缓存若没有足够持久性保证，不应保存无法重建的唯一会话数据。
    - 实际不能只看 CPU。I/O 密集服务可能 CPU 很低却已耗尽连接池；应结合请求延迟、并发、队列长度、错误率和下游容量。缩容阈值与时间窗口还应留出滞后，避免负载在边界附近导致实例反复增删。
  - title: 12. 日志、指标与自动化：让大系统可观察、可操作
    source_heading: 12. 日志、指标与自动化：让大系统可观察、可操作
    paragraphs:
    - 作者指出，小网站只有几台服务器时，这些能力只是良好实践；业务和系统规模扩大后，它们会变成必需品。原因不是工具更时髦，而是人工观察和操作无法随节点数线性扩展。
    - 日志记录离散事件，例如请求失败、依赖超时、权限拒绝和任务重试。多服务器环境中，应集中采集，以便统一搜索和关联。
    - 例如缓存平均延迟正常，但命中率骤降会把压力转移到数据库；业务指标“下单成功数”下降，可能比 CPU 告警更快揭示用户影响。
    - 自动化的本质不是“少点几次按钮”，而是让操作可重复、可审计、可测试，并减少不同服务器和数据中心之间的配置漂移。
  - title: 14.1 原书的八条总结及其因果含义
    source_heading: 14.1 原书的八条总结及其因果含义
    paragraphs:
    - 保持 Web 层无状态：解除用户与单台服务器的绑定，使负载均衡、故障转移和自动扩缩容真正有效。
    - 每一层建立冗余：避免单台 Web、数据库、缓存或机房成为整体单点，但同时要验证故障后的剩余容量。
    - 尽可能缓存数据：对高频、可容忍陈旧的数据减少重复计算和数据库访问；“尽可能”不意味着无差别缓存。
    - 支持多个数据中心：降低全球访问延迟并容忍区域故障，同时承担流量切换、数据同步和部署一致性的复杂度。
  - title: 15.3 复制与分片
    source_heading: 15.3 复制与分片
    paragraphs:
    - 复制：同一数据有多份，主要改善读取和容错；
    - 分片：不同节点保存不同数据，主要改善总容量和吞吐；
    - 复制不会自动扩展单主写入，分片也不会自动提供冗余。
  - title: 15.6 应用缓存与 CDN
    source_heading: 15.6 应用缓存与 CDN
    paragraphs:
    - 应用缓存位于后端附近，主要缓存查询或计算结果；
    - CDN 位于网络边缘，主要缓存可向用户直接交付的内容；
    - 两者都需要命中率、TTL、失效与故障回退设计。
  - title: 17. 核心结论与解决扩展问题的一般方法
    source_heading: 17. 核心结论与解决扩展问题的一般方法
    paragraphs:
    - 每个机制都对应一个主要问题。 负载均衡解决计算节点选择，复制解决副本与读扩展，缓存解决重复读取，分片解决数据分布，队列解决时间和容量耦合。
    - 检查 CPU、内存、磁盘、网络、连接、数据库写入、热点键、同步依赖与单点。瓶颈必须从规模或观测推导，而不是凭技术偏好猜测。
    - 这比记住一张“百万用户架构图”更重要。组件会变化，产品负载会变化，但由目标、瓶颈、机制、代价和验证组成的推理链可以迁移到几乎所有系统设计题。
    - 若这些问题都能独立回答，就不只是记住了本章列出的扩展技术，而是掌握了作者真正要训练的能力：让架构复杂度随着已知问题逐步增长，并始终能解释每一步为什么发生。
  takeaways:
  - HTTP 连接客户端与 Web 服务；
  - 无状态是计算层弹性的关键。 状态没有消失，而是进入可共享、可扩展、可恢复的数据层。
  - 检查 CPU、内存、磁盘、网络、连接、数据库写入、热点键、同步依赖与单点。瓶颈必须从规模或观测推导，而不是凭技术偏好猜测。
  - 能否解释异步复制下主库切换为何可能丢失最新数据？
  - 若这些问题都能独立回答，就不只是记住了本章列出的扩展技术，而是掌握了作者真正要训练的能力：让架构复杂度随着已知问题逐步增长，并始终能解释每一步为什么发生。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.1 “百万用户”与“百万并发”」？
  answer: 注册用户、日活用户、同时在线用户和每秒请求数完全不同。架构容量必须基于具体负载和操作成本，不能把用户总数直接当作 QPS。
  source_heading: 15.1 “百万用户”与“百万并发”
- level: 概念辨析
  question: 原文如何解释「15.5 缓存与数据库」？
  answer: 缓存是可重建的加速副本，数据库通常是权威数据源。缓存速度快不代表适合保存唯一关键数据；数据库也不意味着每次读取都应直达磁盘。
  source_heading: 15.5 缓存与数据库
- level: 概念辨析
  question: 原文如何解释「15.8 高可用与负载均衡」？
  answer: 负载均衡只有在后端存在多个健康实例、负载均衡层自身冗余、健康检查正确且故障后容量足够时，才能支撑高可用。
  source_heading: 15.8 高可用与负载均衡
- level: 概念辨析
  question: 原文如何解释「15.12 反规范化与“随意重复数据”」？
  answer: 反规范化是为明确读取模式主动增加冗余，并配套更新和一致性策略；没有权威来源和同步机制的任意复制只是数据混乱。
  source_heading: 15.12 反规范化与“随意重复数据”
- level: 概念辨析
  question: 原文如何解释「15.15 “尽可能缓存”与“缓存一切”」？
  answer: 原书总结中的“cache data as much as you can”应结合正文条件理解：读多写少、可重建、可容忍一定陈旧且有重复访问的数据才适合。权限、余额等高风险数据不能只为命中率牺牲正确性。
  source_heading: 15.15 “尽可能缓存”与“缓存一切”
