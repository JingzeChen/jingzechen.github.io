overview:
  kind: summary
  minutes: 8
  question: 0.1 只数入链为什么不够？
  question_source: 0.1 只数入链为什么不够
  thesis: 成立条件：需要严格主特征值、初值主方向系数非零。若存在同模特征值，迭代可能振荡；矩阵不可对角化时需用 Jordan 形式分析，但有严格谱间隙仍可收敛到主不变子空间。
  thesis_source: 21.2 PageRank 的计算
  concepts:
  - term: 0.1 只数入链为什么不够
    meaning: 一个结点的重要度来自指向它的结点；来源越重要、来源出边越少，这条推荐越有分量。
    source_heading: 0.1 只数入链为什么不够
  - term: 0.3 本章真正的难点
    meaning: 现实图缺陷：无出边的悬挂结点使转移矩阵列和为 0；封闭链接群会吸走概率；周期图会振荡。
    source_heading: 0.3 本章真正的难点
  - term: 21.1 PageRank 的定义
    meaning: Personalized PageRank、Topic-Sensitive PageRank 和 TrustRank 都基于传送分布或可信种子的变化。
    source_heading: 21.1 PageRank 的定义
  - term: 21.2 PageRank 的计算
    meaning: 成立条件：需要严格主特征值、初值主方向系数非零。若存在同模特征值，迭代可能振荡；矩阵不可对角化时需用 Jordan 形式分析，但有严格谱间隙仍可收敛到主不变子空间。
    source_heading: 21.2 PageRank 的计算
  - term: 必须掌握的逻辑
    meaning: 大规模计算依赖稀疏幂迭代，而非显式求逆。
    source_heading: 必须掌握的逻辑
  - term: 必须记住的边界
    meaning: 大图只存边和少量向量，不能构造全 1 矩阵或稠密逆矩阵。
    source_heading: 必须记住的边界
  logic:
  - 0.1 只数入链为什么不够
  - 0.3 本章真正的难点
  - 21.1 PageRank 的定义
