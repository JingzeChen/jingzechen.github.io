  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - 这些问题不一定改变整个 architecture style，却会显著改变 coupling、fault tolerance、scalability、state、成本和团队责任。Architecture
      patterns 就是对这些重复问题的 contextualized solutions。
    - Style 通常由 topology、physical architecture、deployment、communication style 和 data
      topology 区分。Pattern 可以存在于多个 styles 中；同一 pattern 又可有多种 implementations。
    - 称某做法为 best practice，暗示任何相同情形都必须采用，容易让架构师停止思考。即便说 better practice，也至少还保留争论空间；“best”往往把
      context 和 trade-offs 擦掉。
    - 原章使用 a smattering of representative patterns，不是完整模式目录。它们用于给 Part II 的 styles
      增加对比和上下文，并训练架构师识别“实现背后的模式”。
  - title: 1. Reuse：复用
    source_heading: 1. Reuse：复用
    paragraphs:
    - Hexagonal pattern 早于现代 microservices，原始设计把 database 视为可插拔 adapter，没有把 data schema
      视为 business logic 的一部分。这反映当时常见误解：database 是与 domain 分离的机器。
    - 若在 microservices 中照搬“database 完全在 hexagon 外、与 domain 无关”的 literal implementation，会违反
      microservices 的核心原则：service + schema/data 应共同形成 bounded context。
    - 识别 orthogonal coupling 的目标，是找到 entanglement 最小的 intersection point。Sidecar 在
      process/network boundary 截获流量和 telemetry，使 operational concern 横跨 domains，却不进入
      domain model。
    - 关键方法：先识别 separation/reuse pattern，再按 architecture context 选择 implementation。不要因为听到
      Hexagonal 就画六边形，也不要因为有 Istio 就认为 domain 已经解耦。
  - title: 2. Communication：通信
    source_heading: 2. Communication：通信
    paragraphs:
    - 许多 communication patterns 来自 event-driven architecture，但可用于任何通过 messages/events
      通信的 distributed architecture，包括 microservices。
    - 图 20-2 两边是同构 workflow：Services A-D 协作完成同一业务。区别在于 orchestration 多一个 coordinator/orchestrator；choreography
      由 services 直接协作。
    - Orchestration 提升 participants 的 recoverability，却让 orchestrator 成为 workflow potential
      single point of failure。Redundancy 可缓解，但需要 state replication、leader election
      或幂等并发控制，增加复杂度。
    - Orchestrator 必须了解 participants、steps 和 contracts，与 domain components 形成更紧 coupling。复杂
      domain workflow 有时天然需要这种 coupling，但 microservices 中应局部化，而非全局中央化。
  - title: 3. CQRS
    source_heading: 3. CQRS
    paragraphs:
    - CQRS 全称 Command-Query-Responsibility-Segregation，是一种 communication + data pattern。它把常见的“同一个
      database 同时承担读写”拆成两个路径。
    - 有些系统 read/write volume 差异悬殊，或出于 security、data model、operational characteristics
      需要隔离。
    - Read-heavy 系统可增加 read replicas/query services，而不复制 write coordination；write-heavy
      系统可独立优化 ingestion。
    - 局限：生产系统还需要 durable delivery、idempotency、transactional outbox、projection checkpoint
      和 rebuild strategy。
  - title: 4. Infrastructure：基础设施
    source_heading: 4. Infrastructure：基础设施
    paragraphs:
    - Architecture patterns 出现在任何团队反复解决 contextual problems 的地方，也会与 ecosystem 其他部分相交。Infrastructure
      同样会形成 coupling，不只是 components、data 和 APIs。
    - 原章标题使用 Broker-Domain Pattern，正文把 alternative 称为 Domain-Broker pattern。本文保留两种写法，并以
      Domain-Broker 表示“按 domain 配置 broker”的方案。
    - 这里 ownership 不一定表示独占一台物理 broker，而是该 service 的 infrastructure contract 包含 channel
      definition、address 和 lifecycle responsibility。
    - Domain brokers 缩小 blast radius，但 commerce domain 内三个 workflows 仍共同受影响。更细 broker
      不是自动更好，因为每次隔离都会增加 infrastructure 和 discovery 成本。
  - title: 5. 四组模式放在一起看
    source_heading: 5. 四组模式放在一起看
    paragraphs:
    - Domain 与 operation 分离后，需要 sidecar intersection；
    - Brokers 按 domain 分离后，需要 cross-broker discovery/operations。
    - 每次 decoupling 都会把直接耦合转化为 contract、同步、发现或治理问题。不存在“只解耦、不付协调成本”。
    - 组合并不等于越多越成熟。每个 pattern 必须对应明确 problem 和 measurable force。
  - title: 7. 一般化的问题解决方法
    source_heading: 7. 一般化的问题解决方法
    paragraphs:
    - 不要先说“我们需要 CQRS/Istio/Kafka”。先说读写比例、错误恢复、domain autonomy 或 broker failure domain
      是什么。
    - 区分 domain、operational、static、dynamic、data 和 infrastructure coupling。不同 coupling
      需要不同边界。
    - 例如 workflow 必须可查询状态、read volume 是 write 的百倍、broker license 昂贵、domain 必须隔离故障。
    - Pattern 解决的是当前 context。Second Law 要求 context 改变后重新评估，而不是把模式永久制度化。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - Microservices 中 duplication 可保护 domain autonomy。 但 monitoring、logging、auth、circuit
      breaker 等 operational concerns 需要一致复用。
    - Hexagonal/Ports and Adapters 保护 domain dependency boundary。 Literal “database
      只是无关 adapter”不符合现代 DDD/microservices 的 data fidelity。
    - Choreography 以分布式复杂性换 responsiveness、scalability、fault tolerance 和 decoupling。
      没有 owner 时 state/error/recovery 更难。
    - CQRS 分离 command/write 与 query/read。 它允许读写拥有不同 scale、model 和 security，却引入 projection
      synchronization 和 eventual consistency。
  takeaways:
  - Architecture style 与 pattern 不同。 Style 定义宏观 topology；pattern 是可跨风格复用的 contextual
    solution。
  - Hexagonal/Ports and Adapters 保护 domain dependency boundary。 Literal “database
    只是无关 adapter”不符合现代 DDD/microservices 的 data fidelity。
  - Communication patterns 可用于任何 distributed style。 它们不属于某一个架构风格专有。
  - Single Broker 优先 centralized discovery 和最低 infrastructure。 代价是 fault domain 与
    throughput limit。
  - 先辨认反复出现的问题和耦合类型，再选择能在当前上下文中把交叉点放到最合适位置的模式；不要从流行产品或“最佳实践”倒推架构。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.1 Architecture Pattern 等于 Architecture Style」？
  answer: 错误。Style 定义宏观 topology；pattern 是可跨 styles 使用的 contextual solution。
  source_heading: 6.1 Architecture Pattern 等于 Architecture Style
- level: 概念辨析
  question: 原文如何解释「6.6 Domain Code 和 Operational Code 都不应共享」？
  answer: 错误。Domain implementation 可为自治而复制；operational mechanism 常适合正交复用。关键是 concern
    类型。
  source_heading: 6.6 Domain Code 和 Operational Code 都不应共享
- level: 概念辨析
  question: 原文如何解释「6.10 Choreography 完全无 Coupling」？
  answer: 错误。Services 仍通过 event semantics/contracts/time assumptions 耦合，且 participant
    需要更多 workflow knowledge。
  source_heading: 6.10 Choreography 完全无 Coupling
- level: 概念辨析
  question: 原文如何解释「6.15 Sender Owns Topic 表示每个 Service 必须独占物理 Broker」？
  answer: 错误。Ownership 可指 channel contract/lifecycle；多个 channels 可位于同一 broker。
  source_heading: 6.15 Sender Owns Topic 表示每个 Service 必须独占物理 Broker
- level: 概念辨析
  question: 原文如何解释「6.19 Trade-off Analysis 做一次即可」？
  answer: 违反 Second Law。Load、workflow、teams 和 tools 会变化，原先合理 pattern 可能不再合理。
  source_heading: 6.19 Trade-off Analysis 做一次即可
