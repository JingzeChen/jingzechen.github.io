overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、阅读边界与全章总览」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与全章总览
  thesis: 如果这些问题都能回答，就不只是会接入几个第三方 SDK，而是理解了本章的核心方法：把一次业务通知拆成持久意图、策略决策、通道任务、外部副作用和可观测状态，用队列隔离速度与故障，用幂等和重试管理不确定结果，并始终把用户偏好、时效、成本与通道真实能力纳入正确性定义。
  thesis_source: 24. 核心结论与一般设计方法
  concepts:
  - term: 0. 学习目标、阅读边界与全章总览
    meaning: 本文严格沿原书顺序展开。补充的 QPS/积压公式、outbox、投递语义、状态机、重试分类、幂等实现、优先级与隐私治理属于标准工程背景，不是作者逐式给出的原文。
    source_heading: 0. 学习目标、阅读边界与全章总览
  - term: 8.1 Notification Servers 职责
    meaning: Notification Server 应快速完成“接受与编排”，不等待第三方交付。
    source_heading: 8.1 Notification Servers 职责
  - term: 12.4 何时渲染
    meaning: 入队前渲染：内容稳定、Worker 简单，但多通道/locale 产生较大消息。
    source_heading: 12.4 何时渲染
  - term: 15.4 Retry Queue
    meaning: 定时扫描 notification log。
    source_heading: 15.4 Retry Queue
  - term: 20. 更新后的最终架构
    meaning: 持久化 notification log/outbox；
    source_heading: 20. 更新后的最终架构
  - term: 24. 核心结论与一般设计方法
    meaning: 系统支持 iOS/Android push、SMS、Email，是软实时，用户可按类别和通道退订，每天约 1600 万条，平均 185/s，但活动峰值可能超过
      1.6 万/s。业务服务提交带 event ID、模板版本、优先级和过期时间的通知意图。入口认证、授权、限流、幂等检查，并两阶段检查用户偏好和频控。意图与
      outbox 在同一事务持久化，relay 写入按通道和优先级隔离的队列；无状态 Worker 独立扩容，渲染固定模板版本并通过 adapter 调 APNs、FCM、SMS
      或 Email provider。
    source_heading: 24. 核心结论与一般设计方法
  logic:
