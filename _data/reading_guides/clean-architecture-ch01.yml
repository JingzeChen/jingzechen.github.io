overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: Design 与 Architecture 没有本质分界，而是从最高层政策到最低层细节的连续设计整体。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 本章没有给出某种具体架构样式。它先建立全书的评价标准：后续介绍的编程范式、SOLID、组件原则和依赖规则，都要回答同一个问题：它们能否帮助团队持续降低不必要的修改成本？
    source_heading: 本章导读
  - term: 2.4 为什么以人力作为最终尺度
    meaning: 这并不意味着开发者越少越好。清晰边界可以让更大的团队并行工作；混乱边界则可能让更多人相互阻塞。重点是每个人的努力有多少真正转化成客户价值。
    source_heading: 2.4 为什么以人力作为最终尺度
  - term: 4.1 作者的最终结论
    meaning: 本章结论不是要求管理者立刻批准一次大规模重写，也不是要求开发者无限增加架构工作。
    source_heading: 4.1 作者的最终结论
  - term: 4.2 本章为全书建立的评价标准
    meaning: 如果一种「最佳实践」不能改善这些结果，只增加概念和文件数量，就不应仅凭名称采用。
    source_heading: 4.2 本章为全书建立的评价标准
  - term: 识别混乱
    meaning: 团队是否反复使用「以后再清理」解释新混乱？
    source_heading: 识别混乱
  - term: 本章总结
    meaning: Design 与 Architecture 没有本质分界，而是从最高层政策到最低层细节的连续设计整体。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 2.4 为什么以人力作为最终尺度
  - 2.6 适用边界
  - 4.2 本章为全书建立的评价标准
  - 作者的分析方法
  - 保护当前交付
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Design 与 Architecture 没有清晰分界，它们共同组成系统从高层政策到低层细节的全部设计；
    - 好架构的衡量标准，是系统在整个生命周期中能否一直以较低的人力成本满足需求；
    - 为了抢速度而制造混乱，不仅会拖慢长期开发，往往从短期就开始产生额外成本；
    - 本章没有给出某种具体架构样式。它先建立全书的评价标准：后续介绍的编程范式、SOLID、组件原则和依赖规则，都要回答同一个问题：它们能否帮助团队持续降低不必要的修改成本？
  - title: 2.3 衡量的是整个生命周期
    source_heading: 2.3 衡量的是整个生命周期
    paragraphs:
    - 修改 UI 是否需要重测核心计算？
    - 增加一种输入渠道是否要复制用例逻辑？
    - 一个小功能是否需要多个团队同步发布？
  - title: 2.4 为什么以人力作为最终尺度
    source_heading: 2.4 为什么以人力作为最终尺度
    paragraphs:
    - 即使云资源、许可证和硬件也有成本，本章聚焦的是设计质量如何影响人的工作量。
    - 这并不意味着开发者越少越好。清晰边界可以让更大的团队并行工作；混乱边界则可能让更多人相互阻塞。重点是每个人的努力有多少真正转化成客户价值。
  - title: 2.6 适用边界
    source_heading: 2.6 适用边界
    paragraphs:
    - 规模很小且变化可能性极低的程序。
    - 但原型如果即将进入生产，就不能继续以「反正只是原型」为由叠加功能。系统预期寿命变化时，设计投入也应随之调整。
  - title: 4.1 作者的最终结论
    source_heading: 4.1 作者的最终结论
    paragraphs:
    - 本章结论不是要求管理者立刻批准一次大规模重写，也不是要求开发者无限增加架构工作。
    - 学习哪些结构属性能够保持生产率；
  - title: 4.2 本章为全书建立的评价标准
    source_heading: 4.2 本章为全书建立的评价标准
    paragraphs:
    - 它是否把易变细节与重要业务规则分开？
    - 它是否帮助开发成本在系统生命期内保持合理？
    - 如果一种「最佳实践」不能改善这些结果，只增加概念和文件数量，就不应仅凭名称采用。
  - title: 作者的分析方法
    source_heading: 作者的分析方法
    paragraphs:
    - 作者先消除 Design 与 Architecture 的人为分割，避免团队把低层实现排除在架构责任之外；随后用长期人力成本给设计质量一个统一目标。
    - 人数、工资、产出和生产率曲线说明：架构恶化最终会影响公司的成本、利润和交付能力，而不只是影响代码阅读体验。
    - 开发者看到的是努力无法产生结果；管理者看到的是工资不断增长却几乎没有产出。两个视角描述的是同一个结构性问题。
    - 作者没有把问题归咎于工具、管理者或开发者中的单一一方，而是要求开发组织认真学习并维护架构质量。
  - title: 识别混乱
    source_heading: 识别混乱
    paragraphs:
    - UI、数据库或框架类型是否进入业务核心？
    - 是否依赖少数人掌握全局隐含知识？
    - 团队是否反复使用「以后再清理」解释新混乱？
  - title: 保护当前交付
    source_heading: 保护当前交付
    paragraphs:
    - 新增抽象是否隔离真实变化，而非猜测未来？
    - 是否避免把一次性特殊分支扩散到核心？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - Design 与 Architecture 没有本质分界，而是从最高层政策到最低层细节的连续设计整体。
    - 住宅的房间布局和插座、墙体、地基共同构成建筑设计；软件的高层结构和具体代码同样不可分割。
    - 到第 8 个版本时，每行代码成本约为第 1 个版本的 40 倍，说明投入与产出严重脱钩。
    - Jason Gorman 的六日实验表明，使用 TDD 的几天并未更慢，反而约快百分之十。
  takeaways:
  - Design 与 Architecture 没有本质分界，而是从最高层政策到最低层细节的连续设计整体。
  - 工作量增长可能来自需求变复杂，也可能来自结构制造的额外摩擦，二者必须区分。
  - 管理者看到的是每月工资达到约 2,000 万美元，而新增产出几乎停滞。
  - Jason Gorman 的六日实验表明，使用 TDD 的几天并未更慢，反而约快百分之十。
  - 全书后续原则都应以同一标准评估：能否让系统在长期变化中保持合理的人力成本和生产率。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. Architecture 只关心高层，Design 只关心低层」？
  answer: 高低层是相对概念，但没有一条把架构与设计彻底分开的线。低层依赖可以直接破坏高层意图。
  source_heading: 1. Architecture 只关心高层，Design 只关心低层
- level: 概念辨析
  question: 原文如何解释「3. 代码行数可以直接衡量生产率」？
  answer: 代码行数只是案例中的粗糙代理指标，必须结合交付时间、质量、影响范围和业务价值理解。
  source_heading: 3. 代码行数可以直接衡量生产率
- level: 概念辨析
  question: 原文如何解释「4. 忙碌说明需求本来就复杂」？
  answer: 忙碌也可能来自等待、协调、重复、回归和混乱。应区分需求固有工作与结构额外制造的工作。
  source_heading: 4. 忙碌说明需求本来就复杂
- level: 概念辨析
  question: 原文如何解释「7. 最好的办法是推倒重写」？
  answer: 若工程习惯不变，新系统会重演旧问题。重写还会遗漏隐含规则并产生双轨维护风险。
  source_heading: 7. 最好的办法是推倒重写
- level: 概念辨析
  question: 原文如何解释「8. 认真维护架构等于过度设计」？
  answer: 过度设计是为想象中的未来建立复杂结构；维护架构是控制已经存在的职责、依赖和变化传播。二者不同。
  source_heading: 8. 认真维护架构等于过度设计
