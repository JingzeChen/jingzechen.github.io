overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 架构师与业务方说不同语言，识别工作的核心之一是建立从业务结果到工程能力的因果翻译。
  thesis_source: 10. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：架构特征识别是一项翻译、分解、取证和删减工作：从业务真正关心的结果出发，把模糊目标转成可设计能力，用领域知识补足隐藏负载与风险，再只保留会驱动结构的少数关键特征。
    source_heading: 0. 本章要回答的核心问题
  - term: 3. Composite Architectural Characteristics：复合架构特征
    meaning: 按时算出错误价格仍然失败。原章最终把 auditability 列入所需架构特征：系统应能追踪输入、规则、版本和计算结果，支持核验和监管证明。
    source_heading: 3. Composite Architectural Characteristics：复合架构特征
  - term: '5. Kata: Silicon Sandwiches：硅三明治案例'
    meaning: 图 5-2 展示负载反复陡升陡降。三明治店流量不太可能全天均匀，而会在早餐、午餐、晚餐附近突发。需求没有直接写 elasticity，它“藏在”领域使用模式中。原章虽然在
      Explicit Characteristics 小节讨论它，证据来源却包含隐含领域推断，这正说明分类边界不是文档标签的机械切割。
    source_heading: '5. Kata: Silicon Sandwiches：硅三明治案例'
  - term: 7.4 “日终定价按时完成只需要 Performance”
    meaning: 正确理解：从失败模式拆出 availability、scalability、reliability、recoverability、auditability
      等候选。
    source_heading: 7.4 “日终定价按时完成只需要 Performance”
  - term: 8. 从本章提炼的通用识别方法
    meaning: 把 agility 等不可直接度量的大词拆成 deployability、modularity、testability 等可观察组成。
    source_heading: 8. 从本章提炼的通用识别方法
  - term: 11. 主动回忆与应用题
    meaning: 解释 worksheet 中 Driving、Implicit、Others considered 和 Top 3 四个区域分别解决什么认知问题。
    source_heading: 11. 主动回忆与应用题
  logic:
  - 0. 本章要回答的核心问题
  - 3. Composite Architectural Characteristics：复合架构特征
  - 4. Extracting Architectural Characteristics：提取架构特征
  - 7.4 “日终定价按时完成只需要 Performance”
  - 7.15 “Security 在所有系统中重要，所以都应进入 Top 3”
  - 10. 核心结论
  - 11. 主动回忆与应用题
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - mergers and acquisitions、time to market、user satisfaction 等业务语言怎样映射到 “-ilities”？
    - 什么是 composite architectural characteristic，为什么 agility 不能只等同于 time to market？
    - architectural characteristics worksheet 如何限制候选、提升隐含项、保留淘汰项并选出 top 3？
    - 一句话概括：架构特征识别是一项翻译、分解、取证和删减工作：从业务真正关心的结果出发，把模糊目标转成可设计能力，用领域知识补足隐藏负载与风险，再只保留会驱动结构的少数关键特征。
  - title: 1. 开篇：架构特征从哪里来
    source_heading: 1. 开篇：架构特征从哪里来
    paragraphs:
    - architectural characteristics：系统成功所需的能力和结构驱动力；
    - 第 4 章已经定义：架构特征不直接描述领域行为，却影响结构并对成功关键。本章进一步指出，正确识别它们不仅需要理解领域问题，还需要与利益相关者合作，确认从业务视角看什么才真正重要。
    - 一些隐含特征几乎适用于所有系统，例如 security 和 modularity；另一些来自特定领域。
    - 原书以医疗软件为例：读取诊断设备数据的系统必须重视 data integrity 和消息丢失后果。需求可能没有反复写“不可丢消息”，但熟悉医疗领域的架构师应知道，缺失诊断数据可能导致错误判断，后果远高于普通分析事件丢失。
  - title: 3. Composite Architectural Characteristics：复合架构特征
    source_heading: 3. Composite Architectural Characteristics：复合架构特征
    paragraphs:
    - 从领域关注翻译时，一个常见陷阱是制造 false equivalence，例如把 agility 只等同于 time to market。
    - Composite architectural characteristic 没有单一客观定义，而由多个可观测、可度量能力共同构成。
    - 按时算出错误价格仍然失败。原章最终把 auditability 列入所需架构特征：系统应能追踪输入、规则、版本和计算结果，支持核验和监管证明。
    - 需要明确边界：auditability 帮助证明、追溯和重现计算，不会自动使价格正确。 正确性还依赖领域规则、数据完整性、算法和测试。
  - title: 4. Extracting Architectural Characteristics：提取架构特征
    source_heading: 4. Extracting Architectural Characteristics：提取架构特征
    paragraphs:
    - 代码对应公式，但它只是最后 10 分钟窗口内的平均等效到达率，不是瞬时最坏峰值或完整容量模型。真实设计还要考虑并发会话、请求数、课程热点、数据库锁、重试、响应时间和安全余量。
    - 十多年前，Ted Neward 设计 architecture katas，让初学架构师练习从领域描述推导架构特征。Kata 来自日语，指强调正确形式与技术的个人武术训练。
    - Kata 提供低风险、时间受限的实验室。Ted 创建最早的网站，作者 Neal Ford 与 Mark Richards 在本书配套网站上更新和改编练习。
    - 任何人都可以组织 brown-bag lunch。资深架构师可当场或事后评估设计和权衡，指出遗漏与替代方案。由于 timebox，设计不会很精细；练习目标是判断过程和表达，不是生产蓝图。
  - title: '5. Kata: Silicon Sandwiches：硅三明治案例'
    source_heading: '5. Kata: Silicon Sandwiches：硅三明治案例'
    paragraphs:
    - 图 5-2 展示负载反复陡升陡降。三明治店流量不太可能全天均匀，而会在早餐、午餐、晚餐附近突发。需求没有直接写 elasticity，它“藏在”领域使用模式中。原章虽然在
      Explicit Characteristics 小节讨论它，证据来源却包含隐含领域推断，这正说明分类边界不是文档标签的机械切割。
    - 有些系统 scalable 但不 elastic。酒店预订在没有特卖或活动时常呈可预测季节性，可以提前容量规划；热门演唱会开票会瞬间涌入粉丝，需要高度
      elasticity。弹性系统也常需要 scalability，因为突发峰值本身可能非常高。
    - 若公司决定自己保存卡数据、进入高监管支付范围，security 会更可能显著改变结构和优先级；即使使用第三方支付，身份认证、回调完整性、欺诈风险或其他隐私数据也可能使安全成为结构驱动力，最终仍取决于实际威胁模型和责任边界。
    - Silicon Sandwiches 可把支付交给第三方；只要遵循一般安全卫生，就可能无需特殊结构。Security 仍要实现，却不一定挤入 top driving
      characteristics。
  - title: 7.4 “日终定价按时完成只需要 Performance”
    source_heading: 7.4 “日终定价按时完成只需要 Performance”
    paragraphs:
    - 错误之处：不可用、规模增长、处理中崩溃、无法续跑或结果不可追溯都能让目标失败。
    - 正确理解：从失败模式拆出 availability、scalability、reliability、recoverability、auditability
      等候选。
  - title: 7.15 “Security 在所有系统中重要，所以都应进入 Top 3”
    source_heading: 7.15 “Security 在所有系统中重要，所以都应进入 Top 3”
    paragraphs:
    - 错误之处：一般安全卫生必须存在，但不一定需要特殊结构或高于本系统其他驱动力。
    - 正确理解：区分 implicit baseline 与 driving characteristic。
  - title: 8. 从本章提炼的通用识别方法
    source_heading: 8. 从本章提炼的通用识别方法
    paragraphs:
    - 把失败模式映射到 performance、availability、testability 等，并写出因果理由。
    - 把 agility 等不可直接度量的大词拆成 deployability、modularity、testability 等可观察组成。
    - 把真正驱动结构的候选放入约七个槽位；新项必须与已有项竞争，被替换项进入 Others considered。
    - 这十步不是一次性需求阶段。真实实现和运行会暴露新峰值、故障和成本，候选集合应随证据变化。
  - title: 10. 核心结论
    source_heading: 10. 核心结论
    paragraphs:
    - Agility 等 composite characteristic 必须拆成 deployability、modularity、testability
      等可观察能力。
    - Kata 的 Description、Users、Requirements、Additional context 提供不同种类的设计证据。
    - Scalability 关注长期容量增长，elasticity 关注短期突发与资源回收；两者经常同时需要但不能混同。
    - Customizability 可以用 microkernel 的结构插件实现，也可以用 Template Method 等设计模式实现，选择取决于扩展规模与代价。
  - title: 11. 主动回忆与应用题
    source_heading: 11. 主动回忆与应用题
    paragraphs:
    - 重建日终基金定价案例：列出六种不同失败路径及对应能力，并解释 auditability 与 correctness 的边界。
    - 为 customizability 比较 microkernel 与 Template Method：何时结构收益超过插件治理成本？
    - 为 Silicon Sandwiches 提出自己的约七项 driving candidates，明确删除一项，再选择不排序的 Top 3。
    - 解释 worksheet 中 Driving、Implicit、Others considered 和 Top 3 四个区域分别解决什么认知问题。
  takeaways:
  - 发现：从领域关注、需求和隐含知识获得证据；
  - Agility 等 composite characteristic 必须拆成 deployability、modularity、testability 等可观察能力。
  - Silicon Sandwiches 的下单、配送选择和派司机首先是领域行为，不会自动产生特殊架构特征。
  - 删除“最不重要项”比逐项问“重要吗”更能暴露真实优先级。
  - 识别结果是当前上下文的决策工具，应随规模、法规、责任和实现证据变化而复查。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 “领域利益相关者应该直接给出架构特征”」？
  answer: 错误之处：业务方通常表达用户满意度、并购和上市时间，不会自然给出可设计的 “-ilities”。
  source_heading: 7.1 “领域利益相关者应该直接给出架构特征”
- level: 概念辨析
  question: 原文如何解释「7.6 “需求写 1,000 个用户，就按平均负载设计”」？
  answer: 错误之处：总量没有描述时间分布，大学注册可能在最后十分钟形成 60 倍平均率。
  source_heading: 7.6 “需求写 1,000 个用户，就按平均负载设计”
- level: 概念辨析
  question: 原文如何解释「7.13 “移动设备访问必然要求多个原生 App”」？
  answer: 错误之处：预算和功能可能更适合移动优化 Web；某些设备能力才需要原生。
  source_heading: 7.13 “移动设备访问必然要求多个原生 App”
- level: 概念辨析
  question: 原文如何解释「7.16 “Customizability 必须使用 Microkernel”」？
  answer: 正确理解：根据扩展数量、独立性、生命周期和其他特征比较结构方案与设计方案。
  source_heading: 7.16 “Customizability 必须使用 Microkernel”
- level: 概念辨析
  question: 原文如何解释「7.21 “Others considered 是失败候选，可以删除”」？
  answer: 正确理解：该区域保留候选名称，为决策历史提供索引；为什么未入选仍需另行记录，才能证明是主动取舍而非遗漏。
  source_heading: 7.21 “Others considered 是失败候选，可以删除”
