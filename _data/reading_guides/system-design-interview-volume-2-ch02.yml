checks:
- level: 概念辨析
  question: 原文如何解释「6.1 附近好友不是静态邻近搜索」？
  answer: 商户索引可以按天更新，好友位置每 30 秒变化。本章核心是事件分发，而不是从稳定空间索引执行一次查询。
  source_heading: 6.1 附近好友不是静态邻近搜索
- level: 概念辨析
  question: 原文如何解释「6.6 TTL 不等于精确在线状态」？
  answer: TTL 表示服务器最近是否收到位置，不知道应用是否仍在前台、用户是否关闭定位或网络是否中断。它是符合本题需求的近似活跃判定。
  source_heading: 6.6 TTL 不等于精确在线状态
- level: 概念辨析
  question: 原文如何解释「6.11 Pub/Sub 内存够不等于两台服务器够」？
  answer: 200 GB 理论订阅内存只需约两台 100 GB 服务器，而扇出能力估算需要约 140 台。机器数取各资源约束的最大值。
  source_heading: 6.11 Pub/Sub 内存够不等于两台服务器够
- level: 概念辨析
  question: 原文如何解释「6.16 一致性哈希只解决路由和迁移范围」？
  answer: 它不会自动复制订阅关系、重建频道或防止迁移窗口漏消息。服务发现、配置 watch 和重订阅协议仍然必需。
  source_heading: 6.16 一致性哈希只解决路由和迁移范围
- level: 概念辨析
  question: 原文如何解释「6.22 原书暂不讨论隐私不代表系统可忽略隐私」？
  answer: 附近好友涉及持续共享精确位置和历史轨迹，生产系统必须把授权、撤销、屏蔽、保留期和访问审计放在核心设计中。
  source_heading: 6.22 原书暂不讨论隐私不代表系统可忽略隐私
