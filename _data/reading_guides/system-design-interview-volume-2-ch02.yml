overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1.1.2 使用直线距离还是实际出行距离」建立了怎样的核心认识？
  question_source: 1.1.2 使用直线距离还是实际出行距离
  thesis: 附近好友的本质是动态位置事件在社交图上的一对多分发。 它与静态商户空间查询的负载模型不同。
  thesis_source: 8. 核心结论
  concepts:
  - term: 1.1.2 使用直线距离还是实际出行距离
    meaning: 本章使用两点间直线地理距离。即使中间有河流、山脉或道路绕行，系统仍按球面最短距离判断。
    source_heading: 1.1.2 使用直线距离还是实际出行距离
  - term: 2.3 周期性位置更新的完整流程
    meaning: 代价是 Pub/Sub 可能先把消息发给在线但不在附近的好友，之后才过滤。这样简化了路由，却增加中间扇出与距离计算。原书用“轻量频道 +
      接收端过滤”换取架构简单。
    source_heading: 2.3 周期性位置更新的完整流程
  - term: 3.2.3 连接容量不是只看 CPU
    meaning: Pub/Sub 回调和距离计算；
    source_heading: 3.2.3 连接容量不是只看 CPU
  - term: 3.6.2 交付语义
    meaning: 若业务改为“每个事件必须处理”“离线后必须补发”，Redis Pub/Sub 就不合适，应考虑持久消息日志、消费位点、重试和幂等。
    source_heading: 3.6.2 交付语义
  - term: 3.12 添加、删除好友与位置共享开关
    meaning: 生产系统不能只信客户端回调，因为恶意或离线客户端可能不执行。服务端应由权威好友/权限事件校验订阅资格，并在断线重连时从权威关系重新初始化。
    source_heading: 3.12 添加、删除好友与位置共享开关
  - term: 9. 解决动态位置分发问题的一般思路
    meaning: 本章最值得迁移的方法不是“使用 Redis Pub/Sub”这一产品答案，而是：先识别动态事件如何被关系图放大，再让时效、可靠性、状态生命周期和运维协调分别决定长连接、缓存、历史库、消息语义与分片方式。
    source_heading: 9. 解决动态位置分发问题的一般思路
  logic:
  - 1.1.2 使用直线距离还是实际出行距离
  - 2.3 周期性位置更新的完整流程
  - 2.6.2 位置历史数据库
  - 3.6.2 交付语义
  - 3.9.2 订阅关系是状态
  - 5. Step 4：收束与作者结论
  - 9. 解决动态位置分发问题的一般思路
  sections:
  - title: 1.1.2 使用直线距离还是实际出行距离
    source_heading: 1.1.2 使用直线距离还是实际出行距离
    paragraphs:
    - 本章使用两点间直线地理距离。即使中间有河流、山脉或道路绕行，系统仍按球面最短距离判断。
    - 这个澄清排除了路网图、地图匹配和路径规划。若产品要求“步行 10 分钟内的好友”，则必须引入道路或步行网络，算法与成本会完全改变。
  - title: 1.3 非功能需求
    source_heading: 1.3 非功能需求
    paragraphs:
    - 其中上报间隔带来的数据年龄是另一层延迟：即使处理链只用 100 ms，一个刚移动的用户也可能要等接近 30 秒才发送下一次位置。
    - 系统整体应可靠，但偶尔丢失单个位置点可以接受。原因是位置会周期性重发，下一次更新可以修复短暂缺口。
    - 这允许使用不持久化消息的 Redis Pub/Sub，而不必为每条事件提供重放和至少一次交付。但“偶尔可丢”不等于可以长时间中断或持续丢失某一用户的更新。
    - 位置存储不要求强一致，各副本相差几秒可以接受。附近好友是环境感知信息，不是余额扣款；为每个位置点执行跨节点同步共识会增加延迟和可用性成本，却无法消除 GPS
      本身的误差。
  - title: 2.3 周期性位置更新的完整流程
    source_heading: 2.3 周期性位置更新的完整流程
    paragraphs:
    - Pub/Sub 广播给该频道全部订阅者，即发送者的在线好友连接处理器；
    - 接收方处理器已经保存自己的最新位置，因此只需要消息中的发送者位置即可计算距离。这避免发布者为所有朋友逐个读取朋友位置。
    - 代价是 Pub/Sub 可能先把消息发给在线但不在附近的好友，之后才过滤。这样简化了路由，却增加中间扇出与距离计算。原书用“轻量频道 + 接收端过滤”换取架构简单。
    - 本章允许偶发点丢失，因此可以接受这种松耦合。若需求改为每个位置点都必须持久化再投递，应引入持久日志、重试和幂等，延迟与复杂度都会增加。
  - title: 2.6.2 位置历史数据库
    source_heading: 2.6.2 位置历史数据库
    paragraphs:
    - 历史库承受约 33.4 万次追加/秒，适合水平扩展、写吞吐高的存储，例如 Cassandra。
    - 查询某个用户的轨迹只访问一个分片；
  - title: 3.2.3 连接容量不是只看 CPU
    source_heading: 3.2.3 连接容量不是只看 CPU
    paragraphs:
    - Pub/Sub 回调和距离计算；
    - 因此扩容指标不应只有平均 CPU，还应监控连接数、消息率、事件循环延迟、发送缓冲积压与重连率。
  - title: 3.6.2 交付语义
    source_heading: 3.6.2 交付语义
    paragraphs:
    - 这近似“至多一次、实时尽力而为”。本题位置每 30 秒刷新且允许偶发丢点，因此语义匹配。
    - 若业务改为“每个事件必须处理”“离线后必须补发”，Redis Pub/Sub 就不合适，应考虑持久消息日志、消费位点、重试和幂等。
  - title: 3.9.2 订阅关系是状态
    source_heading: 3.9.2 订阅关系是状态
    paragraphs:
    - 旧节点上的订阅不会自动出现在新节点；
    - 每个 WebSocket 连接处理器必须知道环已变化；
    - 它要取消旧订阅并在新节点重新订阅；
    - 控制面上的订阅拓扑让集群具有状态，应像存储集群一样谨慎扩缩容，而不是每天随流量频繁伸缩。
  - title: 3.12 添加、删除好友与位置共享开关
    source_heading: 3.12 添加、删除好友与位置共享开关
    paragraphs:
    - 好友关系发生变化时，已有 WebSocket 连接的订阅集合必须同步变化。
    - 客户端通过 WebSocket 通知连接处理器；
    - 若新好友当前活跃，从位置缓存取最新坐标；
    - 生产系统不能只信客户端回调，因为恶意或离线客户端可能不执行。服务端应由权威好友/权限事件校验订阅资格，并在断线重连时从权威关系重新初始化。
  - title: 5. Step 4：收束与作者结论
    source_heading: 5. Step 4：收束与作者结论
    paragraphs:
    - WebSocket：客户端与服务器的近实时双向通信；
    - Redis Location Cache：快速读写活跃用户最新位置，并用 TTL 表示失活；
    - Redis Pub/Sub：把一个用户的位置事件路由到其在线好友连接处理器。
    - Pub/Sub 的内存与 CPU/网络容量；
  - title: 9. 解决动态位置分发问题的一般思路
    source_heading: 9. 解决动态位置分发问题的一般思路
    paragraphs:
    - 明确半径、距离类型、更新频率、失活阈值、是否保存历史、是否允许丢点，以及谁有权看到位置。
    - 连接初始化批量读取好友当前状态；建立后通过 Pub/Sub 接收增量。这个“snapshot + stream”模式也适用于行情、协作编辑和在线状态系统。
    - 检查网络连接、订阅列表、本地缓存的哈希环和处理器内变量。即使业务消息不持久，这些控制面状态也会让节点迁移需要协调。
    - 本章最值得迁移的方法不是“使用 Redis Pub/Sub”这一产品答案，而是：先识别动态事件如何被关系图放大，再让时效、可靠性、状态生命周期和运维协调分别决定长连接、缓存、历史库、消息语义与分片方式。
  takeaways:
  - 附近好友的本质是动态位置事件在社交图上的一对多分发。 它与静态商户空间查询的负载模型不同。
  - 当前位置与历史位置必须分离。 Redis 保存可重建最新状态，历史数据库承载耐久高写入时间序列。
  - 容量与吞吐要分开估算。 位置和订阅数据内存可控，CPU 与网络却要求分片和百机级路由集群。
  - 一致性哈希统一发布和订阅路由。 服务发现保存权威环，WebSocket 节点本地缓存并监听更新。
  - 团队能力也是架构约束。 Erlang/OTP 技术上非常适合海量轻量进程与消息传递，但人才和运维经验决定能否采用。
