  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 它不随 Production Artifact 一起部署；
    - Tests are part of the system。测试是系统的一部分。
    - 就会产生 Fragile Tests Problem：生产代码稍有重构，成百上千测试一起失败。
    - 与危险测试能力一起独立部署，避免进入 Production。
  - title: 1.16 测试辅助代码放在哪里
    source_heading: 1.16 测试辅助代码放在哪里
    paragraphs:
    - Fixture Factory；
    - Assertion Helper；
    - Test Data Generator。
  - title: 3.5 合理耦合与有害耦合
    source_heading: 3.5 合理耦合与有害耦合
    paragraphs:
    - 重命名内部 Method 导致 Acceptance Test 变化；
    - 页面导航变化导致业务规则测试失败；
    - Class 拆分导致所有测试重写；
    - SQL 重构导致 Use Case Test 失败。
  - title: 5.5 稳定业务边界优于易变入口
    source_heading: 5.5 稳定业务边界优于易变入口
    paragraphs:
    - Business Request；
    - Business Response；
    - Stable Test DSL；
  - title: 7.9 重置场景
    source_heading: 7.9 重置场景
    paragraphs:
    - 重建 In-Memory State；
    - Rollback Transaction；
  - title: 10.1 Testing API 为什么有安全风险
    source_heading: 10.1 Testing API 为什么有安全风险
    paragraphs:
    - Bypass Authentication；
    - Skip Expensive Resource；
    - Inspect Internal Result；
    - Simulate Privileged Identity。
  - title: 11.3 第三步：区分业务 API 与 Test Superpower
    source_heading: 11.3 第三步：区分业务 API 与 Test Superpower
    paragraphs:
    - scheduleAppointment。
    - simulatePaymentDecline；
  - title: 13.3 Adapter Test Component
    source_heading: 13.3 Adapter Test Component
    paragraphs:
    - Message Adapter；
    - External Service Adapter。
  - title: 17.3 Structural Coupling 检查
    source_heading: 17.3 Structural Coupling 检查
    paragraphs:
    - Test Class 是否机械对应 Production Class？
    - Method 移动是否要求 Test 重写？
    - Acceptance Test 是否知道内部对象图？
  - title: 18. 本章总结
    source_heading: 18. 本章总结
    paragraphs:
    - Unit、Integration、Acceptance、Functional、TDD、BDD、Cucumber、FitNesse、SpecFlow 与
      JBehave 测试在架构上等价。
    - 测试的职责是支持 Development、Regression、Refactoring、Specification 与 Deployment Confidence。
    - Testing API 可以由 Use Case Port、Fixture API、State Builder、Query API 与 Scenario
      DSL 构成。
    - Unit Test 依赖 Core，Adapter Test 依赖 Adapter，Acceptance Test 依赖 Testing API，E2E
      依赖 Production Entry。
  takeaways:
  - 第 28 章明确指出 Tests 是系统的一部分，并像其他组件一样参与架构。
  - Clean Architecture 的 Entity、Use Case、Port 与 Adapter 为可测试性提供天然基础。
  - Testing API 应围绕 createCustomer、placeOrder、queryStatus 等业务语言设计。
  - Testing API 让生产和测试代码能分别重构，只共享稳定业务契约。
  - 本章最终原则是：测试不是系统之外的附属物；只有把测试作为系统组件认真设计，才能长期获得稳定、可维护的回归保护。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「16.2 “只有 Unit Test 属于最外层”」？
  answer: 错误。Acceptance、Cucumber、FitNesse 与 E2E 在架构上也依赖系统并位于外层。
  source_heading: 16.2 “只有 Unit Test 属于最外层”
- level: 概念辨析
  question: 原文如何解释「16.4 “测试越接近真实 GUI 越有价值”」？
  answer: 不一定。GUI Test 对 UI 有价值，却不适合承担全部业务规则验证。
  source_heading: 16.4 “测试越接近真实 GUI 越有价值”
- level: 概念辨析
  question: 原文如何解释「16.13 “Superpowers 可以方便 Production 运维”」？
  answer: 危险。测试特权应与 Production 诊断接口分离，并通常不打包到 Production。
  source_heading: 16.13 “Superpowers 可以方便 Production 运维”
- level: 概念辨析
  question: 原文如何解释「16.17 “Fake Database 足以证明 SQL 正确”」？
  answer: 错误。Fake 验证 Use Case，真实 SQL 需要 Adapter Integration Test。
  source_heading: 16.17 “Fake Database 足以证明 SQL 正确”
- level: 概念辨析
  question: 原文如何解释「16.20 “结构耦合永远错误”」？
  answer: 错误。Architecture Test 的目标就是结构；问题是业务测试不应依赖无关实现结构。
  source_heading: 16.20 “结构耦合永远错误”
