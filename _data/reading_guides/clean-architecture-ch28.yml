  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章最终原则是：测试不是系统之外的附属物；只有把测试作为系统组件认真设计，才能长期获得稳定、可维护的回归保护。
