checks:
- level: 概念辨析
  question: 原文如何解释「24.1 Load balancing 与 autoscaling」？
  answer: LB 不能凭空产生 server；autoscaler 也需要 discovery/readiness 才能安全接流量。
  source_heading: 24.1 Load balancing 与 autoscaling
- level: 概念辨析
  question: 原文如何解释「24.8 NAT 与 DSR」？
  answer: DSR：response 直返 client，减轻 LB egress，network setup 更复杂。
  source_heading: 24.8 NAT 与 DSR
- level: 概念辨析
  question: 原文如何解释「25.2 “有多个 servers 就自动四个 9”」？
  answer: 独立故障、即时摘除和剩余 capacity 是强假设。Shared dependency/deploy 会让全部一起失败。
  source_heading: 25.2 “有多个 servers 就自动四个 9”
- level: 概念辨析
  question: 原文如何解释「25.9 “ECMP 会让每个 packet 随机走不同 LB”」？
  answer: 通常按 flow hash 保持 connection path；per-packet spraying 会造成重排并破坏 stateful LB。
  source_heading: 25.9 “ECMP 会让每个 packet 随机走不同 LB”
- level: 概念辨析
  question: 原文如何解释「25.15 “Service mesh 自动降低复杂度”」？
  answer: 它把 cross-cutting networking 集中标准化，却增加 distributed proxy fleet 和 control
    plane；收益取决于组织规模与运营能力。
  source_heading: 25.15 “Service mesh 自动降低复杂度”
