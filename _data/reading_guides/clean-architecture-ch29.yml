  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Hardware 会过时，Firmware 也会随 Hardware 过时；真正的 Software 应被保护，使它有机会拥有更长的有效寿命。
    - PAL：Processor Abstraction Layer，把 Firmware 与特定 Processor / Compiler 扩展分开；
    - Programming to Interfaces and Substitutability：通过接口、替换实现和 Link-Time / Runtime
      Binding 支持 Off-Target Test 与平台迁移。
    - 本章没有数学公式或算法推导。它通过反例、代码依赖和架构边界论证，说明怎样把“能运行的 Firmware”逐步改造成“可长期演进的 Software”。
  - title: 3.1 SQL 散布在业务代码
    source_heading: 3.1 SQL 散布在业务代码
    paragraphs:
    - Database Vendor 改变会影响业务；
    - 测试依赖真实 Database；
  - title: 4.10 怎样避免
    source_heading: 4.10 怎样避免
    paragraphs:
    - 独立描述 Domain Policy；
    - Hardware / Protocol 留在 Adapter；
    - 用稳定 Event 与 State 表达 Call Behavior；
    - 维护可执行 Specification。
  - title: 8.2 Extended C
    source_heading: 8.2 Extended C
    paragraphs:
    - Register Variable；
    - 特殊 Address Space；
    - Interrupt Syntax。
  - title: 10.5 Contract Test
    source_heading: 10.5 Contract Test
    paragraphs:
    - Boundary Condition；
    - State Transition；
    - Timing Semantics，在可验证范围内。
  - title: 13. HAL 示例：Persistence
    source_heading: 13. HAL 示例：Persistence
    paragraphs:
    - 保存 Name / Value Pair；
    - 好的 HAL 表达 Product Need，而不是 Device Primitive。
    - Flash 更换不影响 Application；
    - Persistence 错误可用统一语义表达。
  - title: 18.3 非标准 Binary Literal
    source_heading: 18.3 非标准 Binary Literal
    paragraphs:
    - 作者指出，标准 C 当时并不支持这种写法；这是 Compiler Extension。
    - 现代标准与 Compiler 支持可能不同，但原书结论仍成立：不要让 Vendor Extension 扩散。
  - title: 21.3 不应包含什么
    source_heading: 21.3 不应包含什么
    paragraphs:
    - Internal Constant；
    - Register Definition；
  - title: 24.11 逐步扩大 Off-Target 覆盖
    source_heading: 24.11 逐步扩大 Off-Target 覆盖
    paragraphs:
    - 可 Host Compile 的文件比例；
    - Host Test 覆盖的 Policy；
    - Vendor Header 扩散范围；
    - Target-Only Test 数量。
  - title: 30. 本章总结
    source_heading: 30. 本章总结
    paragraphs:
    - Systems Engineer 必须阅读 Current Product Code 才能回答业务行为，Legacy Implementation 已成为
      Specification。
    - Hardware 真实 Sampling Rate、Resolution 与 Error Model 可以通过 Product Semantic 表达，但不能泄漏
      Register。
    - Build System 应负责 Source Set、Library、Link Target 与 Vendor Include Path，而不是让 Preprocessor
      代替架构。
    - 本章最终原则是：Hardware、Processor 与 Operating System 都是 Detail；把它们限制在 Firmware 边界外，才能让
      Product Software 获得长久、可测试、可迁移的生命。
  takeaways:
  - 第 29 章由 James Grenning 撰写，把 Clean Architecture 原则应用到 Embedded System。
  - Fred Brooks 的 Plan to Throw One Away 同样强调先学习，再构造更好方案。
  - GPIO Mapping、Board Revision 与具体 Indicator 留在 HAL / BSP 下方。
  - Embedded C 可使用 Header File 作为 Interface Definition。
  - 本章最终原则是：Hardware、Processor 与 Operating System 都是 Detail；把它们限制在 Firmware 边界外，才能让
    Product Software 获得长久、可测试、可迁移的生命。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「28.1 “Firmware 由存储在 ROM 决定”」？
  answer: 错误。本章更关注它依赖 Hardware 的程度与随 Hardware 过时的风险。
  source_heading: 28.1 “Firmware 由存储在 ROM 决定”
- level: 概念辨析
  question: 原文如何解释「28.5 “HAL 就是给 Register 函数换名字”」？
  answer: 错误。HAL 应表达上层 Product Need，并隐藏 Hardware Detail。
  source_heading: 28.5 “HAL 就是给 Register 函数换名字”
- level: 概念辨析
  question: 原文如何解释「28.12 “Wrapper Header 能解决所有 Portability”」？
  answer: 错误。Endianness、Alignment、ABI 与 Timing 仍需处理。
  source_heading: 28.12 “Wrapper Header 能解决所有 Portability”
- level: 概念辨析
  question: 原文如何解释「28.18 “接口一定增加运行时开销”」？
  answer: 错误。C Function、Link-Time Binding、Inline 与 LTO 可使开销很低；仍需测量。
  source_heading: 28.18 “接口一定增加运行时开销”
- level: 概念辨析
  question: 原文如何解释「28.21 “重写比重构旧 Firmware 更简单”」？
  answer: 未必。旧代码可能是唯一隐含规格，必须先提取业务知识和 Regression Test。
  source_heading: 28.21 “重写比重构旧 Firmware 更简单”
