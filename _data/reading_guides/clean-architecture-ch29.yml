overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章最终原则是：Hardware、Processor 与 Operating System 都是 Detail；把它们限制在 Firmware
    边界外，才能让 Product Software 获得长久、可测试、可迁移的生命。
  thesis_source: 30. 本章总结
  concepts:
