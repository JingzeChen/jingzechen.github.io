      Runtime Binding 支持 Off-Target Test 与平台迁移。
    source_heading: 本章导读
  - term: 4.10 怎样避免
    meaning: 维护可执行 Specification。
    source_heading: 4.10 怎样避免
  - term: 10.5 Contract Test
    meaning: Timing Semantics，在可验证范围内。
    source_heading: 10.5 Contract Test
  - term: 13. HAL 示例：Persistence
    meaning: 好的 HAL 表达 Product Need，而不是 Device Primitive。
    source_heading: 13. HAL 示例：Persistence
  - term: 21.3 不应包含什么
    meaning: Register Definition；
    source_heading: 21.3 不应包含什么
  - term: 30. 本章总结
    meaning: 本章最终原则是：Hardware、Processor 与 Operating System 都是 Detail；把它们限制在 Firmware
      边界外，才能让 Product Software 获得长久、可测试、可迁移的生命。
    source_heading: 30. 本章总结
