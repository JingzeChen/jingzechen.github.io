  - 这个案例不是证明“排队一定优于涨价”，而是说明最优方案取决于用户等待成本、价格敏感度、空台风险、翻台率、员工激励和服务体验等变量的组合。情境变化后，原来的最优解也可能变化。
  - 企业创造具有交换价值的使用价值，用产品承载，再与用户交换企业所需的金钱、时间、数据、承诺或信任。
