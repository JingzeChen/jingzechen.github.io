overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章要回答的问题」建立了怎样的核心认识？
  question_source: 1. 本章要回答的问题
  thesis: 本章的核心视角是：把产品看作企业与用户之间的一场广义交易。 用户用金钱、时间、注意力、数据和风险等成本交换效用；企业用生产成本和交易成本交换收入、信任、数据、品牌与未来机会。产品经理的任务，是设计双方都愿意持续参与的价值交换。
  thesis_source: 1. 本章要回答的问题
  concepts:
  - term: 1. 本章要回答的问题
    meaning: 本章的核心视角是：把产品看作企业与用户之间的一场广义交易。 用户用金钱、时间、注意力、数据和风险等成本交换效用；企业用生产成本和交易成本交换收入、信任、数据、品牌与未来机会。产品经理的任务，是设计双方都愿意持续参与的价值交换。
    source_heading: 1. 本章要回答的问题
  - term: 6.4 相对价格如何改变用户行为
    meaning: 技术之所以能产生巨大影响，常常不是因为它孤立地增加了某个功能，而是因为它改变了时间、信息、算力、沟通或生产要素的相对价格，使过去不划算的行为变得划算。
    source_heading: 6.4 相对价格如何改变用户行为
  - term: 8.4 发展与生存是企业的两条腿
    meaning: 常见生存要点包括环境选择；品牌、规模效应、网络效应和准入门槛等替代成本；以及组织、激励、技术、成本、变现和资源配置效率。
    source_heading: 8.4 发展与生存是企业的两条腿
  - term: 9.2 使用价值与交换价值
    meaning: 营销之所以可能创造价值，是因为它能让潜在使用价值被更多合适用户认知，使产品找到交换对象；但如果产品没有真实效用，营销只能短期制造预期，实际体验最终会修正认知。
    source_heading: 9.2 使用价值与交换价值
  - term: 12.1 从“自然人”改为“需求份额”分析用户
    meaning: 未选择本产品时，用户使用了什么替代方案？
    source_heading: 12.1 从“自然人”改为“需求份额”分析用户
  - term: 16. 复习卡片
    meaning: Q：用户行为如何形成？ A：情境刺激调用偏好和认知，经过感知、解读、形成选择集合、模拟推演和价值判断，产生期望效用与行为；实际体验再反馈并修正偏好和认知。
    source_heading: 16. 复习卡片
