overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、阅读边界与全章路线」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与全章路线
  thesis: 掌握这些问题后，本章的核心就不再只是“画一个圆”，而是一个可迁移的系统设计原则：把动态成员变化从全局坐标变化改写为固定空间中的局部边界变化，再用多个细粒度逻辑分区平衡随机误差，并用明确的迁移协议把算法性质兑现为系统可靠性。
  thesis_source: 19. 核心结论与解决动态分区问题的一般方法
  concepts:
  - term: 0. 学习目标、阅读边界与全章路线
    meaning: 本文严格沿原书“重哈希问题 → 一致性哈希定义 → 哈希空间与环 → 服务器/key 映射 → 查找 → 增删节点 → 基础方法的两个问题
      → 虚拟节点 → 受影响 key → 总结”的顺序展开。
    source_heading: 0. 学习目标、阅读边界与全章路线
  - term: 5. 把服务器映射到环上
    meaning: 节点位置可以由哈希身份随机决定，也可以由控制面预先分配。随机简单，但少量节点时区间可能很不均；预分配能更可控地平衡，却需要中心元数据管理。虚拟节点是缓解随机不均的常见方案。
    source_heading: 5. 把服务器映射到环上
  - term: 10. 基础哈希环的两个问题
    meaning: 一致性哈希若只按 key 哈希，默认 key 的资源成本在统计上近似独立同分布；若少量对象特别大或特别热，仍需额外机制。
    source_heading: 10. 基础哈希环的两个问题
  - term: 14.1 成员视图必须一致
    meaning: 可在请求中携带 ring version；服务器发现客户端过旧时返回重定向或新成员信息。
    source_heading: 14.1 成员视图必须一致
  - term: 17.1 一致性哈希与数据一致性
    meaning: 一致性哈希：成员变化时 key→node 映射尽量稳定；
    source_heading: 17.1 一致性哈希与数据一致性
  - term: 19. 核心结论与解决动态分区问题的一般方法
    meaning: 掌握这些问题后，本章的核心就不再只是“画一个圆”，而是一个可迁移的系统设计原则：把动态成员变化从全局坐标变化改写为固定空间中的局部边界变化，再用多个细粒度逻辑分区平衡随机误差，并用明确的迁移协议把算法性质兑现为系统可靠性。
    source_heading: 19. 核心结论与解决动态分区问题的一般方法
  logic:
  - 0. 学习目标、阅读边界与全章路线
  - 5. 把服务器映射到环上
  - 7.3 用二分查找实现
  - 14.1 成员视图必须一致
  - 14.4 常见迁移策略
  - 18.3 动态变化层
  - 19. 核心结论与解决动态分区问题的一般方法
  sections:
  - title: 0. 学习目标、阅读边界与全章路线
    source_heading: 0. 学习目标、阅读边界与全章路线
    paragraphs:
    - 当服务器池不断增加、删除或故障时，如何仍然把请求或数据较均匀地分配到服务器，同时尽量少移动已有 key？
    - 原书 4 台服务器降为 3 台时，为什么 8 个 key 中有 6 个被重映射？
    - 本文严格沿原书“重哈希问题 → 一致性哈希定义 → 哈希空间与环 → 服务器/key 映射 → 查找 → 增删节点 → 基础方法的两个问题 → 虚拟节点
      → 受影响 key → 总结”的顺序展开。
    - 原章主要建立概念，没有给出完整代码。本文补充的概率推导、变异系数、二分查找实现、成员版本与迁移协议属于标准工程背景，不是原书逐式给出的结论。
  - title: 3. 一致性哈希的目标与迁移量
    source_heading: 3. 一致性哈希的目标与迁移量
    paragraphs:
    - 取模约重映射 99%：约 9.9 亿；
    - 理想一致性哈希约重映射 1%：约 1000 万。
    - 1000 万仍然不是零，但故障范围从全局降低到一个节点原有份额，系统才有机会渐进恢复。
    - "“一致性”在这里指节点集合变化前后映射尽量保持一致，不是数据库中的强一致性、线性一致性或副本一致性。"
  - title: 5. 把服务器映射到环上
    source_heading: 5. 把服务器映射到环上
    paragraphs:
    - 使用稳定身份不意味着故障节点永不移除，而是避免基础设施重建随机改变环位置。
    - 节点位置可以由哈希身份随机决定，也可以由控制面预先分配。随机简单，但少量节点时区间可能很不均；预分配能更可控地平衡，却需要中心元数据管理。虚拟节点是缓解随机不均的常见方案。
  - title: 7.3 用二分查找实现
    source_heading: 7.3 用二分查找实现
    paragraphs:
    - 未找到则返回数组第一个节点，表示绕环。
    - 树结构也可查找后继节点，但有序数组读多写少、缓存友好，且成员变化相对请求频率通常很低。
  - title: 10. 基础哈希环的两个问题
    source_heading: 10. 基础哈希环的两个问题
    paragraphs:
    - 若 server1 被移除，server2 可能同时接管 server1 的原区间，使其负责空间约为其他节点两倍。
    - 即使 server 区间大小还可以，有限 key 的哈希也有随机波动；若 server tokens 聚集，可能大多数 key 都落入某个大区间，而某些节点几乎没有数据。
    - 虚拟节点主要改善前两类的聚合分布，对第三类只在“许多独立热点 key”时有帮助，不能拆开一个单独超级热 key。
    - 一致性哈希若只按 key 哈希，默认 key 的资源成本在统计上近似独立同分布；若少量对象特别大或特别热，仍需额外机制。
  - title: 14.1 成员视图必须一致
    source_heading: 14.1 成员视图必须一致
    paragraphs:
    - 单调递增的 ring epoch/version；
    - 可在请求中携带 ring version；服务器发现客户端过旧时返回重定向或新成员信息。
  - title: 14.4 常见迁移策略
    source_heading: 14.4 常见迁移策略
    paragraphs:
    - 切换后先读新 owner，miss 时读旧 owner 并回填。适合缓存和允许短暂双路由的存储。
    - 迁移期间写新旧 owner，历史数据后台复制。要处理部分成功、幂等和顺序。
    - 旧 owner 收到已迁移 key 时转发到新 owner；减少客户端版本不一致影响，但增加一跳。
  - title: 17.1 一致性哈希与数据一致性
    source_heading: 17.1 一致性哈希与数据一致性
    paragraphs:
    - 一致性哈希：成员变化时 key→node 映射尽量稳定；
    - 数据一致性：多个副本或读写对数据值的可见性保证；
  - title: 18.3 动态变化层
    source_heading: 18.3 动态变化层
    paragraphs:
    - 新增节点只接管前驱到自身的区间；
    - 删除节点只把自身原区间交给后继；
  - title: 19. 核心结论与解决动态分区问题的一般方法
    source_heading: 19. 核心结论与解决动态分区问题的一般方法
    paragraphs:
    - 一致性哈希是方案之一，不是唯一答案。 Rendezvous hashing 和固定逻辑分片表也能提供稳定映射。
    - 持久数据采用 joining→复制→增量追赶→校验→切换→清理流程，并沿环选择不同物理故障域的副本。
    - 最后监控每节点 bytes、QPS、最大/平均负载和迁移速率；单个热 key 另用读副本或拆 key 处理。
    - 掌握这些问题后，本章的核心就不再只是“画一个圆”，而是一个可迁移的系统设计原则：把动态成员变化从全局坐标变化改写为固定空间中的局部边界变化，再用多个细粒度逻辑分区平衡随机误差，并用明确的迁移协议把算法性质兑现为系统可靠性。
  takeaways:
  - 普通取模改变全局除数；一致性哈希只改变新增/删除 token 的前驱区间。理想迁移比例从接近全部降到约一个节点份额。
  - key 顺时针找第一个 node；
  - 一致性哈希使用与节点数无关的固定坐标系。 节点只是在环上增加或删除边界。
  - 持久数据采用 joining→复制→增量追赶→校验→切换→清理流程，并沿环选择不同物理故障域的副本。
  - 掌握这些问题后，本章的核心就不再只是“画一个圆”，而是一个可迁移的系统设计原则：把动态成员变化从全局坐标变化改写为固定空间中的局部边界变化，再用多个细粒度逻辑分区平衡随机误差，并用明确的迁移协议把算法性质兑现为系统可靠性。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「17.1 一致性哈希与数据一致性」？
  answer: 一致性哈希：成员变化时 key→node 映射尽量稳定；
  source_heading: 17.1 一致性哈希与数据一致性
- level: 概念辨析
  question: 原文如何解释「17.5 一致性哈希与零迁移」？
  answer: 新增节点要获得负载，删除节点的 key 必须有新 owner，所以迁移不可避免。目标是最小化到约一个节点份额。
  source_heading: 17.5 一致性哈希与零迁移
- level: 概念辨析
  question: 原文如何解释「17.9 vnode 越多越好」？
  answer: 更多 vnode 通常降低方差，也增加环元数据、迁移区间、控制面和查找常数。应按目标不均衡调优。
  source_heading: 17.9 vnode 越多越好
- level: 概念辨析
  question: 原文如何解释「17.15 平衡 key 数量等于平衡容量」？
  answer: 大对象和小对象数量相同，存储负载不同；热门和冷门 key 数量相同，QPS 负载不同。需要按实际资源度量。
  source_heading: 17.15 平衡 key 数量等于平衡容量
- level: 概念辨析
  question: 原文如何解释「17.18 环上相邻等于物理故障域不同」？
  answer: 不一定。复制时应选择不同物理节点、机架和可用区，不能只取下几个 vnode 而不去重物理 owner。
  source_heading: 17.18 环上相邻等于物理故障域不同
