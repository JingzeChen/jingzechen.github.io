checks:
- level: 概念辨析
  question: 原文如何解释「17.1 钱包转账不只是两个 Counter Update」？
  answer: 跨 Shard 后两个 Update 不是同一原子操作，还需要协调、幂等、恢复和审计。
  source_heading: 17.1 钱包转账不只是两个 Counter Update
- level: 概念辨析
  question: 原文如何解释「17.8 原书 TC/C 示例的资金“消失”是中间状态」？
  answer: 最终 Confirm/Cancel 恢复；生产账本宜用 Reserved/Clearing 显式表示 In-transit Money。
  source_heading: 17.8 原书 TC/C 示例的资金“消失”是中间状态
- level: 概念辨析
  question: 原文如何解释「17.17 State 是 Event 的 View，不是唯一事实」？
  answer: RocksDB Balance 丢失可重建；Event Log 丢失则历史无法恢复。
  source_heading: 17.17 State 是 Event 的 View，不是唯一事实
- level: 概念辨析
  question: 原文如何解释「17.23 mmap 不等于 Durable」？
  answer: Page 在 Memory 不代表已稳定落盘；成功 ACK 条件要包含 Fsync/Quorum Policy。
  source_heading: 17.23 mmap 不等于 Durable
- level: 概念辨析
  question: 原文如何解释「17.29 Push Completion 不能成为唯一状态记录」？
  answer: Proxy/Client 可能断线，终态仍要可按 Transaction ID Query。
  source_heading: 17.29 Push Completion 不能成为唯一状态记录
