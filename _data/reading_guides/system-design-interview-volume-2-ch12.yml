overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章解决的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章解决的核心问题
  thesis: Raft 保证单分片 Event Order 和耐久。 Majority Commit 后所有确定性 Replica 最终导出同 State。
  thesis_source: 19. 核心结论
  concepts:
  - term: 0. 本章解决的核心问题
    meaning: 本章比普通转账设计多一个关键要求：Reproducibility（可重现性）。系统不只要给出当前余额，还要解释余额为什么变成这样，并能够从不可变历史重建任意时刻状态。
    source_heading: 0. 本章解决的核心问题
  - term: 5.1 Phase 1：Prepare
    meaning: 各 Participant 回 Yes/No。
    source_heading: 5.1 Phase 1：Prepare
  - term: 7.5 2PC、TC/C、Saga 的本质区别
    meaning: Saga：一串已 Commit Local Transaction，失败后执行 Compensation。
    source_heading: 7.5 2PC、TC/C、Saga 的本质区别
  - term: 11. CQRS
    meaning: Read Path：消费 Event，构建 Balance/History Query View。
    source_heading: 11. CQRS
  - term: 14.2 Raft 复制 Event Log
    meaning: Raft 角色：Leader、Candidate、Follower。Leader 接收 Command，生成/Append Event，复制到
      Follower；达到 Majority 后 Commit。
    source_heading: 14.2 Raft 复制 Event Log
  - term: 20. 解决高吞吐资金转移问题的一般思路
    meaning: 本章最值得迁移的方法是：把“当前余额”降级为可重建视图，把“有序不可变事件”提升为系统事实；单分片用共识保证事实顺序，跨分片用可恢复补偿协议协调，再以
      Transaction ID 和确定性状态机让所有重试、故障和重放都得到同一业务结果。
    source_heading: 20. 解决高吞吐资金转移问题的一般思路
  logic:
