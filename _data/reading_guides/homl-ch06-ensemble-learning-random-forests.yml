overview:
  kind: summary
  minutes: 8
  question: 原文围绕「阅读导引」建立了怎样的核心认识？
  question_source: 阅读导引
  thesis: 向很多随机的人提出复杂问题，再聚合答案，群体答案有时比单个专家更准确。模型也类似：不同模型关注数据的不同方面，错误可部分抵消。
  thesis_source: 1.1 智慧群体
  concepts:
  - term: 阅读导引
    meaning: 一组预测器称为集成（ensemble），组合它们的方法称为集成学习（ensemble learning）。
    source_heading: 阅读导引
  - term: 2.6 什么时候优先 Bagging
    meaning: 如果数据较干净、重复抽样浪费明显，可比较 Pasting；
    source_heading: 2.6 什么时候优先 Bagging
  - term: 8.1 MDI 的直觉
    meaning: Scikit-Learn 默认树重要性称为 MDI：Mean Decrease in Impurity。
    source_heading: 8.1 MDI 的直觉
  - term: 10. AdaBoost
    meaning: 较新 Scikit-Learn 在弱学习器达到随机错误边界时通常丢弃并停止，而不会保留负权重成员。
    source_heading: 10. AdaBoost
  - term: 12.6 其他优化实现
    meaning: Yggdrasil Decision Forests。
    source_heading: 12.6 其他优化实现
  - term: 工程能力
    meaning: 能构建 VotingClassifier 并比较 Hard/Soft
    source_heading: 工程能力
  logic:
  - 阅读导引
  - 2.6 什么时候优先 Bagging
  - 6.1 定义
  - 10. AdaBoost
  - 12.3 分桶的统计效果
  - 13.9 并行性与边界
  - 工程能力
  sections:
  - title: 阅读导引
    source_heading: 阅读导引
    paragraphs:
    - 决策树方差高，数据稍变结构就可能完全不同；
    - 线性模型偏差高，难以表达复杂边界；
    - 即使一个模型已经不错，仍可能存在难以消除的剩余误差。
    - 一组预测器称为集成（ensemble），组合它们的方法称为集成学习（ensemble learning）。
  - title: 1.1 智慧群体
    source_heading: 1.1 智慧群体
    paragraphs:
    - 向很多随机的人提出复杂问题，再聚合答案，群体答案有时比单个专家更准确。模型也类似：不同模型关注数据的不同方面，错误可部分抵消。
    - 集成中的成员若只比随机猜测略好，称为弱学习器；组合后达到高准确率的模型称为强学习器。
  - title: 2.6 什么时候优先 Bagging
    source_heading: 2.6 什么时候优先 Bagging
    paragraphs:
    - 对噪声数据或深树等易过拟合模型，通常更有利；
    - 比 Pasting 可能多一点偏差，但往往方差更低；
    - 如果数据较干净、重复抽样浪费明显，可比较 Pasting；
  - title: 6.1 定义
    source_heading: 6.1 定义
    paragraphs:
    - 在每个节点只随机考虑一部分特征；
    - 和普通 Bagging 树相比，关键新增随机性是每个节点的随机特征子集。
  - title: 8.1 MDI 的直觉
    source_heading: 8.1 MDI 的直觉
    paragraphs:
    - 若一个特征经常出现在靠近根部的节点，并且每次都大幅降低不纯度，它通常更重要。
    - Scikit-Learn 默认树重要性称为 MDI：Mean Decrease in Impurity。
  - title: 10. AdaBoost
    source_heading: 10. AdaBoost
    paragraphs:
    - 第一个弱分类器错了一些训练样本。怎样让第二个分类器把注意力放到这些困难样本上？
    - 小：每轮改动小、需要更多成员、通常更稳健。
    - 较新 Scikit-Learn 在弱学习器达到随机错误边界时通常丢弃并停止，而不会保留负权重成员。
    - 噪声标签会被持续提高权重，AdaBoost 可能反复追逐无法正确分类的样本。
  - title: 12.3 分桶的统计效果
    source_heading: 12.3 分桶的统计效果
    paragraphs:
    - 也可能抹去细小但有用的差异，导致欠拟合；
    - 桶数需要在速度、内存与精度之间权衡。
  - title: 12.6 其他优化实现
    source_heading: 12.6 其他优化实现
    paragraphs:
    - Yggdrasil Decision Forests。
    - 它们提供 GPU 加速、分布式训练、类别特征支持和更多工程优化，是表格数据的重要工具。
  - title: 13.9 并行性与边界
    source_heading: 13.9 并行性与边界
    paragraphs:
    - OOF 训练会让每个基模型重复训练 K 次；
    - 模型数量和资源消耗远高于 Voting。
  - title: 工程能力
    source_heading: 工程能力
    paragraphs:
    - 能构建 VotingClassifier 并比较 Hard/Soft
    - 能配置 BaggingClassifier 和 OOB
    - 能用 Early Stopping 自动选择 Boosting 树数
    - 能在 MNIST 上比较单模型、Voting 与 Stacking
  takeaways:
  - 一组预测器称为集成（ensemble），组合它们的方法称为集成学习（ensemble learning）。
  - 如果数据较干净、重复抽样浪费明显，可比较 Pasting；
  - 噪声标签会被持续提高权重，AdaBoost 可能反复追逐无法正确分类的样本。
  - 它们提供 GPU 加速、分布式训练、类别特征支持和更多工程优化，是表格数据的重要工具。
  - 能在 MNIST 上比较单模型、Voting 与 Stacking
