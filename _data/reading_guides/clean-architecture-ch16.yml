overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: SRP、CCP、DIP、ISP 与 ADP 等低成本原则可以帮助保留选项。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 原书图示：Chapter 16 章首页第 15 章说明，好的架构要支持系统的完整生命周期，并尽可能长时间保留细节选项。
    source_heading: 本章导读
  - term: 3.5 开发维度的检查问题
    meaning: 一个团队的提交是否频繁破坏另一个团队？
    source_heading: 3.5 开发维度的检查问题
  - term: 8. Decoupling Mode：逻辑分离要用哪种物理形式
    meaning: 系统早期可能只需要源码边界；随后可能需要独立部署；再后来某些组件需要独立服务。
    source_heading: 8. Decoupling Mode：逻辑分离要用哪种物理形式
  - term: 12.8 作者偏好的演化策略
    meaning: 运行压力继续增加时，再谨慎选择部分组件服务化。
    source_heading: 12.8 作者偏好的演化策略
  - term: 16.3 垂直用例检查
    meaning: 物理数据库共享是否被误当成源码耦合理由？
    source_heading: 16.3 垂直用例检查
  - term: 本章总结
    meaning: 层和用例解耦可以同时支持 Feature Team、Layer Team 和 Component Team。
    source_heading: 本章总结
