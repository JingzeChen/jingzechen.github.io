  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 16 章首页第 15 章说明，好的架构要支持系统的完整生命周期，并尽可能长时间保留细节选项。
    - 按层解耦：分离 UI、应用规则、领域规则和数据库等不同变化原因；
    - 选择解耦模式：根据真实需要，在源码级、部署级与服务级之间演化。
    - 作者希望架构保护大多数源码，使通信和部署模式可以变化，而高层业务规则不必随之重写。
  - title: 1.7 用例维度的检查问题
    source_heading: 1.7 用例维度的检查问题
    paragraphs:
    - 顶层目录或组件能否显示系统主要能力？
    - 开发者是否需要从框架结构中猜测行为？
    - 用例测试能否不依赖完整 UI 和数据库运行？
  - title: 3.5 开发维度的检查问题
    source_heading: 3.5 开发维度的检查问题
    paragraphs:
    - 一个团队的提交是否频繁破坏另一个团队？
    - 本地测试是否依赖其他团队开发环境？
  - title: 6.7 水平分层的价值
    source_heading: 6.7 水平分层的价值
    paragraphs:
    - UI 团队更换表现方式而少改业务；
    - 应用流程调整而不破坏领域不变量；
  - title: 8. Decoupling Mode：逻辑分离要用哪种物理形式
    source_heading: 8. Decoupling Mode：逻辑分离要用哪种物理形式
    paragraphs:
    - 许多架构师把独立运行组件称为服务或微服务，但“微”并没有可靠的代码行标准。
    - 原书明确表示，不会宣称 SOA 是最佳架构，也不会宣称微服务是未来唯一方向。
    - 系统早期可能只需要源码边界；随后可能需要独立部署；再后来某些组件需要独立服务。
  - title: 12.8 作者偏好的演化策略
    source_heading: 12.8 作者偏好的演化策略
    paragraphs:
    - 把边界推到“需要时可以形成服务”的程度；
    - 只要没有现实压力，就让组件留在同一地址空间；
    - 开发或部署问题出现后，选择部分组件升级到部署级；
    - 运行压力继续增加时，再谨慎选择部分组件服务化。
  - title: 14.9 用共同变化判断重复
    source_heading: 14.9 用共同变化判断重复
    paragraphs:
    - 分别响应不同需求，可能是偶然重复；
    - 一份变化而另一份不变，说明二者不是同一知识。
  - title: 16.3 垂直用例检查
    source_heading: 16.3 垂直用例检查
    paragraphs:
    - 一个用例变化会修改哪些其他用例？
    - 每个用例是否只依赖所需数据能力？
    - 新增用例是否主要通过增加代码完成？
    - 物理数据库共享是否被误当成源码耦合理由？
  - title: 16.10 场景判断三：两个相似页面共享数据库记录
    source_heading: 16.10 场景判断三：两个相似页面共享数据库记录
    paragraphs:
    - 添加订单与删除订单页面暂时字段相似，因此共同使用数据库 Record 作为 View Model。
    - 判断： 同时破坏水平与垂直边界。这种相似大概率是偶然重复，应使用独立模型和映射。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - Master Components 或组合根负责创建、连接、启动和监督具体组件。
    - 层和用例解耦可以同时支持 Feature Team、Layer Team 和 Component Team。
    - 数据库 Record 与 View Model 的相似通常是偶然重复，独立模型能保护层边界。
    - 本章最终思想是：同时按层和用例建立边界，再让源码、部署与运行模式根据真实需要可逆演化。
  takeaways:
  - 第 16 章讨论怎样通过解耦获得用例、团队、部署与运行独立性。
  - 多团队系统需要良好隔离、可独立开发的组件和稳定接口。
  - 水平与垂直解耦共同形成一张层次与用例的架构矩阵。
  - 偶然重复只是当前外形相似，未来会因不同原因独立演化。
  - 本章最终思想是：同时按层和用例建立边界，再让源码、部署与运行模式根据真实需要可逆演化。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.1 “架构支持用例，就是架构决定所有行为”」？
  answer: 错误。架构最重要的作用是让用例清楚可见、容易修改和测试，不会替代业务规则本身。
  source_heading: 15.1 “架构支持用例，就是架构决定所有行为”
- level: 概念辨析
  question: 原文如何解释「15.2 “有 Controller、Service、Repository 就完成分层”」？
  answer: 不一定。若业务规则依赖框架、数据库模型直接进入 UI，目录分层并没有形成真实边界。
  source_heading: 15.2 “有 Controller、Service、Repository 就完成分层”
- level: 概念辨析
  question: 原文如何解释「15.6 “Conway 定律说明组件永远应该按团队划分”」？
  answer: 错误。它描述组织与系统结构的相互影响，不证明当前组织图就是最佳长期架构。
  source_heading: 15.6 “Conway 定律说明组件永远应该按团队划分”
- level: 概念辨析
  question: 原文如何解释「15.9 “微服务越小，解耦越细”」？
  answer: 不一定。网络边界成本会迫使服务聚合许多能力，源码模块通常能提供更细粒度隔离。
  source_heading: 15.9 “微服务越小，解耦越细”
