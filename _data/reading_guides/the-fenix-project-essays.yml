  sections:
  - title: 1. 本章为什么值得整体阅读
    source_heading: 1. 本章为什么值得整体阅读
    paragraphs:
    - Graal VM：语言运行时如何在 JIT、AOT、多语言和原生镜像之间重新取舍；
    - OpenJDK with CLion：怎样把复杂源码环境封装成可重复工具；
    - 从软件历史看架构未来：算力、人的认知与软件抽象如何共同推动架构演进。
    - 这些文章的共同主线是：当机器能力、运行环境和软件规模改变时，旧抽象的优势可能变成负担；新的抽象若要成功，必须把复杂性转移到更专业、可复用的层次，同时保留对底层代价的理解。
  - title: 2. 2020年
    source_heading: 2. 2020年
    paragraphs:
    - 原文写作时，HotSpot 中的 Graal JIT 仍以实验性 C2 替代者出现。今天 GraalVM、Oracle GraalVM 与 OpenJDK
      中相关组件的发行和许可边界已经多次变化，不能仅凭“JDK 10 加入 Graal”推导当前某个 JDK 默认使用它。生产选型应核对目标发行版的 JVMCI、Graal
      Compiler 和支持政策。
    - HotSpot 则擅长长时间运行后通过 JIT 达到高峰值性能。AOT（Ahead-of-Time Compilation）把更多工作移到构建期，GraalVM
      Native Image 使用 Substrate VM 作为小型运行时，并通过 Closed-World Assumption 分析所有可达代码。
    - 编译器不可能永久维护整个 JVM 生态的脆弱补丁。框架和类库需要发布 Reachability Metadata、构建期代码生成和 Native 测试。原文中的
      Spring Graal Native 实验项目后来并入 Spring Framework 6 / Spring Boot 3 的 AOT Engine，现代
      Spring Boot 已正式支持 GraalVM Native Image；历史依赖和 POM 不应继续照搬。
    - 原文认为 Native Image 无法做 Java 层远程调试，属于当时状态。现代 Native Image 已提供更丰富的 Debug、JFR、Heap
      Dump 和诊断支持，但与 HotSpot 成熟的动态诊断、JVMTI Agent 和运行期 Profile 生态仍不完全等价。选型要把生产可诊断性纳入成本。
  - title: 3. 2021年
    source_heading: 3. 2021年
    paragraphs:
    - 原镜像固定 JDK 15、CLion 2020.3、Debian 10 和 Projector，今天已经过时。Projector 路线已被 JetBrains
      Remote Development / Gateway 等方案取代。旧镜像可能有已知漏洞、过期证书和许可证问题，不宜直接暴露端口或作为生产工作站。
    - 原工程代码使用 Apache License 2.0，但容器中还包含 JetBrains 商业 IDE、OpenJDK、Debian 和其他依赖，各自许可证仍独立生效。开源
      Dockerfile 不会把商业 IDE变成开源软件；分发镜像前要核对再分发权、用户授权和第三方 Notice。
    - 作者把历史讲成“两次软件危机 -> 结构化 -> 面向对象/软件工程”的清晰主线，适合作为教学叙事，但不是历史学界统一的严格分期。Software Crisis
      一词通常追溯到 1968、1969 年 NATO Software Engineering Conferences，而不是原文所说的 1970；面向对象也不能被视为单独“终结第二次危机”。
    - 原文写作时 Dapr 刚进入 CNCF、主要以 K/V 演示。如今 Dapr 已扩展到 Service Invocation、Pub/Sub、State、Bindings、Secrets、Configuration、Distributed
      Lock、Workflow、Actors 等 Building Blocks，并进入更成熟阶段。历史局限不影响作者抓住“多运行时抽象”方向。
  - title: 4. 六篇随笔的共同知识结构
    source_heading: 4. 六篇随笔的共同知识结构
    paragraphs:
    - 编译期封闭：Native Image 把动态世界压缩为可达代码与元数据；
    - 环境封装：Container / Dev Environment 把 Toolchain 和依赖做成制品；
    - 运行时外置：Service Mesh / Dapr 把通用非功能能力交给 Sidecar 和平台。
    - 三者都降低某一角色的操作复杂度，同时把成本转移给构建系统、平台团队或底层专家。
  - title: 6. 可复用的分析与学习方法
    source_heading: 6. 可复用的分析与学习方法
    paragraphs:
    - 能否表达底层关键一致性和错误语义？
    - 是否只是把供应商锁定换成平台锁定？
    - 例如 Java 17 没有一次集齐 Loom、Valhalla、Leyden，但“启动、数据布局、并发和容器适配需要分别改进”仍然成立。
  - title: 7. 本章知识结构总结
    source_heading: 7. 本章知识结构总结
    paragraphs:
    - GraalVM 的价值在于统一语言实现与编译优化，并提供 JIT、AOT 和嵌入式运行的多条路径；
    - Native Image 通过 Closed World 换取启动和内存收益，框架生态必须共同 AOT 化；
    - Java 面对云原生的挑战分布在启动、布局、并发和容器兼容，不能靠单一项目解决；
    - 2020 年的 Java 版本预测有得有失，但“检查旧前提是否仍成立”的方法长期有效；
  - title: 8. 主动回忆题
    source_heading: 8. 主动回忆题
    paragraphs:
    - AppCDS、Epsilon、jaotc 和 Native Image 分别解决什么问题？
    - Points-To Analysis 如何决定 Native Image 中包含哪些代码？
    - Logstash/Filebeat 与 Linkerd/Envoy 案例能证明什么，不能证明什么？
    - 学习价值模型中的 Skill Benefit 与 Knowledge Benefit 有何区别？
  takeaways:
  - 编译期封闭：Native Image 把动态世界压缩为可达代码与元数据；
  - GraalVM 的价值在于统一语言实现与编译优化，并提供 JIT、AOT 和嵌入式运行的多条路径；
  - 2020 年的 Java 版本预测有得有失，但“检查旧前提是否仍成立”的方法长期有效；
  - 写作、讲解和实验把思考变成可检验对象，是构建知识体系的有效方法；
  - 工具降低偶然复杂性后，领域建模、验证、边界和演进判断会更重要。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5.1 Graal Compiler、GraalVM 与 Native Image 不是同一个概念」？
  answer: Graal Compiler 是编译器；GraalVM 是多语言运行平台；Native Image 是 Closed-World AOT 工具链与
    Substrate VM。
  source_heading: 5.1 Graal Compiler、GraalVM 与 Native Image 不是同一个概念
- level: 概念辨析
  question: 原文如何解释「5.5 proxyBeanMethods=false 不等于禁用所有 Spring Proxy」？
  answer: 它只改变配置类 Bean 方法拦截语义，AOP 和其他 Proxy 仍可能存在。
  source_heading: 5.5 proxyBeanMethods=false 不等于禁用所有 Spring Proxy
- level: 概念辨析
  question: 原文如何解释「5.11 容器化 IDE 不等于完全可复现」？
  answer: 外部源码、许可证、CPU 架构、Kernel、Volume 和网络仍会影响结果。必须锁版本并记录 Toolchain。
  source_heading: 5.11 容器化 IDE 不等于完全可复现
- level: 概念辨析
  question: 原文如何解释「5.15 统一 CLI 不等于统一底层语义」？
  answer: Docker Container、Kubernetes Pod 和 Istio Route 不是同一种资源，统一交互不能掩盖生命周期和权限差异。
  source_heading: 5.15 统一 CLI 不等于统一底层语义
- level: 概念辨析
  question: 原文如何解释「5.21 Dapr 不等于 Service Mesh」？
  answer: Service Mesh 主要治理服务通信；Dapr 提供应用 Building Blocks。二者可以组合，也各自增加 Sidecar 与控制面成本。
  source_heading: 5.21 Dapr 不等于 Service Mesh
