  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 恢复线：atomic state snapshot → restart entrypoint → rendezvous → load → data/RNG
    continuation。
  thesis_source: 17. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: AllReduce 的 sum/average 与 global batch loss 有何数学关系？不等大 local batch 时为什么不能直接平均
      rank gradients？
    source_heading: 0. 本章要回答的核心问题
  - term: 4. Setting up Multi-Node DDP
    meaning: 原章用“node 内 reduce → node 间 reduce → node 内 broadcast”解释层次化直觉。NCCL 实际可能构造多
      rings、trees、CollNet/NVLS 或其他 channels；是否分层、谁做 representative 取决于版本、topology、message
      size。
    source_heading: 4. Setting up Multi-Node DDP
  - term: 8. Checkpointing and resuming distributed jobs
    meaning: 训练中各 rank dropout/augmentation RNG 通常已分叉。原章只让 rank 0 保存自己的 Python/NumPy/PyTorch/CUDA
      RNG，再让所有 ranks 恢复同一状态，会改变随机流，不能 exact resume。
    source_heading: 8. Checkpointing and resuming distributed jobs
  - term: 11. Elastic data parallelism
    meaning: 可使用 elastic error-recording decorator 让 launcher 汇总 worker traceback。具体
      import/API 按 PyTorch 版本；它改善错误报告，不替代 per-rank logs 和 earliest-failure analysis。
    source_heading: 11. Elastic data parallelism
  - term: 15. 随章 PDF 权益说明
    meaning: 原章最后提供 Packt 随书权益二维码，也可访问 packtpub.com/unlock，按书名搜索并确认 edition。发票要求依购买渠道而定。
    source_heading: 15. 随章 PDF 权益说明
  - term: 20. 复习与自测
    meaning: 每 20 分钟保存一次，故障在 checkpoint interval 内均匀发生，忽略保存时间。平均重算约 10 分钟，最坏接近 20
      分钟。缩短 interval 会减少 lost work，却增加 I/O 停顿。
    source_heading: 20. 复习与自测
