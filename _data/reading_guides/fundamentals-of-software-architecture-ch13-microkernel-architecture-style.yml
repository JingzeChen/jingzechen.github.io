checks:
- level: 概念辨析
  question: 原文如何解释「11.1 “支持 Plug-ins 就是 Microkernel”」？
  answer: 错误之处：browser 有插件但 core standalone functionality 很强。
  source_heading: 11.1 “支持 Plug-ins 就是 Microkernel”
- level: 概念辨析
  question: 原文如何解释「11.7 “Reflection 示例可直接用于生产”」？
  answer: 错误之处：缺少异常、安全、classloader、lifecycle 和资源治理。
  source_heading: 11.7 “Reflection 示例可直接用于生产”
- level: 概念辨析
  question: 原文如何解释「11.13 “Core 支持更多功能一定更好”」？
  answer: 错误之处：context-specific functionality 会提高 volatility 和 contract churn。
  source_heading: 11.13 “Core 支持更多功能一定更好”
- level: 概念辨析
  question: 原文如何解释「11.18 “Core Change 永远是坏事”」？
  answer: 正确理解：警惕本应插件化的 context change 反复修改 core。
  source_heading: 11.18 “Core Change 永远是坏事”
- level: 概念辨析
  question: 原文如何解释「11.23 “Rules Engine 天然模块化”」？
  answer: 错误之处：无 jurisdiction boundary 的规则会相互影响并长成泥球。
  source_heading: 11.23 “Rules Engine 天然模块化”
