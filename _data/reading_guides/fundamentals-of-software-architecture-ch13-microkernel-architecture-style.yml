overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: Remote plug-ins 可异步提高用户 responsiveness，但必须管理 job state、idempotency、callback
    和 eventual consistency。
  thesis_source: 14. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：Microkernel 的价值来自把“稳定流程”和“变化规则”放在不同演进边界；如果 core 经常改变、插件彼此依赖或 contract
      不稳定，插件数量越多，系统反而越难演进。
    source_heading: 0. 本章要回答的核心问题
  - term: 3. Style Specifics：风格细节
    meaning: 原章指出该 topology 仍只有一个 architecture quantum，因为每个请求先经过 monolithic core 才到
      plugin。更严谨地说，远程 plugins 已有独立部署/failure units，但 core 仍是所有 workflow 的共同入口和共享 operational
      bottleneck；按本书评分口径，整体特征范围仍由 singular core 主导。
    source_heading: 3. Style Specifics：风格细节
  - term: 7.4 Registry Governance
    meaning: signed/approved plugins only。
    source_heading: 7.4 Registry Governance
  - term: 10. Examples and Use Cases：示例与用例
    meaning: 美国税务机构 Internal Revenue Service（IRS）的 1040 是两页 summary form，每行是一个数字，例如
      gross income。得到这些数字需要其他 forms/worksheets。
    source_heading: 10. Examples and Use Cases：示例与用例
  - term: 11.17 “Core on-prem + Plugins cloud 是最佳模块化”
    meaning: 错误之处：高频、大 payload 跨 WAN 会严重影响 responsiveness。
    source_heading: 11.17 “Core on-prem + Plugins cloud 是最佳模块化”
  - term: 15. 主动回忆与应用题
    meaning: 不看正文，复述设计十步：core、variation、contract、packaging、registry、data、dependencies、volatility、operations、microkern-ality。
    source_heading: 15. 主动回忆与应用题
  logic:
  - 0. 本章要回答的核心问题
  - 3. Style Specifics：风格细节
  - 6. Common Risks：常见风险
  - 10. Examples and Use Cases：示例与用例
  - 11.5 “Registry 消除了 Branching”
  - 12. 从本章提炼的 Microkernel 设计法
  - 15. 主动回忆与应用题
  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Core system 可采用 layered、modular monolith 或 domain services，为什么仍属于 microkernel？
    - Standard contract 应包含哪些 behavior/input/output，第三方 custom contract 为什么需要 adapter？
    - Core team、plug-in teams、enabling、complicated-subsystem 和 platform teams 怎样分工？
    - 一句话概括：Microkernel 的价值来自把“稳定流程”和“变化规则”放在不同演进边界；如果 core 经常改变、插件彼此依赖或 contract
      不稳定，插件数量越多，系统反而越难演进。
  - title: 1.3 适合的变化形状
    source_heading: 1.3 适合的变化形状
    paragraphs:
    - core business flow 本身持续剧烈变化；
    - 变化无法沿单一 extension point 分离；
    - 每个请求都需要动态跨多个插件协商；
    - 高 scale/fault isolation 是首要目标且仍使用单体 core。
  - title: 3. Style Specifics：风格细节
    source_heading: 3. Style Specifics：风格细节
    paragraphs:
    - 共同 payment lifecycle 留在 core；provider-specific authorization/capture rules 留在
      plugins。
    - 原章指出该 topology 仍只有一个 architecture quantum，因为每个请求先经过 monolithic core 才到 plugin。更严谨地说，远程
      plugins 已有独立部署/failure units，但 core 仍是所有 workflow 的共同入口和共享 operational bottleneck；按本书评分口径，整体特征范围仍由
      singular core 主导。
    - The Spectrum of “Microkern-ality” 不是二元分类：不是所有支持 plugins 的系统都是 microkernel；所有
      microkernels 都支持 plugins。
    - 本地 object contract 类型安全且快，但 binary/classloader coupling 高；remote schema 更显式，却需
      serialization、versioning 和 network governance。
  - title: 6. Common Risks：常见风险
    source_heading: 6. Common Risks：常见风险
    paragraphs:
    - core 承担太多 standalone product functionality；
    - 阈值应按项目基线和业务变化解释。Core 变化并非永远错误，关键是是否由本可局部化的 customization 驱动。
    - Eclipse 等复杂系统允许 plugin dependencies，但需要成熟 dependency resolver、version ranges
      和 lifecycle。
    - 若两个 plugins 总是一起变化和安装，可能属于同一 plugin/domain boundary。
  - title: 7.4 Registry Governance
    source_heading: 7.4 Registry Governance
    paragraphs:
    - health and ownership metadata；
    - deregistration cleans resources；
    - stale registry entries detected；
    - signed/approved plugins only。
  - title: 10. Examples and Use Cases：示例与用例
    source_heading: 10. Examples and Use Cases：示例与用例
    paragraphs:
    - 浏览器无插件仍完整可用，因此位于 microkern-ality 光谱右侧；“支持插件”不能单独证明 pure microkernel。
    - 美国税务机构 Internal Revenue Service（IRS）的 1040 是两页 summary form，每行是一个数字，例如 gross
      income。得到这些数字需要其他 forms/worksheets。
    - 若税法改变 1040 核心结构，则 core 仍需变化；microkernel 不能消除真正 common domain change。
    - 因此 core+plug-ins 这一 structure 与常见 problem shape 同构，microkernel “到处可见”。
  - title: 11.5 “Registry 消除了 Branching”
    source_heading: 11.5 “Registry 消除了 Branching”
    paragraphs:
    - 错误之处：选择逻辑移到 key/descriptor/contract，插件内部仍有规则。
    - 正确理解：它稳定 dispatcher，并局部化 complexity。
  - title: 11.17 “Core on-prem + Plugins cloud 是最佳模块化”
    source_heading: 11.17 “Core on-prem + Plugins cloud 是最佳模块化”
    paragraphs:
    - 错误之处：高频、大 payload 跨 WAN 会严重影响 responsiveness。
    - 正确理解：用真实 latency、payload 和 failure 测量。
  - title: 12. 从本章提炼的 Microkernel 设计法
    source_heading: 12. 从本章提炼的 Microkernel 设计法
    paragraphs:
    - 使用 typed descriptor，保证 unique ID、transport、location、version 和 health 可验证。
    - 默认 plugin 只依赖 core API，不依赖其他 plugins；建立 conflict/cycle/security checks。
    - 用 VCS churn、co-change、contract changes 和 forced upgrades 判断变化是否放错位置。
    - 测量 local/remote latency、payload、scale、fault scope、startup 和 on-prem/cloud constraints。
  - title: 15. 主动回忆与应用题
    source_heading: 15. 主动回忆与应用题
    paragraphs:
    - 设计一个 registry descriptor schema，包括 version、transport、health、permissions 和 owner。
    - 构造两个 plugins 依赖同一 library 不同版本的冲突，比较 shading、classloader 和 process isolation。
    - 为 first-party、third-party plugins 分别设计 signing、certification 和 deprecation policy。
    - 不看正文，复述设计十步：core、variation、contract、packaging、registry、data、dependencies、volatility、operations、microkern-ality。
  takeaways:
  - 变化层：Stable common flow 留在 core，volatile customization 留在 plugins；
  - 复杂度不会消失，而会转移到 registry、contracts、loading、versioning 和 dependency management。
  - Microkern-ality 由 core standalone functionality 决定；支持 plugins 不等于 pure microkernel。
  - Plugin dependencies 会产生 transitive version/classloader conflicts，应尽量 dependency-free。
  - Microkernel 的成功标准不是插件数量，而是大多数变化是否无需修改 core 和其他 plugins。
