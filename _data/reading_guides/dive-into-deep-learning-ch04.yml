overview:
  kind: summary
  minutes: 9
  question: 原文围绕「1. 从数值预测转向类别预测」建立了怎样的核心认识？
  question_source: 1. 从数值预测转向类别预测
  thesis: 保护测试集：训练参数用训练集，模型选择用验证集，最终测试尽量只做一次。
  thesis_source: 13. 核心结论与一般解题方法
  concepts:
  - term: 1. 从数值预测转向类别预测
    meaning: 损失函数：平方误差不再是最自然的概率目标。
    source_heading: 1. 从数值预测转向类别预测
  - term: 3. 图像分类数据集：Fashion-MNIST
    meaning: ImageNet 更接近现代视觉挑战，却太大，不适合交互式教学。Fashion-MNIST 在规模和格式上与 MNIST 相同，但包含 2017
      年发布的十类服饰，难度更高，适合在轻量实验中比较模型。
    source_heading: 3. 图像分类数据集：Fashion-MNIST
  - term: 5. 从零实现 Softmax 回归
    meaning: 只看总准确率不知道模型为何犯错。错误样本可揭示 shirt/coat/pullover 等视觉相似类别、裁剪异常和标签噪声。不过挑选少数“有趣错误”会产生选择偏差，仍要结合完整混淆矩阵和分组指标。
    source_heading: 5. 从零实现 Softmax 回归
  - term: 6. Softmax 回归的简洁实现
    meaning: 便利既是优点也是风险：用户可能不知道损失需要 logits、类别轴在哪里、标签类型是什么。原书因此要求同时理解从零版本和简洁版本：标准组件用高级
      API，新研究组件仍需能从数学定义正确实现。
    source_heading: 6. Softmax 回归的简洁实现
  - term: 8. 环境与分布偏移
    meaning: 患病组来自年长男性患者，健康对照却来自大学生献血者。分类器可轻易利用年龄、激素、饮食和活动差异达到高准确率，却未必识别疾病。采样过程制造了严重协变量偏移，且两组支持区域可能几乎不重叠，事后重加权也难以补救。
    source_heading: 8. 环境与分布偏移
  - term: 13. 核心结论与一般解题方法
    meaning: 本章完成了从分类数学到现实部署的完整闭环：线性层产生类别 logits，softmax 与交叉熵把离散预测转成可微的概率最大似然问题，稳定实现和数据加载器使其可训练；新测试集上的准确率只能在有限精度下证明固定模型的表现，反复复用会泄漏信息，而真实环境中的分布偏移和反馈循环进一步要求我们超越静态准确率，审查数据机制、决策代价与社会影响。
    source_heading: 13. 核心结论与一般解题方法
  logic:
  - 1. 从数值预测转向类别预测
  - 3. 图像分类数据集：Fashion-MNIST
  - 4. 分类模型基类
  - 6. Softmax 回归的简洁实现
  - 7. 分类中的泛化
  - 9. 可运行的综合实验
  - 13. 核心结论与一般解题方法
  sections:
  - title: 1. 从数值预测转向类别预测
    source_heading: 1. 从数值预测转向类别预测
    paragraphs:
    - 输出参数化：模型需要同时为所有类别给出分数或概率；
    - 损失函数：平方误差不再是最自然的概率目标。
    - 这条主线把“训练一个分类器”和“证明它能在真实环境中可靠使用”明确分开。前者是优化问题，后者还涉及统计估计、环境变化、决策成本和伦理约束。
  - title: 2. Softmax 回归
    source_heading: 2. Softmax 回归
    paragraphs:
    - 编号只是存储索引，不表示“狗比猫大 1”。若类别本身有自然次序，如婴儿、儿童、青年、成人、老年，可考虑序数回归；普通分类没有这种顺序。
    - 所以概率只依赖类别间的 logit 差。模型参数不是唯一的，梯度各分量之和也为零。这种冗余不妨碍预测，却意味着目标沿“所有 logits 同时平移”的方向是平坦的。
    - 所以交叉熵关于 logits 是凸的；softmax 线性模型的负对数似然关于参数也是凸的，但因参数冗余未必严格凸。深层网络加入非线性后，整体目标不再因此保持凸性。
    - 所以类别间边界是超平面。Softmax 解决了概率输出和损失问题，却没有让模型获得非线性表示能力。复杂图像中，展平像素后的线性边界只能作为基线，后续多层感知机和卷积网络将学习更灵活特征。
  - title: 3. 图像分类数据集：Fashion-MNIST
    source_heading: 3. 图像分类数据集：Fashion-MNIST
    paragraphs:
    - ImageNet 更接近现代视觉挑战，却太大，不适合交互式教学。Fashion-MNIST 在规模和格式上与 MNIST 相同，但包含 2017 年发布的十类服饰，难度更高，适合在轻量实验中比较模型。
    - 现代彩色图像通常有 RGB 三通道；高光谱图像可有上百通道。伪彩色可视化不表示原数据真的有多个颜色通道。
    - 可视化不是装饰，而是实验设计的安全检查。数值训练可以在错误标签或颠倒图像上正常下降，损失曲线不会自动告诉我们任务语义错了。
    - 原书加载 Fashion-MNIST 官方测试集，却在本章训练过程中反复查看其表现，实质上把它当作验证集。
  - title: 4. 分类模型基类
    source_heading: 4. 分类模型基类
    paragraphs:
    - 默认用小批量 SGD 配置参数更新。
    - 准确率也有局限。类别极不平衡时，永远预测多数类也可能很高；医疗和风控中不同错误成本不同，应报告混淆矩阵、精确率、召回率、校准度或成本敏感指标。
    - 原书的绘图工具先求每批平均，再把各批平均等权平均。若最后一批较小，这不等于按样本平均。
    - 随机 IID 分批时快速估计在期望上可无偏，但方差和具体数值仍不同；严谨评估应累计损失总和与样本数。
  - title: 5. 从零实现 Softmax 回归
    source_heading: 5. 从零实现 Softmax 回归
    paragraphs:
    - 展平舍弃了二维邻接结构：模型把相邻像素和远隔像素同等看待。这使 softmax 回归简单，但限制了视觉性能。
    - 对验证批计算 logits 或概率；
    - 只显示错误图像，并同时标注真实类与预测类。
    - 只看总准确率不知道模型为何犯错。错误样本可揭示 shirt/coat/pullover 等视觉相似类别、裁剪异常和标签噪声。不过挑选少数“有趣错误”会产生选择偏差，仍要结合完整混淆矩阵和分组指标。
  - title: 6. Softmax 回归的简洁实现
    source_heading: 6. Softmax 回归的简洁实现
    paragraphs:
    - 最大值平移与 LogSumExp；
    - 便利既是优点也是风险：用户可能不知道损失需要 logits、类别轴在哪里、标签类型是什么。原书因此要求同时理解从零版本和简洁版本：标准组件用高级 API，新研究组件仍需能从数学定义正确实现。
    - 增加 epoch 不保证验证准确率一直上升。训练损失继续下降时，模型可能逐渐过拟合；可用验证曲线、早停、正则化和更多数据缓解。
    - 学习率太大可能让交叉熵振荡或发散，太小则有限时间内几乎不学习。比较学习率时应同时观察训练损失、验证损失和准确率，并固定随机性以减少实验噪声。
  - title: 7. 分类中的泛化
    source_heading: 7. 分类中的泛化
    paragraphs:
    - 这解释了许多基准测试集的数量级，也提醒我们：在同一万级测试集上宣称小于一个百分点的改进，必须报告不确定性和配对比较，而不能只看点估计。
    - 更严重的是，后续模型往往在看到早期测试结果后设计。测试集信息通过研究者决策进入新模型，即使标签从未直接用于反向传播，模型也已不再独立于测试集。这称为自适应过拟合。
    - 关键难点是学习算法在同一训练集上选择并评估模型。单个固定模型的误差容易估计；在巨大甚至无限的模型类中挑最优者时，必须防止某个模型仅因随机波动得到虚假的低训练误差。
    - 这类界对深度网络往往极度保守。大型网络可记忆随机标签、VC 维巨大，却在真实任务上用远少于理论要求的数据良好泛化，甚至更大网络有时泛化更好。VC 理论是重要基础，却不能直接解释现代深度学习的全部现象。
  - title: 8. 环境与分布偏移
    source_heading: 8. 环境与分布偏移
    paragraphs:
    - 患病组来自年长男性患者，健康对照却来自大学生献血者。分类器可轻易利用年龄、激素、饮食和活动差异达到高准确率，却未必识别疾病。采样过程制造了严重协变量偏移，且两组支持区域可能几乎不重叠，事后重加权也难以补救。
    - 原章讲述坦克照片案例：有坦克和无坦克照片在不同时段拍摄，模型学习阴影而非坦克。无论该故事在现实流传中的细节如何，它表达的实验原则明确：标签若与拍摄条件混杂，随机划分同一采集批次也无法检验真正目标。
    - 现实概念常缓慢变化，可从旧权重继续用新标注做少量更新，并配合滑动窗口、漂移检测、样本重加权和回滚监控。在线更新会遗忘旧能力，也可能被异常或攻击数据污染，因此需要版本控制和离线验证。
    - 记录增加不一定表示真实犯罪率增加，而可能只是观察强度增加。模型把自己的决策后果当成世界证据，形成失控反馈。准确率无法表达这种制度性影响；技术指标必须与成本、公平、程序正义和社会价值一起设计。
  - title: 9. 可运行的综合实验
    source_heading: 9. 可运行的综合实验
    paragraphs:
    - 极端 logits 检查最大值平移避免溢出，并验证 softmax 平移不变性；
    - 三类二维簇可被线性边界分开，因此单层 softmax 应取得高准确率；
    - 测试误差标准误同时报告插件估计和最坏情形上界；即使有限测试集恰好没有错误，插件值为零也不表示总体误差已被精确证明为零；
    - 最后一项只是重要性加权恒等式的受控演示。真实任务不知道精确密度比，估计误差和大权重方差会使结果更困难。
  - title: 13. 核心结论与一般解题方法
    source_heading: 13. 核心结论与一般解题方法
    paragraphs:
    - 从零实现揭示形状、归一化轴和稀疏索引，高级 API 提供经过测试的稳定实现；两者都应理解。
    - VC 维和一致收敛连接模型复杂度、样本量与泛化，但经典界往往无法解释大型深度网络的实际泛化。
    - 使用稳定实现：训练传 logits 给融合交叉熵，只在需要解释概率时显式 softmax。
    - 本章完成了从分类数学到现实部署的完整闭环：线性层产生类别 logits，softmax 与交叉熵把离散预测转成可微的概率最大似然问题，稳定实现和数据加载器使其可训练；新测试集上的准确率只能在有限精度下证明固定模型的表现，反复复用会泄漏信息，而真实环境中的分布偏移和反馈循环进一步要求我们超越静态准确率，审查数据机制、决策代价与社会影响。
  takeaways:
  - 交叉熵来自类别分布的最大似然，也等于真实分布下的期望惊异度。
  - 训练与部署分布任意不同时学习不可能；协变量、标签和概念偏移只有在各自假设下才能纠正。
  - 从生成假设选损失：互斥类别用类别似然与交叉熵，不把编号当连续数值回归。
  - 保护测试集：训练参数用训练集，模型选择用验证集，最终测试尽量只做一次。
  - 本章完成了从分类数学到现实部署的完整闭环：线性层产生类别 logits，softmax 与交叉熵把离散预测转成可微的概率最大似然问题，稳定实现和数据加载器使其可训练；新测试集上的准确率只能在有限精度下证明固定模型的表现，反复复用会泄漏信息，而真实环境中的分布偏移和反馈循环进一步要求我们超越静态准确率，审查数据机制、决策代价与社会影响。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「10.1 分类与回归」？
  answer: 分类预测离散类别或类别概率，回归预测数值。把类别编号当连续数值做平方回归，会人为引入类别距离和顺序。
  source_heading: 10.1 分类与回归
- level: 概念辨析
  question: 原文如何解释「10.7 交叉熵与准确率」？
  answer: 交叉熵可微且利用置信度，适合训练；准确率不连续、忽略置信度，适合报告。更低交叉熵通常有帮助，却不保证每次都对应更高准确率。
  source_heading: 10.7 交叉熵与准确率
- level: 概念辨析
  question: 原文如何解释「10.15 固定模型评估与训练集泛化」？
  answer: 固定模型在新测试集上的误差是普通均值估计；从同一训练集选择并评估模型需要控制整个模型类的适应性，问题更难。
  source_heading: 10.15 固定模型评估与训练集泛化
- level: 概念辨析
  question: 原文如何解释「10.17 测试集复用与直接训练」？
  answer: 即使测试标签从未进入梯度，反复查看分数并据此改模型也会泄漏信息，造成自适应过拟合。
  source_heading: 10.17 测试集复用与直接训练
- level: 概念辨析
  question: 原文如何解释「10.21 在线学习与强化学习」？
  answer: 在线学习强调数据按序到达并持续更新；强化学习还强调动作影响未来状态和长期奖励。二者有交集但不等同。
  source_heading: 10.21 在线学习与强化学习
