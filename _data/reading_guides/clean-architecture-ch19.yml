  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 19 章首页第 17 章说明边界应画在变化轴上，低层插件应依赖高层业务。
    - 第 18 章进一步说明，不论边界表现为源码模块、动态组件、本地进程还是服务，源码依赖都应指向高层策略。
    - 层级是策略离系统输入和输出的距离。离输入与输出越远，策略层级越高；负责输入输出的策略层级最低。
    - 它们共同回答同一个问题：如何把不同层级、不同变化原因的政策分开，并让变化影响从低价值细节停在高价值策略之外。
  - title: 2. 按变化方式形成策略组件
    source_heading: 2. 按变化方式形成策略组件
    paragraphs:
    - 一个模块不应同时对多个不相关 actor 负责。
    - 因相同原因、在相同时间变化的类放入同一组件；
    - 哪些文件经常出现在同一业务提交；
  - title: 5. Figure 19.1：简单加密程序
    source_heading: 5. Figure 19.1：简单加密程序
    paragraphs:
    - 字符来自 Console、文件还是网络；
    - 输出写到屏幕、文件还是消息系统；
    - 原书脚注提到，Meilir Page-Jones 在 The Practical Guide to Structured Systems Design
      中把这种组件称为 Central Transform，也就是中央转换。
  - title: 7. Figure 19.2：更好的依赖结构
    source_heading: 7. Figure 19.2：更好的依赖结构
    paragraphs:
    - Console Reader + Console Writer；
    - File Reader + File Writer；
    - Network Reader + File Writer；
    - InMemory Reader + Capturing Writer。
  - title: 10.2 CCP：聚合共同变化政策
    source_heading: 10.2 CCP：聚合共同变化政策
    paragraphs:
    - Encrypt、Translate 与高层接口进入 Encryption；
    - Console Reader / Writer 等 IO 实现进入 IODevices。
  - title: 11. 在真实项目中判断 Policy 与 Level
    source_heading: 11. 在真实项目中判断 Policy 与 Level
    paragraphs:
    - 页面或 API Response；
    - 输入经过什么核心规则才产生有价值输出？
    - 如果换掉所有 UI 和数据库，哪些行为仍成立？
    - 哪些规则可以由人手工执行而仍创造业务价值？
  - title: 12.5 ETL 管道
    source_heading: 12.5 ETL 管道
    paragraphs:
    - 数据源 Reader 实现输入 Port；
    - 核心 Transform 处理领域转换；
    - 数据目标 Writer 实现输出 Port。
  - title: 14.4 变化隔离检查
    source_heading: 14.4 变化隔离检查
    paragraphs:
    - 低层紧急变化的影响是否停在 Adapter？
    - 高层契约变化是否有清楚插件适配范围？
  - title: 14.13 快速复述练习
    source_heading: 14.13 快速复述练习
    paragraphs:
    - Java、C#、Ruby 中的源码依赖怎样表现？
    - Figure 19.2 中最高层单元包含哪些元素？
    - ConsoleReader 和 ConsoleWriter 怎样插件到核心？
    - SRP、OCP、CCP、DIP、SDP、SAP 如何共同出现？
  - title: 15. 本章总结
    source_heading: 15. 本章总结
    paragraphs:
    - Policy 不只包括业务规则，也包括验证、格式化和 IO 等低层政策。
    - 数据流由输入经过 Reader、Translate、Writer 到输出。
    - Meilir Page-Jones 把这种核心政策称为 Central Transform。
    - 本章最终规则是：按变化方式组织政策，并让所有跨层源码依赖指向离输入输出更远的高层政策。
  takeaways:
  - 第 19 章解释软件政策的层级，以及源码依赖为什么必须指向高层。
  - 良好架构要求低层组件依赖高层组件。
  - 数据流回答运行时数据去哪，源码依赖回答谁知道谁，两者是不同图。
  - 紧急程度与层级不同，低频变化也不自动代表高层。
  - 本章最终规则是：按变化方式组织政策，并让所有跨层源码依赖指向离输入输出更远的高层政策。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「13.2 “高层就是最抽象的接口”」？
  answer: 错误。接口也可能描述低层 SQL 或文件机制；具体领域算法也可以是高层。
  source_heading: 13.2 “高层就是最抽象的接口”
- level: 概念辨析
  question: 原文如何解释「13.7 “数据从 Reader 到 Encrypt，所以 Encrypt 应导入 Reader”」？
  answer: 错误。高层定义 Reader 接口，具体 Reader 反向依赖该接口。
  source_heading: 13.7 “数据从 Reader 到 Encrypt，所以 Encrypt 应导入 Reader”
- level: 概念辨析
  question: 原文如何解释「13.16 “业务规则应该直接读取输入以减少层次”」？
  answer: 这会把输入机制与核心混合。简单脚本可能接受，长期系统应根据变化风险隔离。
  source_heading: 13.16 “业务规则应该直接读取输入以减少层次”
- level: 概念辨析
  question: 原文如何解释「13.18 “OCP 是本章的起点”」？
  answer: 更准确地说，起点是按政策层级和变化方式分离。OCP 是正确插件结构带来的结果。
  source_heading: 13.18 “OCP 是本章的起点”
