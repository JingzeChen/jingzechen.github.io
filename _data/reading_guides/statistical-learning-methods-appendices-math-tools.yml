overview:
  kind: summary
  minutes: 10
  question: 五个附录如何共同支撑统计学习中的优化、约束、线性结构与概率近似？
  question_source: 附录一句话回顾
  thesis: 梯度和曲率决定无约束优化方向，Lagrangian 与 KKT 把约束变成可验证的对偶条件，四个基本子空间揭示线性映射的可见与丢失方向，而 KL 和指数族把概率近似与可计算期望连接起来。
  thesis_source: 附录一句话回顾
  concepts:
  - term: 附录 A 梯度下降法
    meaning: “最速”依赖所选范数和坐标尺度。若用其他范数，最速方向是相应对偶范数问题的解；特征缩放会显著改变普通梯度下降轨迹。
    source_heading: 附录 A 梯度下降法
  - term: B.1 牛顿法
    meaning: 得到同一更新。这说明 Newton 法既是二次模型最小化，也是对一阶最优条件做 Newton 求根。
    source_heading: B.1 牛顿法
  - term: B.2 拟牛顿法的思路
    meaning: 一个向量方程不足以唯一确定矩阵，因此还需对称、正定和“尽量接近旧矩阵”等准则。
    source_heading: B.2 拟牛顿法的思路
  - term: C.2 对偶问题
    meaning: 揭示支持向量、影子价格和约束敏感性；
    source_heading: C.2 对偶问题
  - term: D.5 四个基本子空间（定理 D.1）
    meaning: 把定义域分成“可见的行空间方向”和“被压成 0 的零空间方向”；
    source_heading: D.5 四个基本子空间（定理 D.1）
  - term: E.1 KL 散度的定义
    meaning: 连续情形依赖测度下的密度比，但在可逆变量变换下保持不变。
    source_heading: E.1 KL 散度的定义
  - term: 2. 从概率目标连接 KL 与优化
    meaning: 最大似然可以写成经验分布到模型分布的 KL 最小化；变分推理把难后验近似转成 KL 最小化与 ELBO 最大化；指数族让所需期望变成对数配分函数导数。
    source_heading: 2. 从概率目标连接 KL 与优化
  logic:
  - 附录 A 梯度下降法
  - 附录 B 牛顿法和拟牛顿法
  - 附录 C 拉格朗日对偶性
  - 附录 D 矩阵的基本子空间
  - 附录 E KL 散度的定义和 Dirichlet 分布的性质
  - 五个附录之间的关系
  sections:
  - title: 附录 A 梯度下降法
    source_heading: 附录 A 梯度下降法
    paragraphs:
    - “最速”依赖所选范数和坐标尺度。若用其他范数，最速方向是相应对偶范数问题的解；特征缩放会显著改变普通梯度下降轨迹。
    - 精确搜索理论清楚，但每轮本身可能很贵。实践常用固定步长、衰减步长、Armijo 回溯、Wolfe 线搜索或自适应方法。
    - 步长过大：越过谷底甚至发散；
    - 应结合梯度、目标变化、参数变化、最大迭代数和验证集表现。
  - title: B.1 牛顿法
    source_heading: B.1 牛顿法
    paragraphs:
    - 得到同一更新。这说明 Newton 法既是二次模型最小化，也是对一阶最优条件做 Newton 求根。
    - 所以 p_k 是下降方向。若 Hessian 不定，p_k 可能指向鞍点或使函数上升；若 Hessian 奇异，方向甚至不存在。
    - 截断 Newton / 共轭梯度近似求解。
  - title: B.2 拟牛顿法的思路
    source_heading: B.2 拟牛顿法的思路
    paragraphs:
    - 一个向量方程不足以唯一确定矩阵，因此还需对称、正定和“尽量接近旧矩阵”等准则。
    - 若 f 严格凸，该条件自然成立；一般函数可用满足 Wolfe 曲率条件的线搜索保证。若不成立，应跳过、阻尼或修正更新。
  - title: C.2 对偶问题
    source_heading: C.2 对偶问题
    paragraphs:
    - 揭示支持向量、影子价格和约束敏感性；
    - 允许核技巧等只依赖内积的重参数化。
  - title: C.4 强对偶与 Slater 条件（定理 C.2）
    source_heading: C.4 强对偶与 Slater 条件（定理 C.2）
    paragraphs:
    - 原书定理 C.2 把所有不等式都要求严格可行。更一般版本允许仿射不等式不严格；核心是相对内部非空等约束资格条件。
    - "【边界】 凸性本身不总保证强对偶，仍需适当约束资格；非凸问题即使有 KKT 点也可能存在正对偶间隙。"
  - title: D.5 四个基本子空间（定理 D.1）
    source_heading: D.5 四个基本子空间（定理 D.1）
    paragraphs:
    - 把定义域分成“可见的行空间方向”和“被压成 0 的零空间方向”；
    - 把行空间中的 v_i 沿奇异值缩放并旋转到列空间中的 u_i；
  - title: E.1 KL 散度的定义
    source_heading: E.1 KL 散度的定义
    paragraphs:
    - 连续情形依赖测度下的密度比，但在可逆变量变换下保持不变。
    - PLSA 极大似然与 KL-NMF；
    - 若 q 在 p 很小处放质量，惩罚很大；若 q 漏掉 p 的某个模式却在那里取 0，该区域不进入 E_q。因此反向 KL 常“找一个模式”并低估方差。
    - 要求 q 覆盖 p 的所有有质量区域，更偏向质量覆盖。两者没有普遍优劣，取决于近似目标。
  - title: 2. 从概率目标连接 KL 与优化
    source_heading: 2. 从概率目标连接 KL 与优化
    paragraphs:
    - 最大似然可以写成经验分布到模型分布的 KL 最小化；变分推理把难后验近似转成 KL 最小化与 ELBO 最大化；指数族让所需期望变成对数配分函数导数。
    - 优化附录给出“怎么最大化 ELBO”，附录 E 解释“为什么这是下界以及如何计算期望”。
  takeaways:
  - 线性代数结构决定优化难度：Hessian 的零空间意味着局部平坦或不可识别方向；条件数决定梯度下降速度；正交分解与预条件可以改善几何。
  - 最大似然可以写成经验分布到模型分布的 KL 最小化；变分推理把难后验近似转成 KL 最小化与 ELBO 最大化；指数族让所需期望变成对数配分函数导数。
  - Newton 与拟 Newton 都是局部模型法。对非凸目标，线搜索、信赖域和正定修正不是可选装饰，而是全局稳定性的必要机制。
  - 梯度和曲率决定无约束优化方向，Lagrangian 与 KKT 把约束变成可验证的对偶条件，四个基本子空间揭示线性映射的可见与丢失方向，而 KL 和指数族把概率近似与可计算期望连接起来。
