overview:
  kind: summary
  minutes: 8
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 朴素贝叶斯法以”0-1 损失下最优决策即后验最大化”为理论基础，通过条件独立假设把类条件分布的参数量从指数级压缩到线性级，用简单计数（极大似然）或带伪计数的平滑计数（贝叶斯估计）一次性求出全部参数；它以较大的模型偏差换取极低的方差和极高的效率，因而在高维小样本任务中往往是一个又快又稳的强基线——但要记住，它是好的分类器，却是差的概率估计器。
  thesis_source: 第 4 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 核心要点：整章只有一个”妥协”，就是条件独立假设。其他每一步都是严格推导。理解本章的关键，就是理解这个假设买到了什么（参数量从指数降到线性）和付出了什么（概率估计不准）。
    source_heading: 0. 本章解决什么问题
  - term: 4.2 后验概率最大化的含义：它等价于期望风险最小化
    meaning: "⚠️ 这一步之所以成立，前提是假设空间不受限。如果模型被限制成线性函数（如感知机、逻辑回归），就不能逐点自由取值，此时最优解未必是逐点最优。这也解释了为什么这些方法要用别的损失和优化手段。"
    source_heading: 4.2 后验概率最大化的含义：它等价于期望风险最小化
  - term: 4.3 朴素贝叶斯法的参数估计
    meaning: 结论一致，但平滑后两类的差距明显缩小（比值从 3.0 降到 1.87）。这是平滑的典型效果：它把极端的概率估计往中间拉，使模型不那么”自信”。在样本量只有
      15 的情况下，这种保守是合理的。
    source_heading: 4.3 朴素贝叶斯法的参数估计
  - term: 4.5 深入理解：朴素贝叶斯的本质
    meaning: 参数少，方差小。这是关键的一点：条件独立假设引入了很大的偏差，但把参数从指数级降到线性级，极大降低了方差。在样本有限时，”偏差大但方差小”的模型往往优于”偏差小但方差极大”的模型。
    source_heading: 4.5 深入理解：朴素贝叶斯的本质
  - term: 4.6 适用边界与实践建议
    meaning: 训练集的取值集合要覆盖全面，预测时遇到全新取值需有兜底策略。
    source_heading: 4.6 适用边界与实践建议
  - term: 4.7.2 必须掌握的结论
    meaning: 后验概率最大化等价于 0-1 损失下的期望风险最小化，证明的关键是逐点最小化。
    source_heading: 4.7.2 必须掌握的结论
