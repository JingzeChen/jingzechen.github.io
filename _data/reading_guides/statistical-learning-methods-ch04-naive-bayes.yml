  - 0. 本章解决什么问题
  - 4.1 从贝叶斯定理到朴素贝叶斯分类器
  - 4.3 朴素贝叶斯法的参数估计
  - 4.4 计算实现的关键细节
  - 4.5 深入理解：朴素贝叶斯的本质
  - 4.7.1 用三要素分析朴素贝叶斯
  - 4.7.2 必须掌握的结论
  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 这个想法本身没有任何”朴素”之处，它其实是最优的分类准则（见 4.2 节的证明）。
    - 核心要点：整章只有一个”妥协”，就是条件独立假设。其他每一步都是严格推导。理解本章的关键，就是理解这个假设买到了什么（参数量从指数降到线性）和付出了什么（概率估计不准）。
    - "⚠️ 易混淆点：朴素贝叶斯法（naive Bayes）与贝叶斯估计（Bayesian estimation）是两回事。"
    - 二者可以组合，但不是同一层面的概念。事实上朴素贝叶斯的参数既可以用极大似然估计（频率学派），也可以用贝叶斯估计。
  - title: 4.1 从贝叶斯定理到朴素贝叶斯分类器
    source_heading: 4.1 从贝叶斯定理到朴素贝叶斯分类器
    paragraphs:
    - 最后一行的参数量已经远超宇宙原子总数。更本质的问题是数据稀疏：即使参数量勉强可存，训练集里也几乎每种特征组合最多只出现一次，频率估计毫无统计意义——绝大多数组合的估计值会是
      0。
    - 这就是”维数灾难”在概率估计上的体现。第 3 章的 k-NN 遇到的是”高维下邻域不再局部”，这里遇到的是”高维下联合分布无法估计”。二者是同一困难的不同侧面。
    - 举个直观例子。在垃圾邮件分类中，”免费”和”中奖”这两个词在全体邮件中显然高度相关（同时出现的概率远高于各自概率之积）。但朴素贝叶斯假设的是：一旦知道这封邮件是垃圾邮件，”免费”出现与否，就不再影响”中奖”出现的概率。它认为两个词的相关性完全由”是垃圾邮件”这个共同原因解释掉了。
    - 类别 Y 是所有特征的共同”原因”，特征之间没有直接的边。这被称为朴素贝叶斯网络，是最简单的贝叶斯网络。放宽这个结构（允许特征间连边）就得到一般的贝叶斯网络。
  - title: 4.2 后验概率最大化的含义：它等价于期望风险最小化
    source_heading: 4.2 后验概率最大化的含义：它等价于期望风险最小化
    paragraphs:
    - 上一节直接说”取后验最大的类”，但为什么这样做是对的？本节给出证明：它等价于 0-1 损失下的期望风险最小化。这把朴素贝叶斯纳入了第 1 章的统一框架。
    - 因此，要让整个积分最小，只需让每一个 x 处的条件风险各自最小。这一步叫逐点最小化（pointwise minimization），是本证明的核心。
    - "⚠️ 这一步之所以成立，前提是假设空间不受限。如果模型被限制成线性函数（如感知机、逻辑回归），就不能逐点自由取值，此时最优解未必是逐点最优。这也解释了为什么这些方法要用别的损失和优化手段。"
    - 这个分类器称为贝叶斯最优分类器，它达到的错误率称为贝叶斯错误率，是任何分类器在该分布下的误差下界。
  - title: 4.3 朴素贝叶斯法的参数估计
    source_heading: 4.3 朴素贝叶斯法的参数估计
    paragraphs:
    - 这两个公式的严格推导见 4.8 节习题 4.1（用拉格朗日乘子法）。这里先记住结论：极大似然估计就是数频数。
    - 本质：极大似然估计只相信数据，不给未观测事件留任何余地。当数据稀疏时，这种”完全相信频率”的态度就会崩溃。
    - 这正是我们希望的行为：数据少时谨慎，数据多时果断。严格推导见 4.8 节习题 4.2。
    - 结论一致，但平滑后两类的差距明显缩小（比值从 3.0 降到 1.87）。这是平滑的典型效果：它把极端的概率估计往中间拉，使模型不那么”自信”。在样本量只有
      15 的情况下，这种保守是合理的。
  - title: 4.4 计算实现的关键细节
    source_heading: 4.4 计算实现的关键细节
    paragraphs:
    - 设训练样本 N 个，特征 n 维，类别 K 个，第 j 维有 S_j 个取值。
    - 训练比感知机快（无需迭代到收敛），比 SVM 快得多；
    - 模型体积与训练集大小无关，这一点显著优于 k-NN。
    - 这就是朴素贝叶斯在工业界长期流行的原因：在垃圾邮件过滤等场景中，它能以极低成本处理海量数据，效果又不算差。
  - title: 4.5 深入理解：朴素贝叶斯的本质
    source_heading: 4.5 深入理解：朴素贝叶斯的本质
    paragraphs:
    - 参数少，方差小。这是关键的一点：条件独立假设引入了很大的偏差，但把参数从指数级降到线性级，极大降低了方差。在样本有限时，”偏差大但方差小”的模型往往优于”偏差小但方差极大”的模型。
    - 处理办法：若确实需要可信概率，可在验证集上做概率校准，如 Platt scaling（用逻辑回归拟合得分到概率的映射）或保序回归（isotonic regression）。
    - 另一个思路：放宽独立假设。 允许特征间存在有限的依赖，就得到半朴素贝叶斯（如 TAN，树增强朴素贝叶斯），进一步放开就是一般的贝叶斯网络。这是本章”继续阅读”指向的方向。
    - 第 1 章：本章是”生成方法”的第一个实例；4.2 节的推导是”0-1 损失下最优预测是条件众数”的具体应用；平滑是”结构风险最小化 / 贝叶斯先验”的具体体现。
  - title: 4.6 适用边界与实践建议
    source_heading: 4.6 适用边界与实践建议
    paragraphs:
    - 注意特征冗余，必要时先做特征选择（如按互信息、卡方筛选）。
    - 连续特征优先考虑分箱离散化或高斯 NB，并检查分布假设。
    - 类别不平衡时，先验会主导预测，可考虑调整先验或阈值。
    - 训练集的取值集合要覆盖全面，预测时遇到全新取值需有兜底策略。
  - title: 4.7.1 用三要素分析朴素贝叶斯
    source_heading: 4.7.1 用三要素分析朴素贝叶斯
    paragraphs:
    - 决策层面：0-1 损失下的期望风险最小化，等价于后验概率最大化；
    - 参数层面：极大似然估计（对应经验风险最小化）或贝叶斯估计（对应结构风险最小化 / MAP）。
  - title: 4.7.2 必须掌握的结论
    source_heading: 4.7.2 必须掌握的结论
    paragraphs:
    - 条件独立 ≠ 独立，它只要求”给定类别后特征不再互相提供信息”。
    - 分类公式的分母与类别无关，可以丢掉；但若要输出概率则必须保留归一化。
    - 后验概率最大化等价于 0-1 损失下的期望风险最小化，证明的关键是逐点最小化。
    - 实现必须在对数空间进行，否则高维时下溢；输出概率要用 log-sum-exp。
  takeaways:
  - 朴素贝叶斯法以”0-1 损失下最优决策即后验最大化”为理论基础，通过条件独立假设把类条件分布的参数量从指数级压缩到线性级，用简单计数（极大似然）或带伪计数的平滑计数（贝叶斯估计）一次性求出全部参数；它以较大的模型偏差换取极低的方差和极高的效率，因而在高维小样本任务中往往是一个又快又稳的强基线——但要记住，它是好的分类器，却是差的概率估计器。
  - 类别 Y 是所有特征的共同”原因”，特征之间没有直接的边。这被称为朴素贝叶斯网络，是最简单的贝叶斯网络。放宽这个结构（允许特征间连边）就得到一般的贝叶斯网络。
  - 这就是朴素贝叶斯在工业界长期流行的原因：在垃圾邮件过滤等场景中，它能以极低成本处理海量数据，效果又不算差。
  - 训练集的取值集合要覆盖全面，预测时遇到全新取值需有兜底策略。
  - 实现必须在对数空间进行，否则高维时下溢；输出概率要用 log-sum-exp。
