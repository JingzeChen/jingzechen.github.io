overview:
  kind: summary
  minutes: 10
  question: 原文围绕「0. 本章定位：冗余应对“某个副本坏了”，隔离应对“同一种输入能打坏所有副本”」建立了怎样的核心认识？
  question_source: 0. 本章定位：冗余应对“某个副本坏了”，隔离应对“同一种输入能打坏所有副本”
  thesis: Bounded cells 用 stranded capacity/运营复杂度换 predictability、benchmarkability
    和 fault containment。
  thesis_source: 23. 核心结论
  concepts:
  - term: 0. 本章定位：冗余应对“某个副本坏了”，隔离应对“同一种输入能打坏所有副本”
    meaning: Redundancy 对 infrastructure fault 很有效：一台机器的 memory、disk 或 NIC 故障时，其他机器可接管。但如果
      fault 的原因存在于所有副本共享的 code、configuration、dependency 或 workload 中，复制更多副本不会消除风险。
    source_heading: 0. 本章定位：冗余应对“某个副本坏了”，隔离应对“同一种输入能打坏所有副本”
  - term: 5. Figure 26.1：6 instances、3 partitions
    meaning: Users 被永久分配到一个 P。Figure 26.1 中 A/B/C 分别只访问各自 partition 的两个 instances。
    source_heading: 5. Figure 26.1：6 instances、3 partitions
  - term: 10. Shuffle shard mapping 如何实现
    meaning: 异构 nodes 不应等概率。可用 weighted rendezvous 或 virtual tokens，让高 capacity node
      获得更多 assignments，同时监控 assignment count/work。
    source_heading: 10. Shuffle shard mapping 如何实现
  - term: 12. 26.2 Cellular architecture
    meaning: 可共享 global control plane、DNS、identity 或 artifacts，但它们会形成 common-mode
      risk。应支持 static stability、replication、staged rollout 和 bounded blast radius。
    source_heading: 12. 26.2 Cellular architecture
  - term: 17.5 示例局限
    meaning: 无 gateway、state migration 和 shared dependencies；
    source_heading: 17.5 示例局限
  - term: 24. 一般化的解决问题方法
    meaning: Fault-domain-aware subset、mapping epoch、渐进 remap、per-shard/cell metrics
      和 blast-radius drills 缺一不可。
    source_heading: 24. 一般化的解决问题方法
