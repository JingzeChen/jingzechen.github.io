  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 穷举法的价值不只在于解决小规模问题。它迫使我们明确状态空间、约束和完整性，并提供一个可靠基线。高效算法往往正是从这个完整候选空间中识别“哪些维度可推导、哪些状态等价、哪些分支永远无解”，再安全地把它们删去。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 本章共有 3 个基础算法单元、14 道正文题。后文为每个单元或题目各放置一个紧邻推导的 C++17 代码块，共 17 个；Python 与
      Go 只在章末附录给出完整程序。
    source_heading: 本章要解决什么问题
  - term: 15.2 顺序列举的算法设计
    meaning: 只要窗口满足目标，移除左端能得到更短候选，必须继续；第一次变为不满足后，再移除正数只会让和更小，所以该右端下不可能有更短合法窗口，应等待右端扩展。
    source_heading: 15.2 顺序列举的算法设计
  - term: 15.3.2 LeetCode 90：子集 II（★★）
    meaning: 所有下标子集仍被枚举，所以每个合法值子集至少生成一次；排序使同一多重集合生成相同规范向量，集合只保留一个，因此最终无重无漏。
    source_heading: 15.3.2 LeetCode 90：子集 II（★★）
  - term: 15.4 排列列举的算法设计
    meaning: 任一合法 N 皇后方案每行恰一个、每列恰一个，因此唯一对应一个列排列；算法枚举所有列排列，不会漏解。对角线公式是皇后斜线攻击的充要条件，算法只接受没有冲突对的排列，所以不会误计。
    source_heading: 15.4 排列列举的算法设计
  - term: 代码与推导的对应关系
    meaning: 补充： 本节把正文状态与公式映射到三语言程序接口，方便从推导反查实现，不属于原书新增题解。
    source_heading: 代码与推导的对应关系
  - term: 本章总结
    meaning: 穷举法的价值不只在于解决小规模问题。它迫使我们明确状态空间、约束和完整性，并提供一个可靠基线。高效算法往往正是从这个完整候选空间中识别“哪些维度可推导、哪些状态等价、哪些分支永远无解”，再安全地把它们删去。
    source_heading: 本章总结
