  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 当问题的候选答案构成有限离散集合，最直接可靠的方法是：把所有候选完整生成，逐一验证约束，从中统计、筛选或优化。这就是穷举法，也称枚举法、列举法。
    - 何时验证约束：在候选完整后检查，还是在部分状态阶段提前剪枝？
    - 如何控制规模：能否消去变量、缩小范围、打破对称或改用更强算法？
    - 本章共有 3 个基础算法单元、14 道正文题。后文为每个单元或题目各放置一个紧邻推导的 C++17 代码块，共 17 个；Python 与 Go 只在章末附录给出完整程序。
  - title: 15.1 穷举法概述
    source_heading: 15.1 穷举法概述
    paragraphs:
    - 补充：基准价值。 小规模穷举还可作为测试 oracle。开发高效算法时，用随机小输入比较两者输出，常能发现边界错误；本章完整程序的验证也采用这一思路。
    - 一条环路可以从环上的任意顶点开始书写。把起点固定为 0 只是消除同一有向环路的 n 种循环旋转表示，每个经过所有顶点的环仍有唯一“从 0 开始”的表示。
    - 若无向图中正向与反向也视为同一路线，还可进一步固定第二个顶点小于最后一个顶点，消除反转对称；原书基础算法未做这一剪枝。
    - 必须区分两类优化：剪枝只是不访问被证明无解的分支，常显著减少给定输入的实际结点数，但若存在几乎无法剪枝的输入，最坏上界仍不变；迁移则利用消元、单调性或数学分块换掉候选表示，可能真正降低渐进复杂度。后文会逐题明确属于哪一种。
  - title: 15.2 顺序列举的算法设计
    source_heading: 15.2 顺序列举的算法设计
    paragraphs:
    - "“取两个最大值”依赖变换后因子非负。若允许任意负数，两个很小的负数也可能产生最大正乘积，需要同时考虑两个最大和两个最小值；不能直接迁移本题结论。"
    - 只要窗口满足目标，移除左端能得到更短候选，必须继续；第一次变为不满足后，再移除正数只会让和更小，所以该右端下不可能有更短合法窗口，应等待右端扩展。
    - 汽车走完后缀后至少积累 A 油量，足以覆盖绕回数组开头那一段最坏累计亏损；结合每次失败区间的淘汰性质，绕回过程不会为负。因此最终候选可完成一圈。
    - 总和判定给出无解的必要条件；批量淘汰证明每个被跳过起点确实不可行；当总和非负时，未被淘汰的最终候选可行。题目保证有解时唯一，因此直接返回该候选。
  - title: 15.3.2 LeetCode 90：子集 II（★★）
    source_heading: 15.3.2 LeetCode 90：子集 II（★★）
    paragraphs:
    - 因此 15.3.1 的“不同掩码必得不同子集”依赖元素互异，本题不再成立。
    - 排序保证同一多重集合总以相同非降序向量表示；
    - 所有下标子集仍被枚举，所以每个合法值子集至少生成一次；排序使同一多重集合生成相同规范向量，集合只保留一个，因此最终无重无漏。
    - 若当前值与前一值不同，就把它追加到此前所有子集；若相同，只扩展“上一次加入该值时新产生的子集”，避免生成重复。
  - title: 15.3.4 LeetCode 1863：所有子集异或总和再求和（★）
    source_heading: 15.3.4 LeetCode 1863：所有子集异或总和再求和（★）
    paragraphs:
    - 位掩码一一枚举所有下标子集；对每个子集按异或定义计算值并累加，所以答案正确。
    - 固定其中一个元素，把任意子集按“是否切换包含这个元素”两两配对；一对子集的 XOR 第 b 位恰好一个为 0、一个为 1。
  - title: 15.4 排列列举的算法设计
    source_heading: 15.4 排列列举的算法设计
    paragraphs:
    - 从最小排列开始，每次取直接后继，既不会重复，也不可能跳过中间排列，直到最大排列，因此无重无漏。
    - 字典序排列按当前首位分成大小相同且顺序连续的阶乘块。整数除法选择包含目标排名的唯一块，取模把全局排名转换成块内排名。对剩余位递归应用同一论证，最终每一位都与第
      k 个排列一致。
    - 基线枚举对象是前 k 个字典序排列；实现把排名迁移为 n 次阶乘块选择，每轮整块跳过不含目标的排列。
    - 任一合法 N 皇后方案每行恰一个、每列恰一个，因此唯一对应一个列排列；算法枚举所有列排列，不会漏解。对角线公式是皇后斜线攻击的充要条件，算法只接受没有冲突对的排列，所以不会误计。
  - title: 代码与推导的对应关系
    source_heading: 代码与推导的对应关系
    paragraphs:
    - 补充： 本节把正文状态与公式映射到三语言程序接口，方便从推导反查实现，不属于原书新增题解。
    - 这张表体现原书反复强调的优化方向：不是让计算机更快地检查同样多候选，而是改变表示，减少必须生成的候选。
  - title: 三种语言中的实现差异
    source_heading: 三种语言中的实现差异
    paragraphs:
    - 补充： 三种程序保持同一算法不变量，差异主要来自排列工具、容器复制和整数类型。
    - Go 标准库没有直接对应函数，程序实现枢轴、后继交换和后缀反转。
    - 若 Go 直接把同一工作切片反复加入答案，后续修改会让历史结果一起变化。
    - Python 打印字符串列表时带引号，C++ 示例打印器省略字符串引号，Go 使用切片的空格分隔格式。顺序与数值内容保持一致。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 表示：每个合法答案如何映射为一个候选状态；
    - 唯一性：是否重复，若重复如何规范化或去重；
    - 优化保持性：消元、剪枝或跳过状态为何不改变解集。
    - 穷举法的价值不只在于解决小规模问题。它迫使我们明确状态空间、约束和完整性，并提供一个可靠基线。高效算法往往正是从这个完整候选空间中识别“哪些维度可推导、哪些状态等价、哪些分支永远无解”，再安全地把它们删去。
  takeaways:
  - 表示：每个合法答案如何映射为一个候选状态；
  - 覆盖：生成过程为何会访问这个状态；
  - 筛选：约束为何恰好接受合法状态；
  - 优化保持性：消元、剪枝或跳过状态为何不改变解集。
  - 穷举法的价值不只在于解决小规模问题。它迫使我们明确状态空间、约束和完整性，并提供一个可靠基线。高效算法往往正是从这个完整候选空间中识别“哪些维度可推导、哪些状态等价、哪些分支永远无解”，再安全地把它们删去。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5. “重复子集”要先确定按值还是按下标」？
  answer: 90 题按值去重；1863 明确相同值但不同下标的子集仍分别计数。不能看到重复值就一律使用集合去重。
  source_heading: 5. “重复子集”要先确定按值还是按下标
- level: 概念辨析
  question: 原文如何解释「12. 滑动窗口依赖正数单调性」？
  answer: 209 中若出现负数，扩大窗口可能让和下降，缩小窗口可能让和上升，“不满足就扩右、满足就缩左”的证明失效。
  source_heading: 12. 滑动窗口依赖正数单调性
- level: 概念辨析
  question: 原文如何解释「14. next_permutation 不会自动循环」？
  answer: 达到最大字典序后返回 false，通常还会把序列变回最小排列（具体标准接口行为如此），但枚举循环应在 false 时结束。若初始未排序，前面的排列已被永久跳过。
  source_heading: 14. next_permutation 不会自动循环
- level: 概念辨析
  question: 原文如何解释「16. N 皇后使用列排列后无需再检查同列」？
  answer: 排列元素天然互异，行也由数组下标固定。只需检查对角线；重复检查列不会错，但属于多余工作。
  source_heading: 16. N 皇后使用列排列后无需再检查同列
- level: 概念辨析
  question: 原文如何解释「18. 剪枝必须证明被剪状态不可能产生解」？
  answer: 加油站能批量跳过起点，是因为失败区间内任一起点到失败站的净和更小；随意跳过没有这种支配关系的状态会破坏完备性。
  source_heading: 18. 剪枝必须证明被剪状态不可能产生解
