  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 潜在语义分析把稀疏的词-文档矩阵压缩为少数话题与文档话题坐标：SVD 提供正交的全局最优低秩近似，NMF 提供非负可解释的加法分解，但二者能否恢复真实语义都取决于语料共现信息、话题数和优化条件。
  thesis_source: 第 17 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 潜在语义分析（latent semantic analysis，LSA）是一种无监督学习方法，主要用于文本的话题分析，其特点是通过矩阵分解发现文本与单词之间基于话题的语义关系。
    source_heading: 0. 本章解决什么问题
  - term: 17.2 潜在语义分析算法
    meaning: 适用边界：SVD 话题向量可正可负、两列正交。自然语言话题并不必然正交，负权重也不是词概率；因此它是“潜在方向”的代数解释，不是概率话题。
    source_heading: 17.2 潜在语义分析算法
  - term: 17.3.1 非负矩阵分解
    meaning: 原书称其为“伪概率分布”，因为非负且可归一化解释，但未经归一化不是严格概率。
    source_heading: 17.3.1 非负矩阵分解
  - term: 17.4 【补充】LSA 与 NMF 的适用边界
    meaning: LSA 假设“相似语义产生相似共现模式”。若语料太小、同义词从不与共同上下文共现，矩阵分解无从知道两词相关。多义词的不同意义若上下文不足，也可能仍被混在一个方向中。
    source_heading: 17.4 【补充】LSA 与 NMF 的适用边界
  - term: 17.5 可运行代码：SVD-LSA、TF-IDF 与两种 NMF
    meaning: 平方损失和散度损失的 NMF 乘法更新。
    source_heading: 17.5 可运行代码：SVD-LSA、TF-IDF 与两种 NMF
  - term: 必须记住的边界
    meaning: SVD 的负权重不是概率，NMF 的非负权重也需归一化才可作伪概率解释；
    source_heading: 必须记住的边界
