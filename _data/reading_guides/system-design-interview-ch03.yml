overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、边界与框架总览」建立了怎样的核心认识？
  question_source: 0. 学习目标、边界与框架总览
  thesis: 过程比最终架构图更能评价能力。 提问、假设、取舍、反馈和修正都必须可见。
  thesis_source: 14. 核心结论与一般解题思路
  concepts:
  - term: 0. 学习目标、边界与框架总览
    meaning: 本章解决的不是某一项分布式技术，而是“面对一道开放的系统设计题，怎样组织一场有效的技术讨论”。作者先解释面试为什么令人畏惧、面试官究竟观察什么，随后给出四步流程，最后列出
      Dos/Don’ts 和 45 分钟时间分配。
    source_heading: 0. 学习目标、边界与框架总览
  - term: 4. Step 1：理解问题并确定设计范围
    meaning: 我们设计同时支持 Web 和移动端的新闻信息流，核心功能是发帖和读取朋友帖子；按逆时间排序，每位用户最多 5000 个朋友，规模为 10M
      DAU，帖子可含图片和视频。优先目标暂定为低读取延迟和高可用，允许秒级最终一致。评论、广告和个性化推荐不在本次范围。接下来我会先画发布与读取两条路径，再按需要估算容量。
    source_heading: 4. Step 1：理解问题并确定设计范围
  - term: 7. Step 4：收尾不是重复，而是完成设计闭环
    meaning: 最终方案把帖子存储与用户 feed 索引分离。发布路径持久化帖子后通过队列异步 fan-out，普通用户采用写时扇出以换取低读延迟，名人可改为读时合并。读取服务从
      Feed Cache 取得 IDs，并批量补全 Post/User Cache；媒体由 CDN 交付。系统接受秒级最终一致，主要风险是队列积压、热点和缓存回源。
    source_heading: 7. Step 4：收尾不是重复，而是完成设计闭环
  - term: 9. Don’ts：作者要求避免的行为
    meaning: 我看到两个方向：预计算降低读取延迟，但名人 fan-out 会爆炸；纯读时聚合又可能让 5000 好友读取过慢。我倾向混合，但还不确定题目希望重点优化哪一侧，能否给我一个优先级提示？
    source_heading: 9. Don’ts：作者要求避免的行为
  - term: 11.3 Step 3：深入选择
    meaning: 删除和隐私变化在读取时过滤，并异步清理缓存。
    source_heading: 11.3 Step 3：深入选择
  - term: 14. 核心结论与一般解题思路
    meaning: Step 1 防止正确地解决错误问题。 开始设计前先确认功能、规模、增长、质量目标和技术约束。
    source_heading: 14. 核心结论与一般解题思路
  logic:
  - 0. 学习目标、边界与框架总览
  - 4. Step 1：理解问题并确定设计范围
  - 5. Step 2：提出高层设计并取得认可
  - 9. Don’ts：作者要求避免的行为
  - 11.2 Step 2：高层设计
  - 12.13 Feed Cache 与 Post Cache
  - 14. 核心结论与一般解题思路
  sections:
  - title: 0. 学习目标、边界与框架总览
    source_heading: 0. 学习目标、边界与框架总览
    paragraphs:
    - 本章解决的不是某一项分布式技术，而是“面对一道开放的系统设计题，怎样组织一场有效的技术讨论”。作者先解释面试为什么令人畏惧、面试官究竟观察什么，随后给出四步流程，最后列出
      Dos/Don’ts 和 45 分钟时间分配。
    - 为什么面试官不期待候选人在一小时内设计出真实 Google 搜索？
    - 第二步的高层设计应包含什么，为什么必须先取得面试官认可？
    - 原章没有数学算法或正式评分公式。本文加入的时间预算、问题价值、深入优先级和容量公式均是教学化模型，用于解释作者的方法为何有效，不应误认为原书给出的招聘评分标准。
  - title: 2. 面试官在寻找哪些信号
    source_heading: 2. 面试官在寻找哪些信号
    paragraphs:
    - 我正在比较写时扇出和读时聚合。前者降低读取延迟但对名人用户有巨大写放大；后者写入简单但每次读取要聚合最多 5000 个朋友。根据题目把读取体验设为优先，我先用写时扇出作为普通用户基线，再单独处理名人。
    - 5 个组件最多有 10 对交互，10 个组件最多有 45 对。真实依赖不是完全图，但这个教学化模型说明：服务、协议、部署和数据所有权增加后，测试与故障组合会快速增长。
    - 在当前“帖子按时间排序、10M DAU、好友上限 5000”的范围内，我仍倾向预计算信息流；如果面试官把一致性改为严格实时，或名人占比很高，我会切换为混合扇出。
    - 抢答、背诵标准图、猜产品内部实现，都把开放设计题错误地当成 trivia contest。系统设计的核心不是第一个说出“Redis”的人，而是能否确定
      Redis 要缓存什么、命中率是否有价值、失效和故障如何处理。
  - title: 4. Step 1：理解问题并确定设计范围
    source_heading: 4. Step 1：理解问题并确定设计范围
    paragraphs:
    - 原书用 Jimmy 抢答的故事提醒：课堂上回答快可能受奖励，系统设计面试中未经思考就给方案不会加分。原因是题目没有唯一答案，且初始描述故意不完整。
    - 我先确认排序语义。若只按逆时间顺序，可以预计算 ID 列表；若需要个性化推荐，还要加入在线或离线排名。为了控制本次范围，我们采用哪一种？
    - 我假设信息流允许秒级最终一致，优先保证读延迟和可用性。若要求发布后所有好友立刻强一致可见，fan-out 与读取路径需要重新设计。
    - 我们设计同时支持 Web 和移动端的新闻信息流，核心功能是发帖和读取朋友帖子；按逆时间排序，每位用户最多 5000 个朋友，规模为 10M DAU，帖子可含图片和视频。优先目标暂定为低读取延迟和高可用，允许秒级最终一致。评论、广告和个性化推荐不在本次范围。接下来我会先画发布与读取两条路径，再按需要估算容量。
  - title: 5. Step 2：提出高层设计并取得认可
    source_heading: 5. Step 2：提出高层设计并取得认可
    paragraphs:
    - 发布接口对应写路径；读取接口用 cursor 分页，避免深页 offset 在动态数据上的性能和重复/遗漏问题。
    - 信息流缓存通常不必复制完整帖子，可主要保存有序的 post IDs；读取时再批量获取帖子和用户详情。这样能降低冗余，但读取多一次聚合。
    - News Feed Service 从该用户的信息流缓存取得按时间逆序排列的帖子 ID，再组装响应。高层阶段先证明读路径可以低延迟完成，具体用户缓存、帖子缓存和
      CDN 可在 Step 3 展开。
    - 实际缓存还包含键、排序结构、对象开销、副本和余量，可能是其数倍。该估算说明信息流缓存需要分布式部署，但仍远小于把完整媒体复制到每个用户缓存。
  - title: 7. Step 4：收尾不是重复，而是完成设计闭环
    source_heading: 7. Step 4：收尾不是重复，而是完成设计闭环
    paragraphs:
    - 作者在最终步骤列出六个方向：瓶颈与改进、架构回顾、错误场景、运维问题、下一规模曲线和更多时间下的改进。
    - 名人用户的关注者数量使写时 fan-out 不可承受，因此改用混合策略：普通作者继续写时扇出，名人帖子在读取时合并。代价是读取服务增加一路聚合，并要保持两个来源的稳定排序。
    - 最终方案把帖子存储与用户 feed 索引分离。发布路径持久化帖子后通过队列异步 fan-out，普通用户采用写时扇出以换取低读延迟，名人可改为读时合并。读取服务从
      Feed Cache 取得 IDs，并批量补全 Post/User Cache；媒体由 CDN 交付。系统接受秒级最终一致，主要风险是队列积压、热点和缓存回源。
    - 运维不是设计后的附录。若系统无法观测传播延迟，就无法知道“最终一致”究竟是 2 秒还是 2 小时。
  - title: 9. Don’ts：作者要求避免的行为
    source_heading: 9. Don’ts：作者要求避免的行为
    paragraphs:
    - 准备不是背答案，而是熟悉常见构件和权衡：缓存、复制、分片、队列、CDN、一致性、限流、唯一 ID，以及常见题目的独特难点。
    - 先给高层设计，再逐步深入。否则面试官看不到系统边界，也无法判断局部是否重要。
    - 我看到两个方向：预计算降低读取延迟，但名人 fan-out 会爆炸；纯读时聚合又可能让 5000 好友读取过慢。我倾向混合，但还不确定题目希望重点优化哪一侧，能否给我一个优先级提示？
    - 面试官可能继续改变条件、追问故障、要求优化或切换深入点。应尽早且频繁获取反馈，直到面试官明确结束。
  - title: 11.2 Step 2：高层设计
    source_heading: 11.2 Step 2：高层设计
    paragraphs:
    - 发布：保存 Post → 异步 fan-out → 写朋友 Feed Cache；
    - 读取：读取 Feed IDs → 批量补全 Post/User → 返回，媒体走 CDN。
  - title: 11.3 Step 3：深入选择
    source_heading: 11.3 Step 3：深入选择
    paragraphs:
    - 普通用户写时 fan-out，低延迟读取；
    - 队列按 recipient 或 author 分区，明确顺序语义；
    - Feed Cache 只保存 IDs，Post/User 批量 multi-get；
    - 删除和隐私变化在读取时过滤，并异步清理缓存。
  - title: 12.13 Feed Cache 与 Post Cache
    source_heading: 12.13 Feed Cache 与 Post Cache
    paragraphs:
    - Feed Cache 保存“某用户应该看到哪些帖子及顺序”；
    - Post Cache 保存“某个帖子具体是什么内容”；
    - 分离可以减少完整帖子向所有收件人的复制。
  - title: 14. 核心结论与一般解题思路
    source_heading: 14. 核心结论与一般解题思路
    paragraphs:
    - Step 1 防止正确地解决错误问题。 开始设计前先确认功能、规模、增长、质量目标和技术约束。
    - Step 2 先建立端到端蓝图。 具体用例必须走通，关键组件要有职责，数量级要能支撑方案。
    - 时间管理决定信号密度。 不求覆盖全部真实系统，而要在 45 分钟内形成完整且有深度的推理闭环。
    - 这套框架最重要的价值，不是让所有候选人画出同一张图，而是把一场不可预测的开放讨论变成可管理的过程：先确保问题正确，再确保全局完整，然后证明关键部分可行，最后诚实地说明风险与演进。
  takeaways:
  - 技术、沟通、压力和适应能力共同构成信号。
  - 开放题没有唯一答案，但有明确约束。 方案必须满足双方约定的需求、规模和优先级。
  - 谁使用？Web、Mobile 还是内部服务？
  - 是否避免无关细节并保留收尾时间？
  - 这套框架最重要的价值，不是让所有候选人画出同一张图，而是把一场不可预测的开放讨论变成可管理的过程：先确保问题正确，再确保全局完整，然后证明关键部分可行，最后诚实地说明风险与演进。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「12.1 框架与模板答案」？
  answer: 同一框架可设计短链、聊天、网盘；最终架构不会相同。
  source_heading: 12.1 框架与模板答案
- level: 概念辨析
  question: 原文如何解释「12.5 Think aloud 与无过滤独白」？
  answer: 前者报告假设、比较和决定；后者输出所有零散念头。结构化思考更容易被跟踪。
  source_heading: 12.5 Think aloud 与无过滤独白
- level: 概念辨析
  question: 原文如何解释「12.9 简单设计与幼稚设计」？
  answer: 简单设计包含满足当前需求所需的机制，并明确演进路径；幼稚设计忽略已知规模和故障。避免过度设计不等于忽略问题。
  source_heading: 12.9 简单设计与幼稚设计
- level: 概念辨析
  question: 原文如何解释「12.12 反向时间排序与个性化排序」？
  answer: 原章明确选择前者，因此 EdgeRank 不属于本次范围。
  source_heading: 12.12 反向时间排序与个性化排序
- level: 概念辨析
  question: 原文如何解释「12.16 真实公司架构与面试设计」？
  answer: 真实系统受历史、组织和迁移约束，未必是理论最优；面试设计只需在约定条件下合理。不要靠猜内部实现替代推理。
  source_heading: 12.16 真实公司架构与面试设计
