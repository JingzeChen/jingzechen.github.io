    source_heading: 12. 其他常见限流算法（背景补充）
  - term: 13.4 Atomic get-and-increment / CAS
    meaning: 如果先 increment 后发现超 quota，被拒 request 是否计入 usage，要明确定义。
    source_heading: 13.4 Atomic get-and-increment / CAS
  - term: 19. 预分配最大用户 slots
    meaning: 预分配 maximum supported users 的 empty config slots。即使当前 users 少，dump size/work
