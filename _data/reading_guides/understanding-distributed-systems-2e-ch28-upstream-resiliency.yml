checks:
- level: 概念辨析
  question: 原文如何解释「22.1 Load shedding 与 rate limiting」？
  answer: Shedding 看本地 saturation；rate limiting 看主体 global quota。一个返回 503，一个常返回 429。
  source_heading: 22.1 Load shedding 与 rate limiting
- level: 概念辨析
  question: 原文如何解释「22.7 Atomic increment 与 transaction」？
  answer: Atomic increment 可避免 lost update，但不自动实现复杂多 quota、check-and-reserve 或跨 key
    invariant。
  source_heading: 22.7 Atomic increment 与 transaction
- level: 概念辨析
  question: 原文如何解释「23.2 “接受后排队不会丢”」？
  answer: Deadline 到期后 work 无价值，queue 占 memory并触发 retry。Bound queue。
  source_heading: 23.2 “接受后排队不会丢”
- level: 概念辨析
  question: 原文如何解释「23.11 “Read-modify-write counter 足够”」？
  answer: 并发 lost update。用 atomic increment/CAS/transaction。
  source_heading: 23.11 “Read-modify-write counter 足够”
- level: 概念辨析
  question: 原文如何解释「23.17 “Corrupt full dump 会全站坏”」？
  answer: Data plane 应先验证、保留 LKG；下一周期 full snapshot自愈。
  source_heading: 23.17 “Corrupt full dump 会全站坏”
