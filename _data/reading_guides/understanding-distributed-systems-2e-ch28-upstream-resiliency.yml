    source_heading: 19. 预分配最大用户 slots
  - term: 28. 一般化的解决问题方法
    meaning: Edge过滤粗恶意流量，gateway按keyquota，service按local saturation，handler按downstream
      pool。
    source_heading: 28. 一般化的解决问题方法
