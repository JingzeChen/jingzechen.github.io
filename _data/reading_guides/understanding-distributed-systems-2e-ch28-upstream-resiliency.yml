  minutes: 10
  question: 原文围绕「0. 本章定位：下游保护解决“我调用谁”，上游保护解决“谁在压我”」建立了怎样的核心认识？
  question_source: 0. 本章定位：下游保护解决“我调用谁”，上游保护解决“谁在压我”
  thesis: Shedding基于process local saturation；rate limiting基于global per-principalusage，后者需coordination。
  thesis_source: 27. 核心结论
  concepts:
  - term: 0. 本章定位：下游保护解决“我调用谁”，上游保护解决“谁在压我”
    meaning: 四者可组合：quota 限制公平份额，local shedding 保护当前实例，queue 吸收允许异步的短峰值，constant-work
      路径消除极端 mode。
    source_heading: 0. 本章定位：下游保护解决“我调用谁”，上游保护解决“谁在压我”
  - term: 6. 28.3 Rate-limiting
    meaning: Quota 可对应付费 tier：使用更多资源的 users 支付更多。需要可靠 resource attribution、billing/audit，不能只按易伪造
