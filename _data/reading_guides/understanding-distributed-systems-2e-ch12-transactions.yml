checks:
- level: 概念辨析
  question: 原文如何解释「26.1 Atomicity 与 isolation」？
  answer: Atomicity 解决 partial failure；isolation 解决 concurrent interference。一个事务可
    atomic 但与另一个产生 write skew。
  source_heading: 26.1 Atomicity 与 isolation
- level: 概念辨析
  question: 原文如何解释「26.4 Serializability 与 strict serializability」？
  answer: Serializable 只需等价某串行顺序；strict 还尊重事务实际完成/开始的 real-time order。
  source_heading: 26.4 Serializability 与 strict serializability
- level: 概念辨析
  question: 原文如何解释「26.7 MVCC 与 serializability」？
  answer: MVCC 是多版本框架，不自动保证 serializability。Snapshot isolation 可能允许 write skew；writers
    仍需 2PL/OCC/SSI 等。
  source_heading: 26.7 MVCC 与 serializability
- level: 概念辨析
  question: 原文如何解释「26.9 Prepare success 与 commit success」？
  answer: YES 只表示 participant 已 durable prepared、承诺服从未来决定；transaction 尚未 commit，locks
    通常仍持有。
  source_heading: 26.9 Prepare success 与 commit success
- level: 概念辨析
  question: 原文如何解释「26.12 TrueTime 与精确时钟」？
  answer: TrueTime 的价值是显式返回 uncertainty interval，而不是假装时钟无误差；commit wait 把时间不确定性转化为
    latency。
  source_heading: 26.12 TrueTime 与精确时钟
