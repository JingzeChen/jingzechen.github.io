overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章定位：把一组可能部分失败的操作包装成一个可靠整体」建立了怎样的核心认识？
  question_source: 0. 本章定位：把一组可能部分失败的操作包装成一个可靠整体
  thesis: 2PL 用 shared/exclusive locks 和 growing/shrinking phases 保证 conflict serializability。
    Strict 2PL 持锁到结束，避免 cascading abort。
  thesis_source: 28. 核心结论
  concepts:
  - term: 0. 本章定位：把一组可能部分失败的操作包装成一个可靠整体
    meaning: NewSQL 再把这些层与 partitioning、state machine replication 和分布式时间组合。
    source_heading: 0. 本章定位：把一组可能部分失败的操作包装成一个可靠整体
  - term: 6. Two-phase locking（2PL）
    meaning: 遵守 2PL 可保证 conflict serializability。原章把它概括为 strict serializability；更精确地说，普通
      2PL 主要保证 conflict serializability，是否满足 strict schedule 和 real-time external
      order还取决于锁释放规则与系统语义。
    source_heading: 6. Two-phase locking（2PL）
  - term: 13.2 Phase 1：prepare / voting
    meaning: 检查 constraints/locks/resources；
    source_heading: 13.2 Phase 1：prepare / voting
  - term: 14.2 Coordinator decision
    meaning: coordinator durable 写下 COMMIT/ABORT 后不能改变。即使某 participant 暂时 down，也必须持续重发同一
      decision。
    source_heading: 14.2 Coordinator decision
  - term: 21. Replicated coordinator 与 participants
    meaning: participant 同样把 PREPARED/decision 写进本组 replicated log。新 leader 恢复本 participant
      职责。
    source_heading: 21. Replicated coordinator 与 participants
  - term: 29. 从本章提炼出的通用解题方法
    meaning: 计算 lock hold time、prepare/decision RTT、WAL fsync、quorum replication、abort
      rate 与 commit wait；跨地域事务尤需控制参与 partitions。
    source_heading: 29. 从本章提炼出的通用解题方法
