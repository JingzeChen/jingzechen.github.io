overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. ADP：无环依赖原则」建立了怎样的核心认识？
  question_source: 1. ADP：无环依赖原则
  thesis: 系统既需要稳定核心，也需要易变外层，并非所有组件都应稳定。
  thesis_source: 本章总结
  concepts:
  - term: 1. ADP：无环依赖原则
    meaning: 原书图示：Figure 14.1：典型无环组件图 Figure 14.1 展示了由 Main、View、Presenters、Interactors、Entities、Database、Controllers
      和 Authorizer 等组件组成的系统。
    source_heading: 1. ADP：无环依赖原则
  - term: 3. SDP：稳定依赖原则
    meaning: 但另一个名为 Stable 的组件依赖 Flexible。由于 Stable 自己又被许多组件依赖，Flexible 的任何变化都必须考虑
      Stable 及其依赖者。
    source_heading: 3. SDP：稳定依赖原则
  - term: 6.6 第六步：检查每条箭头的稳定方向
    meaning: 如果 B 明天改变，A 及其依赖者要付出什么？
    source_heading: 6.6 第六步：检查每条箭头的稳定方向
  - term: 8.1 ADP 检查清单
    meaning: 测试一个组件是否被迫加载整个系统？
    source_heading: 8.1 ADP 检查清单
  - term: 8.6 场景判断一：三个包形成环
    meaning: 判断： 仍违反 ADP。三个包在发布、测试和演进上形成一个强连通整体，应倒置依赖或重新划分组件。
    source_heading: 8.6 场景判断一：三个包形成环
  - term: 本章总结
    meaning: 本章最终方法是：消除环、让依赖指向稳定、用抽象支撑稳定，并用度量持续观察而非代替判断。
    source_heading: 本章总结
  logic:
  - 1. ADP：无环依赖原则
  - 3. SDP：稳定依赖原则
  - 5.4 与前面章节的联系
  - 8.1 ADP 检查清单
  - 8.3 SDP 检查清单
  - 8.9 场景判断四：外层组合根 Fan-out 很高
  - 本章总结
  sections:
  - title: 1. ADP：无环依赖原则
    source_heading: 1. ADP：无环依赖原则
    paragraphs:
    - 原书图示：Figure 14.1：典型无环组件图 Figure 14.1 展示了由 Main、View、Presenters、Interactors、Entities、Database、Controllers
      和 Authorizer 等组件组成的系统。
    - Presenters 团队要测试自己的组件，只需准备它直接或间接依赖的已发布版本，例如 Interactors 与 Entities。
    - 环出现后，Entities、Authorizer 和 Interactors 看似仍是三个文件或三个包，实际上却必须使用彼此完全兼容的版本。
    - 原书图示：Figure 14.3 与 Figure 14.4：打破依赖环第一种方法是使用第 11 章的 Dependency Inversion Principle。
  - title: 2.5 “不能自顶向下”不等于“不做前期架构”
    source_heading: 2.5 “不能自顶向下”不等于“不做前期架构”
    paragraphs:
    - 作者反对的是把尚无事实支持的组件依赖图当成永久功能分解，而不是反对架构思考。
    - 好的初始架构应当明确方向和约束，同时允许组件边界根据共同变化、复用和构建事实调整。
  - title: 3. SDP：稳定依赖原则
    source_heading: 3. SDP：稳定依赖原则
    paragraphs:
    - 原书图示：Figure 14.5 与 Figure 14.6：稳定和不稳定组件 Figure 14.5 中，三个外部组件依赖 X，而 X 不依赖任何其他组件。
    - 若一个组件既没有进入依赖也没有离开依赖，分母为零，指标无法按原方法解释。它可能是孤立组件、未接入代码或独立入口，应单独检查，而不是强行赋分。
    - 原书图示：Figure 14.9 至 Figure 14.11：SDP 违规与修复原书假设有一个名为 Flexible 的组件，团队希望它容易变化。
    - 但另一个名为 Stable 的组件依赖 Flexible。由于 Stable 自己又被许多组件依赖，Flexible 的任何变化都必须考虑 Stable
      及其依赖者。
  - title: 5.4 与前面章节的联系
    source_heading: 5.4 与前面章节的联系
    paragraphs:
    - REP 为按版本使用组件提供发布基础；
    - DIP 可以反转箭头、打破环并保护高层策略；
    - OCP 让稳定组件通过扩展而非修改演进；
    - ISP 帮助稳定抽象保持面向客户端的合理粒度。
  - title: 6.6 第六步：检查每条箭头的稳定方向
    source_heading: 6.6 第六步：检查每条箭头的稳定方向
    paragraphs:
    - 如果 B 明天改变，A 及其依赖者要付出什么？
    - 这条边是否让一个本应灵活的组件变得难改？
    - 是否应由 Adapter 实现高层 Port？
  - title: 8.1 ADP 检查清单
    source_heading: 8.1 ADP 检查清单
    paragraphs:
    - 测试一个组件是否被迫加载整个系统？
    - 是否真的存在值得提取的新共享组件？
  - title: 8.3 SDP 检查清单
    source_heading: 8.3 SDP 检查清单
    paragraphs:
    - 哪些组件希望稳定，哪些希望易变？
    - Fan-in 与 Fan-out 是否符合设计意图？
    - 是否有稳定核心依赖具体 UI、数据库或框架？
    - 某个易变组件是否被高责任组件钉住？
  - title: 8.6 场景判断一：三个包形成环
    source_heading: 8.6 场景判断一：三个包形成环
    paragraphs:
    - A 依赖 B，B 依赖 C，C 又依赖 A。构建工具目前仍能一次编译成功。
    - 判断： 仍违反 ADP。三个包在发布、测试和演进上形成一个强连通整体，应倒置依赖或重新划分组件。
  - title: 8.9 场景判断四：外层组合根 Fan-out 很高
    source_heading: 8.9 场景判断四：外层组合根 Fan-out 很高
    paragraphs:
    - 启动组件依赖数据库 Adapter、Web 服务器、日志和应用用例，却没有其他组件依赖它。
    - 判断： 这可以是合理的不稳定具体组件。它位于最外层，本来就负责装配细节。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 周构建把冲突推迟到集中集成日，项目增长后会产生越来越高的集成成本。
    - 可以用稳定接口组件倒置这条依赖，让具体 Flexible 实现依赖抽象。
    - SDP 与 SAP 结合后，组件依赖自然指向抽象，形成组件层 DIP。
    - 本章最终方法是：消除环、让依赖指向稳定、用抽象支撑稳定，并用度量持续观察而非代替判断。
  takeaways:
  - 第 14 章讨论组件之间的耦合关系。
  - 依赖环会让环中组件必须使用彼此兼容的版本，效果上熔成一个大组件。
  - 本章重点度量组件在依赖图中的位置稳定性。
  - SAP 要求组件的抽象程度与稳定程度相匹配。
  - 本章最终方法是：消除环、让依赖指向稳定、用抽象支撑稳定，并用度量持续观察而非代替判断。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 “无环就代表架构良好”」？
  answer: 错误。DAG 只保证构建顺序存在。依赖仍可能指向易变细节，组件也可能稳定而具体。
  source_heading: 7.1 “无环就代表架构良好”
- level: 概念辨析
  question: 原文如何解释「7.5 “解决环最简单的方法就是新建 shared 包”」？
  answer: 危险。共享包可能迅速成为无主题组件并形成新环。应先判断是需要 DIP，还是确有独立共享概念。
  source_heading: 7.5 “解决环最简单的方法就是新建 shared 包”
- level: 概念辨析
  question: 原文如何解释「7.9 “Fan-in 高说明代码质量高”」？
  answer: 错误。它只说明依赖者多、位置更稳定。一个糟糕的全局组件也可能有很高 Fan-in。
  source_heading: 7.9 “Fan-in 高说明代码质量高”
- level: 概念辨析
  question: 原文如何解释「7.14 “稳定组件应该全部是接口”」？
  answer: 不必绝对化。组件可以同时包含稳定策略与抽象。SAP 要求抽象程度与稳定程度相称，而非所有稳定组件纯抽象。
  source_heading: 7.14 “稳定组件应该全部是接口”
- level: 概念辨析
  question: 原文如何解释「7.20 “动态语言完全不需要抽象组件”」？
  answer: 原书强调动态类型可以减少声明依赖，但现代动态语言仍可能使用 Protocol 或抽象模块。是否需要取决于团队的类型与边界策略。
  source_heading: 7.20 “动态语言完全不需要抽象组件”
