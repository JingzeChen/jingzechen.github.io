overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 导读：第七章要解决的核心问题」建立了怎样的核心认识？
  question_source: 0. 导读：第七章要解决的核心问题
  thesis: 稀缺并非虚假信号。它可能真实反映机会成本、收藏价值和未来可得性；问题在于人会把这些价值扩散到口味、性能、关系质量和观点真实性。最关键的能力是把“它快没了”与“它适合我”拆成两个问题。
  thesis_source: 55. 原书核心结论与笔记延伸
  concepts:
  - term: 0. 导读：第七章要解决的核心问题
    meaning: 本章同时使用个人经历、控制实验、现场销售观察、历史统计、政策案例、作者家庭案例和读者报告。笔记会分别标明证据类型，不用单个轶事推断普遍发生率，也不把笔记模型写成原书公式。
    source_heading: 0. 导读：第七章要解决的核心问题
  - term: 12. “可怕的两岁”：自由意识何时开始明显表现
    meaning: 作者注说明，本次实验中，两岁女孩面对较高物理屏障没有表现出与男孩相同的逆反。但其他研究表明，女孩并非不反抗自由限制，而是更主要地反抗来自他人的限制，对物理障碍的逆反较弱。
    source_heading: 12. “可怕的两岁”：自由意识何时开始明显表现
  - term: 25. 进口牛肉现场实验：标准、短缺与双重稀缺
    meaning: 作者一名曾经的学生经营成功的牛肉进口公司，回校学习市场营销。他决定让公司销售员在正常业务中检验信息稀缺。
    source_heading: 25. 进口牛肉现场实验：标准、短缺与双重稀缺
  - term: 31. 家庭中的新近稀缺：规则前后不一为何最容易引发反叛
    meaning: 作者说明，避免逆反不要求父母对规则毫不通融。例如孩子经常错过午餐，晚餐前提供一份饭前点心可以被解释为合理例外，不必建立随时吃零食的自由。
    source_heading: 31. 家庭中的新近稀缺：规则前后不一为何最容易引发反叛
  - term: 42.2 两步防御
    meaning: 冷静后区分想要的是占有价值还是使用价值。
    source_heading: 42.2 两步防御
  - term: 57. 快速复习清单
    meaning: 先停，再验；分清占有与使用；不因别人争抢改变功能标准，不因机会将失就突破预设上限。
    source_heading: 57. 快速复习清单
