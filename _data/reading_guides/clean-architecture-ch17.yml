  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: ReSharper 源码依赖 Visual Studio，Visual Studio 核心不依赖 ReSharper。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 第 16 章进一步说明：系统既要按层水平解耦，也要按用例垂直解耦，同时把源码级、部署级和服务级作为可演化的模式。
    source_heading: 本章导读
