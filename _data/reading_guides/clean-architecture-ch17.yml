  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 17 章首页第 15 章提出：好的架构要把策略与细节分离，并尽可能推迟细节决策。
    - 第 16 章进一步说明：系统既要按层水平解耦，也要按用例垂直解耦，同时把源码级、部署级和服务级作为可演化的模式。
    - 公司 P 和 W 过早锁定分布式三层与 SOA 工具，付出巨大人力成本；
    - 边界应画在变化轴上。因不同原因、以不同速度变化的内容，应被边界分开；依赖箭头应指向更重要、更稳定的业务策略。
  - title: 1.6 架构师要降低什么成本
    source_heading: 1.6 架构师要降低什么成本
    paragraphs:
    - 许多开发者要处理与业务无关的问题；
    - 失败和部署复杂性扩散到所有用例。
  - title: 3.4 这不意味着总应自己写基础设施
    source_heading: 3.4 这不意味着总应自己写基础设施
    paragraphs:
    - 自己编写 Web Server 在 FitNesse 的约束下成本较低、收益明确。
    - 原书案例说明的是“用最小机制推迟昂贵框架决定”，不是“永远不要采用成熟基础设施”。
  - title: 4.1 在重要与不重要之间画线
    source_heading: 4.1 在重要与不重要之间画线
    paragraphs:
    - GUI 对业务规则不重要，因此二者之间要有边界；
    - 数据库对 GUI 不重要，因此二者之间要有边界；
    - 数据库对业务规则不重要，因此二者之间要有边界。
  - title: 5. What About Input and Output?：输入输出不是系统本体
    source_heading: 5. What About Input and Output?：输入输出不是系统本体
    paragraphs:
    - 原书图示：Figure 17.4：GUI 与 BusinessRules 的边界 Figure 17.4 中，GUI 组件的源码依赖指向 BusinessRules。
    - 替换并非总是零成本，因为不同界面需要不同交互模型。但核心规则不应被整体重写。
    - HTML View Model；
    - 数据库记录和 GUI View Model 不应因为字段暂时相同就被视为同一模型。
  - title: 7.4 为什么希望业务规则处于被依赖一侧
    source_heading: 7.4 为什么希望业务规则处于被依赖一侧
    paragraphs:
    - 数据库 Schema 变化不破坏业务规则；
    - Web 框架升级不破坏业务规则；
  - title: 9. 什么时候不需要完整边界
    source_heading: 9. 什么时候不需要完整边界
    paragraphs:
    - 一次性迁移脚本、探索性原型或极小工具，可能没有足够生命周期回报边界成本。
    - 边界先控制源码依赖。只有当独立部署、伸缩或故障隔离有真实需求时，才升级物理模式。
  - title: 12.1 过早决策检查
    source_heading: 12.1 过早决策检查
    paragraphs:
    - 当前锁定了哪些数据库、框架和部署拓扑？
    - 每个业务功能要承担多少技术机制？
    - 若需求永远不出现，团队会长期支付什么？
  - title: 12.7 场景判断一：单机应用通过网络分三层
    source_heading: 12.7 场景判断一：单机应用通过网络分三层
    paragraphs:
    - 所有组件运行在同一服务器，却为未来集群进行大量序列化和 Socket 通信，且没有扩展压力。
    - 判断： 与公司 P 类似，物理模式被过早锁定。应保留逻辑边界，并评估回到进程内通信。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - FitNesse 由 Robert C. Martin 与 Micah 于 2001 年开始开发，用 Wiki 包装 FIT。
    - 边界画在实现关系上，接口位于 BusinessRules 一侧，具体实现在 Database 一侧。
    - GUI 依赖 BusinessRules，因此 Web、Desktop、Console 等入口可以成为插件。
    - ReSharper 源码依赖 Visual Studio，Visual Studio 核心不依赖 ReSharper。
  takeaways:
  - 第 17 章把软件架构描述为画边界线的艺术。
  - 三个进程开发时只运行在同一机器，却仍承担序列化、Socket、超时和重试成本。
  - GUI 与业务规则、数据库与 GUI、数据库与业务规则之间都应考虑边界。
  - 这种不对称关系说明被依赖的核心对插件变化具有免疫力。
  - 本章最终方法是：在变化轴上画线，让低层插件依赖高层核心，并以此推迟不必要的技术决定。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.1 “三层就是架构”」？
  answer: 不准确。三层描述拓扑或组织方式。若业务对象被通信机制深度绑定，它仍可能是糟糕架构。
  source_heading: 11.1 “三层就是架构”
- level: 概念辨析
  question: 原文如何解释「11.6 “数据库就是业务规则的化身”」？
  answer: 错误。数据库保存状态并执行查询，但业务政策不应依赖具体 Schema 与查询语言。
  source_heading: 11.6 “数据库就是业务规则的化身”
- level: 概念辨析
  question: 原文如何解释「11.8 “GUI 就是系统”」？
  answer: 错误。GUI 是用户与核心模型交互的插件。模型应能在没有具体 GUI 时执行和测试。
  source_heading: 11.8 “GUI 就是系统”
- level: 概念辨析
  question: 原文如何解释「11.15 “推迟决策就是先写 Stub，永远不做持久化”」？
  answer: 错误。FitNesse 在需要时依次采用内存与文件实现，并根据证据关闭数据库选项。
  source_heading: 11.15 “推迟决策就是先写 Stub，永远不做持久化”
- level: 概念辨析
  question: 原文如何解释「11.20 “插件只能由第三方编写”」？
  answer: 错误。插件描述依赖结构，同一个团队内部的数据库和 GUI 组件也可以是插件。
  source_heading: 11.20 “插件只能由第三方编写”
