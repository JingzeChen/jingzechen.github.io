    meaning: 数据库 Schema 变化不破坏业务规则；
    source_heading: 7.4 为什么希望业务规则处于被依赖一侧
  - term: 12.1 过早决策检查
    meaning: 当前锁定了哪些数据库、框架和部署拓扑？
    source_heading: 12.1 过早决策检查
  - term: 本章总结
    meaning: FitNesse 由 Robert C. Martin 与 Micah 于 2001 年开始开发，用 Wiki 包装 FIT。
