overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 将每个四音 chord 展成 note sequence，加入 SOS token，把音高映射为 48 类；训练 causal seq-to-seq
    next-note classifier。官方 Conv1d+LSTM 模型 5 epochs 测试 accuracy 约 0.8254。
  thesis_source: 19. 章末练习与参考答案
  concepts:
  - term: 本章要解决什么问题
    meaning: 如何缓解长序列中的梯度不稳定和短期记忆，并何时改用 1D CNN？
    source_heading: 本章要解决什么问题
  - term: 4. Training RNNs
    meaning: 长 Jacobian 乘积导致消失/爆炸。若每个时间步都有 loss，早期层收到更短的梯度路径，这也是 seq2seq supervision
      常更易训练的原因。
    source_heading: 4. Training RNNs
  - term: 11. Forecasting Multivariate Time Series
    meaning: 官方多变量单 rail MAE 约 23,227；联合预测 rail/bus MAE 约 26,441/26,178。
    source_heading: 11. Forecasting Multivariate Time Series
  - term: 12. Forecasting Several Time Steps Ahead
    meaning: 优点是只训练一个单步模型；缺点是 exposure bias 和 error accumulation：训练看到真值历史，推理看到自己的有误预测。适合短
      horizon。
    source_heading: 12. Forecasting Several Time Steps Ahead
  - term: 17. Using 1D Convolutions to Process Sequences
    meaning: Kernel 学局部短模式；stride 下采样缩短 RNN 时间长度，使同样 recurrent steps 覆盖更长原始历史。
    source_heading: 17. Using 1D Convolutions to Process Sequences
  - term: 工程能力
    meaning: 能处理 known-future exogenous features
    source_heading: 工程能力
  logic:
  - 本章要解决什么问题
