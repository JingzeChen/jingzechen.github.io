overview:
  kind: summary
  minutes: 8
  question: 0. 本章路线：一枚 token 是怎样生成的？
  question_source: 0. 本章路线：一枚 token 是怎样生成的
  thesis: 迁移时并非把文本 tokenizer 原样套用，而是重新定义 token、位置结构、mask、训练目标和模态接口。Transformer 也不是所有场景的唯一答案；状态空间模型、卷积、循环网络和混合架构会在长序列、流式处理或边缘设备上提供不同取舍。
  thesis_source: 2. Transformer 架构的近期改进（Recent Improvements to the Transformer Architecture）
  concepts:
  - term: 0. 本章路线：一枚 token 是怎样生成的
    meaning: 前馈网络（feedforward network，FFN/MLP）：逐位置变换取回后的表示，提供大量参数容量。
    source_heading: 0. 本章路线：一枚 token 是怎样生成的
  - term: 1. Transformer 模型总览（An Overview of Transformer Models）
    meaning: 原章在 T4 上给出生成 100 token 时启用 cache 约 4.5 秒、关闭约 21.8 秒。该数字只说明量级差异，实际结果受模型、后端、量化、批量、上下文、GPU
      和库版本影响。
    source_heading: 1. Transformer 模型总览（An Overview of Transformer Models）
  - term: 2. Transformer 架构的近期改进（Recent Improvements to the Transformer Architecture）
    meaning: 迁移时并非把文本 tokenizer 原样套用，而是重新定义 token、位置结构、mask、训练目标和模态接口。Transformer
      也不是所有场景的唯一答案；状态空间模型、卷积、循环网络和混合架构会在长序列、流式处理或边缘设备上提供不同取舍。
    source_heading: 2. Transformer 架构的近期改进（Recent Improvements to the Transformer
      Architecture）
  - term: 4. 总结（Summary）
    meaning: 本章最重要的方法论，是把“LLM 会回答问题”拆回一系列有形的张量变换与系统取舍。只有分清模型数学、生成算法和硬件实现三个层次，才能判断一个改进究竟提升了表达能力、改变了输出分布，还是仅仅让相同计算跑得更快。
    source_heading: 4. 总结（Summary）
  logic:
  - 0. 本章路线：一枚 token 是怎样生成的
  - 1. Transformer 模型总览（An Overview of Transformer Models）
  - 2. Transformer 架构的近期改进（Recent Improvements to the Transformer Architecture）
  - 4. 总结（Summary）
  sections:
  - title: 0. 本章路线：一枚 token 是怎样生成的
    source_heading: 0. 本章路线：一枚 token 是怎样生成的
    paragraphs:
    - 注意力（attention）：让当前位置从其他可见位置取回相关信息。
    - 前馈网络（feedforward network，FFN/MLP）：逐位置变换取回后的表示，提供大量参数容量。
    - 自回归解码无法跨未来 token 并行。
    - KV cache、激活和权重持续争夺有限的显存带宽与容量。
  - title: 1. Transformer 模型总览（An Overview of Transformer Models）
    source_heading: 1. Transformer 模型总览（An Overview of Transformer Models）
    paragraphs:
    - 这种把自身先前输出作为后续输入条件的模型称为自回归模型（autoregressive model）。BERT 一类表示模型通常同时编码已知序列，不以同样方式逐
      token 生成，因而不能把“所有 Transformer”都等同于自回归模型。
    - 把 token 想成“各自一条流”有助于理解张量并行，但这些流不是互相独立：每个 block 的 attention 都让当前位置读取其他可见位置。FFN
      才是逐位置独立应用同一组参数。
    - 原章在 T4 上给出生成 100 token 时启用 cache 约 4.5 秒、关闭约 21.8 秒。该数字只说明量级差异，实际结果受模型、后端、量化、批量、上下文、GPU
      和库版本影响。
    - 原始基础模型可能直接续写 “Redemption”；经过指令微调和偏好对齐的聊天模型则可能解释电影信息。后训练改变了交互行为，不能把聊天产品输出当作纯预训练目标的直接表现。
  - title: 2. Transformer 架构的近期改进（Recent Improvements to the Transformer Architecture）
    source_heading: 2. Transformer 架构的近期改进（Recent Improvements to the Transformer
      Architecture）
    paragraphs:
    - GQA 能由 MHA checkpoint 适配，但共享并非完全免费：多个 query heads 读取相同 K/V，减少了键值表示的多样性。具体质量差异要靠模型规模、训练和任务评测，而不能只从公式断言。
    - 它计算的是精确 attention，不是稀疏、低秩或近似 attention；浮点运算顺序不同可能产生微小舍入差异。其优势主要是更少 HBM 读写、更低中间显存和更高
      GPU 利用率，而不是把理论全注意力连接改成另一种语义。
    - 若不加入位置信息，同时交换 X 的两行，Q/K/V 也会相应交换；attention 只看内容匹配，无法区分 “dog bites man” 与 “man
      bites dog” 的顺序。因此必须注入位置。
    - 迁移时并非把文本 tokenizer 原样套用，而是重新定义 token、位置结构、mask、训练目标和模态接口。Transformer 也不是所有场景的唯一答案；状态空间模型、卷积、循环网络和混合架构会在长序列、流式处理或边缘设备上提供不同取舍。
  - title: 4. 总结（Summary）
    source_heading: 4. 总结（Summary）
    paragraphs:
    - 主路径是 tokenizer → embeddings → Transformer blocks → LM head → decoding。
    - 现代 block 常使用 Pre-Norm、RMSNorm、SwiGLU、GQA 与 RoPE，但基本的 attention + FFN + residual
      骨架未变。
    - 区分算法与实现优化：稀疏 attention 改连接，GQA 改 K/V 共享，FlashAttention 改硬件执行。
    - 本章最重要的方法论，是把“LLM 会回答问题”拆回一系列有形的张量变换与系统取舍。只有分清模型数学、生成算法和硬件实现三个层次，才能判断一个改进究竟提升了表达能力、改变了输出分布，还是仅仅让相同计算跑得更快。
  takeaways:
  - KV cache、激活和权重持续争夺有限的显存带宽与容量。
  - 原始基础模型可能直接续写 “Redemption”；经过指令微调和偏好对齐的聊天模型则可能解释电影信息。后训练改变了交互行为，不能把聊天产品输出当作纯预训练目标的直接表现。
  - 迁移时并非把文本 tokenizer 原样套用，而是重新定义 token、位置结构、mask、训练目标和模态接口。Transformer 也不是所有场景的唯一答案；状态空间模型、卷积、循环网络和混合架构会在长序列、流式处理或边缘设备上提供不同取舍。
  - 本章最重要的方法论，是把“LLM 会回答问题”拆回一系列有形的张量变换与系统取舍。只有分清模型数学、生成算法和硬件实现三个层次，才能判断一个改进究竟提升了表达能力、改变了输出分布，还是仅仅让相同计算跑得更快。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「3.1 Forward pass 不等于生成完整回答」？
  answer: 一次 forward pass 对已有序列产生各位置 logits；自回归生成需要多轮 forward/decode。
  source_heading: 3.1 Forward pass 不等于生成完整回答
- level: 概念辨析
  question: 原文如何解释「3.4 Token 并行不等于生成并行」？
  answer: 训练和 prefill 可同时处理多个已知位置；decode 的未来 token 尚不存在，必须逐步生成。推测解码等技术可以并行验证候选，但不改变最终依赖约束。
  source_heading: 3.4 Token 并行不等于生成并行
- level: 概念辨析
  question: 原文如何解释「3.7 Attention 与 FFN 不是“理解”和“知识”的绝对分工」？
  answer: Attention 擅长跨位置路由，FFN 提供逐位置容量，但最终行为分布在嵌入、层、残差路径和训练目标中。不能把事实精确定位为某个单一神经元或
    block。
  source_heading: 3.7 Attention 与 FFN 不是“理解”和“知识”的绝对分工
- level: 概念辨析
  question: 原文如何解释「3.10 FlashAttention 不是近似注意力」？
  answer: 它用分块和 online softmax 减少 GPU 内存 IO，保持全注意力数学定义。名字中的 “Flash” 不表示只关注少数 token。
  source_heading: 3.10 FlashAttention 不是近似注意力
- level: 概念辨析
  question: 原文如何解释「3.13 Base model 与 chat model 输出不同」？
  answer: 基础模型主要续写；聊天模型经过指令与偏好后训练。看到解释性长回答，不应据此误判预训练目标本身就是问答。
  source_heading: 3.13 Base model 与 chat model 输出不同
