  sections:
  - title: 0. 学习目标与全篇主线
    source_heading: 0. 学习目标与全篇主线
    paragraphs:
    - 为什么“应该用什么模型”“多久重训一次”等问题不能脱离场景直接回答？
    - 为什么改变一个局部组件，往往会牵动数据、评估、基础设施、组织和业务目标？
    - 十一章如何映射到项目立项、数据准备、模型开发、部署、监控、持续更新和组织协作？
    - 一句话概括：这不是一本告诉读者“唯一正确架构”的书，而是一本训练读者根据目标、数据、约束和利益相关者做系统级判断的书。
  - title: 2. 机器学习系统为何既复杂又独特
    source_heading: 2. 机器学习系统为何既复杂又独特
    paragraphs:
    - 因此，机器学习系统是一个社会技术系统：技术组件的行为与组织责任、激励和社会后果不可完全分离。原文只明确说明人的一面不可缺失，并指出第 11 章是末章；从学习路径看，本笔记可以把这种安排理解为：在理解完整技术链路后，再集中审视谁构建系统、谁承受影响、谁负责。
    - 训练有效通常隐含一个关键前提：训练样本与部署时的数据分布足够接近。二者不一致时，即使训练和测试代码完全没有 bug，生产效果也可能下降。这解释了为什么数据分布变化是系统级问题，而不只是模型算法问题。
    - 模型架构差异不是任意偏好，而是由数据密度、时效、动作空间和错误代价共同推导出来。指标也不能互换：公司 A 的点击提升可能是有效代理，公司 B 若只优化点击，可能推荐了用户爱看却不能采购的商品。
    - 因此，不能简单假定预测质量提高就一定会带来业务价值提升。系统设计的目标不是让每个局部指标分别达到最高，而是在硬约束下找到可运行、可维护、能产生净价值的整体方案。
  - title: 3. 作者如何形成答案：案例、证据、评审与反馈
    source_heading: 3. 作者如何形成答案：案例、证据、评审与反馈
    paragraphs:
    - 既然系统具有上下文依赖性，作者就不能用一个标准架构回答所有问题。她选择提供“有细微差别的答案”：说明方案适用的条件、收益、代价和关联影响。
    - 这反映出一个可迁移的方法：跨边界系统不能只由单一角色凭经验完成审查。 数据语义、模型统计、分布式运行、产品目标和社会影响需要不同知识共同约束。
    - 作者最初认为，课程讲义是为学生准备的，帮助他们应对未来数据科学家和机器学习工程师的工作要求。很快她发现，自己也在写作中学到了很多。
    - 作者希望书出版后，这个学习循环继续运行，因为每位读者拥有作者没有的经验与视角。她给出了 MLOps Discord、Twitter、LinkedIn 和个人网站等反馈渠道。这段话不仅是社群邀请，也说明复杂系统知识应被视为可修订的共同实践，而不是封闭的最终答案。
  - title: 5. What This Book Is Not：本书不是什么
    source_heading: 5. What This Book Is Not：本书不是什么
    paragraphs:
    - 逻辑回归先计算线性打分，再通过 sigmoid 把结果建模为条件概率。仅仅落在 0 到 1 区间并不足以赋予一个数概率语义；输出与真实发生频率是否一致，还取决于数据、模型设定、拟合和概率校准。逻辑回归常是重要基线：若复杂模型不能在可信评估上稳定超过它，就没有理由承担额外复杂度。
    - 矩阵分解式协同过滤常把用户和物品映射到低维向量，以向量匹配程度表示潜在偏好。但观测交互并不是随机样本：用户只能点击被曝光的商品，因此模型容易把既有曝光政策误认为自然偏好。
    - ROC-AUC 可解释为随机抽取一个正例和一个负例时，模型把正例排在负例之前的概率。严重类别不平衡时，还应检查 Precision–Recall 曲线和具体业务阈值。
    - 取对数利用了严格单调性：最大化似然与最大化对数似然得到相同最优点，同时把连乘变成连加，改善数值稳定性。前提是概率模型与独立性假设合理；较高似然也不自动代表更高业务价值。
  - title: 7. GitHub Repository and Community：配套资源与社区
    source_heading: 7. GitHub Repository and Community：配套资源与社区
    paragraphs:
    - 本书参考资料及其他更高级、持续更新的资源；
    - 仓库负责承载更易更新的链接、代码和工具信息；
    - 工具的当前用法仍应以对应版本的官方文档为准。
    - 作者还维护 MLOps Discord 社区，读者可以讨论本书和相关问题。社区的价值不只是获得答案，还在于观察同一原则如何在不同组织约束下产生不同实现。
  - title: 9. Using Code Examples：代码示例怎样使用
    source_heading: 9. Using Code Examples：代码示例怎样使用
    paragraphs:
    - 一般情况下，可以在自己的程序和文档中使用书中示例代码；
    - 出售或分发 O’Reilly 图书示例、复制大量代码，或把大量示例纳入产品文档，则需要另行确认许可；
    - 出版社欢迎署名，但一般不强制要求；典型署名包含书名、作者、出版社和 ISBN；
    - 这部分是原书的使用说明，不应被扩展解释成针对具体项目的法律意见。涉及大规模复制、商业再分发或许可边界时，应以正式授权条款和专业意见为准。
  - title: 12.1 两年写作背后是更长期的准备
    source_heading: 12.1 两年写作背后是更长期的准备
    paragraphs:
    - 作者用两年写完本书，而知识和经验准备经历了更长时间。她强调自己得到大量帮助，也承认人的记忆并不可靠，可能遗漏贡献者；遗漏不代表不感激，并欢迎对方提醒以便更正。
    - 这段致谢显示：覆盖数据、模型、基础设施、生产和人的系统书不可能只靠个人经验完成。它需要课程实践、同行审阅、早期读者、编辑制作和长期工业经验共同形成。
  - title: 13.6 在线预测不等于在线学习
    source_heading: 13.6 在线预测不等于在线学习
    paragraphs:
    - 在线预测：请求到来时即时计算预测。
    - 在线学习：模型随新数据逐步更新参数。
    - 系统可以在线预测但每天批量训练，也可以批量生成预测却频繁更新模型。两条轴彼此独立。
  - title: 14. 全篇知识结构
    source_heading: 14. 全篇知识结构
    paragraphs:
    - 上下文之所以关键，是因为 ML 系统由多组件、多角色构成，并且依赖具体数据。
    - 为了做系统级决策，需要覆盖生命周期、明确权衡和责任。
    - 为了让判断可靠，需要案例、文献、专家评审和持续反馈。
    - 全书章节据此从立项一直组织到生产更新、平台和人的影响。
  - title: 16. 从前言提炼出的通用 ML 系统设计方法
    source_heading: 16. 从前言提炼出的通用 ML 系统设计方法
    paragraphs:
    - 写清楚谁在什么时刻根据模型输出采取什么动作，以及希望改变哪项用户或业务结果。若输出不会改变任何决策，模型本身就没有可交付价值。
    - 量化数据可用性、标签延迟、请求规模、时延、预算、隐私、安全、公平、可解释性和团队运维能力。把不能违反的要求与可以权衡的目标分开。
    - 更新触发可以来自时间、数据量、分布变化、质量下降、业务事件或安全修复。每次新模型仍要通过验证和发布门禁；“更新更频繁”并不天然更好。
    - 这段伪代码与前言思想一一对应：上下文决定可行方案，系统视角决定观测范围，实验决定是否采用改动，反馈决定下一轮问题。最终能力不是记住某套架构，而是能持续回答：当前真正的问题是什么，证据支持哪种最小改动，它对整个系统和所有相关人意味着什么。
  takeaways:
  - 上下文之所以关键，是因为 ML 系统由多组件、多角色构成，并且依赖具体数据。
  - 全书章节据此从立项一直组织到生产更新、平台和人的影响。
  - 机器学习系统复杂，因为组件和利益相关者众多；它独特，因为行为依赖具体数据。
  - 离线效果好不是部署成功的充分条件，部署也不是生命周期终点。 生产系统必须可观察、可诊断、可更新和可回滚。
  - 可靠知识来自多种证据的交叉校正。 真实案例、文献、专家评审和读者反馈各自提供不同视角，也各有边界。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「13.1 “It depends”不等于没有原则」？
  answer: 正确理解：应把场景拆成目标、数据、约束、规模、成本、风险和团队能力，再用实验和运行证据比较方案。上下文依赖提高了论证要求，而不是取消论证。
  source_heading: 13.1 “It depends”不等于没有原则
- level: 概念辨析
  question: 原文如何解释「13.5 部署不是项目终点」？
  answer: 上线后数据、环境和业务目标会变化。没有监控、反馈、更新和回滚能力的“已部署模型”，仍不是完整生产能力。
  source_heading: 13.5 部署不是项目终点
- level: 概念辨析
  question: 原文如何解释「13.9 数据变化不等于模型代码有 bug」？
  answer: 生产效果下降可能来自生产数据分布变化，即使代码与参数完全未改。反过来，检测到某个特征分布变化，也不一定意味着业务质量下降；必须结合影响路径和标签验证。
  source_heading: 13.9 数据变化不等于模型代码有 bug
- level: 概念辨析
  question: 原文如何解释「13.12 整体性不等于最大复杂度」？
  answer: 整体性要求考虑端到端影响，最终实现仍应尽量简单。规模较小、风险较低时，少量脚本和清晰流程可能比完整平台更合适。
  source_heading: 13.12 整体性不等于最大复杂度
- level: 概念辨析
  question: 原文如何解释「13.16 案例有启发性，不等于可以原样复制」？
  answer: 案例展示“约束如何导出方案”，不是证明某套架构普遍最佳。复制案例前必须比较数据、规模、团队、监管和失败代价。
  source_heading: 13.16 案例有启发性，不等于可以原样复制
