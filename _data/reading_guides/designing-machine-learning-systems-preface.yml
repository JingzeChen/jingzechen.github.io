  question: 原文围绕「0. 学习目标与全篇主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与全篇主线
  thesis: 本书强调持久的问题解决原则，而不是短命的工具步骤。 工具仍要结合当前文档和真实负载验证。
  thesis_source: 15. 核心结论
  concepts:
  - term: 0. 学习目标与全篇主线
    meaning: 一句话概括：这不是一本告诉读者“唯一正确架构”的书，而是一本训练读者根据目标、数据、约束和利益相关者做系统级判断的书。
    source_heading: 0. 学习目标与全篇主线
  - term: 3. 作者如何形成答案：案例、证据、评审与反馈
    meaning: 作者希望书出版后，这个学习循环继续运行，因为每位读者拥有作者没有的经验与视角。她给出了 MLOps Discord、Twitter、LinkedIn
      和个人网站等反馈渠道。这段话不仅是社群邀请，也说明复杂系统知识应被视为可修订的共同实践，而不是封闭的最终答案。
    source_heading: 3. 作者如何形成答案：案例、证据、评审与反馈
  - term: 7. GitHub Repository and Community：配套资源与社区
    meaning: 作者还维护 MLOps Discord 社区，读者可以讨论本书和相关问题。社区的价值不只是获得答案，还在于观察同一原则如何在不同组织约束下产生不同实现。
    source_heading: 7. GitHub Repository and Community：配套资源与社区
  - term: 9. Using Code Examples：代码示例怎样使用
    meaning: 出售或分发 O’Reilly 图书示例、复制大量代码，或把大量示例纳入产品文档，则需要另行确认许可；
    source_heading: 9. Using Code Examples：代码示例怎样使用
  - term: 13.6 在线预测不等于在线学习
    meaning: 系统可以在线预测但每天批量训练，也可以批量生成预测却频繁更新模型。两条轴彼此独立。
    source_heading: 13.6 在线预测不等于在线学习
  - term: 16. 从前言提炼出的通用 ML 系统设计方法
    meaning: 更新触发可以来自时间、数据量、分布变化、质量下降、业务事件或安全修复。每次新模型仍要通过验证和发布门禁；“更新更频繁”并不天然更好。
    source_heading: 16. 从前言提炼出的通用 ML 系统设计方法
