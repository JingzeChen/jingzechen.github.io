overview:
  kind: summary
  minutes: 11
  question: 原文围绕「本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 本章要回答的核心问题
  thesis: GPipe 在一个逻辑 batch 内累计 microbatch 梯度，batch 末同步更新。 这样保证各 microbatch forward
    / backward 使用一致参数版本。
  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 原章以系统设计和概念代码为主。本文在对应位置补充梯度等价性、扩展效率、通信成本、梯度陈旧、有效 batch size、流水线利用率等推导，以说明作者结论成立的前提与局限；这些形式化表达不是原章另行提出的算法。原章代码和框架接口具有成书时点，实际运行时应以目标
      PyTorch、TensorFlow、Horovod 和 Kubernetes 版本为准。
    source_heading: 本章要回答的核心问题
  - term: 4.1 分布式训练方法的类型
    meaning: 组合会提高容量与吞吐，也会把通信组、拓扑放置、checkpoint 和故障域变复杂。设计时仍应先用最简单、能满足目标的方法，不应因为有很多
      GPU 就默认采用多维并行。
    source_heading: 4.1 分布式训练方法的类型
  - term: 4.3 支持数据并行的样例训练服务
    meaning: 原章认为同步数据并行中所有 worker 每轮都同步，所以 rank 0 的进展可以代表整组：其他 worker 不参与 collective
      时，rank 0 通常也无法继续完成训练。它给教学样例提供一个简单状态代理。
    source_heading: 4.3 支持数据并行的样例训练服务
  - term: 4.4 训练单 GPU 无法容纳的大模型
    meaning: 原章说 4 个 microbatch 相比一次 batch 32 约慢 4 倍。这个表述应理解为：无法并行计算 32 个样本，而要串行执行四次
      forward/backward，吞吐显著下降；它不严格意味着墙钟必然恰好 4 倍，因为 batch 32 本身计算也更多，GPU 利用、kernel
      启动和 I/O 会改变比率。
    source_heading: 4.4 训练单 GPU 无法容纳的大模型
  - term: 从本章提炼出的通用解题方法
    meaning: 按每层计算、参数、activation 和边界通信切分，选择 microbatch 数；同时观察最慢 stage、bubble、显存与 kernel
      效率。以完整 forward + backward + optimizer 吞吐验收。
    source_heading: 从本章提炼出的通用解题方法
  - term: 复习与自测
    meaning: Activation checkpoint、训练 checkpoint 和 CPU offload 有什么区别？
    source_heading: 复习与自测
