checks:
- level: 概念辨析
  question: 原文如何解释「1. 模型就是 weights 文件」？
  answer: 错误。Serving 还需要架构 / graph、executor、runtime、preprocess、postprocess、labels
    / vocabulary 和输入输出契约。
  source_heading: 1. 模型就是 weights 文件
- level: 概念辨析
  question: 原文如何解释「12. Direct embedding 总比远程服务快」？
  answer: 不一定。它少一个网络 hop，但客户端硬件可能远弱于服务端 GPU，且本地 preprocess 和内存压力可更大。
  source_heading: 12. Direct embedding 总比远程服务快
- level: 概念辨析
  question: 原文如何解释「21. Cache key 只用 model name 就足够」？
  answer: 至少要固定 version，多租户还要 tenant namespace。
  source_heading: 21. Cache key 只用 model name 就足够
- level: 概念辨析
  question: 原文如何解释「31. Graph execution 只是连续调用几个 API，不需版本化」？
  answer: 错误。节点、边、transformer、timeout 和 fallback 都影响结果；graph definition 是可部署、可审计的制品。
  source_heading: 31. Graph execution 只是连续调用几个 API，不需版本化
- level: 概念辨析
  question: 原文如何解释「40. 最通用的 prediction platform 应该从第一个模型开始建设」？
  answer: 错误。原章核心观点是按场景选择刚好足够的系统，随模型类型和应用规模演进。
  source_heading: 40. 最通用的 prediction platform 应该从第一个模型开始建设
