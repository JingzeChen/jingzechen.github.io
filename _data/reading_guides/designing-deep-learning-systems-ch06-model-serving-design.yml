  thesis: 六项核心挑战是 API 异构、runtime 异构、工具选择、场景定制、时延/利用率权衡、部署与监控。
  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 原章以概念、术语和高层设计为主，没有给出需要推导的机器学习公式。本文会在对应位置补充端到端时延、Little 定律、缓存命中率、容量、可用性和
      DAG 关键路径等工程表达，用来说明作者设计选择的依据与局限；这些形式化分析不是原章另行提出的算法。第 7 章才会进入具体服务实现、开源工具、部署与监控实践。
    source_heading: 本章要回答的核心问题
  - term: 6.1 解释模型服务
    meaning: 以语音翻译为例：用户上传音频，远程服务加载并执行 sequence-to-sequence 模型，再返回翻译音频。模型文件、执行环境、预处理、预测、后处理、网络接口和运行服务共同构成实际的
      serving 能力。
    source_heading: 6.1 解释模型服务
  - term: 6.2 常见模型服务策略
    meaning: 一个统一 API 与单一进程无法魔法般消除这些差异。Model server 通常通过 standardized model format、backend
