overview:
  kind: summary
  minutes: 14
  question: 原文围绕「0. 本章定位与阅读主线」建立了怎样的核心认识？
  question_source: 0. 本章定位与阅读主线
  thesis: 最佳方案通常是渐进且混合的：cheap-first model routing、按需 reasoning、managed/self-host 组合、量化底座加可切换
    adapter。
  thesis_source: 16. 本章知识结构与核心结论
  concepts:
  - term: 0. 本章定位与阅读主线
    meaning: 前三章先讨论 Agent 的控制结构、推理模式与学习方法，本章才回到模型本身。作者有意采用“先设计团队，再招聘成员”的顺序：只有明确工作流里需要生成、检索、过滤、推理、路由还是写文件，模型的参数量和架构才有评价依据。
    source_heading: 0. 本章定位与阅读主线
  - term: 3. KV Cache 与 GQA：以显存换解码速度
    meaning: 但真实 attention logits 并非“每个分数大体不变”，softmax 也能在很长序列上保持尖锐。Lost-in-the-middle/haystack
      还与训练长度、位置编码、内容干扰、查询—证据匹配、层间信息传递和模型数据分布有关。因此 trimming 是一种上下文治理手段，不是由 Softmax
      公式直接推出的万能修复。
    source_heading: 3. KV Cache 与 GQA：以显存换解码速度
  - term: 7. Putting It All Together：设计一个模型专家团队
    meaning: 0.956 是该 encoder/tool 定义下的相关性分数，不是“95.6% 事实正确概率”，也不证明无 hallucination。Encoder
      能检查 query—document semantic relevance；它通常不能独立验证网页真实性、引用是否支持 claim、时效性或推理结论。
    source_heading: 7. Putting It All Together：设计一个模型专家团队
  - term: 8. Open vs. Closed：模型选择也是组织战略
    meaning: 闭源 frontier models 常受益于专有数据和大规模训练；Qwen、Kimi 等开放/开放权重模型缩小差距。排行榜不是 Agent
      节点表现：tool calling、JSON adherence、目标语言、context recall、延迟和 quantized quality 都要在自己的
      workflow 上测。
    source_heading: 8. Open vs. Closed：模型选择也是组织战略
  - term: 12. Quantization：降低数值精度以换取容量和速度
    meaning: 4-bit weight-only 往往显著省显存，使更大模型或更多并发可运行；端到端 tokens/s 是否上升必须 benchmark。Quantization
      还可能影响 tool-call JSON、数学、长上下文和小概率 token，不应只测 perplexity。
    source_heading: 12. Quantization：降低数值精度以换取容量和速度
  - term: 16. 本章知识结构与核心结论
    meaning: 最佳方案通常是渐进且混合的：cheap-first model routing、按需 reasoning、managed/self-host
      组合、量化底座加可切换 adapter。
    source_heading: 16. 本章知识结构与核心结论
