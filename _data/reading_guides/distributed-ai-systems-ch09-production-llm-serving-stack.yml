    source_heading: 4. Canary deployments and A/B testing
  - term: 8. Deploying vLLM on k3d
    meaning: 还测试streaming、cancel、invalid model/max context、health/readiness、usage和restart后cache。
    source_heading: 8. Deploying vLLM on k3d
  - term: 9. Multi-Model and Multi-Engine serving
    meaning: Gateway加载时校验：duplicate aliases、URL scheme/host allowlist、model/capabilities、health
