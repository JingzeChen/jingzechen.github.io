    source_heading: 9. Multi-Model and Multi-Engine serving
  - term: 14. 统一公式与术语速查
    meaning: Prometheus histogram quantile由bucket累计counts插值，是近似值；SLO附近bucket越粗，p99误差越大。需要同时看bucket设计与sample
