  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 高级栈线：Inference Gateway → vLLM → NIXL/cache/PD → variant scaling。
  thesis_source: 16. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 如何实现正确的gateway、distributed rate limit、canary controller和trace propagation？
    source_heading: 0. 本章要回答的核心问题
