checks:
- level: 概念辨析
  question: 原文如何解释「7.2 可靠传输与恰好一次处理」？
  answer: TCP 的去重单位是连接字节流位置。应用重新连接并重发请求时，会形成新的字节序号空间，TCP 无法知道两个请求代表同一个业务操作。
  source_heading: 7.2 可靠传输与恰好一次处理
- level: 概念辨析
  question: 原文如何解释「7.3 背压、流量控制与限流」？
  answer: 限流通常在服务入口按请求、身份或成本执行准入策略。
  source_heading: 7.3 背压、流量控制与限流
- level: 概念辨析
  question: 原文如何解释「7.4 连接超时、读取超时与重传超时」？
  answer: 应用读取超时不代表 TCP 已放弃连接，TCP 重传也不代表业务请求应该无限等待。不同层次需要各自的截止时间和恢复策略。
  source_heading: 7.4 连接超时、读取超时与重传超时
- level: 概念辨析
  question: 原文如何解释「7.5 延迟、RTT、带宽与吞吐量」？
  answer: 原书公式揭示的是窗口化协议中 RTT 对吞吐量的约束，不是把延迟与物理带宽定义成同一件事。
  source_heading: 7.5 延迟、RTT、带宽与吞吐量
