overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 本章定位：在不可靠 IP 上构造可靠字节流」建立了怎样的核心认识？
  question_source: 0. 本章定位：在不可靠 IP 上构造可靠字节流
  thesis: TIME_WAIT 是正确性机制，不是天然故障。 它隔离旧连接迟到段，并允许最终 ACK 丢失后再次确认；高频短连接可能因此消耗端口和内核状态。
  thesis_source: 9. 核心结论
  concepts:
  - term: 0. 本章定位：在不可靠 IP 上构造可靠字节流
    meaning: TCP（Transmission Control Protocol）位于传输层，在 IP 之上向两个进程提供可靠、有序的字节流。应用写入一串字节，接收应用最终看到同样顺序的字节；TCP
      对应用隐藏了分段、丢包重传、乱序重组和重复消除等细节。
    source_heading: 0. 本章定位：在不可靠 IP 上构造可靠字节流
  - term: 2. Connection lifecycle：连接生命周期
    meaning: 此外，网络中可能存在延迟很久的旧 SYN。通过双方选择新初始序号并互相确认，TCP 能降低旧段被误认为当前连接数据的风险。三次握手的本质不是仪式，而是同步两个方向的序号空间并验证双向通信能力。
    source_heading: 2. Connection lifecycle：连接生命周期
  - term: 5. Custom protocols：自定义协议
    meaning: 原书提示 HTTP/3 建立在 UDP 之上。准确地说，HTTP/3 使用基于 UDP 的 QUIC；QUIC 并没有放弃可靠性和拥塞控制，而是在
      UDP 之上提供这些能力。一个流发生丢包时，未受该丢包影响的其他流可以继续推进，但各流仍共享连接级拥塞控制，同一个丢失包也可能携带多个流的数据。这正是“UDP
      用作自定义传输协议基底”的例子，而不是“HTTP/3 不可靠”。
    source_heading: 5. Custom protocols：自定义协议
  - term: 6. 五类机制如何共同工作
    meaning: 可以把这些代价理解为 TCP 保证的价格。只有知道业务真正需要哪些性质，才能判断价格是否值得。
    source_heading: 6. 五类机制如何共同工作
  - term: 7.5 延迟、RTT、带宽与吞吐量
    meaning: 原书公式揭示的是窗口化协议中 RTT 对吞吐量的约束，不是把延迟与物理带宽定义成同一件事。
    source_heading: 7.5 延迟、RTT、带宽与吞吐量
  - term: 10. 从本章提炼出的通用解题方法
    meaning: 可靠性、拥塞控制和安全都包含大量边界情况。除非需求确实超出现有协议能力，否则应优先使用经过广泛验证的 TCP、QUIC 或领域协议，而不是从
      UDP 裸包开始重造。
    source_heading: 10. 从本章提炼出的通用解题方法
  logic:
  - 0. 本章定位：在不可靠 IP 上构造可靠字节流
  - 2. Connection lifecycle：连接生命周期
  - 4. Congestion control：拥塞控制
  - 6. 五类机制如何共同工作
  - 7.3 背压、流量控制与限流
  - 9. 核心结论
  - 10. 从本章提炼出的通用解题方法
  sections:
  - title: 0. 本章定位：在不可靠 IP 上构造可靠字节流
    source_heading: 0. 本章定位：在不可靠 IP 上构造可靠字节流
    paragraphs:
    - 例如，路由器的输出队列已满时可以直接丢包；不同包可能经过不同路径而乱序；底层故障可能造成比特错误。IP 的职责是尽可能转发，而不是为两个进程维护可靠会话。
    - TCP（Transmission Control Protocol）位于传输层，在 IP 之上向两个进程提供可靠、有序的字节流。应用写入一串字节，接收应用最终看到同样顺序的字节；TCP
      对应用隐藏了分段、丢包重传、乱序重组和重复消除等细节。
    - 前者由序号、ACK、超时、重传和校验和实现；后者由流量控制与拥塞控制实现。只实现重传而没有稳定性控制，会形成危险反馈：网络越拥塞，丢包越多；丢包越多，发送方重传越多；重传又使网络更拥塞。
    - 这条路线体现了构造系统抽象的一般方法：先列出下层可能违背的性质，再逐一增加状态、反馈和恢复机制；得到更强保证后，再分析这些机制引入的延迟、带宽和复杂度成本。
  - title: 1. Reliability：可靠性
    source_heading: 1. Reliability：可靠性
    paragraphs:
    - 之所以给字节编号而不只是给包编号，是因为重传时段边界可能变化，字节位置才是稳定语义。TCP 序号字段空间有限并会回绕，但协议会结合窗口和连接生命周期，避免把当前连接中的有效数据与过旧数据混淆。
    - 实际 TCP 可以延迟 ACK、让一个 ACK 累计确认多个段，也可以用选择性确认（SACK）告诉发送方哪些非连续区间已收到。因此，原章“每个段都需要被确认”应理解为所有数据最终都要被确认覆盖，不一定严格一段对应一个独立
      ACK。
    - 这个过程揭示了分布式系统中反复出现的模式：重试把丢失转化为重复，去重机制再消除重复。 TCP 能按字节序号去重，但它不知道应用操作的语义。因此，TCP
      重传不会让应用读到重复字节，却不能保证“支付请求只执行一次”；应用层超时后重新发送整个请求仍需要幂等机制。
    - 这个公式不是原章重点，但说明定时器为何同时依赖平均延迟与抖动。只看平均 RTT 会在网络波动时频繁误判；留出波动裕量可以减少伪重传。实际 TCP 还使用快速重传、指数退避等机制，算法由具体协议版本和操作系统实现决定。
  - title: 2. Connection lifecycle：连接生命周期
    source_heading: 2. Connection lifecycle：连接生命周期
    paragraphs:
    - 此外，网络中可能存在延迟很久的旧 SYN。通过双方选择新初始序号并互相确认，TCP 能降低旧段被误认为当前连接数据的风险。三次握手的本质不是仪式，而是同步两个方向的序号空间并验证双向通信能力。
    - 连接池不是越大越好。每条连接都会占用文件描述符、内存、端口和服务端资源；空闲过久还可能被防火墙、负载均衡器或服务端关闭。池需要设置最大连接数、空闲超时、健康检查和借用等待策略。
    - 这个关系与 Little 定律同源：系统内平均对象数约等于到达率乘以平均停留时间。解决思路不是盲目缩短协议等待，而是优先减少连接抖动、复用连接、合理设计连接池，并检查究竟耗尽了端口、文件描述符、监听队列还是服务端容量。
    - socket 不等于 TCP 连接。 socket 是操作系统提供的通信端点抽象；监听 socket 不对应一个特定客户端连接，UDP socket 也没有
      TCP 式连接状态。
  - title: 4. Congestion control：拥塞控制
    source_heading: 4. Congestion control：拥塞控制
    paragraphs:
    - 新连接刚建立时，发送方不知道路径容量，也不知道与多少流量竞争。若一开始就以任意高速度发送，可能瞬间压垮路由器。因此，TCP 从一个受控的初始拥塞窗口开始，用收到
      ACK 作为“这些数据成功穿过网络”的反馈，逐步扩大窗口。
    - 传统 TCP 把丢包视为网络队列溢出的信号。当发送方因超时发现 ACK 缺失时，会减小拥塞窗口，降低在途数据量。之后，若数据继续成功传输，窗口再逐步增长；再次出现拥塞信号时又下降。
    - 原章用超时说明丢包检测。实际 TCP 还可能根据重复 ACK、选择性确认或显式拥塞通知更早响应，不必总等到重传超时。不同拥塞控制算法的窗口增长和下降规则也不同，例如原书脚注提到
      CUBIC；因此，不应把单一“加多少、减多少”的曲线当作所有 TCP 实现。
    - 右侧称为带宽时延积（bandwidth-delay product，BDP）。它表示当第一批字节到达接收端、ACK 尚未返回时，整条路径上可以容纳多少在途数据。若窗口小于
      BDP，发送方会在链路还有容量时因等 ACK 而停下来。
  - title: 5. Custom protocols：自定义协议
    source_heading: 5. Custom protocols：自定义协议
    paragraphs:
    - UDP 不是“完全没有首部或校验”，而是没有 TCP 的连接、可靠性、流量控制和拥塞控制抽象。数据报仍受 IP 包大小与路径 MTU 约束；数据报过大可能导致
      IP 分片，而任一分片丢失都会使整个数据报无法重组。因此，使用 UDP 的应用通常控制数据报大小。
    - 原书提示 HTTP/3 建立在 UDP 之上。准确地说，HTTP/3 使用基于 UDP 的 QUIC；QUIC 并没有放弃可靠性和拥塞控制，而是在 UDP
      之上提供这些能力。一个流发生丢包时，未受该丢包影响的其他流可以继续推进，但各流仍共享连接级拥塞控制，同一个丢失包也可能携带多个流的数据。这正是“UDP
      用作自定义传输协议基底”的例子，而不是“HTTP/3 不可靠”。
    - TCP 若发现包含 tick 101 的字节缺失，会先恢复该缺口，后面的 tick 102 即使已经到达接收内核，也不能越过缺口交给同一字节流的应用。这种现象称为队头阻塞（head-of-line
      blocking）。对于“最新状态覆盖旧状态”的数据，完整按序交付的收益可能小于等待成本。
    - 这个示例为突出思想，假设 32 位 tick 在运行期间不回绕，也省略了字节序、序列化、身份认证和包长校验。真实协议不能直接发送 C 结构体，因为结构体可能包含填充，整数还涉及网络字节序；应显式定义线上格式并逐字段编码。
  - title: 6. 五类机制如何共同工作
    source_heading: 6. 五类机制如何共同工作
    paragraphs:
    - 定时器解决“多久没反馈就采取恢复动作”；
    - 校验和解决“到达的数据是否出现可检测损坏”；
    - 连接状态机解决“这些序号和反馈属于哪次会话”。
    - 可以把这些代价理解为 TCP 保证的价格。只有知道业务真正需要哪些性质，才能判断价格是否值得。
  - title: 7.3 背压、流量控制与限流
    source_heading: 7.3 背压、流量控制与限流
    paragraphs:
    - 背压是下游容量不足向上游传播“慢下来”的一般思想；
    - 限流通常在服务入口按请求、身份或成本执行准入策略。
  - title: 7.5 延迟、RTT、带宽与吞吐量
    source_heading: 7.5 延迟、RTT、带宽与吞吐量
    paragraphs:
    - 单程延迟：数据从一端到另一端所需时间；
    - 吞吐量：实际单位时间交付的数据量。
    - 原书公式揭示的是窗口化协议中 RTT 对吞吐量的约束，不是把延迟与物理带宽定义成同一件事。
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - TCP 在不可靠 IP 上构造可靠、有序、无重复的字节流。 可靠性来自序号、确认、定时器、重传、去重、重排和校验，而不是底层网络突然可靠。
    - TIME_WAIT 是正确性机制，不是天然故障。 它隔离旧连接迟到段，并允许最终 ACK 丢失后再次确认；高频短连接可能因此消耗端口和内核状态。
    - UDP 提供轻量、无连接、保留边界的数据报服务，但不内置可靠性、流量控制和拥塞控制。 自定义协议必须自行承担所需保证。
    - 协议选择应由数据语义决定。 游戏快照可以只取最新，资产交易则必须可靠、去重和持久化；不能用“TCP 或 UDP”替代逐类分析。
  - title: 10. 从本章提炼出的通用解题方法
    source_heading: 10. 从本章提炼出的通用解题方法
    paragraphs:
    - 序号让缺口和重复可见，ACK 让接收进度可见，定时器让“长时间没有反馈”可触发动作，窗口让容量可见。无法观察的状态无法可靠控制。
    - 不要给整个应用粗暴贴上 TCP 或 UDP 标签。逐类判断消息是否可丢、是否过期、是否需要顺序、是否能去重，再选择成熟协议或设计通道。
    - 可靠性、拥塞控制和安全都包含大量边界情况。除非需求确实超出现有协议能力，否则应优先使用经过广泛验证的 TCP、QUIC 或领域协议，而不是从 UDP 裸包开始重造。
    - 本章最重要的方法论是：可靠性不是一个开关，而是在不可靠基础上用状态、反馈、恢复与约束逐层构造出来的性质；每增强一项保证，都要同时计算它的成本和边界。
  takeaways:
  - IP 解决寻址和路由，但只提供尽力而为交付。 包可能丢失、重复、乱序或损坏。
  - 三次握手同步两个方向的初始序号并确认双向通信。 代价是应用传输前至少增加约一个 RTT。
  - 流量控制与拥塞控制保护不同对象。
  - 窗口与 RTT 共同限制理论吞吐。
  - 协议选择应由数据语义决定。 游戏快照可以只取最新，资产交易则必须可靠、去重和持久化；不能用“TCP 或 UDP”替代逐类分析。
