checks:
- level: 概念辨析
  question: 原文如何解释「17.1 Timeout 与 deadline」？
  answer: Deadline 是整个 request 绝对结束时间。
  source_heading: 17.1 Timeout 与 deadline
- level: 概念辨析
  question: 原文如何解释「17.9 Circuit breaker 与 timeout」？
  answer: Timeout 终止已发出的 slow call；breaker 在调用前阻止预期失败的 call。
  source_heading: 17.9 Circuit breaker 与 timeout
- level: 概念辨析
  question: 原文如何解释「18.3 “Timeout 越短越 resilient”」？
  answer: 过短制造 false timeout/retry storm。基于 representative percentile 和 deadline。
  source_heading: 18.3 “Timeout 越短越 resilient”
- level: 概念辨析
  question: 原文如何解释「18.10 “每层各重试一次问题不大”」？
  answer: Attempts 乘法放大，深层故障点承压最大。统一单层 retry/预算。
  source_heading: 18.10 “每层各重试一次问题不大”
- level: 概念辨析
  question: 原文如何解释「18.17 “Mesh 已配置 retry，application 不用知道”」？
  answer: Mesh 不知道 non-idempotent业务 side effect；双层 retry/timeout 必须治理。
  source_heading: 18.17 “Mesh 已配置 retry，application 不用知道”
