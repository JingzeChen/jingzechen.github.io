overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0.1 从架构级隔离转向调用级防护」建立了怎样的核心认识？
  question_source: 0.1 从架构级隔离转向调用级防护
  thesis: Failure classifier、minimum samples、window、threshold、reset time、probe count
    和 scope 都需数据调优。
  thesis_source: 22. 核心结论
  concepts:
  - term: 0.1 从架构级隔离转向调用级防护
    meaning: Fault isolation：限制 poison/noisy fault 的 blast radius。
    source_heading: 0.1 从架构级隔离转向调用级防护
  - term: 5. 27.2 Retry：失败后 fail fast 还是再试
    meaning: HTTP status 不能机械映射；例如 409/404 在某些 eventual workflow 可短暂，需 domain contract。
    source_heading: 5. 27.2 Retry：失败后 fail fast 还是再试
  - term: 9. Retry eligibility 与幂等性
    meaning: 多次执行与一次 effect 相同。PUT/DELETE 在 HTTP 语义上通常 idempotent，但 response/status
      可不同；具体 application handler 仍可能附带 non-idempotent side effect。
    source_heading: 9. Retry eligibility 与幂等性
  - term: 11. 27.3 Circuit breaker
    meaning: Circuit breaker 监测长期 degradation，暂时阻止新 downstream calls。目标：让 subsystem
      failure 不拖慢 caller。
    source_heading: 11. 27.3 Circuit breaker
  - term: 16.1 模拟目标
    meaning: Unauthorized permanent error 只尝试一次，不计 breaker failure；
    source_heading: 16.1 模拟目标
  - term: 23. 一般化的解决问题方法
    meaning: 最终 200 可能隐藏 3 次 timeout/retry。监控 original、attempt、blocked、fallback 和
      downstream offered load。
    source_heading: 23. 一般化的解决问题方法
