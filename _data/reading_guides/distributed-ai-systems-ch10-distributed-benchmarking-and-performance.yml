  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: Network raw bandwidth、NCCL algbw、busbw和application effective bandwidth如何区分？
    source_heading: 0. 本章要回答的核心问题
  - term: 6. Benchmarking methodology
    meaning: Isolated nodes减少噪声，适合algorithm comparison；shared production-like环境反映真实contention。两套都可测：controlled
      benchmark与fleet/trace benchmark，不能互相冒充。
    source_heading: 6. Benchmarking methodology
  - term: 12. Validating distributed training accuracy
    meaning: Collective reduction order、TF32/BF16和kernels会产生小差异；长训练chaotic divergence不代表bug。定义tolerance和statistical
      equivalence，而不是要求最终weights bitwise相等。
    source_heading: 12. Validating distributed training accuracy
  - term: 14. Scaling bottleneck analysis
    meaning: FP16/BF16 reduction、quantized gradients、PowerSGD等减少bytes/时间，但引入error、kernel和state。必须比较time-to-quality，不只step
      throughput。
    source_heading: 14. Scaling bottleneck analysis
  - term: 20. Validating inference accuracy
    meaning: Greedy可做engine token/logit equivalence；sampling输出不同是正常，需要distribution/quality
      repeated seeds。固定seed不总保证distributed bitwise determinism。
    source_heading: 20. Validating inference accuracy
  - term: 28. 复习与自测
    meaning: 完成这些检查后，应能把“系统慢”改写为一个可证伪的性能工程问题：在明确workload和quality约束下，哪一段critical path限制good
      work，证据来自哪种measurement boundary，优化是否在独立重复实验中改善E2E/SLO/cost，以及结论能否通过manifest、raw
      samples和回归门长期复现。
    source_heading: 28. 复习与自测
