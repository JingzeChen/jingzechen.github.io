  - 原书图示：小米通过产业投资支持先进制造与上游供应链这些数字说明投资覆盖和阶段性成长，不代表所有项目成功，也不能单独证明产业效益。还要看技术国产化、量产质量、第三方客户和长期竞争力。
  - 降低采购价不能以牺牲精度、安全、寿命和售后为代价，应比较完整生命周期成本。
  - 这种比较需要统一产品、质量、设备利用率和统计周期。单项产能提高是有力信号，但仍需观察长期稳定性和完整成本。
  - "+> 智能工厂三层：现场自动化、全链路数字化、运营系统智能化。 +> 实验工厂：先验证设备、工艺和系统，不以一期产量为首要目标。 +> 三自原则：自诊断、自校准、自适应。
    +> 行业输出：把验证后的装备、产线和软件提供给代工伙伴，形成更大规模。 +> 核心边界：智能制造不是机器换人，也不是自动化越多越好；必须同时考虑完整成本、柔性、员工、安全、韧性和环境。
    +> 核心启示：真正的制造升级不是品牌独占能力，而是让装备商、工厂、品牌和员工在开放协作中共同提高。"
