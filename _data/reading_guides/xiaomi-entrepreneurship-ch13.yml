overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 制造的地位：既保障产品质量，也是全链路效率的关键战场。 +> 代工本质：专业分工，不代表品牌没有技术；关键是能否定义、主导和验证。 +> 联合创新：品牌提供产品方向和技术前瞻，工厂提供工艺与生产能力。
    +> 产业投资：重点在产业，不在短期财务回报；为上游提供资本、订单和验证。 +> 三道难题：装备太贵、非标产线不灵活、国产装备缺少订单与验证。 +> 制造的制造：从生产商品进一步走向制造设备、产线和工厂系统。
    +> 机械臂思路：本体、附属器件和核心软件分工，再统一整合。 +> 柔性基础：平台化、模组化、小型化。
  thesis_source: 二十八、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 本章最重要的认识是：智能制造不是买一批机器人，也不是有没有自有工厂的问题，而是装备、产线、数据、软件、组织与产业协作共同构成的系统能力。
    source_heading: 一、本章主线
  - term: 七、产业投资不是单纯财务投资
    meaning: 原书图示：小米通过产业投资支持先进制造与上游供应链这些数字说明投资覆盖和阶段性成长，不代表所有项目成功，也不能单独证明产业效益。还要看技术国产化、量产质量、第三方客户和长期竞争力。
    source_heading: 七、产业投资不是单纯财务投资
  - term: 十一、小米为什么认为自己能参与破局
    meaning: 拥有场景和资本不意味着小米天然懂工厂。生产管理、安全、设备可靠性和工业软件都有长期专业积累。小米必须与装备商和代工厂共同学习，而不能以消费互联网经验替代制造规律。
    source_heading: 十一、小米为什么认为自己能参与破局
  - term: 13.4 十年降到十分之一的目标怎样看
    meaning: 雷军提出到 2030 年把机械臂价格降到 2020 年的十分之一。原书还称实验产线使用的机械臂已低于同类市场价格。
    source_heading: 13.4 十年降到十分之一的目标怎样看
  - term: 23.2 板测线案例
    meaning: 原书记载，龙旗南昌园区采用小米智能工厂板测线后，每小时产出高于行业同类设备。
    source_heading: 23.2 板测线案例
  - term: 二十八、本章方法论总结
    meaning: 制造的地位：既保障产品质量，也是全链路效率的关键战场。 +> 代工本质：专业分工，不代表品牌没有技术；关键是能否定义、主导和验证。 +>
      联合创新：品牌提供产品方向和技术前瞻，工厂提供工艺与生产能力。 +> 产业投资：重点在产业，不在短期财务回报；为上游提供资本、订单和验证。 +> 三道难题：装备太贵、非标产线不灵活、国产装备缺少订单与验证。
      +> 制造的制造：从生产商品进一步走向制造设备、产线和工厂系统。 +> 机械臂思路：本体、附属器件和核心软件分工，再统一整合。 +> 柔性基础：平台化、模组化、小型化。
    source_heading: 二十八、本章方法论总结
