  - 18.7 移除 Core Type Leakage
  - 20. 实践检查、知识结构与核心总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Frameworks are details. Frameworks are not architectures.
    - 把应用的 Architecture 围绕 Framework 组织，让 Business Objects 继承 Framework Base Class、依赖
      Framework Annotation，并把核心生命周期交给 Framework。
    - 把 Framework 保持在 Architecture 的 Outer Circle；
    - 因此，本笔记不会人为添加公式，而会详细解释这条因果链、实现方法、现代适用场景、边界成本、迁移策略与常见误区。
  - title: 2.11 Framework 不可能为每个项目优化
    source_heading: 2.11 Framework 不可能为每个项目优化
    paragraphs:
    - Extension Point；
    - Backward Compatibility Policy。
  - title: 6.5 不让它进入 Inner Circle
    source_heading: 6.5 不让它进入 Inner Circle
    paragraphs:
    - Enterprise Business Rule；
    - Application Port。
  - title: 9.9 这段代码表达什么
    source_heading: 9.9 这段代码表达什么
    paragraphs:
    - Dependency 显式通过 Constructor 传入；
    - 普通 Unit Test 可直接构造；
    - Spring 不进入 Business Object。
  - title: 10.10 Framework Upgrade 的理想影响范围
    source_heading: 10.10 Framework Upgrade 的理想影响范围
    paragraphs:
    - Framework Adapter；
    - Integration Test；
    - Deployment Configuration。
  - title: 12.4 观察什么
    source_heading: 12.4 观察什么
    paragraphs:
    - Upgrade Experience；
    - Operational Behavior；
    - Community Health。
  - title: 14.12 给出结构性手段
    source_heading: 14.12 给出结构性手段
    paragraphs:
    - Dependency Rule；
    - Main / Composition Root。
  - title: 17.6 Escape Hatch
    source_heading: 17.6 Escape Hatch
    paragraphs:
    - 插入 Custom Adapter；
    - 使用 Standard Protocol？
  - title: 18.7 移除 Core Type Leakage
    source_heading: 18.7 移除 Core Type Leakage
    paragraphs:
    - Framework Entity → Domain Entity；
    - Framework Exception → Business Error；
    - Framework Context → Plain Request Data。
  - title: 20. 实践检查、知识结构与核心总结
    source_heading: 20. 实践检查、知识结构与核心总结
    paragraphs:
    - Application 可能承诺 Base Class、Annotation、Lifecycle、Data Model、Build 与 Runtime。
    - "“Get the Milk without Buying the Cow”表示使用局部能力，不交出整个 Application Structure。"
    - 一般解决思路是先承认工具价值，再分析控制权与承诺不对称，枚举生命周期风险，用 Dependency Rule 建立 Proxy / Plugin Boundary，局部试用后才作出长期决策。
    - Use the framework. Do not let the framework use your architecture. Date it before
      you marry it.
  takeaways:
  - Entity 是否 Import Framework？
  - 产品成熟后为什么可能超出 Framework？
  - 例外： STL、Java Standard Library 等长期承诺可能无法避免，但必须是有意识决策。
  - Maintenance、Security、License 与 Operational Lock-In 是同一主线下的现代补充风险。
  - Use the framework. Do not let the framework use your architecture. Date it before
    you marry it.
