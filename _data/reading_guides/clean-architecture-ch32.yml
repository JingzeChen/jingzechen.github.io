  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 原则： 使用 Framework，但不要让 Core 与它结婚。
  thesis_source: 20. 实践检查、知识结构与核心总结
  concepts:
  - term: 本章导读
    meaning: 把应用的 Architecture 围绕 Framework 组织，让 Business Objects 继承 Framework Base
      Class、依赖 Framework Annotation，并把核心生命周期交给 Framework。
    source_heading: 本章导读
  - term: 6.5 不让它进入 Inner Circle
    meaning: Application Port。
    source_heading: 6.5 不让它进入 Inner Circle
  - term: 10.10 Framework Upgrade 的理想影响范围
    meaning: Deployment Configuration。
    source_heading: 10.10 Framework Upgrade 的理想影响范围
  - term: 12.4 观察什么
    meaning: Community Health。
    source_heading: 12.4 观察什么
  - term: 17.6 Escape Hatch
    meaning: 使用 Standard Protocol？
    source_heading: 17.6 Escape Hatch
  - term: 20. 实践检查、知识结构与核心总结
    meaning: 一般解决思路是先承认工具价值，再分析控制权与承诺不对称，枚举生命周期风险，用 Dependency Rule 建立 Proxy / Plugin
      Boundary，局部试用后才作出长期决策。
    source_heading: 20. 实践检查、知识结构与核心总结
  logic:
  - 本章导读
