  question: 原文如何解释「19.11 常见误区四：任何 Annotation 都违反 Clean Architecture」？
  answer: 错误。关键在 Annotation 是否进入 Inner Circle 并塑造 Business Policy。
  source_heading: 19.11 常见误区四：任何 Annotation 都违反 Clean Architecture
- level: 概念辨析
  question: 原文如何解释「19.17 常见误区十：DI Container 等于 Dependency Inversion」？
  answer: 错误。Container 负责对象组装；Dependency Inversion 关心源码依赖方向与接口所有权。
  source_heading: 19.17 常见误区十：DI Container 等于 Dependency Inversion
- level: 概念辨析
  question: 原文如何解释「19.22 常见误区十五：商业支持消除 Asymmetry」？
  answer: 错误。Support Contract 能缓解风险，但 Vendor Roadmap 仍不等于你的 Product Roadmap。
  source_heading: 19.22 常见误区十五：商业支持消除 Asymmetry
- level: 概念辨析
  question: 原文如何解释「19.27 常见误区二十：框架升级只是改版本号」？
  answer: 错误。可能涉及 Semantics、Data、Runtime、Security、Deployment 与 Ecosystem。
  source_heading: 19.27 常见误区二十：框架升级只是改版本号
