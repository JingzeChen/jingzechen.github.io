  sections:
  - title: 本章要回答的核心问题
    source_heading: 本章要回答的核心问题
    paragraphs:
    - Productionization（生产化）究竟是什么？“模型能运行”为何不等于“值得投产”？
    - Research、prototyping 与 productionization 三个阶段各自优化什么？
    - Canary、blue-green 与 multi-armed bandit 分别怎样分配流量？
    - 原章采用系统流程与案例解释，没有提出复杂的新数学算法。本文会补充资源吞吐、SLA、流量风险、实验统计和 multi-armed bandit 的形式化表达，用来解释工程直觉、前提与局限；这些补充属于工程推导，不是原章另行提出的公式。开源工具和具体
      API 会随版本演进，本章更值得保留的是服务边界、制品身份、验证门槛与渐进发布方法。
  - title: 全章视角：从研究成果到可消费产品
    source_heading: 全章视角：从研究成果到可消费产品
    paragraphs:
    - 原章图 10.1 来自第 1 章，完整周期包含 Product Management、Data Exploration、DL Research、Prototyping、Productionization
      与 Product Integration；框 3、4、5 是本章焦点。Business owner 提供需求，数据与研究团队交付 dataset /
      algorithm proposal，prototyping 与 productionization 分别交付 POC / production models，模型指标与
      product demo 又反馈给管理侧。
    - Loop A 是早期 POC feedback loop：用 POC model 与 performance metrics 反复校准 product
      requirement、available data 和 algorithm proposal，直到各方形成可继续推进的共识；
    - Loop B 是 product integration 前的 production vet：把稳定原型转成可重复生产模型，验证 performance
      与 scalability；不满足要求时回到 prototyping / productionization 继续迭代。
    - 作者在本章有意暂时忽略更细的 experimentation、testing、training 与 exploration 小循环，改用高层视角追踪一项最终成果如何从
      research 进入 end product。这不是说迭代不重要，而是为了看清角色、跨阶段交付物与系统服务怎样衔接。
  - title: 10.1 为 Productionization 做准备
    source_heading: 10.1 为 Productionization 做准备
    paragraphs:
    - Notebook 成为本轮研究的交互入口。生产实践中还应让 Notebook 关联 Git repository、environment specification
      与 experiment identity，避免结果只存在单个临时 session。
    - Alice 在 Notebook 中修改已有视觉算法，直到能产出 experimental models。此阶段允许频繁变化，但每个值得比较的 run
      应记录 code commit、dataset version、config 与 metrics。
    - 原章定义：Prototyping 是寻找合适的 training data、algorithm、hyperparameter 与 inference support
      组合，使深度学习功能满足 product requirements 的实践。
    - Research 先把算法假设变成可复现实验；prototyping 再把算法放进真实产品约束中，通过 exploratory loop 收敛 data
      shape、code 与 inference feasibility。两阶段都优化快速反馈，但必须从一开始保留 dataset / code provenance，才能把最终结果安全交给
      productionization。
  - title: 10.2 Model Productionization
    source_heading: 10.2 Model Productionization
    paragraphs:
    - 原章直接给出“model output”与可选的“training data output”两个切分点，并以 prepared data 可复用、执行
      cadence 不同解释第二次切分。本笔记可进一步从 artifact / contract 角度理解这些边界：它们可版本化、可持久化且输入输出明确，因而比按
      Notebook cell 或团队组织随意切分更容易复用，也能由 metadata lineage 连接。
    - 只有 Python source directory，不一定能在 training service、model service 和 workflow service
      中一致运行。Package 需要遵守 host service conventions。
    - 这适合产生可复用、版本化 training dataset 的确定性变换。若变换是每 epoch 随机 augmentation 或 model-specific
      tensor operation，则更可能属于 training package。边界应由 artifact ownership 和复用决定。
    - 获得合格 inference response 后，产品要集成 model-service client。原章案例是在 security-camera
      video-processing backend 中调用改进后的 motion-detection model。
  - title: 10.3 Model Deployment Strategies
    source_heading: 10.3 Model Deployment Strategies
    paragraphs:
    - Model service 必须支持 traffic segmentation 与 routing。Traffic split 可以按随机 request、stable
      user / device hash、tenant、region 或明确 allowlist 实现。
    - Shadow / mirroring 同时把 request copy 给新模型，但只有旧模型 response 影响用户。它适合验证 latency、compatibility
      和离线对比，用户风险更低；但无法测量候选 response 真正改变产品行为后的 business effect。
    - Full traffic 能暴露 candidate 的真实容量、cache、segment mix，以及切换后观察到的聚合业务指标，这是 small
      canary 可能看不到的。但前后全量切换没有同期随机对照，seasonality、产品改动等因素会混入结果，因此不能仅凭 blue-green 隔离模型的因果业务效果。
    - 样本少的 arm 置信上界更高，因而获得探索；随着 n_i 增大，不确定性项缩小。公式通常假设 reward 有界、环境相对 stationary；concept
      drift 下需 sliding window、discounting 或重新探索。
  - title: 原章 Summary 回顾
    source_heading: 原章 Summary 回顾
    paragraphs:
    - Model development teams 使用已有算法与可用数据，训练解决具体 deep learning use case 的模型；
    - Research 与 prototyping 都高度依赖交互式 code development、data exploration 和 visualization，因此常使用
      Notebook；
    - 当 training data 与 code 足够稳定后，生产化第一步是打包 model training code、model inference code
      和 source models；
    - 当 training workflow 正常运行且获得满意 inference response 后，可开始 end-user product integration；
  - title: 核心结论
    source_heading: 核心结论
    paragraphs:
    - Prototyping 把 research algorithm 与真实 product use case 连接。 它寻找 data、algorithm、hyperparameter
      与 inference support 的合适组合。
    - Inference packaging 取决于 direct embedding、model service 或 model server strategy。
      Model server 原生支持时可能不需自定义 inference code。
    - Model service 按 handle 查找 inference container 与 model file，共同产生 inference response。
      Model server 可能需要 thin lookup layer / custom manager。
    - Common handle 不是 immutable artifact ID。 Registry 应使用 handle + role + version
      + digest，并记录 package/model compatibility。
  - title: 从本章提炼出的通用解题方法
    source_heading: 从本章提炼出的通用解题方法
    paragraphs:
    - 每轮明确 hypothesis、change、result、decision。版本化 dataset、code、config、environment 和
      metrics；用 representative slices 评价，直到 data shape、modeling 和 inference contract
      足以稳定表达。
    - 将 components 打包为 immutable images / packages，固定 entrypoint 与 host-service conventions。记录
      digest、SBOM、dependencies；用 golden requests 检查 train-serving preprocessing 与
      outputs。
    - 固定 dataset snapshot、packages、source model、parameters / HPO space、resources、evaluation
      和 output policy。实现 idempotent submission、checkpoint、retry、budget 和 lineage。
    - 每个请求记录 resolved model / inference package / policy version，通过 stable ID join
      delayed outcome。按 segment 监控 system、model 与 business metrics；把 drift、failure
      和用户反馈路由回 data、code、workflow 或 product logic。
  - title: 复习与自测
    source_heading: 复习与自测
    paragraphs:
    - Productionization 中 Dataset、Workflow、Training、Metadata / Artifact、Model services
      各负责什么？
    - Research benchmark、product offline metric、system metric 和 business metric 为什么不能相互替代？
    - MAB 的 exploration、exploitation、regret、delayed reward 和 traffic-history logging
      分别为何重要？
    - 请使用本章十步方法，为安防摄像头 motion-detection 模型设计从原型收敛、制品注册、训练复现到 canary 发布和业务观测的完整方案。
  takeaways:
  - Deep learning research teams 发明和改进用于训练模型的算法；
  - Notebook 因交互性和灵活性适合 research 与 prototyping。 这两个阶段都需要快速训练和实验 turnaround。
  - Workflow service 管训练流程，training service 执行 jobs，metadata / artifact store 提供代码并保存模型。
  - Component boundary 应围绕可持久化领域 artifacts：training data 和 trained model。 这使复用、cadence
    和 lineage 明确。
  - 上线是闭环起点。 生产 feedback 应沿 model version、request 和 outcome lineage 回到 prototyping
    与 retraining。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. Productionization 就是把模型文件上传到服务器」？
  answer: 上传只是 artifact transfer。Productionization 还包括组件边界、runtime、注册、训练复现、serving
    SLA、异常处理、产品 contract 与监控；完整 path to production 随后还要处理 deployment、发布和回滚。原章将 product
    integration 视为 productionization 的最后一步，再单独进入 deployment strategies。
  source_heading: 1. Productionization 就是把模型文件上传到服务器
- level: 概念辨析
  question: 原文如何解释「16. Code Componentization 等于把 Notebook 拆成多个文件」？
  answer: 组件化依据独立 input/output、lifecycle、resource、failure 和 ownership contract；机械拆文件没有建立这些边界。
  source_heading: 16. Code Componentization 等于把 Notebook 拆成多个文件
- level: 概念辨析
  question: 原文如何解释「31. Model 注册后就能立即处理 Production Traffic」？
  answer: 还要解析 compatible inference package、下载、校验、加载、warm-up、readiness 和 capacity
    validation。
  source_heading: 31. Model 注册后就能立即处理 Production Traffic
- level: 概念辨析
  question: 原文如何解释「46. Canary Rollback 一定能撤销所有影响」？
  answer: 它能恢复未来流量，不能自动撤销已发送通知、错误业务决定或不可逆 schema / state change。
  source_heading: 46. Canary Rollback 一定能撤销所有影响
- level: 概念辨析
  question: 原文如何解释「60. 模型上线后 Path to Production 就结束」？
  answer: 生产 feedback、drift、故障和新需求会回到 prototyping / training。Production 是闭环，不是单向终点。
  source_heading: 60. 模型上线后 Path to Production 就结束
