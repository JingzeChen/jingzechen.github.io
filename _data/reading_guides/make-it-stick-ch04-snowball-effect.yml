overview:
  kind: summary
  minutes: 9
  question: 原文围绕「导读：“滚雪球”不是知识自动增加」建立了怎样的核心认识？
  question_source: 导读：“滚雪球”不是知识自动增加
  thesis: "“合意困难”是全章的边界概念。跳伞学校的低台、滑索、高塔和实跳之所以有效，不是因为它们让米娅害怕，而是因为每一级困难都接近目标、可以克服、带有反馈，并逐步训练真实任务中的判断与动作。相反，考试焦虑、完全不懂的语言、无关运动和无法恢复的遗忘只会浪费有限认知资源。"
  thesis_source: 十四、全章总结
  concepts:
  - term: 导读：“滚雪球”不是知识自动增加
    meaning: 可以把它理解为一个连续过程：下一轮能真正用起来的知识，来自三部分共同作用。第一部分是已有知识底座，第二部分是新输入中真正接上旧知的内容，第三部分是检索、反思和再巩固带来的修正与加固；与此同时，遗忘和干扰会带来损耗。
    source_heading: 导读：“滚雪球”不是知识自动增加
  - term: 三、越容易想起，越不容易记住
    meaning: 可以用倒 U 形直观理解：遗忘太少时，重学接近机械复述，收益有限；遗忘适中时，学习者需要费力重构，收益最高；遗忘过多时，只能从头重学，收益又会下降。
    source_heading: 三、越容易想起，越不容易记住
  - term: 六、化解因失败带来的焦虑感
    meaning: 20 世纪五六十年代，斯金纳推崇无错误辨别学习（errorless learning）：材料被拆得很小，在尚未遗忘时立即测试，尽量消除错误。他认为错误无益，学生犯错反映教学失败。
    source_heading: 六、化解因失败带来的焦虑感
  - term: 八、别在无法克服的困难上浪费时间
    meaning: 作者承认，目前没有一套适用于所有场景的标准，能预先判断每个困难是否合意。测验、间隔、穿插、多样化、生成和部分环境干扰有研究支持，但具体组合仍需领域实验与个体反馈。
    source_heading: 八、别在无法克服的困难上浪费时间
  - term: 十一、作者分析问题的方法
    meaning: 遗忘既是问题，也可增加下次检索努力；旧线索既保存技能，也可能干扰新技能。作者拒绝“记得越多永远越好”的单向直觉。
    source_heading: 十一、作者分析问题的方法
  - term: 十四、全章总结
    meaning: "“合意困难”是全章的边界概念。跳伞学校的低台、滑索、高塔和实跳之所以有效，不是因为它们让米娅害怕，而是因为每一级困难都接近目标、可以克服、带有反馈，并逐步训练真实任务中的判断与动作。相反，考试焦虑、完全不懂的语言、无关运动和无法恢复的遗忘只会浪费有限认知资源。"
    source_heading: 十四、全章总结
