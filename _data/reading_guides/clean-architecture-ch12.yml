overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 动态链接不是判断组件的唯一标准，部署边界才是核心。
  thesis_source: 本章总结
  concepts:
  - term: 本章导读
    meaning: 随后，作者用一段约五十年的工具史解释：把编译好的文件独立组合起来，今天看似平常，早期却极其困难。
    source_heading: 本章导读
  - term: 4. Linkers：链接器
    meaning: 到 1990 年代中期，许多项目的链接时间从很长的等待降到数秒。硬件改善终于快过了当时软件规模的增长，加载时执行部分链接工作重新变得可接受。
    source_heading: 4. Linkers：链接器
  - term: 5.5 组件与 Clean Architecture 的联系
    meaning: 第 11 章通过抽象工厂展示了具体实现如何位于架构边界外侧。第 12 章进一步说明，这些实现不仅可以是类，还可以被打包成独立组件。
    source_heading: 5.5 组件与 Clean Architecture 的联系
  - term: 6.9 构建时间仍然是架构反馈
    meaning: 一个头文件变化导致大量 C++ 翻译单元重编；
    source_heading: 6.9 构建时间仍然是架构反馈
  - term: 8.6 场景判断三：两个独立服务共享表
    meaning: 两个服务分别部署，却直接读写同一组内部数据库表，任何表结构变化都要求双方同步发布。
    source_heading: 8.6 场景判断三：两个独立服务共享表
  - term: 本章总结
    meaning: Minecraft Mod 与 ReSharper 展示了组件可以通过放入指定文件来扩展宿主。
    source_heading: 本章总结
  logic:
  - 本章导读
  - 4. Linkers：链接器
  - 5.2 本章完整论证链
  - 6.9 构建时间仍然是架构反馈
  - 8.2 依赖与构建检查清单
  - 8.10 快速复述练习
  - 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 12 章首页第 12 章是 Part IV“组件原则”的开篇。
    - SOLID 原则讨论如何把代码组织成类与模块，像是把砖块砌成墙和房间；
    - 组件可以静态链接进一个程序，也可以被打进归档，还可以在运行时作为插件加载。
    - 随后，作者用一段约五十年的工具史解释：把编译好的文件独立组合起来，今天看似平常，早期却极其困难。
  - title: 2. A Brief History of Components：组件简史
    source_heading: 2. A Brief History of Components：组件简史
    paragraphs:
    - 程序开头常有一条 origin 语句，告诉汇编器后续代码从某个地址开始。程序中的跳转、数据访问和子程序调用会据此生成地址。
    - 作者在脚注中回忆，他的第一位雇主把几十叠子程序库穿孔卡放在架子上。开发新程序时，程序员会拿来需要的那叠卡片，接到自己的程序卡片后面。
    - 原书图示：Figure 12.1 与 Figure 12.2：早期内存布局原书 Figure 12.1 中，函数库被放在一个预先约定的位置。应用只能使用库前面留下的地址空间。
    - 这不是某位程序员规划得不够好，而是固定地址方案的结构性缺陷：每个模块的大小和位置都影响其他模块，模块无法独立变化。
  - title: 4. Linkers：链接器
    source_heading: 4. Linkers：链接器
    paragraphs:
    - 1980 年代末以后，磁盘速度、内存容量和处理器性能快速提升。更多磁盘内容可以被缓存到内存，处理速度也提高了多个数量级。
    - 到 1990 年代中期，许多项目的链接时间从很长的等待降到数秒。硬件改善终于快过了当时软件规模的增长，加载时执行部分链接工作重新变得可接受。
    - 运行时，宿主调用插件实现；源码依赖上，插件通常依赖宿主定义的接口。这与第 11 章 DIP 的结构一致，只是实现单元从类扩大成了可部署组件。
    - 选择静态还是动态链接，要考虑部署、启动性能、安全、升级和平台约束，而不是把某一种形式当成架构成熟度排名。
  - title: 5.2 本章完整论证链
    source_heading: 5.2 本章完整论证链
    paragraphs:
    - 库单独编译后，固定地址又造成程序分段和内存碎片；
    - 外部引用和外部定义让模块通过符号而非固定地址连接；
    - 软件规模增长后，每次加载都链接变得太慢；
    - 硬件性能提升后，加载时动态链接重新可行；
  - title: 5.5 组件与 Clean Architecture 的联系
    source_heading: 5.5 组件与 Clean Architecture 的联系
    paragraphs:
    - 第 11 章通过抽象工厂展示了具体实现如何位于架构边界外侧。第 12 章进一步说明，这些实现不仅可以是类，还可以被打包成独立组件。
    - 加载器或组合根在运行时连接双方。
  - title: 6.9 构建时间仍然是架构反馈
    source_heading: 6.9 构建时间仍然是架构反馈
    paragraphs:
    - 修改一个内部类，却触发全仓库重建；
    - 一个头文件变化导致大量 C++ 翻译单元重编；
    - 一个包升级迫使所有服务重新打包；
  - title: 8.2 依赖与构建检查清单
    source_heading: 8.2 依赖与构建检查清单
    paragraphs:
    - 修改一个组件会重建哪些其他组件？
    - 依赖是否都在构建清单中显式声明？
    - 是否能复用未变化组件的构建产物？
    - 全量构建与增量构建分别需要多久？
  - title: 8.6 场景判断三：两个独立服务共享表
    source_heading: 8.6 场景判断三：两个独立服务共享表
    paragraphs:
    - 两个服务分别部署，却直接读写同一组内部数据库表，任何表结构变化都要求双方同步发布。
    - 判断： 物理部署分开，但独立开发和演进能力很弱。组件边界被共享数据契约穿透。
  - title: 8.10 快速复述练习
    source_heading: 8.10 快速复述练习
    paragraphs:
    - 为什么库以源码复用会让编译越来越慢？
    - 为什么 1990 年代动态链接重新可行？
    - 插件文件为什么只是组件架构的技术基础，而不是全部设计？
    - 第 13、14 章将接着回答什么问题？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 编译型语言的组件常是二进制聚合，解释型语言也可以用源文件聚合形成组件。
    - 程序和库扩大后，链接加载器每次运行都解析大量库，启动可能耗时一小时以上。
    - Minecraft Mod 与 ReSharper 展示了组件可以通过放入指定文件来扩展宿主。
    - 第 12 章回答组件是什么和它怎样形成；第 13、14 章将回答组件如何内聚与耦合。
  takeaways:
  - Part IV 把讨论层次从类和模块提升到组件。
  - 早期程序员必须亲自安排程序的内存位置和布局。
  - 库继续增长会迫使所有程序重新安排内存，导致持续碎片化和全局协调。
  - 链接与加载因此分开：链接器预先完成慢工作，加载器快速装入已链接产物。
  - 第 12 章回答组件是什么和它怎样形成；第 13、14 章将回答组件如何内聚与耦合。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.2 “组件一定是二进制文件”」？
  answer: 错误。原书明确指出，解释型语言中的组件也可以由源文件聚合而成。关键是部署边界，不是文件是否包含机器码。
  source_heading: 7.2 “组件一定是二进制文件”
- level: 概念辨析
  question: 原文如何解释「7.5 “有多个 .jar 就是良好组件架构”」？
  answer: 错误。文件分开只证明构建产物分开。若依赖循环、接口不稳定或必须锁步发布，组件仍缺乏独立性。
  source_heading: 7.5 “有多个 .jar 就是良好组件架构”
- level: 概念辨析
  question: 原文如何解释「7.9 “静态链接比动态链接落后”」？
  answer: 错误。二者服务不同约束。静态链接有单文件分发、可预测依赖和启动简单等优点；动态链接更便于插件与独立替换。
  source_heading: 7.9 “静态链接比动态链接落后”
- level: 概念辨析
  question: 原文如何解释「7.12 “PDP-8 示例需要逐条掌握汇编”」？
  answer: 不需要。本章只要求理解 origin 语句、固定位置假设以及不可重定位造成的耦合。
  source_heading: 7.12 “PDP-8 示例需要逐条掌握汇编”
- level: 概念辨析
  question: 原文如何解释「7.16 “容器镜像就是系统唯一的组件边界”」？
  answer: 不一定。镜像是服务层交付物，内部仍可能包含可独立构建和替换的库组件。分析时要说明粒度。
  source_heading: 7.16 “容器镜像就是系统唯一的组件边界”
