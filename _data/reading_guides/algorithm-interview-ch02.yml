overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章主线」建立了怎样的核心认识？
  question_source: 0. 本章主线
  thesis: 连续头插自然反转；连续尾插保持读取顺序。区间反转和 k 组反转本质上是局部头插，奇偶分组和筛选则是多条链上的稳定尾插。
  thesis_source: 本章总结
  concepts:
  - term: 0. 本章主线
    meaning: 数组用连续索引组织序列，链表则把“元素值”和“下一个结点在哪里”一起保存在结点中。地址可以不连续，改变序列关系主要靠改指针，而不是搬移整段元素。
    source_heading: 0. 本章主线
  - term: 2.1 链表概述
    meaning: 链表题中的“交换结点”通常要求改变连接关系，不能只交换值；“深拷贝”要求新旧结点身份完全不同；“相交链表”判断的是两个指针是否指向同一结点，而不是值是否相等。
    source_heading: 2.1 链表概述
  - term: 2.2 链表基本操作的算法设计
    meaning: 题目按位置编号分组：第 1、3、5 个结点在前，第 2、4、6 个结点在后，并保持各组内部相对顺序。这里的“奇偶”不是结点值的奇偶，也不是从
      0 开始的数组索引奇偶。
    source_heading: 2.2 链表基本操作的算法设计
  - term: 2.4 有序链表的算法设计
    meaning: 每次选择剩余最高指数，故输出指数严格下降；相同指数只在同一轮合并一次；系数和为 0 时省略，因此没有零系数项。输入标准形式是该证明的重要前提。
    source_heading: 2.4 有序链表的算法设计
  - term: 代码与推导的对应关系
    meaning: 随机指针链和环形链表不是简单的树形所有权，不能在 C++ 中未经设计就让多个独占智能指针指向同一结点。该所有权设计属于工程层面的补充，不是原书本章重点。
    source_heading: 代码与推导的对应关系
  - term: 本章总结
    meaning: Floyd 方法利用模环长的相对速度避免哈希集合；随机链复制把对应关系临时编码为“复制结点紧随原结点”，避免显式映射。二者都依赖严格结构不变量，而不是技巧记忆。
    source_heading: 本章总结
  logic:
  - 0. 本章主线
  - 2.1 链表概述
  - 2.2 链表基本操作的算法设计
  - 2.3 链表的分组算法设计
  - 2.4 有序链表的算法设计
  - 代码与推导的对应关系
  - 本章总结
  sections:
  - title: 0. 本章主线
    source_heading: 0. 本章主线
    paragraphs:
    - 数组用连续索引组织序列，链表则把“元素值”和“下一个结点在哪里”一起保存在结点中。地址可以不连续，改变序列关系主要靠改指针，而不是搬移整段元素。
    - 当前指针指向哪个结点，还是可能为空？
    - 修改后是否丢失结点、形成意外环或留下旧连接？
    - 题目要求复用原结点，还是必须创建全新结点？
  - title: 2.1 链表概述
    source_heading: 2.1 链表概述
    paragraphs:
    - 链表题中的“交换结点”通常要求改变连接关系，不能只交换值；“深拷贝”要求新旧结点身份完全不同；“相交链表”判断的是两个指针是否指向同一结点，而不是值是否相等。
    - 循环链表：尾结点不指向空，而是连回某个约定结点；遍历终止条件不能再写成“直到空”。
    - 后续正文中的 C++ 函数都沿用这一结点定义。每个题解代码块只展示该题的核心函数，和这里的定义放在同一源文件即可编译。
    - 迁移抓手：链表操作先问“我是否已经拿到目标位置的前驱”。拿到后，插删是常数次改边；没拿到时，查找前驱才是主要成本。
  - title: 2.2 链表基本操作的算法设计
    source_heading: 2.2 链表基本操作的算法设计
    paragraphs:
    - 本节把遍历、插入、删除、头插和尾插组合成完整题目。分析链表代码时，不要只看结点值，应在纸上画出“修改前的边、要删除的边、要新建的边”。
    - 题目按位置编号分组：第 1、3、5 个结点在前，第 2、4、6 个结点在后，并保持各组内部相对顺序。这里的“奇偶”不是结点值的奇偶，也不是从 0 开始的数组索引奇偶。
    - 勘误说明： 原书文字有“若初始 fast 和 slow 指向同一个结点，则有环”的表述。
    - 右侧正是 random 目标之后插入的复制结点；若原 random 为空，则复制 random 也为空。
  - title: 2.3 链表的分组算法设计
    source_heading: 2.3 链表的分组算法设计
    paragraphs:
    - 分组题的共同结构是：找到一段连续结点，只改这段内部次序，再把“前缀—修改段—后缀”重新接好。哨兵让第一组从首结点开始时也有统一前驱。
    - 每两个相邻结点一组，交换结点身份而非只交换值；最后不足两结点的组保持不变。
    - 每个完整的 k 结点组反转，末尾不足 k 个保持原序。真正难点是确认组完整后再修改；若先反转才发现不够 k 个，还要恢复。
    - 迁移抓手：凡是“完整组才处理”的链表题，先探测组尾、保存组后继，再改边；不要边改边数，否则发现残组时需要恢复。
  - title: 2.4 有序链表的算法设计
    source_heading: 2.4 有序链表的算法设计
    paragraphs:
    - 有序链表与有序数组共享“相同值连续、当前首结点是剩余最小值”的性质，但链表没有随机访问。优势是归并时可直接重连结点，无需移动后缀。
    - 迁移抓手：链表无法随机访问，但每条有序链的表头就是该路最小候选；把“当前表头”放堆即可，不要把全部结点预先入堆。
    - 每次选择剩余最高指数，故输出指数严格下降；相同指数只在同一轮合并一次；系数和为 0 时省略，因此没有零系数项。输入标准形式是该证明的重要前提。
    - 这种模式可迁移到“两个按键有序的稀疏表示做合并”：键不同就输出较大/较小键，键相同就聚合值，聚合为单位元时省略。
  - title: 代码与推导的对应关系
    source_heading: 代码与推导的对应关系
    paragraphs:
    - 生产代码还应使用 RAII/智能指针明确所有权，尤其是共享、随机或循环引用结构。
    - Go：指针脱链后由垃圾回收器处理；结构体指针可直接比较身份。
    - 随机指针链和环形链表不是简单的树形所有权，不能在 C++ 中未经设计就让多个独占智能指针指向同一结点。该所有权设计属于工程层面的补充，不是原书本章重点。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 每次修改前先保存仍需访问的入口；修改后检查从结果头出发是否恰好能到达所有应保留结点，是否遗漏、重复或意外成环。画边比只抄赋值顺序更可靠。
    - 连续头插自然反转；连续尾插保持读取顺序。区间反转和 k 组反转本质上是局部头插，奇偶分组和筛选则是多条链上的稳定尾插。
    - Floyd 方法利用模环长的相对速度避免哈希集合；随机链复制把对应关系临时编码为“复制结点紧随原结点”，避免显式映射。二者都依赖严格结构不变量，而不是技巧记忆。
    - 掌握“前驱—当前—后继”“组前驱—组尾—组后继”和“结果尾—各路当前值”三组关系，就能把本章 15 道题还原为少数可证明的连接操作，而不是 15 套孤立模板。
  takeaways:
  - 每次修改前先保存仍需访问的入口；修改后检查从结果头出发是否恰好能到达所有应保留结点，是否遗漏、重复或意外成环。画边比只抄赋值顺序更可靠。
  - 删除首结点、在首部插入、反转从位置 1 开始时，哨兵都提供统一前驱。它不减少渐近复杂度，却显著减少分支和空指针风险。
  - 连续头插自然反转；连续尾插保持读取顺序。区间反转和 k 组反转本质上是局部头插，奇偶分组和筛选则是多条链上的稳定尾插。
  - Floyd 方法利用模环长的相对速度避免哈希集合；随机链复制把对应关系临时编码为“复制结点紧随原结点”，避免显式映射。二者都依赖严格结构不变量，而不是技巧记忆。
  - 掌握“前驱—当前—后继”“组前驱—组尾—组后继”和“结果尾—各路当前值”三组关系，就能把本章 15 道题还原为少数可证明的连接操作，而不是 15 套孤立模板。
