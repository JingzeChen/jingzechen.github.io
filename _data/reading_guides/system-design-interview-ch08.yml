overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、源文边界与全章路线」建立了怎样的核心认识？
  question_source: 0. 学习目标、源文边界与全章路线
  thesis: 读多写少使缓存成为跳转路径核心。 不可变映射简化缓存，但仍要处理热点、穿透和故障回源。
  thesis_source: 21. 核心结论与一般设计方法
  concepts:
  - term: 0. 学习目标、源文边界与全章路线
    meaning: 原书先算出 10 年共有 3650 亿条记录，又在存储公式中重复乘以 10 年，因此写成 365 TB。按原假设每条 URL 100 bytes，正确的原始
      URL 数据量是 36.5 TB。若平均每条约 1 KB，则才接近 365 TB。
    source_heading: 0. 学习目标、源文边界与全章路线
  - term: 3. Step 2：API 设计
    meaning: 浏览器收到后发起第二次请求。短链服务返回的是重定向响应，不是把目标页面内容转发给用户。
    source_heading: 3. Step 2：API 设计
  - term: 7. 短码长度推导
    meaning: 若产品要求固定 7 位，可左侧补字符，但需定义前导零是否参与唯一性。原书选择“尽可能短”，因此可变长度合理。
    source_heading: 7. 短码长度推导
  - term: 8.8 优缺点
    meaning: 输入相同、salt 规则固定时可确定性生成。
    source_heading: 8.8 优缺点
  - term: 14.1 复制
    meaning: 等待副本确认后返回，代价是写延迟。
    source_heading: 14.1 复制
  - term: 21. 核心结论与一般设计方法
    meaning: 如果这些问题都能回答，就不只是掌握了 Base62 换算，而是理解了本章的统一方法：先把长期容量转化为命名空间，再选择能证明唯一性的短码生成方式；让数据库负责持久正确性、缓存负责高频跳转、异步事件负责分析，并把创建和跳转拆成可独立扩展与降级的两条路径。
    source_heading: 21. 核心结论与一般设计方法
  logic:
  - 0. 学习目标、源文边界与全章路线
  - 3. Step 2：API 设计
  - 4.3 302 Found
  - 8.8 优缺点
  - 12. URL 缩短路径深入
  - 18.4 降级
  - 21. 核心结论与一般设计方法
  sections:
  - title: 0. 学习目标、源文边界与全章路线
    source_heading: 0. 学习目标、源文边界与全章路线
    paragraphs:
    - 访问短链接时，服务查询映射并向浏览器返回 HTTP 重定向，让浏览器继续访问原始 URL。
    - 301 与 302 分别如何影响缓存、服务负载和点击统计？
    - 原书先算出 10 年共有 3650 亿条记录，又在存储公式中重复乘以 10 年，因此写成 365 TB。按原假设每条 URL 100 bytes，正确的原始
      URL 数据量是 36.5 TB。若平均每条约 1 KB，则才接近 365 TB。
    - 本文会保留作者的推理主线，同时明确纠正这两个算术/排版问题。补充的碰撞概率、并发幂等、缓存一致性、安全和分片设计属于工程背景，不是原书逐式给出的原文。
  - title: 2.2 平均读 QPS
    source_heading: 2.2 平均读 QPS
    paragraphs:
    - 跳转是主要流量，系统应优先优化读路径：无状态 Web 层、缓存、只读副本和就近入口。
    - 真实热门短链接会产生极端热点，平均 11,600 QPS 不能描述单 key 的百万级突发。
  - title: 3. Step 2：API 设计
    source_heading: 3. Step 2：API 设计
    paragraphs:
    - 若同一长 URL 已存在并返回旧映射，可返回 200；具体状态码取决于幂等语义。
    - 浏览器收到后发起第二次请求。短链服务返回的是重定向响应，不是把目标页面内容转发给用户。
  - title: 4.3 302 Found
    source_heading: 4.3 302 Found
    paragraphs:
    - 每次点击增加短链服务负载和延迟；
    - 仍要显式控制缓存头，302 并非绝对不可缓存。
  - title: 7. 短码长度推导
    source_heading: 7. 短码长度推导
    paragraphs:
    - Base62 唯一 ID 编码不会随机碰撞，但随机/哈希选码时，负载因子越高，冲突重试越频繁。
    - 若产品要求固定 7 位，可左侧补字符，但需定义前导零是否参与唯一性。原书选择“尽可能短”，因此可变长度合理。
  - title: 8.8 优缺点
    source_heading: 8.8 优缺点
    paragraphs:
    - 输入相同、salt 规则固定时可确定性生成。
    - 截断 hex 可能严重缩小空间。
  - title: 12. URL 缩短路径深入
    source_heading: 12. URL 缩短路径深入
    paragraphs:
    - 把 ID 转为 Base62 shortURL；
    - 第 7 章的 Snowflake 可生成全局唯一 64-bit ID。Base62 只改变表示，不增加或减少唯一性。
    - 所以任意非负有符号 64-bit ID 最多需要 11 个 Base62 字符。
    - 如果业务不要求同 URL 复用短码，可省略反向查询，直接生成新 ID 并插入，吞吐更高。同一 URL 可拥有多个短码，适合不同活动单独统计。
  - title: 14.1 复制
    source_heading: 14.1 复制
    paragraphs:
    - 多个只读副本承载 cache miss；
    - 使用 read-your-writes token；
    - 等待副本确认后返回，代价是写延迟。
  - title: 18.4 降级
    source_heading: 18.4 降级
    paragraphs:
    - 缓存故障：限流回源数据库，防止雪崩；
    - 分析系统故障：跳转继续，事件暂存/丢弃；
    - 创建数据库故障：创建暂不可用，旧链接继续；
    - 单地域故障：DNS/全局负载均衡切换。
  - title: 21. 核心结论与一般设计方法
    source_heading: 21. 核心结论与一般设计方法
    paragraphs:
    - 平均 QPS 只是起点。 创建约 1160 QPS、跳转约 11,600 QPS，但热门 code 和峰值决定容量。
    - 7 位不是任意 64-bit ID 的固定长度。 完整有符号 64-bit 空间最多需要 11 位 Base62。
    - Web 层无状态扩展，数据库多副本并按 short code/ID 路由；创建、ID 和分析故障不影响已有跳转。
    - 如果这些问题都能回答，就不只是掌握了 Base62 换算，而是理解了本章的统一方法：先把长期容量转化为命名空间，再选择能证明唯一性的短码生成方式；让数据库负责持久正确性、缓存负责高频跳转、异步事件负责分析，并把创建和跳转拆成可独立扩展与降级的两条路径。
  takeaways:
  - Bloom filter 预筛选；
  - 7 位不是任意 64-bit ID 的固定长度。 完整有符号 64-bit 空间最多需要 11 位 Base62。
  - Web 层无状态扩展，数据库多副本并按 short code/ID 路由；创建、ID 和分析故障不影响已有跳转。
  - 能否说明 Bloom filter 与数据库唯一约束的不同职责？
  - 如果这些问题都能回答，就不只是掌握了 Base62 换算，而是理解了本章的统一方法：先把长期容量转化为命名空间，再选择能证明唯一性的短码生成方式；让数据库负责持久正确性、缓存负责高频跳转、异步事件负责分析，并把创建和跳转拆成可独立扩展与降级的两条路径。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「19.3 哈希与 Base62」？
  answer: Base62 不增加熵，也不隐藏顺序 ID。
  source_heading: 19.3 哈希与 Base62
- level: 概念辨析
  question: 原文如何解释「19.10 301 一定不再经过服务」？
  answer: 客户端可能缓存，但行为受缓存策略和实现影响。不能把 301 当作精确一次统计机制。
  source_heading: 19.10 301 一定不再经过服务
- level: 概念辨析
  question: 原文如何解释「19.14 顺序 ID 等于数据库写入均匀」？
  answer: 若按 ID 范围分片，所有新写入会集中到尾 shard。可用哈希分片或逻辑 shard 分散。
  source_heading: 19.14 顺序 ID 等于数据库写入均匀
- level: 概念辨析
  question: 原文如何解释「19.17 生成唯一 ID 就实现业务幂等」？
  answer: 客户端重试可生成多个不同 ID。幂等键或 long URL 唯一约束仍需设计。
  source_heading: 19.17 生成唯一 ID 就实现业务幂等
- level: 概念辨析
  question: 原文如何解释「19.20 分析请求数等于真人点击数」？
  answer: Bot、预取、重试、缓存和重复用户都会改变口径。分析必须定义去重和过滤。
  source_heading: 19.20 分析请求数等于真人点击数
