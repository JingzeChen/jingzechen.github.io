  question_source: 本章要解决什么问题
  thesis: 本章从简单 RMQ 出发，依次扩展到懒标记、动态开点和离散化。表面上模板越来越复杂，实质始终是同一条推理链：把大区间答案写成小区间的合并，把可整段执行的修改写成可组合标记，只在边界被打破时继续下传。掌握不变量和操作代数，才能根据题目设计线段树，而不是机械套用某一份代码。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 正文共有 7 个题目小节：12.2 的 3 题、12.3 的 2 题和 12.4 的 2 题。每题在下一题开始前给出独立的 C++17 接口；Python
      3 与 Go 1.22 的完整同构接口只保留在章末附录。
    source_heading: 本章要解决什么问题
  - term: 12.1 线段树概述
    meaning: 具体到正文：303 没有修改，本应优先用前缀和，但为展示构建与查询保留静态树；327 若坐标在线未知可用动态开点，批处理时已知全部前缀和则迁移到离散化；715
      的值域大且覆盖/删除在线交错，应同时采用动态开点和覆盖懒标记；315 的全部值一开始已知且只比较大小，普通离散化最合适。
    source_heading: 12.1 线段树概述
  - term: 12.3 复杂线段树应用的算法设计
    meaning: 补充：有序区间集合。 也可以维护互不相交的有序区间，添加时合并重叠段，删除时切分，查询时找包含区间。该方法在区间数量少时直观，但单次操作复杂度还取决于被合并或切分的区间数；动态线段树提供稳定的值域对数上界。
    source_heading: 12.3 复杂线段树应用的算法设计
  - term: 12.4 离散化在线段树中的应用
    meaning: 内的次数。动态开点版本直接把原前缀和值作为树坐标；本节改为先收集所有会访问的坐标，再建立静态线段树。
    source_heading: 12.4 离散化在线段树中的应用
  - term: 15. 不是所有区间题都应使用线段树
    meaning: 区间数量很少时可维护有序不交区间。
    source_heading: 15. 不是所有区间题都应使用线段树
  - term: 本章总结
    meaning: 本章从简单 RMQ 出发，依次扩展到懒标记、动态开点和离散化。表面上模板越来越复杂，实质始终是同一条推理链：把大区间答案写成小区间的合并，把可整段执行的修改写成可组合标记，只在边界被打破时继续下传。掌握不变量和操作代数，才能根据题目设计线段树，而不是机械套用某一份代码。
    source_heading: 本章总结
