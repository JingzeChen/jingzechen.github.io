  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 差分适合多次离线区间修改，却不能在每次修改后立即给出任意区间答案。
    - 每个结点负责一个确定的连续区间；
    - 父结点的答案可由两个子区间的答案合并得到。
    - 正文共有 7 个题目小节：12.2 的 3 题、12.3 的 2 题和 12.4 的 2 题。每题在下一题开始前给出独立的 C++17 接口；Python
      3 与 Go 1.22 的完整同构接口只保留在章末附录。
  - title: 12.1 线段树概述
    source_heading: 12.1 线段树概述
    paragraphs:
    - 它不天然解决图连通、无序集合搜索或必须保存全部元素分布的问题。若只做静态查询，稀疏表、前缀和往往更简单；若只做单点加与前缀和，树状数组通常常数更小。
    - 复杂线段树在简单树基础上支持区间修改。原书先以“区间加 + 区间最小值”说明懒标记，再以“区间赋值 + 区间和”的吊钩题展示不同标记语义。
    - 补充：保距离散化。 涉及连续长度、面积或区间并时，结点必须结合原坐标差计算长度，或把端点及必要的相邻位置一并加入坐标集合。普通排名只保序，不保距离。
    - 具体到正文：303 没有修改，本应优先用前缀和，但为展示构建与查询保留静态树；327 若坐标在线未知可用动态开点，批处理时已知全部前缀和则迁移到离散化；715
      的值域大且覆盖/删除在线交错，应同时采用动态开点和覆盖懒标记；315 的全部值一开始已知且只比较大小，普通离散化最合适。
  - title: 12.2 简单线段树应用的算法设计
    source_heading: 12.2 简单线段树应用的算法设计
    paragraphs:
    - 构建归纳保证每个结点保存其区间准确总和。查询把目标区间分成若干互不重叠的完整结点区间，相加恰好覆盖每个目标元素一次，所以结果正确。
    - 单点更新正确维护展开数组；每个行查询准确返回该行与矩形交集的和，所有行累加即为矩形和。
    - 树的每个叶子坐标代表一个可能的前缀和值 v，叶子值表示该值在历史前缀中出现的次数；内部结点保存其值域区间内的总次数。
    - 原书在 12.4.1 节还会对同一题给出“离散化 + 静态线段树”版本，两者维护的频次不变量相同，只是值域表示不同。
  - title: 12.3 复杂线段树应用的算法设计
    source_heading: 12.3 复杂线段树应用的算法设计
    paragraphs:
    - 查询把目标拆成不重叠结点区间，覆盖长度之和等于目标真实覆盖长度。该长度等于目标总长度，当且仅当每个单位区间都被跟踪。
    - 补充：有序区间集合。 也可以维护互不相交的有序区间，添加时合并重叠段，删除时切分，查询时找包含区间。该方法在区间数量少时直观，但单次操作复杂度还取决于被合并或切分的区间数；动态线段树提供稳定的值域对数上界。
    - 所以查询下标 0、1、2 分别得到 26、34、20；第一次乘法后查询下标 0 得 10。
    - 完整区间操作按上式更新标记；部分操作或点查询前，函数复合公式把父变换按正确时间顺序传给孩子。
  - title: 12.4 离散化在线段树中的应用
    source_heading: 12.4 离散化在线段树中的应用
    paragraphs:
    - 内的次数。动态开点版本直接把原前缀和值作为树坐标；本节改为先收集所有会访问的坐标，再建立静态线段树。
    - 因为三个量都被收集，查询边界一定能精确映射，不需要在压缩数组中再求近似位置。
    - 查询过程与 12.2.3 完全相同，只是区间端点替换为这些值的压缩下标，最终答案仍为 3。
  - title: 三种语言中的实现差异
    source_heading: 三种语言中的实现差异
    paragraphs:
    - 补充： 三种程序保持相同算法不变量，差异来自内存模型、整数类型和容器接口。
    - 动态树的空孩子并非错误；查询函数必须先判断空指针并返回题目定义的默认摘要。
    - Python 和 Go 没有完全相同的整数引用参数，示例改用对象指针或返回对象；这只改变存储写法，不改变区间递归。
  - title: 15. 不是所有区间题都应使用线段树
    source_heading: 15. 不是所有区间题都应使用线段树
    paragraphs:
    - 单点加与前缀统计可考虑树状数组；
    - 区间数量很少时可维护有序不交区间。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 标记不变量：当前结点值已反映全部更新，懒标记只表示尚未传给孩子的操作。
    - 只要这三层始终成立，构建、查询、更新、动态开点和离散化都只是不同的存储与遍历方式。
    - 其中 U 是原值域长度，q 是操作数，d 是不同坐标数，h 是查询矩形高度。
    - 本章从简单 RMQ 出发，依次扩展到懒标记、动态开点和离散化。表面上模板越来越复杂，实质始终是同一条推理链：把大区间答案写成小区间的合并，把可整段执行的修改写成可组合标记，只在边界被打破时继续下传。掌握不变量和操作代数，才能根据题目设计线段树，而不是机械套用某一份代码。
  takeaways:
  - 区间不变量：每个结点唯一负责一个闭区间，两个孩子不交且并集为父区间；
  - 只要这三层始终成立，构建、查询、更新、动态开点和离散化都只是不同的存储与遍历方式。
  - 区间是数组下标、数值坐标，还是单位线段？
  - 更新是增加、赋值、覆盖，还是仿射变换，标记如何复合？
  - 本章从简单 RMQ 出发，依次扩展到懒标记、动态开点和离散化。表面上模板越来越复杂，实质始终是同一条推理链：把大区间答案写成小区间的合并，把可整段执行的修改写成可组合标记，只在边界被打破时继续下传。掌握不变量和操作代数，才能根据题目设计线段树，而不是机械套用某一份代码。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 线段树结点表示区间，不是只表示一个元素」？
  answer: 非叶结点保存整段摘要，区间查询快的原因正是能一次使用完整结点，而不是总走到叶子。
  source_heading: 1. 线段树结点表示区间，不是只表示一个元素
- level: 概念辨析
  question: 原文如何解释「5. 查询的“完全覆盖”方向容易写反」？
  answer: 这时结点摘要才可整体使用。查询区间包含在当前结点内并不代表可以直接返回父结点，因为父结点还含目标外元素。
  source_heading: 5. 查询的“完全覆盖”方向容易写反
- level: 概念辨析
  question: 原文如何解释「11. 动态开点仍需要根值域和默认状态」？
  answer: 动态树省略的是未访问结点，不是无限值域。必须给出根端点，并定义未创建位置是 0、未覆盖，还是不参与聚合。默认状态选择错误会让父结点合并出错。
  source_heading: 11. 动态开点仍需要根值域和默认状态
- level: 概念辨析
  question: 原文如何解释「12. 离散化只保证顺序，不保证距离」？
  answer: 坐标 2 和 100 压缩后可能相邻，但真实距离仍是 98。频次、排名和大小比较可直接压缩；覆盖长度、面积等问题必须结合原坐标差。
  source_heading: 12. 离散化只保证顺序，不保证距离
- level: 概念辨析
  question: 原文如何解释「15. 不是所有区间题都应使用线段树」？
  answer: 区间数量很少时可维护有序不交区间。
  source_heading: 15. 不是所有区间题都应使用线段树
