overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章核心结论」建立了怎样的核心认识？
  question_source: 一、本章核心结论
  thesis: 本质：关系的基础是本性和品德，而非言语和技巧；
  thesis_source: 一、本章核心结论
  concepts:
  - term: 一、本章核心结论
    meaning: 人际关系的效能不取决于交往技巧，而取决于个人品德所积累的信任；信任像账户一样通过长期、具体、由对方认可的行为存入，也会被粗鲁、失信和背后议论迅速提取。
    source_heading: 一、本章核心结论
  - term: 3. 重建账户的方式
    meaning: 最重要的是单纯聆听——不插入判断、不搬出自己的过去。
    source_heading: 3. 重建账户的方式
  - term: 3. 案例的结论
    meaning: 人的内心都是极其柔弱和敏感的，不分年龄和资历。哪怕在最坚强和冷漠的外表下，也往往隐藏着一颗脆弱的心。
    source_heading: 3. 案例的结论
  - term: 八、投资方式四：明确期望
    meaning: 员工问何时能拿到职责描述，老板说正在等员工先拿来讨论；员工认为应由老板界定，老板认为一开始就说过由员工自己决定。
    source_heading: 八、投资方式四：明确期望
  - term: 十五、本章完整论证链
    meaning: 综上，公众领域的成功必须建立在品德、信任和长期投资之上，习惯四、五、六才能真正发挥作用。
    source_heading: 十五、本章完整论证链
  - term: 二十一、本章结论
    meaning: 情感账户之所以是一个有力的模型，是因为它把抽象的信任变成了可观察、可积累、可修复的过程。它同时提醒两件事：信任不会因为一次盛大的表达而建立，也不会因为一次真诚的道歉而自动恢复；它由无数被对方感受到的小事构成。
    source_heading: 二十一、本章结论
  logic:
