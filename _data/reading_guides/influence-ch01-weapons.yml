  minutes: 10
  question: 0. 导读：第一章在全书中承担什么任务？
  question_source: 0. 导读：第一章在全书中承担什么任务
  thesis: 影响力武器的力量主要来自接受者已有的心理原则。 请求者像柔道练习者一样调整方向和时机，因此投入小、效果大、痕迹弱。
  thesis_source: 18. 本章总结：知识结构、核心结论与一般方法
  concepts:
  - term: 0. 导读：第一章在全书中承担什么任务
    meaning: 章首引用爱因斯坦的大意是：凡事应尽可能简单，但不能简单过头。它提前概括了全章张力：判断捷径把复杂世界压缩到少数关键特征，是必要的“简单”；若把线索当成绝对真理，忽略它与真实对象已经脱节，就成了“过度简单”。
    source_heading: 0. 导读：第一章在全书中承担什么任务
  - term: 4. 复印机实验：“因为”与理由的外壳
    meaning: 正确应用不是给任何要求机械加上“因为”，而是认识到理由的外壳可能先于理由的质量影响判断；作为请求者应提供真实相关的理由，作为接受者则应检查“因为”后面是否真的增加了信息。
    source_heading: 4. 复印机实验：“因为”与理由的外壳
  - term: 9. “以柔克刚”：影响力武器的三个共同特征
    meaning: "“以柔克刚”只描述用力方式：使用者借用现有心理力量，不直接强迫。它不自动赋予行为道德正当性。隐蔽、低成本的影响反而可能更难识别、更容易规模化。"
    source_heading: 9. “以柔克刚”：影响力武器的三个共同特征
  - term: 11. 对比原理怎样进入销售流程
    meaning: 本章末尾用一封虚构风格的家书展示对比原理。女大学生先让父母以为她经历宿舍火灾、跳楼受伤、住院、怀孕、订婚和感染；随后才说明这些都没有发生，真正的坏消息只是美国历史得了
      D、化学得了 F。
    source_heading: 11. 对比原理怎样进入销售流程
  - term: 16.1 九步识别流程
    meaning: 下面是一套依据本章整理的检查算法。它不是原书正式算法，而是把作者的分析路径转成实践步骤。
    source_heading: 16.1 九步识别流程
  - term: 18. 本章总结：知识结构、核心结论与一般方法
    meaning: 第一章真正要读者“武装”起来的，不是一包反向操纵别人的话术，而是一种观察方式：看到一个顺从结果时，不只问“这个人为什么愿意”，还要追问他刚刚看到了什么线索、采用了哪条经验规则、先前参照是什么、线索是否真实，以及谁从这套自动过程里获利。
    source_heading: 18. 本章总结：知识结构、核心结论与一般方法
