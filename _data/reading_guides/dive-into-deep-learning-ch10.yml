overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 从普通 RNN 到现代序列模型」建立了怎样的核心认识？
  question_source: 1. 从普通 RNN 到现代序列模型
  thesis: 明确 encoder 输出接口：最终状态、全时间输出、valid length 和 mask 是否都传给 decoder？
  thesis_source: 14. 核心结论与解决问题的一般思路
  concepts:
  - term: 1. 从普通 RNN 到现代序列模型
    meaning: 本章的 LSTM、GRU 和 seq2seq 都早于 Transformer。它们仍是在线流式处理、小内存推理、时间序列和有限数据任务的重要基线；同时，门控、残差式状态路径、编码器—解码器和自回归解码也深刻影响了后续架构。
    source_heading: 1. 从普通 RNN 到现代序列模型
  - term: 4. 深层循环神经网络
    meaning: 单层 RNN 已沿时间展开 T 次，具有时间深度；但同一时间步从输入到输出只有一层 recurrent 变换。深层 RNN 再沿垂直方向堆叠
      L 层，以学习更复杂的逐时刻表示。
    source_heading: 4. 深层循环神经网络
  - term: 7.1 为什么拆成两个组件
    meaning: decoder：作为条件语言模型，根据编码状态和目标左侧前缀，逐词预测后续目标。
    source_heading: 7.1 为什么拆成两个组件
  - term: 7.2 Encoder 接口
    meaning: CNN/Transformer 特征。
    source_heading: 7.2 Encoder 接口
  - term: 9. 序列搜索：贪心、穷举与束搜索
    meaning: 每次 top-k 不只重排 token 序列，也必须按所选 parent beam 重排 decoder hidden/cell state。若状态和前缀错配，代码形状合法却计算错误概率。
    source_heading: 9. 序列搜索：贪心、穷举与束搜索
  - term: 14. 核心结论与解决问题的一般思路
    meaning: 本章把第 9 章“固定维状态递推”的思想推进到实际序列转换系统：LSTM 以独立 cell state 和三门精细管理记忆，GRU 用两门获得更轻量的近似；堆叠与双向结构分别增加表征深度和上下文范围；编码器—解码器把未对齐变长序列转成条件语言建模，teacher
      forcing 让训练可行，mask 让批量公平，束搜索则在指数输出树中保留有限多种未来。每个改进都解决一个具体瓶颈，也引入新的接口、计算或统计代价。
    source_heading: 14. 核心结论与解决问题的一般思路
