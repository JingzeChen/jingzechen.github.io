  - 一、本章的问题与核心答案
  - 五、昆腾公司和 Plus 开发公司
  - 七、Micropolis：管理层强力主导的转变
  - 十、克雷斯吉、伍尔沃思与折扣零售
  - 十二、跨案例比较：独立机构究竟改变了什么
  - 14.3 替代与补充方法
  - 十六、本章总结
  sections:
  - title: 一、本章的问题与核心答案
    source_heading: 一、本章的问题与核心答案
    paragraphs:
    - 第一部分解释了优秀企业为何失败；第五章开始回答“该怎样管理”。本章聚焦第一项原则：在运行良好的企业里，客户和投资者通过提供生存资源，实际控制了资源分配方向。
    - 建立面向真正需要新技术之客户的独立机构，让客户需求、收入和生存压力自然把资源拉向新业务。
    - 作者认为第二种方式成功概率高得多。独立的意义不只是物理距离，而是让新业务拥有独立的客户、损益责任、成本结构、渠道、考核和资源优先级。
    - 原章没有数学定理或固定算法。下文公式用于严格展开资源筛选、库存回报和组织经济性。
  - title: 三、创新和资源分配
    source_heading: 三、创新和资源分配
    paragraphs:
    - 其中 F 是资金，H 是人力，E 是设备，S 是销售支持，A 是管理注意力。任何关键项长期接近零，项目都可能停滞。因此企业最终推出什么，最真实地反映了资源分配，而不是战略口号。
    - 高层看到的是中层筛选后的提案集合。即使批准，日后仍有无数资源决策：优秀工程师先解决哪个问题、销售人员拜访谁、设备先给哪个产品、管理会议讨论什么。
    - 这解释了高层批准为何不足以保证结果。公式假设阶段可区分，并非用于估计真实概率。
    - 支持大获成功的项目有利于晋升；误判市场、导致产品和产能投资失败，会严重损害职业。中层自然优先支持有客户、有利润的项目。客户不需要直接参与预算会，也能通过收入预期和个人激励影响资源。
  - title: 五、昆腾公司和 Plus 开发公司
    source_heading: 五、昆腾公司和 Plus 开发公司
    paragraphs:
    - 昆腾曾是 8 英寸硬盘领导者，却晚 4 年推出 5.25 英寸产品，业务被从低端侵蚀。1984 年，几名员工发现可插入 IBM XT/AT 扩展槽的 3.5
      英寸超薄“硬卡”机会，客户是个人电脑用户而非昆腾的微型机 OEM。
    - Plus 的 Hardcard 收入弥补了昆腾 8 英寸产品衰退。到 1987 年，昆腾原 8 英寸和 5.25 英寸销售基本消失，昆腾收购 Plus
      剩余 20%，关闭旧公司，并让 Plus 高管领导重组后的企业。
    - 随后昆腾把 3.5 英寸产品卖给苹果等 OEM，再以延续性组件创新进入工作站，并顺利从 3.5 英寸转向对现有便携客户而言属延续性的 2.5 英寸。到
      1994 年，昆腾成为全球销量最大的硬盘厂商。
    - Plus 没有被要求在低毛利新市场证明对昆腾大客户的价值；个人电脑用户的购买会直接改善其损益。母公司提供资金，独立机构提供匹配的价值观与流程，形成“资源共享、选择环境分离”。
  - title: 七、Micropolis：管理层强力主导的转变
    source_heading: 七、Micropolis：管理层强力主导的转变
    paragraphs:
    - Micropolis 是 8 英寸先驱。1982 年，创始人兼 CEO 斯图尔特·梅本决定转向 5.25 英寸，并把最优秀工程师安排到新项目。公司原想兼顾下一代
      8 英寸，但旧客户持续拉走资源。
    - 梅本回忆，18 个月内几乎耗尽全部时间和精力，才保证 5.25 英寸项目获得资源。到 1984 年，公司失去微型机竞争力，撤回 8 英寸产品；新项目则成功。
    - 原书图示：Micropolis公司的技术转变和市场地位图中两条容量轨道并非平滑接续：8 英寸产品从约 20MB 上升至近 200MB，5.25 英寸则从约
      35MB 的较低起点重新增长。转换要求离开所有重要旧客户，用完全不同的台式机客户收入弥补损失。
    - Micropolis 到 1993 年才推出 3.5 英寸产品，此时容量已超过 1GB，可以卖给现有客户。这时 3.5 英寸对它已成为延续性产品，再次印证主流组织会在客户产生需求后自然投入。
  - title: 九、数字设备公司、IBM 和个人电脑
    source_heading: 九、数字设备公司、IBM 和个人电脑
    paragraphs:
    - 大型机客户不需要早期微型机，利润率和市场也更小，于是 DEC、Data General、Prime、王安等新企业建立微型机市场。后来台式个人电脑又以同样方式冲击微型机；便携式计算机再冲击台式机。
    - DEC 从 1983 至 1995 年四次推出个人电脑，又四次退出。它不缺进取心和技术，问题是四次均在母公司内进行。超高速 Alpha 微处理器、大型计算机等高性能项目更容易获得资源。
    - 即使 90 年代设个人电脑部门，其毛利率和收入增长标准仍未脱离主公司。名义独立不等于经济独立。
    - 后来加强个人电脑部门与主体机构的联系，可能是盈利能力和份额恶化的重要原因。两种成本结构和盈利模式很难在单一流程中和平共处。
  - title: 十、克雷斯吉、伍尔沃思与折扣零售
    source_heading: 十、克雷斯吉、伍尔沃思与折扣零售
    paragraphs:
    - 20 世纪 50 年代的折扣店服务少、选择有限，却以低 20% 至 40% 的价格销售消费者已熟悉的全国品牌耐用品。它服务传统零售商不重视的年轻蓝领家庭，并以低成本、自助和快速周转建立不同盈利模式。
    - 原书图示：折扣零售商市场份额增长折扣店先从五金、小家电、行李等“自我销售”的品牌耐用品进入，再上移至家具和服装。1960 至 1966 年，其同类商品销售份额从约
      10% 升至近 40%。
    - 克雷斯吉和伍尔沃思分别于 1962 年成立凯马特和伍尔科，相差不到三个月。十年后，凯马特销售近 35 亿美元；伍尔科约 9 亿美元且亏损。
    - 克雷斯吉选择彻底转型：1959 年任命哈里·卡宁安，以发展折扣零售为唯一使命；重建管理团队；1961 年停止新建量贩店，并计划每年关闭约 10% 旧店。
  - title: 十二、跨案例比较：独立机构究竟改变了什么
    source_heading: 十二、跨案例比较：独立机构究竟改变了什么
    paragraphs:
    - 能保护日常资源不被主流紧急事项抽走；
    - 可选择性使用母公司资本、品牌、技术和供应链。
  - title: 14.2 局限
    source_heading: 14.2 局限
    paragraphs:
    - 案例研究不能像随机实验完全排除管理质量、时机和竞争差异。
    - "“独立”包含多个变量，难确定客户、领导者、地理还是成本结构贡献最大。"
    - 历史结局不代表企业后来持续成功，例如凯马特之后仍衰落。
    - 强监管、重大安全风险或高固定资本行业不易建立完整独立机构。
  - title: 14.3 替代与补充方法
    source_heading: 14.3 替代与补充方法
    paragraphs:
    - 自治事业部：不必法律分拆，但独立损益、客户和指标。
    - 内部创业基金：按学习里程碑分阶段拨款，避免与主业务 NPV 直接比较。
    - 收购后保持独立：获取新价值网，同时防止流程同化。
    - 外部合资：共享风险和能力，但需明确控制权与资源承诺。
  - title: 十六、本章总结
    source_heading: 十六、本章总结
    paragraphs:
    - 第五章把“客户控制资源”从失败原因转化为管理杠杆。成熟组织不投资破坏性项目，并非只因管理者没远见，而是客户、利润、职业激励和日常流程共同把资源拉向主流业务。
    - 昆腾、数据控制、IBM、凯马特和惠普的共同做法，是把新业务放入真正需要它的价值网，使小市场和低毛利不再是缺陷，而成为机构赖以生存的机会。DEC 和伍尔科则说明，名义上的新部门如果仍服从母公司的客户、成本和盈利标准，独立只是形式。
    - 本章最重要的结论是：不要试图只靠意志让主流组织长期做它认为不合理的事；应让破坏性业务面对一组能使正确行为自然获得资源的客户和经济条件。独立机构不是万能答案，却是客户、盈利模式和流程发生根本冲突时，最可复制的组织解法。
  takeaways:
  - 第五章把“客户控制资源”从失败原因转化为管理杠杆。成熟组织不投资破坏性项目，并非只因管理者没远见，而是客户、利润、职业激励和日常流程共同把资源拉向主流业务。
  - 昆腾、数据控制、IBM、凯马特和惠普的共同做法，是把新业务放入真正需要它的价值网，使小市场和低毛利不再是缺陷，而成为机构赖以生存的机会。DEC 和伍尔科则说明，名义上的新部门如果仍服从母公司的客户、成本和盈利标准，独立只是形式。
  - 本章最重要的结论是：不要试图只靠意志让主流组织长期做它认为不合理的事；应让破坏性业务面对一组能使正确行为自然获得资源的客户和经济条件。独立机构不是万能答案，却是客户、盈利模式和流程发生根本冲突时，最可复制的组织解法。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「13.1 “客户控制资源”意味着管理者无用」？
  answer: 不对。管理者难以命令旧系统长期违背生存逻辑，却可以选择服务对象、设计组织边界和配置资本。
  source_heading: 13.1 “客户控制资源”意味着管理者无用
- level: 概念辨析
  question: 原文如何解释「13.3 地理分离就等于战略独立」？
  answer: 不对。DEC 的个人电脑部门说明，若仍按母公司毛利和增长标准考核，换办公室没有意义。
  source_heading: 13.3 地理分离就等于战略独立
- level: 概念辨析
  question: 原文如何解释「13.4 独立机构不能共享母公司资源」？
  answer: 不对。Plus 使用昆腾资本，IBM PC 使用企业品牌，惠普两部门可共享技术基础。应隔离不相容的流程和价值观，而非切断一切联系。
  source_heading: 13.4 独立机构不能共享母公司资源
- level: 概念辨析
  question: 原文如何解释「13.6 蚕食现有业务一定有害」？
  answer: 不对。若替代不可避免，不自我蚕食通常意味着被别人蚕食。需要比较整体企业价值，而非单部门收入。
  source_heading: 13.6 蚕食现有业务一定有害
- level: 概念辨析
  question: 原文如何解释「13.7 低毛利等于低回报」？
  answer: 不对。折扣店以高周转获得与百货店相近的库存回报。必须同时看毛利、周转、资本需求和费用结构。
  source_heading: 13.7 低毛利等于低回报
