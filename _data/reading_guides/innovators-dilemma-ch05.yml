overview:
  kind: summary
  minutes: 9
  question: 原文围绕「一、本章的问题与核心答案」建立了怎样的核心认识？
  question_source: 一、本章的问题与核心答案
  thesis: 昆腾、数据控制、IBM、凯马特和惠普的共同做法，是把新业务放入真正需要它的价值网，使小市场和低毛利不再是缺陷，而成为机构赖以生存的机会。DEC
    和伍尔科则说明，名义上的新部门如果仍服从母公司的客户、成本和盈利标准，独立只是形式。
  thesis_source: 十六、本章总结
  concepts:
  - term: 一、本章的问题与核心答案
    meaning: 第一部分解释了优秀企业为何失败；第五章开始回答“该怎样管理”。本章聚焦第一项原则：在运行良好的企业里，客户和投资者通过提供生存资源，实际控制了资源分配方向。
    source_heading: 一、本章的问题与核心答案
  - term: 五、昆腾公司和 Plus 开发公司
    meaning: 昆腾曾是 8 英寸硬盘领导者，却晚 4 年推出 5.25 英寸产品，业务被从低端侵蚀。1984 年，几名员工发现可插入 IBM XT/AT
      扩展槽的 3.5 英寸超薄“硬卡”机会，客户是个人电脑用户而非昆腾的微型机 OEM。
    source_heading: 五、昆腾公司和 Plus 开发公司
  - term: 九、数字设备公司、IBM 和个人电脑
    meaning: 大型机客户不需要早期微型机，利润率和市场也更小，于是 DEC、Data General、Prime、王安等新企业建立微型机市场。后来台式个人电脑又以同样方式冲击微型机；便携式计算机再冲击台式机。
    source_heading: 九、数字设备公司、IBM 和个人电脑
  - term: 十、克雷斯吉、伍尔沃思与折扣零售
    meaning: 20 世纪 50 年代的折扣店服务少、选择有限，却以低 20% 至 40% 的价格销售消费者已熟悉的全国品牌耐用品。它服务传统零售商不重视的年轻蓝领家庭，并以低成本、自助和快速周转建立不同盈利模式。
    source_heading: 十、克雷斯吉、伍尔沃思与折扣零售
  - term: 14.2 局限
    meaning: "“独立”包含多个变量，难确定客户、领导者、地理还是成本结构贡献最大。"
    source_heading: 14.2 局限
  - term: 十六、本章总结
    meaning: 昆腾、数据控制、IBM、凯马特和惠普的共同做法，是把新业务放入真正需要它的价值网，使小市场和低毛利不再是缺陷，而成为机构赖以生存的机会。DEC
      和伍尔科则说明，名义上的新部门如果仍服从母公司的客户、成本和盈利标准，独立只是形式。
    source_heading: 十六、本章总结
