check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「序言与摘要」？
  answer: 序言建立问题来源并给出顶层回答；
  source_heading: 序言与摘要
- level: 概念辨析
  question: 原文如何解释「关键句与目录项」？
  answer: 关键句表达完整判断；目录项只标示类别。长文可以用短标题，但标题背后必须有明确思想。
  source_heading: 关键句与目录项
- level: 概念辨析
  question: 原文如何解释「初始疑问与后续疑问」？
  answer: 初始疑问由序言产生并由中心思想回答；后续疑问由回答产生，并由关键句和正文回答。
  source_heading: 初始疑问与后续疑问
- level: 概念辨析
  question: 原文如何解释「逻辑顺序与呈现顺序」？
  answer: 逻辑上可恢复为 SCQA，呈现时可使用 A-S-C 等顺序。调整不应破坏生成关系。
  source_heading: 逻辑顺序与呈现顺序
- level: 概念辨析
  question: 原文如何解释「提示与告知」？
  answer: 提示唤起读者已知信息；告知引入新信息。序言以提示为主，正文以告知和证明为主。
  source_heading: 提示与告知
