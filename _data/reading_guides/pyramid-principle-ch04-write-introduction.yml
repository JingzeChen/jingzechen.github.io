overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章定位：用序言把读者带到正确的问题前」建立了怎样的核心认识？
  question_source: 本章定位：用序言把读者带到正确的问题前
  thesis: 前几章已经建立一条基本链路：文章顶层思想回答读者的初始疑问，关键句回答顶层思想引发的新疑问，正文再逐层展开。第4章专门解决其中最前端、也最容易写坏的一环：怎样让读者自然产生文章准备回答的那个初始疑问？
  thesis_source: 本章定位：用序言把读者带到正确的问题前
  concepts:
  - term: 本章定位：用序言把读者带到正确的问题前
    meaning: 前几章已经建立一条基本链路：文章顶层思想回答读者的初始疑问，关键句回答顶层思想引发的新疑问，正文再逐层展开。第4章专门解决其中最前端、也最容易写坏的一环：怎样让读者自然产生文章准备回答的那个初始疑问？
    source_heading: 本章定位：用序言把读者带到正确的问题前
  - term: 序言的常见模式——以咨询为例
    meaning: "“理解—方法—经验—安排”不是万能销售模板。它适用于客户已承认问题并在选择服务提供者的场景。若客户尚未接受问题定义，建议书必须先证明问题；若采购只看价格和合规，还需按正式评标标准组织。"
    source_heading: 序言的常见模式——以咨询为例
  - term: 五、局部引言示例
    meaning: 新方案能够满足恢复目标，但技术可行并不自动意味着值得投资。管理层还需要确认三年内避免的维护、停机与风险成本是否超过升级成本。按完整口径测算，新方案的三年总成本更低。
    source_heading: 五、局部引言示例
  - term: 检查背景
    meaning: 是否锁定了必要的时间、地点、主体和状态？
    source_heading: 检查背景
  - term: 检查局部引言
    meaning: 进入分支前，读者当前已经知道什么？
    source_heading: 检查局部引言
  - term: 本章小结
    meaning: 本章最核心的实践原则是：从读者认可的状态开始，指出一个足以改变状态的真实冲突，让读者自然提出全文唯一的初始疑问，尽早给出回答和关键句主线，再按读者当前认知位置逐层展开。
    source_heading: 本章小结
