  - 本章结尾坦率指出：故事会让作者对背景的选择显得真实、自然，并限制读者采用其他解释。这类似律师用开场白为证据设定解释框架。
  - 删除某段历史后，读者还能否产生同一疑问？
  - 还需哪条信息才能自然提出局部疑问？
