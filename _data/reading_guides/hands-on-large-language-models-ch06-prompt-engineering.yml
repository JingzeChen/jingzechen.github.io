check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.1 Prompt engineering 不等于寻找“魔法咒语”」？
  answer: 可靠流程是定义 contract、构建评测集、模块化修改、比较指标和版本化。某一句在一个模型上有效，不保证跨模型和版本有效。
  source_heading: 6.1 Prompt engineering 不等于寻找“魔法咒语”
- level: 概念辨析
  question: 原文如何解释「6.6 Persona 不能赋予真实资质」？
  answer: "“你是医生/律师”可能改变语言风格，不能让模型获得执照、最新知识或可靠判断。"
  source_heading: 6.6 Persona 不能赋予真实资质
- level: 概念辨析
  question: 原文如何解释「6.10 Self-consistency 不等于自我验证」？
  answer: 多数票只减少部分随机错误；共同系统性错误会被放大。样本还必须有足够多样性。
  source_heading: 6.10 Self-consistency 不等于自我验证
- level: 概念辨析
  question: 原文如何解释「6.13 LLM validator 不等于确定性 validator」？
  answer: 模型评审适合模糊质量标准；枚举、范围、权限、金额和引用存在性应由代码检查。
  source_heading: 6.13 LLM validator 不等于确定性 validator
- level: 概念辨析
  question: 原文如何解释「6.15 输出更长不等于推理更强」？
  answer: 增加 token 提供更多中间计算机会，也可能制造冗余和错误。应按任务比较 accuracy、成本与 latency。
  source_heading: 6.15 输出更长不等于推理更强
