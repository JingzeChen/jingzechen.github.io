overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章路线：从概率生成到可用系统」建立了怎样的核心认识？
  question_source: 0. 本章路线：从概率生成到可用系统
  thesis: 原章用“一次 prompt 模拟三个专家讨论”近似 ToT。它能诱导多视角，但不等同于真正的外部树搜索：所有“专家”来自同一次模型 rollout，错误可能相关，也没有独立状态、回溯与程序化剪枝。应把它称为
    ToT-style prompting，而非完整算法。
  thesis_source: 4. 使用生成模型推理（Reasoning with Generative Models）
  concepts:
  - term: 0. 本章路线：从概率生成到可用系统
    meaning: 基本原则：Prompt 是可版本化的程序输入，模型是带随机性和版本差异的依赖。没有测试集、指标和验证器的“调 prompt”，只是凭个别回答做主观试错。
    source_heading: 0. 本章路线：从概率生成到可用系统
  - term: 1. 使用文本生成模型（Using Text Generation Models）
    meaning: 原书表格把不同组合映射到“创意写作、翻译、邮件”等场景，可作为起点，不是通用最优值。应在任务评测集上测质量、重复率、invalid rate
      与多样性。
    source_heading: 1. 使用文本生成模型（Using Text Generation Models）
  - term: 2. 提示工程入门（Intro to Prompt Engineering）
    meaning: 长上下文中，模型常更敏感于开头 primacy effect 和结尾 recency effect，中部信息可能利用不足。可把核心 instruction
      放在明确位置，在数据后简短重申输出 contract，并用标题与分隔符提高可见性。
    source_heading: 2. 提示工程入门（Intro to Prompt Engineering）
  - term: 4. 使用生成模型推理（Reasoning with Generative Models）
    meaning: 原章用“一次 prompt 模拟三个专家讨论”近似 ToT。它能诱导多视角，但不等同于真正的外部树搜索：所有“专家”来自同一次模型 rollout，错误可能相关，也没有独立状态、回溯与程序化剪枝。应把它称为
      ToT-style prompting，而非完整算法。
    source_heading: 4. 使用生成模型推理（Reasoning with Generative Models）
  - term: 5. 输出验证（Output Verification）
    meaning: 更复杂 schema 应使用 JSON Schema、Pydantic 等结构化验证器。验证失败时可拒绝、有限重试或修复；不能无限重试到“看起来能过”。
    source_heading: 5. 输出验证（Output Verification）
  - term: 7. 总结（Summary）
    meaning: 有效 prompt 通常明确 instruction、data、output contract，并按需加入 context、persona、audience、tone
      和 examples。
    source_heading: 7. 总结（Summary）
  logic:
  - 0. 本章路线：从概率生成到可用系统
  - 1. 使用文本生成模型（Using Text Generation Models）
  - 2. 提示工程入门（Intro to Prompt Engineering）
  - 3. 高级提示工程（Advanced Prompt Engineering）
  - 4. 使用生成模型推理（Reasoning with Generative Models）
  - 5. 输出验证（Output Verification）
  - 7. 总结（Summary）
  sections:
  - title: 0. 本章路线：从概率生成到可用系统
    source_heading: 0. 本章路线：从概率生成到可用系统
    paragraphs:
    - Prompt 设计：instruction、data、format、persona、examples 等模块。
    - 推理与搜索：chain-of-thought、self-consistency、tree-of-thought。
    - 输出控制：示例、grammar-constrained decoding、程序验证与微调。
    - 基本原则：Prompt 是可版本化的程序输入，模型是带随机性和版本差异的依赖。没有测试集、指标和验证器的“调 prompt”，只是凭个别回答做主观试错。
  - title: 1. 使用文本生成模型（Using Text Generation Models）
    source_heading: 1. 使用文本生成模型（Using Text Generation Models）
    paragraphs:
    - 原章沿用 38 亿参数的 Phi-3-mini，便于在约 8 GB 显存级别设备上学习。具体显存受精度、量化、上下文和后端影响，不能只由参数量保证。
    - 必须使用配套模板：同样的文本若缺少角色或结束标记，模型可能续写用户、混淆说话者或无法正确停止。不要把某模型的特殊 token 手工复制给另一个模型。
    - Top-k 与 top-p 可叠加，但同时大幅调 temperature、top-k、top-p 会难以解释变化；实践中先固定其他参数，一次调一个。
    - 原书表格把不同组合映射到“创意写作、翻译、邮件”等场景，可作为起点，不是通用最优值。应在任务评测集上测质量、重复率、invalid rate 与多样性。
  - title: 2. 提示工程入门（Intro to Prompt Engineering）
    source_heading: 2. 提示工程入门（Intro to Prompt Engineering）
    paragraphs:
    - Prompt engineering 是设计、测试和维护模型输入，使输出满足任务需求的迭代过程。它还可用于评估、安全缓解和验证，但自然语言约束本身不是强制安全边界。
    - 分隔符帮助区分 instruction 与不可信 data，但不能阻止 prompt injection。系统必须把外部文本当数据处理，并在模型外限制权限与验证输出。
    - 长上下文中，模型常更敏感于开头 primacy effect 和结尾 recency effect，中部信息可能利用不足。可把核心 instruction
      放在明确位置，在数据后简短重申输出 contract，并用标题与分隔符提高可见性。
    - 这不是简单地把指令复制很多次；重复会浪费 token，冲突版本还会增加歧义。不同模型的位置敏感性需要实测。
  - title: 3. 高级提示工程（Advanced Prompt Engineering）
    source_heading: 3. 高级提示工程（Advanced Prompt Engineering）
    paragraphs:
    - 模块化便于 ablation：固定模型、解码、测试集，只删/改一个组件，比较指标。所谓 emotional stimulus 可能在某模型某任务有效，也可能无效或造成操纵式措辞；不能用单个例子泛化。
    - Prompt 应像代码一样保存：template version、model snapshot、generation config、评测集 commit、结果与变更说明。
    - 示例顺序也可能影响结果。可在验证集上比较随机顺序、多 seed 和 retrieval-based example selection。ICL 看似“学会”任务，但参数没有永久改变；换上下文后示例效果消失。
    - 因此每个边界应采用结构化中间状态、schema validation、重试上限和 provenance，而不是把未经验证的自然语言直接传下去。复杂系统更像
      DAG：可并行生成、汇总、复核，不必永远是线性链。
  - title: 4. 使用生成模型推理（Reasoning with Generative Models）
    source_heading: 4. 使用生成模型推理（Reasoning with Generative Models）
    paragraphs:
    - 原章用 System 1/2 类比：直接生成类似快速直觉，让模型展开步骤类似慢速审议。这是启发式比喻，不证明模型拥有与人类相同的认知系统。
    - 可见 reasoning text 也不保证忠实反映内部计算。模型可能先得到答案再编理由，或生成步骤正确但答案错误。高风险任务应要求可核验中间产物，调用计算器、代码、检索或规则引擎，而不是只相信一段流畅推理。
    - 为什么可能有效：每个新生成 token 都进入后续上下文，中间变量使复杂映射分成局部步骤，相当于分配更多 test-time compute。
    - 原章用“一次 prompt 模拟三个专家讨论”近似 ToT。它能诱导多视角，但不等同于真正的外部树搜索：所有“专家”来自同一次模型 rollout，错误可能相关，也没有独立状态、回溯与程序化剪枝。应把它称为
      ToT-style prompting，而非完整算法。
  - title: 5. 输出验证（Output Verification）
    source_heading: 5. 输出验证（Output Verification）
    paragraphs:
    - Grammar/constrained decoding：在 token 选择时硬限制语法。
    - 更复杂 schema 应使用 JSON Schema、Pydantic 等结构化验证器。验证失败时可拒绝、有限重试或修复；不能无限重试到“看起来能过”。
    - JSON object mode 也不必然等于完整 JSON Schema。若只约束“对象”，模型仍可自由选择字段。
    - FP16 GGUF 仍很大；资源有限时应选择与许可和质量要求匹配的量化文件。
  - title: 7. 总结（Summary）
    source_heading: 7. 总结（Summary）
    paragraphs:
    - 有效 prompt 通常明确 instruction、data、output contract，并按需加入 context、persona、audience、tone
      和 examples。
    - 从最小 prompt 开始：instruction + delimited data + output contract。
    - 按问题选择 test-time search：CoT、self-consistency、ToT 只在收益大于成本时使用。
    - 本章最重要的方法论是把 prompt 从“自然语言聊天”提升为“概率程序的接口规范”。可靠性来自模型、上下文、解码、搜索、验证和失败处理的共同设计，而不是来自某一句听起来更聪明的措辞。
