overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章核心结论」建立了怎样的核心认识？
  question_source: 一、本章核心结论
  thesis: 真正持久的关系改变必须由内而外发生：先在刺激与回应之间恢复选择自由，再检查塑造自身的深层模式，通过安全、持续的交流理解彼此，最后有意识地终止有害的代际循环，并把更健康的原则传给后代。
  thesis_source: 一、本章核心结论
  concepts:
  - term: 一、本章核心结论
    meaning: 真正持久的关系改变必须由内而外发生：先在刺激与回应之间恢复选择自由，再检查塑造自身的深层模式，通过安全、持续的交流理解彼此，最后有意识地终止有害的代际循环，并把更健康的原则传给后代。
    source_heading: 一、本章核心结论
  - term: 五、每天两小时的深度交流
    meaning: 外部事件只提供刺激，内心模式决定事件被如何体验。理解模式因此比更换事件更具长期影响。
    source_heading: 五、每天两小时的深度交流
  - term: 十三、代际传承：模式如何跨越世代
    meaning: 作者夫妻进一步意识到：自己的行为模式会像父母影响自己一样，深刻影响子女。
    source_heading: 十三、代际传承：模式如何跨越世代
  - term: 十七、使命宣言、爱与原谅
    meaning: 只有宣言不足以改写自动反应。需要通过身体、精神和智力更新提升选择能力，再在真实关系中反复实践。
    source_heading: 十七、使命宣言、爱与原谅
  - term: 二十二、失去理智时怎么办：原书即时应对建议
    meaning: 原书允许多种情绪：愤怒、勇敢、幽默、同情、悲伤等。关键不是强迫自己积极，而是选择合适、建设性的表达，只要仍能控制行为、应对局面。
    source_heading: 二十二、失去理智时怎么办：原书即时应对建议
  - term: 三十四、本章结论
    meaning: 作者夫妻的品牌冲突最能体现“知其所以然”的价值。问题表面是购买哪个品牌，深层却是一个女儿对曾帮助父亲渡过危机的公司的忠诚。品牌没有改变，历史没有改变；改变的是作者的理解。新理解使原本令人愤怒的“不理性”行为变成值得尊重的情感表达，也使两人的关系获得统合综效。
    source_heading: 三十四、本章结论
  logic:
  - 一、本章核心结论
