overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 高层表示更接近核心政策，低层表示更接近具体机制，与图上位置无关。
  thesis_source: 14. 本章总结
  concepts:
  - term: 本章导读
    meaning: 本章不提供“服务一定比单体好”的等级排序。作者的结论是，大多数真实系统会混合多种边界：服务内部仍可能包含本地进程，本地进程内部又包含动态组件和源码模块。
    source_heading: 本章导读
  - term: 3.8 Figure 18.1：低层调用高层
    meaning: 编译期源码依赖也从 Client 指向 Service。
    source_heading: 3.8 Figure 18.1：低层调用高层
  - term: 6. Local Processes：本地进程边界
    meaning: 不要把本地对象的每个 Getter 和 Setter 映射成 IPC 消息。
    source_heading: 6. Local Processes：本地进程边界
  - term: 7. Services：服务边界
    meaning: 源码依赖应通过高层拥有的 Port、消息契约或 Adapter 组织，而不是直接把供应商 SDK 和物理地址写进业务规则。
    source_heading: 7. Services：服务边界
  - term: 13.8 场景判断一：模块化单体
    meaning: 系统只有一个可执行文件，但核心、数据库、UI 和外部服务 Adapter 的源码依赖清楚且无环。
    source_heading: 13.8 场景判断一：模块化单体
  - term: 14. 本章总结
    meaning: Figure 18.1 中低层 Client 调用高层 Service，控制流和源码依赖同向。
    source_heading: 14. 本章总结
  logic:
  - 本章导读
  - 3.8 Figure 18.1：低层调用高层
  - 3.12 两张图的共同规则
  - 7. Services：服务边界
  - 13.2 单体检查
  - 13.16 快速复述练习
  - 14. 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 核心业务规则位于边界的重要一侧；
    - GUI、数据库、框架等细节作为插件位于外围；
    - 本章不提供“服务一定比单体好”的等级排序。作者的结论是，大多数真实系统会混合多种边界：服务内部仍可能包含本地进程，本地进程内部又包含动态组件和源码模块。
  - title: 3.2 单体的物理特征
    source_heading: 3.2 单体的物理特征
    paragraphs:
    - 静态链接的 C 或 C++ 程序；
    - 原书把这种依靠源码模块维持边界的形态称为 source-level decoupling，也就是源码级解耦。
  - title: 3.8 Figure 18.1：低层调用高层
    source_heading: 3.8 Figure 18.1：低层调用高层
    paragraphs:
    - 控制流从 Client 指向 Service；
    - 编译期源码依赖也从 Client 指向 Service。
  - title: 3.12 两张图的共同规则
    source_heading: 3.12 两张图的共同规则
    paragraphs:
    - 低层调用高层时，依赖自然指向高层；
    - 高层调用低层时，通过多态倒置源码依赖；
    - 无论运行时控制流怎样，跨边界源码箭头都朝高层。
  - title: 6. Local Processes：本地进程边界
    source_heading: 6. Local Processes：本地进程边界
    paragraphs:
    - 高层进程不应依赖低层进程的具体实现细节。
    - Registry Lookup Key。
    - 原书称这种成本 moderately expensive，也就是中等昂贵。
    - 不要把本地对象的每个 Getter 和 Setter 映射成 IPC 消息。
  - title: 7. Services：服务边界
    source_heading: 7. Services：服务边界
    paragraphs:
    - 服务 API 应围绕较完整业务能力设计，而不是远程对象的细粒度方法镜像。
    - 契约比进程内接口更难改变，因此更需要 REP、ISP 与 LSP 思维。
    - 一个业务编排服务可能在运行时调用数据库或通知服务，但它在策略层次上更高。
    - 源码依赖应通过高层拥有的 Port、消息契约或 Adapter 组织，而不是直接把供应商 SDK 和物理地址写进业务规则。
  - title: 13.2 单体检查
    source_heading: 13.2 单体检查
    paragraphs:
    - 模块内部是否可以被其他模块绕过？
    - 高层业务是否导入数据库和 UI？
    - 单一部署是否仍是当前最经济选择？
  - title: 13.8 场景判断一：模块化单体
    source_heading: 13.8 场景判断一：模块化单体
    paragraphs:
    - 系统只有一个可执行文件，但核心、数据库、UI 和外部服务 Adapter 的源码依赖清楚且无环。
    - 判断： 这是具有真实架构边界的单体，不应仅因部署为一个文件就认定架构落后。
  - title: 13.16 快速复述练习
    source_heading: 13.16 快速复述练习
    paragraphs:
    - 静态多态为什么不能完全替代动态组件边界？
    - Figure 18.1 中控制流与源码依赖怎样指向？
    - Figure 18.2 如何倒置高层对低层的依赖？
    - 什么时候应从源码级升级到部署级、进程级或服务级？
  - title: 14. 本章总结
    source_heading: 14. 本章总结
    paragraphs:
    - 函数回调、Protocol 和模块接口也可以提供所需多态，不必局限于 OO 语法。
    - Figure 18.1 中低层 Client 调用高层 Service，控制流和源码依赖同向。
    - 服务 API 应粗粒度，避免把本地对象 Getter 和 Setter 搬到网络上。
    - 本章最终方法是：先建立正确逻辑依赖，再用足以满足部署、故障和运行需求的最经济物理边界。
  takeaways:
  - 第 18 章解剖架构边界的常见物理形态与通信代价。
  - 高层调用低层时，应通过动态多态让源码依赖反向指向高层接口。
  - 部署组件通常仍在同一进程和地址空间，通过低成本函数调用通信。
  - IPC 需要系统调用、编码、数据传递和上下文切换，成本中等。
  - 本章最终方法是：先建立正确逻辑依赖，再用足以满足部署、故障和运行需求的最经济物理边界。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「12.1 “单体没有架构边界”」？
  answer: 错误。单个可执行文件中仍可通过模块、接口和依赖规则形成强有价值的源码边界。
  source_heading: 12.1 “单体没有架构边界”
- level: 概念辨析
  question: 原文如何解释「12.6 “本地进程和服务完全相同”」？
  answer: 不相同。本地进程通常位于同一机器，使用 OS IPC；服务假定通过网络且位置无关。
  source_heading: 12.6 “本地进程和服务完全相同”
- level: 概念辨析
  question: 原文如何解释「12.10 “接口放在哪一侧无所谓”」？
  answer: 错误。接口所有权决定谁控制契约。高层需要低层服务时，接口应由高层一侧拥有。
  source_heading: 12.10 “接口放在哪一侧无所谓”
- level: 概念辨析
  question: 原文如何解释「12.11 “跨边界可以直接复用低层 DTO”」？
  answer: 危险。这会让低层协议和 Schema 控制核心。应使用高层拥有的边界模型并转换。
  source_heading: 12.11 “跨边界可以直接复用低层 DTO”
- level: 概念辨析
  question: 原文如何解释「12.20 “服务化后业务代码完全不变”」？
  answer: 错误。好的边界能保护大部分策略，但远程失败、数据所有权和一致性仍需设计。
  source_heading: 12.20 “服务化后业务代码完全不变”
