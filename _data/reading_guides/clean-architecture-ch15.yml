overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 两个历史故事共同展示了同一原则：分离策略与细节，彻底解耦，并尽可能推迟细节决策。
  thesis_source: 本章总结
  concepts:
