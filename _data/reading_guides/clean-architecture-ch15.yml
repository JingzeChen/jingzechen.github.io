  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 原书图示：Chapter 15 章首页第 15 章是 Part V“Architecture”的开篇。
    - 软件架构是建造者赋予系统的形状。这个形状体现在组件怎样划分、怎样排列，以及怎样相互通信。
    - 设备无关性让打印程序不必绑定读卡机、磁带或打印机；
    - 把高层策略与低层细节分离，让策略不知道细节，并把细节决策推迟到真正需要的时候。
  - title: 1.8 应怎样理解作者的强烈措辞
    source_heading: 1.8 应怎样理解作者的强烈措辞
    paragraphs:
    - 他的重点是：对很多商业系统而言，即使架构糟糕，也能靠直接编码实现当前功能；真正长期暴露架构质量的，是后续开发、部署和维护成本。
    - 在实时控制、安全关键、资源受限或超大规模系统中，架构甚至可能直接决定系统能否满足运行要求。阅读时应保留这个适用边界。
  - title: 2.7 架构约束应随规模演化
    source_heading: 2.7 架构约束应随规模演化
    paragraphs:
    - 适合小团队的规则，不一定适合大团队；适合大团队的流程，也不应机械套在原型项目上。
    - 当共同变化模式出现时应用 CCP；
    - 当团队开始互相干扰时建立稳定接口；
    - 好的架构不是一次性添加最大约束，而是在系统增长前提供足够结构，并持续调整。
  - title: 4. Operation：支持运行
    source_heading: 4. Operation：支持运行
    paragraphs:
    - 作者用“硬件便宜，人力昂贵”解释为什么生命周期成本更偏向开发、部署和维护。
    - 更稳妥的理解是：不要为了少量运行效率，把系统做得极难开发和维护；同时要根据真实运行约束做权衡。
    - Architecture should reveal operation，架构应当揭示系统如何运行。
    - 如果只有资深开发者阅读额外文档后才能理解系统做什么，代码形状还没有充分揭示运行。
  - title: 7. Device Independence：设备无关性
    source_heading: 7. Device Independence：设备无关性
    paragraphs:
    - 作者把时间带回 1960 年代。当时计算机仍处于早期，许多程序员来自数学和其他工程领域，其中三分之一甚至更多是女性。
    - 读卡机、打孔机和打印机都可以用各自专用代码操作。只要设备不变，程序完全正常。
    - 到 1960 年代末，操作系统开始把具体 IO 设备抽象成处理 unit records，也就是单元记录的服务。
    - 作者称这是 Open-Closed Principle 的诞生，尽管当时还没有这个名字：新增设备实现扩展系统，而不修改既有业务程序。
  - title: 9.10 现代数据库类比应谨慎理解
    source_heading: 9.10 现代数据库类比应谨慎理解
    paragraphs:
    - 业务代码直接写 SQL、依赖具体表结构，与物理寻址有相似风险，但不能简单认为“任何 SQL 都是错误”。
    - 低层存储结构是否扩散进核心业务规则；
    - 更换存储机制时需要修改多少策略代码；
    - 数据模型是否属于领域策略还是持久化细节；
  - title: 11. 在现代项目中应用本章思想
    source_heading: 11. 在现代项目中应用本章思想
    paragraphs:
    - 它不需要知道供应商请求对象、HTTP 状态码或 SDK 客户端生命周期。
    - 将通知从真实服务切换到记录型 Fake；
    - 在不改策略的情况下替换一个 Adapter；
    - "“使用微服务”“使用事件驱动”或“使用某框架”都不是单独的架构成功标准。"
  - title: 13.5 维护检查
    source_heading: 13.5 维护检查
    paragraphs:
    - 自动测试是否围绕用例和边界组织？
    - 是否存在所有人都害怕修改的稳定具体核心？
  - title: 13.9 场景判断二：公司已统一数据库
    source_heading: 13.9 场景判断二：公司已统一数据库
    paragraphs:
    - 公司规定所有系统使用同一种数据库，因此团队让领域对象直接继承 ORM 基类。
    - 判断： 统一选型不代表业务必须依赖 ORM。保持边界仍能降低升级、测试和未来迁移成本。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 维护的主要成本包括寻找正确修改路径的 spelunking，以及无意破坏的 risk。
    - Details 包括 IO、数据库、Web、服务器、框架和通信协议等外部机制。
    - 数据库、Web 服务器、REST、微服务和 DI 框架通常不必在开发最早期锁定。
    - 两个历史故事共同展示了同一原则：分离策略与细节，彻底解耦，并尽可能推迟细节决策。
  takeaways:
  - 第 15 章正式进入软件架构本身，回答架构是什么以及架构师优化什么。
  - 五个七人团队则需要明确组件和稳定接口才能并行工作。
  - 清晰组件和稳定接口能够照亮修改路径并限制回归影响。
  - 设备无关性案例中，早期程序直接绑定读卡机、打孔机和电传打字机指令。
  - 两个历史故事共同展示了同一原则：分离策略与细节，彻底解耦，并尽可能推迟细节决策。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「12.1 “架构师不应该写代码”」？
  answer: 错误。原书明确要求架构师持续参与编程，否则无法感受自己给团队造成的摩擦。
  source_heading: 12.1 “架构师不应该写代码”
- level: 概念辨析
  question: 原文如何解释「12.5 “小团队不需要任何架构”」？
  answer: 错误。小团队可以暂时采用更少结构，但仍应保护核心策略和关键依赖方向，为增长留下空间。
  source_heading: 12.5 “小团队不需要任何架构”
- level: 概念辨析
  question: 原文如何解释「12.8 “单一动作部署意味着单体”」？
  answer: 错误。分布式系统也能通过自动化流水线实现单一操作；重点是可重复和可控制。
  source_heading: 12.8 “单一动作部署意味着单体”
- level: 概念辨析
  question: 原文如何解释「12.12 “策略永远是纯业务，细节永远是技术”」？
  answer: 过于绝对。策略与细节取决于系统价值所在。同一协议在普通应用中是细节，在协议产品中可能是策略。
  source_heading: 12.12 “策略永远是纯业务，细节永远是技术”
- level: 概念辨析
  question: 原文如何解释「12.19 “设备无关性只是过时硬件故事”」？
  answer: 错误。Repository、云存储 Port、消息接口和可替换通知服务都使用相同思想。
  source_heading: 12.19 “设备无关性只是过时硬件故事”
