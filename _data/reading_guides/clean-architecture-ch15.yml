    meaning: 原书图示：Chapter 15 章首页第 15 章是 Part V“Architecture”的开篇。
    source_heading: 本章导读
  - term: 2.7 架构约束应随规模演化
    meaning: 适合小团队的规则，不一定适合大团队；适合大团队的流程，也不应机械套在原型项目上。
    source_heading: 2.7 架构约束应随规模演化
  - term: 7. Device Independence：设备无关性
    meaning: 作者称这是 Open-Closed Principle 的诞生，尽管当时还没有这个名字：新增设备实现扩展系统，而不修改既有业务程序。
    source_heading: 7. Device Independence：设备无关性
  - term: 9.10 现代数据库类比应谨慎理解
    meaning: 业务代码直接写 SQL、依赖具体表结构，与物理寻址有相似风险，但不能简单认为“任何 SQL 都是错误”。
    source_heading: 9.10 现代数据库类比应谨慎理解
  - term: 13.5 维护检查
    meaning: 是否存在所有人都害怕修改的稳定具体核心？
    source_heading: 13.5 维护检查
