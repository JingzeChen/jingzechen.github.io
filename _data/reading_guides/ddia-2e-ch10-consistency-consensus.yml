  takeaways:
  - 底层 model限制可实现 guarantees；上层 invariant不能脱离下层 assumptions成立。
  - new leader怎样继承 accepted/committed values；
  - linearizability要求 operations像作用于 single copy且尊重 non-overlapping real-time order。
  - vector clock可表达 partial order/concurrency，metadata成本随 participants增长。
  - 正确选择从 invariant出发：只对必须 unique/linearizable的 path协调，其余 path可用 caching、logical clocks、merge与idempotency，并以
    history/model/fault tests验证声明。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5.1 “strong consistency 是明确 guarantee”」？
  answer: 错误。它可能指 linearizability、sequential consistency、serializability、session guarantees等。必须写出
    history constraints/API scope。
  source_heading: 5.1 “strong consistency 是明确 guarantee”
- level: 概念辨析
  question: 原文如何解释「5.10 “FLP 证明 consensus 永远不可能”」？
  answer: 错误。FLP只说 deterministic asynchronous algorithm在允许 crash时不能保证所有 schedules
    termination；partial synchrony/timeouts或 randomization可取得 practical progress。
  source_heading: 5.10 “FLP 证明 consensus 永远不可能”
- level: 概念辨析
  question: 原文如何解释「5.18 “consensus 只是 leader election”」？
  answer: 错误。election只建立 epoch authority；每 log entry仍需 quorum confirmation，new leader还必须恢复
    committed prefix。
  source_heading: 5.18 “consensus 只是 leader election”
- level: 概念辨析
  question: 原文如何解释「5.25 “增加 consensus voters 可提高 write throughput”」？
  answer: 通常错误。每 entry需更多 communication，latency可能上升。throughput scaling多靠 partition成多个
    independent consensus groups，不是无限扩大一个 group。
  source_heading: 5.25 “增加 consensus voters 可提高 write throughput”
- level: 概念辨析
  question: 原文如何解释「5.33 误区背后的统一问题」？
  answer: 这些错误都把一种局部 evidence（quorum count、timestamp、timeout、leader label、lock record）误当
    global truth。正确做法是明确：observable property、system model、proof assumptions、authority
    generation和 enforcement boundary。
  source_heading: 5.33 误区背后的统一问题
