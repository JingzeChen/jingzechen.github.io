  sections:
  - title: 0. 本章定位：复制带来容错，也带来“哪一份是真”的问题
    source_heading: 0. 本章定位：复制带来容错，也带来“哪一份是真”的问题
    paragraphs:
    - eventual consistency 让 application 看见 replication：developer 处理 stale values、siblings、conflict
      merge 与 session guarantees。multi-leader、leaderless、offline-first 常采用该路线。
    - offline editing 必然允许 divergent local states，eventual/merge model自然；同 datacenter
      fast reliable links、hard uniqueness/leader election则 strong consistency常更合适。
    - network partition、unbounded delay 与 node failure 使某些 guarantee组合不可能。linearizability
      会牺牲 latency/availability；consensus liveness 依赖 timing/fault assumptions。
    - 正常网络下错误 algorithm 也可能长期表现良好；unlucky message order、pause、leader failover才暴露 data
      loss/split brain。正确实现需 theory、formal model、deterministic/fault testing。
  - title: 1. Linearizability
    source_heading: 1. Linearizability
    paragraphs:
    - B read request先发，D write0后发，A write1再发；若 intervals overlap，database可按 D→A→B
      执行，使 B 返回1。send order不构成 real-time precedence，只有 response-before-next-invocation
      才强制 order。
    - read-after-write、monotonic reads、consistent prefix 等比 linearizability弱，分别防部分
      anomaly。linearizability包含这些 recency/order guarantees，并增加跨 clients real-time
      single-copy behavior。
    - Oracle Real Application Clusters（RAC）在 shared-disk cluster 中对 disk pages使用 distributed
      locks。locks处于 transaction critical path，通常需要 dedicated low-latency cluster interconnect。
    - Attiya–Welch result表明 linearizable read/write response time至少与 network delay
      uncertainty成比例。直觉：node若不知道 earlier operation是否已生效，就必须等待 enough communication消除
      ambiguity。
  - title: 2. ID Generators and Logical Clocks
    source_heading: 2. ID Generators and Logical Clocks
    paragraphs:
    - 适合：event ordering、LWW replacement with causality-safe order、MVCC IDs、deterministic
      tie-break、replication log metadata。不能单独解决 fresh read、unique claim或 fault-tolerant
      consensus。
    - distributed ID generation的核心取舍是 coordination与 ordering。UUID/shard/block方案高可用local生成，却不提供
      causal/real-time order；Lamport/HLC用message propagation保证 happens-before-compatible
      total order，仍非 linearizable。
    - logical clocks解决：causality-consistent ordering。linearizable ID解决：real-time ordered
      allocation。它们都不单独解决：fault-tolerant knowledge that decision is final。
    - ID generation从 unique逐步增强到 causal order、real-time order，每增强一层就增加 communication/clock
      assumptions。Lamport/HLC适合 decentralized ordering，vector clock检测 concurrency，TSO/TrueTime提供
      linearizable timestamps。
  - title: 4. Summary：从 single-copy illusion 到 fault-tolerant agreement
    source_heading: 4. Summary：从 single-copy illusion 到 fault-tolerant agreement
    paragraphs:
    - fault-tolerant replicated system如何给 application强 consistency？答案不是“所有 replicas永远同步”，而是精确定义
      observable history，再用 consensus让 nodes对 authoritative operation sequence达成 agreement。
    - ZooKeeper/etcd把 consensus包装成 locks、leases、fencing、sessions、notifications，适合
      small/slow-changing distributed control state。使用成熟 service减少自制 protocol风险，但
      application仍须正确使用 fencing/reconnect semantics。
    - 1980s以来的 consensus、failure detectors、partial synchrony与 quorum theory让 systems能在第
      9 章 faults下保持 data safety。理论不是脱离实践，而是划清哪些 guarantees在何种 assumptions下可实现。
    - 若业务允许 stale reads/concurrent writes/merge，leaderless或 multi-leader replication可获得更高
      local availability与 lower latency；logical clocks帮助追踪 causality/conflicts。
  - title: 6. 知识结构与证据地图
    source_heading: 6. 知识结构与证据地图
    paragraphs:
    - 逆命题通常不成立：total order label不推出 consensus；same final state不推出每次 read linearizable。
    - testing可找 counterexample，不能凭有限 successful runs证明所有 executions；proof/model与implementation
      tests互补。
    - guarantee必须标 scope：single key、transaction、shard、region、whole cluster，及 read
      mode。per-shard linearizable log不自动给 cross-shard snapshot；linearizable metadata不自动使
      external object store writes fenced。
    - 若 intersection member durable保留 highest epoch/accepted value，later quorum就不能合法忽略
      earlier decision。该结论还依赖 vote/recovery rules，不能只看集合算术。
  - title: 7. 综合案例：全球票务系统的最后一个座位
    source_heading: 7. 综合案例：全球票务系统的最后一个座位
    paragraphs:
    - 若 inventory与 internal ledger位于两个支持 transactions的 shards，且 requirement是二者 exact
      all-or-nothing，可用 fault-tolerant transaction coordinator + atomic commitment。若允许
      temporary HELD与refund，则 saga可降低 coordination scope。
    - test clients记录 invocation/response及 request/seat IDs，在 leader kill、partition、pause中并发
      reserve/read/cancel。checker验证每 seat history能放置合法 linearization points，尤其禁止：success后
      later read FREE、两个 success owners、confirmed sale被覆盖。
    - malicious voter、majority durable log同时丢失、provider违反 idempotency contract、operator强开两个
      independent clusters都超出 assumptions。处理策略是 fail closed、freeze affected inventory、保留
      audit evidence并人工 reconciliation，而非猜 winner。
    - 最后一座位由 consensus log order决定，而非 UUID、wall clock或最快 arrival猜测。linearizable commit给
      unique owner；stable request ID处理 unknown outcome；generation/fencing隔离 zombie；idempotent
      saga跨越不支持 transaction的 payment boundary。
  - title: 8. 核心结论
    source_heading: 8. 核心结论
    paragraphs:
    - fault-tolerant linearizable ID/timestamp oracle需要 centralized durable allocator或
      replicated consensus/clock-uncertainty protocol。
    - single-value consensus、linearizable CAS、shared log/total order broadcast和 fault-tolerant
      atomic commitment可相互归约。
    - coordination services把 consensus用于 small control state；locks/leases只有配 resource-side
      fencing才保护 external effects。
    - 正确选择从 invariant出发：只对必须 unique/linearizable的 path协调，其余 path可用 caching、logical
      clocks、merge与idempotency，并以 history/model/fault tests验证声明。
