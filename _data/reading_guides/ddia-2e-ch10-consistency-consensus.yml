overview:
  kind: summary
  minutes: 24
  question: 原文围绕「0. 本章定位：复制带来容错，也带来“哪一份是真”的问题」建立了怎样的核心认识？
  question_source: 0. 本章定位：复制带来容错，也带来“哪一份是真”的问题
  thesis: sequential consistency保 program order却不保 external real time，因此弱于 linearizability。
  thesis_source: 8. 核心结论
  concepts:
  - term: 0. 本章定位：复制带来容错，也带来“哪一份是真”的问题
    meaning: eventual consistency 让 application 看见 replication：developer 处理 stale
      values、siblings、conflict merge 与 session guarantees。multi-leader、leaderless、offline-first
      常采用该路线。
    source_heading: 0. 本章定位：复制带来容错，也带来“哪一份是真”的问题
  - term: 2. ID Generators and Logical Clocks
    meaning: distributed ID generation的核心取舍是 coordination与 ordering。UUID/shard/block方案高可用local生成，却不提供
      causal/real-time order；Lamport/HLC用message propagation保证 happens-before-compatible
      total order，仍非 linearizable。
    source_heading: 2. ID Generators and Logical Clocks
  - term: 6. 知识结构与证据地图
    meaning: guarantee必须标 scope：single key、transaction、shard、region、whole cluster，及
      read mode。per-shard linearizable log不自动给 cross-shard snapshot；linearizable metadata不自动使
      external object store writes fenced。
    source_heading: 6. 知识结构与证据地图
  - term: 7. 综合案例：全球票务系统的最后一个座位
    meaning: test clients记录 invocation/response及 request/seat IDs，在 leader kill、partition、pause中并发
      reserve/read/cancel。checker验证每 seat history能放置合法 linearization points，尤其禁止：success后
      later read FREE、两个 success owners、confirmed sale被覆盖。
    source_heading: 7. 综合案例：全球票务系统的最后一个座位
  - term: 10.1 References [1]–[30]
    meaning: 'Peter Bailis, Aaron Davidson, Alan Fekete, Ali Ghodsi, Joseph M. Hellerstein,
      and Ion Stoica. “Highly Available Transactions: Virtues and Limitations.” PVLDB,
      7(3):181–192, November 2013. doi:10.14778/2732232.2732237'
    source_heading: 10.1 References [1]–[30]
  - term: 10.3 References [61]–[94]
    meaning: 'Mahesh Balakrishnan, Dahlia Malkhi, Ted Wobber, Ming Wu, Vijayan Prabhakaran,
      Michael Wei, John D. Davis, Sriram Rao, Tao Zou, and Aviad Zuck. “Tango: Distributed
      Data Structures over a Shared Log.” SOSP, November 2013. doi:10.1145/2517349.2522732'
    source_heading: 10.3 References [61]–[94]
