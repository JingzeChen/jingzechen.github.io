  question_source: 0. 本章解决什么问题
  thesis: 书中的 B 函数和后面 9.5 节的 F 函数，在现代机器学习中有一个统一的名字：证据下界（Evidence Lower BOund, ELBO）。这个视角能把
    EM 的所有性质解释得极其干净，值得补充。
  thesis_source: 9.2 EM 算法的导出
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 例如：你观察到一堆人的身高数据，知道它们来自男性和女性两个群体（各自服从正态分布），但不知道每个数据是男是女。怎么估计两个群体的均值和方差？
    source_heading: 0. 本章解决什么问题
  - term: 9.1.3 数值计算与一个重要发现
    meaning: 当然，EM 确实可能陷入局部最优（一般的 GMM 就会），但本例的初值敏感性源于模型的不可辨识性，两者要区分开。
    source_heading: 9.1.3 数值计算与一个重要发现
  - term: 9.2 EM 算法的导出
    meaning: 书中的 B 函数和后面 9.5 节的 F 函数，在现代机器学习中有一个统一的名字：证据下界（Evidence Lower BOund, ELBO）。这个视角能把
      EM 的所有性质解释得极其干净，值得补充。
    source_heading: 9.2 EM 算法的导出
  - term: 9.4 EM 在高斯混合模型中的应用
    meaning: EM 可能收敛到这种无意义的退化解。
    source_heading: 9.4 EM 在高斯混合模型中的应用
  - term: 9.5 EM 的推广：F 函数与 GEM
    meaning: 含义：在后验分布处，下界与目标函数相等——这正是 9.2.2 节”性质二”的另一种表述。
    source_heading: 9.5 EM 的推广：F 函数与 GEM
  - term: 9.8 本章方法论总结
    meaning: GEM 只要求 M 步使 Q 增大（不必极大），仍保证似然不减；ECM 把 M 步拆成 d 次条件极大化。
    source_heading: 9.8 本章方法论总结
