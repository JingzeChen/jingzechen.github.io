  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 例如：你观察到一堆人的身高数据，知道它们来自男性和女性两个群体（各自服从正态分布），但不知道每个数据是男是女。怎么估计两个群体的均值和方差？
    - 这类方法在优化中称为 MM 算法（Minorize-Maximization，下界最大化）。
  - title: 9.1.1 例 9.1：三硬币模型
    source_heading: 9.1.1 例 9.1：三硬币模型
    paragraphs:
    - A 正面则选硬币 B，反面则选硬币 C；
    - 掷选出的硬币，正面记 1，反面记 0。
    - 关键：只能观测掷硬币的结果，不能观测掷硬币的过程——即不知道每次用的是 B 还是 C。
    - z 是隐变量，表示掷硬币 A 的结果（选了 B 还是 C）；
  - title: 9.1.3 数值计算与一个重要发现
    source_heading: 9.1.3 数值计算与一个重要发现
    paragraphs:
    - 书中据此说”EM 算法与初值的选择有关“。这个说法没错，但容易引起误解——下面这个发现更值得注意。
    - 当然，EM 确实可能陷入局部最优（一般的 GMM 就会），但本例的初值敏感性源于模型的不可辨识性，两者要区分开。
    - 实践启示：模型参数个数超过数据能提供的信息量时，会出现不可辨识。此时应减少参数、增加约束或引入先验。
  - title: 9.2 EM 算法的导出
    source_heading: 9.2 EM 算法的导出
    paragraphs:
    - Minorize：构造在当前点相切的下界（E 步）；
    - Maximize：极大化下界（M 步）。
    - EM 不能保证找到全局最优。若初值在某个局部峰的吸引域内，就会收敛到该局部峰。
    - 书中的 B 函数和后面 9.5 节的 F 函数，在现代机器学习中有一个统一的名字：证据下界（Evidence Lower BOund, ELBO）。这个视角能把
      EM 的所有性质解释得极其干净，值得补充。
  - title: 9.3 EM 算法的收敛性
    source_heading: 9.3 EM 算法的收敛性
    paragraphs:
    - 用 9.2.5 节的 ELBO 视角看，这个证明就是”E 步让 KL 归零、M 步让 ELBO 上升”的直接推论。
    - 似然值收敛不蕴涵参数收敛（参数可能在等似然的”山脊”上游走——三硬币模型就是例子）。
    - 高斯混合模型的似然函数就无上界（9.4.5 节会看到），此时定理 9.2 的条件不满足。
    - 这与第 5 章决策树、第 8 章 AdaBoost 中”贪心得到次优解”的处境类似——都是理论保证有限、需靠工程手段弥补。
  - title: 9.4 EM 在高斯混合模型中的应用
    source_heading: 9.4 EM 在高斯混合模型中的应用
    paragraphs:
    - 这与第 4 章”生成模型”的思路一致：先抽类别，再按类条件分布生成数据。区别在于类别不可观测。
    - 严格意义上 GMM 的 MLE 不存在（全局最优是退化解）；
    - EM 可能收敛到这种无意义的退化解。
    - 这是一个很好的提醒：“极大似然”并非总是良定的。第 6 章可分数据下逻辑斯谛回归的 MLE 不存在，这里 GMM 的 MLE 也不存在——都需要正则化来补救。
  - title: 9.5 EM 的推广：F 函数与 GEM
    source_heading: 9.5 EM 的推广：F 函数与 GEM
    paragraphs:
    - 含义：在后验分布处，下界与目标函数相等——这正是 9.2.2 节”性质二”的另一种表述。
    - 算法 9.3（GEM 算法 1）：直接用 F 函数的两步极大化（即定理 9.4）。
    - 例如可以在 M 步只做一步梯度上升，而非解到极大。这样每轮更便宜，总体可能更快。
    - 这称为 ECM 算法（Expectation Conditional Maximization），思路与第 7 章 SMO”每次只优化两个变量”、坐标下降法一脉相承：把高维难题拆成一系列低维易题。
  - title: 9.7 深入理解
    source_heading: 9.7 深入理解
    paragraphs:
    - 第 10 章的 Baum-Welch 算法就是 EM 在 HMM 上的具体化，本章的框架会直接复用。
    - 每步保证似然不减（无需调学习率）；
    - 实现简单，E/M 两步往往都有闭式解；
    - 每步需遍历全部数据，大规模时代价高；
  - title: 9.8 本章方法论总结
    source_heading: 9.8 本章方法论总结
    paragraphs:
    - Q 函数是完全数据对数似然关于隐变量后验分布的期望；两个变元角色不同。
    - F 函数就是 ELBO；引理 9.1 说明其关于分布的极大点是后验分布。
    - EM 可解释为 F 函数的极大-极大算法（定理 9.4）。
    - GEM 只要求 M 步使 Q 增大（不必极大），仍保证似然不减；ECM 把 M 步拆成 d 次条件极大化。
  takeaways:
  - 这类方法在优化中称为 MM 算法（Minorize-Maximization，下界最大化）。
  - 实践启示：模型参数个数超过数据能提供的信息量时，会出现不可辨识。此时应减少参数、增加约束或引入先验。
  - 这与第 5 章决策树、第 8 章 AdaBoost 中”贪心得到次优解”的处境类似——都是理论保证有限、需靠工程手段弥补。
  - 这称为 ECM 算法（Expectation Conditional Maximization），思路与第 7 章 SMO”每次只优化两个变量”、坐标下降法一脉相承：把高维难题拆成一系列低维易题。
  - GEM 只要求 M 步使 Q 增大（不必极大），仍保证似然不减；ECM 把 M 步拆成 d 次条件极大化。
