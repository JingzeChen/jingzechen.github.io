overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 科技公司本质：用技术创新驱动产品、交付和长期发展。 +> 技术板块：硬件驱动、系统软件、通信、人工智能、设计。 +> 评价投入：不只看钱、人和专利，更看产品落地、复用和用户价值。
    +> 三类创新：集成式、自主式、面向未来的颠覆式创新。 +> 关键能力：吃透并主导关键技术，不等于所有零件自产。 +> 重点突破：资源有限时选择影像、屏幕、充电、AI
    等关键赛道。 +> 路径纠偏：手机 SoC 攻顶受挫后，从影像和充电芯片逐步积累。 +> 研发分层：当前交付、中期预研、长期探索。 +> 工程师文化：尊重专业、鼓励主动探索、容纳认真失败、提供成长空间。
  thesis_source: 二十一、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 小米把自己定义为“以手机、智能硬件和 IoT 平台为核心的消费电子及智能制造公司”。这一定义决定了技术不是辅助部门，而是公司长期存在的基础。
    source_heading: 一、本章主线
  - term: 五、技术大奖中的创新案例
    meaning: MIUI 12 通过“照明弹”展示应用敏感行为，通过权限控制和隐匿功能把知情、选择和管理权交给用户；MIUI 12.5 又引入模糊定位和隐私隔离。
    source_heading: 五、技术大奖中的创新案例
  - term: 十一、志存高远，但不能好高骛远
    meaning: 2014 年，小米从不到 20 人起步，直接挑战以 CPU 为核心的手机 SoC。三年投入约 10 亿元、团队发展到 200 多人，推出澎湃
      S1 并搭载小米 5C，但后续产品陷入僵局。
    source_heading: 十一、志存高远，但不能好高骛远
  - term: 13.1 工程师文化是什么
    meaning: 让技术贡献获得公开荣誉和长期回报。
    source_heading: 13.1 工程师文化是什么
  - term: 十七、工程思维之一：找到使命
    meaning: 共同愿景可以提高凝聚力，但不能替代薪酬、劳动保障、专业管理和不同意见。真正认同必须建立在知情、自愿和公司持续兑现价值之上。
    source_heading: 十七、工程思维之一：找到使命
  - term: 二十一、本章方法论总结
    meaning: 科技公司本质：用技术创新驱动产品、交付和长期发展。 +> 技术板块：硬件驱动、系统软件、通信、人工智能、设计。 +> 评价投入：不只看钱、人和专利，更看产品落地、复用和用户价值。
      +> 三类创新：集成式、自主式、面向未来的颠覆式创新。 +> 关键能力：吃透并主导关键技术，不等于所有零件自产。 +> 重点突破：资源有限时选择影像、屏幕、充电、AI
      等关键赛道。 +> 路径纠偏：手机 SoC 攻顶受挫后，从影像和充电芯片逐步积累。 +> 研发分层：当前交付、中期预研、长期探索。 +> 工程师文化：尊重专业、鼓励主动探索、容纳认真失败、提供成长空间。
    source_heading: 二十一、本章方法论总结
