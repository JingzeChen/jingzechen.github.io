overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章定位：从认识结构到实际构建」建立了怎样的核心认识？
  question_source: 本章定位：从认识结构到实际构建
  thesis: 本章最核心的实践原则是：先确定自己在回答谁的什么问题；能从顶部开始时，用 SCQA 和疑问/回答向下展开，顶部不清楚时，从材料中寻找关系向上概括；最终让发现过程服从读者的理解过程。
  thesis_source: 本章小结
  concepts:
  - term: 本章定位：从认识结构到实际构建
    meaning: 本章的核心不在于记住一套机械模板，而在于建立可迭代的构建过程：先用最容易确定的信息形成假设，再用读者疑问、逻辑关系和证据不断校正。
    source_heading: 本章定位：从认识结构到实际构建
  - term: 自上而下法
    meaning: 同一主题可以对应许多问题。关于新记账方式，可以问“为什么提出”“是否可行”“如何实施”“成本多少”“何时上线”。若不确定主要疑问，正文容易把多个问题混在一起。
    source_heading: 自上而下法
  - term: 二、难点在哪里
    meaning: 自己的答案容易被误当成读者的问题；
    source_heading: 二、难点在哪里
  - term: 十、方法的主要局限
    meaning: "“已知背景”在多元受众中难以统一。"
    source_heading: 十、方法的主要局限
  - term: 继续向下展开
    meaning: 顶层回答会引发“为什么”“如何”还是“是什么”？
    source_heading: 继续向下展开
  - term: 本章小结
    meaning: 本章最核心的实践原则是：先确定自己在回答谁的什么问题；能从顶部开始时，用 SCQA 和疑问/回答向下展开，顶部不清楚时，从材料中寻找关系向上概括；最终让发现过程服从读者的理解过程。
    source_heading: 本章小结
  logic:
  - 本章定位：从认识结构到实际构建
  - 自上而下法
  - 初学者注意事项
  - 十、方法的主要局限
  - 综合示例：构建一份是否迁移办公地点的建议
  - 序言与写作控制
  - 本章小结
  sections:
  - title: 本章定位：从认识结构到实际构建
    source_heading: 本章定位：从认识结构到实际构建
    paragraphs:
    - 自上而下法：从主题、受众疑问和初步答案出发，借助 SCQA 向下展开；
    - 自下而上法：当顶部无法确定时，先列出材料，寻找逻辑关系，再向上概括结论。
    - 本章的核心不在于记住一套机械模板，而在于建立可迭代的构建过程：先用最容易确定的信息形成假设，再用读者疑问、逻辑关系和证据不断校正。
  - title: 二、为什么顶层必须是完整句子
    source_heading: 二、为什么顶层必须是完整句子
    paragraphs:
    - "“大客户记账方式”只说明谈论对象；"
    - "“大客户提出的新记账方式可行”才给出判断；"
    - 读者看到后会自然追问“为什么可行”；
    - 下层因此可以被限定为支持可行性的原因。
  - title: 自上而下法
    source_heading: 自上而下法
    paragraphs:
    - 写作者容易直接写正文，边写边寻找中心思想，最终把调查过程、背景和结论混在一起。自上而下法先固定文章要回答的问题，再只选择与该问题有关的思想。
    - 同一主题可以对应许多问题。关于新记账方式，可以问“为什么提出”“是否可行”“如何实施”“成本多少”“何时上线”。若不确定主要疑问，正文容易把多个问题混在一起。
    - 许多文章的背景、冲突、问题和答案分别看都合理，连在一起却对不上。例如，背景谈市场下滑，冲突谈系统故障，答案却建议调整组织架构。
    - 可行性不是“流程可以被描述”，而是方案满足业务要求并带来可接受结果。信息完整、现金流和工作量分别对应数据要求、资金效果和运营效果。
  - title: 初学者注意事项
    source_heading: 初学者注意事项
    paragraphs:
    - 探索性写作有时必须通过自由书写发现观点。此时可以写，但应把初稿标为“思考材料”，之后重新拆分和搭结构，不能因为文字已经存在就直接交付。
    - "“先想好”不等于序言文字必须最先定稿。正文分析可能迫使作者修改问题和答案。合理流程是先形成可用序言假设，写作中验证，最后统一修订。"
    - 读者不一定知道全部必要历史。若某历史事实新颖但容易客观验证，可以简要放入序言；若它具有争议、承担关键证明责任，就不能伪装成背景，应在正文提供证据。
    - 人形成想法时常沿演绎链推进，并倾向按发现顺序复述。但顶层已经给出结论后，关键句层若保留完整演绎链，最后一步往往重复顶层结论，结构显得冗长。
  - title: 二、难点在哪里
    source_heading: 二、难点在哪里
    paragraphs:
    - 自己的答案容易被误当成读者的问题；
    - 背景、冲突、论据和结论容易混层；
  - title: 十、方法的主要局限
    source_heading: 十、方法的主要局限
    paragraphs:
    - 树形结构难以表达反馈回路和多对多证据；
    - 单一中心问题不一定适合手册、纪要或资料合集；
    - 归纳关键句可能隐藏必要的规则前提；
    - "“已知背景”在多元受众中难以统一。"
  - title: 综合示例：构建一份是否迁移办公地点的建议
    source_heading: 综合示例：构建一份是否迁移办公地点的建议
    paragraphs:
    - 冲突：现办公室已接近容量上限，续租报价上涨 20%，但新地点会增加通勤距离。
    - 180 个工位覆盖预计 156 名员工；
    - 若三年总成本至少比续租低 10%，且员工调研未显示显著离职风险，则应在本季度末迁移；否则应重新谈判现址短期续租。
    - 这个示例说明，两种方法配合后，顶层答案可能从无条件建议变成条件性建议。结构不是用来维护最初观点，而是用来迫使观点与证据一致。
  - title: 继续向下展开
    source_heading: 继续向下展开
    paragraphs:
    - 顶层回答会引发“为什么”“如何”还是“是什么”？
    - 关键句是否全部回答同一个新疑问？
    - 关键句是否合起来足以支持顶层回答？
    - 是否存在跳过的中间推理或隐含假设？
  - title: 序言与写作控制
    source_heading: 序言与写作控制
    paragraphs:
    - 序言是否从可靠背景构思，而不是从争议判断开始？
    - 标题表达具体思想，还是只写“发现”“分析”“结论”？
    - 关键句层是否可以从演绎改写为更直接的归纳理由？
    - 若保留演绎，是否因为前提链本身必须被读者审查？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 饮料公司原备忘录详细说明运作流程，却没有先回答“新记账方式是否可行”，因此属于信息正确但层级错位。
    - 重构后以“可行”为顶层回答，以信息完整、增加现金流和减少工作量为关键理由，流程细节回到各自分支。
    - 仓库案例把“标准、符合标准、因此购买”的演绎链压缩为位置、面积和价格三个并列购买理由，表达更直接。
    - 本章最核心的实践原则是：先确定自己在回答谁的什么问题；能从顶部开始时，用 SCQA 和疑问/回答向下展开，顶部不清楚时，从材料中寻找关系向上概括；最终让发现过程服从读者的理解过程。
  takeaways:
  - 本章的核心不在于记住一套机械模板，而在于建立可迭代的构建过程：先用最容易确定的信息形成假设，再用读者疑问、逻辑关系和证据不断校正。
  - 可行性不是“流程可以被描述”，而是方案满足业务要求并带来可接受结果。信息完整、现金流和工作量分别对应数据要求、资金效果和运营效果。
  - "“已知背景”在多元受众中难以统一。"
  - 是否存在跳过的中间推理或隐含假设？
  - 本章最核心的实践原则是：先确定自己在回答谁的什么问题；能从顶部开始时，用 SCQA 和疑问/回答向下展开，顶部不清楚时，从材料中寻找关系向上概括；最终让发现过程服从读者的理解过程。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「主题、疑问与回答」？
  answer: "“TTW 排版成本”是主题，“成本能否降低”是疑问，“可通过简化工序和提高工资降低”是回答。"
  source_heading: 主题、疑问与回答
- level: 概念辨析
  question: 原文如何解释「自上而下构建与自上而下表达」？
  answer: 表达是把已整理的思想交付给读者。
  source_heading: 自上而下构建与自上而下表达
- level: 概念辨析
  question: 原文如何解释「清晰与正确」？
  answer: 结构清晰让读者看懂“作者认为工资低导致成本高”；是否真的如此，还要靠数据和因果验证。
  source_heading: 清晰与正确
- level: 概念辨析
  question: 原文如何解释「误解六：把两个近义表达并列会显得全面」？
  answer: TTW 的“简化工序”和“改变方法提高效率”实际是行动、子行动和结果的混合，不是独立方案。
  source_heading: 误解六：把两个近义表达并列会显得全面
- level: 概念辨析
  question: 原文如何解释「误解十二：完成结构后不再修改顶部」？
  answer: 下层证据可能推翻顶层答案。金字塔应当迭代，不能把顶部当作不可修改的命令。
  source_heading: 误解十二：完成结构后不再修改顶部
