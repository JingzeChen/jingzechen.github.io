  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 使用 SOLID、Template Method、Strategy 与 Factory，把 Rides 与 Kittens 做成可插拔 Feature
      Component；
    - 服务仍然可以保留，但每个服务内部也必须具有组件架构，让横切 Feature 以插件形式贯穿服务，而不是修改所有服务核心。
    - 系统的架构边界不一定落在服务之间；它们可能穿过一组服务，把每个服务内部切成高层政策、稳定抽象和低层功能插件。
    - 本章没有数学公式，也没有需要推导的算法。其论证是一种反例驱动的架构分析：先检验流行主张，再用横切变化暴露隐藏耦合，最后把 OCP 与 Dependency
      Rule 应用到服务内部。
  - title: 4.9 Operational Coupling
    source_heading: 4.9 Operational Coupling
    paragraphs:
    - Service Mesh Policy；
    - Certificate Rotation；
    - Incident Response；
    - Capacity Planning。
  - title: 6.13 Last 3 Days：三天历史要求
    source_heading: 6.13 Last 3 Days：三天历史要求
    paragraphs:
    - Vehicle 是否运送过 Kitty；
    - 最近一次 Kitty Delivery 时间；
  - title: 8.5 新建 Kittens Component
    source_heading: 8.5 新建 Kittens Component
    paragraphs:
    - Collection Point；
    - Customer Allergy；
    - Three-Day Vehicle Rule；
  - title: 9.3 对象模型也可能设计很差
    source_heading: 9.3 对象模型也可能设计很差
    paragraphs:
    - 所有 Feature 共享状态；
    - Factory 硬编码到处散布；
  - title: 11.2 边界可能穿过服务
    source_heading: 11.2 边界可能穿过服务
    paragraphs:
    - Selector Service；
    - Dispatcher Service。
    - 因此架构边界也穿过这些服务，把每个服务内部切成稳定核心与 Feature Component。
  - title: 12.1 服务确实有用
    source_heading: 12.1 服务确实有用
    paragraphs:
    - Develop-Ability；
    - Process Separation；
    - Platform Distribution。
  - title: 14.9 自动守卫 Dependency Rule
    source_heading: 14.9 自动守卫 Dependency Rule
    paragraphs:
    - Core 不依赖 Feature；
    - Core 不依赖 Framework；
    - Kittens 依赖 Stable Contract；
  - title: 18.2 解耦检查
    source_heading: 18.2 解耦检查
    paragraphs:
    - 是否共享 Database / Cache / Queue？
    - 是否共享 Data Record？
  - title: 19. 本章总结
    source_heading: 19. 本章总结
    paragraphs:
    - 真实独立部署还需要 Backward / Forward Compatibility、Contract Test 和 Rolling Upgrade 等能力。
    - 系统因此需要 Supplier 参与状态、Driver Allergy、Customer Allergy 与 Vehicle Delivery History。
    - Kittens 集中 Collection Point、Driver Allergy、Customer Allergy 与 Three-Day Vehicle
      Rule。
    - Feature Plugin 还需要 Core Contract、兼容版本、Rolling Upgrade、Flag 和 Contract Test。
  takeaways:
  - 第 27 章挑战服务天然强解耦、天然支持独立开发部署的流行主张。
  - Independent Development and Deployment 只在服务业务、数据、协议和运行责任真正独立时成立。
  - Kitty 是整个处理流水线的新业务变体，因此横切全部服务。
  - Feature Plugin 还需要 Core Contract、兼容版本、Rolling Upgrade、Flag 和 Contract Test。
  - 本章最终原则是：物理服务边界解决运行问题，真正架构边界由政策层级、组件变化轴和向内源码依赖决定。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「17.1 “使用 Microservices 就拥有架构”」？
  answer: 错误。服务只是物理机制，架构由政策边界与 Dependency Rule 定义。
  source_heading: 17.1 “使用 Microservices 就拥有架构”
- level: 概念辨析
  question: 原文如何解释「17.5 “独立 Pipeline 就等于独立部署”」？
  answer: 错误。若业务兼容要求同步发布，技术 Pipeline 独立没有解决问题。
  source_heading: 17.5 “独立 Pipeline 就等于独立部署”
- level: 概念辨析
  question: 原文如何解释「17.10 “必须使用继承才能解决”」？
  answer: 错误。Strategy、Function、Trait、Protocol 与 Composition 都可提供多态扩展。
  source_heading: 17.10 “必须使用继承才能解决”
- level: 概念辨析
  question: 原文如何解释「17.12 “新增插件后完全不需部署原服务”」？
  answer: 在现代不可变部署中通常仍需构建并滚动部署新制品。重点是核心不改、Feature 独立。
  source_heading: 17.12 “新增插件后完全不需部署原服务”
- level: 概念辨析
  question: 原文如何解释「17.20 “物理通信方式完全无关紧要”」？
  answer: 错误。它影响延迟、故障和运维；只是不单独定义 Policy Boundary。
  source_heading: 17.20 “物理通信方式完全无关紧要”
