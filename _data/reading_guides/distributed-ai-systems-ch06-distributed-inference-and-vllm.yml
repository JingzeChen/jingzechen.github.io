overview:
  kind: summary
  minutes: 13
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 目标线：raw throughput → latency distributions → SLO goodput → cost/availability。
  thesis_source: 21. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 如何设计不会把tokenization、queueing、warmup或profiler开销混入结论的benchmark？
    source_heading: 0. 本章要回答的核心问题
  - term: 3. Prerequisites、installation 与基本使用
    meaning: Online path额外引入：HTTP parsing、authentication、queueing、stream backpressure、client
      cancellation、timeouts和load balancing。Offline throughput不能直接代表online SLO。
    source_heading: 3. Prerequisites、installation 与基本使用
  - term: 9. Tensor Parallelism：让多个GPU共同执行每一层
    meaning: Activation是elementwise，不需要完整hidden expansion；column output恰好成为row input。原章先说column
      parallel“用AllGather重组”，随后又指出MLP无需中间gather。正确理解是：AllGather是一般组合方式，Megatron式配对有意避免它。
    source_heading: 9. Tensor Parallelism：让多个GPU共同执行每一层
  - term: 11. Pipeline Parallelism：沿模型深度切分推理
    meaning: 持续流量下steady state可接近满pipeline，但启动/排空、stage imbalance、P2P和同一sequence的autoregressive
      dependency仍存在。
    source_heading: 11. Pipeline Parallelism：沿模型深度切分推理
  - term: 17. Exercises：五道练习的参考实现与分析
    meaning: 原题用Llama-3.2 target、Qwen2.5 draft，却只加载Llama tokenizer。标准speculative decoding要求draft
      token ID在target中表示同一个token，通常要求相同tokenizer vocabulary及special-token语义。不同词表的ID
      123可能表示完全不同字符串，无法直接验证概率比。
    source_heading: 17. Exercises：五道练习的参考实现与分析
  - term: 24. 复习与自测
    meaning: 完成这些检查后，应能把“用vLLM部署一个大模型”转化为可证伪的系统设计：每份weight和KV由谁持有、每个请求在何时被调度、每个token沿哪些devices和collectives移动、内存为何在特定阶段达到峰值、延迟如何拆解、分布式配置为什么满足SLO，以及失败和过载时系统如何有界退化。
    source_heading: 24. 复习与自测
