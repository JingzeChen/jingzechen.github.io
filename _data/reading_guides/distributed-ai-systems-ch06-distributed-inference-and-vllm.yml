  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Weight memory、KV capacity和scheduler token budget如何共同限制并发？
    - Chunked prefill为什么能改善inter-token latency，又为何可能损害TTFT？
    - 如何设计不会把tokenization、queueing、warmup或profiler开销混入结论的benchmark？
    - OpenAI-compatible API如何实现streaming、timeout、retry与幂等边界？
  - title: 2.3 vLLM解决与不解决的问题
    source_heading: 2.3 vLLM解决与不解决的问题
    paragraphs:
    - 变长请求的continuous batching；
    - OpenAI-compatible serving接口。
    - Tenant isolation和admission policy；
    - 任意模型/quantization/kernel组合兼容；
  - title: 3. Prerequisites、installation 与基本使用
    source_heading: 3. Prerequisites、installation 与基本使用
    paragraphs:
    - Health只证明进程可响应；models只证明注册成功；实际completion才触发tokenization、scheduler、model execution和sampling。
    - Chat endpoint不只是把messages拼字符串。Chat template决定special tokens、roles和generation
      prompt；错误template会显著影响输出质量。
    - 适合：修改kernel/engine、验证未发布fix、贡献代码。代价是CUDA toolkit、compiler、ABI和build cache都成为变量。生产通常优先固定版本binary/container，而不是长期追踪main
      branch。
    - Online path额外引入：HTTP parsing、authentication、queueing、stream backpressure、client
      cancellation、timeouts和load balancing。Offline throughput不能直接代表online SLO。
  - title: 6. Motivation：从OOM反推分布式推理
    source_heading: 6. Motivation：从OOM反推分布式推理
    paragraphs:
    - 量化还需要scales、zero points、packing alignment，有些layers保持更高精度，所以不能把4-bit模型精确当成0.5
      byte/parameter。
    - DeepSeek-R1的671B是total parameters；MoE每token只激活一部分experts，降低compute，不意味着未激活expert
      weights无需驻留或可免费取得。
    - 若INT4后模型已fit，仍可能因KV容量或latency使用TP；若FP8后仍不fit，则继续TP/PP。选择依据不是“先量化还是先并行”的教条，而是quality、kernel支持、容量和SLO。
    - TP/PP主要拆模型，DP主要复制容量；但它们也通过aggregate HBM bandwidth、communication和scheduler布局影响延迟，不能只按“fit”分类。
  - title: 9. Tensor Parallelism：让多个GPU共同执行每一层
    source_heading: 9. Tensor Parallelism：让多个GPU共同执行每一层
    paragraphs:
    - 通常用AllReduce；若下一布局接受sequence/reduce-scattered shard，也可采用ReduceScatter变体。Bias必须在logical
      sum后只加一次，不能每rank先加再求和。
    - Activation是elementwise，不需要完整hidden expansion；column output恰好成为row input。原章先说column
      parallel“用AllGather重组”，随后又指出MLP无需中间gather。正确理解是：AllGather是一般组合方式，Megatron式配对有意避免它。
    - 原章说“不整除时需要padding或换TP”；实际vLLM对某些GQA/MQA模型可能复制KV heads，是否支持取决于model implementation。不能自行padding
      trained heads而不验证语义。
    - 一个decoder layer通常在attention output与MLP output附近各有一次主要reduction，具体次数随architecture、sequence
      parallel与fusion实现变化。
  - title: 11. Pipeline Parallelism：沿模型深度切分推理
    source_heading: 11. Pipeline Parallelism：沿模型深度切分推理
    paragraphs:
    - TP：每个layer内发生collective，频率高。PP：只在stage boundary发送activation，频率低但属于严格依赖链。
    - 全pipeline对一个request的aggregate KV仍等于所有stages之和。每stage free block数量可能不同，最紧张stage限制可调度并发。
    - 持续流量下steady state可接近满pipeline，但启动/排空、stage imbalance、P2P和同一sequence的autoregressive
      dependency仍存在。
    - 一个4096-token prefill可能比一次decode iteration长很多。若整段不可抢占，已在streaming的请求等待，TPOT尾延迟升高。
  - title: 14. Hands-On examples
    source_heading: 14. Hands-On examples
    paragraphs:
    - 原章用70B/4≈17.5B parameters/rank解释weight下界。它不含replicated weights、scales、runtime和KV。
    - 逻辑GPU总数32。这个命令本身没有说明多节点process launcher、Ray cluster、container networking或head/worker启动过程；实际分布式启动必须按当前vLLM
      distributed serving文档补齐。
    - 而且“每stage约84B params”只按671B/8算总parameter count；DeepSeek-R1是MoE，layers、shared
      experts和expert placement可能不均，单stage/rank实际weight不能由平均数保证fit。
    - Prefill/decode batch tokens；
  - title: 17. Exercises：五道练习的参考实现与分析
    source_heading: 17. Exercises：五道练习的参考实现与分析
    paragraphs:
    - 教学机很容易OOM。因此实现将physical block IDs预先加入free list，而K/V tensor在block首次写入时才物化。真实vLLM会预留连续device
      cache pool以获得可预测地址和kernel性能；lazy Python dictionaries只用于理解ownership。
    - 新admitted request先完成prefill，下一iteration才能decode；并不意味着prefill永远压过running decode。生产系统常反过来保护decode
      SLO，并把剩余token budget给chunked prefill。Priority policy需要根据TTFT/TPOT目标定义。
    - 原题用Llama-3.2 target、Qwen2.5 draft，却只加载Llama tokenizer。标准speculative decoding要求draft
      token ID在target中表示同一个token，通常要求相同tokenizer vocabulary及special-token语义。不同词表的ID
      123可能表示完全不同字符串，无法直接验证概率比。
    - Streaming更严格：一旦已经yield任何content，重连并重发会产生重复prefix。生产协议可使用request ID、server-side
      cancellation和application-level deduplication，但OpenAI-compatible generation本身不承诺透明resume。
  - title: 21. 本章知识结构
    source_heading: 21. 本章知识结构
    paragraphs:
    - 目标线：raw throughput → latency distributions → SLO goodput → cost/availability。
    - 时序线：arrival → queue → prefill → repeated decode → stream completion。
    - 内存线：weights → KV bytes/token → physical blocks → dynamic ownership/reuse。
    - 证据线：公式下界 → CPU/unit tests → GPU trace → workload replay → failure drill。
  - title: 24. 复习与自测
    source_heading: 24. 复习与自测
    paragraphs:
    - 最后chunk只有1 token；实际scheduler可能与其他prefill/decode tokens共享预算。
    - 平均约300 in-flight requests；若观测只有100且无rejection，数据口径可能不一致或系统不稳定。
    - Contract-test base/chat/streaming/usage/error endpoints。
    - 完成这些检查后，应能把“用vLLM部署一个大模型”转化为可证伪的系统设计：每份weight和KV由谁持有、每个请求在何时被调度、每个token沿哪些devices和collectives移动、内存为何在特定阶段达到峰值、延迟如何拆解、分布式配置为什么满足SLO，以及失败和过载时系统如何有界退化。
  takeaways:
  - 目标线：raw throughput → latency distributions → SLO goodput → cost/availability。
  - GQA/MQA降低KV memory，但也改变TP分片与复制行为。
  - Megatron式column/row配对避免中间AllGather，只在关键边界reduction。
  - Dense serving常先用最小TP/PP构造一个fit且达标的replica，再以DP复制。
  - 稳定知识是ownership、lifetime、critical path和SLO；具体CLI/class/default必须按版本验证。
