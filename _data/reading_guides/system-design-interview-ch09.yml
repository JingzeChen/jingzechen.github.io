  sections:
  - title: 0. 学习目标、阅读边界与全章路线
    source_heading: 0. 学习目标、阅读边界与全章路线
    paragraphs:
    - 网络爬虫（web crawler，也称 robot 或 spider）从一组初始 URL 出发，下载网页，提取页面中的链接，再继续下载新链接，用于发现新内容或已更新内容。
    - URL Frontier 为什么不是一条普通 FIFO，而是优先级、礼貌性和新鲜度调度器？
    - 每月 10 亿页怎样得到约 400 平均 QPS、800 峰值 QPS和 30 PB 五年存储？
    - 本文严格沿原章顺序展开。补充的调度公式、URL 规范化、幂等状态机、Bloom filter 容量、条件请求、SSRF 防护和可运行 Frontier
      示例属于工程背景，不是作者逐式给出的原文。
  - title: 5. Seed URLs：遍历从哪里开始
    source_heading: 5. Seed URLs：遍历从哪里开始
    paragraphs:
    - 抓大学网站时可用大学域名主页作为 seed。链接图连通性较好时，能发现大部分页面。
    - 按主题，如购物、体育、医疗选择种子。
    - 不同 seed 的重复发现比例。
  - title: 10.3 URL 规范化
    source_heading: 10.3 URL 规范化
    paragraphs:
    - 去除 fragment，因为不发送给服务器；
    - 规范 percent encoding。
    - 删除所有 tracking 参数；
  - title: 13.2 原书组件
    source_heading: 13.2 原书组件
    paragraphs:
    - Queue Router：保证同一 back queue 只含同 host URL；
    - Queue Selector：把可运行队列分给 Worker；
    - Worker threads：逐个下载并加入间隔。
  - title: 15.2 可运行 Frontier 示例
    source_heading: 15.2 可运行 Frontier 示例
    paragraphs:
    - 按 host back queues；
    - 高优先级不会绕过 host 延迟。
  - title: 18.4 robots.txt 不是访问控制
    source_heading: 18.4 robots.txt 不是访问控制
    paragraphs:
    - 它是自愿协议，不阻止恶意客户端；
    - 允许抓取不等于拥有版权或法律授权；
    - 禁止抓取也不是 HTTP 认证；
  - title: 22.2 Spider traps
    source_heading: 22.2 Spider traps
    paragraphs:
    - 日历无限 next day/month；
    - session ID 每次变化；
    - 单 host URL 发现速率异常。
    - 没有一刀切算法，因为合法电商筛选、分页和文档路径也可能很深。规则过严会损失覆盖。
  - title: 25.3 可用性、一致性与可靠性
    source_heading: 25.3 可用性、一致性与可靠性
    paragraphs:
    - Frontier 至少一次投递，允许重复；
    - URL Seen 可能最终一致，短暂重复抓可接受；
    - host 礼貌 owner 需要较强租约一致性，避免并发抓同站；
    - Seen 更新与 Frontier enqueue 之间需要 outbox/幂等，避免发现 URL 永久丢失。
  - title: 26.5 可靠性与成本
    source_heading: 26.5 可靠性与成本
    paragraphs:
    - storage growth/compression；
    - bandwidth and render cost；
    - data loss/audit gaps；
    - 指标要按域、地域和优先级聚合，但避免把每个 URL/host 都作为高基数时序标签。
  - title: 29. 核心结论与一般设计方法
    source_heading: 29. 核心结论与一般设计方法
    paragraphs:
    - Front queues 和 back queues 分工明确。 前者决定优先级，后者保证 host 访问间隔；高优先级不能越过礼貌约束。
    - 平均约 386，取 400 pages/s，峰值约 800；500 KB/页是 500 TB/月、30 PB/5 年，峰值入站约 3.2 Gb/s。
    - 高层闭环是 Seed → Frontier → Downloader/DNS → Parser → Content Seen/Storage → Extract/Filter
      → URL Seen/Storage → Frontier。
    - 如果这些问题都能回答，就不只是会写一个递归下载脚本，而是理解了本章的核心方法：把开放 Web 的无限遍历转化为一个受预算、价值、时间与外部站点约束的持久调度问题，再用去重反馈环、分布式执行、失败隔离和质量监控，使抓取系统能够长期、礼貌且可恢复地运行。
  takeaways:
  - 规模化、鲁棒性、礼貌性、可扩展性；
  - Front queues 和 back queues 分工明确。 前者决定优先级，后者保证 host 访问间隔；高优先级不能越过礼貌约束。
  - 平均约 386，取 400 pages/s，峰值约 800；500 KB/页是 500 TB/月、30 PB/5 年，峰值入站约 3.2 Gb/s。
  - 能否解释普通 BFS 的礼貌性和优先级问题？
  - 如果这些问题都能回答，就不只是会写一个递归下载脚本，而是理解了本章的核心方法：把开放 Web 的无限遍历转化为一个受预算、价值、时间与外部站点约束的持久调度问题，再用去重反馈环、分布式执行、失败隔离和质量监控，使抓取系统能够长期、礼貌且可恢复地运行。
