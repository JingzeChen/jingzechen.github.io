  question: 原文围绕「0. 学习目标、阅读边界与全章路线」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与全章路线
  thesis: 如果这些问题都能回答，就不只是会写一个递归下载脚本，而是理解了本章的核心方法：把开放 Web 的无限遍历转化为一个受预算、价值、时间与外部站点约束的持久调度问题，再用去重反馈环、分布式执行、失败隔离和质量监控，使抓取系统能够长期、礼貌且可恢复地运行。
