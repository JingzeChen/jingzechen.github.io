checks:
- level: 概念辨析
  question: 原文如何解释「27.1 Crawler 与 Scraper」？
  answer: Crawler 重点发现和遍历 URL；scraper 重点从页面提取结构化数据。一个系统可以同时包含两者。
  source_heading: 27.1 Crawler 与 Scraper
- level: 概念辨析
  question: 原文如何解释「27.6 Politeness 与系统内部限流」？
  answer: 两者都控制速率；politeness 保护外部站点并尊重协议，内部限流保护自身资源。
  source_heading: 27.6 Politeness 与系统内部限流
- level: 概念辨析
  question: 原文如何解释「27.11 内容哈希与近似去重」？
  answer: 密码学 hash 识别精确相同；小改动会完全不同。近似重复要用 SimHash/MinHash 等，并接受误判。
  source_heading: 27.11 内容哈希与近似去重
- level: 概念辨析
  question: 原文如何解释「27.17 动态渲染与网站 SSR」？
  answer: 原章 dynamic rendering 指 crawler 用浏览器执行 JS；网站 SSR 是站点服务端预先渲染 HTML，概念不同。
  source_heading: 27.17 动态渲染与网站 SSR
- level: 概念辨析
  question: 原文如何解释「27.20 抓得越多越好」？
  answer: 资源有限时，应优化有价值、合法、及时、低噪声的覆盖，而非无差别最大页面数。
  source_heading: 27.20 抓得越多越好
