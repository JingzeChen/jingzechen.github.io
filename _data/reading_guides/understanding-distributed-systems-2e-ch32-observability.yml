overview:
  kind: summary
  minutes: 8
  question: 0. 本章定位：Monitoring 发现“坏了”，Observability 帮助回答“为什么”？
  question_source: 0. 本章定位：Monitoring 发现“坏了”，Observability 帮助回答“为什么”
  thesis: Fleet 扩大和 logging bug 仍可压垮后端，因此 collector 必须 rate-limit。
  thesis_source: 38. 核心结论
  concepts:
  - term: 0. 本章定位：Monitoring 发现“坏了”，Observability 帮助回答“为什么”
    meaning: 作者的答案不是“预先为每种故障建一个 dashboard”，而是保留足够细粒度、上下文丰富且可关联的 telemetry，使未知问题发生后仍能查询。
    source_heading: 0. 本章定位：Monitoring 发现“坏了”，Observability 帮助回答“为什么”
  - term: 8. Logs 对 debugging 的价值
    meaning: 例如 service instance crash：从 crash event 找 instance/version/request，查询之前的
      resource、dependency 和 error context。
    source_heading: 8. Logs 对 debugging 的价值
  - term: 15.3 风险
    meaning: Knob 应 scoped、TTL、audited，并受 volume budget 限制。
    source_heading: 15.3 风险
  - term: 18.4 分层保留
    meaning: Incident 时临时提高 verbosity。
    source_heading: 18.4 分层保留
  - term: 27. Metrics 是跨事件聚合的 derived views
    meaning: 原章说“可以从 events 派生”，某些系统确实如此；production instrumentation 也可直接同时 emit metric
      和 event，避免全量 raw retention。逻辑关系比物理实现更重要。
    source_heading: 27. Metrics 是跨事件聚合的 derived views
  - term: 39. 解决问题的一般思路
    meaning: Async bounded buffers、levels、priority/tail sampling、retention tiers、collector
      rate limits 和 drop counters。
    source_heading: 39. 解决问题的一般思路
