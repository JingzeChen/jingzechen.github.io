checks:
- level: 概念辨析
  question: 原文如何解释「33.1 Monitoring 与 observability」？
  answer: Monitoring 跟踪 health/known conditions；observability 还支持用 rich telemetry
    调试未知行为。Monitoring 是其子集。
  source_heading: 33.1 Monitoring 与 observability
- level: 概念辨析
  question: 原文如何解释「33.7 Span duration 与 self time」？
  answer: Span duration 包含 child/wait；self time 要扣除 child overlap。最长 span 不一定是 CPU
    bottleneck。
  source_heading: 33.7 Span duration 与 self time
- level: 概念辨析
  question: 原文如何解释「34.3 “Logs 可以替代 metrics”」？
  answer: 每次 dashboard/alert 扫描海量 events 昂贵；派生 time-series view。
  source_heading: 34.3 “Logs 可以替代 metrics”
- level: 概念辨析
  question: 原文如何解释「34.9 “动态打开 debug 没风险”」？
  answer: 全 fleet volume spike 可压垮 disk/collector。Scope + TTL + audit + rate limit。
  source_heading: 34.9 “动态打开 debug 没风险”
- level: 概念辨析
  question: 原文如何解释「34.16 “没有 logs 表示没有错误”」？
  answer: 可能 telemetry pipeline 断裂。监测 freshness、drop 和 ingestion lag。
  source_heading: 34.16 “没有 logs 表示没有错误”
