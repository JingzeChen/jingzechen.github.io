  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 逻辑斯谛回归从”如何把线性打分变成概率”出发； 最大熵模型从”在满足约束的所有分布中该选哪一个”出发。
    - 它展示了拉格朗日对偶这一强大工具（第 7 章 SVM 会再次大量使用）；
    - 它的目标函数是光滑凸函数，是理解优化方法的最佳载体。
    - 与朴素贝叶斯构成第 4 章提到的生成-判别对：模型形式相同（都是对数线性），但一个学联合分布、一个直接学条件分布。
  - title: 6.1 逻辑斯谛回归模型
    source_heading: 6.1 逻辑斯谛回归模型
    paragraphs:
    - 值域就被”拉开”到整个实数轴，可以用线性模型了。这正是广义线性模型（GLM）中连接函数（link function）的思想，logit 是 Bernoulli
      分布的典范连接函数（canonical link，见习题 6.1）。
    - 这是逻辑斯谛回归相对神经网络的巨大优势：没有局部极小值陷阱。第 5 章决策树要面对 NP 完全问题，本章则有完美的凸性保证。
    - 由第 1 章的讨论，这等价于给 w 加高斯先验后做 MAP 估计。L_1 正则则对应拉普拉斯先验，能产生稀疏解。
    - 神经网络分类层就是多项逻辑斯谛回归：最后一层线性变换 + softmax + 交叉熵损失，与本节完全相同，只是 x 换成了网络学到的特征表示。
  - title: 6.2 最大熵模型
    source_heading: 6.2 最大熵模型
    paragraphs:
    - "“等可能”是一个直觉概念，难以在有约束时操作；而熵是一个可优化的数值指标。最大熵原理的贡献就是把哲学直觉变成了数学问题。"
    - 例如在词性标注中，可以定义”当前词是 ‘the’ 且标注为限定词”这样的特征。特征函数是人为设计的，它编码了我们认为重要的模式。一般地，特征函数可以取任意实值，不必是二值。
    - 这个约束的含义：模型预测出的特征平均出现频率，必须与训练数据中实际观察到的频率一致。这称为矩匹配（moment matching）。
    - 关键观察：受同一约束影响的变量，得到相同的概率。这从数学上解释了为什么”组内等概率”——不是我们主观假设的，而是最大熵原理推导出来的。
  - title: 6.3.1 逻辑斯谛回归是最大熵模型的特例
    source_heading: 6.3.1 逻辑斯谛回归是最大熵模型的特例
    paragraphs:
    - 逻辑斯谛回归不是拍脑袋设计的——它是”在矩匹配约束下最大熵”的必然结果；
    - sigmoid 的指数形式来自拉格朗日对偶的推导，不是随意选的压缩函数；
  - title: 6.3.2 对数线性模型
    source_heading: 6.3.2 对数线性模型
    paragraphs:
    - 对数概率是特征的线性函数，故称对数线性模型（log-linear model）。
    - 第 11 章的条件随机场就是把最大熵模型推广到序列结构，本章的推导会在那里再次出现。所以本章的推导务必吃透。
  - title: 6.4.3 拟牛顿法（BFGS）
    source_heading: 6.4.3 拟牛顿法（BFGS）
    paragraphs:
    - 拟牛顿法的思想：不精确计算 Hessian，而是用迭代过程中的梯度差去近似它，同时保持超线性收敛速度。
    - 满足该方程的矩阵有无穷多，BFGS 在其中选择”与 B_k 差异最小且保持正定对称”的那一个。
  - title: 6.4.4 算法对比
    source_heading: 6.4.4 算法对比
    paragraphs:
    - 梯度上升：需 1000+ 步达到同样精度。
    - 这与理论一致：牛顿法利用了二阶信息（曲率），能自适应调整步长和方向；梯度下降只有一阶信息，在病态问题上会来回震荡。
  - title: 6.6.1 逻辑斯谛回归 vs 感知机 vs SVM
    source_heading: 6.6.1 逻辑斯谛回归 vs 感知机 vs SVM
    paragraphs:
    - 处处可微（感知机和 SVM 的合页损失在折点不可微）；
    - 是 0-1 损失的凸上界（可优化的替代损失）。
  - title: 6.6.2 最大熵原理的普适性
    source_heading: 6.6.2 最大熵原理的普适性
    paragraphs:
    - 这就是为什么”不知道具体分布时假设正态”是合理的——它是最”不做多余假设”的选择。
    - 这些结论都可以用本章的拉格朗日方法推导：写出熵、加约束、求对偶。方法完全相同，只是约束不同。
  - title: 6.7 本章方法论总结
    source_heading: 6.7 本章方法论总结
    paragraphs:
    - 目标函数光滑凹，可用：IIS、梯度下降、牛顿法、BFGS/L-BFGS、SGD。均收敛到全局最优。
    - 多项逻辑斯谛回归即 softmax，是神经网络分类层的直接来源；参数有冗余，需固定参照类。
    - BFGS 用梯度差近似 Hessian，满足割线方程并保持正定；大规模用 L-BFGS。
    - 最大熵原理是普适建模准则：均值约束→指数分布，均值方差约束→正态分布。
  takeaways:
  - 与朴素贝叶斯构成第 4 章提到的生成-判别对：模型形式相同（都是对数线性），但一个学联合分布、一个直接学条件分布。
  - 关键观察：受同一约束影响的变量，得到相同的概率。这从数学上解释了为什么”组内等概率”——不是我们主观假设的，而是最大熵原理推导出来的。
  - 满足该方程的矩阵有无穷多，BFGS 在其中选择”与 B_k 差异最小且保持正定对称”的那一个。
  - 是 0-1 损失的凸上界（可优化的替代损失）。
  - 最大熵原理是普适建模准则：均值约束→指数分布，均值方差约束→正态分布。
