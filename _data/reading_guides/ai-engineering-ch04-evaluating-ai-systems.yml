  - 可用启发式检查明显规则：寡言角色的平均回答长度、禁用词、时代外实体等；复杂风格和知识边界则需要参考对话、人工或 AI 裁判。RoleLLM 结合相似度与 AI
    裁判，CharacterEval 通过人工数据和奖励模型按多维五分量表评价。
  - 常见业务指标包括 DAU、WAU、MAU、对话次数和访问时长。它们容易测量，却可能鼓励成瘾设计或极端内容。用户停留更久，既可能因为产品有价值，也可能因为系统低效、难以完成任务。
