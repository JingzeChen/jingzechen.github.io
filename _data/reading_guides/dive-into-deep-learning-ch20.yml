  sections:
  - title: 1. 本章主线：把“两样本检验”变成生成器的学习信号
    source_heading: 1. 本章主线：把“两样本检验”变成生成器的学习信号
    paragraphs:
    - 本书此前的大部分任务属于判别学习：给定输入 x，预测标签或目标 y。生成建模则试图学习数据分布本身，使模型可以产生新的、与真实数据相似的样本。
    - 如果一个强判别器无法区分真实样本与生成样本，那么生成分布应当已经接近真实分布；反过来，判别器指出“哪里像假样本”，就能为生成器提供改进方向。
    - 再用转置卷积、卷积、BatchNorm 和 LeakyReLU 构造 DCGAN；
    - 理论 minimax 目标与实际 non-saturating 生成器损失不同；
  - title: 3. GAN 的三个基本对象
    source_heading: 3. GAN 的三个基本对象
    paragraphs:
    - 过大增加优化难度，但不会自动产生更丰富语义；
    - 不同 z 可能映射到同一或相近样本。
    - 对图像，G 通常把低空间分辨率、高通道的 latent tensor 逐层放大为图像。
    - 判别器既是二分类器，也是生成器的可学习损失函数。随着 G 改变，D 面对的负样本分布也持续改变。
  - title: 8. 与 Jensen–Shannon 散度的关系
    source_heading: 8. 与 Jensen–Shannon 散度的关系
    paragraphs:
    - 判别器只能随机猜测，不是“生成器彻底击败判别器”，而是双方达到分布匹配的 Nash 平衡。
    - 每次固定 G 都把 D 优化到全局最优；
    - 有限网络、有限样本、mini-batch SGD 下，这些条件通常不成立，JS 推导不能直接保证实际训练收敛。
    - 对分布位置变化可能近似常数，最优判别器不能提供有用的平滑方向。这是后来 Wasserstein GAN 等方法尝试解决的问题之一。
  - title: 11. 基础案例：拟合二维高斯
    source_heading: 11. 基础案例：拟合二维高斯
    paragraphs:
    - W 不唯一：若 Q 是正交矩阵，合适的旋转仍可产生相同协方差。这说明生成器参数不可辨识，但生成分布可以正确。
    - 虽然真实与生成都是高斯，训练中间阶段的密度比边界不一定是单一直线，因此使用小 MLP 比线性判别器更灵活。
    - 两方使用 Adam，权重初始化为标准差 0.02 的正态分布。每个 batch 先更新 D，再更新 G。
    - 原书只用动画展示损失与散点，没有保存最终数值，因此源码本身不能证明每次都收敛。
  - title: 18. BatchNorm、初始化与优化器
    source_heading: 18. BatchNorm、初始化与优化器
    paragraphs:
    - 在生成器中引入批统计耦合，可能增加一定随机正则效果。
    - 真实与假样本分开前向时统计不同；
    - 生成预览若在 train mode 会改变 running statistics。
  - title: 20.1 Mode collapse（模式崩溃）
    source_heading: 20.1 Mode collapse（模式崩溃）
    paragraphs:
    - 局部梯度把许多 latent 推向同一模式；
    - 判别器尚未对重复样本形成有效惩罚；
  - title: 21. 为什么 GAN 损失难以解释
    source_heading: 21. 为什么 GAN 损失难以解释
    paragraphs:
    - 跨 checkpoint 的 loss 不一定可比；
    - loss 上升可能只是对手变强；
    - 判别器容量不足、训练失败或被正则压垮。
  - title: 23. 稳定训练的常见扩展
    source_heading: 23. 稳定训练的常见扩展
    paragraphs:
    - 把真实标签从 1 改为如 0.9，减少 D 过度自信。通常不把假标签也平滑到正值，以免鼓励错误区域。
    - 用 Wasserstein-1 距离的对偶形式替代 JS 相关目标，使支撑不重叠时仍可能提供连续信号。判别器改称 critic，不输出概率。
    - 让判别器观察批内相似性，或直接奖励不同 latent 产生不同输出，以缓解 mode collapse。
  - title: 25. DCGAN 练习详解
    source_heading: 25. DCGAN 练习详解
    paragraphs:
    - 但不能断言标准 ReLU 必然失败。结果取决于初始化、BatchNorm、学习率和数据。LeakyReLU 是降低死亡风险的经验选择。
    - 处理 28 与 64 的尺寸差异。
    - 用独立 Fashion-MNIST 分类器给生成样本打标签，再按类计算质量和覆盖率。
    - 原书没有运行该实验，不能从正文断言某些类别一定最好。通常视觉结构简单、形态一致的类别可能更易生成，但必须实测。
  - title: 29. 解决 GAN 问题的一般思路
    source_heading: 29. 解决 GAN 问题的一般思路
    paragraphs:
    - 先在可诊断的 toy distribution 上测试：检查均值、协方差和覆盖，而不只看图。
    - 显式诊断 mode collapse：最近邻、多样性、类别覆盖和 precision/recall。
    - 遇到不稳定先检查基础错误：重复 sigmoid、忘记 detach、范围不匹配、学习率过高、BN mode 错误。
    - 实际训练却是有限网络上的非平稳博弈，因此必须使用 non-saturating 梯度、正确的 detach/冻结、稳定卷积架构和多维评价，并警惕 mode
      collapse、支撑不重叠、BatchNorm 状态污染及“低损失等于好生成”的误判。
  takeaways:
  - 判别模型学习输入到标签，生成模型学习数据分布或可采样机制。
  - JS 推导依赖无限容量、总体期望和判别器最优等理想条件，不保证实际 SGD 收敛。
  - DCGAN 用转置卷积逐级放大 latent，用步幅卷积逐级压缩图像。
  - 经典 DCGAN 对卷积和 BatchNorm 使用不同初始化；原书统一正态初始化并不严谨。
  - 有限训练集上骗过判别器可能只是记忆，不等于匹配真实总体分布。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「26.9 判别器越强越好」？
  answer: 过强且近乎完美的 D 可能给 G 很差的局部信号；过弱也无法提供有效差异。
  source_heading: 26.9 判别器越强越好
- level: 概念辨析
  question: 原文如何解释「26.25 生成预览不需要 eval()」？
  answer: 含 BatchNorm 时 train/eval 会产生不同输出并影响运行统计。
  source_heading: 26.25 生成预览不需要 eval()
- level: 概念辨析
  question: 原文如何解释「26.26 BatchNorm 参数都应初始化为均值 0」？
  answer: 经典 DCGAN 通常将 scale 初始化在 1 附近，bias 为 0。
  source_heading: 26.26 BatchNorm 参数都应初始化为均值 0
