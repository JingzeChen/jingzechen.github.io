overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章主线：把“两样本检验”变成生成器的学习信号」建立了怎样的核心认识？
  question_source: 1. 本章主线：把“两样本检验”变成生成器的学习信号
  thesis: 生成器中间层使用 BatchNorm+ReLU，输出层用 tanh；判别器用 LeakyReLU 保留负区梯度。
  thesis_source: 28. 核心结论
  concepts:
  - term: 1. 本章主线：把“两样本检验”变成生成器的学习信号
    meaning: 本书此前的大部分任务属于判别学习：给定输入 x，预测标签或目标 y。生成建模则试图学习数据分布本身，使模型可以产生新的、与真实数据相似的样本。
    source_heading: 1. 本章主线：把“两样本检验”变成生成器的学习信号
  - term: 8. 与 Jensen–Shannon 散度的关系
    meaning: 对分布位置变化可能近似常数，最优判别器不能提供有用的平滑方向。这是后来 Wasserstein GAN 等方法尝试解决的问题之一。
    source_heading: 8. 与 Jensen–Shannon 散度的关系
  - term: 18. BatchNorm、初始化与优化器
    meaning: 生成预览若在 train mode 会改变 running statistics。
    source_heading: 18. BatchNorm、初始化与优化器
  - term: 20.1 Mode collapse（模式崩溃）
    meaning: 局部梯度把许多 latent 推向同一模式；
    source_heading: 20.1 Mode collapse（模式崩溃）
  - term: 23. 稳定训练的常见扩展
    meaning: 用 Wasserstein-1 距离的对偶形式替代 JS 相关目标，使支撑不重叠时仍可能提供连续信号。判别器改称 critic，不输出概率。
    source_heading: 23. 稳定训练的常见扩展
  - term: 29. 解决 GAN 问题的一般思路
    meaning: 实际训练却是有限网络上的非平稳博弈，因此必须使用 non-saturating 梯度、正确的 detach/冻结、稳定卷积架构和多维评价，并警惕
      mode collapse、支撑不重叠、BatchNorm 状态污染及“低损失等于好生成”的误判。
    source_heading: 29. 解决 GAN 问题的一般思路
