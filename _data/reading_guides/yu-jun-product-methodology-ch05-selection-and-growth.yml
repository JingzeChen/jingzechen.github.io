overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章要回答的问题」建立了怎样的核心认识？
  question_source: 1. 本章要回答的问题
  thesis: 新人前几年会快速掌握产品生产、迭代、组织机制和领域知识。五年左右，基础经验逐渐稳定，继续做完全相同的工作，新增经验的边际收益下降。之后差距更多来自专业判断、管理、潜力、性格与新挑战。
  thesis_source: 8.2 经验早期增长快，后期边际递减
  concepts:
  - term: 1. 本章要回答的问题
    meaning: 前四章讨论了产品经理如何理解用户、设计交易和做出决策。本章把同一套方法用于产品经理自身：企业怎样选择、培养和使用产品经理，个人又怎样选择岗位、积累能力并规划长期职业路径。
    source_heading: 1. 本章要回答的问题
  - term: 8.2 经验早期增长快，后期边际递减
    meaning: 新人前几年会快速掌握产品生产、迭代、组织机制和领域知识。五年左右，基础经验逐渐稳定，继续做完全相同的工作，新增经验的边际收益下降。之后差距更多来自专业判断、管理、潜力、性格与新挑战。
    source_heading: 8.2 经验早期增长快，后期边际递减
  - term: 12.1 视角一：用户模型与交易模型
    meaning: 掌握用户模型需要积累大量具体样本：亲身体验、用户反馈、坏案例、行为数据、事前预测和上线验证。检验标准是能否较准确预测产品变化后的用户行为。
    source_heading: 12.1 视角一：用户模型与交易模型
  - term: 14.1 专业路线：权衡决策与交易模型
    meaning: 专业天赋和判断能力突出的人，可以继续争取高成长、高复杂度岗位。专业能力要从单纯用户体验升级到交易模型：既创造用户价值，又设计可持续盈利和多方平衡。
    source_heading: 14.1 专业路线：权衡决策与交易模型
  - term: 17.5 薪酬谈判
    meaning: 个人高薪不等于好岗位。产品经理产出依赖团队，如果周围人才薪酬缺乏竞争力、长期流失，个人也缺少生产资源。应同时看内部长期公平和整体人才市场竞争力。
    source_heading: 17.5 薪酬谈判
  - term: 23. 复习卡片
    meaning: Q：优秀新人选择导师、业务、平台的参考顺序是什么？ A：在业务差异不极端时，通常是直接导师、业务、平台；具体选择仍取决于约束条件。
    source_heading: 23. 复习卡片
