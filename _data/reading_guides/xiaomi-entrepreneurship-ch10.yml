overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、效率是理解小米模式的主轴」建立了怎样的核心认识？
  question_source: 一、效率是理解小米模式的主轴
  thesis: 效率目标：减少不创造用户价值的损耗，而不是偷工减料或转移成本。 +> 两个矛盾：好与便宜；低硬件利润与企业盈利。 +> 五项价格构成：制造服务、研发、营销广告、销售渠道、利润。
    +> 分摊关键：爆品规模让同一研发和基础投入服务更多商品。 +> 流速关键：单次赚得少，也要看库存和资金一年循环多快。 +> 三项动作：爆品降分摊、互联网和新零售降交易成本、5%
    红线限制硬件利润。 +> 铁人三项：硬件创造价值，新零售交付价值，互联网服务延续关系并贡献利润。 +> 小费模式：先以高性价比硬件获得用户，再提供自愿、有价值的持续服务。
  thesis_source: 十六、本章方法论总结
  concepts:
  - term: 一、效率是理解小米模式的主轴
    meaning: 小米同时做手机和智能硬件、操作系统、互联网服务、电商、线下门店和生态链，看起来像多种公司叠在一起。
    source_heading: 一、效率是理解小米模式的主轴
  - term: 五、隐藏要素：流速
    meaning: 研发、采购、库存和门店都要提前占用资金。资金被一批库存占用越久，就越晚用于下一轮产品，也会承担利息、机会成本和跌价风险。
    source_heading: 五、隐藏要素：流速
  - term: 八、“小费模式”
    meaning: 原书说亚马逊“丝毫影响不到”Costco 是强调模式差异，现实中电商仍会影响价格透明、品类和消费习惯。更稳妥的结论是：高效率、强会员价值的线下模式不容易被简单替代。
    source_heading: 八、“小费模式”
  - term: 9.3 “最优解、唯一解”的边界
    meaning: 雷军认为铁人三项是小米目标下找到的最优甚至唯一解。其他公司还可以选择高硬件利润、订阅、开放平台、企业服务或只做单一环节。
    source_heading: 9.3 “最优解、唯一解”的边界
  - term: 十二、第二个闭环：硬件—商城—用户
    meaning: 品类不是越多越好。过度扩张会增加库存、选品、质控和售后风险。用户会把生态产品问题归因于小米品牌，因此平台必须管理统一质量和服务边界。
    source_heading: 十二、第二个闭环：硬件—商城—用户
  - term: 十六、本章方法论总结
    meaning: 效率目标：减少不创造用户价值的损耗，而不是偷工减料或转移成本。 +> 两个矛盾：好与便宜；低硬件利润与企业盈利。 +> 五项价格构成：制造服务、研发、营销广告、销售渠道、利润。
      +> 分摊关键：爆品规模让同一研发和基础投入服务更多商品。 +> 流速关键：单次赚得少，也要看库存和资金一年循环多快。 +> 三项动作：爆品降分摊、互联网和新零售降交易成本、5%
      红线限制硬件利润。 +> 铁人三项：硬件创造价值，新零售交付价值，互联网服务延续关系并贡献利润。 +> 小费模式：先以高性价比硬件获得用户，再提供自愿、有价值的持续服务。
    source_heading: 十六、本章方法论总结
