overview:
  kind: summary
  minutes: 8
  question: 原文围绕「二、练习目的与情境」建立了怎样的核心认识？
  question_source: 二、练习目的与情境
  thesis: 你既有产出责任，也有培养人员和改善系统的产能责任。
  thesis_source: 二、练习目的与情境
  concepts:
  - term: 二、练习目的与情境
    meaning: 你既有产出责任，也有培养人员和改善系统的产能责任。
    source_heading: 二、练习目的与情境
  - term: 十一、编列媒体广告预算
    meaning: 预算需要 2—3 天，显然无法在当前工作日内完成。若管理者仍坚持亲自做，只能推迟其他要务或长期加班。
    source_heading: 十一、编列媒体广告预算
  - term: 二十一、以配偶为中心
    meaning: 原则中心的人同样深爱配偶，但把配偶视为平等互赖伙伴，而不是唯一价值来源。
    source_heading: 二十一、以配偶为中心
  - term: 二十五、以财富为中心
    meaning: 财富中心偏向占有物、地位、声望和展示。
    source_heading: 二十五、以财富为中心
  - term: 4. 中心会重新解释原则
    meaning: 服务自我利益、随时可调整的理念。
    source_heading: 4. 中心会重新解释原则
  - term: 三十九、个人复盘问题
    meaning: 最近三个危机中，哪些可通过培训、流程或提前沟通预防？
    source_heading: 三十九、个人复盘问题
  logic:
  - 二、练习目的与情境
  - 十一、编列媒体广告预算
  - 十五、准备下月销售会议
  - 二十五、以财富为中心
  - 三十、以自我为中心
  - 2. 使用矩阵反向诊断
  - 三十九、个人复盘问题
  sections:
  - title: 二、练习目的与情境
    source_heading: 二、练习目的与情境
    paragraphs:
    - 它不是考察谁能排出最紧凑的时间表，而是考察管理者能否从“亲自处理所有急事”转换为“建立减少急事的能力与体系”。
    - 工作涉及销售、广告、监管、质量和高层会议等多方关系；
    - 你既有产出责任，也有培养人员和改善系统的产能责任。
  - title: 五、第一眼的象限分类
    source_heading: 五、第一眼的象限分类
    paragraphs:
    - 紧急标签来自电话、急件、会议、质量传言和上级指示；
    - 重要性判断却尚未经过使命、角色和长期后果检验；
    - 若管理者直接接受列表给出的框架，就会陷入第一象限。
  - title: 十一、编列媒体广告预算
    source_heading: 十一、编列媒体广告预算
    paragraphs:
    - 预算需要 2—3 天，显然无法在当前工作日内完成。若管理者仍坚持亲自做，只能推迟其他要务或长期加班。
    - 提出一份大致只需签字批准的“业务方案”；或
    - 选择观点和经验不同的成员，可以获得管理者个人难以形成的方案，并培养组织预算能力。
  - title: 十五、准备下月销售会议
    source_heading: 十五、准备下月销售会议
    paragraphs:
    - 原列表把任务定义为主管写两小时发言稿。作者重新定义问题：销售会议真正需要解决什么？
    - 与每位销售人员面谈，或进行抽样调查；
    - 主管不必亲自写一篇可能偏离需求的发言稿，而是建立团队诊断、设计和组织会议的能力。
  - title: 二十一、以配偶为中心
    source_heading: 二十一、以配偶为中心
    paragraphs:
    - 它看似浪漫，因为婚姻确实重要；问题在于情感价值完全依赖对方态度，容易发展为过度依附。
    - 原则中心的人同样深爱配偶，但把配偶视为平等互赖伙伴，而不是唯一价值来源。
  - title: 二十五、以财富为中心
    source_heading: 二十五、以财富为中心
    paragraphs:
    - 金钱中心偏向现金、收入和经济安全；
    - 财富中心偏向占有物、地位、声望和展示。
  - title: 三十、以自我为中心
    source_heading: 三十、以自我为中心
    paragraphs:
    - 把个人满足、权利、形象和利益作为最高标准，其他人和领域主要按是否服务自己来评价。
    - 原则中心需要照顾身体、边界和合理需求，以维护产能；自我中心则把他人的价值从属于自己的满足。
  - title: 4. 中心会重新解释原则
    source_heading: 4. 中心会重新解释原则
    paragraphs:
    - 服务自我利益、随时可调整的理念。
    - 这解释了为什么人可以口头谈原则，却在利益冲突时立即放弃：原则从未真正位于中心。
  - title: 2. 使用矩阵反向诊断
    source_heading: 2. 使用矩阵反向诊断
    paragraphs:
    - 我是否把配偶视为工作助力或阻力？
    - 离开职位后，我还知道自己是谁吗？
  - title: 三十九、个人复盘问题
    source_heading: 三十九、个人复盘问题
    paragraphs:
    - 最近三个危机中，哪些可通过培训、流程或提前沟通预防？
    - 我在压力下最害怕失去什么？这暴露了哪个生活中心？
    - 我是否把朋友、宗教或原则当作获取地位和利益的工具？
    - 当收入、职位或关系变化时，我是否仍知道自己的价值？
  takeaways:
  - 你既有产出责任，也有培养人员和改善系统的产能责任。
  - 选择观点和经验不同的成员，可以获得管理者个人难以形成的方案，并培养组织预算能力。
  - 财富中心偏向占有物、地位、声望和展示。
  - 这解释了为什么人可以口头谈原则，却在利益冲突时立即放弃：原则从未真正位于中心。
  - 当收入、职位或关系变化时，我是否仍知道自己的价值？
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「第四代时间管理不等于授权一切」？
  answer: 有些监管、伦理和重大风险决策必须由负责人承担；关键是区分必须亲自判断与可以培养他人完成的部分。
  source_heading: 第四代时间管理不等于授权一切
- level: 概念辨析
  question: 原文如何解释「培训不等于详细指挥」？
  answer: 培训的目标是让对方理解结果和原则，最终能独立判断，而不是永久复制主管方法。
  source_heading: 培训不等于详细指挥
- level: 概念辨析
  question: 原文如何解释「原则中心不等于没有情感」？
  answer: 它不是冷冰冰的规则中心，而是用稳定原则让爱、家庭、工作和享乐获得更健康的位置。
  source_heading: 原则中心不等于没有情感
- level: 概念辨析
  question: 原文如何解释「三十八、常见误解辨析」？
  answer: 误解四：原则中心意味着配偶、家庭和工作都不再是中心，所以不重要。 恰恰相反，原则中心让它们摆脱工具化和依赖，获得更稳定、适当的位置。
  source_heading: 三十八、常见误解辨析
