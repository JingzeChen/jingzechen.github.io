overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 本章要回答的核心问题
  thesis: 五项原则比某个实现更持久。 可复现、统一 API、强 schema、内部扩展和数据持久性可用于评价自建或第三方方案。
  thesis_source: 核心结论
  concepts:
  - term: 本章要回答的核心问题
    meaning: 本章以数据系统设计、API 和代码实现为主，没有需要推导的机器学习目标函数。本文会把版本、快照、复杂度和一致性等工程逻辑形式化，以帮助理解作者的设计选择；这些补充表达用于解释原理，不应误认为是原章提出的新算法。
    source_heading: 本章要回答的核心问题
  - term: 2.1 理解数据集管理服务
    meaning: 样例服务只在 commit 粒度过滤，不支持逐样本谓词。这使实现和版本计算简单，但若一个 commit 内混有训练、验证和应排除样本，就无法精细选择。实际系统需要在摄取时合理划分
      commit，或增加样本级索引与查询能力。
    source_heading: 2.1 理解数据集管理服务
  - term: 2.2 漫游样例数据集管理服务
    meaning: 实现的关键不是 Java 语法，而是操作顺序与原子性。样例先完成摄取，再把 metadata 放入内存。生产系统若文件已保存而元数据写入失败，会产生孤儿对象；若元数据先提交而文件上传失败，会产生悬空引用。常见处理是
      staging 状态、事务型元数据、幂等请求 ID 和定期垃圾回收。
    source_heading: 2.2 漫游样例数据集管理服务
  - term: 核心结论
    meaning: Delta Lake 路线适合已有 Spark 的表型数据平台。 它提供 ACID、time travel 和 schema，Petastorm负责训练框架接入。
    source_heading: 核心结论
  - term: 从本章提炼出的通用解题方法
    meaning: 小数据和大数据使用相同外部协议；内部按需引入分片、并行、缓存、compaction 和分布式计算。用真实数据量压测，而不是用“对象存储无限”代替容量分析。
    source_heading: 从本章提炼出的通用解题方法
  - term: 复习与自测
    meaning: 对一个已有 Spark 的大团队和一个已有 Kubernetes 的小型图像团队，你会分别优先评估哪条路线？为什么？
    source_heading: 复习与自测
