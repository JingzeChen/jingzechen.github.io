  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 作者认为三种基础负面范式可能已经覆盖可被拿走的核心自由，但这是一种历史判断，不是绝对定律。
  thesis_source: 本章总结
