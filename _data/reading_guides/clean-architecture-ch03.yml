  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - '原书图示：Chapter 3 章首页第三章是 Part II「Starting with the Bricks: Programming Paradigms」的概览章。'
    - 作者把程序代码比作建筑的砖块：软件架构最终必须由具体代码实现，所以在讨论组件和边界之前，需要先理解几十年来程序员对代码本身学到了什么。
    - 这一观点与很多教程不同。教程常把范式解释成一组新语法或新技巧；作者却把范式看成纪律：它们告诉开发者哪些做法不应再随意使用。
    - 本章只是总览。后续 Chapter 4、5、6 会分别展开三种范式，因此这里应掌握它们的历史位置、核心约束和架构意义，而不必提前进入复杂证明或实现细节。
  - title: 1. Part II 背景：从语言革命到范式革命
    source_heading: 1. Part II 背景：从语言革命到范式革命
    paragraphs:
    - 即使架构师设计了清晰边界，如果代码可以随意跳转、任意调用具体实现、到处修改共享数据，边界仍会被破坏。
    - 这说明现代程序的基本材料很早就已经出现。后来发生的重大变化，主要是让这些材料更容易表达、更安全地组合。
    - 新语言不断出现，但新语言不一定代表新范式。一种语言可以支持多种范式，多种语言也可以实现同一种范式。
    - 本章后面会说明：作者认为已经没有多少同等基础的自由可以继续拿走，因此未来不太可能再出现第四种同类型的「负面范式」。这是作者基于历史和程序结构作出的判断，不是已经证明的自然定律。
  - title: 3. Structured Programming
    source_heading: 3. Structured Programming
    paragraphs:
    - 作者把它与 Edsger Wybe Dijkstra 在 1968 年的工作联系起来。Dijkstra 指出，不受约束的跳转会破坏程序结构。
    - Structured programming imposes discipline on direct transfer of control.
    - 结构化编程为模块内部的算法提供基础。架构把系统拆成组件和模块后，每个模块仍需要由可理解、可测试的函数构成。
    - Chapter 4 会进一步解释结构化编程为何支持功能分解和可证伪测试，本章只需记住它约束的是直接控制流。
  - title: 4. Object-Oriented Programming
    source_heading: 4. Object-Oriented Programming
    paragraphs:
    - 面向对象编程在 1966 年由 Ole Johan Dahl 与 Kristen Nygaard 的工作推动，比结构化编程的广泛发现还早两年。
    - 他们在 ALGOL 中观察到：如果把函数调用的栈帧移到堆上，函数返回后，其中的局部变量仍可以继续存在。
    - Object-oriented programming imposes discipline on indirect transfer of control.
    - 面向对象语言通过接口、虚函数、类型检查和对象生命周期管理，使间接调用成为更安全、更常规的机制。
  - title: 6.2 为什么拿走能力不会让程序无法表达
    source_heading: 6.2 为什么拿走能力不会让程序无法表达
    paragraphs:
    - 不手工散布函数指针，仍可通过受类型约束的多态间接调用；
    - 不任意修改共享状态，仍可通过返回新值或受控事务表达变化。
  - title: 6.4 三种范式拿走了什么
    source_heading: 6.4 三种范式拿走了什么
    paragraphs:
    - 面向对象编程拿走直接操纵函数指针的自由；
    - 面向对象程序内部仍可能使用函数指针；
    - 实用函数式语言常允许受控可变状态。
  - title: 作者的分析方法
    source_heading: 作者的分析方法
    paragraphs:
    - 语言不断增加表达工具，范式却通过限制基本操作来控制复杂性。这个区分避免把学习新语法误认为理解新设计思想。
    - 函数式思想最早出现，却最晚被广泛采用；面向对象比结构化更早被发现，却较晚进入主流。技术价值不会自动决定普及时间，还受硬件、语言和行业需求影响。
    - 作者使用「对某种操作施加纪律」的统一表达，让读者看到它们的共同本质，而不是只记三个互不相干的定义。
    - 本章不是为历史而历史。结论明确把三种范式连接到 Function、Component Separation 和 Data Management，为后续架构章节铺路。
  - title: 检查间接控制流
    source_heading: 检查间接控制流
    paragraphs:
    - 高层模块是否直接依赖具体技术实现？
    - 运行时需要替换的实现是否有稳定接口？
    - 接口是否由需要保护的高层一侧拥有？
    - 是否滥用继承，而组合或端口更合适？
  - title: 检查范式使用方式
    source_heading: 检查范式使用方式
    paragraphs:
    - 是否因为语言支持某特性就机械使用？
    - 是否把范式当成阵营，而没有组合使用？
    - 是否能说明这项纪律如何改善理解、测试或依赖？
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 结构化编程由 Dijkstra 在 1968 年推动广泛采用，主要反对不受限制的直接跳转。
    - 面向对象编程与 Dahl 和 Nygaard 1966 年的工作相关，其历史直觉来自让函数状态拥有更长生命周期。
    - 函数式编程思想源于 Church 1936 年的 Lambda Calculus，并影响了 1958 年出现的 LISP。
    - 面向对象编程主要支持 Separation of Components，即通过多态跨边界并反转依赖。
  takeaways:
  - 软件架构最终由代码实现，因此讨论架构要从编程范式这些基础砖块开始。
  - 受控控制流使程序更容易局部理解、功能分解和测试。
  - 函数式编程思想源于 Church 1936 年的 Lambda Calculus，并影响了 1958 年出现的 LISP。
  - 纪律不一定由语言强制，也可以由类型、模块、评审、静态分析和测试建立。
  - 后续架构原则会把同一种限制思想，从函数和语言结构提升到模块、组件与系统边界。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「2. 新范式让程序能够完成以前做不到的计算」？
  answer: 作者的观点相反：基础范式主要拿走危险自由，使相同计算能力更容易被人控制。
  source_heading: 2. 新范式让程序能够完成以前做不到的计算
- level: 概念辨析
  question: 原文如何解释「4. 面向对象的核心是把现实事物建成类」？
  answer: 本书的架构重点是多态对间接控制转移和源码依赖的控制，而不是现实世界建模本身。
  source_heading: 4. 面向对象的核心是把现实事物建成类
- level: 概念辨析
  question: 原文如何解释「6. 函数式编程完全不能有状态」？
  answer: 真实系统必然有状态。函数式纪律强调减少和隔离可变状态，使变化显式、受控。
  source_heading: 6. 函数式编程完全不能有状态
- level: 概念辨析
  question: 原文如何解释「7. 不可变数据一定性能差」？
  answer: 不可变可能增加复制，也可能带来结构共享、缓存和并发优势。性能应测量，不能用直觉否定状态纪律。
  source_heading: 7. 不可变数据一定性能差
- level: 概念辨析
  question: 原文如何解释「10. 纪律会限制开发效率」？
  answer: 无约束自由通常把复杂性转嫁给理解、调试和测试。适当纪律减少可能性，反而提高团队协作效率。
  source_heading: 10. 纪律会限制开发效率
