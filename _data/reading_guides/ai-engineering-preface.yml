  question: 原文围绕「0. 学习目标与主线」建立了怎样的核心认识？
  question_source: 0. 学习目标与主线
  thesis: 此外，作者列出了一长串在交流中给过她想法的人（Andrew Francis、Charles Frye、Hamel Husain、Jeremy Howard、Maxime
    Labonne、Nathan Lambert、Omar Khattab、Sebastian Raschka、Soumith Chintala、Tim Dettmers、Victor
    Sanh 等数十人），并坦承「人的记忆必然有疏漏，如果漏了你的名字请提醒我」。
  thesis_source: 8. 致谢中的方法论：用多视角评审覆盖盲区
  concepts:
  - term: 0. 学习目标与主线
    meaning: 主线可以压缩为：模型能力跨过阈值 → 大量场景同时可行 → 更多开发者可以参与 → demo 激增 → 评估、可靠性、成本与安全成为新的工程瓶颈。前言先解释这条变化，再界定本书的任务、读者和路线，最后通过写作与评审过程展示一种以假设验证和多视角反馈为核心的方法。
    source_heading: 0. 学习目标与主线
  - term: 2. 本书的定位：用基础模型构建应用
    meaning: 第 6 个问题尤其值得注意：书中把「什么是 agent」与「如何构建和评估 agent」并列，说明其定义和工程范式都还没有完全稳定。RAG
      已被较充分理解并在生产中得到验证；agentic 模式潜力更大，但复杂度更高，仍处在探索期。使用时应把成熟度也纳入方案选择，而不能只比较能力上限。
    source_heading: 2. 本书的定位：用基础模型构建应用
  - term: 4. 目标读者：从 demo 走向生产
    meaning: 部分内容会深入技术细节，但正文会提前提示。读者可以按职责和已有知识跳过局部技术细节，不影响主线；第 7 章的模型内存计算就是典型的技术深水区。
    source_heading: 4. 目标读者：从 demo 走向生产
  - term: 5. 章节路线：沿 AI 应用开发流程推进
    meaning: 第 1 章｜要不要做在决定动手之前，需要先理解这个过程涉及什么，并回答：这个应用有必要吗？需要用 AI 吗？必须自己造吗？第 1 章帮你回答这些，并覆盖一系列成功用例，让你对基础模型能做什么有个体感。
    source_heading: 5. 章节路线：沿 AI 应用开发流程推进
  - term: 7. 配套资源、许可与更新渠道
    meaning: 署名「感谢但通常不强制」，推荐格式为：“AI Engineering by Chip Huyen (O’Reilly). Copyright
      2025 Developer Experience Advisory LLC, 978-1-098-16630-4.” 超出合理使用范围请联系 permissions@oreilly.com。
    source_heading: 7. 配套资源、许可与更新渠道
  - term: 9. 学习检查：把前言转成项目决策
    meaning: 能够具体回答这些问题，才算从“会调用模型”进入 AI Engineering。下一章将进一步展开用例地图、应用规划方法，以及 AI 工程栈与传统
      ML 工程、全栈工程的区别。
    source_heading: 9. 学习检查：把前言转成项目决策
