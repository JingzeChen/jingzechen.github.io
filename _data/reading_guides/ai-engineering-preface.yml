  sections:
  - title: 0. 学习目标与主线
    source_heading: 0. 学习目标与主线
    paragraphs:
    - ChatGPT 为什么没有只带来线性的能力提升，而是触发了应用数量的非线性增长？
    - 开发门槛下降之后，为什么仍然需要一门独立的 AI Engineering？
    - 主线可以压缩为：模型能力跨过阈值 → 大量场景同时可行 → 更多开发者可以参与 → demo 激增 → 评估、可靠性、成本与安全成为新的工程瓶颈。前言先解释这条变化，再界定本书的任务、读者和路线，最后通过写作与评审过程展示一种以假设验证和多视角反馈为核心的方法。
    - 文中的数学模型用于量化直觉：阈值模型和后续 ML 推导是教学化建模，Lindy 部分采用标准的 Pareto 数学化，都不应被误认为作者逐式给出的结论。代码环境为
      Python 3.11 + NumPy；保留的代码均已实际运行，输出也来自真实运行。
  - title: 1. 从 ChatGPT 冲击到 AI Engineering 的问题意识
    source_heading: 1. 从 ChatGPT 冲击到 AI Engineering 的问题意识
    paragraphs:
    - ChatGPT 发布时，Chip Huyen 和许多同行一样感到迷茫。但让她意外的并不是模型规模或能力本身。这个区分很重要：AI 社区早已知道，更大的数据、更强的算力和更大的模型通常会带来更好的结果；若变化仅仅是模型继续变强，那么已有的机器学习叙事已经足以解释它。
    - 真正需要解释的是技术能力如何传导到应用侧。此前容易采用一种线性直觉：指标提高一点，可做的应用也增加一点；ChatGPT 之后出现的却是应用可能性的爆发。AI
      Engineering 的问题意识由此产生：当通用模型已经可用，核心工作不再只是继续训练更强的模型，还包括识别场景、适配模型，并把原型变成可靠系统。
    - AlexNet 在 2012 年的 ImageNet 竞赛中把 top-5 错误率从约 26% 降到约 16%，其成功同时依赖约 120 万张标注图像、两块
      GTX 580 GPU 和约 6000 万参数。论文作者当时已经判断，等待更快的 GPU 和更大的数据集，就可能继续改善结果。十年后的基础模型规模化，延续的正是这条经验规律。
    - RAG（Retrieval-Augmented Generation，检索增强生成）这一名称因 2020 年 Lewis 等人的论文而流行，但其中的检索来自搜索和推荐系统积累了几十年的方法：倒排索引、TF-IDF、BM25
      和向量近邻检索。RAG 的召回、排序和索引更新问题，因此应当首先借鉴信息检索领域，而不是重新发明。
  - title: 2. 本书的定位：用基础模型构建应用
    source_heading: 2. 本书的定位：用基础模型构建应用
    paragraphs:
    - 第 6 个问题尤其值得注意：书中把「什么是 agent」与「如何构建和评估 agent」并列，说明其定义和工程范式都还没有完全稳定。RAG 已被较充分理解并在生产中得到验证；agentic
      模式潜力更大，但复杂度更高，仍处在探索期。使用时应把成熟度也纳入方案选择，而不能只比较能力上限。
    - 本书的论证建立在三层证据上：作者亲历的案例、大量参考文献，以及不同背景专家的广泛评审。写作历时两年，经验基础则来自过去十年对语言模型和 ML 系统的实践。阅读时可以据此区分证据类型：案例提供情境，文献提供可追溯依据，多视角评审用于发现单一经验的盲点。
    - 因此，AIE 是增量而不是替代。如果系统包含排序、风控或推荐模型，DMLS 仍然重要。可以用一个问题选择阅读重点：核心难点是训练和运营任务模型，还是适配已有基础模型？前者偏向
      DMLS，后者偏向 AIE；混合系统则需要两套知识。
    - 第二条判据是咨询广泛的研究者与工程师网络，了解他们认为最重要的问题和方案。这与前面的 100 多次访谈呼应：个人很难准确判断技术寿命，跨组织、跨角色的外部意见能暴露盲点。不过，专家意见仍可能受到共同范式和选择偏差影响，因此它是校正机制，不是多数表决。
  - title: 3. 本书边界与阅读前置知识
    source_heading: 3. 本书边界与阅读前置知识
    paragraphs:
    - 书中会提到具体工具，也会用伪代码说明概念，但不会逐步教授某个工具。它提供的是选择工具的框架：比较方案权衡，并列出评估方案时应该追问的问题。具体操作通常可以从在线教程或
      AI 助手中快速获得。
    - 基础模型先计算下一个 token 的概率分布，再根据解码策略选择结果。这直接影响输出复现性、幻觉表现，以及能否通过采样参数低成本改变行为。第 2 章对
      AI 概率本质的讨论就建立在这三个概念上。
    - 要解决什么问题？ 监督学习需要人工标注，而标注是整个 ML 流程里最贵、最慢、最难扩展的一环。自监督就是为了绕开这个瓶颈而生的——它让数据自己给自己当标签。理解这一点，才能理解「为什么基础模型能用互联网规模的数据训练出来」。
    - 易混淆点：自监督不是无监督（unsupervised）。无监督学习没有标签，通常优化聚类或密度目标；自监督有明确的标签和监督信号，只是标签自动来自数据。它在训练机制上属于监督学习，在数据获取上免去人工标注。
  - title: 4. 目标读者：从 demo 走向生产
    source_heading: 4. 目标读者：从 demo 走向生产
    paragraphs:
    - 工具开发者：想找出 AI 工程里「服务不足的领域」，为产品在生态中定位。
    - 求职者：想搞清楚做 AI 工程师需要哪些技能。
    - 任何人：想更好地理解 AI 的能力与局限，以及它会如何影响不同岗位。
    - 部分内容会深入技术细节，但正文会提前提示。读者可以按职责和已有知识跳过局部推导，不影响主线；第 7 章的模型内存计算就是典型的技术深水区。
  - title: 5. 章节路线：沿 AI 应用开发流程推进
    source_heading: 5. 章节路线：沿 AI 应用开发流程推进
    paragraphs:
    - 第 1 章｜要不要做在决定动手之前，需要先理解这个过程涉及什么，并回答：这个应用有必要吗？需要用 AI 吗？必须自己造吗？第 1 章帮你回答这些，并覆盖一系列成功用例，让你对基础模型能做什么有个体感。
    - 构建应用不要求先成为 ML 专家，但理解基础模型内部如何工作，能帮助开发者更有效地使用它。第 2 章分析训练数据配方、模型架构与规模、对齐训练，以及模型如何生成响应。这些机制解释了输出不一致和幻觉。
    - 一个直接用法是：遇到质量问题时，先检查温度、top-p 等生成设置。它们调整成本低，有时能显著改善表现，符合 start-simple 原则；其机制见
      3.3.1 节。
    - 这个分解把「效果不好」变成可定位的问题：要求是否说清，必要信息是否可见，模型是否具备所需能力？三类问题的解法、成本和风险不同。若把上下文缺失误判为模型能力不足，就可能花费大量资源微调，而一个检索步骤已经足够。
  - title: 6. 排版约定：提示词也是工程资产
    source_heading: 6. 排版约定：提示词也是工程资产
    paragraphs:
    - 排版约定本身不是知识重点，但有一个与 AI 工程直接相关的信号：输入模型的提示词与变量、函数等程序元素一样使用等宽字体。
    - 此外，书中用不同提示框区分建议、一般注释和警告。把提示词纳入程序元素，意味着它不应只是聊天窗口中的临时文本，而应像代码一样被版本化、评审、测试和监控。
  - title: 7. 配套资源、许可与更新渠道
    source_heading: 7. 配套资源、许可与更新渠道
    paragraphs:
    - 对写书过程感兴趣的人：幕后信息与本书的统计数据。
    - 仓库承担持续更新的部分：遇到正文点到为止的主题，可先在那里查论文、工具和扩展材料。
    - 署名「感谢但通常不强制」，推荐格式为：“AI Engineering by Chip Huyen (O’Reilly). Copyright 2025
      Developer Experience Advisory LLC, 978-1-098-16630-4.” 超出合理使用范围请联系 permissions@oreilly.com。
    - 由于首印时间是 2024 年 12 月，遇到可能已变化的数字、工具名或实现细节时，应先查更新页。
  - title: 8. 致谢中的方法论：用多视角评审覆盖盲区
    source_heading: 8. 致谢中的方法论：用多视角评审覆盖盲区
    paragraphs:
    - 此外，作者列出了一长串在交流中给过她想法的人（Andrew Francis、Charles Frye、Hamel Husain、Jeremy Howard、Maxime
      Labonne、Nathan Lambert、Omar Khattab、Sebastian Raschka、Soumith Chintala、Tim Dettmers、Victor
      Sanh 等数十人），并坦承「人的记忆必然有疏漏，如果漏了你的名字请提醒我」。
    - O’Reilly 团队：开发编辑 Melissa Potter、Corbin Collins、Jill Leonard；制作编辑 Elizabeth Kelly；文字编辑
      Liz Wheeler（作者称其为「我合作过的最挑剔的文字编辑」）；Nicole Butterfield 从想法到成品全程督办。
    - 作者把本书视为职业生涯经验的积累，也强调每一位合作者都教会了她如何把 ML 带入现实世界。更可迁移的做法是构造视角多样化的评审矩阵：技术深度 × 高管决策
      × 软件工程 × 产品 × 学习者 × 社区脉搏。
    - 这与设计评估集遵循同一原则：同质评审者容易一致漏掉某类问题，多样化评审者才能覆盖不同失效模式。对 AI 应用而言，技术正确性、业务价值、可用性、安全和学习成本也需要由不同角色共同检查。
  - title: 9. 学习检查：把前言转成项目决策
    source_heading: 9. 学习检查：把前言转成项目决策
    paragraphs:
    - 系统分工：哪些部分适合传统 ML，哪些部分需要基础模型？应借助 DMLS、AIE，还是两套方法共同设计？
    - 成熟度选择：RAG 是否已经足够？引入 agent 后新增的步骤、权限、错误传播和评估成本是否值得？
    - 长期价值：这个难题源于机制还是暂时的模型缺陷？专家意见和技术年龄提供了什么证据？评审者是否覆盖技术、产品、业务与用户视角？
    - 能够具体回答这些问题，才算从“会调用模型”进入 AI Engineering。下一章将进一步展开用例地图、应用规划方法，以及 AI 工程栈与传统 ML
      工程、全栈工程的区别。
