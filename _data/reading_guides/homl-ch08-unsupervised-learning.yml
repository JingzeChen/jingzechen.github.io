overview:
  kind: summary
  minutes: 8
  question: 本章要回答什么问题？
  question_source: 本章要回答什么问题
  thesis: 一次参考输出为 75，但 k 对版本、PCA 和随机性敏感；应结合 silhouette 图、簇内人脸、inertia 与业务目标判断，不能机械相信一个数字。
  thesis_source: 20. 章末练习与参考答案
  concepts:
  - term: 本章要回答什么问题
    meaning: 现实世界中，未标注数据远多于已标注数据。制造业可以每天自动拍摄数千张产品照片，但让专家逐张标记“合格/缺陷”非常昂贵；产品变化后还可能重新标注。
    source_heading: 本章要回答什么问题
  - term: 3.5 为什么算法单调收敛
    meaning: Assignment 步固定质心，选择最优标签，J 不增；
    source_heading: 3.5 为什么算法单调收敛
  - term: 10.2 其他查询策略
    meaning: 多样性批量采样，避免一次选到大量近重复样本。
    source_heading: 10.2 其他查询策略
  - term: 11. DBSCAN
    meaning: 全称：Density-Based Spatial Clustering of Applications with Noise。
    source_heading: 11. DBSCAN
  - term: 16. GMM 用于异常检测
    meaning: GMM 会努力拟合全部数据，异常过多会形成额外成分或拉宽协方差，使异常看起来正常。
    source_heading: 16. GMM 用于异常检测
  - term: 工程能力
    meaning: 能扫描 BIC/AIC 或使用 Bayesian GMM
    source_heading: 工程能力
  logic:
  - 本章要回答什么问题
