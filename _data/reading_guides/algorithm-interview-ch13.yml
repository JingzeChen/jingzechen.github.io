  - 本章要解决什么问题
  - 13.1 树状数组概述
  - 13.2 树状数组应用的算法设计
  - 13.3 离散化在树状数组中的应用
  - 本章总结
  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 树状数组可以看作“按二进制长度分组的前缀摘要”。它没有显式左右孩子，却通过下标最低位的 1 决定每个结点覆盖多长区间，以及查询和修改应跳到哪里。
    - Python 与 Go 的完整实现只放在章末附录 A、B，正文以 C++17 为主。
  - title: 13.1 树状数组概述
    source_heading: 13.1 树状数组概述
    paragraphs:
    - 取反后，原最低位 1 变成 0，右侧 t 个 0 变成 1；再加 1 时，这 t 个低位 1 全部进位成 0，原最低位位置变成 1。
    - 前缀查询每次清除一个二进制 1，步数不超过二进制位数。单点修改每次跳到更大的负责区间，最多沿隐式树上升到超过 n。二者步数均不超过
    - 但 BIT 的结构围绕前缀聚合及其逆运算设计。区间和可由两个前缀相减，而普通区间最小值不能由“两个前缀最小值相减”得到，所以原书指出 BIT 无法像线段树那样直接处理一般动态区间最值。
    - 补充：边界说明。 在更新只增不减等受限条件下，可以设计“前缀最大值 BIT”，但它不具备一般可逆区间查询能力，不能据此把普通 BIT 当作通用最值结构。
  - title: 13.2 树状数组应用的算法设计
    source_heading: 13.2 树状数组应用的算法设计
    paragraphs:
    - 表示位置不大于 p 的有效元素数，其中包含 v 自身。因此 v 前面的元素数，也就是题目要求的零基下标，为
    - BIT 中值为 1 的位置从左到右顺序始终等于当前排列顺序。前缀频次减 1 正好给出当前元素左侧有效位置数；删除旧位置并占用更小的新位置，恰好模拟移到最前。该不变量从初始化开始，每轮保持成立。
    - 按本章已定义的包含端点前缀和，这两式分别错移了一个端点；尤其右式会把已打开的 p 计入差值而无法为 0。
    - 新形成的合法灯泡对必须包含当天刚打开的 x；若两个端点都在更早打开，它们会在第二个端点打开当天被发现。
  - title: 13.3 离散化在树状数组中的应用
    source_heading: 13.3 离散化在树状数组中的应用
    paragraphs:
    - 离散化保持大小关系，BIT 前缀差准确统计查询闭区间中的历史前缀频次；前缀方程又与目标子数组一一对应，故算法正确。
    - 与第 12 章离散化线段树版本相比，状态和扫描顺序完全相同；BIT 用两个前缀查询代替线段树区间查询，代码和常数更小。
    - 第 12 章使用离散化线段树解决同题；也可在归并排序合并阶段统计右侧较小元素。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 查询把前缀拆成互不重叠的二进制块，更新触达所有包含单点的祖先块。公开 0 基接口只负责在边界加 1，不改变这个内部不变量。
    - 按实际位置维护动态和：HDU 1166；
    - 按值统计频次：1649、327、315；
    - 叶子的语义会变化，但操作始终归结为“单点频次或权值变化 + 前缀累计”。迁移新题时依次检查：查询能否写成前缀差、修改能否写成单点增量、是否需要差分、外部坐标是否要压缩，以及严格/非严格边界落在哪个排名。若聚合不可逆或更新包含复杂覆盖，普通
      BIT 就不是合适结构。
  takeaways:
  - 查询把前缀拆成互不重叠的二进制块，更新触达所有包含单点的祖先块。公开 0 基接口只负责在边界加 1，不改变这个内部不变量。
  - 按实际位置维护动态和：HDU 1166；
  - 按实际位置统计开关状态：683；
  - 按展开位置维护动态矩阵和：308。
  - 叶子的语义会变化，但操作始终归结为“单点频次或权值变化 + 前缀累计”。迁移新题时依次检查：查询能否写成前缀差、修改能否写成单点增量、是否需要差分、外部坐标是否要压缩，以及严格/非严格边界落在哪个排名。若聚合不可逆或更新包含复杂覆盖，普通
    BIT 就不是合适结构。
