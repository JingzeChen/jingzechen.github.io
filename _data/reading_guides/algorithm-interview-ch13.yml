overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 叶子的语义会变化，但操作始终归结为“单点频次或权值变化 + 前缀累计”。迁移新题时依次检查：查询能否写成前缀差、修改能否写成单点增量、是否需要差分、外部坐标是否要压缩，以及严格/非严格边界落在哪个排名。若聚合不可逆或更新包含复杂覆盖，普通
    BIT 就不是合适结构。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 树状数组可以看作“按二进制长度分组的前缀摘要”。它没有显式左右孩子，却通过下标最低位的 1 决定每个结点覆盖多长区间，以及查询和修改应跳到哪里。
    source_heading: 本章要解决什么问题
  - term: 13.1 树状数组概述
    meaning: 但 BIT 的结构围绕前缀聚合及其逆运算设计。区间和可由两个前缀相减，而普通区间最小值不能由“两个前缀最小值相减”得到，所以原书指出 BIT
      无法像线段树那样直接处理一般动态区间最值。
    source_heading: 13.1 树状数组概述
  - term: 13.2 树状数组应用的算法设计
    meaning: BIT 中值为 1 的位置从左到右顺序始终等于当前排列顺序。前缀频次减 1 正好给出当前元素左侧有效位置数；删除旧位置并占用更小的新位置，恰好模拟移到最前。该不变量从初始化开始，每轮保持成立。
    source_heading: 13.2 树状数组应用的算法设计
  - term: 13.3 离散化在树状数组中的应用
    meaning: 与第 12 章离散化线段树版本相比，状态和扫描顺序完全相同；BIT 用两个前缀查询代替线段树区间查询，代码和常数更小。
    source_heading: 13.3 离散化在树状数组中的应用
  - term: 本章总结
    meaning: 叶子的语义会变化，但操作始终归结为“单点频次或权值变化 + 前缀累计”。迁移新题时依次检查：查询能否写成前缀差、修改能否写成单点增量、是否需要差分、外部坐标是否要压缩，以及严格/非严格边界落在哪个排名。若聚合不可逆或更新包含复杂覆盖，普通
      BIT 就不是合适结构。
    source_heading: 本章总结
