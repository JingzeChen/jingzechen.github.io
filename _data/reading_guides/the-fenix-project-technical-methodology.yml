overview:
  kind: summary
  minutes: 10
  question: 1. 本章在回答什么问题？
  question_source: 1. 本章在回答什么问题
  thesis: 康威定律说明高频沟通边界最终会映射为系统边界，组织与架构必须协同调整。
  thesis_source: 9. 本章知识结构总结
  concepts:
  - term: 1. 本章在回答什么问题
    meaning: Fred Brooks 的“没有银弹”原命题更具体：在十年尺度内，不会有单一技术或管理方法普遍让软件生产率、可靠性或简单性获得数量级提升；原因是工具可以削减
      Accident Complexity，却不能消灭问题域的 Essential Complexity。它不否认某项技术在特定场景获得十倍收益，也不否认多项创新累积改变行业。对微服务而言，结论是它只能改变复杂度的结构，不能消灭业务本质复杂性。
    source_heading: 1. 本章在回答什么问题
  - term: 3. 前提：微服务需要的条件
    meaning: Conway’s Law 指系统结构倾向于映射组织的沟通结构。它不是说架构只能被组织被动决定，也不保证失配最终自动收敛；服务与团队边界冲突时，组织完全可能长期承受高昂协调成本。Inverse
      Conway Maneuver 只是主动诱导期望结构，还必须配合端到端权限、所有权、架构约束和结果反馈。
    source_heading: 3. 前提：微服务需要的条件
  - term: 5. 治理：理解系统复杂性
    meaning: Collaboration Cost 来自沟通、排队、决策、交接和冲突。团队规模、依赖数量、接口稳定性和时区都会影响它。代码行数和服务数只能作为弱代理，不能直接代表复杂性。
    source_heading: 5. 治理：理解系统复杂性
  - term: 6. 四部分如何形成一套方法
    meaning: 指标改善后扩大流量，最终退役旧实现；若跨服务事务和协调成本反而上升，则调整边界或回退。
    source_heading: 6. 四部分如何形成一套方法
  - term: 8.5 第五步：渐进迁移
    meaning: 不同时拆代码、换数据库、换语言和换平台。
    source_heading: 8.5 第五步：渐进迁移
  - term: 10. 主动回忆题
    meaning: Rapid Provisioning、Basic Monitoring、Rapid Deployment 分别是什么？
    source_heading: 10. 主动回忆题
