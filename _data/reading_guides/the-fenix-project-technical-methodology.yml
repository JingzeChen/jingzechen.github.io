  - 1. 本章在回答什么问题
  - 3. 前提：微服务需要的条件
  - 4. 边界：微服务的粒度
  - 6. 四部分如何形成一套方法
  - 8.1 第一步：建立基线
  - 9. 本章知识结构总结
  - 10. 主动回忆题
  sections:
  - title: 1. 本章在回答什么问题
    source_heading: 1. 本章在回答什么问题
    paragraphs:
    - 作者把“目的、前提、边界、治理”按这个顺序组织并非偶然：没有目的，技术变革无法评价；没有前提，收益无法落地；边界不正确，微服务只会增加远程耦合；没有治理，短期正确的拆分也会随需求变化腐化。
    - Fred Brooks 的“没有银弹”原命题更具体：在十年尺度内，不会有单一技术或管理方法普遍让软件生产率、可靠性或简单性获得数量级提升；原因是工具可以削减
      Accident Complexity，却不能消灭问题域的 Essential Complexity。它不否认某项技术在特定场景获得十倍收益，也不否认多项创新累积改变行业。对微服务而言，结论是它只能改变复杂度的结构，不能消灭业务本质复杂性。
    - 若能把所有收益和成本统一折算为货币，才可以再计算真正的 Net Present Value。
    - Lead Time、可靠性比例、迁移费用和认知负荷量纲不同，不能不加权地相加后用正负号作数学判断。合理做法是同时检查多项可验证指标、硬约束和时间尺度，记录明确权重与取舍，不能只写“架构更先进”。
  - title: 2. 向微服务迈进
    source_heading: 2. 向微服务迈进
    paragraphs:
    - "“向微服务迈进”首先是一份避坑指南。微服务可以帮助大型系统进行物理拆分，却会立刻引入网络、数据和平台复杂度，因此问题不是“微服务好不好”，而是“当前约束下，它是否比其他方案更合适”。"
    - "“可能”不等于自动获得。若所有服务必须一起构建、共享数据库表、同步发布并由同一大团队维护，系统只是增加了网络边界，并没有得到自治收益，这种形态常被称为
      Distributed Monolith。"
    - 不过，引入异构服务不等于整个系统必须全面微服务化。可以先把确有异构需求的边界做成独立服务，其他部分继续保留模块化单体。技术自由也要计算招聘、补丁、安全和运行时治理成本。
    - 招标、客户部署隔离、数据驻留、监管审计和供应商边界可能直接要求分布式部署。它们是合法约束，但应把“满足合同”与“改善技术”分开记账，避免事后用技术收益包装商业妥协。
  - title: 3. 前提：微服务需要的条件
    source_heading: 3. 前提：微服务需要的条件
    paragraphs:
    - Conway’s Law 指系统结构倾向于映射组织的沟通结构。它不是说架构只能被组织被动决定，也不保证失配最终自动收敛；服务与团队边界冲突时，组织完全可能长期承受高昂协调成本。Inverse
      Conway Maneuver 只是主动诱导期望结构，还必须配合端到端权限、所有权、架构约束和结果反馈。
    - 原书预测复杂基础设施会让普通开发者更容易生产服务，同时提高少数专家门槛。这是作者的行业判断，不是康威定律的必然推论。更健康的目标不是把开发者分成“精英和螺丝钉”，而是让平台降低偶然复杂性，同时确保团队仍理解其服务的业务、运行和失败模式。
    - 如果发布一个服务仍需人工修改多台机器，系统拆得越细，运维成本越接近服务数量的线性甚至超线性增长。这里列的是面向生产规模化的目标基线，并非“先尝试两个服务之前必须一次全部建成”的准入清单；团队可以从少量服务和部分人工流程学习，但必须确保复杂度增长前持续补齐自动化、追踪、SLO
      与恢复演练。
    - "“先单体、后拆分”也不应被解释为第一次设计错误。如果先前架构在当时以最低成本满足需求，它就是正确的阶段性决策。架构质量应按生命周期价值评价，而不是按是否一次预测终局评价。"
  - title: 4. 边界：微服务的粒度
    source_heading: 4. 边界：微服务的粒度
    paragraphs:
    - DDD 是识别业务边界的主要方法，原文列举了 Bounded Context、Context Map、Ubiquitous Language、Domain
      / Subdomain、Aggregate 和 Domain Event。
    - 它们与微服务并非机械一一对应：Bounded Context 是模型与语言的边界，一个上下文可以部署为一个或多个服务；Aggregate 是事务一致性边界和候选拆分线索，不天然等于服务；Context
      Map 描述上下文之间的上下游、Shared Kernel、Customer-Supplier、Anti-Corruption Layer 等关系，帮助设计服务契约。原书没有展开
      DDD，而是从性能、一致性、可用性和团队协作推导服务粒度上下界。
    - 原书说“每个微服务都有独立数据源”，更准确的工程原则是 Database per Service 的逻辑所有权：只有一个服务拥有某数据的写入模型，物理上可共享数据库实例，但不能绕过服务契约直接修改对方表。
    - 不能从“需要 JOIN”直接推出必须合并。查询可以用 API Composition、CQRS Read Model 或事件复制解决；真正的合并信号是强一致写不变量和共同生命周期。
  - title: 5. 治理：理解系统复杂性
    source_heading: 5. 治理：理解系统复杂性
    paragraphs:
    - Collaboration Cost 来自沟通、排队、决策、交接和冲突。团队规模、依赖数量、接口稳定性和时区都会影响它。代码行数和服务数只能作为弱代理，不能直接代表复杂性。
    - 静态规则可以维持当前秩序，却无法让架构永远不变。新需求、人员流动、依赖升级和临时妥协会持续制造 Architectural Decay。
    - 原书用“换房子”而非“不断给旧房添砖”解释 Evolutionary Design。不同阶段的架构服务于不同规模和需求；后一代可以继承业务知识，却不必继承所有实现。
    - 只要系统持续变化，架构腐化风险就无法永久归零；腐化特指实现偏离预期结构或质量属性，不等于所有正常演进。适应度函数、重构、替换和退役能够预防或修复部分偏离。
  - title: 6. 四部分如何形成一套方法
    source_heading: 6. 四部分如何形成一套方法
    paragraphs:
    - 支付与订单之间用明确命令和事件划界，支付账本由支付服务单写；
    - 监控成功率、P99、对账差异、发布 Lead Time 和故障恢复；
    - 指标改善后扩大流量，最终退役旧实现；若跨服务事务和协调成本反而上升，则调整边界或回退。
    - 这比先创建几十个仓库、选好 Kubernetes 组件再寻找拆分对象，更符合本章的方法论顺序。
  - title: 8.1 第一步：建立基线
    source_heading: 8.1 第一步：建立基线
    paragraphs:
    - 需求 Lead Time 与等待分布；
    - 当前平台和 On-call 成本。
  - title: 8.5 第五步：渐进迁移
    source_heading: 8.5 第五步：渐进迁移
    paragraphs:
    - 一个变化快、边界清楚、风险可控的能力；
    - 数据先建立明确所有者，再逐步迁移；
    - 不同时拆代码、换数据库、换语言和换平台。
  - title: 9. 本章知识结构总结
    source_heading: 9. 本章知识结构总结
    paragraphs:
    - 服务粒度下界是独立、内聚和完备，上界是团队可掌握并在交付周期内演进的范围。
    - 微服务在小规模下认知固定成本高，只有合理分治降低大规模协作成本时才产生优势。
    - 演进式架构应优先采用可逆的小步变化；不可逆变化要支持兼容迁移、Roll-forward 或补偿。服务方向并非单向变小，它也可以合并或报废。
    - 最重要的不是“怎样把系统拆成微服务”，而是始终能回答：这次边界变化减少了哪一种已测量的复杂性，又增加了谁需要承担的什么成本？
  - title: 10. 主动回忆题
    source_heading: 10. 主动回忆题
    paragraphs:
    - Strangler Fig Pattern 如何降低整体重写风险？
    - Rapid Provisioning、Basic Monitoring、Rapid Deployment 分别是什么？
    - DDD 的 Bounded Context 对服务边界有什么帮助？
    - Intrinsic、Extraneous、Germane Cognitive Load 如何区分？
  takeaways:
  - 微服务没有银弹效应，它重新分配复杂度，不消灭业务复杂度。
  - 采用微服务前应具备组织对齐、专家能力、自动化观测和真实复杂性拐点。
  - 服务粒度下界是独立、内聚和完备，上界是团队可掌握并在交付周期内演进的范围。
  - 静态治理维持当前质量，发展的治理通过适应度、替换、合并和退役应对持续变化。
  - 最重要的不是“怎样把系统拆成微服务”，而是始终能回答：这次边界变化减少了哪一种已测量的复杂性，又增加了谁需要承担的什么成本？
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 微服务不等于性能架构」？
  answer: 服务化先增加网络成本，只有独立扩容、并行处理或消除瓶颈才能带来性能收益。
  source_heading: 7.1 微服务不等于性能架构
- level: 概念辨析
  question: 原文如何解释「7.6 Kubernetes 不是采用微服务的前提」？
  answer: 微服务可运行在 VM、容器或 Serverless；Kubernetes 只是常见平台。反过来，模块化单体也可以部署到 Kubernetes。
  source_heading: 7.6 Kubernetes 不是采用微服务的前提
- level: 概念辨析
  question: 原文如何解释「7.8 微服务越小越好是错误的」？
  answer: "“微”强调边界和团队可掌握，不表示一个 Endpoint 一个服务。过小会产生聊天式调用、事务和可用性问题。"
  source_heading: 7.8 微服务越小越好是错误的
- level: 概念辨析
  question: 原文如何解释「7.14 治理不等于中央审批」？
  answer: 治理应通过默认值、自动检查和透明指标降低决策成本。每次变更开会审批会增加协作成本。
  source_heading: 7.14 治理不等于中央审批
- level: 概念辨析
  question: 原文如何解释「7.16 可报废不等于低质量」？
  answer: 服务仍需安全、测试和可观测。可报废强调依赖可迁移、数据可导出和实现可替换。
  source_heading: 7.16 可报废不等于低质量
