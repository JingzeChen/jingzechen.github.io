overview:
  kind: summary
  minutes: 13
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 原章中的常见路径是：数据库中的历史快照通过 batch 生成 static features，实时传输中的持续事件通过 stream engine
    生成 dynamic features。很多模型同时需要二者；但处理模式由有界性、新鲜度和更新语义决定，不由数据库或 Kafka 的产品名称单独决定。有观点把
    batch 看作有界 stream 的特例，用统一流引擎处理两类管道。
  thesis_source: 8. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：不存在脱离未来访问方式的“最佳数据方案”；每一层都应从数据将被谁、在何时、以什么延迟和一致性要求使用来反推。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Data Sources：数据来源
    meaning: Apple 在 2021 年初把 IDFA 改为 opt-in，显著减少 iPhone 上可用的第三方数据，迫使公司更多依赖第一方数据。广告行业随后投资规避方案；原章提到中国广告协会支持的
      CAID 设备指纹方案，以及 TikTok、Tencent 等 App 的追踪争议。
    source_heading: 2. Data Sources：数据来源
  - term: 5. Data Storage Engines and Processing：存储引擎与处理
    meaning: 随着云基础设施和 schema 工具标准化，提前管理结构又变得可行。lakehouse 试图结合 lake 的开放、低成本和灵活性与 warehouse
      的 schema、事务、元数据和查询管理。原章列 Databricks 与 Snowflake 为例。
    source_heading: 5. Data Storage Engines and Processing：存储引擎与处理
  - term: 6. Modes of Dataflow：数据流模式
    meaning: 原章用“in-memory storage”帮助理解实时传输的低延迟中介角色。现代 Kafka 并不是纯内存队列，而是磁盘支持、依赖页缓存、可复制的持久
      commit log；Kinesis 也提供持久保留。应把“实时传输”理解为低延迟追加与消费接口，而非实现必须只在 RAM。
    source_heading: 6. Modes of Dataflow：数据流模式
  - term: 10. 本章知识结构
    meaning: 格式把内存对象变成可持久或传输的字节，并影响 I/O 与兼容性。
    source_heading: 10. 本章知识结构
  - term: 12. 从本章提炼出的通用数据系统设计方法
    meaning: 本章最重要的通用思路是：先描述数据在时间和系统中的生命历程，再选择每一层的技术；工具名称会变化，访问模式、结构责任、耦合、状态和失败语义仍然是稳定的判断依据。
    source_heading: 12. 从本章提炼出的通用数据系统设计方法
