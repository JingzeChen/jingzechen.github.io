    source_heading: 13. Launching distributed jobs：把进程、rank 与设备真正启动起来
  - term: 17.14 Strong scaling 与 weak scaling 不能混报
    meaning: 二者回答不同问题。把 weak-scaling 吞吐增长写成 fixed-workload 加速会夸大收益。
    source_heading: 17.14 Strong scaling 与 weak scaling 不能混报
  - term: 21. 复习与自测
    meaning: 8 个 DDP ranks，每 rank local batch 为 32，每次 optimizer step 累积 2 个 microbatches，global
