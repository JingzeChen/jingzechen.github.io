  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: Global batch 随 local batch、DP degree 和 accumulation 共同变化。 扩卡会改变优化语义。
  thesis_source: 19. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: PyTorch 的 rank、process group、backend 和八类 collective 怎样连接到 DDP、FSDP 与高级并行？
    source_heading: 0. 本章要回答的核心问题
  - term: 5. The modern AI model lifecycle：现代模型生命周期
    meaning: 若端到端利用率为 40%，约需 487 天。不同架构、计算公式、稀疏性和硬件会改变数字，但 8 张 A100 两周不足以完成这一稠密训练量。两周目标在理论
      100% 峰值下也约需 111 张 A100，在 40% 利用率下约需 278 张。
    source_heading: 5. The modern AI model lifecycle：现代模型生命周期
  - term: 11. DistributedDataParallel：从 AllReduce 到同步数据并行
    meaning: DDP reducer 会为需要梯度的 parameters 注册 autograd hook，并把梯度组织成 buckets。Backward
      从模型输出侧向输入侧推进，某个 bucket 的所有 gradients ready 后，DDP 就能发起该 bucket 的 collective，而不必等整个
      backward 完成。
    source_heading: 11. DistributedDataParallel：从 AllReduce 到同步数据并行
  - term: 13. Launching distributed jobs：把进程、rank 与设备真正启动起来
    meaning: 为什么先设置 device 再创建 GPU tensor/model：如果先在默认 GPU 0 分配模型，之后再切 device，可能造成
