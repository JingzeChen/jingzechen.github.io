  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - Request / Response Model：与 UI、数据库和框架无关的边界模型。
    - 可见性：顶层结构是否清楚展示领域与 Use Cases；
    - 可测试性：Entity 与 Use Case 是否无需 Web Server、数据库和框架即可运行测试。
    - "“尖叫架构”不是把目录改成业务名这么简单。名称、源码依赖和运行测试必须共同证明：系统以业务用途为中心，技术只是可替换工具。"
  - title: 2. The Theme of an Architecture：架构的主题
    source_heading: 2. The Theme of an Architecture：架构的主题
    paragraphs:
    - 作者请读者回顾 Ivar Jacobson 的 Object Oriented Software Engineering。
    - 按 Feature 分包可以改善可见性，但不自动得到 Clean Architecture。
    - 如果顶层按 Controller、Service、Repository 分组，一个 Use Case 会横跨多个顶层区域。
    - 如果顶层按 Schedule Appointment、Cancel Appointment、Billing 分组，一个业务变化更容易局部化。
  - title: 4.4 Controller 的边界职责
    source_heading: 4.4 Controller 的边界职责
    paragraphs:
    - 转换为 Use Case Request Model；
    - 把结果交给 Presenter。
  - title: 5. Frameworks Are Tools, Not Ways of Life
    source_heading: 5. Frameworks Are Tools, Not Ways of Life
    paragraphs:
    - 能否把它限制在 Adapter 中？
    - Adapter 把框架事件转换为用例请求；
    - HttpRequest / HttpResponse；
    - 继承 ORM ActiveRecord；
  - title: 7.3 原书最后的对话
    source_heading: 7.3 原书最后的对话
    paragraphs:
    - "“我们看见了一些像 Model 的东西，但 View 和 Controller 在哪里？”"
    - 这段对话说明：即使 UI 与框架尚未进入视野，业务架构仍然完整、可理解。
  - title: 8.4 Adapter 层
    source_heading: 8.4 Adapter 层
    paragraphs:
    - Console Adapter；
    - Message Consumer；
    - Email Notification Adapter。
  - title: 10.2 使用中
    source_heading: 10.2 使用中
    paragraphs:
    - 框架类型是否进入 Entity / Use Case？
    - Request / Response 是否被框架污染？
    - ORM Model 是否充当领域 Entity？
  - title: 12.3 框架边界检查
    source_heading: 12.3 框架边界检查
    paragraphs:
    - Entity / Use Case 是否继承框架类型？
    - 核心参数是否含 HttpRequest 或 ORM Model？
    - 框架对象是否止步 Adapter？
    - Composition Root 是否集中具体组装？
  - title: 12.6 决策选项检查
    source_heading: 12.6 决策选项检查
    paragraphs:
    - 保留选择的收益是否大于边界成本？
    - 某个选项是否已无价值，应当关闭？
  - title: 13. 本章总结
    source_heading: 13. 本章总结
    paragraphs:
    - 医疗系统的顶层结构应首先展示 Patient、Appointment、Prescription 和 Billing 等能力。
    - 顶层只有 Controller、Model、View、Repository 和 Service，只能说明技术组织方式。
    - Presenter 把 Use Case Response Model 转成 HttpResponse 或 View Model。
    - 框架对象不应进入 Entity、Use Case 和独立 Request / Response Model。
  takeaways:
  - 第 21 章要求软件架构像建筑蓝图一样清楚展示系统用途。
  - 水平技术层和垂直业务用例可以同时存在，但业务用途应成为主要主题。
  - Controller 把 HttpRequest 转成 Use Case Request Model。
  - 若临时删除框架目录后核心仍能构建和测试，框架更像工具而非生活方式。
  - 本章最终要求是：让代码仓库先告诉读者系统是什么，再告诉读者使用什么工具实现它。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.2 “Package by Feature 自动等于 Clean Architecture”」？
  answer: 错误。Feature 包内部仍可能直接依赖 ORM、HTTP 与第三方 SDK。
  source_heading: 11.2 “Package by Feature 自动等于 Clean Architecture”
- level: 概念辨析
  question: 原文如何解释「11.5 “推迟框架决策意味着不做技术验证”」？
  answer: 错误。可以进行 Prototype 和 Spike，但应隔离试验，不让它绑定业务核心。
  source_heading: 11.5 “推迟框架决策意味着不做技术验证”
- level: 概念辨析
  question: 原文如何解释「11.6 “Controller 就是 Use Case”」？
  answer: 错误。Controller 转换外部输入，Use Case 实现应用业务流程，二者因不同原因变化。
  source_heading: 11.6 “Controller 就是 Use Case”
- level: 概念辨析
  question: 原文如何解释「11.12 “用例切片必然复制业务规则”」？
  answer: 错误。共同关键规则应下沉到 Entity 或领域政策；不要为了切片复制同一知识。
  source_heading: 11.12 “用例切片必然复制业务规则”
- level: 概念辨析
  question: 原文如何解释「11.18 “核心完全不应知道任何技术约束”」？
  answer: 错误。真实业务可能包含安全、延迟或一致性政策；核心只是不应依赖具体实现机制。
  source_heading: 11.18 “核心完全不应知道任何技术约束”
