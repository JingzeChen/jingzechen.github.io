overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 技术风险仍应通过 Prototype 或 Spike 验证，只是不应污染核心业务。
  thesis_source: 13. 本章总结
  concepts:
