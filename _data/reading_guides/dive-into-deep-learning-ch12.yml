overview:
  kind: summary
  minutes: 8
  question: 1. 全章主线：优化器究竟在解决什么？
  question_source: 1. 全章主线：优化器究竟在解决什么
  thesis: 本章的推理主线可以压缩为一句话：梯度下降给出局部下降方向，SGD 用噪声估计换取可扩展性，小批量用矩阵化平衡统计与硬件效率，momentum 在时间上平滑方向，Adagrad/RMSProp/Adadelta
    在坐标上估计尺度，Adam 同时组合一阶与二阶历史，而 scheduler 决定这些更新在训练时间轴上的全局幅度。真正可靠的优化不是挑一个名字，而是让目标、梯度估计、状态尺度、学习率、batch
    和计算预算彼此一致。
  thesis_source: 18. 核心结论与解决优化问题的一般思路
  concepts:
  - term: 1. 全章主线：优化器究竟在解决什么
    meaning: g_t 用全数据梯度、单样本梯度，还是小批量梯度？
    source_heading: 1. 全章主线：优化器究竟在解决什么
  - term: 4. 梯度下降
    meaning: 实践常用 backtracking、Armijo 或 Wolfe 条件，不必精确求一维最小值。原文说“二分搜索”只在沿线函数凸/单峰或搜索导数符号时适用。
    source_heading: 4. 梯度下降
  - term: 6.5 Airfoil 数据实验
    meaning: 具体速度依赖硬件，不能把 batch 100 当通用最优。实验要表达的是统计效率与计算效率之间存在中间甜点。
    source_heading: 6.5 Airfoil 数据实验
  - term: 7.2 Momentum 更新
    meaning: velocity 像重球在地形中积累惯性。
    source_heading: 7.2 Momentum 更新
  - term: 12. 学习率调度
    meaning: 学习率同时控制漂移和注入噪声尺度。它提示我们：SGD 不只是下降，也在噪声驱动下探索参数空间；衰减学习率类似逐渐降低“温度”。但普通 minibatch
      SGD 的噪声一般非各向同性高斯，不能直接等同于严格后验采样。
    source_heading: 12. 学习率调度
  - term: 18. 核心结论与解决优化问题的一般思路
    meaning: 本章的推理主线可以压缩为一句话：梯度下降给出局部下降方向，SGD 用噪声估计换取可扩展性，小批量用矩阵化平衡统计与硬件效率，momentum
      在时间上平滑方向，Adagrad/RMSProp/Adadelta 在坐标上估计尺度，Adam 同时组合一阶与二阶历史，而 scheduler 决定这些更新在训练时间轴上的全局幅度。真正可靠的优化不是挑一个名字，而是让目标、梯度估计、状态尺度、学习率、batch
      和计算预算彼此一致。
    source_heading: 18. 核心结论与解决优化问题的一般思路
  logic:
  - 1. 全章主线：优化器究竟在解决什么
  - 4. 梯度下降
  - 5.6 有放回与无放回抽样
  - 7.2 Momentum 更新
  - 9. RMSProp
  - 14. 可运行的综合 PyTorch 实验
  - 18. 核心结论与解决优化问题的一般思路
  sections:
  - title: 1. 全章主线：优化器究竟在解决什么
    source_heading: 1. 全章主线：优化器究竟在解决什么
    paragraphs:
    - g_t 用全数据梯度、单样本梯度，还是小批量梯度？
    - 是否利用过去梯度来平滑方向或估计坐标尺度？
    - SGD + momentum 在视觉任务中仍常有很强泛化表现；
    - 无论选哪种优化器，学习率及其调度往往比其他超参数更敏感；
  - title: 3.1 为什么学习凸优化
    source_heading: 3.1 为什么学习凸优化
    paragraphs:
    - 凸问题能给出清晰的全局结论和收敛证明；
    - SGD 的基本学习率直觉可从凸证明得到；
    - 若算法连简单凸问题都不稳定，很难期待它在深网中可靠；
    - Hessian、条件数、投影和对偶等概念会反复出现。
  - title: 4. 梯度下降
    source_heading: 4. 梯度下降
    paragraphs:
    - 负梯度是局部最速下降方向，但只相对于当前坐标下的欧氏范数；改变参数化或度量，最速下降方向也会改变。
    - 它相当于每个坐标使用不同学习率，缓解单位和尺度差异。Adagrad、RMSProp、Adam 都可视为利用梯度历史构造对角预条件器。
    - 对角方法依赖坐标轴：若病态方向与坐标轴不对齐，效果可能明显下降。旋转参数空间后，完整 Newton 不受影响，而对角近似通常会改变。
    - 实践常用 backtracking、Armijo 或 Wolfe 条件，不必精确求一维最小值。原文说“二分搜索”只在沿线函数凸/单峰或搜索导数符号时适用。
  - title: 5.6 有放回与无放回抽样
    source_heading: 5.6 有放回与无放回抽样
    paragraphs:
    - 但整轮负相关结构常带来更小方差和更好表现。
    - 不能把“SGD 理论中的独立有放回抽样”和“训练代码中的 shuffle without replacement”视为完全相同随机过程。
  - title: 6.5 Airfoil 数据实验
    source_heading: 6.5 Airfoil 数据实验
    paragraphs:
    - 每列标准化为零均值、单位标准差；
    - 线性回归比较不同 batch size。
    - 具体速度依赖硬件，不能把 batch 100 当通用最优。实验要表达的是统计效率与计算效率之间存在中间甜点。
  - title: 7.2 Momentum 更新
    source_heading: 7.2 Momentum 更新
    paragraphs:
    - 梯度长期同向的平坦方向会累积，加速前进；
    - 梯度反复变号的陡峭方向会相互抵消，减小振荡；
    - velocity 像重球在地形中积累惯性。
  - title: 9. RMSProp
    source_heading: 9. RMSProp
    paragraphs:
    - 所以对平稳梯度分布，s_t 不再必然随时间发散，坐标缩放与全局学习率调度被解耦。
    - RMSProp：平方梯度归一化 EMA；
    - Momentum：梯度本身的未归一化历史和；
    - Adam：归一化一阶矩 EMA + 二阶矩 EMA。
  - title: 12. 学习率调度
    source_heading: 12. 学习率调度
    paragraphs:
    - 原书观察某些衰减策略更平滑且过拟合较少，但这只是实验现象，不是“降低学习率必然改善泛化”的理论结论。Scheduler 同时改变优化路径、噪声和有效训练阶段，原因复杂。
    - 若每次 scheduler 查询都修改内部状态，那么仅为绘图或日志重复调用也会推进学习率。更稳健的 scheduler 应尽量是 step 的纯函数，或由框架统一维护调用次数。
    - 里程碑依赖总 epoch 和数据规模。若 batch size、数据量或每 epoch 更新数改变，按 epoch 复用相同里程碑并不保证相同优化过程。
    - 学习率同时控制漂移和注入噪声尺度。它提示我们：SGD 不只是下降，也在噪声驱动下探索参数空间；衰减学习率类似逐渐降低“温度”。但普通 minibatch
      SGD 的噪声一般非各向同性高斯，不能直接等同于严格后验采样。
  - title: 14. 可运行的综合 PyTorch 实验
    source_heading: 14. 可运行的综合 PyTorch 实验
    paragraphs:
    - 枚举所有样本验证单样本梯度的期望等于全梯度；
    - Adagrad 累积状态单调增大，有效坐标学习率单调减小；
    - RMSProp 与 Adadelta 的移动状态保持非负并降低目标；
  - title: 18. 核心结论与解决优化问题的一般思路
    source_heading: 18. 核心结论与解决优化问题的一般思路
    paragraphs:
    - 明确 scheduler 时间轴：按 optimizer updates、epochs 还是 tokens；梯度累积和数据复制后要重算。
    - 出现平台时做可证伪实验：放大学习率、减小 batch、关闭 scheduler、检查梯度，逐项定位是优化冻结还是已过拟合。
    - 保留可恢复状态：checkpoint 必须保存 optimizer state、scheduler state、step、随机状态和 scaler，不能只存模型权重。
    - 本章的推理主线可以压缩为一句话：梯度下降给出局部下降方向，SGD 用噪声估计换取可扩展性，小批量用矩阵化平衡统计与硬件效率，momentum 在时间上平滑方向，Adagrad/RMSProp/Adadelta
      在坐标上估计尺度，Adam 同时组合一阶与二阶历史，而 scheduler 决定这些更新在训练时间轴上的全局幅度。真正可靠的优化不是挑一个名字，而是让目标、梯度估计、状态尺度、学习率、batch
      和计算预算彼此一致。
  takeaways:
  - 优化器最小化训练目标，深度学习关心总体风险；优化误差与泛化误差必须分开。
  - Adadelta 再用更新平方 RMS 校准尺度，但现代实现仍可能有全局学习率。
  - 建立简单基线：从 SGD 或 AdamW 开始，记录初始 loss、梯度范数和吞吐。
  - 后期降低学习率：减小随机梯度稳态波动，不要依赖固定步长无限训练。
  - 本章的推理主线可以压缩为一句话：梯度下降给出局部下降方向，SGD 用噪声估计换取可扩展性，小批量用矩阵化平衡统计与硬件效率，momentum 在时间上平滑方向，Adagrad/RMSProp/Adadelta
    在坐标上估计尺度，Adam 同时组合一阶与二阶历史，而 scheduler 决定这些更新在训练时间轴上的全局幅度。真正可靠的优化不是挑一个名字，而是让目标、梯度估计、状态尺度、学习率、batch
    和计算预算彼此一致。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.1 优化误差就是泛化误差」？
  answer: 错误。优化器最小化训练目标；验证/总体风险还受有限样本、模型复杂度和分布偏移影响。
  source_heading: 15.1 优化误差就是泛化误差
- level: 概念辨析
  question: 原文如何解释「15.10 梯度裁剪等于 weight decay」？
  answer: 裁剪投影更新方向，weight decay 收缩参数，作用对象和统计效果不同。
  source_heading: 15.10 梯度裁剪等于 weight decay
- level: 概念辨析
  question: 原文如何解释「15.19 Batch 越大越好」？
  answer: 方差下降有边际递减，大 batch 增加显存并减少每 epoch 更新数，也可能改变泛化与 BatchNorm。
  source_heading: 15.19 Batch 越大越好
- level: 概念辨析
  question: 原文如何解释「15.27 对角自适应优化器旋转不变」？
  answer: 错误。坐标旋转会改变逐坐标平方梯度，完整矩阵预条件才可能保持相应不变性。
  source_heading: 15.27 对角自适应优化器旋转不变
- level: 概念辨析
  question: 原文如何解释「15.35 Scheduler 每调用一次只是在读取值」？
  answer: 有状态 scheduler 可能推进内部计数；应由统一训练循环调用，避免日志查询改变训练。
  source_heading: 15.35 Scheduler 每调用一次只是在读取值
