overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 学习目标、阅读边界与设计总览」建立了怎样的核心认识？
  question_source: 0. 学习目标、阅读边界与设计总览
  thesis: 成员状态通过 gossip 最终传播，节点先 suspect 再 down，避免抖动。
  thesis_source: 22. 核心结论与一般设计方法
  concepts:
  - term: 0. 学习目标、阅读边界与设计总览
    meaning: 本文会补充 quorum 条件边界、向量时钟偏序、Bloom filter 公式、LSM 写放大等标准背景。补充内容会与原书结论连续讲解，但不冒充作者逐式给出的原文。
    source_heading: 0. 学习目标、阅读边界与设计总览
  - term: 4. 分布式键值存储与 CAP
    meaning: 原书表述为：无论连接哪个节点，所有客户端同时看到相同数据。更严格的 CAP 语境通常指线性一致性：每次操作看起来在调用与返回之间某个瞬间原子发生，读返回最近完成的写。
    source_heading: 4. 分布式键值存储与 CAP
  - term: 10. 不一致解决：不可变版本与向量时钟
    meaning: 限制长度并删除最旧项会丢失因果信息，导致无法准确判断祖先，产生额外 sibling 或错误合并。Dynamo 经验认为实际中可接受，但不能视为理论无损。
    source_heading: 10. 不一致解决：不可变版本与向量时钟
  - term: 14. 永久故障：Anti-Entropy 与 Merkle Tree
    meaning: 根 hash 相同只在假设 hash 无碰撞、序列化一致时说明数据相同。工程上使用足够强 hash、版本化树格式并定期全量校验。
    source_heading: 14. 永久故障：Anti-Entropy 与 Merkle Tree
  - term: 16.4 一次 get 的分布式外层流程
    meaning: Coordinator 定位 replicas；
    source_heading: 16.4 一次 get 的分布式外层流程
  - term: 22. 核心结论与一般设计方法
    meaning: 分区期间偏 AP：sloppy quorum 跳过临时故障节点，hinted handoff 在 home replica 恢复后归还数据；永久差异用按
      token range 构建的 Merkle tree 做 anti-entropy。
    source_heading: 22. 核心结论与一般设计方法
