overview:
  kind: summary
  minutes: 11
  question: 原文围绕「0. 本章定位、学习目标与装配主线」建立了怎样的核心认识？
  question_source: 0. 本章定位、学习目标与装配主线
  thesis: Attention 与 FFN 不是替代关系；前者决定位置之间如何交换信息，后者增加每个位置内部的非线性计算容量。
  thesis_source: 5. 全章知识结构
  concepts:
  - term: 0. 本章定位、学习目标与装配主线
    meaning: GPT-3 的核心架构与 GPT-2 同属 decoder-only Transformer，主要把规模从 GPT-2 最大约 1.5B
      扩到 175B，并使用更多数据。作者选择 GPT-2 是因为公开预训练权重可在后续加载，且小模型能在单台电脑上研究；原书引用估计称单张 V100 训练
      GPT-3 需约 355 年，RTX 8000 约 665 年，这些只是特定假设下的量级说明，不是当前硬件上的普适常数。
    source_heading: 0. 本章定位、学习目标与装配主线
  - term: 4.2 Normalizing Activations with Layer Normalization（用层归一化规范激活）
    meaning: 若局部尺度长期小于 1，梯度可能消失；长期大于 1，梯度可能爆炸。前向激活尺度不断漂移也会使各层优化条件不一致。LayerNorm 对每个
      token 的特征向量重新居中、缩放，帮助深层训练更稳定。
    source_heading: 4.2 Normalizing Activations with Layer Normalization（用层归一化规范激活）
  - term: 4.4 Adding Shortcut Connections（添加快捷/残差连接）
    meaning: I 提供一条不经过 F 内部权重与激活的直接梯度路径。即使 J_F 很小，梯度仍可沿恒等项传播。Shortcut 不是让梯度永远不衰减的绝对保证，但显著改善深层优化。
    source_heading: 4.4 Adding Shortcut Connections（添加快捷/残差连接）
  - term: 4.6 Coding the GPT Model（编码完整 GPT 模型）
    meaning: 原书代码没有显式长度检查，超长输入会在位置 embedding 查表或 attention mask 处失败；这里给出更清晰错误，不改变合法输入行为。
    source_heading: 4.6 Coding the GPT Model（编码完整 GPT 模型）
  - term: 8. 作者分析与解决问题的一般思路
    meaning: 先算 LayerNorm、FFN、attention，再算 block、block stack、embedding 和 output head。出现“163M
      vs 124M”时，不靠名称猜，而是定位重复的大矩阵并识别 weight tying。
    source_heading: 8. 作者分析与解决问题的一般思路
  - term: 12. 自测题与参考答案
    meaning: 跨 token 会让当前位置规范化结果依赖其他位置和序列长度，还可能在因果模型中引入不合适的信息耦合。LayerNorm 只对当前位置完整特征向量定义稳定变换。
    source_heading: 12. 自测题与参考答案
  logic:
  - 0. 本章定位、学习目标与装配主线
  - 4.2 Normalizing Activations with Layer Normalization（用层归一化规范激活）
  - 4.3 Implementing a Feed Forward Network with GELU Activations（实现带 GELU 的前馈网络）
  - 4.6 Coding the GPT Model（编码完整 GPT 模型）
  - 4.7 Generating Text（生成文本）
  - 10. 核心结论
  - 12. 自测题与参考答案
  sections:
  - title: 0. 本章定位、学习目标与装配主线
    source_heading: 0. 本章定位、学习目标与装配主线
    paragraphs:
    - 前三章已经准备好两类关键部件：第 2 章把文本变成 token ID 与输入嵌入，第 3 章实现多头因果注意力。本章完成全书第一阶段的最后一步：实现其余组件，把它们装配成一个可前向传播、可统计参数、可自回归生成
      token 的 GPT-2 风格模型。模型此时仍是随机初始化，真正训练在第 5 章进行。
    - LayerNorm 为什么沿最后一维而非 batch 或 token 维归一化？
    - 原始 GPT-2 报告曾写 117M，后来修正为约 124M。书中代码保留独立输出矩阵时有约 163M 参数；按原始 GPT-2 的 token embedding/output
      weight tying 口径才约 124M。两种数字衡量的参数共享方案不同，不矛盾。
    - GPT-3 的核心架构与 GPT-2 同属 decoder-only Transformer，主要把规模从 GPT-2 最大约 1.5B 扩到 175B，并使用更多数据。作者选择
      GPT-2 是因为公开预训练权重可在后续加载，且小模型能在单台电脑上研究；原书引用估计称单张 V100 训练 GPT-3 需约 355 年，RTX 8000
      约 665 年，这些只是特定假设下的量级说明，不是当前硬件上的普适常数。
  - title: 4.1 Coding an LLM Architecture（编码 LLM 架构）
    source_heading: 4.1 Coding an LLM Architecture（编码 LLM 架构）
    paragraphs:
    - 这是“先打通骨架，再替换局部”的工程策略。占位符并非近似 attention，它们是明确的恒等函数。
    - 若输入在 GPU、位置索引默认建在 CPU，位置 embedding 查表或后续加法会产生 device mismatch。设备来自实际输入而非硬编码，使同一
      forward 同时支持 CPU/GPU。
    - 生成时可根据需要做 softmax、temperature、top-k 或直接 argmax；
    - 每个批次、每个输入位置都有一个 50,257 维下一 token score 向量。因果语言模型训练会同时监督所有 8 个位置；生成时只使用当前序列最后一个位置。
  - title: 4.2 Normalizing Activations with Layer Normalization（用层归一化规范激活）
    source_heading: 4.2 Normalizing Activations with Layer Normalization（用层归一化规范激活）
    paragraphs:
    - 若局部尺度长期小于 1，梯度可能消失；长期大于 1，梯度可能爆炸。前向激活尺度不断漂移也会使各层优化条件不一致。LayerNorm 对每个 token
      的特征向量重新居中、缩放，帮助深层训练更稳定。
    - 所以开始时是纯规范化；训练可逐特征恢复或改变合适尺度。加入 affine 参数后，LayerNorm 的最终输出不必保持均值 0、方差 1，这是有意的表达能力。
    - 这叫 Pre-LayerNorm。原始 2017 Transformer 常使用 Post-LN，即子层和 shortcut 相加后归一化。Pre-LN
      通常给深层网络更直接的梯度路径，训练动态更好；二者不能只改一行而无视预训练权重和整体架构约定。
    - 最后一个容差依赖输入方差与 epsilon；接近常量的输入不能要求方差严格为 1。更稳妥的测试还应覆盖常量输入输出有限、反向梯度有限，以及 batch
      中一个样本变化不影响另一个样本的规范化统计。
  - title: 4.3 Implementing a Feed Forward Network with GELU Activations（实现带 GELU
      的前馈网络）
    source_heading: 4.3 Implementing a Feed Forward Network with GELU Activations（实现带
      GELU 的前馈网络）
    paragraphs:
    - 多头 attention 的核心作用是跨位置读取与混合信息：位置 t 根据上下文构造新的向量。但如果只有加权平均和线性投影，模型还需要一个强的逐位置非线性变换来加工每个
      token 的特征组合。
    - 扩大中间维度给非线性变换更多通道来检测和组合特征，再压回 d 以保持 block 接口和 shortcut 形状。4 倍是 GPT-2 的架构选择，不是所有
      LLM 的定律；现代模型也常用 SwiGLU 和不同扩展比例。
    - 这正是练习 4.1 的 FFN 参数数。它约为本章多头 attention 的 2 倍，因为 FFN 两个矩阵都经过 4 倍中间维。
    - 不解决：跨 token 通信、位置顺序、因果遮罩。单独打乱 token 行后，FFN 输出只会按相同顺序打乱；跨位置关系由 attention 提供。
  - title: 4.4 Adding Shortcut Connections（添加快捷/残差连接）
    source_heading: 4.4 Adding Shortcut Connections（添加快捷/残差连接）
    paragraphs:
    - 若多个 Jacobian 的典型奇异值小于 1，连乘会快速衰减；早期层几乎收不到学习信号。大于 1 则可能爆炸。
    - I 提供一条不经过 F 内部权重与激活的直接梯度路径。即使 J_F 很小，梯度仍可沿恒等项传播。Shortcut 不是让梯度永远不衰减的绝对保证，但显著改善深层优化。
    - 这些具体数字依赖 PyTorch 版本、初始化与 GELU 实现。应关注同权重条件下 shortcut 提供的梯度路径，而不是把打印值当跨环境常数。
    - 使两模型初始线性层参数一致，唯一主要差异是 forward 是否相加。若初始化不同，就无法把梯度差异归因于 shortcut。
  - title: 4.6 Coding the GPT Model（编码完整 GPT 模型）
    source_heading: 4.6 Coding the GPT Model（编码完整 GPT 模型）
    paragraphs:
    - 这说明先搭骨架的价值：顶层 token/position embedding、block stack 和输出接口已验证，局部替换后可继续沿用。
    - 原书代码没有显式长度检查，超长输入会在位置 embedding 查表或 attention mask 处失败；这里给出更清晰错误，不改变合法输入行为。
    - 列表推导每次创建新的对象和独立参数。不能写成把同一个 block 对象重复 12 次，否则会意外共享全部层权重，变成另一种架构。
    - 原书总结用 124M、345M、762M、1,542M 作为 GPT-2 家族名；本书当前独立输出头实现会比 weight-tied/官方口径更大。
  - title: 4.7 Generating Text（生成文本）
    source_heading: 4.7 Generating Text（生成文本）
    paragraphs:
    - 二者职责不同，不能互相替代。当前 LayerNorm 不维护 train/eval 运行统计，因此主要模式差异来自 dropout。
    - 架构只定义函数族和信息流；随机参数没有通过下一 token 语料学习语言分布。输出能形成合法 token，是因为 tokenizer 和输出维度正确；不连贯则说明参数尚未训练。
    - 没有 KV cache 时，已处理前缀被重复计算。实际高效推理会缓存各层过去 key/value，只为新 token 计算增量；本章专注最小正确算法，未实现
      cache。
    - 拆分后可独立调优，也更清楚地区分随机化发生在哪种数据上；若都设 0.1，则行为目标与原配置相同，但具体随机 mask 仍受模块创建和调用顺序影响。
  - title: 8. 作者分析与解决问题的一般思路
    source_heading: 8. 作者分析与解决问题的一般思路
    paragraphs:
    - LayerNorm 与 block 暂时恒等，仍可验证 embeddings、设备、堆叠和输出头。内部组件成熟后逐一替换，减少一次调试多个未知因素。
    - 两条 4-token 文本验证 GPT logits；
    - 先算 LayerNorm、FFN、attention，再算 block、block stack、embedding 和 output head。出现“163M
      vs 124M”时，不靠名称猜，而是定位重复的大矩阵并识别 weight tying。
    - 前向 shape、有限梯度和生成循环只能证明程序实现了某个函数。语言能力来自数据、损失和优化。看到随机输出时，作者不在生成器上打补丁，而是把问题正确路由到下一章训练。
  - title: 10. 核心结论
    source_heading: 10. 核心结论
    paragraphs:
    - GPT 由 token/位置 embedding、重复 Transformer blocks、final LayerNorm 和词表输出头组成。
    - LayerNorm 沿每个 token 的最后特征维，用总体方差、epsilon 和可训练 scale/shift。
    - 本章 block 使用 Pre-LN：每个 attention/FFN 子层前归一化，分支 dropout 后再加 shortcut。
    - 当前独立 output head 的代码有 163,009,536 个参数；按 GPT-2 weight tying 口径为 124,412,160。
  - title: 12. 自测题与参考答案
    source_heading: 12. 自测题与参考答案
    paragraphs:
    - 跨 token 会让当前位置规范化结果依赖其他位置和序列长度，还可能在因果模型中引入不合适的信息耦合。LayerNorm 只对当前位置完整特征向量定义稳定变换。
    - 无 bias。它与 token embedding 形状相同，因而可以 tying。
    - 序列联合概率是各步条件概率乘积。某一步稍低概率的 token 可能开启后续总体更高概率路径；greedy 不回溯，只优化当前一步。
    - Shape、因果性和梯度有限只证明计算图基本合法。训练还依赖数据、目标错位、初始化、优化器、学习率、数值精度和评估流程。
  takeaways:
  - Attention 与 FFN 不是替代关系；前者决定位置之间如何交换信息，后者增加每个位置内部的非线性计算容量。
  - LayerNorm 沿每个 token 的最后特征维，用总体方差、epsilon 和可训练 scale/shift。
  - GPT-2 small 堆叠 12 个 block，每个 block 在本书配置下有 7,085,568 个参数。
  - 生成循环只使用最后位置 logits，选择下一 ID、追加并反复执行。
  - 随机初始化模型生成乱码是预期结果；语言能力必须通过第 5 章训练获得。
