overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 早期选择：爆品加自有电商，以短链路获得低成本和快周转。 +> 变化信号：线上流量红利减弱，线下需求仍大，竞争者依靠渠道扩张。 +> 重大转变：坚持效率原则，但放弃“只能做电商”的渠道教条。
    +> 直营试水：小米之家从售后网点转为零售店，在真实门店中学习动线、展陈和运营。 +> 安阳教训：试点验证不足、货权失控、米粉开店支持不足、内部渠道各自为战。
    +> PPP 启发：网格内精选伙伴，以统一政策和稳定客流建立长期合作。 +> 模式重建：简化业务、组织和动作，将十四类渠道归并为三类。 +> 核心结构：厂商持货、一层零售伙伴、全链路数字化、交易即数据。
  thesis_source: 二十三、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 第十章介绍了小米高效率模型，第十一章进一步回答：高品质、价格厚道的产品，最终怎样以足够低的成本和良好体验交到用户手中？
    source_heading: 一、本章主线
  - term: 4.3 竞争者从线下侧翼进攻
    meaning: 竞争不再只是同一电商平台上的产品比较，而是产品、渠道、品牌、供应链和服务体系的全面对抗。
    source_heading: 4.3 竞争者从线下侧翼进攻
  - term: 九、直营门店初战告捷
    meaning: 原书图示：深圳万象天地小米之家全球旗舰店旗舰店承担品牌和体验作用，不能简单用普通销售门店的短期收益评价；同时也要防止把昂贵装修误当成高端体验。
    source_heading: 九、直营门店初战告捷
  - term: 十二、安阳模式：快速扩张后的教训
    meaning: 授权店取得商品所有权后，厂商难以实时控制陈列、价格和销售策略。小米当时又缺少强系统与组织，渠道一旦追求自身短期收益，品牌要求很容易落空。
    source_heading: 十二、安阳模式：快速扩张后的教训
  - term: 十八、零售的本质：效率与体验
    meaning: 小米把零售效率理解为：用更少层级、更快信息、更低库存和更准确运营，把产品交到用户手中。
    source_heading: 十八、零售的本质：效率与体验
  - term: 二十三、本章方法论总结
    meaning: 早期选择：爆品加自有电商，以短链路获得低成本和快周转。 +> 变化信号：线上流量红利减弱，线下需求仍大，竞争者依靠渠道扩张。 +> 重大转变：坚持效率原则，但放弃“只能做电商”的渠道教条。
      +> 直营试水：小米之家从售后网点转为零售店，在真实门店中学习动线、展陈和运营。 +> 安阳教训：试点验证不足、货权失控、米粉开店支持不足、内部渠道各自为战。
      +> PPP 启发：网格内精选伙伴，以统一政策和稳定客流建立长期合作。 +> 模式重建：简化业务、组织和动作，将十四类渠道归并为三类。 +> 核心结构：厂商持货、一层零售伙伴、全链路数字化、交易即数据。
    source_heading: 二十三、本章方法论总结
