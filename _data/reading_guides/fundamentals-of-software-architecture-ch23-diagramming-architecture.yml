overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0.1 架构图不是 Architecture 本身」建立了怎样的核心认识？
  question_source: 0.1 架构图不是 Architecture 本身
  thesis: Formal modeling languages 有标准 shapes，但整个软件行业没有 pervasive universal shape
    set。多数 architects 建立自己的 standard shapes，组织也可能采纳为共享语言。
  thesis_source: 1.3 Diagram Guidelines：架构图通用指南
  concepts:
  - term: 0.1 架构图不是 Architecture 本身
    meaning: Architecture 是系统真实存在的结构、行为、约束和决策；diagram 是为某个 audience、purpose 和 abstraction
      level 建立的模型。
    source_heading: 0.1 架构图不是 Architecture 本身
  - term: 0.5 本章没有统一的“正确画法”
    meaning: 原章介绍 UML、C4、ArchiMate 和一组 guidelines，却没有要求所有 architecture 采用唯一 notation。组织可以建立
      standards，也应允许合理例外。
    source_heading: 0.5 本章没有统一的“正确画法”
  - term: 1.3 Diagram Guidelines：架构图通用指南
    meaning: Formal modeling languages 有标准 shapes，但整个软件行业没有 pervasive universal shape
      set。多数 architects 建立自己的 standard shapes，组织也可能采纳为共享语言。
    source_heading: 1.3 Diagram Guidelines：架构图通用指南
  - term: 1.4 教学扩展：Static View 与 Dynamic View 不要混成一团
    meaning: 一张图同时塞入所有静态和动态信息会产生 crossing lines 和 cognitive overload。更好的做法是保持 representational
      consistency，使用多个相互链接的 views。
    source_heading: 1.4 教学扩展：Static View 与 Dynamic View 不要混成一团
  - term: 2.1 Standards 与 Exceptions
    meaning: 特殊 domain 需要自定义 visual vocabulary。
    source_heading: 2.1 Standards 与 Exceptions
  - term: 2.7 核心结论
    meaning: UML、C4、ArchiMate 解决不同尺度的问题。 UML class/sequence 仍有价值；C4 提供逐级 zoom；ArchiMate
      面向 enterprise ecosystem。
    source_heading: 2.7 核心结论
  logic:
  - 0.1 架构图不是 Architecture 本身
  - 0.5 本章没有统一的“正确画法”
  - 1.1 Tools：工具
  - 1.4 教学扩展：Static View 与 Dynamic View 不要混成一团
  - 1.6 Diagram Review Checklist（教学扩展）
  - 2.5 一般化的问题解决方法
  - 2.7 核心结论
  sections:
  - title: 0.1 架构图不是 Architecture 本身
    source_heading: 0.1 架构图不是 Architecture 本身
    paragraphs:
    - Architecture 是系统真实存在的结构、行为、约束和决策；diagram 是为某个 audience、purpose 和 abstraction
      level 建立的模型。
    - 能让 audience 得出预期理解。
  - title: 0.2 多视图为什么容易让人迷失
    source_heading: 0.2 多视图为什么容易让人迷失
    paragraphs:
    - 这几个 components 属于哪个 system/service？
    - 新图是替换旧图，还是展开其中一个方框？
    - Scope 外的元素是不存在，还是被省略？
  - title: 0.5 本章没有统一的“正确画法”
    source_heading: 0.5 本章没有统一的“正确画法”
    paragraphs:
    - 原章介绍 UML、C4、ArchiMate 和一组 guidelines，却没有要求所有 architecture 采用唯一 notation。组织可以建立
      standards，也应允许合理例外。
    - 图是否准确表达 architecture intent；
    - 是否有必要的 context 和 key。
  - title: 1.1 Tools：工具
    source_heading: 1.1 Tools：工具
    paragraphs:
    - 现代 diagramming tools 功能很强，architect 应深入掌握自己选择的工具。但在 design early stage，不应忽视
      low-fidelity artifacts。
    - 例如，architect 用 Visio 花 4 小时制作精美图，比只花 2 小时更难接受“这个设计方向错了”。问题不是 Visio，而是制作成本变成
      sunk cost，设计者开始保护图，而不是检验 architecture。
    - Stencils 保存常用 visual components，包含基本 shapes 的组合。例如本书中的 microservice icon 可作为单一
      stencil item。
    - PlantUML、Mermaid 等 diagram-as-code 工具可提供 versioning、diff、review 和 reproducibility；自由绘图工具更擅长不规则布局、视觉叙事和早期探索。
  - title: 1.3 Diagram Guidelines：架构图通用指南
    source_heading: 1.3 Diagram Guidelines：架构图通用指南
    paragraphs:
    - 每个 architect 都应发展自己的 diagramming style，可以采用 formal modeling language，也可借鉴有效
      representations。Style 可以不同，但必须清楚、一致、面向 audience。
    - Formal modeling languages 有标准 shapes，但整个软件行业没有 pervasive universal shape set。多数
      architects 建立自己的 standard shapes，组织也可能采纳为共享语言。
    - 历史上书籍必须黑白打印，architects 习惯 monochromatic drawings。原章仍偏好 monochrome，但在 color 能区分
      artifacts 时会使用。
    - 图 23-3 重现第 19 章 GGG microservices communication，用不同 gray shades 表示 architecture
      quantum/grouping。
  - title: 1.4 教学扩展：Static View 与 Dynamic View 不要混成一团
    source_heading: 1.4 教学扩展：Static View 与 Dynamic View 不要混成一团
    paragraphs:
    - Deployment/data ownership；
    - 典型：C4 Context/Container/Component、UML class、deployment diagram。
    - 典型：UML sequence、state diagram、event flow。
    - 一张图同时塞入所有静态和动态信息会产生 crossing lines 和 cognitive overload。更好的做法是保持 representational
      consistency，使用多个相互链接的 views。
  - title: 1.6 Diagram Review Checklist（教学扩展）
    source_heading: 1.6 Diagram Review Checklist（教学扩展）
    paragraphs:
    - 这张图要支持什么 decision/conversation？
    - Audience 是 executives、developers、operations 还是 security？
    - 图对应 current、target 还是 transition state？
    - Owner 和 last-reviewed date 是否可查？
  - title: 2.1 Standards 与 Exceptions
    source_heading: 2.1 Standards 与 Exceptions
    paragraphs:
    - Common shapes/lines/colors；
    - Required title/key/accessibility conventions；
    - Storage/versioning practices；
    - 特殊 domain 需要自定义 visual vocabulary。
  - title: 2.5 一般化的问题解决方法
    source_heading: 2.5 一般化的问题解决方法
    paragraphs:
    - Context、container、component、workflow、deployment、data 或 risk view 只选择当前必要内容。
    - Base topology 与 implementation/product detail 分离；按需叠加 domain、transaction、security。
    - 定义 lines、arrows、shapes、labels、colors、icons，并提供 key 与 accessibility redundancy。
    - 过时图会主动传播错误。把 diagram update 纳入 ADR、release 或 architecture review 流程。
  - title: 2.7 核心结论
    source_heading: 2.7 核心结论
    paragraphs:
    - 早期优先 low-fidelity artifacts。 它们降低 sunk cost，促进 revision、collaboration 和 experimentation。
    - Layers 应承载语义。 Base topology、implementation details、DDD boundaries 和 transaction
      scope 应可独立展示。
    - UML、C4、ArchiMate 解决不同尺度的问题。 UML class/sequence 仍有价值；C4 提供逐级 zoom；ArchiMate 面向
      enterprise ecosystem。
    - Solid/ dotted 通常分别表示 synchronous/asynchronous。 Direction 和特殊 semantics 仍需 arrow/label/key。
  takeaways:
  - 能让 audience 得出预期理解。
  - 是否有必要的 context 和 key。
  - 一张图同时塞入所有静态和动态信息会产生 crossing lines 和 cognitive overload。更好的做法是保持 representational
    consistency，使用多个相互链接的 views。
  - 特殊 domain 需要自定义 visual vocabulary。
  - Solid/ dotted 通常分别表示 synchronous/asynchronous。 Direction 和特殊 semantics 仍需 arrow/label/key。
