overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 邮件系统不是“把文本发给另一个用户”」建立了怎样的核心认识？
  question_source: 0. 邮件系统不是“把文本发给另一个用户”
  thesis: Deliverability 是邮件产品的核心功能。 Dedicated IP、Warm-up、Feedback、Reputation 和 SPF/DKIM/DMARC
    决定是否进入 Inbox。
  thesis_source: 13. 核心结论
  concepts:
  - term: 0. 邮件系统不是“把文本发给另一个用户”
    meaning: SMTP Delivery State：通过持久队列、重试和 Feedback Loop 管理。
    source_heading: 0. 邮件系统不是“把文本发给另一个用户”
  - term: 2.3 IMAP
    meaning: IMAP 让邮件继续保存在 Server，Client 按需下载 Header/Body，并同步 Folder、Read 等状态。
    source_heading: 2.3 IMAP
  - term: 4.2 SMTP 重试
    meaning: Permanent Failure（5xx、Invalid Recipient）不应无限重试，应生成 Hard Bounce/DSN。
    source_heading: 4.2 SMTP 重试
  - term: 6.1 邮件数据特征
    meaning: Read/Folder 状态可变，邮件内容大多不可变。
    source_heading: 6.1 邮件数据特征
  - term: 8.3 方案一：Elasticsearch
    meaning: ES 不是 Source of Truth；损坏时从 Mail Store/Kafka 重建，所以 Search 短暂不可用不应丢邮件。
    source_heading: 8.3 方案一：Elasticsearch
  - term: 14. 解决分布式邮件问题的一般思路
    meaning: Queued -> Sending -> Remote Accepted / Soft Bounce Retry / Hard Bounce
      / Complaint，按 MX Priority、Backoff/Jitter 和 Domain Rate Limit 执行。
    source_heading: 14. 解决分布式邮件问题的一般思路
  logic:
  - 0. 邮件系统不是“把文本发给另一个用户”
  - 2.3 IMAP
  - 3.1 Webmail API
  - 6.1 邮件数据特征
