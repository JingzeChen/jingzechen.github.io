  sections:
  - title: 核心摘要
    source_heading: 核心摘要
    paragraphs:
    - 深度学习在 2006 年后重新受到重视，并随着算力和数据规模的增长取得突破；2022 年以来，AI 助手又进一步推动了人工智能在各行业的应用。
    - 本书默认读者几乎没有机器学习基础，但需要具备 Python、NumPy、pandas 和 Matplotlib 的基本使用经验。
    - 本书采用“代码优先、少量理论、建立直觉”的方法，主要工具是 Scikit-Learn 和 PyTorch，也会使用 XGBoost、Hugging Face
      与 Gymnasium。
    - 这一版从 TensorFlow/Keras 转向 PyTorch，并加入 NLP Transformer、视觉与多模态 Transformer、模型加速与扩展等新内容。
  - title: 前言分节意译
    source_heading: 前言分节意译
    paragraphs:
    - 当时，训练深层神经网络普遍被认为是不现实的，很多研究者在 20 世纪 90 年代末已经放弃了这条路线。这篇论文重新点燃了学术界的兴趣。此后，大量研究证明，在充足算力和海量数据的支持下，深度学习可以达到其他机器学习方法难以企及的效果，并带动了整个机器学习领域的发展。
    - 如果尚未学习 Python，可从 https://learnpython.org/ 或 Python 官方教程 https://docs.python.org/3/tutorial/
      开始。作者也在 https://homl.info/tutorials-p 提供了科学计算库教程。
    - 作者曾在 2017、2019 和 2022 年出版三版基于 TensorFlow 的版本。TensorFlow 长期是深度学习的主流框架，并且适合 Google
      规模的生产部署。但 PyTorch 凭借简单、灵活和开放逐步取得领先，目前在研究论文和开源项目中占据主导地位，许多新模型会首先提供 PyTorch 实现，产业界也随之迁移。
    - 作者也感谢参与目录设计、范围讨论以及各章技术审阅的众多审稿人，尤其感谢审阅全部章节的 Haesun Park；感谢 O’Reilly 的编辑、项目负责人、制作、文字校对、插图和封面团队；最后感谢妻子
      Emmanuelle 和三个孩子 Alexandre、Rémi、Gabrielle。向家人解释困难概念的过程，反过来帮助作者澄清思路并改进了本书。
  - title: 提取出的学习路线
    source_heading: 提取出的学习路线
    paragraphs:
    - 完成标准：不依赖复制整段代码，能够写出一个包含训练、验证、保存和加载的最小 PyTorch 项目。
    - 编码器-解码器 → 注意力机制 → Transformer → Hugging Face → 预训练模型 → 微调 → LoRA → 推理与加速。
    - 卷积网络 → 迁移学习 → Vision Transformer → 多模态 Transformer。
    - 高效数据加载 → GPU 与混合精度 → 模型压缩 → FlashAttention → MoE → 分布式与规模化训练。
  - title: 推荐的每章学习循环
    source_heading: 推荐的每章学习循环
    paragraphs:
    - 预览：先看章节目标、图表和小结，写下三个问题；
    - 阅读：理解模型解决的问题、输入输出和关键假设；
    - 运行：从头运行配套 Notebook，确认结果可以复现；
    - 修改：改变数据、超参数或网络结构，预测结果后再执行；
  - title: 阅读策略建议
    source_heading: 阅读策略建议
    paragraphs:
    - 第二次阅读：进入 PyTorch 和深度学习基础，同时继续用传统模型建立基线。
    - 第三次阅读：根据项目方向选择 Transformer、视觉、生成模型或强化学习，不必平均用力。
    - 工具选择：表格类中小规模数据优先尝试经典方法；图像、语音、自然语言或高维复杂模式再重点考虑深度学习。
    - 衡量进度：以能否独立完成实验、解释错误并迁移到新数据为准，而不是以读完页数为准。
  - title: 最终检查清单
    source_heading: 最终检查清单
    paragraphs:
    - 能说明监督学习、无监督学习和强化学习的区别
    - 能独立完成数据清洗、特征处理和数据集划分
    - 能使用 Scikit-Learn Pipeline 组织预处理与训练
    - 能编写基本的 PyTorch 训练和验证循环
  - title: 关键链接
    source_heading: 关键链接
    paragraphs:
    - 配套代码：https://github.com/ageron/handson-mlp
    - 本地或 Docker 安装：https://homl.info/install-p
    - Python 教程：https://docs.python.org/3/tutorial/
    - 作者的 NumPy、pandas、Matplotlib 和数学教程：https://homl.info/tutorials-p
