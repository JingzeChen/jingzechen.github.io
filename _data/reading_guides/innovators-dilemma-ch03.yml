check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「10.1 液压技术天然具有破坏性」？
  answer: 不对。液压元件用于改善大型缆索机时是延续性创新；形成小型反铲并进入手工挖沟市场时才具有破坏性。分类取决于用途和价值网。
  source_heading: 10.1 液压技术天然具有破坏性
- level: 概念辨析
  question: 原文如何解释「10.3 混合产品一定是错误路线」？
  answer: 不对。混合结构能降低新技术不成熟阶段的风险，也可能是合理过渡。Hydrohoe 的问题是它只为旧客户补齐性能，没有在新市场积累纯液压能力。
  source_heading: 10.3 混合产品一定是错误路线
- level: 概念辨析
  question: 原文如何解释「10.4 客户误导了企业」？
  answer: 客户没有错误判断自己的任务。真正的问题是企业只询问主流客户，没有寻找会珍视液压当前属性的小型承建商。
  source_heading: 10.4 客户误导了企业
- level: 概念辨析
  question: 原文如何解释「10.6 技术超过需求后，旧技术立即消失」？
  answer: 不对。缆索设备在超大半径、超大载荷的采矿和起重场景仍有价值。旧技术可能退出主流而保留高端利基。
  source_heading: 10.6 技术超过需求后，旧技术立即消失
- level: 概念辨析
  question: 原文如何解释「10.7 财务表现良好代表威胁尚远」？
  answer: 不对。破坏者先在另一价值网获得收入，成熟企业早期报表不受影响。比塞洛斯-伊利和 Northwest 利润创新高时，液压轨道已逼近主流。
  source_heading: 10.7 财务表现良好代表威胁尚远
