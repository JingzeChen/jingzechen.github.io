  - 新兴企业没有一开始就战胜缆索机，而是用小型反铲替代手工挖沟，在住宅施工的新价值网中学习。随着泵、密封和结构改善，液压铲斗容量增长快于主流需求，依次进入管道和普通挖掘市场。当容量与半径都足够时，缆索的额外性能失去价值，可靠性和安全成为新的购买标准。
