overview:
  kind: summary
  minutes: 10
  question: 原文围绕「一、本章的问题、作用与结论」建立了怎样的核心认识？
  question_source: 一、本章的问题、作用与结论
  thesis: 本章最重要的认识是：成熟企业不是因为做了明显错误的事而失败，而是因为它们把正确的管理方法用在了不匹配的创新情境中。只服务当前最重要的客户，会把资源合理地投向延续性改善；要应对破坏性创新，还必须找到当前就重视新属性的客户和任务，让新业务在适合它的价值网里成长。
  thesis_source: 十二、本章总结
  concepts:
  - term: 一、本章的问题、作用与结论
    meaning: 前两章的理论主要来自变化快速的硬盘行业。第三章换到技术节奏缓慢、产品庞大、客户专业的机械挖掘机行业，检验同一机制能否跨行业成立。这是在测试理论的外部效度：如果价值网框架只能解释电子产品，它就可能只是行业特例。
    source_heading: 一、本章的问题、作用与结论
  - term: 三、破坏性液压技术的影响
    meaning: 另一些企业退守大型露天矿、海上平台和巨型起重机等高端缆索细分市场。多数企业破产，主流市场转由 J.I. Case、John Deere、Drott、Ford、JCB、Poclain、国际收割机、卡特彼勒、O&K、Demag、Liebherr、小松和日立等新进入者主导。
    source_heading: 三、破坏性液压技术的影响
  - term: 五、液压挖掘机的出现和改善轨道
    meaning: 评价重点是铲斗宽度、牵引车速度、机动性、狭窄空间作业和不破坏草皮。 原书图示：谢尔曼产品公司的液压反铲挖土机图 3.4 展示的“山猫”宣传重点不是搬运更多土，而是进入狭窄区域并减少地面损伤。性能排序的差异构成价值网边界。
    source_heading: 五、液压挖掘机的出现和改善轨道
  - term: 七、在缆索和液压之间作出选择
    meaning: 下水道和管道承建商在 20 世纪 60 年代初率先采用，普通挖掘承建商在 60 年代末跟进。竞争基础由“容量和半径是否够大”转向“能否更可靠、安全地完成任务”。
    source_heading: 七、在缆索和液压之间作出选择
  - term: 九、作者如何用本章检验理论
    meaning: 高端退守也是策略。部分缆索厂商在采矿和起重领域生存，说明破坏不必消灭旧技术，而可能把它推向专业高端。
    source_heading: 九、作者如何用本章检验理论
  - term: 十二、本章总结
    meaning: 本章最重要的认识是：成熟企业不是因为做了明显错误的事而失败，而是因为它们把正确的管理方法用在了不匹配的创新情境中。只服务当前最重要的客户，会把资源合理地投向延续性改善；要应对破坏性创新，还必须找到当前就重视新属性的客户和任务，让新业务在适合它的价值网里成长。
    source_heading: 十二、本章总结
  logic:
  - 一、本章的问题、作用与结论
  - 三、破坏性液压技术的影响
