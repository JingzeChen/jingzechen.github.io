  question: 1. 本章要建立什么“基石”？
  question_source: 1. 本章要建立什么“基石”
  thesis: 动态副本一致的核心不是复制最终数据，而是让确定性状态机执行同一有序命令。
  thesis_source: 10. 本章知识结构总结
  concepts:
  - term: 1. 本章要建立什么“基石”
    meaning: 缺少其中任何一类，系统仍可能在演示环境中运行，却很难在节点动态变化、流量突发和故障必然发生的生产环境中可靠运行。
    source_heading: 1. 本章要建立什么“基石”
  - term: 3. 从类库到服务
    meaning: Zuul 1 的 Thread-per-Connection 与 Zuul 2 / Netty 事件驱动模型体现了线程数量和上下文切换差异。原书把
      Zuul 2 概括为异步 I/O，严格说 Netty 在 Linux 上通常基于 epoll 多路复用，应用 API 是异步事件式，底层不必是 POSIX
      AIO。今天还有 io_uring 等机制，仍应以真实内核、运行时和后端负载压测，不能仅凭模型名称宣称快多少。
    source_heading: 3. 从类库到服务
  - term: 5. 可靠通讯
    meaning: 原章示例还让浏览器前端使用 Resource Owner Password Credentials（Password Grant）。这是理解
      2020 年工程版本所需的历史事实，但不能作为当前实践：RFC 9700 已明确规定该模式 MUST NOT 使用，因为客户端直接接触用户密码会扩大凭证泄漏面，也不适配
      MFA、WebAuthn 等流程。交互式用户登录应采用 Authorization Code + PKCE，并在需要身份语义时使用 OpenID Connect；Client
      Credentials 只用于应用自身的机器身份。
    source_heading: 5. 可靠通讯
  - term: 6. 可观测性
    meaning: 时间序列由 Timestamp、Metric Name、Labels、Value 构成，适合追加、压缩、按时间查询和保留策略。TSDB 常使用
      WAL、块压缩和类似 LSM 的顺序写思想；原书把时序库统一概括为 LSM-Tree 是便于理解，具体 Prometheus TSDB 有自己的 Head
      Block、WAL、Immutable Block 与 Compaction 结构，并非简单套用通用 LSM。
    source_heading: 6. 可观测性
  - term: 9. 架构师解决分布式问题的一般方法
    meaning: 然后列出允许的故障：Crash、消息丢失、延迟、乱序、网络分区，是否考虑 Byzantine。算法只有在它声明的模型内才正确。
    source_heading: 9. 架构师解决分布式问题的一般方法
  - term: 11. 主动回忆题
    meaning: Failover、Failfast、Failsafe、Failsilent、Failback 如何区分？
    source_heading: 11. 主动回忆题
