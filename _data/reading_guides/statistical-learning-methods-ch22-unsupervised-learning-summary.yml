  kind: summary
  minutes: 8
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 无监督学习不是一组互不相干的算法，而是一套从任务选择表示假设、从模型确定学习目标、再用矩阵分解、特征值计算或隐变量推断求解的体系；真正可靠的结果既要优化正确，也要在重采样、外部任务和领域解释中稳定有用。
  thesis_source: 第 22 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 同一个基础算法可以服务多个模型：SVD 同时支撑 PCA 和 LSA；EM 同时支撑高斯混合与 PLSA；MCMC 同时用于一般贝叶斯后验和
      LDA；幂法用于矩阵主特征向量和 PageRank。
    source_heading: 0. 本章解决什么问题
  - term: 22.1 无监督学习方法的关系和特点
    meaning: 例如 PCA 不是 SVD：PCA 是“中心化数据在低维正交空间中保留最大方差”的模型与策略，SVD 是计算其解的一种算法。LDA 也不是
      Gibbs：LDA 是生成模型，Gibbs 和变分推理是两种后验推断方法。
    source_heading: 22.1 无监督学习方法的关系和特点
  - term: 22.3 【补充】可运行代码：四类任务的统一实验
    meaning: 代码展示的不是“所有无监督算法都单调优化同一个目标”，而是每类方法有自己的正确性证据：距离目标、似然、方差、重构误差或固定点残差。
    source_heading: 22.3 【补充】可运行代码：四类任务的统一实验
  - term: 22.4 【补充】如何选择无监督学习方法
    meaning: SVD/LSA 可用 TF-IDF，概率话题模型通常以非负计数为输入；
    source_heading: 22.4 【补充】如何选择无监督学习方法
  - term: 22.7 【补充】一套完整的无监督建模流程
    meaning: 监控数值量：目标单调性、ELBO、似然、重构误差、固定点残差；
    source_heading: 22.7 【补充】一套完整的无监督建模流程
  - term: 22.8 本章知识清单
    meaning: 原书第 22 章没有设置章末习题。本笔记用前面的统一推导、综合代码和方法选择流程代替机械练习，作为第二篇的整体复盘。
    source_heading: 22.8 本章知识清单
  logic:
  - 0. 本章解决什么问题
  - 22.1 无监督学习方法的关系和特点
  - 22.2 话题模型之间的关系和特点
  - 22.4 【补充】如何选择无监督学习方法
  - 22.5 【补充】没有标签时如何评估
  - 22.7 【补充】一套完整的无监督建模流程
