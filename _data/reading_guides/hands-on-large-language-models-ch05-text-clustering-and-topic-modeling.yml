  sections:
  - title: 0. 阅读地图：先发现结构，再解释结构
    source_heading: 0. 阅读地图：先发现结构，再解释结构
    paragraphs:
    - 文本聚类（text clustering）回答：哪些文档在语义上属于同一组？ 主题建模（topic modeling）进一步回答：每一组在谈什么？
    - 第一条管线决定 cluster assignment；第二条只解释已有 cluster。这个分离是 BERTopic 模块化设计的关键：可以换表示而不重跑聚类，也可以换聚类器而继续使用
      c-TF-IDF。
    - 没有训练标签，并不意味着不存在选择：embedding model、UMAP 参数、距离、cluster size、关键词数量和提示都会改变结果。无监督方法把“标签监督”换成了归纳偏置、稳定性评估与人工解释。
    - 它不自动证明发现的主题是客观真相。主题是数据、表示、算法和参数共同构造的分析视角。
  - title: '1. ArXiv 的 Computation and Language 论文（ArXiv’s Articles: Computation and
      Language）'
    source_heading: '1. ArXiv 的 Computation and Language 论文（ArXiv’s Articles: Computation
      and Language）'
    paragraphs:
    - 该语料规模足以产生多种 NLP 子领域，又有标题、摘要和年份等元数据，适合聚类与主题分析。
    - 非英语文本、公式、LaTeX 和异常字符。
    - 摘要长度及 embedding model 的截断比例。
    - 如果大量摘要超过模型上下文而被截断，聚类实际依据只是摘要前部。应记录 token 长度分布，必要时做分块、池化或选择长文本 embedding model。
  - title: 2. 文本聚类的通用流水线（A Common Pipeline for Text Clustering）
    source_heading: 2. 文本聚类的通用流水线（A Common Pipeline for Text Clustering）
    paragraphs:
    - 维度增加时，空间体积迅速膨胀，数据相对稀疏；许多分布中最近距离与最远距离的差异相对缩小，称为 distance concentration。密度和邻域因此更难稳定估计，这属于“维度灾难”的表现。
    - 5 到 10 维是经验起点，不是理论最优。应联合 cluster stability、outlier ratio、topic coherence 与人工检查选择。
    - UMAP 在原空间用 cosine 建图后产出低维坐标，HDBSCAN 再用 Euclidean 距离聚类是 BERTopic 的常见组合，并不矛盾。
    - 若有少量已知标签，可用 adjusted Rand index、normalized mutual information 等外部指标，但它们衡量的是与那套标签的一致性，不是唯一合理结构。
  - title: 3. 从文本聚类到主题建模（From Text Clustering to Topic Modeling）
    source_heading: 3. 从文本聚类到主题建模（From Text Clustering to Topic Modeling）
    paragraphs:
    - 聚类输出整数 ID，不提供语义名称。主题建模为簇建立可读表示，例如关键词、短语、标题、摘要或多视角描述。
    - 因此一篇文档可以混合多个主题。LDA 主要依赖 bag-of-words，不直接利用词序与上下文语义。
    - 它并非 LDA 的神经版，也不天然提供同样的混合成员生成模型；可通过 probabilities 等功能表达软关联，但基本归纳偏置不同。
  - title: '4. BERTopic：模块化主题建模框架（BERTopic: A Modular Topic Modeling Framework）'
    source_heading: '4. BERTopic：模块化主题建模框架（BERTopic: A Modular Topic Modeling Framework）'
    paragraphs:
    - embedding 决定语义邻近，UMAP 重塑低维邻域，HDBSCAN 划定密度簇。任何一个组件变化都可能改变 topic assignment。
    - 因此可扩展到 guided、semi-supervised、hierarchical、dynamic、multimodal、online、zero-shot
      topic modeling。但“能替换”不表示组件任意组合都兼容；接口、距离和输入形状仍需满足契约。
    - 原章中 query “topic modeling” 找到 topic 22，其高权重词包含 topic、LDA、latent、Dirichlet 等；BERTopic
      论文本身也被分到 22，构成有用的 sanity check，而不是完整质量证明。
    - 它衡量词共同出现是否超出独立预期。Coherence 高不一定 topic 对业务有用；LLM 生成的流畅标签也可能掩盖簇内部不一致。
  - title: 5. 添加一个特殊积木（Adding a Special Lego Block）
    source_heading: 5. 添加一个特殊积木（Adding a Special Lego Block）
    paragraphs:
    - c-TF-IDF 快、可解释，但仍是 bag-of-words，不理解同义词、词序和上下文。合理策略不是丢掉它，而是让它做高召回候选生成，再用较慢的语义模型
      rerank。
    - 若修改分词或主题表示，topic ID 通常不变；若要改变簇，必须重跑前半管线或使用 topic reduction/outlier 工具。
    - 按候选词与 topic embedding 的 cosine similarity 重排。
    - 原章中摘要 topic 从多个 summary 词形扩展到 document、extractive、ROUGE 等信息，表示覆盖面更广。
  - title: 6. 文本生成积木（The Text Generation Lego Block）
    source_heading: 6. 文本生成积木（The Text Generation Lego Block）
    paragraphs:
    - 生成模型不必逐篇给 44,949 篇文档分类。BERTopic 先为每个 topic 选少量代表文档与关键词，再调用生成模型一次产生短标签。
    - 只给关键词可能歧义，只给长文档成本高且容易偏向个别样本。两者结合是在压缩成本与保留证据间折中。
    - 多视角之间的不一致本身是诊断信号：如果 LLM label 与关键词相冲突，应回到代表文档，而不是默认相信更流畅的输出。
    - Medoid 是簇内与其他点总体距离较小的真实文档点，不同于可能不存在于数据中的 centroid。用 medoid 放置标签通常比几何均值更贴近实际样本。
  - title: 8. 总结（Summary）
    source_heading: 8. 总结（Summary）
    paragraphs:
    - 常见管线是 embedding → dimensionality reduction → clustering；三个组件共同决定结果。
    - 主题建模在 cluster assignment 之外增加可读表示；BERTopic 默认不同于 LDA 的混合 topic 生成模型。
    - 版本化全部组件：embedding、UMAP、HDBSCAN、vectorizer、representation model 与 prompt 共同定义一次结果。
    - 本章最重要的方法论是“先用廉价、可扩展方法缩小候选，再用昂贵模型提高解释质量”。语义模型、经典统计和生成模型不是互相淘汰，而是在同一系统中分别承担分组、证据和表达职责。
  takeaways:
