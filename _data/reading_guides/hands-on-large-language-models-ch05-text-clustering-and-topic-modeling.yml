    meaning: 如果大量摘要超过模型上下文而被截断，聚类实际依据只是摘要前部。应记录 token 长度分布，必要时做分块、池化或选择长文本 embedding
      model。
    source_heading: '1. ArXiv 的 Computation and Language 论文（ArXiv’s Articles: Computation
      and Language）'
  - term: 3. 从文本聚类到主题建模（From Text Clustering to Topic Modeling）
    meaning: 聚类输出整数 ID，不提供语义名称。主题建模为簇建立可读表示，例如关键词、短语、标题、摘要或多视角描述。
    source_heading: 3. 从文本聚类到主题建模（From Text Clustering to Topic Modeling）
  - term: '4. BERTopic：模块化主题建模框架（BERTopic: A Modular Topic Modeling Framework）'
    meaning: 原章中 query “topic modeling” 找到 topic 22，其高权重词包含 topic、LDA、latent、Dirichlet
      等；BERTopic 论文本身也被分到 22，构成有用的 sanity check，而不是完整质量证明。
    source_heading: '4. BERTopic：模块化主题建模框架（BERTopic: A Modular Topic Modeling Framework）'
  - term: 6. 文本生成积木（The Text Generation Lego Block）
    meaning: Medoid 是簇内与其他点总体距离较小的真实文档点，不同于可能不存在于数据中的 centroid。用 medoid 放置标签通常比几何均值更贴近实际样本。
    source_heading: 6. 文本生成积木（The Text Generation Lego Block）
