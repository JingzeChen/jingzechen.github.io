  - 若有少量已知标签，可用 adjusted Rand index、normalized mutual information 等外部指标，但它们衡量的是与那套标签的一致性，不是唯一合理结构。
  - 它衡量词共同出现是否超出独立预期。Coherence 高不一定 topic 对业务有用；LLM 生成的流畅标签也可能掩盖簇内部不一致。
  - 原章中摘要 topic 从多个 summary 词形扩展到 document、extractive、ROUGE 等信息，表示覆盖面更广。
  - 本章最重要的方法论是“先用廉价、可扩展方法缩小候选，再用昂贵模型提高解释质量”。语义模型、经典统计和生成模型不是互相淘汰，而是在同一系统中分别承担分组、证据和表达职责。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.2 聚类不等于主题建模」？
  answer: 聚类只给 membership；主题建模还需要 topic representation。BERTopic 用 clustering 实现一种主题建模路线，但
    LDA 等方法可直接学习 document-topic mixture。
  source_heading: 7.2 聚类不等于主题建模
- level: 概念辨析
  question: 原文如何解释「7.6 离群点不等于坏数据」？
  answer: 它可能是错误、罕见主题、跨主题文档，也可能只是参数过于严格。需要抽样检查后决定删除、保留或重分配。
  source_heading: 7.6 离群点不等于坏数据
- level: 概念辨析
  question: 原文如何解释「7.9 c-TF-IDF 不是普通文档 TF-IDF」？
  answer: 它先把同 topic 文档合并为 class document，再比较不同类中的词。权重解释的是“词对该 topic 的区分性”，不是对单篇论文的重要性。
  source_heading: 7.9 c-TF-IDF 不是普通文档 TF-IDF
- level: 概念辨析
  question: 原文如何解释「7.12 MMR 的多样性不是正确性」？
  answer: 去掉重复词能增加覆盖，但 diversity 过高会选入边缘词，降低 topic fidelity。相关性与新颖性必须联合调节。
  source_heading: 7.12 MMR 的多样性不是正确性
- level: 概念辨析
  question: 原文如何解释「7.14 漂亮的可视化不是评估」？
  answer: 视觉分离可能由 UMAP 参数制造。应结合稳定性、coherence、diversity、outlier ratio、人工检查和下游效用。
  source_heading: 7.14 漂亮的可视化不是评估
