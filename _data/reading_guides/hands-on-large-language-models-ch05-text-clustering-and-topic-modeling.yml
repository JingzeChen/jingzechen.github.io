  - term: 0. 阅读地图：先发现结构，再解释结构
    meaning: 没有训练标签，并不意味着不存在选择：embedding model、UMAP 参数、距离、cluster size、关键词数量和提示都会改变结果。无监督方法把“标签监督”换成了归纳偏置、稳定性评估与人工解释。
    source_heading: 0. 阅读地图：先发现结构，再解释结构
