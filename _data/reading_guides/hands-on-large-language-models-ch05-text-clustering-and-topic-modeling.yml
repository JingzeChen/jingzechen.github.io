    meaning: 本章最重要的方法论是“先用廉价、可扩展方法缩小候选，再用昂贵模型提高解释质量”。语义模型、经典统计和生成模型不是互相淘汰，而是在同一系统中分别承担分组、证据和表达职责。
    source_heading: 8. 总结（Summary）
