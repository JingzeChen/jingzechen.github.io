  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - 作出 architectural decisions 是架构师的核心职责之一。Decision 常涉及 application/system structure，也可能指定
      technology；只要 technology choice 影响 architecture characteristics，它仍然是 architectural
      decision。
    - 只完成“选技术”远远不够。没有理由，团队会重复争论；没有记录，决定会丢失；没有传播，相关人员不会执行；没有 compliance，决定只是一份愿望；没有
      supersession history，未来的人无法理解为何变化。
    - 架构决策的价值不只在“选了什么”，更在于让组织长期知道为什么选、接受了什么代价、如何证明仍在遵守，以及何时应该改变。
    - 原章没有给出正式数学优化算法。本文中的总损失函数、ADR linter、决策分类表和治理清单属于教学扩展，不是作者规定的标准。原章示例自身有少量术语不一致，本文会明确说明，不会静默修成看似一致。
  - title: 1. Architectural Decision Antipatterns：架构决策反模式
    source_heading: 1. Architectural Decision Antipatterns：架构决策反模式
    paragraphs:
    - Week 2 的总损失最低；比较 week 2 到 week 3 的估算时，新增 cost 20 已超过 risk reduction 17，说明阈值位于两者之间，因此最迟应在
      week 2 评审时拍板，而不是等到 week 3。真实项目不会有如此精确数字，代码只展示如何把模糊争论变成证据讨论。
    - 这不是团队“违反架构”，而是 decision 的 context 不完整。协作让 architect 及时知道问题并调整，例如改用 distributed
      cache、只复制热点 subset 或重新划数据边界。
    - 团队不知道 architect 为什么作出 decision，于是不断重新讨论同一问题，无法达成 final resolution。名称来自 1993
      年电影 Groundhog Day，Bill Murray 的角色每天重复 2 月 2 日。
    - Broadcast 给所有人会造成 notification fatigue；只通知少数人却藏起 repository 会造成不可发现。应把 targeted
      push 与 searchable pull 结合。
  - title: 2. Architectural Significance：架构显著性
    source_heading: 2. Architectural Significance：架构显著性
    paragraphs:
    - "“指定某 technology 就只是技术决定”是误区。若 technology 直接支持/影响重要 architecture characteristic，它就是
      architectural decision。"
    - 这里指重要 architecture characteristics。若 technology choice 影响关键 performance、scalability、availability
      等，即使具体到 product/framework，也具有架构显著性。
    - Interface decisions 常需要定义 contracts、versioning 和 deprecation strategies，并影响外部
      consumers，因此具有架构意义。
    - Platforms、frameworks、tools，甚至 processes 若影响 architecture，也属于 architecture decision。例如统一
      deployment pipeline、schema migration technique、fitness-function framework。
  - title: 4.1 Create
    source_heading: 4.1 Create
    paragraphs:
    - 识别 architecturally significant issue；
    - 收集 Context 和 alternatives；
    - 等到 last responsible moment；
    - 与 development teams 协作验证。
  - title: 4.2 Review
    source_heading: 4.2 Review
    paragraphs:
    - 可设 RFC + deadline；
    - 获取直接 stakeholders 反馈；
    - 根据 cost/cross-team/security 决定 approval level。
  - title: 4.3 Decide
    source_heading: 4.3 Decide
    paragraphs:
    - 用 commanding voice；
    - 写 technical/business justification；
    - 诚实记录 Consequences；
  - title: 4.4 Communicate
    source_heading: 4.4 Communicate
    paragraphs:
    - 写入 single system of record；
    - Email 只含 context + link。
  - title: 4.6 Evolve
    source_heading: 4.6 Evolve
    paragraphs:
    - Context 改变时创建新 ADR；
    - 旧 ADR 标记 Superseded by N；
    - 新 ADR 标记 Accepted, supersedes M；
    - 保留完整 rationale history。
  - title: 6. 一般化的问题解决方法
    source_heading: 6. 一般化的问题解决方法
    paragraphs:
    - 检查 structure、characteristics、dependencies、interfaces、construction techniques
      和长期影响。
    - 明确继续等待能获得什么 evidence、会增加什么 delay/rework cost；当 cost 增量超过 risk reduction 时决定。
    - 把 time to market、user satisfaction、growth、cost 等 concern 映射到 architecture characteristics。
    - 确定 observable evidence、fitness function/manual review、频率、owner 和 violation response。
  - title: 8. 核心结论
    source_heading: 8. 核心结论
    paragraphs:
    - Email-Driven Architecture 来自错误存储与传播。 Email 只通知 context/link，ADR repository 是
      single source of record。
    - Technology choice 也可能 architecturally significant。 判断标准是 structure、characteristics、dependencies、interfaces、construction
      techniques。
    - ADR 是短而持久的 rationale record。 标准五段是 Title、Status、Context、Decision、Consequences；作者建议增加
      Compliance、Notes。
    - 原章 ADR 76 有术语不一致。 Decision/图形是 point-to-point queues，caption/Compliance 却写 pub/sub；实际
      ADR 必须修正。
  takeaways:
  - 架构师的核心职责之一是作出 architecture decisions。 目标是指导 teams 做正确的技术选择，而非展示个人权威。
  - Technology choice 也可能 architecturally significant。 判断标准是 structure、characteristics、dependencies、interfaces、construction
    techniques。
  - Context 写 forces，Decision 写明确选择与 Why，Consequences 写完整 trade-offs。 三者不能混用。
  - ADR 可成为架构文档和标准的 rationale 层。 它不能替代 diagrams/runbooks，但能解释 Why 和 evolution。
  - 在最后责任时刻作出有业务与技术依据的明确选择，把 Why、Consequences 和 Compliance 写进唯一可追溯的 ADR，并让未来的改变通过新决策延续历史，而不是覆盖历史。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「5.1 Architecture Decision 只涉及 Structure，不涉及 Technology」？
  answer: 错误。Technology 若影响 architecture characteristics、dependencies、interfaces 或
    construction techniques，就具有架构显著性。
  source_heading: 5.1 Architecture Decision 只涉及 Structure，不涉及 Technology
- level: 概念辨析
  question: 原文如何解释「5.6 Business Justification 等于永远写 Cost Saving」？
  answer: 错误。还包括 time to market、user satisfaction、strategic positioning，必须匹配 stakeholders
    priorities。
  source_heading: 5.6 Business Justification 等于永远写 Cost Saving
- level: 概念辨析
  question: 原文如何解释「5.14 Context 应写成支持已选方案的论证」？
  answer: 错误。Context 描述 forces 和 alternatives；Decision 才写选择与 justification。
  source_heading: 5.14 Context 应写成支持已选方案的论证
- level: 概念辨析
  question: 原文如何解释「5.19 ADR 只能用于新系统」？
  answer: 错误。既有系统更需要恢复 why、验证历史决定和建立 brain trust。
  source_heading: 5.19 ADR 只能用于新系统
- level: 概念辨析
  question: 原文如何解释「5.24 ADR 76 的 Compliance 与 Decision 完全一致」？
  answer: 原文不一致。Decision 是 separate point-to-point queues；Compliance/caption 误写 pub/sub。真实
    ADR 必须让 Compliance 精确验证 Decision。
  source_heading: 5.24 ADR 76 的 Compliance 与 Decision 完全一致
