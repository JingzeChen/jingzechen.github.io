overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 恢复增长：两年补课后，小米从 2017 年重新进入增长。 +> 上市新问题：资本市场可能推动公司追求更高的短期硬件利润。 +> 制度解法：上市前由董事会确定硬件综合净利润率不超过
    5%。 +> 为什么不是 3%：为汇率和国际经营波动保留合理余量。 +> 承诺范围：硬件综合净利润率，不是集团全部利润，也不是单品毛利率。 +> 长期逻辑：克制硬件利润，以用户信任、规模、效率和持续服务获得合理回报。
    +> 全球化路径：先进入条件相似的印度，再进入更成熟复杂的欧洲。 +> 普适与本地化：高品质和合理价格是共同方向，产品、渠道、服务与合规必须因地制宜。 +>
    核心启示：企业变大后，使命要从创始人的信念变成可执行、可监督、能长期坚持的制度。
  thesis_source: 九、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 上市后，资本市场要求利润增长，小米怎样继续坚持价格厚道？
    source_heading: 一、本章主线
  - term: 三、上市带来的新问题
    meaning: 2018 年 7 月 9 日，小米在香港上市，成为港股第一家同股不同权的上市公司，并成为当时全球规模最大的科技公司 IPO 之一。
    source_heading: 三、上市带来的新问题
  - term: 5.3 四年数据能够说明什么
    meaning: 原书指出，2018 至 2021 年财报均显示硬件综合净利润率低于 5%，同时公司营收和利润总额继续增长。
    source_heading: 5.3 四年数据能够说明什么
  - term: 5.4 平均售价上升是否违背价格厚道
    meaning: 手机平均售价和公司利润提升，不一定表示同样产品被卖得更贵。平均售价也可能因为用户购买了配置更高、成本更高的产品而上升。
    source_heading: 5.4 平均售价上升是否违背价格厚道
  - term: 七、走向全球
    meaning: 公开市场通常指非运营商合约渠道。西班牙公开市场第一，说明小米在零售和电商渠道表现突出，但不一定等于包含全部运营商渠道后的整体市场第一。
    source_heading: 七、走向全球
  - term: 九、本章方法论总结
    meaning: 恢复增长：两年补课后，小米从 2017 年重新进入增长。 +> 上市新问题：资本市场可能推动公司追求更高的短期硬件利润。 +> 制度解法：上市前由董事会确定硬件综合净利润率不超过
      5%。 +> 为什么不是 3%：为汇率和国际经营波动保留合理余量。 +> 承诺范围：硬件综合净利润率，不是集团全部利润，也不是单品毛利率。 +> 长期逻辑：克制硬件利润，以用户信任、规模、效率和持续服务获得合理回报。
      +> 全球化路径：先进入条件相似的印度，再进入更成熟复杂的欧洲。 +> 普适与本地化：高品质和合理价格是共同方向，产品、渠道、服务与合规必须因地制宜。
      +> 核心启示：企业变大后，使命要从创始人的信念变成可执行、可监督、能长期坚持的制度。
    source_heading: 九、本章方法论总结
  logic:
  - 一、本章主线
  - 三、上市带来的新问题
  - 四、把使命写进制度：硬件综合净利润率 5% 红线
  - 5.4 平均售价上升是否违背价格厚道
  - 6.2 不能把榜单当成最终目标
  - 8.3 海外收入占一半意味着什么
