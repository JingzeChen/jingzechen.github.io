  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: 注意这里的”强行”：即使某个叶结点里 60% 是正类、40% 是负类，落入该叶的所有实例都被判为正类。这与第 4 章”0-1 损失下取条件众数”完全一致——决策树的叶结点做的就是局部的多数表决，和
    k-NN 的邻域表决在思想上是相通的，区别只在于”邻域”是怎么定义的（k-NN 用距离，决策树用特征测试）。
  thesis_source: 5.1 决策树模型与学习
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 前四章的模型各有各的”不可读”之处：感知机给出一个权重向量，k-NN 给出一堆邻居，朴素贝叶斯给出一堆概率表。而决策树给出的是一棵可以直接念出来的树。这种可解释性使它在金融风控、医疗诊断等需要向人解释决策依据的领域长期占据重要地位。
    source_heading: 0. 本章解决什么问题
  - term: 5.1 决策树模型与学习
    meaning: 注意这里的”强行”：即使某个叶结点里 60% 是正类、40% 是负类，落入该叶的所有实例都被判为正类。这与第 4 章”0-1 损失下取条件众数”完全一致——决策树的叶结点做的就是局部的多数表决，和
      k-NN 的邻域表决在思想上是相通的，区别只在于”邻域”是怎么定义的（k-NN 用距离，决策树用特征测试）。
    source_heading: 5.1 决策树模型与学习
  - term: 5.3 决策树的生成
    meaning: 对表 5.1，由 5.2.7 节的计算，C4.5 选出的特征与 ID3 一致（根结点 A_3），最终得到同一棵树。这在小数据、特征取值数相近时是常见的——增益比的修正只在取值数差异大时才明显。
    source_heading: 5.3 决策树的生成
  - term: 5.4 决策树的剪枝
    meaning: 预剪枝的致命弱点是”视野短”：当前划分增益很小，不代表再往下划分收益也小。经典的例子是 XOR 型结构——单看任何一个特征增益都是 0，但两个特征组合起来能完美分类。预剪枝会在第一步就停下，后剪枝则能发现这种结构。
    source_heading: 5.4 决策树的剪枝
  - term: 5.7 深入理解
    meaning: 一个有意思的对照：朴素贝叶斯假设特征条件独立（不考虑交互），决策树则通过路径上的特征组合天然表达交互。二者在归纳偏好上恰好互补——这也解释了为什么它们在不同类型的任务上各有胜负。
    source_heading: 5.7 深入理解
  - term: 5.8 本章方法论总结
    meaning: 决策树学习 = 特征选择 + 树的生成 + 树的剪枝；生成管局部拟合，剪枝管全局泛化。
    source_heading: 5.8 本章方法论总结
