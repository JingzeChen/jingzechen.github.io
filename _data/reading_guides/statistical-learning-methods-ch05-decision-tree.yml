  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 能不能用一串可读的判断规则来做分类？比如”有房子吗？没有 → 有工作吗？有 → 批准贷款”。
    - 前四章的模型各有各的”不可读”之处：感知机给出一个权重向量，k-NN 给出一堆邻居，朴素贝叶斯给出一堆概率表。而决策树给出的是一棵可以直接念出来的树。这种可解释性使它在金融风控、医疗诊断等需要向人解释决策依据的领域长期占据重要地位。
    - 理解这个”生成管拟合、剪枝管泛化”的分工，就抓住了本章的骨架。这也正是第 1 章”经验风险最小化 vs 结构风险最小化”的又一个具体实例。
    - 决策树的边界是平行于坐标轴的折线/超矩形——这既是它的特点，也是它的局限（见 5.7.3 节）。
  - title: 5.1 决策树模型与学习
    source_heading: 5.1 决策树模型与学习
    paragraphs:
    - 注意这里的”强行”：即使某个叶结点里 60% 是正类、40% 是负类，落入该叶的所有实例都被判为正类。这与第 4 章”0-1 损失下取条件众数”完全一致——决策树的叶结点做的就是局部的多数表决，和
      k-NN 的邻域表决在思想上是相通的，区别只在于”邻域”是怎么定义的（k-NN 用距离，决策树用特征测试）。
    - 与训练数据不矛盾的树往往有无穷多棵（例如把树做得足够深，总能记住每个样本）。我们要的不是”任意一棵能拟合的树”，而是”拟合得好且足够简单的树”——这正是第
      1 章正则化思想的应用。
    - 为什么这么难？ 直觉上，因为特征的选择顺序会互相影响：当前看起来最好的特征，可能会让后续的划分变得很差；而当前看起来平庸的特征，可能为后续留下漂亮的结构。要保证全局最优，必须搜索指数级的组合。
    - 这是算法设计中的典型权衡。本章后面所有的算法（ID3、C4.5、CART）都是贪心的，它们的区别只在于”当前最优”如何度量。理解这一点很重要：决策树学习的所有”准则之争”，都是在争论如何做好这一步贪心。
  - title: 5.2 特征选择
    source_heading: 5.2 特征选择
    paragraphs:
    - 记 A_1=年龄，A_2=有工作，A_3=有自己的房子，A_4=信贷情况。共 15 个样本，其中 9 个”是”、6 个”否”。
    - 直觉上，好的特征应该让划分出来的子集尽可能”纯”——最好每个子集里全是同一类。例如若用”有自己的房子”划分，”是”的那一组恰好全是批准，非常干净。
    - 解读：A_3 之所以胜出，是因为它把 6 个样本一刀切成完全纯净的一组（有房子的全部批准），剩下的 9 个虽然还混杂，但整体不确定性下降最多。而 A_1（年龄）三组都还很混杂，几乎没提供什么信息。
    - 为什么会这样？ 因为取值越多，划分越细，每个子集样本越少，越容易”碰巧”纯净。这是过拟合在特征选择阶段的表现：信息增益只衡量了”划分后有多纯”，却没有惩罚”划分得有多碎”。
  - title: 5.3 决策树的生成
    source_heading: 5.3 决策树的生成
    paragraphs:
    - A_2（有工作）在 D_2 中：有工作 3 个（ID 3,13,14，全是”是”）、无工作 6 个（ID 1,2,5,6,7,15，全是”否”）
    - ID3 的问题：算法只有生成、没有剪枝，容易过拟合。本例数据规整才恰好得到简洁的树；数据一旦有噪声，ID3 会一直分裂到每个叶结点纯净为止。
    - 对表 5.1，由 5.2.7 节的计算，C4.5 选出的特征与 ID3 一致（根结点 A_3），最终得到同一棵树。这在小数据、特征取值数相近时是常见的——增益比的修正只在取值数差异大时才明显。
    - 因为算法的停止条件是”结点纯净”或”特征用完”，它会不断细分直到把训练集完全记住。落在深层叶结点的样本可能只有一两个，其类别完全由噪声决定。
  - title: 5.4 决策树的剪枝
    source_heading: 5.4 决策树的剪枝
    paragraphs:
    - 剪枝就是加正则：从 MLE 变成了带惩罚的 MLE。这与第 4 章”贝叶斯估计 = MAP = 正则化 MLE”是同一个思想在不同模型上的体现。
    - 三章串联：第 1 章提出”结构风险 = 经验风险 + 正则项”，第 4 章用先验实现正则（平滑），第 5 章用叶结点数实现正则（剪枝）。同一套方法论，三种具体形态。
    - 为什么必须自底向上？ 因为判断一个内部结点该不该剪，需要先知道它的子树在剪枝后长什么样。自顶向下会导致重复计算和错误决策。
    - 预剪枝的致命弱点是”视野短”：当前划分增益很小，不代表再往下划分收益也小。经典的例子是 XOR 型结构——单看任何一个特征增益都是 0，但两个特征组合起来能完美分类。预剪枝会在第一步就停下，后剪枝则能发现这种结构。
  - title: 5.5 CART 算法
    source_heading: 5.5 CART 算法
    paragraphs:
    - CART（Classification And Regression Tree，分类与回归树，Breiman 等，1984）是应用最广泛的决策树算法，scikit-learn
      等主流库的实现都基于它。
    - 结论：最优输出就是该区域的样本均值。 这与第 1 章”平方损失下最优预测是条件均值”完全一致——只不过这里的”条件”是”落在区域 R_m”。
    - 为什么不用分类误差率？ 因为误差率对概率变化不够敏感。它是分段线性的，在很多划分下取值不变，导致算法难以区分好坏划分。而熵和基尼都是严格凹函数，对纯度提升更敏感。这是划分准则设计的一个重要考量。
    - 这个方法称为最弱连接剪枝（weakest link pruning），也叫代价复杂度剪枝（cost-complexity pruning）。
  - title: 5.7 深入理解
    source_heading: 5.7 深入理解
    paragraphs:
    - 现代库（scikit-learn、XGBoost、LightGBM）基本都基于 CART，因为二叉结构规整、易优化，且能统一处理分类与回归。
    - 不稳定性其实是集成学习的契机：正因为单棵树方差大、彼此差异大，把多棵树平均起来（随机森林）或串行提升（GBDT）才能大幅降低方差。这一点第 8 章会展开。
    - 反过来说，当真实结构本来就是”分段常数 + 阈值判断”时（很多业务规则就是这样），决策树是最自然的选择。模型的归纳偏好要与问题结构匹配，这是选型的根本原则。
    - 一个有意思的对照：朴素贝叶斯假设特征条件独立（不考虑交互），决策树则通过路径上的特征组合天然表达交互。二者在归纳偏好上恰好互补——这也解释了为什么它们在不同类型的任务上各有胜负。
  - title: 5.8 本章方法论总结
    source_heading: 5.8 本章方法论总结
    paragraphs:
    - 决策树有三个等价视角：树结构、if-then 规则集（互斥且完备）、条件概率分布。
    - 从所有决策树中找最优树是 NP 完全问题，故一律采用贪心启发式，得到次优树。
    - 决策树学习 = 特征选择 + 树的生成 + 树的剪枝；生成管局部拟合，剪枝管全局泛化。
    - ID3 用信息增益、C4.5 用信息增益比，二者结构相同、只差选择准则。
  takeaways:
  - 决策树的边界是平行于坐标轴的折线/超矩形——这既是它的特点，也是它的局限（见 5.7.3 节）。
  - 为什么会这样？ 因为取值越多，划分越细，每个子集样本越少，越容易”碰巧”纯净。这是过拟合在特征选择阶段的表现：信息增益只衡量了”划分后有多纯”，却没有惩罚”划分得有多碎”。
  - 预剪枝的致命弱点是”视野短”：当前划分增益很小，不代表再往下划分收益也小。经典的例子是 XOR 型结构——单看任何一个特征增益都是 0，但两个特征组合起来能完美分类。预剪枝会在第一步就停下，后剪枝则能发现这种结构。
  - 这个方法称为最弱连接剪枝（weakest link pruning），也叫代价复杂度剪枝（cost-complexity pruning）。
  - ID3 用信息增益、C4.5 用信息增益比，二者结构相同、只差选择准则。
