overview:
  kind: summary
  minutes: 8
  question: 原文围绕「导读：“后刻意练习”不是不要练，而是重新定义好练习」建立了怎样的核心认识？
  question_source: 导读：“后刻意练习”不是不要练，而是重新定义好练习
  thesis: 集中和段落练习提供流畅感，间隔迫使重新检索，穿插迫使识别和选择，多样化迫使根据条件调整。四者并非简单互相排斥：高质量训练通常先用少量集中练习建立基本模型，再通过间隔、穿插和变化把模型变得持久、可辨识、能迁移，同时用反馈与反思防止错误自动化。
  thesis_source: 十三、全章总结
  concepts:
  - term: 导读：“后刻意练习”不是不要练，而是重新定义好练习
    meaning: 集中、固定、同类的重复能迅速提高练习阶段的表现，却容易依赖短时激活和情境提示；间隔、穿插和多样化会增加检索、辨识与调整的难度，使眼前表现变差，却通常形成更牢固、更灵活、更能迁移的知识和技能。
    source_heading: 导读：“后刻意练习”不是不要练，而是重新定义好练习
  - term: 三、穿插练习有助于长期记忆
    meaning: 真实解题不是只执行策略，而是先辨识题目属于哪一类，再选择对应方法，最后执行求解。段落练习主要训练“执行”，穿插练习还训练“辨识”和“选择”。
    source_heading: 三、穿插练习有助于长期记忆
  - term: 七、关于练习的几条普适性原则
    meaning: 佐治亚大学斗牛犬队教练文斯·杜利在 1964—1988 年执教，取得 201 胜、77 负、10 平，赢得 6 次分区冠军和 1 次全国冠军。
    source_heading: 七、关于练习的几条普适性原则
  - term: 八、小结
    meaning: 冰球课中，学员刚对滑冰有感觉，教练就转控球，再转射门。学员当下沮丧，却在下一周获得更全面改善。教练需要解释这种短期挫折，否则学生可能把好设计误认为教学混乱。
    source_heading: 八、小结
  - term: 一、基础概念
    meaning: 集中、间隔、段落、穿插和多样化练习分别操纵什么？
    source_heading: 一、基础概念
  - term: 十三、全章总结
    meaning: 集中和段落练习提供流畅感，间隔迫使重新检索，穿插迫使识别和选择，多样化迫使根据条件调整。四者并非简单互相排斥：高质量训练通常先用少量集中练习建立基本模型，再通过间隔、穿插和变化把模型变得持久、可辨识、能迁移，同时用反馈与反思防止错误自动化。
    source_heading: 十三、全章总结
  logic:
  - 导读：“后刻意练习”不是不要练，而是重新定义好练习
  - 三、穿插练习有助于长期记忆
