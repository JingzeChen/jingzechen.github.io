  - 八、小结
  - 4. 动态调整间隔
  - 二、实验与数据
  - 十三、全章总结
  sections:
  - title: 导读：“后刻意练习”不是不要练，而是重新定义好练习
    source_heading: 导读：“后刻意练习”不是不要练，而是重新定义好练习
    paragraphs:
    - 本章所谓“后刻意练习”，不是宣布刻意练习过时，也不是否定专注、反馈和纠错。它强调：仅仅反复做目标动作还不够，练习的时间结构、项目顺序与情境变化会决定长期学习质量。
    - 集中、固定、同类的重复能迅速提高练习阶段的表现，却容易依赖短时激活和情境提示；间隔、穿插和多样化会增加检索、辨识与调整的难度，使眼前表现变差，却通常形成更牢固、更灵活、更能迁移的知识和技能。
    - 本章最关键的反常结果就是：有些方法在练习阶段看起来更好，到了延迟测试反而更差。几何题实验的交叉结果正说明了这一点，迫使我们放弃“练习时最好就是学得最好”的直觉。
    - 它们不是同一个维度。一次训练可以同时集中且穿插，例如一小时内连续交替三种题型；也可以间隔但仍段落化，例如每周只练一种题型。设计时应分别判断时间、顺序和变化范围。
  - title: 二、间隔练习使知识存储得更牢固
    source_heading: 二、间隔练习使知识存储得更牢固
    paragraphs:
    - 间隔练习（spaced practice / distributed practice）是把针对同一知识或技能的多次练习分散到不同时间，使练习之间存在足以改变可访问性的间隔。
    - 集中练习中，相邻练习间隔很短；间隔练习中，相邻练习间隔足够长，长到学习者下一次需要重新提取，而不是无意识复述。
    - 原书列出语言强化营、单科速成学院、把职业再教育压缩到一周的研讨班和考前突击。这些形式可能帮助近期考试或提供初始框架，但若没有后续检索和应用，期末或工作现场需要时，大量内容已遗忘。
    - 实践上可以这样理解：最合适的间隔取决于材料难度、当前掌握程度和你希望保持多久，没有一刀切的固定天数。保持目标越远，后续间隔通常可以逐渐拉长。
  - title: 三、穿插练习有助于长期记忆
    source_heading: 三、穿插练习有助于长期记忆
    paragraphs:
    - 穿插练习（interleaved practice）是把两种或以上相关问题、主题或技能交替安排，并在一种练习尚未全部完成前切换到另一种。
    - 真实解题不是只执行策略，而是先辨识题目属于哪一类，再选择对应方法，最后执行求解。段落练习主要训练“执行”，穿插练习还训练“辨识”和“选择”。
    - 传统培训会把步骤 1 重复到熟，再练步骤 2，依次进行。穿插安排可在初步练几次步骤 1 后，转到步骤 4、步骤 3、步骤 7，再回到前面。
    - 这里不能把工序的真实先后顺序打乱到造成安全问题。穿插的是训练项目或故障情境，不是生产执行时必须遵守的因果顺序。对于强依赖前一步的技能，先学最小完整流程，再穿插局部、异常和变式更合理。
  - title: 五、善用练习组合，带来成长性思维
    source_heading: 五、善用练习组合，带来成长性思维
    paragraphs:
    - 本节并没有直接进行固定型与成长型思维的心理量表实验。标题更接近一种实践取向：学习者通过变化、辨识、反馈和调整，认识到能力会随练习结构改善，而不是把一次不流畅解释为“我不行”。
    - 集中看同一画家，容易发现组内相似；穿插展示让不同画家相邻出现，强化差异对比（discriminative contrast）：哪些笔触、构图和题材真正区分类别。
    - 因此分类时要综合多个线索，并按诊断价值权衡，而不是死背某一条“只要出现这个特征就一定属于某科”的定义。也就是说，学习目标是形成可比较、可加权的分类判断，而不是套一条单一规则。
    - 反对意见是：检索事实和范例只会记细节，达不到理解一般特征的水平。鸟类研究显示，若范例以穿插、多样方式出现，检索会迫使学习者辨别复杂原型和背景差异。
  - title: 七、关于练习的几条普适性原则
    source_heading: 七、关于练习的几条普适性原则
    paragraphs:
    - 佐治亚大学斗牛犬队教练文斯·杜利在 1964—1988 年执教，取得 201 胜、77 负、10 平，赢得 6 次分区冠军和 1 次全国冠军。
    - 成绩不能单独证明某个训练环节的因果效果，但球队安排展示了如何把基本功、策略、间隔、变化、团队整合和心理演练组织成系统。
    - 这练的是条件性规则：不同情境出现时，要迅速选出对应动作。多种环境训练越充分，比赛中遇到新组合时越可能找到相近模型并调整。
    - 全程身体训练会导致疲劳。球员可阅读战术，在头脑中从头到尾演练，用轻微倾身或一两步代表完整跑位，并模拟异常分支。
  - title: 八、小结
    source_heading: 八、小结
    paragraphs:
    - 评价学习效率不应只看单位时间接触了多少内容，还要看延迟后还能正确提取并应用多少内容。间隔练习当下输入速度较慢，却可能提高这种“可用效率”。
    - 冰球课中，学员刚对滑冰有感觉，教练就转控球，再转射门。学员当下沮丧，却在下一周获得更全面改善。教练需要解释这种短期挫折，否则学生可能把好设计误认为教学混乱。
    - 段落练习（blocked practice）可包含多个动作，但总按固定块或固定顺序进行，如冰球球员依次在若干固定位置完成不同动作，下一轮仍完全相同。
    - 每个病人、每场比赛、每次拦车检查都不同，并且彼此间隔。真实经验天然提供练习机会，但只有学习者注意结果并反思，经验才会更新知识。
  - title: 4. 动态调整间隔
    source_heading: 4. 动态调整间隔
    paragraphs:
    - 答错但看反馈后理解：缩短下一间隔；
    - 完全不理解：回到基础教学，不要只加测验；
    - 高风险技能：即使熟练也保留周期复训。
  - title: 一、基础概念
    source_heading: 一、基础概念
    paragraphs:
    - "“后刻意练习”为什么不等于否定刻意练习？"
    - 集中、间隔、段落、穿插和多样化练习分别操纵什么？
    - 即时表现为什么不能单独证明长期学习？
    - 穿插练习比段落练习多训练哪两个环节？
  - title: 二、实验与数据
    source_heading: 二、实验与数据
    paragraphs:
    - 外科实习医生实验如何控制课程内容，又如何测长期技能？
    - 几何题实验练习阶段和一周后的两组成绩分别是多少？
    - 变位词实验为何对固定组表面更有利，多样组仍获胜说明什么？
    - 黑鹰队赢得斯坦利杯为何不能证明多样化训练导致冠军？
  - title: 十三、全章总结
    source_heading: 十三、全章总结
    paragraphs:
    - 这些结果共同说明：让练习看起来进步最快，与让能力保存最久、适用最广，是两个不同的设计目标。
    - 集中和段落练习提供流畅感，间隔迫使重新检索，穿插迫使识别和选择，多样化迫使根据条件调整。四者并非简单互相排斥：高质量训练通常先用少量集中练习建立基本模型，再通过间隔、穿插和变化把模型变得持久、可辨识、能迁移，同时用反馈与反思防止错误自动化。
    - 练习是否跨越了时间？是否撤掉了题型提示？是否改变了情境？是否要求学习者先判断再行动？是否在未来真实任务中测试？
    - 当答案是肯定的，练习阶段可能更慢、更乱、更令人怀疑自己；但这种不流畅恰恰可能意味着，学习者不再沿着刚刚走过的短路重复，而是在建立未来仍能找到、也能通往更多情境的道路。
