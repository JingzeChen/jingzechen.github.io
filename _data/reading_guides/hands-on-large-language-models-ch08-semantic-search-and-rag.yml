overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 本章路线：检索质量决定生成上限」建立了怎样的核心认识？
  question_source: 0. 本章路线：检索质量决定生成上限
  thesis: 显式返回 documents 便于 citation validation 和调试。Source 中的推断性句子“投影格式变化可能提高票房”没有证据支持，说明即使
    prompt 有 context，生成模型仍会延伸推测；必须用 faithfulness evaluator 或 claim-level citation
    检查。
  thesis_source: 3. 检索增强生成（Retrieval-Augmented Generation (RAG)）
  concepts:
  - term: 0. 本章路线：检索质量决定生成上限
    meaning: Ranking/context failure：证据召回了，却被排得太后、截断或被噪声淹没。
    source_heading: 0. 本章路线：检索质量决定生成上限
  - term: 1. 语义搜索与 RAG 总览（Overview of Semantic Search and RAG）
    meaning: Query 与 documents 分别编码到同一向量空间，通过 nearest neighbors 召回。编码可离线完成，查询时只编码
      query，适合大规模 first-stage retrieval。
    source_heading: 1. 语义搜索与 RAG 总览（Overview of Semantic Search and RAG）
  - term: 2. 使用语言模型进行语义搜索（Semantic Search with Language Models）
    meaning: Vector database 在 ANN 之外通常提供：persistence、增删、metadata filtering、namespace/tenant、复制、备份、权限和运维。FAISS
      是索引库，不自动成为完整数据库；Pinecone、Weaviate 等提供服务能力，但选择取决于数据规模和治理需求。
    source_heading: 2. 使用语言模型进行语义搜索（Semantic Search with Language Models）
  - term: 3. 检索增强生成（Retrieval-Augmented Generation (RAG)）
    meaning: 显式返回 documents 便于 citation validation 和调试。Source 中的推断性句子“投影格式变化可能提高票房”没有证据支持，说明即使
      prompt 有 context，生成模型仍会延伸推测；必须用 faithfulness evaluator 或 claim-level citation
      检查。
    source_heading: 3. 检索增强生成（Retrieval-Augmented Generation (RAG)）
  - term: 5. 总结（Summary）
    meaning: 本章最重要的方法论是先保证“找到正确证据”，再追求“生成漂亮答案”。召回、精排和生成是不同优化问题；将它们分层评测并保留证据链，才可能构建可靠的
      RAG 系统。
    source_heading: 5. 总结（Summary）
  logic:
  - 0. 本章路线：检索质量决定生成上限
  - 1. 语义搜索与 RAG 总览（Overview of Semantic Search and RAG）
  - 2. 使用语言模型进行语义搜索（Semantic Search with Language Models）
  - 3. 检索增强生成（Retrieval-Augmented Generation (RAG)）
  - 5. 总结（Summary）
  sections:
  - title: 0. 本章路线：检索质量决定生成上限
    source_heading: 0. 本章路线：检索质量决定生成上限
    paragraphs:
    - Retrieval failure：正确证据没有被召回。
    - Ranking/context failure：证据召回了，却被排得太后、截断或被噪声淹没。
    - Generation failure：证据足够，但模型误读、忽略或添加了无依据内容。
  - title: 1. 语义搜索与 RAG 总览（Overview of Semantic Search and RAG）
    source_heading: 1. 语义搜索与 RAG 总览（Overview of Semantic Search and RAG）
    paragraphs:
    - Query 与 documents 分别编码到同一向量空间，通过 nearest neighbors 召回。编码可离线完成，查询时只编码 query，适合大规模
      first-stage retrieval。
    - Reranker 接收 query 和 first-stage candidates，逐对联合编码并重排。它更准确但更昂贵，通常只处理几十或几百个候选。
    - RAG 把 top evidence 注入生成 prompt，要求模型基于证据回答并引用来源。
    - RAG 的目标包括更新知识、使用私有数据、提供出处和降低 hallucination。它不保证真实性：检索可能错，来源可能过期，模型也可能脱离证据。
  - title: 2. 使用语言模型进行语义搜索（Semantic Search with Language Models）
    source_heading: 2. 使用语言模型进行语义搜索（Semantic Search with Language Models）
    paragraphs:
    - 原章示例得到 15 个、每个 4096 维的向量。维数由具体模型版本决定，不应写死。批量时还需处理限流、重试、缓存和 embedding version；模型升级后
      query/document vectors 必须同空间，通常需要重建索引。
    - Vector database 在 ANN 之外通常提供：persistence、增删、metadata filtering、namespace/tenant、复制、备份、权限和运维。FAISS
      是索引库，不自动成为完整数据库；Pinecone、Weaviate 等提供服务能力，但选择取决于数据规模和治理需求。
    - "“Interstellar cast”与 release-date passage 共享实体，是比随机负例更有价值的 hard negative。负例过易，模型学不到细粒度
      relevance；false negative 则会错误推远实际相关文档。"
    - Cohere 结果把含 “scientific accuracy” 的句子排第一。Relevance score 是否在 0–1、是否校准为概率取决于模型/API；通常只应用于同一
      query 的排序，不应把 0.16 当作通用“16%相关”。
  - title: 3. 检索增强生成（Retrieval-Augmented Generation (RAG)）
    source_heading: 3. 检索增强生成（Retrieval-Augmented Generation (RAG)）
    paragraphs:
    - Managed API 可返回 answer span 与 document ID 的 citation mapping。仍应保存：原 query、retrieved
      ranking、document version、模型 snapshot 和 citation offsets。文档修改后，旧字符 offset 可能失效。
    - 显式返回 documents 便于 citation validation 和调试。Source 中的推断性句子“投影格式变化可能提高票房”没有证据支持，说明即使
      prompt 有 context，生成模型仍会延伸推测；必须用 faithfulness evaluator 或 claim-level citation
      检查。
    - 搜索是 read-only 工具；“post to Notion”是写操作，不应因同一 connector 存在就自动授权。采用 least privilege、max
      steps、timeout、schema validation、human approval 与 audit log。
    - Human evaluation 仍是重要基准。LLM-as-a-judge/Ragas 可扩展评测，但 judge 会受 position、verbosity、自偏好和
      prompt injection 影响，需人工校准、固定 rubric 和多 judge/抽样复核。
  - title: 5. 总结（Summary）
    source_heading: 5. 总结（Summary）
    paragraphs:
    - Dense retrieval 将 query 与 documents 编码到同一空间，以 nearest neighbors 召回语义相关候选。
    - Retrieval fine-tuning 用 positives 与 hard negatives 学习业务 relevance，而不只是主题相似。
    - 复杂需求再升级：rewrite → multi-query → multi-hop → routing → agentic，逐级加预算和 guardrail。
    - 本章最重要的方法论是先保证“找到正确证据”，再追求“生成漂亮答案”。召回、精排和生成是不同优化问题；将它们分层评测并保留证据链，才可能构建可靠的 RAG
      系统。
  takeaways:
  - Generation failure：证据足够，但模型误读、忽略或添加了无依据内容。
  - RAG 的目标包括更新知识、使用私有数据、提供出处和降低 hallucination。它不保证真实性：检索可能错，来源可能过期，模型也可能脱离证据。
  - Cohere 结果把含 “scientific accuracy” 的句子排第一。Relevance score 是否在 0–1、是否校准为概率取决于模型/API；通常只应用于同一
    query 的排序，不应把 0.16 当作通用“16%相关”。
  - Human evaluation 仍是重要基准。LLM-as-a-judge/Ragas 可扩展评测，但 judge 会受 position、verbosity、自偏好和
    prompt injection 影响，需人工校准、固定 rubric 和多 judge/抽样复核。
  - 本章最重要的方法论是先保证“找到正确证据”，再追求“生成漂亮答案”。召回、精排和生成是不同优化问题；将它们分层评测并保留证据链，才可能构建可靠的 RAG 系统。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「4.1 Semantic similarity 不等于 retrieval relevance」？
  answer: 相关答案可能与问题措辞不同；同主题文档也可能不回答具体意图。Retriever 需要 query-document relevance 训练。
  source_heading: 4.1 Semantic similarity 不等于 retrieval relevance
- level: 概念辨析
  question: 原文如何解释「4.6 Chunk 越小不等于越精确」？
  answer: 太小会失去指代和条件；太大则稀释语义。Chunking 是 retrieval 设计变量，需按 query 测试。
  source_heading: 4.6 Chunk 越小不等于越精确
- level: 概念辨析
  question: 原文如何解释「4.10 AP 与 MAP 不是一回事」？
  answer: AP 评价单个 query ranking；MAP 对多个 queries 的 AP 求均值。nDCG 支持 graded relevance。
  source_heading: 4.10 AP 与 MAP 不是一回事
- level: 概念辨析
  question: 原文如何解释「4.13 Query rewrite 不应替换原问题」？
  answer: Rewrite 用于检索；生成和评估仍需 original question，以免丢约束。
  source_heading: 4.13 Query rewrite 不应替换原问题
- level: 概念辨析
  question: 原文如何解释「4.17 Context window 大不等于可以塞入所有结果」？
  answer: 更多噪声会降低注意力利用并增加成本。应去重、rerank、压缩，保留可支持答案的证据。
  source_heading: 4.17 Context window 大不等于可以塞入所有结果
