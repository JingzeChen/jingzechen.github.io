overview:
  kind: summary
  minutes: 8
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: PLSA 把词-文档共现解释为“文档选择隐话题、话题生成单词”的概率过程，再用 EM 将不可见话题替换为后验软计数并反复归一化；它赋予低秩话题分解清晰的概率语义，却仍受局部最优、过拟合和无法自然生成新文档的限制。
  thesis_source: 第 18 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: PLSA 由 Hofmann 于 1999 年提出。它受 LSA 启发，但把“潜在语义方向”改造成有明确归一化约束的概率分布。
    source_heading: 0. 本章解决什么问题
  - term: 18.1 概率潜在语义分析模型
    meaning: 为什么合理？文档对词的影响完全由话题中介：知道当前话题后，词的选择不再直接依赖文档编号。为什么又只是近似？同一话题在不同作者、时代和文体中仍可能使用不同词，PLSA
      不表达这种差异。
    source_heading: 18.1 概率潜在语义分析模型
  - term: 18.2 概率潜在语义分析的算法
    meaning: 若每个词元的话题标签都已知，问题反而很简单：统计“话题 k 产生词 i”和“文档 j 使用话题 k”的次数，再分别归一化即可。EM 的思路就是用后验概率补出这些不可见计数的期望。
    source_heading: 18.2 概率潜在语义分析的算法
  - term: 18.5 【补充】方法对比与选择
    meaning: 需要严谨的新文档生成、先验平滑和泛化：LDA。
    source_heading: 18.5 【补充】方法对比与选择
  - term: 必须会推导的公式
    meaning: 用拉格朗日乘子把期望软计数归一化，得到式 (18.12)、(18.13)；
    source_heading: 必须会推导的公式
  - term: 必须记住的边界
    meaning: 统计共现话题不保证等于人类期望的语义概念。
    source_heading: 必须记住的边界
  logic:
  - 0. 本章解决什么问题
  - 18.1 概率潜在语义分析模型
  - 18.2 概率潜在语义分析的算法
  - 18.5 【补充】方法对比与选择
  - 必须会推导的公式
  - 必须记住的边界
  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - "“话题权重”究竟是不是概率？SVD 中甚至存在负数；"
    - 一个文档为什么会出现这些词？矩阵分解只描述近似，不直接描述生成过程；
    - 每个文档有一个话题分布；生成每个词元时，先从文档的话题分布抽取话题，再从该话题的单词分布抽取单词。
    - PLSA 由 Hofmann 于 1999 年提出。它受 LSA 启发，但把“潜在语义方向”改造成有明确归一化约束的概率分布。
  - title: 18.1 概率潜在语义分析模型
    source_heading: 18.1 概率潜在语义分析模型
    paragraphs:
    - 只保留词袋统计，忽略词序。这是 PLSA 的首要建模假设和适用边界：它分析全局词共现话题，不描述语法和长距离顺序关系。
    - 为什么合理？文档对词的影响完全由话题中介：知道当前话题后，词的选择不再直接依赖文档编号。为什么又只是近似？同一话题在不同作者、时代和文体中仍可能使用不同词，PLSA
      不表达这种差异。
    - 这给“潜在语义空间”一个比 SVD 子空间更严格的概率几何解释：文档只能做非负且和为 1 的凸组合，不能任意线性组合或相互抵消。
    - 所以 PLSA 与第 17 章 KL-NMF 都是在做非负低秩近似，但 PLSA 给因子加了概率归一化和隐变量生成解释。
  - title: 18.2 概率潜在语义分析的算法
    source_heading: 18.2 概率潜在语义分析的算法
    paragraphs:
    - 若每个词元的话题标签都已知，问题反而很简单：统计“话题 k 产生词 i”和“文档 j 使用话题 k”的次数，再分别归一化即可。EM 的思路就是用后验概率补出这些不可见计数的期望。
    - 直觉：分子是“文档 j 使用话题 k”与“话题 k 生成词 i”的联合支持；分母对所有可能话题归一化。
    - 分子是话题 k 分给词 i 的期望次数，分母是话题 k 分到的全部期望词元数。
    - 这称为 folding-in。它能用于检索，但暴露了 PLSA 的根本局限：模型没有定义“未见文档的话题分布如何产生”，每篇新文档都要另做参数估计。
  - title: 18.5 【补充】方法对比与选择
    source_heading: 18.5 【补充】方法对比与选择
    paragraphs:
    - 只需快速降维和检索：截断 SVD；
    - 希望理解概率话题模型和 EM：PLSA；
    - 需要严谨的新文档生成、先验平滑和泛化：LDA。
  - title: 必须会推导的公式
    source_heading: 必须会推导的公式
    paragraphs:
    - 边缘化隐话题得到式 (18.2) 和式 (18.5)；
    - 用条件独立假设推出 E 步式 (18.11)；
    - 用拉格朗日乘子把期望软计数归一化，得到式 (18.12)、(18.13)；
    - 用 Jensen 不等式说明 EM 似然单调不降；
  - title: 必须记住的边界
    source_heading: 必须记住的边界
    paragraphs:
    - EM 只保证到局部驻点，话题编号可置换；
    - 新文档需要 folding-in，PLSA 没有文档话题分布的先验；
    - 极大似然在小语料上会产生极端概率并过拟合；
    - 统计共现话题不保证等于人类期望的语义概念。
  takeaways:
  - PLSA 把词-文档共现解释为“文档选择隐话题、话题生成单词”的概率过程，再用 EM 将不可见话题替换为后验软计数并反复归一化；它赋予低秩话题分解清晰的概率语义，却仍受局部最优、过拟合和无法自然生成新文档的限制。
  - 所以 PLSA 与第 17 章 KL-NMF 都是在做非负低秩近似，但 PLSA 给因子加了概率归一化和隐变量生成解释。
  - 这称为 folding-in。它能用于检索，但暴露了 PLSA 的根本局限：模型没有定义“未见文档的话题分布如何产生”，每篇新文档都要另做参数估计。
  - 用 Jensen 不等式说明 EM 似然单调不降；
  - 统计共现话题不保证等于人类期望的语义概念。
