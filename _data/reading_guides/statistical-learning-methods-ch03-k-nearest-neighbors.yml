overview:
  kind: summary
  minutes: 8
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: k 近邻法以距离定义相似性，在由 k 控制的局部邻域中通过多数表决最小化 0-1 经验风险；它用存储和查询成本换取灵活的非线性边界，而 kd 树则通过空间距离下界安全剪枝，在低维场景中加速邻居搜索。
  thesis_source: 第 3 章一句话回顾
  concepts:
  - term: 0. 本章解决什么问题
    meaning: k 近邻法（k-nearest neighbors, k-NN）研究一种非常直接的预测思想：相似的输入往往具有相似的输出。 对一个新样本，不预先拟合显式参数，而是在训练集中找到与它最相似的
      k 个样本，再根据这些邻居的标签进行预测。
    source_heading: 0. 本章解决什么问题
  - term: 3.1.2 “没有显式学习过程”是什么意思
    meaning: 若构建 kd 树、球树或近似最近邻索引，训练阶段仍然需要计算，只是这些计算用于加速检索，而不是改变基本分类规则。
    source_heading: 3.1.2 “没有显式学习过程”是什么意思
  - term: 3.2.9 维数灾难
    meaning: 维数越高，为收集同样比例的邻居，邻域必须扩张到几乎覆盖每一维，局部估计因此不再真正局部。同时，最近距离和最远距离往往趋于相近，距离的区分能力下降。
    source_heading: 3.2.9 维数灾难
  - term: 3.3.1 为什么需要专门的搜索结构
    meaning: 线性扫描简单且在高维或中小数据上常很有竞争力，但当低维数据规模很大且查询频繁时，希望通过空间索引排除不可能成为近邻的大量点。kd 树就是一种精确检索结构。
    source_heading: 3.3.1 为什么需要专门的搜索结构
  - term: 3.3.6 剪枝条件为什么正确
    meaning: 以 q 为圆心、当前最优距离 r 为半径的超球包含所有可能比当前候选更近的点。
    source_heading: 3.3.6 剪枝条件为什么正确
  - term: 3.5 本章方法论总结
    meaning: 训练数据与距离共同定义邻域，并隐式划分特征空间。该模型是非参数、非概率形式的判别模型；邻居类别比例也可作为条件概率的局部估计。
    source_heading: 3.5 本章方法论总结
  logic:
  - 0. 本章解决什么问题
  - 3.1.2 “没有显式学习过程”是什么意思
  - 3.2.8 类别不平衡问题
  - 3.3.1 为什么需要专门的搜索结构
  - 3.3.2 kd 树是什么
  - 3.4 统计性质与适用边界
  - 3.5 本章方法论总结
  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - k 近邻法（k-nearest neighbors, k-NN）研究一种非常直接的预测思想：相似的输入往往具有相似的输出。 对一个新样本，不预先拟合显式参数，而是在训练集中找到与它最相似的
      k 个样本，再根据这些邻居的标签进行预测。
    - 分类决策规则：如何汇总邻居的标签？
  - title: 3.1.1 基本定义
    source_heading: 3.1.1 基本定义
    paragraphs:
    - 按距离从训练集中选出 k 个最近邻；
    - 统计这些邻居中各类别出现次数，输出票数最多的类别。
  - title: 3.1.2 “没有显式学习过程”是什么意思
    source_heading: 3.1.2 “没有显式学习过程”是什么意思
    paragraphs:
    - 它不通过优化损失得到一个固定维数的参数向量；
    - 训练阶段主要是保存、整理或索引训练数据；
    - 训练数据本身就是模型的重要组成部分；
    - 若构建 kd 树、球树或近似最近邻索引，训练阶段仍然需要计算，只是这些计算用于加速检索，而不是改变基本分类规则。
  - title: 3.2.8 类别不平衡问题
    source_heading: 3.2.8 类别不平衡问题
    paragraphs:
    - 用宏平均 F_1、平衡准确率等指标选择 k；
    - 不能只靠把 k 改成奇数解决类别不平衡；奇数仅减少二分类票数相等，不改变多数类占优的概率。
  - title: 3.2.9 维数灾难
    source_heading: 3.2.9 维数灾难
    paragraphs:
    - 维数越高，为收集同样比例的邻居，邻域必须扩张到几乎覆盖每一维，局部估计因此不再真正局部。同时，最近距离和最远距离往往趋于相近，距离的区分能力下降。
    - 使用适合高维数据的近似检索与其他模型。
  - title: 3.3.1 为什么需要专门的搜索结构
    source_heading: 3.3.1 为什么需要专门的搜索结构
    paragraphs:
    - 线性扫描简单且在高维或中小数据上常很有竞争力，但当低维数据规模很大且查询频繁时，希望通过空间索引排除不可能成为近邻的大量点。kd 树就是一种精确检索结构。
    - kd 树名称中的 d 表示维数。这里不要把“kd 树的维数”与“k-NN 的邻居数 k”混为一谈。
  - title: 3.3.2 kd 树是什么
    source_heading: 3.3.2 kd 树是什么
    paragraphs:
    - 特征空间被递归切分成的一组轴对齐超矩形。
    - 搜索能加速，是因为一个子树对应一个完整空间区域。若能证明该区域中任何点都不可能优于当前候选，就可以一次剪掉整棵子树。
  - title: 3.3.6 剪枝条件为什么正确
    source_heading: 3.3.6 剪枝条件为什么正确
    paragraphs:
    - 以 q 为圆心、当前最优距离 r 为半径的超球包含所有可能比当前候选更近的点。
    - 是否搜索取决于是否需要返回全部并列点及既定边界规则。
    - 这说明 kd 树剪枝不是“猜测另一侧大概没有更近点”，而是利用区域距离下界作出的严格判断。
  - title: 3.4 统计性质与适用边界
    source_heading: 3.4 统计性质与适用边界
    paragraphs:
    - "“非参数”不是“不需要选择模型”，而是模型复杂度不被预先限制在固定维参数族中。"
    - 留一交叉验证尤其适合中小型 k-NN 数据集，但仍要在每一折内单独拟合标准化等预处理步骤。
    - 当样本量 N 增大时，固定 k 会让局部估计始终只依赖少数样本，方差不会充分消失；若 k 与 N 同阶，邻域又不会收缩到查询点附近，偏差难以消失。
    - 在常见正则条件下，这使 k-NN 的风险趋近贝叶斯最优风险。该结论是渐近性质，不代表有限样本中 k 越大越好；有限数据仍应通过验证选择 k。
  - title: 3.5 本章方法论总结
    source_heading: 3.5 本章方法论总结
    paragraphs:
    - 训练数据与距离共同定义邻域，并隐式划分特征空间。该模型是非参数、非概率形式的判别模型；邻居类别比例也可作为条件概率的局部估计。
    - 通过线性扫描、kd 树等方法寻找 k 个最近邻，再执行普通或加权表决。索引算法优化的是计算效率，不应与统计决策规则混为一谈。
    - 小 k 具有低偏差、高方差和复杂边界；大 k 具有高偏差、低方差和平滑边界。
    - 搜索 k 个邻居时，应维护大小为 k 的最大堆，堆顶距离就是当前剪枝半径。
  takeaways:
  - k 近邻法以距离定义相似性，在由 k 控制的局部邻域中通过多数表决最小化 0-1 经验风险；它用存储和查询成本换取灵活的非线性边界，而 kd 树则通过空间距离下界安全剪枝，在低维场景中加速邻居搜索。
  - 若构建 kd 树、球树或近似最近邻索引，训练阶段仍然需要计算，只是这些计算用于加速检索，而不是改变基本分类规则。
  - 使用适合高维数据的近似检索与其他模型。
  - 这说明 kd 树剪枝不是“猜测另一侧大概没有更近点”，而是利用区域距离下界作出的严格判断。
  - 搜索 k 个邻居时，应维护大小为 k 的最大堆，堆顶距离就是当前剪枝半径。
