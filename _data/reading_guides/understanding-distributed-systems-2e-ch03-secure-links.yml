overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 本章定位：可靠送达不等于安全通信」建立了怎样的核心认识？
  question_source: 0. 本章定位：可靠送达不等于安全通信
  thesis: 普通哈希不能对抗主动攻击者。 MAC/HMAC 用秘密密钥认证消息；现代 TLS 记录通常用 AEAD 同时完成加密与认证。
  thesis_source: 9. 核心结论
  concepts:
  - term: 0. 本章定位：可靠送达不等于安全通信
    meaning: TLS（Transport Layer Security）运行在传输层之上、应用协议之下。HTTP、数据库协议或内部 RPC 可以把应用数据交给
      TLS；TLS 加密并认证这些数据，再通过 TCP 发送。
    source_heading: 0. 本章定位：可靠送达不等于安全通信
  - term: 2. Authentication：认证
    meaning: 证书尚未过期，但私钥已经泄露或证书误签时，CA 可以撤销证书。客户端可能通过 CRL、OCSP 或 stapling 获取状态。撤销检查的可用性、隐私与失败策略较复杂，不是原章重点，但说明“在有效期内”并非唯一条件。
    source_heading: 2. Authentication：认证
  - term: 5. 四类机制如何组成一条安全链路
    meaning: 若 TLS 在负载均衡器终止，客户端到负载均衡器的链路受到保护，但负载均衡器到后端是否安全取决于是否重新建立 TLS。系统设计必须明确每个
      TLS 终止点，而不能笼统地说“服务用了 HTTPS”。
    source_heading: 5. 四类机制如何组成一条安全链路
  - term: 6. C/OpenSSL 示例：建立并验证 HTTPS 连接
    meaning: 密码协议包含随机数、证书路径、主机名、算法协商、错误处理、侧信道和版本兼容等大量细节。应用不应自行实现 Diffie–Hellman、HMAC
      或 TLS 状态机。
    source_heading: 6. C/OpenSSL 示例：建立并验证 HTTPS 连接
  - term: 7.6 TLS 终止与端到端加密
    meaning: "“端到端”必须明确端点是谁。TLS 端点若不是最终业务进程，链路安全边界也在那里结束。"
    source_heading: 7.6 TLS 终止与端到端加密
  - term: 10. 从本章提炼出的通用解题方法
    meaning: 本章最重要的方法论是：安全通信不是“把数据加密”这一项操作，而是把密钥协商、身份信任、消息完整性和握手状态绑定为一个可验证的整体；每一项保证都必须追溯到明确的密钥、信任锚和协议边界。
    source_heading: 10. 从本章提炼出的通用解题方法
  logic:
  - 0. 本章定位：可靠送达不等于安全通信
  - 2. Authentication：认证
  - 4. Handshake：握手
  - 6. C/OpenSSL 示例：建立并验证 HTTPS 连接
  - 7.2 密钥交换、加密和签名
  - 9. 核心结论
  - 10. 从本章提炼出的通用解题方法
  sections:
  - title: 0. 本章定位：可靠送达不等于安全通信
    source_heading: 0. 本章定位：可靠送达不等于安全通信
    paragraphs:
    - TLS（Transport Layer Security）运行在传输层之上、应用协议之下。HTTP、数据库协议或内部 RPC 可以把应用数据交给 TLS；TLS
      加密并认证这些数据，再通过 TCP 发送。
    - 只有加密，没有完整性：攻击者虽然不懂明文，仍可能通过修改密文改变结果；
    - TLS 的价值在于把三者组合为一条安全通道，而不是单独使用某一种密码学原语。
    - 所以本章讨论的是传输中数据（data in transit） 的安全边界，不是整个应用的完整安全方案。
  - title: 1. Encryption：加密
    source_heading: 1. Encryption：加密
    paragraphs:
    - TLS 通过非对称密码学和密钥协商打破这个循环。双方可以在公开信道上交换公开材料，并各自计算出同一个共享秘密，而共享秘密本身不在网络上传输。
    - 非对称运算通常比对称运算昂贵，不适合直接加密整条大流量连接。TLS 因而采用混合结构：非对称密码学解决初始密钥与身份问题，对称密码学保护后续批量数据。
    - 这个例子只用于展示等式，绝不能用于真实加密：参数极小，攻击者可以穷举私钥。真实 TLS 1.3 通常使用椭圆曲线上的临时 Diffie–Hellman（ECDHE）及经过标准化的曲线和参数。
    - 若每次连接使用临时 Diffie–Hellman 私钥，并在连接后销毁，即使服务器长期证书私钥将来泄露，攻击者也不能仅凭长期私钥解开以前录制的会话。
  - title: 2. Authentication：认证
    source_heading: 2. Authentication：认证
    paragraphs:
    - 实际签名算法通常对消息摘要和结构化编码进行签名，而不是把任意长消息直接做“私钥加密”。因此，把数字签名描述为“用私钥加密消息、再用公钥解密”只适用于非常粗糙的直觉，不能作为通用实现模型。
    - 但验证成功并不自动说明公钥属于目标服务器。攻击者完全可以生成自己的合法密钥对，为自己的消息产生可验证签名。难题从“签名对不对”转化为“这个公钥是谁的”。
    - 证书尚未过期，但私钥已经泄露或证书误签时，CA 可以撤销证书。客户端可能通过 CRL、OCSP 或 stapling 获取状态。撤销检查的可用性、隐私与失败策略较复杂，不是原章重点，但说明“在有效期内”并非唯一条件。
    - 原书以 Let’s Encrypt 为公共 CA 示例。具体信任锚通常是该 CA 体系中的根证书，例如 ISRG Root 系列；信任状态随平台和时间变化，不能假设所有客户端都拥有相同根集合。
  - title: 4. Handshake：握手
    source_heading: 4. Handshake：握手
    paragraphs:
    - 协商消息本身必须受到后续 transcript 认证，否则中间人可以删除强算法选项，诱导双方使用弱算法，这类攻击称为降级攻击。TLS 会把握手 transcript
      纳入签名和 Finished 验证，使无声修改协商内容变得可检测。
    - 若只验证证书链，不验证当前握手签名，攻击者可以复制公开证书，却没有私钥；若只验证签名而不验证证书链，攻击者可以用自己的密钥对产生合法签名。两者缺一不可。
    - 这还没包含 DNS、证书处理、应用请求与响应。真实实现可能通过并行、恢复、TCP Fast Open、QUIC 或其他优化改变时序；表格用于理解固定往返成本，而不是所有网络的精确测量。
    - 0-RTT 的关键限制是可重放性：攻击者可能复制 early data 并让服务器多次处理。它也不具备前向保密，因为 early data 密钥只从恢复
      PSK 等已有秘密派生，尚未混入本次连接的新鲜 (EC)DHE 共享值；若相关 PSK 后来泄露，已经记录的 0-RTT 密文可能被解开。因而 0-RTT
      只适合可安全重放或具有应用层去重保护的操作，不应直接用于不可重复的支付、创建订单等副作用操作，也不应承载需要前向保密的敏感数据。
  - title: 5. 四类机制如何组成一条安全链路
    source_heading: 5. 四类机制如何组成一条安全链路
    paragraphs:
    - Finished 绑定整个握手 transcript；
    - 客户端所见 transcript 已被中间人修改；
    - 攻击者若想生成与客户端 transcript 匹配的服务器签名，就需要服务器证书私钥；如果改用自己的证书，又无法通过目标主机名与信任路径验证。
    - 若 TLS 在负载均衡器终止，客户端到负载均衡器的链路受到保护，但负载均衡器到后端是否安全取决于是否重新建立 TLS。系统设计必须明确每个 TLS 终止点，而不能笼统地说“服务用了
      HTTPS”。
  - title: 6. C/OpenSSL 示例：建立并验证 HTTPS 连接
    source_heading: 6. C/OpenSSL 示例：建立并验证 HTTPS 连接
    paragraphs:
    - 密码协议包含随机数、证书路径、主机名、算法协商、错误处理、侧信道和版本兼容等大量细节。应用不应自行实现 Diffie–Hellman、HMAC 或 TLS
      状态机。
    - Windows 上需使用已配置好 OpenSSL 头文件和链接库的 C 工具链；具体参数取决于安装方式。
    - 最重要的两行不是“开启加密”，而是加载信任锚并启用主机名验证。许多错误示例只加密 socket，却接受任意证书，仍然容易遭受中间人攻击。
    - 此外，示例依赖 OpenSSL 与平台信任存储配置。它“可运行”的前提是本机已安装 OpenSSL 开发文件并配置受信 CA，不应为了学习示例而关闭证书验证。
  - title: 7.2 密钥交换、加密和签名
    source_heading: 7.2 密钥交换、加密和签名
    paragraphs:
    - 对称加密用共享秘密保护大量数据；
    - 密钥派生从共享秘密产生多个独立用途的密钥。
    - 同一“公钥密码学”标签下包含不同功能，不能把公钥加密、Diffie–Hellman 和数字签名视为一个操作。
  - title: 7.6 TLS 终止与端到端加密
    source_heading: 7.6 TLS 终止与端到端加密
    paragraphs:
    - 重新建立 TLS，形成两段独立安全通道；
    - 使用 mTLS，同时认证后端和代理身份。
    - "“端到端”必须明确端点是谁。TLS 端点若不是最终业务进程，链路安全边界也在那里结束。"
  - title: 9. 核心结论
    source_heading: 9. 核心结论
    paragraphs:
    - 普通哈希不能对抗主动攻击者。 MAC/HMAC 用秘密密钥认证消息；现代 TLS 记录通常用 AEAD 同时完成加密与认证。
    - TCP 校验和不是密码学完整性。 原书的 16 GB 到 10 TB 例子说明小漏检概率在大规模传输中仍会成为现实风险。
    - 握手协商算法、建立密钥、认证身份并绑定 transcript。 Finished 证明双方共享相同秘密且看到了相同握手。
    - TLS 1.3 将完整握手从 TLS 1.2 常见的 2 RTT 降至 1 RTT。 新 TCP 连接仍另需约 1 RTT。
  - title: 10. 从本章提炼出的通用解题方法
    source_heading: 10. 从本章提炼出的通用解题方法
    paragraphs:
    - 明确要保护的是凭据、业务数据还是服务身份；攻击者只能监听，还是能够修改和冒充；TLS 在哪里开始、在哪里终止。威胁模型不清，机制选择就没有依据。
    - 版本、算法和临时密钥若不纳入 transcript 签名或 MAC，中间人就可能替换或降级。协商不是安全性质之外的配置细节，而是必须被认证的协议输入。
    - 先验证 AEAD 标签或 MAC，再向应用输出明文；证书链、主机名、用途和私钥持有证明全部成功后，才承认对端身份。失败必须关闭，而不是“记录警告后继续”。
    - 本章最重要的方法论是：安全通信不是“把数据加密”这一项操作，而是把密钥协商、身份信任、消息完整性和握手状态绑定为一个可验证的整体；每一项保证都必须追溯到明确的密钥、信任锚和协议边界。
  takeaways:
  - 可靠链路不等于安全链路。 TCP 解决字节交付，不阻止窃听、篡改和冒充。
  - 证书把身份和公钥绑定。 客户端必须构建到本地信任锚的路径，并检查签名、有效期、SAN、用途和约束。
  - 证书过期会在应用请求之前中断连接。 自动续期、部署验证和提前告警是可用性工程的一部分。
  - TLS 1.3 将完整握手从 TLS 1.2 常见的 2 RTT 降至 1 RTT。 新 TCP 连接仍另需约 1 RTT。
  - TLS 保护的是两个 TLS 端点之间的传输。 端点失陷、TLS 终止后的明文处理和业务授权仍需独立防护。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「7.1 编码、哈希、加密、MAC 与签名」？
  answer: Base64 不是加密，普通哈希不是消息认证，数字签名也不是“用私钥保密消息”。
  source_heading: 7.1 编码、哈希、加密、MAC 与签名
- level: 概念辨析
  question: 原文如何解释「7.2 密钥交换、加密和签名」？
  answer: 同一“公钥密码学”标签下包含不同功能，不能把公钥加密、Diffie–Hellman 和数字签名视为一个操作。
  source_heading: 7.2 密钥交换、加密和签名
- level: 概念辨析
  question: 原文如何解释「7.4 完整性与正确性」？
  answer: 数据存入数据库后不会被其他代码改变。
  source_heading: 7.4 完整性与正确性
- level: 概念辨析
  question: 原文如何解释「7.5 证书链与信任链」？
  answer: 证书链是一组具有签发关系的证书；信任链还要求路径终点是客户端本地信任锚，并满足主机名、有效期、用途和约束。数学链条完整不代表策略上可信。
  source_heading: 7.5 证书链与信任链
- level: 概念辨析
  question: 原文如何解释「7.6 TLS 终止与端到端加密」？
  answer: "“端到端”必须明确端点是谁。TLS 端点若不是最终业务进程，链路安全边界也在那里结束。"
  source_heading: 7.6 TLS 终止与端到端加密
