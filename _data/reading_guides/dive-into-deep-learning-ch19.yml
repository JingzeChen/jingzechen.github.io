  minutes: 8
  question: 1. 本章主线：优化“如何训练模型”？
  question_source: 1. 本章主线：优化“如何训练模型”
  thesis: 最终候选应在独立 test 上评价，并最好用多 seeds 复评，避免 noisy incumbent 的乐观偏差。
  thesis_source: 22. 核心结论
  concepts:
  - term: 1. 本章主线：优化“如何训练模型”
    meaning: 训练机器学习模型时，模型参数通常由训练算法自动学习，但训练算法本身仍需要大量人为选择：学习率多大、批量多大、正则化多强、网络多深、每层多宽、训练多少轮？这些选择会显著影响最终泛化性能。
    source_heading: 1. 本章主线：优化“如何训练模型”
  - term: 4.3 原书 Fashion-MNIST 示例的数据泄漏
    meaning: 小数据下可用 nested cross-validation：外层估计泛化，内层进行 HPO。
    source_heading: 4.3 原书 Fashion-MNIST 示例的数据泄漏
  - term: 10.1 两类随机性
    meaning: HPO 随机性：候选采样、代理模型初始化、并发完成顺序。
    source_heading: 10.1 两类随机性
  - term: 11.2 Straggler 从哪里来
    meaning: checkpoint、验证和网络 I/O 不同；
    source_heading: 11.2 Straggler 从哪里来
  - term: 15. 同步 Successive Halving 的并行问题
    meaning: 实际同步实现常在高 rung 运行时，提前开启下一轮低 rung 配置，减少空闲，但 rung 内 barrier 仍存在。
    source_heading: 15. 同步 Successive Halving 的并行问题
  - term: 23. 解决 HPO 问题的一般思路
    meaning: 本章可以压缩为一句话：超参数优化把“如何训练模型”写成以验证性能为目标的昂贵嵌套优化；随机搜索提供通用基线，Searcher/Scheduler/Tuner
      将候选选择、资源分配和执行解耦；异步调度通过消除等待降低墙钟时间，Successive Halving 通过低保真淘汰降低总计算，ASHA 则把二者结合。可靠
      HPO 的核心不仅是搜索算法，还包括无泄漏的数据划分、合理配置空间、公平预算、checkpoint 语义、跨 seed 统计和对低保真排名错误的清醒认识。
    source_heading: 23. 解决 HPO 问题的一般思路
