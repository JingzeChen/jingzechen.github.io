checks:
- level: 概念辨析
  question: 原文如何解释「19.19 异步永远与同步得到相同配置序列」？
  answer: 随机搜索在固定预生成流下可相同；自适应算法会受完成顺序和 pending trials 影响。
  source_heading: 19.19 异步永远与同步得到相同配置序列
- level: 概念辨析
  question: 原文如何解释「19.27 Hyperband 是本章原文算法」？
  answer: 原章未介绍 Hyperband；它是理解多 bracket SH 的补充背景。
  source_heading: 19.27 Hyperband 是本章原文算法
- level: 概念辨析
  question: 原文如何解释「19.31 ASHA 无需 checkpoint」？
  answer: Stopping variant 可直接连续训练并早停；promotion/pause-resume variant 要高效恢复仍需 checkpoint。
  source_heading: 19.31 ASHA 无需 checkpoint
- level: 概念辨析
  question: 原文如何解释「19.33 同步调度总是浪费一半资源」？
  answer: 浪费取决于运行时间分布、worker 数和 rung 大小，没有固定比例。
  source_heading: 19.33 同步调度总是浪费一半资源
