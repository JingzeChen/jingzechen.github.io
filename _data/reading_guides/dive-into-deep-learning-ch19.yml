  sections:
  - title: 1. 本章主线：优化“如何训练模型”
    source_heading: 1. 本章主线：优化“如何训练模型”
    paragraphs:
    - 训练机器学习模型时，模型参数通常由训练算法自动学习，但训练算法本身仍需要大量人为选择：学习率多大、批量多大、正则化多强、网络多深、每层多宽、训练多少轮？这些选择会显著影响最终泛化性能。
    - 选择一组超参数，运行完整训练流程，再用独立验证数据评价；在有限时间和计算预算内，尽快找到验证性能优秀的配置。
    - 训练任务可并行但速度不同：同步批次会被最慢 trial 拖住，因此采用异步调度来减少墙钟时间；
    - 很多差配置仍被完整训练：利用低资源评估作为代理，提前停止表现不佳的配置，以减少总计算量。
  - title: 2.3 两者并非由“可微/不可微”区分
    source_heading: 2.3 两者并非由“可微/不可微”区分
    paragraphs:
    - 超参数定义或控制内层学习问题，由外层选择。
    - 同一量在不同方法中也可能改变角色。例如温度参数可以固定为超参数，也可以纳入模型并通过梯度学习。
  - title: 4.3 原书 Fashion-MNIST 示例的数据泄漏
    source_heading: 4.3 原书 Fashion-MNIST 示例的数据泄漏
    paragraphs:
    - 用官方 60,000 张训练图拟合模型；
    - 从官方 60,000 张训练数据中划分 train/validation；
    - 选定配置后，可在 train + validation 上重新训练；
    - 小数据下可用 nested cross-validation：外层估计泛化，内层进行 HPO。
  - title: 6.3 搜索空间混合且有条件结构
    source_heading: 6.3 搜索空间混合且有条件结构
    paragraphs:
    - categorical：优化器、激活函数；
    - conditional：只有 optimizer=SGD 时 momentum 才有效；
    - hierarchical：只有第 l 层存在时 width l 才有效。
  - title: 10.1 两类随机性
    source_heading: 10.1 两类随机性
    paragraphs:
    - 训练随机性：初始化、mini-batch 顺序、数据增强、非确定性算子；
    - HPO 随机性：候选采样、代理模型初始化、并发完成顺序。
  - title: 11.2 Straggler 从哪里来
    source_heading: 11.2 Straggler 从哪里来
    paragraphs:
    - batch size 影响吞吐；
    - checkpoint、验证和网络 I/O 不同；
  - title: 13.9 原实现没有真正续训
    source_heading: 13.9 原实现没有真正续训
    paragraphs:
    - 计算成本是 58 而不是 34；
    - 各 rung 结果不一定来自同一条学习曲线。
    - 实际系统应保存模型、优化器、学习率调度器和 RNG 状态，从 checkpoint 继续。
  - title: 15. 同步 Successive Halving 的并行问题
    source_heading: 15. 同步 Successive Halving 的并行问题
    paragraphs:
    - 等待当前 rung 全部 trial 完成；
    - rung trial 数不是 worker 数的整数倍；
    - 高 rung 幸存者很少，无法占满 workers；
    - 实际同步实现常在高 rung 运行时，提前开启下一轮低 rung 配置，减少空闲，但 rung 内 barrier 仍存在。
  - title: 20.3 何时使用 SH/ASHA
    source_heading: 20.3 何时使用 SH/ASHA
    paragraphs:
    - 有自然的逐步资源，如 epochs；
    - ASHA 特别适合多 worker 和运行时间差异大。
  - title: 23. 解决 HPO 问题的一般思路
    source_heading: 23. 解决 HPO 问题的一般思路
    paragraphs:
    - 定义内层训练契约：初始化、epochs、early stopping、seed 和失败语义必须明确。
    - 记录完整 trial 元数据：配置、seed、资源、指标、runtime、状态、checkpoint 和硬件。
    - 复评 top candidates：使用多个 seeds 或更高 fidelity，减少 winner’s curse。
    - 本章可以压缩为一句话：超参数优化把“如何训练模型”写成以验证性能为目标的昂贵嵌套优化；随机搜索提供通用基线，Searcher/Scheduler/Tuner
      将候选选择、资源分配和执行解耦；异步调度通过消除等待降低墙钟时间，Successive Halving 通过低保真淘汰降低总计算，ASHA 则把二者结合。可靠
      HPO 的核心不仅是搜索算法，还包括无泄漏的数据划分、合理配置空间、公平预算、checkpoint 语义、跨 seed 统计和对低保真排名错误的清醒认识。
  takeaways:
  - 模型参数由内层训练学习，超参数定义优化、正则、结构和资源，由外层选择。
  - HPO 目标通常昂贵、带噪、混合、条件化且近似无梯度。
  - Incumbent trajectory 衡量截至当前的最佳结果；HPO 应按 anytime performance 比较。
  - Checkpoint/resume 比每 rung 从头重训更省计算，也保持同一学习轨迹。
  - 最终候选应在独立 test 上评价，并最好用多 seeds 复评，避免 noisy incumbent 的乐观偏差。
