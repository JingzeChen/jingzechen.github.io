      再沿展开时间图分配信用。这个设计用有限状态和有限反向长度换取可计算性，也带来多步误差、暴露偏差和梯度消失/爆炸。理解状态数值、计算图和数据时间边界三者的区别，是正确使用所有后续序列模型的基础。
