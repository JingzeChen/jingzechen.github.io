checks:
- level: 概念辨析
  question: 原文如何解释「10.1 序列之间 IID 与时间步 IID」？
  answer: 可假设不同文档独立，不表示文档内部词元独立。RNN 正是利用时间步依赖。
  source_heading: 10.1 序列之间 IID 与时间步 IID
- level: 概念辨析
  question: 原文如何解释「10.6 插值与外推」？
  answer: 在已观测时间范围内用真实邻域预测更接近插值；越过观测边界递归预测是外推，通常更难。
  source_heading: 10.6 插值与外推
- level: 概念辨析
  question: 原文如何解释「10.12 似然与困惑度」？
  answer: 总似然随长度指数变小；困惑度是每词元平均交叉熵的指数，可在同词元化/数据上比较。
  source_heading: 10.12 似然与困惑度
- level: 概念辨析
  question: 原文如何解释「10.20 状态传递与梯度传递」？
  answer: detach 后数值记忆继续跨片段，梯度历史却被截断。两种“历史长度”必须分开理解。
  source_heading: 10.20 状态传递与梯度传递
- level: 概念辨析
  question: 原文如何解释「10.25 训练交叉熵低与生成一定好」？
  answer: Teacher-forced 下一词元训练使用真实前缀，生成使用自身输出；暴露偏差、贪心循环和分布外前缀都可使自由生成较差。
  source_heading: 10.25 训练交叉熵低与生成一定好
