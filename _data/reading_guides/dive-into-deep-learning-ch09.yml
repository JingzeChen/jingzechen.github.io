  question_source: 1. 为什么序列需要新的建模方式
  thesis: 本章把“历史”变成了可计算对象：概率链式法则把联合序列分解为连续下一步预测，词元化和词表把文本转成分类索引，RNN 以共享参数递推固定维隐藏状态，BPTT
    再沿展开时间图分配信用。这个设计用有限状态和有限反向长度换取可计算性，也带来多步误差、暴露偏差和梯度消失/爆炸。理解状态数值、计算图和数据时间边界三者的区别，是正确使用所有后续序列模型的基础。
