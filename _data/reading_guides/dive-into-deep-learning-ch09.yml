  sections:
  - title: 1. 为什么序列需要新的建模方式
    source_heading: 1. 为什么序列需要新的建模方式
    paragraphs:
    - 医疗记录是就诊、药物、检查和诊断事件序列；
    - 循环神经网络（RNN）用跨时间步的循环连接维护隐藏状态。图上看似有环，但计算并不含同一时刻的循环依赖：把网络沿时间展开后，它是一个参数跨时间共享的前馈计算图。
    - 同一组参数在所有时间步使用，所以参数量不随序列长度增长；计算、激活内存和反向路径长度则随序列长度增长。
    - RNN 曾是复杂序列任务的默认模型，并在手写识别、机器翻译和医疗诊断中取得突破。CNN、状态空间模型和 Transformer 也能建模序列；“序列数据”不等于“必须使用
      RNN”。RNN 的价值在于建立状态递推、参数共享和时间反向传播的基本心智模型。
  - title: 2. 序列统计与预测
    source_heading: 2. 序列统计与预测
    paragraphs:
    - 序列内部也不必严格平稳。文档开头和结尾可以有不同分布，病情会朝康复或恶化演化，用户偏好可随交互改变。最宽松的标准设定是：完整序列来自某个固定的序列分布，而模型显式处理序列内依赖。
    - 固定窗口能使用任意 MLP/线性模型，计算简单，但硬性丢弃窗口外历史。潜状态允许理论上不断吸收历史，但固定维向量是有损压缩，且是否真正保留长期信息取决于结构和训练。
    - 从一条长序列切出大量训练窗口时，通常隐含一个假设：虽然观测值变化，生成下一项的动力学规则在时间上近似不变。统计学称这种性质为平稳性，严格平稳要求任意时间平移后的联合分布不变。
    - Markov 模型是对条件独立结构的假设，不等于“只使用一个词元的所有模型”，也不等于隐藏状态 RNN。RNN 的状态可递归依赖整个可见前缀，即使训练反向被截断。
  - title: 3. 从原始文本到序列数据
    source_heading: 3. 从原始文本到序列数据
    paragraphs:
    - 原书使用 H. G. Wells 的《时间机器》，约三万多个英文词，足以演示字符级模型，但远小于真实语言模型语料。
    - 字符级模型使词表很小，训练便宜，也避免词外词，但同样文本需要更多时间步，长期语义更难学。
    - 传统词袋分类常删掉高频、区分度低的停用词；RNN 和 Transformer 中功能词承载语序和句法，通常不需要机械删除。
    - 这既说明语言有结构（常见短语会重复），也揭示纯计数模型的稀疏性瓶颈，推动能在相似上下文之间共享统计强度的神经模型。
  - title: 5. RNN 的隐藏状态
    source_heading: 5. RNN 的隐藏状态
    paragraphs:
    - 若 h_t 可无限大并精确保存全部历史，这个等式可不只是近似；实际固定维状态、有限精度和可训练性使其成为有损摘要。
    - MLP 有隐藏层但没有跨样本/时间状态。RNN 的隐藏状态通常也是某个隐藏层输出，但其关键属性是跨时间传递。
    - 这说明一个 RNN cell 可视为对“当前输入 + 旧状态”应用共享全连接层和激活。
    - 状态使输出理论上依赖所有此前词元，但“存在路径”不等于模型能有效保存任意长期信息。tanh 饱和和长 Jacobian 乘积会让早期影响消失。
  - title: 6.6 训练时状态如何处理
    source_heading: 6.6 训练时状态如何处理
    paragraphs:
    - 若不 detach，图跨批增长，内存不断增加，并把反向延伸到所有历史批次。
    - 若某批中序列结束，必须只重置对应行状态，而不是让下一文档继承上一文档记忆。
  - title: 6.7 解码与前缀 warm-up
    source_heading: 6.7 解码与前缀 warm-up
    paragraphs:
    - 按顺序输入前缀字符，用真实下一个前缀字符继续，只更新状态而不自由生成；
    - 前缀读完后，根据最后 logits 选下一字符；
    - 把生成字符作为下一步输入，递归生成。
    - 生成质量不能只凭几段样例判断，应结合测试 PPL、多样性、重复率和任务评价。
  - title: 7. 使用框架的简洁 RNN
    source_heading: 7. 使用框架的简洁 RNN
    paragraphs:
    - 它还支持多层、双向、dropout 和优化后端。标准结构应优先使用框架；从零实现用于理解、研究新 cell 或验证公式。
    - padding 如何 mask；
  - title: 9. 可运行的综合实验
    source_heading: 9. 可运行的综合实验
    paragraphs:
    - one-hot 乘输入权重与按索引查嵌入行完全等价；
    - 小型字符 RNN 在重复文本上把交叉熵和困惑度显著降低；
  - title: 11. 原章练习与关键推导
    source_heading: 11. 原章练习与关键推导
    paragraphs:
    - 已知固定频率且无噪时，最近两项足以线性预测下一项。噪声、未知频率和非平稳性会增加实际所需状态和估计难度。
    - 训练条件概率覆盖整个历史，生成时只对 assistant 部分计损失或按任务设计掩码。真实系统还需截断上下文、检索外部知识、管理角色与安全，不能把轮次简单拼接后假设无限状态。
    - 显式 one-hot 只是用稀疏向量选择矩阵行；Embedding 避免构造大多数为零的向量。
    - 趋向 v_1（可能带符号振荡）。RNN 长梯度因而可能只剩主特征方向，其他方向消失，造成严重病态。
  - title: 13. 核心结论与解决问题的一般思路
    source_heading: 13. 核心结论与解决问题的一般思路
    paragraphs:
    - 有限阶 Markov/n-gram 简化上下文，却遭遇组合爆炸、长尾稀疏、零概率和语义不共享。
    - 文本建模必须明确规范化、词元粒度、训练词表和特殊词元；这些选择改变序列长度、输出空间和 PPL。
    - One-hot 乘权重等价于嵌入查表；大词表应直接用 Embedding，避免稠密 one-hot。
    - 本章把“历史”变成了可计算对象：概率链式法则把联合序列分解为连续下一步预测，词元化和词表把文本转成分类索引，RNN 以共享参数递推固定维隐藏状态，BPTT
      再沿展开时间图分配信用。这个设计用有限状态和有限反向长度换取可计算性，也带来多步误差、暴露偏差和梯度消失/爆炸。理解状态数值、计算图和数据时间边界三者的区别，是正确使用所有后续序列模型的基础。
  takeaways:
  - 序列由有序的固定维向量组成，完整序列可相互独立，但同一序列时间步通常不能视为 IID。
  - 语言模型训练输入和目标相差一个词元；随机窗口与连续分区对应不同隐藏状态管理策略。
  - 固定截断 BPTT 保留状态数值但切断旧梯度，使计算有界并偏向短期依赖；随机截断无偏但方差高。
  - 用交叉熵总和/有效词元数算 PPL：不要平均批量 PPL，也不要跨词元化比较。
  - 本章把“历史”变成了可计算对象：概率链式法则把联合序列分解为连续下一步预测，词元化和词表把文本转成分类索引，RNN 以共享参数递推固定维隐藏状态，BPTT
    再沿展开时间图分配信用。这个设计用有限状态和有限反向长度换取可计算性，也带来多步误差、暴露偏差和梯度消失/爆炸。理解状态数值、计算图和数据时间边界三者的区别，是正确使用所有后续序列模型的基础。
