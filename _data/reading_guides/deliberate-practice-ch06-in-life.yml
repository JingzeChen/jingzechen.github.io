  question: 一、本章要解决什么问题？
  question_source: 一、本章要解决什么问题
  thesis: 个人能力提高不是靠一次决心，而是靠一套可持续训练系统：合适导师提供方向和反馈；短时高质量专注把反馈转成改变；没有导师时用优秀样本和“三个 F”自建闭环；平台期通过改变任务条件暴露具体瓶颈；长期坚持则依靠降低练习阻力、增强目标价值、建立身份与社会支持，并把远期目标拆成可见进步。
  thesis_source: 一、本章要解决什么问题
  concepts:
  - term: 一、本章要解决什么问题
    meaning: 个人能力提高不是靠一次决心，而是靠一套可持续训练系统：合适导师提供方向和反馈；短时高质量专注把反馈转成改变；没有导师时用优秀样本和“三个
      F”自建闭环；平台期通过改变任务条件暴露具体瓶颈；长期坚持则依靠降低练习阻力、增强目标价值、建立身份与社会支持，并把远期目标拆成可见进步。
    source_heading: 一、本章要解决什么问题
  - term: 4.1 不专注，练习没效果
    meaning: 美国游泳运动员娜塔莉·考芙林在书中所述时已获 12 枚奥运奖牌。她回忆早期耐力训练时容易让思绪游离，后来开始把每次划水与“完美划水”的身体感觉比较。
    source_heading: 4.1 不专注，练习没效果
  - term: 六、跨越停滞阶段
    meaning: 记者约书亚·福尔 2005 年采访艾利克森，并接受记忆选手艾德·库克指导。训练一段时间后，他记忆随机扑克牌顺序的速度不再提高，于是向艾利克森求助。
    source_heading: 六、跨越停滞阶段
  - term: 七、保持动机
    meaning: 练习时数与成绩相关，还可能受到早期水平、家庭测试支持、资源和获胜期待影响。它支持“高水平者投入更多有目的练习”，不能单独证明练习量解释全部差异。
    source_heading: 七、保持动机
  - term: 7.5 增强继续前行的倾向
    meaning: 瑞典中长跑运动员贡德·哈格后来 15 次打破世界纪录。少年时，他父亲告诉他森林中 1500 米跑了 4 分 50 秒，使他相信自己有潜力并认真训练；多年后父亲承认实际是
      5 分 50 秒。
    source_heading: 7.5 增强继续前行的倾向
  - term: 十二、复习问题
    meaning: 丹计划支持“成年人可以显著提高”，为什么不能证明“1 万小时必进职业巡回赛”？
    source_heading: 十二、复习问题
