overview:
  kind: summary
  minutes: 8
  question: 原文围绕「0. 阅读地图：分类不是“让模型输出一个标签”这么简单」建立了怎样的核心认识？
  question_source: 0. 阅读地图：分类不是“让模型输出一个标签”这么简单
  thesis: Flan-T5-small 得到约 0.84 weighted F1：接近嵌入 + 逻辑回归的 0.85，并高于跨领域 Twitter 分类器的
    0.80。它证明指令微调的生成模型可以零样本完成分类，但不能据此断言生成路线更经济：每条评论都要经过 encoder 和自回归 decoder，吞吐通常低于专用分类
    head。
  thesis_source: 6. 使用生成模型做文本分类（Text Classification with Generative Models）
  concepts:
  - term: 0. 阅读地图：分类不是“让模型输出一个标签”这么简单
    meaning: 首要基线：在引入神经模型前，应先试 TF-IDF + 逻辑回归。它训练快、可解释、CPU 友好，很多关键词驱动任务上非常强。复杂模型只有在真实验证集上稳定胜出，额外成本才有依据。
    source_heading: 0. 阅读地图：分类不是“让模型输出一个标签”这么简单
  - term: 1. 电影评论的情感（The Sentiment of Movie Reviews）
    meaning: 如果看过 test 分数后换模型或改提示，test 已参与选择，便不再是无偏最终评估。此时应使用新的独立测试集。原章为了教学在同一 test
      split 上连续演示多种方案；严格实验应把这些比较放在 validation 上，最后只让胜出方案访问 test。
    source_heading: 1. 电影评论的情感（The Sentiment of Movie Reviews）
  - term: 3. 模型选择（Model Selection）
    meaning: MTEB 等排行榜可用于建立候选集，不能代替目标数据评测。还要防止 benchmark contamination：如果预训练或微调见过测试数据，漂亮分数不代表未见数据泛化。
    source_heading: 3. 模型选择（Model Selection）
  - term: 4. 使用任务专用模型（Using a Task-Specific Model）
    meaning: Weighted F1 按每类 support 加权，不是让每类被同等对待；大类影响更大。本数据正负各 533 条，因此 macro 与
      weighted 恰好接近。Micro F1 先汇总所有类别的 TP/FP/FN；在单标签多分类中常与 accuracy 相同。
    source_heading: 4. 使用任务专用模型（Using a Task-Specific Model）
  - term: 6. 使用生成模型做文本分类（Text Classification with Generative Models）
    meaning: Flan-T5-small 得到约 0.84 weighted F1：接近嵌入 + 逻辑回归的 0.85，并高于跨领域 Twitter 分类器的
      0.80。它证明指令微调的生成模型可以零样本完成分类，但不能据此断言生成路线更经济：每条评论都要经过 encoder 和自回归 decoder，吞吐通常低于专用分类
      head。
    source_heading: 6. 使用生成模型做文本分类（Text Classification with Generative Models）
  - term: 9. 总结（Summary）
    meaning: 本章最可迁移的方法论是：把预训练能力当作可复用表示或自然语言接口，再用最少的目标域监督把它约束为稳定决策。分类系统的质量不只等于模型 F1；数据切分、标签定义、解析失败、校准、延迟和成本共同决定它是否真正可用。
    source_heading: 9. 总结（Summary）
  logic:
  - 0. 阅读地图：分类不是“让模型输出一个标签”这么简单
  - 1. 电影评论的情感（The Sentiment of Movie Reviews）
  - 2. 使用表示模型做文本分类（Text Classification with Representation Models）
  - 4. 使用任务专用模型（Using a Task-Specific Model）
  - 5. 利用嵌入的分类任务（Classification Tasks That Leverage Embeddings）
  - 6. 使用生成模型做文本分类（Text Classification with Generative Models）
  - 9. 总结（Summary）
  sections:
  - title: 0. 阅读地图：分类不是“让模型输出一个标签”这么简单
    source_heading: 0. 阅读地图：分类不是“让模型输出一个标签”这么简单
    paragraphs:
    - Token 分类：对每个 token 预测标签，如命名实体识别。
    - 本章聚焦二分类：电影评论是正面（1）还是负面（0）。虽然输出空间很小，真正困难仍包括标签定义、领域迁移、数据泄漏、类别不平衡、指标选择、输出解析和部署成本。
    - 表示模型与生成模型都能分类，但接口不同：前者直接产生类别 logits 或可用于分类的向量；后者产生 token 序列，必须通过提示约束并把文本解析为标签。
    - 首要基线：在引入神经模型前，应先试 TF-IDF + 逻辑回归。它训练快、可解释、CPU 友好，很多关键词驱动任务上非常强。复杂模型只有在真实验证集上稳定胜出，额外成本才有依据。
  - title: 1. 电影评论的情感（The Sentiment of Movie Reviews）
    source_heading: 1. 电影评论的情感（The Sentiment of Movie Reviews）
    paragraphs:
    - 在 validation 上选择模型、提示、label description、阈值和超参数。
    - 如果看过 test 分数后换模型或改提示，test 已参与选择，便不再是无偏最终评估。此时应使用新的独立测试集。原章为了教学在同一 test split
      上连续演示多种方案；严格实验应把这些比较放在 validation 上，最后只让胜出方案访问 test。
    - 标签需有一致定义；讽刺、褒贬混合和中性评论会形成标注噪声。
    - Rotten Tomatoes 评论很短且正负平衡，是便于教学的基准，但真实评论可能更长、包含中性或多方面情感，类别先验也可能不同。
  - title: 2. 使用表示模型做文本分类（Text Classification with Representation Models）
    source_heading: 2. 使用表示模型做文本分类（Text Classification with Representation Models）
    paragraphs:
    - 任务专用模型：基础 encoder 经情感分类微调，直接输出类别分数。
    - 通用嵌入模型：先把文本转为向量，再把向量交给单独分类器或相似度规则。
    - 本章不更新预训练模型参数：任务专用模型整体用于 inference；嵌入模型冻结，只训练其后的逻辑回归。后者把昂贵的表示学习与便宜的任务适配分离。
  - title: 3. 模型选择（Model Selection）
    source_heading: 3. 模型选择（Model Selection）
    paragraphs:
    - 任务与标签：情感、主题、意图还是 NLI？标签顺序是什么？
    - 语言与领域：训练于推文、电影、医疗还是多语言文本？
    - 前者与目标任务相同但领域不同；后者任务更通用，却允许用目标域标签训练轻量分类边界。这正是本章比较中最有价值的变量。
    - MTEB 等排行榜可用于建立候选集，不能代替目标数据评测。还要防止 benchmark contamination：如果预训练或微调见过测试数据，漂亮分数不代表未见数据泛化。
  - title: 4. 使用任务专用模型（Using a Task-Specific Model）
    source_heading: 4. 使用任务专用模型（Using a Task-Specific Model）
    paragraphs:
    - 这里忽略 neutral 分数等价于在正负两端中强制二选一。如果模型对某评论最确信是 neutral，仍会被分到较高的一端。生产系统可设置中性/拒答类别，或在验证集上为正负分差设阈值。
    - "“positive/negative”在 TP 等名称中表示目标类与非目标类，不表示评论情感本身；若把负面评论设为目标正类，四格命名会随之改变。"
    - F1 是 precision 与 recall 的调和平均，任一项很低都会拉低结果，但它不考虑 TN，也不编码两类错误的业务成本。
    - Weighted F1 按每类 support 加权，不是让每类被同等对待；大类影响更大。本数据正负各 533 条，因此 macro 与 weighted
      恰好接近。Micro F1 先汇总所有类别的 TP/FP/FN；在单标签多分类中常与 accuracy 相同。
  - title: 5. 利用嵌入的分类任务（Classification Tasks That Leverage Embeddings）
    source_heading: 5. 利用嵌入的分类任务（Classification Tasks That Leverage Embeddings）
    paragraphs:
    - 优势：嵌入可离线缓存；分类器在 CPU 上快速训练；可解释系数和阈值；换标签时无需重跑昂贵微调。局限是嵌入不随任务更新，若目标区分未被通用空间编码，线性分类器无法创造缺失信息。
    - 默认阈值为 0.5，但业务错误成本不对称时，应在 validation 上调阈值，并报告 precision-recall 曲线，而不是在 test 上挑最优阈值。
    - "“A negative review”与“A very negative movie review”会得到不同原型，所以 wording 会直接改变边界。改描述必须在
      validation 或一小批开发样本上评估，不能反复查看 test 选最好措辞。"
    - 原章方法约得 0.78 weighted F1，说明不收集标签也能快速验证任务可行性，但比有监督嵌入方案低。它适合冷启动和原型，不应在高风险场景中直接取代人工标注评测。
  - title: 6. 使用生成模型做文本分类（Text Classification with Generative Models）
    source_heading: 6. 使用生成模型做文本分类（Text Classification with Generative Models）
    paragraphs:
    - "“sequence-to-sequence”在广义上指输入序列到输出序列。T5 是严格的 encoder-decoder seq2seq；decoder-only
      GPT 则把提示与答案串成一个因果续写序列，内部结构不同。"
    - Flan-T5 又在大量带自然语言指令的任务上微调，提高未见指令的遵循能力。它没有专门在本章 Rotten Tomatoes train split 上训练。
    - Flan-T5-small 得到约 0.84 weighted F1：接近嵌入 + 逻辑回归的 0.85，并高于跨领域 Twitter 分类器的 0.80。它证明指令微调的生成模型可以零样本完成分类，但不能据此断言生成路线更经济：每条评论都要经过
      encoder 和自回归 decoder，吞吐通常低于专用分类 head。
    - 基础 decoder-only 模型只学续写，不天然服从“只返回 0 或 1”。ChatGPT 类模型先使用人工示范做指令微调，再利用人类排序形成偏好信号，使输出更符合“有帮助、遵循格式”的期望。
  - title: 9. 总结（Summary）
    source_heading: 9. 总结（Summary）
    paragraphs:
    - T5 的 span corruption 和多任务 text-to-text 训练，为 Flan-T5 的指令分类能力奠定基础。
    - Precision、recall、accuracy 与 F1回答不同问题；macro 等权类别，weighted 按 support 加权。
    - 选择最小可行迁移：先现成 task model 或 frozen embedding + classifier。
    - 本章最可迁移的方法论是：把预训练能力当作可复用表示或自然语言接口，再用最少的目标域监督把它约束为稳定决策。分类系统的质量不只等于模型 F1；数据切分、标签定义、解析失败、校准、延迟和成本共同决定它是否真正可用。
  takeaways:
  - 首要基线：在引入神经模型前，应先试 TF-IDF + 逻辑回归。它训练快、可解释、CPU 友好，很多关键词驱动任务上非常强。复杂模型只有在真实验证集上稳定胜出，额外成本才有依据。
  - 本章不更新预训练模型参数：任务专用模型整体用于 inference；嵌入模型冻结，只训练其后的逻辑回归。后者把昂贵的表示学习与便宜的任务适配分离。
  - Weighted F1 按每类 support 加权，不是让每类被同等对待；大类影响更大。本数据正负各 533 条，因此 macro 与 weighted
    恰好接近。Micro F1 先汇总所有类别的 TP/FP/FN；在单标签多分类中常与 accuracy 相同。
  - 原章方法约得 0.78 weighted F1，说明不收集标签也能快速验证任务可行性，但比有监督嵌入方案低。它适合冷启动和原型，不应在高风险场景中直接取代人工标注评测。
  - 本章最可迁移的方法论是：把预训练能力当作可复用表示或自然语言接口，再用最少的目标域监督把它约束为稳定决策。分类系统的质量不只等于模型 F1；数据切分、标签定义、解析失败、校准、延迟和成本共同决定它是否真正可用。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「8.1 分类模型与表示模型」？
  answer: 分类模型通常是表示 backbone 加分类 head；嵌入模型只输出通用向量。二者都可能基于 BERT，但训练目标和接口不同。
  source_heading: 8.1 分类模型与表示模型
- level: 概念辨析
  question: 原文如何解释「8.4 Weighted F1 不等于类别等权」？
  answer: Macro F1 才是每类等权。Weighted F1 按 support 加权，在不平衡数据中可能掩盖少数类失败。
  source_heading: 8.4 Weighted F1 不等于类别等权
- level: 概念辨析
  question: 原文如何解释「8.7 Zero-shot 不等于无先验知识」？
  answer: 它只是没有针对当前标签提供训练样本。嵌入/NLI/生成模型已在大量数据上训练，可能包含相似任务甚至测试材料。
  source_heading: 8.7 Zero-shot 不等于无先验知识
- level: 概念辨析
  question: 原文如何解释「8.10 Temperature 0 不保证永远确定」？
  answer: 它通常选择最高概率 token，但服务实现、模型更新和并列 logits 仍可能引入差异。复现要记录模型版本、提示和所有参数。
  source_heading: 8.10 Temperature 0 不保证永远确定
- level: 概念辨析
  question: 原文如何解释「8.13 “解释理由”不保证理由忠实」？
  answer: 生成模型可以在标签后生成流畅解释，但解释可能是事后合理化。若需可审计证据，应做 rationale faithfulness 或基于原文片段的验证。
  source_heading: 8.13 “解释理由”不保证理由忠实
