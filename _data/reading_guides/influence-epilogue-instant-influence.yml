overview:
  kind: summary
  minutes: 8
  question: 0. 导读：为什么单独整理原书尾声？
  question_source: 0. 导读：为什么单独整理原书尾声
  thesis: 第1章解释“按一下就播放”，第2—7章拆解六类按钮，尾声说明按钮不可取消，因此最终任务是维护按钮与真实世界之间的可靠连接。
  thesis_source: 42. 全章知识结构
  concepts:
  - term: 0. 导读：为什么单独整理原书尾声
    meaning: 尾声主要是全书综合论证，使用轶事、前文动物案例、历史性知识增长数字、技术预测和商业例子，而不是重新提供一组控制实验。笔记会把原书事实、作者概括和现代延伸分开。
    source_heading: 0. 导读：为什么单独整理原书尾声
  - term: 9. 文明悖论：精密大脑创造复杂世界，又被迫采用原始反应
    meaning: 单一线索响应之所以古老，是因为它计算成本低、速度快。复杂系统同样需要缓存、索引和默认值；问题在默认值被恶意输入污染时出现。
    source_heading: 9. 文明悖论：精密大脑创造复杂世界，又被迫采用原始反应
  - term: 18. “捷径应受尊重”：为什么全面回避是错误答案
    meaning: 如果每项选择都要求收集全部数据、验证所有来源、模拟所有后果，行动会因分析成本过高而停止。作者称需要依赖单一特征来解决这种“分析瘫痪”。
    source_heading: 18. “捷径应受尊重”：为什么全面回避是错误答案
  - term: 22. 真实牙膏销量：社会认同如何成为有效盟友
    meaning: 只要数据真实且表述不过度，广告商替消费者提供了昂贵的市场汇总信息，消费者可节省认知资源处理其他决定。
    source_heading: 22. 真实牙膏销量：社会认同如何成为有效盟友
  - term: 33. 证据结构：尾声使用了哪些材料
    meaning: 把它们当作作者成书时代对“信息加速”的证据，不应将142年、15年、8年和40多万直接更新或外推为2026年事实。
    source_heading: 33. 证据结构：尾声使用了哪些材料
  - term: 44. 笔记归纳：解决这类问题的一般方法
    meaning: 面对任何会出错的快捷系统，不要立刻删除系统。先问它解决了什么资源约束、错误来自算法还是输入、正常收益是否大于成本，以及能否通过来源验证、风险分层和反馈机制修复。
    source_heading: 44. 笔记归纳：解决这类问题的一般方法
  logic:
  - 0. 导读：为什么单独整理原书尾声
  - 9. 文明悖论：精密大脑创造复杂世界，又被迫采用原始反应
