  sections:
  - title: 0. 导读：为什么单独整理原书尾声
    source_heading: 0. 导读：为什么单独整理原书尾声
    paragraphs:
    - 原书正文只正式编号到第7章，随后进入“尾声”。本文件单独整理尾声内容，但不赋予其章号；尾声之后的出版社附录“湛庐，与思想有关……”不纳入笔记范围。
    - 为什么这些单一线索在现代生活中越来越不可避免？我们应当反对捷径本身，还是保护捷径的可靠性？
    - 必要性主题：人的时间、精力和认知容量有限，复杂社会又迫使人越来越依赖快捷规则。
    - 尾声主要是全书综合论证，使用轶事、前文动物案例、历史性知识增长数字、技术预测和商业例子，而不是重新提供一组控制实验。笔记会把原书事实、作者概括和现代延伸分开。
  - title: 5. 回到第1章：动物的固定行为模式
    source_heading: 5. 回到第1章：动物的固定行为模式
    paragraphs:
    - 雄性知更鸟保护领地时，对一撮红色胸羽猛烈攻击，却可能忽略没有红色胸羽的逼真雄鸟模型。颜色是高效但不完整的入侵者信号。
    - 尾声还提到特定序列的闪光可以触发完整行为。其共同点不是声音、颜色或光本身，而是某个小特征承载了通常可靠的环境意义。
    - 动物认知容量有限，无法记录和处理环境中的所有信息。进化让它们对高预测力特征特别敏感，从而以较低脑力成本作出多数时候正确的反应。
    - 臭鼬录音实验看起来荒谬，是因为研究者人为拆开了通常同时出现的线索。自然环境中，“叽叽”声多数来自健康幼鸟，所以规则总体有效。
  - title: 9. 文明悖论：精密大脑创造复杂世界，又被迫采用原始反应
    source_heading: 9. 文明悖论：精密大脑创造复杂世界，又被迫采用原始反应
    paragraphs:
    - 人类靠成熟大脑创造信息繁多、节奏快速的复杂世界；这个世界反过来超过个人处理容量，使人更依赖与动物相似的单一特征反应。
    - 问题不是人类大脑变差，而是任务规模增长。若处理能力增长较慢、输入增长更快，单位决策可投入的注意力仍会下降。
    - 单一线索响应之所以古老，是因为它计算成本低、速度快。复杂系统同样需要缓存、索引和默认值；问题在默认值被恶意输入污染时出现。
  - title: 13.3 当前不能下的结论
    source_heading: 13.3 当前不能下的结论
    paragraphs:
    - 单一线索在所有场景都比分析更好；
    - 历史增长数字仍代表2026年现状；
  - title: 18. “捷径应受尊重”：为什么全面回避是错误答案
    source_heading: 18. “捷径应受尊重”：为什么全面回避是错误答案
    paragraphs:
    - 技术与环境变化速度远快于生物认知能力演化。个人越来越常面对无法全盘考虑的局面。
    - 低等动物一直受认知容量限制；人类的新困境是自己创造了超出个人处理能力的复杂世界。
    - 如果每项选择都要求收集全部数据、验证所有来源、模拟所有后果，行动会因分析成本过高而停止。作者称需要依赖单一特征来解决这种“分析瘫痪”。
    - 即使输入真实，概率线索也不可能次次正确；普通波动、个体差异和情境变化都可能造成错误。伪造线索并不是唯一误差来源，但它具有特殊伦理性质：有人蓄意让可靠规则朝有利于自己的方向失灵，因此才是作者要求强硬反制的对象。
  - title: 22. 真实牙膏销量：社会认同如何成为有效盟友
    source_heading: 22. 真实牙膏销量：社会认同如何成为有效盟友
    paragraphs:
    - 原书更简洁地说，众人认可的行为往往管用且恰当，因此销量线索指向正确方向的概率高于出错。
    - 高销量还可能来自低价、铺货、广告和惯性。若消费者有特殊过敏、牙科需求或伦理偏好，仍需查看相关信息。
    - 只要数据真实且表述不过度，广告商替消费者提供了昂贵的市场汇总信息，消费者可节省认知资源处理其他决定。
    - 在需求普通、风险较低、没有相反证据时，真实销量可以提高候选产品的优先级。
  - title: 27. 原书尾声结论与笔记重述
    source_heading: 27. 原书尾声结论与笔记重述
    paragraphs:
    - 公平公正地帮助人使用快捷规则的顺从业者。
    - 不因投机者的习惯性操纵而被迫弃用捷径；
    - 从上述原书主张可以进一步推导：个人应保留核查和退出能力，平台应提高造假成本，评论、资格和销量等可靠规则具有认知公共资源的性质。这些是笔记的制度化重述，不是原书在尾声逐项使用的术语。
    - 第1章从火鸡、绿宝石和“按一下就播放”开始，尾声回到同一机制，却给出更成熟结论：我们不能摆脱自动化，也不应嘲笑它；应把注意力转向触发信息是否真实，以及谁在从伪造中获利。
  - title: 33. 证据结构：尾声使用了哪些材料
    source_heading: 33. 证据结构：尾声使用了哪些材料
    paragraphs:
    - 尾声的核心不是某一个新实验，而是前七章大量实验、现场研究和案例共同显示：单一线索通常有效，但能被系统化利用。
    - 把它们当作作者成书时代对“信息加速”的证据，不应将142年、15年、8年和40多万直接更新或外推为2026年事实。
    - "“伪造信号会误导”是经验判断；“因此应抵制和投诉”是规范选择。后者还需考虑比例、法律和副作用。"
    - 各高负荷状态对每条原理的精确效应量；
  - title: 37. 笔记扩展：平台和组织如何保护信号可靠性
    source_heading: 37. 笔记扩展：平台和组织如何保护信号可靠性
    paragraphs:
    - 平台需识别一个操纵者控制大量账号制造社会认同的情况。仅数账号数量不足以证明独立人数。
    - 界面可以显示销量，但不应自动标为“最佳”；还应提供适用人群、退货率、质量指标和评价分布。
    - 转账、医疗和不可逆操作应要求二次确认、冷静期或独立复核，防止单一触发器直接执行。
  - title: 44. 笔记归纳：解决这类问题的一般方法
    source_heading: 44. 笔记归纳：解决这类问题的一般方法
    paragraphs:
    - 若不能取消，转向保护输入可靠性；
    - 面对任何会出错的快捷系统，不要立刻删除系统。先问它解决了什么资源约束、错误来自算法还是输入、正常收益是否大于成本，以及能否通过来源验证、风险分层和反馈机制修复。
  takeaways:
  - 认知层：有限资源为何需要信息压缩；
  - 人类处理能力更强，却仍然有限。 效率需求使人也采用简单响应。
  - 未来对快捷规则的依赖会增加。 天然处理能力难以跟上环境复杂度。
  - 虚假信号会造成系统性损害。 人若被迫弃用捷径，便难以处理日常选择。
  - 这篇尾声不是一封反直觉、反广告或反技术的檄文，而是一套认知生态观：个体依赖快捷规则，诚实提供者帮助规则运行，操纵者污染输入，反制则恢复信号可靠性。保护捷径，实质上是在保护有限的人能够继续在复杂世界中自主行动的条件。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「28.1 自动反应与非理性」？
  answer: 自动反应是低成本、快速调用规则；非理性是相对于目标和证据表现不佳。自动规则多数时候有效，不能因偶尔出错就等同非理性。
  source_heading: 28.1 自动反应与非理性
- level: 概念辨析
  question: 原文如何解释「28.5 线索相关性与线索真实性」？
  answer: 销量可能与产品接受度相关，但广告给出的销量可能虚假。相关性解决“如果是真的，有没有用”，真实性解决“它到底是不是真的”。
  source_heading: 28.5 线索相关性与线索真实性
- level: 概念辨析
  question: 原文如何解释「28.9 社会认同与从众」？
  answer: 社会认同是利用他人行为获取环境信息；从众更广，可包括规范压力和害怕排斥。真实销量例子主要使用信息性社会认同。
  source_heading: 28.9 社会认同与从众
- level: 概念辨析
  question: 原文如何解释「28.12 分析瘫痪与谨慎」？
  answer: 谨慎按风险分配核查；分析瘫痪是不顾边际收益地持续搜集，错过行动。尾声主张可靠捷径，正是为了避免后者。
  source_heading: 28.12 分析瘫痪与谨慎
- level: 概念辨析
  question: 原文如何解释「41.19 误区十九：历史数字仍是当前统计」？
  answer: 142年、15年、8年和40多万期刊属于成书时代口径，不能直接标为2026年数据。
  source_heading: 41.19 误区十九：历史数字仍是当前统计
