checks:
- level: 概念辨析
  question: 原文如何解释「13.1 Durability 不等于 Availability」？
  answer: 数据没丢但服务暂不可访问，是高耐久低可用事件；请求成功率不能代替丢失概率。
  source_heading: 13.1 Durability 不等于 Availability
- level: 概念辨析
  question: 原文如何解释「13.11 4+2 EC 不是两个完整副本」？
  answer: 它是 4 Data + 2 Parity，需任意 4 健康块恢复；Read/Repair 要跨多节点。
  source_heading: 13.11 4+2 EC 不是两个完整副本
- level: 概念辨析
  question: 原文如何解释「13.17 每 Core 一个 Active File 不等于无限扩写」？
  answer: 磁盘带宽、Fsync、SQLite Mapping 和 Replication 仍是共享瓶颈。
  source_heading: 13.17 每 Core 一个 Active File 不等于无限扩写
- level: 概念辨析
  question: 原文如何解释「13.23 Versioning 不使用 Delta Patch」？
  answer: 每次 PUT 是完整新 Immutable Object，存储成本按版本累积。
  source_heading: 13.23 Versioning 不使用 Delta Patch
- level: 概念辨析
  question: 原文如何解释「13.29 可用容量不等于原始磁盘容量」？
  answer: 要扣 Replica/EC、Headroom、GC、Repair、坏盘和文件系统开销。
  source_heading: 13.29 可用容量不等于原始磁盘容量
