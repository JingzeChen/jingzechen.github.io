overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章主线：从预测问题到顺序决策问题」建立了怎样的核心认识？
  question_source: 1. 本章主线：从预测问题到顺序决策问题
  thesis: Q-learning 行为可探索、target 却取 greedy max，因此是 off-policy；SARSA 使用实际下一动作，属于 on-policy。
  thesis_source: 17. 核心结论与解决强化学习问题的一般思路
  concepts:
  - term: 1. 本章主线：从预测问题到顺序决策问题
    meaning: 本章只讨论有限表格型 MDP 的基础算法，没有真正进入深度强化学习。其价值在于建立后续 DQN、actor-critic、policy gradient
      等方法共同依赖的 Bellman、TD 和探索概念。
    source_heading: 1. 本章主线：从预测问题到顺序决策问题
  - term: 3.12 MountainCar 的 MDP
    meaning: objective：尽快到达右侧山顶。
    source_heading: 3.12 MountainCar 的 MDP
  - term: 7. 从已知模型到未知模型
    meaning: 等于 Bellman target（适当处理终止）。因此单个实际转移可作为随机 target。
    source_heading: 7. 从已知模型到未知模型
  - term: 10.1 自我纠正的直觉
    meaning: 若某动作 Q 被高估，行为策略更常选择它；若实际回报差，后续 TD target 会把 Q 拉低。好动作因高回报被强化。
    source_heading: 10.1 自我纠正的直觉
  - term: 11.5 训练与评估分离
    meaning: 报告平均 return、成功率、episode length 和置信区间。
    source_heading: 11.5 训练与评估分离
  - term: 17. 核心结论与解决强化学习问题的一般思路
    meaning: 本章的主线可以压缩为一句话：MDP 把顺序决策写成状态、动作、转移和奖励；Bellman 方程用一步递归把长期回报分解；已知模型时，价值迭代对全部状态动作做精确期望
      backup；未知模型时，Q-learning 用环境给出的一步样本做随机 TD backup，并通过探索获取覆盖。真正正确的实现取决于四个细节：max
      与 argmax 的类型、期望与 max 的顺序、terminal 与 truncation 的区分，以及行为探索是否足以覆盖状态动作空间。
    source_heading: 17. 核心结论与解决强化学习问题的一般思路
  logic:
  - 1. 本章主线：从预测问题到顺序决策问题
  - 3.12 MountainCar 的 MDP
  - 4. 策略与价值函数
  - 10.1 自我纠正的直觉
  - 10.4 Value Iteration 与 Q-learning 轮数不能直接比较
  - 13. 可运行的综合 Python 实验
  - 17. 核心结论与解决强化学习问题的一般思路
  sections:
  - title: 1. 本章主线：从预测问题到顺序决策问题
    source_heading: 1. 本章主线：从预测问题到顺序决策问题
    paragraphs:
    - 模型对一个测试样本的预测一般不会改变下一个测试样本的分布。强化学习（Reinforcement Learning, RL）则研究顺序决策：当前动作会改变下一状态、未来能观察到的数据以及之后可获得的奖励。
    - 在环境存在随机性、奖励可能延迟、动作会改变未来的情况下，应该采用什么决策规则，才能最大化长期期望回报？
    - 若环境模型未知，用实际交互得到的下一状态替代转移分布期望，形成 Q-learning；
    - 本章只讨论有限表格型 MDP 的基础算法，没有真正进入深度强化学习。其价值在于建立后续 DQN、actor-critic、policy gradient
      等方法共同依赖的 Bellman、TD 和探索概念。
  - title: 3.2 状态（State）
    source_heading: 3.2 状态（State）
    paragraphs:
    - 状态 S_t 应包含当前决策和预测未来所需的信息。例如网格机器人可用所在格子作为状态。
    - 完整状态：位置、速度、库存、时间等；
    - 历史摘要：RNN hidden state、belief state。
    - 若观测不能充分描述环境，问题更准确地属于 POMDP，而不是完全可观测 MDP。
  - title: 3.12 MountainCar 的 MDP
    source_heading: 3.12 MountainCar 的 MDP
    paragraphs:
    - state：位置 x 与速度 v；
    - actions：左推、无推力、右推；
    - transition：车辆动力学、重力和边界；
    - objective：尽快到达右侧山顶。
  - title: 4. 策略与价值函数
    source_heading: 4. 策略与价值函数
    paragraphs:
    - 随机策略可用于探索、对抗和混合最优解；有限折扣 MDP 至少存在一个平稳确定性最优策略。
    - 这是动态规划的“最优子结构”：若整条未来决策最优，那么从任一后继状态开始的剩余决策也必须最优。
    - Bellman 方程不是额外经验规律，而是回报递归、Markov 性和条件期望的直接结果。
    - 直接求逆成本高且大状态空间不可行，迭代 policy evaluation 更常用。
  - title: 7. 从已知模型到未知模型
    source_heading: 7. 从已知模型到未知模型
    paragraphs:
    - 等于 Bellman target（适当处理终止）。因此单个实际转移可作为随机 target。
    - 直接从样本学习 value/policy；
    - Q-learning 是表格型 model-free control。
    - "“Model-free”不代表没有环境，只是不构建可查询的显式动力学模型。"
  - title: 10.1 自我纠正的直觉
    source_heading: 10.1 自我纠正的直觉
    paragraphs:
    - 若某动作 Q 被高估，行为策略更常选择它；若实际回报差，后续 TD target 会把 Q 拉低。好动作因高回报被强化。
    - 这个反馈直觉有帮助，但不等于无条件收敛。若从不探索某动作，高估/低估就无数据纠正；若学习率恒大，估计会持续抖动。
  - title: 10.4 Value Iteration 与 Q-learning 轮数不能直接比较
    source_heading: 10.4 Value Iteration 与 Q-learning 轮数不能直接比较
    paragraphs:
    - Bellman backups；
    - 价值迭代样本效率看似无限好，是因为环境模型已经完整给出；获取该模型本身可能非常昂贵。
  - title: 11.5 训练与评估分离
    source_heading: 11.5 训练与评估分离
    paragraphs:
    - 收集 steps、TD error、visitation。
    - 报告平均 return、成功率、episode length 和置信区间。
  - title: 13. 可运行的综合 Python 实验
    source_heading: 13. 可运行的综合 Python 实验
    paragraphs:
    - Value Iteration 收敛与策略提取；
    - Q-learning 的 terminal mask、off-policy target 与学习；
    - Q-learning 不读取完整转移期望，只采样一步，使用访问次数衰减学习率和衰减探索，最终贪心策略在确定性起点成功率 100%；
  - title: 17. 核心结论与解决强化学习问题的一般思路
    source_heading: 17. 核心结论与解决强化学习问题的一般思路
    paragraphs:
    - Q-learning 行为可探索、target 却取 greedy max，因此是 off-policy；SARSA 使用实际下一动作，属于 on-policy。
    - 真正 terminal 禁止 bootstrap，外部 truncation 通常仍应 bootstrap；现代 Gymnasium 明确区分两者。
    - 比较算法时统一成本：environment steps、model calls、Bellman backups、wall-clock，而非名称相同的 iteration。
    - 本章的主线可以压缩为一句话：MDP 把顺序决策写成状态、动作、转移和奖励；Bellman 方程用一步递归把长期回报分解；已知模型时，价值迭代对全部状态动作做精确期望
      backup；未知模型时，Q-learning 用环境给出的一步样本做随机 TD backup，并通过探索获取覆盖。真正正确的实现取决于四个细节：max
      与 argmax 的类型、期望与 max 的顺序、terminal 与 truncation 的区分，以及行为探索是否足以覆盖状态动作空间。
  takeaways:
  - 强化学习研究动作会改变未来状态和数据分布的顺序决策，目标是最大化策略的长期期望回报。
  - Q-learning 行为可探索、target 却取 greedy max，因此是 off-policy；SARSA 使用实际下一动作，属于 on-policy。
  - 明确动作与约束：离散/连续、状态依赖合法动作、安全边界。
  - 随机打破 argmax 平局：避免 action-index 偏置。
  - 本章的主线可以压缩为一句话：MDP 把顺序决策写成状态、动作、转移和奖励；Bellman 方程用一步递归把长期回报分解；已知模型时，价值迭代对全部状态动作做精确期望
    backup；未知模型时，Q-learning 用环境给出的一步样本做随机 TD backup，并通过探索获取覆盖。真正正确的实现取决于四个细节：max 与
    argmax 的类型、期望与 max 的顺序、terminal 与 truncation 的区分，以及行为探索是否足以覆盖状态动作空间。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「14.4 State 就是当前传感器观测」？
  answer: 观测可能缺速度、隐藏意图等信息；充分 state 可能需要历史或 belief。
  source_heading: 14.4 State 就是当前传感器观测
- level: 概念辨析
  question: 原文如何解释「14.9 Policy 必须是确定性的」？
  answer: 策略一般是动作分布；有限折扣 MDP 存在确定性最优策略，但探索和对抗中随机策略仍有用。
  source_heading: 14.9 Policy 必须是确定性的
- level: 概念辨析
  question: 原文如何解释「14.19 Q-learning 估计环境转移矩阵」？
  answer: 表格 Q-learning 直接学习 action values，不显式估计 P。
  source_heading: 14.19 Q-learning 估计环境转移矩阵
- level: 概念辨析
  question: 原文如何解释「14.28 “自我纠正”保证任何函数逼近 Q-learning 稳定」？
  answer: 函数逼近、bootstrap、off-policy 的组合可能发散，称为 deadly triad。
  source_heading: 14.28 “自我纠正”保证任何函数逼近 Q-learning 稳定
- level: 概念辨析
  question: 原文如何解释「14.32 FrozenLake 默认是确定性的」？
  answer: 标准 Gymnasium 通常默认 slippery；原书是可靠动作的教学特例。
  source_heading: 14.32 FrozenLake 默认是确定性的
