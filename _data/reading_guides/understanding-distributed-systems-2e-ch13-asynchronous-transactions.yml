overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 本章定位：长时间跨服务操作不能一直持锁等待」建立了怎样的核心认识？
  question_source: 0. 本章定位：长时间跨服务操作不能一直持锁等待
  thesis: Relay 必须 ACK 后才删除/标记 row。 Send 后删除前 crash 会重复 delivery，因此 consumer 必须 dedup。
  thesis_source: 16. 核心结论
  concepts:
  - term: 0. 本章定位：长时间跨服务操作不能一直持锁等待
    meaning: 若 coordinator、participant 或网络很慢，transaction 无法推进。若同时用 2PL 提供 isolation，prepared
      participants 会长期持锁，其他 transactions 也被阻塞。
    source_heading: 0. 本章定位：长时间跨服务操作不能一直持锁等待
  - term: 4. Sagas
    meaning: 任一步可因业务或技术原因失败。若 flight 成功、hotel 失败，需要 cancel flight。Outbox 只保证一条 change
      最终传播，不表达多步骤条件分支和补偿流程。
    source_heading: 4. Sagas
  - term: 6.1 Orchestration
    meaning: 原章采用 orchestrator：中央 workflow state machine 明确命令 participants。
    source_heading: 6.1 Orchestration
  - term: 6.3 Managed workflow engines
    meaning: activity delivery semantics；
    source_heading: 6.3 Managed workflow engines
  - term: 9. 其他隔离设计策略
    meaning: 每一步写入 expected version；若状态被其他 workflow 修改，abort/replan，而不是覆盖。
    source_heading: 9. 其他隔离设计策略
  - term: 17. 从本章提炼出的通用解题方法
    meaning: 在 local commit 后、send 后、ACK 前、checkpoint 前、compensation 中逐点 crash；验证无丢
      message、无重复 effect、workflow 可恢复且 stale coordinator 被拒绝。
    source_heading: 17. 从本章提炼出的通用解题方法
