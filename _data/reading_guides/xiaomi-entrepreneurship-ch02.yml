overview:
  kind: summary
  minutes: 8
  question: 原文围绕「一、本章主线」建立了怎样的核心认识？
  question_source: 一、本章主线
  thesis: 危机起点：2015 年手机销售未达目标，核心业务开始下滑。 +> 外部变化：市场从增量转向存量，电商渠道触顶，行业进入寡头竞争。 +> 内部心态：膨胀、失去专注、KPI
    导向、远离用户。 +> 内部能力：硬件研发、管理、供应链和质量体系没有跟上规模。 +> 三项补课：交付、创新、质量。 +> 四项措施：重建管理班子、成立供应链团队、投入核心技术、实行质量一票否决。
    +> 恢复基础：用户信任、伙伴支持、工程师文化和真正的组织改变。 +> 代表产品：MIX 证明公司在危机中没有放弃长期创新。 +> 核心教训：增长不是能力本身；当环境改变，企业必须把早期依赖个人和机会的成功，升级为可持续的系统能力。
  thesis_source: 十四、本章方法论总结
  concepts:
  - term: 一、本章主线
    meaning: 2014 年，小米用三年时间成为中国第一、世界第三，估值达到 460 亿美元。高光之后，2015 年手机销量未完成目标，随后进入两年低谷。
    source_heading: 一、本章主线
  - term: 4.2 增长怎样掩盖问题
    meaning: 用户数量快速上升，团队不再有能力保持早期的紧密互动。
    source_heading: 4.2 增长怎样掩盖问题
  - term: 八、补课：交付、创新和质量
    meaning: 雷军曾一天开 23 个会，反映危机程度，也说明原有管理系统无法自行解决问题。CEO 亲自救火只能是阶段性措施，长期仍要建立能独立运转的组织。
    source_heading: 八、补课：交付、创新和质量
  - term: 九、四项具体整改
    meaning: 质量容易在进度、成本和销量压力下被牺牲。所谓一票否决，是把质量从“众多考核项之一”提升为不能交换的底线：即使发布节点重要、销售目标紧张，只要质量不达标，就不能继续。
    source_heading: 九、四项具体整改
  - term: 12.1 从交易关系变成伙伴关系
    meaning: MIX 和后来的产品创新不只依赖小米研发，也依赖供应商共同开发、试产和量产。
    source_heading: 12.1 从交易关系变成伙伴关系
  - term: 十四、本章方法论总结
    meaning: 危机起点：2015 年手机销售未达目标，核心业务开始下滑。 +> 外部变化：市场从增量转向存量，电商渠道触顶，行业进入寡头竞争。 +> 内部心态：膨胀、失去专注、KPI
      导向、远离用户。 +> 内部能力：硬件研发、管理、供应链和质量体系没有跟上规模。 +> 三项补课：交付、创新、质量。 +> 四项措施：重建管理班子、成立供应链团队、投入核心技术、实行质量一票否决。
      +> 恢复基础：用户信任、伙伴支持、工程师文化和真正的组织改变。 +> 代表产品：MIX 证明公司在危机中没有放弃长期创新。 +> 核心教训：增长不是能力本身；当环境改变，企业必须把早期依赖个人和机会的成功，升级为可持续的系统能力。
    source_heading: 十四、本章方法论总结
