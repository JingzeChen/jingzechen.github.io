- level: 概念辨析
  question: 原文如何解释「4.1 “客观度量必须是单个数字”」？
  answer: 正确理解：客观意味着边界、方法和结果可解释、可重复，不等于只能量化成一分。
  source_heading: 4.1 “客观度量必须是单个数字”
- level: 概念辨析
  question: 原文如何解释「4.8 “每个 if 都使路径数翻倍”」？
  answer: 错误之处：CC 计独立路径，不是所有可能路径组合；两个顺序条件通常是 CC=3，而非 4。
  source_heading: 4.8 “每个 if 都使路径数翻倍”
- level: 概念辨析
  question: 原文如何解释「4.19 “ArchUnit 示例覆盖了图中所有层”」？
  answer: 错误之处：原示例定义 Controller、Service、Persistence，未显式定义 Presentation。
  source_heading: 4.19 “ArchUnit 示例覆盖了图中所有层”
- level: 概念辨析
  question: 原文如何解释「4.21 “混沌工程就是随机破坏生产”」？
  answer: 正确理解：受控提出假设、限制 blast radius、观察并改进韧性。
  source_heading: 4.21 “混沌工程就是随机破坏生产”
- level: 概念辨析
  question: 原文如何解释「4.22 “检查清单只给经验不足的人用”」？
  answer: 正确理解：清单和 fitness function 让专家把注意力用于真正需要判断的部分。
  source_heading: 4.22 “检查清单只给经验不足的人用”
