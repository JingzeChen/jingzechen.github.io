  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - 怎样通过拆解 composite characteristic 建立 ubiquitous language 和客观定义？
    - first contentful paint、first CPU idle 和 K-weight budget 说明性能定义怎样随设备与工具演进？
    - Netflix 的 Chaos Monkey、Latency Monkey、Chaos Kong、Conformity/Security/Janitor
      Monkey 分别验证什么？
    - 一句话概括：不要只给架构特征起名字，要把它拆成团队共同理解的可观察结果，再用离变更最近、反馈最快的自动机制持续验证；指标触发调查而不替代判断，治理保护意图而不是保护数字。
  - title: 1. 开篇：从定义走向持续控制
    source_heading: 1. 开篇：从定义走向持续控制
    paragraphs:
    - performance、elasticity、scalability 等运行关注；
    - modularity、deployability 等结构和交付关注；
    - 无法判断是否满足：团队都同意“系统应敏捷”，却不知道怎样验收；
    - 无法防止退化：初始设计符合意图，日常修改仍会逐渐引入环依赖、越层访问和脆弱故障路径。
  - title: 2. Measuring Architecture Characteristics：度量架构特征
    source_heading: 2. Measuring Architecture Characteristics：度量架构特征
    paragraphs:
    - 当组织同意所有人使用标准、具体定义时，就形成围绕架构的 ubiquitous language。共同语言不是维护一张术语表，而是让不同角色面对同一证据得出相近判断。
    - 平均值只从 100 ms 增至 109 ms，看起来良好；每一百个请求中却有一个等待十倍时间。在大流量站点，这仍会稳定影响大量真实请求。请求比例不能直接换算成用户比例，因为一个用户可能发出多个请求。
    - 代码对应加权平均。它说明平均值的盲区，不意味着 maximum 永远是最佳指标：最大值会被单个异常、采样周期和测量错误主导。生产中通常组合使用 p50、p95、p99、最大值、错误率和请求量。
    - 组织通过用户行为研究发现，页面首次可见进展的理想时间是“一秒的某个分数”。原文还说多数应用在该指标上落入“两位数范围”，但没有明确该处单位，因此不应擅自解释为秒或毫秒。对争夺用户注意力的现代站点，这种数量级差距会直接影响流失和转化，值得单独跟踪。
  - title: 3. Governance and Fitness Functions：治理与适应度函数
    source_heading: 3. Governance and Fitness Functions：治理与适应度函数
    paragraphs:
    - "《Building Evolutionary Architectures》中的 evolutionary 更多来自 evolutionary computing，而非生物进化。作者
      Rebecca Parsons 曾从事遗传算法等工作。"
    - 图中还有 Presentation，示例代码没有把它声明为层。未建模类对已定义层的依赖是被检查还是被忽略，取决于 ArchUnit 版本、dependency
      setting 和规则范围，不能一概而论。若要治理图中的四层，应显式定义 Presentation，并按项目 API 要求确保所有目标类都包含在架构模型中。
    - 代码选择当前域中名称以指定 Presentation namespace 开头的类型，断言其静态元数据/IL 中不能直接引用名称匹配 Data namespace
      的类型，最后返回检查是否成功。
    - Netflix 的演进式架构中，开发者迁移到新服务后，旧服务可能仍在云中运行却没有任何路由。Janitor Monkey 查找孤儿实例并从生产中清除，减少云成本和无主攻击面。
  - title: 5. 从本章提炼的通用度量与治理方法
    source_heading: 5. 从本章提炼的通用度量与治理方法
    paragraphs:
    - 不要为所有可测事物建仪表盘。先使用第 5 章得到的 driving characteristics。
    - 把 agility、resilience 等拆成模块化、部署、测试、恢复等可观察部分。
    - 选择 unit test、monitor、metric、chaos experiment 或 checklist，把规则放在最快有效反馈点。
    - 先告警观察误报，再在证据成熟时阻断；高风险生产实验从小 blast radius 开始。
  - title: 6. 本章知识结构
    source_heading: 6. 本章知识结构
    paragraphs:
    - 语义层：拆解复合特征并建立共同客观定义；
    - 证据层：按运行、结构、过程选择合适指标、测试和实验；
    - 反馈层：把验证放入 CI、监控和受控生产环境；
    - 治理层：让团队理解意图，防止指标博弈，并随证据修订规则。
  - title: 7. 核心结论
    source_heading: 7. 核心结论
    paragraphs:
    - Architectural fitness function 是任何对一个或多个架构特征提供客观完整性评估的机制，不是特定框架。
    - Fitness function 必须与开发者共同理解和设计，否则会形成 ivory tower、抵触和指标博弈。
    - Chaos Monkey、Latency Monkey 和 Chaos Kong 用受控故障验证生产韧性，前提是故障迟早会发生。
    - Conformity、Security 和 Janitor Monkey 分别治理服务规范、安全配置和孤儿云资源。
  - title: 8. 主动回忆与应用题
    source_heading: 8. 主动回忆与应用题
    paragraphs:
    - 给出 essential complexity 与 accidental complexity 各一个例子，并提出不扭曲领域语义的重构方式。
    - 用 Traveling Salesperson Problem 解释多项 fitness functions 为什么可能互相冲突。
    - 比较 ArchUnit、NetArchTest、运行监控和 chaos experiment：它们分别能看到什么、看不到什么？
    - 比较 Chaos Monkey、Latency Monkey、Chaos Kong、Conformity Monkey、Security Monkey
      和 Janitor Monkey 的目标。
  takeaways:
  - 语义层：拆解复合特征并建立共同客观定义；
  - 平均响应时间会掩盖小比例极慢请求，应组合分位数、最大值、错误率和请求量。
  - Deployability 可以通过部署成功率、持续时间和部署引发问题等结果度量。
  - JDepend 能检查包环和主序列距离，但阈值、范围与例外必须由项目上下文决定。
  - 最好的治理是自动反馈与人的判断结合，既保护架构意图，也允许规则随上下文修订。
