  - 这与第 9 章 EM 算法（定理 9.1 单调性、定理 9.2 只到稳定点）的情形完全平行。
  - 而平均直径（式 14.11 的直径在各类上取平均）有一个不同的性质：一旦 k 超过真实类别数，再细分一个已经很紧密的类，直径几乎不再下降——于是曲线出现拐点，拐点处就是最优的
    k。
  - k 均值聚类算法，首先选择 k 个类的中心，将样本分到与中心最近的类中，得到一个聚类结果；然后计算每个类的样本的均值，作为类的新的中心；重复以上步骤，直到收敛为止。
