  sections:
  - title: 0. 本章解决什么问题
    source_heading: 0. 本章解决什么问题
    paragraphs:
    - 聚类是针对给定的样本，依据它们特征的相似度或距离，将其归并到若干个”类”或”簇”的数据分析问题。一个类是给定样本集合的一个子集。 直观上，相似的样本聚集在相同的类，不相似的样本分散在不同的类。这里，样本之间的相似度或距离起着重要作用。
    - 聚类的目的是通过得到的类或簇来发现数据的特点或对数据进行处理，在数据挖掘、模式识别等领域有着广泛的应用。聚类属于无监督学习，因为只是根据样本的相似度或距离将其进行归类，而类或簇事先并不知道。
    - 聚类的核心概念是相似度（similarity）或距离（distance），有多种相似度或距离的定义。因为相似度直接影响聚类的结果，所以其选择是聚类的根本问题。
      具体哪种相似度更合适取决于应用问题的特性。
    - 层次聚类又有聚合（自下而上）和分裂（自上而下）两种方法。……k 均值聚类是基于中心的聚类方法，通过迭代，将样本分到 k 个类中，使得每个样本与其所属类的中心或均值最近，得到
      k 个”平坦的”、非层次化的类别，构成对空间的划分。
  - title: 14.1 聚类的基本概念
    source_heading: 14.1 聚类的基本概念
    paragraphs:
    - 马哈拉诺比斯距离（Mahalanobis distance），简称马氏距离，也是另一种常用的相似度，考虑各个分量（特征）之间的相关性并与各个分量的尺度无关。马哈拉诺比斯距离越大相似度越小，距离越小相似度越大。
    - 这与统计学中常见的”两个变量在 n 个观测上的相关系数”方向相反。本章度量的是两个样本的”属性变化模式”是否一致——比如两个用户对 m 部电影的评分，评分绝对值可能差很多（一个人普遍打高分、另一个普遍打低分），但升降模式一致，相关系数就接近
      1。
    - 通过聚类得到的类或簇，本质是样本的子集。如果一个聚类方法假定一个样本只能属于一个类，或类的交集为空集，那么该方法称为硬聚类（hard clustering）方法。否则，如果一个样本可以属于多个类，或类的交集不为空集，那么该方法称为软聚类（soft
      clustering）方法。本章只考虑硬聚类方法。
    - 定义 14.5 虽然最直观，但太严格——只要有一对点稍远，整组就不能算类。而现实中的”类”往往是链状或长条形的（比如一条街上的商铺），两端相距很远，但中间是连续的。定义
      14.6 正是为这种情况准备的。
  - title: 14.2 层次聚类
    source_heading: 14.2 层次聚类
    paragraphs:
    - 层次聚类假设类别之间存在层次结构，将样本聚到层次化的类中。层次聚类又有聚合（agglomerative）或自下而上（bottom-up）聚类、分裂（divisive）或自上而下（top-down）聚类两种方法。因为每个样本只属于一个类，所以层次聚类属于硬聚类。
    - 分裂聚类开始将所有样本分到一个类；之后将已有类中相距最远的样本分到两个新的类，重复此操作直到满足停止条件；得到层次化的类别。本书只介绍聚合聚类。
    - 聚合聚类的具体过程如下：对于给定的样本集合，开始将每个样本分到一个类；然后按照一定规则，例如类间距离最小，将最满足规则条件的两个类进行合并；如此反复进行，每次减少一个类，直到满足停止条件，如所有样本聚为一类。
    - 如果采用欧氏距离为样本之间距离；类间距离最小为合并规则，其中最短距离为类间距离；类的个数是 1，即所有样本聚为一类，为停止条件，那么聚合聚类的算法如下。
  - title: 14.3.2 策略
    source_heading: 14.3.2 策略
    paragraphs:
    - 原书特意用了”欧氏距离平方”这个词。为什么要平方？见 14.3.3 节的推导——平方使得”最优中心 = 均值”有闭式解，这正是”k 均值”名字的来源。若不平方，最优中心是几何中位数，没有闭式解（那是
      k-medians 算法）。
    - 相似的样本被聚到同类时，损失函数值最小，这个目标函数的最优化能达到聚类的目的。
    - 这个数字是指数级的。 事实上，k 均值聚类的最优解求解问题是 NP 困难问题。现实中采用迭代的方法求解。
    - 式 (14.21) 就是第二类 Stirling 数（Stirling number of the second kind），完整证明见习题 14.3（本笔记
      14.7 节）。
  - title: 14.3.3 算法
    source_heading: 14.3.3 算法
    paragraphs:
    - k 均值聚类的算法是一个迭代的过程，每次迭代包括两个步骤。首先选择 k 个类的中心，将样本逐个指派到与其最近的中心的类中，得到一个聚类结果；然后更新每个类的样本的均值，作为类的新的中心；重复以上步骤，直到收敛为止。
    - 就是说在类中心确定的情况下，将每个样本分到一个类中，使样本和其所属类的中心之间的距离总和最小。求解结果，将每个样本指派到与其最近的中心 m_l 的类 G_l
      中。
    - 平方带来的是”简洁”，代价是”对离群点敏感” —— 这与第 12 章讨论指数损失时的逻辑完全相同。
    - 这与第 9 章 EM 算法（定理 9.1 单调性、定理 9.2 只到稳定点）的情形完全平行。
  - title: 14.3.5 算法特性
    source_heading: 14.3.5 算法特性
    paragraphs:
    - k 均值聚类属于启发式方法，不能保证收敛到全局最优，初始中心的选择会直接影响聚类结果。注意，类中心在聚类的过程中会发生移动，但是往往不会移动太大，因为在每一步，样本被分到与其最近的中心的类中。
    - 初始中心的选择，比如可以用层次聚类对样本进行聚类，得到 k 个类时停止。然后从每个类中选取一个与中心距离最近的点。
    - k 均值聚类中的类别数 k 值需要预先指定，而在实际应用中最优的 k 值是不知道的。解决这个问题的一个方法是尝试用不同的 k 值聚类，检验各自得到聚类结果的质量，推测最优的
      k 值。聚类结果的质量可以用类的平均直径来衡量。一般地，类别数变小时，平均直径会增加；类别数变大超过某个值以后，平均直径会不变；而这个值正是最优的 k
      值。图 14.3 说明类别数与平均直径的关系。实验时，可以采用二分查找，快速找到最优的 k 值。
    - 而平均直径（式 14.11 的直径在各类上取平均）有一个不同的性质：一旦 k 超过真实类别数，再细分一个已经很紧密的类，直径几乎不再下降——于是曲线出现拐点，拐点处就是最优的
      k。
  - title: 14.5 【补充】深入理解
    source_heading: 14.5 【补充】深入理解
    paragraphs:
    - 实践中的常见组合（原书 14.3.5 节第 3 点也提到）：先用层次聚类在小样本上确定 k 和初始中心，再用 k 均值在全量数据上跑。
    - 为什么有效：离已有中心越远的点，被选中的概率越大——既避免了”所有中心挤在一起”，又保留了随机性（比”确定性地取最远点”更稳健，不会被离群点主导）。
    - 不一定。单连接容易产生链式效应，但也唯一能发现任意形状的类（例如两条平行的长曲线）。完全连接虽然抗链式效应，却会把大而松散的真实类拆开。没有普遍更优的连接方式。
    - 可以换，但那就不是 k 均值了。均值是”极小化欧氏距离平方和”的唯一最优解（本笔记 14.3.3 节有推导）。换成中位数对应 k-medians（目标函数改为不平方的距离），换成实际样本点对应
      k-medoids。目标函数与代表元必须配套。
  - title: 14.6 本章概要与方法论总结
    source_heading: 14.6 本章概要与方法论总结
    paragraphs:
    - 1. 聚类是针对给定的样本，依据它们属性的相似度或距离，将其归并到若干个”类”或”簇”的数据分析问题。一个类是样本的一个子集。 直观上，相似的样本聚集在同类，不相似的样本分散在不同类。
    - 聚合聚类开始将每个样本各自分到一个类；之后将相距最近的两类合并，建立一个新的类，重复此操作直到满足停止条件；得到层次化的类别。分裂聚类开始将所有样本分到一个类；之后将已有类中相距最远的样本分到两个新的类，重复此操作直到满足停止条件；得到层次化的类别。
    - 6. k 均值聚类是常用的聚类算法，有以下特点：基于划分的聚类方法；类别数 k 事先指定；以欧氏距离平方表示样本之间的距离或相似度，以中心或样本的均值表示类别；以样本和其所属类的中心之间的距离的总和为优化的目标函数；得到的类别是平坦的、非层次化的；算法是迭代算法，不能保证得到全局最优。
    - k 均值聚类算法，首先选择 k 个类的中心，将样本分到与中心最近的类中，得到一个聚类结果；然后计算每个类的样本的均值，作为类的新的中心；重复以上步骤，直到收敛为止。
