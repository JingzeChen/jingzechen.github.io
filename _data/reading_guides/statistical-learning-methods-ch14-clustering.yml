overview:
  kind: summary
  minutes: 11
  question: 0. 本章解决什么问题？
  question_source: 0. 本章解决什么问题
  thesis: k 均值聚类中的类别数 k 值需要预先指定，而在实际应用中最优的 k 值是不知道的。解决这个问题的一个方法是尝试用不同的 k 值聚类，检验各自得到聚类结果的质量，推测最优的
    k 值。聚类结果的质量可以用类的平均直径来衡量。一般地，类别数变小时，平均直径会增加；类别数变大超过某个值以后，平均直径会不变；而这个值正是最优的 k 值。图
    14.3 说明类别数与平均直径的关系。实验时，可以采用二分查找，快速找到最优的 k 值。
  thesis_source: 14.3.5 算法特性
  concepts:
  - term: 0. 本章解决什么问题
    meaning: 聚类是针对给定的样本，依据它们特征的相似度或距离，将其归并到若干个”类”或”簇”的数据分析问题。一个类是给定样本集合的一个子集。 直观上，相似的样本聚集在相同的类，不相似的样本分散在不同的类。这里，样本之间的相似度或距离起着重要作用。
    source_heading: 0. 本章解决什么问题
  - term: 14.1 聚类的基本概念
    meaning: 通过聚类得到的类或簇，本质是样本的子集。如果一个聚类方法假定一个样本只能属于一个类，或类的交集为空集，那么该方法称为硬聚类（hard clustering）方法。否则，如果一个样本可以属于多个类，或类的交集不为空集，那么该方法称为软聚类（soft
      clustering）方法。本章只考虑硬聚类方法。
    source_heading: 14.1 聚类的基本概念
  - term: 14.3.2 策略
    meaning: 原书特意用了”欧氏距离平方”这个词。为什么要平方？见 14.3.3 节的推导——平方使得”最优中心 = 均值”有闭式解，这正是”k 均值”名字的来源。若不平方，最优中心是几何中位数，没有闭式解（那是
      k-medians 算法）。
    source_heading: 14.3.2 策略
  - term: 14.3.3 算法
    meaning: k 均值聚类的算法是一个迭代的过程，每次迭代包括两个步骤。首先选择 k 个类的中心，将样本逐个指派到与其最近的中心的类中，得到一个聚类结果；然后更新每个类的样本的均值，作为类的新的中心；重复以上步骤，直到收敛为止。
    source_heading: 14.3.3 算法
  - term: 14.5 【补充】深入理解
    meaning: 可以换，但那就不是 k 均值了。均值是”极小化欧氏距离平方和”的唯一最优解（本笔记 14.3.3 节有推导）。换成中位数对应 k-medians（目标函数改为不平方的距离），换成实际样本点对应
      k-medoids。目标函数与代表元必须配套。
    source_heading: 14.5 【补充】深入理解
  - term: 14.6 本章概要与方法论总结
    meaning: 6. k 均值聚类是常用的聚类算法，有以下特点：基于划分的聚类方法；类别数 k 事先指定；以欧氏距离平方表示样本之间的距离或相似度，以中心或样本的均值表示类别；以样本和其所属类的中心之间的距离的总和为优化的目标函数；得到的类别是平坦的、非层次化的；算法是迭代算法，不能保证得到全局最优。
    source_heading: 14.6 本章概要与方法论总结
