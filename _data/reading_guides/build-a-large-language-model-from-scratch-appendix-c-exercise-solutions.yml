overview:
  kind: summary
  minutes: 10
  question: 0.1 为什么练习解答不是“看完就会”？
  question_source: 0.1 为什么练习解答不是“看完就会”
  thesis: 附录 C 将全书知识从“看懂实现”推进到“能够修改并验证实现”。每道题表面上只改一行配置或代码，背后却对应一种通用工程能力：追踪 token boundary、推导
    tensor shape、审计 parameter state、设计 controlled ablation、解释统计波动、识别训练/推理接口，以及区分结构事实和硬件相关结果。
  thesis_source: 16. 最终总结
  concepts:
  - term: 0.1 为什么练习解答不是“看完就会”
    meaning: LoRA 训练更快是资源结果，质量是否相当仍取决于 rank、数据和评估器。
    source_heading: 0.1 为什么练习解答不是“看完就会”
  - term: Exercise 4.1：Number of Parameters in Feed-Forward and Attention Modules
    meaning: 参数量只描述可训练 scalar 数，不直接给出 wall-clock、activation memory 或 KV-cache 大小。
    source_heading: Exercise 4.1：Number of Parameters in Feed-Forward and Attention
      Modules
  - term: Exercise 5.5：Pretrained GPT-2 在 The Verdict 上的 Loss
    meaning: 原 GPT-2 web corpus 并不提供足以逐文档确认的完整可审计 membership。最强做法是使用明确晚于 training
      cutoff 创建的文本，但“晚于 cutoff”仍只降低直接训练污染，不能排除相似内容或后续 pipeline 问题。
    source_heading: Exercise 5.5：Pretrained GPT-2 在 The Verdict 上的 Loss
  - term: Exercise 6.2：Fine-Tuning the Whole Model
    meaning: Frozen early layers 的 forward 仍要执行，但 autograd 不需为参数更新追踪完整梯度路径。Full fine-tuning
      显存远高于只训练最后部分。
    source_heading: Exercise 6.2：Fine-Tuning the Whole Model
  - term: Exercise A.2：运行环境检查代码
    meaning: 原附录指向仓库 Installing Libraries Used In This Book 文档和检查 utilities。它解决 A.1
      后的第二层问题：不仅 PyTorch 本身可用，整本书所需 libraries 是否版本兼容。
    source_heading: Exercise A.2：运行环境检查代码
  - term: 15. 核心结论
    meaning: Temperature 与 top-k 分别改变 probability concentration 和 candidate support。
    source_heading: 15. 核心结论
  logic:
  - 0.1 为什么练习解答不是“看完就会”
  - Exercise 4.1：Number of Parameters in Feed-Forward and Attention Modules
  - Exercise 5.2：Temperature 与 Top-k 的应用选择
  - Exercise 6.2：Fine-Tuning the Whole Model
  - Exercise 7.2：Instruction and Input Masking
  - 8.2 四种贯穿全书的不变量
  - 15. 核心结论
  sections:
  - title: 0.1 为什么练习解答不是“看完就会”
    source_heading: 0.1 为什么练习解答不是“看完就会”
    paragraphs:
    - 结果可由哪个数学或 shape 不变量预先推导；
    - Phi-3 模板约快 17%，是特定硬件与数据上的经验结果；
    - First-token classifier 变差可由 causal mask 解释，但 75.00% 不是普遍常数；
    - LoRA 训练更快是资源结果，质量是否相当仍取决于 rank、数据和评估器。
  - title: Exercise 2.2：Data Loaders with Different Strides and Context Sizes
    source_heading: Exercise 2.2：Data Loaders with Different Strides and Context Sizes
    paragraphs:
    - 注意 target windows 仍与下一 input window共享边界 token。
    - 这是 next-token shift 的结果，不是 input-window 重叠。
    - Stride 不改变单个 sample 的 context capacity；它改变从 corpus 采样 windows 的密度。
    - Exercise 2.1 验证 tokenizer 的表示与可逆性；Exercise 2.2 验证这些 IDs 如何变成自监督训练样本。两题共同建立后续
      GPT 训练的数据入口。
  - title: Exercise 4.1：Number of Parameters in Feed-Forward and Attention Modules
    source_heading: Exercise 4.1：Number of Parameters in Feed-Forward and Attention
      Modules
    paragraphs:
    - FFN 约是 attention 的 2 倍。这个比例可直接由 GPT-2 block 的矩阵 shape 推导。
    - 参数量只描述可训练 scalar 数，不直接给出 wall-clock、activation memory 或 KV-cache 大小。
    - Head 数不改变 dense QKV projection 的主要总参数量，只改变如何切分 d；
    - Causal mask、softmax 和 dropout 没有 trainable parameters；
  - title: Exercise 5.2：Temperature 与 Top-k 的应用选择
    source_heading: Exercise 5.2：Temperature 与 Top-k 的应用选择
    paragraphs:
    - 更准确地说，它们降低随机性和 tail risk，但不保证 factual correctness。若最高概率 token 本身错误，低温只会更稳定地输出错误。事实性还需要
      retrieval、verification、tests 和 calibrated abstention。
    - 原解答建议 k 约 20–40、temperature 大于 1 用于 brainstorming、fiction 和 creative content。它扩大有效候选并提高低概率路径出现机会，也增加语法断裂、topic
      drift 和 hallucination。
    - 具体数值不具有跨模型普遍性：Vocabulary、model calibration、prompt 和 task 都改变 logits distribution。
    - 生产系统应在 held-out prompts 上测 task success、diversity、toxicity、factuality、latency，而不是凭“创意任务用
      1.2”之类经验硬编码。
  - title: Exercise 5.5：Pretrained GPT-2 在 The Verdict 上的 Loss
    source_heading: Exercise 5.5：Pretrained GPT-2 在 The Verdict 上的 Loss
    paragraphs:
    - "“Validation 低于 train”不自动意味着 bug，也不能仅凭一次小差异证明不存在 overfitting。"
    - 若 The Verdict 不在 GPT-2 pretraining corpus 中，接近的两组 loss 可表示对新文本的相近泛化。
    - 若它在 corpus 中，那么当前 train/validation 都可能是 pretrained model 已见数据，无法据此判断 contamination
      或 overfitting。
    - 原 GPT-2 web corpus 并不提供足以逐文档确认的完整可审计 membership。最强做法是使用明确晚于 training cutoff
      创建的文本，但“晚于 cutoff”仍只降低直接训练污染，不能排除相似内容或后续 pipeline 问题。
  - title: Exercise 6.2：Fine-Tuning the Whole Model
    source_heading: Exercise 6.2：Fine-Tuning the Whole Model
    paragraphs:
    - 更大 function class 使 training objective 有更低的可达 minimum，并可能改善 domain adaptation。
    - 没有多 seeds/confidence interval，不能断言 full fine-tuning 的真实期望提升恰为 1%。
    - Frozen early layers 的 forward 仍要执行，但 autograd 不需为参数更新追踪完整梯度路径。Full fine-tuning
      显存远高于只训练最后部分。
    - Optimizer 应最后创建。若 optimizer 先于新 head 或 Parameter replacement，会漏掉新对象或保留旧引用。
  - title: Exercise 7.2：Instruction and Input Masking
    source_heading: Exercise 7.2：Instruction and Input Masking
    paragraphs:
    - 两者都可定义，关键是明确并用 token indices 推导，不凭字符数猜边界。
    - 至少确保 batch 中有有效 targets，最好每条样本保留足够 response tokens 和 EOT。
    - 继续训练 instruction language distribution；
    - 原书 Ollama Llama 3 judge 下 masking 约低 4 分，与 Instruction Tuning With Loss Over
      Instructions 的观察一致。它不是普遍定律；应控制 seed、token budget 和 reduction。Mask 后每 batch 有效
      tokens 变少，若仍按相同 epochs 比较，实际 supervised-token budget 已改变。
  - title: Exercise A.2：运行环境检查代码
    source_heading: Exercise A.2：运行环境检查代码
    paragraphs:
    - 原附录指向仓库 Installing Libraries Used In This Book 文档和检查 utilities。它解决 A.1 后的第二层问题：不仅
      PyTorch 本身可用，整本书所需 libraries 是否版本兼容。
    - 不能只检查 package “存在”，还要检查 API 所需版本范围。Major/minor 变化可能改变默认参数、serialization 安全策略和
      kernel behavior。
    - Tokenizer encode/decode round-trip；
    - RAM、disk、GPU memory 可能足够运行小示例，却不足以训练 GPT-2 medium/XL。
  - title: 8.2 四种贯穿全书的不变量
    source_heading: 8.2 四种贯穿全书的不变量
    paragraphs:
    - External weights 必须映射到相同语义的 matrix axes；
    - Prompt 与 response extraction 必须共享 boundary。
    - Trainable Parameters 与 optimizer references 一致；
    - Checkpoint 恢复 model/optimizer/progress；
  - title: 15. 核心结论
    source_heading: 15. 核心结论
    paragraphs:
    - GPT-2 block 中 FFN 参数约是 attention 的两倍，但 runtime 还取决于 sequence length。
    - Temperature 与 top-k 分别改变 probability concentration 和 candidate support。
    - Instruction masking 只改变 loss，不改变 prompt 对 response 的 attention context。
    - LoRA 以低秩 branch 限制 update subspace，节省 trainable state但不跳过 base forward。
  takeaways:
  - Next-token target 相对 input 右移 1；
  - 用 held-out data；
  - Weight-tying 统计口径不等于代码已经共享 Parameter。
  - Causal GPT 的 first token 无法汇总后文，last position 才具有完整前缀可见性。
  - 附录 C 将全书知识从“看懂实现”推进到“能够修改并验证实现”。每道题表面上只改一行配置或代码，背后却对应一种通用工程能力：追踪 token boundary、推导
    tensor shape、审计 parameter state、设计 controlled ablation、解释统计波动、识别训练/推理接口，以及区分结构事实和硬件相关结果。
