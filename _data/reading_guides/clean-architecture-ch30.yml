  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 从 Architecture 的角度看，Database 是一个 Non-Entity，是低层 Detail，而不是高层架构元素。
    - Database System：把数据存入某种介质并提供访问能力的 Software Utility，是低层 Mechanism。
    - 数据进入 RAM 后，程序仍会重新组织为 List、Set、Tree、Hash Table、Stack、Queue；
    - 即使市场或客户强制要求 RDBMS，也应把它“挂在系统侧面”，通过 Narrow and Safe Channel 接入，而不是让它成为核心。
  - title: 3.4 Relational Model 的典型能力
    source_heading: 3.4 Relational Model 的典型能力
    paragraphs:
    - Declarative Query；
    - Set-Oriented Operation；
  - title: 5.6 它不擅长什么
    source_heading: 5.6 它不擅长什么
    paragraphs:
    - 原书指出，RDBMS 对 Opaque Document 的存取相对不自然。
    - 现代数据库可存 BLOB / JSON，但这不改变原书对两种系统主要优化方向的对比。
  - title: 6.9 思想实验的局限
    source_heading: 6.9 思想实验的局限
    paragraphs:
    - Relational Algebra；
    - In-Memory Database；
    - Columnar Layout；
    - Declarative Query；
  - title: 9. 作者的历史判断与现代介质
    source_heading: 9. 作者的历史判断与现代介质
    paragraphs:
    - 作者认为 Rotating Disk 正在消亡，将像 Tape、Floppy、CD 一样被 RAM 取代。
    - Multi-User Concurrency；
  - title: 11.3 也不能让 Product Truth 污染核心
    source_heading: 11.3 也不能让 Product Truth 污染核心
    paragraphs:
    - 全部业务改成 Table-Centric；
    - Data Model 等同 Schema。
  - title: 14.6 数据库迁移策略
    source_heading: 14.6 数据库迁移策略
    paragraphs:
    - Expand / Contract；
    - Dual Read / Write，仅在必要时；
    - Versioned Schema；
    - Compatibility Window。
  - title: 15.1 Database-Centric Product
    source_heading: 15.1 Database-Centric Product
    paragraphs:
    - Database Engine；
    - Analytics Product；
  - title: 17.3 Performance 检查
    source_heading: 17.3 Performance 检查
    paragraphs:
    - Use Case 的 Latency / Throughput 目标是什么？
    - 是否支持 Batch / Projection？
    - Vendor Type 是否因性能借口泄漏？
  - title: 18. 本章总结
    source_heading: 18. 本章总结
    paragraphs:
    - 现代 In-Memory Database 仍可能使用 SQL，因为 Database 还提供 Query、Transaction、Concurrency
      与 Recovery。
    - 高层定义 Latency、Throughput、Availability 与 Consistency 需要，低层实现 Index、Cache、Query
      Plan 与 Partition。
    - Database 的价值也不只来自 Disk Delay，还包括 Transaction、Query、Multi-User Access、Recovery
      与 Replication。
    - 本章最终原则是：Data Organization 与 Data Model 具有架构意义；搬运和访问持久数据的具体 Database Technology
      是 Detail。
  takeaways:
  - 第 30 章是 Part VI Details 的开篇，讨论 Database 在架构中的位置。
  - UI 直接绑定 Database Model 会让 Schema、Lazy Loading、Null 与敏感字段进入展示层。
  - 现代 In-Memory Database 仍可能使用 SQL，因为 Database 还提供 Query、Transaction、Concurrency
    与 Recovery。
  - RDBMS 自身也把 Table 存在 File / Disk Mechanism 上，因此比喻不能自动证明技术优越。
  - 最值得记住的原句是：The data is significant. The database is a detail.
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「16.2 “Database 是 Detail，所以 Schema 无需设计”」？
  answer: 错误。Schema 对完整性、性能和迁移非常重要，只是不应控制核心政策。
  source_heading: 16.2 “Database 是 Detail，所以 Schema 无需设计”
- level: 概念辨析
  question: 原文如何解释「16.7 “ORM Entity 就是 Domain Entity”」？
  answer: 不一定。ORM Entity 表达持久化，Domain Entity 表达关键业务规则。
  source_heading: 16.7 “ORM Entity 就是 Domain Entity”
- level: 概念辨析
  question: 原文如何解释「16.10 “所有数据都在 RAM 后不需要 Database”」？
  answer: 错误。Database 还提供 Query、Transaction、Concurrency、Recovery 与 Multi-User Access。
  source_heading: 16.10 “所有数据都在 RAM 后不需要 Database”
- level: 概念辨析
  question: 原文如何解释「16.14 “为性能可让 ResultSet 穿透核心”」？
  answer: 通常不必。可设计 Bulk / Projection Port，在不泄漏 Vendor Type 的情况下优化。
  source_heading: 16.14 “为性能可让 ResultSet 穿透核心”
- level: 概念辨析
  question: 原文如何解释「16.19 “用了 Repository 就自动数据库无关”」？
  answer: 错误。若接口返回 ORM Type 或暴露 Query Builder，边界仍泄漏。
  source_heading: 16.19 “用了 Repository 就自动数据库无关”
