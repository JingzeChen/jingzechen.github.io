  question: 原文围绕「一、本章的问题与核心命题」建立了怎样的核心认识？
  question_source: 一、本章的问题与核心命题
  thesis: 最后一层：识别体系性盲区。目标管理与例外管理只对意外失败报警，而破坏性市场的信号是意外成功——本田的通勤车、Intuit 的企业用户、惠普的日语文字处理器订单都是正偏差。因此必须观察人们如何使用产品，而不是听取人们表示他们将如何使用产品。
  thesis_source: 十四、本章总结
  concepts:
  - term: 一、本章的问题与核心命题
    meaning: 作者强调这一点”非常重要”，理由是：自认为通晓市场未来的管理者所采取的规划和投资策略，与承认市场充满不确定性的管理者所采取的策略，存在根本不同。同样一笔钱，前者用来建单一大产线，后者用来建模块化小产能；前者把特性做死，后者留可拆改接口。
    source_heading: 一、本章的问题与核心命题
  - term: 四、本田公司对北美摩托车行业的冲击
    meaning: 第二章曾提到，在一个特定的价值网内，硬盘企业和其计算机生产商客户各自发展了非常相似的经济模式或成本结构，从而决定了它们判定哪些业务最有利可图的方式。我们在这里又看到了同一种现象。在价值网内，哈雷经销商的经济模式导致它们经常会与哈雷一起看好同一种业务。它们共存于同一个价值网，因而不管是哈雷还是其经销商都很难从底部退出这一价值网。
    source_heading: 四、本田公司对北美摩托车行业的冲击
  - term: 六、成熟企业面临的不可预见性和向下游市场移动的难度
    meaning: 人们通常会把他们不了解的事物的风险性放大（不管它们的内在风险到底有多大），并将他们确实了解的事物的风险性缩小（同样不管它们的内在风险到底有多小）。
    source_heading: 六、成熟企业面临的不可预见性和向下游市场移动的难度
  - term: 八、失败的理念与失败的管理者之间的比较
    meaning: 由于失败是为破坏性技术寻找新市场的必经之路，管理者不能或者不愿拿他们的个人职业生涯来做赌注的事实也构成了一股强大的阻力，妨碍了成熟企业进入由这些技术创造的价值网。
    source_heading: 八、失败的理念与失败的管理者之间的比较
  - term: 十、三个案例的交叉比较
    meaning: 管理的任务因此变成两条：加快左边（用低成本试探加速发现）、推迟右边（用小额分期承诺延长跑道）。惠普两条都做反了。
    source_heading: 十、三个案例的交叉比较
  - term: 十四、本章总结
    meaning: 第二层：证明高质量执行救不了错误方法。惠普 Kittyhawk 请专业机构调研、与七家顶级客户共创、12 个月完成技术开发、按目标市场加装碰撞传感器——每一步都是延续性创新的最佳实践，结果彻底失败。真实需求来自日语文字处理器、迷你收银机、电子摄影机、工业扫描器，以及两年后才想明白用途的游戏机厂商（要
      50 美元、10MB）。而此时 250 美元的高端设计已无法调整，资源也已耗尽。
    source_heading: 十四、本章总结
