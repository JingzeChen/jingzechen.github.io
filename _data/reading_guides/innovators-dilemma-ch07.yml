  sections:
  - title: 一、本章的问题与核心命题
    source_heading: 一、本章的问题与核心命题
    paragraphs:
    - 新兴市场属于第二类：客户自己都还不知道会怎么用这个产品，因此再多的市场调研也问不出答案——你要问的那个”答案”此刻还不存在于任何人的头脑中。
    - 作者强调这一点”非常重要”，理由是：自认为通晓市场未来的管理者所采取的规划和投资策略，与承认市场充满不确定性的管理者所采取的策略，存在根本不同。同样一笔钱，前者用来建单一大产线，后者用来建模块化小产能；前者把特性做死，后者留可拆改接口。
    - 原书对营销职能的批评尤为具体：大多数市场营销人员在大学里和工作岗位上被反复灌输”要倾听消费者的意见”，但几乎没有人接受过”如何发现尚不存在的市场”的理论或实践培训。
    - 统计证据（硬盘行业）：专业预测机构对延续性市场的预测误差在 7%~8% 以内，对破坏性市场的误差高达 265%、550%——证明这不是能力问题，而是可预测性问题。
  - title: 二、对延续性技术和破坏性技术市场的预测
    source_heading: 二、对延续性技术和破坏性技术市场的预测
    paragraphs:
    - 要证明”破坏性市场不可预测”，最有力的方式不是找一个预测失败的例子，而是找一个在同等条件下对另一类市场预测得极准的机构。这样才能排除”预测者水平不行”这一竞争性解释。
    - 因为厂商认为这份报告极有价值，所以持续贡献专有数据——这形成了良性循环，使数据完整度远超一般行业。更关键的是：拥有 20 年行业数据，读者可以用后来的历史去检验当年的预测，这是一个天然的预测准确性实验室。
    - 为什么必须辨清：因为两个方向相反的错误无法用同一个修正系数补救。如果误差总是低估，企业只需把预测乘以一个安全系数；但 5.25 英寸低估、1.8 英寸高估，说明误差没有系统性方向，因而不可校正。这比”预测不准”严重得多——它意味着你连错误的方向都不知道。
    - 原书用最典型的一例点明这一点：1.8 英寸硬盘是第一代主要应用领域不在计算机市场的硬盘驱动器——而《磁盘/趋势报告》的全部数据来源都是计算机行业的厂商与客户。它对
      1.8 英寸的预测误差最大（550%），恰恰因为真正的市场（如便携式心脏监护装置）根本不在其观测范围内。
  - title: 四、本田公司对北美摩托车行业的冲击
    source_heading: 四、本田公司对北美摩托车行业的冲击
    paragraphs:
    - 本田主动采取基于经验曲线的生产战略——降低价格、增加产量、大幅削减成本、进一步降价、进一步削减成本，建立不可动摇的低成本制造优势；然后凭此向高端市场转移，最终将几乎所有知名摩托车制造商淘汰出局，连硕果仅存的哈雷和宝马也大伤元气。同时把生产优势与合理的产品设计、极具创意的广告和覆盖极广的分销零售网结合起来。
    - 转向后的新挑战——渠道：小型摩托车战略正式采纳后，洛杉矶团队发现说服经销商销售”超级幼兽”比说服他们卖大型摩托车难得多，因为当时市场上没有一家零售商在销售这种类型的产品。最终他们说服了几家体育用品经销商——注意，不是摩托车经销商。
    - 第二章曾提到，在一个特定的价值网内，硬盘企业和其计算机生产商客户各自发展了非常相似的经济模式或成本结构，从而决定了它们判定哪些业务最有利可图的方式。我们在这里又看到了同一种现象。在价值网内，哈雷经销商的经济模式导致它们经常会与哈雷一起看好同一种业务。它们共存于同一个价值网，因而不管是哈雷还是其经销商都很难从底部退出这一价值网。
    - 这是一个重要的理论扩展：价值网的锁定不仅来自客户，也来自渠道。即使制造商本身想向下走，其分销体系的利润结构也会形成同等强度的阻力。哈雷的撤退”让人联想到希捷在硬盘市场的重新定位，以及缆索挖掘机企业和综合性钢铁厂向高端市场的战略性撤退”——第四章的”左上牵引力”在此再次出现，且驱动力来自渠道。
  - title: 五、英特尔公司是如何发现微处理器市场的
    source_heading: 五、英特尔公司是如何发现微处理器市场的
    paragraphs:
    - 虽然今天微处理器无疑是一种主流产品，但它在刚刚出现时还是一种破坏性技术。相对于大型计算机复杂的逻辑电路（在 20 世纪 60 年代相当于计算机的中央处理器），微处理器的功能非常有限。但微处理器体积小、结构简单，而且能以较低的价格实现逻辑和计算操作，而这在以前是不可能实现的。
    - 同一条规则，因新业务恰好落在毛利率的高端还是低端，导致截然相反的命运。这正是原书那句”给英特尔公司带来了好运”的深意——英特尔的成功在这一点上带有运气成分，不能作为通用方法照搬。绝大多数破坏性技术的毛利率低于主流业务，此时同一规则会把它们扼杀。
    - 现在回想起来，将微处理器应用到个人电脑上实在是一件水到渠成的事，但在激烈的竞争中，即便是像英特尔这样敏锐的管理层也无法预知，在微处理器可能出现的多种应用领域中，究竟哪种会成为最重要、能实现最大销售额和利润的应用领域。
    - "“现在回想起来水到渠成” 正是后见之明偏差（hindsight bias）的教科书定义：事件发生后，人们会觉得它本来就是可预见的。这种偏差会让管理者高估自己预测下一个新市场的能力——这是本章最需要警惕的认知陷阱。"
  - title: 六、成熟企业面临的不可预见性和向下游市场移动的难度
    source_heading: 六、成熟企业面临的不可预见性和向下游市场移动的难度
    paragraphs:
    - 这个推论看似消极，实则是本章最有建设性的部分——因为它把管理任务从”如何预测对”转换为”如何在必然预测错的前提下仍然成功”。这是完全不同的问题，有完全不同的解法。
    - 这一陈述与表 6.1 中的发现（进入新兴价值网的企业 37% 与进入当前价值网的企业 6% 取得成功的事后概率之间存在极大差异）到底在多大程度上相互吻合？如果市场不能预先进行预测，那么计划开发这些市场的企业如何才能取得更大的成功呢？
    - 人们通常会把他们不了解的事物的风险性放大（不管它们的内在风险到底有多大），并将他们确实了解的事物的风险性缩小（同样不管它们的内在风险到底有多小）。
    - 这个洞察的实践价值：它告诉我们，管理者对新市场的抗拒不是理性计算的结果，而是认知偏差的产物。因此，用更多数据说服他们往往无效——因为数据不改变熟悉度。有效的做法是降低进入的代价，使抗拒不再具有决定性（这正是后文”学习计划”的思路）。
  - title: 八、失败的理念与失败的管理者之间的比较
    source_heading: 八、失败的理念与失败的管理者之间的比较
    paragraphs:
    - 由于失败是为破坏性技术寻找新市场的必经之路，管理者不能或者不愿拿他们的个人职业生涯来做赌注的事实也构成了一股强大的阻力，妨碍了成熟企业进入由这些技术创造的价值网。
    - 这句话初读晦涩，含义是：当有明确的市场需求（即客户已经明确表达需要什么）时，做错事的概率下降，而且即使做错，代价也较小——因为需求真实存在，方向大体正确。反之，没有市场压力指引时，犯错概率与代价都高。
    - 与正文的 65% 略有出入（可能因统计口径或版本差异），但结论方向一致：近三分之二的进入者选择了成功率仅 6% 的成熟市场，而非成功率 37% 的新兴市场。
    - 这是一个集体性的非理性选择，而其成因恰恰是个体层面的理性：对个人而言，在成熟市场失败是”可解释的失败”，在新兴市场失败是”愚蠢的赌博”。
  - title: 九、学习计划与实施计划的比较
    source_heading: 九、学习计划与实施计划的比较
    paragraphs:
    - 在延续性技术创新中，认真规划、积极实施是通往成功的阳光大道。但在破坏性技术变革中，必须在制订详尽计划前采取行动。由于对市场需求或市场规模知之甚少，计划必须服务于一个非常不同的目的，它们必须是学习计划，而不是实施计划。
    - 在开展破坏性业务时，时刻铭记市场应用领域是不可知的，管理人员就能判断出哪些是寻找新市场的最重要的信息，并能对信息的重要性进行排序。项目和业务计划应反映出这些优先顺序，这样，在需要投入大量资本、时间和资金时，就能拼凑出关键的信息片断，或解决重要的不确定因素。
    - 这个案例是 9.4 节原则的完美示范：Intuit 观察到的是行为异常（个人理财软件被企业购买），而非客户陈述的需求。若只做用户访谈问”你需要什么功能”，个人用户不会说出企业记账需求。
    - 一些面临这种不确定性的管理人员更倾向于在其他公司切实找到相关市场之后再行进入。但考虑到破坏性技术的领先者能够建立起巨大的先发优势，面临破坏性技术创新的管理者应走出实验室和跟踪调研小组调研，利用发现驱动型方法进入市场，直接了解有关新消费者和新应用领域的知识。
  - title: 十、三个案例的交叉比较
    source_heading: 十、三个案例的交叉比较
    paragraphs:
    - 调研质量与成功无关——惠普调研最好，结果最差。
    - 初始承诺规模与成功负相关——承诺越小，存活越久，越可能等到真实市场。
    - 发现途径全部是”非计划”的——三家公司的真实市场都不是通过正式流程找到的。
    - 管理的任务因此变成两条：加快左边（用低成本试探加速发现）、推迟右边（用小额分期承诺延长跑道）。惠普两条都做反了。
  - title: 十三、面向实践的分析模板
    source_heading: 十三、面向实践的分析模板
    paragraphs:
    - 写出”要让这个计划成立，什么必须为真”——市场规模、客户身份、可接受价格、关键功能、渠道。
    - 谁在监测”非目标客户的异常订单”？（惠普的日语文字处理器订单本应是最高级别的信号。）
    - 能否把考核标准从”是否达成收入目标”改为”是否高效消除了关键不确定性”？
    - 是否明确区分了”理念失败“（应奖励快速证伪）与”业务失败“（应问责资源挥霍）？
  - title: 十四、本章总结
    source_heading: 十四、本章总结
    paragraphs:
    - 第二层：证明高质量执行救不了错误方法。惠普 Kittyhawk 请专业机构调研、与七家顶级客户共创、12 个月完成技术开发、按目标市场加装碰撞传感器——每一步都是延续性创新的最佳实践，结果彻底失败。真实需求来自日语文字处理器、迷你收银机、电子摄影机、工业扫描器，以及两年后才想明白用途的游戏机厂商（要
      50 美元、10MB）。而此时 250 美元的高端设计已无法调整，资源也已耗尽。
    - 第三层：揭示成功的真实机制。本田带着日本市场 10 年 237.5 倍增长的成功经验进入北美，理念完全错误（大功率公路摩托），甚至忽视了主动上门的西尔斯；英特尔连自家
      286 芯片的前 50 大应用清单里都没列入个人电脑。但两者都没有把资源押在初始理念上，因而在真实市场浮现时接得住。三个案例的初始理念全部错误，唯一的差异是资源承诺方式——这构成了近乎实验设计的对照。
    - 最后一层：识别体系性盲区。目标管理与例外管理只对意外失败报警，而破坏性市场的信号是意外成功——本田的通勤车、Intuit 的企业用户、惠普的日语文字处理器订单都是正偏差。因此必须观察人们如何使用产品，而不是听取人们表示他们将如何使用产品。
    - 本章最值得记住的一句话是作者对”不可知营销”的界定：没有人——不论是我们，还是我们的消费者——能够在真正使用之前了解破坏性产品是否能够投入使用、怎样使用，或者使用量有多大。承认这一点不是放弃管理，而是把管理的对象从”预测的精度”转向”犯错的成本”。
  takeaways:
  - 第七章解决了第六章遗留的实操难题：既然必须率先进入新兴市场，而新兴市场又无法预测，企业该怎么办？
  - "《磁盘/趋势报告》用同一套方法预测两类技术，延续性误差 7%~8%，破坏性误差 265%、550%，且方向相反、无法用系数修正。"
  - 第二层：证明高质量执行救不了错误方法。惠普 Kittyhawk 请专业机构调研、与七家顶级客户共创、12 个月完成技术开发、按目标市场加装碰撞传感器——每一步都是延续性创新的最佳实践，结果彻底失败。真实需求来自日语文字处理器、迷你收银机、电子摄影机、工业扫描器，以及两年后才想明白用途的游戏机厂商（要
    50 美元、10MB）。而此时 250 美元的高端设计已无法调整，资源也已耗尽。
  - 最后一层：识别体系性盲区。目标管理与例外管理只对意外失败报警，而破坏性市场的信号是意外成功——本田的通勤车、Intuit 的企业用户、惠普的日语文字处理器订单都是正偏差。因此必须观察人们如何使用产品，而不是听取人们表示他们将如何使用产品。
  - 本章最值得记住的一句话是作者对”不可知营销”的界定：没有人——不论是我们，还是我们的消费者——能够在真正使用之前了解破坏性产品是否能够投入使用、怎样使用，或者使用量有多大。承认这一点不是放弃管理，而是把管理的对象从”预测的精度”转向”犯错的成本”。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.1 “不可预测就是不能规划”」？
  answer: 不对。作者反对的是实施计划，而非一切计划。发现驱动型规划要求更严谨的思考——必须显式列出假设、排定验证优先级、设计验证方式。它比拍脑袋预测更需要纪律，只是纪律用在了不同的地方。
  source_heading: 11.1 “不可预测就是不能规划”
- level: 概念辨析
  question: 原文如何解释「11.3 “预测总是偏保守，乘个系数就行”」？
  answer: 不对。图 7.1 显示 5.25 英寸被严重低估（实际是预测的 2.65 倍），1.8 英寸被严重高估（预测是实际的 6.5 倍）。误差没有系统性方向，任何固定修正系数都会在一半情况下加剧错误。
  source_heading: 11.3 “预测总是偏保守，乘个系数就行”
- level: 概念辨析
  question: 原文如何解释「11.5 “英特尔的毛利率分配规则值得照搬”」？
  answer: 危险。该规则在英特尔奏效，是因为微处理器的毛利率恰好高于 DRAM。而绝大多数破坏性技术的毛利率低于主流业务（见第四章），此时同一规则会自动扼杀它们。同一条规则在不同情境下产生相反后果，照搬前必须先判断新业务落在毛利率光谱的哪一端。
  source_heading: 11.5 “英特尔的毛利率分配规则值得照搬”
- level: 概念辨析
  question: 原文如何解释「11.7 “Kittyhawk 失败是因为技术不行”」？
  answer: 不对。技术完全按计划完成（12 个月，20MB→40MB，抗 3 英尺跌落）。失败源于为错误市场做了正确产品，且在发现真实市场时已无资源重做。
  source_heading: 11.7 “Kittyhawk 失败是因为技术不行”
- level: 概念辨析
  question: 原文如何解释「11.9 “意外的成功不需要管理关注”」？
  answer: 恰恰相反。传统管理体系只对意外失败报警，而破坏性市场的信号是意外成功。本田的转机、Intuit 的 QuickBooks、惠普收到的日语文字处理器订单，全部是正偏差。应当为正偏差也建立复核机制。
  source_heading: 11.9 “意外的成功不需要管理关注”
