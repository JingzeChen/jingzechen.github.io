overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章导读」建立了怎样的核心认识？
  question_source: 本章导读
  thesis: 本章最终原则是：用最便宜的结构购买当前需要的隔离，同时诚实面对未购买的保护与边界退化风险。
  thesis_source: 13. 本章总结
  concepts:
  - term: 本章导读
    meaning: 如果团队怀疑未来可能需要一条完整边界，但当前收益还不足以支付全部成本，该怎么办？
    source_heading: 本章导读
  - term: 3.12 可提取性演练
    meaning: 不真正独立发布，只确认分离仍可行。
    source_heading: 3.12 可提取性演练
  - term: 5.4 它放弃什么
    meaning: Service 变化可能沿依赖传给 Client。
    source_heading: 5.4 它放弃什么
  - term: 5.13 怎样从 Facade 演化
    meaning: 让 Facade 或 ServiceImpl 实现接口；
    source_heading: 5.13 怎样从 Facade 演化
  - term: 10. 与前面原则的关系
    meaning: One-Dimensional Boundary 已应用部分 Dependency Inversion。
    source_heading: 10. 与前面原则的关系
  - term: 13. 本章总结
    meaning: 完整边界需要相互配套的多态 Boundary Interface、Input / Output Data Structure 和依赖管理。
    source_heading: 13. 本章总结
  logic:
  - 本章导读
  - 3.12 可提取性演练
  - 4.13 它比 Skip the Last Step 省了什么
  - 5.13 怎样从 Facade 演化
  - 6.5 选择不是永久决定
  - 12.4 Facade 检查
  - 13. 本章总结
  sections:
  - title: 本章导读
    source_heading: 本章导读
    paragraphs:
    - 独立 Input / Output Data Structure；
    - 如果团队怀疑未来可能需要一条完整边界，但当前收益还不足以支付全部成本，该怎么办？
    - Skip the Last Step：完整设计隔离结构，但暂时共同编译、共同部署；
    - One-Dimensional Boundary：只建立一个方向的 Strategy 接口与依赖倒置；
  - title: 2. YAGNI 与架构预见之间的张力
    source_heading: 2. YAGNI 与架构预见之间的张力
    paragraphs:
    - 某些依赖一旦扩散，拆除会非常昂贵；
    - 数据与框架类型可能快速污染核心；
    - 未来独立部署虽然未确定，却可能价值很高。
  - title: 3.12 可提取性演练
    source_heading: 3.12 可提取性演练
    paragraphs:
    - 检查是否存在反向 Import；
    - 不真正独立发布，只确认分离仍可行。
  - title: 4.13 它比 Skip the Last Step 省了什么
    source_heading: 4.13 它比 Skip the Last Step 省了什么
    paragraphs:
    - Reciprocal Interface；
    - 部分 Output Model；
  - title: 5.4 它放弃什么
    source_heading: 5.4 它放弃什么
    paragraphs:
    - Client 直接依赖具体 Facade；
    - Facade 直接依赖具体 Service；
    - Service 变化可能沿依赖传给 Client。
  - title: 5.13 怎样从 Facade 演化
    source_heading: 5.13 怎样从 Facade 演化
    paragraphs:
    - 让 Facade 或 ServiceImpl 实现接口；
    - 禁止 Client 直接访问内部 Service；
    - 需要时增加 Output Port；
  - title: 6.5 选择不是永久决定
    source_heading: 6.5 选择不是永久决定
    paragraphs:
    - 从 Facade 升级为 Strategy；
    - 从 Strategy 增加 Reciprocal Interface；
  - title: 10. 与前面原则的关系
    source_heading: 10. 与前面原则的关系
    paragraphs:
    - Single Responsibility Principle 帮助识别边界两侧不同变化原因。
    - Common Closure Principle 让共同变化的代码聚在一侧。
    - One-Dimensional Boundary 已应用部分 Dependency Inversion。
    - Skip the Last Step 暂时不把逻辑边界变成独立 Release Unit。
  - title: 12.4 Facade 检查
    source_heading: 12.4 Facade 检查
    paragraphs:
    - Facade 是否提供有意义的统一 API？
    - Client 是否绕过 Facade？
    - Facade 是否泄漏内部 Service 类型？
  - title: 13. 本章总结
    source_heading: 13. 本章总结
    paragraphs:
    - 完整边界需要相互配套的多态 Boundary Interface、Input / Output Data Structure 和依赖管理。
    - Client 依赖 ServiceBoundary，ServiceImpl 实现 ServiceBoundary。
    - Facade 边界很容易被 Client 直连 Service 或 Service 反向依赖 Client 的后门破坏。
    - 完整边界、Skip the Last Step、One-Dimensional、Facade 的成本依次降低。
  takeaways:
  - 第 24 章讨论完整架构边界成本过高时，如何使用 Partial Boundary 保留未来选项。
  - 它完成独立编译部署所需的接口、数据结构与依赖倒置设计。
  - Figure 24.1 的 Nasty Dotted Arrow 表示这种 Backchannel。
  - 可以从 Client 需要提取接口，让 Facade 实现它，从而升级为 Strategy 边界。
  - 本章最终原则是：用最便宜的结构购买当前需要的隔离，同时诚实面对未购买的保护与边界退化风险。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「11.6 “One-Dimensional Boundary 已保证双向隔离”」？
  answer: 错误。它主要保护 Client 对 ServiceImpl 的依赖，反向 Backchannel 仍需纪律阻止。
  source_heading: 11.6 “One-Dimensional Boundary 已保证双向隔离”
- level: 概念辨析
  question: 原文如何解释「11.8 “Strategy Pattern 自动阻止组件环”」？
  answer: 错误。ServiceImpl 仍可能反向依赖 Client，形成 Nasty Dotted Arrow。
  source_heading: 11.8 “Strategy Pattern 自动阻止组件环”
- level: 概念辨析
  question: 原文如何解释「11.10 “Facade 与 Adapter 是同一种模式”」？
  answer: 错误。Facade 简化内部 API；Adapter 转换接口或数据，并可配合 DIP 建立边界。
  source_heading: 11.10 “Facade 与 Adapter 是同一种模式”
- level: 概念辨析
  question: 原文如何解释「11.18 “更多 Partial Boundary 会保留更多选项”」？
  answer: 理论上选项增加，实际也增加认知和维护成本。错误边界会减少开发速度与可理解性。
  source_heading: 11.18 “更多 Partial Boundary 会保留更多选项”
- level: 概念辨析
  question: 原文如何解释「11.20 “一旦出现 Backchannel，只能立即拆成服务”」？
  answer: 错误。可以先修复源码依赖、增加 Output Port 或模块规则，不必升级到网络边界。
  source_heading: 11.20 “一旦出现 Backchannel，只能立即拆成服务”
