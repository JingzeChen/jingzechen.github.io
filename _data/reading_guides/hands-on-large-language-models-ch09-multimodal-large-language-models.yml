overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 用于视觉的 Transformer（Transformers for Vision）」建立了怎样的核心认识？
  question_source: 1. 用于视觉的 Transformer（Transformers for Vision）
  thesis: CLIP（Contrastive Language-Image Pre-training）是 dual encoder/bi-encoder：image
    encoder 与 text encoder 各自生成一个 global embedding。它不生成 caption，也不在一次 forward 中让图像
    token 与文字 token 做 cross-attention。
  thesis_source: 2. 多模态嵌入模型（Multimodal Embedding Models）
  concepts:
  - term: 1. 用于视觉的 Transformer（Transformers for Vision）
    meaning: CNN 内置 locality 与 translation equivariance 等强归纳偏置（inductive bias），较少数据时往往容易训练。原始
      ViT 的 global self-attention 归纳偏置较弱，但可直接建立远距离 patch 关系，在大规模预训练后表现强。
    source_heading: 1. 用于视觉的 Transformer（Transformers for Vision）
  - term: 2. 多模态嵌入模型（Multimodal Embedding Models）
    meaning: CLIP（Contrastive Language-Image Pre-training）是 dual encoder/bi-encoder：image
      encoder 与 text encoder 各自生成一个 global embedding。它不生成 caption，也不在一次 forward 中让图像
      token 与文字 token 做 cross-attention。
    source_heading: 2. 多模态嵌入模型（Multimodal Embedding Models）
  - term: 3. 让文本生成模型具备多模态能力（Making Text Generation Models Multimodal）
    meaning: Q-Former 的 image transformer 与 text transformer 共享 self-attention 层，并按任务使用不同
      attention masks；image side 通过插入的 cross-attention 读取 frozen vision features。
    source_heading: 3. 让文本生成模型具备多模态能力（Making Text Generation Models Multimodal）
  - term: 5. 总结（Summary）
    meaning: 本章最重要的方法论，是先把每种模态转换为合适的表示，再明确采用“共享空间对齐”还是“桥接到生成模型”。跨模态系统的可靠性不来自把图片塞进
      prompt，而来自预处理、对齐目标、信息瓶颈、证据边界和评测体系的共同设计。
    source_heading: 5. 总结（Summary）
  logic:
  - 1. 用于视觉的 Transformer（Transformers for Vision）
  - 2. 多模态嵌入模型（Multimodal Embedding Models）
  - 3. 让文本生成模型具备多模态能力（Making Text Generation Models Multimodal）
  - 5. 总结（Summary）
  sections:
  - title: 1. 用于视觉的 Transformer（Transformers for Vision）
    source_heading: 1. 用于视觉的 Transformer（Transformers for Vision）
    paragraphs:
    - 文本 tokenizer 从有限词表产生离散 IDs，同一 token 会在不同句子重复。图像 patch 是连续像素块，几乎不可能建立覆盖所有 patch
      的固定词表。因此 ViT 不为 patch 分配 vocabulary ID，而是直接把像素向量线性投影为 embedding。
    - CNN 内置 locality 与 translation equivariance 等强归纳偏置（inductive bias），较少数据时往往容易训练。原始
      ViT 的 global self-attention 归纳偏置较弱，但可直接建立远距离 patch 关系，在大规模预训练后表现强。
    - 图像是二维连续空间，文本是离散有序序列。
    - Patch 边界、分辨率、颜色归一化会直接影响视觉信息。
  - title: 2. 多模态嵌入模型（Multimodal Embedding Models）
    source_heading: 2. 多模态嵌入模型（Multimodal Embedding Models）
    paragraphs:
    - CLIP（Contrastive Language-Image Pre-training）是 dual encoder/bi-encoder：image
      encoder 与 text encoder 各自生成一个 global embedding。它不生成 caption，也不在一次 forward 中让图像
      token 与文字 token 做 cross-attention。
    - Generation conditioning：embedding 可为 diffusion 等生成模型提供文本条件，但 CLIP 自己不是图像生成器。
    - 对角 logits 比非对角高 2，因此匹配概率高、loss 低。Loss 小只说明 batch matching 做得好，不自动证明模型会计数、OCR
      或理解因果。
    - 单个 cosine 0.33 不是“33%匹配概率”，也没有跨模型通用 threshold；应在同一 candidate set 排名，或在 validation
      data 校准。
  - title: 3. 让文本生成模型具备多模态能力（Making Text Generation Models Multimodal）
    source_heading: 3. 让文本生成模型具备多模态能力（Making Text Generation Models Multimodal）
    paragraphs:
    - 从零联合训练 vision encoder 与 LLM 成本高。BLIP-2 冻结已有 image encoder 和 LLM，在中间训练轻量 Querying
      Transformer（Q-Former）及 projection，实现参数高效的跨模态桥接。
    - "“Q-Former 是唯一 trainable component”是简化说法：第二阶段连接 LLM 的 linear projection 也需要训练；核心是大
      vision encoder 与 LLM 保持 frozen。"
    - Q-Former 的 image transformer 与 text transformer 共享 self-attention 层，并按任务使用不同
      attention masks；image side 通过插入的 cross-attention 读取 frozen vision features。
    - LLaVA、Idefics 等后续视觉语言模型也使用 vision encoder + projector/adapter + LLM 的总体思想，但
      connector、训练数据、instruction tuning 与 token strategy 不同，不能把它们都等同于 BLIP-2。
  - title: 5. 总结（Summary）
    source_heading: 5. 总结（Summary）
    paragraphs:
    - CLIP 是 image/text dual encoder，通过对称 contrastive loss 学习 shared embedding space。
    - 遵循配套 processor：size、crop、mean/std、tokenizer 和 special tokens 必须匹配 checkpoint。
    - 版本化完整管线：vision encoder、processor、Q-Former/projector、LLM 和 generation config
      缺一不可。
    - 本章最重要的方法论，是先把每种模态转换为合适的表示，再明确采用“共享空间对齐”还是“桥接到生成模型”。跨模态系统的可靠性不来自把图片塞进 prompt，而来自预处理、对齐目标、信息瓶颈、证据边界和评测体系的共同设计。
  takeaways:
  - Patch 边界、分辨率、颜色归一化会直接影响视觉信息。
  - 单个 cosine 0.33 不是“33%匹配概率”，也没有跨模型通用 threshold；应在同一 candidate set 排名，或在 validation
    data 校准。
  - LLaVA、Idefics 等后续视觉语言模型也使用 vision encoder + projector/adapter + LLM 的总体思想，但 connector、训练数据、instruction
    tuning 与 token strategy 不同，不能把它们都等同于 BLIP-2。
  - 本章最重要的方法论，是先把每种模态转换为合适的表示，再明确采用“共享空间对齐”还是“桥接到生成模型”。跨模态系统的可靠性不来自把图片塞进 prompt，而来自预处理、对齐目标、信息瓶颈、证据边界和评测体系的共同设计。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「4.1 Multimodal input 不等于 multimodal output」？
  answer: BLIP-2 看图后只生成文本；CLIP 只生成 embedding。能力必须按输入和输出分别描述。
  source_heading: 4.1 Multimodal input 不等于 multimodal output
- level: 概念辨析
  question: 原文如何解释「4.4 CLIP 不生成 caption」？
  answer: 它学习 shared embedding space。Caption 需要 decoder 或 generative language model。
  source_heading: 4.4 CLIP 不生成 caption
- level: 概念辨析
  question: 原文如何解释「4.10 Q-Former 不是普通 tokenizer」？
  answer: 它用 learnable queries 与 cross-attention 从视觉 features 提取固定数量的语言相关表示，是可训练 bridge。
  source_heading: 4.10 Q-Former 不是普通 tokenizer
- level: 概念辨析
  question: 原文如何解释「4.12 Processor 输出 224×224 不证明发生了拉伸」？
  answer: 可能是 resize、crop 或组合。必须检查具体 image processor config；shape 本身不足以还原变换。
  source_heading: 4.12 Processor 输出 224×224 不证明发生了拉伸
- level: 概念辨析
  question: 原文如何解释「4.16 图像不是天然安全的数据」？
  answer: 可见文字、二维码、metadata 和隐写内容都可能影响下游 agent；多模态输入同样需要 prompt-injection 防护。
  source_heading: 4.16 图像不是天然安全的数据
