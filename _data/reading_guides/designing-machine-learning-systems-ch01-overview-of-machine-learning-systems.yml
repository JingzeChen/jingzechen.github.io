  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - MLOps 与 ML systems design 有什么联系，又有什么区别？
    - 怎样从“学习、复杂模式、已有数据、预测、未见数据”五个词判断一个问题是否适合 ML？
    - 研究中的 ML 与生产中的 ML，为何在目标、计算、数据、公平性和可解释性上存在根本差异？
    - 一句话概括：先证明问题值得用 ML，再把模型放回业务、数据、部署、监控、公平和维护构成的完整系统中。
  - title: 1. 开篇：从 Google 神经机器翻译到完整 ML 系统
    source_heading: 1. 开篇：从 Google 神经机器翻译到完整 ML 系统
    paragraphs:
    - 2016 年 11 月，Google 宣布把多语言神经机器翻译系统用于 Google Translate。这是深度神经网络较早的大规模生产成功案例之一。按
      Google 当时的说法，这次更新带来的翻译质量跃升，超过此前十年改进的总和。
    - 成功推动了整个行业对 ML 的兴趣。此后五年，ML 快速进入信息获取、交流、工作和社交等生活环节；医疗、交通、农业和宇宙研究中仍有大量待探索场景。
    - MLOps 中的 Ops 来自 DevOps。把某种能力 operationalize，意味着把它带入生产，包括部署、监控和维护。MLOps 是让 ML
      进入生产的一组工具与最佳实践。
    - 因此本书要提供的是选择与组合方案的框架，而不是替读者指定某个算法。第 1 章先回答何时使用 ML，再通过研究、生产和传统软件的比较，解释为什么生产 ML
      需要独立的系统方法。
  - title: 2. When to Use Machine Learning：什么时候使用 ML
    source_heading: 2. When to Use Machine Learning：什么时候使用 ML
    paragraphs:
    - 英语中的 predict 常指估计未来，例如天气、比赛结果或用户下一部想看的电影。机器学习中的预测范围更宽：问题可以关于未来、现在甚至过去，只要输出是从输入估计未知答案。
    - 未来数据尚未出现，因此团队不可能“知道”其分布，只能提出可检验假设，例如明天的用户行为不会突然完全不同。生产监控负责发现假设破裂，第 8 章讨论分布变化，第
      9 章讨论生产测试与持续学习。
    - 自动驾驶（自驾系统）说明平均收益与单次灾难风险之间的张力。系统若统计上比人类安全，可能挽救更多生命；但这不能把所有风险简单压成平均值。灾难性、安全和伦理约束往往应作为硬门槛，而不是靠大量普通正确预测抵消。
    - 第二条路径省去了完整手工描述模式的要求，但没有消除工程工作。团队仍要发现变化、取得正确标签、避免反馈污染、验证新模型并监控发布。ML 能从新数据更新，不等于模型会自动适应。
  - title: 3. Machine Learning Use Cases：机器学习用例
    source_heading: 3. Machine Learning Use Cases：机器学习用例
    paragraphs:
    - 机器翻译是把一种语言自动转换成另一种语言，也是吸引作者进入 ML 领域的用例。它不仅是技术指标问题，还能降低文化和语言障碍。作者的父母不会英语，但借助
      Google Translate 能阅读她的文章，并与不会越南语的朋友交流。
    - 难点是正例稀少、标签延迟、攻击者会适应系统。高准确率可能毫无意义：若欺诈率为 0.1%，全部预测“正常”也有 99.9% 准确率。应结合精确率、召回率、拦截损失、人工审核容量和客户摩擦。
    - 原章引用的 2019 年历史数据称：移动应用获取一名最终产生应用内购买的用户，平均成本为 86.61 美元；Lyft 获客成本估计为每位乘客 158 美元。企业客户的获客成本通常更高。
    - 最容易被挽回的人不一定是流失概率最高的人。无论是否发优惠都要离开的客户，可能浪费干预预算；本来就不会离开的客户也不需要优惠。可靠系统应通过随机实验估计
      uplift，而不是直接按流失分数发放资源。
  - title: 4. Understanding Machine Learning Systems：理解机器学习系统
    source_heading: 4. Understanding Machine Learning Systems：理解机器学习系统
    paragraphs:
    - ML in research 与 ML in production；
    - ML systems 与 traditional software。
    - 第一组说明学术成功为何不能直接推出生产成功，第二组说明传统软件工程为何必要但不充分。
  - title: 4.2 Machine Learning Systems Versus Traditional Software
    source_heading: 4.2 Machine Learning Systems Versus Traditional Software
    paragraphs:
    - ML 是软件工程的一部分。模块化、测试、代码审查、版本控制、持续集成、可观测性、回滚和安全等成熟实践都应继续使用。若 ML 从业者具备更强的软件工程能力，生产系统会更可靠。
    - 大型数据通常不适合把每个字节直接放进普通 Git。常见做法是保存不可变对象、内容哈希、分区清单和元数据，让一个轻量 manifest 唯一指向完整数据快照。
    - 这与原章给出的 1.35 GB 大致一致；换算为 GiB 约 1.27 GiB。实际推理还需要激活、运行时工作区、缓存和框架开销，训练则还要梯度与优化器状态。
    - 2018 年 BERT 论文发布时，人们认为它过大、过慢、过于复杂，不实用。预训练 BERT Large 有 3.4 亿参数、约 1.35 GB。到 2020
      年，BERT 及其变体已用于几乎每一次英文 Google 搜索。
  - title: 5. 原章总结的完整还原
    source_heading: 5. 原章总结的完整还原
    paragraphs:
    - 本章先浏览了生产 ML 的广泛用例。消费者应用最容易被看到，但多数 ML 用例位于企业领域，并同时服务企业内部与外部场景。ML 能很好解决一部分问题，却不能解决所有问题，也并非对所有可解问题都合适。一个大问题无法整体交给
      ML 时，可以把其中边界明确的预测子问题交给 ML。
    - 研究常围绕单一基准性能，生产面对多方要求；
    - 研究常重训练吞吐，生产在线系统常重推理延迟；
    - 最后，本章比较 ML 系统与传统软件。ML 继承软件工程问题，又增加数据、模型产物、统计行为、快速变化、模型体积和质量监控等挑战。这正是全书需要采用系统方法的原因。
  - title: 7. 本章知识结构
    source_heading: 7. 本章知识结构
    paragraphs:
    - 因而模型行为不能只由代码保证，必须同时管理数据和模型产物。
    - 模型进入产品后，要满足多方目标、延迟、公平和解释等要求。
    - 这些要求互相耦合，单一排行榜指标无法代表系统价值。
    - 所以立项前要判断 ML 的必要性，立项后要按完整生命周期设计。
  - title: 8. 核心结论
    source_heading: 8. 核心结论
    paragraphs:
    - ML systems design 是对 MLOps 的系统化视角。 它关注组件和利益相关者怎样共同满足目标，而不只是生产化工具。
    - 适合 ML 的问题具有可学习、复杂、数据可得、可预测和可迁移的模式。 重复、低错误成本、大规模和持续变化会进一步提高 ML 优势。
    - 训练通常重吞吐，在线推理通常重延迟。 batching 可以提高硬件利用率和吞吐，却增加处理及等待延迟。
    - 模型大小、数据价值与质量监控是独特的生产挑战。 参数文件能否加载、预测能否及时返回、退化能否发现，都属于功能正确性。
  - title: 9. 从本章提炼出的通用问题解决方法
    source_heading: 9. 从本章提炼出的通用问题解决方法
    paragraphs:
    - 使用查表、规则、SQL、搜索或人工流程得到成本和质量基线。它既可能直接解决问题，也为 ML 提供最低比较标准和安全回退。
    - 把业务、产品、ML、平台、安全、法务和用户要求量化，区分硬约束与软目标。模型开发前就确认延迟、成本和责任边界。
    - 记录数据来源与时间、标签规范、代码、配置、环境、模型、评估和发布。确保训练结果可解释、线上问题可追溯、新版本可回滚。
    - 这套方法的核心不是“永远使用 ML”，而是让 ML 只进入它真正擅长、证据充分且能被完整运行和负责的那部分问题。
  takeaways:
  - 本章先浏览了生产 ML 的广泛用例。消费者应用最容易被看到，但多数 ML 用例位于企业领域，并同时服务企业内部与外部场景。ML 能很好解决一部分问题，却不能解决所有问题，也并非对所有可解问题都合适。一个大问题无法整体交给
    ML 时，可以把其中边界明确的预测子问题交给 ML。
  - ML 从数据学习，而数据来自变化的现实环境。
  - ML systems design 是对 MLOps 的系统化视角。 它关注组件和利益相关者怎样共同满足目标，而不只是生产化工具。
  - 训练通常重吞吐，在线推理通常重延迟。 batching 可以提高硬件利用率和吞吐，却增加处理及等待延迟。
  - 技术经济性会变化。 BERT 从“难以实用”到广泛用于搜索，说明当前约束不能被误认为永久边界。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「6.1 ML 系统不等于 ML 模型」？
  answer: 模型是输入到输出的映射；系统还包含目标、数据、特征、评估、部署、监控、更新、基础设施和人员。模型离线得分高，不能证明系统成功。
  source_heading: 6.1 ML 系统不等于 ML 模型
- level: 概念辨析
  question: 原文如何解释「6.6 预测不只指未来」？
  answer: 图像分类、语音识别和历史文档抽取都在估计未知答案，虽然对象属于现在或过去。
  source_heading: 6.6 预测不只指未来
- level: 概念辨析
  question: 原文如何解释「6.11 企业应用不总是慢，消费应用不总是低风险」？
  answer: 原章给出的是总体倾向。高频交易等企业系统追求极低延迟，消费医疗应用则要求极高准确性和隐私。
  source_heading: 6.11 企业应用不总是慢，消费应用不总是低风险
- level: 概念辨析
  question: 原文如何解释「6.15 百分位没有脱离算法的唯一小样本结果」？
  answer: nearest-rank、线性插值和流式近似会给出不同数值。SLO 必须固定算法、窗口与聚合范围。
  source_heading: 6.15 百分位没有脱离算法的唯一小样本结果
- level: 概念辨析
  question: 原文如何解释「6.20 “当前不划算”不等于“永远不值得学习”」？
  answer: 生产采用与技术探索是两种决策。可以不承担当前生产风险，同时以有限预算积累未来能力。
  source_heading: 6.20 “当前不划算”不等于“永远不值得学习”
