  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 本章先浏览了生产 ML 的广泛用例。消费者应用最容易被看到，但多数 ML 用例位于企业领域，并同时服务企业内部与外部场景。ML 能很好解决一部分问题，却不能解决所有问题，也并非对所有可解问题都合适。一个大问题无法整体交给
    ML 时，可以把其中边界明确的预测子问题交给 ML。
  thesis_source: 5. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：先证明问题值得用 ML，再把模型放回业务、数据、部署、监控、公平和维护构成的完整系统中。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. When to Use Machine Learning：什么时候使用 ML
    meaning: 自动驾驶（自驾系统）说明平均收益与单次灾难风险之间的张力。系统若统计上比人类安全，可能挽救更多生命；但这不能把所有风险简单压成平均值。灾难性、安全和伦理约束往往应作为硬门槛，而不是靠大量普通正确预测抵消。
    source_heading: 2. When to Use Machine Learning：什么时候使用 ML
  - term: 4. Understanding Machine Learning Systems：理解机器学习系统
    meaning: 第一组说明学术成功为何不能直接推出生产成功，第二组说明传统软件工程为何必要但不充分。
    source_heading: 4. Understanding Machine Learning Systems：理解机器学习系统
  - term: 4.2 Machine Learning Systems Versus Traditional Software
    meaning: 2018 年 BERT 论文发布时，人们认为它过大、过慢、过于复杂，不实用。预训练 BERT Large 有 3.4 亿参数、约 1.35
      GB。到 2020 年，BERT 及其变体已用于几乎每一次英文 Google 搜索。
    source_heading: 4.2 Machine Learning Systems Versus Traditional Software
  - term: 7. 本章知识结构
    meaning: 因而模型行为不能只由代码保证，必须同时管理数据和模型产物。
    source_heading: 7. 本章知识结构
  - term: 9. 从本章提炼出的通用问题解决方法
    meaning: 使用查表、规则、SQL、搜索或人工流程得到成本和质量基线。它既可能直接解决问题，也为 ML 提供最低比较标准和安全回退。
    source_heading: 9. 从本章提炼出的通用问题解决方法
