  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 最后，所有层都面临 build versus buy。公司阶段、核心优势、现成工具成熟度会改变答案；选择高度 context-dependent，没有统一
    vendor 或架构。
  thesis_source: 7. 原章总结的完整还原
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：基础设施的价值不是拥有最多工具，而是把组织反复需要的正确做法做成低摩擦、可复现、可审计的默认路径，并让计算、开发、编排和 ML
      artifacts 在同一血缘中协作。
    source_heading: 0. 本章要回答的核心问题
  - term: 2. Storage and Compute：存储与计算
    meaning: Core count 是方便的代理，不包含单核性能、vector/tensor units、NUMA、memory、I/O 和软件优化。原章提醒
      AWS vCPU 通常对应一个 hardware thread，例如某些实例两 cores × 每 core 两 threads = 4 vCPUs；但不同实例/architecture
      的映射要看当前规格，不能普遍理解成“半个物理 core”。
    source_heading: 2. Storage and Compute：存储与计算
  - term: 4. Resource Management：资源管理
    meaning: 现实边界重叠：Kubernetes 有 scheduler 和 controllers；Slurm/Borg 也有 provisioning/placement
      能力。不要仅按产品类别判断，应查看谁负责 trigger、dependency、placement、provisioning、retry 和 service
      reconciliation。
    source_heading: 4. Resource Management：资源管理
  - term: 6. Build Versus Buy：自建还是购买
    meaning: Managed Databricks cluster 可能只需少量平台人力；自管 Spark/EMR、K8s、registry、feature
      platform 需要更多 build/on-call。原章用“一名 vs 多五名工程师”作直觉例，不是通用 staffing formula。
    source_heading: 6. Build Versus Buy：自建还是购买
  - term: 9. 本章知识结构
    meaning: ML platform 把 deployment、model lineage、feature semantics 做成跨团队能力。
    source_heading: 9. 本章知识结构
  - term: 11. 作者如何分析问题，以及可迁移的一般方法
    meaning: Container build 中：pin base digest、dependencies 和 source commit；生成 SBOM/signature；non-root；CI
      build + vulnerability + smoke test；registry immutable promotion。
    source_heading: 11. 作者如何分析问题，以及可迁移的一般方法
