  sections:
  - title: 0. 两篇书前材料的作用与阅读主线
    source_heading: 0. 两篇书前材料的作用与阅读主线
    paragraphs:
    - Foreword（推荐序）由 Caiming Xiong 从行业和生产经验出发，判断规模化 inference 已成为 AI 产品的主要挑战，并说明本书为什么值得读。
    - Preface（前言）由作者解释写作动机、LLM serving 与传统 ML serving 的本质差异、全书目标与边界、目标读者、十章结构和实践条件。
    - Prototype 到 production 的鸿沟为什么通常不只来自模型能力？
    - LLM 的 autoregressive、stateful、variable-length 特征怎样改变 latency、memory 和 scheduling？
  - title: 2. Preface：为什么需要一门独立的 LLM Serving 学科
    source_heading: 2. Preface：为什么需要一门独立的 LLM Serving 学科
    paragraphs:
    - 前言把 LLM 从研究新奇事物到 production-critical infrastructure 的变化类比互联网革命，并提出一个“agentic
      world”正在到来。作者所说的新一轮“tokenization”并不是 NLP tokenizer 的技术过程，而是一种产业比喻：越来越多应用构建在
      token-generating LLM infrastructure 之上，而非只调用传统确定性 API/service。
    - 初期 public API 帮助快速验证产品；随着规模和业务重要性提升，团队希望获得模型、数据和执行层的更多控制。这不是“所有公司最终都必须自建”的线性结论，而是一条由规模、隐私、成本和定制需求驱动的责任连续谱。
    - 作者列举的失败现象包括：优秀 demo 在真实流量下崩溃、一周耗尽 GPU 预算、组织因 public API 成本和数据安全放弃关键 use case、团队面对框架与云选项不知从何开始。
    - 领域按周/月演进，单纯“收录当前工具”很快过时。因此作者要提供的是系统性 foundation，让读者能理解后来出现的新技术，而非记住当前答案。
  - title: 4. What This Book Aims to Do
    source_heading: 4. What This Book Aims to Do
    paragraphs:
    - 解释 execution：attention、prefill、decode 如何塑造 latency/throughput/cost；
    - 从零构建系统：看懂 API、scheduler、cache、worker 和 framework 取舍；
    - 应用优化技术：batch、quantization、fusion、continuous batching、prefix cache、speculation；
    - 连接真实 workload：chat、RAG、agent、enterprise、cloud/self-hosted。
  - title: 6. What This Book Isn’t
    source_heading: 6. What This Book Isn’t
    paragraphs:
    - 如果同时系统讲训练理论、应用产品、全部框架和所有研究，serving 主线会被稀释。作者选择“just enough background”：只解释 attention、KV
      cache、quantization 等如何影响 serving decision。
    - 新读者可搭配 Jay Alammar 与 Maarten Grootendorst 的 Hands-On Large Language Models（原文链接显示书名处有
      “Large Learning Models” 的文字差异，应以实际出版物为准），将其作为模型/LLM 基础，本书作为 serving/systems
      companion。
    - "“Hands-on”不意味着每位读者必须具备高端多 GPU；"
    - 框架对比提供方向，不替代当前版本 compatibility matrix。
  - title: 8.3 按角色选择路径
    source_heading: 8.3 按角色选择路径
    paragraphs:
    - Application/Agent developer：2→4→8→10，再补 3；
    - Architect/Tech lead：1→4→5→8→9，再按需深入；
    - Edge engineer：1→5→6→8 的 llama.cpp→10；
    - RL infrastructure engineer：2→5～8→10 RL 部分。
  - title: 8.4 如何使用 Lab
    source_heading: 8.4 如何使用 Lab
    paragraphs:
    - 固定 model/framework/hardware 版本；
    - 复算 token、latency、memory；
    - 对比预执行 notebook，但不期待数字完全一致。
  - title: 11.2 许可的实用边界
    source_heading: 11.2 许可的实用边界
    paragraphs:
    - 使用若干代码片段，无需逐次申请；
    - 销售或分发 O’Reilly 示例；
    - 在产品文档中纳入大量/显著部分代码；
    - 超出 fair use 和书中许可的使用。
  - title: 12. O’Reilly Online Learning
    source_heading: 12. O’Reilly Online Learning
    paragraphs:
    - 这一节介绍 O’Reilly 的学习平台和出版生态：live training、learning paths、interactive coding、书籍与视频，以及来自
      200 多家出版社的内容。
    - 它与本书技术论证没有直接依赖，实用价值在于提供补充学习材料。读者不需要订阅平台才能理解书中核心内容。
  - title: 14. Acknowledgments
    source_heading: 14. Acknowledgments
    paragraphs:
    - LLM serving 是高度协作的领域，框架、论文、kernel、硬件和 production feedback 共同推动进展。
    - 同时，这也意味着案例视角可能更接近 enterprise platform，读者应按自己的组织规模和约束调整。
    - 两位作者分别感谢家庭对长时间写作、代码、图表和章节迭代的支持。技术书的“完整性”不仅来自技术工作，也来自编辑、生活时间和长期坚持。
    - 作者最后声明剩余错误由自己承担。对读者而言，合适态度也是：尊重作者经验，同时独立复核公式、规格、价格、API 和实验条件。
  - title: 17. 知识结构与核心结论
    source_heading: 17. 知识结构与核心结论
    paragraphs:
    - 规模化 inference 已从次要部署环节变成 AI 产品的决定性挑战。 模型价值只有在 latency、reliability、cost 和 scale
      可行时才能持续交付。
    - LLM serving 不是传统 serving 的简单放大。 Autoregressive、stateful KV、prefill/decode、variable-length
      conversations 和 streaming 改变了计算与系统抽象。
    - Inference 的持续性改变经济模型。 训练偏前置，推理随调用累积；GPU memory、scheduling 和 API/self-host 利用率决定单位经济。
    - Foreword 与 Preface 共同提出的总命题是：LLM 的商业和社会价值不由 checkpoint 能力单独决定，而由一套可理解、可度量、可靠且经济的
      inference system 将能力持续交付；由于模型、硬件和框架不断变化，最值得学习的不是某个当前配置，而是从执行机制和真实 workload 出发，在质量、延迟、吞吐、可靠性、治理与成本之间反复建立证据和做取舍。
  takeaways:
  - 规模化 inference 已从次要部署环节变成 AI 产品的决定性挑战。 模型价值只有在 latency、reliability、cost 和 scale
    可行时才能持续交付。
  - Inference 的持续性改变经济模型。 训练偏前置，推理随调用累积；GPU memory、scheduling 和 API/self-host 利用率决定单位经济。
  - 目标读者跨越模型与系统角色。 共同前提是能读 Python、懂基本 LLM，并愿意处理指标和架构，而非必须会 CUDA。
  - 代码示例是学习材料，不是 production guarantee。 许可、兼容、安全和工程完备性是不同维度。
  - Foreword 与 Preface 共同提出的总命题是：LLM 的商业和社会价值不由 checkpoint 能力单独决定，而由一套可理解、可度量、可靠且经济的
    inference system 将能力持续交付；由于模型、硬件和框架不断变化，最值得学习的不是某个当前配置，而是从执行机制和真实 workload 出发，在质量、延迟、吞吐、可靠性、治理与成本之间反复建立证据和做取舍。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「15.1 模型能力是生产成败的唯一因素」？
  answer: 错误。Serving latency、reliability、cost、governance 和 scale 会使优秀模型无法落地。
  source_heading: 15.1 模型能力是生产成败的唯一因素
- level: 概念辨析
  question: 原文如何解释「15.4 LLM serving 只是传统 serving 多用几张 GPU」？
  answer: 错误。Autoregressive、state、prefill/decode、variable length、streaming 和 KV 改变了
    scheduler 与 memory abstraction。
  source_heading: 15.4 LLM serving 只是传统 serving 多用几张 GPU
- level: 概念辨析
  question: 原文如何解释「15.7 自建一定更便宜、更安全、更可控」？
  answer: 错误。低利用率、运维不足和配置错误会更贵或更危险；必须比较完整责任与 TCO。
  source_heading: 15.7 自建一定更便宜、更安全、更可控
- level: 概念辨析
  question: 原文如何解释「15.11 Hands-on 意味着必须购买高端 GPU」？
  answer: 错误。无 GPU 仍可学习架构、公式和 captured experiments；可用 Colab、CPU 或小模型验证部分机制。
  source_heading: 15.11 Hands-on 意味着必须购买高端 GPU
- level: 概念辨析
  question: 原文如何解释「15.16 快速变化意味着书很快完全过时」？
  answer: 具体 API/价格会过时，但 state、capacity、bandwidth、communication、queue、quality 和 cost
    的分析框架仍可迁移。
  source_heading: 15.16 快速变化意味着书很快完全过时
