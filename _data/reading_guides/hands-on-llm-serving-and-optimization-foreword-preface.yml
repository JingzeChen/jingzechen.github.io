    meaning: Foreword 与 Preface 共同提出的总命题是：LLM 的商业和社会价值不由 checkpoint 能力单独决定，而由一套可理解、可度量、可靠且经济的
      inference system 将能力持续交付；由于模型、硬件和框架不断变化，最值得学习的不是某个当前配置，而是从执行机制和真实 workload 出发，在质量、延迟、吞吐、可靠性、治理与成本之间反复建立证据和做取舍。
    source_heading: 17. 知识结构与核心结论
