  sections:
  - title: 1. 本章主线：从评分预测到排序、序列与特征交叉
    source_heading: 1. 本章主线：从评分预测到排序、序列与特征交叉
    paragraphs:
    - 推荐系统要在海量候选中，为每个用户发现其可能感兴趣的物品。这里的“物品”可以是电影、音乐、新闻、商品、广告、视频或地点。
    - 真实业务更多只有点击、观看、购买等隐式行为，目标应从评分值转为候选排序；
    - 稀疏 ID 交互无法充分处理冷启动和上下文，CTR 模型引入丰富类别特征；
    - 模型必须与任务对齐：低 RMSE 不保证 Top-K 排序好，BPR 分数也不一定是校准概率，CTR 预测更不等同于长期用户满意度。
  - title: 4. 显式反馈与隐式反馈
    source_heading: 4. 显式反馈与隐式反馈
    paragraphs:
    - 优点：语义相对直接。缺点：获取成本高、自选择严重，愿意评分的用户和物品并非随机样本。
    - 未点击可能是没兴趣，也可能根本没看到；
    - 长时观看可能是喜欢，也可能是无法理解。
    - 因此把所有未观测项当真负例会引入曝光偏差和选择偏差。负采样只是训练近似，不是事实标签。
  - title: 7. 数据拆分与协议
    source_heading: 7. 数据拆分与协议
    paragraphs:
    - 但它不是全局时间切点：其他用户较晚发生的交互仍可能帮助模型预测某用户更早的测试时点。这是常见 transductive leave-one-out 协议，不等同于真实线上回放。
    - 原书为简洁只拆 train/test，并说 test 可视为 held-out validation。若每 epoch 查看并据此选超参数，它就是验证集，不能再作为最终测试集。
    - validation：选超参数和 early stopping；
    - 两者都可行，但实现时必须明确方向，AutoRec 使用的是 item-based 列向量语义。
  - title: 9.4 原书实验
    source_heading: 9.4 原书实验
    paragraphs:
    - learning rate 0.002；
    - 预测代码传入零基索引 20 和 30，对应原始 ID 21 和 31，不是文字所称原始 ID 20 和 30。
  - title: 11. 从评分预测到个性化排序
    source_heading: 11. 从评分预测到个性化排序
    paragraphs:
    - weighted implicit MF。
    - 同时考虑整个候选列表，直接或近似优化 NDCG、softmax list likelihood 等。更贴近最终指标，但计算和采样更复杂。
  - title: 17. 序列感知推荐
    source_heading: 17. 序列感知推荐
    paragraphs:
    - Sequence-aware personalized：有稳定用户 ID，结合长期历史和短期序列；
    - Session-based：可能没有用户 ID，只利用当前会话行为，跨会话历史不可用或不可靠。
    - Caser 同时使用 user embedding 和近期序列，属于前者。
  - title: 20.5 Dataset 实现问题
    source_heading: 20.5 Dataset 实现问题
    paragraphs:
    - Criteo 含连续特征，不能原样套用全类别 wrapper；
    - 类别词表必须只用训练数据建立，避免测试泄漏。
  - title: 23. DeepFM
    source_heading: 23. DeepFM
    paragraphs:
    - 直接扩展高阶 FM 计算复杂且数值不稳定。DeepFM 用 MLP 从共享 embedding 自动学习非线性高阶组合。
    - 无需像 Wide & Deep 那样大量手工交叉。
    - 但共享也可能造成梯度目标冲突，不一定在所有任务上优于独立 embedding。
    - 原文称“其他超参数相同”不准确。又没有可靠 AUC/log loss 数值、重复实验和置信区间，不能把“收敛更快、效果更好”归因于 deep 部分。
  - title: 26. 离线评价的系统性偏差
    source_heading: 26. 离线评价的系统性偏差
    paragraphs:
    - 不是常数。测试 RMSE 只衡量已选择评分样本，不代表所有用户—物品对。
    - 没有曝光就不可能点击。日志由旧策略产生，模型若把未点击都当负例，会学习旧策略的曝光分布和位置偏差。
    - 热门物品有更多交互，embedding 学得更好，又更容易被推荐，从而得到更多数据，形成正反馈；长尾内容被系统性忽视。
    - 要求 propensity 已知且有重叠；权重过大时方差很高。Doubly robust 方法结合 outcome model 降低风险。
  - title: 31. 解决推荐系统问题的一般思路
    source_heading: 31. 解决推荐系统问题的一般思路
    paragraphs:
    - 让目标匹配任务：评分用 MSE，排序用 pairwise/listwise，CTR 用 calibrated BCE。
    - 使用与任务匹配的指标：RMSE、NDCG、Recall、AUC、log loss 和 calibration 各有边界。
    - 同时评价相关性之外目标：coverage、diversity、novelty、fairness 和 latency。
    - 本章可以压缩为一句话：推荐系统随着可用信号和任务从显式评分的矩阵分解与 AutoRec，扩展到隐式反馈的 BPR/NeuMF、时间序列的 Caser，以及特征丰富
      CTR 的 FM/DeepFM；每次扩展都在补足前一表示的限制，但模型价值取决于正确的数据拆分、负采样、候选集和评价协议。真正困难的不只是预测函数，而是未观测不等于负例、曝光决定日志、离线指标不等于长期价值，以及推荐行为会反过来塑造下一轮数据。
  takeaways:
  - 推荐系统帮助用户从海量候选中发现相关物品，但业务目标与用户长期价值不总一致。
  - MF 以低秩用户/物品 embedding 和 bias 预测评分，只在观测集合优化。
  - Hinge 使用显式 margin，超过 margin 后梯度为零；它与 BPR 并非统计等价。
  - FM 用低秩 embedding 内积共享二阶交叉参数，是 MF 和线性模型的推广。
  - 离线指标不是最终产品目标，仍需在线实验、长期护栏、公平性和隐私审计。
