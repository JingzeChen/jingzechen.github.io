checks:
- level: 概念辨析
  question: 原文如何解释「28.2 协同过滤使用用户画像和物品文本」？
  answer: 狭义 CF 只用交互；加入 side information 后属于混合或特征丰富推荐。
  source_heading: 28.2 协同过滤使用用户画像和物品文本
- level: 概念辨析
  question: 原文如何解释「28.8 每用户最后一条切分就是严格线上回放」？
  answer: 它不是全局时间切点，仍是 transductive leave-one-out。
  source_heading: 28.8 每用户最后一条切分就是严格线上回放
- level: 概念辨析
  question: 原文如何解释「28.36 模型内 sigmoid 后默认 logits BCE 是正确组合」？
  answer: 这会重复 sigmoid；应返回 logits 或配置 probability loss。
  source_heading: 28.36 模型内 sigmoid 后默认 logits BCE 是正确组合
- level: 概念辨析
  question: 原文如何解释「28.41 离线指标提升必然带来线上收益」？
  answer: 曝光偏差、反馈回路和目标错位会造成 offline–online gap。
  source_heading: 28.41 离线指标提升必然带来线上收益
