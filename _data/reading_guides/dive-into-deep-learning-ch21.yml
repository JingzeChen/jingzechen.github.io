overview:
  kind: summary
  minutes: 8
  question: 原文围绕「1. 本章主线：从评分预测到排序、序列与特征交叉」建立了怎样的核心认识？
  question_source: 1. 本章主线：从评分预测到排序、序列与特征交叉
  thesis: 离线指标不是最终产品目标，仍需在线实验、长期护栏、公平性和隐私审计。
  thesis_source: 30. 核心结论
  concepts:
  - term: 1. 本章主线：从评分预测到排序、序列与特征交叉
    meaning: 模型必须与任务对齐：低 RMSE 不保证 Top-K 排序好，BPR 分数也不一定是校准概率，CTR 预测更不等同于长期用户满意度。
    source_heading: 1. 本章主线：从评分预测到排序、序列与特征交叉
  - term: 7. 数据拆分与协议
    meaning: 但它不是全局时间切点：其他用户较晚发生的交互仍可能帮助模型预测某用户更早的测试时点。这是常见 transductive leave-one-out
      协议，不等同于真实线上回放。
    source_heading: 7. 数据拆分与协议
  - term: 11. 从评分预测到个性化排序
    meaning: 同时考虑整个候选列表，直接或近似优化 NDCG、softmax list likelihood 等。更贴近最终指标，但计算和采样更复杂。
    source_heading: 11. 从评分预测到个性化排序
  - term: 17. 序列感知推荐
    meaning: Session-based：可能没有用户 ID，只利用当前会话行为，跨会话历史不可用或不可靠。
    source_heading: 17. 序列感知推荐
  - term: 23. DeepFM
    meaning: 原文称“其他超参数相同”不准确。又没有可靠 AUC/log loss 数值、重复实验和置信区间，不能把“收敛更快、效果更好”归因于 deep
      部分。
    source_heading: 23. DeepFM
  - term: 31. 解决推荐系统问题的一般思路
    meaning: 本章可以压缩为一句话：推荐系统随着可用信号和任务从显式评分的矩阵分解与 AutoRec，扩展到隐式反馈的 BPR/NeuMF、时间序列的
      Caser，以及特征丰富 CTR 的 FM/DeepFM；每次扩展都在补足前一表示的限制，但模型价值取决于正确的数据拆分、负采样、候选集和评价协议。真正困难的不只是预测函数，而是未观测不等于负例、曝光决定日志、离线指标不等于长期价值，以及推荐行为会反过来塑造下一轮数据。
    source_heading: 31. 解决推荐系统问题的一般思路
