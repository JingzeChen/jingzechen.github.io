checks:
- level: 概念辨析
  question: 原文如何解释「6.1 单次预测错误不等于系统 failure」？
  answer: 统计性能期望包含允许误差、窗口与置信度，单次普通错误通常不能证明它失效；安全、隐私、有害输出等零容忍硬约束则可被单次事件违反。
  source_heading: 6.1 单次预测错误不等于系统 failure
- level: 概念辨析
  question: 原文如何解释「6.22 Reference window 不同会得出相反结论」？
  answer: Seasonal context 和 baseline 选择是检测定义的一部分。
  source_heading: 6.22 Reference window 不同会得出相反结论
- level: 概念辨析
  question: 原文如何解释「6.25 Retraining 不只指从头训练」？
  answer: 本书也包含 checkpoint fine-tuning；二者状态与遗忘风险不同。
  source_heading: 6.25 Retraining 不只指从头训练
- level: 概念辨析
  question: 原文如何解释「6.27 Observability 不等于日志越多越好」？
  answer: 无 schema、trace、owner 和查询设计的海量日志只是成本。
  source_heading: 6.27 Observability 不等于日志越多越好
- level: 概念辨析
  question: 原文如何解释「6.30 Feature validation 不等于 drift detection」？
  answer: Validation 查契约，distribution test 查统计变化；两者都不直接证明质量下降。
  source_heading: 6.30 Feature validation 不等于 drift detection
