  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 每步代价相同时，最少需要多少步？
    - 有向依赖能否排成不违反先后关系的线性顺序？
  - title: 18.1 DFS、BFS 和拓扑排序概述
    source_heading: 18.1 DFS、BFS 和拓扑排序概述
    paragraphs:
    - 同一顶点的多个未访问邻点可按任意顺序选择，邻接表顺序不同会产生不同 DFS 序列，但可达集合不变。若题目要求字典序最小路径或固定输出，必须先排序邻接表或使用规定的邻点顺序。
    - 广度优先搜索（Breadth-First Search，BFS）使用先进先出队列。源点距离为 0，先访问所有距离 1 的顶点，再访问距离 2 的顶点，依次向外扩展。
    - 通常应在入队时标记；若出队时才标记，同一顶点可能被多个前驱重复入队，使时间和队列空间显著膨胀。若队列项保留各自的发现距离，并在出队时判重、跳过后续副本，最短层次仍可正确，只是低效；若重复入队时覆盖同一份距离或父指针，则较晚的非最优发现还可能破坏距离或路径恢复结果。
    - DFS 在顶点所有后继完成后把它加入后序列表，反转列表得到拓扑序；三色标记负责检测回边。Kahn 从“没有前驱”的顶点向前推进，DFS 后序从“后继都完成”的顶点向后收集。
  - title: 18.2 深度优先遍历应用的算法设计
    source_heading: 18.2 深度优先遍历应用的算法设计
    paragraphs:
    - 一次 DFS 恰访问起点所在岛屿：沿陆地边不会越出分量，且所有与起点连通的陆地都能沿某条路径被递归到。扫描时每个分量第一次遇到一个未访问格才加 1，之后整分量已改色，所以每座岛计一次。
    - 每条周长边只属于一个陆地格及一个方向，处理该陆地四邻时计一次。两块陆地的共享边从两侧看都是陆地，不计入周长。
    - 朴素地把每次选择的最小目的地立即写入最终路径，可能提前进入一条无出路分支，剩余机票无法接上。Hierholzer 在某顶点所有出边耗尽后才把它加入结果，相当于先确定欧拉通路的尾部，再向前拼接；每条被删除的边最终恰出现一次。
    - 每次从当前机场消费字典序最小的可用出边。后序反转后，这会在最早可决定的位置优先使用较小目的地，同时 Hierholzer 保证不会遗失边，从而得到题设保证存在情况下的字典序最小有效行程。
  - title: 18.3 广度优先遍历应用的算法设计
    source_heading: 18.3 广度优先遍历应用的算法设计
    paragraphs:
    - 状态、六类转移、目标条件与 18.2.5 相同。区别仅是用队列按操作步数分层：若还要求最少操作数，BFS 第一次到达目标就是最少步；本题只问可达性，DFS/BFS
      都正确。
    - 把所有陆地同时作为距离 0 源点入队，向海洋扩展。某海洋第一次被访问时，距离就是到最近陆地的最短距离。最后一层海洋的距离即所求最大值。
    - 无向图每条边会在两端出现，必须排除“立即沿父边返回”，否则会把两结点往返误判为环。还要区分“全局访问过”与“仍在当前递归路径中”，更稳健的实现使用三色或记录父亲后恢复路径状态。
    - 从第一岛向四周水格逐层扩展。水格入队时立即标记，避免重复。若从当前波前相邻位置遇到未标记的陆地，它属于第二座岛，当前扩展层数就是需要翻转的水格数。
  - title: 18.4 拓扑排序应用的算法设计
    source_heading: 18.4 拓扑排序应用的算法设计
    paragraphs:
    - 对拓扑顺序归纳：处理 u 时，它的所有路径前缀来源已完整；对每条出边传播后，所有以该边为最后一条边的路径都被记录。任意路径都有唯一最后一条边，因此最终闭包完整。
    - 从结点 u 出发的所有路径都最终到终点，等价于 u 无法到达任何有向环。只要有一条路径能进入环，就可在环内无限行走，u 不安全。
    - 终点安全。若一个结点所有出边都指向已证明安全结点，它也安全；反向剥离正按这个归纳规则扩张最大安全集合。不能被剥离的结点始终保留至少一条通往未剥离集合的边，有限图中最终可达环。
    - 相邻词首差异恰是词典序定义所要求的必要约束；所有相邻对都满足时，任何字符拓扑序都使整张词典保持给定顺序。环表示约束互相矛盾，非法前缀则在建图前已不可能。
  - title: 代码与推导的对应关系
    source_heading: 代码与推导的对应关系
    paragraphs:
    - 网格函数默认输入非空，这与对应 LeetCode 题目的约束一致。若迁移到通用库，应先处理空网格和不规则行；正文算法本身不依赖这一简化。
    - 最短桥的层数定义也直接映射到代码：初始整座岛属于第 0 层；处理第 k 层时若触及第二座岛，恰好需要翻转 k 个水格。
    - 代码在拓扑顺序中处理 u 时，u 的所有前驱信息已经完整，因而一次传播到 v 即可。这个论证依赖先修关系是 DAG；若输入允许环，应改用 Floyd、逐源搜索或先缩点再在凝聚图上计算。
    - 最终安全状态把“所有后继都安全”改写为反向剥离：一个结点的剩余出度降到 0，表示它所有通向不确定区域的边都已被安全结点吸收，于是它也安全。这里存储的是原图剩余出度，虽然传播方向发生在反图上，不能把它误称为反图入度。
  - title: 三种语言中的实现差异
    source_heading: 三种语言中的实现差异
    paragraphs:
    - 三种实现虽然在“是否复制输入”上不同，但算法不变量相同：发现状态时必须立刻标记。
    - Python 的行程邻接表逆序排序后从尾部弹出；火星词典使用最小堆。
    - 火星词典通常允许返回任意合法拓扑序。程序额外选择当前最小字符只是为了让示例输出稳定，并不意味着题目要求字典序最小答案。行程题不同：它明确要求在多个合法行程中返回字典序最小者，所以选择最小可用出边属于题意的一部分。
    - 本地 Python 3.12 已实际执行 19 组示例。当前环境没有 C++ 和 Go 编译器，因此正文 C++17 代码与 Go 1.22 附录只完成了代码块、括号、接口和输出覆盖的静态检查；未在本机编译运行。
  - title: 10. 剥叶找环与有向图拓扑排序相似但不相同
    source_heading: 10. 剥叶找环与有向图拓扑排序相似但不相同
    paragraphs:
    - 到环距离题在无向连通单环图中反复删除度为 1 的叶子，最终留下 2-core，也就是唯一环。Kahn 算法删除的是有向图入度为 0 的结点。两者都有“维护剩余度数”的形式，但度数含义、图的方向和结论都不同。
    - 若一般无向图含多个环或复杂 2-core，剥叶后留下的不一定是若干互不相交的简单环。LeetCode 2204 的“连通且边数等于结点数”保证图中只有一个环，这一输入条件不可省略。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - BFS 的核心是距离分层。 单源 BFS 求无权最短路，多源 BFS 求到最近源的距离，状态压缩 BFS 则在乘积状态图上求最短路。
    - 拓扑排序是在动态删除依赖。 Kahn 算法维护剩余入度；反图剥离可以维护原图剩余出度；拓扑 DP还能沿顺序传播祖先、路径或最值信息。
    - 输入结构决定方法边界。 2204 依赖连通单环图，1462 的拓扑传播依赖 DAG，847 依赖较小的 n，269 还必须检查非法前缀与重复边。
    - 最终应养成一个稳定检查顺序：状态是否完整，转移是否穷尽，标记是否发生在发现时，队列层数是否与答案同义，图的方向是否正确，输入结构是否满足算法假设。 这六项通常比背诵更多模板更能决定图搜索代码是否正确。
  takeaways:
  - 本章不是三个孤立模板的集合，而是一条由“可达性”逐步扩展到“最短距离”和“依赖消除”的方法链。
  - BFS 的核心是距离分层。 单源 BFS 求无权最短路，多源 BFS 求到最近源的距离，状态压缩 BFS 则在乘积状态图上求最短路。
  - 发现时标记是共同的不变量。 它既避免指数级重复，也保证 BFS 第一次发现状态时的距离最短。
  - 输入结构决定方法边界。 2204 依赖连通单环图，1462 的拓扑传播依赖 DAG，847 依赖较小的 n，269 还必须检查非法前缀与重复边。
  - 最终应养成一个稳定检查顺序：状态是否完整，转移是否穷尽，标记是否发生在发现时，队列层数是否与答案同义，图的方向是否正确，输入结构是否满足算法假设。 这六项通常比背诵更多模板更能决定图搜索代码是否正确。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. DFS 不等于递归，BFS 也不只是“用了队列”」？
  answer: DFS 的本质是优先沿当前分支继续探索，既可递归，也可用显式栈。BFS 的本质是按非递减距离分层处理状态，队列只是维护这一顺序的常用数据结构。若把新状态压到队首，或者混入不同权值的边，普通
    BFS 的最短路保证就会失效。
  source_heading: 1. DFS 不等于递归，BFS 也不只是“用了队列”
- level: 概念辨析
  question: 原文如何解释「7. 欧拉路径不是普通回溯找简单路径」？
  answer: Hierholzer 的后序收集让死路先进入答案尾部，最终反转后得到完整欧拉通路。
  source_heading: 7. 欧拉路径不是普通回溯找简单路径
- level: 概念辨析
  question: 原文如何解释「9. Kahn 算法处理数少于 V 才说明有环」？
  answer: 算法结束时仍有结点未处理，意味着这些结点的剩余入度无法降到 0，它们位于环上或依赖某个环。不能仅凭初始时“没有入度为 0 的结点”之外的局部现象判断整个图；应统计最终处理结点数。
  source_heading: 9. Kahn 算法处理数少于 $V$ 才说明有环
- level: 概念辨析
  question: 原文如何解释「10. 剥叶找环与有向图拓扑排序相似但不相同」？
  answer: 到环距离题在无向连通单环图中反复删除度为 1 的叶子，最终留下 2-core，也就是唯一环。Kahn 算法删除的是有向图入度为 0 的结点。两者都有“维护剩余度数”的形式，但度数含义、图的方向和结论都不同。
  source_heading: 10. 剥叶找环与有向图拓扑排序相似但不相同
- level: 概念辨析
  question: 原文如何解释「15. 火星词典有两类独立的非法输入」？
  answer: 第二类是字符先后关系形成有向环；此时 Kahn 算法处理的字符数少于字符总数。
  source_heading: 15. 火星词典有两类独立的非法输入
