overview:
  kind: summary
  minutes: 9
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: BFS 的核心是距离分层。 单源 BFS 求无权最短路，多源 BFS 求到最近源的距离，状态压缩 BFS 则在乘积状态图上求最短路。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 有向依赖能否排成不违反先后关系的线性顺序？
    source_heading: 本章要解决什么问题
  - term: 18.2 深度优先遍历应用的算法设计
    meaning: 朴素地把每次选择的最小目的地立即写入最终路径，可能提前进入一条无出路分支，剩余机票无法接上。Hierholzer 在某顶点所有出边耗尽后才把它加入结果，相当于先确定欧拉通路的尾部，再向前拼接；每条被删除的边最终恰出现一次。
    source_heading: 18.2 深度优先遍历应用的算法设计
  - term: 18.3 广度优先遍历应用的算法设计
    meaning: 无向图每条边会在两端出现，必须排除“立即沿父边返回”，否则会把两结点往返误判为环。还要区分“全局访问过”与“仍在当前递归路径中”，更稳健的实现使用三色或记录父亲后恢复路径状态。
    source_heading: 18.3 广度优先遍历应用的算法设计
  - term: 代码与推导的对应关系
    meaning: 最终安全状态把“所有后继都安全”改写为反向剥离：一个结点的剩余出度降到 0，表示它所有通向不确定区域的边都已被安全结点吸收，于是它也安全。这里存储的是原图剩余出度，虽然传播方向发生在反图上，不能把它误称为反图入度。
    source_heading: 代码与推导的对应关系
  - term: 三种语言中的实现差异
    meaning: 火星词典通常允许返回任意合法拓扑序。程序额外选择当前最小字符只是为了让示例输出稳定，并不意味着题目要求字典序最小答案。行程题不同：它明确要求在多个合法行程中返回字典序最小者，所以选择最小可用出边属于题意的一部分。
    source_heading: 三种语言中的实现差异
  - term: 本章总结
    meaning: 最终应养成一个稳定检查顺序：状态是否完整，转移是否穷尽，标记是否发生在发现时，队列层数是否与答案同义，图的方向是否正确，输入结构是否满足算法假设。
      这六项通常比背诵更多模板更能决定图搜索代码是否正确。
    source_heading: 本章总结
