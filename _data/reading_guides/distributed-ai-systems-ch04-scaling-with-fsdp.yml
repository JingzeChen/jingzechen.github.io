overview:
  kind: summary
  minutes: 14
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 恢复线：global tensor metadata → shard writers → committed checkpoint → current
    template reshard。
  thesis_source: 19. 本章知识结构
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: Forward AllGather、backward AllGather 与 gradient ReduceScatter 如何组成一个
      FSDP unit 的生命周期？
    source_heading: 0. 本章要回答的核心问题
  - term: 4. FSDP2：per-parameter sharding API
    meaning: 减少 parameter communication/compute bytes与使用 Tensor Cores，同时让 gradient
      reduction 更稳定，但 FP32 reduction 增加通信 bytes。应通过 memory snapshot、DTensor local
      dtype 和 profiler确认真实状态。
    source_heading: 4. FSDP2：per-parameter sharding API
  - term: 9. Performance optimization
    meaning: 在 before shard、after shard、after forward、after backward、after optimizer标记。每次实验前
      reset peak；避免每 step打印导致同步。
    source_heading: 9. Performance optimization
  - term: 11. Debugging FSDP issues
    meaning: 正确方式：所有 ranks执行 forward，只有无 collective副作用的日志/保存分支 rank 0限定。Evaluation若只想
      rank 0运行，不能直接对仍 sharded FSDP model单 rank forward；可导出完整 inference model或让所有 ranks参与。
    source_heading: 11. Debugging FSDP issues
  - term: 16. Exercises：五道练习的参考实现与分析
    meaning: 第二种：raw model以FP32初始化，FSDP在forward/backward把parameters cast到BF16；计算外sharded
      parameters保持原full precision，reduction FP32，optimizer使用FP32 gradients/state更稳健。
    source_heading: 16. Exercises：五道练习的参考实现与分析
  - term: 22. 复习与自测
    meaning: 完成这些检查后，应能从“FSDP让模型放得下”进一步回答：哪些状态在何时位于哪里、每次为此移动多少数据、峰值为何出现、checkpoint如何跨布局恢复，以及什么时候FSDP已不是下一步正确工具。
    source_heading: 22. 复习与自测
  logic:
  - 0. 本章要回答的核心问题
  - 4. FSDP2：per-parameter sharding API
  - 7. Prefetching：隐藏参数物化通信
  - 11. Debugging FSDP issues
