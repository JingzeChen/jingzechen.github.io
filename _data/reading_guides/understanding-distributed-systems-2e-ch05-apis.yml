  minutes: 8
  question: 原文围绕「0. 本章定位：让远端服务的能力可被调用」建立了怎样的核心认识？
  question_source: 0. 本章定位：让远端服务的能力可被调用
  thesis: safe、idempotent、cacheable 是不同性质。 GET safe/idempotent，PUT/DELETE idempotent
    但不 safe，POST 默认非幂等。
  thesis_source: 12. 核心结论
  concepts:
  - term: 0. 本章定位：让远端服务的能力可被调用
    meaning: API（Application Programming Interface）为这些问题建立契约。它描述远端服务暴露什么能力，以及调用者和实现者必须共同遵守的消息语义。
    source_heading: 0. 本章定位：让远端服务的能力可被调用
