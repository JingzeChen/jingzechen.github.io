  question: 原文如何解释「10.1 API 与协议」？
  answer: 两个服务都使用 HTTP，不代表 API 兼容。
  source_heading: 10.1 API 与协议
- level: 概念辨析
  question: 原文如何解释「10.3 同步语法与同步执行」？
  answer: 语法看起来同步，不等于运行时阻塞；反过来，异步 API 也不等于业务结果已经完成。
  source_heading: 10.3 同步语法与同步执行
- level: 概念辨析
  question: 原文如何解释「10.4 Safe、idempotent 与 cacheable」？
  answer: GET 通常三者兼具；PUT 幂等但不 safe；POST 默认非幂等，但某些响应可以显式缓存，某个 POST API也可用幂等键增强。
  source_heading: 10.4 Safe、idempotent 与 cacheable
- level: 概念辨析
  question: 原文如何解释「10.6 版本化与兼容演化」？
  answer: 版本化容纳不可避免的 breaking change；兼容演化减少创建新版本的频率。二者不是互斥方案，优先兼容、必要时版本化。
  source_heading: 10.6 版本化与兼容演化
- level: 概念辨析
  question: 原文如何解释「10.7 幂等方法与幂等 API」？
  answer: HTTP 方法规范声明预期语义，具体服务实现必须兑现。错误实现的 PUT 仍可能每次累加库存；POST 也可以借助 key、事务和结果缓存成为业务幂等
    API。
  source_heading: 10.7 幂等方法与幂等 API
