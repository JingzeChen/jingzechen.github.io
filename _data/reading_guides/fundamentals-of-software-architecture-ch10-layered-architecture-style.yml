  - term: 10. Examples and Use Cases：示例与应用
    meaning: 原章列出的 Physical/Data Link/Network/Transport/Application 是常见五层 Internet/TCP-IP
      教学模型，把 Session 与 Presentation 吸收到 Application。两者都表达职责分离，但术语不应混为完全相同标准。
    source_heading: 10. Examples and Use Cases：示例与应用
  - term: 15. 主动回忆与应用题
    meaning: 分别说明 stream-aligned、enabling、complicated-subsystem 和 platform team 在
