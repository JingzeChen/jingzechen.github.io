  sections:
  - title: 0. 本章要回答的核心问题
    source_heading: 0. 本章要回答的核心问题
    paragraphs:
    - Architecture by Implication 与 Accidental Architecture 怎样让团队在没有明确选择时“自然长成”分层架构？
    - Layered architecture 为什么属于 technical partitioning，为什么 DDD domain changes 会横跨所有层？
    - 新增 open Services layer 怎样同时保护 shared components 并允许 Business 访问 Persistence？
    - 一句话概括：分层架构用 closed technical layers 换取简单性、熟悉度与变化隔离；当业务变化频繁、部署单元膨胀或多数请求只是穿层透传时，这些层会从保护边界变成阻力。
  - title: 2. Topology：拓扑
    source_heading: 2. Topology：拓扑
    paragraphs:
    - 适用于独立 Web/client tier，但 Presentation 与 Business 间出现 remote communication、network
      latency 和 failure semantics。
    - 那么在本章的评分口径下，物理拆层本身不会产生新的 architecture quantum，Number of quanta 仍为 1。物理网络 hop
      还可能增加分布式成本，却没有获得领域自治。
    - Presentation 只需知道业务 contract，不需要知道数据来自 SQL、文件或远程存储；Business 只需获取业务数据，不关心屏幕像素和浏览器格式。
    - 业务 domain 被涂抹在各层，使 bounded context 和独立 domain evolution 难以表达。因此经典 DDD decomposition
      与纯 layered top-level style 不太匹配。
  - title: 5.1 Technical partitioning 的云部署便利
    source_heading: 5.1 Technical partitioning 的云部署便利
    paragraphs:
    - Presentation in CDN/Web hosting；
    - Business/Persistence in compute platform；
    - Database in managed database。
  - title: 5.3 云不会自动提高 Elasticity
    source_heading: 5.3 云不会自动提高 Elasticity
    paragraphs:
    - shared database 仍是瓶颈；
    - state/session 可能阻止横向复制；
    - startup 时间影响伸缩速度；
    - 云提供资源，不能改变 architecture quantum=1 的结构事实。
  - title: 6.1 Fault tolerance 低
    source_heading: 6.1 Fault tolerance 低
    paragraphs:
    - 一个小组件 memory leak；
    - 某请求触发 out-of-memory；
  - title: 6.4 风险缓解
    source_heading: 6.4 风险缓解
    paragraphs:
    - health checks 与自动重启；
    - graceful shutdown；
    - memory/resource limits；
    - startup optimization；
  - title: 8. Team Topology Considerations：团队拓扑考虑
    source_heading: 8. Team Topology Considerations：团队拓扑考虑
    paragraphs:
    - 原章认为 layered style 相对不依赖特定 team topology，可与四种团队形态配合。但适配程度受系统规模和 ownership 方式影响。
    - 若大型组织把每层交给不同技术团队，就不再是端到端 stream aligned，会遭遇 Conway’s Law 的跨层协调。
    - 原章举例：Persistence layer 可以成为复杂子系统团队访问 operational data 做 analytics 的 hook，而不影响
      stream team 拥有的其他层。
    - 更安全做法可能是 read replica、data contract 或专用 export，而不是无限开放 Persistence。
  - title: 10. Examples and Use Cases：示例与应用
    source_heading: 10. Examples and Use Cases：示例与应用
    paragraphs:
    - 提供 hardware abstraction、memory management、process scheduling。
    - 提供端到端传输：TCP 提供可靠、有序的字节流，UDP 提供无连接数据报服务，并不保证交付、顺序或去重。
    - 原章列出的 Physical/Data Link/Network/Transport/Application 是常见五层 Internet/TCP-IP
      教学模型，把 Session 与 Presentation 吸收到 Application。两者都表达职责分离，但术语不应混为完全相同标准。
    - Layered architecture 的 simplicity 和 low cost 可能是合理 least-worst 选择，即使未来为获得不同能力需要重写部分系统。
  - title: 13. 本章知识结构
    source_heading: 13. 本章知识结构
    paragraphs:
    - 结构层：按 Presentation/Business/Persistence/Database 技术职责组织；
    - 隔离层：Closed 保护变化，Open 减少透传，两者形成核心权衡；
    - 运行层：单体数据库与 quantum=1 带来低成本，也限制扩展、弹性和容错；
    - 生命周期层：成熟治理能维持边界，但规模增长最终会削弱维护、测试、部署和演进能力。
  - title: 15. 主动回忆与应用题
    source_heading: 15. 主动回忆与应用题
    paragraphs:
    - 将 Presentation 放云上、Business/Database 留在 on-prem，画出每次请求的网络 hop 与失败模式。
    - 怎样用 fitness function 区分 closed Business 与 open Services，而不是简单禁止所有跨层？
    - 分别说明 stream-aligned、enabling、complicated-subsystem 和 platform team 在 layered
      system 中的边界。
    - 设计一个 caching/multithreading 使 responsiveness 提高、但 maintainability 下降的例子。
  takeaways:
  - 结构层：按 Presentation/Business/Persistence/Database 技术职责组织；
  - 每层只处理技术角色可提高局部专业效率，却让一个 business domain 横跨所有层，降低 holistic agility。
  - Architecture Sinkhole 是多层只透传、不执行职责的请求路径，会浪费对象、内存和处理时间。
  - 四类 Team Topologies 都可与 layered style 配合，但大型 monolith 会增加跨层协调与平台负担。
  - Feasibility 可以让团队有意识地选择未来可能替换的 layered architecture，但必须保留退出计划。
