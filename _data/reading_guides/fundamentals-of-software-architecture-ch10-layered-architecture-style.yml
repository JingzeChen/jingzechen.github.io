  minutes: 8
  question: 原文围绕「0. 本章要回答的核心问题」建立了怎样的核心认识？
  question_source: 0. 本章要回答的核心问题
  thesis: 随着代码库增长，engineering characteristics 会快速退化，因此适用规模是关键约束。
  thesis_source: 14. 核心结论
  concepts:
  - term: 0. 本章要回答的核心问题
    meaning: 一句话概括：分层架构用 closed technical layers 换取简单性、熟悉度与变化隔离；当业务变化频繁、部署单元膨胀或多数请求只是穿层透传时，这些层会从保护边界变成阻力。
    source_heading: 0. 本章要回答的核心问题
  - term: 5.1 Technical partitioning 的云部署便利
    meaning: Database in managed database。
    source_heading: 5.1 Technical partitioning 的云部署便利
  - term: 6.1 Fault tolerance 低
    meaning: 某请求触发 out-of-memory；
    source_heading: 6.1 Fault tolerance 低
