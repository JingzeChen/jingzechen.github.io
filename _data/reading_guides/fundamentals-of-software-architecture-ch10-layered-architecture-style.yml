checks:
- level: 概念辨析
  question: 原文如何解释「11.1 “Layer 与 Tier 完全相同”」？
  answer: 正确理解：四个 logical layers 可以映射为一个、两个或多个 deployments。
  source_heading: 11.1 “Layer 与 Tier 完全相同”
- level: 概念辨析
  question: 原文如何解释「11.10 “Contract 不变就绝对没有跨层影响”」？
  answer: 正确理解：隔离是有前提的倾向，需要 contract tests 和治理。
  source_heading: 11.10 “Contract 不变就绝对没有跨层影响”
- level: 概念辨析
  question: 原文如何解释「11.13 “20% 和 80% 是精确边界”」？
  answer: 正确理解：结合 request types、traffic、cost 和 change coupling。
  source_heading: 11.13 “20% 和 80% 是精确边界”
- level: 概念辨析
  question: 原文如何解释「11.21 “小应用评分好，增长后也不变”」？
  answer: 正确理解：持续监控 build/test/deploy/MTTR 和资源约束。
  source_heading: 11.21 “小应用评分好，增长后也不变”
- level: 概念辨析
  question: 原文如何解释「11.24 “计划未来重写即可忽略当前边界”」？
  answer: 正确理解：限制共享、浅继承、记录触发器和 data exit path。
  source_heading: 11.24 “计划未来重写即可忽略当前边界”
