overview:
  kind: summary
  minutes: 12
  question: 原文围绕「全章主线」建立了怎样的核心认识？
  question_source: 全章主线
  thesis: 目标与定义。 如果已知每个 ready 任务还需要多少服务时间，选择剩余时间最短的任务可以最小化平均响应时间。允许新短任务到达后抢占当前任务时，更准确的名称是最短剩余时间优先（Shortest
    Remaining Time First, SRTF）。本书把这种抢占版本也统称 SJF。
  thesis_source: 7.1 单处理器调度（Uniprocessor Scheduling）
  concepts:
  - term: 全章主线
    meaning: 全章路线是：先用单处理器策略揭示基本权衡，再讨论多核上的缓存亲和与并行应用，随后加入能耗和截止期，最后用排队论判断容量、用过载管理避免系统失控，并在数据中心案例中组合这些工具。
    source_heading: 全章主线
  - term: 7.3 能耗感知调度（Energy-Aware Scheduling）
    meaning: I/O 设备电源。 屏幕、Wi-Fi、蜂窝网络和磁盘都可能比 CPU 更耗电。把分散的小请求批量化，可延长设备连续休眠时间；但批处理会增加等待。传感器网络还要求发送方与接收方同步唤醒窗口，否则双方永远错过。
    source_heading: 7.3 能耗感知调度（Energy-Aware Scheduling）
  - term: 7.5 排队论（Queueing Theory）
    meaning: 当负载很低时，链表换哈希表或 FIFO 换 SJF 可能明显改善延迟；接近容量时，到达率的小幅上升就可能让等待非线性暴涨，算法微调会被容量效应淹没。排队论的价值不是精确预测每个请求，而是用数量级判断时间花在服务还是等待、该优化代码还是扩容。
    source_heading: 7.5 排队论（Queueing Theory）
  - term: 7.7 案例：数据中心中的服务器调度
    meaning: 同一客户后续请求尽量回到原后端，可复用会话、用户数据和缓存，这相当于 CPU 亲和。若原后端过载或故障，必须允许迁移；会话状态放在共享存储或可重建缓存中，能减少亲和对可用性的束缚。
    source_heading: 7.7 案例：数据中心中的服务器调度
  - term: 用 C++ 验证关键算法
    meaning: 程序使用章末练习 4 的五个纯 CPU 任务。时间单位为毫秒，SRTF 以 1 ms 为离散抢占点；RR 约定在时间片结束时到达的任务先入队，再把未完成的当前任务放回队尾。
    source_heading: 用 C++ 验证关键算法
  - term: 复习检查清单
    meaning: 能比较 oblivious、gang、space sharing 与 scheduler activation。
    source_heading: 复习检查清单
