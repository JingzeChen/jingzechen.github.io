  sections:
  - title: 本章要解决什么问题
    source_heading: 本章要解决什么问题
    paragraphs:
    - 穷举法告诉我们：当候选规模不大时，可以系统枚举所有可能并检查答案。但真正困难的地方并不是“会不会枚举”，而是下面四个问题。
    - 如何尽早停止无效搜索？ 一旦部分解已经违反约束，继续向下扩展没有意义。
    - 如何恢复现场？ 某个选择探索完毕后，必须撤销它，才能尝试同层的其他选择。
    - 回溯法把这些问题统一成对一棵隐式解空间树的深度优先搜索。它不是某一道题的固定代码，而是一套建模方法：先定义结点表示什么，再定义从结点出发有哪些选择，最后设计何时接受答案、何时剪枝以及如何撤销选择。
  - title: 19.1 回溯法概述
    source_heading: 19.1 回溯法概述
    paragraphs:
    - "“乐观”意味着界必须朝对最优解有利的方向估计：最小化问题的下界不能高估该子树可能达到的最小值，最大化问题的上界不能低估该子树可能达到的最大值。否则可能误删真正的最优分支。"
    - 完备性（completeness）：任取一个合法解 z。由条件 2，它对应一条路径；由条件 3，每条路径边都会被枚举；由条件 4，包含 z 的前缀不会被误剪；由条件
      5，同层其他分支不会污染该路径。因此程序最终会到达并记录 z。
    - 若状态存在大量重叠子问题，动态规划或记忆化搜索往往更合适；若只求无权图最短路，应优先考虑 BFS；若是大规模排列优化，可能需要分支限界、启发式搜索、整数规划或专门算法。
    - 补充：模板只是起点。 本章后续的回文切分、IP 地址、表达式、数独、24 点和任务分配看起来并不都是普通“子集”，但它们都在逐步构造可变长度决策序列，因此原书将其放入子集树框架；真正应关注的是“当前层从候选集合中选择一个扩展”，而不是拘泥于数学集合的字面含义。
  - title: 19.2 子集树的回溯算法设计
    source_heading: 19.2 子集树的回溯算法设计
    paragraphs:
    - 排序不改变可选元素多重集合。任一合法组合可写为非递减值序列，并对应一组递增下标；搜索会枚举这组下标。若同层有相同值，只保留最左边的代表不会失去任何值组合，因为后一个相同值能选择的后缀是前一个后缀的子集；前一个分支已经覆盖其全部结果。
    - 补充：BFS 替代方案。 也可把字符串视为状态，每次删除一个括号作为一条边，按层 BFS；第一次发现合法字符串的层就是最少删除数，并收集该层所有合法状态。BFS
      证明最短删除数更直观，但通常需要保存大量字符串和全局去重集合。
    - 设票数为 E，回溯在最坏情况下可能尝试大量边排列，达到阶乘级搜索。原书明确记录其 Python 版本在 81 个测试用例中通过 80 个后超时，这正说明“正确的回溯”不一定是利用题目结构后的最优算法。
    - 补充：基于表达式树的完备性证明。 任意合法表达式都可表示为一棵满二叉树，叶子是四张牌，内部结点是运算符。树中总存在一个内部结点，其两个孩子都是叶子；先合并这两个操作数，相当于把该子树归约为一个新叶子。重复这一过程，最终归约到根。回溯枚举任意数对和任意运算，因此能按某种次序复现这棵表达式树。
  - title: 19.3 排列树的回溯算法设计
    source_heading: 19.3 排列树的回溯算法设计
    paragraphs:
    - 路径长度 i 就是当前要填写的位置；每层扫描全部元素，只选择尚未使用者。
    - 含义是：两个相同值在同一层竞争当前位置时，只允许先使用左边那个；若左边相同值已经在当前路径中，则右边值位于更深层，允许继续选择。
    - 排列树枚举所有满足行列约束的放置，斜线检查只删除已经冲突的前缀。任何合法皇后方案的列向量都是一个排列且每个前缀无冲突，因此不会被误剪；叶子必然满足全部三类约束。
    - 位运算把三个集合检查压缩为常数次整数运算，适合只统计方案数或追求高性能；构造棋盘时仍需记录每行所选列。
  - title: 代码与推导的对应关系
    source_heading: 代码与推导的对应关系
    paragraphs:
    - 递归到 i：该候选值允许重复使用；
    - 该分支无法改善答案。前者来自完整可行解，后者来自部分状态，二者方向不能颠倒。
  - title: 三种语言中的实现差异
    source_heading: 三种语言中的实现差异
    paragraphs:
    - 添加运算符可能产生超过 32 位范围的中间值，Python 整数自动扩展，C++ 和 Go 使用 64 位整数。
    - Python 默认递归深度约为千级，大规模通用回溯可能触发限制；C++ 也受线程栈限制；Go 栈可增长，但状态树过深仍会增加开销。本章题目深度都由小约束限制。
    - 各实现都用局部闭包捕获路径、答案和约束状态。若迁移到并发环境，这些共享变量不能在多个搜索任务间无保护地复用；更稳妥的方式是每次调用创建独立求解器对象或局部闭包。
    - 本地 Python 3.12 已实际执行全部 23 组示例。当前环境没有 C++ 与 Go 工具链，C++17 和 Go 1.22 程序完成了函数、调用、括号、导入/头文件及输出覆盖的静态检查，但未在本机编译运行。
  - title: 6. 有些题在内部结点记录答案，有些只在叶子记录
    source_heading: 6. 有些题在内部结点记录答案，有些只在叶子记录
    paragraphs:
    - 子集：任何当前路径都是答案，进入结点立即记录。
    - 固定大小组合：只有路径长度达到 k 才记录。
    - 回文切分：只有字符串全部覆盖才记录。
    - 数独与单词搜索：只需一个解，成功后应提前返回。
  - title: 10. visited 的生命周期由问题语义决定
    source_heading: 10. visited 的生命周期由问题语义决定
    paragraphs:
    - 单词搜索：格子只在当前路径中不能重复，返回时取消标记。
    - 排列：下标只在当前排列中不能重复，返回时取消标记。
    - DAG 路径：输入无环，可以不用标记。
    - 一般图路径：需要当前路径标记，不能永久全局标记所有到达过的顶点。
  - title: 本章总结
    source_heading: 本章总结
    paragraphs:
    - 定义状态。 状态必须包含未来决策所需的全部信息，如起始下标、路径、剩余值、访问标记或工人负载。
    - 证明剪枝。 约束剪枝删除不可行解，限界剪枝删除不可能更优的分支，同层剪枝删除等价子树。
    - 识别专用替代方案。 有重叠子问题时考虑动态规划，有欧拉结构时用 Hierholzer，只求第 k 个排列时用阶乘数制。
    - 最终检查顺序应固定为：状态含义是否清楚，候选是否穷尽，答案何时记录，剪枝是否有必要条件证明，去重是在同层还是同枝，递归返回后是否完全恢复。 只要这六项能够逐一回答，绝大多数小规模组合搜索题都能从“碰运气写递归”变成可论证、可调试的算法设计。
  takeaways:
  - 定义状态。 状态必须包含未来决策所需的全部信息，如起始下标、路径、剩余值、访问标记或工人负载。
  - 定义接受条件。 区分内部结点答案、固定深度叶子、完全覆盖和找到任一解。
  - 证明剪枝。 约束剪枝删除不可行解，限界剪枝删除不可能更优的分支，同层剪枝删除等价子树。
  - 识别专用替代方案。 有重叠子问题时考虑动态规划，有欧拉结构时用 Hierholzer，只求第 k 个排列时用阶乘数制。
  - 最终检查顺序应固定为：状态含义是否清楚，候选是否穷尽，答案何时记录，剪枝是否有必要条件证明，去重是在同层还是同枝，递归返回后是否完全恢复。 只要这六项能够逐一回答，绝大多数小规模组合搜索题都能从“碰运气写递归”变成可论证、可调试的算法设计。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「1. 递归不等于回溯」？
  answer: 递归只表示函数调用自身；回溯还要求在多个候选分支间共享状态，并在一个分支结束后恢复现场。二分查找可以递归，但通常不是回溯；全排列的“选择—递归—撤销”才是典型回溯。
  source_heading: 1. 递归不等于回溯
- level: 概念辨析
  question: 原文如何解释「4. 不是所有去重题都能排序」？
  answer: 组合、子集和排列只关心值集合或值顺序，可以排序后去重；递增子序列要求保持原数组下标顺序，排序会改变问题。它必须保留输入顺序，并用每层集合去重。
  source_heading: 4. 不是所有去重题都能排序
- level: 概念辨析
  question: 原文如何解释「6. 有些题在内部结点记录答案，有些只在叶子记录」？
  answer: 子集：任何当前路径都是答案，进入结点立即记录。
  source_heading: 6. 有些题在内部结点记录答案，有些只在叶子记录
- level: 概念辨析
  question: 原文如何解释「13. 行程问题访问的是边，不是机场」？
  answer: 回溯能求解，但题目具有欧拉通路结构时，Hierholzer 才是更好的专用算法。
  source_heading: 13. 行程问题访问的是边，不是机场
- level: 概念辨析
  question: 原文如何解释「15. 空工人剪枝依赖对称性」？
  answer: 当多个工人当前负载同为 0，把同一项工作交给其中任何一人只会交换工人编号，所以只试一个。相同逻辑也适用于任意相同负载；这与是否在最终方案中允许空工人是两个不同问题。
  source_heading: 15. 空工人剪枝依赖对称性
