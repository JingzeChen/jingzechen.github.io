overview:
  kind: summary
  minutes: 8
  question: 本章要解决什么问题？
  question_source: 本章要解决什么问题
  thesis: 最终检查顺序应固定为：状态含义是否清楚，候选是否穷尽，答案何时记录，剪枝是否有必要条件证明，去重是在同层还是同枝，递归返回后是否完全恢复。 只要这六项能够逐一回答，绝大多数小规模组合搜索题都能从“碰运气写递归”变成可论证、可调试的算法设计。
  thesis_source: 本章总结
  concepts:
  - term: 本章要解决什么问题
    meaning: 回溯法把这些问题统一成对一棵隐式解空间树的深度优先搜索。它不是某一道题的固定代码，而是一套建模方法：先定义结点表示什么，再定义从结点出发有哪些选择，最后设计何时接受答案、何时剪枝以及如何撤销选择。
    source_heading: 本章要解决什么问题
  - term: 19.2 子集树的回溯算法设计
    meaning: 补充：基于表达式树的完备性证明。 任意合法表达式都可表示为一棵满二叉树，叶子是四张牌，内部结点是运算符。树中总存在一个内部结点，其两个孩子都是叶子；先合并这两个操作数，相当于把该子树归约为一个新叶子。重复这一过程，最终归约到根。回溯枚举任意数对和任意运算，因此能按某种次序复现这棵表达式树。
    source_heading: 19.2 子集树的回溯算法设计
  - term: 19.3 排列树的回溯算法设计
    meaning: 排列树枚举所有满足行列约束的放置，斜线检查只删除已经冲突的前缀。任何合法皇后方案的列向量都是一个排列且每个前缀无冲突，因此不会被误剪；叶子必然满足全部三类约束。
    source_heading: 19.3 排列树的回溯算法设计
  - term: 三种语言中的实现差异
    meaning: 本地 Python 3.12 已实际执行全部 23 组示例。当前环境没有 C++ 与 Go 工具链，C++17 和 Go 1.22 程序完成了函数、调用、括号、导入/头文件及输出覆盖的静态检查，但未在本机编译运行。
    source_heading: 三种语言中的实现差异
  - term: 6. 有些题在内部结点记录答案，有些只在叶子记录
    meaning: 子集：任何当前路径都是答案，进入结点立即记录。
    source_heading: 6. 有些题在内部结点记录答案，有些只在叶子记录
  - term: 本章总结
    meaning: 最终检查顺序应固定为：状态含义是否清楚，候选是否穷尽，答案何时记录，剪枝是否有必要条件证明，去重是在同层还是同枝，递归返回后是否完全恢复。
      只要这六项能够逐一回答，绝大多数小规模组合搜索题都能从“碰运气写递归”变成可论证、可调试的算法设计。
    source_heading: 本章总结
