overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章定位：先设计分析，再收集资料」建立了怎样的核心认识？
  question_source: 本章定位：先设计分析，再收集资料
  thesis: 本章最核心的实践原则是：不要先问“我能找到哪些资料”，而要先画出产生 R1 的系统，列出可证伪的原因假设，明确每项证据要排除什么；确认原因后，再用方案逻辑树展开可控行动，最后把已验证结论而非整个搜索过程组织成金字塔。
  thesis_source: 本章小结
  concepts:
  - term: 本章定位：先设计分析，再收集资料
    meaning: 是非问题是可由证据回答“是/否”的争议命题，不是所有问题的统称。
    source_heading: 本章定位：先设计分析，再收集资料
  - term: 使用诊断框架
    meaning: 第8章序幕描述现有结构或流程；把它画出来，就是诊断框架的起点。若 R1 是基层效率低，就应先描绘基层作业和信息流，而非从公司文化等宽泛主题开始。
    source_heading: 使用诊断框架
  - term: 十、方法的局限
    meaning: MECE 难以表达多因共现和反馈；
    source_heading: 十、方法的局限
  - term: 综合示例：在线服务故障率上升
    meaning: 错误率上升由新版本连接泄漏在高并发下耗尽连接池造成，应立即回滚并限流，随后修复泄漏并建立容量发布门禁。
    source_heading: 综合示例：在线服务故障率上升
  - term: 使用是非问题
    meaning: 是否把 concern、开放问题误叫 issue？
    source_heading: 使用是非问题
  - term: 本章小结
    meaning: 本章最核心的实践原则是：不要先问“我能找到哪些资料”，而要先画出产生 R1 的系统，列出可证伪的原因假设，明确每项证据要排除什么；确认原因后，再用方案逻辑树展开可控行动，最后把已验证结论而非整个搜索过程组织成金字塔。
    source_heading: 本章小结
  logic:
  - 本章定位：先设计分析，再收集资料
  - 使用诊断框架
  - 是非问题分析
  - 综合示例：在线服务故障率上升
  - 分析前
  - 工具选择
  - 本章小结
  sections:
  - title: 本章定位：先设计分析，再收集资料
    source_heading: 本章定位：先设计分析，再收集资料
    paragraphs:
    - 诊断框架用于寻找和验证“为什么产生 R1”；
    - 方案逻辑树用于回答“能做什么、应该做什么”；
    - 决策树/PERT用于展示行动选择、概率后果或项目依赖；
    - 是非问题是可由证据回答“是/否”的争议命题，不是所有问题的统称。
  - title: 从信息资料入手
    source_heading: 从信息资料入手
    paragraphs:
    - 按运营、营销、增长预测等话题分类，只说明资料属于哪个主题，不说明共同结论。按收集时间写“发现—结论—建议”，又迫使读者重走研究过程。
    - 图 9-1 先把头痛原因分为身体和精神；身体再分外部、内部；外部包括撞伤、过敏、恶劣天气，内部包括流感、脑瘤、脑积水；精神包括压力紧张、多疑等。
    - 利润进一步分成收入与成本；资产分成流动和固定资产。收入受价格、产品、服务、市场条件影响；成本受人工、物料、服务和固定成本影响。
    - 烟草企业可把收入、烟叶、包装、税金、直接人工、广告和销售费用转成任务，通过趋势、敏感性、行业与竞争比较决定优先级。
  - title: 使用诊断框架
    source_heading: 使用诊断框架
    paragraphs:
    - 第8章序幕描述现有结构或流程；把它画出来，就是诊断框架的起点。若 R1 是基层效率低，就应先描绘基层作业和信息流，而非从公司文化等宽泛主题开始。
    - 巴罗斯新设信息系统部，业务增长超预期。虽使用新的生产计划控制系统，仍有许多订单无法满足，面临错失增长机会。
    - 当前问题表现为工厂基层效率和生产率，候选原因很可能存在于订单、生产、物料、库存、调度和控制流程。框架应靠近问题发生机制。
    - 诊断树能系统定位原因，逻辑树能穷举常规方案，但真正新颖方案往往来自跨领域经验、机制理解和类比。结构化方法减少遗漏，不保证创新。
  - title: 是非问题分析
    source_heading: 是非问题分析
    paragraphs:
    - 决策、方案、目标、权重、环境变量和跨政策影响形成高维矩阵，维护成本高，普通团队难以一致执行，因此后来逐渐弃用。
    - 随着顾问流动，不同公司把诊断树、方案树、假设树都称为 issue analysis，名称相同而方法不同，造成混乱。
    - 客户背景是英国零售银行与欧洲零售银行系统；R1 是担心错失其他欧洲国家业务机会，R2 是在欧洲盈利；客户问“欧洲战略是什么”。
    - 诊断树解释原因；方案树生成行动；决策树比较后果。统称 issue analysis 会让团队在错误阶段用错误工具。
  - title: 十、方法的局限
    source_heading: 十、方法的局限
    paragraphs:
    - MECE 难以表达多因共现和反馈；
    - 是/否会压缩连续变量和不确定性；
  - title: 综合示例：在线服务故障率上升
    source_heading: 综合示例：在线服务故障率上升
    paragraphs:
    - 团队先收集所有日志、监控、工单和代码提交，数周后仍不知道哪些与故障率有关。
    - R2：两周内恢复到 0.3% 以下，且不降低吞吐和数据一致性。
    - 比较恢复速度、风险、成本、数据一致性和可逆性。立即缓解、根因修复和防复发是不同时间层，不应互相替代。
    - 错误率上升由新版本连接泄漏在高并发下耗尽连接池造成，应立即回滚并限流，随后修复泄漏并建立容量发布门禁。
  - title: 分析前
    source_heading: 分析前
    paragraphs:
    - R1、R2 和系统边界是否清楚？
    - 当前任务是诊断、生成方案还是选择方案？
  - title: 使用是非问题
    source_heading: 使用是非问题
    paragraphs:
    - "“是”和“否”的判定标准是什么？"
    - Issue 来自真实系统结构吗？
    - 假设是否是 issue 的候选答案？
    - 是否把 concern、开放问题误叫 issue？
  - title: 工具选择
    source_heading: 工具选择
    paragraphs:
    - 是否把方案树统称为 issue tree？
    - 复杂反馈是否需要因果图或系统模型？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 库存案例先明确合理库存 R2，再检查订货太多和存储太久；“必要库存是多少”不是严格是非问题。
    - 英国银行案例说明 issue 应来自产生 R1 的业务结构，不应从开放的客户问句凭空跳出。
    - 结构化工具同时提高解决问题效率并减少写作成本，但形式完整不能替代事实、领域知识和创造性洞察。
    - 本章最核心的实践原则是：不要先问“我能找到哪些资料”，而要先画出产生 R1 的系统，列出可证伪的原因假设，明确每项证据要排除什么；确认原因后，再用方案逻辑树展开可控行动，最后把已验证结论而非整个搜索过程组织成金字塔。
  takeaways:
  - 是非问题是可由证据回答“是/否”的争议命题，不是所有问题的统称。
  - 诊断树能系统定位原因，逻辑树能穷举常规方案，但真正新颖方案往往来自跨领域经验、机制理解和类比。结构化方法减少遗漏，不保证创新。
  - 错误率上升由新版本连接泄漏在高并发下耗尽连接池造成，应立即回滚并限流，随后修复泄漏并建立容量发布门禁。
  - 是否把 concern、开放问题误叫 issue？
  - 本章最核心的实践原则是：不要先问“我能找到哪些资料”，而要先画出产生 R1 的系统，列出可证伪的原因假设，明确每项证据要排除什么；确认原因后，再用方案逻辑树展开可控行动，最后把已验证结论而非整个搜索过程组织成金字塔。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「发现与结论」？
  answer: 发现是观察到的模式，结论说明模式对问题意味着什么。二者常处于相对抽象层级。
  source_heading: 发现与结论
- level: 概念辨析
  question: 原文如何解释「Issue 与 Concern」？
  answer: Issue 可回答是/否；Concern 是担忧或关注点，不一定可直接裁决。
  source_heading: Issue 与 Concern
- level: 概念辨析
  question: 原文如何解释「原因树与公式树」？
  answer: 公式树由恒等关系分解指标；原因树包含经验机制。公式正确不代表原因解释充分。
  source_heading: 原因树与公式树
