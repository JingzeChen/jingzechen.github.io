overview:
  kind: summary
  minutes: 9
  question: 原文围绕「0. 导读：无状态计算层扩展后，瓶颈会沿依赖链下移」建立了怎样的核心认识？
  question_source: 0. 导读：无状态计算层扩展后，瓶颈会沿依赖链下移
  thesis: Fully sync-all 等待最慢 follower，任一 unavailable 都可阻塞 writes，因此不随 follower 数扩展。
  thesis_source: 29. 核心结论
  concepts:
  - term: 0. 导读：无状态计算层扩展后，瓶颈会沿依赖链下移
    meaning: Availability、consistency、latency、operational complexity 如何取舍？
    source_heading: 0. 导读：无状态计算层扩展后，瓶颈会沿依赖链下移
  - term: 4.3 Fault tolerance 的精确边界
    meaning: Disaster recovery。
    source_heading: 4.3 Fault tolerance 的精确边界
  - term: 13. 不要把 NoSQL 当关系数据库使用
    meaning: 作者警告：NoSQL 可以 model relational data，但若把它当传统 relational DB 使用，会得到 worst
      of both worlds。
    source_heading: 13. 不要把 NoSQL 当关系数据库使用
  - term: 17. DynamoDB API 的三个主要访问形态
    meaning: Distributed join 需要跨 partitions shuffle/coordination，难以提供稳定低 latency。DynamoDB
      选择受限 API，使 operations 可按 key route 和水平扩展。
    source_heading: 17. DynamoDB API 的三个主要访问形态
  - term: 23. 可运行 C11 模拟：2-of-3 提交、stale read 与 sequence catch-up
    meaning: 只有 applied sequence 等于 committed sequence 的 follower 才可 promote；
    source_heading: 23. 可运行 C11 模拟：2-of-3 提交、stale read 与 sequence catch-up
  - term: 30. 一般化的解决问题方法
    meaning: 定义谁 authoritative、如何更新、多久可 stale、如何 rebuild/reconcile。Denormalization
      没有消除一致性，只把 join-time work 前移到 write/update time。
    source_heading: 30. 一般化的解决问题方法
  logic:
