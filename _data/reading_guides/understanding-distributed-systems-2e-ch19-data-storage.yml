  - 30. 一般化的解决问题方法
  sections:
  - title: 0. 导读：无状态计算层扩展后，瓶颈会沿依赖链下移
    source_heading: 0. 导读：无状态计算层扩展后，瓶颈会沿依赖链下移
    paragraphs:
    - NewSQL 也不能消除 network partition、hot key 和 distributed transaction cost；
    - Relational database 也可通过现代 distributed architecture 横向扩展。
    - 哪些 query 依赖 join、ad hoc filter、range scan？
    - Availability、consistency、latency、operational complexity 如何取舍？
  - title: 2.3 Workload isolation
    source_heading: 2.3 Workload isolation
    paragraphs:
    - Analytics CPU/memory/I/O 与 OLTP 隔离；
    - 避免长 query 持有 leader resources；
    - Maintenance/reporting 有专门容量。
    - Analytics follower replay 可能落后；
  - title: 4.3 Fault tolerance 的精确边界
    source_heading: 4.3 Fault tolerance 的精确边界
    paragraphs:
    - Service availability；
    - Acknowledged-write durability；
    - Disaster recovery。
  - title: 8. 19.2 Partitioning：同时扩 reads、writes 与容量
    source_heading: 8. 19.2 Partitioning：同时扩 reads、writes 与容量
    paragraphs:
    - Partition key 是 transaction/query boundary。
    - Chapter 16 已详述 range/hash 和 consistent hashing。本章强调：自己给 relational DB 加 sharding，意味着应用团队要承担这些
      control-plane protocol。
    - 最有效策略常是让 invariant 与 shard boundary 对齐，减少 cross-shard transaction，而不是让所有操作默认走
      2PC。
    - 这就是作者称 application-layer partitioning “daunting”的原因：它把 database product 内部职责搬进应用架构。
  - title: 13. 不要把 NoSQL 当关系数据库使用
    source_heading: 13. 不要把 NoSQL 当关系数据库使用
    paragraphs:
    - 作者警告：NoSQL 可以 model relational data，但若把它当传统 relational DB 使用，会得到 worst of both
      worlds。
    - 同时承担 distributed fan-out 和 consistency logic。
    - 这既没有 relational DB 的 general query/transaction convenience，也没有 NoSQL 按 access
      pattern 单次读取的效率。
    - 正确方向：为 concrete access patterns materialize query-shaped data。
  - title: 17. DynamoDB API 的三个主要访问形态
    source_heading: 17. DynamoDB API 的三个主要访问形态
    paragraphs:
    - Query 同一 partition key 的多个 items，可带 sort-key condition；
    - Scan 的存在不是建模逃生口。应为重要 pattern 创建 key/index/materialized view。
    - Distributed join 需要跨 partitions shuffle/coordination，难以提供稳定低 latency。DynamoDB
      选择受限 API，使 operations 可按 key route 和水平扩展。
    - 作者明确说：不应把 join 搬到 application；应重新 model data，使 query 不需要 join。
  - title: 19. 示例二：客户与订单共置，消除 join
    source_heading: 19. 示例二：客户与订单共置，消除 join
    paragraphs:
    - NoSQL 不应在 application 先 Query orders 再 Get customer 并手工 join。作者将 customer item
      和 order items 放在同一 table、同一 PK。
    - 没有跨 partition data movement，latency 与单 partition read 相关。
    - 若 full name 只存在 customer item，order list query 一次返回两类 items，application 合并显示，未重复
      name。若为每个 order 复制 full name，则改名需要更新所有 order copies。
    - "“Same PK 一次 query”不意味着一次 response 可无限大。"
  - title: 23. 可运行 C11 模拟：2-of-3 提交、stale read 与 sequence catch-up
    source_heading: 23. 可运行 C11 模拟：2-of-3 提交、stale read 与 sequence catch-up
    paragraphs:
    - 只有 applied sequence 等于 committed sequence 的 follower 才可 promote；
    - 这段代码借用原章所述 DynamoDB 2/3 模型来展示 quorum/lag，同时也对应关系数据库 follower 的 sequence catch-up。它不是
      PostgreSQL、DynamoDB 或共识协议实现。
    - 将 “ack” 抽象成 available 且 sequence 对齐；没有 network/disk；
    - 因此代码只验证 sequence/catch-up、stale read 和 commit threshold，不是 consensus 或 database
      implementation。
  - title: 24.11 LSI 与 GSI
    source_heading: 24.11 LSI 与 GSI
    paragraphs:
    - LSI 保持 base PK，alternate SK；
    - GSI 可改变 PK/SK，是异步 materialized index，原章强调 eventual consistency。
  - title: 30. 一般化的解决问题方法
    source_heading: 30. 一般化的解决问题方法
    paragraphs:
    - 扩展 frontend 后测 database，不要假设 end-to-end capacity 已线性提高。对每层记录 CPU、I/O、queue、lock、network
      和 tail latency。
    - 若业务要求 read-your-writes，携带 commit position、读 leader 或等待 replica catch up。不要把偶然低
      lag 当 guarantee。
    - 让频繁 join、transaction 和 range query 尽量在一个 partition；同时测试 hot key、large tenant
      与 future growth。
    - 定义谁 authoritative、如何更新、多久可 stale、如何 rebuild/reconcile。Denormalization 没有消除一致性，只把
      join-time work 前移到 write/update time。
  takeaways:
  - Stateless application scale-out 会把瓶颈推到共享 relational database。
  - Hybrid replication 用少量 synchronous standbys 定义 durability contract，其余 async 扩
    reads。
  - NoSQL 是历史 umbrella term；SQL language、data model、consistency 与 partitioning 不应由标签推断。
  - Query 同一 PK 可高效返回 items；Scan 遍历大量 data，不能替代 key design。
  - NewSQL 将 horizontal scale 与 SQL/ACID 组合，在 network partition 时通常偏 consistency，但仍支付
    consensus/transaction cost。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「24.1 Replication 与 partitioning」？
  answer: 生产 distributed store 通常每个 partition 再 replicate。
  source_heading: 24.1 Replication 与 partitioning
- level: 概念辨析
  question: 原文如何解释「24.8 Denormalization 与 cache」？
  answer: Denormalized copy 是持久 query model；cache 是可丢弃、可重建副本。两者都可能 stale，但恢复与 source-of-truth
    语义不同。
  source_heading: 24.8 Denormalization 与 cache
- level: 概念辨析
  question: 原文如何解释「25.2 “Follower healthy 就可以承接所有 reads”」？
  answer: 还要检查 lag、query freshness、replay conflict 和 capacity。Health 与 freshness 是不同维度。
  source_heading: 25.2 “Follower healthy 就可以承接所有 reads”
- level: 概念辨析
  question: 原文如何解释「25.9 “没有 join API，就在 application join”」？
  answer: 这会制造多 round trips、partial failure 和 fan-out。优先 query-shaped co-location/materialization。
  source_heading: 25.9 “没有 join API，就在 application join”
- level: 概念辨析
  question: 原文如何解释「25.16 “Managed database 不需要容量和故障演练”」？
  answer: 仍需掌握 quota、failover endpoint、lag、connection storm、backup restore、region
    outage 与账单。
  source_heading: 25.16 “Managed database 不需要容量和故障演练”
