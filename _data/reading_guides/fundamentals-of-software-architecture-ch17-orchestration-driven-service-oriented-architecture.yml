  sections:
  - title: 0. 本章要解决什么问题
    source_heading: 0. 本章要解决什么问题
    paragraphs:
    - 本章不是在推荐一种新的主流架构，而是在做架构考古。作者把 architecture styles 比作艺术运动：只有放回其产生时代，设计选择才显得合理；环境改变后，同一选择可能失去相关性。
    - 问题是：软件不是几十年不变的建筑材料。业务市场、组织、技术和工程实践持续变化。为最大复用而建立的共享服务会成为最大共同依赖；为隐藏复杂性而建立的中央编排器会成为最大耦合点；为分离职责而建立的多层
      taxonomy 会把一个业务变化磨碎到许多团队和技术层。
    - Orchestration-driven SOA 的失败，不是因为 reuse、abstraction、transaction coordination
      或 integration 本身错误，而是只看见收益，没有持续计算耦合、变化、测试、部署和组织成本。
    - 原章没有提出数学公式。本文中的复用依赖图、变化半径指标、延迟分解和 Python 治理示例是教学扩展，用于解释原章权衡，不是作者给出的行业标准。对于图
      17-5 与正文的 architecture quanta 冲突，本文会明确保留两种证据，不静默选择。
  - title: 1. Topology：拓扑
    source_heading: 1. Topology：拓扑
    paragraphs:
    - 不是每个 SOA 实现都有完全相同的物理层，但都围绕同一个思想：建立严格 service taxonomy，每一层承担清晰的技术职责。
    - Enterprise service bus（ESB）：包含 orchestration engine 与 integration hub；
    - Package software、legacy system 和 custom code 都可能成为实现端点。
    - 业务流程逻辑不主要位于业务服务代码中，而位于 orchestration engine 对 enterprise services 的组合关系中。
  - title: 2. Style Specifics：风格细节
    source_heading: 2. Style Specifics：风格细节
    paragraphs:
    - 并非所有能力都值得 enterprise-level reuse。Application service 是 one-off、single-implementation
      service。
    - 管理者希望 enterprise services 成为可组合的 transactional building blocks。现实中同一 entity
      参与很多 workflows，每个 workflow 需要不同原子性和失败语义。
    - Auto insurance 需要 driver’s license，它是 person/customer 属性，不是 vehicle 属性。为了一个统一
      Customer，canonical service 必须包含驾照信息。
    - 如果现有 enterprise service 的 transactional granularity 不合适，只能修改设计或创建一个几乎相同的新 service。最初为复用建立的抽象，反而因变化出现
      duplication。
  - title: 4. Cloud Considerations：云环境考虑
    source_heading: 4. Cloud Considerations：云环境考虑
    paragraphs:
    - 经典 orchestration-driven SOA 比 cloud 早数十年，原始形态没有 cloud-native 设计考量。
    - 云服务与本地 legacy systems 需要共同参与 workflow；
    - 作为 integration architecture，它与 cloud services/facilities 可以良好配合。
    - 现代集成应限制 ESB 边界、冗余部署、明确 SLO，并避免所有 east-west traffic 都经中央 bus。
  - title: 5. Common Risks：常见风险
    source_heading: 5. Common Risks：常见风险
    paragraphs:
    - 很多项目是 multiyear endeavors，关键决策位于组织高层。企业很少称其“失败”，而是逐步把它们收缩为 integration architectures，并建立更接近
      DDD 的边界。
    - 团队无意间重建完整 orchestration-driven SOA。
    - 为 orchestration 建立 reasonable encapsulation boundaries；
    - ESB 只做跨 bounded context/legacy integration；
  - title: 6. Governance：治理
    source_heading: 6. Governance：治理
    paragraphs:
    - 在 SOA 流行时期，modern holistic testing 尚不常见。Individual parts 很少被自动测试，通常依赖正式 QA-level
      testing。
    - 现代治理的目标不是禁止 ESB，而是给它加 guardrails，防止 data 或 bounded contexts 泄漏到不该出现的位置。
    - 第一项 fitness function 必须先保证所有 communication 被一致写入 logs；第二项再读过去 24 小时日志验证方向。
    - 下面是原章伪代码的 Python 教学实现。Timestamp 过滤被简化为输入已经是过去 24 小时的日志。
  - title: 7. Team Topology Considerations：团队拓扑考虑
    source_heading: 7. Team Topology Considerations：团队拓扑考虑
    paragraphs:
    - SOA 流行时 team topologies 尚未成为架构主题，原章没有像前几章那样逐类映射四种现代 team topology。
    - 构建 business services 的人很少直接与 enterprise services 团队交流。他们被期望通过 contracts 和 interfaces
      等 technical artifacts 沟通。
    - 每次交接损失上下文、增加排队时间，并把反馈推迟到集成测试。架构的技术分层直接塑造了组织沟通结构。
    - ESB integration team 更适合作为 platform capability provider，而不是所有业务变化的中央 gatekeeper。
  - title: 9. Examples and Use Cases：案例与适用场景
    source_heading: 9. Examples and Use Cases：案例与适用场景
    paragraphs:
    - 主要出现在 20 世纪 90 年代末和 21 世纪初的大型企业。后来逐步被更 agile、domain-based 的分布式架构（如 microservices）替代。
    - Integration hub 处理 communication、protocol、contract transformation；
    - Enterprise services 作为 package software、bespoke code、legacy system 的 integration
      points。
    - Enterprise services 通过 API layer 接入大量 service components、mainframe 或 package/custom
      code；
  - title: 11. 一般化的问题解决方法
    source_heading: 11. 一般化的问题解决方法
    paragraphs:
    - 选择 reuse 时同时列 coupling；选择 orchestration 时同时列 central dependency；选择 abstraction
      时同时列 leak；选择 technical separation 时同时列 team handoffs。
    - 领域规则由 bounded context 拥有；ESB 负责跨系统转换、路由和有限组合。不要让 integration layer 成为 domain
      model。
    - Transaction、consistency 和 partial failure 只能被管理，不能靠 XML 或工具完全隐藏。Architecture
      decision 应显式记录失败语义。
    - 历史架构不是全对或全错。保留 integration hub、transformation 和 legacy adaptation；放弃全局 taxonomy、canonical
      model 与中央业务编排。
  - title: 13. 核心结论
    source_heading: 13. 核心结论
    paragraphs:
    - 该风格以严格 service taxonomy 为核心。 Business、enterprise、application、infrastructure
      services 各有不同职责。
    - ESB 同时承担 orchestration engine 与 integration hub。 它定义流程、转换、聚合和 transaction boundaries。
    - Canonical enterprise model 会吞并不同 bounded contexts 的语义差异。 DDD 避免 holistic reuse
      正是对此类经验的回应。
    - 中央 bus 是技术与组织的 giant coupling point。 Conway’s Law 使 integration team 容易成为 bureaucratic
      bottleneck。
  takeaways:
  - Orchestration-driven SOA 必须放回历史环境理解。 昂贵资源、并购和重复系统使 enterprise reuse 当时很有吸引力。
  - Reuse is implemented via coupling。 共享实现减少重复，却扩大 contract、测试、部署和组织协调范围。
  - 中央 bus 是技术与组织的 giant coupling point。 Conway’s Law 使 integration team 容易成为 bureaucratic
    bottleneck。
  - ESB 本身仍有价值。 它适合有边界的 legacy/package/cloud integration、协议和契约转换。
  - 复用、抽象和中央编排只有在边界明确且变化成本可控时才是资产；一旦它们凌驾于领域自治和交付流之上，就会从“消除重复”变成“集中耦合”。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「10.1 SOA 就是所有“服务架构”的总称」？
  answer: 错误。本章 SOA 指特定历史风格：严格 taxonomy、enterprise services、中央 ESB 和 orchestration。它与
    service-based、microservices 不同。
  source_heading: 10.1 SOA 就是所有“服务架构”的总称
- level: 概念辨析
  question: 原文如何解释「10.5 Reuse 会降低 Coupling」？
  answer: 错误。复用通过依赖同一实现发生，因此会增加 coupling。它可能减少代码重复，却扩大变化影响。
  source_heading: 10.5 Reuse 会降低 Coupling
- level: 概念辨析
  question: 原文如何解释「10.9 声明式事务一定不好」？
  answer: 错误。本地数据库的声明式事务可以很好用。问题是试图用配置完全抽象跨服务、跨遗留系统的分布式失败。
  source_heading: 10.9 声明式事务一定不好
- level: 概念辨析
  question: 原文如何解释「10.12 所有调用经过 Bus 可获得统一治理」？
  answer: 能统一观察，也形成 giant coupling point、单点和审批瓶颈。治理收益必须与自治和故障范围权衡。
  source_heading: 10.12 所有调用经过 Bus 可获得统一治理
- level: 概念辨析
  question: 原文如何解释「10.17 Accidental SOA 只会发生在老系统」？
  answer: 错误。现代 API Gateway、integration platform 或 workflow engine 也可能逐步吸收业务逻辑，形成同样中心化结构。
  source_heading: 10.17 Accidental SOA 只会发生在老系统
