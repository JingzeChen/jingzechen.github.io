    meaning: 问题是：软件不是几十年不变的建筑材料。业务市场、组织、技术和工程实践持续变化。为最大复用而建立的共享服务会成为最大共同依赖；为隐藏复杂性而建立的中央编排器会成为最大耦合点；为分离职责而建立的多层
      taxonomy 会把一个业务变化磨碎到许多团队和技术层。
    source_heading: 0. 本章要解决什么问题
  - term: 2. Style Specifics：风格细节
    meaning: 管理者希望 enterprise services 成为可组合的 transactional building blocks。现实中同一
      entity 参与很多 workflows，每个 workflow 需要不同原子性和失败语义。
    source_heading: 2. Style Specifics：风格细节
  - term: 5. Common Risks：常见风险
    meaning: 很多项目是 multiyear endeavors，关键决策位于组织高层。企业很少称其“失败”，而是逐步把它们收缩为 integration
      architectures，并建立更接近 DDD 的边界。
    source_heading: 5. Common Risks：常见风险
  - term: 6. Governance：治理
    meaning: 在 SOA 流行时期，modern holistic testing 尚不常见。Individual parts 很少被自动测试，通常依赖正式
