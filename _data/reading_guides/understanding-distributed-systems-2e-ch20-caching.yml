checks:
- level: 概念辨析
  question: 原文如何解释「17.1 Cache 与 source of truth」？
  answer: Cache 可丢弃并重建；source of truth 承担 durability 和 authoritative update。Write-back
    会模糊边界，必须升级保证。
  source_heading: 17.1 Cache 与 source of truth
- level: 概念辨析
  question: 原文如何解释「17.9 Request coalescing 与 batching」？
  answer: Batching：多个不同 keys 合并一次 bulk fetch。
  source_heading: 17.9 Request coalescing 与 batching
- level: 概念辨析
  question: 原文如何解释「18.2 “缓存数据反正可丢，错误无所谓”」？
  answer: 丢失影响性能；错误/跨 tenant value 会破坏 correctness/security。Disposable 不等于无需验证。
  source_heading: 18.2 “缓存数据反正可丢，错误无所谓”
- level: 概念辨析
  question: 原文如何解释「18.9 “Singleflight 已消除全局 herd”」？
  answer: 每个实例仍可发一次，N instances 仍有 N concurrent fills。需 shared collapse 或 origin limit。
  source_heading: 18.9 “Singleflight 已消除全局 herd”
- level: 概念辨析
  question: 原文如何解释「18.16 “Cache warmup 越快越好”」？
  answer: 无限并发 prefill 会攻击 origin。Warmup 需 priority、限速和真实 hot-set 选择。
  source_heading: 18.16 “Cache warmup 越快越好”
