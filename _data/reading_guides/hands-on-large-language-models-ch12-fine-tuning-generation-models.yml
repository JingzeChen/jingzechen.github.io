overview:
  kind: summary
  minutes: 12
  question: '原文围绕「1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining,
    Supervised Fine-Tuning, and Preference Tuning）」建立了怎样的核心认识？'
  question_source: '1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining,
    Supervised Fine-Tuning, and Preference Tuning）'
  thesis: Target modules 可选 q/k/v/o projections 和 MLP gate/up/down。Target 越广，容量和 optimizer
    state 越大。Module names 与 architecture 相关，配置错误可能一个参数也没命中；训练前打印 trainable parameters。
  thesis_source: 2. 监督微调（Supervised Fine-Tuning (SFT)）
  concepts:
  - term: '1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining,
      Supervised Fine-Tuning, and Preference Tuning）'
    meaning: 原章称“label 是用户输入”并不严谨：user input 是条件，assistant response tokens 才是监督标签。若
      trainer 默认在整段 sequence 上算 loss，必须确认是否启用 completion-only/assistant-only masking。
    source_heading: '1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining,
      Supervised Fine-Tuning, and Preference Tuning）'
  - term: 2. 监督微调（Supervised Fine-Tuning (SFT)）
    meaning: Target modules 可选 q/k/v/o projections 和 MLP gate/up/down。Target 越广，容量和
      optimizer state 越大。Module names 与 architecture 相关，配置错误可能一个参数也没命中；训练前打印 trainable
      parameters。
    source_heading: 2. 监督微调（Supervised Fine-Tuning (SFT)）
  - term: 4. 评估生成模型（Evaluating Generative Models）
    meaning: Benchmark 运行必须固定 prompt template、few-shot examples、sampling、answer parser、model
      revision 与 tokenizer。Data contamination 与 benchmark-specific tuning 会夸大泛化。
    source_heading: 4. 评估生成模型（Evaluating Generative Models）
  - term: 5. 偏好微调、对齐与 RLHF（Preference-Tuning / Alignment / RLHF）
    meaning: Preference tuning 范围更广，DPO 虽使用 preference data，却不运行 PPO rollout，也没有显式
      learned reward model，通常不应将所有 preference optimization 都含糊称为传统 RLHF。
    source_heading: 5. 偏好微调、对齐与 RLHF（Preference-Tuning / Alignment / RLHF）
  - term: 7. 使用 DPO 做偏好微调（Preference Tuning with DPO）
    meaning: ORPO 将 supervised likelihood 与 odds-ratio preference objective 放在一个阶段，尝试省去独立
      SFT+DPO；此外还有 IPO、KTO、SimPO 等。新方法不是自动更优，选择取决于数据形态、reference 需求、稳定性和目标评测。
    source_heading: 7. 使用 DPO 做偏好微调（Preference Tuning with DPO）
  - term: 9. 总结（Summary）
    meaning: 本章最重要的方法论是把后训练视为“行为分布工程”，而不是一次神秘的模型升级。SFT 定义可模仿的行为，preference data 定义相对取舍，PEFT/QLoRA
      决定资源路径，严格评测则决定这些变化是否真的让系统更可用、更安全。
    source_heading: 9. 总结（Summary）
  logic:
  - '1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining, Supervised
    Fine-Tuning, and Preference Tuning）'
  - 2. 监督微调（Supervised Fine-Tuning (SFT)）
  - 3. 使用 QLoRA 做指令微调（Instruction Tuning with QLoRA）
  - 5. 偏好微调、对齐与 RLHF（Preference-Tuning / Alignment / RLHF）
  - 6. 使用奖励模型自动化偏好评估（Automating Preference Evaluation Using Reward Models）
  - 7. 使用 DPO 做偏好微调（Preference Tuning with DPO）
  - 9. 总结（Summary）
  sections:
  - title: '1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining,
      Supervised Fine-Tuning, and Preference Tuning）'
    source_heading: '1. LLM 训练的三个步骤：预训练、监督微调与偏好微调（The Three LLM Training Steps: Pretraining,
      Supervised Fine-Tuning, and Preference Tuning）'
    paragraphs:
    - "“无标签”更准确说是 self-supervised：下一个 token 直接来自原文本，数据自动提供 target。Base model 擅长 continuation，却没有被明确训练成助手。"
    - 原章称“label 是用户输入”并不严谨：user input 是条件，assistant response tokens 才是监督标签。若 trainer
      默认在整段 sequence 上算 loss，必须确认是否启用 completion-only/assistant-only masking。
    - y_w 是 chosen/winner，y_l 是 rejected/loser。它不要求 rejected 很差，只表示 labeler 在 rubric
      下更偏好 chosen。
    - 偏好不是客观真理。标注者群体、文化、政策、任务说明和候选模型都会塑造数据分布。
  - title: 2. 监督微调（Supervised Fine-Tuning (SFT)）
    source_heading: 2. 监督微调（Supervised Fine-Tuning (SFT)）
    paragraphs:
    - 它减少 trainable gradients、optimizer state 和 adapter storage，但 base model forward/activations
      仍需计算，因此“只训练 1%参数”不等于训练成本只剩 1%。
    - Adapter 必须匹配 base architecture、checkpoint revision、tokenizer 和 target modules。它不是脱离
      base model 的独立完整模型。
    - Target modules 可选 q/k/v/o projections 和 MLP gate/up/down。Target 越广，容量和 optimizer
      state 越大。Module names 与 architecture 相关，配置错误可能一个参数也没命中；训练前打印 trainable parameters。
    - 不能笼统说“所有 neural weights 都在 -1 到 1 且正态分布”；不同层 scale 与 outliers 不同，正因如此才需要 blockwise
      quantization。
  - title: 3. 使用 QLoRA 做指令微调（Instruction Tuning with QLoRA）
    source_heading: 3. 使用 QLoRA 做指令微调（Instruction Tuning with QLoRA）
    paragraphs:
    - 原章用 chat checkpoint tokenizer 的 template 格式化 base TinyLlama 的 UltraChat data。这可行的前提是
      tokenizer vocabulary/special tokens 与 base model 兼容。
    - LoRA adapter 只兼容其训练时的精确 base。应记录 base model ID、revision、tokenizer hash、PEFT
      config 与 chat template。
    - Learning rate 与 epoch 无通用最优值。“模型越大应使用越高 learning rate”不能作普遍规则。应监控 train/validation
      loss、gradient norm、output behavior 与 capability regressions。
    - 只看 training loss 不够。至少保留 held-out validation conversations，检查 instruction following、format
      validity、事实性、安全与 base capabilities。
  - title: 4. 评估生成模型（Evaluating Generative Models）
    source_heading: 4. 评估生成模型（Evaluating Generative Models）
    paragraphs:
    - Perplexity 低表示更会预测 reference text，不保证事实、帮助性或安全。不同 tokenizer 的 token 粒度不同，PPL
      不宜直接横比。
    - ROUGE 常侧重 reference n-gram recall，适合摘要但会惩罚合理同义改写。BERTScore 用 contextual token
      embeddings 做软匹配，更关注语义，但继承 encoder 偏差且不保证事实。
    - Benchmark 运行必须固定 prompt template、few-shot examples、sampling、answer parser、model
      revision 与 tokenizer。Data contamination 与 benchmark-specific tuning 会夸大泛化。
    - Chatbot Arena 的匿名 pairwise vote 可通过 Bradley-Terry/Elo 类模型估计相对能力；它反映参与用户和 prompt
      分布，不等于某个专业场景。
  - title: 5. 偏好微调、对齐与 RLHF（Preference-Tuning / Alignment / RLHF）
    source_heading: 5. 偏好微调、对齐与 RLHF（Preference-Tuning / Alignment / RLHF）
    paragraphs:
    - SFT 告诉模型“一个可接受回答长什么样”；preference tuning 告诉模型“同一问题的两个回答中，更偏好哪一个”。
    - 只表明在 prompt x 下 y_w 优于 y_l。它不说明 chosen 完全正确，也不说明 rejected 绝对错误。
    - Pairwise preference 比 1–5 绝对评分更容易保持一致，但仍受：位置、长度、文风、labeler expertise、文化和候选质量影响。应随机左右顺序、多人标注、保留
      ties/不确定性并报告 agreement。
    - Preference tuning 范围更广，DPO 虽使用 preference data，却不运行 PPO rollout，也没有显式 learned
      reward model，通常不应将所有 preference optimization 都含糊称为传统 RLHF。
  - title: 6. 使用奖励模型自动化偏好评估（Automating Preference Evaluation Using Reward Models）
    source_heading: 6. 使用奖励模型自动化偏好评估（Automating Preference Evaluation Using Reward
      Models）
    paragraphs:
    - Reward model 可基于 SFT model 初始化，保留理解能力并将最终 head 改为 value head；也可用专门 encoder。它本身仍会
      hallucinate-like misjudge、偏见和分布外失败。
    - Reward model 评测应包含：pairwise accuracy、calibration、不同长度/主题/语言 slice、公平性和 adversarial
      robustness。只看 train accuracy 易出现 shortcut，例如无条件奖励长回答。
    - 传统 pipeline 可能同时维护 policy、reference、reward 和 value models，训练复杂、昂贵且容易 reward
      hacking。PPO 约束的是 policy update/KL，不是原章所说“不要偏离 expected rewards”。
    - 重要纠正：reference model 不是“让 LLM 自己判断回答质量”。质量方向仍来自 chosen/rejected labels；reference
      只锚定训练前 policy，衡量 trainable policy 对两个回答的相对概率变化。
  - title: 7. 使用 DPO 做偏好微调（Preference Tuning with DPO）
    source_heading: 7. 使用 DPO 做偏好微调（Preference Tuning with DPO）
    paragraphs:
    - 每条数据需要 common prompt 和两个 assistant continuations。优先用 tokenizer chat template，不手工拼接容易错的
      EOS/role tokens。
    - 监控：chosen/rejected rewards、reward margin、preference accuracy、log-prob、KL/reference
      drift 与 response length。
    - Adapter merging 具有顺序与 base fingerprint 要求。不能把 DPO adapter 直接套在原始 base 上，因为它训练时假设
      SFT behavior 已存在。
    - ORPO 将 supervised likelihood 与 odds-ratio preference objective 放在一个阶段，尝试省去独立
      SFT+DPO；此外还有 IPO、KTO、SimPO 等。新方法不是自动更优，选择取决于数据形态、reference 需求、稳定性和目标评测。
  - title: 9. 总结（Summary）
    source_heading: 9. 总结（Summary）
    paragraphs:
    - QLoRA 将 frozen base 存为 4-bit NF4，训练较高精度 LoRA，并借 double quantization/paged optimizer
      控制内存。
    - DPO 使用 policy/reference 对 chosen/rejected 的 log-prob ratio，省去显式 reward model
      与 PPO rollout。
    - 训练完成不等于对齐完成；必须做 blind A/B、能力回归、安全与 deployment consistency 评测，高风险行为还需 human-in-the-loop
      审批。
    - 本章最重要的方法论是把后训练视为“行为分布工程”，而不是一次神秘的模型升级。SFT 定义可模仿的行为，preference data 定义相对取舍，PEFT/QLoRA
      决定资源路径，严格评测则决定这些变化是否真的让系统更可用、更安全。
  takeaways:
  - 偏好不是客观真理。标注者群体、文化、政策、任务说明和候选模型都会塑造数据分布。
  - 只看 training loss 不够。至少保留 held-out validation conversations，检查 instruction following、format
    validity、事实性、安全与 base capabilities。
  - Preference tuning 范围更广，DPO 虽使用 preference data，却不运行 PPO rollout，也没有显式 learned
    reward model，通常不应将所有 preference optimization 都含糊称为传统 RLHF。
  - 重要纠正：reference model 不是“让 LLM 自己判断回答质量”。质量方向仍来自 chosen/rejected labels；reference
    只锚定训练前 policy，衡量 trainable policy 对两个回答的相对概率变化。
  - 本章最重要的方法论是把后训练视为“行为分布工程”，而不是一次神秘的模型升级。SFT 定义可模仿的行为，preference data 定义相对取舍，PEFT/QLoRA
    决定资源路径，严格评测则决定这些变化是否真的让系统更可用、更安全。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「8.1 Base model、instruction model 与 aligned model 不同」？
  answer: Pretraining 学 continuation，SFT 学示范行为，preference tuning 学相对偏好。三者不能只看参数量区分。
  source_heading: 8.1 Base model、instruction model 与 aligned model 不同
- level: 概念辨析
  question: 原文如何解释「8.10 加一个 <PAD> token 可能需要 resize embeddings」？
  answer: 若 tokenizer vocabulary 新增 token，model embedding matrix 必须同步；复用 EOS 则需正确
    mask。
  source_heading: 8.10 加一个 <PAD> token 可能需要 resize embeddings
- level: 概念辨析
  question: 原文如何解释「8.13 Leaderboard 高分不等于目标业务最佳」？
  answer: 公开 benchmark 可能污染、过拟合或 protocol 不一致。私有目标集更重要。
  source_heading: 8.13 Leaderboard 高分不等于目标业务最佳
- level: 概念辨析
  question: 原文如何解释「8.18 DPO 没有让 reference model 自己判断质量」？
  answer: Chosen/rejected data 提供偏好，reference 只作为概率锚点；DPO 省去显式 reward model。
  source_heading: 8.18 DPO 没有让 reference model 自己判断质量
- level: 概念辨析
  question: 原文如何解释「8.22 Fine-tuning 不等于写入可靠事实」？
  answer: 频繁更新知识优先 RAG/tool；fine-tuning 更适合行为、格式、风格和领域模式。
  source_heading: 8.22 Fine-tuning 不等于写入可靠事实
