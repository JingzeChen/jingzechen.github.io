overview:
  kind: summary
  minutes: 21
  question: 原文围绕「0. 本章定位：把大量 immutable data 可靠地变成 derived data」建立了怎样的核心认识？
  question_source: 0. 本章定位：把大量 immutable data 可靠地变成 derived data
  thesis: narrow dependency：one output partition只依赖少数/一个 parent partition，可local pipeline/recompute。wide
    dependency：output partition依赖many/all parent partitions，需要shuffle。
  thesis_source: 7. 知识结构与证据地图
  concepts:
  - term: 0. 本章定位：把大量 immutable data 可靠地变成 derived data
    meaning: batch frameworks可扫描 columnar files、顺序读大对象、并行占用 idle capacity，并按 task重试。若把同样工作拆成数十亿次
      OLTP/API requests，会产生 connection、transaction、index maintenance和per-request scheduling
      overhead。
    source_heading: 0. 本章定位：把大量 immutable data 可靠地变成 derived data
  - term: 2. Batch Processing in Distributed Systems
    meaning: traditional KV store优化 KB-scale values与frequent low-latency updates；DFS/object
      store优化 MB-to-GB objects与large sequential transfers。S3 Express等正在缩小 latency/size边界，但pricing、throughput和operation
      model仍不同。
    source_heading: 2. Batch Processing in Distributed Systems
  - term: 5. Summary：批处理是可重放的数据变换系统
    meaning: whole-input recomputation、periodic freshness lag、blocking stages与long
      completion time是batch代价。input变化一个byte可能触发large rerun；unbounded/low-latency changes更适合stream/incremental
      processing。
    source_heading: 5. Summary：批处理是可重放的数据变换系统
  - term: 6.38 误区的统一根源
    meaning: 多数误区把一层的property外推到另一层：API形状不等于storage semantics，task retry不等于external
      exactly-once，transport log不等于atomic visibility，declarative language不等于low-latency
      system。
    source_heading: 6.38 误区的统一根源
  - term: 9. 核心结论
    meaning: 可靠batch system从input manifest到serving generation都要记录lineage/evidence，并以bytes、partitions、commit
      boundary与failure recovery推理。
    source_heading: 9. 核心结论
  - term: 11. References
    meaning: 'Paris Carbone, Stephan Ewen, Seif Haridi, Asterios Katsifodimos, Volker
      Markl, and Kostas Tzoumas. “Apache Flink: Stream and Batch Processing in a Single
      Engine.” IEEE Data Engineering Bulletin, 38(4):28–38, December 2015.'
    source_heading: 11. References
  logic:
  - 0. 本章定位：把大量 immutable data 可靠地变成 derived data
  - 2. Batch Processing in Distributed Systems
