  sections:
  - title: 0. 本章定位：先规定“世界可能怎样坏”，再证明算法
    source_heading: 0. 本章定位：先规定“世界可能怎样坏”，再证明算法
    paragraphs:
    - Part I 解决了通信的工程基础：TCP、TLS、DNS 和 API。Part II 的目标更进一步：让多个进程协调行动，对用户表现得像一个连贯的整体。
    - 如果不先回答这些问题，“算法正确”没有明确含义。同一个算法在一种世界里正确，在更恶劣的世界里可能错误或永远不推进。
    - 真实网络包含网卡、驱动、交换机、路由器、队列、内核、虚拟化、云平台和各种故障。若证明每一步都展开这些细节，问题几乎无法处理。
    - 它们可以组合。例如，“可靠链路”并不说明进程是否 Byzantine，“crash-recovery”也不说明网络延迟是否有上界。完整算法前提必须在三条轴上分别声明。
  - title: 3. Reliable link：可靠链路
    source_heading: 3. Reliable link：可靠链路
    paragraphs:
    - 它是链路交付语义，不等于业务操作 exactly-once。应用重新发出两个不同请求时，链路可以各自准确交付一次，业务仍可能重复执行。
    - crash-recovery 下，若去重集合只在内存中，接收方重启后会忘记已交付 ID，再次交付旧重传。若要求跨重启保持 exactly-once delivery，需要持久化发送
      outbox 与接收去重状态，并让去重记录和应用副作用原子提交。incarnation/epoch 只能把 ID 空间分代；若不保留旧代的交付事实，它最多把保证限制在单次进程
      incarnation 内，不能替代跨重启的持久去重。
    - 原章说 TCP 实现 reliable transmission，并且还提供更多能力。TCP 的主要语义是连接内可靠、有序、无重复的字节流，还包含流量和拥塞控制。
    - 因此 TCP 是可靠链路思想的工程实现近似，不应把形式模型的每个词直接等同于 socket API。
  - title: 5. 标准 C11 示例：fair-loss 上的接收端去重
    source_heading: 5. 标准 C11 示例：fair-loss 上的接收端去重
    paragraphs:
    - 下面的程序模拟同一消息因为 DATA 或 ACK 丢失而重复到达。接收端用 ID 集合保证每个消息只向应用交付一次，并对所有副本返回 ACK。
    - 它只实现可靠链路包装器的接收侧核心，不包含真实网络、定时器、持久存储或并发。
    - 记录 ID 与业务副作用的原子性；
  - title: 7.6 适用场景
    source_heading: 7.6 适用场景
    paragraphs:
    - 单一实体不能完全控制全部进程的系统；
    - Bitcoin 等数字加密货币系统。
    - 这些场景不能只假设节点“要么正确要么安静崩溃”。不过作者明确说它们超出本书后续算法范围。
  - title: 9. Crash-stop model：崩溃停止模型
    source_heading: 9. Crash-stop model：崩溃停止模型
    paragraphs:
    - 让算法不用处理旧进程带着过期状态回来；
    - 若真实系统会重启，却直接部署只在 crash-stop 下正确的算法，恢复节点可能破坏假设。工程上可以用新身份把每次重启视为新进程，但仍要处理旧消息和持久状态。
  - title: 13. Asynchronous model：异步模型
    source_heading: 13. Asynchronous model：异步模型
    paragraphs:
    - 异步模型假设消息传输和进程操作可以花费无上界时间。这里的“asynchronous”不是编程语言的 async/await，而是形式模型中没有已知有限时间上界。
    - 若算法要求收到某进程消息才能继续，而模型允许该消息延迟无界，那么存在合法执行让算法永远等待。
    - 更精确地说，FLP 针对确定性共识、完全异步系统、可靠点对点链路和至多一个 crash-stop 故障：对任何这类算法，都存在一条合法、可接受的执行使其永不决定。受损的是“所有执行都保证终止”；agreement
      与 validity 等 safety 性质仍可保持。原章没有展开 FLP，但“许多问题无法在此假设下解决”指向这类限制。
    - 可以引入 randomized algorithm、failure detector 或最终时间假设恢复进度。
  - title: 15. Safety 与 liveness：理解时间模型的关键补充
    source_heading: 15. Safety 与 liveness：理解时间模型的关键补充
    paragraphs:
    - 更一般地说，任何违反 safety 的行为都存在一个有限“坏前缀”，并且后续执行无法修复已经发生的违规。许多常见 safety 性质可以表现为状态不变量。
    - 一个永远不做决定的算法不会决定错误值，因此可能满足 safety，却不满足 liveness。网络不稳定或纯异步期间，正确协调算法通常优先保持 safety，等待部分同步恢复后再获得
      liveness。
  - title: 17.4 为什么选择这个组合
    source_heading: 17.4 为什么选择这个组合
    paragraphs:
    - 进程会重启，但组织控制代码和身份，不按 Byzantine 设计；
    - 延迟没有永远可靠的硬上界，但大多数时候存在可用稳定期。
    - 它足够真实，又不必为安全关键或敌对开放网络承担 Byzantine 协议成本。
  - title: 18.3 如何质疑模型
    source_heading: 18.3 如何质疑模型
    paragraphs:
    - 进程是 crash-stop、crash-recovery 还是 Byzantine？
    - safety 在所有时期都成立吗？
    - liveness 需要哪些额外条件？
  - title: 22. 从本章提炼出的通用解题方法
    source_heading: 22. 从本章提炼出的通用解题方法
    paragraphs:
    - 明确要保证 safety、liveness、exactly-once delivery，还是身份认证。目标不清，无法选择模型。
    - 不要为了简化证明假设现实永远同步，也不要在封闭可信后端无理由承担 Byzantine 成本。选足以完成目标、又能由环境兑现的模型。
    - 在每两步之间插入 crash：记录前崩溃怎样、记录后执行前怎样、回复前怎样。crash-recovery 正确性常隐藏在这些间隙。
    - 本章最重要的方法论是：先精确定义系统允许怎样失败，再讨论算法如何正确；证明给出的不是无条件真理，而是“假设成立时，结论才成立”的可审查契约。
  takeaways:
  - 系统模型沿通信链路、进程故障和时间三条轴定义世界。 三轴相互独立，必须组合声明。
  - authenticated reliable link 在可靠交付上增加发送者认证。 可靠性、认证和加密是不同性质。
  - crash-recovery 是本书后续的主要进程模型。 进程可重启但丢内存，因此安全关键状态必须持久化。
  - 异步模型没有已知时间上界。 timeout 无法区分故障与极慢，许多问题的确定性活性无法保证。
  - 模型有用但不完整。 证明结束后必须验证实现、持久化、身份和部署是否兑现模型假设。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「19.1 Fair-loss 不等于“丢包概率公平”」？
  answer: 它表达无限重传下的最终交付性质，不要求独立同分布概率，也不提供具体成功率。
  source_heading: 19.1 Fair-loss 不等于“丢包概率公平”
- level: 概念辨析
  question: 原文如何解释「19.2 Reliable link 不等于网络永不失败」？
  answer: 它是向上层提供的抽象，可由重试和去重构造。底层仍会丢包，连接也可能在现实永久故障时失败。
  source_heading: 19.2 Reliable link 不等于网络永不失败
- level: 概念辨析
  question: 原文如何解释「19.8 Partial synchrony 不等于固定 SLA」？
  answer: 经典 GST 变体假设最终持续满足时间界，不保证从启动起每个请求都低于某个百分位延迟。
  source_heading: 19.8 Partial synchrony 不等于固定 SLA
- level: 概念辨析
  question: 原文如何解释「19.9 Timeout 不等于故障证明」？
  answer: 在异步或 GST 前，正确慢节点与故障节点不可区分。timeout 是怀疑信号，不是客观事实。
  source_heading: 19.9 Timeout 不等于故障证明
- level: 概念辨析
  question: 原文如何解释「19.10 更强模型不总是更好」？
  answer: 假设越强，算法可能越简单，但现实越难满足；故障模型越强，算法更鲁棒，但成本更高。应选择与威胁和环境匹配的最弱充分模型。
  source_heading: 19.10 更强模型不总是更好
