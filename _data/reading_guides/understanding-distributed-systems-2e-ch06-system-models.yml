overview:
  kind: summary
  minutes: 8
  question: 0. 本章定位：先规定“世界可能怎样坏”，再证明算法？
  question_source: 0. 本章定位：先规定“世界可能怎样坏”，再证明算法
  thesis: crash-recovery 是本书后续的主要进程模型。 进程可重启但丢内存，因此安全关键状态必须持久化。
  thesis_source: 21. 核心结论
  concepts:
  - term: 0. 本章定位：先规定“世界可能怎样坏”，再证明算法
    meaning: Part I 解决了通信的工程基础：TCP、TLS、DNS 和 API。Part II 的目标更进一步：让多个进程协调行动，对用户表现得像一个连贯的整体。
    source_heading: 0. 本章定位：先规定“世界可能怎样坏”，再证明算法
  - term: 5. 标准 C11 示例：fair-loss 上的接收端去重
    meaning: 下面的程序模拟同一消息因为 DATA 或 ACK 丢失而重复到达。接收端用 ID 集合保证每个消息只向应用交付一次，并对所有副本返回 ACK。
    source_heading: 5. 标准 C11 示例：fair-loss 上的接收端去重
  - term: 9. Crash-stop model：崩溃停止模型
    meaning: 若真实系统会重启，却直接部署只在 crash-stop 下正确的算法，恢复节点可能破坏假设。工程上可以用新身份把每次重启视为新进程，但仍要处理旧消息和持久状态。
    source_heading: 9. Crash-stop model：崩溃停止模型
  - term: 13. Asynchronous model：异步模型
    meaning: 更精确地说，FLP 针对确定性共识、完全异步系统、可靠点对点链路和至多一个 crash-stop 故障：对任何这类算法，都存在一条合法、可接受的执行使其永不决定。受损的是“所有执行都保证终止”；agreement
      与 validity 等 safety 性质仍可保持。原章没有展开 FLP，但“许多问题无法在此假设下解决”指向这类限制。
    source_heading: 13. Asynchronous model：异步模型
  - term: 17.4 为什么选择这个组合
    meaning: 延迟没有永远可靠的硬上界，但大多数时候存在可用稳定期。
    source_heading: 17.4 为什么选择这个组合
  - term: 22. 从本章提炼出的通用解题方法
    meaning: 本章最重要的方法论是：先精确定义系统允许怎样失败，再讨论算法如何正确；证明给出的不是无条件真理，而是“假设成立时，结论才成立”的可审查契约。
    source_heading: 22. 从本章提炼出的通用解题方法
  logic:
