overview:
  kind: summary
  minutes: 8
  question: 原文围绕「本章定位：让页面外观忠实反映思想结构」建立了怎样的核心认识？
  question_source: 本章定位：让页面外观忠实反映思想结构
  thesis: 本章最核心的实践原则是：先构建真实的思想层级，再用一致的标题、编号、缩进和强调把层级显示出来；每当读者跨越分支时，用内容上的回顾与前瞻说明为何转向，绝不能指望漂亮格式替自己完成尚未完成的思考。
  thesis_source: 本章小结
  concepts:
  - term: 本章定位：让页面外观忠实反映思想结构
    meaning: 书面文章是线性文本，思想却具有层级和分组。如果视觉格式不显示层级，读者必须自行恢复结构；如果格式与逻辑不一致，视觉线索反而会误导。
    source_heading: 本章定位：让页面外观忠实反映思想结构
  - term: 四、任何格式都必须满足的原则
    meaning: 格式不能先于结构决定。若思想只有一层，却用四级标题，页面会制造虚假的复杂性。
    source_heading: 四、任何格式都必须满足的原则
  - term: 作者分析问题的完整思路
    meaning: 思想是多层结构，页面是二维视觉加线性阅读。作者需要把抽象关系编码成读者可见的样式和可跟随的过渡。
    source_heading: 作者分析问题的完整思路
  - term: 一、中心结构
    meaning: 最后迁移核心交易并保留回退路径。
    source_heading: 一、中心结构
  - term: 检查编号
    meaning: 序言、过渡和总结是否被不必要编号？
    source_heading: 检查编号
  - term: 本章小结
    meaning: 本章最核心的实践原则是：先构建真实的思想层级，再用一致的标题、编号、缩进和强调把层级显示出来；每当读者跨越分支时，用内容上的回顾与前瞻说明为何转向，绝不能指望漂亮格式替自己完成尚未完成的思考。
    source_heading: 本章小结
  logic:
  - 本章定位：让页面外观忠实反映思想结构
  - 四、任何格式都必须满足的原则
  - 上下文之间要有过渡
  - 一、中心结构
  - 五、组间过渡
  - 检查结尾与行动
  - 本章小结
  sections:
  - title: 本章定位：让页面外观忠实反映思想结构
    source_heading: 本章定位：让页面外观忠实反映思想结构
    paragraphs:
    - 前九章解决“思想怎样形成金字塔”，第10章解决“怎样让读者从页面上看见金字塔”。
    - 书面文章是线性文本，思想却具有层级和分组。如果视觉格式不显示层级，读者必须自行恢复结构；如果格式与逻辑不一致，视觉线索反而会误导。
    - 静态呈现：用视觉格式显示思想层级；
    - 动态衔接：用过渡文字引导读者从一个分支移动到另一个分支。
  - title: 二、媒介选择的必要背景
    source_heading: 二、媒介选择的必要背景
    paragraphs:
    - 信息短、人数少：书面备忘录或报告；
    - 信息短、人数多：要点备忘录或视觉资料；
    - 第10章只处理读者自行阅读的书面媒介。它允许读者停顿、回看和检索，因此可承载比幻灯片更完整的论证。
  - title: 四、任何格式都必须满足的原则
    source_heading: 四、任何格式都必须满足的原则
    paragraphs:
    - 同层思想使用一致样式；下层思想应在视觉上从属于上层；转换分组时应有过渡。
    - 格式不能先于结构决定。若思想只有一层，却用四级标题，页面会制造虚假的复杂性。
  - title: 上下文之间要有过渡
    source_heading: 上下文之间要有过渡
    paragraphs:
    - 标题告诉读者“现在进入另一组”，却未说明“为什么从上一组来到这一组”。长分支结束后，读者可能已忘记顶层主线，需要文字恢复位置。
    - 过渡是在思想组边界处，回顾已建立的结论，说明它与下一组的逻辑关系，并引出下一组将回答的问题的文字。
    - 总结重申：董事会与主席、集团董事总经理和三位业务高管形成长期领导和控制框架；只有提高控制和责任，其他改进才可能实现。
    - 长分支后，作者与读者的认知状态不同：作者掌握全局，读者刚处理大量局部信息。过渡的作用是把读者的注意力拉回正确层级，再向前移动。
  - title: 作者分析问题的完整思路
    source_heading: 作者分析问题的完整思路
    paragraphs:
    - 思想是多层结构，页面是二维视觉加线性阅读。作者需要把抽象关系编码成读者可见的样式和可跟随的过渡。
    - 长文需要导航、目录和快速回看。标题同时提供位置与语义，比纯编号更容易恢复记忆。
    - 标题服务跳读，正文服务连续阅读。两条路径都应完整，否则一种阅读方式会失败。
    - 屏幕阅读器需要语义标记而非纯视觉样式；
  - title: 一、中心结构
    source_heading: 一、中心结构
    paragraphs:
    - 再迁移低风险服务并验证运行模型；
    - 最后迁移核心交易并保留回退路径。
  - title: 五、组间过渡
    source_heading: 五、组间过渡
    paragraphs:
    - 既然一次性迁移的主要风险来自未知依赖和未经验证的恢复能力，下一步不应直接处理核心交易，而应先用低风险服务验证新的运行模型。
    - 低风险服务验证了部署和运维流程，但核心交易还受到一致性和停机目标约束，因此只有在恢复演练通过后才能进入最后阶段。
  - title: 检查编号
    source_heading: 检查编号
    paragraphs:
    - 是否采用自动编号和稳定交叉引用？
    - 序言、过渡和总结是否被不必要编号？
  - title: 检查结尾与行动
    source_heading: 检查结尾与行动
    paragraphs:
    - 结尾是否说明意义，而非重复目录？
    - 下一步是否在接受建议后显而易见？
  - title: 本章小结
    source_heading: 本章小结
    paragraphs:
    - 多级标题、强调、编号、缩进和项目符号是五种常见视觉方法，没有绝对最佳方案。
    - "“下一步措施”只放接受主建议后显而易见的启动动作，有争议的行动必须进入正文论证。"
    - 现代数字文档还应使用语义标题、结构化列表、自动目录，并兼顾移动端与辅助技术。
    - 本章最核心的实践原则是：先构建真实的思想层级，再用一致的标题、编号、缩进和强调把层级显示出来；每当读者跨越分支时，用内容上的回顾与前瞻说明为何转向，绝不能指望漂亮格式替自己完成尚未完成的思考。
  takeaways:
  - 动态衔接：用过渡文字引导读者从一个分支移动到另一个分支。
  - 格式不能先于结构决定。若思想只有一层，却用四级标题，页面会制造虚假的复杂性。
  - 最后迁移核心交易并保留回退路径。
  - 序言、过渡和总结是否被不必要编号？
  - 本章最核心的实践原则是：先构建真实的思想层级，再用一致的标题、编号、缩进和强调把层级显示出来；每当读者跨越分支时，用内容上的回顾与前瞻说明为何转向，绝不能指望漂亮格式替自己完成尚未完成的思考。
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「标题与主题句」？
  answer: 标题用于扫描和导航；主题句属于正文论证。二者可表达同一思想，但正文不能依赖标题补全。
  source_heading: 标题与主题句
- level: 概念辨析
  question: 原文如何解释「编号与顺序」？
  answer: 编号可能只是地址；时间或逻辑顺序需要思想本身证明。1、2、3 不自动产生先后。
  source_heading: 编号与顺序
- level: 概念辨析
  question: 原文如何解释「独立文档与现场材料」？
  answer: 独立报告需要足够过渡和背景；现场项目符号材料可依赖讲解，但会降低离场后的可读性。
  source_heading: 独立文档与现场材料
- level: 概念辨析
  question: 原文如何解释「误解十二：“下一步”可以放新主张」？
  answer: 有争议的新动作必须在正文论证。下一步只放接受主建议后显而易见的启动事项。
  source_heading: 误解十二：“下一步”可以放新主张
