  minutes: 11
  question: 1. 本章在回答什么问题？
  question_source: 1. 本章在回答什么问题
  thesis: Serverless 由 BaaS 与 FaaS 构成，适合按需、事件驱动和无状态任务，不是微服务的替代代际。
  thesis_source: 11. 本章知识结构总结
  concepts:
  - term: 1. 本章在回答什么问题
    meaning: 本章表面是在讲架构史，真正追问的是：为什么人们总在单体与分布式之间反复调整，又为什么每一次回到分布式时，技术形态都与上一次不同？
    source_heading: 1. 本章在回答什么问题
  - term: 3. 单体系统时代：进程内简单性的长期胜利
    meaning: "“Monolithic”字面上容易被译成“巨石”或“铁板一块”，原义在架构语境中更接近自包含（Self-Contained）：一个部署单元具备完成主要业务所需的组件。自包含描述运行边界，不否定内部模块化。"
    source_heading: 3. 单体系统时代：进程内简单性的长期胜利
  - term: 6. 后微服务时代：可编程基础设施重新追求透明
    meaning: 原书写作时预测 Kubernetes 会像 Linux 一样成为服务器端标准环境，服务网格会取代 Spring Cloud 全家桶的大部分能力。阅读时应把它视为作者基于当时趋势的判断，而不是架构定义本身。长期有效的结论是：适合跨应用标准化的技术能力，会倾向于被平台化；平台化是否值得，取决于复用规模能否覆盖平台成本。
    source_heading: 6. 后微服务时代：可编程基础设施重新追求透明
  - term: 7. 无服务时代：从另一条路线隐藏分布式
    meaning: 作者对 Serverless 的态度是谨慎乐观，而不是确定押注。原因在于软件开发必须在信息不完备时为当前问题作决定：既不能因无法看清远期未来而停止尝试，也不能把趋势预测当作选型证据。图灵所说“我们只能看见前方不远处，但那里已有许多工作等待完成”，在这里对应的工程态度就是小步验证、保留可逆性，并让架构随证据演进。
    source_heading: 7. 无服务时代：从另一条路线隐藏分布式
  - term: 11.1 核心结论
    meaning: Serverless 由 BaaS 与 FaaS 构成，适合按需、事件驱动和无状态任务，不是微服务的替代代际。
    source_heading: 11.1 核心结论
  - term: 12. 主动回忆题
    meaning: Kubernetes 与 Spring Cloud 解决同类问题时，能力为什么不能简单一一等价？
    source_heading: 12. 主动回忆题
