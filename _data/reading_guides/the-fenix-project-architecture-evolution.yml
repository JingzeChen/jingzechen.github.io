  sections:
  - title: 1. 本章在回答什么问题
    source_heading: 1. 本章在回答什么问题
    paragraphs:
    - 本章表面是在讲架构史，真正追问的是：为什么人们总在单体与分布式之间反复调整，又为什么每一次回到分布式时，技术形态都与上一次不同？
    - 当时受什么硬件、软件和组织条件约束？
    - 它为何成功、失败，或只适用于部分场景？
    - 任何方案若只展示某一项下降、却不说明其他项的变化，都可能是在转移而非减少复杂度。
  - title: 2. 原始分布式时代：透明愿景第一次碰到现实
    source_heading: 2. 原始分布式时代：透明愿景第一次碰到现实
    paragraphs:
    - 20 世纪 70 年代末至 80 年代初，计算机正从大型机走向微型机。典型微型计算机只有 16 位寄存器、不足 5 MHz 的处理器、不超过 1 MB
      的内存和 64 KB 单段地址空间。Intel 8086 于 1978 年出现，代表了当时快速普及但仍十分有限的硬件条件。
    - DCE，即 Distributed Computing Environment，是开放软件基金会组织业界共同制定的一整套分布式规范与参考实现。它的重要性不只在某个产品，而在于第一次有组织、有标准、有大规模投入地同时处理
      RPC、文件、认证、时间和命名等问题。
    - 开放软件基金会（Open Software Foundation，OSF）希望避免 UNIX 版本战争在分布式领域重演，因此联合主流厂商制定 DCE。DCE/RPC
      与 Sun 后来提交给 IETF、基于通用 TCP/IP 的 ONC RPC，通常被视为现代 RPC 的两条重要源流。这个谱系说明，早期研究虽然没交付一套普适应用架构，却把远程调用从厂商私有技巧推进成了可讨论、可实现的标准问题。
    - DCE 带有明显的 UNIX 设计取向：接口和实现应保持简单，让开发者尽量不关心资源位于本机还是远端。Richard P. Gabriel 的 “Worse
      is Better” 强调简单性优先，背后不是鼓励错误，而是在完整、复杂的方案与更容易实现、传播和演进的方案之间，承认简单本身具有巨大工程价值。
  - title: 3. 单体系统时代：进程内简单性的长期胜利
    source_heading: 3. 单体系统时代：进程内简单性的长期胜利
    paragraphs:
    - 单体架构的核心定义很窄：系统的主要过程调用发生在同一进程内，而不是通过进程间通信（Inter-Process Communication，IPC）完成。
    - "“Monolithic”字面上容易被译成“巨石”或“铁板一块”，原义在架构语境中更接近自包含（Self-Contained）：一个部署单元具备完成主要业务所需的组件。自包含描述运行边界，不否定内部模块化。"
    - 小型团队共享一个进程，相当于几个人在同一办公室工作，沟通直接且节约资源；大型组织仍强制所有部门共用同一空间，局部问题和变更就会波及整体。作者借这个类比说明：同一个性质在不同规模下可以从优势转为缺点。
    - 如果所有模块共享一个进程，局部故障容易成为全局故障，就很难实现“由不可靠部件组成可靠系统”。独立进程边界则提供了故障隔离、单独重启、独立扩容和替换的基础。
  - title: 5. 微服务时代：用自治和实践标准换取自由
    source_heading: 5. 微服务时代：用自治和实践标准换取自由
    paragraphs:
    - 2012 年，James Lewis 在 “Microservices - Java, the Unix Way” 中强调 UNIX 哲学、单一职责、康威定律、自动扩展和领域驱动设计，主动淡化
      SOA；
    - 服务边界应对应用户可识别的业务能力，而不是简单按数据库表、MVC 层或技术框架切分。例如书店可以围绕账户、商品、仓储和交易组织服务，而不是建立“Controller
      服务”“DAO 服务”。
    - 这不是说网络层只能转发字节，任何路由、安全和遥测都不能存在。其核心是不要把领域业务规则集中到公共通信中间件，使所有服务受同一复杂平台控制。后来的服务网格会把通用流量能力放入代理，但仍应避免把业务编排重新塞进代理。
    - 单体可能只有少量部署对象，微服务则可能有数百甚至更多服务和实例。人工构建、测试、发布、配置和回滚无法在线性扩张下维持可靠性，因此 CI/CD、自动测试、制品管理、配置管理、监控和自动扩缩容不是锦上添花，而是微服务成立的前提。
  - title: 6. 后微服务时代：可编程基础设施重新追求透明
    source_heading: 6. 后微服务时代：可编程基础设施重新追求透明
    paragraphs:
    - 虚拟化、容器、软件定义网络（Software-Defined Networking，SDN）和软件定义存储（Software-Defined Storage，SDS）让“硬件能力”也能由
      API 和声明动态创建。于是基础设施开始具备接近软件的灵活性，通用分布式能力有机会从每个应用中剥离。
    - 原书采用的是当时 Istio 文档中的示意图，其中出现的 Mixer 已在 Istio 1.5 之后移除。因此这张图应用来理解“应用流量经过边车、代理接受控制面配置”的逻辑关系，不能当作当前
      Istio 组件清单或部署拓扑。
    - ESB 的主要风险不是管道存在能力，而是中央管道吸收了大量业务语义并成为所有团队的发布瓶颈。服务网格若保持策略通用、配置可分散治理，就仍符合“业务在终端”的原则；若把业务编排重新塞进网格，也会重蹈覆辙。
    - 原书写作时预测 Kubernetes 会像 Linux 一样成为服务器端标准环境，服务网格会取代 Spring Cloud 全家桶的大部分能力。阅读时应把它视为作者基于当时趋势的判断，而不是架构定义本身。长期有效的结论是：适合跨应用标准化的技术能力，会倾向于被平台化；平台化是否值得，取决于复用规模能否覆盖平台成本。
  - title: 7. 无服务时代：从另一条路线隐藏分布式
    source_heading: 7. 无服务时代：从另一条路线隐藏分布式
    paragraphs:
    - 微服务继续沿分布式路线前进：拆分服务，再用平台治理。无服务则提出另一种思路：如果云数据中心能提供近似无限的按需算力，开发者能否不再管理服务器和实例，只提交业务函数？
    - 平均值看起来不高，但 5% 用户仍可能遇到约 800 ms，因此还必须观察 P95、P99 等尾延迟。Java 和启动期组装较多的框架尤其容易放大运行时与应用初始化成本。
    - 一个微服务可以运行在物理机、虚拟机、容器或云函数上。若某个业务能力适合事件触发和无状态执行，完全可以用 FaaS 实现；其他长期运行、低延迟服务继续用容器。
    - 作者对 Serverless 的态度是谨慎乐观，而不是确定押注。原因在于软件开发必须在信息不完备时为当前问题作决定：既不能因无法看清远期未来而停止尝试，也不能把趋势预测当作选型证据。图灵所说“我们只能看见前方不远处，但那里已有许多工作等待完成”，在这里对应的工程态度就是小步验证、保留可逆性，并让架构随证据演进。
  - title: 8. 六个时代之间的完整因果链
    source_heading: 8. 六个时代之间的完整因果链
    paragraphs:
    - 新架构很少从零诞生。微服务保留 SOA 提出的问题，拒绝其默认解法；服务网格保留微服务的业务自治，把通用治理移到代理；Serverless 保留业务边界，却把实例生命周期交给云平台。
    - 后微服务不是简单回到 DCE。DCE 倾向隐藏“远程事实”，服务网格主要隐藏治理机制。开发者仍应知道跨服务调用具有延迟、超时、部分失败和一致性代价。
    - 每提高一层抽象，都要问：隐藏的细节是否足够稳定、通用？若答案是否定的，抽象会泄漏，开发者仍需理解底层。
  - title: 11.1 核心结论
    source_heading: 11.1 核心结论
    paragraphs:
    - 大型单体的根本限制是共享进程导致隔离、自治、独立交付和技术异构困难，而非不能分层或模块化。
    - 微服务用业务能力、团队自治、轻量通信和自动化替代统一规范，同时把选型与治理责任交还团队。
    - 后微服务借 Kubernetes 和服务网格把通用技术能力下沉到可编程基础设施，但平台复杂度仍然存在。
    - Serverless 由 BaaS 与 FaaS 构成，适合按需、事件驱动和无状态任务，不是微服务的替代代际。
  - title: 11.2 解决问题的一般思路
    source_heading: 11.2 解决问题的一般思路
    paragraphs:
    - 它解决的是哪个已经存在且可验证的问题？
    - 它把复杂度交给了应用、服务、代理、平台、云厂商还是组织？
    - 当前团队是否具备让这次转移产生净收益的前提？
  - title: 12. 主动回忆题
    source_heading: 12. 主动回忆题
    paragraphs:
    - SOAP、WSDL、UDDI、ESB、BPM、SDO、SCA 各承担什么职责？
    - 现代微服务的定义与早期 Micro-Web-Service 有何区别？
    - Kubernetes 与 Spring Cloud 解决同类问题时，能力为什么不能简单一一等价？
    - 面对一个新架构，怎样用“痛点、解法、代价、前提”四栏表判断是否值得采用？
  takeaways:
  - 架构不是凭空发明的，而是在硬件、软件和组织约束下持续演进的。
  - SOA 在技术上系统性解决了服务集成问题，却因规范和平台过度复杂而难以普及。
  - 后微服务借 Kubernetes 和服务网格把通用技术能力下沉到可编程基础设施，但平台复杂度仍然存在。
  - 不存在唯一“最先进”架构，只有与业务、团队、平台和成本约束匹配的选择。
  - 当前团队是否具备让这次转移产生净收益的前提？
check_intro: 以下问题只检验现有正文明确说明的内容。请先根据原文脉络作答，再展开参考答案核对。
checks:
- level: 概念辨析
  question: 原文如何解释「9.1 “Worse is Better”不是质量越差越好」？
  answer: 它强调简单实现和简单接口有利于传播、适应和演进，不是允许不正确、不安全。架构必须先满足底线约束，再比较完整性与复杂度。
  source_heading: 9.1 “Worse is Better”不是质量越差越好
- level: 概念辨析
  question: 原文如何解释「9.4 单体并不天然低可靠」？
  answer: 小型、边界清晰的单体可能比仓促拆分的微服务可靠。问题出现在规模增大后，仅靠每个部件永不出错难以维持整体可靠性。
  source_heading: 9.4 单体并不天然低可靠
- level: 概念辨析
  question: 原文如何解释「9.7 SOA 不是纯粹失败技术」？
  answer: SOA 系统性解决了大型异构系统集成问题，其失败主要是没有成为低成本、普适的默认架构。特定企业集成场景仍可能需要类似能力。
  source_heading: 9.7 SOA 不是纯粹失败技术
- level: 概念辨析
  question: 原文如何解释「9.10 Kubernetes 不等于完整微服务治理」？
  answer: Kubernetes 主要管理资源和工作负载生命周期。请求级熔断、业务认证、细粒度路由和完整追踪通常需要应用、网关、网格或其他系统配合。
  source_heading: 9.10 Kubernetes 不等于完整微服务治理
- level: 概念辨析
  question: 原文如何解释「9.13 后出现不等于更先进、更适合」？
  answer: 章节顺序描述历史，不是排行榜。单体、微服务、服务网格和 Serverless 都有适用区间，可以在同一组织甚至同一产品中组合。
  source_heading: 9.13 后出现不等于更先进、更适合
