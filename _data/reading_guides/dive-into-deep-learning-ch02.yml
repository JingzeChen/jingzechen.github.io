    meaning: 本章采取“够用即止”的策略：数学内容不是完整教材，而是为后续模型建立共同语言。作者的分析顺序也很有意图：先让读者能操作具体对象，再解释对象背后的数学，最后把手算导数交回框架。
    source_heading: 1. 本章要解决什么问题
  - term: 3. 数据预处理：从杂乱表格到数值张量
    meaning: 当类别数达到数十万时，独热向量非常稀疏且维度巨大，后续通常使用哈希、频次截断或可学习嵌入。若每个类别都唯一，例如订单 ID 或姓名，直接独热编码通常只会帮助记忆训练样本，除非该标识能在部署时重复出现且确有预测意义。
    source_heading: 3. 数据预处理：从杂乱表格到数值张量
  - term: 6. 自动微分：让框架执行链式法则
    meaning: 单个二次函数的导数容易计算，但现代网络含有数百万参数和大量分支、循环、矩阵运算。手推既耗时又容易漏项。自动微分（autograd）在程序执行前向计算时记录值之间的依赖，构造计算图；随后从输出反向遍历，反复应用局部导数和链式法则。
    source_heading: 6. 自动微分：让框架执行链式法则
  - term: 7. 概率与统计：在不确定性下推理
    meaning: 频率学派主要把概率解释为可重复事件长期频率；贝叶斯学派还把概率用于表达对不可重复命题的信念程度，并允许不同观察者拥有不同先验。两者都遵循概率运算规则，但对未知参数和证据的解释不同。
    source_heading: 7. 概率与统计：在不确定性下推理
  - term: 10.12 导数、偏导数、梯度与 Jacobian
    meaning: 向量函数对向量：完整导数是 Jacobian 矩阵；
    source_heading: 10.12 导数、偏导数、梯度与 Jacobian
