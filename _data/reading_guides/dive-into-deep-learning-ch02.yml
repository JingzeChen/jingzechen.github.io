    meaning: 本章最终建立了一条贯穿全书的技术主线：现实数据先被清洗并表示为张量，模型通过线性代数和非线性运算产生预测，标量损失把预测质量量化，微积分与自动微分计算参数对损失的影响，概率统计解释数据和预测中的不确定性，文档与实验则保证这些数学意图被
