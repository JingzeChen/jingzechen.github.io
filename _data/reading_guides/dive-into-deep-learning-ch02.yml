checks:
- level: 概念辨析
  question: 原文如何解释「10.1 数学张量与框架 Tensor」？
  answer: 数学中的张量有更严格的坐标变换含义；深度学习框架通常把任意多维数组对象统称为张量。本章主要使用后者，不应由名称推断代码对象自动具备所有微分几何性质。
  source_heading: 10.1 数学张量与框架 Tensor
- level: 概念辨析
  question: 原文如何解释「10.8 填补与数据泄漏」？
  answer: 均值填补本身不是泄漏；用验证集或测试集共同计算填补均值才是泄漏。所有从数据“学到”的预处理参数都属于训练流程的一部分。
  source_heading: 10.8 填补与数据泄漏
- level: 概念辨析
  question: 原文如何解释「10.12 导数、偏导数、梯度与 Jacobian」？
  answer: 向量函数对向量：完整导数是 Jacobian 矩阵；
  source_heading: 10.12 导数、偏导数、梯度与 Jacobian
- level: 概念辨析
  question: 原文如何解释「10.19 独立、不相关与条件独立」？
  answer: 独立通常推出不相关（期望存在时），不相关一般不推出独立。给定第三变量后，原本的独立关系还可能反转。任何概率分解都必须明确条件。
  source_heading: 10.19 独立、不相关与条件独立
- level: 概念辨析
  question: 原文如何解释「10.21 高准确率与高后验概率」？
  answer: 灵敏度、特异度、总体准确率和阳性预测值是不同条件概率。罕见事件中，即使假阳性率很低，也可能产生大量假阳性。
  source_heading: 10.21 高准确率与高后验概率
