  sections:
  - title: 0. 本章定位：从“系统正在运行”到“用户是否获得了承诺的服务”
    source_heading: 0. 本章定位：从“系统正在运行”到“用户是否获得了承诺的服务”
    paragraphs:
    - 检测 production 中影响 users 的 failures，并向 human operators 触发 notifications/alerts；
    - 通过 dashboards 提供 system health 的 high-level overview。
    - Chapter 30 的 progressive rollout 需要 health signals 来决定 promote、stop 或 rollback。本章解释这些
      signals 如何从 metrics、SLIs、SLOs 和 alerts 构造。
    - Monitoring 擅长发现 symptoms；root-cause debugging 常需 metrics 的下钻以及 logs/traces。
  - title: 5.3 不要在每行盲目埋点
    source_heading: 5.3 不要在每行盲目埋点
    paragraphs:
    - Runtime overhead；
    - Storage/query cost；
    - Semantic maintenance。
    - 先从用户结果、关键资源和 dependency boundaries 反推 signals。
  - title: 10.1 Response time 的候选位置
    source_heading: 10.1 Response time 的候选位置
    paragraphs:
    - 原章的问题原文是：应由 service, load balancer, or clients 中的哪一处测量？
    - 原章原则：选择最能代表 users’ experience 的 metric；若成本太高，再选次优候选。
  - title: 14. 31.3 Service-level objectives：给 SLI 划定健康区间
    source_heading: 14. 31.3 Service-level objectives：给 SLI 划定健康区间
    paragraphs:
    - SLO 定义一个 SLI 的 acceptable range；SLI 位于该区间时，service 被视为 healthy（Figure 31.2）。
    - Good-event criterion；
    - Rolling window of 1 week 内，endpoint X 的 eligible API calls 至少 99% 在 200 ms 内完成，以
      edge metric 计。
    - 原图用虚线 SLO threshold 划定 acceptable values；SLI 下穿即在该时间窗口不达目标。
  - title: 19. 用现实反馈校准 SLO
    source_heading: 19. 用现实反馈校准 SLO
    paragraphs:
    - SLO 不是一次性配置，应根据真实 incidents 和 user feedback 演化。
    - Product managers：targets 能保证 good user experience；
    - 原章引用 SRE book 的意思是：如果引用某个 SLO 永远无法改变 priority conversation，它就不值得存在。
    - 若 error budget 烧得过快或耗尽，repair items 应优先于 features，直到恢复 SLO。
  - title: 23. 99% / 30 天 naive alert 为什么太吵
    source_heading: 23. 99% / 30 天 naive alert 为什么太吵
    paragraphs:
    - Availability SLO：99% over 30 days。Naive alert：过去 1 hour availability < 99%。
    - 系统从非 100% 健康，总有局部 failure。每烧掉总 budget 的 0.14% 就 page，会产生 high recall、low precision。
    - 可提高 precision，但真实 outage 也会更晚告警。需要同时兼顾消耗速度和检测时间，因此引出 burn rate。
  - title: 28. SLO summary dashboard
    source_heading: 28. SLO summary dashboard
    paragraphs:
    - 跨组织 stakeholders：engineering、product、operations、leadership。
    - Error budget remaining/burn rate；
    - 平时展示 overall system health；incident 中量化 user impact，帮助决定优先级和沟通。
    - 大量 implementation internals 会使跨团队读者无法理解。需要下钻时链接 Public API/service dashboards。
  - title: 32. Dashboard best practices：布局、时间与密度
    source_heading: 32. Dashboard best practices：布局、时间与密度
    paragraphs:
    - Dashboard 自上而下渲染/阅读，user impact、SLO、traffic/errors 应优先；深层 internals 后置。
    - 同一 dashboard 所有 charts 使用相同 resolution/range，方便视觉关联 anomalies。
    - Ongoing incident：1-hour range + 1-minute resolution；
    - 量级大的 metric 会把小 metric 压平。只把 min/max ranges 相似的 metrics 放同图。
  - title: 36. Mitigate first，root cause later
    source_heading: 36. Mitigate first，root cause later
    paragraphs:
    - 收到 alert 后先 mitigate user impact，不是在 production 压力下寻找完美根因。
    - 新 artifact 降低 service -> rollback；
    - Load 未增加但 service 承载不了 -> scale out。
    - Rollback/restart/scale out 只消除 symptom 或恢复服务；必须创建 repair items 并跟进 root cause，否则同类
      incident 会重复。
  - title: 45. 解决问题的一般思路
    source_heading: 45. 解决问题的一般思路
    paragraphs:
    - Labels、sample rate、retention、resolution 都有乘法成本；bounded metrics + high-dimensional
      logs/traces 分工。
    - Burn rate 表达“照此速度多久耗尽”，多 severity/window/sample gate 平衡 noise 与 detection。
    - Alert 附 impact、dashboard、runbook、owner；不能行动的 metric 留在 dashboard 或 ticket。
    - Mitigate -> shared timeline -> root cause -> postmortem -> repair items -> SLO/alert/dashboard/architecture
      更新。
  takeaways:
  - Monitoring 主要检测 user-impacting failures、触发 alerts，并通过 dashboards 展示 health。
  - Response-time SLI 是 threshold 内 requests 比率，availability SLI 是 successful/total。
  - SLO 应从 users care about 反推，从舒适目标开始，保持少而简单并定期校准。
  - 多 thresholds/windows 可兼顾 alert precision、recall 与 detection speed。
  - Budget 耗尽或 alerts 失控时，团队应暂停 features，集中恢复 reliability。
