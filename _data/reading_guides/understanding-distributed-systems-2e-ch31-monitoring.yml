overview:
  kind: summary
  minutes: 8
  question: 0. 本章定位：从“系统正在运行”到“用户是否获得了承诺的服务”？
  question_source: 0. 本章定位：从“系统正在运行”到“用户是否获得了承诺的服务”
  thesis: Black-box 从用户外部看 symptoms，white-box 通过 instrumentation 看内部 behavior/root-cause
    clues。
  thesis_source: 44. 核心结论
  concepts:
  - term: 0. 本章定位：从“系统正在运行”到“用户是否获得了承诺的服务”
    meaning: Chapter 30 的 progressive rollout 需要 health signals 来决定 promote、stop 或
      rollback。本章解释这些 signals 如何从 metrics、SLIs、SLOs 和 alerts 构造。
    source_heading: 0. 本章定位：从“系统正在运行”到“用户是否获得了承诺的服务”
  - term: 10.1 Response time 的候选位置
    meaning: 原章的问题原文是：应由 service, load balancer, or clients 中的哪一处测量？
    source_heading: 10.1 Response time 的候选位置
  - term: 19. 用现实反馈校准 SLO
    meaning: 原章引用 SRE book 的意思是：如果引用某个 SLO 永远无法改变 priority conversation，它就不值得存在。
    source_heading: 19. 用现实反馈校准 SLO
  - term: 23. 99% / 30 天 naive alert 为什么太吵
    meaning: 系统从非 100% 健康，总有局部 failure。每烧掉总 budget 的 0.14% 就 page，会产生 high recall、low
      precision。
    source_heading: 23. 99% / 30 天 naive alert 为什么太吵
  - term: 32. Dashboard best practices：布局、时间与密度
    meaning: Dashboard 自上而下渲染/阅读，user impact、SLO、traffic/errors 应优先；深层 internals 后置。
    source_heading: 32. Dashboard best practices：布局、时间与密度
  - term: 45. 解决问题的一般思路
    meaning: Mitigate -> shared timeline -> root cause -> postmortem -> repair items
      -> SLO/alert/dashboard/architecture 更新。
    source_heading: 45. 解决问题的一般思路
