checks:
- level: 概念辨析
  question: 原文如何解释「39.1 Monitoring 与 observability」？
  answer: Monitoring 判断健康/告警；observability 还支持解释未知内部状态与 root cause。后者是下一章主题。
  source_heading: 39.1 Monitoring 与 observability
- level: 概念辨析
  question: 原文如何解释「39.7 SLO 与 SLA」？
  answer: SLO 是目标；SLA 是未达目标时有 contractual consequences 的 agreement。
  source_heading: 39.7 SLO 与 SLA
- level: 概念辨析
  question: 原文如何解释「40.3 “Label 越多越容易排障”」？
  answer: High cardinality 可能先压垮 telemetry system。Metrics 保持 bounded dimensions，细节放
    logs/traces。
  source_heading: 40.3 “Label 越多越容易排障”
- level: 概念辨析
  question: 原文如何解释「40.12 “今天能达到就设为 target”」？
  answer: 未来 load 后可能不可达。应从 user needs 与可持续工程成本反推。
  source_heading: 40.12 “今天能达到就设为 target”
- level: 概念辨析
  question: 原文如何解释「40.20 “On-call 可以顺便正常做 feature”」？
  answer: Interruptions 与压力使其不现实。应补偿并允许改善 operational experience。
  source_heading: 40.20 “On-call 可以顺便正常做 feature”
